unit('u1', 1, 'plan', 'rd', 'What a dungeon is, and how to build one safely', 'History and anatomy of underground stone rooms, what makes them stand, and the safety, legal and professional frame every real project sits in.', [
  lesson('u1l1', 'Anatomy of a stone dungeon', REF.hist, [
    LS('From donjon to cellar', 'The word comes from the French **donjon**, the keep of a castle. The vaulted prisons and stores under keeps gave “dungeon” its modern meaning: **a subterranean complex of stone rooms**. The same structure underlies wine cellars, crypts, undercrofts, cisterns, ice houses and bunkers. In this course a dungeon is any underground set of:\n\n| Element | What it is | What it must resist |\n|---|---|---|\n| **Rooms / chambers** | cells, stores, halls | earth pushing in, water, the load overhead |\n| **Passages** | corridors linking rooms | the same, over long lengths |\n| **Stairs and ramps** | vertical circulation | wear, water running down them |\n| **Vaults or slabs** | the ceiling | soil, buildings and people above |\n| **Walls** | sides, partitions | earth pressure, water pressure, vault thrust |\n| **Footings** | the base of the walls | crushing the ground below |\n| **Drains, vents** | services | water and stale air, the two things that kill underground rooms |\n\nEvery decision in the course comes back to one question: **where does each force go, and is what receives it strong enough?**'),
    LS('Why stone and lime work underground', 'Stone is enormously strong in **compression** (a granite cube can carry 100–250 MPa, a 25 km column of itself) and weak in **tension** (a few MPa, and unreliable because of flaws). Mortar joints carry almost no tension at all. So stone structures stand by **shape**, not by gluing: arches and vaults are curved so that the load travels through them as pure compression.\n\nUnderground this suits stone perfectly. The surrounding earth pushes *inward*, adding compression; the weight of soil on a vault is a steady, predictable load; temperature barely changes, so there is little thermal movement. What goes wrong is almost always **water** (pressure, frost at the entrance, salts, rot of timber) or **movement of the ground** (settlement, poor footings, excavating next to something).', DG('0 0 420 170', '<rect x="20" y="20" width="380" height="140" class="g"/><path d="M80 150 L80 90 A70 70 0 0 1 220 90 L220 150" class="f"/><path d="M230 150 L230 105 A55 55 0 0 1 340 105 L340 150" class="f"/><rect x="60" y="150" width="300" height="10" class="o"/><path d="M150 30 L150 60 M140 50 L150 60 L160 50" class="b"/><path d="M30 110 L70 110 M60 100 L70 110 L60 120" class="b"/><path d="M390 110 L350 110 M360 100 L350 110 L360 120" class="b"/><text x="120" y="45" class="t">soil load</text><text x="28" y="100" class="t">earth push</text><text x="110" y="130" class="t">vaulted room</text><text x="250" y="140" class="t">passage</text><text x="160" y="168" class="t">footings</text>', 'A two-chamber dungeon section: soil loads the vaults from above and pushes on the walls from the sides; footings spread it all into the ground.')),
    MC('Why are stone ceilings underground usually curved (vaulted)?', ['So the load travels through the stone in compression, which stone resists well', 'Because flat stone is too heavy to lift', 'For decoration only', 'So water runs off the inside'], 'Stone and mortar are strong in compression and weak in tension. A flat stone slab spanning a room bends, putting its underside in tension; a vault of the right shape carries the same load in compression.', 'Stone is strong one way, weak the other.'),
    MA('Match the element to what it mainly resists.', [['vault', 'soil and loads from above'], ['cellar wall', 'sideways earth and water pressure'], ['footing', 'crushing the ground below'], ['drain', 'water building up pressure']], 'Each element is a link in a load path or a water path.'),
    TF('Most failures of underground masonry come from water or ground movement rather than crushed stone.', true, 'Stone is rarely overstressed in compression; water pressure, frost, salts, settlement and undermining cause most damage.', 'What is stone good at?')
  ]),
  lesson('u1l2', 'Safety, law and the professional frame', REF.safe, [
    LS('This course and the real world', 'Read this carefully, because it shapes everything else:\n\n1. **This app teaches the engineering method thoroughly** — how to calculate loads, earth pressure, bearing, thrust and stability — so you can understand, check and discuss a design.\n2. **A real underground structure must be designed or checked and signed off by a qualified structural/geotechnical engineer**, built to your **local building code**, with the **permits** your council or authority requires. In Queensland, for example, that means building approval under the Building Act 1975 and the National Construction Code; elsewhere, the local equivalent.\n3. Simplified course methods use typical values. Real soils vary metre by metre; a **site investigation** (boreholes, trial pits, lab tests) sets the real numbers.\n4. **Excavation is one of the deadliest jobs in construction.** A cubic metre of soil weighs 1.6–2 tonnes; a trench wall collapsing on a person kills or traps them in seconds, even at waist depth.\n\nThe point of learning the engineering is not to skip the engineer. It is to know *why* their answer is what it is, and to spot nonsense.'),
    LS('The hazards underground', 'Plan for each of these before a spade goes in:\n\n| Hazard | Control |\n|---|---|\n| **Collapse of excavation sides** | batter, bench or shore anything over ~1.2–1.5 m (check your jurisdiction); inspect daily and after rain |\n| **Undermining neighbours** | keep the zone of influence clear (a line ~45° down from existing footings); underpin in sequenced bays to an engineer’s design |\n| **Buried services** | dial-before-you-dig (in Australia: Before You Dig Australia, 1100); hand-dig near marked services |\n| **Bad air** | test O₂ (19.5–23.5 %), CO₂, CO, H₂S, methane, radon; mechanical ventilation; confined-space entry permits |\n| **Flooding** | dewater and drain; know the water table; never work in a filling trench |\n| **Falling objects, plant** | spoil back from the edge, edge protection, exclusion zones, ladders tied off |\n| **Dust (silica)** | wet cutting, extraction, P2/P3 respirators — sandstone and granite dust cause silicosis |\n| **Manual handling** | stones of 25–100 kg: lifting aids, two-person lifts, mechanical handling |\n\nNone of these are optional. They are why codes exist.'),
    MC('Silica dust from cutting sandstone and granite mainly causes…', ['silicosis, a permanent lung disease', 'skin rashes only', 'eye strain', 'nothing if outdoors'], 'Respirable crystalline silica scars the lungs irreversibly. Cut wet, extract, and wear a fitted P2/P3 respirator.', 'It is a respiratory hazard.'),
    GM('safeq'), GM('safeq'),
    TF('Learning the engineering in this course replaces the need for an engineer on a real project.', false, 'It lets you understand and check a design. Codes, permits and professional sign-off are still required, and site investigation sets the real parameters.', 'Re-read point 2.')
  ]),
  lesson('u1l3', 'A short history of building underground', REF.hist, [
    LS('Four thousand years of vaults', 'Underground stone rooms record nearly every technique in the course:\n\n- **Corbelled chambers** (Mycenaean tholos tombs, c. 1400 BC; Newgrange, c. 3200 BC): each course oversails the one below. No centering needed; spans limited.\n- **True arches and barrel vaults** of wedge-shaped voussoirs: Mesopotamian drains, then Roman cisterns and cryptoporticus, built over timber **centering**.\n- **Groin vaults**: the Romans intersected two barrels, putting the thrust onto four corner piers.\n- **Rib vaults** (Romanesque–Gothic undercrofts): stone ribs built first, thin webs filled between, thrust gathered to piers and buttresses.\n- **Brick and stone cellars** of the 17th–19th centuries: shallow segmental vaults on thick side walls, lime mortar, often a clay puddle on top for waterproofing.\n- **Modern** basements: reinforced concrete with membranes, drained cavities and engineered drainage.\n\nMedieval masons used **geometric rules** (e.g. a wall one-quarter or one-fifth of the span). Modern analysis (Hooke, Poleni, Heyman) explains why those rules work: they keep the **thrust line** inside the masonry.'),
    OR('Order these vaulting techniques from earliest to latest in widespread use.', ['corbelled chamber', 'barrel vault on centering', 'Roman groin vault', 'Gothic rib vault', 'reinforced concrete basement'], 'Each solved a limitation of the last: span, centering, light, economy.'),
    MC('What does a corbelled vault NOT need that a true arch does?', ['centering (temporary support) during construction', 'stone', 'mortar or packing', 'foundations'], 'Each corbel course is stable as it is laid because it is held by the weight above its tail, so no falsework is needed. A true arch is unstable until the keystone is in.', 'Think about when a true arch can stand on its own.'),
    TF('Medieval proportion rules worked because they tended to keep the line of thrust inside the masonry.', true, 'Heyman showed masonry safety is mainly a matter of geometry: keep the thrust line within the section with a margin.', 'Geometry, not material strength.')
  ])
]);

unit('u2', 2, 'plan', 'rs1', 'Surveying the site: ground, rock and water', 'Before any design, find out what is under you: surveying and levels, the site investigation, rock and soil types, and the water table.', [
  lesson('u2l1', 'Surveying, levels and setting out', REF.site, [
    LS('Levels and datums', 'Every depth, fall and floor level in a dungeon refers to one **datum**: a fixed benchmark (a survey mark, or a steel pin set in concrete) given an arbitrary or real height (e.g. 100.000 m, or Australian Height Datum). Levels are carried with an optical/laser level and staff:\n\n1. Set up the level; sight the **benchmark** (backsight, BS).\n2. **Height of instrument** HI = benchmark RL + BS.\n3. Sight each point (foresight, FS). **RL = HI − FS.**\n\nWorked example: benchmark RL 100.000 m, BS 1.425 m → HI 101.425. A trial-pit bottom reads FS 3.950 → RL 97.475 m, i.e. 2.525 m below the benchmark.\n\nClose every run back on the benchmark: the misclosure tells you your error. Tolerances for setting out: ±5 mm on levels, ±10 mm on plan positions over a room.'),
    LS('Setting out on plan', 'Rooms are set out from a **baseline** with offsets:\n\n- **3-4-5 triangle**: 3 m and 4 m legs with a 5 m diagonal give a right angle (3² + 4² = 5²). Scale up (6-8-10) for accuracy.\n- **Diagonals**: a rectangle is square when both diagonals are equal. For a 4 × 3 m room each is 5 m.\n- **Profiles** (batter boards) outside the dig hold string lines for wall faces and centrelines, so marks survive excavation.\n- Record everything on a drawing: grid lines, RLs, and existing services.\n\nModern sites use a total station or GNSS; the logic is the same. Units: this course uses metres and millimetres; 1 ft = 0.3048 m exactly.'),
    NU('Benchmark RL 50.000 m, backsight 1.250 m, foresight to a floor 3.800 m. What is the floor RL (m)?', 47.45, 'HI = 50.000 + 1.250 = 51.250; RL = 51.250 − 3.800 = 47.450 m.', 'HI = RL + BS; RL = HI − FS.', { tol: 0.001 }),
    NU('A room is 6 m by 8 m. What length should each diagonal measure when it is square (m)?', 10, '√(6² + 8²) = √100 = 10 m.', 'Pythagoras.', { tol: 0.001 }),
    GM('m2ft'), GM('hexmm')
  ]),
  lesson('u2l2', 'Site investigation', REF.site, [
    LS('What a site investigation finds', 'A **site investigation** (SI) has a desk study (geological maps, old mine records, flood maps, historic use), then fieldwork:\n\n| Method | Gives | Depth |\n|---|---|---|\n| **Trial pits** (machine dug, not entered unless supported) | soil layers seen directly, groundwater ingress, samples | 3–4 m |\n| **Window sampling** | continuous cores in soil | 5–8 m |\n| **Cable percussion boreholes** + SPT | strength (SPT N blows), samples, water levels | 20–40 m |\n| **Rotary coring** | rock cores, RQD, fractures | any |\n| **Standpipes / piezometers** | long-term groundwater level and seasonal swing | as installed |\n| **Lab tests** | φ′, c′, c_u, C_c, permeability, sulphates, plasticity | — |\n\nThe rule of thumb for depth: investigate at least **1.5× the footing width below the footing**, and well below the planned floor for a basement — at least to the depth where the structure no longer changes the stress, and always to below the water table if it is near.'),
    LS('Reading a borehole log', 'A log lists layers by depth with a description in a standard order (e.g. BS 5930 / AS 1726): consistency or density, colour, soil name, inclusions, and origin — e.g. “Firm brown sandy CLAY with occasional gravel (alluvium)”.\n\nKey numbers you will use later:\n\n- **SPT N** (blows per 300 mm): sand N < 10 loose, 10–30 medium, > 30 dense; clay N ≈ c_u/5 roughly.\n- **Undrained shear strength c_u** (clay): soft < 40 kPa, firm 40–75, stiff 75–150, very stiff > 150.\n- **Water strike** and **standing level** after 20 minutes; the long-term level comes from standpipes.\n- **RQD** for rock: percentage of core in sticks ≥ 100 mm. Below 50 % the rock is badly fractured and behaves more like soil for a dungeon roof.'),
    MC('Why install a standpipe rather than relying on the water strike in a borehole?', ['Water levels need time to settle and vary by season; a standpipe records the long-term level', 'Standpipes are cheaper', 'The strike is always exact', 'To drain the site'], 'In clay, water seeps in slowly; the true level may take days. Seasonal highs are what the dungeon must resist.', 'Time and seasons.'),
    GM('presq'),
    TF('An RQD of 30 % means the rock is sound and can be treated as a strong solid roof.', false, 'Low RQD means heavily fractured rock that needs support or a lining.', 'RQD counts intact pieces.')
  ]),
  lesson('u2l3', 'Rock and soil types for digging under', REF.soil, [
    LS('Soils', 'Soils are classified by particle size and behaviour:\n\n| Soil | Particle size | Behaviour underground |\n|---|---|---|\n| **Gravel** | > 2 mm | strong, free-draining, collapses if unsupported when dry or wet |\n| **Sand** | 0.06–2 mm | strength from friction (φ′ 28–40°); runs and boils below water |\n| **Silt** | 0.002–0.06 mm | worst of both: weak, frost-susceptible, liquefies, poor drainage |\n| **Clay** | < 0.002 mm | cohesive short-term (c_u), shrinks and swells with moisture, consolidates slowly; low permeability |\n| **Made ground / fill** | any | unpredictable; never found on it without investigation |\n| **Peat** | organic | very compressible; unacceptable for footings |\n\nTwo strengths matter for clay: **short-term undrained** (c_u, during and just after digging) and **long-term drained** (c′, φ′), which is often lower and governs permanent walls.'),
    LS('Rock', 'Digging into rock can make a dungeon very stable, but rock is only as good as its discontinuities (joints, bedding, faults):\n\n- **Igneous** (granite, basalt): very strong; hard to excavate (drilling and splitting); joints can release wedges from a roof.\n- **Sedimentary** (sandstone, limestone, shale): bedded; limestones can contain **solution cavities** (karst) and shales slake (crumble) when wetted and dried.\n- **Metamorphic** (slate, schist): cleaves; strong along some directions, weak along others.\n- **Weathered** zones near the surface grade from soil to rock: treat the upper metres as soil.\n\nIn rock, consider leaving the excavated rock as walls (lined or not) and only building vaults where needed. Key unit weights: rock 24–27 kN/m³; soils 17–20 kN/m³.'),
    MA('Match each ground type to its main underground problem.', [['sand below water', 'running / boiling into the dig'], ['clay', 'shrink–swell and slow settlement'], ['karst limestone', 'hidden cavities'], ['peat', 'very high compressibility']], 'Know the failure mode before you dig.'),
    GM('unitwt'),
    MC('Which strength usually governs a permanent cellar wall in clay?', ['the long-term drained strength (c′, φ′)', 'the undrained strength c_u only', 'the SPT of the topsoil', 'the stone strength'], 'Over years, pore pressures equalise and the drained strength — often lower in terms of support — governs earth pressure.', 'Short-term vs long-term.')
  ]),
  lesson('u2l4', 'The water table and groundwater', REF.damp, [
    LS('Water in the ground', 'Below the **water table** every pore is full of water at a pressure equal to γw × depth below the table (9.81 kPa per metre). Above it, capillary rise wets fine soils upward (centimetres in gravel, metres in clay or silt). The table moves with seasons and rainfall and can **perch** on a clay layer high above the main table.\n\nConsequences for a dungeon whose floor is below the water table:\n\n1. **Hydrostatic pressure on walls** — ½γw h² per metre, which often exceeds the earth thrust.\n2. **Uplift on the floor** — 9.81 kPa per metre of head; a 2 m head is ~20 kPa, more than a 0.3 m slab weighs (≈ 7 kPa).\n3. **Seepage** through joints, bringing salts and fines.\n4. **Excavation instability** — sand boils, base heave.\n\nThe cheapest dungeon is one **above** the highest seasonal water table, or one drained so the water table can never rise around it.'),
    LS('Worked example: hydrostatic loads', '**Brief**: a cellar floor 3.0 m below ground; the winter water table is 1.0 m below ground. Head at the floor h = 2.0 m.\n\n1. Water pressure at the base of the wall: p = 9.81 × 2.0 = **19.62 kPa**.\n2. Water force per metre of wall: ½ × 9.81 × 2.0² = **19.62 kN/m**, acting 2.0/3 = 0.67 m above the floor.\n3. Uplift on a 4 × 5 m floor: 19.62 kPa × 20 m² = **392 kN** (about 40 tonnes).\n4. A 0.25 m concrete slab weighs 24 × 0.25 = 6 kPa — far less than 19.62. Either drain (relief drainage, sump and pump), make it heavy, tie it down, or **design the whole box as a tank** to BS 8102 Grade 3.\n\nReproduce these numbers yourself before moving on — the generator below gives you fresh cases.'),
    GM('hydroq'), GM('upliftq'),
    NU('Head of water at a floor is 1.5 m. What is the uplift pressure (kPa, 2 dp)?', 14.72, '9.81 × 1.5 = 14.715 ≈ 14.72 kPa.', 'p = γw·h.', { tol: 0.01 }),
    TF('A perched water table can sit well above the regional water table, on top of a clay layer.', true, 'Clay layers trap infiltrating water; trial pits often find it.', 'Water sits on impermeable layers.')
  ])
]);

unit('u3', 3, 'plan', 'op', 'Layout, circulation and defence', 'Arranging rooms, passages and stairs so the dungeon is buildable, structurally sensible, dry, well-aired and — if you want it — defensible.', [
  lesson('u3l1', 'Planning rooms that suit stone', REF.hist, [
    LS('Spans, grids and proportion', 'Stone construction rewards **short spans and repeated bays**:\n\n- Keep vaulted spans modest: **2–4 m** for cellars and cells, **4–6 m** for halls; beyond ~6 m use piers to break the room into bays (groin or rib vaults).\n- Put **walls over walls**: rooms on a grid so walls and piers line up and load paths go straight down.\n- **Long thin rooms** suit barrel vaults (thrust only on the long walls); **square bays** suit groin and rib vaults (thrust to corners).\n- Make adjoining vaults the same span and springing height so their thrusts **balance** across shared walls. An unbalanced end wall needs buttressing.\n- Headroom: 2.1 m minimum to the lowest point, 2.4 m+ in rooms; the vault’s rise is extra.\n\nA convenient planning module is the wall thickness plus span; e.g. 0.6 m walls with 3.0 m spans give a 3.6 m grid.'),
    LS('Depth and cover', 'Decide the **cover** (soil depth over the vault crown). More cover means more load, but also more stability, insulation and frost protection:\n\n| Cover | Load (at ~18 kN/m³) | Notes |\n|---|---|---|\n| 0.5 m | 9 kPa | minimum for frost and planting; little stabilising weight |\n| 1.0 m | 18 kPa | typical cellar |\n| 2.0 m | 36 kPa | heavy; thick vaults and abutments |\n\nAdd any surcharge on top: a garden (~1–2 kPa), a vehicle (10+ kPa, plus impact), or a building above (from its own calcs). The **floor level** then follows: ground RL − cover − vault rise − headroom − floor build-up.'),
    MC('Why plan adjoining vaults with the same span and springing height?', ['Their horizontal thrusts balance across the shared wall', 'It looks tidier', 'It uses less mortar', 'Stone only comes in one size'], 'Equal and opposite thrusts cancel on the central wall, which then only carries vertical load; the outer walls still need abutment.', 'Think about the horizontal forces on the middle wall.'),
    NU('Ground RL 100.00 m. Cover 1.0 m, vault thickness 0.3 m, rise 1.5 m, wall height to springing 1.8 m, floor build-up 0.15 m. Finished floor RL (m)?', 95.25, '100.00 − 1.0 − 0.3 − 1.5 − 1.8 − 0.15 = 95.25 m.', 'Subtract each layer from the ground level down.', { tol: 0.001 }),
    TF('Long barrel-vaulted rooms push mainly on their long side walls.', true, 'A barrel thrusts perpendicular to its axis along its whole length.', 'Draw the arch section.')
  ]),
  lesson('u3l2', 'Corridors, stairs and circulation', REF.hist, [
    LS('Circulation', 'Plan movement as carefully as rooms:\n\n- **Corridor width**: 0.9 m minimum; 1.2 m to pass with a load; 1.5 m+ for two people passing.\n- **Stairs**: straight flights of ≤ 16 risers with landings; rise 150–190 mm and going ≥ 250 mm, with **2R + G ≈ 600–630 mm** (Blondel). Spiral (newel) stairs save space but have narrow goings at the newel.\n- **Two ways out** wherever people might be — a fire or collapse at one stair must not trap them. Codes require it for habitable basements.\n- **Fall**: corridors and floors fall gently (1:80–1:100) toward floor gullies or a sump; stairs from outside need a drain at the foot and a cover or upstand at the top.\n- **Air**: route corridors to make a through-draught: high outlet at one end, low inlet at the other.'),
    LS('Defence-minded layout (as design history)', 'Castle builders designed circulation to control movement; the same ideas make a dungeon secure or simply interesting:\n\n| Feature | Purpose |\n|---|---|\n| **Bent (dog-leg) entrance** | no straight line of sight or rush |\n| **Spiral stair turning clockwise going up** | traditionally said to favour a right-handed defender above (debated by historians) |\n| **Narrow doors, thick reveals, drawbar slots** | a door barred from inside |\n| **Murder holes / meurtrières, arrow loops** | covering an entrance (today: vents and light wells) |\n| **Single controlled entry, cells off a passage** | supervision |\n\nModern equivalents are lockable doors and good escape routes. **Do not** build anything to confine people: holding anyone against their will is a serious crime. Treat this as castle history and secure storage design.'),
    GM('stairq'),
    MC('What is the main safety reason for a second exit from a habitable underground space?', ['If one route is blocked by fire, smoke, water or collapse, occupants can still escape', 'Better ventilation only', 'To speed deliveries', 'It is cheaper'], 'Dead-end basements trap people; codes require alternative escape routes or escape windows/hatches for habitable rooms.', 'Think emergencies.'),
    NU('A stair has a rise of 180 mm. Using 2R + G = 630 mm, what going (mm)?', 270, '630 − 2 × 180 = 270 mm.', 'G = 630 − 2R.', { tol: 0.5 })
  ]),
  lesson('u3l3', 'Drawing the plan and section', REF.hist, [
    LS('Drawings that build', 'A buildable dungeon needs at least:\n\n1. **Plan** at floor level (1:50): wall thicknesses, room sizes, door positions, piers, drains and falls, stair direction, vents.\n2. **Reflected ceiling plan**: vault types, springing lines, rib layout.\n3. **Sections** through every room (1:50 or 1:20): ground level, cover, vault thickness and rise, springing, wall heights, footing, floor build-up, drains, waterproofing, water table.\n4. **Details** (1:10 or 1:5): footing and DPC, vault haunch and waterproofing, door head and lintel, vent sleeve, drain.\n5. **Calculations** keyed to the drawings (this course teaches them).\n6. **Specification**: stone, mortar, cure times, tolerances, sequence.\n\nThe capstone at the end asks you to produce each of these for a three-room dungeon.'),
    OR('Order the design steps.', ['site investigation', 'room layout and section', 'loads and soil parameters', 'calculations for walls, vaults, footings', 'details and specification', 'professional review and permit'], 'Ground first, then shape, then numbers, then detail, then sign-off.'),
    TF('A reflected ceiling plan shows the vaults as if seen in a mirror on the floor.', true, 'It shows ceilings in the same orientation as the plan.', 'Reflected = mirrored onto the plan.'),
    MC('Which drawing shows the water table, cover and footing depth together?', ['a section', 'the plan', 'the reflected ceiling plan', 'the specification'], 'Only a vertical section shows depths and levels.', 'Vertical information.')
  ])
]);
})();

/* ---- lern2dungeon/l02.js — Part 2: stone and mortar (Units 4–6) ---- */
(function () {
const { REF, LS, MC, TF, MA, OR, NU, unit, lesson, DG } = CG.H;
const GM = id => GEN.make(id);

unit('u4', 4, 'mat', 'rs1', 'Building stones', 'The four workhorse stones — limestone, sandstone, granite and slate — what they are made of, how strong and durable they are, and where each belongs in a dungeon.', [
  lesson('u4l1', 'How stone forms, and why it matters', REF.stone, [
    LS('Three families', '| Family | Forms by | Examples | Key property |\n|---|---|---|---|\n| **Igneous** | cooling magma | granite, basalt, dolerite | interlocking crystals: strong, dense, low porosity |\n| **Sedimentary** | grains or shells laid in beds, cemented | sandstone, limestone | **bedding planes**; porosity 2–30 %; carves well |\n| **Metamorphic** | heat and pressure on older rock | slate, marble, quartzite | slate: **cleavage** planes; very low porosity |\n\nTwo things decide how a stone behaves in a wall: **what holds the grains together** (silica cement is durable, clay or iron cement weaker, calcite dissolves slowly in acid water) and **the pore structure** (many fine pores draw water up and suffer frost and salt damage; fewer, larger pores drain).'),
    LS('Bedding: the single most important laying rule', 'Sedimentary stone must be laid **on its natural bed** — bedding planes horizontal, as it formed in the quarry. Load then presses the layers together.\n\nIf **face-bedded** (planes vertical and parallel to the wall face), water and salts get between the layers and the face peels off in sheets (*contour scaling*, *delamination*). If **edge-bedded** (planes vertical, perpendicular to the face) it is acceptable only in some arches and copings.\n\nExceptions: in an **arch**, voussoirs are bedded with the planes **radial** — perpendicular to the thrust — so the thrust still presses across the beds. Mark the bed on every block at the quarry with an arrow.', DG('0 0 420 120', '<rect x="20" y="20" width="110" height="70" class="g"/><path d="M20 35 H130 M20 50 H130 M20 65 H130 M20 80 H130" class="o"/><text x="25" y="108" class="t">natural bed ✓</text><rect x="160" y="20" width="110" height="70" class="g"/><path d="M175 20 V90 M190 20 V90 M205 20 V90 M220 20 V90 M235 20 V90 M250 20 V90" class="o"/><text x="165" y="108" class="t">face/edge-bedded ✗</text><path d="M300 90 A60 60 0 0 1 400 90" class="o"/><path d="M350 30 L350 50 M320 40 L330 55 M380 40 L370 55" class="b"/><text x="300" y="108" class="t">voussoir: beds radial</text>', 'Bedding planes horizontal in walling; radial in arches.')),
    MC('In a voussoir, bedding planes should be…', ['radial, perpendicular to the thrust through the arch', 'parallel to the arch face', 'horizontal regardless of position', 'random'], 'Thrust then compresses across the beds, as in a wall.', 'Which way does the thrust run in an arch?'),
    TF('Face-bedded sandstone tends to delaminate in sheets when wetted, salted and frozen.', true, 'Water and salts open the bedding planes parallel to the face.', 'Bedding planes are weaknesses.'),
    GM('stoneq')
  ]),
  lesson('u4l2', 'Limestone, sandstone, granite and slate compared', REF.stone, [
    LS('The four stones', '| Stone | ρ (kg/m³) | f_c (MPa) | Absorption | Character |\n|---|---|---|---|---|\n| **Limestone** | 2200–2600 | 20–180 (oolitic ~30–60) | 2–10 % | calcite; freestones (Bath, Portland) carve to fine detail; dissolves slowly in acid water; best for ashlar, ribs, voussoirs where moderately dry |\n| **Sandstone** | 2100–2500 | 20–170 | 2–12 % | quartz grains; durability depends on cement; some beds weak, some (siliceous) superb; good walling and arches |\n| **Granite** | 2600–2750 | 100–250 | 0.1–0.5 % | very hard and durable; costly to dress; best for footings, plinths, steps, thresholds, wet bases, sills |\n| **Slate** | 2700–2900 | 100–200 | < 0.4 % | splits thin; impermeable; ideal **damp-proof courses**, shelves, floor flags, copings, short lintels |\n\nUnderground, place the densest stone where water is worst: **granite or slate at the base** (and for any DPC), limestone or sandstone above in the drier body of the walls and vaults.'),
    LS('Choosing for the job', 'A checklist for each location:\n\n1. **Load**: compressive stress in dungeon walls is rarely above 1–2 MPa — almost any sound building stone is strong enough. Strength is seldom the decider.\n2. **Water and frost exposure**: entrance stairs and light wells freeze; floors and footings stay wet. Choose low absorption, frost-tested stone (EN 12371).\n3. **Salt exposure**: near de-icing salt or seawater, avoid porous limestones.\n4. **Workability**: ribs and mouldings need a freestone that cuts in any direction.\n5. **Compatibility**: don’t pair a porous limestone with a wet granite base without a slate DPC; don’t put limestone directly above sandstone in wet places (calcium salts from limestone can attack the sandstone).\n6. **Local supply**: local stone usually weathers best in its own climate and costs far less to haul (stone is ~2.5 t/m³).'),
    GM('tonnage'), GM('stoneq'),
    MA('Match the stone to its best dungeon job.', [['granite', 'footings, steps and thresholds'], ['slate', 'damp-proof course'], ['oolitic limestone', 'carved ribs and voussoirs'], ['siliceous sandstone', 'general walling and arches']], 'Put the right stone where its strengths count.'),
    NU('A dungeon wall carries 120 kN per metre on a 0.6 m thickness. What is the average compressive stress (MPa)?', 0.2, '120 kN / (0.6 m × 1 m) = 200 kPa = 0.2 MPa — far below the strength of any building stone.', 'Stress = force ÷ area; 1 MPa = 1000 kPa.', { tol: 0.001 })
  ]),
  lesson('u4l3', 'Testing stone', REF.stone, [
    LS('Lab and field tests', '| Test | Standard | What it tells you |\n|---|---|---|\n| Compressive strength | EN 1926 | crushing stress, dry and saturated |\n| Flexural strength | EN 12372 | bending strength for lintels, slabs (often only 5–15 % of compressive) |\n| Water absorption at atmospheric pressure | EN 13755 | porosity proxy |\n| Saturation coefficient | — | absorbed (48 h) ÷ max (vacuum); > 0.8 suggests frost risk |\n| Frost resistance | EN 12371 | cycles of freeze–thaw |\n| Salt crystallisation | EN 12370 | sodium sulphate cycles: durability against salts |\n| Density, open porosity | EN 1936 | weight and pore volume |\n\nIn the field: ring (a sound stone rings when struck; a cracked one thuds), scratch (calcite scratches with steel, quartz does not), acid (dilute HCl fizzes on limestone), and **look at old buildings** made of the same bed.'),
    MC('A stone’s flexural strength is typically what fraction of its compressive strength?', ['about 5–15 %', 'about the same', 'double', 'zero'], 'Stone is brittle; bending puts one face in tension, where flaws govern. That is why stone lintels are short and deep.', 'Stone is weak in tension.'),
    TF('Dilute hydrochloric acid fizzing on a stone shows it contains calcite (limestone or marble).', true, 'CaCO₃ + 2HCl → CaCl₂ + H₂O + CO₂.', 'Carbonates fizz.'),
    NU('A stone absorbs 4.2 % by weight in 48 h and 5.0 % under vacuum. What is the saturation coefficient (2 dp)?', 0.84, '4.2 ÷ 5.0 = 0.84 — above 0.8, so frost risk where it stays wet.', 'Absorbed ÷ maximum.', { tol: 0.005 })
  ])

unit('u5', 5, 'mat', 'op', 'Mortars: lime, hydraulic lime and cement', 'How each binder sets, how strong and permeable it is, how to mix and use it, and the rule that the joint is sacrificial.', [
  lesson('u5l1', 'The lime cycle', REF.mortar, [
    LS('From limestone to mortar and back', 'Lime mortar is limestone taken apart and put back together:\n\n1. **Burn**: CaCO₃ → CaO + CO₂ at ~900 °C (quicklime).\n2. **Slake**: CaO + H₂O → Ca(OH)₂ + heat (hydrated lime; with excess water, **lime putty**).\n3. **Carbonate**: Ca(OH)₂ + CO₂ → CaCO₃ + H₂O — the mortar slowly turns back into limestone, from the surface inward, over months.\n\nPure (**air**, or **fat**) lime (CL90) sets only by carbonation, so it needs air: it hardens poorly in thick walls or saturated ground.\n\n**Hydraulic** limes are burned from limestones containing clay. The silica and alumina form calcium silicates that set by reacting with **water**, like a weak cement. Graded by strength at 28 days (EN 459-1): **NHL 2, NHL 3.5, NHL 5** (MPa, minimum).'),
    LS('Quicklime and putty safety', 'Quicklime reacts violently with water (boiling, spitting, > 150 °C locally) and is caustic. Lime putty and wet lime mortar are alkaline (pH ~12.5) and burn eyes and skin:\n\n- **Goggles are not optional** — lime in the eye is a medical emergency. Keep an eyewash bottle on site.\n- Gloves and long sleeves; barrier cream.\n- Slake quicklime only with training, in a suitable tub, with no children or pets about.\n- Store putty covered with water; it improves with age (months).'),
    OR('Order the lime cycle.', ['limestone CaCO₃', 'burn to quicklime CaO', 'slake to Ca(OH)₂', 'mix with sand and lay', 'carbonate back to CaCO₃'], 'The cycle closes as the mortar absorbs CO₂.'),
    GM('mortarq'),
    TF('A CL90 fat lime mortar will harden well deep inside a saturated, airless wall.', false, 'Carbonation needs CO₂ from the air; use a hydraulic lime where it is wet and airless.', 'How does air lime set?')
  ]),
  lesson('u5l2', 'Choosing a mortar', REF.mortar, [
    LS('The sacrificial joint', 'The governing rule: **the mortar should be weaker and more vapour-permeable than the stone it bonds.** Then:\n\n- Small movements (settlement, thermal, moisture) crack the **joint**, which is cheap to repoint, not the stone.\n- Moisture and salts evaporate through the **joint**, so salts crystallise there, not in the stone face.\n\nCement-rich mortars break this rule: they are stiffer, stronger and less permeable than most limestones and sandstones, so water evaporates through the stone beside them, and the stone decays first.\n\n| Binder | f_c 28 d (MPa) | Use underground |\n|---|---|---|\n| CL90 putty 1:3 | ~0.5–1 | dry, sheltered interior work; pointing soft stone |\n| NHL 2 1:2.5–3 | ~1–2 | soft stone, dry to slightly damp |\n| NHL 3.5 1:2.5 | ~2–3.5 | **default for most dungeon walls and vaults** |\n| NHL 5 1:2–2.5 | ~3–5 | wet, saturated, footings, below water table, hard stone |\n| 1:2:9 cement:lime:sand | ~2–3 | new work where a cement-gauged mix is specified |\n| 1:1:6 cement:lime:sand | ~4–6 | new hard-stone work, engineered masonry |\n| 1:3 cement:sand | 10–20 | **avoid** with stone; only for concrete, renders on blockwork, specialist cases |'),
    LS('The selector logic used in the lab', 'The mortar selector in the labs follows these steps:\n\n1. Start from **exposure**: dry → NHL 2; damp → NHL 3.5; wet/saturated → NHL 5.\n2. If the work is **historic/repair** and dry, and the stone is not very hard (f_c < 80 MPa), use **fat lime putty**.\n3. If the stone is **weak** (f_c < 40 MPa), never go above NHL 3.5.\n4. For **new work in granite or slate in wet conditions**, a 1:1:6 cement-lime is acceptable, because those stones are far stronger and less permeable than the mortar anyway.\n5. Sand: sharp, well-graded, washed, 0.075–4 mm; for pointing ≤ 2 mm. Ratio by **volume** binder : sand ≈ 1 : (void ratio of the sand ≈ 2.5–3).\n\nThe lab shows you the rule it applied, so you can check it by hand.'),
    GM('mortarq'), GM('mortarq'),
    MC('A soft limestone (f_c 30 MPa) in a wet cellar footing. Which binder fits the rules?', ['NHL 3.5 — capped because the stone is weak', 'NHL 5', '1:3 cement', 'CL90 putty'], 'Wet suggests NHL 5, but rule 3 caps the mortar at NHL 3.5 to stay weaker than a 30 MPa stone; drain the footing well.', 'Rule 3.')
  ]),
  lesson('u5l3', 'Mixing, laying and curing', REF.mortar, [
    LS('Batching and quantities', 'Mix **by volume** using gauge boxes or buckets, never by shovels. Dry materials shrink in volume when mixed with water (the fines fill the sand’s voids), so you need about **1.3 m³ of dry materials per 1 m³ of wet mortar**.\n\n**Worked example**: 2 m³ wet mortar at 1:3.\n1. Dry volume = 2 × 1.3 = 2.6 m³.\n2. Binder = 2.6 ÷ (1 + 3) = 0.65 m³; sand = 1.95 m³.\n3. Binder mass (≈ 700 kg/m³ loose) = 455 kg → ÷ 25 kg = 18.2 → **19 bags**.\n4. Sand (≈ 1600 kg/m³) = 3.12 t.\n\nMix NHL mortars in a paddle or drum mixer 15–20 minutes; they improve with mixing. Use within ~2–4 hours; do not re-temper hydraulic mortar after it begins to set.'),
    LS('Curing', 'Lime mortar fails when it dries too fast or freezes young:\n\n- **Damp the stone** before laying (not running wet) so it does not suck water from the mortar.\n- Protect from sun, wind and rain with damp hessian and sheeting for **at least 3–7 days**; mist as needed.\n- **No frost** for at least a week (NHL) or until carbonated (CL90) — frost destroys wet lime mortar. Do not build below +5 °C.\n- Underground, the problem is often the opposite: saturated, airless conditions. Ventilate so the work can slowly dry and (for air lime) carbonate.\n- Strength grows over months: the **centering under a vault** must stay until the mortar can carry the thrust (Unit 17).'),
    GM('mixq'), GM('mixq'),
    TF('Mortar dry materials are about 1.3 times the volume of the wet mortar they make.', true, 'Fines and binder fill the voids between sand grains.', 'Remember the factor.'),
    MC('What is the main risk to fresh lime mortar laid in winter?', ['frost destroying it before it sets', 'setting too fast', 'turning blue', 'too much strength'], 'Ice expands in the wet mortar and breaks its young structure. Protect and do not lay below 5 °C.', 'Water expands on freezing.')
  ])
]);

unit('u6', 6, 'mat', 'f7', 'Quarrying, dressing and tools', 'Getting stone out of the ground, shaping it into rubble, squared and ashlar blocks and voussoirs, and the tools and templates used.', [
  lesson('u6l1', 'Quarrying', REF.stone, [
    LS('Getting blocks out', 'Stone is extracted along its natural weaknesses:\n\n- **Plug and feathers**: drill a line of holes 75–150 mm apart; insert two half-round feathers and a wedge (plug) in each; tap them in turn until the block splits. Works in granite and sandstone.\n- **Channelling and wire saws**: diamond wire saws cut limestone and marble blocks from the bench.\n- **Bed and joint**: quarrymen use the bedding and joints to free blocks with bars; the bed is marked on each block.\n- **Blasting** produces rubble and damages blocks with micro-cracks; avoid for dimension stone.\n\nAllow freshly quarried limestone to **season** (dry out its quarry sap) before carving or exposure to frost, commonly a season.\n\nFor a dungeon you will usually **buy** stone: rough block, sawn six sides, or walling rubble by the tonne. Ask the quarry for test data, bed marks and the source bed.'),
    MC('In plug-and-feathers splitting, what does the plug do?', ['It is the wedge driven between two feathers to spread them and split the rock', 'It seals the hole against water', 'It measures depth', 'It is the drill bit'], 'The feathers line the hole; driving the plug between them produces large splitting forces.', 'Wedge action.'),
    TF('Blasting is the best way to quarry fine ashlar blocks.', false, 'Blasting micro-cracks stone; dimension stone is split, sawn or wire-cut.', 'Damage.'),
    GM('stoneq')
  ]),
  lesson('u6l2', 'Dressing stone: rubble to ashlar', REF.stone, [
    LS('Grades of finish', '| Grade | Description | Joints |\n|---|---|---|\n| **Random rubble** | stones as found or roughly knocked into shape | 10–30 mm, irregular |\n| **Squared rubble** | stones squared with a hammer, laid in rough courses | 10–20 mm |\n| **Coursed rubble** | squared stones in level courses of constant height | 10–15 mm |\n| **Ashlar** | sawn or finely dressed blocks, true faces and arrises | 3–6 mm |\n\nDressing sequence for a squared block: (1) **pitch** off the waste with a pitching tool; (2) work a **draft** (a flat margin) around one edge with a chisel; (3) work drafts on the other edges, sighting with **winding sticks** so the face is not twisted; (4) remove the middle (**boast**, point, claw); (5) finish (tooled, rubbed, bush-hammered) and square the beds and joints with a square and **templates**.'),
    LS('Hand tools and machines', '| Tool | Use |\n|---|---|\n| lump/club hammer (1–2 kg), dummy/mallet | striking tools |\n| pitching tool | knock off large waste along a line |\n| point | rough removal |\n| claw chisel | levels the surface after the point |\n| boaster / bolster | wide chisel for dressing faces |\n| drag/comb | finishing soft stone |\n| bush hammer | textured granite faces |\n| banker | heavy bench at waist height |\n| square, straightedge, winding sticks, templates | accuracy |\n| angle grinder / saw with diamond blade | cutting — **wet, with extraction and RPE** |\n| block splitter / guillotine | splitting walling stone |\n| lifting: shear legs, chain block, lewis pins, stone tongs | heavy blocks |\n\nTungsten-tipped chisels are used for granite and hard sandstone; carbon steel for limestone.'),
    OR('Order the steps to dress a squared face.', ['pitch off the waste', 'work a draft on one edge', 'drafts around the other edges, checked with winding sticks', 'remove the middle with point and claw', 'finish the face and square the beds'], 'Drafts define a true plane before the middle is removed.'),
    MA('Match the finish to its typical joint width.', [['ashlar', '3–6 mm'], ['coursed rubble', '10–15 mm'], ['random rubble', '10–30 mm'], ['squared rubble', '10–20 mm']], 'Better dressing → thinner joints → more stone, less mortar.'),
    GM('rubbleq')
  ]),
  lesson('u6l3', 'Templates and voussoir setting-out', REF.arch, [
    LS('Full-size drawings', 'Arches and vaults are set out **full size** on a flat floor or board (the medieval **tracing floor**):\n\n1. Draw the springing line and span; find the centre(s). For a segmental arch the radius is R = (L²/4 + f²)/(2f).\n2. Draw intrados and extrados arcs (extrados radius R + d, d = ring depth).\n3. Divide the intrados into an **odd** number of equal parts so there is a central keystone; draw the joints **radially** from the centre.\n4. Make a **template** (plywood or zinc) for each different voussoir; mark bed faces and the intrados.\n5. Number the stones in setting order.\n\nWorked: span 2.0 m semicircle (R 1.0 m), target 250 mm → arc π × 1.0 = 3.142 m → 12.6 → **13 voussoirs** of 242 mm at the intrados; with d = 0.3 m the extrados width is 242 × 1.3 = 314 mm. Each subtends 180/13 = 13.85°.'),
    GM('vousq'), GM('archRq'),
    NU('A semicircular arch has 15 voussoirs. What angle does each subtend (°, 2 dp)?', 12, '180° ÷ 15 = 12.00°.', 'Semicircle = 180°.', { tol: 0.01 }),
    TF('An even number of voussoirs is preferred, so there is no keystone.', false, 'An odd number gives a central keystone; many builders insist on it, though even-numbered arches with a joint at the crown do stand.', 'Keystone.')
  ])
]);

/* ---- lern2dungeon/l03.js — Part 3: structural engineering (Units 7–10) ---- */
(function () {
const { REF, LS, MC, TF, MA, OR, NU, unit, lesson, DG } = CG.H;
const GM = id => GEN.make(id);

unit('u7', 7, 'eng', 'op', 'Statics and free-body diagrams', 'Forces, moments and equilibrium — the three equations behind every wall, arch and vault calculation — and how to draw a free-body diagram you can trust.', [
  lesson('u7l1', 'Forces, components and resultants', REF.stat, [
    LS('Forces as vectors', 'A **force** has magnitude (kN), direction and a line of action. In 2D sections we resolve every force into horizontal and vertical **components**:\n\nF_x = F cos θ, F_y = F sin θ, where θ is measured from the horizontal.\n\nAnd combine components into a **resultant**: R = √(ΣF_x² + ΣF_y²), angle = atan(ΣF_y / ΣF_x).\n\n**Worked**: an arch springing receives H = 40 kN horizontal and V = 40 kN vertical (per metre). R = √(40² + 40²) = **56.6 kN** at atan(40/40) = **45°** below horizontal. That resultant must pass into the abutment and down to the ground — the whole of arch engineering is following it.\n\nUnits: 1 kN ≈ the weight of 102 kg. A cubic metre of limestone (2400 kg) weighs 2400 × 9.81 = **23.5 kN**. We write this as unit weight γ = 23.5 kN/m³.'),
    LS('Distributed loads', 'Most dungeon loads are spread out:\n\n- **Uniform** load w (kN/m along a span, or kPa on an area). Its resultant is w × length, acting at the middle.\n- **Triangular** (earth, water): pressure grows linearly with depth from 0 to p_max. Resultant = ½ p_max × H, acting **H/3 above the base** (at the centroid of the triangle).\n- **Trapezoidal**: split into a rectangle plus a triangle.\n\nWorked: water 2 m deep: p_max = 9.81 × 2 = 19.62 kPa; resultant ½ × 19.62 × 2 = 19.62 kN/m at 0.667 m above the base.', DG('0 0 420 150', '<rect x="60" y="20" width="40" height="110" class="g"/><path d="M100 20 L100 130 L200 130 Z" class="f"/><path d="M200 130 L110 130 M120 120 L110 130 L120 140" class="b"/><path d="M220 93 L105 93 M115 85 L105 93 L115 101" class="b"/><text x="225" y="97" class="t">resultant ½pH at H/3</text><text x="150" y="146" class="t">p_max = γH</text><text x="20" y="80" class="t">wall</text>', 'Triangular pressure on a wall and its resultant at one-third height.')),
    GM('unitwt'), GM('hydroq'),
    NU('A force of 50 kN acts at 30° below horizontal. What is its vertical component (kN)?', 25, '50 × sin 30° = 25 kN.', 'F sin θ.', { tol: 0.01 }),
    NU('Resultant of H = 30 kN and V = 40 kN (kN)?', 50, '√(900 + 1600) = 50 kN.', 'Pythagoras.', { tol: 0.01 })
  ]),
  lesson('u7l2', 'Moments and equilibrium', REF.stat, [
    LS('The three equations', 'A body at rest in 2D satisfies **three** equations:\n\n1. **ΣF_x = 0** (horizontal forces balance)\n2. **ΣF_y = 0** (vertical forces balance)\n3. **ΣM = 0** about *any* point (moments balance)\n\nA **moment** is force × perpendicular distance from the point to the line of action (kN·m). Choose the point to eliminate unknowns — usually the toe of a wall, the hinge of an arch, or a support.\n\nWith three equations you can find **three** unknowns. A three-hinged arch has four support reactions but the crown hinge (zero moment) gives a fourth equation, so it is **statically determinate**. A fixed arch has more unknowns than equations (**statically indeterminate**) — which is why Heyman’s *safe theorem* (Unit 18) is so useful: you only need to find **one** thrust line inside the masonry.'),
    LS('Worked example: a cellar wall block', '**Brief**: a 1 m length of gravity wall, H = 3.0 m, t = 1.2 m, γ = 22 kN/m³, retaining dry soil that pushes P = 27 kN/m at 1.0 m above the base (you will derive P in Unit 12).\n\n1. Weight W = 22 × 3.0 × 1.2 = **79.2 kN**, acting at t/2 = 0.6 m from the toe.\n2. ΣF_x = 0 → base friction F = **27 kN** (needs μN ≥ 27 → μ ≥ 0.34).\n3. ΣF_y = 0 → base normal N = **79.2 kN**.\n4. ΣM about the toe: resisting M_r = 79.2 × 0.6 = **47.52 kNm**; overturning M_o = 27 × 1.0 = **27 kNm**.\n5. Position of N from toe: x̄ = (47.52 − 27)/79.2 = **0.259 m**. Eccentricity from the centre e = 0.6 − 0.259 = **0.341 m**.\n6. Middle third requires |e| ≤ t/6 = 0.2 m → **fails**: the heel would lift.\n7. Overturning FS = 47.52/27 = **1.76** (traditional target ≥ 2).\n\nSo an *unpropped* 1.2 m wall is not enough. Real cellar walls are **propped** at the top by the vault or floor, which changes the problem completely (Unit 15). Reproduce every line before continuing.'),
    GM('momentq'), GM('momentq'),
    NU('In the worked example, what wall thickness gives exactly FS = 2 against overturning (m, 2 dp)? Use t = √(2·FS·P/(3γ)).', 1.28, 't = √(2 × 2 × 27 / (3 × 22)) = √1.636 = 1.28 m.', 'M_r = γHt²/2 = FS × P × H/3 (H cancels when P acts at H/3).', { tol: 0.01 }),
    TF('You may take moments about any point when checking equilibrium.', true, 'If a body is in equilibrium, ΣM = 0 about every point; choose one that removes unknowns.', 'Equilibrium holds everywhere.')
  ]),
  lesson('u7l3', 'Drawing free-body diagrams', REF.stat, [
    LS('The FBD method', 'Every calculation in this course starts with a **free-body diagram**:\n\n1. **Isolate** the body: cut it free from everything it touches (a wall from the soil and footing; half an arch at the crown; one voussoir).\n2. **Draw every external force** where it acts: weights at centroids, distributed pressures with their resultants, reactions at cuts (both components if unknown), friction along contact faces.\n3. **Label** magnitudes, directions and lever arms; mark unknowns.\n4. **Choose axes and a moment point.**\n5. **Write the three equations** and solve.\n6. **Sanity-check**: signs, units, does the resultant lie within the base?\n\nCommon errors: forgetting the water pressure; putting the earth thrust at mid-height (it is at H/3 for a triangle); using the arch span instead of half-span for moments about the crown; omitting the vault’s own weight.'),
    LS('Worked: half an arch', '**Three-hinged arch**, span L = 4 m, rise f = 1 m, uniform load w = 20 kN/m along the span.\n\nFBD of the **left half**: crown hinge force H (horizontal, at height f), left support reactions H_A and V_A, load w × L/2 = 40 kN acting L/4 = 1 m from the support.\n\n- ΣF_y: V_A = **40 kN** (by symmetry the crown shear is zero).\n- ΣM about the crown hinge: V_A × 2 − 40 × 1 − H_A × 1 = 0 → H_A = **40 kN**.\n- ΣF_x: crown H = H_A = 40 kN.\n\nGeneral result: **H = wL²/(8f)** = 20 × 16 / 8 = 40 ✓. Halve the rise and the thrust doubles: flat arches push hard.'),
    OR('Order the FBD procedure.', ['isolate the body', 'draw all external forces at their points of action', 'label magnitudes and lever arms', 'choose axes and moment point', 'write and solve the equilibrium equations', 'sanity-check the result'], 'Isolate, draw, label, solve, check.'),
    GM('thrustArch'),
    MC('Where does the resultant of a triangular earth pressure act on a wall of height H?', ['H/3 above the base', 'H/2', '2H/3 above the base', 'at the top'], 'The centroid of a triangle is one-third of the height from its wide end.', 'Centroid of a triangle.')
  ])
]);

unit('u8', 8, 'eng', 'f7', 'Loads, limit states and safety factors', 'What loads a dungeon carries, how to combine them, and how modern codes and traditional factors of safety keep a structure on the safe side.', [
  lesson('u8l1', 'Dead, live, earth and water loads', REF.stat, [
    LS('Load catalogue', '| Load | Type | Typical values |\n|---|---|---|\n| **Self-weight** of stone, vaults, floors | permanent (dead), G | γ × volume: rubble masonry ≈ 21–22 kN/m³ |\n| **Cover soil** on vaults | permanent | 17–20 kN/m³ × depth |\n| **Earth pressure** on walls | permanent (but varies with movement) | ½ K γ H² |\n| **Groundwater** pressure and uplift | permanent or variable — use the **highest credible** level | 9.81 kPa/m |\n| **Imposed (live)** floor load, Q | variable | storage 2.5–7.5 kPa; domestic 1.5–2 kPa |\n| **Surcharge** at ground over or beside the dungeon | variable | garden 1.5 kPa; driveway 5–10 kPa; building above from its own calcs |\n| **Construction** loads | temporary | stacked stone on a young vault! |\n| **Seismic, flood, impact** | accidental | per local code |\n\nTake loads per metre run for walls and barrel vaults, per m² for floors.'),
    LS('Worked: loads on a vault strip', '**Barrel vault** L = 4 m, semicircular (f = 2 m), ring t = 0.3 m, sandstone ρ = 2300 kg/m³ (γ = 22.56 kN/m³), average fill 0.5 m at 18 kN/m³ (ρ 1800), garden live load 2 kPa. Per metre run:\n\n1. Arc length = πR = 2π = 6.283 m → ring weight = 22.56 × 0.3 × 6.283 = **42.53 kN**.\n2. Fill: 17.66 × 0.5 × 4 = **35.32 kN**.\n3. G_k = 77.85 kN; Q_k = 2 × 4 = **8 kN**.\n4. ULS total = 1.35 × 77.85 + 1.5 × 8 = **117.09 kN** → w_d = 29.27 kN/m of span.\n\nThe vault span calculator in the labs reproduces these lines.'),
    GM('uls'), GM('unitwt'),
    MC('Which water level should you design a cellar wall for?', ['the highest credible level, including floods and burst mains', 'the level on the day of the borehole', 'the average level', 'zero, because of drains'], 'BS 8102 requires a conservative design water level; drains can block.', 'Be pessimistic.')
  ]),
  lesson('u8l2', 'Limit-state design', REF.stat, [
    LS('Two kinds of limit', 'Modern codes (Eurocodes, AS/NZS, ASCE) check two families of **limit state**:\n\n- **Ultimate (ULS)**: collapse, overturning, sliding, crushing, bearing failure, uplift. Use **factored** loads and **reduced** strengths.\n- **Serviceability (SLS)**: cracking, settlement, deflection, leaks. Use **unfactored** (characteristic) loads.\n\nDesign check: **E_d ≤ R_d** — design effect ≤ design resistance.\n\n| Factor | Typical value (EN 1990/1997) |\n|---|---|\n| γ_G unfavourable / favourable | 1.35 / 1.0 (STR), 1.1 / 0.9 (EQU) |\n| γ_Q | 1.5 (0 if favourable) |\n| γ_M masonry | 2.0–3.0 |\n| γ_φ on tan φ′ (DA1-C2) | 1.25 |\n| γ_R bearing / sliding | 1.4 / 1.1 (DA2) |\n\nUse the national annex and local code values in real work. This course uses the values above for teaching.'),
    LS('Worked: overturning at EQU', 'Return to the 1.2 m wall (M_r = 47.52, M_o = 27 kNm).\n\n- Stabilising (favourable permanent ×0.9): 0.9 × 47.52 = **42.77 kNm**.\n- Destabilising (unfavourable permanent ×1.1): 1.1 × 27 = **29.70 kNm**.\n- 42.77 ≥ 29.70 → passes EQU.\n\nThe traditional **global factor of safety** was M_r/M_o = 1.76 against a target of 2.0 → fails. Different methods, different answers: the code method also requires separate checks of bearing, sliding and the base pressure (the middle-third failure we found). Always check **every** limit state.'),
    GM('uls'),
    MA('Match each check to its limit state.', [['overturning', 'ULS (EQU)'], ['crack width', 'SLS (appearance and leaks)'], ['bearing failure', 'ULS (GEO)'], ['long-term settlement', 'SLS (deformation)']], 'Collapse vs usability.'),
    TF('At ULS, the self-weight of a wall that resists overturning is multiplied by a factor below 1.', true, 'A favourable permanent action is reduced (0.9) so you do not rely on more weight than you have.', 'Favourable vs unfavourable.')
  ]),
  lesson('u8l3', 'Factors of safety in masonry', REF.arch, [
    LS('Why masonry is different', 'Stone vaults almost never fail by **crushing**: stresses are 1–2 % of the stone’s strength. They fail by becoming **mechanisms**: hinges open at joints until the structure folds. So masonry safety is about **geometry**:\n\n- **Geometric factor of safety** (Heyman): the ratio of the actual arch thickness to the minimum thickness that could just contain a thrust line. Medieval vaults have 2–3; aim for ≥ 2 in new work.\n- **Middle-third rule**: if the thrust line stays within the middle third of every joint, no joint goes into tension.\n- **Friction**: slip between voussoirs is prevented if the thrust is within ~30° of the joint normal (μ ≈ 0.6–0.7).\n\nThese are the checks you will apply in Part 6, alongside the code checks of Part 3.'),
    MC('How do stone vaults usually fail?', ['by forming hinges and turning into a mechanism after supports move', 'by crushing the stone', 'by rusting', 'by melting mortar'], 'Stresses are very low; failure is geometric — spreading supports lets hinges form.', 'Stone is strong in compression.'),
    GM('heyq'),
    NU('An arch ring is 0.45 m thick; the thinnest ring that could just contain a thrust line is 0.18 m. Geometric factor of safety?', 2.5, '0.45 ÷ 0.18 = 2.5.', 'Actual ÷ minimum thickness.', { tol: 0.01 })
  ])

unit('u9', 9, 'eng', 'rs2', 'Stress, masonry strength, slenderness and buckling', 'Compressive and bending stress, the strength of masonry as a composite, and why tall thin piers and walls fail at loads far below their crushing strength.', [
  lesson('u9l1', 'Stress, strain and masonry strength', REF.mas, [
    LS('Stress', 'Stress σ = force ÷ area. 1 MPa = 1 N/mm² = 1000 kPa. For a wall carrying N kN/m on thickness t m: σ = N / (t × 1000) MPa.\n\nWith eccentric load (resultant offset e from centre), stress varies across the section: **σ = N/A ± M/Z**, where M = N·e and Z = b·t²/6. For 1 m length: σ = (N/t)(1 ± 6e/t). If e > t/6 the minimum goes negative — masonry cannot carry tension, so the joint opens and the compressed zone shrinks to 3(t/2 − e), with peak stress **2N / (3(t/2 − e))**.\n\nWorked: N = 150 kN/m on t = 1.0 m footing with e = 0.1 m: σ_avg 150 kPa, max = 150 × (1 + 0.6) = **240 kPa**, min **60 kPa**. With e = 0.25 m (> t/6): max = 2 × 150 / (3 × 0.25) = **400 kPa**, and the inner 0.25 m lifts.'),
    LS('Masonry is a composite', 'Wall strength is **not** the stone strength. Mortar joints are weaker and softer; under load they squeeze out sideways and split the stone in tension. Characteristic compressive strength of masonry (EC6): **f_k = K f_b^0.7 f_m^0.3** for general-purpose mortar, with K ≈ 0.45–0.55 for regular units and much less for rubble.\n\nTypical f_k for design: random rubble in lime 1–3 MPa; coursed rubble 2–5 MPa; ashlar in NHL 4–10 MPa. Divide by γ_M = 2.0–3.0. Even so, dungeon stresses (0.1–0.5 MPa) are usually comfortable — but **point loads** under lintel bearings and vault springings are not, so pad them with large, hard stones (padstones).'),
    GM('lintq'),
    NU('N = 100 kN/m on a 0.8 m wall at e = 0.1 m. Maximum stress (kPa)?', 218.75, 'σ = (100/0.8)(1 + 6×0.1/0.8) = 125 × 1.75 = 218.75 kPa.', 'e ≤ t/6 = 0.133, so use (N/t)(1 + 6e/t).', { tol: 0.1 }),
    NU('Same wall, e = 0.2 m (> t/6). Maximum stress (kPa)?', 333.33, '2N/(3(t/2 − e)) = 200 / (3 × 0.2) = 333.3 kPa.', 'Cracked section formula.', { tol: 0.2 })
  ]),
  lesson('u9l2', 'Slenderness and the capacity reduction factor', REF.mas, [
    LS('Why slender walls are weaker', 'A tall thin wall or pier under load bows sideways. The bow adds eccentricity, the eccentricity adds bending, and because masonry cannot resist tension, a crack opens and the effective section shrinks — the wall can **buckle** well below its crushing load.\n\nSlenderness ratio **λ = h_ef / t_ef**:\n- h_ef = ρ_n × clear height (ρ_n = 0.75 for a wall restrained top and bottom by concrete floors; 1.0 for less restraint; 2.0 for a free-standing cantilever).\n- t_ef = actual thickness (or a combined figure for cavity walls).\n\nEC6 limits unreinforced masonry to **λ ≤ 27**; old rubble walls are usually 6–12.'),
    LS('EC6 Φ (worked)', 'The design capacity of a wall or pier is **N_Rd = Φ f_k A / γ_M**. Annex G of EC6 gives the mid-height reduction factor:\n\n- A₁ = 1 − 2e_mk/t\n- λ′ = (h_ef/t_ef) √(f_k/E), with E = 1000 f_k → √(1/1000) = 0.0316\n- u = (λ′ − 0.063) / (0.73 − 1.17 e_mk/t)\n- **Φ = A₁ e^(−u²/2)**\n\n**Worked**: square pier 0.4 × 0.4 m, h_ef = 3.0 m, e_mk = 0.02 m (0.05t), f_k = 5 MPa, γ_M = 2.5.\n1. λ = 7.5; λ′ = 0.237.\n2. A₁ = 1 − 0.1 = 0.9; u = (0.237 − 0.063)/(0.73 − 0.0585) = 0.259.\n3. Φ = 0.9 × e^(−0.0336) = **0.870**.\n4. N_Rd = 0.870 × 5000 kPa × 0.16 m² / 2.5 = **278 kN**.\n\nCompare Euler’s elastic buckling load for the same pier (E = 5000 MPa): P = π²EI/L² = **11 700 kN** — 40× higher. Euler badly overestimates masonry because it assumes a material that takes tension.'),
    GM('slenq'), GM('eulerq'),
    MC('Why does Euler’s formula overestimate the capacity of a stone pier?', ['It assumes the material resists tension and stays uncracked', 'It ignores the weight of the pier', 'It uses the wrong units', 'Stone is too strong'], 'Masonry cracks on the tension side as it bows, losing stiffness; EC6 Φ captures this.', 'What can masonry not carry?'),
    TF('A free-standing wall has an effective height of about twice its actual height.', true, 'A cantilever buckles like half of a pinned column twice as long (ρ = 2).', 'Cantilever buckling.')
  ]),
  lesson('u9l3', 'Piers, padstones and concentrated loads', REF.mas, [
    LS('Concentrated loads', 'Where a beam, lintel, rib or arch lands on a wall, its force is concentrated on a small bearing:\n\n1. Bearing stress = reaction ÷ bearing area. Check against the **local** design strength (EC6 allows an enhancement up to ~1.5× for small bearings in large walls).\n2. If too high, add a **padstone**: a large, strong block (granite, or concrete) that spreads the load at roughly 60° through the wall below.\n3. Keep bearings ≥ 100–150 mm long and away from the ends of walls.\n\n**Worked**: a rib vault corner sends 180 kN down a pier. On a 0.3 × 0.3 m springer the stress is 2.0 MPa — too high for rubble in lime (f_k/γ_M ≈ 1 MPa). A granite padstone 0.6 × 0.6 m reduces it to **0.5 MPa** in the pier below.'),
    NU('A 90 kN lintel reaction rests on a 0.15 × 0.3 m bearing. Stress (MPa)?', 2, '90 kN / 0.045 m² = 2000 kPa = 2.0 MPa.', 'Force ÷ area; kPa ÷ 1000 = MPa.', { tol: 0.01 }),
    NU('What padstone area (m²) brings that 90 kN down to 0.5 MPa?', 0.18, '90 / 500 = 0.18 m² (e.g. 0.6 × 0.3 m).', 'Area = force ÷ allowable stress.', { tol: 0.001 }),
    GM('eulerq')
  ])
]);

unit('u10', 10, 'eng', 'f3', 'Reinforced masonry and concrete with stone', 'Where steel and concrete legitimately join stone underground — footings, slabs, lintels, ring beams, tanked boxes — and how to size simple elements.', [
  lesson('u10l1', 'When to use reinforcement', REF.rc, [
    LS('Stone, concrete and steel together', 'Traditional stone dungeons need no steel; but modern codes and bad ground often call for it:\n\n| Element | Why concrete/steel |\n|---|---|\n| **Footings** on variable ground | a reinforced strip bridges soft spots and spreads load |\n| **Ground-bearing or suspended slabs** | resist uplift; carry imposed loads |\n| **Lintels** over wide openings | stone lintels over ~1.2 m need great depth |\n| **Ring beams / tie beams** | resist vault thrust where abutments are thin |\n| **Retaining walls** with high water | a concrete box (BS 8102 Type B) with a stone facing |\n| **Bed-joint reinforcement** | stainless steel ties and mesh in new rubble to resist cracking |\n\nRules: **stainless steel** (grade 304/316) for anything in contact with damp masonry — carbon steel rusts, expands up to 7× and splits stone (*rust jacking*). Concrete cover ≥ 40–50 mm in ground. Keep concrete and cement separated from soft stone by a lime bed or membrane where possible.'),
    TF('Ordinary carbon-steel cramps built into damp stone are durable.', false, 'They rust and expand, splitting the stone; historic repairs replace them with stainless steel or bronze.', 'Rust jacking.'),
    MC('A ring beam at the springing of a barrel vault is mainly there to…', ['carry the horizontal thrust as tension so the walls do not spread', 'waterproof the vault', 'decorate the junction', 'make the vault lighter'], 'A tie or ring beam provides the H force in tension instead of relying on heavy abutments.', 'Where does H go?'),
    GM('vaultq')
  ]),
  lesson('u10l2', 'Sizing an RC lintel', REF.rc, [
    LS('EC2 rectangular-block method', 'A singly reinforced rectangular beam:\n\n1. **K = M / (b d² f_ck)** (M in N·mm, b and d in mm). If K ≤ 0.167, no compression steel is needed.\n2. **z = d [0.5 + √(0.25 − K/1.134)] ≤ 0.95 d**.\n3. **A_s = M / (0.87 f_yk z)** in mm².\n4. Pick bars (e.g. 2 × H12 = 226 mm²) and check minimum steel 0.26 (f_ctm/f_yk) b d ≥ 0.0013 b d, spacing and cover.\n\n**Worked**: opening 1.8 m, effective span 2.0 m, design load 25 kN/m → M = 25 × 2² / 8 = **12.5 kNm**. b = 300, d = 200 mm, C30 concrete, B500 steel.\n- K = 12.5×10⁶ / (300 × 200² × 30) = **0.0347**.\n- z = 200 × [0.5 + √(0.25 − 0.0306)] = 200 × 0.968 → capped at **190 mm**.\n- A_s = 12.5×10⁶ / (435 × 190) = **151 mm²** → 2 H10 (157 mm²). Minimum 0.0013 × 300 × 200 = 78 mm² ✓.\n\nShear, deflection, bearing and cover checks follow in real design — this sizing is a first pass.'),
    GM('rcq'), GM('rcq'),
    NU('M = 20 kNm, b = 250 mm, d = 250 mm, f_ck = 30. K (4 dp)?', 0.0427, '20×10⁶ / (250 × 62 500 × 30) = 0.0427.', 'K = M/(b d² f_ck) with N and mm.', { tol: 0.0002 }),
    TF('If K exceeds 0.167 the singly reinforced method is not valid and compression steel or a deeper section is needed.', true, 'Beyond K′ the concrete compression zone would be over-stressed.', 'K limit.')
  ])
]);
})();

unit('u11', 11, 'geo', 'rd', 'Soil mechanics fundamentals', 'Effective stress, shear strength and drainage — the three ideas that explain every earth pressure, bearing and settlement calculation.', [
  lesson('u11l1', 'Effective stress', REF.soil, [
    LS('Terzaghi’s principle', 'Soil is a skeleton of grains with water (and air) in the pores. The total vertical stress σ at a depth is the weight of everything above. Part of it is carried by the **pore water pressure u**; the rest by grain-to-grain contact, the **effective stress**:\n\n**σ′ = σ − u**\n\nOnly effective stress controls strength and compression. Raise the water table and σ′ falls — slopes slide, footings lose capacity. Pump water out and σ′ rises — clay consolidates and buildings nearby settle.\n\n**Worked**: depth 3 m; water table at 1 m; γ = 18 kN/m³ above, γ_sat = 20 below.\n- σ = 18 × 1 + 20 × 2 = **58 kPa**\n- u = 9.81 × 2 = **19.62 kPa**\n- σ′ = **38.38 kPa** (equivalently 18 × 1 + (20 − 9.81) × 2).'),
    NU('Depth 4 m, water table at the surface, γ_sat = 19 kN/m³. Effective vertical stress (kPa, 2 dp)?', 36.76, 'σ = 76; u = 39.24; σ′ = 36.76 kPa. Or (19 − 9.81) × 4.', 'σ′ = (γ_sat − γ_w) z below the table.', { tol: 0.02 }),
    TF('Lowering the water table around a building on clay can make it settle.', true, 'Effective stress increases and the clay consolidates.', 'σ′ = σ − u.'),
    MC('Which stress controls soil strength?', ['effective stress', 'total stress', 'pore pressure alone', 'atmospheric pressure'], 'Friction between grains depends on the contact force, which is the effective stress.', 'Grains carry it.')
  ]),
  lesson('u11l2', 'Shear strength and drainage', REF.soil, [
    LS('Mohr–Coulomb', 'Soils fail in **shear**. Strength on a plane: **τ_f = c′ + σ′ tan φ′** (drained), or **τ_f = c_u** (undrained clay, short-term, φ_u = 0).\n\n| Soil | φ′ | c′ (kPa) | c_u |\n|---|---|---|---|\n| loose sand | 28–32° | 0 | — |\n| dense sand / gravel | 35–42° | 0 | — |\n| silt | 26–32° | 0–5 | low |\n| firm clay | 22–26° | 0–5 | 40–75 |\n| stiff clay | 20–25° | 5–15 | 75–150 |\n\n**Drained vs undrained**: sand drains in seconds, so it is always analysed drained. Clay drains over months to years: just after excavation it behaves undrained (c_u), but permanent walls and footings must also be checked drained (c′, φ′). Unsupported clay faces stand for a while and then collapse — a classic killer in trenches.'),
    NU('Sand: c′ = 0, φ′ = 32°, σ′ = 60 kPa. Shear strength (kPa, 1 dp)?', 37.5, '60 × tan 32° = 60 × 0.6249 = 37.5 kPa.', 'τ = c′ + σ′ tan φ′.', { tol: 0.1 }),
    MC('Why can a vertical clay trench wall stand for hours and then suddenly collapse?', ['Negative pore pressures dissipate and the undrained strength falls toward the lower drained strength', 'Clay gets stronger with time', 'The sun hardens it', 'It never collapses'], 'Excavation unloads clay and creates suction; as it softens and cracks open, strength drops. Never trust an unsupported face.', 'Short-term vs long-term.'),
    GM('presq')
  ])
]);

unit('u12', 12, 'geo', 'rs1', 'Lateral earth pressure: Rankine and Coulomb', 'How hard the ground pushes on a dungeon wall — active, at-rest and passive states, water, surcharge, sloping ground and wall friction.', [
  lesson('u12l1', 'Active, at-rest and passive', REF.soil, [
    LS('Three states', 'The horizontal pressure of soil on a wall depends on **how the wall moves**:\n\n| State | Movement | K |\n|---|---|---|\n| **Active** | wall moves away (≈ 0.1–0.5 % of H) | K_a = (1 − sin φ′)/(1 + sin φ′) |\n| **At rest** | no movement (propped, stiff) | K₀ = 1 − sin φ′ |\n| **Passive** | wall pushed into soil (1–5 % of H) | K_p = (1 + sin φ′)/(1 − sin φ′) |\n\nFor φ′ = 30°: K_a = **1/3**, K₀ = **0.5**, K_p = **3**.\n\nA dungeon wall propped by a vault or floor slab cannot move enough to mobilise active pressure, so **cellar walls should be designed for at-rest pressure** (or higher if compacted backfill is placed against them).', DG('0 0 420 140', '<rect x="180" y="20" width="30" height="100" class="g"/><path d="M210 20 L210 120 L290 120 Z" class="f"/><text x="230" y="110" class="t">K₀</text><path d="M210 20 L210 120 L265 120 Z" class="s"/><text x="300" y="60" class="t">K_a (moves away)</text><path d="M180 20 L180 120 L60 120 Z" class="d"/><text x="40" y="60" class="t">K_p (pushed in)</text>', 'Pressure diagrams for the three states (not to scale).')),
    GM('kaq'), GM('kaq'),
    NU('K₀ for φ′ = 34° (3 dp)?', 0.441, '1 − sin 34° = 1 − 0.5592 = 0.441.', 'Jaky: K₀ = 1 − sin φ′.', { tol: 0.002 }),
    TF('A cellar wall held at the top by a vault should normally be designed for active pressure.', false, 'It cannot move enough; use at-rest K₀ (higher).', 'Movement decides.')
  ]),
  lesson('u12l2', 'Rankine thrust with water and surcharge', REF.soil, [
    LS('Building the pressure diagram', 'For a wall of height H:\n\n- **Soil**: p = K γ z → thrust ½ K γ H² at H/3.\n- **Surcharge** q at the surface: uniform p = K q → thrust K q H at H/2.\n- **Water table** at depth h_w: above it use γ; below it use the **submerged** unit weight γ′ = γ − 9.81 for soil, **plus full water pressure** 9.81 per metre (K = 1 for water!).\n\n**Worked**: H = 3 m, γ = 18, K = 1/3, water table 1 m below the top.\n1. Above the table: ½ × ⅓ × 18 × 1² = **3.0 kN/m**\n2. Rectangle below from that load: ⅓ × 18 × 1 × 2 = **12.0**\n3. Submerged soil triangle: ½ × ⅓ × 8.19 × 2² = **5.46**\n4. Water: ½ × 9.81 × 2² = **19.62**\n5. Total **40.08 kN/m** — compare **27 kN/m** dry. The water alone is nearly half.\n\nMoments about the base: 3 × 2.333 + 12 × 1 + 5.46 × 0.667 + 19.62 × 0.667 = **35.72 kNm/m**; the resultant acts 0.89 m up.'),
    GM('thrustq'), GM('thrustq'),
    NU('H = 2.5 m, K = 0.5 (at rest), surcharge q = 10 kPa. Thrust from the surcharge alone (kN/m)?', 12.5, 'K q H = 0.5 × 10 × 2.5 = 12.5 kN/m at H/2.', 'Uniform pressure × height.', { tol: 0.01 }),
    MC('Why is it unsafe to ignore water pressure behind a cellar wall?', ['water exerts full hydrostatic pressure (K = 1), often more than the soil itself', 'water reduces pressure', 'it only matters above ground', 'it is cancelled by friction'], 'Soil’s K is 0.3–0.5; water’s is 1. Drain it or design for it.', 'K for water.')
  ]),
  lesson('u12l3', 'Coulomb: wall friction and sloping ground', REF.soil, [
    LS('Coulomb’s wedge', 'Coulomb (1776) considered a sliding **wedge** of soil behind the wall and found the worst wedge angle. For a vertical wall back with wall friction δ and backfill slope β:\n\nK_a = cos²φ / ( cos δ [1 + √( sin(φ+δ) sin(φ−β) / (cos δ cos β) )]² )\n\n- With δ = β = 0 it equals Rankine’s K_a.\n- Wall friction (δ ≈ ⅔φ for rough masonry) **reduces** K_a and tilts the thrust down, which helps stability.\n- Sloping ground (β > 0) **increases** it.\n\nWorked: φ = 30°, δ = 20°, β = 0 → **K_a = 0.297** (Rankine 0.333). With β = 10° it rises to **0.340**.\n\nThe thrust then acts at angle δ to the wall normal: horizontal component P cos δ, vertical P sin δ (downward on the wall, adding to its stability).'),
    NU('Coulomb thrust P = 30 kN/m at δ = 20°. Horizontal component (kN/m, 2 dp)?', 28.19, '30 × cos 20° = 28.19 kN/m.', 'P cos δ.', { tol: 0.02 }),
    TF('Coulomb’s K_a with zero wall friction and level ground equals Rankine’s K_a.', true, 'The theories coincide in that case.', 'Special case.'),
    MC('Ground slopes up away from the top of a cellar wall. Compared with level ground, the thrust is…', ['larger', 'smaller', 'the same', 'zero'], 'β > 0 increases K_a: more soil above the failure wedge.', 'More soil leaning on the wall.')
  ])
]);

unit('u13', 13, 'geo', 'op', 'Bearing capacity and settlement', 'How much load the ground can take under a footing, how much it will settle, and how to size footings for dungeon walls and piers.', [
  lesson('u13l1', 'Bearing capacity', REF.soil, [
    LS('Terzaghi’s equation', 'A footing fails by pushing a wedge of soil sideways and up. For a **strip** footing of width B at depth D:\n\n**q_u = c N_c + γ D N_q + ½ γ B N_γ**\n\nwith factors from φ′:\n- N_q = e^(π tan φ) tan²(45 + φ/2)\n- N_c = (N_q − 1) cot φ (= 5.14 when φ = 0)\n- N_γ = 2 (N_q + 1) tan φ (Vesic)\n\nφ = 30°: N_q = 18.40, N_c = 30.14, N_γ = 22.40. φ = 35°: 33.30, 46.12, 48.03. They rise steeply — φ must not be overestimated.\n\nPad (square) footings use shape factors (e.g. s_c ≈ 1.3); inclined and eccentric loads use reduction factors and the **effective width B′ = B − 2e**. Use groundwater-reduced γ′ where the table is within B below the footing.'),
    LS('Worked: strip footing on sand', '**Brief**: dungeon wall line load (SLS) 120 kN/m, footing B = 0.8 m at D = 0.8 m below the floor, sand c′ = 0, φ′ = 32°, γ = 18 kN/m³, water table deep.\n\n1. N_q = 23.18, N_γ = 30.21.\n2. q_u = 18 × 0.8 × 23.18 + 0.5 × 18 × 0.8 × 30.21 = 333.7 + 217.5 = **551.3 kPa**.\n3. Applied q = 120 / 0.8 = **150 kPa** (plus footing weight in real design).\n4. FS = 551.3 / 150 = **3.68** ≥ 3 ✓ (traditional), and the code check uses factored φ′ and loads.\n\n**Clay, short-term**: c_u = 50 kPa, φ = 0, D = 1 m, γ = 19: q_u = 5.14 × 50 + 19 × 1 = **276 kPa**. Note: φ = 0 so the B term vanishes — a wider footing lowers the stress, but not the capacity per m².'),
    GM('nqq'), GM('bearq'), GM('bearq'),
    TF('Bearing capacity on clay in the short term increases strongly with footing width.', false, 'With φ = 0, N_γ = 0; q_u = c_u N_c + γD, independent of B.', 'Which term needs φ?')
  ]),
  lesson('u13l2', 'Footing pressure and eccentricity', REF.soil, [
    LS('Pressure under a footing', 'When the load on a footing is eccentric (e.g. a wall with earth on one side, or a vault springing), pressure varies across it:\n\n- e ≤ B/6: q = (V/B)(1 ± 6e/B) — trapezoid, full contact.\n- e > B/6: the heel lifts; q_max = 2V / (3(B/2 − e)).\n\nAim for **e ≤ B/6** under permanent loads. Check **q_max** against the allowable bearing; check **sliding** (μ = tan δ ≈ tan(⅔φ′) on the base, plus passive resistance only if the ground in front is never dug away).\n\nWorked: V = 150 kN/m, B = 1.0 m, e = 0.1 → q_max **240**, q_min **60 kPa**. With q_u = 533 kPa the FS on q_max is 2.2 — enlarge the footing or centre the load.'),

    MC('The resultant falls outside the middle third of a footing. What happens?', ['part of the footing lifts off and the toe pressure rises sharply', 'nothing', 'pressure becomes uniform', 'the footing gets stronger'], 'Soil cannot pull the footing down; contact shrinks.', 'No tension at the base.'),
    GM('presq')

unit('u14', 14, 'geo', 'f7', 'Seepage, drainage and hydraulics', 'How water moves through soil, how to collect it with French drains and pipes, sizing pipes and sumps, and planning falls.', [

unit('u15', 15, 'geo', 'rs2', 'Excavation, shoring and underpinning', 'Digging the hole safely: battering and benching, trench support, dewatering, spoil, and working next to existing foundations.', [

unit('u16', 16, 'wall', 'rs2', 'Footings, formation and damp-proofing', 'Preparing the base of the dig, sizing and building footings, and stopping water rising into the walls.', [
  lesson('u16l1', 'Formation and footings', REF.soil, [
    LS('Preparing the formation', 'The **formation** is the soil surface the footing sits on:\n\n1. Dig the last 100–150 mm by hand or with a toothless bucket to avoid loosening it.\n2. Remove soft spots, roots, fill; replace with lean concrete or compacted granular fill.\n3. Have it **inspected** (engineer or building certifier) — most codes require it before concrete or the first course.\n4. Protect it: blind with 50–75 mm lean concrete the same day in clay (clay softens when wet).\n5. Keep water out: pump from a sump outside the footing line.\n\n**Footing types** for dungeon walls: **stone spread footing** (large flat stones, two or three stepped courses projecting 100–150 mm each side, steps at 45°–60°), **mass concrete strip**, or **reinforced strip** on variable ground. Width B from bearing: B ≥ V / q_allow.'),

unit('u17', 17, 'wall', 'f3', 'Walling: rubble, ashlar and bond', 'How stones lock together: face and core, through-stones, bond rules, and the different grades of walling.', [
  lesson('u17l1', 'How a stone wall is built', REF.mas, [
    LS('Faces, hearting and throughs', 'A traditional stone wall is two **faces** of good stones with a **hearting** (core) of smaller stones packed in mortar. Its strength depends on tying the faces together:\n\n- **Through-stones** (bonders) span the full thickness — at least **one per square metre of face**, staggered, more at corners and openings.\n- Where no stone is long enough, **long tie stones** reaching two-thirds of the way through from each face, overlapping.\n- **Hearting** must be packed solid: no voids, no loose rubble. Voids let the faces bulge apart (“bellying”).\n- Every stone **bedded** in mortar, with its length running **into** the wall, not along the face.\n- Stones **pinned** (galletted) with small wedge stones to set them firm — never pinned on the face only.\n\nRule: **one over two, two over one** — each vertical joint is covered by a stone above (no straight perpends).'),

  lesson('u17l2', 'Bond patterns', REF.mas, [

    LS('Take-offs', 'Order quantities from the wall volumes:\n\n- **Net wall volume** = L × H × t − openings × t.\n- **Mortar fraction** (of volume): random rubble ≈ 30 %, coursed rubble ≈ 20 %, ashlar ≈ 5–10 %.\n- **Waste** on stone: 10 % rubble, 5–15 % ashlar (breakage, cutting).\n- Tonnes = m³ × ρ ÷ 1000.\n\n**Worked**: rubble wall 6 × 2.5 × 0.6 m with a 1.8 m² doorway.\n1. Net = 9.0 − 1.08 = **7.92 m³**.\n2. Stone = 7.92 × 0.7 × 1.1 = **6.10 m³** → at 2300 kg/m³ **14.0 t**.\n3. Mortar = 7.92 × 0.3 × 1.1 = **2.61 m³** (10 % mortar waste).\n4. Mortar materials at 1:2.5 NHL 3.5: dry 3.40 m³ → binder 0.97 m³ → 680 kg → **28 bags**; sand 2.43 m³.\n\n**Ashlar count**: stones per course = ceil(L ÷ (stone length + joint)); courses = ceil(H ÷ (course height + joint)). 6 m with 600 mm stones and 10 mm joints → 10 per course; 2.4 m of 300 mm courses → 8 courses → **80 stones**.'),
