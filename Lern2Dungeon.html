unit('u18', 18, 'wall', 'imm', 'Wall thickness, batter and retaining cellar walls', 'How thick dungeon walls must be: gravity retaining walls, propped cellar walls, batter, slenderness and the traditional rules checked by statics.', [
  lesson('u18l1', 'Gravity walls and batter', REF.mas, [
    LS('Gravity retaining', 'A free-standing retaining wall resists earth by **weight**. Checks (Units 7–8): overturning about the toe, sliding, base pressure and middle third, bearing.\n\nClosed-form thickness for a rectangular wall with thrust P at H/3:\n- Overturning FS: **t = √(2·FS·P / (3γ))**\n- Middle third (no tension at base): **t = √(2P/γ)**\n\nWith P = 27 kN/m and γ = 22: FS 2 → 1.28 m; middle third → **1.57 m**. Traditional rules (wall = ⅓ to ½ of the retained height) give 1.0–1.5 m for 3 m — close.\n\n**Batter** (leaning the face back, typically 1:6 to 1:10) moves the wall’s centroid back over its heel and lets the earth lean on the wall: a battered wall needs 15–30 % less stone than a vertical one for the same stability.'),

    LS('The dungeon wall is a vertical beam', 'Unlike a garden retaining wall, a dungeon wall is **propped at the top** by the vault (or floor) and **at the bottom** by the floor slab and footing. It spans **vertically** between them like a beam under a triangular load:\n\n- Total load P = ½ K₀ γ H².\n- Reactions: top **P/3**, bottom **2P/3**.\n- Max bending moment **M = 2PH / (9√3) = 0.128 PH**, at depth H/√3 = 0.577 H.\n\nMasonry cannot resist tension, so the bending must be carried by **vertical compression**: the eccentricity e = M/N at that height must stay within the middle third (≤ t/6), where N = vault reaction + wall weight above that level. The heavier the vault, the better the wall resists earth — a beautiful self-help of masonry (arching action).'),

unit('u19', 19, 'wall', 'rd', 'Corbelling, laying and pointing', 'Projecting courses, setting stones, joint finishing and the craft of keeping it all plumb, level and tight.', [
  lesson('u19l1', 'Corbels and corbelled spans', REF.hist, [
    LS('How corbels work', 'A **corbel** projects from a wall to carry something (a beam, a rib, a shelf). A **corbelled span** closes a gap by stepping courses inward.\n\nStability rule for a corbel stone: its **tail** must be held down by enough weight that the centre of gravity of the stone plus anything it carries stays **inside the wall face**. For a single stone of length ℓ projecting a: a < ℓ/2 with no load; with a load at the tip, the wall weight on the tail must give M_hold ≥ FS × M_tip.\n\nCorbelled vaults: each course oversails by a small amount (≤ ⅓ of the stone’s bed length); the tail is anchored by the masonry above. They need no centering, but span little (2–4 m) and need heavy masonry over the haunches.'),
    NU('A 0.9 m corbel stone weighs 3 kN and projects 0.3 m. A 2 kN load sits at the tip. Moment about the wall face from the stone and load (kNm), taking the stone’s weight at its centre?', 0.6, 'Load: 2 × 0.3 = 0.6 kNm overturning. The stone’s centre is 0.45 m from its end, i.e. 0.15 m inside the face: 3 × 0.15 = 0.45 kNm restoring. Overturning from the load alone is 0.6 kNm; the walling above the tail must supply the rest (with FS).', 'Moments about the face line: tip load × projection.', { tol: 0.001 }),
    TF('A corbelled vault needs full centering during construction.', false, 'Each course is self-supporting as laid, held by the masonry over its tail.', 'Historically why corbels came first.'),
    GM('bondq')
  ]),
  lesson('u19l2', 'Setting stone', REF.mas, [
    LS('Laying technique', '1. **Wet** the stone beds (absorbent stones) so they do not dry the mortar.\n2. Spread a full **bed** of mortar, slightly furrowed, thicker than the final joint.\n3. **Set** the stone on its natural bed, tap it down with a mallet to line and level; it should not rock.\n4. **Butter** vertical joints (perpends) full; no hollow joints.\n5. **Pin** with slate or stone wedges at the back where needed; never leave pins proud of the face.\n6. Pack **hearting** as you go, in mortar.\n7. Clean off squeezed-out mortar before it stiffens; rake joints back 15–20 mm if they will be pointed later.\n8. Check **plumb** (spirit level, plumb bob), **line** (string), **level** and **gauge** (course rod) every course.\n\nTolerance: ±10 mm in 3 m for plumb on rubble work; ±3 mm on ashlar.'),
    OR('Order the steps to set a facing stone.', ['wet the bed', 'spread a full mortar bed', 'set the stone on its natural bed and tap down', 'butter the perpends full', 'pin at the back if needed', 'clean off and rake joints'], 'Bed, set, fill, firm, clean.'),
    MC('Why rake joints back 15–20 mm during building?', ['to leave a key for later pointing in a matched mortar', 'to save mortar', 'for drainage', 'to make the wall lighter'], 'Pointing is done later in one campaign for a consistent finish.', 'Pointing comes later.')
  ]),
  lesson('u19l3', 'Pointing', REF.cons, [
    LS('Pointing and repointing', '**Pointing** fills and finishes the outer 15–25 mm of the joint. It is the wall’s weathering surface.\n\n- Use a mortar **no stronger** than the bedding mortar (or the stone), usually the same lime with a finer sand.\n- Rake out to **2–2.5 × the joint width** (min 15–20 mm) by hand; never with an angle grinder on old soft stone (it widens joints and scars arrises).\n- Wet the joint, press mortar in in layers ≤ 10 mm, compact with a pointing iron.\n- Finish **flush or slightly recessed**, then when stiff, **beat** with a stiff brush to expose the aggregate and close shrinkage cracks.\n- Never **strap** (raised ribbon) pointing: it traps water at the arris.\n- Protect from sun, frost and rain for several days.'),
    MC('Which pointing profile should be avoided on stone?', ['raised “strap” or ribbon pointing', 'flush', 'slightly recessed', 'brushed flush'], 'Strap pointing sheds water onto the stone arrises and traps moisture behind it.', 'Where does the water go?'),
    GM('mortarq'),
    NU('Joint width 12 mm. Minimum rake-out depth at 2 × width (mm)?', 24, '2 × 12 = 24 mm.', '2–2.5 × width.', { tol: 0.5 })
  ])
]);
})();

(function () {

const ARCH = DG('0 0 420 200', '<path d="M60 170 A150 150 0 0 1 360 170" class="o"/><path d="M100 170 A110 110 0 0 1 320 170" class="o"/><line x1="60" y1="170" x2="100" y2="170" class="s"/><line x1="320" y1="170" x2="360" y2="170" class="s"/><line x1="210" y1="20" x2="210" y2="60" class="s"/><rect x="198" y="18" width="24" height="44" class="g"/><line x1="210" y1="170" x2="210" y2="60" class="d"/><text x="214" y="120" class="t">rise f</text><line x1="100" y1="185" x2="320" y2="185" class="d"/><text x="190" y="198" class="t">span L</text><text x="225" y="40" class="t">keystone</text><text x="20" y="165" class="t">springing</text><text x="110" y="95" class="t">intrados</text><text x="40" y="70" class="t">extrados</text>', 'Arch anatomy: voussoirs between intrados and extrados, keystone at the crown, springing at the supports.');

unit('u20', 20, 'arch', 'op', 'Arch geometry and voussoirs', 'Span, rise, radius, arc length and cutting the voussoirs that make an arch.', [
  lesson('u20l1', 'Anatomy and shapes', REF.arch, [
    LS('Parts of an arch', '**Voussoirs** are the wedge-shaped stones; the central one is the **keystone**; the lowest are **springers**, sitting on the **impost** at the **springing line**. The underside is the **intrados** (its surface in a vault is the **soffit**), the top the **extrados**. **Span** L is the clear width; **rise** f is springing to crown; the zone above the springing, a third of the way up, is the **haunch**.\n\n| Shape | f/L | Character |\n|---|---|---|\n| semicircular (Roman) | 0.5 | thrust mostly vertical at the springing; easy geometry |\n| segmental | < 0.5 | lower headroom use, **higher thrust** |\n| pointed (Gothic) | > 0.5 | less thrust, high crown |\n| elliptical / three-centred | varies | wide, low; needs care |\n| parabolic / catenary | any | closest to the thrust line of its load |', ARCH),
    LS('Radius from span and rise', 'For a circular segment: **R = (L²/4 + f²) / (2f)**.\n\nWorked: L = 4 m, f = 1 m → R = (4 + 1) / 2 = **2.5 m**. Half-angle θ = asin(L/2R) = asin(0.8) = 53.13° → arc length = 2Rθ = 2 × 2.5 × 0.9273 = **4.64 m**.\n\nSemicircle: f = L/2 → R = L/2. Check: L = 4, f = 2 → (4 + 4)/4 = 2 ✓.'),
    GM('archRq'), GM('archRq'),
    MA('Match the term.', [['keystone', 'central voussoir at the crown'], ['springer', 'lowest voussoir on the impost'], ['extrados', 'upper curve of the arch'], ['haunch', 'zone between springing and crown, about a third up']], 'Vocabulary.')
  ]),
  lesson('u20l2', 'Setting out voussoirs', REF.arch, [
    LS('Number and size', 'Cut voussoirs to a **template** with joints **radial** (pointing to the centre). Rules:\n\n1. Arc length ÷ target intrados width → round **up to an odd number** (so there is a keystone).\n2. Actual intrados width wᵢ = arc / n.\n3. Extrados width wₑ = wᵢ × (R + d)/R, where d = ring depth.\n4. Angle per voussoir = 2θ / n.\n\nWorked: semicircle L = 4 m (R = 2), target 250 mm, ring 400 mm. Arc = πR = 6.283 m → 25.1 → n = **27** (26 would be even). wᵢ = **233 mm**, wₑ = 233 × 2.4/2 = **279 mm**, angle 180/27 = **6.67°**.\n\nRing depth rule of thumb: d ≥ L/12 to L/20 for stone (Rankine’s empirical d = √(0.12R) m for single rings is an old check).'),
    GM('vousq'), GM('vousq'),

  ])
]);

unit('u21', 21, 'arch', 'f7', 'Centering and building an arch', 'Temporary formwork, striking, and the order of work for arches and vaults.', [
  lesson('u21l1', 'Centering', REF.arch, [
    LS('Temporary works', 'An arch has **no strength until the keystone is in**. Until then it sits on **centering**: a timber or steel former shaped to the intrados.\n\n- **Ribs** (cut plywood or laminated timber) at 0.6–1.0 m centres, **laggings** (battens) across them carrying the voussoirs.\n- Supported on **folding wedges** on props or on the impost — so it can be lowered gently (**eased**) and **struck**.\n- Designed for the full wet weight of the ring and fill placed before striking, with bracing against sway. This is **temporary works design** — it needs a competent designer on anything over a small doorway.\n\n**Sequence**: set centering → lay voussoirs **from both springings simultaneously** → key in → fill the haunches (balanced both sides) → wait for mortar to gain strength (lime: weeks; for vaults often 2–4 weeks or more) → ease wedges a little, watch for movement → strike.'),
    OR('Order the arch sequence.', ['erect and brace the centering on wedges', 'lay voussoirs from both springings together', 'set the keystone', 'fill haunches evenly', 'wait for the mortar to stiffen', 'ease wedges then strike'], 'Symmetry and patience.'),
    TF('Voussoirs should be laid from one springing across to the other to save time.', false, 'Loading one side distorts the centering; work both sides together.', 'Balance.'),
    MC('Why use folding wedges under centering?', ['to lower it gradually so the arch takes up load gently', 'to raise the arch afterwards', 'to save timber', 'for drainage'], 'Easing lets you watch for cracks before full striking.', 'Striking.')
  ])
]);

unit('u22', 22, 'arch', 'imm', 'Thrust lines and the safe theorem', 'Why arches stand: funicular polygons, thrust lines, the middle third and Heyman’s plastic theory of masonry.', [
  lesson('u22l1', 'Funicular shapes', REF.arch, [
    LS('Hanging chains, standing arches', 'Hooke (1675): **“as hangs the flexible line, so but inverted will stand the rigid arch.”** A chain under loads takes the shape of pure tension; invert it and you get a shape in pure compression — the **funicular** of those loads.\n\nFor loads at points xᵢ on span L, with horizontal thrust H, the funicular’s height at any point is **y(x) = M(x) / H**, where M(x) is the bending moment of a simply supported beam with the same loads. So:\n\n**H = M_max / f** — for a uniform load w: M = wL²/8 → **H = wL²/(8f)** (parabola). For a point load P at midspan: **H = PL/(4f)**.'),
    LS('Worked funicular', '**Brief**: three loads of 20 kN at x = 1, 2, 3 m on a 4 m span, rise 1 m.\n\n1. Reactions: 30 kN each.\n2. Moments: M(1) = 30 × 1 = **30**; M(2) = 30 × 2 − 20 × 1 = **40**; M(3) = **30** kNm.\n3. H = M_max / f = 40 / 1 = **40 kN**.\n4. Ordinates y = M/H: **0.75, 1.0, 0.75 m** — a polygon your arch must contain.\n5. Thrust at the support: √(40² + 30²) = **50 kN** at atan(30/40) = 36.9° below horizontal.\n\nPlot this line inside the arch ring: if it fits within the middle third everywhere, the ring is entirely in compression.', DG('0 0 420 170', '<line x1="40" y1="150" x2="380" y2="150" class="s"/><polyline points="40,150 125,86 210,65 295,86 380,150" class="f"/><line x1="125" y1="20" x2="125" y2="86" class="d"/><line x1="210" y1="20" x2="210" y2="65" class="d"/><line x1="295" y1="20" x2="295" y2="86" class="d"/><text x="110" y="15" class="t">20</text><text x="198" y="15" class="t">20</text><text x="282" y="15" class="t">20 kN</text><text x="130" y="105" class="t">0.75</text><text x="214" y="85" class="t">1.0</text><text x="40" y="168" class="t">H = 40 kN, V = 30 kN</text>', 'Funicular polygon for three equal point loads.')),
    GM('funq'), GM('thrustArch'), GM('funq'),
    NU('Uniform load 30 kN/m on a 4 m span with 1 m rise. Horizontal thrust H (kN)?', 60, 'H = wL²/(8f) = 30 × 16 / 8 = 60 kN.', 'wL²/8f.', { tol: 0.01 })
  ]),
  lesson('u22l2', 'The safe theorem and minimum thickness', REF.arch, [
    LS('Heyman’s three assumptions', 'Masonry analysed by **plasticity** (Heyman, 1966) assumes: (1) **no tensile strength**; (2) **unlimited compressive strength** (stresses are low: typically 0.1–1 MPa vs strength 20–100 MPa); (3) **no sliding** between stones.\n\nThe **safe theorem**: if you can find **any** thrust line in equilibrium with the loads that lies **wholly within** the masonry, the arch is safe and will not collapse. Collapse needs four **hinges** to form (thrust line touching intrados/extrados alternately).\n\n**Geometric factor of safety**: ratio of actual thickness to the minimum thickness that just contains a thrust line. A semicircular arch under self-weight needs t_min ≈ **0.106 R** (Milankovitch). Heyman recommends a geometric FS of **2–3** (thrust line in the middle half/third).'),
    LS('Stress is rarely the problem', 'Worked check: thrust 76 kN on a 0.4 m × 1 m ring section → σ = 76 / 400 000 mm² = **0.19 MPa**. Limestone crushes at ~40 MPa, rubble masonry maybe 2–5 MPa. Stability (geometry), not strength, governs arches — which is why medieval cathedrals still stand. The danger is **support movement** (abutments spreading) and **asymmetric or point loads** that drive the thrust line out of the ring.'),
    GM('heyq'), GM('safeq'),
    NU('Semicircular barrel R = 2.4 m. Minimum thickness 0.106 R (m, 3 dp)?', 0.254, '0.106 × 2.4 = 0.2544 m; with geometric FS 2, use ≥ 0.51 m.', 't_min = 0.106R.', { tol: 0.001 }),
    MC('An arch collapses as a mechanism when how many hinges form?', ['four', 'one', 'two', 'none'], 'Three hinges make it statically determinate; a fourth turns it into a mechanism.', 'Mechanism.'),
    TF('Under the safe theorem, finding one thrust line within the masonry proves the arch is safe.', true, 'That is the lower-bound theorem of plasticity applied to masonry.', 'Lower bound.')
  ])
]);

unit('u23', 23, 'arch', 'rs1', 'Barrel, groin and rib vaults', 'Designing the vault itself: loads, thrust per metre, groins, ribs and the transitions between them.', [
  lesson('u23l1', 'The barrel vault, worked', REF.arch, [
    LS('Barrel vault per metre run', 'A **barrel** (tunnel) vault is an arch extruded along its length; analyse **one metre strip**.\n\n**Brief**: L = 4 m, f = 1.2 m segmental, t = 0.4 m limestone (2300 kg/m³), average fill 0.5 m (1800 kg/m³), live 1.5 kPa.\n\n1. R = (4 + 1.44)/2.4 = **2.267 m**; arc = **4.90 m**.\n2. Self-weight G₁ = 22.56 × 0.4 × 4.90 = **44.2 kN/m**; fill G₂ = 17.66 × 0.5 × 4 = **35.3 kN/m**; live Q = 1.5 × 4 = **6 kN/m**.\n3. ULS: 1.35 × 79.5 + 1.5 × 6 = 116.4 kN → w_d = **29.1 kN/m²** of span.\n4. H = w_d L²/(8f) = 29.1 × 16 / 9.6 = **48.5 kN/m**; V = w_d L/2 = **58.2 kN/m**.\n5. Stress at springing: √(48.5² + 58.2²) / 0.4 m = **0.19 MPa** ✓.\n6. t_min = 0.106 R = 0.24 m → t = 0.4 gives geometric FS ≈ 1.7 (Heyman’s guidance suggests going thicker or checking the actual thrust line).\n\nThe 48.5 kN/m horizontal thrust must be resisted by the **abutment walls** (Unit 24). Note the parabolic thrust line assumption: the real fill loading peaks at the haunches; the vault lab plots a funicular for it.'),
    GM('vaultq'), GM('vaultq'),
    NU('Barrel: w_d = 25 kPa, L = 3 m, f = 1 m. H (kN/m, 2 dp)?', 28.13, '25 × 9 / 8 = 28.125.', 'wL²/8f.', { tol: 0.01 })
  ]),
  lesson('u23l2', 'Groin and rib vaults', REF.arch, [
    LS('Groin vaults', 'A **groin (cross) vault** is two barrels intersecting at right angles. The intersection lines — **groins** — run diagonally; load flows down the groins to the **four corners**. Consequences:\n\n- Walls between corners carry little: you can open them (arcades, doorways).\n- Thrust is concentrated at the corners, acting **diagonally** — piers there must be buttressed in both directions.\n- For a square bay L × L with load w (kPa): total W = wL²; each corner V ≈ **W/4**. Example: 4 × 4 m at 8 kPa → 128 kN → **32 kN per corner**.\n- Built on centering for both barrels; groin stones are cut on a complex double curve (templates from full-size drawings).\n\nMultiple bays form a vaulted **hall** on piers — the classic undercroft.'),
    LS('Rib vaults and transitions', '**Rib vaults** build stone **ribs** (diagonal, transverse, wall ribs) first on light centering, then fill the **webs** (thin panels, often 150–200 mm) between them. Ribs gather load to the springings; webs can be thin because they span short distances between ribs. Pointed ribs let bays of unequal span have equal crown heights.\n\n**Transitions**:\n- Barrel → groin: a **transverse arch** (rib) marks the change; thrust shifts from continuous wall to points — wall below needs a pier or buttress at that point.\n- Barrel meeting barrel at a T: an **intersection** with a groin on one side; the main barrel wall is cut — put a **relieving arch** over the opening.\n- Smaller barrel into larger: a **lunette** penetration; spring it higher so the crowns are related.\n- Stair passage vaults: **raking** (sloping) barrels, stepped or ramped; check that thrust doesn’t push the lower end out.'),
    MC('In a groin vault, where is the load concentrated?', ['at the four corners', 'evenly along all walls', 'at the crown', 'in the fill'], 'Groins carry it diagonally to the corner piers.', 'Groins.'),
    NU('Square groin bay 5 × 5 m, 10 kPa factored load. Vertical load per corner (kN)?', 62.5, '10 × 25 = 250 kN; ÷ 4 = 62.5.', 'W/4.', { tol: 0.01 }),
    MA('Match.', [['web', 'thin panel between ribs'], ['lunette', 'small vault penetrating a larger one'], ['transverse arch', 'rib marking the boundary between bays'], ['groin', 'diagonal intersection line of two barrels']], 'Vault vocabulary.')
  ])
]);

unit('u24', 24, 'arch', 'rd', 'Buttresses and abutments', 'Resisting the thrust: abutment design, buttresses, ties and the interaction of earth, vault and wall.', [
  lesson('u24l1', 'Designing an abutment', REF.arch, [
    LS('The abutment as a block', 'Model the abutment as a block of width b, height h, unit weight γ, with the vault delivering **H** (horizontal) and **V** (vertical, at the inner face) at the top. About the outer toe:\n\n- Restoring M_r = W·b/2 + V·b, where W = γ b h.\n- Overturning M_o = H·h.\n- FS_overturn = M_r/M_o ≥ 2 (classic), sliding FS = μN/H ≥ 1.5.\n- Resultant position x̄ = (M_r − M_o)/N; eccentricity e = b/2 − x̄ ≤ **b/6** (middle third).\n- Base pressure q_max = N/b × (1 + 6e/b) ≤ allowable bearing.'),
    LS('Worked: minimum abutment width', '**Brief**: H = 40 kN/m, V = 50 kN/m, h = 3 m, γ = 22.\n\nTry b = 2.12 m:\n1. W = 22 × 2.12 × 3 = **139.9 kN/m**; N = **189.9**.\n2. M_r = 139.9 × 1.06 + 50 × 2.12 = **254.3**; M_o = 40 × 3 = **120** → FS = **2.12** ✓.\n3. x̄ = (254.3 − 120)/189.9 = **0.707 m**; e = 1.06 − 0.707 = **0.353 ≈ b/6 = 0.353** ✓ (just in the middle third).\n4. Sliding: 0.6 × 189.9 / 40 = **2.85** ✓.\n5. q_max = 189.9/2.12 × 2 = **179 kPa** — check against bearing.\n\nSo b ≈ **2.12 m**. In a dungeon, the **earth behind** a buried abutment pushes back (passive, use cautiously — only a fraction mobilises at small movement), and a **neighbouring vault** balances thrust: in a row of equal barrels only the **end** walls need full abutments.'),
    GM('abutq'), GM('abutq'),
    NU('Abutment b = 1.5, h = 2, γ = 22, V = 40 at the inner face, H = 25. FS against overturning (2 dp)?', 2.19, 'W = 22 × 1.5 × 2 = 66; M_r = 66 × 0.75 + 40 × 1.5 = 109.5; M_o = 25 × 2 = 50 → FS = 2.19.', 'M_r/M_o.', { tol: 0.01 }),
    TF('In a row of equal adjacent barrel vaults, interior walls see little net horizontal thrust.', true, 'Thrusts from each side balance; only end walls need full abutments — but beware unbalanced loading or building one vault before its neighbour.', 'Balance.')
  ]),
  lesson('u24l2', 'Buttresses, ties and fliers', REF.arch, [
    LS('Other ways to take thrust', '- **Buttress**: a deep pier projecting from the wall, placing mass where the lever arm is greatest; add a **pinnacle** or weight on top to steepen the resultant. Underground, the **soil itself** often acts as a buttress if the vault is built against firm ground or rock.\n- **Tie rod**: steel or wrought-iron tie at the springing level takes H in tension — removes the thrust from the walls entirely. Must be protected from corrosion (galvanised, stainless, or encased) and anchored with **pattress plates**. Common in repairs.\n- **Flying buttress**: an arch carrying thrust over a space to a distant pier — rare below ground.\n- **Reinforced concrete ring beam or slab** at springing level acting as a tie.\n\n**Construction sequence matters**: backfill both sides of a vault evenly; never remove the earth from one side of an existing vault without temporary propping.'),
    MC('What does a tie rod at springing level do?', ['carries the horizontal thrust in tension', 'adds vertical load', 'supports the centering', 'drains water'], 'It closes the force triangle without needing massive abutments.', 'Tension member.'),
    NU('Thrust 48.5 kN/m, ties at 1.5 m centres. Force per tie (kN, 1 dp)?', 72.8, '48.5 × 1.5 = 72.75 kN.', 'Thrust per m × spacing.', { tol: 0.06 }),
    GM('abutq')
  ])
]);
})();

/* ---- lern2dungeon/l07.js — Part 7: fit-out (Units 25–28) ---- */
(function () {
const { REF, LS, MC, TF, MA, OR, NU, unit, lesson, DG } = CG.H;
const GM = id => GEN.make(id);

unit('u25', 25, 'fit', 'f3', 'Floors and stairs', 'Ground-bearing floors that resist water and act as props, and stone stairs that are safe to use.', [
  lesson('u25l1', 'Floors', REF.damp, [
    LS('Build-up of a dungeon floor', 'A typical modern-compatible floor, bottom up:\n\n1. **Formation**, inspected.\n2. **Sub-base**: 150 mm compacted crushed stone (also a drainage layer linked to the perimeter drain; for high water tables, a **sump** and pump).\n3. **Blinding** 50 mm sand or lean mix.\n4. **Membrane** (DPM / tanking layer, lapped onto the wall waterproofing).\n5. **Slab**: 100–150 mm concrete, or **limecrete** (hydraulic lime + expanded clay) for a breathable historic floor.\n6. **Finish**: flagstones bedded on lime mortar, joints 5–10 mm.\n\n**Structural roles**: the slab is the **bottom prop** for the walls (Unit 18) — it must butt firmly against them. Under **uplift** (water table above the floor), the slab must weigh more than the water pressure or be tied down: a 0.15 m slab weighs 3.5 kPa, resisting only 0.36 m of water head. Never rely on a thin slab under significant head.'),
    GM('upliftq'), GM('hydroq'),
    NU('Water table 0.8 m above the underside of a floor. Uplift pressure (kPa, 2 dp)?', 7.85, '9.81 × 0.8 = 7.848 kPa.', 'u = γw × h.', { tol: 0.01 }),
    NU('Concrete slab (24 kN/m³) thickness needed to balance 7.85 kPa uplift with FS 1.1 (m, 2 dp)?', 0.36, '7.85 × 1.1 / 24 = 0.36 m — which is why drainage, not mass, is usually preferred.', 't = FS × u / γc.', { tol: 0.01 })
  ]),
  lesson('u25l2', 'Stairs', REF.code, [
    LS('Designing a stair', 'Comfort rule (Blondel): **2R + G ≈ 630 mm** (range 550–700). Typical code limits for private stairs: rise ≤ 190–220 mm, going ≥ 220–250 mm, pitch ≤ 42°; for public/common stairs stricter. **Headroom** ≥ 2.0 m measured vertically above the pitch line — the most common error in vaulted stairways. Handrail one side at least; guarding where there is a drop.\n\n**Worked**: total rise 2.8 m, max rise 190 mm.\n1. n = ceil(2800/190) = **15 risers** → R = **186.7 mm**.\n2. G = 630 − 2 × 186.7 = **256.7 mm**.\n3. Run = (15 − 1) × 256.7 = **3.59 m** (treads = risers − 1).\n4. Pitch = atan(186.7/256.7) = **36.0°** ✓.\n\n**Stone stairs**: solid steps built into the wall (cantilevered stairs act by **torsion** and bearing on the step below — a specialist structure); spiral **newel** stairs with each step forming a slice of the central column; or steps on a **raking barrel vault**.'),
    GM('stairq'), GM('stairq'),
    NU('Total rise 2.4 m, max rise 0.19 m. Number of risers?', 13, '2.4/0.19 = 12.6 → 13 risers of 184.6 mm.', 'Round up.', { tol: 0.01 }),
    TF('Headroom on a stair is measured vertically from the pitch line.', true, 'Typically ≥ 2.0 m; vaulted soffits often fail it at the lower end.', 'Pitch line.')
  ])
]);

unit('u26', 26, 'fit', 'op', 'Openings, lintels and ironwork', 'Doorways and windows in loadbearing stone: lintels, relieving arches, jambs, and iron that will not burst the stone.', [
  lesson('u26l1', 'Stone and timber lintels', REF.mas, [
    LS('Stone lintel check', 'Stone is weak in tension, so a lintel is checked in **bending**:\n\n- Effective span L_e = clear span + one bearing (bearing ≥ 150 mm each end, more on soft stone).\n- M = w L_e² / 8; Z = b d² / 6; σ = M/Z.\n- Compare with the stone’s **flexural strength** (sandstone 2–6 MPa, granite 8–15, limestone 3–10) with FS ≥ **3** for stone (defects, bedding planes).\n\n**Worked**: 1.2 m clear, 150 mm bearings, lintel 300 × 300 mm, load 15 kN/m, flexural strength 1 MPa (poor sandstone).\n1. L_e = 1.35 m; M = 15 × 1.35² / 8 = **3.42 kNm**.\n2. Z = 0.3 × 0.3² / 6 = **0.0045 m³**.\n3. σ = 3.42/0.0045 = 759 kPa = **0.76 MPa** → FS = 1.32 ✗. Use a deeper lintel, a stronger stone, or a **relieving arch** above to take most of the load.\n\nLoad on a lintel: usually the masonry in a **45° or 60° triangle** above it, unless the triangle is interrupted by a floor/vault load.'),
    LS('Timber and RC lintels', '**Oak** lintels were traditional; underground they **rot** where damp and are a fire hazard near hearths. Use only in dry, ventilated locations, with ends wrapped in a DPC.\n\nWorked oak 150 × 200 mm, span 1.2 m, 8 kN/m: M = 8 × 1.44 / 8 = **1.44 kNm**; Z = 150 × 200² / 6 = 1.0 × 10⁶ mm³ → σ = **1.44 MPa** vs a design bending strength for oak around 10+ MPa ✓.\n\n**Reinforced concrete** lintels (Unit 10) are the robust modern choice, often hidden behind a stone facing.'),
    GM('lintq'), GM('lintq'),
    NU('Stone lintel 250 × 350 mm deep, clear span 1.0 m, bearing 0.2 m, load 12 kN/m. Bending stress (MPa, 2 dp)?', 0.42, 'L_e 1.2; M = 12 × 1.44/8 = 2.16 kNm; Z = 0.25 × 0.1225/6 = 0.005104 m³; σ = 423 kPa = 0.42 MPa.', 'σ = M/Z.', { tol: 0.01 }),
    TF('A relieving arch above a lintel carries much of the masonry load around the opening.', true, 'It diverts load to the jambs, leaving the lintel only the infill below the arch.', 'Relieve.')
  ]),
  lesson('u26l2', 'Doors, grilles and iron', REF.cons, [
    LS('Iron in stone', 'Iron **rusts and expands** up to 7× in volume — buried iron cramps and hinge pins are the classic cause of split stone ("rust jacking").\n\n- Use **stainless steel** (grade 316 underground) or **phosphor bronze** for cramps, dowels, hinge pins and grille fixings.\n- Set fixings in **lead**, lime grout or resin, never cement in a tight hole with ordinary iron.\n- Keep fixings well back from arrises (≥ 50 mm).\n- Door frames: **rebated** stone jambs, with hinge **pintles** leaded into the jamb; heavy oak doors (40–60 kg) bear on the lower pintle.\n- Grilles/gates: ensure they can **always be opened from inside** — for safety and for building regulations on means of escape. A dungeon here is a cellar for storage, wine or atmosphere, not a place to confine anyone.'),
    MC('Why are ordinary iron cramps a problem in stone?', ['rust expands and splits the stone', 'iron is too heavy', 'iron conducts sound', 'iron is too weak'], 'Rust jacking.', 'Volume of rust.'),
    MC('Best metal for fixings in a damp cellar?', ['grade 316 stainless steel', 'mild steel', 'galvanised nails', 'aluminium'], 'Most corrosion resistant of the common options.', 'Marine grade.'),
    TF('Every gate or door in the dungeon must be openable from the inside.', true, 'Means of escape and basic safety — never build a space that can trap a person.', 'Escape.')
  ])
]);

unit('u27', 27, 'fit', 'rs2', 'Covering, ventilation and light', 'What goes over the vault, how air moves through a buried room, and safe lighting niches.', [
  lesson('u27l1', 'Covering the vault', REF.damp, [
    LS('Over the extrados', 'Build-up above a buried vault:\n\n1. **Haunch fill**: lean lime concrete or rubble packed solid to around ⅓–½ of the rise — it stiffens the vault and steepens the thrust line.\n2. **Screed** to falls over the extrados, shedding water to the sides.\n3. **Waterproof membrane** (bitumen sheet, liquid membrane, or traditional puddled clay 300 mm+), lapped down the outside of the walls.\n4. **Protection board** and **drainage layer** (geocomposite or gravel) leading to the perimeter French drain.\n5. **Backfill** in thin compacted layers, both sides equally; **no heavy compaction plant** directly over a fresh vault (use the lightest roller, keep 1 m cover first).\n6. Topsoil / landscape. Fill depth is a **dead load** you designed for — later adding 1 m of earth or a car park changes everything.'),
    OR('Order the covering layers from the vault upward.', ['haunch fill', 'screed to falls', 'waterproof membrane', 'protection and drainage layer', 'compacted backfill', 'topsoil'], 'Stiffen, shed, seal, protect, cover.'),
    TF('Heavy vibrating rollers may be used directly on a newly finished vault to compact backfill.', false, 'Point and dynamic loads can crack or collapse the vault; build up cover with light plant.', 'Fresh masonry.')
  ]),
  lesson('u27l2', 'Ventilation', REF.vent, [
    LS('Why ventilate, and how air moves', 'Underground air is cool, humid and may collect **CO₂, radon or fumes**. Ventilation controls condensation and air quality. With no fan, air moves by the **stack effect**: warm air rises in a vertical shaft.\n\n**Q = C_d A √(2 g h ΔT / T_m)**, with C_d ≈ 0.6, A the free area (m²), h the height between low inlet and high outlet, ΔT the temperature difference, T_m the mean absolute temperature (K).\n\n**Worked**: A = 0.04 m² (200 × 200 mm), h = 6 m, inside 12 °C, outside 2 °C.\n1. T_m = 7 + 273.15 = 280.15 K; 2 × 9.81 × 6 × 10 / 280.15 = **4.202**.\n2. √4.202 = 2.050 m/s → Q = 0.6 × 0.04 × 2.050 = **0.0492 m³/s** (177 m³/h).\n\nIn **summer**, ΔT reverses or vanishes; stack flow stops or runs backward, and warm humid air entering a cool cellar **condenses** on the walls. Mechanical ventilation (with humidity control) is often needed.'),
    LS('Sizing the vent', 'Target ~**0.5 air changes per hour** for storage, more for occupied rooms. Required A = (V × ach / 3600) / Q₁, where Q₁ is the flow per m² of vent from the formula.\n\nWorked: room 60 m³ at 0.5 ach → Q = 0.00833 m³/s; Q₁ = 0.6 × 2.050 = 1.230 → A = **0.0068 m²** (≈ 83 × 83 mm). Provide at least that (more for summer), **low inlet and high outlet** at opposite ends, with insect mesh and rain caps.\n\n**Air safety**: never use an underground space with a combustion appliance, generator or engine without a qualified assessment; fit **CO and CO₂ alarms**; test for **radon** in granite areas.'),
    GM('ventq'), GM('ventq'),
    NU('Stack flow: C_d 0.6, A 0.05 m², h 4 m, ΔT 8 K, T_m 283 K. Q (m³/s, 3 dp)?', 0.045, '2 × 9.81 × 4 × 8 / 283 = 2.219; √ = 1.490; Q = 0.6 × 0.05 × 1.490 = 0.0447.', 'Q = Cd A √(2ghΔT/Tm).', { tol: 0.001 }),
    MC('Why can summer ventilation make a cellar damper?', ['warm humid outside air condenses on the cool walls', 'summer rain', 'the stack effect gets stronger', 'mortar sweats'], 'Dew point exceeds wall temperature.', 'Dew point.')
  ]),
  lesson('u27l3', 'Lighting niches', REF.fire, [
    LS('Niches and light', 'A **niche** is a small arched recess — build it like an opening: a small arch or lintel, with the wall above checked for the removed section (≤ ⅓ of wall thickness deep, away from vault springings and concentrated loads).\n\n**Light**: candles and oil lamps consume oxygen and produce CO₂ and soot — acceptable occasionally with good ventilation, never as the main light. Use **low-voltage LED** fittings rated **IP65+** for damp locations, cables in conduit, RCD protection and a qualified electrician. Emergency lighting along the escape route for any regularly used space.'),
    MC('Best primary lighting for a damp underground room?', ['IP65+ low-voltage LED on an RCD-protected circuit', 'oil lamps', 'candles in every niche', 'mains bulbs in open holders'], 'Safe in damp, no combustion products.', 'Damp + electricity.'),
    TF('A niche may be cut freely anywhere, including right at the springing of a vault.', false, 'The springing carries the vault thrust; keep niches away from concentrated loads.', 'Load paths.')
  ])
]);

unit('u28', 28, 'fit', 'imm', 'Hearths and chimneys', 'Fires underground are dangerous: when they are possible at all, and how hearth and flue are built.', [
  lesson('u28l1', 'Hearths, flues and fire safety', REF.fire, [
    LS('Read this first', 'An open fire in an underground room is one of the **most dangerous** things you can build: **carbon monoxide** collects in low spaces, draught is unreliable (the flue may run backward when cold), and escape routes are limited. Most building codes **require** a certified installer, a sized and lined flue, permanent air supply and CO alarms — and many forbid solid-fuel appliances below ground entirely. Treat this lesson as understanding, not a licence.'),
    LS('How a hearth and flue are built', '- **Constructional hearth**: non-combustible, typically ≥ 125 mm thick, projecting ≥ 500 mm in front of the fire opening and ≥ 150 mm each side.\n- **Fireback** of firebrick; **throat** and **smoke shelf** to stop downdraughts.\n- **Flue**: cross-section roughly **⅛–⅒ of the fireplace opening area** (minimum ~200 mm diameter for open fires), **lined** (clay or stainless liner), as straight as possible (bends ≤ 45°), rising **≥ 4.5 m** and terminating above the surrounding ground and any nearby openings.\n- **Combustion air**: a permanent vent to outside sized to the appliance.\n- **CO alarm** in the room; annual sweeping and inspection.\n\nWorked flue: opening 0.8 × 0.6 = 0.48 m² → flue ≈ 0.48/8 = **0.06 m²** (≈ 245 × 245 mm or 280 mm dia).'),
    NU('Fireplace opening 0.9 × 0.7 m. Flue area at ⅛ of the opening (m², 3 dp)?', 0.079, '0.63 ÷ 8 = 0.0788 m².', 'Opening area ÷ 8.', { tol: 0.001 }),
    MC('The main reason underground fires are especially dangerous:', ['carbon monoxide and poor draught in low enclosed spaces', 'stone burns', 'mortar melts', 'smoke is pretty'], 'Plus limited escape.', 'Silent killer.'),
    TF('A CO alarm and a permanent outside air supply are basic requirements for any fuel-burning appliance.', true, 'Along with a certified installation and lined, sized flue.', 'Safety basics.')
  ])
]);
})();

/* ---- lern2dungeon/l08.js — Part 8 durability (Units 29–31) and Part 9 capstones (Units 32–34) ---- */
(function () {
const { REF, LS, MC, TF, MA, OR, NU, unit, lesson, DG } = CG.H;
const GM = id => GEN.make(id);
const C = GEN.CALC, r = (x, d) => (+x).toFixed(d === undefined ? 2 : d);

/* ---------- capstone design, computed live from CALC (checked by tests/cap.test.js) ---------- */
const ROOMS = [{ name: 'Wine cellar', w: 4, l: 6, h: 2.5, f: 1.2, t: 0.4 }, { name: 'Great hall', w: 5, l: 8, h: 2.5, f: 1.5, t: 0.45 }, { name: 'Passage', w: 1.5, l: 6, h: 2.2, f: 0.75, t: 0.3 }];
const T = 0.9, FILL = 1.0, LIVE = 2.5, QA = 150;
const CAP = { rooms: ROOMS, t: T };
CAP.take = C.rooms(ROOMS, T, 2.5);
CAP.vaults = ROOMS.map(x => Object.assign({ name: x.name, L: x.w, len: x.l }, C.barrel(x.w, x.f, x.t, 2300, FILL, 1800, LIVE), { vs: C.voussoirs(x.w, x.f, 0.25, x.t) }));
const hall = CAP.vaults[1];
CAP.abut = C.abutWidth(hall.H, hall.V, 2.5, 22);
CAP.tie = { spacing: 1.5, F: hall.H * 1.5 }; CAP.tie.A = CAP.tie.F * 1000 / 355; /* mm² at fy 355 MPa */
CAP.propped = C.proppedWall(0.5, 18, 2.5, T, 22, hall.V);
CAP.footV = 22 * T * 2.5 + hall.ws * hall.L / 2; CAP.footBmin = CAP.footV / QA; CAP.footB = 1.2; CAP.footQ = (CAP.footV + CAP.footB * 0.4 * 22) / CAP.footB;
CAP.wallMas = C.wallStone(1, 1, CAP.take.wallV, 0, 'rubble', 0.1, 2300);
CAP.vaultVol = CAP.vaults.reduce((a, v) => a + v.vol * v.len, 0);
CAP.vaultMortar = CAP.vaultVol * 0.08 * 1.1; CAP.vaultStone = CAP.vaultVol * 0.92 * 1.1;
CAP.mortarWet = CAP.wallMas.mortar + CAP.vaultMortar; CAP.mix = C.mortarMix(CAP.mortarWet, 2.5);
CAP.stoneT = (CAP.wallMas.stone + CAP.vaultStone) * 2.3;
CAP.drainL = 2 * (14.4 + 6.4 + 2.4); /* outer perimeter of the row of cells, see lesson */
CAP.drain = C.manningFull(0.1, 0.01, 0.011); CAP.drainFall = C.fall(CAP.drainL / 2, 0.01);
CAP.sump = C.sumpVol(0.0005, 30);
CAP.vent = C.ventArea(CAP.take.floor * 2.5, 0.5, 6, 12, 2);
CAP.stairs = C.stairs(3.5);
CG.CAP = CAP;
const vt = '| Room | Span | Rise | Ring | Arc | Voussoirs | H ULS kN/m | V ULS kN/m | σ MPa | t_min |\n|---|---|---|---|---|---|---|---|---|---|\n' + CAP.vaults.map((v, i) => `| ${v.name} | ${ROOMS[i].w} | ${ROOMS[i].f} | ${ROOMS[i].t} | ${r(v.arc)} | ${v.vs.n} | ${r(v.H, 1)} | ${r(v.V, 1)} | ${r(v.stress)} | ${r(v.tMin)} |`).join('\n');

unit('u29', 29, 'dur', 'rs1', 'Waterproofing strategy', 'Designing against water from the outside in: BS 8102 grades, the three protection types, and combining them.', [
  lesson('u29l1', 'Grades and types', REF.damp, [
    LS('Decide the grade first', 'The UK standard **BS 8102** (other countries have equivalents) asks first: **how dry must the space be?**\n\n| Grade | Use | Allows |\n|---|---|---|\n| **1** | car park, plant room | some seepage and damp patches |\n| **2** | storage, workshops | no water penetration; some vapour/humidity acceptable, ventilation |\n| **3** | habitable, wine store with controls, archives | dry, controlled environment |\n\nThen pick **types** of protection:\n- **Type A — barrier (tanking)**: membranes, cementitious or bitumen coatings, outside (best) or inside.\n- **Type B — structurally integral**: watertight concrete (water-resisting admixtures, controlled cracking) — hard to achieve with stone alone.\n- **Type C — drained protection**: a studded **cavity drain membrane** inside the wall leads any water to a channel, **sump and pump** — tolerant of leaks, but needs maintenance and power (with a backup).\n\nFor grade 3 and significant water, the standard recommends **combined** protection (e.g. A + C). Always reduce the load first: **land drainage** and a **French drain** lowering the water table around the structure.'),
    MA('Match the type.', [['Type A', 'barrier / tanking membrane'], ['Type B', 'watertight structure itself'], ['Type C', 'cavity drain membrane, channel and sump']], 'BS 8102 types.'),
    MC('Grade 3 habitable space with a high water table: best approach?', ['combined protection, e.g. external tanking plus internal cavity drain, with land drainage', 'a single coat of paint', 'only a DPC', 'ventilation alone'], 'Redundancy for the most demanding grade.', 'Combine.'),
    TF('A Type C cavity drain system needs a maintained pump and a backup.', true, 'If the pump fails, water rises behind the membrane.', 'Maintenance.')
  ]),
  lesson('u29l2', 'Details that leak', REF.damp, [
    LS('Where water gets in', 'Most leaks are at **discontinuities**:\n- wall–floor junction (lap the floor membrane up and the wall membrane down by ≥ 150 mm, with a fillet)\n- construction joints and changes of material\n- **service penetrations** (pipes, cables): use puddle flanges or proprietary seals\n- the vault-to-wall junction, under the haunch fill\n- entrances: a step up at the door, a channel drain outside, and the stair well covered or drained\n\nTest: before backfilling, **flood test** horizontal membranes and inspect every lap; photograph everything — it is impossible to see later.'),
    GM('defectq'),
    OR('Order a typical external tanking sequence.', ['prepare and prime the wall surface', 'form fillets at junctions', 'apply the membrane with laps', 'add protection board', 'place drainage layer and land drain', 'backfill in layers'], 'Prepare, seal, protect, drain, cover.')
  ])
]);

unit('u30', 30, 'dur', 'f7', 'Mould, moisture and condensation', 'Where damp comes from, how to measure it, and the physics of dew point on cold stone.', [
  lesson('u30l1', 'Sources and diagnosis', REF.damp, [
    LS('Four sources of damp', '1. **Penetrating** water through walls/vault from outside — patches after rain, tide marks.\n2. **Rising** damp by capillarity — a band near the floor with salts.\n3. **Condensation** — warm moist air on cold surfaces: walls wet all over, worst in summer, mould in corners.\n4. **Construction** moisture — new mortar and stone drying for months (a 0.9 m stone wall can hold hundreds of litres per metre).\n\n**Diagnose** before treating: hygrometer (air RH and temperature), surface thermometer, **calcium carbide** or oven-dry samples for true masonry moisture (electrical meters are fooled by salts), salt analysis, and patience — log over a year.\n\n**Mould** grows when surface RH stays above ~**70–80 %** for days. Keep air RH ≤ 60–65 % for storage (wine likes 60–70 % at 10–14 °C — a balance).'),
    MC('Walls wet all over, worst in summer, with mould in cold corners. Most likely source?', ['condensation', 'rising damp', 'a burst pipe', 'construction moisture'], 'Warm humid summer air meets cool walls.', 'Season.'),
    TF('Electrical moisture meters give reliable readings on salty old walls.', false, 'Salts conduct; use carbide or oven-dry tests.', 'Salts.')
  ]),
  lesson('u30l2', 'Dew point', REF.damp, [
    LS('The dew-point calculation', 'Water condenses on a surface **colder than the dew point** of the air. Magnus formula:\n\nγ = ln(RH/100) + aT/(b + T), **T_d = bγ/(a − γ)**, with a = 17.62, b = 243.12 °C.\n\n**Worked**: summer air at 18 °C, RH 70 %.\n1. ln 0.70 = −0.3567; 17.62 × 18 / 261.12 = 1.2146 → γ = **0.8579**.\n2. T_d = 243.12 × 0.8579 / (17.62 − 0.8579) = **12.4 °C**.\n\nA cellar wall at 11 °C is below that → it will **sweat**. Remedies: don’t ventilate with warm humid air in summer (control the vents, or ventilate at night), **dehumidify**, insulate the inside face only with vapour-open materials and care, keep air moving.'),
    NU('Air 20 °C at 60 % RH. Dew point (°C, 1 dp)?', 12.0, 'γ = ln 0.6 + 17.62 × 20/263.12 = −0.5108 + 1.3393 = 0.8285; T_d = 243.12 × 0.8285 / 16.7915 = 12.0 °C.', 'Magnus.', { tol: 0.15 }),
    NU('Air 12 °C at 85 % RH. Dew point (°C, 1 dp)?', 9.6, 'γ = ln 0.85 + 17.62 × 12/255.12 = −0.1625 + 0.8288 = 0.6663; T_d = 243.12 × 0.6663 / 16.9537 = 9.55 °C.', 'Magnus.', { tol: 0.15 }),
    MC('Wall surface 11 °C, dew point 12.4 °C. What happens?', ['condensation forms on the wall', 'the wall dries', 'nothing', 'the mortar sets faster'], 'Surface below dew point.', 'Compare.')
  ])
]);

unit('u31', 31, 'dur', 'op', 'Inspection, defects and repair', 'Reading cracks, monitoring movement, and repairing stone structures without making them worse.', [
  lesson('u31l1', 'Reading defects', REF.cons, [
    LS('What the cracks say', '| Sign | Likely cause | Seriousness |\n|---|---|---|\n| hairline cracks along joints | shrinkage, thermal | minor; monitor |\n| crack at vault crown along the length, plus at the haunches | **abutments spreading** — hinges forming | serious; engineer now |\n| vault crown dropping, flattening | spread or fill overload | serious |\n| wall bulging inward | earth pressure > capacity, props lost, faces separating | serious |\n| stepped cracks rising to a corner | differential **settlement** | moderate–serious |\n| spalling, powdered stone faces | **salts**, frost, cement pointing trapping water | durability |\n| rust stains + split stones | iron jacking | moderate |\n| white bloom | efflorescence (salts) | cosmetic; tells you water moves |\n\n**Monitor** with tell-tales (crack gauges), dated pencil marks, levels on the crown, plumb lines on walls; record monthly. Width bands: < 1 mm negligible, 1–5 slight, 5–15 moderate, > 15 severe (BRE Digest 251).'),
    GM('defectq'), GM('defectq'),
    MC('A longitudinal crack at the crown of a barrel vault, with others at both haunches, most likely means:', ['the abutments are spreading and hinges are forming', 'shrinkage', 'decorative pattern', 'condensation'], 'The four-hinge mechanism is beginning.', 'Hinges.')
  ]),
  lesson('u31l2', 'Repairs', REF.cons, [
    LS('Repair principles', '- **Diagnose, then remove the cause** (water, overload, lost prop) before repair.\n- **Like for like**: same stone type and bed; lime mortar no stronger than the stone.\n- **Minimum intervention, reversible where possible.**\n- Repointing (Unit 19); **grouting** voids in hearting with lime grout under low pressure; **stitching** cracks with stainless helical bars in bed joints; **piecing-in** (indenting) new stone for decayed blocks.\n- **Spreading vaults**: install **ties** at springing level (Unit 24), or add buttresses/abutment mass; never remove fill from one side.\n- **Bulging walls**: rebuild in sections with temporary support, or tie the faces; restore the props.\n- **Settlement**: underpinning (Unit 15) — engineer-designed.\n- **Salts**: poultice, sacrificial lime render, then fix the water source.\n\nAll structural repairs need an engineer; listed or historic structures need **consent**.'),
    MC('Best first step before repairing a damp, crumbling wall?', ['find and stop the source of water', 'apply cement render', 'paint it waterproof', 'repoint with cement'], 'Remove the cause.', 'Cause first.'),
    TF('Cement pointing on soft limestone often accelerates decay of the stone.', true, 'It is harder and less permeable, so water and salts leave through the stone instead.', 'Sacrificial joints.'),
    GM('mortarq')
  ])
]);

  lesson('u32l2', 'Vault design', REF.cap, [
    LS('Vault schedule', 'Each vault by the Unit 23 method (ULS 1.35G + 1.5Q, fill 1.0 m at 1800 kg/m³, live 2.5 kPa, voussoirs ≈ 250 mm):\n\n' + vt + `\n\n**Great hall, by hand**: R = (6.25 + 2.25)/3 = **2.833 m**; arc **6.12 m**; self ${r(hall.selfW, 1)} + fill ${r(hall.fillW, 1)} = G ${r(hall.selfW + hall.fillW, 1)} kN/m; Q = ${r(hall.Q, 1)}; w_d = (1.35 × ${r(hall.selfW + hall.fillW, 1)} + 1.5 × ${r(hall.Q, 1)}) / 5 = **${r(hall.wd)} kPa**; H = w_d × 25 / (8 × 1.5) = **${r(hall.H, 1)} kN/m**; V = **${r(hall.V, 1)}**. Stress ${r(hall.stress)} MPa ≪ strength. Geometric FS on thickness ${r(0.45 / hall.tMin)} (t_min 0.106R = ${r(hall.tMin)}): adequate only if the haunches are filled solid; the engineer should check the actual thrust line.`),
    NU('Great hall vault: w_d = 44.38 kPa, L 5, f 1.5. H (kN/m, 1 dp)?', 92.5, '44.38 × 25 / 12 = 92.46 kN/m.', 'wL²/8f.', { tol: 0.1 }),
    NU('Great hall arc 6.12 m with 0.25 m target voussoirs. Odd number of voussoirs?', 25, '6.12/0.25 = 24.5 → 25 (odd).', 'Ceil then odd.', { tol: 0.01 }),
    GM('vaultq')

      out.appendChild(pre('VAULT per metre run\n  R ' + f(V.R, 3) + ' m, arc ' + f(V.arc, 3) + ' m, ring ' + f(V.vol, 3) + ' m³/m (' + f(V.tonnes, 2) + ' t)\n  Gk: ring ' + f(V.selfW, 2) + ' + fill ' + f(V.fillW, 2) + ' = ' + f(V.selfW + V.fillW, 2) + ' kN/m; Qk ' + f(V.Q, 2) + '\n  w_d = (1.35Gk + 1.5Qk)/L = ' + f(V.wd, 2) + ' kPa (SLS ' + f(V.ws, 2) + ')\n  H = ' + f(V.H, 2) + ' (SLS ' + f(V.Hs, 2) + '), V = ' + f(V.V, 2) + ' kN/m, stress ' + f(V.stress, 3) + ' MPa\n  t_min 0.106R = ' + f(V.tMin, 3) + ' → geometric FS ' + f(m.t / V.tMin, 2) + '\n\n' +
        'ABUTMENT b = ' + m.b + ' m, h = ' + m.h + ' m\n  W ' + f(A.Wa, 1) + ', N ' + f(A.N, 1) + ' kN/m; Mr ' + f(A.Mr, 1) + ', Mo ' + f(A.Mo, 1) + '\n  overturning FS ' + f(A.FSo, 2) + ' ' + ok(A.FSo >= 2) + ';  sliding FS ' + f(A.FSs, 2) + ' ' + ok(A.FSs >= 1.5) + '\n  e = ' + f(A.e, 3) + ' vs b/6 ' + f(m.b / 6, 3) + ' ' + ok(A.middleThird) + ';  q_max ' + f(A.qmax, 0) + ' kPa\n  minimum width for middle third: ' + f(bmin, 2) + ' m\n\n' +
        'IF TIED instead: ties at ' + m.tie + ' m → ' + f(V.H * m.tie, 1) + ' kN each → steel ' + f(V.H * m.tie * 1000 / 355, 0) + ' mm² at 355 MPa\n' + CAVEAT));
    };
    const fs = [['L', 'span m'], ['f', 'rise m'], ['t', 'ring t m'], ['rho', 'stone kg/m³'], ['fill', 'fill depth m'], ['live', 'live kPa'], ['h', 'abutment h m'], ['b', 'abutment b m'], ['gs', 'abutment γ'], ['tie', 'tie spacing m']];
    body.appendChild(h('div', { class: 'stack' }, h('div', { class: 'sl-grid' }, fs.map(([k, l]) => numIn('vt-' + k, l, m[k], v => { m[k] = v; draw(); }))), out));
    draw();
  });

  lab('drain', 'Drainage slope, inverts and pipe capacity planner', 'drop', 'Lay out a French drain or pipe run: length, gradient, starting invert, pipe size and roughness. See the fall, an invert schedule, Manning full-bore capacity versus your inflow, the sump size and trench stone.', body => {
    const m = { L: 46.4, n: 100, inv: 3.2, D: 0.1, nm: 0.011, Qin: 0.5, mins: 30, tw: 0.3, td: 0.45, step: 5 };
    const out = h('div', { class: 'stack' });
    const draw = () => {
      U.clear(out);
      if (!(m.L > 0 && m.n > 0 && m.D > 0 && m.nm > 0 && m.step > 0)) { out.appendChild(pre('Need positive values.')); return; }
      const S = 1 / m.n, fl = C.fall(m.L, S), M = C.manningFull(m.D, S, m.nm), use = m.Qin / 1000 / M.Q;
      out.appendChild(stats(stat('fall mm', f(fl * 1000, 0)), stat('v m/s', f(M.v, 2)), stat('capacity L/s', f(M.Q * 1000, 2)), stat('used %', f(use * 100, 1))));
      const rows = []; for (let x = 0; x <= m.L + 1e-9; x += m.step) rows.push('  ' + f(x, 1).padStart(6) + ' m   invert ' + f(m.inv - x * S, 3) + ' m below datum → ' + f(m.inv + x * S, 3) + ' depth');
      out.appendChild(pre('gradient 1:' + m.n + ' = ' + f(S * 100, 2) + ' %; fall over ' + m.L + ' m = ' + f(fl, 3) + ' m\nINVERT LEVELS (datum = ground level 0, falling)\n' + rows.slice(0, 40).join('\n') +
        '\n\nMANNING full bore: A ' + f(M.A, 5) + ' m², R ' + f(M.Rh, 4) + ' m, v = R^⅔ S^½ / n = ' + f(M.v, 3) + ' m/s, Q = ' + f(M.Q * 1000, 2) + ' L/s ' + ok(use <= 0.75) + ' (keep ≤ 75 % full)' +
        (M.v < 0.6 ? '\nVelocity below ~0.6 m/s: silt may settle — steepen the fall or rod it regularly.' : '') +
        '\nSUMP for ' + m.Qin + ' L/s over ' + m.mins + ' min: ' + f(C.sumpVol(m.Qin / 1000, m.mins), 2) + ' m³\nTRENCH stone (' + m.tw + ' × ' + m.td + ' m less pipe): ' + f(C.trenchAgg(m.L, m.tw, m.td, m.D), 2) + ' m³\n' + CAVEAT));
    };
    const fs = [['L', 'run length m'], ['n', 'gradient 1 in'], ['inv', 'start invert depth m'], ['D', 'pipe D m'], ['nm', 'Manning n'], ['Qin', 'inflow L/s'], ['mins', 'sump storage min'], ['tw', 'trench width m'], ['td', 'trench depth m'], ['step', 'schedule step m']];
    body.appendChild(h('div', { class: 'stack' }, h('div', { class: 'sl-grid' }, fs.map(([k, l]) => numIn('dr-' + k, l, m[k], v => { m[k] = v; draw(); }))), out));
    draw();
  });

  lab('rooms', 'Room layout and stone estimator', 'map', 'List rooms as w×l×h separated by semicolons (e.g. 4x6x2.5; 5x8x2.5). Set wall thickness and walling type. Get floor area, wall volume, excavation, stone tonnes, mortar and bags of lime — with a plan drawing.', body => {
    const m = { list: '4x6x2.5; 5x8x2.5; 1.5x6x2.2', t: 0.9, kind: 'rubble', rho: 2300, ratio: 2.5 };

    const draw = () => {
      U.clear(out);
      const L = parse(m.list); if (!L.length || !(m.t > 0)) { out.appendChild(pre('Enter at least one room like 4x6x2.5 and a wall thickness.')); return; }

      out.appendChild(stats(stat('floor m²', f(R.floor, 1)), stat('wall m³', f(R.wallV, 1)), stat('stone t', f(W.tonnes, 1)), stat('lime bags', X.bags)));

        '\n\nTOTALS (each room counted as a separate cell — shared walls reduce this)\n  floor ' + f(R.floor, 2) + ' m², wall length ' + f(R.perim, 2) + ' m, wall volume ' + f(R.wallV, 2) + ' m³\n  excavation ' + f(R.excav, 1) + ' m³ in situ, ' + f(R.excav * 1.3, 1) + ' m³ bulked (×1.3 clay)\n  ' + m.kind + ' walling: mortar fraction ' + f(W.mf * 100, 0) + ' %\n  stone incl. 10 % waste ' + f(W.stone, 2) + ' m³ = ' + f(W.tonnes, 1) + ' t\n  wet mortar ' + f(W.mortar, 2) + ' m³ → dry ' + f(X.dry, 2) + ' m³ at 1:' + m.ratio + ': binder ' + f(X.binder, 2) + ' m³ = ' + X.bags + ' × 25 kg, sand ' + f(X.sand, 2) + ' m³ (' + f(X.sandT, 1) + ' t)\n(vaults not included — use the vault lab for ring volumes)'));
      let x = 10, g = ''; const S = 260 / L.reduce((a, r) => a + r.l + 2 * m.t, 0);
      L.forEach(r => { const ww = (r.l + 2 * m.t) * S, hh = (r.w + 2 * m.t) * S; g += '<rect x="' + x.toFixed(1) + '" y="10" width="' + ww.toFixed(1) + '" height="' + hh.toFixed(1) + '" class="g"/><rect x="' + (x + m.t * S).toFixed(1) + '" y="' + (10 + m.t * S).toFixed(1) + '" width="' + (r.l * S).toFixed(1) + '" height="' + (r.w * S).toFixed(1) + '" class="o"/><text x="' + (x + 4).toFixed(1) + '" y="' + (14 + hh / 2).toFixed(1) + '" class="t">' + r.w + '×' + r.l + '</text>'; x += ww; });

      field('walling', select('walling', [['rubble', 'random rubble (30 %)'], ['coursed', 'coursed rubble (20 %)'], ['ashlar', 'ashlar (8 %)']], m.kind, v => { m.kind = v; draw(); }))), out));
    draw();

  lab('bases', 'Measures in decimal, hex and binary', 'num', 'Type a measurement in mm or a stone count (0–255, or 0x.. / 0b..). See it in every base, with the by-hand method, and in inches to the nearest 1/16.', body => {
    const out = h('div', { class: 'stack' });

    const draw = () => {

      out.appendChild(pre('Decimal → hex: ' + v + ' ÷ 16 = ' + hi + ' remainder ' + lo + ' → ' + hi.toString(16).toUpperCase() + lo.toString(16).toUpperCase() + '\nHex → decimal: ' + hi + '×16 + ' + lo + ' = ' + v + '\nDecimal → binary: ' + ([128, 64, 32, 16, 8, 4, 2, 1].filter(p => v & p).join(' + ') || '0') + '\n\nAs millimetres: ' + v + ' mm = ' + f(v / 10, 1) + ' cm = ' + f(v / 25.4, 3) + ' in ≈ ' + frac16(v / 25.4) + ' in\nAs stitches at 2.5 mm: ' + v + ' stitches = ' + f(v * 2.5 / 10, 1) + ' cm of seam\nAs tenths of a mm (stitch-file length): ' + f(v / 10, 1) + ' mm = ' + f(25.4 / (v / 10 || 1), 2) + ' SPI'));

    draw();
  });
})(CG);
