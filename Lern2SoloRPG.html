2, 25]; log = rng.choices(reasons, weights=w, k=400)\nprint('review log of 400:', collections.Counter(log).most_common())", "out": "props                  keep 150 at 25% -> generate  600, review 3.33 h\nflora                  keep  22 at 30% -> generate   74, review 0.41 h\ncharacters (concept)   keep  29 at  8% -> generate  363, review 2.02 h\nicons                  keep  85 at 35% -> generate  243, review 1.35 h\ncreature concepts      keep   2 at 10% -> generate   20, review 0.11 h\ntotal review hours 7.22\nreview log of 400: [('ok', 153), ('off-palette', 67), ('unreadable silhouette', 56), ('anatomy/hands', 53), ('perspective wrong', 35), ('text artefacts', 22), ('too close to a known IP', 14)]"}, "c_pbr": {"lang": "py", "file": "c_pbr.py", "src": "# PBR texture sets: maps, compression formats and memory. ORM packing saves samplers and memory.\nimport rpgkit as K\ndef mb(b): return round(b / 2**20, 2)\nsets = {'separate (BaseColor BC7, Normal BC5, Rough BC1->BC4-ish, Metal, AO)': [(2048, 2048, 'BC7'), (2048, 2048, 'BC5'), (2048, 2048, 'BC1'), (2048, 2048, 'BC1'), (2048, 2048, 'BC1')],\n        'packed (BaseColor BC7, Normal BC5, ORM BC1)': [(2048, 2048, 'BC7'), (2048, 2048, 'BC5'), (2048, 2048, 'BC1')],\n        'packed 1K (hero props only get 2K)': [(1024, 1024, 'BC7'), (1024, 1024, 'BC5'), (1024, 1024, 'BC1')]}\nfor k, v in sets.items(): print('%-70s %d maps %6.2f MB' % (k, len(v), mb(sum(K.tex_bytes(*t) for t in v))))\nprint('uncompressed RGBA8 2K with mips:', mb(K.tex_bytes(2048, 2048, 'RGBA8')), 'MB per map')\n# channel packing demo: R=AO G=Roughness B=Metallic as one byte each\nao, rough, metal = 200, 140, 0\npacked = (ao << 16) | (rough << 8) | metal\nprint('ORM texel', (ao, rough, metal), '-> 0x%06X' % packed, 'bin', format(packed, '024b'))", "out": "separate (BaseColor BC7, Normal BC5, Rough BC1->BC4-ish, Metal, AO)    5 maps  18.67 MB\npacked (BaseColor BC7, Normal BC5, ORM BC1)                            3 maps  13.33 MB\npacked 1K (hero props only get 2K)                                     3 maps   3.33 MB\nuncompressed RGBA8 2K with mips: 21.33 MB per map\nORM texel (200, 140, 0) -> 0xC88C00 bin 110010001000110000000000"}, "c_prompts": {"lang": "py", "file": "c_prompts.py", "src": "# Prompt templating: style bible + asset row -> reproducible prompt, seed and job id for a batch manifest.\nimport hashlib, json\nSTYLE = {'id': 'SALTMARCH_v3', 'look': 'weathered salt-crusted materials, glass-coral accents, overcast teal light, painterly but grounded',\n         'negative': 'text, watermark, logo, modern objects, plastic, signature', 'palette': ['#2F5D62', '#D9CAB3', '#8C5E3C', '#A7D7C5']}\nrows = [('prop', 'brinewick', 'salt cake stack on a crate'), ('prop', 'brinewick', 'tarred rope coil'), ('creature', 'saltmarch', 'shellback crab, front view, T-pose-like neutral stance'),\n        ('character', 'brinewick', 'Odra Venn, cartographer, 50s, oiled hide coat, brass dividers on belt, orthographic turnaround')]\ndef job(kind, region, subject, take):\n    prompt = '%s concept, %s. Style: %s. Palette %s.' % (kind, subject, STYLE['look'], ' '.join(STYLE['palette']))\n    seed = int(hashlib.sha256(('%s|%s|%s' % (STYLE['id'], subject, take)).encode()).hexdigest()[:8], 16)\n    jid = 'JOB_%s_%s_%08X' % (kind[:3].upper(), region[:3].upper(), seed)\n    return {'id': jid, 'seed': seed, 'prompt': prompt, 'negative': STYLE['negative'], 'style': STYLE['id']}\nbatch = [job(k, r, s, t) for k, r, s in rows for t in range(3)]\nprint('jobs', len(batch)); print(json.dumps(batch[0], indent=1)); print('ids:', [b['id'] for b in batch[:6]])\nprint('re-run gives same seed?', job(*rows[0], 0)['seed'] == batch[0]['seed'])", "out": "jobs 12\n{\n \"id\": \"JOB_PRO_BRI_2DF03C10\",\n \"seed\": 770718736,\n \"prompt\": \"prop concept, salt cake stack on a crate. Style: weathered salt-crusted materials, glass-coral accents, overcast teal light, painterly but grounded. Palette #2F5D62 #D9CAB3 #8C5E3C #A7D7C5.\",\n \"negative\": \"text, watermark, logo, modern objects, plastic, signature\",\n \"style\": \"SALTMARCH_v3\"\n}\nids: ['JOB_PRO_BRI_2DF03C10', 'JOB_PRO_BRI_566E2B0C', 'JOB_PRO_BRI_18D0C588', 'JOB_PRO_BRI_778DC878', 'JOB_PRO_BRI_CAC38B0C', 'JOB_PRO_BRI_BF631687']\nre-run gives same seed? True"}, "c_retopo": {"lang": "py", "file": "c_retopo.py", "src": "# Image-to-3D output vs game budget: decimation ratio, LOD chain and bake targets.\ngen = {'shellback crab': 412_000, 'salt cake crate': 96_000, 'Odra Venn (body)': 780_000, 'market awning': 150_000}\nbudget = {'shellback crab': 8_000, 'salt cake crate': 600, 'Odra Venn (body)': 25_000, 'market awning': 1_200}\nfor k, n in gen.items():\n    t = budget[k]; lods = [t, t // 2, t // 4, t // 10]\n    print('%-18s generated %7d tris -> LOD0 %6d (keep %.2f%%), LODs %s; bake normal+AO from the high poly' % (k, n, t, 100 * t / n, lods))\nprint('rule: generated meshes are high-poly sculpt sources, not game meshes; retopo/decimate, UV, bake, then rig if needed.')", "out": "shellback crab     generated  412000 tris -> LOD0   8000 (keep 1.94%), LODs [8000, 4000, 2000, 800]; bake normal+AO from the high poly\nsalt cake crate    generated   96000 tris -> LOD0    600 (keep 0.62%), LODs [600, 300, 150, 60]; bake normal+AO from the high poly\nOdra Venn (body)   generated  780000 tris -> LOD0  25000 (keep 3.21%), LODs [25000, 12500, 6250, 2500]; bake normal+AO from the high poly\nmarket awning      generated  150000 tris -> LOD0   1200 (keep 0.80%), LODs [1200, 600, 300, 120]; bake normal+AO from the high poly\nrule: generated meshes are high-poly sculpt sources, not game meshes; retopo/decimate, UV, bake, then rig if needed."}, "d_scene": {"lang": "py", "file": "d_scene.py", "src": "# Scene budget: Brinewick market at target hardware (mid laptop GPU, 60 fps).\nimport rpgkit as K\nE = [dict(name='architecture kit', tris=1200, instances=180, materials=1, lod_frac=0.3, instanced=True, textures=[(2048, 2048, 'BC7'), (2048, 2048, 'BC5'), (2048, 2048, 'BC1')]),\n     dict(name='props', tris=600, instances=260, materials=1, lod_frac=0.25, instanced=True, textures=[(1024, 1024, 'BC7'), (1024, 1024, 'BC5'), (1024, 1024, 'BC1')] * 6),\n     dict(name='named NPCs', tris=25000, instances=4, materials=4, lod_frac=1.0, textures=[(2048, 2048, 'BC7'), (2048, 2048, 'BC5'), (2048, 2048, 'BC1')] * 4),\n     dict(name='crowd NPCs', tris=9000, instances=12, materials=2, lod_frac=0.5, textures=[(1024, 1024, 'BC7'), (1024, 1024, 'BC5')]),\n     dict(name='terrain', tris=130000, instances=1, materials=4, textures=[(2048, 2048, 'BC7'), (2048, 2048, 'BC5')] * 4),\n     dict(name='glass-coral spire', tris=40000, instances=1, materials=2, textures=[(2048, 2048, 'BC7'), (2048, 2048, 'BC5'), (2048, 2048, 'BC1')])]\nr = K.scene_budget(E, tri_budget=1_500_000, draw_budget=1500, tex_budget_mb=512)\nfor row in r['rows']: print('%-18s tris %8d draws %4d tex %7.2f MB' % row)\nprint('TOTAL tris', r['tris'], 'draws', r['draws'], 'tex MB', r['tex_mb'], 'within budget', r['ok'])", "out": "architecture kit   tris   102600 draws    1 tex   13.33 MB\nprops              tris    68250 draws    1 tex   20.00 MB\nnamed NPCs         tris   100000 draws   16 tex   53.33 MB\ncrowd NPCs         tris    67500 draws   24 tex    2.67 MB\nterrain            tris   130000 draws    4 tex   42.67 MB\nglass-coral spire  tris    40000 draws    2 tex   13.33 MB\nTOTAL tris 508350 draws 48 tex MB 145.33 within budget {'tris': True, 'draws': True, 'tex': True}"}, "e_canon": {"lang": "py", "file": "e_canon.py", "src": "# Canon bible checker: the model's new lore draft vs the canon file. Catches contradictions, unknown names, timeline errors, IP terms.\nimport rpgkit as K\ncanon = '''Odra Venn . home = Brinewick\nOdra Venn . faction = Cartographers' Lodge\nOdra Venn . born = 412\nBrinewick . founded = 300\nLanternback . species = tortoise-barge\nCartographers' Lodge . leader = Odra Venn'''\ndraft = '''Odra Venn . home = Veyl Spire\nOdra Venn . died = 401\nLanternback . species = giant beetle\nCartographers' Lodge . leader = Odra Venn\nHaskel Moor . faction = Brinewick watch\nThe ash storms of Vvardenfell reached the Saltmarch.'''\nbanned = ['Vvardenfell', 'Tamriel', 'Dunmer', 'silt strider', 'Morrowind']\nfor i in K.check_canon(canon, draft, banned): print(i)", "out": "('contradiction', 'Odra Venn', 'home', 'Veyl Spire (canon: Brinewick)')\n('contradiction', 'Lanternback', 'species', 'giant beetle (canon: tortoise-barge)')\n('unknown-entity', 'Haskel Moor', 'faction', 'Brinewick watch')\n('banned-term', 'Vvardenfell', '', '')\n('timeline', 'Odra Venn', 'born>died', '412>401')"}, "e_dialogue": {"lang": "py", "file": "e_dialogue.py", "src": "# Topic-dialogue graph check: which topics can the player ever learn, and does any topic have no answer?\nimport re\nfrom kernel import load\nN = load('npcs.json'); D = load('dialogue.json')['topics']\nlearn = {}\nfor k, n in N.items():\n    for t in re.findall(r'\\[([^\\]]+)\\]', n['greeting']['text']): learn.setdefault(t, []).append('greet:' + k)\nfor topic, es in D.items():\n    for e in es:\n        for t in re.findall(r'\\[([^\\]]+)\\]', e['text']): learn.setdefault(t, []).append('topic:' + topic)\nknown = set(); frontier = [t for t, src in learn.items() if any(s.startswith('greet') for s in src)]\nwhile frontier:\n    t = frontier.pop()\n    if t in known: continue\n    known.add(t); frontier += [x for x, src in learn.items() if 'topic:' + t in src]\nprint('reachable topics:', sorted(known))\nprint('topics with entries but never learnable:', sorted(set(D) - known))\nprint('learnable topics with no entries:', sorted(known - set(D)))\nprint('lines per topic:', {t: len(e) for t, e in D.items()})", "out": "reachable topics: [\"Cartographers' Lodge\", 'Veyl Spire', 'tithe cellar', 'tithe ledger', 'watch']\ntopics with entries but never learnable: []\nlearnable topics with no entries: []\nlines per topic: {\"Cartographers' Lodge\": 3, 'tithe ledger': 2, 'tithe cellar': 1, 'watch': 1, 'Veyl Spire': 1}"}, "e_quest": {"lang": "py", "file": "e_quest.py", "src": "# Quest state machine validation: every stage reachable from 0, finish reachable, journal text present.\nfrom kernel import load\nQ = load('quests.json'); D = load('dialogue.json')['topics']\nfor q, d in Q.items():\n    edges = [(t['from'], t['to'], 'pickup ' + t['item']) for t in d['triggers']]\n    for topic, es in D.items():\n        for e in es:\n            ef = e.get('effects', {})\n            if ef.get('quest', [None])[0] == q:\n                c = e.get('cond', {}); src = c.get('quest', [q, None])[1]\n                frm = [src] if src is not None else ([s for s in [0, 10] if s < c.get('quest_below', [q, 999])[1]] if 'quest_below' in c else [0, 10, 20])\n                for f in frm: edges.append((f, ef['quest'][1], 'ask ' + topic))\n    reach = {0}; changed = True\n    while changed:\n        changed = False\n        for a, b, why in edges:\n            if a in reach and b not in reach: reach.add(b); changed = True\n    print('quest', q, 'edges:'); [print('  %3s -> %3s via %s' % e) for e in sorted(edges)]\n    print('reachable', sorted(reach), 'finish', d['finished'], 'reachable?', d['finished'] in reach)\n    print('stages with journal text', sorted(int(s) for s in d['stages']), 'missing text', sorted(reach - {0} - {int(s) for s in d['stages']}))", "out": "quest tithe edges:\n    0 ->  10 via ask tithe ledger\n    0 ->  20 via pickup tithe_ledger\n    0 -> 100 via ask tithe ledger\n   10 ->  10 via ask tithe ledger\n   10 ->  20 via pickup tithe_ledger\n   10 -> 100 via ask tithe ledger\n   20 -> 100 via ask tithe ledger\nreachable [0, 10, 20, 100] finish 100 reachable? True\nstages with journal text [10, 20, 100] missing text []"}, "f_cast": {"lang": "py", "file": "f_cast.py", "src": "# Cast design: each voice as a vector (pitch Hz, rate wpm, breathiness 0-1, roughness 0-1, accent id).\n# Distinctness check: normalised distance between every pair must exceed a threshold.\nimport itertools, math\ncast = {'VC_odra_alto_dry': (190, 140, 0.2, 0.3, 1), 'VC_tamsin_bright_fast': (230, 175, 0.3, 0.1, 2), 'VC_haskel_low_slow': (100, 120, 0.1, 0.6, 1),\n        'VC_ilvo_warm_old': (120, 125, 0.5, 0.5, 3), 'VC_guard2_low': (105, 125, 0.15, 0.55, 1)}\nscale = (60, 25, 0.3, 0.3, 1)\ndef dist(a, b): return math.sqrt(sum(((x - y) / s) ** 2 if i < 4 else (0 if x == y else 1) for i, (x, y, s) in enumerate(zip(a, b, scale))))\nfor a, b in itertools.combinations(cast, 2):\n    d = dist(cast[a], cast[b]); print('%-22s %-22s %5.2f %s' % (a, b, d, 'TOO SIMILAR' if d < 1.0 else ''))", "out": "VC_odra_alto_dry       VC_tamsin_bright_fast   1.99 \nVC_odra_alto_dry       VC_haskel_low_slow      2.00 \nVC_odra_alto_dry       VC_ilvo_warm_old        2.04 \nVC_odra_alto_dry       VC_guard2_low           1.76 \nVC_tamsin_bright_fast  VC_haskel_low_slow      3.71 \nVC_tamsin_bright_fast  VC_ilvo_warm_old        3.25 \nVC_tamsin_bright_fast  VC_guard2_low           3.44 \nVC_haskel_low_slow     VC_ilvo_warm_old        1.74 \nVC_haskel_low_slow     VC_guard2_low           0.32 TOO SIMILAR\nVC_ilvo_warm_old       VC_guard2_low           1.57 "}, "f_lipsync": {"lang": "py", "file": "f_lipsync.py", "src": "# Viseme timing mock (Rhubarb-style shapes A-H, X rest) for one line, and the keyframe track an engine would read.\nimport rpgkit as K, json\nline = 'Bring the ledger to me.'\nv = K.visemes(line); print('duration', K.line_duration(line), 's; keys', len(v))\nfor t, s in v: print('  %.3f %s' % (t, s))\ntrack = {'line': 'VO_odra_ledger_03', 'fps': 30, 'keys': [[round(t * 30), s] for t, s in v]}\nprint(json.dumps(track))\nprint('NOTE: letters are not phonemes. A real pipeline aligns audio (forced alignment) or analyses the waveform.')", "out": "duration 2.25 s; keys 14\n  0.000 A\n  0.111 B\n  0.222 C\n  0.333 B\n  0.778 C\n  0.889 H\n  1.000 C\n  1.111 B\n  1.333 C\n  1.444 B\n  1.667 E\n  1.778 A\n  1.889 C\n  2.000 X\n{\"line\": \"VO_odra_ledger_03\", \"fps\": 30, \"keys\": [[0, \"A\"], [3, \"B\"], [7, \"C\"], [10, \"B\"], [23, \"C\"], [27, \"H\"], [30, \"C\"], [33, \"B\"], [40, \"C\"], [43, \"B\"], [50, \"E\"], [53, \"A\"], [57, \"C\"], [60, \"X\"]]}\nNOTE: letters are not phonemes. A real pipeline aligns audio (forced alignment) or analyses the waveform."}, "f_pipeline": {"lang": "py", "file": "f_pipeline.py", "src": "# Script CSV -> voiced lines -> lipsync -> engine manifest. TTS is mocked: no TTS engine is installed on the build box,\n# so placeholder WAVs are rendered with the right length, and every row records which engine/voice WOULD render it.\nimport csv, io, json, os, tempfile, rpgkit as K\nCSV = '''line_id,speaker,voice,emotion,direction,text\nVO_odra_greet_01,odra,VC_odra_alto_dry,weary,\"diegetic, mid-distance, slightly amused\",Another wanderer off the Lanternback.\nVO_odra_ledger_02,odra,VC_odra_alto_dry,relieved,\"quiet, close, warmer at 'Welcome'\",\"You found it. The ink is ruined in places, but the dates hold. Welcome, Chainbearer.\"\nVO_haskel_watch_01,haskel,VC_haskel_low_slow,stern,\"projected across a market, slow\",The Brinewick watch. We keep the peace.\nVO_tamsin_greet_01,tamsin,VC_tamsin_bright_fast,cheerful,\"fast, sales patter, smile in the voice\",\"Salt cakes, gaff hooks, torches. Mind the tithe cellar if you're going below.\"\n'''\nout = tempfile.mkdtemp(); man = {}; rows = list(csv.DictReader(io.StringIO(CSV)))\nfor r in rows:\n    name, path = K.asset_name('voice', 'dialogue', 'Brinewick', r['line_id'][3:], 1)\n    wav = os.path.join(out, name + '.wav'); dur = K.placeholder_wav(wav, r['text'])\n    man[r['line_id']] = {'asset': path, 'dur': dur, 'visemes': len(K.visemes(r['text'])), 'voice': r['voice'], 'emotion': r['emotion'], 'engine': 'MOCK(placeholder tones)', 'status': 'needs-real-render'}\n    print('%-20s %-22s %-9s %5.2fs %3d visemes -> %s' % (r['line_id'], r['voice'], r['emotion'], dur, man[r['line_id']]['visemes'], path))\nprint('manifest entries', len(man), 'total s', round(sum(m['dur'] for m in man.values()), 2))\nprint(json.dumps(man['VO_odra_greet_01']))", "out": "VO_odra_greet_01     VC_odra_alto_dry       weary      2.25s  26 visemes -> res://assets/audio/vo/dialogue/brinewick/VO_DIA_BRI_odra_greet_01_01.ogg\nVO_odra_ledger_02    VC_odra_alto_dry       relieved   6.25s  56 visemes -> res://assets/audio/vo/dialogue/brinewick/VO_DIA_BRI_odra_ledger_02_01.ogg\nVO_haskel_watch_01   VC_haskel_low_slow     stern      3.05s  26 visemes -> res://assets/audio/vo/dialogue/brinewick/VO_DIA_BRI_haskel_watch_01_01.ogg\nVO_tamsin_greet_01   VC_tamsin_bright_fast  cheerful   5.45s  47 visemes -> res://assets/audio/vo/dialogue/brinewick/VO_DIA_BRI_tamsin_greet_01_01.ogg\nmanifest entries 4 total s 17.0\n{\"asset\": \"res://assets/audio/vo/dialogue/brinewick/VO_DIA_BRI_odra_greet_01_01.ogg\", \"dur\": 2.25, \"visemes\": 26, \"voice\": \"VC_odra_alto_dry\", \"emotion\": \"weary\", \"engine\": \"MOCK(placeholder tones)\", \"status\": \"needs-real-render\"}"}, "f_vo": {"lang": "py", "file": "f_vo.py", "src": "# VO planner: slice and full-game numbers (minutes, characters, cost, review time, storage).\nimport rpgkit as K\nfor name, lines, wpl, extra in [('vertical slice', 12, 18, {}), ('one town', 900, 14, {}),\n                                 ('full game (Morrowind-like scale, all voiced)', 40000, 16, {}),\n                                 ('full game, greetings+quest lines only', 6000, 12, {}), ('full game, 3 takes, pricier voice', 40000, 16, {'takes': 3, 'price_per_1k_chars': 0.6})]:\n    p = K.vo_plan(lines, wpl, **extra)\n    print('%-46s lines %6d words %7d min %8.1f gen chars %9d cost $%9.2f review %6.1f h wav %7.1f MB' % (name, lines, p['words'], p['minutes'], p['gen_chars'], p['cost'], p['review_hours'], p['wav_mb']))\nprint('assumptions: 150 wpm, 6 chars/word, 2 takes, $0.30 per 1k chars (illustrative), review 3x realtime, 48 kHz 16-bit mono')", "out": "vertical slice                                 lines     12 words     216 min      1.4 gen chars      2592 cost $     0.78 review    0.1 h wav     7.9 MB\none town                                       lines    900 words   12600 min     84.0 gen chars    151200 cost $    45.36 review    4.2 h wav   461.4 MB\nfull game (Morrowind-like scale, all voiced)   lines  40000 words  640000 min   4266.7 gen chars   7680000 cost $  2304.00 review  213.3 h wav 23437.5 MB\nfull game, greetings+quest lines only          lines   6000 words   72000 min    480.0 gen chars    864000 cost $   259.20 review   24.0 h wav  2636.7 MB\nfull game, 3 takes, pricier voice              lines  40000 words  640000 min   4266.7 gen chars  11520000 cost $  6912.00 review  213.3 h wav 23437.5 MB\nassumptions: 150 wpm, 6 chars/word, 2 takes, $0.30 per 1k chars (illustrative), review 3x realtime, 48 kHz 16-bit mono"}, "f_vo_qc": {"lang": "py", "file": "f_vo_qc.py", "src": "# VO QC on rendered files: length vs script expectation, clipping, leading/trailing silence. Bad takes get flagged.\nimport rpgkit as K, wave, struct, os, tempfile, math\nd = tempfile.mkdtemp()\ndef qc(path, text):\n    with wave.open(path) as w:\n        n = w.getnframes(); r = w.getframerate(); s = struct.unpack('<%dh' % n, w.readframes(n))\n    dur = n / r; exp = K.line_duration(text); clip = sum(1 for x in s if abs(x) >= 32700) / n\n    lead = next((i for i, x in enumerate(s) if abs(x) > 300), n) / r\n    flags = []\n    if abs(dur - exp) / exp > 0.35: flags.append('length %.2fs vs %.2fs' % (dur, exp))\n    if clip > 0.001: flags.append('clipping %.1f%%' % (100 * clip))\n    if lead > 0.5: flags.append('lead silence %.2fs' % lead)\n    return dur, flags\ntext = 'The brine eats the old roads.'\np1 = os.path.join(d, 'good.wav'); K.placeholder_wav(p1, text)\np2 = os.path.join(d, 'clipped.wav')\nwith wave.open(p2, 'wb') as w:\n    w.setnchannels(1); w.setsampwidth(2); w.setframerate(16000)\n    w.writeframes(b''.join(struct.pack('<h', max(-32767, min(32767, int(60000 * math.sin(i / 5))))) for i in range(16000 * 4)))\np3 = os.path.join(d, 'late.wav')\nwith wave.open(p3, 'wb') as w:\n    w.setnchannels(1); w.setsampwidth(2); w.setframerate(16000)\n    w.writeframes(b'\\0\\0' * 16000 + b''.join(struct.pack('<h', int(8000 * math.sin(i / 7))) for i in range(16000)))\nfor p in (p1, p2, p3): print(os.path.basename(p), qc(p, text))", "out": "good.wav (2.65, [])\nclipped.wav (4.0, ['length 4.00s vs 2.65s', 'clipping 63.3%'])\nlate.wav (2.0, ['lead silence 1.00s'])"}, "g_save": {"lang": "py", "file": "g_save.py", "src": "# Versioned saves: v1 -> v2 migration (adds 'reputation' map and renames 'equip' to 'equipped').\nimport json\nfrom kernel import Game\ng = Game(); g.run(['go north', 'go east', 'talk odra']); blob = g.save(); d = json.loads(blob)\ndef migrate(d):\n    if d['v'] == 1:\n        s = d['s']; s['equipped'] = {'weapon': s.pop('equip')}; s.setdefault('reputation', s.pop('rep', {})); d['v'] = 2\n    return d\nm = migrate(json.loads(blob)); print('v1 keys', sorted(d['s'])[:8], '...'); print('v2', m['v'], 'equipped', m['s']['equipped'], 'has rep?', 'rep' in m['s'], 'reputation', m['s']['reputation'])\nprint('migration idempotent:', migrate(json.loads(json.dumps(m))) == m)", "out": "v1 keys ['bounty', 'cell', 'day', 'dead', 'disp', 'equip', 'factions', 'gold'] ...\nv2 2 equipped {'weapon': None} has rep? False reputation {}\nmigration idempotent: True"}, "g_systems": {"lang": "py", "file": "g_systems.py", "src": "# Systems maths the director specifies: hit chance, expected damage per round, barter prices, persuasion.\ndef hit(skill, defence): return max(5, min(95, 75 - defence // 2 + (skill - 30) // 2))\nfor sk in (30, 50, 70):\n    print('skill', sk, 'vs rat(def30) %d%%, crab(def45) %d%%' % (hit(sk, 30), hit(sk, 45)), '| exp dmg/round gaff(4-8)=%.2f' % (hit(sk, 45) / 100 * 6))\nfor disp in (20, 40, 60, 80): print('disposition', disp, 'price of 24-value hook:', round(24 * (1.5 - disp / 100)))\nfor disp in (20, 50, 80):\n    p = min(1, (40 + disp // 2) / 100); print('admire success at disp %d: %d%%, expected change %+.2f' % (disp, p * 100, p * 5 - (1 - p) * 3))", "out": "skill 30 vs rat(def30) 60%, crab(def45) 53% | exp dmg/round gaff(4-8)=3.18\nskill 50 vs rat(def30) 70%, crab(def45) 63% | exp dmg/round gaff(4-8)=3.78\nskill 70 vs rat(def30) 80%, crab(def45) 73% | exp dmg/round gaff(4-8)=4.38\ndisposition 20 price of 24-value hook: 31\ndisposition 40 price of 24-value hook: 26\ndisposition 60 price of 24-value hook: 22\ndisposition 80 price of 24-value hook: 17\nadmire success at disp 20: 50%, expected change +1.00\nadmire success at disp 50: 65%, expected change +2.20\nadmire success at disp 80: 80%, expected change +3.40"}, "h_crime": {"lang": "py", "file": "h_crime.py", "src": "# Crime and schedules in the kernel: steal in front of the owner, guard response, and NPC locations over a day.\nfrom kernel import Game\ng = Game(seed=3)\nfor l in g.run(['go north', 'take salt_cake', 'talk haskel', 'pay', 'talk haskel']): print(l)\ng = Game()\nfor h in (8, 18, 21, 2):\n    g.s['hour'] = h\n    for cell in ('brinewick_dock', 'brinewick_market', 'lodge_hall'):\n        g.s['cell'] = cell; print('%02d:00 %-17s %s' % (h, cell, sorted(g.npcs_here())))", "out": "> go north\n== Brinewick Market (day 1, 08:00) ==\nAwnings of dyed sailcloth. A glass-coral spire leans over the stalls.\nItems: pressed salt cake\nPeople: Tamsin Pell, Brother Haskel\nExits: south, east, down\n> take salt_cake\nStolen! Seen by Tamsin Pell, Brother Haskel. Bounty now 40.\n> talk haskel\nBrother Haskel: \"Pay 40 or come with me.\"\n> pay\nPaid 40. Gold 0.\n> talk haskel\nBrother Haskel: \"Keep your hands where the [watch] can see them.\"\n  (VO missing: VO_haskel_greet_01 — subtitles only)\n  Topics: watch\n08:00 brinewick_dock    ['ilvo']\n08:00 brinewick_market  ['haskel', 'tamsin']\n08:00 lodge_hall        ['odra']\n18:00 brinewick_dock    ['ilvo']\n18:00 brinewick_market  ['haskel', 'tamsin']\n18:00 lodge_hall        ['odra']\n21:00 brinewick_dock    ['ilvo', 'tamsin']\n21:00 brinewick_market  ['haskel', 'odra']\n21:00 lodge_hall        []\n02:00 brinewick_dock    ['ilvo', 'tamsin']\n02:00 brinewick_market  ['haskel', 'odra']\n02:00 lodge_hall        []"}, "h_loc": {"lang": "py", "file": "h_loc.py", "src": "# Localisation table: string IDs, missing translations, and text expansion that breaks UI boxes.\ntable = {'UI_INV_TITLE': {'en': 'Inventory', 'de': 'Inventar', 'fr': 'Inventaire'},\n         'UI_TRAVEL_FARE': {'en': 'Fare: {gold} pieces', 'de': 'Fahrpreis: {gold} Stück', 'fr': ''},\n         'VO_odra_greet_01': {'en': 'Another wanderer off the Lanternback.', 'de': 'Noch ein Wanderer vom Laternenrücken.', 'fr': 'Encore un vagabond descendu du Dos-Lanterne.'}}\nbox = {'UI_INV_TITLE': 12, 'UI_TRAVEL_FARE': 22, 'VO_odra_greet_01': 48}\nfor k, v in table.items():\n    for lang, s in v.items():\n        flag = 'MISSING' if not s else ('OVERFLOW %d>%d' % (len(s), box[k]) if len(s) > box[k] else '')\n        print('%-18s %s %-48s %s' % (k, lang, s, flag))\n    if v['en'].count('{') != max(v['de'].count('{'), 0): print('  placeholder mismatch in', k)\nprint('expansion vs en:', {l: round(sum(len(v[l]) for v in table.values() if v[l]) / sum(len(v['en']) for v in table.values() if v[l]), 2) for l in ('de', 'fr')})", "out": "UI_INV_TITLE       en Inventory                                        \nUI_INV_TITLE       de Inventar                                         \nUI_INV_TITLE       fr Inventaire                                       \nUI_TRAVEL_FARE     en Fare: {gold} pieces                              \nUI_TRAVEL_FARE     de Fahrpreis: {gold} Stück                          OVERFLOW 23>22\nUI_TRAVEL_FARE     fr                                                  MISSING\nVO_odra_greet_01   en Another wanderer off the Lanternback.            \nVO_odra_greet_01   de Noch ein Wanderer vom Laternenrücken.            \nVO_odra_greet_01   fr Encore un vagabond descendu du Dos-Lanterne.     \nexpansion vs en: {'de': 1.05, 'fr': 1.17}"}, "h_navmesh": {"lang": "py", "file": "h_navmesh.py", "src": "# NPC pathing on a grid (navmesh stand-in): A* from the dock to the lodge door around market stalls.\nimport heapq\nG = ['##########', '#D.....#.#', '#.##.#.#.#', '#.#..#...#', '#.#.##.#L#', '#........#', '##########']\ndef find(c): return next((r, x) for r, row in enumerate(G) for x, ch in enumerate(row) if ch == c)\ns, t = find('D'), find('L')\ndef astar(s, t):\n    h = lambda p: abs(p[0] - t[0]) + abs(p[1] - t[1]); q = [(h(s), 0, s, None)]; came = {}\n    while q:\n        f, g, p, par = heapq.heappop(q)\n        if p in came: continue\n        came[p] = par\n        if p == t: break\n        for d in ((1, 0), (-1, 0), (0, 1), (0, -1)):\n            n = (p[0] + d[0], p[1] + d[1])\n            if G[n[0]][n[1]] != '#' and n not in came: heapq.heappush(q, (g + 1 + h(n), g + 1, n, p))\n    path = [t]\n    while came[path[-1]]: path.append(came[path[-1]])\n    return path[::-1], len(came)\npath, expanded = astar(s, t); print('path length', len(path) - 1, 'expanded', expanded)\ng = [list(r) for r in G]\nfor r, c in path[1:-1]: g[r][c] = '*'\nprint('\\n'.join(''.join(r) for r in g))", "out": "path length 10 expanded 17\n##########\n#D*****#.#\n#.##.#*#.#\n#.#..#***#\n#.#.##.#L#\n#........#\n##########"}, "h_streaming": {"lang": "py", "file": "h_streaming.py", "src": "# Cell streaming: the world is a grid of cells; keep a radius loaded around the player and count memory as they move.\ncell_mb = {(x, y): 40 + 15 * ((x * 7 + y * 3) % 4) for x in range(-4, 5) for y in range(-4, 5)}\ndef loaded(px, py, r): return {(x, y) for (x, y) in cell_mb if abs(x - px) <= r and abs(y - py) <= r}\npath = [(0, 0), (1, 0), (2, 0), (2, 1), (3, 1)]; prev = set()\nfor p in path:\n    L = loaded(*p, 1); ins, outs = L - prev, prev - L\n    print('player', p, 'loaded', len(L), 'cells', sum(cell_mb[c] for c in L), 'MB | stream in', len(ins), 'out', len(outs)); prev = L\nprint('radius 2 at origin:', len(loaded(0, 0, 2)), 'cells', sum(cell_mb[c] for c in loaded(0, 0, 2)), 'MB')", "out": "player (0, 0) loaded 9 cells 540 MB | stream in 9 out 0\nplayer (1, 0) loaded 9 cells 585 MB | stream in 3 out 3\nplayer (2, 0) loaded 9 cells 570 MB | stream in 3 out 3\nplayer (2, 1) loaded 9 cells 555 MB | stream in 3 out 3\nplayer (3, 1) loaded 9 cells 540 MB | stream in 3 out 3\nradius 2 at origin: 25 cells 1540 MB"}, "i_cost": {"lang": "py", "file": "i_cost.py", "src": "# Budget and schedule for a solo director: AI spend by category and calendar time at 30 h/week.\nimport rpgkit as K\nfor name, a in [('vertical slice', (600, 0.04, 2000 * 6 * 2, 0.30, 15, 3, 20, 1.5)), ('one-region game', (9000, 0.04, 60000 * 6 * 2, 0.30, 200, 3, 300, 1.5))]:\n    print(name, K.ai_cost(*a))\ntasks = {'design+writing': 260, 'art direction+curation': 420, '3D cleanup/retopo': 600, 'VO direction+QC': 180, 'engineering': 700, 'QA+polish': 350, 'marketing': 80}\nh = sum(tasks.values()); print('one-region game hours', h, '-> weeks at 30 h/wk:', round(h / 30, 1), '(~%.1f years)' % (h / 30 / 48))", "out": "vertical slice {'images': 24.0, 'tts': 7.2, 'llm': 45.0, 'gpu': 30.0, 'total': 106.2}\none-region game {'images': 360.0, 'tts': 216.0, 'llm': 600.0, 'gpu': 450.0, 'total': 1626.0}\none-region game hours 2590 -> weeks at 30 h/wk: 86.3 (~1.8 years)"}, "i_perf": {"lang": "py", "file": "i_perf.py", "src": "# Frame budget: milliseconds per system at 30 and 60 fps on the target machine (numbers are a planning sheet, not measurements).\nsplit = {'render (GPU-bound share)': 0.45, 'animation+skinning': 0.12, 'physics': 0.08, 'AI/schedules/nav': 0.10, 'scripts/quests/dialogue': 0.05, 'audio': 0.04, 'streaming/IO': 0.06, 'UI': 0.04, 'headroom': 0.06}\nfor fps in (30, 60):\n    ms = 1000 / fps; print('%d fps = %.2f ms per frame' % (fps, ms)); [print('   %-26s %5.2f ms' % (k, v * ms)) for k, v in split.items()]\nprint('shares sum to', round(sum(split.values()), 2))", "out": "30 fps = 33.33 ms per frame\n   render (GPU-bound share)   15.00 ms\n   animation+skinning          4.00 ms\n   physics                     2.67 ms\n   AI/schedules/nav            3.33 ms\n   scripts/quests/dialogue     1.67 ms\n   audio                       1.33 ms\n   streaming/IO                2.00 ms\n   UI                          1.33 ms\n   headroom                    2.00 ms\n60 fps = 16.67 ms per frame\n   render (GPU-bound share)    7.50 ms\n   animation+skinning          2.00 ms\n   physics                     1.33 ms\n   AI/schedules/nav            1.67 ms\n   scripts/quests/dialogue     0.83 ms\n   audio                       0.67 ms\n   streaming/IO                1.00 ms\n   UI                          0.67 ms\n   headroom                    1.00 ms\nshares sum to 1.0"}, "i_qa": {"lang": "py", "file": "i_qa.py", "src": "# Automated QA: a random-input bot plays the slice 300 times; we count crashes and soft-locks (quest unfinishable).\nimport random, traceback\nfrom kernel import Game\nVERBS = ['look', 'go north', 'go south', 'go east', 'go west', 'go up', 'go down', 'take torch', 'take tithe_ledger', 'take salt_cake', 'light', 'attack',\n         'cast kindle', 'cast mend', 'cast spark_dart', 'talk odra', 'talk tamsin', 'talk haskel', 'talk ilvo', \"ask odra Cartographers' Lodge\", 'ask odra tithe ledger',\n         'buy tamsin torch', 'rest 3', 'pay', 'travel veyl_spire', 'equip gaff_hook', 'persuade odra admire', 'persuade tamsin bribe', 'inv', 'journal']\ncrash = 0; finished = 0; ledger_gone = 0\nfor run in range(300):\n    r = random.Random(run); g = Game(seed=run)\n    try:\n        g.run([r.choice(VERBS) for _ in range(120)]); finished += g.stage('tithe') == 100\n        if g.stage('tithe') in (10, 20) and not g.s['inv'].get('tithe_ledger') and 'tithe_ledger' in g.s['taken'].get('tithe_cellar_vault', []): ledger_gone += 1\n    except Exception:\n        crash += 1\n        if crash == 1: traceback.print_exc()\nprint('runs 300 crashes', crash, 'quest finished by chance', finished, 'soft-locks (ledger lost)', ledger_gone)", "out": "runs 300 crashes 0 quest finished by chance 1 soft-locks (ledger lost) 0"}, "j_hexflags": {"lang": "py", "file": "j_hexflags.py", "src": "# Bases in game data: NPC flag bytes, colour IDs and form IDs in decimal, hex and binary.\nimport rpgkit as K\nnames = ['quest', 'hostile', 'merchant', 'essential', 'guard', 'ferry', 'trainer', 'vampire']\nfor who, f in [('Odra', {'quest': 1, 'essential': 1}), ('Tamsin', {'merchant': 1}), ('Haskel', {'guard': 1, 'essential': 1}), ('Ilvo', {'ferry': 1, 'merchant': 1})]:\n    v, hx, b = K.hex_flags(f, names); print('%-7s %3d %s %s' % (who, v, hx, b))\nfor c in ['#2F5D62', '#D9CAB3']:\n    r, g, b = (int(c[i:i + 2], 16) for i in (1, 3, 5)); print(c, '->', (r, g, b), [format(x, '08b') for x in (r, g, b)])\nfid = 0x0001A3F2; print('form id 0x%08X = %d; plugin index byte 0x%02X, local id 0x%06X' % (fid, fid, fid >> 24, fid & 0xFFFFFF))", "out": "Odra      9 0x09 00001001\nTamsin    4 0x04 00000100\nHaskel   24 0x18 00011000\nIlvo     36 0x24 00100100\n#2F5D62 -> (47, 93, 98) ['00101111', '01011101', '01100010']\n#D9CAB3 -> (217, 202, 179) ['11011001', '11001010', '10110011']\nform id 0x0001A3F2 = 107506; plugin index byte 0x00, local id 0x01A3F2"}, "z_slice": {"lang": "py", "file": "z_slice.py", "src": "# Capstone: build the VO manifest (placeholder WAVs + viseme timings), then play the vertical slice.\nimport os, json, hashlib, tempfile\nimport rpgkit as K\nfrom kernel import Game, load\n\n# 1. script CSV rows come straight from the content: every greeting and topic line\nlines = [(n['greeting']['id'], k, n['greeting']['text']) for k, n in load('npcs.json').items()]\nfor topic, entries in load('dialogue.json')['topics'].items():\n    for e in entries: lines.append((e['id'], e['npc'], e['text']))\npitch = {'odra': 190, 'tamsin': 230, 'haskel': 100, 'ilvo': 120, '*': 150}\nout = os.path.join(tempfile.gettempdir(), 'solorpg_vo'); os.makedirs(out, exist_ok=True)\nmanifest = {}\nfor lid, npc, text in lines:\n    clean = text.replace('[', '').replace(']', '')\n    path = os.path.join(out, lid + '.wav'); dur = K.placeholder_wav(path, clean, pitch[npc])\n    manifest[lid] = {'file': lid + '.wav', 'dur': dur, 'visemes': K.visemes(clean), 'placeholder': True}\nprint('VO lines built:', len(manifest), ' total seconds:', round(sum(m['dur'] for m in manifest.values()), 2))\nprint('example visemes VO_odra_greet_01:', manifest['VO_odra_greet_01']['visemes'][:6], '...')\n\n# 2. play the slice\ng = Game(seed=7, vo_manifest=manifest)\nscript = ['look', 'talk ilvo', 'go north', 'talk tamsin', 'buy tamsin torch', 'buy tamsin gaff_hook', 'equip gaff_hook',\n          'go east', 'talk odra', \"ask odra Cartographers' Lodge\", 'ask odra tithe ledger', 'go west',\n          'go down', 'look', 'light', 'attack', 'take torch', 'go down', 'cast spark_dart shellback', 'take tithe_ledger',\n          'take copper_ring', 'go up', 'go up', 'go east', 'talk odra', 'ask odra tithe ledger', 'journal', 'inv', 'go west', 'go south', 'talk ilvo', 'travel veyl_spire']\nfor l in g.run(script): print(l)\nblob = g.save(); g2 = Game(vo_manifest=manifest); g2.load_save(blob)\nprint('save bytes', len(blob), 'sha1', hashlib.sha1(blob.encode()).hexdigest()[:12], 'reload quest stage', g2.stage('tithe'), 'factions', list(g2.s['factions']))", "out": "VO lines built: 12  total seconds: 69.4\nexample visemes VO_odra_greet_01: [(0.0, 'D'), (0.089, 'B'), (0.179, 'E'), (0.268, 'B'), (0.447, 'C'), (0.536, 'B')] ...\n> look\n== Brinewick Dock (day 1, 08:00) ==\nSalt-crusted planks over green brine. The Lanternback rests here, its pavilion lamps dimmed.\nItems: coil of tarred rope\nPeople: Ilvo the Lampkeeper\nExits: north\n> talk ilvo\nIlvo the Lampkeeper: \"The Lanternback leaves when you pay. Twenty-five pieces to [Veyl Spire].\"\n  (VO VO_ilvo_greet_01.wav, 5.05s, 48 viseme keys, voice VC_ilvo_warm_old, placeholder)\n  Topics: Veyl Spire\n> go north\n== Brinewick Market (day 1, 08:00) ==\nAwnings of dyed sailcloth. A glass-coral spire leans over the stalls.\nItems: pressed salt cake\nPeople: Tamsin Pell, Brother Haskel\nExits: south, east, down\n> talk tamsin\nTamsin Pell: \"Salt cakes, gaff hooks, torches. Mind the [tithe cellar] if you're going below.\"\n  (VO VO_tamsin_greet_01.wav, 5.45s, 47 viseme keys, voice VC_tamsin_bright_fast, placeholder)\n  Topics: Veyl Spire | tithe cellar\n> buy tamsin torch\nBought reed torch for 2 (disposition 40). Gold 38.\n> buy tamsin gaff_hook\nBought salt-iron gaff hook for 26 (disposition 40). Gold 12.\n> equip gaff_hook\nEquipped salt-iron gaff hook\n> go east\n== Cartographers' Lodge (day 1, 08:00) ==\nMaps on oiled hide cover every wall. Brass dividers hang from hooks.\nPeople: Odra Venn\nExits: west\n> talk odra\nOdra Venn: \"Another wanderer off the Lanternback. If you can read a map, the [Cartographers' Lodge] may have use for you.\"\n  (VO VO_odra_greet_01.wav, 7.85s, 71 viseme keys, voice VC_odra_alto_dry, placeholder)\n  Topics: Veyl Spire | tithe cellar | Cartographers' Lodge\n> ask odra Cartographers' Lodge\nOdra Venn: \"We chart the drowned roads before the brine eats them. Join, and your first errand is the [tithe ledger].\"\n  (VO VO_odra_lodge_01.wav, 7.85s, 61 viseme keys, voice VC_odra_alto_dry, placeholder)\n> ask odra tithe ledger\nOdra Venn: \"The old tithe ledger proves which shoals the Lodge charted first. It is somewhere in the flooded [tithe cellar]. Bring it to me.\"\n  (VO VO_odra_ledger_01.wav, 9.45s, 78 viseme keys, voice VC_odra_alto_dry, placeholder)\n  [Journal updated: The Tithe Ledger]\n> go west\n== Brinewick Market (day 1, 08:00) ==\nAwnings of dyed sailcloth. A glass-coral spire leans over the stalls.\nItems: pressed salt cake\nPeople: Tamsin Pell, Brother Haskel\nExits: south, east, down\n> go down\n== Old Tithe Cellar, Stair (day 1, 08:00) ==\nBrine has crept up the steps. Something scratches below.\nIt is too dark to see much. (Light a torch or cast Kindle.)\n> look\n== Old Tithe Cellar, Stair (day 1, 08:00) ==\nBrine has crept up the steps. Something scratches below.\nIt is too s on oiled hide cover every wall. Brass dividers hang from hooks.\nPeople: Odra Venn\nExits: west\n> talk odra\nOdra Venn: \"Another wanderer off the Lanternback. If you can read a map, the [Cartographers' Lodge] may have use for you.\"\n  (VO VO_odra_greet_01.wav, 7.85s, 71 viseme keys, voice VC_odra_alto_dry, placeholder)\n  Topics: Veyl Spire | tithe cellar | Cartographers' Lodge | tithe ledger\n> ask odra tithe ledger\nOdra Venn: \"You found it. The ink is ruined in places, but the dates hold. Welcome, Chainbearer.\"\n  (VO VO_odra_ledger_02.wav, 6.25s, 56 viseme keys, voice VC_odra_alto_dry, placeholder)\n  [Journal updated: The Tithe Ledger]\n  [Joined Cartographers' Lodge as Chainbearer]\n  [+30 gold]\n> journal\n  Day 1: Odra Venn of the Cartographers' Lodge wants the old tithe ledger from the flooded cellar under Brinewick market.\n  Day 1: I have the tithe ledger. I should bring it to Odra Venn.\n  Day 1: I gave Odra the ledger and joined the Cartographers' Lodge as a Chainbearer.\n> inv\nGold 42; reed torch x2, salt-iron gaff hook x1, pressed salt cake x1, verdigris copper ring x1, Lodge surveyor's badge x1\n> go west\n== Brinewick Market (day 1, 08:00) ==\nAwnings of dyed sailcloth. A glass-coral spire leans over the stalls.\nItems: pressed salt cake\nPeople: Tamsin Pell, Brother Haskel\nExits: south, east, down\n> go south\n== Brinewick Dock (day 1, 08:00) ==\nSalt-crusted planks over green brine. The Lanternback rests here, its pavilion lamps dimmed.\nItems: coil of tarred rope\nPeople: Ilvo the Lampkeeper\nExits: north\n> talk ilvo\nIlvo the Lampkeeper: \"The Lanternback leaves when you pay. Twenty-five pieces to [Veyl Spire].\"\n  (VO VO_ilvo_greet_01.wav, 5.05s, 48 viseme keys, voice VC_ilvo_warm_old, placeholder)\n  Topics: Veyl Spire | tithe cellar | Cartographers' Lodge | tithe ledger\n> travel veyl_spire\nYou ride the Lanternback for 6 hours (fare 25).\n== Veyl Spire Landing (day 1, 14:00) ==\nThe end of this vertical slice: a coral landing under a white spire. (Content not built yet.)\nExits: none\nsave bytes 1018 sha1 65532db52d33 reload quest stage 100 factions ['lodge']"}, "rpgkit": {"lang": "py", "file": "rpgkit.py", "src": "\"\"\"rpgkit: the production planners used throughout Lern2SoloRPG.\nPure standard-library Python. Every formula here is mirrored in the app's labs\nand checked against hand-worked examples in tests/test_rpgkit.py.\"\"\"\nimport math, re, wave, struct, json\n\ndef rn(x, d=0):\n    \"\"\"Round half up (same as JavaScript Math.round), so the app's labs agree to the last digit.\"\"\"\n    k = 10 ** d\n    v = math.floor(x * k + 0.5) / k\n    return int(v) if d == 0 else v\n\n\n# ---------------------------------------------------------------- 1. asset list\n# Rules of thumb (per unit of the brief). They are a STARTING estimate a director\n# edits, not a law. Each rule is (category, item, per, count).\nRULES = [\n    ('terrain', 'heightmap tile set', 'region', 1),\n    ('terrain', 'PBR ground material', 'biome', 6),\n    ('terrain', 'rock / cliff mesh', 'biome', 4),\n    ('flora', 'plant / shrub mesh', 'biome', 8),\n    ('flora', 'tree mesh', 'biome', 3),\n    ('architecture', 'modular kit piece', 'culture', 40),\n    ('props', 'unique town prop', 'town', 30),\n    ('props', 'shared generic prop', 'game', 120),\n    ('dungeon', 'dungeon kit piece', 'dungeon_style', 35),\n    ('characters', 'body base', 'race', 2),\n    ('characters', 'head / face preset', 'race', 6),\n    ('characters', 'outfit', 'faction', 3),\n    ('characters', 'common outfit', 'game', 10),\n    ('creatures', 'creature mesh+rig', 'creature', 1),\n    ('creatures', 'creature animation', 'creature', 12),\n    ('creatures', 'creature sound', 'creature', 6),\n    ('items', 'weapon model', 'weapon_class_tier', 1),\n    ('items', 'armour piece', 'armor_set', 5),\n    ('items', 'misc item / ingredient', 'game', 60),\n    ('ui', 'inventory icon', 'item', 1),\n    ('ui', 'HUD / menu screen', 'game', 14),\n    ('vfx', 'spell effect', 'spell_school', 6),\n    ('vfx', 'environment effect', 'biome', 3),\n    ('audio', 'music cue (explore)', 'region', 2),\n    ('audio', 'music cue (town)', 'town', 1),\n    ('audio', 'music cue (combat)', 'game', 4),\n    ('audio', 'stinger', 'game', 12),\n    ('audio', 'ambience loop', 'biome', 2),\n    ('audio', 'foley sound', 'game', 150),\n    ('animation', 'humanoid animation', 'game', 90),\n    ('writing', 'quest', 'quest', 1),\n    ('writing', 'book / lore text', 'region', 8),\n    ('vo', 'voiced NPC (named)', 'named_npc', 1),\n    ('data', 'loot table', 'dungeon', 2),\n    ('data', 'encounter table', 'biome', 1),\n    ('data', 'faction record', 'faction', 1),\n    ('maps', 'region map', 'region', 1),\n]\n\ndef brief_units(b):\n    \"\"\"Turn a GDD brief into the unit counts the rules multiply.\"\"\"\n    items = b['weapon_classes'] * b['weapon_tiers'] + b['armor_sets'] * 5 + 60\n    return {\n        'game': 1, 'region': b['regions'], 'biome': b['regions'] * b['biomes_per_region'],\n        'culture': b['cultures'], 'town': b['towns'], 'dungeon_style': b['dungeon_styles'],\n        'dungeon': b['dungeons'], 'race': b['races'], 'faction': b['factions'],\n        'creature': b['creatures'], 'weapon_class_tier': b['weapon_classes'] * b['weapon_tiers'],\n        'armor_set': b['armor_sets'], 'item': items, 'spell_school': b['spell_schools'],\n        'quest': b['quests'], 'named_npc': b['named_npcs'],\n    }\n\ndef asset_list(b):\n    u = brief_units(b); rows = []\n    for cat, item, per, n in RULES:\n        rows.append((cat, item, per, n, u[per], n * u[per]))\n    return rows\n\ndef asset_totals(b):\n    t = {}\n    for cat, item, per, n, k, tot in asset_list(b): t[cat] = t.get(cat, 0) + tot\n    return t\n\n# ---------------------------------------------------------------- 2. scene budget\nBPP = {'BC1': 0.5, 'BC3': 1.0, 'BC5': 1.0, 'BC7': 1.0, 'RGBA8': 4.0}\ndef tex_bytes(w, h, fmt, mips=True):\n    b = w * h * BPP[fmt]\n    return b * 4 / 3 if mips else b\n\ndef scene_budget(entries, tri_budget, draw_budget, tex_budget_mb):\n    \"\"\"entries: dicts name, tris, instances, materials, lod_frac (share of instances at LOD0;\n    the rest drawn at 25% triangles), textures=[(w,h,fmt), ...] (unique per asset).\"\"\"\n    tris = draws = 0; tex = 0.0; rows = []\n    for e in entries:\n        lf = e.get('lod_frac', 1.0); n = e['instances']\n        t = e['tris'] * (n * lf + n * (1 - lf) * 0.25)\n        d = n * e['materials'] if not e.get('instanced') else e['materials']\n        tb = sum(tex_bytes(w, h, f) for w, h, f in e.get('textures', []))\n        tris += t; draws += d; tex += tb; rows.append((e['name'], rn(t), d, rn(tb / 2**20, 2)))\n    mb = tex / 2**20\n    return {'rows': rows, 'tris': rn(tris), 'draws': draws, 'tex_mb': rn(mb, 2),\n            'ok': {'tris': tris <= tri_budget, 'draws': draws <= draw_budget, 'tex': mb <= tex_budget_mb}}\n\n# ---------------------------------------------------------------- 3. VO planner\ndef vo_plan(lines, words_per_line, wpm=150, chars_per_word=6.0, takes=2.0,\n            price_per_1k_chars=0.30, review_x=3.0, sample_rate=48000, bits=16, channels=1):\n    words = lines * words_per_line\n    minutes = words / wpm\n    chars = words * chars_per_word\n    gen_chars = chars * takes\n    cost = gen_chars / 1000 * price_per_1k_chars\n    review_h = minutes * review_x / 60\n    bytes_ = minutes * 60 * sample_rate * bits / 8 * channels\n    return {'words': words, 'minutes': rn(minutes, 2), 'chars': rn(chars), 'gen_chars': rn(gen_chars),\n            'cost': rn(cost, 2), 'review_hours': rn(review_h, 2), 'wav_mb': rn(bytes_ / 2**20, 1)}\n\n# ---------------------------------------------------------------- 4. canon bible checker\nFACT = re.compile(r\"^\\s*(?P<s>[A-Z][\\w' -]*?)\\s*\\.\\s*(?P<a>[a-z_]+)\\s*=\\s*(?P<v>.+?)\\s*$\")\ndef parse_facts(text):\n    out = []\n    for ln in text.strip().splitlines():\n        m = FACT.match(ln)\n        if m: out.append((m['s'].strip(), m['a'], m['v'].strip()))\n    return out\n\nSINGLE = {'born', 'died', 'home', 'leader', 'faction', 'species', 'capital', 'founded', 'sex', 'age', 'colour', 'rank'}\ndef check_canon(canon_text, draft_text, banned=()):\n    canon = parse_facts(canon_text); draft = parse_facts(draft_text)\n    known = {s for s, _, _ in canon}; idx = {}\n    for s, a, v in canon: idx.setdefault((s, a), set()).add(v)\n    issues = []\n    for s, a, v in draft:\n        if s not in known: issues.append(('unknown-entity', s, a, v))\n        elif a in SINGLE and (s, a) in idx and v not in idx[(s, a)]:\n            issues.append(('contradiction', s, a, v + ' (canon: ' + '/'.join(sorted(idx[(s, a)])) + ')'))\n    low = draft_text.lower()\n    for w in banned:\n        if w.lower() in low: issues.append(('banned-term', w, '', ''))\n    # order check: founded/born years must not be after died\n    yrs = {}\n    for s, a, v in canon + draft:\n        if a in ('born', 'died', 'founded', 'fell') and v.lstrip('-').isdigit(): yrs.setdefault(s, {})[a] = int(v)\n    for s, d in yrs.items():\n        if 'born' in d and 'died' in d and d['born'] > d['died']: issues.append(('timeline', s, 'born>died', '%d>%d' % (d['born'], d['died'])))\n        if 'founded' in d and 'fell' in d and d['founded'] > d['fell']: issues.append(('timeline', s, 'founded>fell', '%d>%d' % (d['founded'], d['fell'])))\n    return issues\n\n# ---------------------------------------------------------------- 5. naming convention\nPREFIX = {'static_mesh': 'SM', 'skeletal_mesh': 'SK', 'texture': 'T', 'material': 'M', 'animation': 'A',\n          'sound': 'SFX', 'voice': 'VO', 'music': 'MUS', 'icon': 'ICO', 'vfx': 'FX'}\nEXT = {'static_mesh': 'glb', 'skeletal_mesh': 'glb', 'texture': 'png', 'material': 'tres', 'animation': 'glb',\n       'sound': 'ogg', 'voice': 'ogg', 'music': 'ogg', 'icon': 'png', 'vfx': 'tscn'}\nDIR = {'static_mesh': 'meshes', 'skeletal_mesh': 'meshes', 'texture': 'textures', 'material': 'materials', 'animation': 'anims',\n       'sound': 'audio/sfx', 'voice': 'audio/vo', 'music': 'audio/music', 'icon': 'ui/icons', 'vfx': 'vfx'}\ndef slug(s): return re.sub(r'[^a-z0-9]+', '_', s.lower()).strip('_')\ndef asset_name(kind, cat, region, name, variant=1, suffix=''):\n    parts = [PREFIX[kind], cat.upper()[:3], region.upper()[:3], slug(name), '%02d' % variant]\n    n = '_'.join(parts) + (('_' + suffix) if suffix else '')\n    return n, 'res://assets/%s/%s/%s/%s.%s' % (DIR[kind], slug(cat), slug(region), n, EXT[kind])\nNAME_RE = re.compile(r'^(SM|SK|T|M|A|SFX|VO|MUS|ICO|FX)_[A-Z]{3}_[A-Z]{3}_[a-z0-9_]+?_\\d{2}(_[A-Za-z0-9]+)?$')\ndef valid_name(n): return bool(NAME_RE.match(n))\n\n# ---------------------------------------------------------------- 6. placeholder VO + visemes\n# Letter -> viseme class (Rhubarb-style shapes A..H, X = rest). Crude by design: it is a\n# timing MOCK so the slice plays without a TTS engine. A real pipeline uses phonemes.\nVIS = {}\nfor ch in 'mbp': VIS[ch] = 'A'\nfor ch in 'kgnszdtjyhc': VIS[ch] = 'B'\nfor ch in 'ei': VIS[ch] = 'C'\nfor ch in 'a': VIS[ch] = 'D'\nfor ch in 'o': VIS[ch] = 'E'\nfor ch in 'uw': VIS[ch] = 'F'\nfor ch in 'fv': VIS[ch] = 'G'\nfor ch in 'l': VIS[ch] = 'H'\nfor ch in 'rqx': VIS[ch] = 'B'\ndef line_duration(text, wpm=150):\n    w = len(re.findall(r\"[A-Za-z']+\", text))\n    return rn(w * 60 / wpm + 0.25, 3)   # + 0.25 s breath/tail\n\ndef visemes(text, wpm=150):\n    \"\"\"Return [(t_start, shape)], merging repeats, ending in rest X.\"\"\"\n    dur = line_duration(text, wpm) - 0.25\n    letters = [c for c in text.lower() if c.isalpha()]\n    if not letters: return [(0.0, 'X')]\n    step = dur / len(letters); out = []\n    for i, c in enumerate(letters):\n        s = VIS.get(c, 'B')\n        if not out or out[-1][1] != s: out.append((rn(i * step, 3), s))\n    out.append((rn(dur, 3), 'X'))\n    return out\n\ndef placeholder_wav(path, text, pitch_hz=140, wpm=150, rate=16000):\n    \"\"\"A tone burst per word with silences: obviously fake, correct length, plays everywhere.\"\"\"\n    dur = line_duration(text, wpm); n = int(dur * rate)\n    words = max(1, len(re.findall(r\"[A-Za-z']+\", text))); per = (dur - 0.25) / words\n    frames = bytearray()\n    for i in range(n):\n        t = i / rate; k = int(t / per) if per > 0 else 0; inword = k < words and (t - k * per) < per * 0.8\n        v = 0.25 * math.sin(2 * math.pi * pitch_hz * (1 + 0.04 * (k % 3)) * t) if inword else 0.0\n        frames += struct.pack('<h', int(v * 32767))\n    with wave.open(path, 'wb') as w:\n        w.setnchannels(1); w.setsampwidth(2); w.setframerate(rate); w.writeframes(bytes(frames))\n    return dur\n\n# ---------------------------------------------------------------- 7. schedule / cost helpers\ndef ai_cost(images, img_price, tts_chars, tts_price_1k, llm_mtok, llm_price_mtok, gpu_hours, gpu_price):\n    parts = {'images': images * img_price, 'tts': tts_chars / 1000 * tts_price_1k,\n             'llm': llm_mtok * llm_price_mtok, 'gpu': gpu_hours * gpu_price}\n    parts = {k: rn(v, 2) for k, v in parts.items()}; parts['total'] = rn(sum(parts.values()), 2)\n    return parts\n\ndef curation_yield(needed, keep_rate, review_sec):\n    \"\"\"How many generations to make and how long reviewing them takes.\"\"\"\n    gens = math.ceil(needed / keep_rate - 1e-9)   # guard float noise: 175/0.35 is 500.0000000001\n    return gens, rn(gens * review_sec / 3600, 2)\n\ndef hex_flags(flags, names):\n    \"\"\"Pack named boolean flags into a byte: bit i = names[i].\"\"\"\n    v = 0\n    for i, n in enumerate(names):\n        if flags.get(n): v |= 1 << i\n    return v, '0x%02X' % v, format(v, '08b')", "out": ""}, "kernel": {"lang": "py", "file": "kernel.py", "src": "\"\"\"kernel: a tiny data-driven RPG runtime for the Lern2SoloRPG vertical slice.\nIt loads JSON content (world, NPCs, topic dialogue, quests), runs commands, and\nplays voice lines from a VO manifest (placeholder WAVs + viseme timings when no\nTTS engine is installed). Standard library only. This is a teaching kernel that\nmirrors what a Godot project would do with scenes, autoloads and resources.\"\"\"\nimport json, os, random, re\n\nHERE = os.path.dirname(os.path.abspath(__file__))\ndef load(name, base=None):\n    with open(os.path.join(base or os.path.join(HERE, 'content'), name)) as f: return json.load(f)\n\nclass Game:\n    def __init__(self, seed=7, content=None, vo_manifest=None):\n        c = content or os.path.join(HERE, 'content')\n        self.W = load('world.json', c); self.N = load('npcs.json', c)\n        self.D = load('dialogue.json', c)['topics']; self.Q = load('quests.json', c)\n        self.vo = vo_manifest or {}\n        self.rng = random.Random(seed)\n        self.s = {'cell': self.W['start'], 'hour': self.W['start_hour'], 'day': 1, 'gold': 40,\n                  'hp': 30, 'hp_max': 30, 'mp': 20, 'mp_max': 20, 'inv': {}, 'equip': None,\n                  'spells': ['kindle', 'mend', 'spark_dart'], 'quests': {}, 'journal': [],\n                  'factions': {}, 'rep': {}, 'topics': [], 'bounty': 0, 'lit': False,\n                  'disp': {k: v['disposition'] for k, v in self.N.items()},\n                  'taken': {}, 'dead': {}}\n        self.out = []\n\n    # ---------- helpers\n    def say(self, *a): self.out.append(' '.join(str(x) for x in a))\n    def cell(self, k=None): return self.W['cells'][k or self.s['cell']]\n    def npcs_here(self):\n        h = self.s['hour']; res = []\n        for k, n in self.N.items():\n            for a, b, where in n['schedule']:\n                inside = (a <= h < b) if a < b else (h >= a or h < b)\n                if inside and where == self.s['cell']: res.append(k); break\n        return res\n    def creatures_here(self):\n        dead = self.s['dead'].get(self.s['cell'], [])\n        return [c for c in self.cell().get('creatures', []) if c not in dead]\n    def advance(self, hours):\n        self.s['hour'] += hours\n        while self.s['hour'] >= 24: self.s['hour'] -= 24; self.s['day'] += 1\n    def add(self, item, n=1): self.s['inv'][item] = self.s['inv'].get(item, 0) + n\n    def learn_topics(self, text):\n        for t in re.findall(r'\\[([^\\]]+)\\]', text):\n            if t not in self.s['topics']: self.s['topics'].append(t)\n    def stage(self, q): return self.s['quests'].get(q, 0)\n    def set_stage(self, q, st):\n        if st <= self.stage(q): return\n        self.s['quests'][q] = st; txt = self.Q[q]['stages'][str(st)]\n        self.s['journal'].append('Day %d: %s' % (self.s['day'], txt)); self.say('  [Journal updated: %s]' % self.Q[q]['name'])\n    def play_vo(self, line_id, speaker):\n        v = self.vo.get(line_id)\n        if v: self.say('  (VO %s, %.2fs, %d viseme keys, voice %s%s)' % (v['file'], v['dur'], len(v['visemes']), self.N[speaker]['voice'], ', placeholder' if v.get('placeholder') else ''))\n        else: self.say('  (VO missing: %s — subtitles only)' % line_id)\n\n    # ---------- commands\n    def look(self):\n        c = self.cell(); self.say('== %s (day %d, %02d:00) ==' % (c['name'], self.s['day'], self.s['hour'])); self.say(c['desc'])\n        if c.get('dark') and not self.s['lit']: self.say('It is too dark to see much. (Light a torch or cast Kindle.)'); return\n        items = [i for i in c.get('items', []) if i not in self.s['taken'].get(self.s['cell'], [])]\n        items += [i for i in c.get('owned_items', {}) if i not in self.s['taken'].get(self.s['cell'], [])]\n        if items: self.say('Items:', ', '.join(self.W['items'][i]['name'] for i in items))\n        n = self.npcs_here()\n        if n: self.say('People:', ', '.join(self.N[k]['name'] for k in n))\n        cr = self.creatures_here()\n        if cr: self.say('Hostile:', ', '.join(self.W['creatures'][k]['name'] for k in cr))\n        self.say('Exits:', ', '.join(c['exits']) or 'none')\n    def go(self, d):\n        c = self.cell()\n        if d not in c['exits']: self.say(\"You can't go\", d); return\n        if self.creatures_here() and d != 'up': self.say('Something blocks the way!'); return\n        self.s['cell'] = c['exits'][d]; self.s['lit'] = self.s['lit'] and self.cell().get('dark', False); self.advance(0); self.look()\n    def take(self, item):\n        c = self.cell(); k = self.s['cell']\n        if c.get('dark') and not self.s['lit']: self.say('You fumble in the dark.'); return\n        if item in c.get('items', []) and item not in self.s['taken'].get(k, []):\n            self.s['taken'].setdefault(k, []).append(item); self.add(item); self.say('Taken:', self.W['items'][item]['name'])\n            for q, Qd in self.Q.items():\n                for tr in Qd['triggers']:\n                    if tr['on'] == 'pickup' and tr['item'] == item and self.stage(q) == tr['from']: self.set_stage(q, tr['to'])\n            return\n        own = c.get('owned_items', {})\n        if item in own and item not in self.s['taken'].get(k, []):\n            self.s['taken'].setdefault(k, []).append(item); self.add(item)\n            seen = [n for n in self.npcs_here() if n == own[item] or self.N[n].get('guard')]\n            if seen:\n                fine = self.W['items'][item]['value'] * 5 + 10; self.s['bounty'] += fine\n                self.s['disp'][own[item]] = max(0, self.s['disp'][own[item]] - 20)\n                self.say('Stolen! Seen by %s. Bounty now %d.' % (', '.join(self.N[n]['name'] for n in seen), self.s['bounty']))\n            else: self.say('You pocket it unseen.')\n            return\n        self.say('No', item, 'here.')\n    def light(self):\n        if self.s['inv'].get('torch'): self.s['lit'] = True; self.say('The reed torch catches. Shadows pull back.'); self.look()\n        else: self.say('You have nothing to light.')\n    def cast(self, sp, target=None):\n        S = self.W['spells'][sp]\n        if self.s['mp'] < S['cost']: self.say('Not enough magicka.'); return\n        self.s['mp'] -= S['cost']\n        if S['effect'] == 'light': self.s['lit'] = True; self.say('Kindle: a cold blue light hangs over your shoulder.'); self.look()\n        elif S['effect'] == 'heal': self.s['hp'] = min(self.s['hp_max'], self.s['hp'] + S['amount']); self.say('Mend: health %d/%d' % (self.s['hp'], self.s['hp_max']))\n        elif S['effect'] == 'fire': self.attack(target, spell=S)\n    def attack(self, target=None, spell=None):\n        cr = self.creatures_here()\n        if not cr: self.say('Nothing to fight.'); return\n        k = target if target in cr else cr[0]; C = self.W['creatures'][k]; hp = C['hp']; rnd = 0\n        weapon = self.W['items'].get(self.s['equip'] or '', {}).get('damage', [1, 4])\n        while hp > 0 and self.s['hp'] > 0:\n            rnd += 1\n            if spell and rnd == 1:\n                d = self.rng.randint(*spell['damage']) * C.get('fire_weak', 1); hp -= d; self.say('  Spark Dart hits the %s for %d.' % (C['name'], d))\n            else:\n                chance = 75 - C['defence'] // 2\n                if self.rng.randint(1, 100) <= chance:\n                    d = self.rng.randint(*weapon); hp -= d; self.say('  You hit the %s for %d (hit chance %d%%).' % (C['name'], d, chance))\n                else: self.say('  You miss (hit chance %d%%).' % chance)\n            if hp > 0:\n                d = self.rng.randint(*C['damage']); self.s['hp'] -= d; self.say('  The %s hits you for %d. Health %d.' % (C['name'], d, self.s['hp']))\n        if self.s['hp'] <= 0: self.say('You fall. (Load your last save.)'); return\n        self.s['dead'].setdefault(self.s['cell'], []).append(k); self.say('The %s dies after %d rounds.' % (C['name'], rnd))\n        for item, n in self.W['loot'][C['loot']]:\n            if n: self.add(item, n); self.say('  Loot:', self.W['items'][item]['name'])\n    def equip(self, item):\n        if self.s['inv'].get(item): self.s['equip'] = item; self.say('Equipped', self.W['items'][item]['name'])\n    def buy(self, npc, item):\n        M = self.N[npc].get('merchant', {}); price = round(M[item] * (1.5 - self.s['disp'][npc] / 100))\n        if self.s['gold'] < price: self.say('Too expensive (%d).' % price); return\n        self.s['gold'] -= price; self.add(item); self.say('Bought %s for %d (disposition %d). Gold %d.' % (self.W['items'][item]['name'], price, self.s['disp'][npc], self.s['gold']))\n    def persuade(self, npc, how):\n        d = self.s['disp'][npc]\n        if how == 'bribe':\n            if self.s['gold'] < 10: return self.say('Not enough gold.')\n            self.s['gold'] -= 10; delta = 8\n        else:\n            ok = self.rng.randint(1, 100) <= 40 + d // 2; delta = (5 if how == 'admire' else 6) if ok else -3\n        self.s['disp'][npc] = max(0, min(100, d + delta)); self.say('%s %s: disposition %d -> %d' % (how, self.N[npc]['name'], d, self.s['disp'][npc]))\n    def cond_ok(self, c):\n        c = c or {}\n        if 'faction' in c and c['faction'] not in self.s['factions']: return False\n        if 'not_faction' in c and c['not_faction'] in self.s['factions']: return False\n        if 'has' in c and not self.s['inv'].get(c['has']): return False\n        if 'quest' in c and self.stage(c['quest'][0]) != c['quest'][1]: return False\n        if 'quest_below' in c and self.stage(c['quest_below'][0]) >= c['quest_below'][1]: return False\n        return True\n    def talk(self, npc):\n        if npc not in self.npcs_here(): self.say('%s is not here.' % npc); return\n        if self.N[npc].get('guard') and self.s['bounty']:\n            self.say('%s: \"Pay %d or come with me.\"' % (self.N[npc]['name'], self.s['bounty'])); return\n        g = self.N[npc]['greeting']; self.say('%s: \"%s\"' % (self.N[npc]['name'], g['text'])); self.play_vo(g['id'], npc); self.learn_topics(g['text'])\n        self.say('  Topics:', ' | '.join(self.s['topics']))\n    def ask(self, npc, topic):\n        if npc not in self.npcs_here() or topic not in self.s['topics']: self.say('(no such topic here)'); return\n        for e in self.D.get(topic, []):\n            if e['npc'] in (npc, '*') and self.cond_ok(e.get('cond')):\n                self.say('%s: \"%s\"' % (self.N[npc]['name'], e['text'])); self.play_vo(e['id'], npc); self.learn_topics(e['text'])\n                ef = e.get('effects', {})\n                if 'quest' in ef: self.set_stage(*ef['quest'])\n                if 'take' in ef: self.s['inv'].pop(ef['take'], None)\n                if 'join' in ef: self.s['factions'][ef['join']] = 0; self.say('  [Joined %s as %s]' % (self.W['factions'][ef['join']]['name'], self.W['factions'][ef['join']]['ranks'][0]))\n                if 'give' in ef: self.add(ef['give'])\n                if 'gold' in ef: self.s['gold'] += ef['gold']; self.say('  [+%d gold]' % ef['gold'])\n                if 'rep' in ef: self.s['rep'][ef['rep'][0]] = self.s['rep'].get(ef['rep'][0], 0) + ef['rep'][1]\n                return\n        self.say('%s: \"I know nothing about that.\"' % self.N[npc]['name'])\n    def pay_bounty(self):\n        if self.s['gold'] >= self.s['bounty']: self.s['gold'] -= self.s['bounty']; self.say('Paid %d. Gold %d.' % (self.s['bounty'], self.s['gold'])); self.s['bounty'] = 0\n    def travel(self, dest):\n        here = self.cell().get('travel')\n        for a, b, fare, hrs in self.W['travel']['routes']:\n            if a == here and b == dest:\n                if self.s['gold'] < fare: return self.say('Ilvo: \"Twenty-five, friend.\"')\n                self.s['gold'] -= fare; self.advance(hrs); self.s['cell'] = self.W['travel_cells'][b]\n                self.say('You ride the %s for %d hours (fare %d).' % (self.W['travel']['operator'], hrs, fare)); return self.look()\n        self.say('No route.')\n    def rest(self, h):\n        if self.creatures_here(): return self.say('You cannot rest with enemies nearby.')\n        self.advance(h); self.s['hp'] = min(self.s['hp_max'], self.s['hp'] + 2 * h); self.s['mp'] = min(self.s['mp_max'], self.s['mp'] + 3 * h)\n        self.say('Rested %dh. Now day %d %02d:00. HP %d MP %d.' % (h, self.s['day'], self.s['hour'], self.s['hp'], self.s['mp']))\n    def journal(self):\n        for j in self.s['journal']: self.say('  ' + j)\n    def inventory(self):\n        self.say('Gold %d; ' % self.s['gold'] + ', '.join('%s x%d' % (self.W['items'][k]['name'], v) for k, v in self.s['inv'].items() if v))\n    def save(self): return json.dumps({'v': 1, 's': self.s, 'rng': self.rng.getstate()[1][0]}, sort_keys=True)\n    def load_save(self, blob):\n        d = json.loads(blob); assert d['v'] == 1; self.s = d['s']\n\n    def run(self, cmds):\n        for c in cmds:\n            self.say('> ' + c); p = c.split(' ', 1); v = p[0]; a = p[1] if len(p) > 1 else ''\n            if v == 'look': self.look()\n            elif v == 'go': self.go(a)\n            elif v == 'take': self.take(a)\n            elif v == 'light': self.light()\n            elif v == 'cast': x = a.split(); self.cast(x[0], x[1] if len(x) > 1 else None)\n            elif v == 'attack': self.attack(a or None)\n            elif v == 'equip': self.equip(a)\n            elif v == 'buy': n, i = a.split(); self.buy(n, i)\n            elif v == 'persuade': n, how = a.split(); self.persuade(n, how)\n            elif v == 'talk': self.talk(a)\n            elif v == 'ask': n, t = a.split(' ', 1); self.ask(n, t)\n            elif v == 'pay': self.pay_bounty()\n            elif v == 'travel': self.travel(a)\n            elif v == 'rest': self.rest(int(a))\n            elif v == 'journal': self.journal()\n            elif v == 'inv': self.inventory()\n            else: self.say('?')\n        o = self.out; self.out = []; return o", "out": ""}};

/* pipe-table support for lesson text */
(function () {
  if (U.rich.__tables) return;
  const base = U.rich;
  const isTable = b => { const L = b.trim().split('\n'); return L.length >= 2 && L.every(l => /^\s*\|.*\|\s*$/.test(l)) && /^\s*\|[\s:\-|]+\|\s*$/.test(L[1]); };
  const cells = l => l.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => c.trim());
  U.rich = function (t, cls) {
    const blocks = String(t || '').trim().split(/\n\s*\n/);
    if (!blocks.some(isTable)) return base(t, cls);
    const box = U.h('div', { class: cls || 'body' });
    for (const b of blocks) {
      if (isTable(b)) {
        const L = b.trim().split('\n'); const wrap = U.h('div', { style: 'overflow-x:auto;margin:8px 0' });
        const tb = U.h('table', { style: 'border-collapse:collapse;font-size:0.92em;min-width:60%' });
        const tr = U.h('tr'); cells(L[0]).forEach(c => tr.appendChild(U.h('th', { style: 'border:1px solid currentColor;padding:4px 8px;text-align:left;opacity:.95', html: U.inline(c) }))); tb.appendChild(U.h('thead', {}, tr));
        const body = U.h('tbody');
        L.slice(2).forEach(l => { const r = U.h('tr'); cells(l).forEach(c => r.appendChild(U.h('td', { style: 'border:1px solid currentColor;padding:4px 8px', html: U.inline(c) }))); body.appendChild(r); });
        tb.appendChild(body); wrap.appendChild(tb); box.appendChild(wrap);
      } else { const sub = base(b, cls); while (sub.firstChild) box.appendChild(sub.firstChild); }
    }
    return box;
  };
  U.rich.__tables = true;
})();

  return { k: 'stackfig', items };
};
const PXO = (name, cap) => term(CG.PX[name].out, cap || 'Output of ex/' + CG.PX[name].file);
CG.H.PX = PX; CG.H.PXO = PXO;
CG.H.PY = (text, cap) => code(text, cap, 'py');

/* Python syntax colours (the base highlighter knows C-family languages only) */
const V = CG.V, hl0 = V.highlight;
const PYK = new Set('False None True and as assert break class continue def del elif else except finally for from global if import in is lambda not or pass raise return try while with yield print range len zip enumerate np cv2 self'.split(' '));
V.highlight = function (line, lang, state) {
  if (lang !== 'py') return hl0(line, lang, state);
  const out = []; let i = 0; const n = line.length;
  const push = (t, c) => out.push([t, c || null]);
  while (i < n) {
    const c = line[i], rest = line.slice(i); let m;
    if (c === '#') { push(rest, 'syn-com'); break; }
    if (c === '"' || c === "'") { let j = i + 1; while (j < n && line[j] !== c) { if (line[j] === '\\') j++; j++; } push(line.slice(i, j + 1), 'syn-str'); i = j + 1; continue; }
    if ((m = /^\d[\w.]*/.exec(rest)) && !/\w/.test(line[i - 1] || '')) { push(m[0], 'syn-num'); i += m[0].length; continue; }
    if ((m = /^[A-Za-z_]\w*/.exec(rest))) { push(m[0], PYK.has(m[0]) ? 'syn-kw' : null); i += m[0].length; continue; }
    push(c); i++;
  }
  return out;
};

/* pix: a small image drawn as a grid of grey cells with the numbers written in.
   o = {m: [[...]], hl: [[r, c], ...], tone, label, max} */
V.KINDS.pix = function (o) {
  const m = o.m, R = m.length, Cn = m[0].length, cs = o.cs || (Cn > 9 ? 26 : 34), W = Cn * cs + 2, H = R * cs + 2, mx = o.max || 255;
  const svg = V.svg(W, H, o.label || 'pixel grid');
  const isHL = (r, c) => (o.hl || []).some(p => p[0] === r && p[1] === c);
  for (let r = 0; r < R; r++) for (let c = 0; c < Cn; c++) {
    const v = m[r][c], g = typeof v === 'number' ? Math.max(0, Math.min(255, Math.round(255 * Math.abs(v) / mx))) : 255;
    svg.appendChild(V.rect(1 + c * cs, 1 + r * cs, cs, cs, { rx: 0, fill: 'rgb(' + g + ',' + g + ',' + g + ')', stroke: isHL(r, c) ? 'var(--gold)' : 'var(--line)', sw: isHL(r, c) ? 2.5 : 0.6 }));
    svg.appendChild(V.text(1 + c * cs + cs / 2, 1 + r * cs + cs / 2 + 3.5, String(v), { size: cs > 30 ? 11 : 9.5, mono: true, fill: g > 140 ? '#111' : '#eee' }));
  }
  return svg;
};
})();
/* Markdown tables inside LS bodies: split the card at each table and show it as a real table figure. */
(function () {
  const H = CG.H, LS0 = H.LS, lesson0 = H.lesson;
  const cells = l => l.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
  H.LS = (h, body, viz) => {
    if (!/\n\|[-: |]+\|\n/.test('\n' + body + '\n')) return LS0(h, body, viz);
    const paras = body.split('\n\n'), out = []; let txt = [], n = 0;
    paras.forEach(p => {
      const ls = p.split('\n');
      if (ls.length >= 2 && ls.every(l => l.trim().startsWith('|')) && /^\|[-: |]+\|$/.test(ls[1].trim())) {
        out.push(LS0(n++ ? h + ' (continued)' : h, txt.join('\n\n'), H.table(cells(ls[0]), ls.slice(2).map(cells)))); txt = [];
      } else txt.push(p);
    });
    if (txt.length || viz) out.push(LS0(h + ' (continued)', txt.join('\n\n'), viz));
    return out;
  };
  H.lesson = (id, title, ref, items) => lesson0(id, title, ref, [].concat(...items.map(x => Array.isArray(x) ? x : [x])));
})();

/* ---- lern2solorpg/l01.js — Part 1: the director ---- */
(function () {
const { REF, LS, MC, TF, MA, OR, unit, lesson, PX } = CG.H;
const GM = id => GEN.make(id);
const M = (q, a, d, why, hint) => MC(q, [a].concat(d), why, hint);

unit('u1', 1, 'dir', 'rd', 'What a solo director actually does', 'A studio of 100–300 people splits an open-world RPG across art, design, writing, audio, code, QA and production. You will make every decision those departments make, and use AI to draft much of the work. This unit is honest about what that means before you start.', [
  lesson('u1l1', 'The studio you are replacing', REF.dir, [
    LS('The departments, one by one', 'A large RPG studio usually has these departments, and each one hands work to the next:\n\n| department | makes | what you do with AI help |\n|---|---|---|\n| creative direction | vision, pillars, tone, final say | **you, entirely** |\n| game design | systems, numbers, quests, levels | you write specs; AI drafts docs and numbers; you simulate and decide |\n| writing | dialogue, books, lore | AI drafts against your canon bible; you edit every line |\n| concept and 2D art | paintings, sheets, icons, UI | AI generates batches; you curate and paint over |\n| 3D art | meshes, textures, rigs | AI makes rough meshes from images; you retopologise, UV, bake and rig |\n| animation | locomotion, combat, faces | libraries, motion capture and AI-assisted retargeting; lipsync from VO |\n| audio | music, Foley, ambience, VO | AI generation plus editing; AI voices you cast and direct |\n| engineering | engine code, tools, pipelines | AI coding assistants; you review, test and commit |\n| QA | finding bugs | automated bots plus human playtesters |\n| production | schedule, budget, risk | you, with a spreadsheet |\n\nThe left column does not disappear. Every row still needs a decision-maker, and that is you.'),
    LS('What AI changes and what it does not', 'AI is very good at **first drafts**: a hundred concept sketches, a page of item descriptions, a voiced line, a script that loads JSON. It is weak at **judgement**: knowing which sketch fits your world, noticing a lore contradiction three books apart, hearing that a voice sounds bored, spotting that a script leaks memory.\n\nSo your job shifts from making to **directing**: writing clear briefs, choosing, rejecting, editing, integrating and testing. Expect to spend more time reviewing than generating. In the Curation lesson you will see keep rates of 8–35%: most generations are thrown away.\n\nWalk-through. A studio might put 2,000 person-days into the feature list in the next example. Your solo estimate with AI help is about 200 days. That ratio is a **planning illustration**, not a promise. It only holds if you cut scope hard and accept a smaller, more focused game.', PX('a_scope')),
    M('Which job cannot be handed to an AI model?', 'deciding what fits the vision and what gets cut', ['drafting 50 item descriptions', 'generating concept variations', 'writing a first-pass JSON loader'], 'Drafting is delegable. Judgement about vision and scope is the director’s job.', 'Who has the final say?'),
    TF('With AI help, one person can ship the same content volume as a 200-person studio in the same time.', false, 'AI speeds drafting, but review, integration, QA and polish still scale with content. Solo projects succeed by choosing a smaller scope with high quality.', 'What still scales with content?'),
    GM('dirq'), GM('valueday')
  ]),
  lesson('u1l2', 'Honest expectations and the director’s week', REF.dir, [
    LS('What “AAA ambition” means for you', '**AAA** describes big-budget games: huge content, polished animation, full voice acting, large QA. You can borrow the *ambition*: a coherent world, reactive systems, a distinctive look, voiced characters. You cannot borrow the *headcount*.\n\nA realistic solo target is a **deep, small region** at high quality: one town, a few dungeons, a faction line, a main quest arc. Morrowind’s strength was density and strangeness, not polygon counts. That is good news for a solo director.\n\nThe course never claims you will ship a Bethesda-sized game. It teaches the full production pipeline so that whatever you ship is complete and good.'),
    LS('A director’s week, worked through', 'Here is a sustainable 30-hour week once production is running:\n\n| day | focus | output |\n|---|---|---|\n| Mon | review last week’s playtest notes; reprioritise | updated task list |\n| Tue | art direction: brief, generate, curate one asset family | 20–40 approved assets |\n| Wed | 3D cleanup and import of approved assets | assets in engine, named correctly |\n| Thu | writing and VO: one quest’s dialogue, cast, render, QC | voiced quest |\n| Fri | engineering with AI assistant; tests; commit; build | playable build |\n\nNotice that every day ends with something **integrated**. Generated assets sitting in a folder are not progress. The burnout risk in the next lesson is real, so fixed hours matter.'),
    OR('Put the director’s weekly loop in a sensible order.', ['review playtest notes', 'brief and generate', 'curate and edit', 'integrate into the build', 'test and commit'], 'Feedback drives briefs; generation is cheap; curation and integration turn output into a game; tests protect it.'),
    GM('weeks'), GM('dirq')
  ])
]);

unit('u2', 2, 'dir', 'rs1', 'Vision, pillars and the vertical slice', 'The pillars decide what you build and, more importantly, what you cut. The vertical slice proves the pillars at final quality before you multiply content.', [
  lesson('u2l1', 'Writing a vision and five pillars', REF.dir, [
    LS('Vision statement', 'A vision statement is two or three sentences anyone can repeat. For this course’s example game:\n\n> *The Saltmarch of Veyl is a drowned salt-flat archipelago where glass-coral towers grow from brine. You arrive on the Lanternback, a vast lamp-lit tortoise-barge, and earn your place among rival guilds by charting, talking and surviving.*\n\nIt names the **place**, the **strangeness** and the **player fantasy**. Every asset brief and prompt will quote parts of it.'),
    LS('Five pillars, each with a test', 'Pillars are promises. Each one needs a test you can apply to any feature:\n\n| pillar | promise | test for a feature |\n|---|---|---|\n| exploration | handcrafted strangeness behind every ridge | does it reward looking around? |\n| dialogue | topic conversations that remember what you know | does it react to topics, factions or quest state? |\n| factions | guilds with ranks, rivalries and consequences | does it change your standing? |\n| magic | flexible, systemic spells | does it combine with other systems? |\n| travel | living transport and navigation by landmark | does it make the world feel connected? |\n\nWalk-through: “crafting system” serves none strongly, so it goes to *later*. “Lanternback travel” serves travel and exploration, costs 5 days, and goes into the slice. The scope example in the previous unit made exactly those calls.'),
    MA('Match each feature to the pillar it mainly serves.', [['topic keywords unlock new questions', 'dialogue'], ['ranks gate faction quests', 'factions'], ['a tortoise-barge links towns', 'travel'], ['a spell that lights dark cellars', 'magic']], 'One clear pillar per feature keeps scope honest.'),
    GM('dirq'), GM('valueday')
  ]),
  lesson('u2l2', 'The vertical slice', REF.dir, [
    LS('What a vertical slice is', 'Picture the whole game as a layer cake: world, art, audio, dialogue, systems, UI. A **horizontal** slice builds one layer for everything (all the terrain, no NPCs). A **vertical** slice cuts through *every* layer for a small area, at **final quality**.\n\nFor the Saltmarch the slice is: Brinewick dock, market and Lodge hall; the Old Tithe Cellar dungeon; four voiced NPCs; one faction quest; inventory, dialogue, combat, three spells, crime, travel and saves. That is exactly what you build in the capstone.\n\nWhy it matters solo: the slice tests your **pipeline**. If voicing four NPCs takes a week, you now know what 400 will cost.'),
    LS('Slice gates', 'Before multiplying content, the slice must pass these gates:\n\n1. **Fun**: five strangers play 20 minutes and want more.\n2. **Pipeline**: every asset type went brief → AI → curation → cleanup → import → in game.\n3. **Numbers**: you measured hours per asset type, AI cost and frame time on target hardware.\n4. **Rights**: every asset has a provenance record and licence note.\n\nIf a gate fails, fix the pipeline or cut the feature. Do **not** start region two.'),
    TF('A horizontal slice (all terrain, no NPCs) proves the game is fun.', false, 'Fun comes from layers working together. Only a vertical slice tests that.', 'Which slice cuts through every layer?'),
    GM('risk'), GM('dirq')
  ]),
  lesson('u2l3', 'Scope sheets and cutting', REF.dir, [

unit('u4', 4, 'pre', 'rs1', 'The documents: GDD, world bible, tone, scope and risk', 'Five living documents keep one person and many AI tools pointed the same way. Every prompt you write later quotes from them.', [
