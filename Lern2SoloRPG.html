    LS('What goes in a GDD', 'The **GDD** says how the game works. Keep it short, structured and versioned in Git as Markdown.\n\n| section | contents for the Saltmarch |\n|---|---|\n| overview | vision, pillars, platform, target hardware, rating target |\n| core loop | explore → meet → ask topics → take quests → fight or talk → earn rank → travel further |\n| systems | one page each: inventory, combat, magic, persuasion, travel, time, crime, factions, journal, saves |\n| content | regions, towns, dungeons, NPC count, quest count, VO policy |\n| UI | HUD, dialogue window, journal, inventory, map |\n| tech | engine and version, data formats, naming, target fps |\n| scope | slice, launch, later and cut lists |\n\nAsking AI to “write a GDD” gives generic filler. Instead, write the headings and bullet decisions yourself, then ask AI to expand **one section at a time** from your bullets. Edit the result back down.'),
    LS('Worked prompt for one GDD section', 'A good drafting prompt carries constraints, not vibes:\n\n> *Expand these bullets into a one-page Travel System spec for a Godot 4 RPG. Keep my numbers. Bullets: Lanternback tortoise-barge; fixed routes between dock cells; fare 25 gold per route; travel advances the clock 6 hours; no random encounters in the slice; the ferryman NPC sells tickets via dialogue topic “Veyl Spire”. Output: purpose, player-facing rules, data schema (JSON), edge cases, test cases.*\n\nThen **you** check every number against your scope sheet, and turn the test cases into real tests. The kernel test for travel checks that fare 25 leaves 15 of 40 gold and the clock moves from 08:00 to 14:00.'),
    M('The best way to use AI for a GDD is to…', 'write your own decisions as bullets, then have AI expand one section at a time', ['ask for a complete GDD for “a Morrowind-like”', 'skip the GDD and prompt assets directly', 'let AI choose the pillars'], 'Your decisions lead; AI fills in structure and wording.', 'Who owns the decisions?'),
    GM('preq')
  ]),
  lesson('u4l2', 'The world bible and tone guide', REF.write, [
    LS('World bible structure', 'The **world bible** holds what is true in the world. Split it into:\n\n- **canon facts** as structured lines, e.g. `Odra Venn . home = Brinewick`. The canon checker reads these.\n- **geography**: regions, towns, landmarks, travel routes\n- **cultures and factions**: values, ranks, rivalries, architecture style, clothing, naming rules\n- **history**: dated events, so the timeline checker can test born/died and founded/fell\n- **bestiary**: creatures, habitats, behaviour\n- **glossary**: every proper noun with pronunciation (VO needs this)\n\nNaming rules matter for AI: “Brinewick names are short Old-English-sounding; Lodge titles are surveying terms (Chainbearer, Surveyor, Pathwright).” Feed that rule to every writing prompt.'),
    LS('Tone guide', 'A tone guide gives every writer, human or model, the same voice:\n\n| do | don’t |\n|---|---|\n| dry, weathered, practical speech | modern slang or memes |\n| strangeness stated plainly (“the coral grew another floor last spring”) | explaining every mystery |\n| short lines (8–18 words) for VO | paragraphs per line |\n| specific nouns: brine, ledger, gaff hook | generic fantasy filler (“ancient evil”) |\n\nShort lines matter for cost: the VO planner prices every word, and long lines are harder to act.'),
    TF('Pronunciations belong in the world bible because AI voices will mispronounce invented names otherwise.', true, 'TTS engines guess at unknown words. A pronunciation glossary (often with phonetic respellings) keeps every line consistent.', 'What does a TTS engine do with “Veyl”?'),
    GM('writeq'), GM('preq')
  ]),
  lesson('u4l3', 'Scope sheet and risk register', REF.pre, [
    LS('The risk register', 'List every risk, score likelihood and impact from 1 to 5, multiply, and act on the highest first. Scores of 16 or more are **red** and need a mitigation now; 9–15 are **amber**; 8 or less are **green**.\n\nFor solo AI-assisted RPGs, the top risks are almost always **scope creep**, **burnout** and **style drift** across thousands of generated assets. Notice that they are human and process risks, not technical ones.', PX('a_risk')),

unit('u5', 5, 'pre', 'imm', 'Choosing an engine and structuring the game', 'Godot is the course’s concrete default because it is free, open and text-based, so you and AI tools can read every file. Unity and Unreal are compared honestly.', [
  lesson('u5l1', 'Godot, Unity or Unreal', REF.pre, [
    LS('Comparison for a solo open-world RPG', '| | Godot 4 | Unity 6 | Unreal 5 |\n|---|---|---|---|\n| cost | free, MIT licence | free tier, then subscription/fees by revenue | free until royalty threshold, then 5% |\n| scripting | GDScript, C# | C# | C++, Blueprints |\n| files | text scenes (.tscn) and resources (.tres) | YAML scenes, binary-ish assets | mostly binary .uasset |\n| open world | streaming by hand; fine for modest worlds | mature tooling and asset store | World Partition, Nanite, Lumen out of the box |\n| AI-assistant friendliness | high: small API, readable text files | high: huge training corpus | medium: C++ plus binary assets |\n| look out of the box | good, needs art direction | good | photoreal, heavy hardware |\n\nThere is no wrong choice. Pick the one you can **finish** in. This course discusses Godot concretely because every file is readable text, but every concept maps across engines. Check current licence terms yourself before committing.'),

class_name NPCData extends Resource
@export var id: StringName
@export var display_name: String
@export var faction: StringName
@export_range(0, 100) var disposition := 50

    GM('engq'), GM('flagtest')

  lesson('u5l3', 'Modular content and kits', REF.asset, [
    LS('Why kits', 'An open world is mostly **reuse**. A modular kit is a set of pieces on a fixed grid (for example 4 m): wall straight, wall corner, wall with door, floor, stair, roof edge and trims. Forty well-made pieces can build a whole town if you vary the arrangement, decals, props and lighting.\n\nKits are also friendly to AI. You generate the **look** once (a style board), then build the pieces to a strict grid and naming scheme, rather than asking a model for a hundred unique houses that will never line up.'),

unit('u6', 6, 'tax', 'op', 'Every asset an open-world RPG needs', 'A studio has an asset tracker with thousands of rows. Here you build yours category by category, learning what each asset is, what it depends on, and what it scales with.', [

unit('u9', 9, 'art', 'rs2', 'Batches, curation and human-in-the-loop direction', 'Generation is cheap; your attention is not. This unit is about using it well.', [
  lesson('u9l1', 'Batch generation and curation maths', REF.art, [
    LS('Keep rates', 'Track your **keep rate** per asset family. Simple props might keep 25%; character concepts might keep 8%. Then:\n\n- generations = ⌈needed ÷ keep rate⌉\n- review hours = generations × seconds per review ÷ 3600\n\nWorked: 150 props at 25% means 150 ÷ 0.25 = **600** generations, and at 20 s each that is 600 × 20 ÷ 3600 = **3.33 h** of review. 29 character concepts at 8% means 29 ÷ 0.08 = 362.5, rounded up to **363**.'),
    LS('Rejection reasons', 'Log *why* you reject. The example tallies 400 reviews. Off-palette and unreadable silhouettes dominate, so you fix the **template** (tighter palette wording, a silhouette check at thumbnail size) rather than generating more. “Too close to a known IP” rejections are rarer but non-negotiable.', PX('c_curation')),
    M('You need 40 approved icons and keep 20%. How many generations?', '200', ['48', '80', '400'], '40 ÷ 0.2 = 200.', 'Needed ÷ keep rate.'),
    GM('curation'), GM('curation')
  ]),
  lesson('u9l2', 'Art direction: feedback, paint-overs and rejections', REF.art, [
    LS('Direction loop', 'A studio art director does not say “make it better”. They mark up. Your loop:\n\n1. **Thumbnail pass**: view the batch at 64 px and reject unreadable shapes.\n2. **Palette pass**: compare against palette swatches and reject drift.\n3. **Detail pass**: hands, anatomy, perspective, text artefacts, IP lookalikes.\n4. **Paint-over**: fix the best candidate by hand (crop, recolour, repaint), or mark it up and re-generate with image-to-image at low strength.\n5. **Approve**: rename, log the job record and licence, add it to the reference board.\n\nApproved images go back on the board, so your world converges on its own style over time.'),
    LS('Upscaling', 'Upscalers invent plausible detail. Use them for **finals**, not for rescuing bad compositions. Always check the result at its **display size**: a 512 px icon shown at 64 px must read as its silhouette. Do not upscale and then trust tiny text or symbols; repaint them.'),
    OR('Order the curation passes.', ['thumbnail silhouette', 'palette', 'detail and IP check', 'paint-over or low-strength re-generate', 'approve and log'], 'Cheap, fast rejections first; expensive fixes only on survivors.'),
    GM('artq'), GM('curation')
  ])
]);

unit('u10', 10, 'art', 'f3', 'Textures and 3D from AI', 'Turn images into game-ready materials and meshes: PBR sets, image-to-3D, retopology, UVs, baking and LODs.', [
  lesson('u10l1', 'PBR texture sets', REF.art, [
    LS('The maps', '**Physically based rendering (PBR)** materials need several maps:\n\n| map | stores | format idea |\n|---|---|---|\n| base colour | albedo without lighting | BC7, sRGB |\n| normal | surface direction detail | BC5 (two channels) |\n| roughness | micro-surface blur | packed |\n| metallic | metal or not | packed |\n| ambient occlusion | cavity darkening | packed |\n\n**ORM packing** puts Occlusion, Roughness and Metallic in the R, G and B of one texture: one sampler, less memory. AI image tools give you a base colour with **baked lighting**. You must de-light it (remove shadows and highlights), then derive or paint the other maps. Seamless tiling needs an offset check.'),
    LS('Memory, worked', 'Texture bytes = width × height × bytes per pixel × 4/3 for mipmaps. A 2048² BC7 map is 2048 × 2048 × 1 × 4/3 = 5,592,405 B ≈ **5.33 MiB**. The packed three-map set is 13.33 MiB, against 18.67 MiB for five separate maps. Uncompressed RGBA8 would be 21.33 MiB *per map*. The ORM texel (AO 200, rough 140, metal 0) packs to 0xC88C00.', PX('c_pbr')),
    M('A 1024² BC1 texture with mips takes about…', '0.67 MiB', ['0.5 MiB', '1.33 MiB', '4 MiB'], '1024² × 0.5 = 524,288 B; × 4/3 = 699,051 B ≈ 0.67 MiB.', 'Pixels × bytes × 4/3.'),
    GM('texmem'), GM('texmem')
  ]),
  lesson('u10l2', 'Image-to-3D, retopology and baking', REF.art, [
    LS('What image-to-3D gives you', 'Image-to-3D tools (the Meshy- and Tripo-style category) turn a concept image or a few views into a textured mesh in minutes. Typical output: hundreds of thousands of triangles, messy topology, baked lighting in the texture, and invented geometry on hidden sides.\n\nTreat it as a **sculpt source**, never a final game mesh.'),
    LS('Cleanup pipeline, worked', '1. **Check scale and pivot** against the kit grid.\n2. **Retopologise** or decimate to budget: a crate at 600 triangles, a creature at 8,000, a hero NPC at 25,000.\n3. **UV unwrap** at the project texel density.\n4. **Bake** normal and AO from the high-poly to the low-poly.\n5. **Re-texture** or de-light the base colour; build the ORM.\n6. **LODs**: about 50%, 25% and 10% of LOD0.\n7. **Rig** creatures and characters to the shared skeleton; test deformation.\n\nThe example shows keep ratios of 0.6–3%: almost all generated triangles are thrown away, and their detail survives only in the baked normal map. The underlying models (NeRFs, splats, mesh generators) are taught in **Lern2Model3D**.', PX('c_retopo')),
    OR('Order the image-to-3D cleanup.', ['scale and pivot check', 'retopo to budget', 'UV unwrap', 'bake normal and AO', 'build LODs', 'rig if animated'], 'Budget topology first, then UVs, then bake, then LODs and rigging.'),
    GM('lodtris'), GM('artq')
  ])
]);

unit('u11', 11, 'art', 'rd', 'Characters, creatures, animation, VFX and UI', 'The hardest categories for AI, and how to get usable results anyway.', [
  lesson('u11l1', 'Characters and creatures', REF.art, [
    LS('Where AI struggles', 'Characters fail in predictable places: hands, faces at an angle, symmetrical armour, consistent costumes across views, and hair. Rules that help:\n\n- generate **orthographic turnarounds** in a neutral pose before anything else\n- generate the **head** and **costume** separately, then combine\n- build on **parametric base bodies** (a shared rig with morphs) and generate *textures and outfits*, rather than whole new characters\n- for creatures, design from function (the shellback crab walks sideways in brine and has a salt-crusted carapace) and generate silhouettes first'),
    LS('Faces and blendshapes', 'Faces need morph targets for **lipsync visemes** and **expressions**. Whatever generator made the head, the final face must share a topology with your rig so the blendshapes work. That usually means wrapping your base head onto the generated shape and transferring detail by baking.'),
    TF('Generating a brand-new rigged character mesh for every NPC is the efficient path.', false, 'Shared bases with morphs, outfits and textures scale far better and keep animation working.', 'Think about the shared skeleton.'),
    GM('artq')
  ]),
  lesson('u11l2', 'Animation, VFX, UI, icons and fonts', REF.art, [
    LS('Animation', 'Sources, from most to least reliable for a solo developer:\n\n1. **licensed animation libraries** retargeted to your skeleton\n2. **video-to-motion capture** of yourself performing (AI pose estimation), then cleaned\n3. **text-to-motion** generators for drafts and idles\n\nAlways clean foot sliding, fix contact frames and loop points, and check root motion. Lipsync and face curves come from VO (Part 6).'),
    LS('VFX, UI, icons and fonts', '- **VFX**: AI makes great *flipbook textures* (smoke, sparks, splashes) and concept frames. You build the actual effect in the engine’s particle system. Six effects per spell school: cast, projectile, impact, aura, area, fail.\n- **UI**: generate *mood* and frames, then build the layout yourself in the engine for scalable, accessible text.\n- **Icons**: lock a template (camera angle, lighting, background, border) and batch-generate. They are the most AI-friendly category.\n- **Fonts**: never generate them. Use fonts whose licence allows embedding in games, and check language coverage for localisation.'),
    MA('Match the asset to the best AI role.', [['icons', 'batch-generate from a locked template'], ['UI layout', 'mood only; build in engine'], ['fonts', 'license, do not generate'], ['VFX', 'flipbook textures; build in particle system']], 'Each category uses AI where it is strong.'),
    GM('artq'), GM('assetq')
  ])
]);

unit('u12', 12, 'art', 'imm', 'Music, ambience and Foley', 'Sound sells the world. AI can draft music and effects, and direction and editing make them fit.', [
  lesson('u12l1', 'Music and stingers', REF.art, [
    LS('Music brief', 'Write music briefs like art briefs: mood, instruments, tempo, key, loop length, and the moment it serves.\n\n> *MUS_EXP_SAL_flats_day_01: lonely, open, slow (64 bpm), D dorian, hammered dulcimer, low drone, distant bowed metal; 2:30 seamless loop; no percussion; plays while exploring salt flats by day.*\n\nAI music tools give drafts. You need **loopable** edits, **stems** if possible (for adaptive mixing), consistent loudness, and **licence terms** that allow commercial use. Read the terms of the exact tier you used, and keep them with the asset.'),
    LS('Stingers and adaptivity', 'Stingers (2–6 s) punctuate events: discovery, quest complete, level up, death, faction join. The game crossfades music by state (explore → danger → combat → victory). Twelve stingers and four combat cues cover a lot.'),
    TF('Any AI music output is automatically licensed for commercial games.', false, 'Terms vary by tool and tier. Keep the licence text with each track.', 'Read the terms.'),
    GM('lawq')
  ]),
  lesson('u12l2', 'Ambience and Foley', REF.art, [
    LS('Ambience and Foley', '**Ambience** is layered loops (wind, brine lapping, distant gulls) plus random one-shots. **Foley** is every physical sound: footsteps per surface (salt crust, planks, coral, water), cloth, armour, doors, items, UI.\n\nAI sound generators are good at variations. Generate 6–10 per footstep surface and randomise playback so steps never repeat. Normalise loudness, trim silence, and name everything (`SFX_FOL_SAL_step_saltcrust_03`).'),
    LS('Mixing preview', 'Plan buses early: Master → Music, SFX, Ambience, VO, UI. VO **ducks** music and ambience a few dB while a line plays. Part 8 builds this as an audio-bus layout.'),
    M('Why generate 8 variations of a footstep?', 'random playback avoids obvious repetition', ['engines need exactly 8', 'loudness normalisation requires it', 'to save memory'], 'Repetition is the first thing players hear.', 'What does the ear notice?'),
    GM('assetq'), GM('framems')
  ])
]);
})();

unit('u13', 13, 'write', 'rs2', 'Topic dialogue and quests', 'Morrowind-style topic dialogue is a design pattern you can build on: a shared vocabulary of keywords that any NPC may answer, filtered by conditions.', [
  lesson('u13l1', 'How topic dialogue works', REF.write, [
    LS('The pattern', 'In topic dialogue, bracketed **keywords** in a line become topics the player now knows. Any NPC can then be asked about a known topic, and the game picks that NPC’s answer by checking **entries in order**:\n\n1. entries for this NPC whose conditions pass\n2. otherwise generic entries (`npc: "*"`) whose conditions pass\n3. otherwise “I know nothing about that.”\n\nConditions include faction membership, items held and quest stage. **Effects** include advancing a quest, giving or taking items, joining a faction and adding gold or reputation. Specific entries go **before** generic ones.'),
    LS('The real data', 'Here is the slice’s “tithe ledger” topic. The ledger-handed-in entry comes first because it is more specific (it requires the item):', J(`"tithe ledger": [
  {"npc": "odra", "id": "VO_odra_ledger_02",
   "text": "You found it. The ink is ruined in places, but the dates hold. Welcome, Chainbearer.",
   "cond": {"has": "tithe_ledger"},
   "effects": {"take": "tithe_ledger", "quest": ["tithe", 100], "join": "lodge",
               "give": "lodge_badge", "gold": 30, "rep": ["lodge", 10]}},
  {"npc": "odra", "id": "VO_odra_ledger_01",
   "text": "The old tithe ledger proves which shoals the Lodge charted first. It is somewhere in the flooded [tithe cellar]. Bring it to me.",
   "cond": {"quest_below": ["tithe", 20]}, "effects": {"quest": ["tithe", 10]}}
]`)),
    LS('Checking the graph', 'With hundreds of topics, you need tools. This example walks the topic graph from greetings: which topics can ever be learned, which have entries but can never be learned (dead content), and which can be learned but have no answers (frustrating).', PX('e_dialogue')),
    M('Two entries for the same topic both pass their conditions. Which plays?', 'the first in the list, so put specific entries first', ['the last in the list', 'a random one', 'both, one after another'], 'First-match ordering keeps authoring predictable.', 'Order matters.'),
    GM('writeq'), GM('engq')
  ]),
  lesson('u13l2', 'Using AI to draft dialogue', REF.write, [
    LS('The drafting prompt', 'Give the model everything it needs and nothing it does not:\n\n> *You write NPC lines for an original fantasy RPG. Canon (do not contradict): [paste canon facts for this NPC and topic]. Tone guide: [paste]. Speaker: Odra Venn — dry, exacting, amused; alto. Topic: “tithe ledger”. Write two entries in this JSON schema: one for before the player has the ledger (start quest stage 10) and one for when they hand it in (stage 100, join Lodge). 8–18 words per line where possible. Mark new topics in [brackets]. Use only names from the canon list.*\n\nThen edit: cut words, make it sound like Odra, check every fact against canon, and check the brackets point to topics that exist.'),
    LS('Branching and barks', 'Topic dialogue mixes with other forms:\n\n- **choices** inside a topic (Yes/No, persuade options) for decisions\n- **barks**: short ambient lines (“Mind the stall!”) triggered by events\n- **greetings** that vary with disposition, faction and crime\n\nBudget them separately in the VO planner. Barks are short but there are many of them.'),
    TF('If the model writes a new character name, you should accept it as long as it sounds good.', false, 'New names must be added to canon deliberately, or replaced. Otherwise the world bible and the game drift apart.', 'Who owns canon?'),
    GM('writeq')
  ]),
  lesson('u13l3', 'Quest design and state machines', REF.write, [
    LS('Quest anatomy', 'A quest is a **state machine**:\n\n- **stages** (10, 20, 100), numbered with gaps so you can insert stages later\n- **journal text** per stage, written as the player character’s notes\n- **transitions** triggered by events: talk topic, pick up item, enter cell, kill creature, time passes\n- a **finished** stage\n\nThe Tithe Ledger: 0 → 10 (ask Odra about the ledger) → 20 (pick up the ledger) → 100 (hand it in, join the Lodge). It also allows 0 → 20 if the player finds the ledger *before* meeting Odra. That kind of out-of-order path is what makes a world feel reactive.'),
    LS('Validating it', 'The validator collects every edge from triggers and dialogue effects, then checks that every stage and the finish are reachable and every stage has journal text. In production, run it in CI on every commit.', PX('e_quest')),
    OR('Order the Tithe Ledger stages on the main path.', ['0: not started', '10: Odra asks for the ledger', '20: ledger found', '100: ledger handed in, joined Lodge'], 'Gaps between numbers leave room for new stages.'),
    GM('writeq'), GM('sysq')
  ])
]);

unit('u14', 14, 'write', 'f3', 'Lore, the canon bible and the editorial pass', 'Books, item texts and bestiary entries are where an AI model most easily contradicts itself. A machine-checkable canon keeps it honest.', [
  lesson('u14l1', 'Item, book and bestiary texts', REF.write, [
    LS('Short forms', '| text | length | must contain |\n|---|---|---|\n| item description | 1–2 lines | use, origin, a hook |\n| bestiary entry | 60–120 words | habitat, behaviour, danger, a rumour |\n| book | 300–1,500 words | a point of view, a fact the player can use, a mystery |\n| note or letter | 40–150 words | a character’s voice and a lead |\n\nExample item: *Salt-iron gaff hook. Brinewick dockhands swear it never rusts; the shellbacks of the Tithe Cellar would disagree.* It gives use, origin and a hook in two lines.'),
    LS('Books with AI', 'Books are where AI drafting saves the most time and causes the most damage. Prompt with the canon facts the book may mention, the in-world author and their bias, and what the player should learn. Then edit hard: cut generic phrases, make sure the author’s bias shows, and run the canon checker. Every new fact the book invents goes into the bible **or** gets cut.'),
    M('A good item description…', 'tells use, origin and a hook in one or two lines', ['restates the item’s name', 'is three paragraphs of history', 'lists its file name'], 'Short and useful.', 'Use, origin, hook.'),
    GM('writeq')
  ]),
  lesson('u14l2', 'The canon bible checker', REF.write, [
    LS('Facts as data', 'Write canon as `Subject . attribute = value` lines. Some attributes are **single-valued** (home, born, died, leader, faction, species, founded…); a second value is a contradiction. Others (likes, rumours) may have many values.\n\nThe checker reports four kinds of issue:\n\n1. **contradiction**: a single-valued fact disagrees with canon\n2. **unknown-entity**: a name not in canon (new character invented by the model)\n3. **timeline**: born after died, founded after fell\n4. **banned-term**: IP names from another game\n\nWorked: canon says `Odra Venn . born = 412`. A draft says `Odra Venn . died = 401`. Since 412 > 401, that is a timeline error.'),
    LS('Running it', 'In practice you ask the model to output its new facts in this format **alongside** the prose, then run the checker before you read the prose. Open the **Consistency bible checker** lab to try your own drafts.', PX('e_canon')),
    TF('The checker can prove a draft is consistent.', false, 'It only checks structured facts. Contradictions hidden in prose still need your reading.', 'What does it see?'),
    GM('writeq'), GM('lawq')
  ]),
  lesson('u14l3', 'The editorial pass', REF.write, [
    LS('Five-pass edit', '1. **Facts**: canon checker clean; new facts added or cut.\n2. **Voice**: does it sound like this speaker? Read it aloud. It will be voiced.\n3. **Length**: cut 20%. VO cost and player patience both scale with words.\n4. **Hooks**: does every line give a topic, a lead or a choice?\n5. **Sensitivity**: stereotypes, real-world slurs, accidental real names.\n\nTrack a **text status** per line ID (drafted → edited → locked). Only **locked** lines go to VO, because re-voicing is the expensive mistake.'),
    LS('Why lock before VO', 'Each change after voicing costs a new render, QC, a lipsync rebuild and possibly a localisation update. With 2 takes at $0.30 per 1,000 characters, a 16-word line costs only about $0.06 to re-render. Your QC time and the risk of mismatched subtitles cost far more.'),
    OR('Order the editorial passes.', ['facts', 'voice', 'length', 'hooks', 'sensitivity', 'lock for VO'], 'Lock last; VO depends on it.'),
    GM('writeq'), GM('vocost')
  ])
]);
})();

unit('u15', 15, 'vo', 'f3', 'Voice technology and casting', 'Full voice acting was once the clearest sign of a huge budget. AI voices make it reachable, as long as you direct, check and respect rights.', [
  lesson('u15l1', 'TTS, voice design and voice conversion', REF.vo, [
    LS('Three technologies', '| technology | input | output | typical use | rights you need |\n|---|---|---|---|---|\n| **text-to-speech (TTS)** | text (+ voice ID, style tags) | speech | most lines | licence for the tool and that voice |\n| **voice design** | a text description of a voice | a new synthetic voice | inventing a cast with no real person behind it | tool licence |\n| **voice conversion (speech-to-speech)** | a recorded performance | the same performance in another timbre | lines needing precise acting; you perform, the target voice speaks | the performer’s consent **and** rights to the target voice |\n\nTTS is fastest; conversion gives the best acting control, because a human timed and inflected the line. Many solo pipelines mix them: TTS for 90% of lines, conversion of your own performance for key scenes.'),
    LS('Local or cloud', 'Cloud TTS is easy and usually higher quality, priced per character. Local open models cost GPU time and setup, but give privacy and permanence. Whichever you use, **keep the rendered WAV masters**. Voices and services change, and you may not be able to re-render the same voice in a year.\n\nThis course’s build box had **no TTS engine installed**, so the slice uses **placeholder WAVs** (tone bursts with correct timing) and **mock viseme timings**. That is honest, and the pipeline is the same: swap the render step later.'),
    M('You want precise comic timing on a key line. Best approach?', 'perform it yourself and convert it to the character’s synthetic voice', ['type it with more exclamation marks', 'clone a famous comedian', 'use random seeds until it sounds funny'], 'Conversion keeps your human timing while changing timbre.', 'Who supplies the timing?'),
    GM('voq')
  ]),
  lesson('u15l2', 'Cast design: distinct timbres', REF.vo, [
    LS('Casting sheet', 'For each speaking role define: **pitch range**, **rate** (words per minute), **breathiness**, **roughness**, **accent or dialect group**, age impression and three acting adjectives. Odra: alto around 190 Hz, 140 wpm, dry, slightly rough, Brinewick accent; *dry, exacting, amused*.\n\nGeneric NPCs (guards, merchants) share a **pool** of voices, but no two voices heard in the same scene should be confusable.'),
    LS('Distinctness check, worked', 'Treat each voice as a vector and scale each dimension by a “noticeable difference” (60 Hz pitch, 25 wpm, 0.3 breathiness, 0.3 roughness; a different accent counts as 1). The distance between two voices is the root of the sum of squared scaled differences.\n\nHaskel (100, 120, 0.1, 0.6, accent 1) vs guard 2 (105, 125, 0.15, 0.55, accent 1): (5/60)² + (5/25)² + (0.05/0.3)² + (0.05/0.3)² = 0.0069 + 0.04 + 0.0278 + 0.0278 = 0.1025, and √0.1025 ≈ **0.32**. That is far below 1, so they are **too similar**. Change one: lower pitch, a different accent or a slower rate.', PX('f_cast')),
    TF('Two guards in the same market can share one voice ID without anyone noticing.', false, 'Players notice repeated voices in the same scene quickly, especially in conversation. Use a pool and a distinctness check.', 'Think of the market scene.'),
    GM('voq')
  ])
]);

unit('u16', 16, 'vo', 'rd', 'Directing performances', 'An AI voice reads; a directed AI voice acts. You give it the same direction a voice director gives an actor.', [
  lesson('u16l1', 'Emotion, pacing and tags', REF.vo, [
    LS('Direction fields in the script', 'Each line in the VO script carries:\n\n| field | example | effect |\n|---|---|---|\n| emotion | weary, relieved, stern | style or emotion tag in the TTS, or how you perform for conversion |\n| intensity | 1–5 | how strongly |\n| pacing | slow, normal, fast; pauses marked with … or explicit breaks | rate and pause control |\n| context | “after the player returns soaked from the cellar” | helps you (and some models) pick the read |\n| emphasis | *dates* in “but the dates hold” | stress markup if the tool supports it |\n| distance | close, mid, projected | delivery and later mixing |\n\nTools differ in which tags they support (SSML-style markup, bracketed style tags, or reference audio). Keep your script **tool-agnostic** and translate in the render step.'),
    LS('Takes and selection', 'Render 2–3 **takes** per important line and pick the best. Budget for takes in the planner: it multiplies characters rendered. For barks and generic lines, one take with QC is usually enough.'),
    M('Rendering 3 takes instead of 2 changes the cost by…', '×1.5', ['×3', '+1 cent', 'nothing'], 'Rendered characters scale linearly with takes: 3/2 = 1.5.', 'Characters × takes.'),
    GM('vocost'), GM('voq')
  ]),
  lesson('u16l2', 'Diegetic speech vs narration', REF.vo, [
    LS('Two kinds of voice', '**Diegetic** voice exists in the world: NPCs speaking at the market. It is played on a 3D audio source, attenuated with distance, affected by reverb (cellar vs open flats) and occluded by walls. Deliver it at the right **distance** in the performance too: a guard projecting across a market sounds different from Odra murmuring across a table.\n\n**Non-diegetic** voice is narration or a menu voice: 2D, dry and clear. Do not mix the two treatments, or the player will feel something is off without knowing why.'),
    LS('Room tone and consistency', 'Render dry (no reverb) and add space in the engine, so one line works in every room. Keep loudness consistent (target an integrated loudness per bus) so the player is not riding the volume.'),
    TF('You should bake cellar reverb into VO files for lines spoken in the cellar.', false, 'Render dry and let the engine add room acoustics, so lines stay reusable and consistent.', 'Where should the space come from?'),
    GM('voq')
  ])
]);

unit('u17', 17, 'vo', 'rs1', 'Phonemes, visemes and lipsync', 'Mouths must move with the words. You need a timeline of mouth shapes per line, and a face rig that can show them.', [
  lesson('u17l1', 'Visemes explained', REF.vo, [
    LS('From phonemes to mouth shapes', 'A **phoneme** is a speech sound (/m/, /a/, /f/). Many phonemes look the same on the lips, so animation groups them into **visemes**. Rhubarb Lip Sync uses Preston Blair-style shapes:\n\n| shape | mouth | sounds |\n|---|---|---|\n| A | closed lips | M, B, P |\n| B | slightly open, teeth | most consonants: K, S, T, D… |\n| C | open | EH, AE (e, i) |\n| D | wide open | AA (a) |\n| E | rounded | AO, ER (o) |\n| F | puckered | UW, OW, W |\n| G | teeth on lip | F, V |\n| H | tongue up | L |\n| X | rest | silence |\n\nARKit-style rigs use about 52 blendshapes instead (jawOpen, mouthPucker…), and visemes map onto combinations of them.'),
    LS('Timing, worked', 'A viseme track is a list of (time, shape). The engine converts times to animation frames: frame = round(time × fps). At 30 fps, a key at 0.778 s is frame round(23.34) = **23**.\n\nThe course’s mock spreads letters evenly over the expected duration (words × 60/150 s), maps each letter to a shape and merges repeats. It is **not** phonetic: real pipelines either run forced alignment (text + audio → phoneme times) or analyse the audio directly, which is what Rhubarb does.', PX('f_lipsync')),
    M('Which viseme shows M, B and P?', 'A (closed lips)', ['D (wide open)', 'G (teeth on lip)', 'X (rest)'], 'Bilabial sounds close both lips.', 'Say “mama” in a mirror.'),
    GM('keyframe'), GM('linedur')
  ]),
  lesson('u17l2', 'Driving the face in engine', REF.eng, [
    LS('Playing a line', 'When a line plays, start the audio and a face-animation player together, read the viseme keys, and blend toward each shape (60–80 ms blends look natural). Add **blinks**, **brow** movement on stressed words, and small head motion, or faces look dead even with perfect lips.', GD(`# dialogue_line_player.gd (sketch)
func play_line(line_id: StringName, speaker: Node3D) -> void:
	var entry: Dictionary = VoManifest.get_entry(line_id)   # {file, dur, visemes:[[t, "A"], ...]}
	var audio: AudioStreamPlayer3D = speaker.get_node("Voice")
	audio.stream = load(entry.file)
	audio.play()
	var face := speaker.get_node("Face") as FaceRig
	for key in entry.visemes:
		var t: float = key[0]
		var shape: String = key[1]
		await get_tree().create_timer(max(0.0, t - audio.get_playback_position())).timeout
		face.blend_to_viseme(shape, 0.07)                      # 70 ms blend
	Subtitles.show(line_id, entry.dur)`)),
    TF('Perfect viseme timing alone makes a face look alive.', false, 'Blinks, brows and head motion matter as much as lips.', 'What else moves on a talking face?'),
    GM('keyframe')
  ])
]);

unit('u18', 18, 'vo', 'op', 'Batch voicing, QC and consistency', 'Thousands of lines need a pipeline: script CSV → render → QC → lipsync → manifest → engine.', [

    LS('Pipeline', '1. **Export** locked lines to a script CSV: line_id, speaker, voice, emotion, direction, text.\n2. **Render** each row with its voice and tags; write a WAV master named from the line ID.\n3. **QC** automatically (length, clipping, silence), then by ear.\n4. **Lipsync**: generate the viseme track from the audio (or the mock).\n5. **Manifest**: line_id → file, duration, visemes, voice, engine, status.\n6. **Engine**: the dialogue player looks lines up by ID and plays them with subtitles.\n\nIDs tie together text, audio, lipsync, subtitles and localisation. Never rename by hand.'),

    GM('voq'), GM('linedur')
  ]),
  lesson('u18l2', 'Planning the batch', REF.vo, [
    LS('The VO maths', 'For L lines of W words at R words per minute:\n\n- minutes = L × W ÷ R\n- characters ≈ words × 6 (letters plus space and punctuation)\n- rendered characters = characters × takes\n- cost = rendered ÷ 1000 × price\n- review hours = minutes × QC factor ÷ 60\n- storage = seconds × sample rate × bytes per sample × channels\n\nWorked for 1,000 lines × 12 words: 12,000 words; 80 minutes; 72,000 characters; × 2 takes = 144,000; × $0.30/1k = **$43.20**; review 80 × 3 ÷ 60 = **4 h**; 48 kHz 16-bit mono masters = 80 × 60 × 48,000 × 2 B ≈ **439.5 MiB**.'),
    LS('Full-game scale', 'A Morrowind-scale world fully voiced might have tens of thousands of lines. The run below shows 40,000 lines is about 4,267 minutes (71 hours) of audio and over 200 hours of listening QC. That is why many games voice only greetings and key quests. Prices here are illustrative, so check current vendor pricing.', PX('f_vo')),
    M('500 lines × 10 words at 125 wpm is how many minutes?', '40', ['50', '62.5', '4'], '5,000 words ÷ 125 = 40 minutes.', 'Words ÷ wpm.'),
    GM('vominutes'), GM('vocost'), GM('voreview'), GM('wavmb')
  ]),
  lesson('u18l3', 'Quality control and consistency across sessions', REF.vo, [
    LS('Automatic QC', 'Before you listen, let a script reject obvious failures:\n\n- **length** far from expected (more than ±35%): skipped words, hallucinated words or a stuck generation\n- **clipping**: samples at full scale\n- **lead/trail silence** over about 0.5 s\n- loudness outside the target\n\nThe example flags a clipped file and one with a full second of lead silence. Then listen to every survivor at least once: mispronounced names, wrong emotion and odd breaths are only caught by ear.', PX('f_vo_qc')),
    LS('Keeping a character consistent', 'Voices drift when tools update or when you change settings. To prevent it:\n\n- pin **voice ID, model version and settings** per character in the cast sheet\n- keep a **reference line** per character and re-render it after any change, then A/B it against the original\n- use a **pronunciation dictionary** (phonetic respellings for Veyl, Brinewick, Lanternback)\n- render a character’s lines **in batches** in one session when possible'),
    TF('If a line’s duration is 40% longer than expected, it should be listened to before anything else.', true, 'Large length errors often mean repeated or invented words. Automatic QC sends it to the top of your list.', 'What causes extra length?'),
    GM('voreview'), GM('voq')

]);

unit('u19', 19, 'vo', 'imm', 'Voice ethics and law', 'Voices belong to people. This unit sets the rules you follow before you render a single line.', [
  lesson('u19l1', 'Consent, likeness and unions', REF.law, [
    LS('The rules', '1. **Never clone a real person’s voice** — an actor, a celebrity, a friend, or yourself if you lack the rights to the use — without **documented consent** that covers this use, this game and this distribution.\n2. **Do not imitate** a recognisable performer “in the style of” them. Many places protect voice and likeness (personality and publicity rights). Courts have found sound-alike imitation unlawful.\n3. Use **fully synthetic designed voices** or **consented voice-donor** libraries whose licences explicitly allow commercial games.\n4. If you hire actors, check **union agreements** (for example SAG-AFTRA’s interactive-media terms, which include AI provisions) and contract explicitly for any AI use, with pay and consent terms.\n5. Keep the **paperwork** with the voice ID in your cast sheet.\n\nThis is not legal advice. Laws differ by country and are changing, so check current rules where you sell.'),
    LS('Disclosure', 'Some storefronts (Steam, for example) ask you to disclose AI-generated content, and some laws (such as the EU AI Act’s transparency rules) cover synthetic media in certain contexts. A credits line like “Character voices created with synthetic voice technology; no real person’s voice was cloned” is good practice anyway.'),
    M('Which voice source is safest for a commercial game?', 'a designed synthetic voice, or a donor voice whose licence allows commercial games', ['a clone of a famous actor', 'a clone of a friend who agreed verbally', 'audio ripped from another game'], 'Clear licences and documented consent are what make it safe.', 'Paperwork.'),
    GM('lawq'), GM('voq')
  ])
]);
})();

(function () {

unit('u20', 20, 'sys', 'imm', 'Inventory, combat and magic', 'You specify every rule and number. AI can draft specs and code; you simulate before you adopt.', [
  lesson('u20l1', 'Inventory and items', REF.sys, [
    LS('Spec', 'Inventory spec for the slice:\n\n- items are **records** (id, name, value, weight, flags such as quest or light, damage range for weapons)\n- inventory maps item id → count\n- **quest items** cannot be dropped or sold until their quest ends\n- weight limit (later): carry capacity from strength\n- equip slots: weapon (slice), then armour pieces\n\nThe kernel’s world.json holds item records and the inventory is a dictionary. In Godot you would use `ItemData` resources and an `Inventory` autoload with signals (`item_added`, `item_removed`) the UI listens to.'),
    LS('Using AI for the spec and code', 'Prompt: *“Here is my inventory spec [paste]. Write a Godot 4 GDScript autoload `Inventory` with add/remove/has/count, signals, and save/load to a Dictionary. Include unit tests using a minimal test runner. Do not add features not in the spec.”*\n\nThen read the code line by line, run the tests, add the edge cases it missed (removing more than you hold, negative counts) and commit. The last sentence of the prompt matters: models love adding unrequested features.'),
    M('Why tell the coding assistant “do not add features not in the spec”?', 'models often add unrequested features that bloat and break scope', ['it makes code faster', 'it is required by Godot', 'to save tokens only'], 'Scope control applies to code too.', 'What do models tend to do?'),
    GM('sysq'), GM('engq')
  ]),
  lesson('u20l2', 'Combat maths', REF.sys, [
    LS('The slice formula', 'Hit chance = 75 − ⌊defence ÷ 2⌋ + ⌊(skill − 30) ÷ 2⌋, clamped to 5–95%. Damage is uniform within the weapon range. Expected damage per round = hit chance × average damage.\n\nWorked: skill 30 against the shellback (defence 45) gives 75 − 22 + 0 = **53%**. A gaff hook (4–8, average 6) does 0.53 × 6 = **3.18** expected damage per round, so the 22-HP crab takes about 7 rounds. That matches the capstone fight, which took 7 rounds.\n\nMorrowind-style games were criticised for frequent visible misses. You may prefer always-hit with damage scaled by skill. That is a **design decision**, and the formula should express it.', PX('g_systems')),
    LS('Simulate before adopting', 'If AI drafts a combat formula, put it in a spreadsheet or script and tabulate it across skills and enemies before using it. Look for: unwinnable fights at low level, trivial fights at mid level, and clamps that hide bugs.'),
    M('Skill 50 vs defence 30: hit chance?', '70%', ['60%', '65%', '75%'], '75 − 15 + 10 = 70.', 'Floor each half.'),
    GM('hitchance'), GM('hitchance')
  ]),
  lesson('u20l3', 'Magic', REF.sys, [
    LS('Systemic spells', 'The magic pillar promises spells that **combine with other systems**:\n\n| spell | cost | effect | system it touches |\n|---|---|---|---|\n| Kindle | 5 | light | darkness blocks looting in cellars |\n| Mend | 8 | heal 10 | combat and rest |\n| Spark Dart | 6 | 5–9 fire | creatures with fire weakness (shellback ×2) |\n\nIn the capstone, Spark Dart hit the shellback for 10 because its fire weakness doubled a roll of 5. Systemic spells are cheap to build and multiply content, so they are ideal for a solo developer.'),
    LS('Spell effects as data', 'Spells are records (cost, effect, magnitude, area, duration). A Morrowind-like spellmaker combines effects, which can be powerful but hard to balance. In the slice, use fixed spells and keep a spellmaker on the later list.'),
    TF('Systemic spells (light, fire weakness) give more gameplay per asset than unique scripted spells.', true, 'Each interaction with another system creates new situations without new content.', 'Multiplication.'),
    GM('sysq')
  ])
]);

unit('u21', 21, 'sys', 'rs2', 'Persuasion, travel, time and crime', 'The systems that make a world feel inhabited.', [
  lesson('u21l1', 'Persuasion and barter', REF.sys, [
    LS('Disposition', 'Each NPC has a **disposition** of 0–100 toward the player. Persuasion actions change it:\n\n- **admire**: success chance 40 + ⌊disp ÷ 2⌋%; +5 on success, −3 on failure\n- **bribe**: costs 10 gold, +8\n- **intimidate**: like admire, +6 on success\n\nBarter price = round(value × (1.5 − disp ÷ 100)). At disposition 40, a 24-value gaff hook costs round(24 × 1.1) = **26**, which is exactly what the capstone paid.\n\nExpected change for admire at disp 50: success 65%, so 0.65 × 5 − 0.35 × 3 = **+2.20**. Positive expected value, so spamming admire works. Morrowind players noticed the same thing. Decide whether you want that, for example with a daily cap.'),
    M('Disposition 80, value 24. Price?', '17', ['19', '24', '31'], '24 × (1.5 − 0.8) = 16.8 → 17.', 'Multiplier first.'),
    GM('barter'), GM('barter')
  ]),
  lesson('u21l2', 'Travel and time', REF.sys, [
    LS('The Lanternback', 'Travel spec: fixed **routes** (from, to, fare, hours) between dock cells; the ferryman sells passage; travel advances the clock; arrival in a named cell. The Brinewick → Veyl Spire route costs 25 gold and takes 6 hours. Starting from 08:00 with 40 gold, you arrive at 14:00 with 15. The kernel test checks exactly that.\n\nIt is original: a domesticated giant tortoise-barge with a lamp pavilion, invented from the setting’s logic (flats too shallow for boats, too wet for carts).'),
    LS('Time and rest', 'The clock drives NPC **schedules** (Tamsin at the market 07–19, at the dock otherwise), shop hours, regeneration (+2 HP and +3 MP per hour of rest) and timed quests. Resting is blocked when enemies are near. Clock wrap: resting 20 hours from 08:00 gives day 2, 04:00.\n\nSchedules that cross midnight (19 → 07) need the “wrap” test: inside if hour ≥ start **or** hour < end.'),
    M('A schedule says 19 → 7. Is 02:00 inside?', 'yes, because it wraps midnight (hour ≥ 19 or hour < 7)', ['no, because 2 < 19', 'only on even days', 'it depends on the weather'], 'Cross-midnight ranges use OR.', 'Draw it on a clock.'),
    GM('sysq'), GM('streamcells')
  ]),
  lesson('u21l3', 'Crime and the watch', REF.sys, [
    LS('Witness model', 'Taking an **owned** item is theft. It becomes a crime only if a **witness** is present: the owner or a guard in the same cell at that hour. Then bounty += 5 × value + 10, and the owner’s disposition drops by 20. Guards stop the player while the bounty is above zero; paying clears it.\n\nWorked: the salt cake (value 6) taken in front of Tamsin and Haskel gives 5 × 6 + 10 = **40** bounty.', PX('h_crime')),
    LS('Design questions for later', 'Jail time instead of a fine? Bounty per town or region? Do factions expel members for crimes? These are design questions for the cut list. The slice proves the witness loop works and is readable.'),
    M('A 15-gold ring stolen in front of a guard adds what bounty?', '85', ['75', '90', '25'], '5 × 15 + 10 = 85.', 'Multiply then add.'),
    GM('bounty'), GM('sysq')
  ])
]);

unit('u22', 22, 'sys', 'rd', 'Factions, journal, dialogue UI and saves', 'The systems that remember what you did.', [
  lesson('u22l1', 'Factions and the journal', REF.sys, [
    LS('Factions', 'A faction record holds a name, ranks (Chainbearer → Surveyor → Pathwright), requirements per rank (reputation, skills, quests done), allies and enemies, and its dialogue conditions. The player state holds membership, rank index and reputation per faction.\n\nIn the slice, handing in the ledger joins you at rank 0 and adds +10 reputation. The Lodge greeting changes by condition (`faction: lodge`): “You wear our badge now.”'),
    LS('Journal', 'The journal is prose per quest stage, dated by in-game day. Write it in the player character’s voice, and never contradict the quest state. The capstone journal shows days and the three Tithe Ledger entries in order. Add a **topic index** (quests by name) and you have Morrowind’s journal structure with your own content.'),
    TF('Journal entries should be written per quest stage, not per dialogue line.', true, 'Stages are the state; the journal narrates state changes.', 'What is the source of truth?'),
    GM('sysq')
  ]),
  lesson('u22l2', 'Dialogue UI', REF.sys, [
    LS('Layout', 'A topic dialogue window has: speaker name and portrait, scrolling **history** of lines (topics highlighted and clickable), a **topic list**, persuade/barter/travel buttons when relevant, and a goodbye button.\n\nAccessibility: subtitles always on by default for voiced lines, speaker names on every line, adjustable text size, and no information carried by colour alone (underline topics as well as colouring them).'),
    LS('UI as data', 'The window reads from the same dialogue runtime as the kernel: `talk()` shows the greeting and topics, `ask()` shows the first matching entry and applies effects. The UI never decides game logic. It only displays state and sends commands. This separation is what let the course test the whole slice with a text kernel.'),
    M('Topics should be marked by…', 'colour and an underline or other non-colour cue', ['colour only', 'a sound only', 'nothing; players will find them'], 'Do not carry meaning by colour alone.', 'Colour-blind players.'),
    GM('prodq')
  ]),
  lesson('u22l3', 'Save games', REF.sys, [
    LS('What a save contains', 'Save **state**, not content: position, clock, inventory, quest stages, topics known, dispositions, factions, bounty, dead creatures and taken items per cell, and the RNG state if you want determinism. Content (world.json) is loaded fresh, so patches can fix content without breaking saves.\n\nAlways write a **version** number. When the format changes, write a **migration** function from each old version to the next, and test it. The example migrates v1 → v2 (renames `equip` to `equipped.weapon`, moves `rep` to `reputation`) and proves the migration is idempotent.', PX('g_save')),
    LS('In Godot', 'A save is usually a Dictionary written with `FileAccess` as JSON, or a custom `Resource`. Write to a temporary file, then rename it, so a crash mid-write cannot corrupt the old save.', GD(`func save_game(path: String, state: Dictionary) -> void:
	state["v"] = SAVE_VERSION
	var tmp := path + ".tmp"
	var f := FileAccess.open(tmp, FileAccess.WRITE)
	f.store_string(JSON.stringify(state))
	f.close()
	DirAccess.rename_absolute(tmp, path)   # atomic-ish replace`)),
    TF('Saves should include the full world content so they can be loaded without the game files.', false, 'Save state only; content comes from the current game files so patches apply.', 'What do patches change?'),
    GM('sysq'), GM('flagbyte')
  ])
]);
})();

unit('u23', 23, 'eng', 'rd', 'Project structure, asset database and imports', 'Thousands of generated files become a game only if every one has a home, a name and a record.', [

  assets/

    materials/  anims/  vfx/

  data/            # JSON or .tres: items, npcs, dialogue, quests, factions, loot, encounters, loc

  tests/

source_art/        # OUTSIDE res:// : high-poly sculpts, PSDs, raw generations, job logs`, 'Recommended project tree')),
    LS('Why source_art lives outside', 'Raw generations, high-poly sculpts and rejected takes must **not** be imported into the game project. They bloat imports and builds. Keep them in `source_art/` with job logs, under Git LFS or a separate archive, and only export finals into `res://assets`.'),
    M('Where should 400 raw image-to-3D outputs go?', 'source_art/ outside the engine project, with their job logs', ['res://assets/meshes', 'the build folder', 'delete them immediately'], 'Only finals enter the project; sources stay archived with provenance.', 'Imports cost time.'),

  lesson('u23l2', 'Naming conventions and the asset database', REF.asset, [
    LS('The convention', '`PREFIX_CAT_REG_lower_snake_name_NN[_Suffix]`\n\n| slot | meaning | examples |\n|---|---|---|\n| PREFIX | asset kind | SM static mesh, SK skeletal, T texture, M material, A animation, SFX, VO, MUS, ICO, FX |\n| CAT | 3-letter category | ARC architecture, CRE creature, ITE item, DIA dialogue |\n| REG | 3-letter region | BRI Brinewick, SAL Saltmarch |\n| name | lower_snake | wall_straight, odra_greet |\n| NN | 2-digit variant | 01 |\n| Suffix | role | LOD0, BaseColor, Normal, ORM |\n\nThe path is derived from the name, so you never choose it by hand. A **validator** rejects names like `wall_final_FINAL2`.', PX('b_naming')),
    LS('The asset database', 'Keep one record per asset (a CSV or SQLite table, generated by tools): id, kind, path, status, source job ID(s), tool and version, licence note, author (you), hours, triangle count, texture memory and the data IDs that use it. Tools can then answer “which items have no icon?” or “which assets came from tool X version Y?”. You will need that if a licence question ever arises.'),
    M('Which name is valid?', 'SK_CRE_SAL_shellback_crab_01', ['SK_CRE_SAL_Shellback Crab_01', 'shellback_final2', 'SK_CREATURE_SAL_shellback_01'], 'Uppercase prefix, 3-letter codes, lower_snake name, 2-digit variant.', 'Check each slot.'),

unit('u24', 24, 'eng', 'op', 'The living world: streaming, schedules and navigation', 'An open world loads around the player and its people move with purpose.', [
  lesson('u24l1', 'Scene streaming', REF.eng, [
    LS('Cells', 'Divide exteriors into a grid of **cells** (say 128 m). Keep a radius of cells loaded around the player: radius 1 means a 3 × 3 block of 9 cells; radius 2 means 5 × 5 = 25. When the player crosses into a new cell, stream in the new edge and unload the far edge, in the background so the frame never hitches. Interiors (the Tithe Cellar) are separate cells loaded on the door transition.\n\nThe example shows each step east streams 3 cells in and 3 out, and memory stays roughly flat. Radius 2 would hold 1,540 MB, so you budget the radius against target RAM.', PX('h_streaming')),
    LS('In Godot', 'Load cells with `ResourceLoader.load_threaded_request()` and add them to the tree when ready; free them with `queue_free()`. Keep cell scenes self-contained (no references into neighbours) so loading order never matters.'),
    M('A streaming radius of 3 loads how many cells?', '49', ['9', '25', '36'], '(2 × 3 + 1)² = 7² = 49.', 'Side = 2r + 1.'),
    GM('streamcells'), GM('engq')
  ]),
  lesson('u24l2', 'NPC schedules and navmesh', REF.eng, [
    LS('Schedules', 'A schedule is a list of (start hour, end hour, place, activity). Each game hour, the NPC picks the matching entry and walks there. When the NPC is in an unloaded cell, **teleport it logically**: update its position in data and only simulate the walk when the player can see it.'),
    LS('Navmesh and A*', 'A **navmesh** is the walkable surface as polygons. Pathfinding runs A* over it: expand the cheapest *cost so far + estimated cost to go* first, where the estimate (Manhattan distance on a grid) never overestimates. The grid example finds a 10-step path from the dock (D) to the Lodge door (L) around the stalls, expanding 17 nodes. Godot’s NavigationServer bakes navmeshes from geometry and gives you `NavigationAgent3D` for steering.', PX('h_navmesh')),
    TF('A* with a heuristic that never overestimates finds a shortest path.', true, 'An admissible heuristic keeps A* optimal.', 'Admissible.'),
    GM('engq')
  ])
]);

unit('u25', 25, 'eng', 'f7', 'Runtimes: dialogue, quests, audio and localisation', 'The systems from Part 7 become code that reads Part 5’s data.', [
  lesson('u25l1', 'The dialogue graph runtime and quest state machine', REF.eng, [
    LS('Dialogue runtime', 'The runtime does four things:\n\n1. `talk(npc)`: play the greeting (with VO), learn the bracketed topics, list known topics.\n2. `ask(npc, topic)`: walk that topic’s entries in order and pick the first whose `npc` matches (or `*`) and whose conditions pass.\n3. Apply **effects**: quest stage, items, faction join, gold, reputation.\n4. Emit events the UI and audio listen to.\n\nThe kernel implements exactly this in about 30 lines (`talk`, `ask`, `cond_ok`).'),
    LS('Quest machine', 'A quest manager stores stage per quest and only moves **forward** (`set_stage` ignores lower stages, which prevents regressions from replayed events). Triggers (pickup, enter, kill) are matched against the current stage. Each change appends a dated journal entry and fires a signal.', GD(`# quests.gd (autoload)
signal stage_changed(quest: StringName, stage: int)
var stages := {}                     # quest -> int

func set_stage(q: StringName, s: int) -> void:
	if s <= stages.get(q, 0):
		return                       # forward only
	stages[q] = s
	Journal.add(QuestDB.text(q, s))
	stage_changed.emit(q, s)`)),
    M('Why does set_stage ignore lower stages?', 'to stop replayed or out-of-order events from moving a quest backwards', ['to save memory', 'because Godot requires it', 'to skip journal entries'], 'Forward-only state is robust against duplicate events.', 'What if an event fires twice?'),
    GM('engq'), GM('writeq')
  ]),
  lesson('u25l2', 'Audio mixer', REF.eng, [
    LS('Bus layout', 'Master → Music, Ambience, SFX, VO, UI. Rules:\n\n- **VO ducks** Music and Ambience by about 6 dB while a line plays (a sidechain compressor, or a script that tweens bus volume)\n- **3D** for diegetic VO and SFX, with distance attenuation and room reverb sends (cellar vs flats)\n- per-bus **volume sliders** in settings, plus a separate VO slider for accessibility\n- loudness targets per bus so assets from different AI tools sit together\n\nIn Godot, set buses in the Audio panel (default_bus_layout.tres); `AudioServer.set_bus_volume_db()` controls them at runtime.'),
    TF('Narration should go through the same 3D reverb as NPC speech.', false, 'Narration is non-diegetic: 2D and dry.', 'Diegetic or not?'),
    GM('engq'), GM('framems')

unit('u27', 27, 'eng', 'imm', 'Numbers in game data: flags, colours and IDs', 'Game data is full of hex and bits: NPC flag bytes, palette colours, record IDs. Each conversion is explained with a method you can do in your head, then drilled.', [
  lesson('u27l1', 'Decimal, hex and binary, step by step', REF.base, [
    LS('Positional notation', 'Every base works the same way: each place is worth the base to a power.\n\n- **decimal** places: 1, 10, 100…\n- **binary** places: 1, 2, 4, 8, 16, 32, 64, 128\n- **hex** places: 1, 16, 256…; digits 0–9 then A=10, B=11, C=12, D=13, E=14, F=15\n\nOne hex digit is exactly four bits (a **nibble**), so a byte is two hex digits. That is why hex is the language of data dumps.'),
    LS('Methods with a worked example', '**Decimal → hex**: divide by 16. The quotient is the high digit and the remainder is the low digit. 217 = 13 × 16 + 9, so it is **D9**.\n\n**Hex → decimal**: high digit × 16 + low digit. 0x5D = 5 × 16 + 13 = **93**.\n\n**Decimal → binary**: walk 128, 64, 32 … 1, writing 1 and subtracting when the place fits. 93 = 64 + 16 + 8 + 4 + 1 = **0101 1101**.\n\n**Binary → hex**: split into nibbles and convert each. 0101 = 5 and 1101 = D, so it is **0x5D**. That last method is the fastest check of all.'),
    M('0x2F in decimal is…', '47', ['32', '42', '215'], '2 × 16 + 15 = 47.', 'High × 16 + low.'),

  ]),
  lesson('u27l2', 'Flag bytes for NPCs and items', REF.base, [
    LS('Bits as switches', 'A **flag byte** packs eight yes/no properties into one number. Bit i is worth 2^i. With bit 0 = quest, 1 = hostile, 2 = merchant, 3 = essential, 4 = guard, 5 = ferry, 6 = trainer and 7 = undead:\n\n- Odra is quest + essential = 1 + 8 = **9** = 0x09 = 0000 1001\n- Haskel is guard + essential = 16 + 8 = **24** = 0x18 = 0001 1000\n- Ilvo is ferry + merchant = 32 + 4 = **36** = 0x24 = 0010 0100\n\nTo **test** a flag in code, use `(flags >> bit) & 1`. To **set** it, use `flags | (1 << bit)`. To **clear** it, use `flags & ~(1 << bit)`. The Godot `NPCData.is_flag()` in Unit 5 does exactly this.', PX('j_hexflags')),
    LS('Form IDs and colours', 'Many engines and data formats split a 32-bit record ID into fields: the top byte for the content pack, the low 24 bits for the local ID. 0x0001A3F2 has pack byte 0x00 and local ID 0x01A3F2 = 107,506. Palette colours are three bytes, #RRGGBB. Try the **Flags and colours** lab, then the drill.'),

unit('u31', 31, 'law', 'rs1', 'Copyright, IP and safety', 'What you can own, what you must not take, and lines you never cross. This is general education, not legal advice. Laws differ by country and change quickly, so check current rules where you sell.', [
  lesson('u31l1', 'Who owns generated work?', REF.law, [
    LS('Authorship', 'In the United States, the Copyright Office and the courts (Thaler v. Perlmutter, 2025) say copyright needs **human authorship**. Output generated purely by a prompt is generally not protected. Human contributions can be: your **selection and arrangement**, your edits, paint-overs and 3D cleanup, your writing, and the game as a whole. Other countries differ. The UK has a provision for computer-generated works, for example, and its future is under review.\n\nPractical consequences:\n\n- keep **records** of your human contribution (job logs, before/after files, edit history)\n- assume raw generations may be **copyable by others**\n- your game’s code, data design, edited text and integrated whole are where your rights are strongest'),
    LS('Tool terms', 'Every tool’s terms say who may use outputs and how: commercial use, attribution, revenue caps, and whether your inputs train their models. Save a copy of the terms with the date you used the tool, in the asset database.'),
    TF('Under current US guidance, a raw image generated from a short prompt is fully copyrighted by the prompter.', false, 'Human authorship is required; prompts alone are generally not enough. Human edits and arrangement can be protected.', 'Who authored the pixels?'),
    GM('lawq')
  ]),
  lesson('u31l2', 'Training-data risk, style prompts and near-copies', REF.law, [
    LS('Risks', '- **Memorisation**: models can reproduce training images, music or text closely, especially famous ones. Check outputs that look *too* good or too familiar, using reverse image search.\n- **“In the style of [living artist]”**: style in general is not protected, but such prompts invite near-copies of specific works and harm real artists. Describe qualities instead (palette, brushwork, era, medium).\n- **Characters and designs**: prompts naming another franchise’s characters, creatures or places produce infringing material even when the result is “new”.\n- **Music**: melodies are protected. AI music can echo famous tunes. Check, and keep the licence.\n\nYour curation log has a rejection reason for this: “too close to a known IP”. Use it.'),
    M('Instead of “in the style of [famous painter]”, write…', 'the qualities you want: palette, brushwork, era, medium', ['the painter’s name twice', 'the painter’s most famous painting title', 'nothing about style'], 'Describing qualities gives control without copying a person’s work.', 'Describe, do not name.'),
    GM('lawq')
  ]),
  lesson('u31l3', 'Trademarks, names and the store page', REF.law, [
    LS('Trademarks', 'Game titles, studio names and logos are often **trademarks**. Do not name your game, factions or products after another game’s marks (“Morrowind”, “Elder Scrolls”) or use them in a way suggesting endorsement. Describing your game factually (“inspired by classic open-world RPGs”) is safer than using the mark. Search trademark databases for your own title before you announce it.'),
    TF('Calling your game “Morrowind Reborn” is fine if it is free.', false, 'Trademark confusion does not depend on price.', 'Would people think it is official?'),
    GM('lawq')
  ]),
  lesson('u31l4', 'Absolute safety lines', REF.law, [
    LS('Never', 'Regardless of tool, fiction or setting:\n\n- **never** generate sexual content involving minors, or characters presented as minors. This is illegal and abhorrent. No “fantasy age” loophole exists.\n- **never** generate sexual or intimate content depicting **real people** without their consent, and no deepfakes of real people at all in your game\n- **never** clone real people’s voices or faces without documented consent\n\nThis course’s world is **original fantasy**, and its characters are **adults**. If a tool’s output drifts toward any of the above, delete it, adjust the prompt and filters, and move on. Keep the provider’s safety filters on.'),
    LS('Live generation', 'If your game generates content **at runtime** (AI NPC replies, generated images), you are responsible for what it produces. Platforms ask how you prevent illegal content. Use strong filters, constrain outputs to your canon, log responsibly and give players a reporting path. Most solo RPGs are better off generating content **offline**, reviewing it and shipping it fixed, which is what this course teaches.'),
    M('Which practice keeps generated game content safest?', 'generate offline, review, and ship fixed content', ['generate everything live with filters off', 'let players prompt any image in-game', 'skip review for minor NPCs'], 'Offline generation plus review keeps you in control.', 'When does a human see it?'),
    GM('lawq'), GM('lawq')
  ])
]);
})();
