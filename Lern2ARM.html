CRAFT.units.push({
  id: 'u6', n: 6, track: 'mem', tone: 'rs1', title: 'Loads, stores and addressing',
  blurb: 'ldr and str with offset, pre-indexed and post-indexed addressing, bytes and halfwords, signed loads, alignment and endianness, ldm and stm, and scheduling loads so the pipeline never waits.',
  lessons: [
    {
      id: 'u6l1', title: 'Addressing modes', ref: REF.mem,
      items: [
        { t: 'learn', h: 'Three ways to form the address', body: 'ARM is a **load/store** architecture: arithmetic works only on registers, and memory is touched only by loads and stores.\n\n- **Offset**: `ldr r0, [r1, #8]` reads address r1 + 8; r1 is unchanged.\n- **Pre-indexed with writeback**: `ldr r0, [r1, #8]!` reads r1 + 8 **and** sets r1 = r1 + 8.\n- **Post-indexed**: `ldr r0, [r1], #4` reads address r1, **then** sets r1 = r1 + 4. This is the pointer-walk you want in loops: the load and the pointer increment are one instruction.\n\nThe offset can also be a register, optionally shifted: `ldr r0, [r1, r2, lsl #2]` reads r1 + 4·r2. Use `-` for subtract: `[r1, #-4]`, `[r1, -r2]`.\n\nWord offsets range ±4095. Byte loads `ldrb`/`strb` share that range; halfword and signed loads (`ldrh`, `ldrsh`, `ldrsb`, `ldrd`) only reach ±255.\n\nWalk-through: the code below stores 10, 20 and 30 in a stack buffer with post-indexing, then sums them with post-indexed loads. The base pointer moves 4 bytes per access with no extra add.', viz: X('sub sp, sp, #16\nmov r1, sp\nmov r2, #10\nstr r2, [r1], #4\nmov r2, #20\nstr r2, [r1], #4\nmov r2, #30\nstr r2, [r1], #4\nmov r1, sp\nldr r0, [r1], #4\nldr r2, [r1], #4\nldr r3, [r1], #4\nadd r0, r0, r2\nadd r0, r0, r3\nadd sp, sp, #16', [], 60, { show: 'r0 = 60' }) },
        PNA('How many bytes did r1 advance? (r0 = r1 after − r1 before)', 'sub sp, sp, #32\nmov r1, sp\nmov r3, r1\nldr r2, [r1, #4]!\nldr r2, [r1], #8\nldr r2, [r1, #4]\nsub r0, r1, r3\nadd sp, sp, #32', [], 12, 'Pre-index with ! adds 4 before the access; post-index adds 8 after it; a plain offset adds nothing. Total 12. The code points r1 at a 32-byte stack buffer so every load is valid.'),
        { t: 'match', q: 'Match each form with what happens to r1.', pairs: [['`ldr r0, [r1, #4]`', 'unchanged'], ['`ldr r0, [r1, #4]!`', 'r1 + 4, before the access'], ['`ldr r0, [r1], #4`', 'r1 + 4, after the access'], ['`ldr r0, [r1, r2, lsl #2]`', 'unchanged; address r1 + 4·r2']], why: 'Writeback happens with ! (pre-index) or always with post-index.' },
        { t: 'mcq', q: 'Which loop body walks an int array with the fewest instructions per element (r0 = pointer, r2 = sum)?', opts: ['`ldr r1, [r0], #4` then `add r2, r2, r1`', '`ldr r1, [r0]`, `add r0, r0, #4`, `add r2, r2, r1`', '`add r0, r0, #4`, `ldr r1, [r0, #-4]`, `add r2, r2, r1`', '`ldr r1, [r0, #4]!`, `add r2, r2, r1`, `sub r0, r0, #0`'], a: 0, why: 'Post-indexing folds the pointer increment into the load: 2 instructions per element instead of 3.' },
        { t: 'tf', q: '`ldrh r0, [r1, #300]` is a valid A32 instruction.', a: false, why: 'Halfword and signed-byte loads have an 8-bit offset field: ±255. Use a register offset or adjust the base.' }
      ]
    },
    {
      id: 'u6l2', title: 'Bytes, halfwords, signs and endianness', ref: REF.mem,
      items: [
        { t: 'learn', h: 'Widening on load, narrowing on store', body: '- `ldrb` loads a byte and **zero-extends** it to 32 bits; `ldrsb` **sign-extends** (copies bit 7 upward).\n- `ldrh` / `ldrsh` do the same for 16-bit halfwords.\n- `strb` / `strh` store only the low 8 / 16 bits of the register.\n\nARM Linux is **little-endian**: the lowest-addressed byte of a word is its least significant byte. Storing 0x11223344 at address a puts 0x44 at a, 0x33 at a + 1, 0x22 at a + 2 and 0x11 at a + 3.\n\nAlignment: words should be at multiples of 4 and halfwords at multiples of 2. ARMv7 can handle unaligned `ldr`/`str` (slower, and they may cross cache lines), but `ldm`, `stm` and `ldrd` must be aligned. Keep data aligned and you never pay.\n\nWalk-through below: store 0x11223344, then read back the byte at offset 1 (0x33) and the signed halfword at offset 2 (0x1122 = 4386).', viz: X('sub sp, sp, #8\nstr r0, [sp]\nldrb r1, [sp, #1]\nldrsh r2, [sp, #2]\nadd r0, r1, r2\nadd sp, sp, #8', [0x11223344], 4437, { show: 'r0 = 0x33 + 0x1122 = 51 + 4386 = 4437' }) },
        PNA('What is r0 (signed decimal)?', 'sub sp, sp, #8\nstr r0, [sp]\nldrsb r0, [sp]\nadd sp, sp, #8', [0x12345680], -128, 'Little-endian: the byte at offset 0 is the low byte, 0x80. ldrsb sign-extends: 0xFFFFFF80 = −128.'),
        PNA('What is r0? (hex)', 'sub sp, sp, #8\nstr r0, [sp]\nldrh r0, [sp, #2]\nadd sp, sp, #8', [0xCAFEBABE], 0xCAFE, 'Bytes at offsets 0–3 are BE BA FE CA. The halfword at offset 2 is FE CA read little-endian: 0xCAFE, zero-extended.', { base: 'hex' }),
        { t: 'mcq', q: 'You need the byte-swapped (big-endian) form of r0 for a network header. Cheapest?', opts: ['`rev r0, r0` (1 instruction)', 'four ldrb and three orr', 'store, then reload with ldrb in reverse order', 'ror #8 twice'], a: 0, why: 'ARMv6 and later have rev: AABBCCDD → DDCCBBAA in one cycle. ror alone cannot reverse bytes.' },
        { t: 'tf', q: 'On ARMv7, `ldm` from an address that is not a multiple of 4 is fine but slow.', a: false, why: 'ldr and str allow unaligned access on ARMv7 (when SCTLR.A is clear), but ldm, stm, ldrd and strd always need word alignment and fault otherwise.' }
      ]
    },
    {
      id: 'u6l3', title: 'ldm, stm and hiding load latency', ref: REF.cost,
      items: [
        { t: 'learn', h: 'Many registers, one instruction', body: '`ldmia r0!, {r4-r7}` loads 4 words from r0, r0 + 4, r0 + 8, r0 + 12 into r4–r7 (lowest register from the lowest address) and, with !, leaves r0 + 16 in r0. Variants: **ia** increment after, **ib** increment before, **da** decrement after, **db** decrement before. `push {…}` is `stmdb sp!, {…}` and `pop {…}` is `ldmia sp!, {…}`.\n\nWhy it is fast: one instruction fetch, and the memory system moves about two registers per cycle after the first beat on A7/A9. Copying 16 bytes takes 2 instructions (ldm + stm) instead of 8.\n\n**Load-use latency.** After `ldr r1, …`, the value arrives a couple of cycles later. Using it on the very next instruction stalls. Fix: **schedule** — interleave independent work:\n\n- naive: `ldr r1, [r0], #4`, `add r2, r2, r1`, `ldr r3, [r0], #4`, `add r2, r2, r3` (two stalls)\n- scheduled: `ldr r1, [r0], #4`, `ldr r3, [r0], #4`, `add r2, r2, r1`, `add r2, r2, r3` (the first add’s input is ready by then)\n\nSame instructions, fewer cycles. Cortex-A9 reorders some of this itself; A7 does not, so write it scheduled.', viz: X('sub sp, sp, #16\nmov r4, #1\nmov r5, #2\nmov r6, #3\nmov r7, #4\nmov r0, sp\nstmia r0!, {r4-r7}\nldmdb r0!, {r8-r11}\nadd r0, r8, r11, lsl #4\nadd sp, sp, #16', [], 65, { show: 'r8 = 1 and r11 = 4, so r0 = 1 + 4·16 = 65' }) },
        { t: 'num', q: '`ldmia r0!, {r2-r5, r8}` with r0 = 0x1000. What is r0 afterwards? (hex)', base: 'hex', a: 0x1014, hint: 'Count the registers, 4 bytes each.', why: '5 registers × 4 = 20 = 0x14: r0 = 0x1014.' },
        { t: 'mcq', q: 'Which ordering of these four instructions runs fastest on an in-order core?\n(1) `ldr r1, [r0]` (2) `add r1, r1, #1` (3) `ldr r2, [r3]` (4) `add r2, r2, #1`', opts: ['1, 3, 2, 4', '1, 2, 3, 4', '3, 4, 1, 2', '2, 4, 1, 3'], a: 0, why: 'Starting both loads before either add gives each load a slot of latency for free. 1-2-3-4 stalls twice. 2-4-1-3 is wrong: it uses values before loading them.' },
        { t: 'order', q: 'Order the registers as `stmdb sp!, {r4, r5, lr}` stores them, lowest address first.', items: ['r4', 'r5', 'lr'], why: 'stm always stores the lowest-numbered register at the lowest address, whatever the list order you write or the direction.' },
        { t: 'tf', q: '`push {r4-r11, lr}` is a single instruction.', a: true, why: 'It is `stmdb sp!, {r4-r11, lr}`: 9 registers, 36 bytes, one instruction. Note 36 is not a multiple of 8, so a function that pushes 9 registers must adjust sp by 4 more before calling anything (Unit 7).' }
      ]
    }
  ]
});

const ADD64_C = A`#include <stdio.h>
#include <stdint.h>
uint64_t add64(uint64_t a, uint64_t b);
int sum5(int a, int b, int c, int d, int e);
int main(void)
{
    printf("%llx %d\n", (unsigned long long)add64(0xFFFFFFFFull, 1), sum5(1, 2, 3, 4, 100));
    return 0;
}`;
const ADD64_S = A`.syntax unified
.arm
.text
.global add64
.type add64, %function
add64:                    @ a in r1:r0, b in r3:r2
    adds r0, r0, r2       @ low words, C = carry
    adc  r1, r1, r3       @ high words + carry
    bx   lr               @ result in r1:r0
.global sum5
.type sum5, %function
sum5:                     @ a-d in r0-r3, e on the stack at [sp]
    ldr  r12, [sp]        @ 5th argument
    add  r0, r0, r1
    add  r2, r2, r3       @ independent adds: no chain
    add  r0, r0, r12
    add  r0, r0, r2
    bx   lr`;
const SUMSQ_S = A`.syntax unified
.arm
.text
.global sum_sq
.type sum_sq, %function
sum_sq:                   @ r0 = n: returns square(1) + ... + square(n)
    push {r4, r5, r6, lr} @ 16 bytes: sp stays 8-byte aligned
    mov  r4, r0           @ n survives the calls in r4
    mov  r5, #0           @ total
loop:
    mov  r0, r4
    bl   square           @ C function, may change r0-r3, r12
    add  r5, r5, r0
    subs r4, r4, #1       @ count down: no separate cmp
    bne  loop
    mov  r0, r5
    pop  {r4, r5, r6, pc} @ restore and return in one instruction`;
const SUMSQ_C = A`#include <stdio.h>
int sum_sq(int n);
int square(int x) { return x * x; }
int main(void)
{
    printf("%d\n", sum_sq(4));
    return 0;
}`;

CRAFT.units.push({
  id: 'u7', n: 7, track: 'mem', tone: 'rd', title: 'The stack, functions and the AAPCS',
  blurb: 'push and pop, 8-byte stack alignment, which registers you may destroy and which you must keep, arguments beyond four and 64-bit values, leaf functions, tail calls, and calling C from assembly.',
  lessons: [
    {
      id: 'u7l1', title: 'The calling contract', ref: REF.aapcs,
      items: [
        { t: 'learn', h: 'AAPCS in one card', body: '- **Arguments**: the first four 32-bit arguments in **r0–r3**; the rest on the stack, the 5th at [sp] on entry.\n- **64-bit arguments** go in an **even/odd pair** (r0:r1 or r2:r3), low word in the lower register. A 64-bit result comes back in r0 (low) and r1 (high).\n- **Scratch** (caller-saved): r0–r3, r12 and lr. A function may destroy them.\n- **Preserved** (callee-saved): r4–r11 and sp. If you use them, push them first and pop them before returning.\n- **Stack**: full descending (sp points at the last pushed word), and **8-byte aligned at every public call**.\n\nThe efficiency rule: a **leaf** function (one that calls nothing) should use only r0–r3 and r12 if it can. Then it needs no push, no pop and no stack at all: the cheapest possible function.\n\nThe example: add64 is two instructions plus bx lr. sum5 reads its 5th argument from [sp]; the two middle adds are independent so the core can overlap them.', viz: PROG([['abi.s', ADD64_S, 'asm'], ['main.c', ADD64_C, 'c']], '100000000 110') },
        { t: 'match', q: 'Match each register group with its AAPCS role.', pairs: [['r0–r3', 'arguments, result, scratch'], ['r4–r11', 'must be preserved by the callee'], ['r12', 'scratch (intra-procedure call register)'], ['lr', 'return address; scratch once saved']], why: 'Use r0–r3 and r12 first in leaf functions: they cost nothing to use.' },
        { t: 'mcq', q: '`f(int a, uint64_t b)`: where does b arrive?', opts: ['r2:r3 (r1 is skipped)', 'r1:r2', 'on the stack', 'r0:r1'], a: 0, why: '64-bit values need an even-numbered first register, so b takes r2 (low) and r3 (high) and r1 is left unused.' },
        { t: 'tf', q: 'A leaf function that only uses r0–r3 and r12 needs no push or pop.', a: true, why: 'Those registers are scratch and lr is untouched (no bl), so `bx lr` returns directly.' },
        { t: 'num', q: 'A function receives 6 int arguments. At entry, at what offset from sp is the 6th one?', a: 4, unit: 'bytes', hint: 'The 5th is at [sp].', why: 'The 5th is at [sp, #0] and the 6th at [sp, #4].' }
      ]
    },
    {
      id: 'u7l2', title: 'Frames, alignment and calling C', ref: REF.aapcs,
      items: [
        { t: 'learn', h: 'Non-leaf functions', body: 'A function that calls another must keep lr (bl overwrites it) and anything it needs after the call in r4–r11.\n\n1. **Entry**: `push {r4, r5, r6, lr}`. Push an **even** number of registers so sp stays 8-byte aligned; r6 here is padding if unused.\n2. **Body**: keep live values in r4–r11 across each `bl`.\n3. **Exit**: `pop {r4, r5, r6, pc}`. Popping the saved lr straight into pc returns: one instruction instead of pop + bx lr.\n\nWalk through `sum_sq(4)`: r4 = 4, r5 = 0. Each pass calls square(r4) and adds the result. r4 counts down 4, 3, 2, 1, so the squares are 16, 9, 4, 1 and the running totals 16, 25, 29, 30. The result is **30**.\n\nCounting down to zero means `subs` sets Z for `bne`: no `cmp` in the loop.', viz: PROG([['sumsq.s', SUMSQ_S, 'asm'], ['main.c', SUMSQ_C, 'c']], '30') },
        { t: 'mcq', q: 'Why `pop {r4, r5, r6, pc}` and not `pop {r4, r5, r6, lr}` then `bx lr`?', opts: ['one instruction does both the restore and the return', 'bx lr is not allowed after pop', 'pc is faster to write than lr', 'it keeps the flags'], a: 0, why: 'Loading the saved return address straight into pc returns (with ARM/Thumb interworking on ARMv5T and later). It saves an instruction and a cycle.' },
        { t: 'num', q: 'A function pushes r4–r8 and lr. How many more bytes must it subtract from sp to keep 8-byte alignment before a call?', a: 0, unit: 'bytes', hint: 'Count the registers × 4.', why: '6 registers = 24 bytes, a multiple of 8: no adjustment needed. With 5 registers (20 bytes) you would add a padding register or `sub sp, sp, #4`.' },
        { t: 'learn', h: 'Tail calls', body: 'If the last thing a function does is call another and return its result, do not `bl` then return: **branch** to it with `b`. The callee returns straight to your caller, using the lr you were given.\n\n```\nnaive:                      tail call:\n  push {r4, lr}               add r0, r0, #1\n  add  r0, r0, #1             b   square\n  bl   square\n  pop  {r4, pc}\n```\n\nThe tail-call version is 2 instructions instead of 4, needs no stack, and has one return instead of two. Requirements: no stack arguments of your own to clean up, and nothing left to do after the call.' },
        { t: 'tf', q: 'A tail call needs to save lr first.', a: false, why: 'b does not change lr, so lr still holds your caller’s return address. The callee’s `bx lr` goes straight back there.' },
        { t: 'order', q: 'Order a non-leaf function that keeps a value across a call.', items: ['`push {r4, lr}`', '`mov r4, r1` (keep r1 safe)', '`bl helper`', '`add r0, r0, r4`', '`pop {r4, pc}`'], why: 'Save, move the live value into a preserved register, call, use it, restore-and-return.' }
      ]
    }
  ]
});

CRAFT.units.push({
  id: 'u8', n: 8, track: 'flow', tone: 'op', title: 'Branches and loops',
  blurb: 'b, bl and bx, what branches really cost, static and dynamic prediction, counting down to zero, loop inversion, unrolling, and the instruction-count arithmetic behind every loop you write.',
  lessons: [
    {
      id: 'u8l1', title: 'Branches and their cost', ref: REF.cost,
      items: [
        { t: 'learn', h: 'b, bl, bx and prediction', body: '- `b label` jumps (±32 MB in A32). Any condition: `bne`, `bhs`…\n- `bl label` jumps and puts the return address in lr.\n- `bx Rm` jumps to the address in a register, switching to Thumb if bit 0 is 1. `bx lr` is the standard return. `blx Rm` calls through a register.\n\nThe core fetches ahead, so it must **guess** the outcome of every conditional branch before it knows the flags. Cortex-A7 and A9 use a branch history table and a return stack:\n\n- loop branches that are almost always taken are predicted well;\n- function returns via `bx lr` or `pop {…, pc}` are predicted by the return stack;\n- branches that depend on random data mispredict about half the time, at about 8 cycles each.\n\nRules of thumb:\n\n1. Remove short data-dependent branches with conditional execution (Unit 4).\n2. Put the **common** path in the fall-through.\n3. Keep loop-closing branches at the **bottom** of the loop so there is one taken branch per pass, not two.' },
        { t: 'mcq', q: 'Which branch is most likely to mispredict often?', opts: ['`blt` on the sign of random input data', 'the `bne` that closes a 1000-pass loop', '`bx lr` returning from a function', '`b` (always) to the loop top'], a: 0, why: 'Random data gives a coin flip. Loop branches mispredict once at the exit, returns use the return stack, and unconditional branches are always predicted right.' },
        { t: 'num', q: 'A data-dependent branch costs 1 cycle, skips 3 single-cycle instructions half the time, and mispredicts half the time at 8 cycles. What is its average cost in cycles?', a: 6.5, hint: 'branch 1 + the instructions that run on average + the average mispredict penalty.', why: '1 + 0.5 × 3 + 0.5 × 8 = 6.5 cycles. Making the 3 instructions conditional instead costs a flat 3: 3.5 cycles saved per decision.' },
        { t: 'tf', q: '`pop {r4, pc}` can be predicted by the return stack like `bx lr`.', a: true, why: 'Cortex-A cores recognise pop-to-pc and ldm-with-pc as returns. Avoid `mov pc, lr`-style tricks with odd registers; they confuse the predictor.' },
        { t: 'match', q: 'Match each instruction to its job.', pairs: [['`b`', 'jump, lr unchanged'], ['`bl`', 'call: lr = return address'], ['`bx lr`', 'return (can switch to Thumb)'], ['`blx r3`', 'call the address in r3']], why: 'b and bl take a label; bx and blx take a register.' }
      ]
    },
    {
      id: 'u8l2', title: 'Count down to zero', ref: REF.cost,

const DIVCLZ = A`@ r0 = n, r1 = d (d != 0)  ->  r0 = n / d, r1 = n % d
    mov   r12, #0          @ quotient
    clz   r2, r1
    clz   r3, r0
    subs  r2, r2, r3       @ k = clz(d) - clz(n)
    blo   done             @ d has more bits than n: q = 0
    lsl   r1, r1, r2       @ line d up under n's top bit
step:
    cmp   r0, r1
    subhs r0, r0, r1       @ subtract when it fits
    adc   r12, r12, r12    @ q = 2q + C  (C = 1 when it fitted)
    lsr   r1, r1, #1
    subs  r2, r2, #1
    bpl   step             @ k + 1 steps, not 32
done:
    mov   r1, r0           @ remainder
    mov   r0, r12`;
const DIVNR = A`@ non-restoring: r0 = n, r1 = d (d < 2^30)  ->  r0 = q, r1 = r
    mov   r2, #0           @ partial remainder R (may go negative)
    mov   r3, #32
nr:
    adds  r0, r0, r0       @ next bit of n into C, q shifts up
    adc   r2, r2, r2       @ R = 2R + bit
    cmp   r2, #0
    addlt r2, r2, r1       @ R was negative: add d back in this step
    subge r2, r2, r1       @ R was positive: subtract d
    cmp   r2, #0
    orrge r0, r0, #1       @ quotient bit = (R >= 0)
    subs  r3, r3, #1
    bne   nr
    cmp   r2, #0
    addlt r2, r2, r1       @ final correction
    mov   r1, r2`;
const DIVREST = A`@ restoring: r0 = n, r1 = d  ->  r0 = q, r1 = r
    mov   r2, #0
    mov   r3, #32
rs:
    adds  r0, r0, r0
    adc   r2, r2, r2
    cmp   r2, r1
    subhs r2, r2, r1
    orrhs r0, r0, #1
    subs  r3, r3, #1
    bne   rs
    mov   r1, r2`;

mov   r2, sp

CRAFT.units.push({
  id: 'u14', n: 14, track: 'opt', tone: 'rd', title: 'Jump tables and lookup tables',
  blurb: 'Turning a switch into one computed branch, `ldr pc` and `add pc` tables, replacing whole switches with a data table, and when a short compare chain is still cheaper.',
  lessons: [
    {
      id: 'u14l1', title: 'Branch tables', ref: REF.arm,
      items: [
        { t: 'learn', h: 'switch in two instructions', body: 'A dense `switch (x)` over cases 0 … N would naively compile to a chain of compares: up to N cmp/beq pairs, with mispredictions along the way. A **branch table** costs the same for every case:\n\n```\ncmp   r0, #N\naddls pc, pc, r0, lsl #2   @ pc reads as this instruction + 8\nb     default              @ reached when r0 > N\nb     case0                @ ← pc + 8 lands here when r0 = 0\nb     case1 …\n```\n\n- `cmp` + `addls` = 2 instructions, then one `b`: 3 for any case.\n- `ls` (unsigned ≤) also catches negative x, because −1 is a huge unsigned number. One compare does the range check both ways.\n- The pc + 8 rule is why the `b default` slot sits between the add and the table.\n\nAlternative: `ldrls pc, [pc, r0, lsl #2]` followed by a word table of addresses (`.word case0, case1 …`). One less branch, but the table is data and needs relocation; the `add pc` form is position-independent.\n\nWalk-through x = 2: 2 ≤ 3, so pc = (addr of addls) + 8 + 8 → `b j2` → r0 = 30.', viz: X('cmp r0, #3\naddls pc, pc, r0, lsl #2\nb jdef\nb j0\nb j1\nb j2\nb j3\nj0: mov r0, #10\nb jend\nj1: mov r0, #20\nb jend\nj2: mov r0, #30\nb jend\nj3: mov r0, #40\nb jend\njdef: mov r0, #0\njend:', [2], 30) },
        PNA('Same table with r0 = 0xFFFFFFFF (−1). What is r0?', 'cmp r0, #3\naddls pc, pc, r0, lsl #2\nb jdef\nb j0\nb j1\nb j2\nb j3\nj0: mov r0, #10\nb jend\nj1: mov r0, #20\nb jend\nj2: mov r0, #30\nb jend\nj3: mov r0, #40\nb jend\njdef: mov r0, #0\njend:', [0xFFFFFFFF], 0, 'Unsigned, 0xFFFFFFFF > 3, so ls fails, the add is skipped and `b jdef` runs: 0.'),
        { t: 'num', q: 'A compare chain tests cases 0 … 15 in order (cmp + beq each). How many instructions does it execute to reach case 15?', a: 32, why: '16 cmp + 16 beq = 32 (and 15 not-taken branches to predict). The table is 3.' },
        { t: 'tf', q: 'For a switch with 3 sparse cases (1, 100, 5000), a jump table is the best choice.', a: false, why: 'A table indexed by x would need 5001 entries. A short compare chain, or a tree of compares, is better for sparse cases.' }
      ]
    },
    {
      id: 'u14l2', title: 'Replace code with data', ref: REF.mem,
      items: [
        { t: 'learn', h: 'When every case just picks a value', body: 'If each case only produces a value, skip branching altogether: index a **lookup table**.\n\n```\nadr  r1, table\ncmp  r0, #N\nldrls r0, [r1, r0, lsl #2]\nmovhi r0, #0               @ default\n```\n\nNo branch at all, so nothing can be mispredicted. Use `ldrb` with a byte table for small values (a quarter of the cache footprint).\n\nThe same idea powers fast code everywhere: days in a month, hex digit characters, CRC tables, the reciprocal table of Unit 11, sine tables.\n\nWalk-through: days in month 2 (Feb, 0-based index 1) with a byte table: 28.', viz: X('adr r1, dtab\ncmp r0, #11\nldrbls r0, [r1, r0]\nmovhi r0, #0\nb dend\ndtab: .byte 31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31\ndend:', [1], 28) },
        PNA('Index 11 (December). What is r0?', 'adr r1, dtab\ncmp r0, #11\nldrbls r0, [r1, r0]\nmovhi r0, #0\nb dend\ndtab: .byte 31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31\ndend:', [11], 31, 'The 12th byte is 31. Index 12 would give 0 through movhi.'),
        { t: 'mcq', q: 'Converting a nibble 0–15 to its hex character. Which is cheapest?', opts: ['`ldrb r0, [table, r0]` with the 16-byte "0123456789ABCDEF" table', 'cmp #10, addlo #48, addhs #55 (3, branch-free)', 'a 16-way switch', 'a loop'], a: 0, why: 'One load (plus a one-time adr). The 3-instruction arithmetic version is a good second when you cannot spare memory, and is also branch-free.' },
        { t: 'tf', q: 'A data table removes branch mispredictions but can add cache misses.', a: true, why: 'The first access may miss in the cache. For hot code, small tables stay cached; keep them small (bytes instead of words).' }

CRAFT.units.push({
  id: 'u15', n: 15, track: 'sys', tone: 'f6', title: 'Modes, exceptions and interrupts',
  blurb: 'The seven classic processor modes, banked registers, the vector table, exception entry and return, writing fast interrupt handlers, and system calls with svc on a real Linux program.',
  lessons: [
    {
      id: 'u15l1', title: 'Modes and banked registers', ref: REF.sys,
      items: [
        { t: 'learn', h: 'Who is running, and with which registers', body: 'The low 5 bits of the CPSR are the **mode**:\n\n| mode | bits | entered by |\n|---|---|---|\n| User (usr) | 0x10 | normal programs |\n| FIQ | 0x11 | fast interrupt |\n| IRQ | 0x12 | normal interrupt |\n| Supervisor (svc) | 0x13 | reset, `svc` instruction |\n| Abort (abt) | 0x17 | memory faults |\n| Undefined (und) | 0x1B | unknown instruction |\n| System (sys) | 0x1F | privileged, user registers |\n\n(Plus Monitor for TrustZone and Hyp for virtualisation.)\n\nEach exception mode has its own **banked** sp (r13), lr (r14) and **SPSR** (a saved copy of the CPSR). FIQ also banks **r8–r12**: a FIQ handler can use r8–r12 without saving anything, which is why it is “fast”.\n\nUser mode cannot change the mode or mask interrupts; it can read and write the flags through **APSR**: `mrs r0, apsr`.', viz: X('cmp r0, r0\nmrs r0, apsr\nlsr r0, r0, #28', [7], 6, { show: 'r0 = 6 = 0b0110: N=0 Z=1 C=1 V=0 after comparing equal values' }) },
        PNA('Read the flags after `cmp r0, r1` with r0 = 1, r1 = 2. What is NZCV as a number?', 'cmp r0, r1\nmrs r0, apsr\nlsr r0, r0, #28', [1, 2], 8, '1 − 2 = −1: N = 1, Z = 0, C = 0 (borrow), V = 0 → 0b1000 = 8.'),
        { t: 'match', q: 'Match each mode to what enters it.', pairs: [['Supervisor', 'reset or an svc instruction'], ['IRQ', 'a normal interrupt'], ['Abort', 'a data or prefetch fault'], ['Undefined', 'an instruction the core cannot decode']], why: 'Each has its own vector in the table at 0x00000000 (or 0xFFFF0000).' },
        { t: 'tf', q: 'A FIQ handler can use r8–r12 without saving them first.', a: true, why: 'They are banked: FIQ mode has its own copies, so the interrupted code’s r8–r12 are untouched.' },
        { t: 'mcq', q: 'Which registers does IRQ mode bank?', opts: ['sp, lr and SPSR', 'r8–r14', 'all 16', 'none'], a: 0, why: 'IRQ banks r13, r14 and the SPSR. Only FIQ banks r8–r12 too.' }
      ]
    },
    {
      id: 'u15l2', title: 'Exceptions, interrupts and svc', ref: REF.sys,
      items: [
        { t: 'learn', h: 'Entry, return and the vector table', body: 'On an exception the core, in hardware:\n\n1. copies CPSR into the new mode’s SPSR;\n2. switches mode (and to ARM or Thumb per SCTLR.TE), masks IRQ (and FIQ for FIQ/reset);\n3. sets the new lr to a return address (with a mode-specific offset);\n4. jumps to the vector: base + 0x00 reset, 0x04 undefined, 0x08 svc, 0x0C prefetch abort, 0x10 data abort, 0x18 IRQ, 0x1C FIQ. FIQ is last so its handler can start right there, with no branch.\n\n**Returning from IRQ**: lr_irq points 4 past the instruction to resume. The fast return is `subs pc, lr, #4`: the **s** with pc as destination also copies SPSR back into CPSR, restoring mode and flags in one instruction. With a stack frame: `sub lr, lr, #4`, `push {r0-r3, r12, lr}` … `ldmfd sp!, {r0-r3, r12, pc}^` (the ^ restores CPSR).\n\nARMv7 adds `srsdb sp!, #0x13` (store lr and SPSR to another mode’s stack) and `rfeia sp!` (return from it), and `cpsid i` / `cpsie i` to mask and unmask IRQs.\n\n**Efficient handlers**: save only the registers you use (AAPCS scratch ones if you call C), keep the handler short, acknowledge the device early, defer heavy work.\n\n**svc** is the controlled way in from user mode. Linux on ARM (EABI) takes the syscall number in **r7** and arguments in r0–r6. The program below writes to stdout with no C library call at all.', viz: PROG([['hello.s', SVC_S, 'asm']], 'Hello from svc') },
        { t: 'mcq', q: 'Besides returning, what does `subs pc, lr, #4` do in an IRQ handler?', opts: ['copies SPSR_irq back into CPSR, restoring the mode, flags and interrupt mask', 'sets the flags from lr − 4', 'masks FIQ', 'nothing else'], a: 0, why: 'An s-suffixed data-processing instruction that writes pc in an exception mode copies SPSR to CPSR. One instruction both returns and restores state.' },
        { t: 'order', q: 'Order a minimal IRQ handler that calls a C function.', items: ['`sub lr, lr, #4`', '`push {r0-r3, r12, lr}`', '`bl handle_device`', '`ldmfd sp!, {r0-r3, r12, pc}^`'], why: 'Adjust lr, save the AAPCS scratch registers (the C function may clobber them), call, then return and restore CPSR with ^.' },
        { t: 'fill', q: 'Make a Linux write system call.', text: 'mov r7, #___\nsvc #0', blanks: ['4'], extra: ['1', '3', '0'], why: 'On ARM EABI Linux, write is syscall 4 (exit is 1, read is 3). The number goes in r7, not in the svc immediate.' },
        { t: 'tf', q: 'The FIQ vector is last in the table so its handler can start in place without a branch.', a: true, why: 'At offset 0x1C nothing follows, so the code can just continue: one branch fewer on the fastest path.' }

CRAFT.units.push({

  blurb: 'The mixed 16/32-bit instruction set: when narrow encodings are available, IT blocks instead of conditional execution, cbz/cbnz, tbb/tbh switch tables, and interworking between ARM and Thumb.',
  lessons: [
    {
      id: 'u16l1', title: 'Narrow and wide encodings', ref: REF.thumb,
      items: [
        { t: 'learn', h: 'Same instructions, smaller code', body: 'Thumb-2 encodes most A32 instructions in either **16 bits** (narrow) or **32 bits** (wide). Smaller code means more of it fits in the instruction cache and fewer fetches: often 25–30 % smaller, at nearly the same speed. Linux distributions for ARMv7 build in Thumb-2 by default.\n\nA 16-bit encoding is usually available when:\n\n- the registers are **r0–r7** (low registers),\n- the instruction **sets flags** outside an IT block (`adds`, `subs`, `movs`), which is why compilers write `movs r0, #1`,\n- immediates are small (`movs` 0–255, `adds Rd, #imm8`), and destination equals first source for 2-operand forms (`adds r0, r1` = r0 += r1).\n\nWhat is different from A32:\n\n- no conditional suffix outside **IT** blocks (next lesson), except on branches;\n- a register-shifted-by-register operand (`r1, lsl r2`) is gone: use a separate shift;\n- immediates use a different scheme: any byte, or patterns 0x00XY00XY, 0xXY00XY00, 0xXYXYXYXY, or a byte shifted anywhere;\n- reading pc gives address + 4.\n\nWith `.syntax unified` the same source mostly assembles as both. The example is plain arithmetic assembled as Thumb.', viz: X('movs r1, #10\nadds r0, r0, r1\nlsls r0, r0, #2\nsubs r0, #2', [5], 58, { thumb: true, show: 'r0 = 58 (all four are 16-bit instructions)' }) },
        PNA('Thumb-2 immediate: is 0x00AB00AB valid? Run it: what is r0? (hex)', 'mov r0, #0x00AB00AB', [], 0x00AB00AB, 'Thumb-2 can encode 0x00XY00XY directly; A32 cannot (it would need movw/movt).', { base: 'hex', thumb: true }),
        { t: 'tf', q: '`add r8, r9, r10` has a 16-bit Thumb encoding.', a: false, why: 'Three-operand forms with high registers need the 32-bit encoding. Keep hot values in r0–r7 for density.' },
        { t: 'mcq', q: 'Why do Thumb-2 compilers prefer `movs r0, #0` over `mov r0, #0`?', opts: ['movs has a 16-bit encoding; mov (no flags) needs 32 bits outside an IT block', 'movs is faster', 'mov cannot load 0', 'movs clears the cache'], a: 0, why: 'The flag-setting form is the narrow one. If the flags are dead anyway, the s is free and saves 2 bytes.' },
        { t: 'num', q: 'A function of 40 instructions: 30 narrow (2 bytes) and 10 wide (4 bytes). How many bytes, against 160 in A32?', a: 100, why: '30 × 2 + 10 × 4 = 100 bytes, 37.5 % smaller.' }
      ]
    },
    {
      id: 'u16l2', title: 'IT blocks, cbz and cbnz', ref: REF.thumb,
      items: [
        { t: 'learn', h: 'Conditional execution, Thumb style', body: 'Thumb instructions carry no condition field. Instead, **IT** (if-then) makes up to the next **4** instructions conditional:\n\n```\ncmp   r0, r1\nite   hi          @ If-Then-Else: one T, one E\nmovhi r2, r0      @ runs when hi\nmovls r2, r1      @ runs when not hi (ls)\n```\n\n- Pattern letters: `it`, `itt`, `ite`, `ittt`, `itte` … up to 4. T = same condition, E = opposite.\n- Each instruction still spells its condition; the assembler checks they match.\n- IT is a 16-bit instruction. ARMv8 deprecates IT blocks longer than one instruction or containing 32-bit instructions, so prefer short ones.\n\n**cbz / cbnz** Rn, label: compare with zero and branch, **without touching the flags**, 16 bits. Forward branches only (up to 126 bytes) and low registers only. Ideal for null checks and loop exits.\n\nWalk-through: clamp to 255 in Thumb: `cmp r0, #255`, `it hi`, `movhi r0, #255`. For r0 = 300 → 255.', viz: X('cmp r0, #255\nit hi\nmovhi r0, #255', [300], 255, { thumb: true }) },
        PNA('What is r0?', 'cmp r0, r1\nite lt\nsublt r0, r1, r0\nsubge r0, r0, r1', [3, 10], 7, '|r0 − r1| with one compare and an ITE: 3 < 10, so r0 = 10 − 3 = 7.', { thumb: true }),
        PNA('cbz loop: what is r0? (counts set bits)', 'movs r1, #0\ncl:\ncbz r0, cdone\nsubs r2, r0, #1\nands r0, r0, r2\nadds r1, #1\nb cl\ncdone:\nmov r0, r1', [0xF0F0], 8, 'Each pass clears the lowest set bit (x & (x − 1)), so it loops once per set bit: 0xF0F0 has 8. cbz exits without needing flags.', { thumb: true }),
        { t: 'tf', q: 'An IT block can make up to 8 instructions conditional.', a: false, why: 'At most 4 (and ARMv8 recommends just 1 narrow instruction).' },
        { t: 'fill', q: 'Make both moves conditional: the first on eq, the second on ne.', text: 'cmp r0, #0\n___ eq\nmoveq r1, #1\nmovne r1, #2', blanks: ['ite'], extra: ['itt', 'it', 'itee'], why: 'ITE: Then (eq) for the first, Else (ne) for the second.' }
      ]
    },
    {
      id: 'u16l3', title: 'tbb, tbh and interworking', ref: REF.thumb,
      items: [
        { t: 'learn', h: 'Compact switch tables', body: '`tbb [pc, r0]` (table branch byte) reads a byte from a table right after the instruction and branches forward by **2 × that byte**. `tbh [pc, r0, lsl #1]` does the same with halfwords for bigger jumps. A 4-case switch costs a 4-byte table instead of four 4-byte branch instructions, and still runs in constant time.\n\n```\ncmp  r0, #3\nbhi  default\ntbb  [pc, r0]\ntab: .byte (c0-tab)/2, (c1-tab)/2 …\n```\n\n**Interworking**: ARM and Thumb code mix freely. The state is selected by bit 0 of a branch target address: `bx Rm` / `blx Rm` switch to Thumb when bit 0 is 1, to ARM when it is 0. Function pointers to Thumb functions are odd numbers. `bl` to a label is fixed up by the linker, and `pop {…, pc}` interworks on ARMv7. This course’s checker calls every Thumb example from C compiled as ARM, which is interworking in action.', viz: X('cmp r0, #3\nbhi tdef\ntbb [pc, r0]\ntab:\n.byte (t0-tab)/2, (t1-tab)/2, (t2-tab)/2, (t3-tab)/2\nt0: movs r0, #10\nb tend\nt1: movs r0, #20\nb tend\nt2: movs r0, #30\nb tend\nt3: movs r0, #40\nb tend\ntdef: movs r0, #0\ntend:', [3], 40, { thumb: true }) },

      ]
