 found:', len(P))\nc = np.zeros((120, 160), np.uint8); cv2.circle(c, (80, 60), 25, 255, 2); cv2.circle(c, (30, 30), 12, 255, 2)\nC = cv2.HoughCircles(cv2.GaussianBlur(c, (5, 5), 1.5), cv2.HOUGH_GRADIENT, 1, 20, param1=100, param2=15, minRadius=8, maxRadius=40)\nprint('circles (x, y, r):', sorted(np.round(C[0]).astype(int).tolist()))", "out": "mine: top lines (rho, theta deg, votes): [(40, 0, 111), (94, 64, 80)]\ncv2.HoughLines strongest: [(40, 0), (94, 64)]\nprobabilistic segments found: 3\ncircles (x, y, r): [[30, 30, 10], [80, 60, 27]]"}, "h_homog": {"lang": "py", "file": "h_homog.py", "src": "import numpy as np, cv2\nsrc = np.float32([[10, 10], [300, 20], [290, 220], [20, 200]])        # a tilted document's corners\ndst = np.float32([[0, 0], [280, 0], [280, 200], [0, 200]])            # where we want them\ndef normalise(p):\n    c = p.mean(0); s = np.sqrt(2) / np.linalg.norm(p - c, axis=1).mean()\n    T = np.array([[s, 0, -s * c[0]], [0, s, -s * c[1]], [0, 0, 1]]); return T, (np.c_[p, np.ones(len(p))] @ T.T)[:, :2]\ndef homography(s, d):\n    Ts, sn = normalise(s); Td, dn = normalise(d); A = []                 # Hartley normalisation, then DLT\n    for (x, y), (u, v) in zip(sn, dn):\n        A += [[-x, -y, -1, 0, 0, 0, u * x, u * y, u], [0, 0, 0, -x, -y, -1, v * x, v * y, v]]\n    Hn = np.linalg.svd(np.array(A))[2][-1].reshape(3, 3); H = np.linalg.inv(Td) @ Hn @ Ts; return H / H[2, 2]\nH = homography(src, dst); Hc = cv2.getPerspectiveTransform(src, dst)\nprint('H =\\n', H, '\\nmatches getPerspectiveTransform:', np.allclose(H, Hc, atol=1e-8))\np = H @ np.array([300, 20, 1.0]); print('apply to (300,20): w = %.4f -> (%.1f, %.1f)' % (p[2], p[0] / p[2], p[1] / p[2]))\npt = cv2.perspectiveTransform(np.float32([[[155, 110]]]), H)[0, 0]; print('document centre-ish maps to', np.round(pt, 2))\nprint('degrees of freedom: 9 entries - 1 scale = 8; 4 points x 2 = 8 equations')", "out": "H =\n [[ 1.02448572e+00 -5.39203012e-02 -9.70565422e+00]\n [-3.38741995e-02  9.82351787e-01 -9.48477587e+00]\n [ 2.21458808e-04 -3.64443443e-04  1.00000000e+00]] \nmatches getPerspectiveTransform: True\napply to (300,20): w = 1.0591 -> (280.0, 0.0)\ndocument centre-ish maps to [143.99  93.86]\ndegrees of freedom: 9 entries - 1 scale = 8; 4 points x 2 = 8 equations"}, "h_stitch": {"lang": "py", "file": "h_stitch.py", "src": "import numpy as np, cv2\nfrom cvk import texture\npano = texture(240, 480, seed=5)\nleft, right = pano[:, :300].copy(), pano[:, 180:].copy()            # two overlapping views (120 px overlap)\norb = cv2.ORB_create(1000); kl, dl = orb.detectAndCompute(left, None); kr, dr = orb.detectAndCompute(right, None)\nm = cv2.BFMatcher(cv2.NORM_HAMMING, crossCheck=True).match(dr, dl)\npr = np.float32([kr[x.queryIdx].pt for x in m]); pl = np.float32([kl[x.trainIdx].pt for x in m])\nH, mask = cv2.findHomography(pr, pl, cv2.RANSAC, 1.0)\nprint('matches %d, inliers %d' % (len(m), mask.sum()))\nprint('recovered translation (should be 180, 0): (%.2f, %.2f)' % (H[0, 2], H[1, 2]))\nout = cv2.warpPerspective(right, H, (480, 240)).astype(np.float32)\nw_r = (cv2.warpPerspective(np.ones_like(right, np.float32), H, (480, 240)))\nw_l = np.zeros((240, 480), np.float32); w_l[:, :300] = 1\nramp = np.clip((300 - np.arange(480)) / 120, 0, 1)[None, :]           # feather: weight falls 1 -> 0 across the overlap\nwl = w_l * np.where(w_r > 0, ramp, 1); wr = w_r * (1 - np.where(w_l > 0, ramp, 0))\nL = np.zeros((240, 480), np.float32); L[:, :300] = left\nblend = (L * wl + out * wr) / np.maximum(wl + wr, 1e-6)\nvalid = (wl + wr) > 0.99\nprint('stitched panorama RMS error vs the true scene: %.2f grey levels' % np.sqrt(((blend - pano)[valid] ** 2).mean()))", "out": "matches 150, inliers 61\nrecovered translation (should be 180, 0): (180.07, -0.12)\nstitched panorama RMS error vs the true scene: 1.00 grey levels"}, "h_warp": {"lang": "py", "file": "h_warp.py", "src": "import numpy as np, cv2\nfrom cvk import texture\nimg = texture().astype(np.float32)\ndef bilinear(im, x, y):\n    x0 = np.floor(x).astype(int); y0 = np.floor(y).astype(int); fx = x - x0; fy = y - y0\n    H, W = im.shape; x0c, x1c = np.clip(x0, 0, W - 1), np.clip(x0 + 1, 0, W - 1); y0c, y1c = np.clip(y0, 0, H - 1), np.clip(y0 + 1, 0, H - 1)\n    return (im[y0c, x0c] * (1 - fx) * (1 - fy) + im[y0c, x1c] * fx * (1 - fy) + im[y1c, x0c] * (1 - fx) * fy + im[y1c, x1c] * fx * fy)\nM = cv2.getRotationMatrix2D((160, 120), 30, 1.2)                # 2x3 affine: rotate 30 deg, scale 1.2 about the centre\nMinv = cv2.invertAffineTransform(M)\nys, xs = np.mgrid[0:240, 0:320].astype(np.float32)\nsx = Minv[0, 0] * xs + Minv[0, 1] * ys + Minv[0, 2]; sy = Minv[1, 0] * xs + Minv[1, 1] * ys + Minv[1, 2]   # backward mapping\nmine = bilinear(img, sx, sy)\nref = cv2.warpAffine(img, M, (320, 240), flags=cv2.INTER_LINEAR, borderMode=cv2.BORDER_REPLICATE)\ninside = (sx > 1) & (sx < 318) & (sy > 1) & (sy < 238)\nprint('backward-mapped bilinear vs warpAffine, max diff inside: %.3f grey levels' % np.abs(mine - ref)[inside].max())\nprint('M =\\n', M)\nprint('one source point by hand: (100.5, 50.25) ->', round(float(bilinear(img, np.array(100.5), np.array(50.25))), 2))\nfor name, fl in [('nearest', cv2.INTER_NEAREST), ('linear', cv2.INTER_LINEAR), ('cubic', cv2.INTER_CUBIC), ('area', cv2.INTER_AREA)]:\n    small = cv2.resize(img, (80, 60), interpolation=fl); back = cv2.resize(small, (320, 240), interpolation=cv2.INTER_CUBIC)\n    print(' downsample x4 with %-7s -> RMS error after upsampling %.2f' % (name, np.sqrt(((back - img) ** 2).mean())))", "out": "backward-mapped bilinear vs warpAffine, max diff inside: 4.191 grey levels\nM =\n [[  1.039   0.6   -78.277]\n [ -0.6     1.039  91.292]]\none source point by hand: (100.5, 50.25) -> 78.0\n downsample x4 with nearest -> RMS error after upsampling 27.48\n downsample x4 with linear  -> RMS error after upsampling 20.24\n downsample x4 with cubic   -> RMS error after upsampling 21.82\n downsample x4 with area    -> RMS error after upsampling 18.89"}, "i_calib": {"lang": "py", "file": "i_calib.py", "src": "import numpy as np, cv2\nr = np.random.default_rng(0)\nK = np.array([[600.0, 0, 320], [0, 600, 240], [0, 0, 1]]); dist = np.array([-0.15, 0.05, 0, 0, 0])\nobj = np.zeros((7 * 5, 3), np.float32); obj[:, :2] = np.mgrid[0:7, 0:5].T.reshape(-1, 2) * 0.03    # 7x5 corners, 3 cm squares\nobjs, imgs = [], []\nfor i in range(12):                                                    # 12 synthetic views of the board\n    rv = r.uniform(-0.5, 0.5, 3); tv = np.array([-0.1, -0.06, 0.5]) + r.uniform(-0.05, 0.05, 3)\n    p, _ = cv2.projectPoints(obj, rv, tv, K, dist); objs.append(obj); imgs.append((p.reshape(-1, 2) + r.normal(0, 0.2, (35, 2))).astype(np.float32))\nrms, K2, d2, rvecs, tvecs = cv2.calibrateCamera(objs, imgs, (640, 480), None, None)\nprint('reprojection RMS %.3f px (noise was 0.2 px)' % rms)\nprint('fx fy cx cy = %.1f %.1f %.1f %.1f (true 600 600 320 240)' % (K2[0, 0], K2[1, 1], K2[0, 2], K2[1, 2]))\nprint('k1 k2 = %.3f %.3f (true -0.150 0.050)' % (d2[0, 0], d2[0, 1]))\n# Zhang's idea: each view gives a homography H = K [r1 r2 t]; r1, r2 orthonormal -> 2 constraints on B = K^-T K^-1\nHs = [cv2.findHomography(obj[:, :2], cv2.undistortPoints(im.reshape(-1, 1, 2), K, dist, P=K).reshape(-1, 2))[0] for im in imgs]\ndef v(H, i, j): h = H.T; return np.array([h[i, 0] * h[j, 0], h[i, 0] * h[j, 1] + h[i, 1] * h[j, 0], h[i, 1] * h[j, 1], h[i, 2] * h[j, 0] + h[i, 0] * h[j, 2], h[i, 2] * h[j, 1] + h[i, 1] * h[j, 2], h[i, 2] * h[j, 2]])\nV = np.vstack([np.vstack([v(H, 0, 1), v(H, 0, 0) - v(H, 1, 1)]) for H in Hs]); b = np.linalg.svd(V)[2][-1]\nB11, B12, B22, B13, B23, B33 = b\nv0 = (B12 * B13 - B11 * B23) / (B11 * B22 - B12 ** 2); lam = B33 - (B13 ** 2 + v0 * (B12 * B13 - B11 * B23)) / B11\na = np.sqrt(lam / B11); be = np.sqrt(lam * B11 / (B11 * B22 - B12 ** 2)); u0 = -B13 * a ** 2 / lam\nprint(\"Zhang closed form (distortion removed first): fx %.1f fy %.1f cx %.1f cy %.1f\" % (a, be, u0, v0))", "out": "reprojection RMS 0.265 px (noise was 0.2 px)\nfx fy cx cy = 599.4 599.6 321.9 240.4 (true 600 600 320 240)\nk1 k2 = -0.146 -0.046 (true -0.150 0.050)\nZhang closed form (distortion removed first): fx 601.1 fy 601.6 cx 319.9 cy 240.1"}, "i_epipolar": {"lang": "py", "file": "i_epipolar.py", "src": "import numpy as np, cv2\nr = np.random.default_rng(1)\nK = np.array([[700.0, 0, 320], [0, 700, 240], [0, 0, 1]])\nR, _ = cv2.Rodrigues(np.array([0.0, 0.15, 0.02])); t = np.array([1.0, 0.05, 0.1])\nX = np.c_[r.uniform(-2, 2, 60), r.uniform(-1.5, 1.5, 60), r.uniform(5, 10, 60)]\ndef proj(K, R, t, X): x = (K @ (X @ R.T + t).T).T; return x[:, :2] / x[:, 2:]\np1 = proj(K, np.eye(3), np.zeros(3), X); p2 = proj(K, R, t, X)\ntx = np.array([[0, -t[2], t[1]], [t[2], 0, -t[0]], [-t[1], t[0], 0]])\nE = tx @ R; F = np.linalg.inv(K).T @ E @ np.linalg.inv(K)\nh1, h2 = np.c_[p1, np.ones(60)], np.c_[p2, np.ones(60)]\nprint('epipolar constraint x2^T F x1, max |.|: %.1e' % np.abs(np.einsum('ij,jk,ik->i', h2, F, h1)).max())\ndef eight_point(a, b):\n    def T(p): c = p.mean(0); s = np.sqrt(2) / np.linalg.norm(p - c, axis=1).mean(); return np.array([[s, 0, -s * c[0]], [0, s, -s * c[1]], [0, 0, 1]])\n    Ta, Tb = T(a), T(b); an = np.c_[a, np.ones(len(a))] @ Ta.T; bn = np.c_[b, np.ones(len(b))] @ Tb.T\n    A = np.einsum('ni,nj->nij', bn, an).reshape(len(a), 9); F = np.linalg.svd(A)[2][-1].reshape(3, 3)\n    U, S, Vt = np.linalg.svd(F); F = U @ np.diag([S[0], S[1], 0]) @ Vt             # enforce rank 2\n    F = Tb.T @ F @ Ta; return F / F[2, 2]\nFm = eight_point(p1, p2); print('8-point F equals the true F (up to scale):', np.allclose(Fm, F / F[2, 2], rtol=1e-4, atol=1e-8))\nFc, _ = cv2.findFundamentalMat(p1, p2, cv2.FM_8POINT); print('cv2.FM_8POINT agrees:', np.allclose(Fc / Fc[2, 2], Fm, rtol=1e-4, atol=1e-8))\nEc, _ = cv2.findEssentialMat(p1, p2, K); _, Rr, tr, _ = cv2.recoverPose(Ec, p1, p2, K)\nprint('recovered R angle error %.2e rad; t direction' % np.linalg.norm(cv2.Rodrigues(Rr @ R.T)[0]), np.round(tr.ravel(), 4), 'true', np.round(t / np.linalg.norm(t), 4))\nprint('rank of F:', np.linalg.matrix_rank(F), ' singular values of E:', np.round(np.linalg.svd(E)[1], 4))", "out": "epipolar constraint x2^T F x1, max |.|: 2.2e-16\n8-point F equals the true F (up to scale): True\ncv2.FM_8POINT agrees: True\nrecovered R angle error 0.00e+00 rad; t direction [0.9938 0.0497 0.0994] true [0.9938 0.0497 0.0994]\nrank of F: 2  singular values of E: [1.0062 1.0062 0.    ]"}, "i_flow": {"lang": "py", "file": "i_flow.py", "src": "import numpy as np, cv2\nfrom cvk import texture\na = cv2.GaussianBlur(texture(160, 200, seed=9), (5, 5), 1.5).astype(np.float32)\nu_true, v_true = 1.6, -0.8                                        # sub-pixel global motion\nM = np.float32([[1, 0, u_true], [0, 1, v_true]]); b = cv2.warpAffine(a, M, (200, 160), borderMode=cv2.BORDER_REFLECT)\nIx = cv2.Sobel(a, cv2.CV_32F, 1, 0, ksize=3) / 8; Iy = cv2.Sobel(a, cv2.CV_32F, 0, 1, ksize=3) / 8; It = b - a\ndef lucas_kanade(y, x, w=7):\n    s = (slice(y - w, y + w + 1), slice(x - w, x + w + 1))\n    A = np.c_[Ix[s].ravel(), Iy[s].ravel()]; bb = -It[s].ravel()\n    return np.linalg.lstsq(A, bb, rcond=None)[0], np.linalg.eigvalsh(A.T @ A)\n(u, v), lam = lucas_kanade(80, 100)\nprint('one-step LK at (80,100): u %.2f v %.2f (true %.1f %.1f); eigenvalues of A^T A' % (u, v, u_true, v_true), np.round(lam, 1))\ndef lk_iterative(y, x, w=7, iters=10):\n    uv = np.zeros(2); s = (slice(y - w, y + w + 1), slice(x - w, x + w + 1)); A = np.c_[Ix[s].ravel(), Iy[s].ravel()]\n    for _ in range(iters):                       # warp b back by the current estimate, solve for the residual motion\n        bw = cv2.warpAffine(b, np.float32([[1, 0, -uv[0]], [0, 1, -uv[1]]]), (200, 160), borderMode=cv2.BORDER_REFLECT)\n        uv += np.linalg.lstsq(A, -(bw - a)[s].ravel(), rcond=None)[0]\n    return uv\nprint('iterative LK (10 warps): u %.2f v %.2f' % tuple(lk_iterative(80, 100)))\np0 = cv2.goodFeaturesToTrack(a.astype(np.uint8), 50, 0.01, 8)\np1, st, _ = cv2.calcOpticalFlowPyrLK(a.astype(np.uint8), b.astype(np.uint8), p0, None, winSize=(15, 15), maxLevel=2)\nd = (p1 - p0).reshape(-1, 2)[st.ravel() == 1]; print('pyramidal LK on %d corners: median (%.2f, %.2f)' % (len(d), *np.median(d, 0)))\ndef horn_schunck(alpha=10, iters=200):\n    U = np.zeros_like(a); V = np.zeros_like(a); avg = np.array([[1, 2, 1], [2, 0, 2], [1, 2, 1]], np.float32) / 12\n    for _ in range(iters):\n        Ub, Vb = cv2.filter2D(U, -1, avg), cv2.filter2D(V, -1, avg)\n        k = (Ix * Ub + Iy * Vb + It) / (alpha ** 2 + Ix ** 2 + Iy ** 2); U, V = Ub - Ix * k, Vb - Iy * k\n    return U, V\nU, V = horn_schunck(); print('Horn-Schunck dense flow, median over the image: (%.2f, %.2f)' % (np.median(U), np.median(V)))\nfb = cv2.calcOpticalFlowFarneback(a.astype(np.uint8), b.astype(np.uint8), None, 0.5, 3, 15, 3, 5, 1.2, 0)\nprint('Farneback dense flow median: (%.2f, %.2f)' % tuple(np.median(fb.reshape(-1, 2), 0)))", "out": "one-step LK at (80,100): u 1.22 v -0.81 (true 1.6 -0.8); eigenvalues of A^T A [  72.9 4259.5]\niterative LK (10 warps): u 1.64 v -0.84\npyramidal LK on 50 corners: median (1.60, -0.81)\nHorn-Schunck dense flow, median over the image: (1.12, -0.60)\nFarneback dense flow median: (1.58, -0.79)"}, "i_sfm": {"lang": "py", "file": "i_sfm.py", "src": "import numpy as np, cv2\nr = np.random.default_rng(2)\nK = np.array([[700.0, 0, 320], [0, 700, 240], [0, 0, 1]])\nX = np.c_[r.uniform(-2, 2, 80), r.uniform(-1.5, 1.5, 80), r.uniform(5, 10, 80)]\nR2, _ = cv2.Rodrigues(np.array([0.0, 0.1, 0.0])); t2 = np.array([-1.0, 0, 0.1])\nP1 = K @ np.c_[np.eye(3), np.zeros(3)]; P2 = K @ np.c_[R2, t2]\ndef proj(P, X): x = (P @ np.c_[X, np.ones(len(X))].T).T; return x[:, :2] / x[:, 2:]\nx1 = proj(P1, X) + r.normal(0, 0.3, (80, 2)); x2 = proj(P2, X) + r.normal(0, 0.3, (80, 2))\ndef triangulate(P1, P2, a, b):\n    out = []\n    for (u1, v1), (u2, v2) in zip(a, b):\n        A = np.array([u1 * P1[2] - P1[0], v1 * P1[2] - P1[1], u2 * P2[2] - P2[0], v2 * P2[2] - P2[1]])\n        Xh = np.linalg.svd(A)[2][-1]; out.append(Xh[:3] / Xh[3])\n    return np.array(out)\nXm = triangulate(P1, P2, x1, x2); Xc = cv2.triangulatePoints(P1, P2, x1.T, x2.T); Xc = (Xc[:3] / Xc[3]).T\nprint('triangulation: mine vs cv2 max diff %.1e m; mean error vs truth %.3f m' % (np.abs(Xm - Xc).max(), np.linalg.norm(Xm - X, axis=1).mean()))\n# a third camera located by PnP from the 3D points\nR3, _ = cv2.Rodrigues(np.array([0.05, -0.1, 0.02])); t3 = np.array([1.0, 0.2, 0.3]); x3 = proj(K @ np.c_[R3, t3], X) + r.normal(0, 0.3, (80, 2))\nok, rv, tv, inl = cv2.solvePnPRansac(Xm, x3, K, None)\nprint('PnP camera 3: position error %.3f m, inliers %d' % (np.linalg.norm(tv.ravel() - t3), len(inl)))\n# bundle adjustment (tiny): refine camera 3 pose with Gauss-Newton on reprojection error\ndef reproj(p): R, _ = cv2.Rodrigues(p[:3]); return (proj(K @ np.c_[R, p[3:]], Xm) - x3).ravel()\np = np.r_[rv.ravel(), tv.ravel()]\nfor it in range(5):\n    e = reproj(p); J = np.array([(reproj(p + dp) - e) / 1e-6 for dp in np.eye(6) * 1e-6]).T\n    p = p - np.linalg.solve(J.T @ J, J.T @ e)\nprint('after Gauss-Newton: RMS reprojection %.3f px per coordinate (image noise 0.3 px; the 3D points are noisy too)' % np.sqrt((reproj(p) ** 2).mean()))", "out": "triangulation: mine vs cv2 max diff 4.7e-13 m; mean error vs truth 0.027 m\nPnP camera 3: position error 0.005 m, inliers 80\nafter Gauss-Newton: RMS reprojection 0.529 px per coordinate (image noise 0.3 px; the 3D points are noisy too)"}, "i_stereo": {"lang": "py", "file": "i_stereo.py", "src": "import numpy as np, cv2\nfrom cvk import texture\nf, B = 500.0, 0.1                                                     # focal (px), baseline (m)\nleft = texture(200, 300, seed=7)\ndisp_true = np.full(left.shape, 16, np.float32); disp_true[60:140, 100:200] = 32     # a near box in front of a far wall\nxs = np.arange(300)[None, :] + disp_true                               # right image: x_r = x_l - d -> sample left at x + d\nright = cv2.remap(left, xs.astype(np.float32), np.repeat(np.arange(200, dtype=np.float32)[:, None], 300, 1), cv2.INTER_LINEAR)\ndef ssd_disparity(L, R, maxd=48, w=7):\n    L = L.astype(np.float32); R = R.astype(np.float32); cost = np.full((maxd,) + L.shape, np.inf, np.float32)\n    for d in range(maxd):\n        diff = np.full(L.shape, 1e4, np.float32); diff[:, d:] = (L[:, d:] - R[:, :R.shape[1] - d]) ** 2\n        cost[d] = cv2.boxFilter(diff, -1, (w, w))\n    return cost.argmin(0)\nd = ssd_disparity(left, right)                                       # left pixel x matches right pixel x - d\ninner = (slice(70, 130), slice(110, 190)); outer = (slice(10, 50), slice(60, 280))\nprint('block matching disparity: near box %d px, wall %d px (true 32, 16)' % (np.median(d[inner]), np.median(d[outer])))\nsgbm = cv2.StereoSGBM_create(0, 64, 7).compute(left, right).astype(np.float32) / 16\nprint('SGBM: near box %.1f, wall %.1f' % (np.median(sgbm[inner]), np.median(sgbm[outer])))\nfor dd in (16, 32): print(' depth Z = fB/d = %.0f*%.1f/%d = %.3f m' % (f, B, dd, f * B / dd))\nprint('depth resolution at d=16: dZ = Z^2/(fB) * 1px = %.3f m' % ((f * B / 16) ** 2 / (f * B)))", "out": "block matching disparity: near box 32 px, wall 16 px (true 32, 16)\nSGBM: near box 32.0, wall 16.0\n depth Z = fB/d = 500*0.1/16 = 3.125 m\n depth Z = fB/d = 500*0.1/32 = 1.562 m\ndepth resolution at d=16: dZ = Z^2/(fB) * 1px = 0.195 m"}, "j_kalman": {"lang": "py", "file": "j_kalman.py", "src": "import numpy as np, cv2\nr = np.random.default_rng(0); dt = 1.0\nF = np.array([[1, 0, dt, 0], [0, 1, 0, dt], [0, 0, 1, 0], [0, 0, 0, 1]])   # constant velocity: state (x, y, vx, vy)\nHm = np.array([[1.0, 0, 0, 0], [0, 1, 0, 0]]); Q = np.eye(4) * 0.01; Rm = np.eye(2) * 4.0   # we measure position, sigma 2 px\ntruth = np.array([[10 + 3 * k, 50 + 1.5 * k] for k in range(40)]); z = truth + r.normal(0, 2, truth.shape)\nx = np.array([z[0, 0], z[0, 1], 0, 0]); P = np.eye(4) * 100; est = []\nkf = cv2.KalmanFilter(4, 2); kf.transitionMatrix = F.astype(np.float32); kf.measurementMatrix = Hm.astype(np.float32)\nkf.processNoiseCov = Q.astype(np.float32); kf.measurementNoiseCov = Rm.astype(np.float32); kf.errorCovPost = (np.eye(4) * 100).astype(np.float32)\nkf.statePost = x.reshape(4, 1).astype(np.float32); cvest = []\nfor k in range(1, 40):\n    x = F @ x; P = F @ P @ F.T + Q                                   # predict\n    S = Hm @ P @ Hm.T + Rm; Kg = P @ Hm.T @ np.linalg.inv(S)          # gain\n    x = x + Kg @ (z[k] - Hm @ x); P = (np.eye(4) - Kg @ Hm) @ P       # update\n    est.append(x[:2].copy()); kf.predict(); cvest.append(kf.correct(z[k].reshape(2, 1).astype(np.float32))[:2].ravel().copy())   # copy: OpenCV reuses the buffer\nest = np.array(est); print('mine vs cv2.KalmanFilter max diff %.1e px' % np.abs(est - np.array(cvest)).max())\nprint('RMS error: raw measurements %.2f px, Kalman %.2f px (last 20 steps)' % (np.sqrt(((z[20:] - truth[20:]) ** 2).mean()), np.sqrt(((est[19:] - truth[20:]) ** 2).mean())))\nprint('estimated velocity (%.2f, %.2f), true (3, 1.5)' % (x[2], x[3]))\nk1 = 100 / (100 + 4); print('1-D intuition: first gain P/(P+R) = %.3f -> trusts the measurement; later gains shrink' % k1)", "out": "mine vs cv2.KalmanFilter max diff 9.6e-06 px\nRMS error: raw measurements 2.25 px, Kalman 1.21 px (last 20 steps)\nestimated velocity (2.99, 1.65), true (3, 1.5)\n1-D intuition: first gain P/(P+R) = 0.962 -> trusts the measurement; later gains shrink"}, "j_meanshift": {"lang": "py", "file": "j_meanshift.py", "src": "import numpy as np, cv2\ndef frame(cx, cy):\n    f = np.zeros((120, 160, 3), np.uint8); f[:] = (40, 120, 40)                 # green field (BGR)\n    cv2.circle(f, (int(cx), int(cy)), 12, (30, 30, 220), -1); return f           # red ball\nhsv = cv2.cvtColor(frame(40, 60), cv2.COLOR_BGR2HSV)\nwin = (28, 48, 24, 24); x, y, w, h = win\nroi_hist = cv2.calcHist([hsv[y:y + h, x:x + w]], [0], None, [18], [0, 180]); cv2.normalize(roi_hist, roi_hist, 0, 255, cv2.NORM_MINMAX)\ncrit = (cv2.TERM_CRITERIA_EPS | cv2.TERM_CRITERIA_COUNT, 10, 1)\nfor t in range(1, 6):\n    cx, cy = 40 + 8 * t, 60 + 3 * t\n    bp = cv2.calcBackProject([cv2.cvtColor(frame(cx, cy), cv2.COLOR_BGR2HSV)], [0], roi_hist, [0, 180], 1)\n    n, win = cv2.meanShift(bp, win, crit)\n    print('frame %d: ball centre (%d,%d), window centre (%.0f,%.0f), %d iterations' % (t, cx, cy, win[0] + win[2] / 2, win[1] + win[3] / 2, n))\n# the core step from scratch: move the window to the centroid of the weights inside it\nbp = cv2.calcBackProject([cv2.cvtColor(frame(100, 60), cv2.COLOR_BGR2HSV)], [0], roi_hist, [0, 180], 1).astype(float)\ndef ms(x, y):\n  for i in range(20):\n    xs, ys = int(round(x)) - 12, int(round(y)) - 12; patch = bp[ys:ys + 24, xs:xs + 24]; m = patch.sum()\n    if m == 0: return x, y, i, 'no weight in window: lost'\n    yy, xx = np.mgrid[ys:ys + 24, xs:xs + 24]; nx, ny = (patch * xx).sum() / m, (patch * yy).sum() / m\n    if np.hypot(nx - x, ny - y) < 0.5: return nx, ny, i, 'converged'\n    x, y = nx, ny\n  return x, y, i, 'max steps'\nfor st in [(92.0, 52.0), (60.0, 40.0)]: print('from-scratch mean shift from', st, '-> (%.1f, %.1f) after %d steps, %s; ball at (100,60)' % ms(*st))\nprint('histogram bins with weight:', int((roi_hist > 0).sum()), '(the window also saw green field: background leaks into the model)')", "out": "frame 1: ball centre (48,63), window centre (47,62), 5 iterations\nframe 2: ball centre (56,66), window centre (55,65), 5 iterations\nframe 3: ball centre (64,69), window centre (63,68), 5 iterations\nframe 4: ball centre (72,72), window centre (71,71), 5 iterations\nframe 5: ball centre (80,75), window centre (79,74), 5 iterations\nfrom-scratch mean shift from (92.0, 52.0) -> (99.3, 59.3) after 6 steps, converged; ball at (100,60)\nfrom-scratch mean shift from (60.0, 40.0) -> (59.5, 39.5) after 1 steps, converged; ball at (100,60)\nhistogram bins with weight: 2 (the window also saw green field: background leaks into the model)"}, "k_hog": {"lang": "py", "file": "k_hog.py", "src": "import numpy as np, cv2\nfrom cvk import digits\ndef hog(img, cell=4, bins=9):\n    \"\"\"From scratch: unsigned gradients, 9 orientation bins over 0-180 deg, magnitude-weighted, per cell, then L2-normalised 2x2 blocks.\"\"\"\n    gx = cv2.Sobel(img, cv2.CV_64F, 1, 0, ksize=1); gy = cv2.Sobel(img, cv2.CV_64F, 0, 1, ksize=1)\n    mag = np.hypot(gx, gy); ang = np.degrees(np.arctan2(gy, gx)) % 180\n    ch, cw = img.shape[0] // cell, img.shape[1] // cell; H = np.zeros((ch, cw, bins))\n    b = ang / (180 / bins) - 0.5; b0 = np.floor(b).astype(int); f = b - b0               # linear vote between two bins\n    for y in range(ch * cell):\n        for x in range(cw * cell):\n            H[y // cell, x // cell, b0[y, x] % bins] += mag[y, x] * (1 - f[y, x]); H[y // cell, x // cell, (b0[y, x] + 1) % bins] += mag[y, x] * f[y, x]\n    blocks = [H[i:i + 2, j:j + 2].ravel() for i in range(ch - 1) for j in range(cw - 1)]\n    return np.concatenate([v / np.sqrt((v ** 2).sum() + 1e-6) for v in blocks])\nX, y = digits(0, 400); Xt, yt = digits(1, 200)\nF = np.array([hog(x) for x in X]); Ft = np.array([hog(x) for x in Xt]); print('HOG length per 12x12 image:', F.shape[1], '= 4 blocks x 4 cells x 9 bins')\nsvm = cv2.ml.SVM_create(); svm.setType(cv2.ml.SVM_C_SVC); svm.setKernel(cv2.ml.SVM_LINEAR); svm.setC(1.0)\nsvm.train(F.astype(np.float32), cv2.ml.ROW_SAMPLE, y.astype(np.int32))\npred = svm.predict(Ft.astype(np.float32))[1].ravel(); print('cv2 linear SVM on HOG: test accuracy %.3f' % (pred == yt).mean())\n# from-scratch one-vs-rest linear SVM by subgradient descent on the hinge loss\nW = np.zeros((4, F.shape[1] + 1)); A = np.c_[F, np.ones(len(F))]; lam = 1e-3\nfor ep in range(200):\n    for c in range(4):\n        s = np.where(y == c, 1, -1); m = s * (A @ W[c]) < 1\n        W[c] -= 0.05 * (lam * W[c] - (s[m, None] * A[m]).sum(0) / len(A))\nprint('from-scratch SVM on HOG: test accuracy %.3f' % ((np.c_[Ft, np.ones(len(Ft))] @ W.T).argmax(1) == yt).mean())\nhd = cv2.HOGDescriptor((64, 128), (16, 16), (8, 8), (8, 8), 9); print('pedestrian HOG (64x128 window) length:', hd.getDescriptorSize())", "out": "HOG length per 12x12 image: 144 = 4 blocks x 4 cells x 9 bins\ncv2 linear SVM on HOG: test accuracy 1.000\nfrom-scratch SVM on HOG: test accuracy 0.965\npedestrian HOG (64x128 window) length: 3780"}, "k_viola": {"lang": "py", "file": "k_viola.py", "src": "import numpy as np, cv2\nr = np.random.default_rng(0)\ndef face(n):             # toy 'faces': dark eye band over a brighter cheek band, 16x16\n    X = r.normal(120, 40, (n, 16, 16)); X[:, 4:8, 2:14] -= 12; X[:, 9:13, 2:14] += 8; X += r.uniform(-40, 40, (n, 1, 1)); return X\ndef nonface(n): return r.normal(120, 40, (n, 16, 16)) + r.uniform(-40, 40, (n, 1, 1))\nX = np.r_[face(300), nonface(300)]; y = np.r_[np.ones(300), -np.ones(300)]\nII = np.array([cv2.integral(x.astype(np.float32)) for x in X])           # integral images: any rectangle sum in 4 lookups\ndef rect(ii, y0, x0, h, w): return ii[:, y0 + h, x0 + w] - ii[:, y0, x0 + w] - ii[:, y0 + h, x0] + ii[:, y0, x0]\nfeats = {}                                                               # two-rectangle Haar features: (bottom - top)\nfor y0 in range(0, 12, 2):\n    for x0 in range(0, 12, 4):\n        for h in (2, 4):\n            if y0 + 2 * h <= 16: feats[(y0, x0, h)] = rect(II, y0 + h, x0, h, 4) - rect(II, y0, x0, h, 4)\nprint('Haar features evaluated:', len(feats))\nw = np.ones(len(y)) / len(y); strong = []\nfor t in range(5):                                                       # AdaBoost with decision stumps\n    best = None\n    for k, f in feats.items():\n        for thr in np.percentile(f, [10, 30, 50, 70, 90]):\n            for pol in (1, -1):\n                h = np.where(pol * (f - thr) > 0, 1, -1); err = w[h != y].sum()\n                if best is None or err < best[0]: best = (err, k, thr, pol, h)\n    err, k, thr, pol, h = best; a = 0.5 * np.log((1 - err) / max(err, 1e-10))\n    w *= np.exp(-a * y * h); w /= w.sum(); strong.append((a, k, thr, pol))\n    print(' round %d: feature %s weighted error %.3f alpha %.2f' % (t + 1, k, err, a))\nscore = sum(a * np.where(p * (feats[k] - th) > 0, 1, -1) for a, k, th, p in strong)\nprint('boosted training accuracy %.3f' % ((np.sign(score) == y).mean()))\ncasc = cv2.CascadeClassifier(cv2.data.haarcascades + 'haarcascade_frontalface_default.xml') if hasattr(cv2, 'data') else None\nprint('OpenCV ships trained cascades:', casc is not None and not casc.empty())", "out": "Haar features evaluated: 33\n round 1: feature (4, 8, 4) weighted error 0.247 alpha 0.56\n round 2: feature (4, 4, 4) weighted error 0.263 alpha 0.51\n round 3: feature (4, 0, 4) weighted error 0.399 alpha 0.20\n round 4: feature (0, 8, 4) weighted error 0.405 alpha 0.19\n round 5: feature (6, 4, 4) weighted error 0.393 alpha 0.22\nboosted training accuracy 0.803\nOpenCV ships trained cascades: True"}, "l_logreg": {"lang": "py", "file": "l_logreg.py", "src": "import numpy as np\nfrom cvk import digits\nX, y = digits(0, 400); Xv, yv = digits(1, 200)\nA = X.reshape(len(X), -1); Av = Xv.reshape(len(Xv), -1)              # 144 raw pixels as features\nW = np.zeros((144, 4)); b = np.zeros(4); lr = 0.5\ndef softmax(z): z = z - z.max(1, keepdims=True); e = np.exp(z); return e / e.sum(1, keepdims=True)\nfor ep in range(301):\n    p = softmax(A @ W + b); loss = -np.log(p[np.arange(len(y)), y]).mean()\n    g = p.copy(); g[np.arange(len(y)), y] -= 1; g /= len(y)                 # dL/dz = p - onehot\n    W -= lr * A.T @ g; b -= lr * g.sum(0)\n    if ep in (0, 10, 50, 300): print('epoch %3d  loss %.4f  train acc %.3f  val acc %.3f' % (ep, loss, (p.argmax(1) == y).mean(), (softmax(Av @ W + b).argmax(1) == yv).mean()))\nprint('initial loss ln(4) = %.4f: uniform guessing over 4 classes' % np.log(4))\nz = np.array([2.0, 1.0, 0.1]); print('softmax of', z, '=', np.round(softmax(z[None])[0], 3))", "out": "epoch   0  loss 1.3863  train acc 0.225  val acc 0.215\nepoch  10  loss 0.7213  train acc 0.902  val acc 0.885\nepoch  50  loss 0.2473  train acc 0.995  val acc 1.000\nepoch 300  loss 0.0480  train acc 1.000  val acc 1.000\ninitial loss ln(4) = 1.3863: uniform guessing over 4 classes\nsoftmax of [2.  1.  0.1] = [0.659 0.242 0.099]"}, "l_mlp": {"lang": "py", "file": "l_mlp.py", "src": "import numpy as np\nfrom tinycnn import Linear, ReLU, Net, softmax_ce, SGD\nfrom cvk import digits\nX, y = digits(0, 400); Xv, yv = digits(1, 200); A = X.reshape(400, -1); Av = Xv.reshape(200, -1)\nnet = Net([Linear(144, 32), ReLU(), Linear(32, 4, rng=np.random.default_rng(2))])\n# gradient check: backprop vs centred finite differences on a few weights\nloss, g, _ = softmax_ce(net.forward(A[:8]), y[:8]); net.backward(g)\nL = net.layers[0]; worst = 0\nfor (i, j) in [(0, 0), (10, 5), (100, 31), (143, 7)]:\n    old = L.W[i, j]; L.W[i, j] = old + 1e-5; lp = softmax_ce(net.forward(A[:8]), y[:8])[0]\n    L.W[i, j] = old - 1e-5; lm = softmax_ce(net.forward(A[:8]), y[:8])[0]; L.W[i, j] = old\n    num = (lp - lm) / 2e-5; worst = max(worst, abs(num - L.dW[i, j]) / max(1e-12, abs(num) + abs(L.dW[i, j])))\nprint('gradient check, worst relative error %.1e (below 1e-6 means backprop is right)' % worst)\nopt = SGD(net, lr=0.05)\nfor ep in range(30):\n    for i in range(0, 400, 32):\n        loss, g, _ = softmax_ce(net.forward(A[i:i + 32]), y[i:i + 32]); net.backward(g); opt.step()\n    if ep % 10 == 9: print('epoch %d loss %.4f val acc %.3f' % (ep + 1, loss, (net.forward(Av).argmax(1) == yv).mean()))", "out": "gradient check, worst relative error 2.0e-08 (below 1e-6 means backprop is right)\nepoch 10 loss 0.0038 val acc 1.000\nepoch 20 loss 0.0018 val acc 1.000\nepoch 30 loss 0.0012 val acc 1.000"}, "l_overfit": {"lang": "py", "file": "l_overfit.py", "src": "import numpy as np\nr = np.random.default_rng(0)\nx = np.sort(r.uniform(-1, 1, 20)); y = np.sin(3 * x) + r.normal(0, 0.15, 20)          # small noisy training set\nxv = np.linspace(-1, 1, 200); yv = np.sin(3 * xv)\ndef fit(deg, lam):\n    V = np.vander(x, deg + 1); w = np.linalg.solve(V.T @ V + lam * np.eye(deg + 1), V.T @ y)    # ridge regression\n    mse = lambda xs, ys: np.mean((np.vander(xs, deg + 1) @ w - ys) ** 2); return mse(x, y), mse(xv, yv)\nfor deg, lam in [(1, 0), (3, 0), (5, 0), (15, 0), (15, 1e-3), (15, 1e-1)]:\n    tr, va = fit(deg, lam); print('degree %2d  lambda %-6g train MSE %.4f   validation MSE %.4f' % (deg, lam, tr, va))\n# k-fold cross-validation picks lambda without touching the test set\nfolds = np.array_split(r.permutation(20), 5)\nfor lam in (1e-6, 1e-3, 1e-1, 10):\n    errs = []\n    for f in folds:\n        tr = np.setdiff1d(np.arange(20), f); V = np.vander(x[tr], 16)\n        w = np.linalg.solve(V.T @ V + lam * np.eye(16), V.T @ y[tr]); errs.append(np.mean((np.vander(x[f], 16) @ w - y[f]) ** 2))\n    print('5-fold CV, degree 15, lambda %-6g: mean held-out MSE %.4f' % (lam, np.mean(errs)))", "out": "degree  1  lambda 0      train MSE 0.1675   validation MSE 0.2135\ndegree  3  lambda 0      train MSE 0.0121   validation MSE 0.0043\ndegree  5  lambda 0      train MSE 0.0065   validation MSE 0.0138\ndegree 15  lambda 0      train MSE 0.0008   validation MSE 28.2562\ndegree 15  lambda 0.001  train MSE 0.0054   validation MSE 0.1034\ndegree 15  lambda 0.1    train MSE 0.0244   validation MSE 0.0193\n5-fold CV, degree 15, lambda 1e-06 : mean held-out MSE 0.0679\n5-fold CV, degree 15, lambda 0.001 : mean held-out MSE 0.0443\n5-fold CV, degree 15, lambda 0.1   : mean held-out MSE 0.0547\n5-fold CV, degree 15, lambda 10    : mean held-out MSE 0.3446"}, "m_augment": {"lang": "py", "file": "m_augment.py", "src": "import numpy as np, cv2\nfrom cvk import scene_rgb\nimg = scene_rgb(); H, W = img.shape[:2]; box = np.array([20, 50, 50, 80], float)          # x1 y1 x2 y2 of the red square\nr = np.random.default_rng(0)\nf = img[:, ::-1]; fb = np.array([W - box[2], box[1], W - box[0], box[3]])                   # horizontal flip moves the box too\nprint('flip: box', box, '->', fb, ' red still inside:', np.all(f[int(fb[1]) + 5, int(fb[0]) + 5] == img[55, 25]))\nM = cv2.getRotationMatrix2D((W / 2, H / 2), 15, 1.0); rot = cv2.warpAffine(img, M, (W, H))\nc = np.array([[box[0], box[1], 1], [box[2], box[1], 1], [box[2], box[3], 1], [box[0], box[3], 1]]) @ M.T\nprint('rotate 15 deg: new axis-aligned box', np.round([c[:, 0].min(), c[:, 1].min(), c[:, 0].max(), c[:, 1].max()], 1), '(grows: looser label)')\nhsv = cv2.cvtColor(img, cv2.COLOR_RGB2HSV).astype(int); hsv[..., 2] = np.clip(hsv[..., 2] * 1.3, 0, 255)\njit = cv2.cvtColor(hsv.astype(np.uint8), cv2.COLOR_HSV2RGB); print('brightness jitter x1.3, mean %.1f -> %.1f' % (img.mean(), jit.mean()))\ncut = img.copy(); y0, x0 = r.integers(0, H - 16), r.integers(0, W - 16); cut[y0:y0 + 16, x0:x0 + 16] = 0; print('cutout 16x16 at', (int(y0), int(x0)))\nlam = r.beta(0.4, 0.4); y1, y2 = np.eye(4)[0], np.eye(4)[2]; print('mixup lambda %.3f -> soft label' % lam, np.round(lam * y1 + (1 - lam) * y2, 3))", "out": "flip: box [20. 50. 50. 80.] -> [ 78.  50. 108.  80.]  red still inside: True\nrotate 15 deg: new axis-aligned box [22.  53.6 58.8 90.3] (grows: looser label)\nbrightness jitter x1.3, mean 127.7 -> 148.7\ncutout 16x16 at (68, 71)\nmixup lambda 0.991 -> soft label [0.991 0.    0.009 0.   ]"}, "m_bn": {"lang": "py", "file": "m_bn.py", "src": "import numpy as np\nr = np.random.default_rng(0)\ndef bn_forward(x, g, b, eps=1e-5):\n    mu = x.mean(0); var = x.var(0); xh = (x - mu) / np.sqrt(var + eps); return g * xh + b, (xh, var, eps, g)\ndef bn_backward(dy, cache):\n    xh, var, eps, g = cache; N = len(xh)\n    dg = (dy * xh).sum(0); db = dy.sum(0); dxh = dy * g\n    dx = (N * dxh - dxh.sum(0) - xh * (dxh * xh).sum(0)) / (N * np.sqrt(var + eps))   # the compact formula\n    return dx, dg, db\nx = r.normal(3, 2, (16, 4)); g = r.normal(size=4); b = r.normal(size=4); dy = r.normal(size=(16, 4))\ny, cache = bn_forward(x, g, b); print('after BN: batch mean', np.round(((y - b) / g).mean(0), 6) + 0.0, 'std', np.round(((y - b) / g).std(0), 4))\ndx, dg, db = bn_backward(dy, cache); worst = 0\nfor _ in range(8):\n    i, j = r.integers(0, 16), r.integers(0, 4); xp = x.copy(); xp[i, j] += 1e-6; xm = x.copy(); xm[i, j] -= 1e-6\n    num = ((dy * bn_forward(xp, g, b)[0]).sum() - (dy * bn_forward(xm, g, b)[0]).sum()) / 2e-6\n    worst = max(worst, abs(num - dx[i, j]) / (abs(num) + abs(dx[i, j])))\nprint('batchnorm backward gradient check: worst relative error %.1e' % worst)\nfor name, f in [('sigmoid', lambda z: 1 / (1 + np.exp(-z))), ('tanh', np.tanh)]:\n    z = np.linspace(-6, 6, 1001); d = np.gradient(f(z), z); print('%s: max derivative %.3f, at z=5: %.4f (saturates)' % (name, d.max(), d[np.argmin(abs(z - 5))]))\nfor init, s in [('N(0,1)', 1.0), ('Xavier', np.sqrt(1 / 256)), ('He', np.sqrt(2 / 256))]:\n    h = r.normal(size=(512, 256))\n    for _ in range(10): h = np.maximum(0, h @ r.normal(0, s, (256, 256)))\n    print('10 ReLU layers, %-7s init: activation std %.3g' % (init, h.std()))", "out": "after BN: batch mean [0. 0. 0. 0.] std [1. 1. 1. 1.]\nbatchnorm backward gradient check: worst relative error 6.9e-09\nsigmoid: max derivative 0.250, at z=5: 0.0066 (saturates)\ntanh: max derivative 1.000, at z=5: 0.0002 (saturates)\n10 ReLU layers, N(0,1)  init: activation std 3.11e+10\n10 ReLU layers, Xavier  init: activation std 0.0237\n10 ReLU layers, He      init: activation std 1.02"}, "m_convbwd": {"lang": "py", "file": "m_convbwd.py", "src": "import numpy as np\nfrom tinycnn import Conv, MaxPool, ReLU\nr = np.random.default_rng(1)\ndef gradcheck(layer, x, name):\n    out = layer.forward(x); G = r.normal(size=out.shape)                # pretend L = sum(G * out), so dL/dout = G\n    dx = layer.backward(G); worst = 0\n    for _ in range(6):\n        idx = tuple(r.integers(0, s) for s in x.shape); old = x[idx]\n        x[idx] = old + 1e-6; lp = (G * layer.forward(x)).sum(); x[idx] = old - 1e-6; lm = (G * layer.forward(x)).sum(); x[idx] = old\n        num = (lp - lm) / 2e-6; worst = max(worst, abs(num - dx[idx]) / (abs(num) + abs(dx[idx]) + 1e-12))\n    print('%-22s dL/dx worst relative error %.1e' % (name, worst))\n    return G\nx = r.normal(size=(2, 3, 6, 6))\nconv = Conv(3, 2, 3, pad=1); G = gradcheck(conv, x.copy(), 'Conv 3x3 pad 1')\nconv.forward(x); conv.backward(G); W = conv.W; worst = 0\nfor _ in range(6):\n    idx = tuple(r.integers(0, s) for s in W.shape); old = W[idx]\n    W[idx] = old + 1e-6; lp = (G * conv.forward(x)).sum(); W[idx] = old - 1e-6; lm = (G * conv.forward(x)).sum(); W[idx] = old\n    num = (lp - lm) / 2e-6; worst = max(worst, abs(num - conv.dW[idx]) / (abs(num) + abs(conv.dW[idx])))\nprint('%-22s dL/dW worst relative error %.1e' % ('Conv 3x3 pad 1', worst))\ngradcheck(Conv(3, 2, 3, stride=2), x.copy(), 'Conv 3x3 stride 2')\ngradcheck(MaxPool(2), x.copy(), 'MaxPool 2x2'); gradcheck(ReLU(), x.copy(), 'ReLU')\n# by hand on a 1-channel 3x3 input, 2x2 filter: dW = correlation of the input with dL/dout\nxi = np.arange(9.0).reshape(1, 1, 3, 3); c = Conv(1, 1, 2); c.W[:] = [[[[1, 0], [0, -1]]]]; c.b[:] = 0\nprint('forward:', c.forward(xi).ravel(), ' with dL/dout = ones: dx =', c.backward(np.ones((1, 1, 2, 2)))[0, 0].ravel(), 'dW =', c.dW.ravel(), 'db =', c.db)", "out": "Conv 3x3 pad 1         dL/dx worst relative error 1.3e-09\nConv 3x3 pad 1         dL/dW worst relative error 3.1e-10\nConv 3x3 stride 2      dL/dx worst relative error 3.8e-09\nMaxPool 2x2            dL/dx worst relative error 1.4e-09\nReLU                   dL/dx worst relative error 7.3e-11\nforward: [-4. -4. -4. -4.]  with dL/dout = ones: dx = [ 1.  1.  0.  1.  0. -1.  0. -1. -1.] dW = [ 8. 12. 20. 24.] db = [4.]"}, "m_convfwd": {"lang": "py", "file": "m_convfwd.py", "src": "import numpy as np, cv2\nfrom tinycnn import Conv, im2col\nr = np.random.default_rng(0)\nx = r.normal(size=(2, 3, 8, 8)); conv = Conv(3, 4, 3, stride=1, pad=1)\ndef conv_loops(x, W, b, pad):\n    N, C, H, Wd = x.shape; F, _, k, _ = W.shape; xp = np.pad(x, ((0, 0), (0, 0), (pad, pad), (pad, pad)))\n    out = np.zeros((N, F, H + 2 * pad - k + 1, Wd + 2 * pad - k + 1))\n    for n in range(N):\n        for f in range(F):\n            for i in range(out.shape[2]):\n                for j in range(out.shape[3]):\n                    out[n, f, i, j] = (xp[n, :, i:i + k, j:j + k] * W[f]).sum() + b[f]   # dot product of the field with the filter\n    return out\na = conv.forward(x); b = conv_loops(x, conv.W, conv.b, 1)\nprint('im2col conv == 6 nested loops:', np.allclose(a, b), ' output shape', a.shape)\nref = sum(cv2.filter2D(x[0, c], -1, conv.W[0, c], borderType=cv2.BORDER_CONSTANT) for c in range(3)) + conv.b[0]\nprint('channel-sum of cv2.filter2D (zero border) == conv output 0:', np.allclose(ref, a[0, 0]))\ncols, OH, OW = im2col(x, 3, 1, 1); print('im2col matrix', cols.shape, '= (N*OH*OW, C*k*k)')\nprint('MACs for this layer: OH*OW*Cout*Cin*k*k*N =', OH * OW * 4 * 3 * 9 * 2)\nfor H, k, s, p in [(32, 3, 1, 1), (32, 5, 1, 0), (32, 3, 2, 1), (227, 11, 4, 0)]: print(' H=%d k=%d s=%d p=%d -> out %d' % (H, k, s, p, (H + 2 * p - k) // s + 1))", "out": "im2col conv == 6 nested loops: True  output shape (2, 4, 8, 8)\nchannel-sum of cv2.filter2D (zero border) == conv output 0: True\nim2col matrix (128, 27) = (N*OH*OW, C*k*k)\nMACs for this layer: OH*OW*Cout*Cin*k*k*N = 13824\n H=32 k=3 s=1 p=1 -> out 32\n H=32 k=5 s=1 p=0 -> out 28\n H=32 k=3 s=2 p=1 -> out 16\n H=227 k=11 s=4 p=0 -> out 55"}, "m_optim": {"lang": "py", "file": "m_optim.py", "src": "import numpy as np\n# an ill-conditioned bowl: f = 0.5 (x^2 + 50 y^2); minimum at 0\ngrad = lambda p: np.array([p[0], 50 * p[1]])\ndef run(kind, lr, steps=100):\n    p = np.array([10.0, 1.0]); v = np.zeros(2); m = np.zeros(2); s = np.zeros(2)\n    for t in range(1, steps + 1):\n        g = grad(p)\n        if kind == 'sgd': p = p - lr * g\n        elif kind == 'momentum': v = 0.9 * v - lr * g; p = p + v\n        else:                                    # Adam\n            m = 0.9 * m + 0.1 * g; s = 0.999 * s + 0.001 * g * g\n            p = p - lr * (m / (1 - 0.9 ** t)) / (np.sqrt(s / (1 - 0.999 ** t)) + 1e-8)\n    return np.linalg.norm(p)\nfor kind, lr in [('sgd', 0.039), ('sgd', 0.041), ('momentum', 0.02), ('adam', 0.5)]:\n    print('%-8s lr %-6g distance from minimum after 100 steps: %.4g' % (kind, lr, run(kind, lr)))\nprint('plain SGD diverges above lr = 2/L_max = 2/50 = 0.04')\nlrs = [0.1 * 0.5 * (1 + np.cos(np.pi * t / 100)) for t in (0, 25, 50, 75, 100)]; print('cosine schedule lr at 0/25/50/75/100%:', np.round(lrs, 4))", "out": "sgd      lr 0.039  distance from minimum after 100 steps: 0.1873\nsgd      lr 0.041  distance from minimum after 100 steps: 131.5\nmomentum lr 0.02   distance from minimum after 100 steps: 0.0423\nadam     lr 0.5    distance from minimum after 100 steps: 0.04234\nplain SGD diverges above lr = 2/L_max = 2/50 = 0.04\ncosine schedule lr at 0/25/50/75/100%: [0.1    0.0854 0.05   0.0146 0.    ]"}, "m_train": {"lang": "py", "file": "m_train.py", "src": "import numpy as np, time\nfrom tinycnn import Conv, ReLU, MaxPool, Flatten, Linear, Net, softmax_ce, SGD\nfrom cvk import digits\nX, y = digits(0, 600, noise=0.35, jitter=0)            # training shapes are always centred...\nXv, yv = digits(1, 400, noise=0.35, jitter=3)          # ...but validation shapes move up to 3 px\nX, Xv = X[:, None], Xv[:, None]                                           # (N, 1, 12, 12)\ndef augment(b, r):                                                        # random shifts of up to 3 px\n    out = np.empty_like(b)\n    for i, im in enumerate(b): out[i] = np.roll(im, tuple(r.integers(-3, 4, 2)), (1, 2))\n    return out\ndef run(aug, epochs=8, seed=0):\n    r = np.random.default_rng(seed)\n    net = Net([Conv(1, 8, 3, pad=1, rng=np.random.default_rng(seed)), ReLU(), MaxPool(2), Conv(8, 16, 3, pad=1, rng=np.random.default_rng(seed + 1)), ReLU(), MaxPool(2), Flatten(), Linear(16 * 3 * 3, 4, rng=np.random.default_rng(seed + 2))])\n    opt = SGD(net, lr=0.05, mom=0.9, wd=1e-4); hist = []\n    for ep in range(epochs):\n        perm = r.permutation(len(X)); tot = 0\n        for i in range(0, len(X), 32):\n            idx = perm[i:i + 32]; xb = augment(X[idx], r) if aug else X[idx]\n            loss, g, _ = softmax_ce(net.forward(xb), y[idx]); net.backward(g); opt.step(); tot += loss * len(idx)\n        opt.lr *= 0.8                                                     # step decay schedule\n        hist.append((tot / len(X), (net.forward(X).argmax(1) == y).mean(), (net.forward(Xv).argmax(1) == yv).mean()))\n    return net, hist\nt = time.time(); net, h = run(False)\nfor ep in (0, 3, 7): print('no aug  epoch %d: loss %.3f train %.3f val %.3f' % (ep + 1, *h[ep]))\nnet2, h2 = run(True); print('with shift augmentation, epoch 8: loss %.3f train %.3f val %.3f' % h2[-1])\nA = X.reshape(len(X), -1); W = np.zeros((144, 4))\nfor _ in range(300):\n    z = A @ W; p = np.exp(z - z.max(1, keepdims=True)); p /= p.sum(1, keepdims=True); p[np.arange(len(y)), y] -= 1; W -= 0.5 * A.T @ p / len(y)\nprint('baseline softmax regression on pixels: val %.3f' % ((Xv.reshape(len(Xv), -1) @ W).argmax(1) == yv).mean())\nprint('parameters in the CNN:', sum(P.size for l in net.layers for P, _ in l.params()))", "out": "no aug  epoch 1: loss 0.624 train 1.000 val 0.600\nno aug  epoch 4: loss 0.000 train 1.000 val 0.580\nno aug  epoch 8: loss 0.000 train 1.000 val 0.573\nwith shift augmentation, epoch 8: loss 0.005 train 1.000 val 1.000\nbaseline softmax regression on pixels: val 0.338\nparameters in the CNN: 1828"}, "n_attention": {"lang": "py", "file": "n_attention.py", "src": "import numpy as np\nr = np.random.default_rng(0)\nimg = r.random((32, 32, 3)); P, D = 8, 16\npatches = img.reshape(4, P, 4, P, 3).transpose(0, 2, 1, 3, 4).reshape(16, P * P * 3)     # 16 patches of 8x8x3 = 192 values\nE = r.normal(0, 0.05, (192, D)); tokens = patches @ E + r.normal(0, 0.02, (16, D))          # patch embedding + position embedding\ndef attention(X, Wq, Wk, Wv):\n    Q, K, V = X @ Wq, X @ Wk, X @ Wv; S = Q @ K.T / np.sqrt(K.shape[1])\n    A = np.exp(S - S.max(1, keepdims=True)); A /= A.sum(1, keepdims=True); return A @ V, A\nWq, Wk, Wv = (r.normal(0, 0.3, (D, D)) for _ in range(3))\nout, A = attention(tokens, Wq, Wk, Wv)\nprint('tokens', tokens.shape, '-> attention matrix', A.shape, ' rows sum to 1:', np.allclose(A.sum(1), 1))\nperm = r.permutation(16); out2, _ = attention(tokens[perm], Wq, Wk, Wv)\nprint('without position embeddings attention is permutation-equivariant:', np.allclose(out2, out[perm]))\nprint('cost: attention matrix entries grow as N^2: 196 tokens -> %d, 784 tokens -> %d' % (196 ** 2, 784 ** 2))", "out": "tokens (16, 16) -> attention matrix (16, 16)  rows sum to 1: True\nwithout position embeddings attention is permutation-equivariant: True\ncost: attention matrix entries grow as N^2: 196 tokens -> 38416, 784 tokens -> 614656"}, "n_params": {"lang": "py", "file": "n_params.py", "src": "import numpy as np\ndef conv(cin, cout, k, bias=True): return cin * cout * k * k + (cout if bias else 0)\ndef bn(c): return 2 * c                                        # gamma, beta (running stats are buffers, not parameters)\nlenet = conv(1, 6, 5) + conv(6, 16, 5) + (16 * 5 * 5 * 120 + 120) + (120 * 84 + 84) + (84 * 10 + 10)\nprint('LeNet-5 (modern form):', lenet)\ncfg = [64, 64, 'M', 128, 128, 'M', 256, 256, 256, 'M', 512, 512, 512, 'M', 512, 512, 512, 'M']; c = 3; vgg = 0\nfor v in cfg:\n    if v != 'M': vgg += conv(c, v, 3); c = v\nvgg += (512 * 7 * 7 * 4096 + 4096) + (4096 * 4096 + 4096) + (4096 * 1000 + 1000); print('VGG-16:', vgg, '(torchvision: 138357544)')\ndef basic(cin, cout, stride):\n    p = conv(cin, cout, 3, False) + bn(cout) + conv(cout, cout, 3, False) + bn(cout)\n    if stride != 1 or cin != cout: p += conv(cin, cout, 1, False) + bn(cout)     # projection shortcut\n    return p\nr18 = conv(3, 64, 7, False) + bn(64); c = 64\nfor cout, s in [(64, 1), (128, 2), (256, 2), (512, 2)]:\n    r18 += basic(c, cout, s) + basic(cout, cout, 1); c = cout\nr18 += 512 * 1000 + 1000; print('ResNet-18:', r18, '(torchvision: 11689512)')\nstd = conv(256, 256, 3, False); dw = 256 * 9 + conv(256, 256, 1, False)\nprint('3x3 conv 256->256: standard %d params, depthwise-separable %d (%.1fx fewer)' % (std, dw, std / dw))\nD, P, L, mlp = 768, 16, 12, 3072\nvit = (3 * P * P * D + D) + D + 197 * D + L * (2 * 2 * D + (3 * D * D + 3 * D) + (D * D + D) + (D * mlp + mlp) + (mlp * D + D)) + 2 * D + (D * 1000 + 1000)\nprint('ViT-B/16:', vit, '(timm: 86567656)')\ndef rf(layers):\n    r, j = 1, 1\n    for k, s in layers: r += (k - 1) * j; j *= s\n    return r\nprint('receptive field of 3 stacked 3x3 convs:', rf([(3, 1)] * 3), '; VGG-16 conv5_3:', rf([(3, 1), (3, 1), (2, 2)] * 2 + [(3, 1)] * 3 + [(2, 2)] + [(3, 1)] * 3 + [(2, 2)] + [(3, 1)] * 3))", "out": "LeNet-5 (modern form): 61706\nVGG-16: 138357544 (torchvision: 138357544)\nResNet-18: 11689512 (torchvision: 11689512)\n3x3 conv 256->256: standard 589824 params, depthwise-separable 67840 (8.7x fewer)\nViT-B/16: 86567656 (timm: 86567656)\nreceptive field of 3 stacked 3x3 convs: 7 ; VGG-16 conv5_3: 196"}, "n_resnet": {"lang": "py", "file": "n_resnet.py", "src": "import numpy as np\nr = np.random.default_rng(0); D, depth = 64, 50\nWs = [r.normal(0, np.sqrt(2 / D), (D, D)) * 0.5 for _ in range(depth)]\ndef grad_norm(residual, branch=1.0):\n    x = r.normal(size=(32, D)); acts = [x]\n    for W in Ws:\n        h = np.maximum(0, acts[-1] @ W); acts.append(acts[-1] + branch * h if residual else h)\n    g = np.ones_like(acts[-1])\n    for i in reversed(range(depth)):                       # backprop through ReLU(x W) (+ identity)\n        pre = acts[i] @ Ws[i]; gh = (g * (pre > 0)) @ Ws[i].T; g = g + branch * gh if residual else gh\n    return np.linalg.norm(g) / np.sqrt(g.size)\nprint('RMS gradient reaching the input after 50 layers:')\nprint('  plain network            %.2e  (vanishes)' % grad_norm(False))\nprint('  residual, full branch    %.2e  (each block multiplies by I + dF: grows)' % grad_norm(True))\nprint('  residual, branch x 0.1   %.2e  (small-init branches, like zero-init BN gamma)' % grad_norm(True, 0.1))\nprint('a residual block y = x + F(x) has dy/dx = I + dF/dx: the identity term carries the gradient')", "out": "RMS gradient reaching the input after 50 layers:\n  plain network            2.72e-15  (vanishes)\n  residual, full branch    1.25e+06  (each block multiplies by I + dF: grows)\n  residual, branch x 0.1   2.97e+00  (small-init branches, like zero-init BN gamma)\na residual block y = x + F(x) has dy/dx = I + dF/dx: the identity term carries the gradient"}, "o_boxes": {"lang": "py", "file": "o_boxes.py", "src": "import numpy as np\ndef encode(gt, an):                       # Faster R-CNN box deltas (tx, ty, tw, th) relative to an anchor (cx, cy, w, h)\n    return np.array([(gt[0] - an[0]) / an[2], (gt[1] - an[1]) / an[3], np.log(gt[2] / an[2]), np.log(gt[3] / an[3])])\ndef decode(t, an): return np.array([an[0] + t[0] * an[2], an[1] + t[1] * an[3], an[2] * np.exp(t[2]), an[3] * np.exp(t[3])])\nan = np.array([100, 100, 64, 32.]); gt = np.array([110, 96, 80, 40.]); t = encode(gt, an)\nprint('deltas', np.round(t, 4), ' decode(encode) == gt:', np.allclose(decode(t, an), gt))\nanchors = [(s * np.sqrt(ar), s / np.sqrt(ar)) for s in (32, 64, 128) for ar in (0.5, 1, 2)]\nprint('9 anchors (w,h):', [tuple(np.round(a).astype(int).tolist()) for a in anchors])\nprint('anchors on a 38x50 feature map:', 38 * 50 * 9)\n# YOLO-style decode: grid cell (i, j), stride 32, sigmoid offsets, anchor prior\nsig = lambda z: 1 / (1 + np.exp(-z)); tx, ty, tw, th = 0.2, -0.4, 0.3, -0.1; i, j, s, pw, ph = 5, 7, 32, 116, 90\nprint('YOLO box centre (%.1f, %.1f) size (%.1f, %.1f)' % ((j + sig(tx)) * s, (i + sig(ty)) * s, pw * np.exp(tw), ph * np.exp(th)))", "out": "deltas [ 0.1562 -0.125   0.2231  0.2231]  decode(encode) == gt: True\n9 anchors (w,h): [(23, 45), (32, 32), (45, 23), (45, 91), (64, 64), (91, 45), (91, 181), (128, 128), (181, 91)]\nanchors on a 38x50 feature map: 17100\nYOLO box centre (241.6, 172.8) size (156.6, 81.4)"}, "o_iou_nms": {"lang": "py", "file": "o_iou_nms.py", "src": "import numpy as np, cv2\ndef iou(a, b):\n    \"\"\"a: (N,4), b: (M,4) boxes as x1,y1,x2,y2 -> (N,M) IoU matrix.\"\"\"\n    x1 = np.maximum(a[:, None, 0], b[None, :, 0]); y1 = np.maximum(a[:, None, 1], b[None, :, 1])\n    x2 = np.minimum(a[:, None, 2], b[None, :, 2]); y2 = np.minimum(a[:, None, 3], b[None, :, 3])\n    inter = np.clip(x2 - x1, 0, None) * np.clip(y2 - y1, 0, None)\n    area = lambda c: (c[:, 2] - c[:, 0]) * (c[:, 3] - c[:, 1])\n    return inter / (area(a)[:, None] + area(b)[None, :] - inter)\nprint('IoU of (0,0,10,10) and (5,5,15,15): 25/(100+100-25) =', round(float(iou(np.array([[0, 0, 10, 10.]]), np.array([[5, 5, 15, 15.]]))[0, 0]), 4))\ndef nms(boxes, scores, thr):\n    order = np.argsort(-scores); keep = []\n    while len(order):\n        i = order[0]; keep.append(int(i))\n        order = order[1:][iou(boxes[i:i + 1], boxes[order[1:]])[0] <= thr]       # drop everything overlapping the winner\n    return keep\nr = np.random.default_rng(0); centres = np.array([[30, 30], [80, 40], [50, 90]])\nB = np.vstack([np.r_[c - 15, c + 15] + r.normal(0, 3, 4) for c in centres for _ in range(6)]); S = r.random(len(B))\nk = nms(B, S, 0.5); kc = cv2.dnn.NMSBoxes([list(map(float, [b[0], b[1], b[2] - b[0], b[3] - b[1]])) for b in B], S.tolist(), 0.0, 0.5)\nprint('18 noisy boxes around 3 objects -> NMS keeps', len(k), ' mine == cv2.dnn.NMSBoxes:', sorted(k) == sorted(np.array(kc).ravel().tolist()))\nfor thr in (0.1, 0.3, 0.5, 0.7, 0.9): print(' IoU threshold %.1f keeps %d boxes' % (thr, len(nms(B, S, thr))))\ng = np.array([[0, 0, 10, 10.]]); p = np.array([[12, 0, 22, 10.]])\nc = [min(g[0, 0], p[0, 0]), min(g[0, 1], p[0, 1]), max(g[0, 2], p[0, 2]), max(g[0, 3], p[0, 3])]\ngiou = iou(g, p)[0, 0] - ((c[2] - c[0]) * (c[3] - c[1]) - (100 + 100)) / ((c[2] - c[0]) * (c[3] - c[1]))\nprint('non-overlapping boxes: IoU 0 gives no gradient; GIoU = %.3f still says how far apart' % giou)", "out": "IoU of (0,0,10,10) and (5,5,15,15): 25/(100+100-25) = 0.1429\n18 noisy boxes around 3 objects -> NMS keeps 5  mine == cv2.dnn.NMSBoxes: True\n IoU threshold 0.1 keeps 3 boxes\n IoU threshold 0.3 keeps 3 boxes\n IoU threshold 0.5 keeps 5 boxes\n IoU threshold 0.7 keeps 10 boxes\n IoU threshold 0.9 keeps 18 boxes\nnon-overlapping boxes: IoU 0 gives no gradient; GIoU = -0.091 still says how far apart"}, "o_map": {"lang": "py", "file": "o_map.py", "src": "import numpy as np\n# detections for one class across a dataset: (score, matched-a-ground-truth?) after IoU >= 0.5 matching; 6 ground-truth objects\ndets = [(0.95, 1), (0.9, 1), (0.85, 0), (0.8, 1), (0.7, 0), (0.6, 1), (0.5, 0), (0.4, 1), (0.3, 0)]; n_gt = 6\ntp = np.cumsum([d[1] for d in sorted(dets, reverse=True)]); fp = np.cumsum([1 - d[1] for d in sorted(dets, reverse=True)])\nprec = tp / (tp + fp); rec = tp / n_gt\nfor i in range(len(dets)): print(' rank %d score %.2f  TP %d FP %d  precision %.3f recall %.3f' % (i + 1, sorted(dets, reverse=True)[i][0], tp[i], fp[i], prec[i], rec[i]))\nmp = np.maximum.accumulate(prec[::-1])[::-1]                         # precision envelope: best precision at recall >= r\nr = np.r_[0, rec]; ap_all = np.sum((r[1:] - r[:-1]) * mp)\nap101 = np.mean([mp[rec >= t].max() if (rec >= t).any() else 0 for t in np.linspace(0, 1, 101)])\nprint('AP (all-point, VOC2010+) %.4f   AP (101-point, COCO style) %.4f' % (ap_all, ap101))\nprint('recall never reaches 1: one object was never detected, so AP <= %.3f' % rec[-1])", "out": " rank 1 score 0.95  TP 1 FP 0  precision 1.000 recall 0.167\n rank 2 score 0.90  TP 2 FP 0  precision 1.000 recall 0.333\n rank 3 score 0.85  TP 2 FP 1  precision 0.667 recall 0.333\n rank 4 score 0.80  TP 3 FP 1  precision 0.750 recall 0.500\n rank 5 score 0.70  TP 3 FP 2  precision 0.600 recall 0.500\n rank 6 score 0.60  TP 4 FP 2  precision 0.667 recall 0.667\n rank 7 score 0.50  TP 4 FP 3  precision 0.571 recall 0.667\n rank 8 score 0.40  TP 5 FP 3  precision 0.625 recall 0.833\n rank 9 score 0.30  TP 5 FP 4  precision 0.556 recall 0.833\nAP (all-point, VOC2010+) 0.6736   AP (101-point, COCO style) 0.6737\nrecall never reaches 1: one object was never detected, so AP <= 0.833"}, "o_pose": {"lang": "py", "file": "o_pose.py", "src": "import numpy as np\nH = W = 48; kp = np.array([20.3, 31.7])                         # (x, y) keypoint\nyy, xx = np.mgrid[0:H, 0:W]; hm = np.exp(-((xx - kp[0]) ** 2 + (yy - kp[1]) ** 2) / (2 * 2.0 ** 2))   # training target heatmap\niy, ix = np.unravel_index(hm.argmax(), hm.shape); print('argmax decode: (%d, %d) -> error %.2f px' % (ix, iy, np.hypot(ix - kp[0], iy - kp[1])))\ndx = 0.5 * (np.log(hm[iy, ix + 1]) - np.log(hm[iy, ix - 1])) / (2 * np.log(hm[iy, ix]) - np.log(hm[iy, ix + 1]) - np.log(hm[iy, ix - 1]))\ndy = 0.5 * (np.log(hm[iy + 1, ix]) - np.log(hm[iy - 1, ix])) / (2 * np.log(hm[iy, ix]) - np.log(hm[iy + 1, ix]) - np.log(hm[iy - 1, ix]))\nprint('sub-pixel (parabola on log heatmap): (%.2f, %.2f)' % (ix + dx, iy + dy))\nw = hm ** 4; sx, sy = (w * xx).sum() / w.sum(), (w * yy).sum() / w.sum(); print('soft-argmax decode: (%.2f, %.2f)' % (sx, sy))\ngt = np.array([[50, 40], [60, 80], [70, 120]], float); pr = gt + np.array([[2, 1], [-6, 3], [1, -2]]); s2, k = 3000.0, np.array([0.079, 0.072, 0.087])\noks = np.mean(np.exp(-np.sum((pr - gt) ** 2, 1) / (2 * s2 * k ** 2 * 4))); print('OKS (object area 3000, COCO sigmas) = %.3f' % oks)\nprint('PCK@0.2 of a 50 px torso: %d of 3 joints within 10 px' % (np.linalg.norm(pr - gt, axis=1) < 10).sum())", "out": "argmax decode: (20, 32) -> error 0.42 px\nsub-pixel (parabola on log heatmap): (20.30, 31.70)\nsoft-argmax decode: (20.30, 31.70)\nOKS (object area 3000, COCO sigmas) = 0.879\nPCK@0.2 of a 50 px torso: 3 of 3 joints within 10 px"}, "o_seg": {"lang": "py", "file": "o_seg.py", "src": "import numpy as np\nr = np.random.default_rng(0)\ndef tconv_out(H, k, s, p, op=0): return (H - 1) * s - 2 * p + k + op\nprint('transposed conv 2x2 stride 2 doubles: 16 ->', tconv_out(16, 2, 2, 0), '; 3x3 s2 p1 op1: 16 ->', tconv_out(16, 3, 2, 1, 1))\nprint('U-Net (valid convs) 572 input -> encoder sizes:', end=' '); H = 572; sizes = []\nfor lvl in range(5):\n    H -= 4; sizes.append(H)\n    if lvl < 4: H //= 2\nprint(sizes, end=''); \nfor lvl in range(4): H = H * 2 - 4\nprint(' -> output', H)\npred = np.zeros((8, 8), bool); pred[2:6, 2:7] = True; gt = np.zeros((8, 8), bool); gt[2:7, 3:7] = True\ninter = (pred & gt).sum(); print('mask IoU %.3f  Dice %.3f (Dice = 2I/(|A|+|B|))' % (inter / (pred | gt).sum(), 2 * inter / (pred.sum() + gt.sum())))\ndef roi_align(f, box, out=2, samp=2):\n    \"\"\"RoIAlign: no rounding; each output bin averages samp x samp bilinear samples.\"\"\"\n    x1, y1, x2, y2 = box; bw, bh = (x2 - x1) / out, (y2 - y1) / out; res = np.zeros((out, out))\n    def bil(y, x):\n        y0, x0 = int(np.floor(y)), int(np.floor(x)); dy, dx = y - y0, x - x0\n        return f[y0, x0] * (1 - dy) * (1 - dx) + f[y0, x0 + 1] * (1 - dy) * dx + f[y0 + 1, x0] * dy * (1 - dx) + f[y0 + 1, x0 + 1] * dy * dx\n    for i in range(out):\n        for j in range(out):\n            res[i, j] = np.mean([bil(y1 + (i + (a + 0.5) / samp) * bh, x1 + (j + (b + 0.5) / samp) * bw) for a in range(samp) for b in range(samp)])\n    return res\nf = np.arange(64.0).reshape(8, 8)                       # f[y, x] = 8y + x is linear, so bilinear sampling is exact\nprint('RoIAlign of box (1.3,2.1)-(4.7,5.9) on a linear feature map:\\n', roi_align(f, (1.3, 2.1, 4.7, 5.9)))\nprint('expected 8y+x at the bin centres:', [[round(8 * (2.1 + (i + .5) * 1.9) + 1.3 + (j + .5) * 1.7, 2) for j in range(2)] for i in range(2)])", "out": "transposed conv 2x2 stride 2 doubles: 16 -> 32 ; 3x3 s2 p1 op1: 16 -> 32\nU-Net (valid convs) 572 input -> encoder sizes: [568, 280, 136, 64, 28] -> output 388\nmask IoU 0.667  Dice 0.800 (Dice = 2I/(|A|+|B|))\nRoIAlign of box (1.3,2.1)-(4.7,5.9) on a linear feature map:\n [[26.55 28.25]\n [41.75 43.45]]\nexpected 8y+x at the bin centres: [[26.55, 28.25], [41.75, 43.45]]"}, "p_contrast": {"lang": "py", "file": "p_contrast.py", "src": "import numpy as np\nr = np.random.default_rng(0)\ndef normalize(z): return z / np.linalg.norm(z, axis=1, keepdims=True)\ndef info_nce(za, zb, tau):\n    \"\"\"SimCLR/CLIP-style loss: row i of za should match row i of zb against all others in the batch.\"\"\"\n    S = normalize(za) @ normalize(zb).T / tau; S = S - S.max(1, keepdims=True)\n    logp = S - np.log(np.exp(S).sum(1, keepdims=True)); return -np.mean(np.diag(logp))\nbase = r.normal(size=(8, 32))\naligned = info_nce(base + 0.1 * r.normal(size=base.shape), base + 0.1 * r.normal(size=base.shape), 0.1)\nrand = info_nce(r.normal(size=(8, 32)), r.normal(size=(8, 32)), 0.1)\nprint('InfoNCE, batch 8: two views of the same items %.3f; unrelated %.3f; chance level ln(8) = %.3f' % (aligned, rand, np.log(8)))\n# CLIP zero-shot: classify by cosine similarity between an image embedding and text-prompt embeddings\nclasses = ['cat', 'dog', 'car']; T = normalize(r.normal(size=(3, 32)))         # pretend text encoder outputs for 'a photo of a {c}'\nimg = normalize((T[1] + 0.3 * r.normal(size=32))[None])                         # an image embedding near 'dog'\nlogits = 100 * img @ T.T; p = np.exp(logits - logits.max()); p /= p.sum()\nprint('zero-shot probabilities:', {c: round(float(v), 3) for c, v in zip(classes, p.ravel())})\nfor tau in (1.0, 0.1, 0.01): print(' temperature %.2f -> softmax over sims [0.9, 0.8, 0.1]:' % tau, np.round(np.exp(np.array([0.9, 0.8, 0.1]) / tau) / np.exp(np.array([0.9, 0.8, 0.1]) / tau).sum(), 3))", "out": "InfoNCE, batch 8: two views of the same items 0.001; unrelated 4.334; chance level ln(8) = 2.079\nzero-shot probabilities: {'cat': 0.0, 'dog': 1.0, 'car': 0.0}\n temperature 1.00 -> softmax over sims [0.9, 0.8, 0.1]: [0.425 0.384 0.191]\n temperature 0.10 -> softmax over sims [0.9, 0.8, 0.1]: [0.731 0.269 0.   ]\n temperature 0.01 -> softmax over sims [0.9, 0.8, 0.1]: [1. 0. 0.]"}, "p_diffusion": {"lang": "py", "file": "p_diffusion.py", "src": "import numpy as np\nr = np.random.default_rng(0)\nT = 200; betas = np.linspace(1e-4, 0.05, T); alphas = 1 - betas; abar = np.cumprod(alphas)\nx0 = np.r_[r.normal(-2, 0.3, 5000), r.normal(2, 0.3, 5000)]              # data: two clusters\nt = 120; eps = r.normal(size=x0.shape); xt = np.sqrt(abar[t]) * x0 + np.sqrt(1 - abar[t]) * eps     # closed-form q(x_t | x_0)\nprint('abar at t=0, 50, 120, 199: %s' % np.round(abar[[0, 50, 120, 199]], 4))\nprint('x_120: mean %.3f var %.3f (predicted var abar*4.09 + 1 - abar = %.3f)' % (xt.mean(), xt.var(), abar[t] * x0.var() + 1 - abar[t]))\ndef eps_hat(x, t):                                     # the ideal noise predictor for this mixture (a trained network approximates it)\n    m = np.sqrt(abar[t]) * np.array([-2, 2]); v = abar[t] * 0.09 + 1 - abar[t]\n    w = np.exp(-(x[:, None] - m) ** 2 / (2 * v)); w /= w.sum(1, keepdims=True)\n    score = (w * (m - x[:, None]) / v).sum(1); return -np.sqrt(1 - abar[t]) * score\nx = r.normal(size=4000)                                  # DDPM ancestral sampling from pure noise\nfor t in reversed(range(T)):\n    z = r.normal(size=x.shape) if t > 0 else 0\n    x = (x - betas[t] / np.sqrt(1 - abar[t]) * eps_hat(x, t)) / np.sqrt(alphas[t]) + np.sqrt(betas[t]) * z\nprint('generated samples: %.0f%% near -2, %.0f%% near +2, std within a cluster %.2f (data 0.30)' % (100 * (x < 0).mean(), 100 * (x > 0).mean(), x[x > 0].std()))", "out": "abar at t=0, 50, 120, 199: [0.9999 0.7217 0.157  0.0061]\nx_120: mean 0.004 var 1.464 (predicted var abar*4.09 + 1 - abar = 1.487)\ngenerated samples: 49% near -2, 51% near +2, std within a cluster 0.30 (data 0.30)"}, "p_gan": {"lang": "py", "file": "p_gan.py", "src": "import numpy as np\n# the optimal discriminator for data density p and generator density q is D*(x) = p / (p + q)\nx = np.linspace(-6, 6, 2001); dx = x[1] - x[0]\nN = lambda x, m, s: np.exp(-(x - m) ** 2 / (2 * s * s)) / (s * np.sqrt(2 * np.pi))\np = N(x, 1, 1)\nfor m in (3.0, 1.5, 1.0):\n    q = N(x, m, 1); D = p / (p + q)\n    V = np.sum(p * np.log(D) + q * np.log(1 - D)) * dx                      # GAN value function at D*\n    M = (p + q) / 2; js = 0.5 * np.sum(p * np.log(p / M)) * dx + 0.5 * np.sum(q * np.log(q / M)) * dx\n    print('generator mean %.1f: V(D*,G) = %.4f = -ln4 + 2 JS = %.4f' % (m, V, -np.log(4) + 2 * js))\nprint('at the optimum q = p: D* = 1/2 everywhere and V = -ln 4 = %.4f' % -np.log(4))\nd = 0.01; print('saturating loss log(1-D) gradient at D=%.2f: %.2f; non-saturating -log D gradient: %.1f' % (d, -1 / (1 - d), -1 / d))", "out": "generator mean 3.0: V(D*,G) = -0.7126 = -ln4 + 2 JS = -0.7136\ngenerator mean 1.5: V(D*,G) = -1.3257 = -ln4 + 2 JS = -1.3257\ngenerator mean 1.0: V(D*,G) = -1.3863 = -ln4 + 2 JS = -1.3863\nat the optimum q = p: D* = 1/2 everywhere and V = -ln 4 = -1.3863\nsaturating loss log(1-D) gradient at D=0.01: -1.01; non-saturating -log D gradient: -100.0"}, "q_nerf": {"lang": "py", "file": "q_nerf.py", "src": "import numpy as np\n# volume rendering along one ray: density sigma(t), colour c(t); C = sum_i T_i (1 - exp(-sigma_i delta_i)) c_i\nt = np.linspace(0, 4, 129); delta = np.diff(t); tm = t[:-1] + delta / 2\nsigma = np.where(np.abs(tm - 2.0) < 0.1, 50.0, 0.0)                    # an opaque thin wall at distance 2\ncolour = np.where(tm < 2.0, 0.2, 0.9)\nalpha = 1 - np.exp(-sigma * delta); T = np.cumprod(np.r_[1, 1 - alpha[:-1]]); w = T * alpha\nprint('weights sum (opacity) %.4f, expected depth %.3f, colour %.3f' % (w.sum(), (w * tm).sum(), (w * colour).sum()))\ndef posenc(x, L=4): return np.concatenate([x] + [f(2 ** k * np.pi * x) for k in range(L) for f in (np.sin, np.cos)])\nprint('positional encoding of x=0.25 with L=4 (%d numbers):' % len(posenc(np.array([0.25]))), np.round(posenc(np.array([0.25])), 3) + 0.0)\nprint('a NeRF MLP for one scene ~ 0.6M weights; one 800x800 image = 640000 rays x 192 samples = %.2e MLP queries' % (640000 * 192))", "out": "weights sum (opacity) 0.9999, expected depth 1.930, colour 0.206\npositional encoding of x=0.25 with L=4 (9 numbers): [ 0.25   0.707  0.707  1.     0.     0.    -1.     0.     1.   ]\na NeRF MLP for one scene ~ 0.6M weights; one 800x800 image = 640000 rays x 192 samples = 1.23e+08 MLP queries"}, "q_pcloud": {"lang": "py", "file": "q_pcloud.py", "src": "import numpy as np, cv2\nr = np.random.default_rng(0)\nfx = fy = 200.0; cx, cy = 64, 48\ndepth = np.full((96, 128), 3.0); depth[30:70, 40:90] = 1.5          # a box 1.5 m away in front of a wall at 3 m\nv, u = np.mgrid[0:96, 0:128]\nP = np.dstack([(u - cx) * depth / fx, (v - cy) * depth / fy, depth]).reshape(-1, 3)    # back-projection X = Z (u - cx) / fx\nprint('point cloud', P.shape, ' box corner pixel (40,30) ->', np.round(P[30 * 128 + 40], 3))\ndef icp(src, dst, iters=20):\n    R, t = np.eye(3), np.zeros(3)\n    for _ in range(iters):\n        cur = src @ R.T + t\n        d2 = ((cur[:, None] - dst[None]) ** 2).sum(2); nn = dst[d2.argmin(1)]            # closest points\n        mc, mn = cur.mean(0), nn.mean(0); U, S, Vt = np.linalg.svd((cur - mc).T @ (nn - mn))\n        Ri = Vt.T @ np.diag([1, 1, np.linalg.det(Vt.T @ U.T)]) @ U.T; R = Ri @ R; t = Ri @ (t - mc) + mn   # Kabsch\n    return R, t\nobj = r.uniform(-0.5, 0.5, (300, 3)) * [1, 0.6, 0.3]\nRt, _ = cv2.Rodrigues(np.array([0.1, -0.15, 0.05])); tt = np.array([0.1, 0.05, -0.08])\nscan = obj @ Rt.T + tt + r.normal(0, 0.002, obj.shape)\nR, t = icp(obj, scan); print('ICP rotation error %.4f rad, translation error %.4f m' % (np.linalg.norm(cv2.Rodrigues(R @ Rt.T)[0]), np.linalg.norm(t - tt)))\nnb = obj[np.argsort(((obj - obj[0]) ** 2).sum(1))[:20]]; w, V = np.linalg.eigh(np.cov((nb - nb.mean(0)).T))\nprint('normal at point 0 from PCA of 20 neighbours (smallest eigenvector):', np.round(V[:, 0] * np.sign(V[2, 0]), 2))", "out": "point cloud (12288, 3)  box corner pixel (40,30) -> [-0.18  -0.135  1.5  ]\nICP rotation error 0.0006 rad, translation error 0.0004 m\nnormal at point 0 from PCA of 20 neighbours (smallest eigenvector): [0.11 0.27 0.96]"}, "r_bias": {"lang": "py", "file": "r_bias.py", "src": "import numpy as np\nr = np.random.default_rng(1)\n# a face-attribute classifier evaluated on two groups; group B was under-represented in training (scores noisier)\nn = {'A': 2000, 'B': 200}; out = {}\nfor g, sd in (('A', 0.12), ('B', 0.25)):\n    y = r.random(n[g]) < 0.5; s = np.where(y, r.normal(0.68, sd, n[g]), r.normal(0.32, sd, n[g])); p = s > 0.5\n    out[g] = dict(acc=(p == y).mean(), tpr=(p & y).sum() / y.sum(), fpr=(p & ~y).sum() / (~y).sum(), n=n[g])\nallacc = (out['A']['acc'] * 2000 + out['B']['acc'] * 200) / 2200\nprint('overall accuracy %.3f hides the gap:' % allacc)\nfor g, m in out.items(): print(' group %s (n=%d): accuracy %.3f TPR %.3f FPR %.3f' % (g, m['n'], m['acc'], m['tpr'], m['fpr']))\nprint('equalised-odds gaps: TPR %.3f, FPR %.3f' % (abs(out['A']['tpr'] - out['B']['tpr']), abs(out['A']['fpr'] - out['B']['fpr'])))\nse = np.sqrt(out['B']['acc'] * (1 - out['B']['acc']) / 200); print('group B accuracy standard error +-%.3f: small groups need enough test data too' % se)", "out": "overall accuracy 0.916 hides the gap:\n group A (n=2000): accuracy 0.929 TPR 0.932 FPR 0.073\n group B (n=200): accuracy 0.780 TPR 0.769 FPR 0.211\nequalised-odds gaps: TPR 0.163, FPR 0.138\ngroup B accuracy standard error +-0.029: small groups need enough test data too"}, "r_eval": {"lang": "py", "file": "r_eval.py", "src": "import numpy as np\nr = np.random.default_rng(0)\ny = r.random(1000) < 0.1                                               # 10% positives (e.g. defects)\ns = np.clip(np.where(y, r.normal(0.7, 0.15, 1000), r.normal(0.35, 0.15, 1000)), 0, 1)   # classifier scores\npred = s > 0.5; tp = (pred & y).sum(); fp = (pred & ~y).sum(); fn = (~pred & y).sum(); tn = (~pred & ~y).sum()\nP, R = tp / (tp + fp), tp / (tp + fn); print('confusion TP %d FP %d FN %d TN %d' % (tp, fp, fn, tn))\nprint('accuracy %.3f precision %.3f recall %.3f F1 %.3f' % ((tp + tn) / 1000, P, R, 2 * P * R / (P + R)))\nprint('always-negative baseline accuracy %.3f (accuracy misleads on imbalanced data)' % (1 - y.mean()))\no = np.argsort(-s); tpr = np.r_[0, np.cumsum(y[o]) / y.sum()]; fpr = np.r_[0, np.cumsum(~y[o]) / (~y).sum()]\nauc = np.trapezoid(tpr, fpr); rank_auc = np.mean(s[y][:, None] > s[~y][None, :]); print('ROC AUC %.4f (= P(score_pos > score_neg) %.4f)' % (auc, rank_auc))\nacc = (pred == y); boots = [acc[r.integers(0, 1000, 1000)].mean() for _ in range(2000)]\nprint('accuracy 95%% bootstrap interval [%.3f, %.3f]' % tuple(np.percentile(boots, [2.5, 97.5])))\nconf = np.where(pred, s, 1 - s); bins = np.linspace(0.5, 1, 6); ece = 0\nfor a, b in zip(bins[:-1], bins[1:]):\n    m = (conf >= a) & (conf < b) if b < 1 else (conf >= a)\n    if m.any(): ece += m.mean() * abs(acc[m].mean() - conf[m].mean())\nprint('expected calibration error %.3f' % ece)", "out": "confusion TP 82 FP 138 FN 7 TN 773\naccuracy 0.855 precision 0.373 recall 0.921 F1 0.531\nalways-negative baseline accuracy 0.911 (accuracy misleads on imbalanced data)\nROC AUC 0.9585 (= P(score_pos > score_neg) 0.9585)\naccuracy 95% bootstrap interval [0.833, 0.876]\nexpected calibration error 0.170"}, "s_blur": {"lang": "c", "file": "s_blur.c", "src": "/* 3x3 Gaussian [1 2 1]^T [1 2 1] / 16 on uint8, integer only, separable, with rounding. */\n#include <stdio.h>\n#include <stdint.h>\n#include <stdlib.h>\n#include <math.h>\n#define W 64\n#define H 48\nstatic uint8_t img[H][W], out[H][W];\nstatic uint16_t tmp[H][W];                       /* row pass result: at most 4*255 = 1020, fits 16 bits */\nstatic int clampi(int v, int lo, int hi) { return v < lo ? lo : v > hi ? hi : v; }\nint main(void) {\n    for (int y = 0; y < H; y++) for (int x = 0; x < W; x++)        /* synthetic image: a bright square plus a pattern */\n        img[y][x] = (uint8_t)(((x > 20 && x < 44 && y > 12 && y < 36) ? 200 : 40) + ((x * 7 + y * 13) % 23));\n    for (int y = 0; y < H; y++) for (int x = 0; x < W; x++)        /* horizontal [1 2 1], replicate border */\n        tmp[y][x] = img[y][clampi(x - 1, 0, W - 1)] + 2 * img[y][x] + img[y][clampi(x + 1, 0, W - 1)];\n    for (int y = 0; y < H; y++) for (int x = 0; x < W; x++) {      /* vertical [1 2 1], then (sum + 8) >> 4 */\n        unsigned s = tmp[clampi(y - 1, 0, H - 1)][x] + 2u * tmp[y][x] + tmp[clampi(y + 1, 0, H - 1)][x];\n        out[y][x] = (uint8_t)((s + 8) >> 4);\n    }\n    int maxd = 0; long sum = 0;                                    /* float reference */\n    for (int y = 0; y < H; y++) for (int x = 0; x < W; x++) {\n        double acc = 0; static const double k[3] = {0.25, 0.5, 0.25};\n        for (int i = -1; i <= 1; i++) for (int j = -1; j <= 1; j++)\n            acc += k[i + 1] * k[j + 1] * img[clampi(y + i, 0, H - 1)][clampi(x + j, 0, W - 1)];\n        int d = abs((int)lround(acc) - out[y][x]); if (d > maxd) maxd = d; sum += out[y][x];\n    }\n    printf(\"integer blur: max difference from float reference %d, mean %.2f\\n\", maxd, sum / (double)(W * H));\n    printf(\"pixel (24,20): in %u -> out %u\\n\", img[24][20], out[24][20]);\n    return 0;\n}", "out": "integer blur: max difference from float reference 0, mean 78.55\npixel (24,20): in 55 -> out 92"}, "s_gemm": {"lang": "c", "file": "s_gemm.c", "src": "/* int8 x uint8 matrix-vector product with int32 accumulation and fixed-point requantisation (gemmlowp / TFLite style). */\n#include <stdio.h>\n#include <stdint.h>\n#include <math.h>\n#define N 16\n#define K 27\nstatic int32_t rdiv_pow2(int64_t v, int s) { return (int32_t)((v + ((int64_t)1 << (s - 1))) >> s); }\nint main(void) {\n    int8_t w[N][K]; uint8_t x[K]; uint32_t seed = 7; double wf[N][K], xf[K];\n    const double sw = 0.004, sx = 0.02, sy = 0.05; const int zx = 10, zy = 128;      /* scales and zero points */\n    for (int i = 0; i < N; i++) for (int k = 0; k < K; k++) { seed = seed * 1103515245u + 12345u; w[i][k] = (int8_t)((seed >> 16) % 255 - 127); wf[i][k] = w[i][k] * sw; }\n    for (int k = 0; k < K; k++) { seed = seed * 1103515245u + 12345u; x[k] = (uint8_t)((seed >> 16) % 200 + 10); xf[k] = (x[k] - zx) * sx; }\n    double M = sw * sx / sy; int shift = 0; while (M < 0.5) { M *= 2; shift++; }       /* M = M0 * 2^-(31+shift) */\n    int32_t M0 = (int32_t)lround(M * 2147483648.0);\n    int maxerr = 0;\n    for (int i = 0; i < N; i++) {\n        int32_t acc = 0;\n        for (int k = 0; k < K; k++) acc += (int32_t)w[i][k] * ((int32_t)x[k] - zx);\n        int32_t q = rdiv_pow2((int64_t)acc * M0, 31 + shift) + zy;                     /* requantise, add output zero point */\n        q = q < 0 ? 0 : q > 255 ? 255 : q;\n        double ref = 0; for (int k = 0; k < K; k++) ref += wf[i][k] * xf[k];\n        int rq = (int)lround(ref / sy) + zy; rq = rq < 0 ? 0 : rq > 255 ? 255 : rq;\n        int e = q > rq ? q - rq : rq - q; if (e > maxerr) maxerr = e;\n        if (i < 3) printf(\"row %d: acc %6d -> q %3d (float ref %.3f -> %d)\\n\", i, acc, q, ref, rq);\n    }\n    printf(\"M0 = %d, shift = %d; max error vs float %d LSB over %d outputs\\n\", M0, shift, maxerr, N);\n    return 0;\n}", "out": "row 0: acc  71313 -> q 242 (float ref 5.705 -> 242)\nrow 1: acc  87258 -> q 255 (float ref 6.981 -> 255)\nrow 2: acc  35604 -> q 185 (float ref 2.848 -> 185)\nM0 = 1759218604, shift = 9; max error vs float 0 LSB over 16 outputs"}, "s_integral": {"lang": "c", "file": "s_integral.c", "src": "/* Integral image (summed-area table) and O(1) box sums, checked against brute force. */\n#include <stdio.h>\n#include <stdint.h>\n#define W 80\n#define H 60\nstatic uint8_t img[H][W];\nstatic uint32_t S[H + 1][W + 1];                 /* S[y][x] = sum of img[0..y-1][0..x-1]; 255*80*60 fits easily */\nstatic uint32_t box(int x0, int y0, int x1, int y1) { return S[y1][x1] - S[y0][x1] - S[y1][x0] + S[y0][x0]; }   /* [x0,x1) x [y0,y1) */\nint main(void) {\n    uint32_t seed = 1;\n    for (int y = 0; y < H; y++) for (int x = 0; x < W; x++) { seed = seed * 1664525u + 1013904223u; img[y][x] = seed >> 24; }\n    for (int y = 0; y < H; y++) {\n        uint32_t row = 0;\n        for (int x = 0; x < W; x++) { row += img[y][x]; S[y + 1][x + 1] = S[y][x + 1] + row; }\n    }\n    int bad = 0, tests = 0;\n    for (int y0 = 0; y0 < H; y0 += 7) for (int x0 = 0; x0 < W; x0 += 9) for (int s = 1; s < 20; s += 6) {\n        int x1 = x0 + s > W ? W : x0 + s, y1 = y0 + s > H ? H : y0 + s; uint32_t ref = 0;\n        for (int y = y0; y < y1; y++) for (int x = x0; x < x1; x++) ref += img[y][x];\n        bad += ref != box(x0, y0, x1, y1); tests++;\n    }\n    printf(\"box sums checked: %d, wrong: %d; total sum %u\\n\", tests, bad, S[H][W]);\n    printf(\"box (10,10)-(21,21) mean %.2f\\n\", box(10, 10, 21, 21) / 121.0);\n    return 0;\n}", "out": "box sums checked: 324, wrong: 0; total sum 608515\nbox (10,10)-(21,21) mean 118.91"}, "s_neon": {"lang": "c", "file": "s_neon.c", "src": "/* ARMv7 NEON: horizontal [1 2 1]/4 blur on 16 uint8 pixels at a time, checked against scalar C. Built for Cortex-A7, run in qemu-arm. */\n#include <stdio.h>\n#include <stdint.h>\n#include <arm_neon.h>\n#define N 1024\nstatic uint8_t in[N + 2], ref[N], out[N];\nint main(void) {\n    uint32_t s = 5; for (int i = 0; i < N + 2; i++) { s = s * 1664525u + 1013904223u; in[i] = s >> 24; }\n    for (int i = 0; i < N; i++) ref[i] = (uint8_t)((in[i] + 2 * in[i + 1] + in[i + 2] + 2) >> 2);\n    for (int i = 0; i < N; i += 16) {\n        uint8x16_t a = vld1q_u8(in + i), b = vld1q_u8(in + i + 1), c = vld1q_u8(in + i + 2);\n        uint16x8_t lo = vaddl_u8(vget_low_u8(a), vget_low_u8(c)), hi = vaddl_u8(vget_high_u8(a), vget_high_u8(c));   /* widen to 16 bits */\n        lo = vmlal_u8(lo, vget_low_u8(b), vdup_n_u8(2)); hi = vmlal_u8(hi, vget_high_u8(b), vdup_n_u8(2));          /* + 2*b */\n        vst1q_u8(out + i, vcombine_u8(vrshrn_n_u16(lo, 2), vrshrn_n_u16(hi, 2)));                                    /* rounding shift, narrow */\n    }\n    int bad = 0; for (int i = 0; i < N; i++) bad += out[i] != ref[i];\n    printf(\"NEON 16-lane blur vs scalar: %d of %d pixels differ\\n\", bad, N);\n    printf(\"first outputs: %u %u %u %u\\n\", out[0], out[1], out[2], out[3]);\n    return 0;\n}", "out": "NEON 16-lane blur vs scalar: 0 of 1024 pixels differ\nfirst outputs: 124 132 170 169"}, "s_otsu": {"lang": "c", "file": "s_otsu.c", "src": "/* Otsu's threshold in C from a 256-bin histogram, using integer sums and double variance. */\n#include <stdio.h>\n#include <stdint.h>\nint main(void) {\n    static uint32_t hist[256]; uint32_t seed = 3; int n = 0;\n    for (int i = 0; i < 20000; i++) {                        /* bimodal data: dark mode near 60, bright mode near 170 */\n        seed = seed * 1664525u + 1013904223u; int a = (seed >> 24) % 41;\n        seed = seed * 1664525u + 1013904223u; int b = (seed >> 24) % 41;\n        int v = (i % 3 ? 40 : 150) + a / 2 + b / 2; hist[v]++; n++;\n    }\n    double sumAll = 0; for (int t = 0; t < 256; t++) sumAll += (double)t * hist[t];\n    double w0 = 0, sum0 = 0, best = -1; int bt = 0;\n    for (int t = 0; t < 256; t++) {\n        w0 += hist[t]; sum0 += (double)t * hist[t]; double w1 = n - w0; if (w0 == 0 || w1 == 0) continue;\n        double m0 = sum0 / w0, m1 = (sumAll - sum0) / w1, sb = w0 * w1 * (m0 - m1) * (m0 - m1);   /* n^2 * between-class variance */\n        if (sb > best) { best = sb; bt = t; }\n    }\n    printf(\"Otsu threshold %d: every t from 80 to 149 splits the empty gap identically; the first maximum wins\\n\", bt);\n    printf(\"between-class variance at the optimum: %.1f\\n\", best / ((double)n * n));\n    return 0;\n}", "out": "Otsu threshold 80: every t from 80 to 149 splits the empty gap identically; the first maximum wins\nbetween-class variance at the optimum: 2696.1"}, "s_quant": {"lang": "py", "file": "s_quant.py", "src": "import numpy as np\nr = np.random.default_rng(0)\nW = r.normal(0, 0.2, (16, 27)); W[3] *= 8                         # one output channel with much larger weights\nx = r.uniform(0, 1, (27, 100))                                    # post-ReLU activations (non-negative)\ndef q_affine(a, bits=8, signed=True):\n    qmin, qmax = (-(2 ** (bits - 1)), 2 ** (bits - 1) - 1) if signed else (0, 2 ** bits - 1)\n    s = (a.max() - a.min()) / (qmax - qmin); z = int(round(qmin - a.min() / s)); return s, z, np.clip(np.round(a / s) + z, qmin, qmax).astype(np.int32)\ndef q_sym(a, axis=None):                                          # symmetric int8, per tensor or per output channel\n    m = np.abs(a).max(axis=axis, keepdims=axis is not None); s = m / 127; return s, np.clip(np.round(a / s), -127, 127).astype(np.int32)\nsx, zx, qx = q_affine(x, signed=False)                            # uint8 activations with zero point\nfor name, axis in (('per-tensor', None), ('per-channel', 1)):\n    sw, qw = q_sym(W, axis)\n    acc = qw @ (qx - zx)                                          # int32 accumulate: sum of int8 * (uint8 - zero_point)\n    y = acc * (sw * sx); ref = W @ x\n    rel = lambda c: np.abs(y[c] - ref[c]).max() / np.abs(ref[c]).max()\n    print('%-11s int8 weights: relative error, big channel 3: %.4f  ordinary channel 0: %.4f' % (name, rel(3), rel(0)))\nM = 0.0072; shift = 0\nwhile M < 0.5: M *= 2; shift += 1\nM0 = int(round(M * 2 ** 31)); print('requantise multiplier 0.0072 = M0 * 2^-(31+%d) with M0 = %d (Q31)' % (shift, M0))\na32 = 12345; print('int32 accumulator %d * 0.0072 = %.3f; fixed-point: %d' % (a32, a32 * 0.0072, (a32 * M0 + (1 << (30 + shift))) >> (31 + shift)))\nprint('model size float32 vs int8 for 3.5M parameters: %.1f MB vs %.1f MB' % (3.5e6 * 4 / 2 ** 20, 3.5e6 / 2 ** 20))", "out": "per-tensor  int8 weights: relative error, big channel 3: 0.0050  ordinary channel 0: 0.0397\nper-channel int8 weights: relative error, big channel 3: 0.0050  ordinary channel 0: 0.0050\nrequantise multiplier 0.0072 = M0 * 2^-(31+7) with M0 = 1979120930 (Q31)\nint32 accumulator 12345 * 0.0072 = 88.884; fixed-point: 89\nmodel size float32 vs int8 for 3.5M
