parameters: 13.4 MB vs 3.3 MB"}, "s_resize": {"lang": "c", "file": "s_resize.c", "src": "/* Bilinear downscale in Q8 fixed point vs double reference. */\n#include <stdio.h>\n#include <stdint.h>\n#include <math.h>\n#include <stdlib.h>\n#define SW 97\n#define SH 61\n#define DW 40\n#define DH 25\nstatic uint8_t src[SH][SW], dst[DH][DW];\nint main(void) {\n    for (int y = 0; y < SH; y++) for (int x = 0; x < SW; x++) src[y][x] = (uint8_t)((x * 255) / (SW - 1) ^ ((y & 8) ? 0x30 : 0));\n    int maxd = 0;\n    for (int y = 0; y < DH; y++) for (int x = 0; x < DW; x++) {\n        double fx = (x + 0.5) * SW / (double)DW - 0.5, fy = (y + 0.5) * SH / (double)DH - 0.5;   /* pixel-centre alignment */\n        fx = fx < 0 ? 0 : fx; fy = fy < 0 ? 0 : fy;\n        int x0 = (int)fx, y0 = (int)fy, x1 = x0 + 1 < SW ? x0 + 1 : x0, y1 = y0 + 1 < SH ? y0 + 1 : y0;\n        int ax = (int)lround((fx - x0) * 256), ay = (int)lround((fy - y0) * 256);                /* Q8 weights */\n        int top = src[y0][x0] * (256 - ax) + src[y0][x1] * ax, bot = src[y1][x0] * (256 - ax) + src[y1][x1] * ax;\n        dst[y][x] = (uint8_t)((top * (256 - ay) + bot * ay + (1 << 15)) >> 16);\n        double ref = (src[y0][x0] * (1 - (fx - x0)) + src[y0][x1] * (fx - x0)) * (1 - (fy - y0)) + (src[y1][x0] * (1 - (fx - x0)) + src[y1][x1] * (fx - x0)) * (fy - y0);\n        int d = abs((int)lround(ref) - dst[y][x]); if (d > maxd) maxd = d;\n    }\n    printf(\"Q8 bilinear %dx%d -> %dx%d: max difference from double %d\\n\", SW, SH, DW, DH, maxd);\n    return 0;\n}", "out": "Q8 bilinear 97x61 -> 40x25: max difference from double 1"}, "s_sobel": {"lang": "c", "file": "s_sobel.c", "src": "/* Sobel magnitude (L1) and a threshold in C, int16 arithmetic: |gx| + |gy| <= 4*255*2 = 2040. */\n#include <stdio.h>\n#include <stdint.h>\n#include <stdlib.h>\n#define W 64\n#define H 48\nstatic uint8_t img[H][W], edge[H][W];\nint main(void) {\n    for (int y = 0; y < H; y++) for (int x = 0; x < W; x++) {\n        int dx = x - 32, dy = y - 24; img[y][x] = (dx * dx + dy * dy < 15 * 15) ? 220 : 30;   /* a disc */\n    }\n    int count = 0, maxmag = 0;\n    for (int y = 1; y < H - 1; y++) for (int x = 1; x < W - 1; x++) {\n        const uint8_t *a = img[y - 1] + x, *b = img[y] + x, *c = img[y + 1] + x;\n        int gx = (a[1] + 2 * b[1] + c[1]) - (a[-1] + 2 * b[-1] + c[-1]);\n        int gy = (c[-1] + 2 * c[0] + c[1]) - (a[-1] + 2 * a[0] + a[1]);\n        int m = abs(gx) + abs(gy); if (m > maxmag) maxmag = m;\n        edge[y][x] = m > 300 ? 255 : 0; count += edge[y][x] != 0;\n    }\n    printf(\"max |gx|+|gy| = %d (a 190 step gives up to 4*190 = 760 per axis)\\n\", maxmag);\n    printf(\"edge pixels above 300: %d (disc circumference 2*pi*15 = %.0f, edges are ~2 px thick)\\n\", count, 2 * 3.14159265 * 15);\n    for (int x = 14; x < 22; x++) putchar(edge[24][x] ? '#' : '.');\n    printf(\"  <- row 24, x = 14..21\\n\");\n    return 0;\n}", "out": "max |gx|+|gy| = 1140 (a 190 step gives up to 4*190 = 760 per axis)\nedge pixels above 300: 232 (disc circumference 2*pi*15 = 94, edges are ~2 px thick)\n...##...  <- row 24, x = 14..21"}, "t_deploy": {"lang": "py", "file": "t_deploy.py", "src": "import numpy as np\nfrom tinycnn import Conv, ReLU, MaxPool, Flatten, Linear, Net, softmax_ce, SGD\nfrom cvk import digits\nX, y = digits(0, 800, noise=0.35, jitter=3); Xv, yv = digits(1, 400, noise=0.35, jitter=3); X, Xv = X[:, None], Xv[:, None]\nnet = Net([Conv(1, 8, 3, pad=1), ReLU(), MaxPool(2), Flatten(), Linear(8 * 6 * 6, 4)]); opt = SGD(net, lr=0.05)\nr = np.random.default_rng(0)\nfor ep in range(6):\n    for i in range(0, 800, 32):\n        idx = r.permutation(800)[:32]; loss, g, _ = softmax_ce(net.forward(X[idx]), y[idx]); net.backward(g); opt.step()\nfacc = (net.forward(Xv).argmax(1) == yv).mean(); print('float32 model: val accuracy %.3f' % facc)\nconv, fc = net.layers[0], net.layers[4]\n# integer-only inference, exactly what the C/NEON version computes\nqin = np.clip(np.round(Xv * 255), 0, 255).astype(np.int32); s_in = 1 / 255                     # uint8 input, zero point 0\nsw = np.abs(conv.W).reshape(8, -1).max(1) / 127; qw = np.round(conv.W / sw[:, None, None, None]).astype(np.int32)   # per-channel int8\nqb = np.round(conv.b / (sw * s_in)).astype(np.int32)                                            # bias in int32 at scale sw*s_in\nc = Conv(1, 8, 3, pad=1); c.W = qw.astype(np.float64); c.b = qb.astype(np.float64)\nacc = np.round(c.forward(qin.astype(np.float64))).astype(np.int64)                              # exact int32 accumulators\na_max = (np.maximum(acc, 0) * (sw * s_in)[None, :, None, None]).max(); s_a = a_max / 255        # calibrated activation scale\nM = (sw * s_in) / s_a; qa = np.clip(np.round(np.maximum(acc, 0) * M[None, :, None, None]), 0, 255).astype(np.int32)   # ReLU + requantise to uint8\npooled = qa.reshape(len(qa), 8, 6, 2, 6, 2).max(axis=(3, 5)).reshape(len(qa), -1)               # max-pool commutes with monotone quantisation\nsf = np.abs(fc.W).max() / 127; qf = np.round(fc.W / sf).astype(np.int64); qfb = np.round(fc.b / (sf * s_a)).astype(np.int64)\nlogits = pooled @ qf + qfb                                   # int32 logits; argmax needs no rescale\niacc = (logits.argmax(1) == yv).mean(); print('int8 integer-only model: val accuracy %.3f (difference %.3f)' % (iacc, iacc - facc))\nagree = (logits.argmax(1) == net.forward(Xv).argmax(1)).mean(); print('predictions agree with float on %.1f%% of images' % (100 * agree))\nnbytes = qw.size + 4 * qb.size + qf.size + 4 * qfb.size; print('weights: float %d bytes -> int8 %d bytes' % (4 * (conv.W.size + conv.b.size + fc.W.size + fc.b.size), nbytes))\nprint('MACs per image: conv %d + fc %d' % (12 * 12 * 8 * 9, 288 * 4))", "out": "float32 model: val accuracy 1.000\nint8 integer-only model: val accuracy 1.000 (difference 0.000)\npredictions agree with float on 100.0% of images\nweights: float 4944 bytes -> int8 1272 bytes\nMACs per image: conv 10368 + fc 1152"}, "t_docscan": {"lang": "py", "file": "t_docscan.py", "src": "import numpy as np, cv2\n# 1. make a synthetic photo: a white page with 'text' lines, perspective-warped onto a darker desk, unevenly lit\npage = np.full((280, 200), 235, np.uint8)\nfor i, y in enumerate(range(30, 260, 18)): cv2.line(page, (20, y), (180 - (i * 23) % 60, y), 30, 3)\ntrue_c = np.float32([[60, 40], [270, 70], [250, 330], [40, 300]])\nHp = cv2.getPerspectiveTransform(np.float32([[0, 0], [199, 0], [199, 279], [0, 279]]), true_c)\ndesk = np.full((380, 320), 90, np.uint8); photo = cv2.warpPerspective(page, Hp, (320, 380), dst=desk, borderMode=cv2.BORDER_TRANSPARENT)\nxx = np.arange(320)[None, :]; photo = np.clip(photo * (0.7 + 0.3 * xx / 319), 0, 255).astype(np.uint8)\nphoto = cv2.add(photo, np.random.default_rng(0).integers(0, 12, photo.shape, dtype=np.uint8))\n# 2. find the page: blur -> Canny -> close gaps -> largest contour -> 4-gon\ne = cv2.morphologyEx(cv2.Canny(cv2.GaussianBlur(photo, (5, 5), 0), 50, 150), cv2.MORPH_CLOSE, np.ones((5, 5), np.uint8))\ncs, _ = cv2.findContours(e, cv2.RETR_EXTERNAL, cv2.CHAIN_APPROX_SIMPLE); c = max(cs, key=cv2.contourArea)\nquad = cv2.approxPolyDP(c, 0.02 * cv2.arcLength(c, True), True).reshape(-1, 2).astype(np.float32)\nprint('contour vertices after approxPolyDP:', len(quad))\ns = quad.sum(1); d = np.diff(quad, axis=1).ravel()                   # order: TL has min x+y, BR max x+y, TR min y-x, BL max y-x\nordered = np.float32([quad[s.argmin()], quad[d.argmin()], quad[s.argmax()], quad[d.argmax()]])\nprint('corner error vs truth (px):', np.round(np.linalg.norm(ordered - true_c, axis=1), 1))\n# 3. rectify and binarise\nHr = cv2.getPerspectiveTransform(ordered, np.float32([[0, 0], [199, 0], [199, 279], [0, 279]]))\nflat = cv2.warpPerspective(photo, Hr, (200, 280))\nbw = cv2.adaptiveThreshold(flat, 255, cv2.ADAPTIVE_THRESH_GAUSSIAN_C, cv2.THRESH_BINARY, 25, 15)\ntruth = page > 128; inner = (slice(8, -8), slice(8, -8))\nprint('binarised page agrees with the original on %.1f%% of interior pixels' % (100 * ((bw > 128) == truth)[inner].mean()))", "out": "contour vertices after approxPolyDP: 4\ncorner error vs truth (px): [0. 0. 1. 1.]\nbinarised page agrees with the original on 99.6% of interior pixels"}, "cvk": {"lang": "py", "file": "cvk.py", "src": "\"\"\"cvk.py: the course's tiny helper module. Synthetic test images so every example is reproducible.\"\"\"\nimport numpy as np\nnp.set_printoptions(precision=3, suppress=True, linewidth=100)\n\ndef shapes(h=128, w=128):\n    \"\"\"Grey test scene: dark background, bright rectangle, mid-grey disc, white triangle, horizontal ramp strip.\"\"\"\n    img = np.full((h, w), 40, np.uint8)\n    img[20:60, 15:55] = 200                                   # rectangle\n    yy, xx = np.mgrid[0:h, 0:w]\n    img[(yy - 85) ** 2 + (xx - 40) ** 2 <= 22 ** 2] = 130     # disc\n    tri = (yy >= 20) & (yy <= 70) & (xx >= 70) & (xx - 70 <= (yy - 20) * 50 // 50) & (xx <= 120)\n    img[tri & (xx - 70 <= yy - 20)] = 240                     # right triangle\n    img[100:120, 70:122] = np.linspace(0, 255, 52).astype(np.uint8)[None, :]  # ramp\n    return img\n\ndef scene_rgb(h=96, w=128):\n    \"\"\"Colour scene (RGB order): sky gradient, green ground, red square, yellow disc.\"\"\"\n    img = np.zeros((h, w, 3), np.uint8)\n    for y in range(h):\n        img[y, :] = (90 + y, 140 + y // 2, 230) if y < h // 2 else (60, 150, 60)\n    img[50:80, 20:50] = (210, 30, 30)\n    yy, xx = np.mgrid[0:h, 0:w]\n    img[(yy - 25) ** 2 + (xx - 95) ** 2 <= 12 ** 2] = (250, 220, 40)\n    return img\n\ndef checker(n=8, s=8):\n    \"\"\"n x n checkerboard of s-pixel squares, values 0 and 255.\"\"\"\n    b = (np.indices((n, n)).sum(0) % 2).astype(np.uint8) * 255\n    return np.kron(b, np.ones((s, s), np.uint8))\n\ndef noisy(img, sigma=10, seed=0):\n    r = np.random.default_rng(seed)\n    return np.clip(img.astype(np.float64) + r.normal(0, sigma, img.shape), 0, 255).astype(np.uint8)\n\ndef salt_pepper(img, p=0.05, seed=0):\n    r = np.random.default_rng(seed); out = img.copy(); m = r.random(img.shape)\n    out[m < p / 2] = 0; out[m > 1 - p / 2] = 255\n    return out\n\ndef psnr(a, b):\n    mse = np.mean((a.astype(np.float64) - b.astype(np.float64)) ** 2)\n    return float('inf') if mse == 0 else 10 * np.log10(255 ** 2 / mse)\n\ndef digits(seed=0, n=200, size=12, noise=0.1, jitter=2):\n    \"\"\"Synthetic 'shape digits': class 0 = horizontal bar, 1 = vertical bar, 2 = square ring, 3 = diagonal.\n    Random position jitter and noise. Returns X (n, size, size) float in [0,1], y (n,).\"\"\"\n    r = np.random.default_rng(seed); X = np.zeros((n, size, size)); y = r.integers(0, 4, n)\n    for i in range(n):\n        im = np.zeros((size, size)); dy, dx = r.integers(-jitter, jitter + 1, 2); c = size // 2\n        if y[i] == 0: im[c - 1 + dy:c + 1 + dy, 2:size - 2] = 1\n        elif y[i] == 1: im[2:size - 2, c - 1 + dx:c + 1 + dx] = 1\n        elif y[i] == 2:\n            im[3 + dy:size - 3 + dy, 3 + dx:size - 3 + dx] = 1; im[5 + dy:size - 5 + dy, 5 + dx:size - 5 + dx] = 0\n        else:\n            for k in range(2, size - 2): im[k, np.clip(k + dx, 0, size - 1)] = 1\n        X[i] = np.clip(im + r.normal(0, noise, im.shape), 0, 1)\n    return X, y\n\ndef texture(h=240, w=320, seed=3, n=60):\n    \"\"\"A feature-rich synthetic scene: random filled rectangles, circles and lines on a smooth background.\"\"\"\n    import cv2\n    r = np.random.default_rng(seed); img = np.zeros((h, w), np.uint8)\n    img[:] = (np.linspace(60, 120, w)[None, :]).astype(np.uint8)\n    for _ in range(n):\n        c = int(r.integers(0, 256)); x, y = int(r.integers(0, w)), int(r.integers(0, h)); s = int(r.integers(5, 30))\n        k = r.integers(0, 3)\n        if k == 0: cv2.rectangle(img, (x, y), (x + s, y + int(r.integers(5, 30))), c, -1)\n        elif k == 1: cv2.circle(img, (x, y), s // 2, c, -1)\n        else: cv2.line(img, (x, y), (int(r.integers(0, w)), int(r.integers(0, h))), c, 2)\n    return img", "out": ""}, "tinycnn": {"lang": "py", "file": "tinycnn.py", "src": "\"\"\"tinycnn.py: a CNN library from scratch in NumPy. Every layer has forward() and backward(); shapes are (N, C, H, W).\"\"\"\nimport numpy as np\n\ndef im2col(x, k, stride=1, pad=0):\n    \"\"\"(N,C,H,W) -> (N*OH*OW, C*k*k): each row is one receptive field, so convolution becomes one matrix multiply.\"\"\"\n    N, C, H, W = x.shape; xp = np.pad(x, ((0, 0), (0, 0), (pad, pad), (pad, pad)))\n    OH = (H + 2 * pad - k) // stride + 1; OW = (W + 2 * pad - k) // stride + 1\n    cols = np.empty((N, C, k, k, OH, OW), x.dtype)\n    for i in range(k):\n        for j in range(k):\n            cols[:, :, i, j] = xp[:, :, i:i + stride * OH:stride, j:j + stride * OW:stride]\n    return cols.transpose(0, 4, 5, 1, 2, 3).reshape(N * OH * OW, -1), OH, OW\n\ndef col2im(cols, shape, k, stride=1, pad=0):\n    \"\"\"The adjoint of im2col: scatter-add each row back to the pixels it came from (needed for dL/dx).\"\"\"\n    N, C, H, W = shape; OH = (H + 2 * pad - k) // stride + 1; OW = (W + 2 * pad - k) // stride + 1\n    c = cols.reshape(N, OH, OW, C, k, k).transpose(0, 3, 4, 5, 1, 2); xp = np.zeros((N, C, H + 2 * pad, W + 2 * pad))\n    for i in range(k):\n        for j in range(k):\n            xp[:, :, i:i + stride * OH:stride, j:j + stride * OW:stride] += c[:, :, i, j]\n    return xp[:, :, pad:pad + H, pad:pad + W]\n\nclass Conv:\n    def __init__(self, cin, cout, k, stride=1, pad=0, rng=np.random.default_rng(0)):\n        self.W = rng.normal(0, np.sqrt(2 / (cin * k * k)), (cout, cin, k, k)); self.b = np.zeros(cout)   # He init\n        self.k, self.s, self.p = k, stride, pad\n    def forward(self, x):\n        self.shape = x.shape; self.cols, OH, OW = im2col(x, self.k, self.s, self.p)\n        out = self.cols @ self.W.reshape(len(self.W), -1).T + self.b\n        return out.reshape(x.shape[0], OH, OW, -1).transpose(0, 3, 1, 2)\n    def backward(self, g):                       # g = dL/dout, shape (N, Cout, OH, OW)\n        g2 = g.transpose(0, 2, 3, 1).reshape(-1, len(self.W))\n        self.dW = (g2.T @ self.cols).reshape(self.W.shape); self.db = g2.sum(0)\n        return col2im(g2 @ self.W.reshape(len(self.W), -1), self.shape, self.k, self.s, self.p)\n    def params(self): return [(self.W, 'dW'), (self.b, 'db')]\n\nclass ReLU:\n    def forward(self, x): self.m = x > 0; return x * self.m\n    def backward(self, g): return g * self.m\n    def params(self): return []\n\nclass MaxPool:\n    def __init__(self, k=2): self.k = k\n    def forward(self, x):\n        N, C, H, W = x.shape; k = self.k; r = x.reshape(N, C, H // k, k, W // k, k)\n        out = r.max(axis=(3, 5)); self.mask = r == out[:, :, :, None, :, None]; self.shape = x.shape; return out\n    def backward(self, g):                       # gradient goes only to the max of each window\n        return (self.mask * g[:, :, :, None, :, None]).reshape(self.shape)\n    def params(self): return []\n\nclass Flatten:\n    def forward(self, x): self.shape = x.shape; return x.reshape(len(x), -1)\n    def backward(self, g): return g.reshape(self.shape)\n    def params(self): return []\n\nclass Linear:\n    def __init__(self, nin, nout, rng=np.random.default_rng(1)):\n        self.W = rng.normal(0, np.sqrt(2 / nin), (nin, nout)); self.b = np.zeros(nout)\n    def forward(self, x): self.x = x; return x @ self.W + self.b\n    def backward(self, g): self.dW = self.x.T @ g; self.db = g.sum(0); return g @ self.W.T\n    def params(self): return [(self.W, 'dW'), (self.b, 'db')]\n\ndef softmax_ce(z, y):\n    \"\"\"Mean cross-entropy and its gradient. The gradient of softmax+CE is simply (p - onehot) / N.\"\"\"\n    z = z - z.max(1, keepdims=True); p = np.exp(z); p /= p.sum(1, keepdims=True)\n    loss = -np.log(p[np.arange(len(y)), y] + 1e-12).mean(); g = p.copy(); g[np.arange(len(y)), y] -= 1\n    return loss, g / len(y), p\n\nclass Net:\n    def __init__(self, layers): self.layers = layers\n    def forward(self, x):\n        for l in self.layers: x = l.forward(x)\n        return x\n    def backward(self, g):\n        for l in reversed(self.layers): g = l.backward(g)\n        return g\n\nclass SGD:\n    \"\"\"SGD with momentum and L2 weight decay.\"\"\"\n    def __init__(self, net, lr=0.05, mom=0.9, wd=1e-4): self.net, self.lr, self.mom, self.wd, self.v = net, lr, mom, wd, {}\n    def step(self):\n        for l in self.net.layers:\n            for P, gname in l.params():\n                g = getattr(l, gname) + self.wd * P; v = self.v.get(id(P), 0) * self.mom - self.lr * g\n                self.v[id(P)] = v; P += v", "out": ""}};

/* ---- lern2vision/h2.js: real example figures (pyex.js), Python colours, pixel-grid pictures ---- */
(function () {
const { code, term } = CG.H;
/* PX(name): the example's full source plus the output it really printed when the course was built */
const PX = (name, cap, o) => {
  o = o || {};
  const p = CG.PX[name]; if (!p) throw new Error('no example ' + name);
  const items = [Object.assign(code(p.src, null, p.lang), { label: 'ex/' + p.file })];
  if (p.out && !o.noout) items.push(term(p.out, cap || (p.lang === 'py' ? '$ python3 ' + p.file + ' — real output (NumPy 2, OpenCV 4.14)' : (p.file === 's_neon.c' ? 'arm-none-linux-gnueabihf-gcc -O2 -mfpu=neon, run under qemu-arm — real output' : 'gcc -O2 -Wall -Wextra — real output'))));
  return { k: 'stackfig', items };
};
const PXO = (name, cap) => term(CG.PX[name].out, cap || 'Output of ex/' + CG.PX[name].file);
CG.H.PX = PX; CG.H.PXO = PXO;
CG.H.PY = (text, cap) => code(text, cap, 'py');

/* Python syntax colours (the base highlighter knows C-family languages only) */
const V = CG.V, hl0 = V.highlight;
const PYK = new Set('False None True and as assert break class continue def del elif else except finally for from global if import in is lambda not or pass raise return try while with yield print range len zip enumerate np cv2 self'.split(' '));
V.highlight = function (line, lang, state) {
  if (lang !== 'py') return hl0(line, lang, state);
  const out = []; let i = 0; const n = line.length;
  const push = (t, c) => out.push([t, c || null]);
  while (i < n) {
    const c = line[i], rest = line.slice(i); let m;
    if (c === '#') { push(rest, 'syn-com'); break; }
    if (c === '"' || c === "'") { let j = i + 1; while (j < n && line[j] !== c) { if (line[j] === '\\') j++; j++; } push(line.slice(i, j + 1), 'syn-str'); i = j + 1; continue; }
    if ((m = /^\d[\w.]*/.exec(rest)) && !/\w/.test(line[i - 1] || '')) { push(m[0], 'syn-num'); i += m[0].length; continue; }
    if ((m = /^[A-Za-z_]\w*/.exec(rest))) { push(m[0], PYK.has(m[0]) ? 'syn-kw' : null); i += m[0].length; continue; }
    push(c); i++;
  }
  return out;
};

/* pix: a small image drawn as a grid of grey cells with the numbers written in.
   o = {m: [[...]], hl: [[r, c], ...], tone, label, max} */
V.KINDS.pix = function (o) {
  const m = o.m, R = m.length, Cn = m[0].length, cs = o.cs || (Cn > 9 ? 26 : 34), W = Cn * cs + 2, H = R * cs + 2, mx = o.max || 255;
  const svg = V.svg(W, H, o.label || 'pixel grid');
  const isHL = (r, c) => (o.hl || []).some(p => p[0] === r && p[1] === c);
  for (let r = 0; r < R; r++) for (let c = 0; c < Cn; c++) {
    const v = m[r][c], g = typeof v === 'number' ? Math.max(0, Math.min(255, Math.round(255 * Math.abs(v) / mx))) : 255;
    svg.appendChild(V.rect(1 + c * cs, 1 + r * cs, cs, cs, { rx: 0, fill: 'rgb(' + g + ',' + g + ',' + g + ')', stroke: isHL(r, c) ? 'var(--gold)' : 'var(--line)', sw: isHL(r, c) ? 2.5 : 0.6 }));
    svg.appendChild(V.text(1 + c * cs + cs / 2, 1 + r * cs + cs / 2 + 3.5, String(v), { size: cs > 30 ? 11 : 9.5, mono: true, fill: g > 140 ? '#111' : '#eee' }));
  }
  return svg;
};
})();
/* Markdown tables inside LS bodies: split the card at each table and show it as a real table figure. */
(function () {
  const H = CG.H, LS0 = H.LS, lesson0 = H.lesson;
  const cells = l => l.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
  H.LS = (h, body, viz) => {
    if (!/\n\|[-: |]+\|\n/.test('\n' + body + '\n')) return LS0(h, body, viz);
    const paras = body.split('\n\n'), out = []; let txt = [], n = 0;
    paras.forEach(p => {
      const ls = p.split('\n');
      if (ls.length >= 2 && ls.every(l => l.trim().startsWith('|')) && /^\|[-: |]+\|$/.test(ls[1].trim())) {
        out.push(LS0(n++ ? h + ' (continued)' : h, txt.join('\n\n'), H.table(cells(ls[0]), ls.slice(2).map(cells)))); txt = [];
      } else txt.push(p);
    });
    if (txt.length || viz) out.push(LS0(h + ' (continued)', txt.join('\n\n'), viz));
    return out;
  };
  H.lesson = (id, title, ref, items) => lesson0(id, title, ref, [].concat(...items.map(x => Array.isArray(x) ? x : [x])));
})();

unit('u1', 1, 'found', 'rd', 'Images, cameras and colour', 'What a digital image really is: an array of numbers made by a camera, in a colour space, sampled and quantised.', [
  lesson('u1l1', 'An image is an array of numbers', REF.img, [
    LS('From light to numbers', 'A digital camera counts photons. Each sensor site (a **pixel**) integrates light for the exposure time, the charge is read out and an analogue-to-digital converter turns it into an integer. For an 8-bit greyscale image that integer is **0 (black) to 255 (white)**.\n\nSo in code an image is just a 2-D array:\n\n- `img[row, col]` — **row first** (y, downwards), then column (x, rightwards). This is the opposite of the (x, y) order used for points, and swapping them is the most common bug in vision code.\n- the origin (0, 0) is the **top-left** corner and y grows **downwards**.\n- a colour image adds a third axis: `img[row, col, channel]`, shape (H, W, 3).\n\nThe course uses small synthetic images from `ex/cvk.py` so every number in every example can be checked by hand. `shapes()` is a 128×128 grey image: background 40, a rectangle of 200 at rows 20–59 and columns 15–54, a disc of 130, a triangle of 240 and a ramp.', pix([[40, 40, 40, 40, 40, 40], [40, 40, 40, 40, 40, 40], [40, 40, 40, 200, 200, 200], [40, 40, 40, 200, 200, 200], [40, 40, 40, 200, 200, 200]], [[2, 3]], 'shapes()[18:23, 12:18]: the top-left corner of the rectangle. The highlighted cell is img[20, 15] = 200 — row 20, column 15.')),
    LS('dtype, shape and views', 'Three NumPy facts matter in every program:\n\n| Fact | Consequence |\n|---|---|\n| `uint8` holds 0–255 | arithmetic **wraps** modulo 256 (200 + 100 = 44) |\n| `img.shape` is (H, W) or (H, W, C) | width is `shape[1]`, not `shape[0]` |\n| slicing gives a **view** | writing into `img[20:24, 13:17]` changes the original image |\n| OpenCV loads colour as **BGR** | `cv2.imread` gives blue first; matplotlib expects RGB |\n| bytes = H·W·C·itemsize | a 1920×1080 RGB uint8 frame is 6 220 800 bytes |\n\nWalk-through: the example below prints the shape, reads one pixel in decimal, hex and binary, shows the same red pixel in RGB and BGR order, and proves that a slice is a view by zeroing it and reading the original.', PX('a_array')),
    LS('Why hex and binary matter for pixels', 'You will meet pixel values in other bases constantly:\n\n- **hex dumps** of image files and frame buffers show each byte as two hex digits: 0xC8 = 12×16 + 8 = 200.\n- **web colours** are #RRGGBB: #D21E1E is (210, 30, 30), the red square of `scene_rgb()`.\n- **bit planes**: bit 7 of a pixel is worth 128, bit 0 is worth 1. Keeping the top 4 bits (`p & 0xF0`) leaves 16 grey levels — quantisation.\n- **packed formats** like RGB565 squeeze a pixel into 16 bits: 5 bits red, 6 green, 5 blue.\n\nMethod tips used throughout the drills:\n\n1. **Decimal → hex**: divide by 16 once. Quotient is the high digit, remainder the low digit. 200 = 12×16 + 8 → C8.\n2. **Hex → decimal**: high × 16 + low. 0x7F = 7×16 + 15 = 127.\n3. **Decimal → binary**: walk 128, 64, 32, 16, 8, 4, 2, 1 and subtract what fits. 200 = 128 + 64 + 8 → 1100 1000.\n4. **Binary ↔ hex**: one hex digit per nibble. 1100 = C, 1000 = 8.'),
    GM('pixdec2hex'), GM('pixhex2dec'), GM('pixdec2bin'), GM('pixbin2dec'),
    MC('In NumPy, which expression reads the pixel at x = 20, y = 30 of a greyscale image `img`?', ['img[30, 20]', 'img[20, 30]', 'img(20, 30)', 'img[20][30]'], 'Arrays index row first: the row is y = 30, the column is x = 20. img[20, 30] would read x = 30, y = 20 — a different pixel unless the image is symmetric.', 'Row = y comes first.'),
    TF('`roi = img[10:20, 10:20]; roi[:] = 0` leaves `img` unchanged.', false, 'Basic slicing returns a view onto the same memory. Use `img[10:20, 10:20].copy()` when you want an independent crop.', 'Views versus copies.'),
    P('An 8-bit pixel is brightened in C. What does this print?', C`uint8_t p = 200;
p = p + 100;
printf("%u\n", p);`, '44', ['300', '255', '100'], '200 + 100 = 300 is computed as int, then stored back into uint8_t, which keeps 300 mod 256 = 44. A bright pixel turns dark — clip (saturate) before storing.'),
    GM('rgbhex'), GM('imgbytes')
  ]),
  lesson('u1l2', 'The pinhole camera and the intrinsic matrix', REF.cam, [
    LS('Perspective projection', 'A pinhole camera maps a 3-D point (X, Y, Z) in the camera frame (Z forward, X right, Y down) onto the image plane by similar triangles:\n\n- normalised coordinates: x = X/Z, y = Y/Z\n- pixels: u = f_x·x + c_x, v = f_y·y + c_y\n\nf_x and f_y are the focal length **in pixels** (focal length in mm divided by pixel pitch in mm); (c_x, c_y) is the **principal point**, near the image centre. Written as a matrix, with homogeneous coordinates:\n\n**λ (u, v, 1)ᵀ = K (X, Y, Z)ᵀ**, K = [f_x s c_x; 0 f_y c_y; 0 0 1]\n\nwhere s (skew) is 0 for modern sensors. The division by Z — the scale λ — is what makes far things small and parallel lines meet at vanishing points.\n\nWalk-through: f = 800, (c_x, c_y) = (320, 240), point (0.5, −0.2, 4): x = 0.125, y = −0.05, so u = 800·0.125 + 320 = 420 and v = 800·(−0.05) + 240 = 200. The example checks this against `cv2.projectPoints`.', PX('a_pinhole')),
    LS('Extrinsics and lens distortion', 'Points usually start in a **world** frame. The extrinsic rotation R and translation t move them into the camera frame: X_c = R X_w + t. The full camera is\n\n**λ x = K [R | t] X_w**, a 3×4 projection matrix P with 11 degrees of freedom (5 intrinsic + 3 rotation + 3 translation).\n\nReal lenses bend straight lines. The usual radial model scales the normalised point by (1 + k₁r² + k₂r⁴ + k₃r⁶), with r² = x² + y²; tangential terms p₁, p₂ handle a tilted lens. **Negative k₁** is barrel distortion (points pulled toward the centre, typical of wide-angle lenses); positive k₁ is pincushion. In the example k₁ = −0.2 moves the point at (420, 200) inward to (419.64, 200.15), and a by-hand version matches OpenCV exactly. Unit 9 estimates K and the k’s from photos of a checkerboard.'),
    GM('project'), GM('fov'),
    NU('With f_x = 1000 px and c_x = 640, a point at X = 0.3 m, Z = 3 m projects to which column u?', 740, 'x = X/Z = 0.1; u = 1000·0.1 + 640 = 740.', 'u = f_x·X/Z + c_x.'),
    MC('A point moves from Z = 2 m to Z = 4 m with X, Y fixed. Its offset from the principal point…', ['halves', 'doubles', 'stays the same', 'quarters'], 'u − c_x = f_x·X/Z, so doubling Z halves the offset. Perspective scale is 1/Z.', 'Look at where Z appears.'),
    MA('Match each parameter to its meaning.', [['f_x, f_y', 'focal length in pixels'], ['c_x, c_y', 'principal point'], ['R, t', 'camera pose (extrinsics)'], ['k₁, k₂', 'radial lens distortion']], 'K holds f and c (intrinsics, fixed for a lens and zoom). R, t change whenever the camera moves.'),
    TF('Barrel distortion (k₁ < 0) moves image points away from the centre.', false, 'Negative k₁ makes the scale factor 1 + k₁r² smaller than 1, pulling points toward the centre; straight lines bow outward like a barrel.', 'Check the sign of the scale factor.')
  ]),
  lesson('u1l3', 'Colour spaces', REF.col, [
    LS('RGB, BGR and grey', 'A colour pixel stores three numbers. OpenCV’s default order is **BGR** (a historical choice), so `img[y, x]` of a loaded photo is (blue, green, red). Mixing orders swaps red and blue: faces turn blue.\n\nGreyscale is a weighted sum, not a plain average, because the eye is far more sensitive to green:\n\n**Y = 0.299 R + 0.587 G + 0.114 B** (ITU-R BT.601, what `COLOR_BGR2GRAY` uses).\n\nWalk-through for the red square (210, 30, 30): 0.299·210 = 62.79, 0.587·30 = 17.61, 0.114·30 = 3.42; total 83.82 → **84**. The example computes it by hand and with cvtColor.'),
    LS('HSV, Lab and YCrCb', 'Other colour spaces separate what we care about:\n\n| Space | Channels | Good for |\n|---|---|---|\n| HSV | hue (colour angle), saturation, value | colour thresholding: “all red-ish pixels” is one hue range |\n| Lab | L lightness, a green–red, b blue–yellow | perceptual distances, colour transfer |\n| YCrCb | luma + two chroma differences | JPEG compression, skin detection |\n| linear RGB | light intensity, no gamma | physically correct blending and blurring |\n\nOpenCV’s 8-bit HSV stores **H/2** (0–179) because 360 does not fit in a byte; red wraps around 0, so a red mask needs two ranges (0–10 and 170–179).\n\n**Gamma**: stored sRGB values are not proportional to light. Value 128 is about 0.216 of the light of 255, not 0.5. Averaging two sRGB pixels therefore darkens edges slightly; physically based work converts to linear first.', PX('a_colour')),
    GM('luma'), GM('hsvhue'), GM('srgb'),
    MC('You want to segment a red ball under changing brightness. Which space makes the threshold simplest?', ['HSV (threshold on hue)', 'RGB (threshold on R only)', 'greyscale', 'binary'], 'Hue barely changes with illumination; R alone also rises for white and yellow objects and falls in shadow.', 'Which channel describes “redness” independently of brightness?'),
    TF('OpenCV stores the hue of an 8-bit HSV image in the range 0–359.', false, 'It stores H/2, so 0–179. Float images use 0–360.', 'A byte holds 0–255.'),
    NU('Grey value (BT.601, rounded) of pure green (0, 255, 0)?', 150, '0.587 × 255 = 149.7 → 150. Pure blue gives only 29: green looks much brighter.', 'Use the weight of G.', { tol: 1 }),
    P('A BGR pixel is stored as three bytes in memory. What prints?', C`unsigned char px[3] = {30, 30, 210};   /* as OpenCV stores the red square */
printf("R=%d G=%d B=%d\n", px[2], px[1], px[0]);`, 'R=210 G=30 B=30', ['R=30 G=30 B=210', 'R=210 G=30 B=210', 'R=30 G=210 B=30'], 'In BGR order byte 0 is blue and byte 2 is red, so reading index 2 as R gives 210.')
  ]),
  lesson('u1l4', 'Sampling, aliasing and quantisation', REF.img, [
    LS('Sampling: the Nyquist limit', 'A sensor samples a continuous scene on a grid. The **sampling theorem** says a pattern can only be represented if it has fewer than **0.5 cycles per pixel**. Finer detail does not vanish — it **aliases** into a false, coarser pattern (moiré on striped shirts, wagon wheels turning backwards).\n\nThe same happens in software whenever you shrink an image by taking every k-th pixel. The fix is to **low-pass first**: blur away detail finer than the new Nyquist limit, then sample. That is what `cv2.resize(..., interpolation=cv2.INTER_AREA)` and image pyramids do.\n\nWalk-through: the example makes a stripe pattern at 0.45 cycles/pixel, then keeps every 4th sample. The new Nyquist limit is 0.5 cycles per *new* pixel, but the stripes are now 1.8 cycles per new pixel, so they alias: the strongest frequency appears at a false 0.203 cycles/sample. Blurring first leaves an almost flat result (std 0.15 instead of 90.73) — the honest answer, since the detail cannot be shown.', PX('a_sample')),
    LS('Quantisation: bits per pixel', 'After sampling, each value is rounded to one of 2^b levels. There are two common ways:\n\n- **truncate** by keeping the top b bits (`p & mask`): the step is 256/2^b and the worst error is step − 1;\n- **round** to 2^b levels spread evenly over 0–255 (what the example does): the worst error is about half a step.\n\n| Bits | Levels | Max error, truncating | Max error, rounding (example) |\n|---|---|---|---|\n| 8 | 256 | 0 | 0 |\n| 4 | 16 | 15 | 8 |\n| 2 | 4 | 63 | 42 |\n| 1 | 2 | 127 | 127 |\n\nToo few levels show **false contours** (banding) in smooth gradients. Medical and HDR sensors use 10–16 bits; neural networks are often run with 8-bit weights and activations (Unit 19), which is the same idea applied to tensors.'),
    GM('bitdepth'),
    MC('You downsample a photo of a brick wall by 4 by keeping every 4th pixel and see swirling patterns. The fix is…', ['blur (low-pass) before sampling, or use INTER_AREA', 'sharpen before sampling', 'use more bits per pixel', 'convert to HSV'], 'The swirls are aliasing: detail above the new Nyquist limit folded into low frequencies. Remove it before sampling.', 'Which frequencies can the smaller image hold?'),
    NU('A stripe pattern has 0.3 cycles per pixel. You keep every 2nd pixel. How many cycles per new pixel does it now have?', 0.6, 'Each new pixel spans 2 old ones: 0.3 × 2 = 0.6 cycles per new pixel, above the 0.5 limit, so it aliases (to 1 − 0.6 = 0.4).', 'Multiply by the decimation factor.', { tol: 0.001 }),
    TF('Quantising to 1 bit per pixel is the same as thresholding at 128.', true, 'Keeping only bit 7 maps 0–127 to 0 and 128–255 to 128 (or 255 when displayed as binary): exactly a threshold at 128.', 'What does bit 7 encode?')
  ])
]);

unit('u2', 2, 'found', 'rs1', 'Pixel operations and histograms', 'Changing each pixel on its own: brightness, contrast, gamma, lookup tables, and the histogram tools that choose the mapping for you.', [
  lesson('u2l1', 'Point operations and lookup tables', REF.pix, [
    LS('out = f(in), one pixel at a time', 'A **point operation** computes each output pixel from the input pixel at the same place only. The common ones:\n\n| Operation | Formula | Effect |\n|---|---|---|\n| brightness | in + β | shifts the histogram |\n| contrast | α·in | stretches it (α > 1) |\n| negative | 255 − in | inverts |\n| gamma | 255·(in/255)^γ | γ < 1 lifts shadows |\n| threshold | 255 if in > t else 0 | binary mask |\n\nBecause an 8-bit input has only 256 possible values, any point operation can be precomputed into a **lookup table** of 256 entries and applied with `cv2.LUT(img, lut)` or `lut[img]` — one memory read per pixel, whatever the formula costs.\n\n**Saturation**: results must be clipped to 0–255. NumPy uint8 arithmetic **wraps** instead (250 + 50 = 44), while `cv2.add` and `cv2.addWeighted` saturate. The example also shows a classic trap: `cv2.convertScaleAbs` takes the **absolute value** of α·in + β, so a negative result becomes positive rather than 0.', PX('b_pointops')),
    GM('satadd'), GM('gamma'), GM('stretch'),
    MC('Why use a lookup table for a gamma curve on an 8-bit image?', ['only 256 inputs exist, so pow() runs 256 times instead of once per pixel', 'LUTs are more accurate than pow()', 'pow() cannot handle uint8', 'a LUT also blurs the image'], 'A 12-megapixel photo has 12 million pixels but only 256 distinct values. Precompute, then index.', 'Count distinct inputs.'),
    P('Saturating add in C, as cv2.add does. What prints?', C`int a = 250, b = 50;
int s = a + b;
unsigned char out = s > 255 ? 255 : (unsigned char)s;
printf("%d %d\n", out, (unsigned char)(a + b));`, '255 44', ['255 255', '44 44', '300 44'], 'The clamped version gives 255; the plain conversion keeps 300 mod 256 = 44.'),
    TF('Adding the same constant to every pixel changes the shape of the histogram.', false, 'It only shifts the histogram (until values clip at 255, which piles them up at the end).', 'Shift versus stretch.')
  ]),
  lesson('u2l2', 'Histograms and equalisation', REF.pix, [
    LS('The histogram', 'The **histogram** h(v) counts how many pixels have value v. It tells you, without looking at the picture, whether an image is dark (mass on the left), washed out (squeezed in the middle) or high-contrast (spread out). It ignores *where* pixels are, so very different images can share a histogram.\n\n`cv2.calcHist([img], [0], None, [256], [0, 256])` and `np.bincount(img.ravel(), minlength=256)` give the same counts. Normalised by N, it is the probability p(v); its running sum is the **cumulative distribution** cdf(v).'),
    LS('Walk-through: histogram equalisation', 'Equalisation maps each level to its **rank**: out(v) = round((cdf(v) − cdf_min)/(N − cdf_min) · 255). Levels that many pixels share get spread apart; empty ranges are squeezed out.\n\nSmall example: levels 40, 70, 100, 130 with counts 2, 4, 1, 3 (N = 10).\n\n1. cdf = 2, 6, 7, 10; cdf_min = 2.\n2. 40 → (2 − 2)/8·255 = 0.\n3. 70 → (6 − 2)/8·255 = 127.5 → 128.\n4. 100 → (7 − 2)/8·255 = 159.4 → 159.\n5. 130 → (10 − 2)/8·255 = 255.\n\nThe example implements exactly this formula and matches `cv2.equalizeHist` with **zero** difference on a low-contrast image whose levels ran 40–167.', PX('b_hist')),
    GM('histeq'), GM('histeq'),
    MC('After equalisation the histogram of an 8-bit image is…', ['roughly flat in the cumulative sense, but with gaps — counts cannot be split', 'exactly flat', 'unchanged', 'a single spike'], 'All pixels with the same input value receive the same output, so a busy level stays one bar. Equalisation makes the cdf close to a straight line, not the bars equal.', 'Can one level be split into two?'),
    TF('Histogram equalisation is a point operation.', true, 'The mapping is computed from the global histogram, but each pixel is then transformed by a fixed 256-entry table.', 'Is the final mapping the same everywhere?')
  ]),
  lesson('u2l3', 'CLAHE and histogram matching', REF.pix, [
    LS('Local contrast: CLAHE', 'Global equalisation uses one mapping for the whole image. A photo that is dark on one side and bright on the other gets a compromise that suits neither, and it amplifies noise in flat areas.\n\n**CLAHE** (contrast-limited adaptive histogram equalisation):\n\n1. split the image into tiles (an 8×8 grid by default; the example uses 4×4);\n2. equalise each tile with its own histogram, but first **clip** each bar at a limit (clipLimit × average) and redistribute the excess — this caps the slope of the mapping and so the noise gain;\n3. bilinearly blend the four nearest tile mappings at each pixel to avoid seams.\n\n**Histogram matching** (specification) generalises equalisation: map input levels through cdf_in then through the inverse of a *target* cdf, so one image takes on another’s tonal distribution.\n\nWalk-through: the example darkens the left half of an image. Global equalisation lifts its mean from 21.9 to 112.4 — dragging the left half far brighter, but because the mapping is global it also changes the right half. CLAHE’s per-tile mapping moves it only to 25.5 with clip limit 2, keeping local structure. Matching to a Gaussian target (mean 128, std 30) lands at 141.2 / 28.3.', PX('b_clahe')),
    MC('Why does CLAHE clip the histogram before equalising each tile?', ['to limit how much it amplifies noise in flat regions', 'to make it faster', 'to keep colours unchanged', 'to remove salt-and-pepper noise'], 'A flat tile has one tall bar; equalising it unclipped turns tiny noise differences into huge output differences. Clipping caps the mapping’s slope.', 'Think about the slope of the cdf over a tall bar.'),
    OR('Order the CLAHE steps.', ['split the image into tiles', 'compute each tile’s histogram', 'clip bars above the limit and redistribute', 'build each tile’s equalisation mapping', 'blend the neighbouring mappings bilinearly at each pixel'], 'Clipping happens before the mapping is built; blending happens last, per pixel.'),
    TF('Histogram matching to a uniform target is the same as histogram equalisation.', true, 'The inverse cdf of a uniform distribution is a straight line, so matching reduces to mapping through the input cdf.', 'Equalisation targets a flat histogram.'),
    GM('pickmethod')
  ])
]);
})();

/* ---- lern2vision/l02.js — Unit 3 filtering, Unit 4 edges and corners ---- */
(function () {
const { REF, C, code, term, table, P, PN, LS, MC, TF, MA, OR, FI, NU, unit, lesson, PX, PXO, PY } = CG.H;

unit('u3', 3, 'filt', 'rs2', 'Convolution and filtering', 'Neighbourhood operations: correlation and convolution, smoothing with Gaussian, median and bilateral filters, and the Fourier view of what a filter does.', [
  lesson('u3l1', 'Correlation and convolution', REF.filt, [
    LS('A weighted sum over a window', 'A **linear filter** replaces each pixel with a weighted sum of its neighbourhood. The weights form a small array, the **kernel**:\n\n**out(y, x) = Σⱼ Σᵢ K(j, i) · in(y + j, x + i)**, with j, i running over −1…1 for a 3×3 kernel.\n\nThat is **correlation**, and it is what `cv2.filter2D` computes. **Convolution** flips the kernel first: out(y, x) = Σ K(j, i)·in(y − j, x − i). For symmetric kernels (box, Gaussian, Laplacian) the two are identical; for asymmetric ones (Sobel, a shift) the sign or direction changes. CNN “convolution” layers actually compute correlation too — the network learns whichever orientation it needs.\n\nConvolution is linear and shift-invariant, commutative and associative: blurring twice with σ₁ and σ₂ equals one blur with √(σ₁² + σ₂²).'),
    LS('Walk-through: one output pixel', 'Take the sharpen kernel [0 −1 0; −1 5 −1; 0 −1 0] at row 21, column 15 of `shapes()`, right on the rectangle’s left edge. The 3×3 neighbourhood (rows 20–22, columns 14–16) is\n\n40 200 200 / 40 200 200 / 40 200 200.\n\nOnly the cross of the kernel is non-zero: 5·200 − 200 (above) − 200 (below) − 40 (left) − 200 (right) = 1000 − 640 = **360**. The input was 200, so the edge is exaggerated (and would be clipped to 255 in uint8). That overshoot is what “sharpening” means.\n\n**Borders**: the window falls off the image at the edge. OpenCV’s default reflects without repeating the edge pixel (BORDER_REFLECT_101: …c b | a b c…); others are replicate, constant 0 and wrap. The example pads with NumPy’s `reflect`, which is the same rule, and matches filter2D exactly.', pix([[40, 200, 200], [40, 200, 200], [40, 200, 200]], [[1, 1]], 'shapes()[20:23, 14:17]; the centre is pixel (21, 15).')),
    LS('The from-scratch implementation', 'The loop runs over the **kernel** (9 iterations), not over the 16 384 pixels: each iteration adds one shifted copy of the padded image times one weight. That is fully vectorised in NumPy and is also how SIMD C code does it (Unit 19).', PX('c_conv')),
    GM('convpix'), GM('convpix'),
    TF('For the Sobel x kernel, convolution and correlation give the same result.', false, 'Sobel x is antisymmetric: flipping it negates every weight, so convolution gives −G_x.', 'Flip [−1 0 1] left–right.'),
    MC('A 3×3 kernel whose weights sum to 0 applied to a flat (constant) region gives…', ['0', 'the constant', '255', '1'], 'Σ K·c = c·Σ K = 0. Derivative kernels (Sobel, Laplacian) respond only where intensity changes.', 'Factor the constant out.'),
    MC('What does the kernel [0 0 0; 0 0 1; 0 0 0] do under correlation (filter2D)?', ['each output takes the pixel to its right: the image shifts one pixel left', 'shifts the image right', 'blurs', 'nothing'], 'out(y, x) = in(y, x + 1): content moves left by one. Under true convolution the flip makes it shift right.', 'Which input does out(y, x) read?')
  ]),
  lesson('u3l2', 'Gaussian smoothing, separability and integral images', REF.filt, [
    LS('The Gaussian kernel', 'The Gaussian G(x) = exp(−x²/2σ²), normalised to sum 1, is the standard blur:\n\n- it is the only kernel that is both **separable** and **rotationally symmetric**, so a 2-D blur is a 1-D blur along rows then along columns;\n- its Fourier transform is also a Gaussian, so it has **no ringing**;\n- blurring with σ₁ then σ₂ equals one blur with √(σ₁² + σ₂²) — the basis of scale space (Unit 5).\n\nSize: about ±3σ holds 99.7% of the weight, so use 2⌈3σ⌉ + 1 taps. For σ = 1 that is 7 taps: [0.004 0.054 0.242 0.399 0.242 0.054 0.004].\n\n**Separability saves work**: a k×k kernel costs k² multiplies per pixel; two 1-D passes cost 2k. For k = 13 that is 169 versus 26.', PX('c_gauss')),
    LS('Integral images: any box sum in four lookups', 'The **integral image** (summed-area table) stores ii(y, x) = sum of all pixels above and to the left, inclusive. Then the sum of any rectangle is\n\n**D − B − C + A**\n\nwhere D is ii at the bottom-right corner, B just above the box’s top-right, C just left of its bottom-left, and A diagonally outside the top-left. Cost: 4 reads, whatever the box size. A box filter of any width therefore runs in constant time per pixel, and Viola–Jones (Unit 11) evaluates thousands of rectangle features per window with it.\n\nIn the example an 11×11 box sum read from the table equals the direct sum, 24 200. The C version in Unit 19 checks 324 random boxes with 0 wrong.'),
    GM('gausstaps'), GM('integral'), GM('integral'),
    NU('How many multiplies per pixel does a separable 15×15 Gaussian need, done as two 1-D passes?', 30, '15 for the horizontal pass + 15 for the vertical pass = 30, versus 225 for the full 2-D kernel.', '2k instead of k².'),
    TF('Blurring twice with σ = 3 is the same as blurring once with σ = 6.', false, 'Variances add: √(3² + 3²) = 4.24, not 6.', 'Add σ², not σ.'),
    MC('PSNR rose from 22.44 dB to 24.94 dB after blurring a noisy image. That means…', ['the blurred image is closer to the clean one in mean squared error', 'the blurred image is sharper', 'noise doubled', 'PSNR is meaningless here'], 'PSNR = 10·log10(255²/MSE). +2.5 dB is about a 44% drop in MSE. The blur also softens edges, which PSNR rewards less than the noise reduction.', 'PSNR rises as MSE falls.')
  ]),
  lesson('u3l3', 'Median and bilateral filters', REF.filt, [
    LS('Non-linear smoothing', 'Linear filters average everything in the window, including outliers and the other side of an edge. Two non-linear filters avoid that:\n\n**Median**: sort the window, take the middle value. A single extreme pixel (salt = 255, pepper = 0) lands at an end of the sorted list and never becomes the output, so impulse noise vanishes. A straight edge survives because the majority on each side wins. Cost: a sort per pixel (or a running histogram).\n\n**Bilateral**: a Gaussian blur whose weights also fall off with **intensity difference**:\n\nw = exp(−|Δposition|²/2σ_s²) · exp(−|ΔI|²/2σ_r²)\n\nPixels across an edge differ by a lot in intensity, so they get almost no weight: noise is averaged within each side but the edge stays sharp. Large σ_r turns it back into an ordinary Gaussian.\n\nWalk-through: the example adds 8% salt-and-pepper noise. A 3×3 Gaussian only reaches 21.8 dB (it smears the specks), the 3×3 median 30.5 dB; the from-scratch median matches cv2.medianBlur pixel for pixel. On Gaussian noise the bilateral filter keeps a 153-level edge step (clean: 160) where a Gaussian of similar reach leaves 20.', PX('c_median')),
    LS('The bilateral filter from scratch', 'The implementation loops over window offsets, computing the range weight per pixel from the intensity difference, and normalises by the sum of weights. Built in float32 with the same window as OpenCV it matches `cv2.bilateralFilter` to within 0.000 mean and maximum difference.', PX('c_bilat')),
    GM('medianpix'), GM('medianpix'),
    MC('Which filter best removes salt-and-pepper noise?', ['median', 'Gaussian', 'box', 'sharpen'], 'Impulses are outliers; the median ignores outliers, averages do not.', 'Which statistic is robust to outliers?'),
    MC('In the bilateral filter, making σ_r (range sigma) very large makes it behave like…', ['an ordinary Gaussian blur', 'a median filter', 'the identity', 'a Sobel filter'], 'With huge σ_r the range weight is ≈1 for every neighbour, leaving only the spatial Gaussian.', 'What does the range term do as σ_r → ∞?'),
    TF('The median filter is linear: median(a + b) = median(a) + median(b).', false, 'Example: a = (0, 0, 9), b = (9, 0, 0): median(a) + median(b) = 0, but median of the sum (9, 0, 9) is 9.', 'Try a small counter-example.')
  ]),
  lesson('u3l4', 'The Fourier domain', REF.filt, [
    LS('Images as sums of waves', 'The 2-D discrete Fourier transform writes an H×W image as a sum of H·W sinusoidal gratings. F(0, 0), the **DC term**, is the sum of all pixels (N × mean): in the example 85.699 = the mean of shapes(). Low frequencies (near the centre after `fftshift`) hold smooth shading; high frequencies hold edges, texture and noise.\n\nThe **convolution theorem**: circular convolution in space equals pointwise multiplication of spectra,\n\n**f ⊛ k = IFFT(FFT(f) · FFT(k))**.\n\nThe example verifies it exactly against a wrap-around 3×3 box filter. For big kernels the FFT route is faster (O(N log N) instead of O(N·k²)); OpenCV’s filter2D switches to it automatically for kernels around 11×11 and larger.'),
    LS('Low-pass, ringing and notch filters', 'A filter is described by what it does to each frequency (its **frequency response**):\n\n| Filter | Response | Side effect |\n|---|---|---|\n| ideal low-pass | 1 inside radius r, 0 outside | sharp cut → **ringing** (Gibbs) near edges |\n| Gaussian low-pass | smooth Gaussian | no ringing, gentler cut |\n| high-pass | 1 − low-pass | keeps edges, removes shading |\n| notch | zero at a few frequencies | removes periodic noise |\n\nWalk-through: an ideal low-pass at radius 0.08 cycles/pixel overshoots the 200-level rectangle by 33.9 grey levels (ringing); a Gaussian of similar width overshoots by 0.0. Then 30-level stripes with period 8 px are added: the spectrum shows one bright spike at frequency index (0, 16) — 128/8 = 16 cycles across the image — plus its mirror. Zeroing those two coefficients removes the stripes, leaving a mean error of only 1.26.', PX('c_fft')),
    MC('A photo has fine regular stripes from a scanner. In its spectrum you expect…', ['bright isolated spikes at the stripe frequency (and its mirror)', 'only a DC term', 'a uniformly bright spectrum', 'nothing visible'], 'A pure sinusoid concentrates into one frequency (two conjugate points). A notch filter removes just those.', 'What is the transform of a single sinusoid?'),
    TF('The DC coefficient F(0, 0) of an image equals the sum of all its pixels.', true, 'At frequency zero every exponential is 1, so F(0,0) = Σ f. Divided by N it is the mean (85.699 in the example).', 'Put u = v = 0 in the DFT formula.'),
    MC('Why does an ideal (brick-wall) low-pass filter create ripples near edges?', ['its spatial kernel is a sinc with negative side lobes', 'the FFT is inaccurate', 'it removes the DC term', 'it is non-linear'], 'Multiplying by a box in frequency equals convolving with a sinc in space; its oscillating lobes appear as ringing.', 'What is the inverse transform of a box?'),
    NU('An image is 256 pixels wide and has vertical stripes with a period of 16 pixels. At which horizontal frequency index does the spike appear?', 16, '256 / 16 = 16 full cycles across the width, so index 16 (and its mirror at 256 − 16 = 240).', 'Count cycles across the image.')
  ])
]);

unit('u4', 4, 'filt', 'op', 'Edges and corners', 'Where intensity changes: gradients and Sobel, the Canny detector step by step, and corners from the structure tensor.', [
  lesson('u4l1', 'Image gradients and Sobel', REF.edge, [
    LS('The gradient', 'An edge is where intensity changes quickly. The **gradient** ∇I = (∂I/∂x, ∂I/∂y) points in the direction of fastest increase, from dark to bright, and its length is the edge strength:\n\n- magnitude |∇I| = √(G_x² + G_y²) (or the cheaper |G_x| + |G_y|)\n- direction θ = atan2(G_y, G_x); the edge runs **perpendicular** to it.\n\nA central difference [−1 0 1] estimates ∂I/∂x but is very noise-sensitive. **Sobel** combines it with smoothing across the other axis:\n\nG_x kernel = [1 2 1]ᵀ ⊗ [−1 0 1] = [−1 0 1; −2 0 2; −1 0 1].\n\nOn a clean vertical step of height h it gives 1·h + 2·h + 1·h = **4h**. In the example the rectangle edge (40 → 200, h = 160) gives exactly 640, and the gradient angle is 0°: pointing right, into the bright region.'),
    LS('Walk-through and pitfalls', 'The example builds G_x with filter2D and confirms it equals `cv2.Sobel(dx=1)`. Notes from its output:\n\n1. **Store gradients signed.** In uint8 the negative half of every edge is lost; use CV_32F or CV_16S.\n2. **L1 versus L2.** At a 45° corner |G_x| + |G_y| = 960 but √(G_x² + G_y²) = 678.8: L1 over-reports diagonals by up to √2.\n3. **Second derivatives.** The Laplacian ∇²I = I_xx + I_yy responds +160 then −160 across the edge: the edge is the **zero crossing** between them. Laplacian of Gaussian and difference of Gaussians (Unit 5) use this.', PX('d_sobel')),
    GM('sobelpix'), GM('gradmag'),
    MC('Why does Sobel weight the centre row by 2?', ['it smooths across the edge direction (a [1 2 1] binomial blur) to reduce noise', 'to double the edge strength only', 'to detect corners', 'to make the kernel sum to 0'], 'Sobel = derivative along x × triangular smoothing along y. The zero sum comes from the [−1 0 1] factor.', 'Factor the kernel into two 1-D kernels.'),
    TF('Storing cv2.Sobel output in uint8 keeps both rising and falling edges.', false, 'Falling edges have negative G_x; uint8 saturates them to 0. Use a signed or float depth, then take absolute values for display.', 'What happens to negative numbers in uint8?'),
    P('A 1-D central difference at a step. What does this print?', C`int row[6] = {40, 40, 40, 200, 200, 200};
for (int x = 1; x < 5; x++) printf("%d ", row[x + 1] - row[x - 1]);
printf("\n");`, '0 160 160 0', ['0 160 0 0', '0 80 80 0', '160 160 160 160'], 'Positions 2 and 3 straddle the step, so both see 200 − 40 = 160; elsewhere the neighbours are equal.')
  ]),
  lesson('u4l2', 'The Canny edge detector', REF.edge, [
    LS('Four steps to good edges', 'Canny (1986) designed an edge detector for three goals — find real edges, locate them precisely, mark each once — and arrived at:\n\n1. **Smooth** with a Gaussian to suppress noise.\n2. **Gradient** with Sobel: magnitude and direction.\n3. **Non-maximum suppression (NMS)**: keep a pixel only if its magnitude is the largest along the gradient direction (compare with the two neighbours across the edge, using direction rounded to 0°, 45°, 90°, 135°). Thick ridges become 1-pixel lines.\n4. **Hysteresis thresholding** with two thresholds: pixels above *high* are edges; pixels between *low* and *high* are kept only if connected to a strong pixel. This keeps long faint edges while rejecting isolated noise. A high:low ratio of 2:1 to 3:1 is typical.'),
    LS('Walk-through: Canny from scratch', 'The example implements all four steps with NumPy (the hysteresis uses connected components of the weak mask that touch a strong pixel) and compares with `cv2.Canny(img, 50, 150)`: 618 versus 615 edge pixels, 581 identical, and **100%** of the from-scratch edge pixels lie within 1 px of an OpenCV edge — the small differences come from OpenCV’s integer direction test and its L1 magnitude by default.\n\nThreshold choice matters: (20, 60) gives 707 pixels (noise sneaks in), (50, 150) 615, (100, 300) 605. Try the **Edges** lab to see NMS turned on and off.', PX('d_canny')),
    OR('Order the steps of Canny.', ['Gaussian smoothing', 'Sobel gradient magnitude and direction', 'non-maximum suppression along the gradient', 'hysteresis with low and high thresholds'], 'Smooth, differentiate, thin, then link.'),
    MC('What does hysteresis add over a single threshold?', ['weak edge pixels survive only when connected to strong ones', 'it thins the edges', 'it smooths the image', 'it computes the gradient direction'], 'One threshold must choose between losing faint edge segments and admitting noise; two thresholds plus connectivity get both.', 'Think about a long edge that fades in the middle.'),
    TF('Raising both Canny thresholds generally reduces the number of edge pixels.', true, 'The example: (20, 60) → 707, (50, 150) → 615, (100, 300) → 605.', 'Fewer pixels pass a higher bar.'),
    MC('NMS compares a pixel with which two neighbours?', ['the two along the gradient direction (across the edge)', 'the two along the edge', 'left and right always', 'the four corners'], 'The ridge of magnitude runs along the edge; its maximum is found by looking across it.', 'Thinning a ridge means looking across it.')
  ]),
  lesson('u4l3', 'Corners: Harris and Shi–Tomasi', REF.edge, [
    LS('The structure tensor', 'An edge looks the same if you slide along it; a **corner** changes whichever way you slide. Harris made this precise. Shifting a window by (u, v) changes it by approximately\n\nE(u, v) ≈ [u v] **M** [u v]ᵀ,  M = Σ_window w · [I_x²  I_xI_y; I_xI_y  I_y²]\n\nM (the **structure tensor** or second-moment matrix) has two eigenvalues λ₁ ≥ λ₂:\n\n| λ₁ | λ₂ | Region |\n|---|---|---|\n| small | small | flat |\n| large | small | edge |\n| large | large | corner |\n\nHarris avoids the eigen-decomposition with **R = det M − k (tr M)² = λ₁λ₂ − k(λ₁ + λ₂)²**, k ≈ 0.04–0.06: R > 0 at corners, R < 0 on edges, |R| small on flat areas. **Shi–Tomasi** uses min(λ₁, λ₂) directly (`cv2.goodFeaturesToTrack`), which is what trackers prefer.'),
    LS('Walk-through: Harris from scratch', 'The example computes Sobel gradients, the products I_x², I_y², I_xI_y, sums them over a box window, and forms R. It equals `cv2.cornerHarris` up to OpenCV’s scale factor 12⁴ (relative difference 2.5e−7). Then:\n\n- flat region R = 0, on an edge R = −2.42e11 (negative), at a rectangle corner R = +1.32e12;\n- after thresholding and non-maximum suppression the corners found are the rectangle’s four corners, (20, 15), (20, 54), (59, 15), (59, 54), plus corners of the triangle;\n- for an edge-like M with eigenvalues 0.1 and 2, min eig is small, so Shi–Tomasi rejects it.', PX('d_harris')),
    MA('Match the eigenvalues of M to the region.', [['both small', 'flat'], ['one large, one small', 'edge'], ['both large', 'corner'], ['R < 0', 'edge (Harris)']], 'The eigenvalues measure intensity change in the two principal directions.'),

unit('u5', 5, 'filt', 'f7', 'Features, matching and RANSAC', 'Repeatable keypoints across scale (DoG/SIFT), binary descriptors (ORB), matching with the ratio test, and robust model fitting with RANSAC.', [
  lesson('u5l1', 'Scale space and SIFT', REF.feat, [
    LS('Why scale space', 'Harris finds corners at one scale. The same building corner photographed from 5 m and from 50 m covers very different numbers of pixels. To find the **same** point in both, search over scale as well as position.\n\nA **Gaussian scale space** is the stack L(x, y, σ) of the image blurred with increasing σ. Lindeberg showed that the **scale-normalised Laplacian** σ²∇²L has extrema at the scale that matches a blob’s size. Lowe’s SIFT approximates it cheaply with the **difference of Gaussians**:\n\nDoG = L(kσ) − L(σ) ≈ (k − 1) σ² ∇²L.\n\nWith 3 scales per octave, k = 2^(1/3) and k − 1 = 0.260. After every octave the image is halved, so the cost stays low.'),
    LS('The SIFT pipeline', '1. **Detect**: find points that are larger or smaller than all **26 neighbours** in the 3×3×3 (x, y, scale) neighbourhood of the DoG stack.\n2. **Refine**: fit a quadratic for sub-pixel, sub-scale position; drop low-contrast points (|D| < 0.03) and edge responses (Hessian ratio test, like Harris).\n3. **Orientation**: histogram of gradient directions around the point (36 bins); the peak becomes the keypoint angle, so the descriptor can be rotated to a canonical frame.\n4. **Describe**: a 16×16 window split into 4×4 cells, an 8-bin orientation histogram per cell → **128 numbers**, normalised, clipped at 0.2, renormalised for illumination robustness.\n\nThe example builds a DoG stack by hand and finds 35 extrema in the middle scales of the first octave; cv2.SIFT finds 335 keypoints across all octaves, each with a 128-float descriptor (and position, size and angle).', PX('e_dog')),
    MC('How many neighbours does SIFT compare a DoG sample with to decide it is an extremum?', ['26', '8', '9', '18'], '8 in its own scale + 9 in the scale above + 9 in the scale below = 26.', 'A 3×3×3 cube minus the centre.'),
    NU('With 3 intervals per octave, what is the scale ratio k between neighbouring DoG levels? (3 decimals)', 1.26, 'k = 2^(1/3) = 1.260: three steps double σ.', 'Three multiplications by k should give 2.', { tol: 0.001 }),
    TF('SIFT descriptors are 128 numbers: 4×4 cells × 8 orientation bins.', true, '16 cells × 8 bins = 128.', 'Multiply.'),
    MC('Why does SIFT rotate the descriptor window to the keypoint’s dominant orientation?', ['so the same point gives the same descriptor when the image is rotated', 'to make it faster', 'to find more keypoints', 'to remove noise'], 'Measuring gradients relative to the dominant direction makes the descriptor rotation-invariant.', 'What changes when the camera rolls?')
  ]),
  lesson('u5l2', 'ORB, descriptors and matching', REF.feat, [
    LS('Binary descriptors', '**ORB** (Oriented FAST and Rotated BRIEF, 2011) is the fast, patent-free workhorse:\n\n- **FAST** corners: a pixel is a corner if a contiguous arc of 9+ of the 16 pixels on a circle around it are all brighter (or all darker) than it by a threshold. Scored with Harris, over an image pyramid for scale.\n- **Orientation** from the intensity centroid of the patch.\n- **rBRIEF** descriptor: 256 pairwise intensity comparisons (p < q → bit 1) at learned, rotated sample positions → **256 bits = 32 bytes**.\n\nBinary descriptors are compared with the **Hamming distance**: XOR then popcount. That is one or two instructions per 64 bits, far faster than the Euclidean distance between 128 floats.'),
    LS('Walk-through: matching and the ratio test', 'Brute-force matching finds, for each descriptor in image 1, its nearest neighbour in image 2. Many nearest neighbours are wrong: repeated texture, occlusion, points that are not in the other image at all.\n\n**Lowe’s ratio test**: keep a match only if its distance is clearly smaller than the second-best distance (d₁ < 0.75·d₂). An ambiguous point, with two similar candidates, is dropped.\n\nThe example warps a texture with a known homography so every match can be checked:\n\n- ORB gives 450 descriptors of shape (32,) uint8;\n- a from-scratch Hamming matcher (np.unpackbits of XOR) gives the same best distances as `cv2.BFMatcher(NORM_HAMMING)`;\n- all 450 matches: only **61%** correct; after the ratio test 195 remain, of which **191** are correct (98%).', PX('e_match')),
    P('Hamming distance between two descriptor bytes. What prints?', C`unsigned a = 0xB4, b = 0x3C;   /* 1011 0100 vs 0011 1100 */
printf("%d\n", __builtin_popcount(a ^ b));`, '2', ['4', '1', '3'], 'XOR = 1000 1000: the bytes differ in 2 bits, so the Hamming distance is 2.'),
    MC('Why compare ORB descriptors with Hamming distance rather than Euclidean?', ['they are bit strings; XOR + popcount counts differing bits very fast', 'Euclidean distance is undefined for integers', 'Hamming is more accurate for floats', 'OpenCV forbids Euclidean'], 'Each bit is an independent binary test; the number of differing tests is the natural distance, and hardware popcount makes it cheap.', 'What does each bit represent?'),
    NU('The best match has distance 30 and the second best 36. With ratio threshold 0.75, is it kept? Answer 1 for yes, 0 for no.', 0, '30/36 = 0.833 > 0.75, so the match is ambiguous and is dropped.', 'Keep only if d₁/d₂ < 0.75.'),
    TF('The ratio test can remove correct matches as well as wrong ones.', true, 'A correct match on repeated texture can have a close second best. The example kept 195 of 450, losing some correct ones, but raised precision from 61% to 98%.', 'It is a trade-off.')
  ]),
  lesson('u5l3', 'RANSAC: robust fitting', REF.feat, [
    LS('Least squares fails with outliers', 'Fit a model (a line, a homography) to matched points by least squares and one wild match can drag the answer anywhere: the squared error of an outlier 100 px away outweighs a hundred inliers 1 px away. In the example, least squares over all matches — 40% of them deliberately wrong — gives a homography whose maximum error is **63 223 px**.\n\n**RANSAC** (random sample consensus, 1981):\n\n1. pick the **minimal sample** at random (2 points for a line, 4 for a homography);\n2. fit the model to just those;\n3. count **inliers**: points whose error is below a threshold;\n4. repeat; keep the model with the most inliers;\n5. refit by least squares on all of its inliers.'),
    LS('How many iterations?', 'If a fraction w of the data are inliers and the sample size is s, one random sample is all-inlier with probability wˢ. To succeed at least once with probability p you need\n\n**N = log(1 − p) / log(1 − wˢ)**\n\nWalk-through for the example: s = 4, 40% outliers so w = 0.6, wˢ = 0.1296, p = 0.99: N = log(0.01)/log(0.8704) = −4.605/−0.1389 = 33.2 → **34** iterations. With 70% outliers the same formula needs 567: RANSAC gets expensive fast when inliers are rare, which is why we filter with the ratio test first.\n\nResult: from-scratch RANSAC finds all **66** true inliers with a maximum error of 0.61 px, and `cv2.findHomography(..., cv2.RANSAC)` agrees within 0.45 px on the inliers.', PX('e_ransac')),
    NU('Fitting a line (s = 2) with 50% outliers, how many RANSAC iterations give p = 0.99? (round up)', 17, 'w² = 0.25; N = log(0.01)/log(0.75) = −4.605/−0.2877 = 16.01 → 17.', 'N = log(1 − p)/log(1 − wˢ).'),
    OR('Order one RANSAC iteration.', ['draw a minimal random sample', 'fit the model to the sample', 'count points within the inlier threshold', 'keep the model if it has the most inliers so far'], 'After the loop, refit on all inliers of the best model.'),
    MC('Why does RANSAC use the minimal sample size rather than, say, 20 points?', ['the chance that all sampled points are inliers falls as wˢ; small s means far fewer iterations', 'larger samples are less accurate', 'homographies need exactly 20 points', 'to save memory'], 'With w = 0.6, s = 4 gives 0.13 per draw; s = 20 gives 3.7e−5.', 'Look at wˢ.'),
    TF('A larger inlier threshold always gives a better RANSAC model.', false, 'Too large and outliers count as inliers, biasing the final fit; too small and true inliers with noise are rejected. Set it from the expected noise (often 1–3 px).', 'Think about what gets counted.')
  ])
]);

unit('u6', 6, 'seg', 'imm', 'Morphology and segmentation', 'Shaping binary masks, choosing thresholds, labelling blobs, and splitting an image into regions with watershed, k-means and graph cuts.', [
  lesson('u6l1', 'Mathematical morphology', REF.seg, [
    LS('Erosion and dilation', 'Morphology works on shapes in a binary (or grey) image with a small **structuring element** B (a 3×3 square, a disc, a line):\n\n- **Erosion** A ⊖ B keeps a pixel only if B, centred there, fits entirely inside the shape. Shapes shrink by B’s radius; specks smaller than B disappear. For grey images: the minimum over the window.\n- **Dilation** A ⊕ B turns a pixel on if B touches the shape. Shapes grow; small holes and gaps fill. Grey: the maximum.\n\nCombinations:\n\n| Operation | Definition | Use |\n|---|---|---|\n| opening | erode then dilate | remove small bright specks, keep size |\n| closing | dilate then erode | fill small dark holes and gaps |\n| gradient | dilate − erode | outlines |\n| top-hat | image − opening | small bright details on uneven background |\n| black-hat | closing − image | small dark details |\n\nOpening and closing are **idempotent**: applying them twice changes nothing more.'),
    LS('Walk-through', 'The example implements erosion and dilation as the minimum and maximum over the 3×3 window (equal to cv2.erode/dilate). On a 5063-pixel mask, erosion leaves 4439 and dilation gives 5725. Then noise is added: 182 wrong pixels; an opening removes the white specks (86 left), and a following closing fills the black holes (**28** left). The morphological gradient gives a 1286-pixel outline, and opening twice equals opening once.', PX('f_morph')),
    GM('morph'), GM('erodecount'), GM('morph'),
    TF('Opening an already-opened image changes it further.', false, 'Opening is idempotent; the example checks it.', 'Remove specks once; are there any left?'),
    MC('On a grey image, dilation with a 3×3 square is the same as…', ['a 3×3 maximum filter', 'a 3×3 minimum filter', 'a 3×3 median filter', 'a 3×3 mean filter'], 'Grey dilation takes the max under the element; erosion takes the min.', 'Dilation grows bright regions.')
  ]),
  lesson('u6l2', 'Thresholding: Otsu and adaptive', REF.seg, [
    LS('Choosing a threshold automatically', 'A global threshold t splits pixels into background (≤ t) and foreground (> t). **Otsu’s method** tries every t and picks the one that maximises the **between-class variance**\n\nσ²_B(t) = ω₀ ω₁ (μ₀ − μ₁)²\n\nwhere ω are the class fractions and μ the class means — equivalently it minimises the variance inside each class. All the terms come from running sums of the histogram, so one pass over 256 bins is enough.\n\nWalk-through: on the example image the from-scratch Otsu gives **115**, the same as `cv2.threshold(..., THRESH_OTSU)`. σ²_B is 4627 at t, but lower 20 levels either side (4601, 4536): a flat-topped maximum, typical for two well-separated peaks. (The C version in Unit 19 sees an empty gap between peaks: every t in the gap scores the same, and the first maximum wins.)\n\n**Adaptive thresholding** compares each pixel with the mean (or Gaussian-weighted mean) of its own neighbourhood minus a constant C. Under a lighting gradient global Otsu misclassifies 2337 pixels and adaptive only 1013.', PX('f_otsu')),
    GM('otsuvar'), GM('otsuq'),
    MC('A receipt is photographed with a shadow across half of it. Which threshold works?', ['adaptive (local mean − C)', 'global Otsu', 'a fixed threshold of 128', 'equalise then threshold at 128'], 'One global value cannot fit both halves; local thresholds follow the lighting.', 'Does the background brightness vary?'),
    NU('ω₀ = 0.5, μ₀ = 50, μ₁ = 150. What is σ²_B?', 2500, '0.5 × 0.5 × (50 − 150)² = 0.25 × 10 000 = 2500.', 'ω₀ω₁(μ₀ − μ₁)².')
  ]),
  lesson('u6l3', 'Connected components and watershed', REF.seg, [
    LS('Labelling blobs', 'After thresholding, **connected-component labelling** gives every separate blob its own integer label, so you can count and measure them. Two pixels are connected if they are neighbours (4-connectivity: up/down/left/right; 8-connectivity: also diagonals) and both on.\n\nThe classic two-pass algorithm: scan the image, give each pixel the smallest label of its already-visited neighbours (or a new one), record label equivalences in a **union–find** structure, then relabel in a second pass. The example’s from-scratch version finds the same 4 blobs as `cv2.connectedComponentsWithStats` (which counts the background as label 0) and prints area, bounding box and centroid for each.', PX('f_cc')),
    LS('Watershed: splitting touching objects', 'Two touching discs form **one** connected component. The **watershed** transform treats an image as a landscape and floods it from markers; where floods from different markers meet it builds a dam — the boundary.\n\nThe standard recipe for touching objects:\n\n1. **distance transform** of the mask: each pixel’s distance to the background. Peaks sit at object centres (29.8 px in the example).\n2. **markers**: threshold the distance map high (e.g. > 0.6·max) and label the peaks — one seed per object.\n3. **watershed** on the negated distance (or the gradient image) from those markers. OpenCV marks the dams with −1.\n\nResult: 1 component becomes 2 regions, split along column 70 where the discs touch.', PX('f_water')),
    MC('Two coins touch in a mask. Connected components counts them as…', ['one blob', 'two blobs', 'zero blobs', 'it depends only on their colour'], 'They share pixels, so they are connected. Use distance transform + watershed (or erosion) to separate them.', 'Are their pixels connected?'),
    TF('8-connectivity can merge two diagonal blobs that 4-connectivity keeps separate.', true, 'Pixels that touch only at a corner are neighbours under 8-connectivity but not under 4.', 'Diagonal neighbours.'),
    OR('Order the watershed recipe for touching objects.', ['threshold to a binary mask', 'compute the distance transform', 'threshold its peaks and label them as markers', 'run watershed from the markers'], 'Markers must exist before flooding.')
  ]),
  lesson('u6l4', 'Clustering and graph cuts', REF.seg, [
    LS('k-means colour segmentation', '**k-means** groups pixels (as points in RGB, or RGB + position) into k clusters by alternating:\n\n1. **assign** every point to its nearest centroid;\n2. **update** every centroid to the mean of its points.\n\nEach step can only lower the sum of squared errors (SSE), so it converges — but to a **local** optimum that depends on the initial centroids. Remedies: k-means++ initialisation and several restarts, keeping the lowest SSE.\n\nWalk-through: the example clusters scene_rgb() into k = 4 with 5 restarts. One restart gets stuck at SSE 2.94e7; the other four reach 1.45e6, the same optimum as `cv2.kmeans` — centres red (210, 30, 30), yellow, green and blue. SSE versus k drops sharply up to k = 4 (4.54e7 → 1.26e7 → 1.45e6) and then slowly: the **elbow** at the true number of colours. Try the **k-means** lab.', PX('f_kmeans')),
    LS('Graph cuts and GrabCut', 'Segmentation can be posed as an energy: a **data term** (how well each pixel fits foreground or background colour models) plus a **smoothness term** (a cost for neighbouring pixels with different labels, small across strong edges). For two labels this energy is minimised **exactly** by a minimum s–t cut in a graph whose nodes are pixels — computed with max-flow.\n\n**GrabCut** (2004) starts from a user rectangle, fits Gaussian mixture colour models to inside and outside, cuts, refits, and repeats. In the example cv2.grabCut recovers the red square with IoU 1.000, and a 4-node from-scratch min cut (brute force over all labelings) finds cost 152 with labels dark, dark, bright, bright.', PX('f_grabcut')),
    MC('k-means converged but the result is poor. The most likely fix is…', ['run several random restarts (or k-means++) and keep the lowest SSE', 'run more iterations of the same start', 'use a smaller k', 'convert to greyscale'], 'Once converged, more iterations change nothing; a better optimum needs a different start.', 'Converged means stuck.'),
    TF('Each k-means iteration can only decrease or keep the SSE.', true, 'Assignment picks the nearest centroid (cannot raise the error), and the mean minimises squared error for a fixed assignment.', 'Look at both steps.'),
    MA('Match the segmentation method to its idea.', [['Otsu', 'one global threshold from the histogram'], ['watershed', 'flooding from markers'], ['k-means', 'nearest-centroid clustering of colours'], ['GrabCut', 'min-cut with colour models and smoothness']], 'Different assumptions: two populations, basins, colour clusters, or an energy with edges.'),
    GM('pickmethod')
  ])
]);
