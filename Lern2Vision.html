<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Lern2Vision</title>
<meta name="description" content="Lern2Vision: computer vision from the pixel up. Image formation and camera models, colour, sampling, histograms, convolution and the Fourier domain, edges, corners, SIFT/ORB features and RANSAC, morphology and segmentation, Hough and contours, homographies and stitching, calibration, stereo, epipolar geometry, structure from motion, optical flow, tracking, HOG and Viola-Jones, then machine learning and CNNs built from scratch in NumPy (forward and backward by hand), architectures from LeNet to ResNet and ViT, detection, segmentation and pose, self-supervised learning, CLIP, GANs, diffusion, 3D vision and NeRF, evaluation and bias, and embedded deployment with int8 and NEON C. Every Python and C example is run for real and checked against OpenCV and NumPy.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;500;700&family=Bricolage+Grotesque:wght@600;700;800&display=swap">
<style>
/* base.css — layout and components shared by every course: one mobile-first column that widens on tablets
   and PCs, a lesson path, a bottom tab bar and a full-screen lesson player. Colours and display fonts come
   from each course's theme.css (tokens only); sizes scale with the Display setting (CSS zoom on body). */
:root {
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 12px;
  --nav-h: 62px;
  --zoom: 1;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
code, .mono { font-family: var(--font-mono); font-size: .92em; }
code { background: var(--line-2); padding: .05em .35em; border-radius: 5px; white-space: nowrap; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.15; text-wrap: balance; margin: 0; letter-spacing: .01em; }
p { margin: 0; }
a { color: var(--brand); }
.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); }
.small { font-size: 13px; }
.tnum { font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.grow { flex: 1; min-width: 0; }
.eyebrow { font-family: var(--font-display); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }

/* field colour chips */
.fc { font-family: var(--font-mono); font-size: .85em; padding: .05em .4em; border-radius: 5px; white-space: nowrap; font-weight: 500; }
.fc-op { background: var(--f-op-2); color: var(--f-op); } .fc-rd { background: var(--f-rd-2); color: var(--f-rd); }
.fc-f3 { background: var(--f-f3-2); color: var(--f-f3); } .fc-rs1 { background: var(--f-rs1-2); color: var(--f-rs1); }
.fc-rs2 { background: var(--f-rs2-2); color: var(--f-rs2); } .fc-f7 { background: var(--f-f7-2); color: var(--f-f7); }
.fc-imm { background: var(--f-imm-2); color: var(--f-imm); }

/* ---------- shell ---------- */
.shell { min-height: 100%; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface);
  border-bottom: 1px solid var(--line-2);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.topbar-in { max-width: 720px; margin: 0 auto; height: 54px; display: flex; align-items: center; gap: 12px; }
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--font-display); font-weight: 800; font-size: 21px; letter-spacing: .02em; white-space: nowrap; min-width: 0; }
.brand-mark { width: 26px; height: 26px; }
.brand small { font-family: var(--font-mono); font-size: 10.5px; font-weight: 500; color: var(--ink-3); letter-spacing: .04em; margin-left: 2px; }
.top-stats { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.pill { display: inline-flex; align-items: center; gap: 5px; height: 30px; padding: 0 10px; border-radius: 999px; background: var(--card); border: 1px solid var(--line-2); font-weight: 700; font-size: 13.5px; font-variant-numeric: tabular-nums; }
.pill svg { width: 16px; height: 16px; }
.pill.gold { color: var(--gold); }
.pill.hot { color: var(--f-f3); }
.main {
  flex: 1; width: 100%; max-width: 720px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom, 0px));
}
.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--line-2);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px));
}
.nav-in { max-width: 720px; margin: 0 auto; height: var(--nav-h); display: grid; grid-template-columns: repeat(5, 1fr); }
.nav button { background: none; border: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--ink-3); font-size: 11.5px; font-weight: 700; letter-spacing: .02em; border-radius: 10px; }
.nav button svg { width: 24px; height: 24px; }
.nav button[aria-current="page"] { color: var(--brand); }
.nav button[aria-current="page"] svg { filter: drop-shadow(0 2px 6px color-mix(in srgb, var(--brand) 40%, transparent)); }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 18px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--card); font-weight: 700; letter-spacing: .01em;
  box-shadow: 0 2px 0 var(--line); transition: transform .08s ease, box-shadow .08s ease, background .15s;
}
.btn:active { transform: translateY(2px); box-shadow: 0 0 0 var(--line); }
.btn.primary { background: var(--brand); color: var(--brand-ink); border-color: transparent; box-shadow: 0 3px 0 color-mix(in srgb, var(--brand) 55%, #000); }
.btn.primary:active { box-shadow: 0 0 0 transparent; }
.btn.gold { background: var(--gold); color: var(--gold-ink); border-color: transparent; box-shadow: 0 3px 0 color-mix(in srgb, var(--gold) 55%, #000); }
.btn.ok { background: var(--ok); color: #fff; border-color: transparent; box-shadow: 0 3px 0 color-mix(in srgb, var(--ok) 55%, #000); }
.btn.bad { background: var(--bad); color: #fff; border-color: transparent; box-shadow: 0 3px 0 color-mix(in srgb, var(--bad) 55%, #000); }
.btn.ghost { background: transparent; box-shadow: none; border-color: var(--line); }
.btn.small { min-height: 36px; padding: 0 12px; font-size: 13.5px; border-radius: 10px; }
.btn.wide { width: 100%; }
.btn[disabled] { opacity: .45; cursor: not-allowed; transform: none; }
.iconbtn { width: 40px; height: 40px; border-radius: 10px; border: 0; background: transparent; display: grid; place-items: center; color: var(--ink-2); }
.iconbtn svg { width: 22px; height: 22px; }

/* ---------- learn path ---------- */
.hello { display: flex; gap: 14px; align-items: center; margin-bottom: 18px; }
.goal-ring { width: 54px; height: 54px; flex: none; }
.hello h1 { font-size: 22px; }
.unit { margin: 0 0 30px; }
.unit-head {
  position: relative; border-radius: 16px; padding: 16px 16px 14px; color: var(--ink); background: var(--card);
  border: 1px solid var(--line-2); overflow: hidden; box-shadow: var(--shadow);
}
.unit-head::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 6px; background: var(--uc); }
.unit-head .eyebrow { color: var(--uc); }
.unit-head h2 { font-size: 21px; margin: 4px 0 4px; }
.unit-head p { color: var(--ink-2); font-size: 14px; max-width: 60ch; }
.unit-meter { display: flex; align-items: center; gap: 10px; margin-top: 10px; font-size: 12.5px; color: var(--ink-3); font-weight: 700; }
.meter { flex: 1; height: 8px; border-radius: 99px; background: var(--line-2); overflow: hidden; }
.meter > i { display: block; height: 100%; background: var(--gold); border-radius: 99px; transition: width .4s ease; }
.die-stamp { position: absolute; right: 12px; top: 12px; font-family: var(--font-mono); font-size: 10px; color: var(--ink-3); letter-spacing: .06em; text-align: right; line-height: 1.3; }
.path { position: relative; margin: 6px auto 0; width: 100%; max-width: 360px; }
.path svg.trace { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.node-wrap { position: absolute; width: 136px; margin-left: -68px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.node {
  width: 64px; height: 64px; border-radius: 16px; border: 2px solid var(--line); background: var(--card); display: grid; place-items: center;
  box-shadow: 0 4px 0 var(--line); transition: transform .1s; position: relative; color: var(--ink-3);
}
.node svg { width: 28px; height: 28px; }
.node:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.node.done { background: var(--gold); border-color: transparent; color: var(--gold-ink); box-shadow: 0 4px 0 color-mix(in srgb, var(--gold) 55%, #000); }
.node.current { background: var(--brand); border-color: transparent; color: var(--brand-ink); box-shadow: 0 4px 0 color-mix(in srgb, var(--brand) 55%, #000); }
.node.current::after { content: ""; position: absolute; inset: -9px; border-radius: 22px; border: 3px solid var(--brand); opacity: .5; animation: ring 1.8s ease-out infinite; }
.node.locked { opacity: .55; cursor: not-allowed; }
.node.check { width: 78px; border-radius: 20px; }
.node-label { font-size: 12px; font-weight: 700; text-align: center; line-height: 1.2; color: var(--ink-2); max-width: 136px; text-wrap: balance; }
.node-stars { display: flex; gap: 1px; height: 12px; }
.node-stars svg { width: 12px; height: 12px; color: var(--gold); }
.start-tip { position: absolute; top: -30px; background: var(--card); border: 2px solid var(--brand); color: var(--brand); font-weight: 800; font-size: 12px; padding: 2px 10px; border-radius: 8px; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; animation: bob 1.6s ease-in-out infinite; }
@keyframes ring { 0% { transform: scale(.9); opacity: .6; } 100% { transform: scale(1.15); opacity: 0; } }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }

/* ---------- player ---------- */
.player { position: fixed; inset: 0; z-index: 60; background: var(--bg); display: flex; flex-direction: column; }
.p-top {
  flex: none; display: flex; align-items: center; gap: 10px; height: 56px; background: var(--bg);
  padding-top: env(safe-area-inset-top, 0px); box-sizing: content-box;
  padding-left: max(10px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.p-progress { flex: 1; height: 14px; border-radius: 99px; background: var(--line-2); overflow: hidden; }
.p-progress > i { display: block; height: 100%; background: var(--gold); border-radius: 99px; transition: width .35s ease; box-shadow: inset 0 -4px 0 rgba(0,0,0,.08), inset 0 3px 0 rgba(255,255,255,.35); }
.combo { font-family: var(--font-display); font-weight: 700; color: var(--f-f3); font-size: 15px; min-width: 38px; text-align: right; font-variant-numeric: tabular-nums; }
.p-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.p-body-in {
  max-width: 680px; margin: 0 auto; padding-block: 8px 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 16px;
}
.p-foot {
  flex: none; border-top: 1px solid var(--line-2); background: var(--surface); position: relative;
  padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.p-foot-in { max-width: 680px; margin: 0 auto; display: flex; gap: 10px; }
.p-foot-in .btn { flex: 1; }
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; transform: translateY(102%); transition: transform .25s cubic-bezier(.2,.8,.2,1);
  padding-block: 14px calc(12px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-top: 2px solid; max-height: calc(62vh / var(--zoom, 1)); overflow-y: auto;
}
.sheet.show { transform: translateY(0); }
.sheet.ok { background: var(--ok-2); border-color: var(--ok); }
.sheet.bad { background: var(--bad-2); border-color: var(--bad); }
.sheet-in { max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
.sheet h3 { font-size: 20px; display: flex; align-items: center; gap: 8px; }
.sheet.ok h3 { color: var(--ok); } .sheet.bad h3 { color: var(--bad); }
.sheet .why { color: var(--ink); font-size: 14.5px; }
.sheet .answer { font-size: 14px; color: var(--ink); }
.sheet .answer b { color: var(--bad); }
.kind-tag { font-family: var(--font-display); font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
.qtext { font-size: 18px; font-weight: 700; line-height: 1.38; }
.qtext code { font-size: .86em; white-space: normal; overflow-wrap: anywhere; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.learn h2 { font-size: 23px; }
.learn .body { font-size: 15.5px; color: var(--ink); display: flex; flex-direction: column; gap: 10px; }
.learn .body ul, .learn .body ol { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 4px; }
.learn .body ol li::marker { font-weight: 700; color: var(--brand); }
.body pre.code { margin: 2px 0; }
.spec {
  display: flex; gap: 8px; align-items: flex-start; font-size: 12.5px; color: var(--ink-2); background: var(--surface); border: 1px dashed var(--line);
  border-radius: 10px; padding: 8px 10px;
}
.spec svg { flex: none; width: 16px; height: 16px; margin-top: 2px; color: var(--ink-3); }
.hint { font-size: 13px; color: var(--ink-3); }
.shake { animation: shake .35s; }
@keyframes shake { 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }
.pop { animation: pop .3s; }
@keyframes pop { 50% { transform: scale(1.04); } }

/* ---------- exercise widgets ---------- */
.opts { display: grid; gap: 10px; }
.opts.two { grid-template-columns: 1fr 1fr; }
.opt {
  text-align: left; min-height: 50px; padding: 11px 14px; border-radius: 12px; border: 2px solid var(--line); background: var(--card);
  box-shadow: 0 3px 0 var(--line); font-size: 15px; display: flex; gap: 10px; align-items: center; line-height: 1.35;
}
.opt .k { flex: none; width: 24px; height: 24px; border-radius: 7px; border: 1.5px solid var(--line); display: grid; place-items: center; font-size: 12px; font-weight: 700; color: var(--ink-3); font-family: var(--font-mono); }
.opt[aria-pressed="true"] { border-color: var(--brand); background: var(--brand-2); box-shadow: 0 3px 0 var(--brand); }
.opt[aria-pressed="true"] .k { border-color: var(--brand); color: var(--brand); }
.opt.right { border-color: var(--ok); background: var(--ok-2); box-shadow: 0 3px 0 var(--ok); }
.opt.wrong { border-color: var(--bad); background: var(--bad-2); box-shadow: 0 3px 0 var(--bad); }
.opt:disabled { cursor: default; }
.opt code { white-space: normal; overflow-wrap: anywhere; }
.tfrow { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tfrow .opt { justify-content: center; font-weight: 700; font-size: 17px; min-height: 64px; }
.numwrap { display: flex; gap: 10px; align-items: center; }
.num {
  flex: 1; min-width: 0; height: 54px; border-radius: 12px; border: 2px solid var(--line); background: var(--card); padding: 0 14px;
  font-family: var(--font-mono); font-size: 20px; font-weight: 500;
}
.num:focus { border-color: var(--brand); outline: none; }
.num.right { border-color: var(--ok); background: var(--ok-2); } .num.wrong { border-color: var(--bad); background: var(--bad-2); }
.unit-label { font-weight: 700; color: var(--ink-2); }
.bits { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; }
.bitgrp { display: flex; gap: 3px; }
.bit {
  width: 34px; height: 44px; border-radius: 9px; border: 2px solid var(--line); background: var(--card); font-family: var(--font-mono);
  font-size: 18px; font-weight: 700; display: grid; place-items: center; color: var(--ink-3); box-shadow: 0 3px 0 var(--line); position: relative;
}
.bit.on { background: var(--brand); color: var(--brand-ink); border-color: transparent; box-shadow: 0 3px 0 color-mix(in srgb, var(--brand) 55%, #000); }
.bit small { position: absolute; top: -17px; font-size: 10px; color: var(--ink-3); font-weight: 500; }
.bit.locked { opacity: .5; cursor: default; }
.bits.dense .bit { width: 22px; height: 34px; font-size: 14px; border-radius: 6px; }
.bits.dense .bit small { font-size: 9px; top: -15px; }
.bitval { text-align: center; font-family: var(--font-mono); font-size: 14px; color: var(--ink-2); margin-top: 6px; }
.chipbank, .slots { display: flex; flex-wrap: wrap; gap: 8px; }
.slots { min-height: 56px; padding: 10px; border-radius: 12px; border: 2px dashed var(--line); background: var(--surface); }
.slots.vertical { flex-direction: column; }
.chip {
  border: 2px solid var(--line); background: var(--card); border-radius: 10px; padding: 8px 12px; font-weight: 700; font-size: 14.5px;
  box-shadow: 0 3px 0 var(--line); text-align: left; line-height: 1.3;
}
.chip.used { visibility: hidden; }
.chip.placed { border-color: var(--brand); background: var(--brand-2); box-shadow: 0 3px 0 var(--brand); }
.chip.right { border-color: var(--ok); background: var(--ok-2); box-shadow: 0 3px 0 var(--ok); }
.chip.wrong { border-color: var(--bad); background: var(--bad-2); box-shadow: 0 3px 0 var(--bad); }
.chip code { white-space: normal; }
.slot-n { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 6px; background: var(--brand); color: var(--brand-ink); font-size: 11px; margin-right: 6px; font-family: var(--font-mono); }
.match { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.match .col { display: flex; flex-direction: column; gap: 8px; }
.match .chip { width: 100%; min-height: 46px; }
.match .chip.sel { border-color: var(--brand); background: var(--brand-2); box-shadow: 0 3px 0 var(--brand); }
.match .chip.done { opacity: .35; border-color: var(--ok); cursor: default; }
.fill { font-size: 17px; line-height: 2.3; font-weight: 600; }
.blank { display: inline-flex; min-width: 70px; height: 36px; padding: 0 10px; align-items: center; justify-content: center; border-radius: 9px; border: 2px dashed var(--brand); background: var(--brand-2); color: var(--brand); font-family: var(--font-mono); font-size: 15px; vertical-align: middle; margin: 0 2px; }
.blank.empty { color: transparent; }
.blank.right { border-style: solid; border-color: var(--ok); background: var(--ok-2); color: var(--ok); }
.blank.wrong { border-style: solid; border-color: var(--bad); background: var(--bad-2); color: var(--bad); }
.sig-list { display: flex; flex-direction: column; gap: 8px; }
.sig { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.sig .nm { font-family: var(--font-mono); font-weight: 700; font-size: 13.5px; width: 76px; }
.seg { display: inline-flex; border: 2px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--card); flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 7px 11px; font-weight: 700; font-size: 13.5px; font-family: var(--font-mono); color: var(--ink-2); border-right: 1px solid var(--line-2); min-height: 36px; }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--brand); color: var(--brand-ink); }
.seg.text button { font-family: var(--font-body); }
.seg.right { border-color: var(--ok); } .seg.wrong { border-color: var(--bad); }
.splitter { display: flex; flex-direction: column; gap: 10px; }
.split-ctl { display: flex; align-items: center; gap: 10px; }
.split-ctl .nm { width: 64px; font-weight: 700; }
.stepper { display: inline-flex; align-items: center; border: 2px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--card); }
.stepper button { width: 40px; height: 38px; border: 0; background: transparent; font-size: 20px; font-weight: 700; color: var(--ink-2); }
.stepper span { min-width: 40px; text-align: center; font-family: var(--font-mono); font-weight: 700; font-size: 16px; }
.hotspot-hint { font-size: 13px; color: var(--ink-3); text-align: center; }

/* ---------- figures ---------- */
.fig { margin: 0; display: flex; flex-direction: column; gap: 8px; }
.fig-box { background: var(--card); border: 1px solid var(--line-2); border-radius: 14px; padding: 12px; overflow-x: auto; }
.fig-box.flush { padding: 0; }
.fig svg { display: block; width: 100%; height: auto; max-width: 600px; margin: 0 auto; overflow: visible; }
.fig svg.wide { min-width: 340px; }
.fig figcaption { font-size: 13px; color: var(--ink-2); padding: 0 2px; }
.fig .ctl { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; margin-top: 10px; }
.fig .readout { text-align: center; font-size: 13px; color: var(--ink-2); margin-top: 8px; }
.svg-hot { cursor: pointer; }
/* drawings set their colours inline, so the interaction states must win with !important */
.svg-hot:hover rect, .svg-hot:hover path, .svg-hot:hover circle, .svg-hot:hover polygon { stroke: var(--brand) !important; }
.svg-hot.picked rect, .svg-hot.picked path, .svg-hot.picked polygon, .svg-hot.picked circle { stroke: var(--brand) !important; stroke-width: 3 !important; }
.svg-hot.right rect, .svg-hot.right path, .svg-hot.right polygon, .svg-hot.right circle { stroke: var(--ok) !important; stroke-width: 3 !important; }
.svg-hot.wrong rect, .svg-hot.wrong path, .svg-hot.wrong polygon, .svg-hot.wrong circle { stroke: var(--bad) !important; stroke-width: 3 !important; }
.svg-hot.picked, .svg-hot.right, .svg-hot.wrong { opacity: 1 !important; }
.flow-dash { stroke-dasharray: 6 5; animation: flow 1s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -11; } }
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line-2); border-radius: 12px; background: var(--card); }
table.t { border-collapse: collapse; width: 100%; font-size: 13.5px; }
table.t th, table.t td { padding: 7px 10px; border-bottom: 1px solid var(--line-2); text-align: left; vertical-align: top; }
table.t th { font-family: var(--font-display); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); background: var(--surface); position: sticky; top: 0; white-space: nowrap; }
table.t tr:last-child td { border-bottom: 0; }
table.t td.mono, table.t td code { font-family: var(--font-mono); font-size: 12.5px; }
table.t tr.hl td { background: var(--gold-2); }
table.t tr.dim td { opacity: .45; }

/* ---------- end screen ---------- */
.done-screen { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center; padding: 24px 16px; }

.done-tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; width: 100%; max-width: 420px; }
.tile { border-radius: 14px; border: 2px solid var(--line-2); background: var(--card); padding: 10px 8px; }
.tile .v { font-family: var(--font-display); font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
.tile .l { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); }
.tile.gold .v { color: var(--gold); } .tile.ok .v { color: var(--ok); } .tile.brand .v { color: var(--brand); }
.big-stars { display: flex; gap: 6px; }
.big-stars svg { width: 44px; height: 44px; color: var(--line); }
.big-stars svg.on { color: var(--gold); animation: pop .4s backwards; }

/* ---------- sections, cards ---------- */
.section-title { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 6px 0 12px; }
.section-title h2 { font-size: 22px; }
.cards { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); }
.card {
  background: var(--card); border: 1px solid var(--line-2); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 8px;
  box-shadow: var(--shadow); min-width: 0;
}
button.card { text-align: left; cursor: pointer; }
.card h3 { font-size: 17px; }
.card .ic { width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center; background: var(--brand-2); color: var(--brand); flex: none; }
.card .ic svg { width: 22px; height: 22px; }
.card-row { display: flex; gap: 12px; align-items: center; }
.tag { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 6px; font-size: 11.5px; font-weight: 700; background: var(--line-2); color: var(--ink-2); letter-spacing: .02em; }
.tag.gold { background: var(--gold-2); color: var(--gold); }
.tag.ok { background: var(--ok-2); color: var(--ok); }
.tag.brand { background: var(--brand-2); color: var(--brand); }
.back { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; color: var(--ink-2); font-weight: 700; padding: 6px 0; margin-bottom: 6px; }
.back svg { width: 18px; height: 18px; }
.lab-head { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.lab-head h2 { font-size: 24px; }
.panel { background: var(--card); border: 1px solid var(--line-2); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.build-list { display: grid; gap: 8px; }
@media (min-width: 760px) { .build-list { grid-template-columns: 1fr 1fr; } }
.build-item { background: var(--card); border: 1px solid var(--line-2); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.build-item h4 { margin: 0; font-size: 15px; }
.bl-row { display: flex; gap: 10px; font-size: 13.5px; line-height: 1.4; min-width: 0; }
.bl-k { flex: none; width: 46px; padding-top: 2px; font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.panel h3 { font-size: 15px; letter-spacing: .02em; }
.ctrl-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.ctrl-row label { font-size: 13px; font-weight: 700; color: var(--ink-2); }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field > span { font-size: 12px; font-weight: 700; color: var(--ink-3); letter-spacing: .04em; text-transform: uppercase; }
select.sel, input.txt {
  height: 40px; border-radius: 10px; border: 2px solid var(--line); background: var(--card); padding: 0 10px; font-weight: 700; font-size: 14px; min-width: 0;
}
input.txt { font-family: var(--font-mono); font-weight: 500; }
textarea.code {
  width: 100%; min-height: 170px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); padding: 10px 12px;
  font-family: var(--font-mono); font-size: 13px; line-height: 1.55; resize: vertical; white-space: pre; overflow-x: auto;
}
textarea.code:focus, select.sel:focus, input.txt:focus { border-color: var(--brand); outline: none; }
.err { color: var(--bad); font-size: 13px; font-weight: 700; }
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line-2); border-radius: 12px; padding: 8px 10px; }
.stat .v { font-family: var(--font-display); font-weight: 700; font-size: 20px; font-variant-numeric: tabular-nums; }
.stat .l { font-size: 11px; font-weight: 700; color: var(--ink-3); text-transform: uppercase; letter-spacing: .06em; }
.stat.good .v { color: var(--ok); } .stat.warnc .v { color: var(--f-rs2); } .stat.badc .v { color: var(--bad); }
.notes { display: flex; flex-direction: column; gap: 8px; }
.note { display: flex; gap: 8px; font-size: 13.5px; padding: 8px 10px; border-radius: 10px; background: var(--surface); border-left: 4px solid var(--line); }
.note.warn { border-left-color: var(--f-rs2); } .note.good { border-left-color: var(--ok); } .note.fix { border-left-color: var(--brand); } .note.info { border-left-color: var(--ink-3); }
.scrub { width: 100%; accent-color: var(--brand); }
.toggle { position: relative; width: 50px; height: 30px; flex: none; }
.toggle input { opacity: 0; position: absolute; inset: 0; margin: 0; cursor: pointer; z-index: 1; }
.toggle i { position: absolute; inset: 0; border-radius: 99px; background: var(--line); transition: background .15s; }
.toggle i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--card); transition: transform .15s; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
.toggle input:checked + i { background: var(--brand); }
.toggle input:checked + i::after { transform: translateX(20px); }
.toggle input:focus-visible + i { outline: 2px solid var(--brand); outline-offset: 2px; }
.setting { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line-2); }
.setting:last-child { border-bottom: 0; }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 10px; }
.badge { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; font-size: 12px; font-weight: 700; color: var(--ink-2); }
.badge .b { width: 62px; height: 62px; }
.badge.off { opacity: .4; filter: grayscale(1); }
.search { width: 100%; height: 44px; border-radius: 12px; border: 2px solid var(--line); background: var(--card); padding: 0 14px; font-size: 15px; }
.search:focus { border-color: var(--brand); outline: none; }
.gloss dt { font-weight: 700; font-family: var(--font-display); font-size: 16px; }
.gloss dd { margin: 2px 0 12px; color: var(--ink-2); font-size: 14px; }
.reg-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.reg { border-radius: 9px; padding: 6px 4px; text-align: center; border: 1px solid var(--line-2); background: var(--surface); font-family: var(--font-mono); font-size: 12px; line-height: 1.25; min-width: 0; }
.reg b { display: block; font-size: 13px; }
.reg.changed { background: var(--gold-2); border-color: var(--gold); }
.toast { position: fixed; left: 50%; bottom: calc(var(--nav-h) + 18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px); opacity: 0; transition: all .25s; z-index: 90; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 700; font-size: 14px; pointer-events: none; max-width: calc(100% - 32px); text-align: center; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.confirm { display: flex; flex-direction: column; gap: 10px; padding: 12px; border: 2px solid var(--bad); border-radius: 12px; background: var(--bad-2); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12px; color: var(--ink-2); justify-content: center; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.cyclebar { display: flex; align-items: center; gap: 8px; }
.cyclebar .btn { min-height: 36px; padding: 0 10px; }
.timeline { display: flex; flex-wrap: wrap; gap: 3px; }
.timeline i { width: 16px; height: 22px; border-radius: 4px; display: grid; place-items: center; font-style: normal; font-size: 10px; font-weight: 700; font-family: var(--font-mono); }
.timeline i.ok { background: var(--ok-2); color: var(--ok); } .timeline i.no { background: var(--bad-2); color: var(--bad); }
.timeline i.cur { outline: 2px solid var(--brand); }

@media (min-width: 900px) {
  .main { max-width: 860px; }
  .topbar-in, .nav-in { max-width: 860px; }
  .two-col { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; align-items: start; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
.part-head { margin: 28px 0 16px; padding: 12px 14px; border-radius: 12px; background: var(--surface); border: 1px dashed var(--line); display: flex; flex-direction: column; gap: 4px; }
.part-head .eyebrow { color: var(--brand); font-size: 13px; }
.node-stars svg.off { color: var(--line); }
.console { background: var(--term-bg); color: var(--term-ink); border: 1px solid var(--line); border-radius: 12px; padding: 12px; font-family: var(--font-mono); font-size: 12px; line-height: 1.5; white-space: pre; overflow-x: auto; min-height: 64px; max-height: 280px; overflow-y: auto; }
.console .cursor { display: inline-block; width: 8px; height: 15px; background: var(--gold); vertical-align: -2px; animation: blink 1s steps(2) infinite; }
@keyframes blink { to { opacity: 0; } }
pre.code { margin: 0; background: var(--surface); border: 1px solid var(--line-2); border-radius: 12px; padding: 10px 12px; font-family: var(--font-mono); font-size: 12px; line-height: 1.5; overflow-x: auto; max-height: 320px; tab-size: 4; }
.banner { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 12px; font-weight: 700; font-size: 14px; }
.banner svg { width: 20px; height: 20px; flex: none; }
.banner.pass { background: var(--ok-2); color: var(--ok); } .banner.fail { background: var(--bad-2); color: var(--bad); } .banner.info { background: var(--brand-2); color: var(--brand); } .banner.warn { background: var(--gold-2); color: var(--gold); }
.evlist { display: flex; flex-direction: column; gap: 6px; max-height: 280px; overflow-y: auto; }
.ev { display: flex; gap: 8px; align-items: baseline; font-size: 13px; padding: 6px 8px; border-radius: 8px; background: var(--surface); }
.ev .n { font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); min-width: 44px; }
.ev .m { font-family: var(--font-mono); font-size: 11.5px; font-weight: 700; padding: 1px 6px; border-radius: 5px; white-space: nowrap; }
.mode-M { background: var(--f-f3-2); color: var(--f-f3); } .mode-S { background: var(--f-rs1-2); color: var(--f-rs1); } .mode-U { background: var(--f-rd-2); color: var(--f-rd); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { border: 1.5px solid var(--line); background: var(--card); border-radius: 8px; padding: 5px 9px; font-family: var(--font-mono); font-size: 12.5px; font-weight: 500; }
.chips button[aria-pressed="true"] { border-color: var(--brand); background: var(--brand-2); color: var(--brand); }
.tile-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px; }
.kv dt { color: var(--ink-3); font-weight: 700; }
.kv dd { margin: 0; font-family: var(--font-mono); }
.btn svg { width: 18px; height: 18px; flex: none; }
.sheet h3 svg { width: 24px; height: 24px; flex: none; }
.bits { padding-top: 16px; }
.fig pre.code { max-height: none; }
.hl-line { display: block; background: var(--gold-2); margin: 0 -12px; padding: 0 12px; }
.plain-line { display: block; }
/* program source under a firmware run */
.src-details { margin-top: 8px; }
.src-details > summary { cursor: pointer; font-weight: 700; font-size: 13px; color: var(--brand); padding: 6px 0; list-style-position: inside; }
.fig .src-details pre.code { max-height: 420px; overflow: auto; margin-top: 6px; }

/* ---------- lab widgets ---------- */
.stats.tight { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 6px; }
.stats.tight .stat .v { font-size: 17px; }
.stats.tight .stat .l { letter-spacing: .04em; }
.slider { display: flex; flex-direction: column; gap: 2px; min-width: 0; }

.studio-h { font-size: 18px; margin-top: 8px; }
.ev .m.ev-thermal { background: var(--gold-2); color: var(--gold); }
.ev .m.ev-error { background: var(--bad-2); color: var(--bad); }
.ref-figure { margin-top: 4px; }

@media (max-width: 440px) { .brand small { display: none; } .brand { font-size: 18px; } .multi .brand-name { font-size: 17px; } .top-stats { gap: 4px; } .top-stats .pill { padding: 0 8px; } }

/* ---------- display: size and full screen ---------- */
.view-panel {
  position: fixed; z-index: 95; top: calc(env(safe-area-inset-top, 0px) + 56px); right: max(10px, env(safe-area-inset-right, 0px));
  width: min(320px, calc(100vw / var(--zoom, 1) - 20px)); background: var(--card); color: var(--ink); border: 1px solid var(--line);
  border-radius: 14px; box-shadow: 0 16px 40px -12px rgba(0, 0, 0, .35); padding: 14px; display: flex; flex-direction: column; gap: 12px;
}

.p-top .p-view { flex: none; }
body.playing { overflow: hidden; }

/* ---------- course switcher (several courses in one app) ---------- */
.course-switch { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 0 0 18px; }
.cs-btn {
  display: flex; flex-direction: column; align-items: flex-start; gap: 4px; min-width: 0; text-align: left; padding: 9px 10px 10px;
  border-radius: 14px; border: 2px solid var(--line-2); background: var(--card); color: var(--ink); box-shadow: 0 3px 0 var(--line-2);
}

.cs-top { display: flex; align-items: center; gap: 6px; width: 100%; }

.cs-meter > i { display: block; height: 100%; background: var(--gold); }
.course-tag { color: var(--brand); }
.me-h { margin: 22px 0 10px; font-size: 17px; display: flex; align-items: center; gap: 8px; }
.me-h .brand-mark { width: 22px; height: 22px; flex: none; }
.me-badges { margin: 0 0 10px; }
.me-badges > summary { cursor: pointer; font-weight: 700; font-size: 13.5px; color: var(--brand); padding: 4px 0 10px; }
.brand-name { overflow: hidden; text-overflow: ellipsis; }
.brand-stack { display: flex; align-items: center; gap: 8px; min-width: 0; }
.brand-tag { flex: none; font-family: var(--font-body); font-size: 11px; font-weight: 700; letter-spacing: .06em; line-height: 1; padding: 4px 6px; border-radius: 6px; background: var(--brand); color: var(--brand-ink); }
@media (max-width: 440px) {
  .brand-stack { flex-direction: column; align-items: flex-start; gap: 2px; }
  .brand-stack .brand-name { max-width: 100%; line-height: 1.1; }

}
@media (max-width: 380px) { .multi .brand-stack .brand-name { font-size: 14px; } }

/* ---------- code exercises ---------- */
.goal-line { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; padding: 8px 10px; border-radius: 10px; background: var(--gold-2); color: var(--ink); }
.goal-line svg { width: 18px; height: 18px; flex: none; color: var(--gold); margin-top: 1px; }

  background: color-mix(in srgb, var(--line-2) 55%, var(--surface)); overflow: hidden; user-select: none; min-width: 34px;
}

  font-family: var(--font-mono); font-size: 12px; line-height: 1.6; white-space: pre; overflow: auto; tab-size: 4; min-height: 120px; color: var(--ink);
}

/* ---------- wider screens: tablets and PCs ---------- */
@media (min-width: 1100px) {
  .main { max-width: 980px; }

}
.svg-hot:focus { outline: none; }
.svg-hot:focus-visible { outline: 2.5px solid var(--gold); outline-offset: 2px; }

/* ======== Lern2Vision theme ======== */
/* Lern2Vision theme: deep teal for the brand and magenta for highlights, like a false-colour heat map, on cool grey paper in light mode and near-black slate in dark mode. */
:root {
  --bg: #EAF0F0;
  --surface: #F5F9F9;
  --card: #FFFFFF;
  --ink: #1D1B17;
  --ink-2: #46413A;
  --ink-3: #6B655C;
  --line: #C8D6D7;
  --line-2: #DEE8E8;
  --brand: #0F6E74;
  --brand-2: #D5EEEF;
  --brand-ink: #FFFFFF;
  --gold: #B0246B;
  --gold-2: #FBE1EE;
  --gold-ink: #FFFFFF;
  --ok: #2B7F3E;
  --ok-2: #DCEEDF;
  --bad: #C0353F;
  --bad-2: #F7DCDE;
  --wire: #9C958A;
  --hot: #C7307A;
  --f-op: #2B7F3E;
  --f-rd: #1E5DBE;
  --f-f3: #C0353F;
  --f-rs1: #7841B3;
  --f-rs2: #A96500;
  --f-f7: #0B7A80;
  --f-imm: #B02E78;
  --f-op-2: #DCEEDF;

.test-row.bad { border-left-color: var(--bad); }
.test-row .ic { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 12px; flex: none; background: var(--ok-2); color: var(--ok); }
.test-row.bad .ic { background: var(--bad-2); color: var(--bad); }

CG.PX = {"a_array": {"lang": "py", "file": "a_array.py", "src": "import numpy as np, cv2\nfrom cvk import shapes, scene_rgb\ng = shapes()                       # 128x128 uint8 greyscale\nprint(g.shape, g.dtype, g.size, 'bytes:', g.nbytes)\nprint('pixel at row 30, col 20:', g[30, 20], '=', hex(g[30, 20]), '=', bin(g[30, 20]))\nc = scene_rgb()                    # H x W x 3, RGB order\nbgr = cv2.cvtColor(c, cv2.COLOR_RGB2BGR)   # OpenCV stores BGR\nprint(c.shape, 'RGB', c[60, 30], ' BGR', bgr[60, 30])\nroi = g[20:24, 13:17]              # a view, not a copy\nprint(roi)\nroi[:] = 0; print('after writing the view:', g[20, 15])", "out": "(128, 128) uint8 16384 bytes: 16384\npixel at row 30, col 20: 200 = 0xc8 = 0b11001000\n(96, 128, 3) RGB [210  30  30]  BGR [ 30  30 210]\n[[ 40  40 200 200]\n [ 40  40 200 200]\n [ 40  40 200 200]\n [ 40  40 200 200]]\nafter writing the view: 0"}, "a_colour": {"lang": "py", "file": "a_colour.py", "src": "import numpy as np, cv2\npx = np.array([[[210, 30, 30]]], np.uint8)          # one red RGB pixel\nfor name, code in [('HSV', cv2.COLOR_RGB2HSV), ('Lab', cv2.COLOR_RGB2LAB), ('YCrCb', cv2.COLOR_RGB2YCrCb), ('GRAY', cv2.COLOR_RGB2GRAY)]:\n    print(name.ljust(6), cv2.cvtColor(px, code).ravel())\nr, g, b = 210, 30, 30\nprint('luma by hand: 0.299R+0.587G+0.114B =', round(0.299 * r + 0.587 * g + 0.114 * b))\nmx, mn = max(r, g, b), min(r, g, b)\nprint('HSV by hand: H=0 (red is max), S=255*(mx-mn)/mx =', round(255 * (mx - mn) / mx), ' V =', mx)\ndef srgb_to_linear(v):\n    v = v / 255.0\n    return np.where(v <= 0.04045, v / 12.92, ((v + 0.055) / 1.055) ** 2.4)\nprint('sRGB 128 is', round(float(srgb_to_linear(128)), 4), 'linear light (not 0.5)')", "out": "HSV    [  0 219 210]\nLab    [115 194 176]\nYCrCb  [ 84 218  98]\nGRAY   [84]\nluma by hand: 0.299R+0.587G+0.114B = 84\nHSV by hand: H=0 (red is max), S=255*(mx-mn)/mx = 219  V = 210\nsRGB 128 is 0.2159 linear light (not 0.5)"}, "a_pinhole": {"lang": "py", "file": "a_pinhole.py", "src": "import numpy as np, cv2\nf, cx, cy = 800.0, 320.0, 240.0          # focal length in pixels, principal point\nK = np.array([[f, 0, cx], [0, f, cy], [0, 0, 1]])\nX = np.array([[0.5, -0.2, 4.0], [0.0, 0.0, 2.0], [1.0, 1.0, 10.0]])   # 3D points in camera frame (m)\nx = (K @ X.T).T; uv = x[:, :2] / x[:, 2:]\nprint('by hand:\\n', uv)\nuv2, _ = cv2.projectPoints(X, np.zeros(3), np.zeros(3), K, None)\nprint('cv2.projectPoints matches:', np.allclose(uv, uv2.reshape(-1, 2)))\n# lens distortion k1 = -0.2 pulls points toward the centre\nd = np.array([-0.2, 0, 0, 0, 0])\nuv3, _ = cv2.projectPoints(X, np.zeros(3), np.zeros(3), K, d)\nxn = X[:, :2] / X[:, 2:]; r2 = (xn ** 2).sum(1, keepdims=True)\nmine = (xn * (1 + d[0] * r2)) * f + [cx, cy]\nprint('distorted:\\n', uv3.reshape(-1, 2), '\\nmine matches:', np.allclose(mine, uv3.reshape(-1, 2)))", "out": "by hand:\n [[420. 200.]\n [320. 240.]\n [400. 320.]]\ncv2.projectPoints matches: True\ndistorted:\n [[419.6375 200.145 ]\n [320.     240.    ]\n [399.68   319.68  ]] \nmine matches: True"}, "a_sample": {"lang": "py", "file": "a_sample.py", "src": "import numpy as np, cv2\nx = np.arange(256); stripes = (127.5 + 127.5 * np.cos(2 * np.pi * x * 0.45)).astype(np.uint8)  # 0.45 cycles/pixel\nnaive = stripes[::4]                        # keep every 4th sample: new Nyquist limit is 0.125 cycles/pixel\nblur = cv2.GaussianBlur(stripes.reshape(1, -1).astype(np.float32), (0, 0), 2.0).ravel()[::4]\nf = np.abs(np.fft.rfft(naive - naive.mean())); print('naive decimation: strongest frequency', np.argmax(f) / 64, 'cycles/sample (alias!)')\nprint('pre-blurred: std', round(float(blur.std()), 2), 'vs naive std', round(float(naive.std()), 2))\nramp = np.arange(256).astype(np.uint8)\nfor bits in (8, 4, 2, 1):\n    q = (np.round(ramp / 255 * (2 ** bits - 1)) * (255 / (2 ** bits - 1))).astype(np.uint8)\n    print(bits, 'bits:', len(np.unique(q)), 'levels, max error', int(np.abs(q.astype(int) - ramp).max()))", "out": "naive decimation: strongest frequency 0.203125 cycles/sample (alias!)\npre-blurred: std 0.15 vs naive std 90.73\n8 bits: 256 levels, max error 0\n4 bits: 16 levels, max error 8\n2 bits: 4 levels, max error 42\n1 bits: 2 levels, max error 127"}, "b_clahe": {"lang": "py", "file": "b_clahe.py", "src": "import numpy as np, cv2\nfrom cvk import shapes\ng = shapes()\ng[:, :64] //= 4                                   # left half very dark\ncl = cv2.createCLAHE(clipLimit=2.0, tileGridSize=(4, 4)).apply(g)\neq = cv2.equalizeHist(g)\nprint('left-half mean  orig %.1f  global eq %.1f  CLAHE %.1f' % (g[:, :64].mean(), eq[:, :64].mean(), cl[:, :64].mean()))\n# histogram matching: map g's CDF onto a target's CDF\nt = np.clip(np.random.default_rng(1).normal(128, 30, g.shape), 0, 255).astype(np.uint8)\ncs = np.cumsum(np.bincount(g.ravel(), minlength=256)) / g.size\nct = np.cumsum(np.bincount(t.ravel(), minlength=256)) / t.size\nm = np.searchsorted(ct, cs).clip(0, 255).astype(np.uint8)\nout = m[g]; print('matched mean %.1f std %.1f (target 128, 30)' % (out.mean(), out.std()))", "out": "left-half mean  orig 21.9  global eq 112.4  CLAHE 25.5\nmatched mean 141.2 std 28.3 (target 128, 30)"}, "b_hist": {"lang": "py", "file": "b_hist.py", "src": "import numpy as np, cv2\nfrom cvk import shapes\ng = (shapes() // 2 + 40).astype(np.uint8)           # low contrast: values 40..167\nhist = np.bincount(g.ravel(), minlength=256)\ncdf = hist.cumsum(); cmin = cdf[cdf > 0][0]; N = g.size\nlut = np.round((cdf - cmin) / (N - cmin) * 255).clip(0, 255).astype(np.uint8)\nmine = lut[g]; ref = cv2.equalizeHist(g)\nprint('range before', g.min(), g.max(), ' after', mine.min(), mine.max())\nprint('max diff vs cv2.equalizeHist:', int(np.abs(mine.astype(int) - ref).max()))\nprint('first few mappings:', {int(v): int(lut[v]) for v in np.unique(g)[:4]})\nh2 = cv2.calcHist([g], [0], None, [256], [0, 256]).ravel()\nprint('calcHist equals bincount:', np.array_equal(h2.astype(int), hist))", "out": "range before 40 167  after 0 255\nmax diff vs cv2.equalizeHist: 0\nfirst few mappings: {40: 0, 42: 0, 45: 1, 47: 1}\ncalcHist equals bincount: True"}, "b_pointops": {"lang": "py", "file": "b_pointops.py", "src": "import numpy as np, cv2\nfrom cvk import shapes\ng = shapes()\nprint('uint8 wraps:   ', (g[30:31, 20] + np.uint8(100))[0], ' cv2.add saturates:', cv2.add(np.uint8([[200]]), np.uint8([[100]]))[0, 0])\na, b = 1.5, -20                                          # contrast, brightness\nmine = np.clip(a * g.astype(np.float64) + b, 0, 255).round().astype(np.uint8)\nref = cv2.addWeighted(g, a, g, 0, b)               # saturating a*g + b\nprint('contrast/brightness max diff vs cv2.addWeighted:', int(np.abs(mine.astype(int) - ref).max()))\nprint('trap: convertScaleAbs takes |a*g+b|, so 0 ->', cv2.convertScaleAbs(np.uint8([[0]]), alpha=a, beta=b)[0, 0], 'not 0')\ngamma = 0.5\nlut = np.array([round(255 * (i / 255) ** gamma) for i in range(256)], np.uint8)\nprint('gamma LUT[64] =', lut[64], ' cv2.LUT equals indexing:', np.array_equal(cv2.LUT(g, lut), lut[g]))\nneg = 255 - g; print('negative of 40 =', neg[0, 0])", "out": "uint8 wraps:    44  cv2.add saturates: 255\ncontrast/brightness max diff vs cv2.addWeighted: 0\ntrap: convertScaleAbs takes |a*g+b|, so 0 -> 20 not 0\ngamma LUT[64] = 128  cv2.LUT equals indexing: True\nnegative of 40 = 215"}, "c_bilat": {"lang": "py", "file": "c_bilat.py", "src": "import numpy as np, cv2\nfrom cvk import shapes, noisy\ndef bilateral(img, d, sc, ss):\n    \"\"\"From scratch, same weights as OpenCV: spatial exp(-r^2/2ss^2) * range exp(-dI^2/2sc^2) over a disc of radius d//2.\"\"\"\n    f = img.astype(np.float64); r = d // 2; p = np.pad(f, r, mode='reflect'); H, W = f.shape\n    num = np.zeros_like(f); den = np.zeros_like(f)\n    for dy in range(-r, r + 1):\n        for dx in range(-r, r + 1):\n            if dy * dy + dx * dx > r * r: continue\n            nb = p[r + dy:r + dy + H, r + dx:r + dx + W]\n            w = np.exp(-(dy * dy + dx * dx) / (2 * ss * ss)) * np.exp(-(nb - f) ** 2 / (2 * sc * sc))\n            num += w * nb; den += w\n    return num / den\nn = noisy(shapes(), 15)\nmine = bilateral(n, 5, 30, 3); ref = cv2.bilateralFilter(n.astype(np.float32), 5, 30, 3)\nprint('bilateral from scratch vs cv2 (float32): mean |diff| %.3f, max %.3f' % (np.abs(mine - ref).mean(), np.abs(mine - ref).max()))", "out": "bilateral from scratch vs cv2 (float32): mean |diff| 0.000, max 0.000"}, "c_conv": {"lang": "py", "file": "c_conv.py", "src": "import numpy as np, cv2\nfrom cvk import shapes\ndef correlate(img, k):\n    \"\"\"From scratch: 2D correlation with BORDER_REFLECT_101 padding (OpenCV's default).\"\"\"\n    kh, kw = k.shape; ph, pw = kh // 2, kw // 2\n    p = np.pad(img.astype(np.float64), ((ph, ph), (pw, pw)), mode='reflect')   # numpy 'reflect' == REFLECT_101\n    out = np.zeros(img.shape)\n    for dy in range(kh):              # loop over the kernel, not the pixels: kh*kw vectorised passes\n        for dx in range(kw):\n            out += k[dy, dx] * p[dy:dy + img.shape[0], dx:dx + img.shape[1]]\n    return out\ng = shapes().astype(np.float32)\nk = np.array([[0, -1, 0], [-1, 5, -1], [0, -1, 0]], np.float32)      # sharpen\nmine = correlate(g, k); ref = cv2.filter2D(g, -1, k)\nprint('sharpen: max |mine - filter2D| =', float(np.abs(mine - ref).max()))\nasym = np.array([[1, 2, 3], [0, 0, 0], [0, 0, 0]], np.float32)\nconv = correlate(g, asym[::-1, ::-1])                                  # convolution = correlation with flipped kernel\nprint('convolution needs the flip: equal to filter2D(flipped)?', np.allclose(conv, cv2.filter2D(g, -1, asym[::-1, ::-1])))\nprint('one pixel by hand at (21,15):', g[20:23, 14:17].ravel(), '->', float((g[20:23, 14:17] * k).sum()), '=', float(mine[21, 15]))", "out": "sharpen: max |mine - filter2D| = 0.0\nconvolution needs the flip: equal to filter2D(flipped)? True\none pixel by hand at (21,15): [ 40. 200. 200.  40. 200. 200.  40. 200. 200.] -> 360.0 = 360.0"}, "c_fft": {"lang": "py", "file": "c_fft.py", "src": "import numpy as np, cv2\nfrom cvk import shapes, noisy\ng = shapes().astype(np.float64)\nF = np.fft.fft2(g)\nprint('DC term / N = mean:', round(F[0, 0].real / g.size, 3), '=', round(g.mean(), 3))\n# convolution theorem: circular convolution == pointwise product of spectra\nk = np.zeros_like(g); k[:3, :3] = 1 / 9; k = np.roll(k, (-1, -1), (0, 1))     # centred 3x3 box\nviaF = np.real(np.fft.ifft2(F * np.fft.fft2(k)))\np = np.pad(g, 1, mode='wrap'); direct = sum(p[dy:dy + 128, dx:dx + 128] for dy in range(3) for dx in range(3)) / 9\nprint('FFT product == wrap-around box filter:', np.allclose(viaF, direct))\n# ideal low-pass vs Gaussian low-pass: ringing\nH, W = g.shape; v, u = np.meshgrid(np.fft.fftfreq(H), np.fft.fftfreq(W), indexing='ij'); R = np.hypot(u, v)\nideal = np.real(np.fft.ifft2(F * (R < 0.08))); gl = np.real(np.fft.ifft2(F * np.exp(-R ** 2 / (2 * 0.05 ** 2))))\nprint('overshoot above 200 at the rectangle: ideal %.1f  gaussian %.1f' % (ideal[20:60, 15:55].max() - 200, round(gl[20:60, 15:55].max() - 200, 1) + 0.0))\n# periodic noise removal with a notch\npn = g + 30 * np.sin(2 * np.pi * np.arange(128) / 8)[None, :]\nP = np.fft.fft2(pn); mag = np.abs(P); mag[R < 0.1] = 0                     # ignore the image's own low frequencies\niy, ix = np.unravel_index(np.argmax(mag), mag.shape); print('noise spike at frequency index', (int(iy), int(ix)))\nP[0, [16, 128 - 16]] = 0                                  # notch: zero the spike and its mirror\nprint('notch removes it: residual error', round(float(np.abs(np.real(np.fft.ifft2(P)) - g).mean()), 2))", "out": "DC term / N = mean: 85.699 = 85.699\nFFT product == wrap-around box filter: True\novershoot above 200 at the rectangle: ideal 33.9  gaussian 0.0\nnoise spike at frequency index (0, 16)\nnotch removes it: residual error 1.26"}, "c_gauss": {"lang": "py", "file": "c_gauss.py", "src": "import numpy as np, cv2\nfrom cvk import shapes, noisy, psnr\ndef gauss1d(sigma):\n    r = int(np.ceil(3 * sigma)); x = np.arange(-r, r + 1)\n    w = np.exp(-x ** 2 / (2 * sigma ** 2)); return w / w.sum()\nw = gauss1d(1.0); print('sigma=1 kernel (7 taps):', np.round(w, 3))\nprint('cv2.getGaussianKernel(7,1):', np.round(cv2.getGaussianKernel(7, 1.0).ravel(), 3))\nclean = shapes(); n = noisy(clean, 20).astype(np.float32)\nsep = cv2.sepFilter2D(n, -1, w, w)                                     # two 1D passes: 14 mults/pixel, not 49\nfull = cv2.filter2D(n, -1, np.outer(w, w))\nprint('separable == full 2D:', np.allclose(sep, full, atol=1e-3))\nref = cv2.GaussianBlur(n, (7, 7), 1.0)\nprint('max diff vs GaussianBlur:', round(float(np.abs(sep - ref).max()), 4))\nprint('PSNR noisy %.2f dB -> blurred %.2f dB' % (psnr(clean, n), psnr(clean, np.clip(sep, 0, 255))))\n# box filter via an integral image: O(1) per pixel regardless of size\nI = cv2.integral(clean)                                                # (H+1)x(W+1), I[y,x] = sum of clean[:y,:x]\ny, x, r = 40, 40, 5\ns = I[y + r + 1, x + r + 1] - I[y - r, x + r + 1] - I[y + r + 1, x - r] + I[y - r, x - r]\nprint('11x11 box sum via 4 lookups:', int(s), '== direct', int(clean[y - r:y + r + 1, x - r:x + r + 1].astype(int).sum()))", "out": "sigma=1 kernel (7 taps): [0.004 0.054 0.242 0.399 0.242 0.054 0.004]\ncv2.getGaussianKernel(7,1): [0.004 0.054 0.242 0.399 0.242 0.054 0.004]\nseparable == full 2D: True\nmax diff vs GaussianBlur: 0.0\nPSNR noisy 22.44 dB -> blurred 24.94 dB\n11x11 box sum via 4 lookups: 24200 == direct 24200"}, "c_median": {"lang": "py", "file": "c_median.py", "src": "import numpy as np, cv2\nfrom cvk import shapes, salt_pepper, noisy, psnr\nclean = shapes(); sp = salt_pepper(clean, 0.08)\ndef median3(img):\n    p = np.pad(img, 1, mode='edge')\n    stack = np.stack([p[dy:dy + img.shape[0], dx:dx + img.shape[1]] for dy in range(3) for dx in range(3)])\n    return np.median(stack, axis=0).astype(np.uint8)\nm = median3(sp); ref = cv2.medianBlur(sp, 3)\nprint('median3 vs cv2.medianBlur, pixels that differ:', int((m != ref).sum()), '(cv2 uses replicate border too)')\nprint('salt&pepper PSNR %.1f | gaussian %.1f | median %.1f dB' % (psnr(clean, sp), psnr(clean, cv2.GaussianBlur(sp, (3, 3), 0)), psnr(clean, ref)))\nn = noisy(clean, 15)\nbil = cv2.bilateralFilter(n, 9, 40, 5)\ngau = cv2.GaussianBlur(n, (9, 9), 5)\nedge = lambda im: float(np.abs(np.diff(im[40, 5:25].astype(int))).max())   # sharpest step across the rectangle edge\nprint('edge step  clean %d  gaussian %d  bilateral %d' % (edge(clean), edge(gau), edge(bil)))\nprint('PSNR gaussian %.1f  bilateral %.1f' % (psnr(clean, gau), psnr(clean, bil)))", "out": "median3 vs cv2.medianBlur, pixels that differ: 0 (cv2 uses replicate border too)\nsalt&pepper PSNR 15.5 | gaussian 21.8 | median 30.5 dB\nedge step  clean 160  gaussian 20  bilateral 153\nPSNR gaussian 20.4  bilateral 36.8"}, "d_canny": {"lang": "py", "file": "d_canny.py", "src": "import numpy as np, cv2\nfrom cvk import shapes, noisy\ndef canny(img, lo, hi):\n    \"\"\"From scratch: Sobel (L1 like cv2 default), non-maximum suppression in 4 directions, double threshold, hysteresis.\"\"\"\n    f = img.astype(np.float64)\n    gx = cv2.Sobel(f, cv2.CV_64F, 1, 0, ksize=3); gy = cv2.Sobel(f, cv2.CV_64F, 0, 1, ksize=3)\n    mag = np.abs(gx) + np.abs(gy); ang = (np.degrees(np.arctan2(gy, gx)) + 180) % 180\n    H, W = f.shape; nms = np.zeros_like(mag)\n    d = np.select([(ang < 22.5) | (ang >= 157.5), ang < 67.5, ang < 112.5], [0, 1, 2], 3)\n    off = {0: (0, 1), 1: (1, 1), 2: (1, 0), 3: (1, -1)}\n    for k, (dy, dx) in off.items():\n        m = d == k; a = np.roll(mag, (-dy, -dx), (0, 1)); b = np.roll(mag, (dy, dx), (0, 1))\n        keep = m & (mag > a) & (mag >= b); nms[keep] = mag[keep]\n    nms[[0, -1], :] = 0; nms[:, [0, -1]] = 0\n    strong = nms > hi; weak = (nms >= lo) & ~strong\n    n, lab = cv2.connectedComponents((strong | weak).astype(np.uint8), connectivity=8)\n    good = np.unique(lab[strong]); return np.isin(lab, good[good > 0]).astype(np.uint8) * 255\nimg = cv2.GaussianBlur(noisy(shapes(), 8), (5, 5), 1.2)\nmine = canny(img, 50, 150); ref = cv2.Canny(img, 50, 150)\nboth = int(((mine > 0) & (ref > 0)).sum()); print('edge pixels mine %d, cv2 %d, shared %d' % ((mine > 0).sum(), (ref > 0).sum(), both))\nnear = cv2.dilate(ref, np.ones((3, 3), np.uint8)) > 0\nprint('%.1f%% of my edge pixels are within 1 px of a cv2 edge' % (100 * ((mine > 0) & near).sum() / (mine > 0).sum()))\nfor lo, hi in [(20, 60), (50, 150), (100, 300)]: print('thresholds', (lo, hi), '->', int((cv2.Canny(img, lo, hi) > 0).sum()), 'edge pixels')", "out": "edge pixels mine 618, cv2 615, shared 581\n100.0% of my edge pixels are within 1 px of a cv2 edge\nthresholds (20, 60) -> 707 edge pixels\nthresholds (50, 150) -> 615 edge pixels\nthresholds (100, 300) -> 605 edge pixels"}, "d_harris": {"lang": "py", "file": "d_harris.py", "src": "import numpy as np, cv2\nfrom cvk import shapes\ng = shapes().astype(np.float32)\ndef harris(img, block=3, k=0.04):\n    Ix = cv2.Sobel(img, cv2.CV_32F, 1, 0, ksize=3); Iy = cv2.Sobel(img, cv2.CV_32F, 0, 1, ksize=3)\n    box = lambda a: cv2.boxFilter(a, cv2.CV_32F, (block, block), normalize=False)   # sum over the window\n    A, B, C = box(Ix * Ix), box(Ix * Iy), box(Iy * Iy)                               # structure tensor M = [[A B],[B C]]\n    return A * C - B * B - k * (A + C) ** 2                                         # det(M) - k trace(M)^2\nR = harris(g); ref = cv2.cornerHarris(g, 3, 3, 0.04)\ns = (4 * 3) ** 4          # cv2 scales each derivative by 1/(2^(ksize-1) * block) = 1/12 for float input\nprint('relative max diff vs cv2.cornerHarris * 12^4: %.1e' % (np.abs(R - ref * s).max() / np.abs(R).max()))\nys, xs = np.where((R == cv2.dilate(R, np.ones((5, 5)))) & (R > 0.05 * R.max()))\nprint('Harris corners (y,x):', sorted(zip(ys.tolist(), xs.tolist()))[:6])\nprint('R on flat %.0f, on an edge %.3g (negative), at a corner %.3g' % (R[5, 5], R[40, 14], R[ys[0], xs[0]]))\npts = cv2.goodFeaturesToTrack(g.astype(np.uint8), 8, 0.1, 5)          # Shi-Tomasi: min eigenvalue\nprint('Shi-Tomasi top corners:', sorted(tuple(map(int, p.ravel()[::-1])) for p in pts)[:6])\nlam = np.linalg.eigvalsh(np.array([[2.0, 0.0], [0.0, 0.1]])); print('edge-like M eigenvalues', lam, '-> min eig small, rejected')", "out": "relative max diff vs cv2.cornerHarris * 12^4: 2.5e-07\nHarris corners (y,x): [(20, 15), (20, 54), (21, 70), (59, 15), (59, 54), (70, 70)]\nR on flat 0, on an edge -2.42e+11 (negative), at a corner 1.32e+12\nShi-Tomasi top corners: [(20, 54), (20, 70), (59, 15), (59, 54), (70, 70), (70, 120)]\nedge-like M eigenvalues [0.1 2. ] -> min eig small, rejected"}, "d_sobel": {"lang": "py", "file": "d_sobel.py", "src": "import numpy as np, cv2\nfrom cvk import shapes\ng = shapes().astype(np.float32)\nkx = np.array([[-1, 0, 1], [-2, 0, 2], [-1, 0, 1]], np.float32)      # smooth [1 2 1] down, differentiate [-1 0 1] across\ngx = cv2.filter2D(g, -1, kx); gy = cv2.filter2D(g, -1, kx.T)\nrx = cv2.Sobel(g, cv2.CV_32F, 1, 0, ksize=3); ry = cv2.Sobel(g, cv2.CV_32F, 0, 1, ksize=3)\nprint('filter2D(kx) == cv2.Sobel dx:', np.allclose(gx, rx), ' dy:', np.allclose(gy, ry))\nmag = np.hypot(gx, gy); ang = np.degrees(np.arctan2(gy, gx))\nprint('left edge of rectangle (row 40, col 14..16) gx:', gx[40, 13:17])\nprint('gradient points from dark to bright: angle at (40,14) =', float(ang[40, 14]), 'deg')\nprint('mag at a step of 160: 4*160 =', float(mag[40, 14]))\nprint('L1 approx |gx|+|gy| vs L2 at a 45-degree corner:', float(abs(gx[20, 15]) + abs(gy[20, 15])), float(mag[20, 15]))\nlap = cv2.Laplacian(g, cv2.CV_32F); print('Laplacian zero crossing across the edge:', lap[40, 13:17])", "out": "filter2D(kx) == cv2.Sobel dx: True  dy: True\nleft edge of rectangle (row 40, col 14..16) gx: [  0. 640. 640.   0.]\ngradient points from dark to bright: angle at (40,14) = 0.0 deg\nmag at a step of 160: 4*160 = 640.0\nL1 approx |gx|+|gy| vs L2 at a 45-degree corner: 960.0 678.822509765625\nLaplacian zero crossing across the edge: [   0.  160. -160.    0.]"}, "e_dog": {"lang": "py", "file": "e_dog.py", "src": "import numpy as np, cv2\nfrom cvk import texture\ng = texture().astype(np.float32) / 255\n# a scale space: blur with sigma * k^i, subtract neighbours -> Difference of Gaussians\ns0, k = 1.6, 2 ** (1 / 3)\nL = [cv2.GaussianBlur(g, (0, 0), s0 * k ** i) for i in range(5)]\nD = np.stack([L[i + 1] - L[i] for i in range(4)])\n# a keypoint is an extremum of its 3x3x3 neighbourhood (26 neighbours) with enough contrast\nmx = np.max([np.roll(np.roll(np.roll(D, a, 0), b, 1), c, 2) for a in (-1, 0, 1) for b in (-1, 0, 1) for c in (-1, 0, 1) if (a, b, c) != (0, 0, 0)], axis=0)\nmn = np.min([np.roll(np.roll(np.roll(D, a, 0), b, 1), c, 2) for a in (-1, 0, 1) for b in (-1, 0, 1) for c in (-1, 0, 1) if (a, b, c) != (0, 0, 0)], axis=0)\next = ((D > mx) | (D < mn)) & (np.abs(D) > 0.03); ext[[0, -1]] = False; ext[:, :5] = ext[:, -5:] = False; ext[:, :, :5] = ext[:, :, -5:] = False\nprint('DoG extrema in the middle scales of octave 0:', int(ext.sum()))\nsift = cv2.SIFT_create(); kp, des = sift.detectAndCompute((g * 255).astype(np.uint8), None)\nprint('cv2 SIFT keypoints:', len(kp), ' descriptor shape', des.shape, des.dtype)\nprint('first keypoint: pt (%.1f, %.1f) size %.1f angle %.0f' % (*kp[0].pt, kp[0].size, kp[0].angle))\nprint('DoG approximates the scale-normalised Laplacian: (k-1) sigma^2 LoG, k-1 = %.3f' % (k - 1))", "out": "DoG extrema in the middle scales of octave 0: 35\ncv2 SIFT keypoints: 335  descriptor shape (335, 128) float32\nfirst keypoint: pt (13.7, 29.8) size 2.7 angle 309\nDoG approximates the scale-normalised Laplacian: (k-1) sigma^2 LoG, k-1 = 0.260"}, "e_match": {"lang": "py", "file": "e_match.py", "src": "import numpy as np, cv2\nfrom cvk import texture\na = texture(); H, W = a.shape\nM = cv2.getRotationMatrix2D((W / 2, H / 2), 25, 0.8)              # rotate 25 deg, scale 0.8\nb = cv2.warpAffine(a, M, (W, H))\norb = cv2.ORB_create(500)\nka, da = orb.detectAndCompute(a, None); kb, db = orb.detectAndCompute(b, None)\nprint('ORB descriptors:', da.shape, da.dtype, '(256 bits = 32 bytes each)')\n# brute force Hamming distance, from scratch: popcount of XOR\npopcnt = np.unpackbits(np.arange(256, dtype=np.uint8)[:, None], axis=1).sum(1)\ndist = popcnt[da[:, None, :] ^ db[None, :, :]].sum(2)            # (Na, Nb) Hamming distances\nbf = cv2.BFMatcher(cv2.NORM_HAMMING).match(da, db)\nprint('mine == BFMatcher best distances:', all(dist[m.queryIdx].min() == m.distance for m in bf))\n# Lowe's ratio test\no = np.argsort(dist, 1); best, second = dist[np.arange(len(da)), o[:, 0]], dist[np.arange(len(da)), o[:, 1]]\ngood = best < 0.75 * second\npa = np.float32([ka[i].pt for i in np.where(good)[0]]); pb = np.float32([kb[o[i, 0]].pt for i in np.where(good)[0]])\nerr = np.linalg.norm(pa @ M[:, :2].T + M[:, 2] - pb, axis=1)\nprint('all matches %d, after ratio test %d, of which correct (< 3 px): %d' % (len(da), good.sum(), (err < 3).sum()))\nprint('correct fraction without ratio test: %.2f' % (np.mean(np.linalg.norm(np.float32([k.pt for k in ka]) @ M[:, :2].T + M[:, 2] - np.float32([kb[j].pt for j in o[:, 0]]), axis=1) < 3)))", "out": "ORB descriptors: (450, 32) uint8 (256 bits = 32 bytes each)\nmine == BFMatcher best distances: True\nall matches 450, after ratio test 195, of which correct (< 3 px): 191\ncorrect fraction without ratio test: 0.61"}, "e_ransac": {"lang": "py", "file": "e_ransac.py", "src": "import numpy as np, cv2\nr = np.random.default_rng(0)\n# 100 correspondences under a known homography, 40% outliers\nHt = np.array([[0.9, 0.1, 20], [-0.05, 1.1, 10], [1e-4, 2e-4, 1]])\nsrc = r.uniform(0, 300, (100, 2))\ndst_h = np.c_[src, np.ones(100)] @ Ht.T; dst = dst_h[:, :2] / dst_h[:, 2:] + r.normal(0, 0.5, (100, 2))\nout = r.random(100) < 0.4; dst[out] = r.uniform(0, 300, (out.sum(), 2))\ndef dlt(s, d):\n    A = []\n    for (x, y), (u, v) in zip(s, d):\n        A += [[-x, -y, -1, 0, 0, 0, u * x, u * y, u], [0, 0, 0, -x, -y, -1, v * x, v * y, v]]\n    H = np.linalg.svd(np.array(A))[2][-1].reshape(3, 3); return H / H[2, 2]\ndef proj(H, p): q = np.c_[p, np.ones(len(p))] @ H.T; return q[:, :2] / q[:, 2:]\ndef ransac(s, d, thr=3.0, iters=500):\n    best = np.zeros(len(s), bool)\n    for _ in range(iters):\n        i = r.choice(len(s), 4, replace=False)\n        try: H = dlt(s[i], d[i])\n        except np.linalg.LinAlgError: continue\n        inl = np.linalg.norm(proj(H, s) - d, axis=1) < thr\n        if inl.sum() > best.sum(): best = inl\n    return dlt(s[best], d[best]), best                     # refit on all inliers\nprint('plain least squares on everything: max error vs truth %.1f px' % np.abs(proj(dlt(src, dst), src[~out]) - proj(Ht, src[~out])).max())\nH, inl = ransac(src, dst)\nprint('RANSAC: inliers %d (true %d), max error %.2f px' % (inl.sum(), (~out).sum(), np.abs(proj(H, src[~out]) - proj(Ht, src[~out])).max()))\nHc, mask = cv2.findHomography(src, dst, cv2.RANSAC, 3.0)\nprint('cv2.findHomography inliers', int(mask.sum()), '; max difference from mine on the true inliers %.2f px' % np.abs(proj(Hc, src[~out]) - proj(H, src[~out])).max())\np, s, e = 0.99, 4, 0.4; print('iterations needed for p=0.99, 4 points, 40%% outliers: %d' % np.ceil(np.log(1 - p) / np.log(1 - (1 - e) ** s)))", "out": "plain least squares on everything: max error vs truth 63223.0 px\nRANSAC: inliers 66 (true 66), max error 0.61 px\ncv2.findHomography inliers 66 ; max difference from mine on the true inliers 0.45 px\niterations needed for p=0.99, 4 points, 40% outliers: 34"}, "f_cc": {"lang": "py", "file": "f_cc.py", "src": "import numpy as np, cv2\nfrom cvk import shapes\nb = (shapes() > 100).astype(np.uint8)\ndef label(m):\n    \"\"\"Two-pass connected components (4-connectivity) with union-find.\"\"\"\n    H, W = m.shape; lab = np.zeros((H, W), int); parent = [0]\n    def find(a):\n        while parent[a] != a: parent[a] = parent[parent[a]]; a = parent[a]\n        return a\n    for y in range(H):\n        for x in range(W):\n            if not m[y, x]: continue\n            up = lab[y - 1, x] if y else 0; left = lab[y, x - 1] if x else 0\n            if not up and not left: parent.append(len(parent)); lab[y, x] = len(parent) - 1\n            else:\n                l = min(v for v in (up, left) if v); lab[y, x] = l\n                for v in (up, left):\n                    if v: ra, rb = find(v), find(l); parent[max(ra, rb)] = min(ra, rb)\n    roots = {r: i + 1 for i, r in enumerate(sorted({find(v) for v in range(1, len(parent))}))}\n    return len(roots), np.vectorize(lambda v: roots[find(v)] if v else 0)(lab)\nn, lab = label(b); nc, labc, stats, cent = cv2.connectedComponentsWithStats(b, connectivity=4)\nprint('components mine %d, cv2 %d (cv2 counts background as label 0)' % (n, nc - 1))\nprint('same partition:', all(len(np.unique(labc[lab == i])) == 1 for i in range(1, n + 1)))\nfor i in range(1, nc): print(' blob %d: area %4d  bbox x=%d y=%d w=%d h=%d  centroid (%.1f, %.1f)' % (i, stats[i, 4], *stats[i, :4], *cent[i]))", "out": "components mine 4, cv2 4 (cv2 counts background as label 0)\nsame partition: True\n blob 1: area 1600  bbox x=15 y=20 w=40 h=40  centroid (34.5, 39.5)\n blob 2: area 1326  bbox x=70 y=20 w=51 h=51  centroid (86.7, 53.3)\n blob 3: area 1517  bbox x=18 y=63 w=45 h=45  centroid (40.0, 85.0)\n blob 4: area  620  bbox x=91 y=100 w=31 h=20  centroid (106.0, 109.5)"}, "f_grabcut": {"lang": "py", "file": "f_grabcut.py", "src": "import numpy as np, cv2\nfrom cvk import scene_rgb\nimg = cv2.cvtColor(scene_rgb(), cv2.COLOR_RGB2BGR)\nmask = np.zeros(img.shape[:2], np.uint8); bgd = np.zeros((1, 65)); fgd = np.zeros((1, 65))\ncv2.grabCut(img, mask, (14, 44, 42, 42), bgd, fgd, 5, cv2.GC_INIT_WITH_RECT)      # box around the red square\nfg = (mask == cv2.GC_FGD) | (mask == cv2.GC_PR_FGD)\ntruth = np.zeros_like(fg); truth[50:80, 20:50] = True\niou = (fg & truth).sum() / (fg | truth).sum(); print('GrabCut foreground IoU with the true square: %.3f' % iou)\n# the graph-cut core on a 1-D toy: min cut = max flow (Edmonds-Karp)\ndef maxflow(cap, s, t):\n    n = len(cap); f = 0; cap = [row[:] for row in cap]\n    while True:\n        par = [-1] * n; par[s] = s; q = [s]\n        while q and par[t] < 0:\n            u = q.pop(0)\n            for v in range(n):\n                if par[v] < 0 and cap[u][v] > 0: par[v] = u; q.append(v)\n        if par[t] < 0: return f, [par[v] >= 0 for v in range(n)]\n        v, b = t, float('inf')\n        while v != s: b = min(b, cap[par[v]][v]); v = par[v]\n        v = t\n        while v != s: cap[par[v]][v] -= b; cap[v][par[v]] += b; v = par[v]\n        f += b\npix = [10, 12, 200, 210]                   # four pixels in a row; source = 'dark' label, sink = 'bright'\nn = 6; S, T = 4, 5; cap = [[0] * n for _ in range(n)]\nfor i, v in enumerate(pix):\n    cap[S][i] = 255 - v; cap[i][T] = v       # data terms: cost of the other label\nfor i in range(3): cap[i][i + 1] = cap[i + 1][i] = 30      # smoothness between neighbours\nf, side = maxflow(cap, S, T); print('min cut cost', f, ' labels', ['dark' if side[i] else 'bright' for i in range(4)])", "out": "GrabCut foreground IoU with the true square: 1.000\nmin cut cost 152  labels ['dark', 'dark', 'bright', 'bright']"}, "f_kmeans": {"lang": "py", "file": "f_kmeans.py", "src": "import numpy as np, cv2\nfrom cvk import scene_rgb\nimg = scene_rgb(); X = img.reshape(-1, 3).astype(np.float32)\ndef kmeans(X, k, iters=20, seed=0):\n    r = np.random.default_rng(seed); C = X[r.choice(len(X), 1)]\n    while len(C) < k:                                                     # k-means++ seeding\n        d2 = ((X[:, None] - C[None]) ** 2).sum(2).min(1); C = np.vstack([C, X[r.choice(len(X), p=d2 / d2.sum())]])\n    for it in range(iters):\n        lab = ((X[:, None] - C[None]) ** 2).sum(2).argmin(1)             # assign\n        newC = np.array([X[lab == j].mean(0) if (lab == j).any() else C[j] for j in range(k)])   # update\n        if np.allclose(newC, C): break\n        C = newC\n    return lab, C, ((X - C[lab]) ** 2).sum(), it\nruns = [kmeans(X, 4, seed=s) for s in range(5)]                          # k-means finds a LOCAL optimum: restart and keep the best\nprint('SSE of 5 restarts:', ' '.join('%.3g' % r[2] for r in runs))\nlab, C, sse, it = min(runs, key=lambda r: r[2])\nprint('best run converged after', it, 'iterations; SSE %.3g' % sse)\ncrit = (cv2.TERM_CRITERIA_EPS + cv2.TERM_CRITERIA_MAX_ITER, 50, 0.1)\ncs, lc, Cc = cv2.kmeans(X, 4, None, crit, 5, cv2.KMEANS_PP_CENTERS)\nprint('cv2.kmeans compactness %.3g (same optimum: %s)' % (cs, abs(cs - sse) / sse < 0.01))\nprint('centres (RGB):', sorted(np.round(C).astype(int).tolist()))\nfor k in (2, 3, 4, 5, 6): print(' k=%d best SSE %.3g' % (k, min(kmeans(X, k, seed=s)[2] for s in range(5))))", "out": "SSE of 5 restarts: 2.94e+07 1.45e+06 1.45e+06 1.45e+06 1.45e+06\nbest run converged after 1 iterations; SSE 1.45e+06\ncv2.kmeans compactness 1.45e+06 (same optimum: True)\ncentres (RGB): [[60, 150, 60], [113, 151, 230], [210, 30, 30], [250, 220, 40]]\n k=2 best SSE 4.54e+07\n k=3 best SSE 1.26e+07\n k=4 best SSE 1.45e+06\n k=5 best SSE 3.34e+05\n k=6 best SSE 1.5e+05"}, "f_morph": {"lang": "py", "file": "f_morph.py", "src": "import numpy as np, cv2\nfrom cvk import shapes, salt_pepper\nb = (shapes() > 100).astype(np.uint8)                       # binary mask\ndef erode(m, k):\n    kh, kw = k.shape; p = np.pad(m, ((kh // 2,) * 2, (kw // 2,) * 2), constant_values=1)   # outside counts as foreground (cv2 default)\n    out = np.ones_like(m)\n    for dy in range(kh):\n        for dx in range(kw):\n            if k[dy, dx]: out &= p[dy:dy + m.shape[0], dx:dx + m.shape[1]]\n    return out\ndef dilate(m, k): return 1 - erode(1 - m, k[::-1, ::-1])     # duality: dilation = complement of eroding the complement\nk = np.ones((3, 3), np.uint8)\nprint('erode matches cv2:', np.array_equal(erode(b, k), cv2.erode(b, k)), ' dilate matches cv2:', np.array_equal(dilate(b, k), cv2.dilate(b, k)))\nprint('area: original %d, eroded %d, dilated %d' % (b.sum(), cv2.erode(b, k).sum(), cv2.dilate(b, k).sum()))\nsp = salt_pepper(b * 255, 0.02) > 127\nop = cv2.morphologyEx(sp.astype(np.uint8), cv2.MORPH_OPEN, k); cl = cv2.morphologyEx(op, cv2.MORPH_CLOSE, k)\nprint('noisy pixels wrong: %d -> open %d -> open+close %d' % ((sp != b).sum(), (op != b).sum(), (cl != b).sum()))\ngrad = cv2.morphologyEx(b, cv2.MORPH_GRADIENT, k); print('morphological gradient (outline) pixels:', int(grad.sum()))\nprint('opening is idempotent:', np.array_equal(cv2.morphologyEx(op, cv2.MORPH_OPEN, k), op))", "out": "erode matches cv2: True  dilate matches cv2: True\narea: original 5063, eroded 4439, dilated 5725\nnoisy pixels wrong: 182 -> open 86 -> open+close 28\nmorphological gradient (outline) pixels: 1286\nopening is idempotent: True"}, "f_otsu": {"lang": "py", "file": "f_otsu.py", "src": "import numpy as np, cv2\nfrom cvk import shapes, noisy\ng = noisy(shapes(), 12)\ndef otsu(img):\n    p = np.bincount(img.ravel(), minlength=256) / img.size\n    w0 = np.cumsum(p); mu = np.cumsum(p * np.arange(256)); muT = mu[-1]\n    with np.errstate(divide='ignore', invalid='ignore'):\n        sb = (muT * w0 - mu) ** 2 / (w0 * (1 - w0))           # between-class variance for threshold t (class 0 = <= t)\n    return int(np.nanargmax(sb)), sb\nt, sb = otsu(g); tc, _ = cv2.threshold(g, 0, 255, cv2.THRESH_BINARY + cv2.THRESH_OTSU)\nprint('Otsu threshold mine %d, cv2 %d' % (t, tc))\nprint('between-class variance at t-20, t, t+20: %.0f %.0f %.0f' % (sb[t - 20], sb[t], sb[t + 20]))\n# uneven illumination defeats any global threshold; adaptive (local mean - C) copes\nyy, xx = np.mgrid[0:128, 0:128]; lit = np.clip(shapes() * (0.3 + 0.7 * xx / 127), 0, 255).astype(np.uint8)\ntruth = shapes() > 100\n_, glob = cv2.threshold(lit, 0, 1, cv2.THRESH_BINARY + cv2.THRESH_OTSU)\nad = cv2.adaptiveThreshold(lit, 1, cv2.ADAPTIVE_THRESH_MEAN_C, cv2.THRESH_BINARY, 31, -10)\nprint('wrong pixels: global Otsu %d, adaptive %d' % ((glob.astype(bool) != truth).sum(), (ad.astype(bool) != truth).sum()))", "out": "Otsu threshold mine 115, cv2 115\nbetween-class variance at t-20, t, t+20: 4601 4627 4536\nwrong pixels: global Otsu 2337, adaptive 1013"}, "f_water": {"lang": "py", "file": "f_water.py", "src": "import numpy as np, cv2\n# two overlapping discs: thresholding gives one blob, watershed on the distance transform splits them\nm = np.zeros((100, 140), np.uint8); cv2.circle(m, (45, 50), 30, 255, -1); cv2.circle(m, (95, 50), 30, 255, -1)\nn, _ = cv2.connectedComponents(m); print('connected components of the mask:', n - 1)\ndist = cv2.distanceTransform(m, cv2.DIST_L2, 5)\nprint('distance transform peak %.1f at the disc centres' % dist.max())\n_, peaks = cv2.threshold(dist, 0.7 * dist.max(), 255, cv2.THRESH_BINARY)\nnm, markers = cv2.connectedComponents(peaks.astype(np.uint8))\nsure_bg = cv2.dilate(m, np.ones((3, 3), np.uint8), iterations=3)\nmarkers = markers + 1; markers[(sure_bg > 0) & (peaks == 0)] = 0           # 0 = unknown region to flood\ncol = cv2.cvtColor(m, cv2.COLOR_GRAY2BGR)\nws = cv2.watershed(col, markers.astype(np.int32))\nprint('seeds:', nm - 1, ' regions after watershed:', len(np.unique(ws[ws > 1])), ' boundary pixels (-1):', int((ws == -1).sum()))\nprint('split column of the boundary at row 50:', int(np.where(ws[50] == -1)[0][len(np.where(ws[50] == -1)[0]) // 2]))", "out": "connected components of the mask: 1\ndistance transform peak 29.8 at the disc centres\nseeds: 2  regions after watershed: 2  boundary pixels (-1): 779\nsplit column of the boundary at row 50: 70"}, "g_contour": {"lang": "py", "file": "g_contour.py", "src": "import numpy as np, cv2\nfrom cvk import shapes\nb = (shapes() > 100).astype(np.uint8)\ncs, hier = cv2.findContours(b, cv2.RETR_EXTERNAL, cv2.CHAIN_APPROX_SIMPLE)\nfor c in sorted(cs, key=lambda c: cv2.boundingRect(c)[0] * 1000 + cv2.boundingRect(c)[1]):\n    A = cv2.contourArea(c); P = cv2.arcLength(c, True); M = cv2.moments(c)\n    approx = cv2.approxPolyDP(c, 0.02 * P, True); circ = 4 * np.pi * A / P ** 2\n    print('area %6.0f perim %5.1f centroid (%.1f, %.1f) vertices %2d circularity %.2f' % (A, P, M['m10'] / M['m00'], M['m01'] / M['m00'], len(approx), circ))\nsq = np.array([[0, 0], [4, 0], [4, 3], [0, 3]], float)\narea = 0.5 * abs(np.dot(sq[:, 0], np.roll(sq[:, 1], -1)) - np.dot(sq[:, 1], np.roll(sq[:, 0], -1)))\nprint('shoelace area of a 4x3 rectangle:', area, '== cv2', cv2.contourArea(sq.astype(np.float32)))\nhu = cv2.HuMoments(cv2.moments(cs[0])).ravel(); print('Hu moment 1 (rotation/scale invariant): %.4f' % hu[0])", "out": "area   1521 perim 156.0 centroid (34.5, 39.5) vertices  4 circularity 0.79\narea   1454 perim 145.5 centroid (40.0, 85.0) vertices  8 circularity 0.86\narea   1250 perim 170.7 centroid (86.7, 53.3) vertices  3 circularity 0.54\narea    570 perim  98.0 centroid (106.0, 109.5) vertices  4 circularity 0.75\nshoelace area of a 4x3 rectangle: 12.0 == cv2 12.0\nHu moment 1 (rotation/scale invariant): 0.1844"}, "g_hough": {"lang": "py", "file": "g_hough.py", "src": "import numpy as np, cv2\nimg = np.zeros((120, 160), np.uint8); cv2.line(img, (10, 100), (150, 30), 255, 1); cv2.line(img, (40, 5), (40, 115), 255, 1)\ndef hough(edges, nth=180):\n    ys, xs = np.nonzero(edges); th = np.deg2rad(np.arange(nth)); diag = int(np.ceil(np.hypot(*edges.shape)))\n    acc = np.zeros((2 * diag + 1, nth), int)\n    rho = np.round(xs[:, None] * np.cos(th) + ys[:, None] * np.sin(th)).astype(int) + diag   # every point votes for every angle\n    for j in range(nth): np.add.at(acc[:, j], rho[:, j], 1)\n    return acc, diag\nacc, diag = hough(img)\ntop = np.argsort(acc.ravel())[::-1][:2]; r, t = np.unravel_index(top, acc.shape)\nprint('mine: top lines (rho, theta deg, votes):', [(int(a - diag), int(b), int(acc[a, b])) for a, b in zip(r, t)])\nL = cv2.HoughLines(img, 1, np.pi / 180, 60)\nprint('cv2.HoughLines strongest:', [(round(float(l[0][0])), round(float(np.degrees(l[0][1])))) for l in L[:2]])\nP = cv2.HoughLinesP(img, 1, np.pi / 180, 40, minLineLength=50, maxLineGap=3); print('probabilistic segments
