unit('u7', 7, 'seg', 'f3', 'Hough transforms and contours', 'Finding lines and circles by voting, and describing shapes by their outlines: area, perimeter, polygons and moments.', [
  lesson('u7l1', 'The Hough transform', REF.hough, [
    LS('Voting in parameter space', 'An edge map is a cloud of points. To find straight lines among them, **each edge point votes for every line that could pass through it**, and real lines collect many votes.\n\nThe slope–intercept form y = mx + c breaks for vertical lines (m → ∞), so Hough uses the **normal form**\n\n**ρ = x cos θ + y sin θ**\n\nwhere θ ∈ [0°, 180°) is the direction of the line’s normal and ρ its signed distance from the origin. One point (x, y) votes along a **sinusoid** in (ρ, θ); collinear points’ sinusoids cross at one cell — the line.\n\nWalk-through: the point (40, 30) and θ = 0° gives ρ = 40·1 + 30·0 = 40 (a vertical line x = 40). At θ = 90°, ρ = 30 (the horizontal line y = 30). The accumulator is a 2-D array of counters, typically 1-px ρ bins × 1° θ bins.'),
    LS('Lines, segments and circles in practice', 'The example implements the accumulator in NumPy and takes the two strongest peaks: (ρ = 40, θ = 0°, **111** votes) and (94, 64°, 80 votes), exactly the two lines `cv2.HoughLines` reports.\n\n- **Probabilistic Hough** (`HoughLinesP`) votes with a random subset of points and returns finite **segments** with end points (3 here) — usually what you want.\n- **Circles** have 3 parameters (x, y, r). `HoughCircles` uses the gradient direction: each edge point votes only along its gradient line for the centre, then the radius is chosen per centre. Here: (30, 30, r 10) and (80, 60, r 27).\n\nPeaks must be found with non-maximum suppression in the accumulator; quantisation of ρ and θ trades accuracy against noise tolerance.', PX('g_hough')),
    NU('Point (30, 40), θ = 90°. What is ρ?', 40, 'ρ = x cos 90° + y sin 90° = 30·0 + 40·1 = 40: the horizontal line y = 40.', 'ρ = x cos θ + y sin θ.'),
    NU('Point (10, 10), θ = 45°. What is ρ? (2 decimals)', 14.14, 'ρ = 10·0.7071 + 10·0.7071 = 14.14 — the distance of the diagonal line through (10, 10) from the origin.', 'cos 45° = sin 45° = 0.7071.', { tol: 0.02 }),
    MC('Why does the Hough transform use (ρ, θ) instead of (m, c)?', ['m is infinite for vertical lines; (ρ, θ) is bounded for every line', 'it is faster to compute', 'ρ is always an integer', 'OpenCV cannot store slopes'], 'Both ρ and θ stay in finite ranges, so the accumulator is a finite array.', 'What is the slope of x = 40?'),
    TF('In the (ρ, θ) plane, a single image point votes along a sinusoid.', true, 'For fixed (x, y), ρ(θ) = x cos θ + y sin θ is a sinusoid of amplitude √(x² + y²).', 'Fix x, y and vary θ.')
  ]),
  lesson('u7l2', 'Contours and shape descriptors', REF.hough, [
    LS('From masks to outlines', '`cv2.findContours` follows the border of every blob (Suzuki–Abe border following) and returns each as a list of boundary points; with `RETR_TREE` it also returns the nesting (holes inside shapes).\n\nFrom a contour you can measure:\n\n| Measure | How |\n|---|---|\n| area | **shoelace formula** ½ |Σ(xᵢyᵢ₊₁ − xᵢ₊₁yᵢ)| |\n| perimeter | sum of segment lengths (`arcLength`) |\n| centroid | moments: (m10/m00, m01/m00) |\n| polygon | `approxPolyDP` (Douglas–Peucker, tolerance ε) |\n| circularity | 4π·area/perimeter²: 1 for a circle, 0.785 for a square |\n| Hu moments | 7 combinations of central moments invariant to translation, scale, rotation |\n\nContour area is the polygon through the **pixel centres**, so it is smaller than the pixel count: the 40×40 square of 1600 pixels has contour area 39×39 = **1521**.'),
    LS('Walk-through', 'Shoelace for the rectangle (0,0), (4,0), (4,3), (0,3): terms 0·0 − 4·0 = 0, 4·3 − 4·0 = 12, 4·3 − 0·3 = 12, 0·0 − 0·3 = 0. Sum 24, half 12 — same as `cv2.contourArea`.\n\nIn the example the four shapes are classified by `approxPolyDP` vertex count and circularity: the square has 4 vertices and circularity 0.79; the disc 8 vertices (the polygon approximation of a curve) and 0.86 — the highest; the triangle 3 and 0.54. Pixelated outlines lower circularity below the ideal value, so use thresholds, not exact values.', PX('g_contour')),
    NU('Shoelace area of the triangle (0,0), (6,0), (0,4)?', 12, 'Terms: 0·0 − 6·0 = 0; 6·4 − 0·0 = 24; 0·0 − 0·4 = 0. ½·|24| = 12 (= ½·base·height).', '½ |Σ (xᵢ yᵢ₊₁ − xᵢ₊₁ yᵢ)|, wrapping round.'),
    NU('Circularity 4π·A/P² of a square of side 10? (3 decimals)', 0.785, '4π·100/40² = 1256.6/1600 = 0.785 (= π/4).', 'A = s², P = 4s.', { tol: 0.002 }),
    MC('Which contour measure stays the same when a shape is rotated, scaled and shifted?', ['Hu moments', 'bounding-box width', 'raw moment m10', 'centroid'], 'Hu moments are built from normalised central moments to be invariant to all three.', 'Which ones depend on position?'),
    TF('A blob of 1600 pixels has a contour area of exactly 1600.', false, 'Contour area is the polygon through boundary pixel centres; the 40×40 square gives 39×39 = 1521.', 'Where do the contour points lie?')
  ])
]);

unit('u8', 8, 'geo', 'rd', 'Geometric transforms', 'Moving pixels: affine and perspective warps, interpolation, homographies from four points, and stitching a panorama.', [
  lesson('u8l1', 'Warping and interpolation', REF.geo, [
    LS('Forward versus backward mapping', 'To rotate, scale or shear an image you need, for every output pixel, a value from the input. **Forward mapping** (push each input pixel to its new place) leaves holes and overlaps. **Backward mapping** loops over output pixels, applies the **inverse** transform to find where each came from, and samples the input there — no holes. `cv2.warpAffine` and `warpPerspective` do this.\n\nThe source position is usually fractional, so you **interpolate**:\n\n- **nearest**: round — blocky, but keeps label values exact (use for masks);\n- **bilinear**: weight the 4 neighbours by area;\n- **bicubic**: 16 neighbours, sharper, can overshoot;\n- **area**: average the covered pixels — best for shrinking (anti-aliasing).\n\nAn **affine** transform [x′, y′]ᵀ = A [x, y]ᵀ + t has 6 parameters: rotation, scale, shear, translation. Parallel lines stay parallel.'),
    LS('Walk-through: bilinear sampling', 'Sample at (x, y) = (100.5, 50.25). The neighbours are columns 100–101, rows 50–51; fractions a = 0.5, b = 0.25:\n\nI = (1−a)(1−b) I₀₀ + a(1−b) I₁₀ + (1−a)b I₀₁ + ab I₁₁\n\nThe example does this by hand (78.0) and compares a complete backward-mapped warp with `cv2.warpAffine`: they differ by at most 4.2 grey levels, because OpenCV uses fixed-point weights with 1/32-pixel steps.\n\nDownsampling ×4 and upsampling back shows why INTER_AREA is the default for shrinking: RMS error nearest 27.5, linear 20.2, cubic 21.8, **area 18.9**.', PX('h_warp')),
    GM('bilinear'), GM('rotpt'), GM('bilinear'),
    MC('You must resize a segmentation mask whose pixels are class labels 0–20. Which interpolation?', ['nearest', 'bilinear', 'bicubic', 'area'], 'Any averaging creates labels that do not exist (e.g. 7.5 between class 5 and 10). Nearest copies a real label.', 'Labels are not intensities.'),
    TF('Backward mapping can leave holes in the output image.', false, 'Every output pixel looks up a source value; holes are a forward-mapping problem.', 'Which side do we loop over?')
  ]),
  lesson('u8l2', 'Homographies', REF.geo, [
    LS('Projective transforms', 'A **homography** maps a plane to a plane under perspective — a photographed document, a floor, a building facade — or relates two images taken from a camera that only rotates. In homogeneous coordinates\n\n[x′w, y′w, w]ᵀ = H [x, y, 1]ᵀ, then divide: (x′, y′) = (x′w/w, y′w/w).\n\nH is 3×3 but defined only **up to scale**, so it has 9 − 1 = **8 degrees of freedom**. Each point correspondence gives 2 equations, so **4 points** (no 3 collinear) determine H. With more points, solve the **DLT** (direct linear transform) by SVD: stack 2 rows per correspondence into A and take the singular vector of the smallest singular value; normalise coordinates first (Hartley).\n\nStraight lines stay straight; parallel lines may meet (vanishing points).'),
    LS('Walk-through: un-warping a document', 'The example builds H from four corners with its own DLT and checks it equals `cv2.getPerspectiveTransform`. Applying H to (300, 20): the third coordinate is w = 1.0591, and dividing gives exactly (280, 0) — the corner of the rectified page. Forgetting the division is the classic bug: points drift as soon as H has a perspective row.', PX('h_homog')),
    GM('homapply'), GM('dof'), GM('homapply'),
    MC('How many point correspondences are needed to determine a homography?', ['4', '3', '6', '8'], '8 unknowns, 2 equations per point.', 'Count degrees of freedom.'),
    TF('A homography always keeps parallel lines parallel.', false, 'Only affine transforms (last row 0, 0, 1) do. A perspective H makes railway tracks meet.', 'Look at the last row.')
  ]),
  lesson('u8l3', 'Panorama stitching', REF.geo, [
    LS('The stitching pipeline', 'Two photos taken by rotating a camera about its centre are related by a homography. A panorama is:\n\n1. **features** in each image (ORB/SIFT);\n2. **match** with the ratio test;\n3. **RANSAC homography** between the pair;\n4. **warp** one image into the other’s frame (`warpPerspective` onto a large canvas);\n5. **blend** the overlap (feathering or multi-band blending hides seams and exposure differences).\n\nFor many images, chain the homographies to one reference and refine them all at once with **bundle adjustment**; cylindrical or spherical projection keeps wide panoramas from stretching.\n\nThe example cuts two overlapping views from a wide scene: 150 matches, 61 RANSAC inliers, recovered shift (180.07, −0.12) vs the true (180, 0), and a stitched result within 1.00 grey level RMS of the original scene.', PX('h_stitch')),
    OR('Order the stitching pipeline.', ['detect features in both images', 'match descriptors with the ratio test', 'estimate H with RANSAC', 'warp one image onto the other’s canvas', 'blend the overlap'], 'Each stage feeds the next.'),
    MC('Why must the camera rotate about its optical centre (no translation) for a single homography to align two full photos?', ['with translation, parallax makes near and far points shift by different amounts', 'translation changes the focal length', 'RANSAC cannot handle translation', 'it keeps exposure constant'], 'A homography models a plane or a pure rotation; a moving camera sees parallax unless the scene is planar or very far away.', 'Hold a finger up and move your head.'),
    TF('Blending is needed only when the two images have different exposures.', false, 'Small misalignment, vignetting and moving objects also create seams; feathering or multi-band blending hides them.', 'What else differs in the overlap?')
  ])
]);
})();

/* ---- lern2vision/l05.js — Unit 9 multi-view geometry and motion, Unit 10 tracking ---- */
(function () {

unit('u9', 9, 'geo', 'op', 'Calibration, stereo and 3D from images', 'Measuring the camera, getting depth from two views, the epipolar constraint, structure from motion, and optical flow.', [
  lesson('u9l1', 'Camera calibration', REF.mv, [
    LS('What calibration finds', 'Calibration estimates the **intrinsics** K = [[f_x, 0, c_x], [0, f_y, c_y], [0, 0, 1]] and the **lens distortion** (radial k₁, k₂, k₃ and tangential p₁, p₂) by photographing a known pattern — usually a chessboard — from 10–20 poses.\n\n**Zhang’s method** (2000): the board is a plane, so each view gives a homography Hᵢ = K[r₁ r₂ t]. Because r₁ and r₂ are orthonormal, each H gives **two linear constraints** on B = K⁻ᵀK⁻¹. Three or more views solve B, and K follows by Cholesky. Then **non-linear least squares** (Levenberg–Marquardt) refines K, distortion and all poses by minimising the **reprojection error** — the pixel distance between detected corners and the corners projected by the model.\n\nRadial distortion: x_d = x(1 + k₁r² + k₂r⁴ + …), barrel when k₁ < 0.'),
    LS('Walk-through', 'The example renders a synthetic chessboard into 12 views with true f = 600, c = (320, 240), k₁ = −0.15, k₂ = 0.05, adds 0.2 px noise, and runs `cv2.calibrateCamera`: reprojection RMS **0.265 px** (close to the noise, as it should be), f = (599.4, 599.6), c = (321.9, 240.4). A from-scratch Zhang closed form, after removing distortion, gives f ≈ 601, c ≈ (319.9, 240.1).\n\nNote k₂ came out as −0.046 instead of +0.05: k₂ only matters near the image corners, and when the views do not cover them it is poorly constrained. **Cover the whole field of view, at varied tilts**, and check the reprojection error.', PX('i_calib')),
    GM('project'), GM('fov'),
    MC('A calibration reports reprojection RMS 0.3 px. What does that mean?', ['the model predicts the detected corners to about 0.3 px on average', 'the lens has 0.3 % distortion', 'the focal length is accurate to 0.3 px', 'the board was 0.3 mm thick'], 'Reprojection error is the pixel residual of the fitted model; a few tenths of a pixel is good. It does not by itself prove each parameter is accurate (see k₂).', 'What is being compared?'),
    TF('Zhang’s method needs a 3-D calibration object.', false, 'It uses a planar pattern in several orientations — that is its key practical advantage.', 'Chessboard.')
  ]),
  lesson('u9l2', 'Stereo and depth', REF.mv, [
    LS('Triangulating from disparity', 'Two cameras side by side, rectified so their image rows line up, see a point at x_L and x_R. The **disparity** d = x_L − x_R; similar triangles give\n\n**Z = f·B / d**\n\nwith f in pixels and B the baseline. Walk-through: f = 500 px, B = 0.1 m, d = 16 px → Z = 50/16 = **3.125 m**; d = 32 px → 1.562 m.\n\nDepth resolution worsens quadratically: ΔZ ≈ Z²/(fB)·Δd. At 3.125 m one pixel of disparity error is 0.195 m. Wider baselines and longer lenses help far away but make matching harder close up.\n\n**Block matching** slides a window along the same row and picks the disparity with the smallest SAD. **SGBM** (semi-global) adds smoothness penalties along 8 directions — far better on low texture.', PX('i_stereo')),
    GM('depth'), GM('depth'),
    NU('f = 800 px, B = 0.12 m, disparity 24 px. Depth Z in metres?', 4, 'Z = fB/d = 800 × 0.12 / 24 = 96/24 = 4 m.', 'Z = fB/d.', { tol: 0.01 }),
    MC('Stereo block matching fails on a plain white wall because…', ['every window along the row looks the same, so the minimum SAD is ambiguous', 'the wall is too far away', 'disparity is negative', 'white saturates the sensor'], 'Matching needs texture. Active stereo projects a dot pattern to add it.', 'What distinguishes the windows?'),
    TF('Doubling the distance to an object halves its disparity.', true, 'd = fB/Z is inversely proportional to depth.', 'Rearrange Z = fB/d.')
  ]),
  lesson('u9l3', 'Epipolar geometry', REF.mv, [
    LS('The fundamental and essential matrices', 'For two general views, a point x₁ in image 1 must appear in image 2 somewhere on a line — its **epipolar line** l₂ = F x₁. That is the **epipolar constraint**\n\n**x₂ᵀ F x₁ = 0**\n\nF (3×3, rank 2, 7 DoF) is the **fundamental matrix**, working in pixels. With calibrated cameras, normalised coordinates give the **essential matrix** E = Kᵀ F K = [t]ₓ R, which has two equal singular values and one zero; decomposing it gives the rotation R and the translation direction t (scale is lost).\n\nThe **8-point algorithm**: each match gives one linear equation in the 9 entries of F; solve by SVD, then force rank 2 by zeroing the smallest singular value. Normalise coordinates first (Hartley 1997) or the answer is badly conditioned. RANSAC wraps it for real matches.'),
    LS('Walk-through', 'In the example the constraint holds to 2.2 × 10⁻¹⁶ with exact data; the 8-point F equals the true F up to scale and agrees with `cv2.FM_8POINT`. F has rank 2, E has singular values (1.0062, 1.0062, 0), and `recoverPose` returns R with zero angle error and the unit translation direction (0.9938, 0.0497, 0.0994) — the true direction, without its length.', PX('i_epipolar')),
    GM('epiq'), GM('epiq'),
    MC('Why does a matched point need to be searched only along a line in the other image?', ['the 3-D point lies on a ray from camera 1, which projects to a line in camera 2', 'the cameras are always side by side', 'the images are rectified', 'F has rank 3'], 'The unknown depth slides the point along a ray; its image in camera 2 is the epipolar line.', 'What is unknown about the point?'),
    TF('From E you can recover the full translation vector including its length.', false, 'Only its direction: scaling the whole scene and baseline together gives the same images.', 'Scale ambiguity.')
  ]),
  lesson('u9l4', 'Triangulation, PnP and structure from motion', REF.mv, [
    LS('From two views to many', '**Triangulation**: given two camera matrices P₁, P₂ and a match, the 3-D point X satisfies x₁ × (P₁X) = 0 and x₂ × (P₂X) = 0 — four linear equations, solved by SVD (the DLT). The example’s version matches `cv2.triangulatePoints` to 4.7 × 10⁻¹³ m.\n\n**PnP** (perspective-n-point) finds the pose of a camera from known 3-D points and their 2-D images: `solvePnPRansac` locates camera 3 to within 5 mm.\n\n**Structure from motion** (COLMAP and friends) repeats: match → relative pose from E → triangulate → add new cameras with PnP → triangulate more points → **bundle adjustment**: minimise total reprojection error over all cameras and points with Gauss–Newton or Levenberg–Marquardt, exploiting the sparse Jacobian. The example’s Gauss–Newton finishes at 0.529 px RMS. SLAM is the same idea run online.', PX('i_sfm')),
    OR('Order incremental structure from motion.', ['match features between an initial pair', 'estimate E and recover the relative pose', 'triangulate the first 3-D points', 'register further cameras with PnP', 'refine everything with bundle adjustment'], 'Bundle adjustment is also run periodically during growth.'),
    MC('What does bundle adjustment minimise?', ['total reprojection error over all cameras and points', 'the number of features', 'the epipolar distance of one pair', 'the disparity range'], 'It jointly refines every pose and point so projected points land on their detections.', 'Bundles of rays.')
  ]),
  lesson('u9l5', 'Optical flow', REF.flow, [
    LS('Brightness constancy and Lucas–Kanade', 'Optical flow is the apparent motion (u, v) of each pixel between frames. Assuming a point keeps its brightness and moves a little, a Taylor expansion gives the **optical flow constraint**\n\n**I_x u + I_y v + I_t = 0**\n\n— one equation, two unknowns (the **aperture problem**: along an edge you can only see the normal motion). **Lucas–Kanade** assumes the flow is constant in a small window and solves the least-squares system\n\n[[ΣI_x², ΣI_xI_y], [ΣI_xI_y, ΣI_y²]] [u, v]ᵀ = −[ΣI_xI_t, ΣI_yI_t]\n\n— the structure tensor again: track only where both eigenvalues are large (Shi–Tomasi corners).\n\nWalk-through: true motion (1.6, −0.8). One LK step gives (1.22, −0.81) — the linearisation is poor for motion over a pixel. Ten **iterative** warps reach (1.64, −0.84); **pyramidal** LK (coarse to fine) gives median (1.60, −0.81) over 50 corners. Dense methods: Horn–Schunck adds a global smoothness term (here (1.12, −0.60), oversmoothed), Farnebäck fits polynomials (1.58, −0.79).', PX('i_flow')),
    GM('lkq'), GM('lkq'),
    MC('What is the aperture problem?', ['along a straight edge only the motion perpendicular to the edge can be measured', 'the lens aperture blurs moving objects', 'flow cannot be computed at corners', 'large motions need a big aperture'], 'One constraint, two unknowns: motion along the edge is invisible locally.', 'Look at a moving line through a small hole.'),
    TF('Pyramidal LK handles larger motions than single-level LK.', true, 'At coarse levels a 16 px motion becomes 2 px, inside the linearisation range; the estimate is then refined level by level.', 'Downsampling shrinks motion.')
  ])
]);

unit('u10', 10, 'geo', 'f7', 'Tracking', 'Following objects over time: the Kalman filter for prediction and noise, and mean shift / CamShift for appearance-based tracking.', [
  lesson('u10l1', 'The Kalman filter', REF.track, [
    LS('Predict and update', 'A Kalman filter tracks a hidden state x (e.g. position and velocity) from noisy measurements z, assuming linear motion and Gaussian noise.\n\n**Predict**: x⁻ = F x, P⁻ = F P Fᵀ + Q\n**Update**: K = P⁻Hᵀ(H P⁻ Hᵀ + R)⁻¹, x = x⁻ + K(z − H x⁻), P = (I − KH) P⁻\n\nF is the motion model (constant velocity: x += vx·dt), H picks the measured parts, Q is process noise (how much the model can be wrong), R is measurement noise. The **gain** K balances them.\n\n1-D intuition: K = P/(P + R). With a large initial uncertainty P = 25 and R = 1, K = 0.962 — trust the measurement. As P shrinks, K shrinks and the filter smooths.'),
    LS('Walk-through', 'The example tracks a ball moving at (3, 1.5) px/frame with 2 px measurement noise. The from-scratch filter matches `cv2.KalmanFilter` to 1e−5 px, cuts the RMS error from 2.25 px (raw) to **1.21 px**, and estimates the velocity — never measured directly — as (2.99, 1.65). In multi-object trackers (SORT, ByteTrack) a Kalman filter predicts each box and the Hungarian algorithm matches predictions to detections by IoU.', PX('j_kalman')),
    GM('kalman'), GM('kalman'),
    MC('Increasing Q (process noise) makes the filter…', ['follow the measurements more quickly and smooth less', 'smooth more and lag more', 'ignore measurements', 'stop predicting'], 'More doubt in the model raises P⁻ and therefore K.', 'K = P/(P + R).'),
    TF('A Kalman filter can estimate quantities that are never measured, like velocity.', true, 'They are linked to measurements through F; the example recovers (2.99, 1.65).', 'Hidden state.')
  ]),
  lesson('u10l2', 'Mean shift and CamShift', REF.track, [
    LS('Climbing a probability map', '**Mean shift** finds the mode of a density by repeatedly moving a window to the centroid of the weights inside it. For tracking:\n\n1. build a **hue histogram** of the target in the first frame;\n2. **back-project** it: each pixel of a new frame gets the histogram value of its hue — a likelihood map;\n3. start the window at the last position and **shift** it to the weighted centroid until it stops moving.\n\n**CamShift** also adapts the window size and orientation from the moments of the back-projection.\n\nWalk-through: the example follows a red ball across 5 frames within 1 px in 5 iterations each. From-scratch mean shift from (92, 52) converges to (99.3, 59.3) next to the ball at (100, 60) — but started at (60, 40), with no ball pixels in the window, it converges in 1 step to where it started. **Mean shift is local**: it needs the target to overlap the window, and the histogram here also picked up green field, so background leaks into the model.', PX('j_meanshift')),
    MC('A mean-shift tracker loses a fast object that moves farther than the window size between frames. Why?', ['mean shift only climbs the density inside the window; with no target pixels there, nothing pulls it', 'the hue histogram changes', 'the window is too small to compute a centroid', 'the frame rate is too high'], 'The example started away from the ball converges where it started. Predict with a Kalman filter first, or search more widely.', 'Local search.'),
    TF('CamShift adapts the window size to the object.', true, 'Continuously Adaptive Mean Shift uses the zeroth and second moments to resize and rotate the window.', 'The name.'),
    MA('Match the tracker component to its job.', [['hue histogram', 'appearance model of the target'], ['back-projection', 'per-pixel likelihood map'], ['mean-shift step', 'move to the weighted centroid'], ['Kalman prediction', 'guess the next position from motion']], 'Appearance and motion models are often combined.')
  ])
]);
})();

/* ---- lern2vision/l06.js — Unit 11 classical recognition, Unit 12 ML foundations ---- */
(function () {

unit('u11', 11, 'learn', 'rs1', 'Classical object recognition', 'Before deep nets: turning patches into gradient histograms for a linear SVM, and cascaded Haar features with AdaBoost.', [
  lesson('u11l1', 'HOG + linear SVM', REF.rec, [
    LS('Histograms of oriented gradients', 'Dalal and Triggs (2005) showed that **local distributions of gradient directions** describe object shape well while tolerating small shifts and lighting changes:\n\n1. gradients G_x, G_y; **unsigned** orientation in [0°, 180°) — a dark coat on a bright street and a bright coat on a dark street have the same silhouette;\n2. split into **cells** (typically 8×8 px), build a **9-bin** orientation histogram weighted by magnitude;\n3. group 2×2 cells into overlapping **blocks** (stride 1 cell) and **L2-normalise** each 36-vector — local contrast normalisation;\n4. concatenate all blocks into one feature vector and classify with a **linear SVM**.\n\nWalk-through for the classic 64×128 pedestrian window: 8×16 cells → **7×15** overlapping 2×2 blocks × 4 cells × 9 bins = **3780** numbers. Slide the window over an image pyramid, score with w·x + b, and suppress duplicates with NMS.'),
    LS('Code walk-through', 'On 12×12 digit-like glyphs with 4×4 cells (3×3 cells → 2×2 = 4 blocks → 4×4×9 = 144 numbers), `cv2.ml.SVM` reaches **1.000** test accuracy and a 15-line from-scratch hinge-loss linear SVM reaches **0.965**.', PX('k_hog')),
    NU('How many HOG features for a 32×32 window with 8×8 cells, 2×2-cell blocks at 1-cell stride, and 9 bins?', 324, '32/8 = 4 cells per side → (4 − 1)×(4 − 1) = 9 blocks × 4 cells × 9 bins = 324.', 'Blocks along n cells at stride 1: n − 1.'),
    MC('Why does HOG use unsigned angles (0°–180°) for pedestrians?', ['the silhouette edge is the same whether the person is darker or brighter than the background', 'signed angles need twice as much memory', 'atan2 only returns 0°–180°', 'the SVM requires positive numbers'], 'Flipping contrast flips the gradient sign by 180°, which leaves the unsigned bin unchanged.', 'Dark jacket vs white shirt against grey.'),
    TF('Block normalisation in HOG makes the descriptor less sensitive to local lighting and contrast changes.', true, 'Scaling intensities in a block scales all gradients by the same factor, which L2 normalisation cancels.', 'Multiply a vector by c, then divide by its norm.')
  ]),
  lesson('u11l2', 'Viola–Jones: Haar, AdaBoost and cascades', REF.rec, [
    LS('Three ideas for real-time detection (2001)', 'Viola and Jones detected faces at 15 fps on a 2001 PC by combining three ideas:\n\n1. **Haar-like features**: differences of rectangle sums (eyes darker than cheeks; nose bridge brighter than eyes), each computed in **constant time** from the **integral image** (Unit 3).\n2. **AdaBoost**: from tens of thousands of candidate features, greedily add weak stumps h_t(x) ∈ {−1, +1}; weight round t by α_t = ½ ln((1 − ε_t)/ε_t), then **reweight** examples so misclassified ones matter more next round. Strong classifier: sign(Σ α_t h_t(x)).\n3. **Attentional cascade**: arrange stages of 2, 5, 20, … features. Almost every background window is rejected in the **first couple of features**, so the average cost per window is tiny.'),
    LS('Walk-through', 'On synthetic faces vs clutter the example evaluates 33 horizontal two-rectangle features in constant time via an integral image and runs 5 rounds of AdaBoost: round 1 picks the eye-vs-cheek strip (weighted error 0.247 → α = 0.56), round 2 another strip (0.263 → α = 0.51), later rounds mop up harder cases (ε ≈ 0.40 → α ≈ 0.20), reaching 0.803 training accuracy with just 5 stumps. Notice how ε = 0.5 (random guessing) gives α = ½ ln 1 = **0**.', PX('k_viola')),
    NU('A weak learner has weighted error ε = 0.2. What is its AdaBoost weight α = ½ ln((1 − ε)/ε)? (3 decimals)', 0.693, '½ ln(0.8/0.2) = ½ ln 4 = ln 2 = 0.693.', '½ ln((1 − ε)/ε).', { tol: 0.005 }),
    MC('Why is a cascade much faster than one flat 200-feature AdaBoost classifier?', ['nearly all windows are background and get rejected by the first tiny stages', 'each stage uses smaller images', 'cascades skip the integral image', 'AdaBoost cannot use 200 features'], 'Only promising windows ever reach the expensive later stages.', 'Most of an image is not a face.'),
    TF('After an AdaBoost round, the weights of correctly classified training examples go up.', false, 'Misclassified examples get higher weight so the next weak learner focuses on them.', 'Hard examples.')
  ])
]);

unit('u12', 12, 'learn', 'rs2', 'Machine learning foundations for vision', 'Linear classifiers, softmax and cross-entropy, generalisation and regularisation, and back-propagation checked numerically.', [
  lesson('u12l1', 'Softmax, cross-entropy and linear classifiers', REF.ml, [
    LS('Scores, probabilities and loss', 'A linear classifier turns a flattened input x into one score (**logit**) per class: z = Wx + b. **Softmax** converts logits into probabilities that are positive and sum to 1:\n\n**p_k = exp(z_k) / Σ_j exp(z_j)**\n\nIn code, subtract max(z) before `exp` — shifting every logit by the same constant leaves softmax unchanged and prevents overflow.\n\n**Cross-entropy loss** for true class y is **L = −ln p_y**: 0 when p_y = 1, ∞ as p_y → 0. At random initialisation all K classes get p ≈ 1/K, so L ≈ **ln K** — a quick sanity check on step 0 of any classifier (ln 4 = 1.3863 in the example).\n\nThe gradient of softmax + cross-entropy with respect to the logits has the remarkably clean form **∂L/∂z = p − onehot(y)**: predicted minus true.'),
    LS('Walk-through', 'Softmax of [2, 1, 0.1]: subtract 2 → [0, −1, −1.9], exp → [1, 0.3679, 0.1496], sum 1.5175, divide → **[0.659, 0.242, 0.099]**.\n\nThe example trains softmax regression on 4 synthetic classes: epoch 0 loss is **1.3863** = ln 4 (acc 0.225), epoch 10 reaches 0.885 validation accuracy, epoch 50 hits 1.000.', PX('l_logreg')),
    GM('softmax'), GM('xent'), GM('softmax'),
    NU('Step 0 of a 10-class classifier with small weights should have cross-entropy loss near… (2 decimals)', 2.3, 'Uniform p = 0.1 gives −ln(0.1) = ln 10 = 2.3026. Much higher means bad init or a bug in the loss.', 'ln K.', { tol: 0.02 }),
    TF('Adding 100 to every logit changes the softmax probabilities.', false, 'exp(z_k + c) = e^c exp(z_k), and e^c cancels between numerator and denominator. That is why subtracting max(z) is exact.', 'Write out the fraction.')
  ]),
  lesson('u12l2', 'Overfitting, validation and regularisation', REF.ml, [
    LS('Why training loss is a liar', 'What you care about is error on **new** images, not the training set. A model with too little capacity **underfits** (high train and validation error); too much capacity **overfits** — memorising noise so training error drops toward zero while validation error explodes.\n\nKeep three splits strictly separate:\n\n- **train**: updates weights;\n- **validation** (or **k-fold cross-validation** when data are scarce): chooses hyperparameters — architecture, learning rate, regularisation, early-stopping epoch;\n- **test**: touched **once**, at the end, to report performance. Tuning on the test set leaks it.\n\n**L2 regularisation** (weight decay) adds ½λ‖w‖² to the loss, pulling weights toward zero so the function stays smooth.'),
    LS('Walk-through', 'Fitting noisy points from a cubic: degree 1 underfits (train 0.168, val 0.214); degree 3 hits the sweet spot (val **0.0043**); degree 15 memorises the points (train **0.0008**, val **28.3**). Adding L2 λ = 0.1 tames degree 15 back to val 0.0193, and 5-fold CV picks λ = 0.001 as best among the candidates (0.0443 vs 0.345 at λ = 10, which underfits again).', PX('l_overfit')),
    MC('Train accuracy is 99.8 % and validation accuracy is 61 %. First diagnosis?', ['overfitting: add data/augmentation, weight decay, dropout or a smaller model', 'underfitting: make the network much wider', 'the learning rate is zero', 'cross-entropy is broken'], 'Large train–val gap with near-perfect train accuracy is textbook overfitting.', 'Compare the two accuracies.'),
    MC('You try 30 architectures and report the best score on your test set. What is wrong?', ['you selected on the test set, so the reported score is optimistically biased; select on validation and touch test once', 'nothing — 30 is small', 'you should report the mean of the 30', 'you must retrain on the test set'], 'Every peek at the test set turns it into a validation set.', 'Selection bias.'),
    TF('Making L2 weight decay λ huge always improves validation error.', false, 'Too much regularisation forces weights near zero and underfits (0.345 at λ = 10 in the example).', 'What happens as w → 0?')
  ]),
  lesson('u12l3', 'Multi-layer perceptrons and back-propagation', REF.ml, [
    LS('Why non-linearity, and how back-prop works', 'Stacking linear layers without a non-linearity collapses: W₂(W₁x) = (W₂W₁)x — still one linear layer, unable to carve curved boundaries. Put an element-wise activation like **ReLU(z) = max(0, z)** between them and a two-layer MLP can approximate any continuous function.\n\n**Back-propagation** is just the chain rule applied from the loss backwards, reusing intermediate results:\n\n- forward: h = ReLU(xW₁ + b₁), z = hW₂ + b₂, L = CE(z, y);\n- backward: dz = (p − onehot)/N; dW₂ = hᵀ dz, db₂ = Σ dz; dh = dz W₂ᵀ; dz₁ = dh ⊙ (z₁ > 0); dW₁ = xᵀ dz₁.\n\nNotice every matrix transpose matches the shapes — checking shapes catches almost every bug.'),
    LS('Always check gradients numerically', 'Before trusting a hand-written backward pass, compare each analytical derivative with **centred finite differences**:\n\n(L(θ + ε) − L(θ − ε)) / (2ε), ε ≈ 10⁻⁵.\n\nRelative error below **10⁻⁶** means your back-prop is right. In the example the worst relative error across W₁, b₁, W₂, b₂ is **2.0 × 10⁻⁸**, and the MLP reaches 1.000 validation accuracy in 10 epochs.', PX('l_mlp')),
    MC('What is a two-layer network x → xW₁ → (xW₁)W₂ with no activation equivalent to?', ['a single linear layer x(W₁W₂)', 'a two-layer ReLU MLP', 'a quadratic classifier', 'a kernel SVM'], 'Composition of linear maps is linear.', 'Associativity of matrix multiplication.'),
    NU('ReLU backward: z = −2.5 and incoming gradient dL/da = 3.7. What is dL/dz?', 0, 'For z < 0, ReLU(z) = 0 has derivative 0, so the gradient is blocked.', 'ReLU′(z) = 1 if z > 0 else 0.'),
    MC('Centred finite differences use (f(x+ε) − f(x−ε))/(2ε) rather than (f(x+ε) − f(x))/ε because…', ['the O(ε²) quadratic term cancels, giving O(ε²) error instead of O(ε)', 'it uses half as many function evaluations', 'it avoids overflow', 'ReLU is differentiable at 0'], 'Taylor expand both sides: f′′ cancels.', 'Even powers cancel.')
  ])
]);

unit('u13', 13, 'learn', 'imm', 'Convolutional neural networks from scratch', 'Spatial weight sharing, im2col, every backward pass checked by finite differences, BatchNorm and He init, training, optimisers and augmentation.', [
  lesson('u13l1', 'Convolutional layers and im2col', REF.cnn, [
    LS('Why CNNs beat MLPs on images', 'Connecting a 224×224×3 image to just 1000 hidden units takes 150 million weights in one layer — and shifting the image by 1 pixel looks completely new. A **convolutional layer** fixes both:\n\n- **local connectivity**: each unit reads only a k×k patch across all C_in channels;\n- **weight sharing**: the **same** C_out filters slide across every position, giving **translation equivariance**.\n\nShapes (NCHW): input (N, C_in, H, W), weights (C_out, C_in, k, k), bias (C_out,), output (N, C_out, OH, OW) with\n\n**OH = ⌊(H + 2p − k)/s⌋ + 1**\n\nParameters: **C_out · (C_in · k² + 1)**. Multiply-accumulates per image: **OH · OW · C_out · C_in · k²**.'),
    LS('im2col: convolution as one matrix multiply', 'Six nested loops in Python are slow. **im2col** copies every k×k×C_in receptive field into one row of a matrix of shape (N·OH·OW, C_in·k²); reshape the filters to (C_out, C_in·k²) and the entire layer is **one GEMM** (`cols @ W.T + b`), calling your BLAS.\n\nWalk-through: in `m_convfwd.py` (N, C_in, H, W) = (2, 3, 8, 8), C_out = 4, k = 3, pad = 1 → OH = OW = 8, `cols` is (128, 27), MACs = 13 824, and the result equals both the 6-loop reference and the channel sum of `cv2.filter2D`. Below are both `ex/tinycnn.py` (the 85-line library used across Units 13 and 20) and `m_convfwd.py`.', PX('m_convfwd')),
    LS('The tinycnn library', 'Every layer stores what its backward pass needs and exposes `forward`, `backward` and `params`. Read it top to bottom — there is no hidden magic.', PX('tinycnn')),
    GM('convout'), GM('convparams'), GM('macs'),
    MC('Why does im2col use more memory than direct convolution?', ['overlapping patches duplicate pixels in the column matrix (about k² times)', 'it stores gradients twice', 'weights are copied per pixel', 'padding is stored as float64'], 'For 3×3 stride 1 each interior pixel appears in 9 patches, so cols is ~9× larger than the input — traded for fast GEMM.', 'Count how many patches cover one pixel.')
  ]),
  lesson('u13l2', 'Back-prop through conv, ReLU and max-pool', REF.cnn, [
    LS('Deriving the backward passes', 'With im2col, Conv forward is `out2 = cols @ W2.T + b` where `out2` is (N·OH·OW, C_out) and `W2` is (C_out, C_in·k²). So Conv backward is just Linear backward plus **col2im**:\n\n- `db = g2.sum(0)` — each output site adds the bias once;\n- `dW = (g2.T @ cols).reshape(W.shape)` — correlation of input patches with upstream gradient;\n- `dcols = g2 @ W2`, then `dx = col2im(dcols)` — **scatter-add** each gradient row back onto the input pixels its patch came from (pixels in overlapping patches receive sums).\n\n**MaxPool** forward remembers a boolean mask of which element won each k×k window; backward routes the upstream gradient to the winner and **0** to the others. **ReLU** multiplies by (x > 0).'),
    LS('Hand trace and numerical check', 'On a 1×1×3×3 ramp with 2×2 filter [[1, −1], [0, 2]] and upstream dL/dout = ones: db = **4** (four output positions), dW = [8, 12, 20, 24] (each filter tap sums the four inputs it touched), and dx = [1, 1, 0, 1, 0, −1, 0, −1, −1]. Finite differences confirm Conv (pad and stride 2), MaxPool and ReLU all below **4 × 10⁻⁹** relative error.', PX('m_convbwd')),
    NU('2×2 MaxPool sees window [[1, 5], [3, 2]] and upstream gradient 4. Sum of the 4 entries of dx for this window?', 4, 'Entry (0,1)=5 won, so dx = [[0, 4], [0, 0]], whose sum is 4.', 'Only the winner gets the gradient.'),
    NU('A Conv layer produces a (2, 8, 5, 5) output. If dL/dout is all ones, what is each entry of db?', 50, 'Each channel’s bias is added at N × OH × OW = 2 × 5 × 5 = 50 positions, so db_c = 50.', 'Sum over N, H, W.'),
    MC('Why is col2im a scatter-add (+=) rather than a plain assignment?', ['one input pixel participates in several overlapping patches, so by the chain rule its gradients sum', 'to average the noise', 'because padding overlaps the image', 'NumPy slices require +='], 'Whenever a variable feeds multiple paths, its total derivative is the sum of the path derivatives.', 'Multivariable chain rule.')
  ]),
  lesson('u13l3', 'Activations, He initialisation and BatchNorm', REF.cnn, [
    LS('Keeping signals and gradients alive', 'Sigmoid and tanh **saturate** for |z| ≫ 0: sigmoid’s derivative is at most **0.25**, and 0.0066 at z = 5 — multiply 10 layers and gradients vanish. **ReLU** (and GELU/SiLU) has derivative 1 on the positive half.\n\nInitial weight scale is critical too. Across 10 ReLU layers in `m_bn.py`:\n\n- N(0, 1) weights: activation std explodes to **3.1 × 10¹⁰**;\n- Xavier √(1/fan_in) (derived for linear/tanh): ReLU zeroes half the variance each layer, so std shrinks to **0.024**;\n- **He init** N(0, √(2/fan_in)): the factor of 2 compensates for ReLU, keeping std at **1.02**.\n\n**Batch normalisation** normalises each channel over (N, H, W) to mean 0, variance 1, then applies learnable γ, β. During training it uses batch stats and updates running averages; **at inference it uses those fixed running averages** (forgetting `model.eval()` is a classic bug). When a conv is followed immediately by BN, the conv’s bias cancels out and can be omitted.', PX('m_bn')),
    MC('For a 3×3 Conv with C_in = 64 followed by ReLU, what standard deviation does He initialisation use?', ['√(2 / 576) ≈ 0.059', '√(1 / 576)', '1.0', '1 / 64'], 'fan_in = C_in · k² = 64 × 9 = 576; He uses √(2 / fan_in).', 'fan_in = C_in · k².'),
    MC('What differs about BatchNorm at test time?', ['it normalises with the saved running mean and variance instead of the current batch', 'γ and β are set to 1 and 0', 'it is skipped completely', 'it normalises across channels instead of pixels'], 'Test inputs may arrive one at a time and must be deterministic.', 'Batch of 1.'),
    TF('A Conv layer followed directly by BatchNorm needs its own bias vector.', false, 'BN subtracts the channel mean, removing any constant bias; BN’s β plays the bias role.', 'Add c, then subtract the mean.')
  ]),
  lesson('u13l4', 'Training, optimisers and augmentation', REF.cnn, [
    LS('End-to-end training and the sanity-check habit', 'Good training routine: **(1)** verify loss at step 0 ≈ ln K; **(2)** overfit one tiny batch to ~0 loss (proves forward, backward and step work); **(3)** compare with a linear baseline; **(4)** watch train vs validation.\n\nIn `m_train.py`, a 1828-parameter CNN (`Conv → ReLU → MaxPool → Conv → ReLU → MaxPool → Linear`) classifies shifted glyphs: softmax on raw pixels scores **0.338** (shifts break pixel alignment); the CNN memorises the 80 training images to 1.000 in 4 epochs while validation stalls at **0.573**; adding ±2 px shift augmentation pushes validation to **1.000**.', PX('m_train')),
    LS('Optimisers, learning-rate schedules and augmentation', '**SGD** oscillates across steep ravines and diverges above lr = 2/λ_max (0.04 in `m_optim.py`: 0.039 converges, 0.041 blows up to 131.5). **Momentum** damps the cross-ravine oscillation and speeds progress along the floor. **Adam** keeps running averages of g and g² to scale each parameter (pair with decoupled weight decay, **AdamW**). Schedule lr with warmup then **cosine decay**.\n\n**Data augmentation** synthesises plausible training views — flips, shifts, crops, colour jitter, Cutout, Mixup — **on the training set only**. For detection/keypoints, **transform the labels too**: flipping x → W − x in a 128-wide image turns box [20, 50, 50, 80] into [78, 50, 108, 80].', PX('m_optim')),
    LS('Augmenting boxes and labels', 'Inspect `m_augment.py`: horizontal flip updates x₁, x₂ = W − x₂, W − x₁; rotating an axis-aligned box loosens it; Mixup blends both images and one-hot labels.', PX('m_augment')),
    GM('lrq'),
    NU('Image width W = 200. Horizontal flip sends box [x₁, y₁, x₂, y₂] = [30, 10, 70, 90] to what new x₁?', 130, 'Old right edge x₂ = 70 maps to 200 − 70 = 130, which becomes the new left edge x₁ (and 30 → 170 becomes x₂).', 'New [x₁, x₂] = [W − x₂, W − x₁].'),
    TF('Data augmentation should also be applied to the validation set so train and val match.', false, 'Keep validation clean and deterministic (except deliberate test-time augmentation experiments).', 'Measure real images.')
  ])
]);

unit('u14', 14, 'learn', 'f3', 'Modern vision architectures', 'From LeNet and VGG to residual highways, depthwise-separable mobile nets, and Vision Transformers.', [
  lesson('u14l1', 'Parameter counts, receptive fields and depthwise convs', REF.arch, [
    LS('Where the parameters and FLOPs live', 'Look at the progression verified in `n_params.py` against torchvision/timm:\n\n| Model | Params | Lesson |\n|---|---|---|\n| LeNet-5 | 61.7k | two convs + FC for digits |\n| VGG-16 | **138.4M** | stacked **3×3** convs: three 3×3 have receptive field **7×7** with 27C² vs 49C² weights; 102M of VGG’s params sit in its first FC layer |\n| ResNet-18 | **11.7M** | **global average pooling** replaces the giant FC stack |\n| MobileNet | ~3–4M | **depthwise-separable** convs |\n| ViT-B/16 | **86.6M** | patch tokens + Transformer |\n\n**Receptive field** grows backwards through the network: r_in = r_out · s + (k − s), or tracking jump j: r += (k − 1)·j, j *= s.\n\n**Depthwise-separable** splits k×k conv (C_in·C_out·k²) into **depthwise** k×k per channel (C_in·k²) + **pointwise** 1×1 across channels (C_in·C_out): for 256→256 3×3 that is 589 824 → **67 840** (**8.7× fewer**).', PX('n_params')),
    GM('rf'), GM('archq'),
    NU('Ignoring biases, how many parameters in a depthwise 3×3 + pointwise 1×1 from 64 to 128 channels?', 8768, 'Depthwise: 64 × 9 = 576. Pointwise: 64 × 128 = 8192. Total 8768 (standard 3×3 would be 73 728 — 8.4× more).', 'C_in·k² + C_in·C_out.')
  ]),
  lesson('u14l2', 'Residual networks', REF.arch, [
    LS('Skip connections as gradient highways', 'Plain very deep networks become *harder* to optimise, not just overfitted. He et al. (2016) made each block learn a **residual** around the identity:\n\n**y = x + F(x)**  ⇒  **∂y/∂x = I + ∂F/∂x**\n\nThe **I** term lets gradients flow straight from the loss back to early layers without being multiplied down to zero through 50 weight matrices. When dimensions change (stride 2 or wider channels), a 1×1 projection shortcut matches shapes; for 50+ layers a **bottleneck** 1×1 (shrink) → 3×3 → 1×1 (expand) keeps FLOPs down. Zero-initialising the last BN γ of each block starts every block as an exact identity (`branch × 0.1` in the example keeps the 50-layer gradient at **2.97** vs 2.7 × 10⁻¹⁵ plain).', PX('n_resnet')),
    MC('In y = x + F(x), if F’s weights are initialised to zero, what does the block compute at step 0?', ['the identity y = x, with ∂y/∂x = I', 'y = 0, blocking all gradients', 'random noise', '2x'], 'The network starts as a shallow net and gradually turns blocks on as F learns.', 'Substitute F = 0.'),
    TF('Skip connections add many parameters to every same-shape residual block.', false, 'Element-wise addition has zero parameters; only shape-changing shortcuts need a 1×1 projection.', 'Count weights in x + F(x).')
  ]),
  lesson('u14l3', 'Self-attention and Vision Transformers', REF.arch, [
    LS('Images as sequences of patches', '**ViT** (Dosovitskiy et al., 2021) chops an H×W image into non-overlapping P×P patches (224×224 with P = 16 → **14×14 = 196** patches), projects each to D dims, prepends a [CLS] token, **adds learnable position embeddings**, and runs a standard Transformer encoder:\n\n**Attention(Q, K, V) = softmax(Q Kᵀ / √d_k) V**\n\nDividing by √d_k keeps dot-product variance near 1 so softmax does not saturate. Multi-head attention runs h smaller attentions in parallel.\n\nTwo sharp contrasts with CNNs proved in `n_attention.py`:\n\n1. Without position embeddings, attention is **permutation-equivariant** — shuffling patches shuffles outputs identically; ViT has almost no built-in spatial inductive bias (needs large datasets, strong augmentation or pre-training).\n2. Cost in tokens N is **O(N²)** (196² = 38 416; halving P to 8 gives 784² = **614 656** — 16× larger). Hierarchical transformers like **Swin** compute attention inside local shifted windows to stay linear in pixels.', PX('n_attention')),
    NU('How many patch tokens (excluding [CLS]) does ViT/16 produce on a 384×384 image?', 576, '(384/16) × (384/16) = 24 × 24 = 576 (attention matrix 576² = 331 776, vs 38 416 at 224²).', '(H/P) × (W/P).'),
    MC('Why divide QKᵀ by √d_k in scaled dot-product attention?', ['for unit-variance Q, K the dot product has variance d_k; scaling keeps logits O(1) so softmax gradients do not vanish', 'to make rows sum to 1', 'to save memory', 'because K has d_k rows'], 'Sum of d_k independent O(1) products has std √d_k.', 'Variance of a sum.'),
    TF('Without positional embeddings, self-attention knows which patches are neighbours.', false, 'It treats tokens as a set; position information comes entirely from positional embeddings (or relative biases).', 'Permute the rows.')
  ])
]);
})();

/* ---- lern2vision/l08.js — Unit 15 detection/segmentation/pose, Unit 16 SSL and generative models ---- */
(function () {
const { REF, C, code, term, table, P, PN, LS, MC, TF, MA, OR, FI, NU, unit, lesson, PX, PXO, PY } = CG.H;

unit('u15', 15, 'deep', 'rd', 'Object detection, segmentation and pose', 'Boxes, IoU and NMS, two-stage and one-stage detectors, mean average precision, U-Net and Mask R-CNN, and keypoint heatmaps.', [
  lesson('u15l1', 'IoU, NMS and bounding-box losses', REF.det, [
    LS('Measuring overlap and removing duplicates', '**Intersection over Union** (Jaccard index) compares two boxes A and B:\n\n**IoU = |A ∩ B| / (|A| + |B| − |A ∩ B|)** ∈ [0, 1].\n\nWalk-through: (0, 0, 10, 10) and (5, 5, 15, 15) overlap on (5, 5, 10, 10) of area 25; each box has area 100, union = 175, IoU = 25/175 = **0.1429**. Try the **IoU & NMS** lab.\n\nDetectors fire many overlapping boxes per object. **Non-maximum suppression** sorts boxes by score, keeps the highest, deletes every remaining box of the same class with IoU above a threshold (often 0.5), and repeats. In `o_iou_nms.py` our greedy NMS matches `cv2.dnn.NMSBoxes` on 18 noisy boxes.\n\nPlain IoU is **0** whenever two boxes do not touch — giving zero gradient regardless of whether they are 1 px or 500 px apart. **GIoU** subtracts (|C \\ (A ∪ B)| / |C|) using the smallest enclosing box C (−0.091 in the example), and **DIoU / CIoU** add centre distance and aspect ratio so boxes pull together smoothly.', PX('o_iou_nms')),
    GM('iou'), GM('nmsq'), GM('iou'),
    MC('Two predicted boxes sit on the same person with IoU = 0.72 and scores 0.91 and 0.84. With NMS threshold 0.5, what happens?', ['0.91 is kept and 0.84 is suppressed because 0.72 > 0.5', 'both are kept because both score above 0.5', 'they are averaged into one box', '0.84 is kept because it is smaller'], 'NMS compares IoU (0.72) against the NMS threshold (0.5), not the confidence score.', 'IoU vs threshold.')
  ]),
  lesson('u15l2', 'Detector families and box encodings', REF.det, [
    LS('Anchors, deltas, two-stage, one-stage and DETR', 'Detectors predict **offsets** relative to reference boxes (**anchors**) or grid points rather than raw pixel coordinates:\n\nt_x = (g_x − a_x)/a_w,  t_y = (g_y − a_y)/a_h,  t_w = ln(g_w/a_w),  t_h = ln(g_h/a_h).\n\nLog-space widths guarantee positive decoded sizes (`a_w · exp(t_w)`) and make a 10 % error look the same at 20 px and 200 px. With 3 scales × 3 aspect ratios = **9 anchors** per cell on a 38×50 map, a single feature level already proposes **17 100** boxes (`o_boxes.py`); **FPN** spreads small/medium/large boxes across pyramid levels.\n\nThree families:\n\n- **Two-stage** (R-CNN → Fast → **Faster R-CNN**): a Region Proposal Network proposes boxes, **RoIAlign** crops features per box, a second head classifies and refines.\n- **One-stage** (**SSD, RetinaNet, YOLO, FCOS**): predict class + box directly at every grid cell/point. Dense grids have ~1000× more background than foreground, so RetinaNet introduced **focal loss** −(1 − p_t)^γ ln p_t to down-weight easy negatives.\n- **DETR**: a Transformer with ~100 learned object queries matched one-to-one to ground truth via the Hungarian algorithm — **no anchors and no NMS**.', PX('o_boxes')),
    GM('detq'),
    NU('Anchor width a_w = 64, predicted log-scale delta t_w = 0. What decoded width w = a_w · exp(t_w) is predicted?', 64, 'exp(0) = 1, so zero delta leaves the anchor size unchanged.', 'exp(0) = 1.'),
    MC('What problem was RetinaNet’s focal loss designed to solve?', ['overwhelming easy background examples drowning out the gradient in dense one-stage detectors', 'non-overlapping boxes having zero IoU', 'slow RoI pooling', 'quantisation error in int8'], '(1 − p_t)^γ shrinks the loss of confident easy negatives by orders of magnitude.', 'Foreground–background imbalance.')
  ]),
  lesson('u15l3', 'Precision–recall and mean Average Precision (mAP)', REF.det, [
    LS('How detectors are actually scored', 'Walk down detections **in descending score order**. A detection is a **true positive (TP)** if its IoU with an **unmatched** ground-truth box of that class meets the threshold (e.g. 0.5) — a **second** detection on the same object is a **false positive (FP)**. With G ground-truth objects in total, at each rank compute P = TP/(TP+FP) and R = TP/G.\n\n**Average Precision (AP)** is the area under the precision–recall curve after replacing precision at recall r with the **envelope** max_{r′ ≥ r} P(r′). **mAP** averages AP across classes; **COCO mAP** averages further across IoU thresholds **0.50 : 0.05 : 0.95**, rewarding tight boxes.\n\nWalk-through in `o_map.py`: 6 ground-truth objects and 9 detections (TP, TP, FP, TP, FP, TP, FP, TP, FP). One object is never found, so recall tops out at 5/6 = **0.833** and AP cannot exceed 0.833 — it comes out to **0.674**.', PX('o_map')),
    GM('prf'),
    NU('There are 10 ground-truth cars. Top-5 detections are TP, TP, FP, TP, FP. What is recall at rank 5?', 0.3, '3 true positives out of 10 ground-truth objects → R = 3/10 = 0.30 (precision at rank 5 is 3/5 = 0.60).', 'TP / total ground-truth objects.', { tol: 0.005 }),
    TF('Detecting the same ground-truth object twice with high IoU counts as two true positives.', false, 'Each ground-truth box can match at most one detection; duplicates count as false positives — which is why skipping NMS destroys mAP.', 'One-to-one matching.')
  ]),
  lesson('u15l4', 'Semantic & instance segmentation, and pose', REF.dseg, [
    LS('Pixel-wise prediction: FCN, U-Net and Mask R-CNN', '- **Semantic segmentation** labels every pixel with a class (all cars share one label). **FCN** replaces FC layers with 1×1 convs and upsamples; **U-Net** pairs a downsampling encoder with a symmetric decoder and **concatenates skip connections** at each scale so fine edges survive pooling. Overlap metrics: **IoU = I / U** and **Dice = 2I / (|A| + |B|) = 2·IoU / (1 + IoU)** (IoU 2/3 ↔ Dice **0.800** in `o_seg.py`).\n- **Instance segmentation** separates individual objects. **Mask R-CNN** adds a small per-RoI mask head on top of Faster R-CNN and replaces quantised RoIPool with **RoIAlign** — exact bilinear sampling at floating-point bin centres (matching 8y + x to full precision in `o_seg.py`). **Panoptic** segmentation unifies stuff + things.', PX('o_seg')),
    LS('Human pose estimation with heatmaps', 'Regressing (x, y) coordinates directly throws away spatial structure. Modern pose nets predict **one 2-D Gaussian heatmap per joint**. Raw `argmax` is quantised to the heatmap stride (error 0.42 px in `o_pose.py`); fitting a local parabola on log-heatmap or taking a **soft-argmax** (temperature softmax weighted coordinates) recovers **(20.30, 31.70)** exactly.\n\nMetrics: **PCK@α** (fraction of joints within α × torso/head size) and COCO **OKS** (object keypoint similarity — an exp(−d²/(2 s² κ_j²)) analogue of IoU, with bigger κ_j for hips than eyes). Multi-person: **top-down** (detect person → single-person pose) vs **bottom-up** (detect all joints → group with part affinity fields).', PX('o_pose')),
    NU('A predicted mask has IoU = 0.5 with ground truth. What is its Dice score 2·IoU/(1 + IoU)? (3 decimals)', 0.667, '2 × 0.5 / 1.5 = 2/3 ≈ 0.667.', '2·IoU / (1 + IoU).', { tol: 0.005 }),
    MC('Why did Mask R-CNN replace RoIPool with RoIAlign?', ['RoIPool rounds box and bin coordinates to integers, misaligning features with pixels — fatal for pixel-accurate masks', 'RoIAlign uses fewer FLOPs', 'RoIPool cannot run on GPUs', 'RoIAlign removes the need for anchors'], 'Bilinear interpolation at exact sub-pixel sample points preserves spatial alignment.', 'Quantisation of coordinates.'),
    TF('Semantic segmentation distinguishes two touching sheep as separate instances.', false, 'Both sheep get the same class label “sheep”; separating individuals is instance (or panoptic) segmentation.', 'Class vs instance.')
  ])
]);

unit('u16', 16, 'deep', 'op', 'Self-supervised learning, vision–language and generative models', 'Learning representations without labels, connecting images to text with CLIP, and synthesising images with GANs and diffusion.', [
  lesson('u16l1', 'Contrastive SSL and CLIP', REF.gen, [
    LS('InfoNCE and zero-shot vision–language', '**Contrastive self-supervised learning** (SimCLR, MoCo) creates two augmented views of each image in a batch of B and trains an encoder so views of the **same** image have high cosine similarity while views of **different** images are pushed apart, via **InfoNCE**:\n\nL_i = −ln [ exp(sim(z_i, z_i⁺)/τ) / Σ_j exp(sim(z_i, z_j)/τ) ].\n\nAt random init, all similarities are equal and L = **ln B** (ln 8 = 2.079 in `p_contrast.py`); aligned pairs drop it to 0.001. Lower **temperature τ** sharpens the softmax onto the hardest negatives (τ = 1 → [0.425, 0.384, 0.191]; τ = 0.01 → [1, 0, 0]). Non-contrastive cousins (**DINO, MAE**) predict teacher distributions or masked patches.\n\n**CLIP** trains an image encoder and a text encoder with symmetric InfoNCE on 400M (image, caption) pairs. For **zero-shot classification**, embed prompts like `"a photo of a {class}"` and pick the class whose text vector has the highest cosine similarity with the image vector — no task-specific head needed.', PX('p_contrast')),
    NU('In InfoNCE over a batch of 64 candidates with equal similarity scores, what is the loss? (2 decimals)', 4.16, 'Uniform softmax over 64 items gives p = 1/64, so −ln(1/64) = ln 64 ≈ 4.1589.', 'ln B.', { tol: 0.02 }),
    MC('How does CLIP classify an image into new categories without retraining?', ['compare the image embedding with embeddings of text prompts for each category', 'run k-means on pixels', 'fine-tune a linear head on ImageNet', 'threshold the attention map'], 'Text prompts act as on-the-fly classifier weights.', 'Shared image–text space.')
  ]),
  lesson('u16l2', 'Generative adversarial networks', REF.gen, [
    LS('The minimax game and its failure modes', 'A **GAN** pits a generator G(z) against a discriminator D(x):\n\nmin_G max_D  E_{x~p}[ln D(x)] + E_{z}[ln(1 − D(G(z)))].\n\nFor a fixed G with distribution q, the optimal discriminator is **D*(x) = p(x) / (p(x) + q(x))**, and substituting D* turns the objective into **−ln 4 + 2 · JSD(p ‖ q)**. When q = p, JSD = 0, **D*(x) = ½ everywhere**, and V = **−ln 4 ≈ −1.3863** — verified numerically in `p_gan.py` as G’s mean moves from 3 → 1.5 → 1.\n\nTwo practical pitfalls:\n\n1. **Vanishing G gradient** early on: when D easily spots fakes (D(G(z)) = 0.01), ∂/∂D ln(1 − D) is −1.01, whereas the **non-saturating** loss −ln D(G(z)) has gradient **−100** — strong signal when G needs it most.\n2. **Mode collapse**: G learns one plausible output that fools D and ignores the rest of the distribution. Wasserstein GANs and spectral norm stabilise training.', PX('p_gan')),
    NU('At the global Nash equilibrium p = q of a standard GAN, what value does D*(x) output?', 0.5, 'D*(x) = p(x)/(p(x) + p(x)) = 1/2: real and fake are indistinguishable.', 'p / (p + q) when p = q.', { tol: 0.001 }),
    MC('Generator samples all look crisp, yet every generated face is nearly the same person. What is this called?', ['mode collapse', 'posterior collapse', 'checkerboard artefact', 'exposure bias'], 'G covers one mode of p(x) instead of its full diversity.', 'Missing modes.')
  ]),

  lab('cnn', 'Tiny CNN forward pass', 'chip', 'An 8×8 input, one 3×3 filter, ReLU, 2×2 max-pool and a 4-class linear layer with softmax — every number shown, exactly as the NumPy code in Unit 13 computes it.', body => {

  lab('iou', 'IoU and non-maximum suppression', 'search', 'Edit two boxes to see intersection, union and IoU; then run greedy NMS on a set of noisy detections at any IoU threshold.', body => {
