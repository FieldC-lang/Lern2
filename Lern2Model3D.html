unit('u9', 9, 'rep', 'f7', 'Hash grids, triplanes and 3D Gaussians', 'The three representations behind today’s fast 3D AI: Instant-NGP multiresolution hash encoding, EG3D/LRM triplanes, and 3D Gaussian splatting primitives, with their memory in bytes.', [
  lesson('u9l1', 'Multiresolution hash encoding', REF.field, [
    LS('Instant-NGP', 'Instead of an MLP learning everything, store **trainable feature vectors at grid vertices** at L resolutions (a geometric series N_min · b^l). For a query point, at each level:\n\n1. Find the surrounding cell’s 4 (2D) or 8 (3D) corners.\n2. Look up each corner’s features in a table of size T. Coarse levels index directly; fine levels whose (N + 1)^d > T use a **spatial hash**: h(x) = (⊕_i x_i π_i) mod T with π = (1, 2 654 435 761, 805 459 861).\n3. Interpolate trilinearly, and concatenate the levels into a tiny MLP.\n\n**Collisions** are not fixed explicitly. Gradients from points that matter dominate, and the multi-resolution structure disambiguates. The result trains NeRFs in seconds instead of hours.\n\n**Hash by hand.** For vertex (5, 7) with T = 4096: (5 × 1) xor (7 × 2 654 435 761) = 5 xor 18 581 050 327, taken mod 4096. Working in hex makes the xor easy. The answer is **978**.'),
    LS('Checked in code', 'An 8-level grid with levels 0–5 direct and 6–7 hashed into 4096 slots fits a 128×128 image. The PSNR goes from 5.5 dB to 33.5 dB in 100 iterations and **46.8 dB** by 800. The example prints the hash of (5, 7) as 978.', PX('h_hashgrid')),
    GM('hashidx'), GM('hashmem'),
    TF('Instant-NGP resolves hash collisions with chaining like a normal hash table.', false, 'It lets colliding vertices share an entry and relies on gradient averaging and multiple levels.', 'Collisions are tolerated.')
  ]),
  lesson('u9l2', 'Triplanes', REF.field, [
    LS('Three planes instead of a cube', 'A **triplane** stores three axis-aligned 2D feature planes (xy, xz and yz), each R×R×C. A point x is projected onto each plane, features are bilinearly sampled and summed (or concatenated), and a small MLP decodes them to density, SDF or colour.\n\n**Memory**: 3R²C rather than R³C, which is R/3 times smaller (about 11× at R = 32) and grows as R² not R³.\n\n**Why generators love it.** The planes are 2D images, so 2D CNNs and transformers can produce them: EG3D (GAN), LRM and TripoSR (feed-forward from an image, Unit 14), and diffusion on triplanes.\n\n**Limit.** One plane value is shared along the whole line perpendicular to it; the other two planes and the MLP must disambiguate.'),
    LS('Checked in code', 'Fitting a shape’s occupancy with 32×32 planes and 8 channels reaches IoU **0.978**, using 24 576 floats against 262 144 for a dense 32³ × 8 grid (**11×** smaller with the MLP included).', PX('h_triplane')),
    GM('triplanemem'),
    NU('Triplane memory with R = 64, C = 32 in float16: how many bytes?', 786432, '3 × 64² × 32 = 393 216 values × 2 bytes = 786 432 bytes.', '3 R² C × bytes.')
  ]),
  lesson('u9l3', '3D Gaussians', REF.rep, [
    LS('Anatomy of a splat', 'A **3D Gaussian** in 3DGS (Kerbl et al., 2023) has:\n\n| field | floats | note |\n|---|---|---|\n| mean μ | 3 | position |\n| scale s | 3 | stored as log s |\n| rotation q | 4 | unit quaternion |\n| opacity | 1 | stored as a logit |\n| colour SH degree 3 | 48 | 16 coefficients × RGB |\n| **total** | **59** | 236 bytes in fp32 |\n\n**Covariance** Σ = R S Sᵀ Rᵀ is positive semi-definite **by construction**, so optimisation can never break it.\n\n**Projection.** Σ′ = J W Σ Wᵀ Jᵀ, where W is the view rotation and J is the Jacobian of the perspective projection (a local linearisation). A 0.3-pixel dilation is added for antialiasing. The 2D Gaussian’s 3σ radius sets which **16×16 tiles** it touches.\n\n**Alpha.** α = opacity · exp(−½ dᵀ Σ′⁻¹ d), and then α-compositing front to back (Unit 11).'),
    LS('Checked in code', 'The eigenvalues of Σ equal the squared scales, so it is always PSD. The projected 2D covariance matches a Monte-Carlo estimate (1389 vs 1399, the gap being linearisation error). A 3σ radius of 150 px touches a 302×302-px tile box. Alpha falls from 0.80 at the centre to 0.5365 at 20 px. There are **59 floats = 236 bytes** per Gaussian, so 3 M Gaussians is 708 MB.', PX('h_gauss')),
    GM('gsfloats'), GM('splatalpha'),
    MC('Why is 3DGS covariance parameterised as R S Sᵀ Rᵀ rather than learned directly?', ['it is guaranteed positive semi-definite during optimisation', 'it uses fewer floats than six', 'GPUs require quaternions', 'it makes colour view-dependent'], 'A free 3×3 symmetric matrix could become indefinite after a gradient step, which has no meaning as a Gaussian.', 'Validity under optimisation.')
  ])
]);
})();

/* ---- lern2model3d/l05.js — Part 5: differentiable rendering. Unit 10 differentiable rasterisation; Unit 11 volume rendering, NeuS and Gaussian splatting ---- */
(function () {
const { REF, LS, MC, TF, NU, unit, lesson, PX } = CG.H;
const GM = id => GEN.make(id);

unit('u10', 10, 'diff', 'rs1', 'Differentiable rasterisation and mesh fitting', 'The bridge between images and geometry. Hard rasterisation has zero gradient; soft rasterisers (SoftRas) and antialiased interpolation (DIB-R, nvdiffrast) give useful gradients. Then a mesh is fitted to a target with Chamfer loss and regularisers, and you see what goes wrong without them.', [
  lesson('u10l1', 'Why hard rasterisation has no gradient, and SoftRas', REF.diffr, [
    LS('The step-function problem', 'An image-space loss L(image(V)) needs dL/dV. With a hard rasteriser, each pixel is 1 inside the triangle and 0 outside. Moving a vertex slightly changes nothing until an edge crosses a pixel centre, so **the gradient is 0 almost everywhere**.\n\n**SoftRas** (Liu et al., 2019) replaces coverage with a **sigmoid of the signed distance** to the triangle edge: D = sigmoid(sign · d²/σ). Every pixel near the edge now feels every vertex. σ trades blur against gradient reach:\n\n- **large σ**: smooth and far-reaching gradients, but blurry silhouettes.\n- **small σ**: sharp but local.\n\nThe standard trick is to **anneal** σ from large to small. Combining many triangles uses a soft union (1 − Π(1 − D_j)), and depth uses a softmax over z.\n\n**Inside test.** For a possibly non-convex polygon, use the **even-odd rule**. The first version of this example used a convex-only test and broke when the optimisation made the polygon self-intersect.'),
    LS('Checked in code', '`i_softras.py` fits a 2D polygon’s silhouette to a target circle. The **hard** rasteriser’s gradient is exactly **0**. The soft one gives [−0.04544, −0.00027] for vertex 0, with a gradcheck error of **2.42e−8**. With σ annealed to a minimum of 0.02 and a Laplacian regulariser, IoU reaches **1.000** by iteration 300, and the vertex radii end at 0.67–0.69 for a target of 0.7.', PX('i_softras')),
    GM('softcov'),
    TF('With a hard rasteriser, the derivative of a pixel’s colour with respect to a vertex position is zero almost everywhere.', true, 'Coverage is piecewise constant and changes only when an edge crosses a pixel centre. The code measured exactly 0.', 'Step function.'),
    MC('Annealing σ in SoftRas from large to small…', ['gives far-reaching gradients early and sharp silhouettes late', 'is needed only for speed', 'makes depth ordering exact', 'removes the need for a loss'], 'Large σ lets distant pixels pull vertices; small σ refines the edges.', 'Reach vs sharpness.')
  ]),
  lesson('u10l2', 'DIB-R and antialiasing gradients', REF.diffr, [
    LS('Interpolation gives gradients inside; antialiasing gives them at edges', 'DIB-R and nvdiffrast keep **hard** coverage but note two things:\n\n1. **Inside** a triangle, colour is a barycentric interpolation of vertex attributes, which is differentiable with respect to the vertex positions and the attributes.\n2. At **silhouette edges**, an **antialiasing** step blends across the edge depending on where it crosses the pixel. That blend is a continuous function of the vertex positions, so silhouette gradients appear.\n\nIf the vertex colours start flat (all equal), interpolation gives no positional gradient: moving vertices does not change the colours inside. Only the antialiasing term remains. Without it, the gradient vanishes.'),
    LS('Checked in code', 'With flat starting colours and no antialiasing, |dL/dV| = **1.07e−18**, which is zero. With antialiasing it is **9.32e−3**, with a gradcheck error of 1.05e−9. By iteration 400 the vertex and colour errors are both **0**. This is the difference that makes a renderer usable for inverse problems.', PX('i_dibr')),
    MC('In a DIB-R-style renderer with flat initial colours, what provides the positional gradient?', ['the antialiasing blend at silhouette edges', 'barycentric interpolation inside triangles', 'the depth buffer', 'back-face culling'], 'Flat colours make interior interpolation independent of position; only the edge blend moves with the vertices.', 'Which term changes when an edge moves?')
  ]),
  lesson('u10l3', 'Fitting a mesh: Chamfer loss and regularisers', REF.diffr, [
    LS('Deforming a sphere into a target', 'A classic pipeline (Pixel2Mesh, the PyTorch3D tutorials) deforms a template sphere to match target points:\n\nL = Chamfer(samples(V), target) + λ_lap · Laplacian(V) + λ_edge · edge-length variance + λ_n · normal consistency\n\n- **Chamfer**: the mean nearest-neighbour squared distance in both directions (Unit 18). It uses a KD-tree, which is O(N log N).\n- **Laplacian**: keeps the surface smooth.\n- **Edge**: keeps triangles even.\n- **Normal consistency**: keeps neighbouring faces from flipping.\n\nWithout regularisers, Chamfer alone can be driven lower by **crumpling** the mesh. Vertices chase individual target points and faces invert. Low loss, invalid mesh: a lesson that recurs in evaluation.'),
    LS('Checked in code', 'With regularisers, Chamfer falls from 0.02090 to **0.00194** with **0 inverted faces**, and the volume is 1.728, exactly the target’s 1.728. Without them, Chamfer is lower (**0.00167**) but **360 faces are inverted**. The lower loss is the worse mesh.', PX('i_meshfit')),
    TF('A lower Chamfer distance always means a better mesh.', false, 'The unregularised fit had a lower Chamfer distance and 360 inverted faces. Chamfer measures only point positions, not surface validity.', 'Compare the two runs.')
  ])
]);

unit('u11', 11, 'diff', 'rs2', 'Volume rendering, NeuS and Gaussian splatting', 'The rendering equation behind NeRF, derived and verified: alpha from density, transmittance, weights, and hierarchical sampling. Then NeuS, which turns an SDF into an unbiased density, sphere tracing, and a 2D Gaussian splatter with densification trained from scratch.', [
  lesson('u11l1', 'The volume rendering equation', REF.diffr, [
    LS('From density to colour', 'A ray r(t) = o + t·d passes through a field with **density σ(x)** and **colour c(x, d)**. The expected colour is\n\nC = ∫ T(t) σ(t) c(t) dt, with T(t) = exp(−∫₀ᵗ σ ds)\n\nwhere T is the probability that light gets this far without being absorbed. Discretised with samples t_i and spacing δ_i:\n\n| quantity | formula |\n|---|---|\n| alpha | α_i = 1 − exp(−σ_i δ_i) |\n| transmittance | T_i = Π_{j<i} (1 − α_j) |\n| weight | w_i = T_i α_i |\n| colour | C = Σ w_i c_i (+ (1 − Σ w_i) · background) |\n| depth | D = Σ w_i t_i |\n\n**Exactness.** For a slab of constant density, this quadrature is **exact** at any sample count, because the exponentials multiply.\n\n**Hierarchical sampling.** A coarse pass gives weights. Treat them as a PDF and draw **fine samples** by inverse-CDF sampling, so they concentrate near surfaces.\n\n**Walk-through.** σ = 2, δ = 0.5: α = 1 − e^{−1} = 0.632. A second sample with α = 0.5 has T = 0.368 and w = 0.184.'),
    LS('Checked in code', 'A slab’s opacity is **0.95021** at N = 4, 16 and 64, equal to the exact value. The analytic dC/dσ matches autograd (difference 5.55e−17). The coarse weights sum to 0.651; **64 of 64** fine samples land near the surface; the depth estimate is 4.1714.', PX('i_volrend')),
    GM('nerfalpha'), GM('nerfweight'),
    NU('Two samples with α₁ = 0.5 and α₂ = 0.5. What is the total opacity Σ w_i?', 0.75, 'w₁ = 0.5 and w₂ = (1 − 0.5)·0.5 = 0.25, so the sum is 0.75 = 1 − (0.5)(0.5).', '1 − Π(1 − α).')
  ]),
  lesson('u11l2', 'Sphere tracing and NeuS', REF.diffr, [
    LS('Rendering SDFs', '**Sphere tracing** marches a ray through an SDF by stepping exactly f(x): the distance to the nearest surface is a safe step. It converges quickly in open space and slowly at grazing angles. The ray-marching lab lets you watch it.\n\n**NeuS** (Wang et al., 2021) trains an SDF with volume rendering. Using a naive density σ = Φ_s(−f) (a logistic of the SDF) makes the weight peak **in front of** the surface, biased by the viewing angle. NeuS derives an **unbiased** opacity from the rate of change of Φ_s(f) along the ray, so the weight peaks **exactly at f = 0** for planar surfaces at any angle. s is learned and sharpens over training.'),
    LS('Checked in code', 'For a plane at t = 2, the NeuS weight peaks at **2.000** for every angle and s tried. The naive density peaks at 1.549–1.977, depending on angle and s: a visible bias in depth.', PX('i_neus')),
    MC('Why does NeuS change the density formula rather than using σ = Φ_s(−f)?', ['the naive density’s weight peaks before the surface, a biased depth', 'the naive one is not differentiable', 'it saves memory', 'it removes the need for an SDF'], 'The bias grows at grazing angles; NeuS’s derivation makes the peak land at the zero crossing.', 'Where does the weight peak?')
  ]),
  lesson('u11l3', 'Gaussian splatting from scratch', REF.diffr, [
    LS('Rasterising Gaussians', '3DGS renders by:\n\n1. Projecting each Gaussian to 2D (Unit 9).\n2. **Sorting** by depth.\n3. α-compositing front to back per pixel, C = Σ c_i α_i T_i, with early termination when T < 1e−4.\n\nIt is a rasteriser, not ray marching, so it is fast. The gradients of every parameter come straight from the compositing formula.\n\n**Adaptive density control.** Every few hundred iterations, Gaussians with large view-space position gradients are **cloned** (if small) or **split** (if large); transparent ones are **pruned**. This grows detail where the image error is.\n\n**2D version.** The same algorithm in 2D fits an image with Gaussians, which you can do in the splat lab.'),
    LS('Checked in code', 'A 2D splatter gradchecks at 3.83e−8. 40 Gaussians start at **9.82 dB**. At iteration 300, cloning 10 high-gradient Gaussians gives 50 Gaussians reaching **24.73 dB**.', PX('i_splat')),
    TF('3D Gaussian splatting must sort Gaussians by depth for correct α-compositing.', true, 'Compositing is order-dependent: T_i depends on everything in front.', 'Front to back.'),
    GM('diffq')
  ])
]);
})();

/* ---- lern2model3d/l06.js — Part 6: generative 3D. Unit 12 VAEs and GANs; Unit 13 mesh tokens and diffusion ---- */
(function () {

const GM = id => GEN.make(id);

unit('u12', 12, 'gen', 'f3', 'Shape VAEs and 3D GANs', 'The first generation of 3D generative models, trained from scratch: a point-cloud VAE with its ELBO, KL and interpolation, and a GAN with its minimax game, collapse risks and memorisation checks. The numbers include the honest failures.', [
  lesson('u12l1', 'What a generative 3D model must do', REF.gen, [
    LS('Learning a distribution of shapes', 'A **generative model** learns p(shape) so that it can **sample** new shapes, and usually **conditions** on text, an image or a class: p(shape | c). There are four questions for any 3D generator:\n\n1. **Representation**: what is sampled (points, voxels, mesh tokens, latents of a field, Gaussians)?\n2. **Model family**: VAE, GAN, autoregressive, diffusion or flow?\n3. **Supervision**: 3D data, or only 2D images through a differentiable renderer (Units 10–11), or a 2D prior (SDS, Unit 14)?\n4. **Evaluation**: fidelity, diversity and novelty (Unit 18). A model that copies training shapes looks perfect on fidelity.\n\n| family | sampling | strength | typical failure |\n|---|---|---|---|\n| VAE | one decoder pass | stable; smooth latent space | blurry; prior holes |\n| GAN | one pass | sharp | mode collapse; unstable |\n| autoregressive | token by token | exact likelihood; meshes | slow; error build-up |\n| diffusion | many denoising steps | quality and diversity | slow sampling |'),
    GM('genq')
  ]),
  lesson('u12l2', 'A point-cloud VAE', REF.gen, [
    LS('The ELBO for shapes', 'The encoder gives q(z | x) = N(μ, σ²), sampled with the **reparameterisation trick** z = μ + σε. The decoder outputs N points. Training maximises the ELBO, meaning it minimises\n\nL = Chamfer(decoded, x) + β · KL(q ‖ N(0, I))\n\nwith KL = ½ Σ (μ² + σ² − 1 − ln σ²) per dimension.\n\n**Interpolating** between two codes morphs one shape into another. **Sampling** from the prior N(0, I) generates shapes, but if the aggregate posterior does not fill the prior, samples are uneven across classes.\n\n**Walk-through of the KL.** μ = 1 and σ = 1: ½(1 + 1 − 1 − 0) = **0.5** nats.'),
    LS('Trained here (81 s on one CPU core)', 'Test Chamfer is **0.0211** against 0.4734 for the trivial baseline (predict the mean shape). Prior samples are **uneven** across classes: {sphere 1, box 0, cylinder 3, torus 6, cone 10}. No boxes were sampled at all. The interpolation morphs smoothly. Uneven coverage is the VAE’s typical failure, and Unit 18 measures it.', PX('j_vae')),
    GM('klgauss'),
    TF('Sampling a VAE’s prior always gives classes in proportion to the training data.', false, 'Here 20 prior samples contained no boxes and 10 cones. The aggregate posterior did not match the prior.', 'Count the classes.')
  ]),
  lesson('u12l3', 'A 3D GAN', REF.gen, [
    LS('Minimax on shapes', 'A **generator** G(z) makes shapes; a **discriminator** D tells real from fake. G minimises and D maximises E log D(x) + E log(1 − D(G(z))). In practice G uses the **non-saturating** loss −log D(G(z)).\n\nThe optimal discriminator is D* = p_data / (p_data + p_g). At the optimum p_g = p_data and D = ½ everywhere.\n\nThe risks:\n\n- **mode collapse**: G covers only some shapes.\n- **oscillation**.\n- **memorisation**: G reproduces training shapes.\n\nThe checks are **family shares** (does sampling cover each class?), **nearest-training distance** (copying?), and a separate **classifier** (are the samples recognisable?). 3D-GAN (Wu et al., 2016) used voxels; EG3D uses triplanes plus a neural renderer and trains on 2D images only.'),
    LS('Trained here', 'At iteration 3000 the family shares are [0.48, 0.12, 0.40] for 3 families, **uneven**. The mean nearest-training distance is 0.0070, and a classifier recognises the samples with accuracy **1.000**. The shapes are sharp and recognisable, but the middle family is under-produced: partial mode imbalance.', PX('j_gan')),
    MC('A GAN’s samples all score 1.000 with a classifier but one family appears only 12% of the time (a third expected). This shows…', ['high fidelity with partial mode imbalance', 'perfect diversity', 'memorisation', 'a broken discriminator'], 'Fidelity and coverage are separate axes; you need both measured.', 'Two axes.')
  ])
]);

unit('u13', 13, 'gen', 'imm', 'Mesh tokens, diffusion and latent diffusion for 3D', 'Modern generative 3D: autoregressive transformers that write meshes as tokens (as MeshGPT does), DDPM diffusion on point clouds (Point-E-style), and latent diffusion on compressed shape codes with classifier-free guidance (3DShape2VecSet and Shap-E-style).', [
  lesson('u13l1', 'Meshes as token sequences', REF.gen3, [
    LS('Writing a mesh like a sentence', 'MeshGPT, PolyGen and MeshAnything turn a mesh into a token sequence and train a transformer for next-token prediction:\n\n1. **Quantise** coordinates to a grid (such as 7 bits = 128 levels).\n2. **Order** faces canonically (sort vertices by z, y, x and faces by their lowest vertex) so that each mesh has one sequence.\n3. **Serialise** each face as 9 coordinate tokens (or learned face codes), plus special tokens such as start, end and separators.\n4. Sample autoregressively, then **validate**: is it well-formed (tokens group into triangles) and watertight (each edge shared twice)?\n\n**Sequence length** is the bottleneck: 800 faces × 9 = 7200 tokens. That is why compressed tokenisations (face VQ-VAE, adjacency-aware orderings) exist.\n\n**Loss** is reported in nats per token; the uniform baseline is ln(vocabulary).'),
    LS('Trained here', '12 triangles become **110 tokens** with a vocabulary of 34. The loss reaches **0.175 nats** vs ln 34 = 3.526 for uniform. Of 50 samples, **50 are well-formed** and **29 are watertight**. Syntax is easy; topology is the hard part.', PX('j_meshtok')),
    GM('meshtokens'), GM('quantlvl'),
    TF('A mesh-token model that always produces well-formed triangles also always produces watertight meshes.', false, '50 of 50 were well-formed, but only 29 were watertight. Edge sharing is a global constraint.', 'Compare 50 and 29.')
  ]),
  lesson('u13l2', 'Diffusion on point clouds', REF.gen3, [
    LS('DDPM in 3D', '**Forward process.** Add Gaussian noise over T steps with schedule β_t. The closed form is x_t = √ᾱ_t x₀ + √(1 − ᾱ_t) ε, where ᾱ_t = Π(1 − β_s).\n\n**Training.** Pick a random t, noise the clean cloud, and train a network ε̂(x_t, t, c) with MSE against ε. For points, the network must be **permutation-equivariant**: a PointNet- or transformer-style denoiser.\n\n**Sampling.** Start from pure noise and step back: x_{t−1} = (x_t − β_t/√(1 − ᾱ_t) ε̂)/√(1 − β_t) + σ_t z.\n\n**Schedule.** ᾱ_T must be near 0, or the model never learns to start from pure noise. The first attempt here used a weak schedule and failed. With T = 200 and β up to 0.06, ᾱ_200 = **0.00217**.\n\n**Predicting x̂₀.** x̂₀ = (x_t − √(1 − ᾱ) ε̂)/√ᾱ, which is useful for guidance and editing.'),
    LS('Trained here (135 s)', 'After 6000 iterations the ε-MSE is **0.1798**. Of 20 unconditional samples, 18 are sphere-like and 2 torus-like: **mode imbalance** again. The mean |SDF| of the samples to their nearest class is 0.0866. Chamfer to the reference is 0.0819 vs a 0.0520 baseline for real-to-real. The samples are recognisable but noisy: more steps and a bigger network are the usual cure.', PX('j_pcdiff')),
    GM('ddpmxt'), GM('x0pred'),
    NU('ᾱ_t = 0.64. In x_t = a x₀ + b ε, what is b?', 0.6, 'b = √(1 − 0.64) = √0.36 = 0.6.', 'Signal and noise variances add to 1.')
  ]),
  lesson('u13l3', 'Latent diffusion and classifier-free guidance', REF.gen3, [
    LS('Diffuse a compressed code', 'Diffusing directly on 4096 points or a 64³ grid is expensive. **Latent diffusion** first compresses shapes with an autoencoder (here PCA as the simplest one) into a small latent, then diffuses in that space. 3DShape2VecSet, Shap-E, CLAY and TRELLIS all do this with learned latents.\n\n**Classifier-free guidance (CFG).** Train with the condition dropped some of the time (c = ∅). At sampling, use ε̂ = ε̂_∅ + w(ε̂_c − ε̂_∅). w > 1 pushes samples toward the condition at the cost of diversity.\n\n**Walk-through.** ε̂_∅ = 0.2, ε̂_c = 0.5 and w = 3 give ε̂ = 0.2 + 3 × 0.3 = **1.1**.'),
    LS('Trained here', 'PCA to 16 dimensions (**256×** compression) keeps **99.7%** of the variance. Class-conditional diffusion in the latent gives 0.95 class accuracy with **w = 0 and w = 2 alike**. Guidance gave no gain here, because the conditional model was already accurate on this easy, low-dimensional task. Report that honestly rather than assuming CFG always helps.', PX('j_latdiff')),
    GM('cfg'),
    MC('In latent diffusion, the autoencoder’s main job is to…', ['compress shapes so diffusion runs on a much smaller vector', 'generate the shapes itself', 'replace the noise schedule', 'compute the guidance weight'], 'The diffusion model works in the latent; the decoder maps samples back to shapes.', 'Where does diffusion run?')
  ])
]);
})();

/* ---- lern2model3d/l07.js — Part 6 cont.: Unit 14 text- and image-to-3D, and scaling to frontier models ---- */
(function () {

unit('u14', 14, 'gen', 'rd', 'Text-to-3D and image-to-3D, and scaling to a frontier model', 'How today’s systems turn a prompt or a photo into an asset: score distillation from 2D diffusion priors (DreamFusion), the Janus problem and view-conditioned priors (Zero-1-to-3, MVDream), feed-forward reconstruction models (LRM, TripoSR), and the compute, data and memory budget of a frontier 3D model.', [
  lesson('u14l1', 'Score distillation sampling (SDS)', REF.gen3, [
    LS('Using a 2D prior to sculpt 3D', 'There is far more 2D image data than 3D data. **DreamFusion** (Poole et al., 2022) optimises a 3D representation θ (a NeRF) so that its renders look plausible to a frozen 2D diffusion model:\n\n1. Render an image x = g(θ) from a random camera.\n2. Noise it: x_t = √ᾱ x + √(1 − ᾱ) ε.\n3. Ask the diffusion model for ε̂(x_t, t, prompt).\n4. Update θ with ∇_θ L_SDS = w(t) (ε̂ − ε) ∂x/∂θ, which **skips the U-Net Jacobian**.\n\nSubtracting ε is a **control variate**: it has the same expectation but lower variance. SDS is **mode-seeking**: each run lands on one mode of the prior, so results are over-saturated and lack diversity. High CFG weights (about 100) are typical. VSD (ProlificDreamer) fixes some of this.'),
    LS('Checked in code', 'A 1-parameter “shape” (a radius) is optimised against an analytic diffusion prior whose data are radius-0.5 shapes. The Jacobian check gives 6.93e−6. SDS with (ε̂ − ε) and with ε̂ only both converge to **0.500**, but the gradient standard deviation is 10.8 vs **17.3**: the control variate works. With a **two-mode** prior, starting radii 0.2/0.45/0.55/0.9 end at 0.279/0.317/0.314/0.694. Each run is pulled toward a mode according to where it starts, which is mode seeking.', PX('j_sds')),
    MC('Why does SDS subtract the sampled noise ε from ε̂?', ['it reduces gradient variance without changing the expectation', 'it changes which mode is found', 'it is needed for the Jacobian', 'it adds diversity'], 'E[ε] = 0, so the expected gradient is unchanged; the std fell from 17.3 to 10.8.', 'Control variate.'),
    TF('SDS samples diverse shapes from a single prompt, like ancestral diffusion sampling.', false, 'SDS is mode-seeking optimisation: each run collapses to one mode.', 'Optimisation, not sampling.')

unit('u21', 21, 'cap', 'rd', 'Capstone 1: a tiny NeRF from scratch', 'Everything from Units 6, 8 and 11 in one model: rays from camera poses, positional encoding, an MLP for density and colour, volume rendering, hierarchical samples, training with Adam on a CPU, and novel-view evaluation.', [

  lab('mcubes', 'Marching cubes stepper', 'tree', 'Step through the cells of a grid sampling a sphere (or torus) SDF. For each cell see the 8 corner values, which corners are inside, the case index in binary, hex and decimal, which edges the surface crosses, and the interpolation t on each, then the running triangle count.', body => {

  /* ---------- Chamfer visualiser ---------- */
  lab('chamfer', 'Chamfer and F-score visualiser', 'lens', 'A reference circle of points and a prediction you can shrink, shift, thin out or add outliers to. Nearest-neighbour links are drawn both ways; read Chamfer (squared), precision, recall and F-score at a threshold, and see why each metric reacts differently.', body => {

  /* ---------- tiny autoencoder trainer ---------- */
  lab('aetrain', 'Tiny shape autoencoder trainer', 'chip', 'Train a real autoencoder in your browser on 2D outline shapes (circles, squares, triangles, stars of random size and rotation), each 24 points. Choose the latent size and hidden width, train with Adam, and watch the Chamfer loss fall; then decode the midpoint between two codes.', body => {
    const out = h('div', { class: 'stack' }), cv = cnv(360, 180), lc = cnv(360, 110);
    const P = 24;
    let Z = 2, Hd = 32, lr = 0.01, model = null, hist = [], data = [], steps = 0, timer = null;
    function shapeAt(kind, s, rot) {
      const pts = [];
      for (let i = 0; i < P; i++) {
        const t = 2 * Math.PI * i / P; let r;
        if (kind === 0) r = 1; else if (kind === 1) r = 1 / Math.max(Math.abs(Math.cos(t)), Math.abs(Math.sin(t))) * 0.8; else if (kind === 2) { const k = ((t % (2 * Math.PI / 3)) + 2 * Math.PI / 3) % (2 * Math.PI / 3) - Math.PI / 3; r = 0.5 / Math.cos(k); } else r = (i % 2 ? 0.45 : 1);
        pts.push(s * r * Math.cos(t + rot), s * r * Math.sin(t + rot));
      }

    }
    function makeData() { seed = 3; data = []; for (let i = 0; i < 160; i++) { const k = i % 4; data.push({ k, x: shapeAt(k, 0.45 + 0.4 * rnd(), k === 0 ? 0 : 0.4 * (rnd() - 0.5)) }); } }
    const init = (a, b) => { const s = Math.sqrt(2 / a); return { W: [...Array(b)].map(() => [...Array(a)].map(() => s * gauss())), b: Array(b).fill(0) }; };

    const lin = (L, x) => L.W.map((r, i) => r.reduce((s, w, j) => s + w * x[j], L.b[i]));
    const relu = v => v.map(x => x > 0 ? x : 0.01 * x);
    function fwd(x) { const a1 = lin(model[0], x), h1 = relu(a1), z = lin(model[1], h1), a3 = lin(model[2], z), h3 = relu(a3), y = lin(model[3], h3); return { x, a1, h1, z, a3, h3, y }; }
    const decode = z => { const a3 = lin(model[2], z); return lin(model[3], relu(a3)); };

      for (let i = 0; i < P; i++) { let bd = 1e9, bj = 0; for (let j = 0; j < P; j++) { const d = (y[2 * i] - x[2 * j]) ** 2 + (y[2 * i + 1] - x[2 * j + 1]) ** 2; if (d < bd) { bd = d; bj = j; } } L += bd / P; g[2 * i] += 2 * (y[2 * i] - x[2 * bj]) / P; g[2 * i + 1] += 2 * (y[2 * i + 1] - x[2 * bj + 1]) / P; }
      for (let j = 0; j < P; j++) { let bd = 1e9, bi = 0; for (let i = 0; i < P; i++) { const d = (y[2 * i] - x[2 * j]) ** 2 + (y[2 * i + 1] - x[2 * j + 1]) ** 2; if (d < bd) { bd = d; bi = i; } } L += bd / P; g[2 * bi] += 2 * (y[2 * bi] - x[2 * j]) / P; g[2 * bi + 1] += 2 * (y[2 * bi + 1] - x[2 * j + 1]) / P; }
      return [L, g];
    }
    function step() {
      const B = 16, grads = model.map(L => ({ W: L.W.map(r => r.map(() => 0)), b: L.b.map(() => 0) })); let tot = 0;
      for (let n = 0; n < B; n++) {
        const s = fwd(data[Math.floor(rnd() * data.length)].x), [L, gy] = chamferGrad(s.y, s.x); tot += L / B;
        const back = (li, inp, gout) => { const G = grads[li], Lr = model[li]; const gin = Array(inp.length).fill(0); for (let i = 0; i < gout.length; i++) { G.b[i] += gout[i] / B; for (let j = 0; j < inp.length; j++) { G.W[i][j] += gout[i] * inp[j] / B; gin[j] += Lr.W[i][j] * gout[i]; } } return gin; };
        const dr = (a, g) => g.map((v, i) => a[i] > 0 ? v : 0.01 * v);

    body.appendChild(h('div', { class: 'stack' }, h('div', { class: 'sl-grid' },

  /* ---------- bases lab ---------- */
  lab('bases', '3D bytes: decimal, hex, binary and float32', 'num', 'Type an integer (vertex index, int8 weight, case index) or a float, and see decimal, hex and binary forms, two’s complement, float32 and fp16/bf16 bit fields, and little-endian bytes as they appear in a glTF or PLY hex dump, each with the by-hand method.', body => {
