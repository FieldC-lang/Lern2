une.\nimport numpy as np, ag\nrng = np.random.default_rng(0); S = 32; ys, xs = (np.mgrid[0:S, 0:S] + 0.5) / S; P = np.c_[xs.ravel(), ys.ravel()]\ntgt = np.zeros((S * S, 3)); r = np.hypot(P[:, 0] - 0.35, P[:, 1] - 0.4); tgt[r < 0.2] = [1, 0.2, 0.1]\nsq = (np.abs(P[:, 0] - 0.7) < 0.15) & (np.abs(P[:, 1] - 0.65) < 0.2); tgt[sq] = [0.1, 0.4, 1]\ndef make(n): return dict(mu=ag.T(rng.random((n, 2))), ls=ag.T(np.full((n, 2), np.log(0.06))), th=ag.T(rng.random((n, 1)) * 3), c=ag.T(rng.normal(0, 0.5, (n, 3))), o=ag.T(np.full((n, 1), 0.0)))\ndef render(g):\n    n = g['mu'].data.shape[0]; d = ag.T(P[:, None, :]) - g['mu'].reshape(1, n, 2)            # (pixels, gaussians, 2)\n    ct, st = g['th'].cos().reshape(1, n), g['th'].sin().reshape(1, n)\n    u = d[:, :, 0] * ct + d[:, :, 1] * st; v = d[:, :, 1] * ct - d[:, :, 0] * st                 # rotate into each Gaussian's frame\n    sx, sy = (g['ls'][:, 0] * -2).exp().reshape(1, n), (g['ls'][:, 1] * -2).exp().reshape(1, n)\n    alpha = (-(u * u * sx + v * v * sy) * 0.5).exp() * g['o'].sigmoid().reshape(1, n) * 0.99    # alpha_i(x) = o_i exp(-0.5 d^T Sigma^-1 d)\n    tri = np.triu(np.ones((n, n)), 1)                                                        # fixed depth order: gaussian j in front of i when j < i\n    Tlog = (1 - alpha + 1e-6).log() @ ag.T(tri); Tr = Tlog.exp()                             # T_i = prod_{j<i} (1 - alpha_j)\n    return (alpha * Tr) @ g['c'].sigmoid()\ng = make(6); params = list(g.values())\nprint('gradcheck of the splat rasteriser (6 gaussians): %.2e' % ag.gradcheck(lambda: ((render(g) - ag.T(tgt)) ** 2).mean(), params))\ng = make(40); params = list(g.values()); opt = ag.Adam(params, 0.02)\npsnr = lambda m: -10 * np.log10(m)\nfor it in range(1, 601):\n    L = ((render(g) - ag.T(tgt)) ** 2).mean(); L.backward()\n    gm = np.linalg.norm(g['mu'].grad, axis=1); opt.step()\n    if it == 300:                                       # adaptive density control: prune transparent, clone high-gradient Gaussians\n        keep = g['o'].sigmoid().data[:, 0] > 0.05; hot = np.argsort(-gm)[:10]\n        print('iter 300: PSNR %.2f dB; prune %d transparent, clone %d with largest position gradient' % (psnr(L.data), (~keep).sum(), 10))\n        new = {k: np.concatenate([v.data[keep], v.data[hot] + (rng.normal(0, 0.01, v.data[hot].shape) if k == 'mu' else 0)]) for k, v in g.items()}\n        g = {k: ag.T(v) for k, v in new.items()}; params = list(g.values()); opt = ag.Adam(params, 0.02)\n    if it in (1, 100, 600): print('iter %3d: %d gaussians, PSNR %.2f dB' % (it, len(g['mu'].data), psnr(L.data)))\nprint('3DGS does the same with 3D means, Sigma_2D = J W Sigma W^T J^T, depth sorting per 16x16 tile, and SH colours.')", "out": "gradcheck of the splat rasteriser (6 gaussians): 3.83e-08\niter   1: 40 gaussians, PSNR 9.82 dB\niter 100: 40 gaussians, PSNR 18.59 dB\niter 300: PSNR 20.90 dB; prune 0 transparent, clone 10 with largest position gradient\niter 600: 50 gaussians, PSNR 24.73 dB\n3DGS does the same with 3D means, Sigma_2D = J W Sigma W^T J^T, depth sorting per 16x16 tile, and SH colours."}, "i_volrend": {"lang": "py", "file": "i_volrend.py", "src": "# i_volrend.py: NeRF volume-rendering quadrature, its analytic gradient, and hierarchical (inverse-CDF) sampling.\nimport numpy as np, ag\ndef render(sigma, c, delta):\n    \"\"\"C = sum_i T_i (1 - exp(-sigma_i delta_i)) c_i, with T_i = exp(-sum_{j<i} sigma_j delta_j).\"\"\"\n    a = 1 - np.exp(-sigma * delta); T = np.exp(-np.concatenate([[0], np.cumsum(sigma * delta)[:-1]])); w = T * a\n    return (w[:, None] * c).sum(0), w, T\n# 1) a slab of constant density: quadrature must match the closed form 1 - exp(-sigma * L) for any number of samples\nfor N in (4, 16, 64):\n    t = np.linspace(0, 2, N + 1); d = np.diff(t); s = np.where((t[:-1] + d / 2 > 0.5) & (t[:-1] + d / 2 < 1.5), 3.0, 0.0)\n    C, w, T = render(s, np.ones((N, 3)), d); print('N=%2d samples: opacity %.5f   (exact for a 1.0-thick slab, sigma 3: %.5f)' % (N, w.sum(), 1 - np.exp(-3)))\n# 2) gradient of the colour wrt each density, analytic vs autograd\nrng = np.random.default_rng(0); N = 8; sig = rng.random(N) * 2; col = rng.random((N, 3)); dl = np.full(N, 0.25)\nC, w, T = render(sig, col, dl); g = np.ones(3)                                     # dL/dC = 1 for a sum-of-channels loss\nTn = T * np.exp(-sig * dl)                                                         # transmittance after sample i\nS_after = np.array([(w[i + 1:, None] * col[i + 1:]).sum(0) @ g for i in range(N)])\nanalytic = dl * (Tn * (col @ g) - S_after)                                         # dC/dsigma_i = delta_i (T_{i+1} c_i - sum_{j>i} w_j c_j)\ns = ag.T(sig.copy())\ndef agC():\n    a = 1 - (-(s * ag.T(dl))).exp(); tri = np.tril(np.ones((N, N)), -1); Tt = (-(ag.T(tri) @ (s * ag.T(dl)).reshape(N, 1))).exp().reshape(N)\n    return ((Tt * a).reshape(N, 1) * ag.T(col)).sum()\nagC().backward(); print('dC/dsigma analytic :', np.round(analytic, 5)); print('dC/dsigma autograd :', np.round(s.grad, 5)); print('max diff %.2e; gradcheck %.2e' % (np.abs(analytic - s.grad).max(), ag.gradcheck(agC, [s])))\n# 3) hierarchical sampling: draw fine samples from the coarse weights' piecewise-constant PDF\nt = np.linspace(2, 6, 65); mid = (t[:-1] + t[1:]) / 2; dens = 40 * np.exp(-((mid - 4.2) / 0.05) ** 2)   # thin surface at depth 4.2\n_, w, _ = render(dens, np.ones((64, 3)), np.diff(t))\ncoarse = np.linspace(2, 6, 17); cm = (coarse[:-1] + coarse[1:]) / 2; _, wc, _ = render(40 * np.exp(-((cm - 4.2) / 0.05) ** 2), np.ones((16, 3)), np.diff(coarse))\npdf = (wc + 1e-5) / (wc + 1e-5).sum(); cdf = np.concatenate([[0], np.cumsum(pdf)]); u = (np.arange(64) + 0.5) / 64\nidx = np.clip(np.searchsorted(cdf, u, side='right') - 1, 0, 15); fine = coarse[idx] + (u - cdf[idx]) / pdf[idx] * (coarse[idx + 1] - coarse[idx])\nprint('coarse 16 samples: weight sum %.3f (true opacity ~1: 16 samples under-resolve the thin surface)' % wc.sum())\nprint('fine samples within 0.25 of the surface: %d of 64 (uniform would give %d)' % ((np.abs(fine - 4.2) < 0.25).sum(), int(64 * 0.5 / 4)))\nfs = np.sort(np.concatenate([fine, cm])); fd = np.diff(np.concatenate([fs, [6]])); _, wf, _ = render(40 * np.exp(-((fs - 4.2) / 0.05) ** 2), np.ones((len(fs), 3)), fd)\nprint('expected depth: fine pass %.4f   (true centre 4.2; an opaque shell stops rays slightly in front; 64 uniform samples give %.4f)' % ((wf * fs).sum() / wf.sum(), (w * mid).sum() / w.sum()))", "out": "N= 4 samples: opacity 0.95021   (exact for a 1.0-thick slab, sigma 3: 0.95021)\nN=16 samples: opacity 0.95021   (exact for a 1.0-thick slab, sigma 3: 0.95021)\nN=64 samples: opacity 0.95021   (exact for a 1.0-thick slab, sigma 3: 0.95021)\ndC/dsigma analytic : [ 0.21411 -0.04057  0.0984   0.01985 -0.04816  0.03643  0.10269  0.05769]\ndC/dsigma autograd : [ 0.21411 -0.04057  0.0984   0.01985 -0.04816  0.03643  0.10269  0.05769]\nmax diff 5.55e-17; gradcheck 1.08e-09\ncoarse 16 samples: weight sum 0.651 (true opacity ~1: 16 samples under-resolve the thin surface)\nfine samples within 0.25 of the surface: 64 of 64 (uniform would give 8)\nexpected depth: fine pass 4.1714   (true centre 4.2; an opaque shell stops rays slightly in front; 64 uniform samples give 4.1726)"}, "j_gan": {"lang": "py", "file": "j_gan.py", "src": "# j_gan.py: a shape GAN on radial profiles r(theta) of star-shaped outlines (a 32-number shape code); non-saturating loss, mode coverage check.\nimport numpy as np, ag\nrng = np.random.default_rng(0); K = 32; th = np.linspace(0, 2 * np.pi, K, endpoint=False)\ndef real(n):                                     # 3 families: circles, squares, 5-point stars, random scale\n    c = rng.integers(0, 3, n); s = rng.uniform(0.6, 1.0, (n, 1)); r = np.ones((n, K))\n    r[c == 1] = 1 / np.maximum(np.abs(np.cos(th)), np.abs(np.sin(th))) * 0.75\n    r[c == 2] = 0.7 + 0.3 * np.cos(5 * th); return r * s, c\ndef family(r):                                   # classify a profile by its dominant angular frequency\n    F = np.abs(np.fft.rfft(r - r.mean(1, keepdims=True), axis=1)); return np.where(F.max(1) < 0.05 * K * r.mean(1), 0, np.where(F[:, 4] > F[:, 5], 1, 2))\np = ag.param; G = [p(rng, 8, 64), ag.T(np.zeros(64)), p(rng, 64, K)]; D = [p(rng, K, 64), ag.T(np.zeros(64)), p(rng, 64, 1)]\ngen = lambda z: (ag.T(z) @ G[0] + G[1]).relu() @ G[2] + 0.8\ndis = lambda x: ((x if isinstance(x, ag.T) else ag.T(x)) @ D[0] + D[1]).gelu() @ D[2]\nsp = lambda x: ((x.exp() + 1).log())            # softplus\noG, oD = ag.Adam(G, 1e-3, b1=0.5), ag.Adam(D, 1e-3, b1=0.5)\nfor it in range(1, 3001):\n    x, _ = real(64); f = gen(rng.standard_normal((64, 8)))\n    Ld = sp(-dis(x)).mean() + sp(dis(ag.T(f.data))).mean(); Ld.backward(); oD.step()\n    for q in G: q.grad = np.zeros_like(q.data)\n    Lg = sp(-dis(gen(rng.standard_normal((64, 8))))).mean(); Lg.backward(); oG.step()           # non-saturating generator loss\n    for q in D: q.grad = np.zeros_like(q.data)\n    if it in (1, 1000, 3000):\n        s = gen(rng.standard_normal((600, 8))).data; fam = family(s); rr, rc = real(600)\n        nn = np.min(((s[:, None] - rr[None]) ** 2).mean(-1), 1)\n        print('iter %4d  D loss %.3f  G loss %.3f  | family share circle/square/star %s (real 0.33 each)  mean NN-dist to real %.4f' % (it, Ld.data, Lg.data, np.round(np.bincount(fam, minlength=3) / 600, 2), nn.mean()))\nx, c = real(600); print('family classifier accuracy on real profiles: %.3f' % (family(x) == c).mean())", "out": "iter    1  D loss 1.814  G loss 1.161  | family share circle/square/star [0.   0.68 0.32] (real 0.33 each)  mean NN-dist to real 0.4775\niter 1000  D loss 1.383  G loss 0.683  | family share circle/square/star [0.19 0.31 0.5 ] (real 0.33 each)  mean NN-dist to real 0.0246\niter 3000  D loss 1.378  G loss 0.715  | family share circle/square/star [0.48 0.12 0.4 ] (real 0.33 each)  mean NN-dist to real 0.0070\nfamily classifier accuracy on real profiles: 1.000"}, "j_janus": {"lang": "py", "file": "j_janus.py", "src": "# j_janus.py: the Janus (multi-face) problem, and why view-conditioned priors (Zero123, MVDream) fix it. Texture on a cylinder, 1D views.\nimport numpy as np\nK = 72; az = np.arange(K) / K * 2 * np.pi; Wd = 32; xv = (np.arange(Wd) + 0.5) / Wd * 2 - 1\ndef project(theta):                         # which texture bins a view at azimuth theta sees, per pixel (orthographic cylinder)\n    a = (theta + np.arcsin(xv)) % (2 * np.pi); i = (a / (2 * np.pi) * K).astype(int) % K; M = np.zeros((Wd, K)); M[np.arange(Wd), i] = 1; return M\nface = lambda c: np.exp(-((xv - c) / 0.15) ** 2)                      # a \"face\" feature at screen position c\nCS = np.linspace(-0.5, 0.5, 11)\ndef prior_mean(theta, view_aware, x=None):\n    if not view_aware:                                                # 2D prior: \"a picture of this object shows a face somewhere near the middle\"\n        return face(CS[np.argmax([x @ face(c) for c in CS])])          # multimodal; mode seeking pulls toward the mode nearest the render\n    d = (theta + np.pi) % (2 * np.pi) - np.pi                         # view-conditioned: face is at azimuth 0 on the object\n    return face(np.sin(-d)) * (np.abs(d) < np.pi / 2)                   # it slides off the side and is hidden from the back\ndef optimise(view_aware, iters=3000, lr=0.2, rng=np.random.default_rng(0)):\n    tex = rng.normal(0, 0.05, K)\n    for _ in range(iters):\n        th = rng.uniform(0, 2 * np.pi); M = project(th); x = M @ tex\n        tex -= lr * M.T @ (x - prior_mean(th, view_aware, x)) / Wd       # SDS with a Gaussian prior == pull each render to the prior mean\n    return tex\ndef faces(tex): t = tex > 0.5; return int(((t & ~np.roll(t, 1))).sum())\nfor va in (False, True):\n    tex = optimise(va); print('%-26s texture peaks (faces) = %d; texture max %.2f; brightest bins at azimuth %s deg' % ('view-agnostic 2D prior:' if not va else 'view-conditioned prior:', faces(tex), tex.max(), sorted(set((np.round(az[tex > 0.5 * tex.max()] * 180 / np.pi / 30) * 30).astype(int).tolist()))))\nprint('with no camera input, every view wants a face, so the object grows a face everywhere (Janus). Conditioning on the camera pose gives one consistent face.')", "out": "view-agnostic 2D prior:    texture peaks (faces) = 3; texture max 0.57; brightest bins at azimuth [30, 90, 120, 180, 240, 330] deg\nview-conditioned prior:    texture peaks (faces) = 1; texture max 0.93; brightest bins at azimuth [0, 360] deg\nwith no camera input, every view wants a face, so the object grows a face everywhere (Janus). Conditioning on the camera pose gives one consistent face."}, "j_latdiff": {"lang": "py", "file": "j_latdiff.py", "src": "# j_latdiff.py: latent diffusion (Shap-E / 3DShape2VecSet idea): compress SDF grids to a small latent, diffuse there, class-condition with classifier-free guidance.\nimport numpy as np, ag, shapes, m3d\nrng = np.random.default_rng(0); G = 16; P = m3d.grid(G, -1.1, 1.1).reshape(-1, 3)\ngrids, ys = [], []\nfor k in range(300):\n    c = k % 5; s = rng.uniform(0.7, 1.0); a = rng.uniform(0, 2 * np.pi); R = np.array([[np.cos(a), -np.sin(a), 0], [np.sin(a), np.cos(a), 0], [0, 0, 1]])\n    grids.append(np.clip(shapes.sdf(shapes.CLASSES[c], P @ R, s), -0.3, 0.3)); ys.append(c)\nXg = np.array(grids); Y = np.array(ys); mu = Xg.mean(0)\nU, Sv, Vt = np.linalg.svd(Xg - mu, full_matrices=False); Z = 16; Bz = Vt[:Z]               # linear autoencoder = PCA\nlat = (Xg - mu) @ Bz.T; sc = lat.std(0); lat = lat / sc\nprint('grid %d^3 = %d numbers -> latent %d (%.0fx smaller); variance kept %.1f%%' % (G, G ** 3, Z, G ** 3 / Z, 100 * (Sv[:Z] ** 2).sum() / (Sv ** 2).sum()))\nrec = lat * sc @ Bz + mu; print('reconstruction: sign agreement %.2f%%, mean |SDF error| %.4f' % (100 * ((rec > 0) == (Xg > 0)).mean(), np.abs(rec - Xg).mean()))\nTn = 200; betas = np.linspace(1e-4, 0.06, Tn); al = 1 - betas; ab = np.cumprod(al)\np = ag.param; W1 = p(rng, Z + 16 + 6, 256); b1 = ag.T(np.zeros(256)); W2 = p(rng, 256, 256); b2 = ag.T(np.zeros(256)); W3 = p(rng, 256, Z, scale=0.01); params = [W1, b1, W2, b2, W3]\ndef temb(t): f = np.exp(-np.arange(8) * np.log(200) / 8); a = t[:, None] * f; return np.concatenate([np.sin(a), np.cos(a)], 1)\ndef eps(x, t, c): oh = np.eye(6)[c]; h = (ag.T(np.concatenate([x, temb(t), oh], 1)) @ W1 + b1).gelu(); return ((h @ W2 + b2).gelu()) @ W3\nopt = ag.Adam(params, 1e-3)\nfor it in range(1, 8001):\n    i = rng.integers(0, len(lat), 64); t = rng.integers(0, Tn, 64); e = rng.standard_normal((64, Z))\n    c = np.where(rng.random(64) < 0.15, 5, Y[i])                       # 15% of the time drop the label (class 5 = \"no condition\")\n    x = np.sqrt(ab[t])[:, None] * lat[i] + np.sqrt(1 - ab[t])[:, None] * e\n    L = ((eps(x, t, c) - ag.T(e)) ** 2).mean(); L.backward(); opt.step()\n    if it in (1, 2000, 8000): print('iter %4d  epsilon-MSE %.4f' % (it, L.data))\ndef sample(c, w, n=20):\n    x = rng.standard_normal((n, Z)); cc = np.full(n, c); cu = np.full(n, 5)\n    for t in range(Tn - 1, -1, -1):\n        tt = np.full(n, t); e = (1 + w) * eps(x, tt, cc).data - w * eps(x, tt, cu).data          # classifier-free guidance\n        x = (x - betas[t] / np.sqrt(1 - ab[t]) * e) / np.sqrt(al[t]); x += np.sqrt(betas[t]) * rng.standard_normal(x.shape) * (t > 0)\n    return x * sc @ Bz + mu\ncent = np.array([Xg[Y == c].mean(0) for c in range(5)])\ndef classify(g): return np.argmin(((g[:, None] - cent[None]) ** 2).sum(-1), 1)\nprint('nearest-class-mean classifier on training grids: %.2f%%' % (100 * (classify(Xg) == Y).mean()))\nfor w in (0.0, 2.0):\n    acc = [(classify(sample(c, w)) == c).mean() for c in range(5)]\n    print('guidance w=%.1f: generated shapes matching the requested class: %s  mean %.2f' % (w, dict(zip(shapes.CLASSES, np.round(acc, 2).tolist())), np.mean(acc)))\ng = sample(3, 2.0, 1)[0].reshape(G, G, G); print('one guided torus sample: inside voxels %d, sign changes along the centre column: %d (a torus has a hole -> 0 inside at the centre: %s)' % ((g < 0).sum(), (np.diff(np.sign(g[G // 2, G // 2])) != 0).sum(), bool(g[G // 2, G // 2, G // 2] > 0)))", "out": "grid 16^3 = 4096 numbers -> latent 16 (256x smaller); variance kept 99.7%\nreconstruction: sign agreement 99.90%, mean |SDF error| 0.0015\niter    1  epsilon-MSE 1.0208\niter 2000  epsilon-MSE 0.1369\niter 8000  epsilon-MSE 0.0992\nnearest-class-mean classifier on training grids: 96.33%\nguidance w=0.0: generated shapes matching the requested class: {'sphere': 0.75, 'box': 1.0, 'cylinder': 1.0, 'torus': 1.0, 'cone': 1.0}  mean 0.95\nguidance w=2.0: generated shapes matching the requested class: {'sphere': 0.85, 'box': 0.9, 'cylinder': 1.0, 'torus': 1.0, 'cone': 1.0}  mean 0.95\none guided torus sample: inside voxels 112, sign changes along the centre column: 0 (a torus has a hole -> 0 inside at the centre: True)"}, "j_lrm": {"lang": "py", "file": "j_lrm.py", "src": "# j_lrm.py: feed-forward reconstruction (LRM / LGM idea): images in, 3D field out, in one forward pass; amortised vs per-shape optimisation.\nimport numpy as np, ag, shapes, m3d, time\nrng = np.random.default_rng(0); R = 16; g = (np.arange(R) + 0.5) / R * 2.2 - 1.1\ndef rot(a): return np.array([[np.cos(a), -np.sin(a), 0], [np.sin(a), np.cos(a), 0], [0, 0, 1]])\ndef item(c, rng):\n    s = rng.uniform(0.7, 1.0); Rm = rot(rng.uniform(0, np.pi)); f = lambda p: shapes.sdf(c, p @ Rm, s)\n    G3 = np.stack(np.meshgrid(g, g, g, indexing='ij'), -1); occ = f(G3.reshape(-1, 3)).reshape(R, R, R) < 0\n    views = np.concatenate([occ.any(k).ravel() for k in range(3)]).astype(float)        # three orthographic silhouettes = the \"images\"\n    q = rng.uniform(-1.1, 1.1, (128, 3)); return views, q, (f(q) < 0).astype(float)\ndata = [item(shapes.CLASSES[k % 5], rng) for k in range(600)]; test = [item(shapes.CLASSES[k % 5], np.random.default_rng(9 + k)) for k in range(50)]\nV = np.array([d[0] for d in data]); Qp = np.array([d[1] for d in data]); O = np.array([d[2] for d in data])\np = ag.param; E1, e1, E2 = p(rng, 3 * R * R, 256), ag.T(np.zeros(256)), p(rng, 256, 64)\nD1, d1, D2, d2, D3 = p(rng, 3 + 64, 96), ag.T(np.zeros(96)), p(rng, 96, 96), ag.T(np.zeros(96)), p(rng, 96, 1); params = [E1, e1, E2, D1, d1, D2, d2, D3]\ndef forward(views, q):\n    B, M = q.shape[:2]; z = ((ag.T(views) @ E1 + e1).gelu() @ E2).reshape(B, 1, 64) * ag.T(np.ones((1, M, 1)))   # image encoder -> shape code\n    h = (ag.cat([ag.T(q), z], -1) @ D1 + d1).gelu(); h = (h @ D2 + d2).gelu(); return (h @ D3).reshape(B, M)          # occupancy decoder\ndef bce(lg, y): return ((lg.exp() + 1).log() - lg * ag.T(y)).mean()\nopt = ag.Adam(params, 1e-3); t0 = time.time()\nfor it in range(1, 1501):\n    i = rng.integers(0, len(V), 32); L = bce(forward(V[i], Qp[i]), O[i]); L.backward(); opt.step()\n    if it in (1, 500, 1500): print('iter %4d  BCE %.4f' % (it, L.data))\ntrain_s = time.time() - t0\nG3 = np.stack(np.meshgrid(g, g, g, indexing='ij'), -1).reshape(1, -1, 3)\nious, vh = [], []; t0 = time.time()\nfor k, (views, q, o) in enumerate(test):\n    c = shapes.CLASSES[k % 5]; pred = forward(views[None], G3).data[0] > 0\n    s_rng = np.random.default_rng(9 + k); s = s_rng.uniform(0.7, 1.0); Rm = rot(s_rng.uniform(0, np.pi)); gt = shapes.sdf(c, G3[0] @ Rm, s) < 0\n    ious.append((pred & gt).sum() / (pred | gt).sum())\n    hull = np.ones((R, R, R), bool); sil = views.reshape(3, R, R) > 0                  # visual hull baseline: carve with the 3 silhouettes\n    hull &= sil[0][None]; hull &= sil[1][:, None]; hull &= sil[2][:, :, None]; vh.append((hull.ravel() & gt).sum() / (hull.ravel() | gt).sum())\ninf_ms = (time.time() - t0) / len(test) * 1000\nprint('unseen shapes IoU: feed-forward %.3f   visual-hull baseline %.3f' % (np.mean(ious), np.mean(vh)))\nprint('per class (feed-forward):', {c: round(float(np.mean(ious[k::5])), 3) for k, c in enumerate(shapes.CLASSES)})\nprint('training %.0f s once; inference %.1f ms per shape (h_occnet-style per-shape fitting took ~11 s)' % (train_s, inf_ms))", "out": "iter    1  BCE 0.6746\niter  500  BCE 0.0700\niter 1500  BCE 0.0381\nunseen shapes IoU: feed-forward 0.764   visual-hull baseline 0.936\nper class (feed-forward): {'sphere': 0.936, 'box': 0.72, 'cylinder': 0.845, 'torus': 0.576, 'cone': 0.74}\ntraining 90 s once; inference 44.8 ms per shape (h_occnet-style per-shape fitting took ~11 s)"}, "j_meshtok": {"lang": "py", "file": "j_meshtok.py", "src": "# j_meshtok.py: meshes as token sequences (PolyGen/MeshGPT style): quantise, sort, flatten triangles, train a causal model, sample and check validity.\nimport numpy as np, ag, m3d\nrng = np.random.default_rng(0); Q = 32; EOS = Q; BOS = Q + 1; VOC = Q + 2\ndef make_shape():                                    # random box or square pyramid, integer-quantised to a 32^3 grid\n    a, b, h = rng.integers(4, 15, 3)\n    if rng.random() < 0.5: V, F = m3d.cube(); V = (V + 1) / 2 * np.array([a, b, h]) * 2 - np.array([a, b, h]) + 16\n    else: V = np.array([[-a, -b, 0], [a, -b, 0], [a, b, 0], [-a, b, 0], [0, 0, 2 * h]], float) + np.array([16, 16, 2]); F = np.array([[0, 2, 1], [0, 3, 2], [0, 1, 4], [1, 2, 4], [2, 3, 4], [3, 0, 4]])\n    V = np.clip(np.round(V), 0, Q - 1).astype(int); return V, F\ndef tokens(V, F):\n    tri = []\n    for f in F:\n        t = [tuple(V[i][[2, 1, 0]]) for i in f]; k = t.index(min(t)); t = t[k:] + t[:k]; tri.append(t)   # rotate: lowest vertex first (keeps winding)\n    tri.sort(); return [BOS] + [c for t in tri for v in t for c in v] + [EOS]                            # z-y-x order, triangles sorted\nV, F = make_shape(); seq = tokens(V, F); print('one shape: %d triangles -> %d tokens; first triangle tokens %s' % (len(F), len(seq), [int(x) for x in seq[1:10]]))\ndata = [tokens(*make_shape()) for _ in range(400)]\nW = 12                                               # context window: the last 12 tokens + position-within-triangle (0..8)\ndef feats(s, i): ctx = ([BOS] * W + s[:i])[-W:]; return ctx, (i - 1) % 9 if i > 0 else 9\nE = ag.param(rng, VOC, 24, scale=0.3); Pp = ag.param(rng, 10, 24, scale=0.3); W1 = ag.param(rng, W * 24 + 24, 256); b1 = ag.T(np.zeros(256)); W2 = ag.param(rng, 256, VOC)\nparams = [E, Pp, W1, b1, W2]\ndef logits(C, Pi): B = len(C); h = ag.cat([E[np.array(C)].reshape(B, W * 24), Pp[np.array(Pi)]], 1); return (h @ W1 + b1).gelu() @ W2\nXc, Xp, Yt = [], [], []\nfor s in data:\n    for i in range(1, len(s)): c, pi = feats(s, i); Xc.append(c); Xp.append(pi); Yt.append(s[i])\nXc, Xp, Yt = np.array(Xc), np.array(Xp), np.array(Yt); print('training tokens: %d, vocab %d (32 coordinate levels + EOS + BOS)' % (len(Yt), VOC))\nopt = ag.Adam(params, 2e-3)\nfor it in range(1, 2001):\n    i = rng.integers(0, len(Yt), 256); L = ag.cross_entropy(logits(Xc[i], Xp[i]), Yt[i]); L.backward(); opt.step()\n    if it in (1, 500, 2000): print('iter %4d  next-token loss %.3f nats (uniform = %.3f)' % (it, L.data, np.log(VOC)))\ndef sample(T=0.7):\n    s = [BOS]\n    while len(s) < 9 * 14 + 2:\n        c, pi = feats(s, len(s)); z = logits([c], [pi]).data[0] / T; pr = np.exp(z - z.max()); pr /= pr.sum(); t = rng.choice(VOC, p=pr)\n        if t == EOS: break\n        if t == BOS: continue\n        s.append(int(t))\n    return s\nok = closed = 0; nt = []\nfor _ in range(50):\n    s = sample(); body = s[1:]; ntri = len(body) // 9; nt.append(ntri)\n    if len(body) % 9 == 0 and ntri > 0:\n        T3 = np.array(body).reshape(ntri, 3, 3); verts, F = np.unique(T3.reshape(-1, 3), axis=0, return_inverse=True); F = F.reshape(ntri, 3); ok += 1\n        e = np.sort(np.concatenate([F[:, [0, 1]], F[:, [1, 2]], F[:, [2, 0]]]), 1); _, cnt = np.unique(e, axis=0, return_counts=True); closed += np.all(cnt == 2)\nprint('50 samples: well-formed (multiple of 9 tokens) %d, watertight (every edge in exactly 2 faces) %d; triangle counts seen: %s' % (ok, closed, {int(k): int(v) for k, v in zip(*np.unique(nt, return_counts=True))}))", "out": "one shape: 12 triangles -> 110 tokens; first triangle tokens [7, 5, 3, 7, 5, 29, 25, 5, 29]\ntraining tokens: 31720, vocab 34 (32 coordinate levels + EOS + BOS)\niter    1  next-token loss 3.532 nats (uniform = 3.526)\niter  500  next-token loss 0.144 nats (uniform = 3.526)\niter 2000  next-token loss 0.175 nats (uniform = 3.526)\n50 samples: well-formed (multiple of 9 tokens) 50, watertight (every edge in exactly 2 faces) 29; triangle counts seen: {6: 27, 12: 23}"}, "j_pcdiff": {"lang": "py", "file": "j_pcdiff.py", "src": "# j_pcdiff.py: DDPM on whole point clouds: forward noising, a set-equivariant denoiser (per-point MLP + PointNet global feature + time), ancestral sampling.\nimport numpy as np, ag, shapes, m3d\nrng = np.random.default_rng(0); N = 64; Tn = 200\nbetas = np.linspace(1e-4, 0.06, Tn); al = 1 - betas; ab = np.cumprod(al)\nprint('noise schedule: abar_1 %.4f, abar_100 %.4f, abar_200 %.5f (x_T is almost pure noise)' % (ab[0], ab[99], ab[-1]))\nCL = ['sphere', 'torus']; X = np.array([shapes.sample(CL[k % 2], N, rng, s=1.0, rot=False) for k in range(200)])\n# closed-form q(x_t | x_0) check against 100 sequential noising steps\nx = X[0].copy(); t = 59\nfor k in range(t + 1): x = np.sqrt(al[k]) * x + np.sqrt(betas[k]) * rng.standard_normal(x.shape)\nprint('after %d sequential steps: mean %.3f std-ratio vs closed form %.3f' % (t + 1, (x - np.sqrt(ab[t]) * X[0]).mean(), (x - np.sqrt(ab[t]) * X[0]).std() / np.sqrt(1 - ab[t])))\np = ag.param; H = 96\nA1, a1, A2, a2 = p(rng, 3 + 16, H), ag.T(np.zeros(H)), p(rng, H, H), ag.T(np.zeros(H))\nB1, b1, B2 = p(rng, 2 * H, H), ag.T(np.zeros(H)), p(rng, H, 3, scale=0.01); params = [A1, a1, A2, a2, B1, b1, B2]\ndef temb(t): f = np.exp(-np.arange(8) * np.log(100) / 8); a = t[:, None] * f; return np.concatenate([np.sin(a), np.cos(a)], 1)\ndef eps_model(xt, t):\n    B = xt.shape[0]; te = np.repeat(temb(t)[:, None], N, 1)\n    h = ((ag.T(np.concatenate([xt, te], -1)) @ A1 + a1).gelu() @ A2 + a2).gelu()          # per-point features\n    g = h.max(1).reshape(B, 1, H)\n    hg = ag.cat([h, g * ag.T(np.ones((1, N, 1)))], -1)                                      # each point sees the whole cloud\n    return (hg @ B1 + b1).gelu() @ B2\nopt = ag.Adam(params, 1e-3)\nfor it in range(1, 6001):\n    i = rng.integers(0, len(X), 16); t = rng.integers(0, Tn, 16); e = rng.standard_normal((16, N, 3))\n    xt = np.sqrt(ab[t])[:, None, None] * X[i] + np.sqrt(1 - ab[t])[:, None, None] * e\n    L = ((eps_model(xt, t) - ag.T(e)) ** 2).mean(); L.backward(); opt.step()\n    if it in (1, 2000, 6000): print('iter %4d  epsilon-MSE %.4f' % (it, L.data))\ndef sample(n):\n    x = rng.standard_normal((n, N, 3))\n    for t in range(Tn - 1, -1, -1):\n        e = eps_model(x, np.full(n, t)).data; x = (x - betas[t] / np.sqrt(1 - ab[t]) * e) / np.sqrt(al[t])\n        if t > 0: x += np.sqrt(betas[t]) * rng.standard_normal(x.shape)\n    return x\nS = sample(20)\nd_s = [np.abs(shapes.sdf('sphere', s)).mean() for s in S]; d_t = [np.abs(shapes.sdf('torus', s)).mean() for s in S]\nlab = ['sphere' if a < b else 'torus' for a, b in zip(d_s, d_t)]\nprint('20 samples: %d sphere-like, %d torus-like; mean |SDF| to their class surface %.4f (noise at t=T: %.3f)' % (lab.count('sphere'), lab.count('torus'), np.mean(np.minimum(d_s, d_t)), np.mean([np.abs(shapes.sdf('sphere', rng.standard_normal((N, 3)))).mean()])))\nprint('Chamfer of samples to nearest training cloud %.4f; nearest-training vs nearest-other-training baseline %.4f' % (np.mean([min(m3d.chamfer(s, x) for x in X[:60]) for s in S]), np.mean([min(m3d.chamfer(X[k], x) for x in X[60:120]) for k in range(10)])))", "out": "noise schedule: abar_1 0.9999, abar_100 0.2198, abar_200 0.00217 (x_T is almost pure noise)\nafter 60 sequential steps: mean -0.045 std-ratio vs closed form 1.058\niter    1  epsilon-MSE 0.9777\niter 2000  epsilon-MSE 0.3059\niter 6000  epsilon-MSE 0.1798\n20 samples: 18 sphere-like, 2 torus-like; mean |SDF| to their class surface 0.0866 (noise at t=T: 0.813)\nChamfer of samples to nearest training cloud 0.0819; nearest-training vs nearest-other-training baseline 0.0520"}, "j_scaling": {"lang": "py", "file": "j_scaling.py", "src": "# j_scaling.py: back-of-envelope compute and memory for a frontier text/image-to-3D stack (all numbers are formulas you can re-derive).\ndef human(x):\n    for u in ['', 'K', 'M', 'G', 'T', 'P', 'E', 'Z']:\n        if abs(x) < 1000: return '%.3g%s' % (x, u)\n        x /= 1000\n    return '%.3gY' % x\n# 1) transformer training compute: C ~ 6 N D (forward 2ND + backward 4ND)\nfor name, N, D in [('multi-view diffusion U-Net/DiT', 1.0e9, 2.0e11), ('LRM-style image-to-triplane transformer', 5.0e8, 1.0e11), ('mesh-token autoregressive model', 3.5e8, 3.0e10)]:\n    C = 6 * N * D; gpu = C / (0.4 * 989e12) / 3600            # H100 bf16 dense peak 989 TFLOP/s at 40% utilisation\n    print('%-42s N=%s params, D=%s tokens: C=%s FLOP = %.0f GPU-hours' % (name, human(N), human(D), human(C), gpu))\n# 2) where tokens come from: Objaverse-XL-scale data\nobjs = 1.0e7; views = 16; tok = (256 // 8) ** 2 * 1        # 256^2 renders, 8x8 patches -> 1024 tokens per view\nprint('%s objects x %d views x %d patch tokens = %s image tokens per epoch' % (human(objs), views, tok, human(objs * views * tok)))\n# 3) training memory per parameter with Adam in mixed precision\nper = 2 + 2 + 4 + 4 + 4                                     # bf16 weights, bf16 grads, fp32 master, Adam m, Adam v\nfor N in (3.5e8, 1e9, 7e9): print('N=%s: weights+grads+optimiser = %d B/param -> %.1f GB (before activations)' % (human(N), per, N * per / 1e9))\n# 4) activation memory of one transformer layer, sequence L, width d, batch b (no recompute): ~ 34 L b d + 5 a L^2 b bytes (Korthikanti et al.)\nL, d, a, b = 4096, 1024, 16, 8; act = 34 * L * b * d + 5 * a * L * L * b\nprint('one layer, L=%d d=%d heads=%d batch=%d: %.2f GB activations -> 24 layers %.1f GB; flash-attention removes the L^2 term: %.2f GB' % (L, d, a, b, act / 1e9, 24 * act / 1e9, 24 * 34 * L * b * d / 1e9))\n# 5) inference budget: diffusion steps x cost per step\nstep = 2 * 1e9 * 4 * 1024; print('multi-view sampling: 50 steps x 4 views x 1024 tokens x 2N FLOP = %s FLOP = %.2f s on one H100 at 40%%' % (human(50 * step), 50 * step / (0.4 * 989e12)))", "out": "multi-view diffusion U-Net/DiT             N=1G params, D=200G tokens: C=1.2Z FLOP = 843 GPU-hours\nLRM-style image-to-triplane transformer    N=500M params, D=100G tokens: C=300E FLOP = 211 GPU-hours\nmesh-token autoregressive model            N=350M params, D=30G tokens: C=63E FLOP = 44 GPU-hours\n10M objects x 16 views x 1024 patch tokens = 164G image tokens per epoch\nN=350M: weights+grads+optimiser = 16 B/param -> 5.6 GB (before activations)\nN=1G: weights+grads+optimiser = 16 B/param -> 16.0 GB (before activations)\nN=7G: weights+grads+optimiser = 16 B/param -> 112.0 GB (before activations)\none layer, L=4096 d=1024 heads=16 batch=8: 11.88 GB activations -> 24 layers 285.1 GB; flash-attention removes the L^2 term: 27.38 GB\nmulti-view sampling: 50 steps x 4 views x 1024 tokens x 2N FLOP = 410T FLOP = 1.04 s on one H100 at 40%"}, "j_sds": {"lang": "py", "file": "j_sds.py", "src": "# j_sds.py: Score Distillation Sampling (DreamFusion) with a known 2D \"diffusion prior\", optimising a 3D sphere through random-view renders.\nimport numpy as np\nrng = np.random.default_rng(0); S = 24; ys, xs = (np.mgrid[0:S, 0:S] + 0.5) / S * 2 - 1\ndef disc(cx, cy, r, k=12.0): d = np.hypot(xs - cx, ys - cy) - r; return 1 / (1 + np.exp(k * d)), d\nMU = disc(0, 0, 0.5)[0].ravel(); s2 = 0.05 ** 2           # the prior: every view should look like a centred disc of radius 0.5\ndef eps_hat(xt, ab):                                     # exact noise prediction for the Gaussian image prior N(MU, s2 I)\n    return np.sqrt(1 - ab) * (xt - np.sqrt(ab) * MU) / (ab * s2 + 1 - ab)\nab_t = np.cumprod(1 - np.linspace(1e-4, 0.02, 1000))\ndef view(theta, c, r):                                   # orthographic camera rotating about the y axis\n    R = np.array([[np.cos(theta), 0, np.sin(theta)], [0, 1, 0]]); px, py = R @ c\n    img, d = disc(px, py, r); g = 12.0 * img * (1 - img)                          # d img / d (-dist)\n    dist_dc = -np.stack([(xs - px) / (d + r + 1e-9), (ys - py) / (d + r + 1e-9)])    # d dist / d (px, py)\n    dimg_dp = np.stack([-g * dist_dc[0], -g * dist_dc[1]]); dimg_dr = g\n    J = np.concatenate([(dimg_dp.reshape(2, -1).T @ R), dimg_dr.reshape(-1, 1)], 1)  # (pixels, 4): wrt centre xyz and radius\n    return img.ravel(), J\ndef run(subtract_eps, iters=600, lr=0.02, guidance=1.0, r0=0.25, prior=None):\n    c = np.array([0.5, -0.4, 0.3]); r = r0; gn = []; prior = prior or eps_hat\n    for it in range(iters):\n        th = rng.uniform(0, 2 * np.pi); x, J = view(th, c, r); t = rng.integers(20, 980); ab = ab_t[t]; e = rng.standard_normal(x.shape)\n        xt = np.sqrt(ab) * x + np.sqrt(1 - ab) * e\n        eh = guidance * prior(xt, ab) + (1 - guidance) * e                     # guidance > 1 exaggerates the prior's pull\n        g = (1 - ab) * ((eh - e) if subtract_eps else eh) @ J                    # SDS: w(t) (eps_hat - eps) dx/dtheta, skipping the U-Net Jacobian\n        gn.append(np.linalg.norm(g)); c -= lr * g[:3] / 100; r -= lr * g[3] / 100\n    return c, r, np.std(gn)\nx, J = view(0.3, np.array([0.1, 0.2, -0.1]), 0.4); e = 1e-6; xp, _ = view(0.3, np.array([0.1, 0.2, -0.1]), 0.4 + e)\nprint('renderer Jacobian check (d image / d radius): analytic vs finite difference max diff %.2e' % np.abs(J[:, 3] - (xp - x) / e).max())\nfor sub in (True, False):\n    c, r, sd = run(sub); print('SDS %-22s -> centre %s radius %.3f  (target 0,0,0 and 0.5); gradient-norm std %.1f' % ('(eps_hat - eps)' if sub else '(eps_hat only)', np.round(c, 3), r, sd))\nMUS = [disc(0, 0, 0.3)[0].ravel(), disc(0, 0, 0.7)[0].ravel()]          # a two-mode prior: small disc or large disc, 50/50\ndef eps_mix(xt, ab):\n    v = ab * s2 + 1 - ab; ll = np.array([-((xt - np.sqrt(ab) * m) ** 2).sum() / (2 * v) for m in MUS]); w = np.exp(ll - ll.max()); w /= w.sum()\n    return sum(wk * np.sqrt(1 - ab) * (xt - np.sqrt(ab) * m) / v for wk, m in zip(w, MUS))\nfor r0 in (0.2, 0.45, 0.55, 0.9):\n    c, r, _ = run(True, r0=r0, prior=eps_mix); print('two-mode prior, start radius %.2f -> final %.3f' % (r0, r))\nprint('mode seeking: each run climbs into one mode picked by its start (not always the nearest radius) and never reproduces the 50/50 mix; VSD (ProlificDreamer) fixes this by learning a score for the current 3D distribution.')", "out": "renderer Jacobian check (d image / d radius): analytic vs finite difference max diff 6.93e-06\nSDS (eps_hat - eps)        -> centre [ 0.005 -0.     0.003] radius 0.500  (target 0,0,0 and 0.5); gradient-norm std 10.8\nSDS (eps_hat only)         -> centre [-0.008  0.001  0.007] radius 0.501  (target 0,0,0 and 0.5); gradient-norm std 17.3\ntwo-mode prior, start radius 0.20 -> final 0.279\ntwo-mode prior, start radius 0.45 -> final 0.317\ntwo-mode prior, start radius 0.55 -> final 0.314\ntwo-mode prior, start radius 0.90 -> final 0.694\nmode seeking: each run climbs into one mode picked by its start (not always the nearest radius) and never reproduces the 50/50 mix; VSD (ProlificDreamer) fixes this by learning a score for the current 3D distribution."}, "j_vae": {"lang": "py", "file": "j_vae.py", "src": "# j_vae.py: a point-cloud VAE: PointNet encoder -> latent z (reparameterised) -> MLP decoder to 128 points, Chamfer + KL loss.\nimport numpy as np, ag, shapes, m3d\nrng = np.random.default_rng(0); N = 128; Z = 8\nX, Y = shapes.dataset(40, N, rng, noise=0.0); Xte, Yte = shapes.dataset(6, N, np.random.default_rng(1), noise=0.0)\np = ag.param\nW1, b1, W2, b2 = p(rng, 3, 64), ag.T(np.zeros(64)), p(rng, 64, 128), ag.T(np.zeros(128))\nWm, Wv = p(rng, 128, Z), p(rng, 128, Z); D1, D2, D3 = p(rng, Z, 128), p(rng, 128, 256), p(rng, 256, N * 3, scale=0.01)\nparams = [W1, b1, W2, b2, Wm, Wv, D1, D2, D3]\ndef enc(x): h = ((ag.T(x) @ W1 + b1).relu() @ W2 + b2).relu().max(1); return h @ Wm, h @ Wv          # max-pool: order-invariant\ndef dec(z): B = z.data.shape[0]; return ((z @ D1).relu() @ D2).relu().__matmul__(D3).reshape(B, N, 3)\ndef chamfer(P, Q):                                                                # differentiable batched Chamfer distance\n    d = ((P.reshape(*P.data.shape[:2], 1, 3) - ag.T(Q[:, None])) ** 2).sum(-1)\n    return (-((-d).max(2))).mean() + (-((-d).max(1))).mean()\ndef kl(mu, lv): return ((mu * mu + lv.exp() - lv - 1) * 0.5).sum(1).mean()\nopt = ag.Adam(params, 2e-3); beta = 1e-3\nfor it in range(1, 1501):\n    i = rng.integers(0, len(X), 32); mu, lv = enc(X[i]); z = mu + (lv * 0.5).exp() * ag.T(rng.standard_normal(mu.data.shape))\n    rec = chamfer(dec(z), X[i]); L = rec + beta * kl(mu, lv); L.backward(); opt.step()\n    if it in (1, 500, 1500): print('iter %4d  chamfer %.4f  KL %.2f' % (it, rec.data, kl(mu, lv).data))\nmu, lv = enc(Xte); R = dec(mu).data\ncd = [m3d.chamfer(R[k], Xte[k]) for k in range(len(Xte))]\nprint('test reconstruction Chamfer (mean over %d unseen shapes): %.4f ; per class:' % (len(Xte), np.mean(cd)), {c: round(float(np.mean([cd[k] for k in range(len(Yte)) if Yte[k] == ci])), 4) for ci, c in enumerate(shapes.CLASSES)})\n# sampling from the prior and naming each sample by its nearest training shape\nS = dec(ag.T(rng.standard_normal((20, Z)))).data\nnear = [Y[2 * np.argmin([m3d.chamfer(s, X[k]) for k in range(0, len(X), 2)])] for s in S]\nprint('20 prior samples, nearest-training-shape classes:', {c: near.count(ci) for ci, c in enumerate(shapes.CLASSES)}, '(uneven: the prior covers some classes better than others)')\nprint('trivial baseline (mean of unordered clouds collapses toward the centre): Chamfer %.4f' % np.mean([m3d.chamfer(X.mean(0), x) for x in Xte]))\nprint('mean Chamfer of prior samples to their nearest training shape: %.4f' % np.mean([min(m3d.chamfer(s, X[k]) for k in range(0, len(X), 2)) for s in S]))\n# latent interpolation sphere -> box\na, b = Xte[list(Yte).index(0)], Xte[list(Yte).index(1)]; za, zb = enc(np.stack([a, b]))[0].data\nfor t in (0, 0.5, 1):\n    P = dec(ag.T(((1 - t) * za + t * zb)[None])).data[0]; print('interp t=%.1f: chamfer to sphere %.4f, to box %.4f, max |coord| %.3f' % (t, m3d.chamfer(P, a), m3d.chamfer(P, b), np.abs(P).max()))", "out": "iter    1  chamfer 0.3930  KL 1.22\niter  500  chamfer 0.0249  KL 6.21\niter 1500  chamfer 0.0217  KL 5.74\ntest reconstruction Chamfer (mean over 30 unseen shapes): 0.0211 ; per class: {'sphere': 0.0264, 'box': 0.0262, 'cylinder': 0.0188, 'torus': 0.0196, 'cone': 0.0147}\n20 prior samples, nearest-training-shape classes: {'sphere': 1, 'box': 0, 'cylinder': 3, 'torus': 6, 'cone': 10} (uneven: the prior covers some classes better than others)\ntrivial baseline (mean of unordered clouds collapses toward the centre): Chamfer 0.4734\nmean Chamfer of prior samples to their nearest training shape: 0.0612\ninterp t=0.0: chamfer to sphere 0.0301, to box 0.0556, max |coord| 0.718\ninterp t=0.5: chamfer to sphere 0.0568, to box 0.0300, max |coord| 0.626\ninterp t=1.0: chamfer to sphere 0.1130, to box 0.0297, max |coord| 0.533"}, "k_arap": {"lang": "py", "file": "k_arap.py", "src": "# k_arap.py: As-Rigid-As-Possible deformation (Sorkine & Alexa 2007): local SVD rotations + global Laplacian solve, vs naive Laplacian editing.\nimport numpy as np\nnx, ny = 21, 5; xs, ys = np.meshgrid(np.linspace(0, 4, nx), np.linspace(0, 0.8, ny)); V0 = np.c_[xs.ravel(), ys.ravel()]   # a 2D bar\nidx = lambda i, j: j * nx + i; E = []\nfor j in range(ny):\n    for i in range(nx):\n        if i + 1 < nx: E.append((idx(i, j), idx(i + 1, j)))\n        if j + 1 < ny: E.append((idx(i, j), idx(i, j + 1)))\n        if i + 1 < nx and j + 1 < ny: E.append((idx(i, j), idx(i + 1, j + 1)))\nE = np.array(E); n = len(V0); nb = [[] for _ in range(n)]\nfor a, b in E: nb[a].append(b); nb[b].append(a)\nLm = np.zeros((n, n))\nfor a, b in E: Lm[a, b] -= 1; Lm[b, a] -= 1; Lm[a, a] += 1; Lm[b, b] += 1      # uniform weights (cotan weights in 3D)\nfixed = [idx(0, j) for j in range(ny)]; handle = [idx(nx - 1, j) for j in range(ny)]\nang = np.radians(90); Rh = np.array([[np.cos(ang), -np.sin(ang)], [np.sin(ang), np.cos(ang)]])\ntarget = {**{k: V0[k] for k in fixed}, **{k: (V0[k] - [4, 0]) @ Rh.T + [2.5, 2.5] for k in handle}}   # bend the end up by 90 degrees\nC = np.array(list(target)); free = np.setdiff1d(np.arange(n), C)\ndef solve(rhs):\n    V = np.zeros((n, 2)); V[C] = [target[k] for k in C]\n    V[free] = np.linalg.solve(Lm[np.ix_(free, free)], rhs[free] - Lm[np.ix_(free, C)] @ V[C]); return V\ndef rigidity(V):                                                                # mean relative edge-length change\n    return np.mean(np.abs(np.linalg.norm(V[E[:, 0]] - V[E[:, 1]], axis=1) / np.linalg.norm(V0[E[:, 0]] - V0[E[:, 1]], axis=1) - 1))\nVn = solve(Lm @ V0); print('naive Laplacian editing (keeps original differential coordinates): edge-length distortion %.3f' % rigidity(Vn))\nV = Vn.copy()\nfor it in range(1, 31):\n    R = []\n    for i in range(n):                                                          # local step: best rotation per one-ring (orthogonal Procrustes)\n        P = (V0[nb[i]] - V0[i]).T; Q = (V[nb[i]] - V[i]).T; U, _, Wt = np.linalg.svd(Q @ P.T); D = np.diag([1, np.sign(np.linalg.det(U @ Wt))]); R.append(U @ D @ Wt)\n    b = np.zeros((n, 2))\n    for a, c in E: e = 0.5 * (R[a] + R[c]) @ (V0[a] - V0[c]); b[a] += e; b[c] -= e   # global step: Poisson solve with rotated edges\n    V = solve(b)\n    if it in (1, 5, 30): print('ARAP iteration %2d: edge-length distortion %.4f, energy %.4f' % (it, rigidity(V), sum(np.sum(((V[a] - V[c]) - R[a] @ (V0[a] - V0[c])) ** 2) for a, c in E)))\ncr2 = lambda a, b: a[0] * b[1] - a[1] * b[0]                                  # 2D cross product (z component)\narea = lambda V: sum(0.5 * abs(cr2(V[idx(i + 1, j)] - V[idx(i, j)], V[idx(i + 1, j + 1)] - V[idx(i, j)])) + 0.5 * abs(cr2(V[idx(i + 1, j + 1)] - V[idx(i, j)], V[idx(i, j + 1)] - V[idx(i, j)])) for i in range(nx - 1) for j in range(ny - 1))\nprint('bar area: rest %.3f  naive %.3f  ARAP %.3f' % (area(V0), area(Vn), area(V)))", "out": "naive Laplacian editing (keeps original differential coordinates): edge-length distortion 0.206\nARAP iteration  1: edge-length distortion 0.1661, energy 1.7650\nARAP iteration  5: edge-length distortion 0.1087, energy 0.4866\nARAP iteration 30: edge-length distortion 0.0604, energy 0.1532\nbar area: rest 3.200  naive 0.955  ARAP 2.938"}, "k_complete": {"lang": "py", "file": "k_complete.py", "src": "# k_complete.py: shape completion by latent optimisation: fit a learned shape space to a partial scan, then decode the full shape.\nimport numpy as np, shapes, m3d\nrng = np.random.default_rng(0); G = 16; P = m3d.grid(G, -1.1, 1.1).reshape(-1, 3)\ndef rot(a): return np.array([[np.cos(a), -np.sin(a), 0], [np.sin(a), np.cos(a), 0], [0, 0, 1]])\nX = np.array([np.clip(shapes.sdf(shapes.CLASSES[k % 5], P @ rot(rng.uniform(0, 2 * np.pi)), rng.uniform(0.7, 1.0)), -0.3, 0.3) for k in range(400)])\nmu = X.mean(0); _, Sv, Vt = np.linalg.svd(X - mu, full_matrices=False); B = Vt[:24]; lam = 1 / (Sv[:24] ** 2 / len(X))     # shape space + Gaussian prior\ndef trilerp_w(q):                                         # trilinear interpolation weights so the decoded SDF can be read at any point (linear in z)\n    u = (q + 1.1) / 2.2 * (G - 1); i = np.clip(np.floor(u).astype(int), 0, G - 2); f = u - i; W = np.zeros((len(q), G ** 3))\n    for dx in (0, 1):\n        for dy in (0, 1):\n            for dz in (0, 1):\n                w = (f[:, 0] if dx else 1 - f[:, 0]) * (f[:, 1] if dy else 1 - f[:, 1]) * (f[:, 2] if dz else 1 - f[:, 2])\n                np.add.at(W, (np.arange(len(q)), ((i[:, 0] + dx) * G + i[:, 1] + dy) * G + i[:, 2] + dz), w)\n    return W\nres = {}\nfor c in shapes.CLASSES:\n    a = rng.uniform(0, 2 * np.pi); s = rng.uniform(0.7, 1.0); scan = shapes.sample(c, 600, rng, s=s, rot=False) @ rot(a).T\n    part = scan[scan[:, 0] > 0.1]                         # the scanner only saw one side (x > 0.1)\n    free = rng.uniform(-1.1, 1.1, (400, 3)); free = free[(free[:, 0] > 0.1) & (shapes.sdf(c, free @ rot(a), s) > 0.05)]   # seen-empty space on that side\n    Wp, Wf = trilerp_w(part), trilerp_w(free)\n    A = np.vstack([Wp @ B.T, Wf @ B.T]); y = np.concatenate([-(Wp @ mu), 0.15 - Wf @ mu])        # surface points: SDF 0; free space: positive\n    for reg in (1e-3,):\n        z = np.linalg.solve(A.T @ A + reg * np.diag(lam), A.T @ y)                                   # MAP latent (ridge with the PCA prior)\n    rec = mu + z @ B; gt = shapes.sdf(c, P @ rot(a), s)\n    hidden = P[:, 0] < -0.1; iou = lambda m: ((rec < 0) & (gt < 0) & m).sum() / (((rec < 0) | (gt < 0)) & m).sum()\n    res[c] = (len(part), iou(np.ones(len(P), bool)), iou(hidden))\nfor c, (n, a1, a2) in res.items(): print('%-8s partial scan %3d pts -> completed IoU %.3f overall, %.3f on the unseen half' % (c, n, a1, a2))\nprint('mean unseen-half IoU %.3f; mirroring the visible half would assume symmetry, the learned prior learns it from data' % np.mean([v[2] for v in res.values()]))", "out": "sphere   partial scan 241 pts -> completed IoU 0.920 overall, 0.930 on the unseen half\nbox      partial scan 277 pts -> completed IoU 0.746 overall, 0.762 on the unseen half\ncylinder partial scan 237 pts -> completed IoU 0.887 overall, 0.840 on the unseen half\ntorus    partial scan 263 pts -> completed IoU 0.800 overall, 0.800 on the unseen half\ncone     partial scan 224 pts -> completed IoU 0.667 overall, 0.519 on the unseen half\nmean unseen-half IoU 0.770; mirroring the visible half would assume symmetry, the learned prior learns it from data"}, "k_motion": {"lang": "py", "file": "k_motion.py", "src": "# k_motion.py: animation & motion: analytic two-bone IK, and a learned autoregressive motion model (rollout drift, foot skating).\nimport numpy as np, ag\ndef ik2(target, l1=1.0, l2=1.0):\n    d = np.clip(np.linalg.norm(target), 1e-9, l1 + l2 - 1e-9); cos_k = (l1 ** 2 + l2 ** 2 - d ** 2) / (2 * l1 * l2)\n    knee = np.pi - np.arccos(np.clip(cos_k, -1, 1)); hip = np.arctan2(target[1], target[0]) - np.arctan2(l2 * np.sin(knee), l1 + l2 * np.cos(knee))\n    return hip, knee\ndef fk(h, k, l1=1.0, l2=1.0): j = l1 * np.array([np.cos(h), np.sin(h)]); return j + l2 * np.array([np.cos(h + k), np.sin(h + k)])\nerrs = [np.linalg.norm(fk(*ik2(t)) - t) for t in np.random.default_rng(0).uniform(-1.4, 1.4, (200, 2))]\nprint('two-bone IK: max |FK(IK(target)) - target| over 200 reachable targets = %.2e' % max(errs))\n# a walking cycle of 2 legs (hip, knee angles) at 30 fps; foot on the ground for the stance half\nt = np.arange(0, 20, 1 / 30); ph = 2 * np.pi * 1.0 * t\ndef gait(ph): return np.stack([0.4 * np.sin(ph), 0.6 * np.clip(np.sin(ph + 1.2), 0, None), 0.4 * np.sin(ph + np.pi), 0.6 * np.clip(np.sin(ph + np.pi + 1.2), 0, None)], -1)\nY = gait(ph) + 0.01 * np.random.default_rng(1).standard_normal((len(t), 4)); K = 4\nX = np.stack([Y[i - K:i].ravel() for i in range(K, len(Y))]); T = Y[K:] - Y[K - 1:-1]               # predict the velocity from the last 4 poses\ndef train(noise):\n    rng = np.random.default_rng(0); P = [ag.param(rng, 4 * K, 64), ag.T(np.zeros(64)), ag.param(rng, 64, 4)]; opt = ag.Adam(P, 2e-3)\n    for it in range(3000):\n        i = rng.integers(0, len(X), 128); xin = X[i] + noise * rng.standard_normal(X[i].shape)          # noise injection: train on imperfect histories\n        tgt = Y[K:][i] - xin[:, -4:]                                                                      # ... and learn to steer back to the data\n        L = (((ag.T(xin) @ P[0] + P[1]).tanh() @ P[2] - ag.T(tgt)) ** 2).mean(); L.backward(); opt.step()\n    return P, L.data\ndef rollout(P, n):\n    seq = list(Y[:K])\n    for _ in range(n): x = np.array(seq[-K:]).ravel()[None]; seq.append(seq[-1] + ((ag.T(x) @ P[0] + P[1]).tanh() @ P[2]).data[0])\n    return np.array(seq)\nfor noise in (0.0, 0.05):\n    P, Lf = train(noise); R = rollout(P, len(Y) - K)\n    print('training-history noise %.2f: one-step MSE %.2e' % (noise, Lf))\n    for sec in (1, 5, 19): k = int(sec * 30); print('   rollout after %2d s: mean |angle error| %.3f rad; hip amplitude %.3f (data 0.400)' % (sec, np.abs(R[k] - gait(ph[k])).mean(), R[k - 30:k, 0].std() * np.sqrt(2)))\ndef foot(q): return np.array([fk(-np.pi / 2 + a, -b) for a, b in q])\nfp = foot(gait(ph)[:, :2]); stance = np.cos(ph) < 0\nprint('foot skating check on the data gait (fixed hip): foot x-speed in stance %.2f m/s -> the root must move at that speed or the foot slides' % np.abs(np.diff(fp[:, 0]) * 30)[stance[1:]].mean())", "out": "two-bone IK: max |FK(IK(target)) - target| over 200 reachable targets = 7.11e-16\ntraining-history noise 0.00: one-step MSE 2.10e-04\n   rollout after  1 s: mean |angle error| 0.031 rad; hip amplitude 0.387 (data 0.400)\n   rollout after  5 s: mean |angle error| 0.056 rad; hip amplitude 0.265 (data 0.400)\n   rollout after 19 s: mean |angle error| 0.224 rad; hip amplitude 0.188 (data 0.400)\ntraining-history noise 0.05: one-step MSE 5.50e-04\n   rollout after  1 s: mean |angle error| 0.017 rad; hip amplitude 0.385 (data 0.400)\n   rollout after  5 s: mean |angle error| 0.079 rad; hip amplitude 0.373 (data 0.400)\n   rollout after 19 s: mean |angle error| 0.302 rad; hip amplitude 0.378 (data 0.400)\nfoot skating check on the data gait (fixed hip): foot x-speed in stance 3.37 m/s -> the root must move at that speed or the foot slides"}, "k_partseg": {"lang": "py", "file": "k_partseg.py", "src": "# k_partseg.py: per-point part segmentation with a PointNet segmentation head (local feature + global feature -> per-point label).\nimport numpy as np, ag, shapes\nrng = np.random.default_rng(0); N = 256\nPARTS = ['cap/base', 'side', 'body']           # cylinder & cone: flat caps vs side; sphere/torus/box: one body label\ndef labelled(c, rng):\n    s = rng.uniform(0.7, 1.0); P = shapes.sample(c, N, rng, s=s, rot=False)\n    if c in ('cylinder', 'cone'): y = np.where(np.abs(np.abs(P[:, 2]) - 0.8 * s) < 0.02 * s, 0, 1)\n    else: y = np.full(N, 2)\n    a = rng.uniform(0, 2 * np.pi); R = np.array([[np.cos(a), -np.sin(a), 0], [np.sin(a), np.cos(a), 0], [0, 0, 1]]); return P @ R.T + 0.005 * rng.standard_normal(P.shape), y\ntr = [labelled(shapes.CLASSES[k % 5], rng) for k in range(300)]; te = [labelled(shapes.CLASSES[k % 5], np.random.default_rng(50 + k)) for k in range(50)]\nX, Y = np.array([t[0] for t in tr]), np.array([t[1] for t in tr]); Xt, Yt = np.array([t[0] for t in te]), np.array([t[1] for t in te])\nprint('label balance (train):', {PARTS[k]: round(float((Y == k).mean()), 3) for k in range(3)})\np = ag.param; L1, l1, L2, l2 = p(rng, 3, 64), ag.T(np.zeros(64)), p(rng, 64, 128), ag.T(np.zeros(128))\nS1, s1, S2 = p(rng, 64 + 128, 128), ag.T(np.zeros(128)), p(rng, 128, 3); params = [L1, l1, L2, l2, S1, s1, S2]\ndef seg(x):\n    B = x.shape[0]; h1 = (ag.T(x) @ L1 + l1).relu(); h2 = (h1 @ L2 + l2).relu(); g = h2.max(1).reshape(B, 1, 128) * ag.T(np.ones((1, N, 1)))\n    return (ag.cat([h1, g], -1) @ S1 + s1).relu() @ S2                         # each point: its own feature + the shape's global feature\nopt = ag.Adam(params, 2e-3)\nfor it in range(1, 1501):\n    i = rng.integers(0, len(X), 16); lg = seg(X[i]); L = ag.cross_entropy(lg.reshape(-1, 3), Y[i].ravel()); L.backward(); opt.step()\n    if it in (1, 500, 1500): print('iter %4d  loss %.4f' % (it, L.data))\npr = seg(Xt).data.argmax(-1)\nious = {}\nfor k in range(3): ious[PARTS[k]] = round(float(((pr == k) & (Yt == k)).sum() / ((pr == k) | (Yt == k)).sum()), 3)\nprint('test point accuracy %.3f; per-part IoU %s; mIoU %.3f' % ((pr == Yt).mean(), ious, np.mean(list(ious.values()))))\n# ablation: drop the global feature -> a point cannot know whether it is on a cylinder or a sphere\ndef seg_local(x): h1 = (ag.T(x) @ L1 + l1).relu(); return (ag.cat([h1, ag.T(np.zeros((x.shape[0], N, 128)))], -1) @ S1 + s1).relu() @ S2\nprint('same network with the global feature zeroed: accuracy %.3f' % (seg_local(Xt).data.argmax(-1) == Yt).mean())", "out": "label balance (train): {'cap/base': 0.11, 'side': 0.29, 'body': 0.6}\niter    1  loss 1.1254\niter  500  loss 0.0265\niter 1500  loss 0.0104\ntest point accuracy 0.996; per-part IoU {'cap/base': 0.964, 'side': 0.986, 'body': 1.0}; mIoU 0.983\nsame network with the global feature zeroed: accuracy 0.263"}, "k_rig": {"lang": "py", "file": "k_rig.py", "src": "# k_rig.py: automatic rigging: skinning weights for a 2-bone arm, rigid (nearest bone) vs smooth (heat-diffusion) weights, under LBS.\nimport numpy as np\nnu, nr = 60, 16; z = np.linspace(0, 2, nu); a = np.linspace(0, 2 * np.pi, nr, endpoint=False)\nV = np.array([[0.2 * np.cos(t), 0.2 * np.sin(t), zz] for zz in z for t in a])                  # a tube from z=0 to 2, elbow at z=1\nF = []\nfor i in range(nu - 1):\n    for j in range(nr):\n        p, q, r, s = i * nr + j, i * nr + (j + 1) % nr, (i + 1) * nr + j, (i + 1) * nr + (j + 1) % nr; F += [(p, q, s), (p, s, r)]\nF = np.array(F); n = len(V)\nE = np.unique(np.sort(np.concatenate([F[:, [0, 1]], F[:, [1, 2]], F[:, [2, 0]]]), 1), axis=0)\nA = np.zeros((n, n)); A[E[:, 0], E[:, 1]] = A[E[:, 1], E[:, 0]] = 1; L = np.diag(A.sum(1)) - A\ndef bone_dist(p, a, b): t = np.clip(((p - a) @ (b - a)) / ((b - a) @ (b - a)), 0, 1); return np.linalg.norm(p - (a + t[:, None] * (b - a)), axis=1)\nbones = [(np.zeros(3), np.array([0, 0, 1.0])), (np.array([0, 0, 1.0]), np.array([0, 0, 2.0]))]\nD = np.stack([bone_dist(V, *b) for b in bones], 1); near = D.argmin(1); Wrig = np.eye(2)[near]\n# heat diffusion (Pinocchio, Baran & Popovic 2007): (L + H) w_j = H p_j, H = 1/d^2 on the nearest bone\nHd = np.diag(np.where(near[:, None] == np.arange(2), 1 / np.maximum(D, 1e-3) ** 2, 0).sum(1) * 0.02)\nWheat = np.stack([np.linalg.solve(L + Hd, Hd @ (near == j).astype(float)) for j in range(2)], 1); Wheat /= Wheat.sum(1, keepdims=True)\nprint('heat weights: rows sum to 1 (%.3f..%.3f); at the elbow ring w_upper = %.3f; 0.3 below it %.3f; 0.3 above %.3f' % (Wheat.sum(1).min(), Wheat.sum(1).max(), Wheat[np.argmin(np.abs(V[:, 2] - 1.0)), 0], Wheat[np.argmin(np.abs(V[:, 2] - 0.7)), 0], Wheat[np.argmin(np.abs(V[:, 2] - 1.3)), 0]))\ndef pose(W, deg):\n    t = np.radians(deg); R = np.array([[1, 0, 0], [0, np.cos(t), -np.sin(t)], [0, np.sin(t), np.cos(t)]]); c = np.array([0, 0, 1.0])\n    P1 = V; P2 = (V - c) @ R.T + c; return W[:, :1] * P1 + W[:, 1:] * P2\ndef stats(P):\n    e0 = np.linalg.norm(V[E[:, 0]] - V[E[:, 1]], axis=1); e1 = np.linalg.norm(P[E[:, 0]] - P[E[:, 1]], axis=1); r = e1 / e0\n    return r.max(), r.min()\nfor deg in (45, 90):\n    for name, W in [('rigid (nearest bone)', Wrig), ('heat diffusion', Wheat)]:\n        mx, mn = stats(pose(W, deg)); print('bend %2d deg, %-21s: max edge stretch %.2fx, min %.2fx' % (deg, name, mx, mn))\nprint('rigid weights tear/stretch one edge ring; smooth weights spread the stretch over several rings, but the inside of the bend collapses (min 0.07x) - the LBS volume loss that DQS or corrective shapes fix (see c_skin).')", "out": "heat weights: rows sum to 1 (1.000..1.000); at the elbow ring w_upper = 0.621; 0.3 below it 0.993; 0.3 above 0.007\nbend 45 deg, rigid (nearest bone) : max edge stretch 5.44x, min 0.80x\nbend 45 deg, heat diffusion       : max edge stretch 2.02x, min 0.09x\nbend 90 deg, rigid (nearest bone) : max edge stretch 9.05x, min 0.71x\nbend 90 deg, heat diffusion       : max edge stretch 2.73x, min 0.07x\nrigid weights tear/stretch one edge ring; smooth weights spread the stretch over several rings, but the inside of the bend collapses (min 0.07x) - the LBS volume loss that DQS or corrective shapes fix (see c_skin)."}, "k_svbrdf": {"lang": "py", "file": "k_svbrdf.py", "src": "# k_svbrdf.py: material estimation: recover albedo, roughness and specular from photos under known lights by fitting a GGX + Lambert model with autograd.\nimport numpy as np, ag\nrng = np.random.default_rng(0); Ksamp = 60\ndef dirs(n, up_min=0.15):\n    v = rng.standard_normal((n, 3)); v /= np.linalg.norm(v, axis=1, keepdims=True); v[:, 2] = np.abs(v[:, 2]); return v[v[:, 2] > up_min]\nLs, Vs = dirs(Ksamp), dirs(Ksamp); m = min(len(Ls), len(Vs)); Ls, Vs = Ls[:m], Vs[:m]; Hs = (Ls + Vs) / np.linalg.norm(Ls + Vs, axis=1, keepdims=True)\nnl, nv, nh, vh = Ls[:, 2], Vs[:, 2], Hs[:, 2], (Vs * Hs).sum(1)\ndef brdf_np(kd, a, f0):\n    a2 = a ** 4; D = a2 / (np.pi * (nh ** 2 * (a2 - 1) + 1) ** 2); k = (a ** 2) / 2; G = nl / (nl * (1 - k) + k) * nv / (nv * (1 - k) + k)\n    F = f0 + (1 - f0) * (1 - vh) ** 5; return (kd / np.pi + D * G * F / (4 * nl * nv)) * nl\ndef brdf_ag(kd, a, f0):\n    a2 = a ** 4; D = a2 * ((((a2 - 1) * ag.T(nh ** 2) + 1) ** 2) * np.pi) ** -1; k = a * a * 0.5\n    G = ag.T(nl) * ((k * -1 + 1) * ag.T(nl) + k) ** -1 * ag.T(nv) * ((k * -1 + 1) * ag.T(nv) + k) ** -1\n    F = f0 + (f0 * -1 + 1) * ag.T((1 - vh) ** 5); return (kd * (1 / np.pi) + D * G * F * ag.T(1 / (4 * nl * nv))) * ag.T(nl)\ntrue = (0.6, 0.35, 0.04); obs = brdf_np(*true) * (1 + 0.02 * rng.standard_normal(m))\nprint('%d light/view pairs observed (one material texel, 2%% noise)' % m)\nraw = [ag.T(np.array(0.0)), ag.T(np.array(0.0)), ag.T(np.array(-2.0))]                 # unconstrained -> sigmoid keeps every parameter in (0, 1)\nparams = lambda: [raw[0].sigmoid(), raw[1].sigmoid() * 0.95 + 0.05, raw[2].sigmoid()]\nprint('gradcheck of the GGX model: %.2e' % ag.gradcheck(lambda: ((brdf_ag(*params()) - ag.T(obs)) ** 2).mean(), raw))\ndef fit(mask):\n    raw = [ag.T(np.array(0.0)), ag.T(np.array(0.0)), ag.T(np.array(-2.0))]; opt = ag.Adam(raw, 0.05)\n    pr = lambda: [raw[0].sigmoid(), raw[1].sigmoid() * 0.95 + 0.05, raw[2].sigmoid()]\n    for it in range(1500):\n        L = (((brdf_ag(*pr()) - ag.T(obs)) ** 2) * ag.T(mask.astype(float))).sum() * (1 / mask.sum()); L.backward(); opt.step()\n    return [float(q.data) for q in pr()], np.sqrt(L.data)\n(kd, a, f0), rm = fit(np.ones(m, bool))\nprint('all pairs: albedo %.3f (true %.2f), roughness %.3f (true %.2f), F0 %.3f (true %.2f); fit RMSE %.4f' % (kd, true[0], a, true[1], f0, true[2], rm))\noff = nh < 0.9; (kd, a, f0), rm = fit(off)\nprint('only the %d pairs away from the highlight (n.h < 0.9): albedo %.3f, roughness %.3f, F0 %.3f; RMSE %.4f -> albedo is fine, specular is poorly constrained' % (off.sum(), kd, a, f0, rm))\nprint('lesson: capture must sample highlights (many lights or a flash at several angles), or a learned prior must fill in specular.')", "out": "50 light/view pairs observed (one material texel, 2% noise)\ngradcheck of the GGX model: 3.48e-10\nall pairs: albedo 0.598 (true 0.60), roughness 0.374 (true 0.35), F0 0.044 (true 0.04); fit RMSE 0.0024\nonly the 45 pairs away from the highlight (n.h < 0.9): albedo 0.595, roughness 0.358, F0 0.097; RMSE 0.0020 -> albedo is fine, specular is poorly constrained\nlesson: capture must sample highlights (many lights or a flash at several angles), or a learned prior must fill in specular."}, "k_texture": {"lang": "py", "file": "k_texture.py", "src": "# k_texture.py: texturing by multi-view projection: back-project photos into a UV texture with visibility and view-angle weights.\nimport numpy as np\nW, H, S = 64, 32, 96\nu, v = np.meshgrid((np.arange(W) + 0.5) / W, (np.arange(H) + 0.5) / H); ph, th = u * 2 * np.pi, v * np.pi       # equirectangular UVs on a unit sphere\nX = np.stack([np.sin(th) * np.cos(ph), np.cos(th), np.sin(th) * np.sin(ph)], -1)                                   # texel -> 3D point (= normal)\ndef albedo(p): return np.stack([0.5 + 0.5 * np.sign(np.sin(6 * np.arctan2(p[..., 2], p[..., 0]))), 0.5 + 0.4 * p[..., 1], 0.3 + 0 * p[..., 0]], -1)  # stripes\nGT = albedo(X)\ndef camera(yaw, pitch):\n    d = np.array([np.cos(pitch) * np.sin(yaw), np.sin(pitch), np.cos(pitch) * np.cos(yaw)])          # camera looks along -d\n    r = np.cross([0, 1, 0], d); r /= np.linalg.norm(r); up = np.cross(d, r); return d, r, up\ndef photo(cam):                                         # orthographic photo of the textured sphere (ray-traced)\n    d, r, up = cam; g = (np.arange(S) + 0.5) / S * 2.4 - 1.2; a, b = np.meshgrid(g, -g); rr = a ** 2 + b ** 2; hit = rr < 1\n    p = a[..., None] * r + b[..., None] * up + np.sqrt(np.clip(1 - rr, 0, 1))[..., None] * d; img = albedo(p); img[~hit] = 0; return img\ncams = [camera(y, p) for y, p in [(0, 0), (np.pi / 2, 0), (np.pi, 0), (3 * np.pi / 2, 0), (0, 1.3), (0, -1.3)]]\nphotos = [photo(c) for c in cams]\ndef bake(use_visibility, power):\n    acc = np.zeros_like(GT); wsum = np.zeros(GT.shape[:2])\n    for (d, r, up), img in zip(cams, photos):\n        cosv = X @ d; px = ((X @ r + 1.2) / 2.4 * S).astype(int).clip(0, S - 1); py = ((1.2 - X @ up) / 2.4 * S).astype(int).clip(0, S - 1)\n        w = np.clip(cosv, 0, 1) ** power if use_visibility else np.ones_like(cosv)\n        acc += w[..., None] * img[py, px]; wsum += w\n    return acc / np.maximum(wsum, 1e-9)[..., None], wsum > 0\nfor vis, pw, name in [(False, 0, 'no visibility (average every view)'), (True, 1, 'visibility, weight cos'), (True, 4, 'visibility, weight cos^4 (prefer head-on)')]:\n    T, cov = bake(vis, pw); print('%-42s texel coverage %.1f%%  mean |error| %.4f' % (name, 100 * cov.mean(), np.abs(T - GT)[cov].mean()))\nT, cov = bake(True, 4); print('u-seam: baked columns 0 vs %d differ by %.4f, ground truth by %.4f (a stripe edge sits on the seam, so the bake is faithful)' % (W - 1, np.abs(T[:, 0] - T[:, -1]).mean(), np.abs(GT[:, 0] - GT[:, -1]).mean()))\nprint('equirect stretch: a texel in the pole row covers %.3fx the surface of an equator texel (wasted resolution -> use an atlas)' % (np.sin(th[0, 0]) / np.sin(th[H // 2, 0])))", "out": "no visibility (average every view)         texel coverage 100.0%  mean |error| 0.1725\nvisibility, weight cos                     texel coverage 100.0%  mean |error| 0.0148\nvisibility, weight cos^4 (prefer head-on)  texel coverage 100.0%  mean |error| 0.0099\nu-seam: baked columns 0 vs 63 differ by 0.2917, ground truth by 0.3333 (a stripe edge sits on the seam, so the bake is faithful)\nequirect stretch: a texel in the pole row covers 0.049x the surface of an equator texel (wasted resolution -> use an atlas)"}, "l_chamfer": {"lang": "py", "file": "l_chamfer.py", "src": "# l_chamfer.py: Chamfer distance, EMD and F-score: definitions, a k-d-tree reference check, and how each reacts to outliers and density.\nimport numpy as np, m3d, shapes\nfrom scipy.spatial import cKDTree\nfrom scipy.optimize import linear_sum_assignment\nrng = np.random.default_rng(0)\nA = shapes.sample('sphere', 1000, rng, s=1.0, rot=False); B = shapes.sample('sphere', 1000, rng, s=1.0, rot=False)\nref = (cKDTree(B).query(A)[0] ** 2).mean() + (cKDTree(A).query(B)[0] ** 2).mean()\nprint('Chamfer (m3d, brute force) %.6f   vs k-d tree reference %.6f   |diff| %.1e' % (m3d.chamfer(A, B), ref, abs(m3d.chamfer(A, B) - ref)))\ndef emd(P, Q): D = np.linalg.norm(P[:, None] - Q[None], axis=-1); r, c = linear_sum_assignment(D); return D[r, c].mean()\ndef fscore(P, Q, tau): dp = cKDTree(Q).query(P)[0]; dq = cKDTree(P).query(Q)[0]; pr, rc = (dp < tau).mean(), (dq < tau).mean(); return 2 * pr * rc / max(pr + rc, 1e-12), pr, rc\ndef report(name, P):\n    f, pr, rc = fscore(P, A, 0.1); print('%-38s Chamfer %.5f  EMD %.4f  F@0.1 %.3f (precision %.3f recall %.3f)' % (name, m3d.chamfer(P, A), emd(P[:1000], A), f, pr, rc))\nreport('another sample of the same sphere', B)\nPout = B.copy(); Pout[:20] = rng.uniform(-3, 3, (20, 3)); report('same, with 2% far outliers', Pout)\nhalf = B[B[:, 2] > 0]; half = np.concatenate([half, half])[:1000]; report('only the top half (duplicated to 1000)', half)\ndense = np.concatenate([B[B[:, 0] > 0.5]] * 8)[:1000]; dense = np.concatenate([dense, B[:1000 - len(dense)]]) if len(dense) < 1000 else dense; report('points clumped on one cap', dense)\nreport('sphere shrunk to radius 0.65', B * 0.65 / 0.8)\nprint('notes: Chamfer squares distances, so a few outliers dominate; F-score is bounded and tells precision vs recall; EMD needs equal sizes and is O(n^3).')", "out": "Chamfer (m3d, brute force) 0.005220   vs k-d tree reference 0.005220   |diff| 0.0e+00\nanother sample of the same sphere      Chamfer 0.00522  EMD 0.0822  F@0.1 0.977 (precision 0.978 recall 0.977)\nsame, with 2% far outliers             Chamfer 0.11354  EMD 0.1268  F@0.1 0.966 (precision 0.958 recall 0.975)\nonly the top half (duplicated to 1000) Chamfer 0.13642  EMD 0.3906  F@0.1 0.717 (precision 0.983 recall 0.564)\npoints clumped on one cap              Chamfer 0.51104  EMD 0.6866  F@0.1 0.346 (precision 0.965 recall 0.211)\nsphere shrunk to radius 0.65           Chamfer 0.04924  EMD 0.1714  F@0.1 0.000 (precision 0.000 recall 0.000)\nnotes: Chamfer squares distances, so a few outliers dominate; F-score is bounded and tells precision vs recall; EMD needs equal sizes and is O(n^3)."}, "l_clip": {"lang": "py", "file": "l_clip.py", "src": "# l_clip.py: a CLIP-style text<->shape embedding trained with InfoNCE, then used as a metric: CLIP score and R-precision.\nimport numpy as np, ag, shapes\nrng = np.random.default_rng(0); N = 128\nNAMES = {'sphere': ['ball', 'sphere', 'orb'], 'box': ['box', 'cube', 'crate'], 'cylinder': ['cylinder', 'tube', 'can'], 'torus': ['ring', 'donut', 'torus'], 'cone': ['cone', 'spike', 'funnel']}\nSIZES = {0: ['small', 'little', 'tiny'], 1: ['large', 'big', 'huge']}\nVOCAB = sorted({w for v in NAMES.values() for w in v} | {w for v in SIZES.values() for w in v} | {'a', 'an', 'shape', 'of'})\ndef feat(P):\n    i, j = rng.integers(0, len(P), (2, 1500)); d = np.linalg.norm(P[i] - P[j], axis=1); r = np.linalg.norm(P, axis=1)\n    return np.concatenate([np.histogram(d, 16, (0, 2.2))[0] / 1500, np.histogram(r, 8, (0, 1.2))[0] / len(P), [np.abs(P[:, 2]).mean(), np.linalg.norm(P[:, :2], axis=1).mean()]])\ndef item(g):\n    c = shapes.CLASSES[g.integers(5)]; big = int(g.integers(2)); P = shapes.sample(c, N, g, s=(0.95 if big else 0.6))\n    words = ['a', g.choice(SIZES[big]), g.choice(NAMES[c])] + (['shape'] if g.random() < 0.3 else []); return feat(P), [VOCAB.index(w) for w in words], (c, big)\ntr = [item(rng) for _ in range(1500)]; te = [item(np.random.default_rng(7 + k)) for k in range(200)]\np = ag.param; Et = p(rng, len(VOCAB), 32, scale=0.5); S1, s1, S2 = p(rng, 26, 64), ag.T(np.zeros(64)), p(rng, 64, 32); params = [Et, S1, s1, S2]\nmu_f = np.array([t[0] for t in tr]).mean(0); sd_f = np.array([t[0] for t in tr]).std(0) + 1e-6\ndef enc_text(toks): M = np.zeros((len(toks), len(VOCAB))); [M.__setitem__((i, t), M[i, t] + 1 / len(tk)) for i, tk in enumerate(toks) for t in tk]; e = ag.T(M) @ Et; return e * (((e * e).sum(1, keepdims=True)) ** -0.5)\ndef enc_shape(F): e = ((ag.T((F - mu_f) / sd_f) @ S1 + s1).gelu()) @ S2; return e * (((e * e).sum(1, keepdims=True)) ** -0.5)\nopt = ag.Adam(params, 3e-3); tau = 0.1\nfor it in range(1, 1501):\n    i = rng.integers(0, len(tr), 64); t = enc_text([tr[k][1] for k in i]); s = enc_shape(np.array([tr[k][0] for k in i]))\n    lg = (t @ s.Tt) * (1 / tau); y = np.arange(64); L = (ag.cross_entropy(lg, y) + ag.cross_entropy(lg.Tt, y)) * 0.5; L.backward(); opt.step()   # symmetric InfoNCE\n    if it in (1, 500, 1500): print('iter %4d InfoNCE loss %.3f (chance %.3f; the floor stays above 0 because a batch of 64 holds many captions with the same class and size)' % (it, L.data, np.log(64)))\nT = enc_text([x[1] for x in te]).data; Sh = enc_shape(np.array([x[0] for x in te])).data; Sim = T @ Sh.T\nlabels = [x[2] for x in te]; same = np.array([[a == b for b in labels] for a in labels])\nprint('text->shape R-precision@1 (a retrieved shape counts if its class and size match): %.3f; random %.3f' % (np.mean([same[i, Sim[i].argmax()] for i in range(len(te))]), same.mean()))\nprint('CLIP score (cosine) matched pairs %.3f vs mismatched-class pairs %.3f' % (np.diag(Sim).mean(), Sim[~same].mean()))\nq = enc_text([[VOCAB.index(w) for w in ['a', 'big', 'donut']]]).data[0]; best = labels[np.argmax(Sh @ q)]; print('query \"a big donut\" -> top shape is a %s %s' % ('large' if best[1] else 'small', best[0]))", "out": "iter    1 InfoNCE loss 4.431 (chance 4.159; the floor stays above 0 because a batch of 64 holds many captions with the same class and size)\niter  500 InfoNCE loss 1.862 (chance 4.159; the floor stays above 0 because a batch of 64 holds many captions with the same class and size)\niter 1500 InfoNCE loss 1.807 (chance 4.159; the floor stays above 0 because a batch of 64 holds many captions with the same class and size)\ntext->shape R-precision@1 (a retrieved shape counts if its class and size match): 1.000; random 0.105\nCLIP score (cosine) matched pairs 0.756 vs mismatched-class pairs -0.083\nquery \"a big donut\" -> top shape is a large torus"}, "l_data": {"lang": "py", "file": "l_data.py", "src": "# l_data.py: data pipelines for 3D: normalisation, pose-invariant deduplication hashes, leakage between splits, licence filtering, render-job costs.\nimport numpy as np, hashlib, m3d\nrng = np.random.default_rng(0)\ndef normalise(V): c = (V.max(0) + V.min(0)) / 2; V = V - c; return V / np.abs(V).max()              # centre the bbox, scale to [-1, 1]\ndef rand_rot():\n    q = rng.standard_normal(4); q /= np.linalg.norm(q); w, x, y, z = q\n    return np.array([[1 - 2 * (y * y + z * z), 2 * (x * y - z * w), 2 * (x * z + y * w)], [2 * (x * y + z * w), 1 - 2 * (x * x + z * z), 2 * (y * z - x * w)], [2 * (x * z - y * w), 2 * (y * z + x * w), 1 - 2 * (x * x + y * y)]])\ndef exact_hash(V, F): return hashlib.sha256(np.round(V, 6).tobytes() + F.tobytes()).hexdigest()[:12]\ndef shape_hash(V, F, bits=8):\n    \"\"\"pose/scale/order invariant: sorted pairwise-distance histogram of surface samples, quantised to a short code.\"\"\"\n    P = m3d.sample_surface(V, F, 2000, np.random.default_rng(1)); P = P - P.mean(0); P /= np.sqrt((P ** 2).sum(1).mean())\n    i, j = np.random.default_rng(2).integers(0, 2000, (2, 4000)); h = np.histogram(np.linalg.norm(P[i] - P[j], axis=1), 16, (0, 3.5))[0] / 4000\n    return np.round(h * 2 ** bits / 0.3).astype(int)\nV, F = m3d.icosphere(2); Vb = V * np.array([1.6, 1.0, 0.7])                               # an ellipsoid asset\ncopies = {'original': Vb, 'translated+scaled': Vb * 3.7 + 5, 'rotated': Vb @ rand_rot().T, 'vertex order shuffled': None, 'different shape (sphere)': V}\nperm = rng.permutation(len(Vb)); inv = np.argsort(perm); copies['vertex order shuffled'] = Vb[perm]\nFs = {k: F for k in copies}; Fs['vertex order shuffled'] = inv[F]\nh0 = shape_hash(Vb, F)\nfor k, Vk in copies.items():\n    hk = shape_hash(Vk, Fs[k]); print('%-26s exact hash %s  shape-hash L1 distance to original %3d  -> %s' % (k, exact_hash(Vk, Fs[k]), np.abs(hk - h0).sum(), 'DUPLICATE' if np.abs(hk - h0).sum() <= 8 else 'distinct'))\nprint('bbox normalisation: translated+scaled copy matches the original after normalise: max diff %.2e' % np.abs(normalise(copies['translated+scaled']) - normalise(Vb)).max())\n# leakage: if 15% of a scraped set are near-duplicates, a random split puts many \"test\" shapes in train\nn = 10000; groups = np.concatenate([np.arange(8500), rng.integers(0, 8500, 1500)]); test = rng.random(n) < 0.1\nleak = np.isin(groups[test], groups[~test]).mean(); print('random split: %.1f%% of test items have a duplicate in train; grouping by hash before splitting -> 0%%' % (100 * leak))\nlic = rng.choice(['CC-BY', 'CC0', 'CC-BY-NC', 'CC-BY-ND', 'unknown'], n, p=[0.45, 0.2, 0.15, 0.05, 0.15]); ok = np.isin(lic, ['CC-BY', 'CC0'])\nprint('licence filter (keep CC-BY and CC0 for a commercial model; CC-BY needs attribution records): keep %.1f%% of %d' % (100 * ok.mean(), n))\nviews, s_per = 24, 0.35; print('rendering %d views per object at %.2f s each: %.1f CPU-days for 10M objects -> batch and cache renders' % (views, s_per, 1e7 * views * s_per / 86400))", "out": "original                   exact hash f9cb66324670  shape-hash L1 distance to original   0  -> DUPLICATE\ntranslated+scaled          exact hash 35d96128acdc  shape-hash L1 distance to original   0  -> DUPLICATE\nrotated                    exact hash 22cc042183c1  shape-hash L1 distance to original   0  -> DUPLICATE\nvertex order shuffled      exact hash e116f9c97945  shape-hash L1 distance to original   0  -> DUPLICATE\ndifferent shape (sphere)   exact hash a7af17c01cca  shape-hash L1 distance to original 257  -> distinct\nbbox normalisation: translated+scaled copy matches the original after normalise: max diff 3.33e-16\nrandom split: 26.3% of test items have a duplicate in train; grouping by hash before splitting -> 0%\nlicence filter (keep CC-BY and CC0 for a commercial model; CC-BY needs attribution records): keep 64.3% of 10000\nrendering 24 views per object at 0.35 s each: 972.2 CPU-days for 10M objects -> batch and cache renders"}, "l_genmetrics": {"lang": "py", "file": "l_genmetrics.py", "src": "# l_genmetrics.py: judging a generator: FID and KID on shape features, plus COV, MMD and 1-NNA on Chamfer distances; what each one catches.\nimport numpy as np, shapes, m3d\nrng = np.random.default_rng(0); N = 128\ndef feat(P):                                            # D2 shape distribution (Osada 2002) + radial histogram: a fixed, pose-invariant feature\n    i, j = rng.integers(0, len(P), (2, 2000)); d = np.linalg.norm(P[i] - P[j], axis=1); r = np.linalg.norm(P, axis=1)\n    return np.concatenate([np.histogram(d, 16, (0, 2.2))[0] / 2000, np.histogram(r, 8, (0, 1.2))[0] / len(P)])\ndef make(classes, n, noise=0.0, seed=0):\n    g = np.random.default_rng(seed); return [shapes.sample(classes[k % len(classes)], N, g, noise=noise) for k in range(n)]\nref = make(shapes.CLASSES, 100, seed=1); train = make(shapes.CLASSES, 100, seed=2)\nsets = {'fresh samples, same distribution': make(shapes.CLASSES, 100, seed=3), 'noisy (sigma 0.05)': make(shapes.CLASSES, 100, 0.05, seed=4),\n        'mode dropped (sphere, box only)': make(['sphere', 'box'], 100, seed=5), 'memorised training set': train,\n        'one shape repeated (collapse)': [ref[0] + 0.0 * k for k in range(100)]}\ndef fid(X, Y):\n    m1, m2 = X.mean(0), Y.mean(0); C1, C2 = np.cov(X, rowvar=False) + 1e-6 * np.eye(X.shape[1]), np.cov(Y, rowvar=False) + 1e-6 * np.eye(X.shape[1])\n    w, U = np.linalg.eigh(C1); h = U @ np.diag(np.sqrt(np.clip(w, 0, None))) @ U.T                 # Tr sqrt(C1 C2) = Tr sqrt(C1^1/2 C2 C1^1/2), symmetric -> stable\n    return ((m1 - m2) ** 2).sum() + np.trace(C1 + C2) - 2 * np.sqrt(np.clip(np.linalg.eigvalsh(h @ C2 @ h), 0, None)).sum()\ndef kid(X, Y):                                         # unbiased MMD^2 with the cubic polynomial kernel\n    d = X.shape[1]; k = lambda A, B: (A @ B.T / d + 1) ** 3; n, m = len(X), len(Y)\n    Kx, Ky, Kxy = k(X, X), k(Y, Y), k(X, Y); return (Kx.sum() - np.trace(Kx)) / (n * (n - 1)) + (Ky.sum() - np.trace(Ky)) / (m * (m - 1)) - 2 * Kxy.mean()\ndef CD(A, B):                                          # all-pairs Chamfer between two lists of clouds, batched\n    A, B = np.array(A), np.array(B); out = np.zeros((len(A), len(B)))\n    for i, a in enumerate(A): d = ((a[None, :, None] - B[:, None]) ** 2).sum(-1); out[i] = d.min(2).mean(1) + d.min(1).mean(1)\n    return out\nprint('check: batched Chamfer %.6f vs m3d.chamfer %.6f' % (CD(ref[:1], ref[1:2])[0, 0], m3d.chamfer(ref[0], ref[1])))\nFr = np.array([feat(P) for P in ref]); Drr = CD(ref, ref); np.fill_diagonal(Drr, np.inf)\nprint('%-34s %8s %9s %6s %8s %6s' % ('generated set', 'FID', 'KID', 'COV', 'MMD-CD', '1-NNA'))\nfor name, S in sets.items():\n    Fs = np.array([feat(P) for P in S]); D = CD(S, ref)\n    cov = len(set(D.argmin(1))) / len(ref)                                 # fraction of reference shapes that are someone's nearest\n    mmd = D.min(0).mean()                                                  # for each reference shape, distance to its best match\n    Dss = CD(S, S); np.fill_diagonal(Dss, np.inf)\n    lab = np.r_[np.zeros(len(S)), np.ones(len(ref))]; Dall = np.block([[Dss, D], [D.T, Drr]])\n    nna = (lab[Dall.argmin(1)] == lab).mean()                              # leave-one-out 1-NN accuracy; 50% is ideal\n    print('%-34s %8.4f %9.5f %6.2f %8.5f %6.2f' % (name, fid(Fs, Fr), kid(Fs, Fr), cov, mmd, nna))\nprint('memorisation scores like a perfect generator on FID/COV/MMD - check nearest-training-neighbour distances too.')", "out": "check: batched Chamfer 0.060329 vs m3d.chamfer 0.060329\ngenerated set                           FID       KID    COV   MMD-CD  1-NNA\nfresh samples, same distribution     0.0024  -0.00053   0.61  0.02251   0.49\nnoisy (sigma 0.05)                   0.0197  -0.00020   0.56  0.02658   0.53\nmode dropped (sphere, box only)      0.0930   0.00549   0.32  0.05689   0.71\nmemorised training set               0.0074  -0.00032   0.64  0.02221   0.48\none shape repeated (collapse)        0.6714   0.06156   0.01  0.09419   0.99\nmemorisation scores like a perfect generator on FID/COV/MMD - check nearest-training-neighbour distances too."}, "l_iou": {"lang": "py", "file": "l_iou.py", "src": "# l_iou.py: volumetric IoU (grid vs Monte Carlo, with error bars) and normal consistency between a mesh and a reference surface.\nimport numpy as np, m3d\nrng = np.random.default_rng(0)\nf = lambda p: m3d.sdf_sphere(p, 0.8); g = lambda p: m3d.sdf_sphere(p, 0.8, (0.1, 0, 0))             # two spheres, one shifted by 0.1\nr, dd = 0.8, 0.1; Vcap = lambda h: np.pi * h * h * (3 * r - h) / 3; inter = 2 * Vcap(r - dd / 2); vol = 4 / 3 * np.pi * r ** 3\nexact = inter / (2 * vol - inter); print('exact IoU of two r=0.8 spheres 0.1 apart: %.5f' % exact)\nfor G in (16, 32, 64):\n    P = m3d.grid(G, -1, 1).reshape(-1, 3); a, b = f(P) < 0, g(P) < 0; print('grid %2d^3: IoU %.5f (error %+.5f)' % (G, (a & b).sum() / (a | b).sum(), (a & b).sum() / (a | b).sum() - exact))\nfor n in (1000, 10000, 100000):\n    est = []\n    for _ in range(20): P = rng.uniform(-1, 1, (n, 3)); a, b = f(P) < 0, g(P) < 0; est.append((a & b).sum() / (a | b).sum())\n    print('Monte Carlo n=%6d: IoU %.5f +- %.5f (std over 20 runs; shrinks like 1/sqrt(n))' % (n, np.mean(est), np.std(est)))\nV, F = m3d.icosphere(3); V = V * 0.8\ndef normal_consistency(V, F, sdf):\n    P = m3d.sample_surface(V, F, 5000, rng); fi = None\n    c = V[F].mean(1); fn = m3d.face_normals(V, F); idx = np.argmin(((P[:, None] - c[None]) ** 2).sum(-1), 1); n1 = fn[idx]\n    e = 1e-4; n2 = np.stack([(sdf(P + e * np.eye(3)[k]) - sdf(P - e * np.eye(3)[k])) / (2 * e) for k in range(3)], -1); n2 /= np.linalg.norm(n2, axis=1, keepdims=True)\n    return np.abs((n1 * n2).sum(1)).mean()\nprint('normal consistency of icosphere(3) vs the true sphere: %.5f' % normal_consistency(V, F, f))\nVn = V + 0.02 * rng.standard_normal(V.shape); print('same mesh with 0.02 vertex noise: %.5f   (Chamfer barely moves: %.5f -> %.5f)' % (normal_consistency(Vn, F, f), m3d.chamfer(m3d.sample_surface(V, F, 3000, rng), m3d.sample_surface(V, F, 3000, rng) * 1), m3d.chamfer(m3d.sample_surface(Vn, F, 3000, rng), m3d.sample_surface(V, F, 3000, rng))))", "out": "exact IoU of two r=0.8 spheres 0.1 apart: 0.82878\ngrid 16^3: IoU 0.81673 (error -0.01204)\ngrid 32^3: IoU 0.82656 (error -0.00221)\ngrid 64^3: IoU 0.82920 (error +0.00042)\nMonte Carlo n=  1000: IoU 0.83656 +- 0.02051 (std over 20 runs; shrinks like 1/sqrt(n))\nMonte Carlo n= 10000: IoU 0.82673 +- 0.00653 (std over 20 runs; shrinks like 1/sqrt(n))\nMonte Carlo n=100000: IoU 0.82858 +- 0.00212 (std over 20 runs; shrinks like 1/sqrt(n))\nnormal consistency of icosphere(3) vs the true sphere: 0.99901\nsame mesh with 0.02 vertex noise: 0.93933   (Chamfer barely moves: 0.00174 -> 0.00211)"}, "m_memory": {"lang": "py", "file": "m_memory.py", "src": "# m_memory.py: memory and FLOPs of 3D representations and of a NeRF training step; arithmetic intensity and a roofline estimate.\nimport numpy as np, time\nGB = 1e9\nprint('representation memory for one object:')\nfor name, b in [('dense fp32 SDF grid 256^3', 256 ** 3 * 4), ('dense fp16 SDF grid 512^3', 512 ** 3 * 2), ('sparse narrow band 512^3 (~2% voxels, fp16 + 4B index)', 0.02 * 512 ** 3 * 6),\n                ('triplane 3 x 256^2 x 32 fp16', 3 * 256 ** 2 * 32 * 2), ('hash grid 16 levels x 2^19 x 2 fp16', 16 * 2 ** 19 * 2 * 2), ('3M Gaussians x 59
