fp32', 3e6 * 59 * 4), ('mesh 100k faces (fp32 xyz+uv+normal, uint32 idx)', 50e3 * 32 + 100e3 * 12)]:\n    print('  %-52s %10.2f MB' % (name, b / 1e6))\n# NeRF MLP: 8 layers x 256 wide, 64+128 samples per ray, 4096 rays per batch\nL, W, S, R = 8, 256, 192, 4096; flops_fwd = 2 * L * W * W * S * R; act = L * W * S * R * 2\nprint('NeRF step: %.2f TFLOP forward, x3 with backward = %.2f TFLOP; activations %.2f GB in fp16' % (flops_fwd / 1e12, 3 * flops_fwd / 1e12, act / GB))\n# arithmetic intensity: FLOPs per byte moved\nfor name, fl, by in [('256x256 matmul layer, batch 786k points (fp16)', 2 * 256 * 256 * 786432, 2 * (256 * 256 + 2 * 256 * 786432)),\n                     ('hash-grid lookup: 16 levels x 8 corners x 2 feats per point', 16 * 8 * 2 * 2, 16 * 8 * 2 * 2), ('Gaussian alpha-blend per pixel-splat (~20 FLOP, 16 B)', 20, 16)]:\n    ai = fl / by; peak, bw = 989e12, 3.35e12; bound = 'compute' if ai > peak / bw else 'memory'\n    print('  %-60s intensity %7.1f FLOP/B -> %s-bound (ridge %.0f FLOP/B on an H100)' % (name, ai, bound, peak / bw))\n# measure this CPU: matmul throughput vs memory copy bandwidth\na = np.random.rand(1024, 1024).astype(np.float32); t = time.time(); [a @ a for _ in range(5)]; gf = 5 * 2 * 1024 ** 3 / (time.time() - t) / 1e9\nb = np.random.rand(64 * 2 ** 20 // 4).astype(np.float32); t = time.time(); [b.copy() for _ in range(5)]; bw = 5 * 2 * b.nbytes / (time.time() - t) / 1e9\nprint('this CPU (1 thread): matmul ~%.0f GFLOP/s, copy ~%.1f GB/s -> ridge ~%.0f FLOP/B (values vary run to run)' % (gf, bw, gf / bw))", "out": "representation memory for one object:\n  dense fp32 SDF grid 256^3                                 67.11 MB\n  dense fp16 SDF grid 512^3                                268.44 MB\n  sparse narrow band 512^3 (~2% voxels, fp16 + 4B index)      16.11 MB\n  triplane 3 x 256^2 x 32 fp16                              12.58 MB\n  hash grid 16 levels x 2^19 x 2 fp16                       33.55 MB\n  3M Gaussians x 59 fp32                                   708.00 MB\n  mesh 100k faces (fp32 xyz+uv+normal, uint32 idx)           2.80 MB\nNeRF step: 0.82 TFLOP forward, x3 with backward = 2.47 TFLOP; activations 3.22 GB in fp16\n  256x256 matmul layer, batch 786k points (fp16)               intensity   128.0 FLOP/B -> memory-bound (ridge 295 FLOP/B on an H100)\n  hash-grid lookup: 16 levels x 8 corners x 2 feats per point  intensity     1.0 FLOP/B -> memory-bound (ridge 295 FLOP/B on an H100)\n  Gaussian alpha-blend per pixel-splat (~20 FLOP, 16 B)        intensity     1.2 FLOP/B -> memory-bound (ridge 295 FLOP/B on an H100)\nthis CPU (1 thread): matmul ~192 GFLOP/s, copy ~4.8 GB/s -> ridge ~40 FLOP/B (values vary run to run)"}, "m_precision": {"lang": "py", "file": "m_precision.py", "src": "# m_precision.py: number formats for 3D training: fp32/fp16/bf16 bit layouts in hex and binary, range and precision limits, loss scaling.\nimport numpy as np, struct\ndef bits32(x): return struct.unpack('>I', struct.pack('>f', x))[0]\ndef bf16(x): b = bits32(x); return (b + 0x7FFF + ((b >> 16) & 1)) >> 16          # round-to-nearest-even to the top 16 bits\ndef from_bf16(h): return struct.unpack('>f', struct.pack('>I', h << 16))[0]\nfor x in (1.0, -2.5, 0.1, 3.14159265):\n    b = bits32(x); h16 = np.float16(x).view(np.uint16); hb = bf16(x)\n    print('%-11s fp32 0x%08X  sign %d exp %s mant %s | fp16 0x%04X (%.8g) | bf16 0x%04X (%.8g)' % (repr(x), b, b >> 31, format((b >> 23) & 0xFF, '08b'), format(b & 0x7FFFFF, '023b')[:8] + '...', h16, float(np.float16(x)), hb, from_bf16(hb)))\nprint('decode by hand 0x3F800000: sign 0, exponent 0x7F = 127 -> 2^(127-127) = 1, mantissa 0 -> 1.0')\nprint('ranges: fp16 max %.0f, min normal %.3g, eps %.3g | bf16 max %.3g, eps %.3g | fp32 eps %.3g' % (np.finfo(np.float16).max, np.finfo(np.float16).tiny, np.finfo(np.float16).eps, from_bf16(0x7F7F), 2 ** -7, np.finfo(np.float32).eps))\n# 3D-specific failure: world-space positions in fp16\nfor pos in (1.0, 100.0, 2000.0):\n    step = float(np.spacing(np.float16(pos))); print('fp16 spacing at coordinate %7.1f: %.4g  (a 1 mm detail survives: %s)' % (pos, step, step < 0.001))\n# sums of many small gradients: fp16 accumulation stalls, fp32 accumulation is fine\ng = np.full(20000, 1e-4, np.float32); acc16 = np.float16(0)\nfor v in g: acc16 = np.float16(acc16 + np.float16(v))\nprint('summing 20000 x 1e-4: fp16 accumulator %.4f, fp32 %.4f (true 2.0)' % (float(acc16), float(g.sum(dtype=np.float32))))\n# loss scaling: tiny gradients underflow in fp16 unless the loss is multiplied first\ngrads = np.array([3e-8, 2e-7, 5e-6, 1e-3]); print('fp16 of raw grads     :', np.float16(grads).astype(float))\nS = 2.0 ** 16; print('fp16 of grads x 2^16, then /2^16:', (np.float16(grads * S).astype(np.float64) / S))\nwith np.errstate(over='ignore'): big = np.float16(np.float32(2.0 * S))\nprint('overflow: a gradient of 2.0 x 2^16 = %.0f > 65504 becomes %s in fp16 -> dynamic loss scaling halves S and skips that step' % (2.0 * S, big))", "out": "1.0         fp32 0x3F800000  sign 0 exp 01111111 mant 00000000... | fp16 0x3C00 (1) | bf16 0x3F80 (1)\n-2.5        fp32 0xC0200000  sign 1 exp 10000000 mant 01000000... | fp16 0xC100 (-2.5) | bf16 0xC020 (-2.5)\n0.1         fp32 0x3DCCCCCD  sign 0 exp 01111011 mant 10011001... | fp16 0x2E66 (0.099975586) | bf16 0x3DCD (0.10009766)\n3.14159265  fp32 0x40490FDB  sign 0 exp 10000000 mant 10010010... | fp16 0x4248 (3.140625) | bf16 0x4049 (3.140625)\ndecode by hand 0x3F800000: sign 0, exponent 0x7F = 127 -> 2^(127-127) = 1, mantissa 0 -> 1.0\nranges: fp16 max 65504, min normal 6.1e-05, eps 0.000977 | bf16 max 3.39e+38, eps 0.00781 | fp32 eps 1.19e-07\nfp16 spacing at coordinate     1.0: 0.0009766  (a 1 mm detail survives: True)\nfp16 spacing at coordinate   100.0: 0.0625  (a 1 mm detail survives: False)\nfp16 spacing at coordinate  2000.0: 1  (a 1 mm detail survives: False)\nsumming 20000 x 1e-4: fp16 accumulator 0.2500, fp32 2.0000 (true 2.0)\nfp16 of raw grads     : [5.96046448e-08 1.78813934e-07 5.00679016e-06 1.00040436e-03]\nfp16 of grads x 2^16, then /2^16: [3.00060492e-08 2.00001523e-07 4.99933958e-06 1.00040436e-03]\noverflow: a gradient of 2.0 x 2^16 = 131072 > 65504 becomes inf in fp16 -> dynamic loss scaling halves S and skips that step"}, "m_quant": {"lang": "py", "file": "m_quant.py", "src": "# m_quant.py: quantising a trained neural SDF to int8 (per-tensor vs per-channel), and the effect on the extracted surface.\nimport numpy as np, ag, m3d, shapes\nrng = np.random.default_rng(0)\nP = rng.uniform(-1, 1, (6000, 3)); D = shapes.sdf('torus', P)\nWs = [ag.param(rng, 3, 64), ag.T(np.zeros(64)), ag.param(rng, 64, 64), ag.T(np.zeros(64)), ag.param(rng, 64, 1)]\ndef net(X, W): h = (ag.T(X) @ W[0] + W[1]).gelu(); h = (h @ W[2] + W[3]).gelu(); return (h @ W[4]).reshape(len(X))\nopt = ag.Adam(Ws, 3e-3)\nfor it in range(3000):\n    i = rng.integers(0, len(P), 256); L = ((net(P[i], Ws) - ag.T(D[i])) ** 2).mean(); L.backward(); opt.step()\nG = m3d.grid(40, -1, 1).reshape(-1, 3); gt = shapes.sdf('torus', G)\ndef evaluate(W):\n    d = net(G, [ag.T(w) for w in W]).data; return np.abs(d - gt).mean(), ((d < 0) & (gt < 0)).sum() / ((d < 0) | (gt < 0)).sum()\nW32 = [w.data for w in Ws]; e, iou = evaluate(W32); print('fp32 network: %d params, %d bytes; mean |SDF err| %.4f, IoU %.4f' % (sum(w.size for w in W32), 4 * sum(w.size for w in W32), e, iou))\ndef q_tensor(w, bits=8): s = np.abs(w).max() / (2 ** (bits - 1) - 1); return np.clip(np.round(w / s), -(2 ** (bits - 1) - 1), 2 ** (bits - 1) - 1) * s, s\ndef q_channel(w, bits=8):\n    if w.ndim == 1: return q_tensor(w, bits)\n    s = np.abs(w).max(0, keepdims=True) / (2 ** (bits - 1) - 1); return np.clip(np.round(w / s), -(2 ** (bits - 1) - 1), 2 ** (bits - 1) - 1) * s, s\nw = W32[2]; q, s = q_tensor(w); k = np.flatnonzero(np.abs(w) > 40 * s)[0]; wk = w.flat[k]\nprint('layer-2 int8 example: w = %.5f, scale %.6f -> int %d (two\\'s complement 0x%02X) -> %.5f; small weights like %.5f round to 0' % (wk, s, int(np.round(wk / s)), int(np.round(wk / s)) & 0xFF, q.flat[k], w[0, 0]))\nfor bits in (8, 6, 4):\n    for name, fn in [('per-tensor', q_tensor), ('per-channel', q_channel)]:\n        Wq = [fn(w, bits)[0] if w.ndim > 1 else w for w in W32]; e, iou = evaluate(Wq)\n        print('int%d %-11s weights: mean |SDF err| %.4f, IoU %.4f, weight bytes %d' % (bits, name, e, iou, sum(w.size * bits // 8 if w.ndim > 1 else 4 * w.size for w in W32)))", "out": "fp32 network: 4480 params, 17920 bytes; mean |SDF err| 0.0060, IoU 0.9498\nlayer-2 int8 example: w = -0.58005, scale 0.007836 -> int -74 (two's complement 0xB6) -> -0.57986; small weights like -0.00369 round to 0\nint8 per-tensor  weights: mean |SDF err| 0.0075, IoU 0.9521, weight bytes 4864\nint8 per-channel weights: mean |SDF err| 0.0064, IoU 0.9455, weight bytes 4864\nint6 per-tensor  weights: mean |SDF err| 0.0190, IoU 0.8978, weight bytes 3776\nint6 per-channel weights: mean |SDF err| 0.0081, IoU 0.9476, weight bytes 3776\nint4 per-tensor  weights: mean |SDF err| 0.0629, IoU 0.5798, weight bytes 2688\nint4 per-channel weights: mean |SDF err| 0.0453, IoU 0.8149, weight bytes 2688"}, "m_raster_arm": {"lang": "c", "file": "m_raster_arm.c", "src": "/* m_raster_arm.c: a fixed-point (Q16.16 and 28.4 sub-pixel) edge-function triangle rasteriser with the top-left fill rule, as on an ARM GPU/MCU.\n   Checks: watertight (shared edges cover every pixel exactly once), area matches, and fixed-point vs float barycentrics. */\n#include <stdio.h>\n#include <stdint.h>\n#include <math.h>\n#define W 32\n#define H 32\ntypedef int32_t fx;                      /* 28.4 fixed point for screen coordinates: 1/16-pixel precision */\nstatic fx tofx(float v) { return (fx)lrintf(v * 16.0f); }\nstatic int64_t edge(fx ax, fx ay, fx bx, fx by, fx px, fx py) { return (int64_t)(bx - ax) * (py - ay) - (int64_t)(by - ay) * (px - ax); }\nstatic int topleft(fx ax, fx ay, fx bx, fx by) { return (ay == by && bx < ax) || (by < ay); }   /* for this (y-down, CW-positive) convention */\nstatic int cover[H][W];\nstatic long raster(const float *v, float *bsum_err) {\n    fx x0 = tofx(v[0]), y0 = tofx(v[1]), x1 = tofx(v[2]), y1 = tofx(v[3]), x2 = tofx(v[4]), y2 = tofx(v[5]);\n    int64_t area = edge(x0, y0, x1, y1, x2, y2); long n = 0;\n    if (area < 0) { fx t = x1; x1 = x2; x2 = t; t = y1; y1 = y2; y2 = t; area = -area; }\n    int b0 = topleft(x1, y1, x2, y2) ? 0 : -1, b1 = topleft(x2, y2, x0, y0) ? 0 : -1, b2 = topleft(x0, y0, x1, y1) ? 0 : -1;\n    for (int y = 0; y < H; y++) for (int x = 0; x < W; x++) {\n        fx px = x * 16 + 8, py = y * 16 + 8;                                   /* pixel centre */\n        int64_t w0 = edge(x1, y1, x2, y2, px, py) + b0, w1 = edge(x2, y2, x0, y0, px, py) + b1, w2 = edge(x0, y0, x1, y1, px, py) + b2;\n        if ((w0 | w1 | w2) >= 0) {\n            cover[y][x]++; n++;\n            int32_t l0 = (int32_t)(((w0 - b0) << 16) / area);                  /* Q16.16 barycentric */\n            float f0 = ((float)(x1 - px) * (y2 - py) - (float)(y1 - py) * (x2 - px)) / (float)area;\n            float e = fabsf(l0 / 65536.0f - f0); if (e > *bsum_err) *bsum_err = e;\n        }\n    }\n    return n;\n}\nint main(void) {\n    float quad[4][2] = {{3.3f, 2.7f}, {28.6f, 5.1f}, {25.2f, 29.4f}, {4.9f, 26.8f}};\n    float t1[6] = {quad[0][0], quad[0][1], quad[1][0], quad[1][1], quad[2][0], quad[2][1]};\n    float t2[6] = {quad[0][0], quad[0][1], quad[2][0], quad[2][1], quad[3][0], quad[3][1]};\n    float err = 0; long a = raster(t1, &err), b = raster(t2, &err);\n    int dbl = 0, holes = 0;\n    for (int y = 0; y < H; y++) for (int x = 0; x < W; x++) { if (cover[y][x] > 1) dbl++; }\n    /* interior pixels of the quad that no triangle covered (diagonal holes) */\n    for (int y = 8; y < 24; y++) for (int x = 8; x < 24; x++) if (!cover[y][x]) holes++;\n    double qa = 0.5 * fabs((quad[0][0] * quad[1][1] - quad[1][0] * quad[0][1]) + (quad[1][0] * quad[2][1] - quad[2][0] * quad[1][1]) + (quad[2][0] * quad[3][1] - quad[3][0] * quad[2][1]) + (quad[3][0] * quad[0][1] - quad[0][0] * quad[3][1]));\n    printf(\"triangle 1 covers %ld px, triangle 2 covers %ld px, total %ld; exact quad area %.2f px^2\\n\", a, b, a + b, qa);\n    printf(\"pixels covered twice along the shared diagonal: %d; interior holes: %d (top-left rule -> watertight)\\n\", dbl, holes);\n    printf(\"max |Q16.16 barycentric - float| = %.2e (1 LSB = %.2e)\\n\", err, 1.0 / 65536);\n    printf(\"28.4 snap: 3.3 px -> %d/16 = %.4f px\\n\", tofx(3.3f), tofx(3.3f) / 16.0);\n    for (int y = 0; y < H; y += 2) { for (int x = 0; x < W; x++) putchar(cover[y][x] ? (cover[y][x] > 1 ? 'X' : '#') : '.'); putchar('\\n'); }\n    return 0;\n}", "out": "triangle 1 covers 310 px, triangle 2 covers 243 px, total 553; exact quad area 554.01 px^2\npixels covered twice along the shared diagonal: 0; interior holes: 0 (top-left rule -> watertight)\nmax |Q16.16 barycentric - float| = 1.53e-05 (1 LSB = 1.53e-05)\n28.4 snap: 3.3 px -> 53/16 = 3.3125 px\n................................\n................................\n...###################..........\n....########################....\n....########################....\n....########################....\n....########################....\n....#######################.....\n....#######################.....\n....#######################.....\n....######################......\n.....#####################......\n.....#####################......\n.....#####################......\n..................#######.......\n................................"}, "z_editor": {"lang": "py", "file": "z_editor.py", "src": "# z_editor.py: CAPSTONE 3, a tiny text-conditioned shape editor: instruction tokens + shape latent -> edited latent, decoded as an SDF.\nimport numpy as np, ag, shapes, m3d\nrng = np.random.default_rng(0); G = 24; P = m3d.grid(G, -1.1, 1.1).reshape(-1, 3)\ndef field(c, s, h):                                     # shape family, overall scale s, height stretch h\n    return np.clip(shapes.sdf(c, P / np.array([1, 1, h]), s) * min(h, 1), -0.3, 0.3)\nCL = ['sphere', 'box', 'cylinder', 'torus']; params_all = [(c, s, h) for c in CL for s in np.linspace(0.6, 0.95, 6) for h in np.linspace(0.7, 1.2, 6)]\nXg = np.array([field(*q) for q in params_all]); mu = Xg.mean(0); _, Sv, Vt = np.linalg.svd(Xg - mu, full_matrices=False); Z = 24; B = Vt[:Z]\nenc = lambda g: (g - mu) @ B.T; dec = lambda z: z @ B + mu\nprint('shape space: %d grids -> %d-D latent, reconstruction sign agreement %.2f%%' % (len(Xg), Z, 100 * ((dec(enc(Xg)) > 0) == (Xg > 0)).mean()))\nOPS = {'make it bigger': lambda c, s, h: (c, min(s + 0.14, 0.95), h), 'make it smaller': lambda c, s, h: (c, max(s - 0.14, 0.6), h),\n       'make it taller': lambda c, s, h: (c, s, min(h + 0.2, 1.2)), 'make it shorter': lambda c, s, h: (c, s, max(h - 0.2, 0.7)),\n       'turn it into a box': lambda c, s, h: ('box', s, h), 'turn it into a ring': lambda c, s, h: ('torus', s, h), 'turn it into a ball': lambda c, s, h: ('sphere', s, h)}\nVOC = sorted({w for k in OPS for w in k.split()} | {'please', 'a', 'bit'})\ndef toks(text): v = np.zeros(len(VOC)); ws = text.split(); [v.__setitem__(VOC.index(w), v[VOC.index(w)] + 1 / len(ws)) for w in ws if w in VOC]; return v\ndef snap(q): s = min(np.linspace(0.6, 0.95, 6), key=lambda x: abs(x - q[1])); h = min(np.linspace(0.7, 1.2, 6), key=lambda x: abs(x - q[2])); return (q[0], s, h)\ntrip = []\nfor _ in range(3000):\n    q = params_all[rng.integers(len(params_all))]; k = list(OPS)[rng.integers(len(OPS))]; txt = (('please ' if rng.random() < 0.3 else '') + k)\n    trip.append((enc(field(*q)), toks(txt), enc(field(*snap(OPS[k](*q))))))\nZi = np.array([t[0] for t in trip]); Ti = np.array([t[1] for t in trip]); Zo = np.array([t[2] for t in trip]); sc = Zi.std(0) + 1e-6\np = ag.param; Wt = p(rng, len(VOC), 64); W1, b1, W2, b2, W3 = p(rng, Z + 64, 256), ag.T(np.zeros(256)), p(rng, 256, 256), ag.T(np.zeros(256)), p(rng, 256, Z, scale=0.01)\nparams = [Wt, W1, b1, W2, b2, W3]\ndef edit(z, t): h = ag.cat([ag.T(z / sc), (ag.T(t) @ Wt).tanh()], 1); h = (h @ W1 + b1).gelu(); h = (h @ W2 + b2).gelu(); return ag.T(z / sc) + h @ W3   # residual edit in latent space\nopt = ag.Adam(params, 1e-3)\nfor it in range(1, 4001):\n    i = rng.integers(0, len(Zi), 128); L = ((edit(Zi[i], Ti[i]) - ag.T(Zo[i] / sc)) ** 2).mean(); L.backward(); opt.step()\n    if it in (1, 1000, 4000): print('iter %4d  latent MSE %.4f' % (it, L.data))\ndef vol(g): return (g < 0).mean() * 2.2 ** 3\ndef height(g): occ = (g.reshape(G, G, G) < 0).any((0, 1)); zs = np.flatnonzero(occ); return (zs.max() - zs.min() + 1) * 2.2 / G if len(zs) else 0\ndef cls(g): return CL[np.argmin([np.abs(g - field(c, 0.8, 1.0)).mean() for c in CL])]\nstart = ('cylinder', 0.74, 0.9); g0 = field(*start); print('start: %s volume %.3f height %.3f' % (start[0], vol(g0), height(g0)))\nfor txt in ['make it bigger', 'please make it taller', 'make it a bit shorter', 'turn it into a box', 'turn it into a ring']:\n    g = dec(edit(enc(g0)[None], toks(txt)[None]).data[0] * sc); gt = field(*snap(OPS[txt.replace('please ', '').replace('a bit ', '')](*start)))\n    print('\"%s\" -> class %s, volume %.3f (target %.3f), height %.3f (target %.3f), IoU to target %.3f' % (txt, cls(g), vol(g), vol(gt), height(g), height(gt), ((g < 0) & (gt < 0)).sum() / ((g < 0) | (gt < 0)).sum()))\ng = g0\nfor txt in ['turn it into a ring', 'make it bigger']: g = dec(edit(enc(g)[None], toks(txt)[None]).data[0] * sc)\ngt = field(*snap(('torus', 0.88, 0.9))); print('chained \"ring\" then \"bigger\": class %s, IoU to target %.3f' % (cls(g), ((g < 0) & (gt < 0)).sum() / ((g < 0) | (gt < 0)).sum()))", "out": "shape space: 144 grids -> 24-D latent, reconstruction sign agreement 99.91%\niter    1  latent MSE 1.2387\niter 1000  latent MSE 0.0199\niter 4000  latent MSE 0.0026\nstart: cylinder volume 0.481 height 1.100\n\"make it bigger\" -> class cylinder, volume 0.721 (target 0.733), height 1.283 (target 1.283), IoU to target 0.983\n\"please make it taller\" -> class cylinder, volume 0.524 (target 0.561), height 1.283 (target 1.283), IoU to target 0.934\n\"make it a bit shorter\" -> class cylinder, volume 0.320 (target 0.320), height 0.733 (target 0.733), IoU to target 1.000\n\"turn it into a box\" -> class box, volume 0.616 (target 0.616), height 0.733 (target 0.733), IoU to target 1.000\n\"turn it into a ring\" -> class torus, volume 0.234 (target 0.234), height 0.367 (target 0.367), IoU to target 1.000\nchained \"ring\" then \"bigger\": class torus, IoU to target 0.970"}, "z_nerf": {"lang": "py", "file": "z_nerf.py", "src": "# z_nerf.py: CAPSTONE 1, a tiny NeRF trained from scratch on a CPU: posed images -> positional encoding MLP -> volume rendering -> novel views.\nimport numpy as np, ag, time\nrng = np.random.default_rng(0); S = 24; NS = 24; near, far = 2.0, 4.6\ndef scene(p):                                        # ground truth: a red sphere and a blue box (density and colour fields)\n    ds = np.linalg.norm(p - [0.35, 0, 0], axis=-1) - 0.45; q = np.abs(p - [-0.45, 0.1, 0]) - 0.3; db = np.linalg.norm(np.maximum(q, 0), axis=-1) + np.minimum(q.max(-1), 0)\n    sig = 40 * (1 / (1 + np.exp(80 * ds)) + 1 / (1 + np.exp(80 * db))); col = np.where((ds < db)[..., None], [0.9, 0.2, 0.15], [0.15, 0.3, 0.9]); return sig, col\ndef cam_rays(az, el=0.35, rad=3.3):\n    eye = rad * np.array([np.cos(el) * np.sin(az), np.sin(el), np.cos(el) * np.cos(az)]); f = -eye / rad; r = np.cross(f, [0, 1, 0]); r /= np.linalg.norm(r); u = np.cross(r, f)\n    g = (np.arange(S) + 0.5) / S * 2 - 1; a, b = np.meshgrid(g * 0.45, -g * 0.45); d = f + a[..., None] * r + b[..., None] * u; d /= np.linalg.norm(d, axis=-1, keepdims=True)\n    return np.broadcast_to(eye, d.shape).reshape(-1, 3), d.reshape(-1, 3)\ndef composite(sig, col, dt):\n    a = 1 - np.exp(-sig * dt); T = np.exp(-np.concatenate([np.zeros((len(sig), 1)), np.cumsum(sig * dt, 1)[:, :-1]], 1)); w = T * a\n    return (w[..., None] * col).sum(1) + (1 - w.sum(1, keepdims=True)) * 1.0               # white background\ndef gt_image(o, d):\n    t = np.linspace(near, far, 256); p = o[:, None] + d[:, None] * t[None, :, None]; s, c = scene(p); return composite(s, c, np.full((1, 256), t[1] - t[0]))\ntrain_az = np.linspace(0, 2 * np.pi, 12, endpoint=False); test_az = [0.26, 2.9]\nR = [cam_rays(a) for a in train_az]; O = np.concatenate([r[0] for r in R]); Dd = np.concatenate([r[1] for r in R]); C = np.concatenate([gt_image(*r) for r in R])\nprint('training data: %d views of %dx%d = %d rays' % (len(train_az), S, S, len(C)))\nLf = 6\ndef pe(x): return np.concatenate([x] + [f(2.0 ** k * np.pi * x / 1.5) for k in range(Lf) for f in (np.sin, np.cos)], -1)\np = ag.param; din = 3 + 6 * Lf\nW = [p(rng, din, 96), ag.T(np.zeros(96)), p(rng, 96, 96), ag.T(np.zeros(96)), p(rng, 96, 4)]\ndef field(x):\n    h = (ag.T(pe(x)) @ W[0] + W[1]).relu(); h = (h @ W[2] + W[3]).relu(); out = h @ W[4]\n    return ((out[:, 0:1] - 1).exp() + 1).log() * 10, out[:, 1:4].sigmoid()          # density = 10 softplus(.) >= 0 (never 'dead' like ReLU), colour in (0, 1)\ndef render(o, d, train=True):\n    n = len(o); t = np.linspace(near, far, NS + 1)[:-1][None] + (rng.random((n, NS)) if train else 0.5) * (far - near) / NS   # stratified sampling\n    x = (o[:, None] + d[:, None] * t[..., None]).reshape(-1, 3); sig, col = field(x); sig = sig.reshape(n, NS); col = col.reshape(n, NS, 3)\n    dt = (far - near) / NS; a = 1 - (sig * -dt).exp(); tri = np.triu(np.ones((NS, NS)), 1)\n    T = ((sig * -dt) @ ag.T(tri)).exp(); w = a * T                                        # T_i = exp(-sum_{j<i} sigma_j dt)\n    return (w.reshape(n, NS, 1) * col).sum(1) + (1 - w.sum(1, keepdims=True)) * 1.0\npsnr = lambda m: -10 * np.log10(m)\no, d = O[:8], Dd[:8]; print('gradcheck of the full NeRF render (8 rays): %.2e' % ag.gradcheck(lambda: ((render(o, d, False) - ag.T(C[:8])) ** 2).mean(), W))\nopt = ag.Adam(W, 3e-3); t0 = time.time()\nfor it in range(1, 3001):\n    if it == 2000: opt.lr = 1e-3\n    i = rng.integers(0, len(C), 256); L = ((render(O[i], Dd[i]) - ag.T(C[i])) ** 2).mean(); L.backward(); opt.step()\n    if it in (1, 500, 1000, 2000, 3000): print('iter %4d  train PSNR %.2f dB  (%.0f s)' % (it, psnr(L.data), time.time() - t0))\nfor az in test_az:\n    o, d = cam_rays(az); gt = gt_image(o, d); pr = np.concatenate([render(o[k:k + 192], d[k:k + 192], False).data for k in range(0, len(o), 192)])\n    print('novel view az=%.2f rad (between training cameras): PSNR %.2f dB; mean-colour baseline %.2f dB' % (az, psnr(((pr - gt) ** 2).mean()), psnr(((gt - C.mean(0)) ** 2).mean())))\n    if az == test_az[0]:\n        for row in range(0, S, 3): print('   ' + ''.join('R' if px[0] > 0.6 and px[2] < 0.5 else ('B' if px[2] > 0.6 and px[0] < 0.5 else ('.' if px.min() > 0.85 else '+')) for px in pr.reshape(S, S, 3)[row]))", "out": "training data: 12 views of 24x24 = 6912 rays\ngradcheck of the full NeRF render (8 rays): 7.46e-08\niter    1  train PSNR 6.86 dB  (0 s)\niter  500  train PSNR 36.45 dB  (13 s)\niter 1000  train PSNR 34.99 dB  (25 s)\niter 2000  train PSNR 37.62 dB  (51 s)\niter 3000  train PSNR 37.66 dB  (76 s)\nnovel view az=0.26 rad (between training cameras): PSNR 36.48 dB; mean-colour baseline 12.45 dB\n   ........................\n   ........................\n   ........................\n   .....BBBBBBBRRRRRR......\n   .....BBBBBBRRRRRRRR.....\n   ............RRRRR+......\n   ........................\n   ........................\nnovel view az=2.90 rad (between training cameras): PSNR 37.89 dB; mean-colour baseline 12.46 dB"}, "z_pcgen": {"lang": "py", "file": "z_pcgen.py", "src": "# z_pcgen.py: CAPSTONE 2, a class-conditional point-cloud diffusion generator, trained from scratch and judged with COV, MMD and 1-NNA.\nimport numpy as np, ag, shapes\nrng = np.random.default_rng(0); N = 64; Tn = 200; CL = ['sphere', 'box', 'torus']\nbetas = np.linspace(1e-4, 0.06, Tn); al = 1 - betas; ab = np.cumprod(al)\nX = np.array([shapes.sample(CL[k % 3], N, rng, s=1.0, rot=False) for k in range(300)]); Y = np.arange(300) % 3\np = ag.param; H = 96\nA1, a1, A2, a2 = p(rng, 3 + 16 + 4, H), ag.T(np.zeros(H)), p(rng, H, H), ag.T(np.zeros(H))\nB1, b1, B2 = p(rng, 2 * H, H), ag.T(np.zeros(H)), p(rng, H, 3, scale=0.01); params = [A1, a1, A2, a2, B1, b1, B2]\ndef temb(t): f = np.exp(-np.arange(8) * np.log(200) / 8); a = t[:, None] * f; return np.concatenate([np.sin(a), np.cos(a)], 1)\ndef eps_model(xt, t, c):\n    B = xt.shape[0]; cond = np.repeat(np.concatenate([temb(t), np.eye(4)[c]], 1)[:, None], N, 1)     # class 3 = unconditional\n    h = ((ag.T(np.concatenate([xt, cond], -1)) @ A1 + a1).gelu() @ A2 + a2).gelu(); g = h.max(1).reshape(B, 1, H)\n    return (ag.cat([h, g * ag.T(np.ones((1, N, 1)))], -1) @ B1 + b1).gelu() @ B2\nopt = ag.Adam(params, 1e-3)\nfor it in range(1, 6001):\n    i = rng.integers(0, len(X), 16); t = rng.integers(0, Tn, 16); e = rng.standard_normal((16, N, 3)); c = np.where(rng.random(16) < 0.1, 3, Y[i])\n    xt = np.sqrt(ab[t])[:, None, None] * X[i] + np.sqrt(1 - ab[t])[:, None, None] * e\n    L = ((eps_model(xt, t, c) - ag.T(e)) ** 2).mean(); L.backward(); opt.step()\n    if it in (1, 2000, 6000): print('iter %4d  epsilon-MSE %.4f' % (it, L.data))\ndef sample(c, n, w=1.5):\n    x = rng.standard_normal((n, N, 3))\n    for t in range(Tn - 1, -1, -1):\n        tt = np.full(n, t); e = (1 + w) * eps_model(x, tt, np.full(n, c)).data - w * eps_model(x, tt, np.full(n, 3)).data\n        x = (x - betas[t] / np.sqrt(1 - ab[t]) * e) / np.sqrt(al[t]); x += np.sqrt(betas[t]) * rng.standard_normal(x.shape) * (t > 0)\n    return x\ndef CD(A, B):\n    out = np.zeros((len(A), len(B)))\n    for i, a in enumerate(A): d = ((a[None, :, None] - B[:, None]) ** 2).sum(-1); out[i] = d.min(2).mean(1) + d.min(1).mean(1)\n    return out\nref = np.array([shapes.sample(CL[k % 3], N, np.random.default_rng(100 + k), s=1.0, rot=False) for k in range(30)])\nG = np.concatenate([sample(c, 10) for c in range(3)]); gl = np.repeat(np.arange(3), 10)\nfor c in range(3):\n    d = np.array([[np.abs(shapes.sdf(k, s)).mean() for k in CL] for s in G[gl == c]]); print('requested %-6s: %d/10 samples closest to that class; mean |SDF| to it %.4f' % (CL[c], (d.argmin(1) == c).sum(), d[:, c].mean()))\nD = CD(G, ref); Dgg = CD(G, G); Drr = CD(ref, ref); np.fill_diagonal(Dgg, np.inf); np.fill_diagonal(Drr, np.inf)\nlab = np.r_[np.zeros(30), np.ones(30)]; Dall = np.block([[Dgg, D], [D.T, Drr]])\nprint('COV %.2f  MMD-CD %.4f  1-NNA %.2f (ideal ~0.5; 1.0 = trivially separable)' % (len(set(D.argmin(1))) / 30, D.min(0).mean(), (lab[Dall.argmin(1)] == lab).mean()))\nprint('nearest-training distance of samples %.4f vs reference-to-training %.4f (memorisation check)' % (CD(G, X[:90]).min(1).mean(), CD(ref, X[:90]).min(1).mean()))", "out": "iter    1  epsilon-MSE 0.9553\niter 2000  epsilon-MSE 0.2027\niter 6000  epsilon-MSE 0.1830\nrequested sphere: 10/10 samples closest to that class; mean |SDF| to it 0.1021\nrequested box   : 9/10 samples closest to that class; mean |SDF| to it 0.0941\nrequested torus : 10/10 samples closest to that class; mean |SDF| to it 0.0961\nCOV 0.40  MMD-CD 0.0817  1-NNA 0.98 (ideal ~0.5; 1.0 = trivially separable)\nnearest-training distance of samples 0.0834 vs reference-to-training 0.0546 (memorisation check)"}, "ag": {"lang": "py", "file": "ag.py", "src": "# ag.py: a tiny reverse-mode automatic differentiation engine in NumPy (used by the Part 8-11 examples).\n# Every op stores its inputs and a function that turns the output gradient into input gradients.\nimport numpy as np\n\ndef _unb(g, shape):                       # undo NumPy broadcasting: sum the gradient back to the input's shape\n    while g.ndim > len(shape): g = g.sum(0)\n    for i, s in enumerate(shape):\n        if s == 1 and g.shape[i] != 1: g = g.sum(i, keepdims=True)\n    return g\n\nclass T:\n    def __init__(self, data, parents=(), back=None):\n        self.data = np.asarray(data, dtype=np.float64); self.grad = None; self.parents = parents; self.back = back\n    shape = property(lambda s: s.data.shape)\n    def __repr__(self): return 'T%s' % (self.data.shape,)\n    # ---- elementwise ----\n    def __add__(a, b):\n        b = b if isinstance(b, T) else T(b)\n        return T(a.data + b.data, (a, b), lambda g: (_unb(g, a.shape), _unb(g, b.shape)))\n    __radd__ = __add__\n    def __neg__(a): return T(-a.data, (a,), lambda g: (-g,))\n    def __sub__(a, b): return a + (-(b if isinstance(b, T) else T(b)))\n    def __rsub__(a, b): return T(b) - a\n    def __mul__(a, b):\n        b = b if isinstance(b, T) else T(b)\n        return T(a.data * b.data, (a, b), lambda g: (_unb(g * b.data, a.shape), _unb(g * a.data, b.shape)))\n    __rmul__ = __mul__\n    def __truediv__(a, b):\n        b = b if isinstance(b, T) else T(b)\n        return a * b ** -1\n    def __pow__(a, p): return T(a.data ** p, (a,), lambda g: (g * p * a.data ** (p - 1),))\n    def __matmul__(a, b):\n        return T(a.data @ b.data, (a, b), lambda g: (_unb(g @ np.swapaxes(b.data, -1, -2), a.shape), _unb(np.swapaxes(a.data, -1, -2) @ g, b.shape)))\n    def exp(a): e = np.exp(a.data); return T(e, (a,), lambda g: (g * e,))\n    def log(a): return T(np.log(a.data), (a,), lambda g: (g / a.data,))\n    def tanh(a): t = np.tanh(a.data); return T(t, (a,), lambda g: (g * (1 - t * t),))\n    def sigmoid(a): s = 1 / (1 + np.exp(-a.data)); return T(s, (a,), lambda g: (g * s * (1 - s),))\n    def relu(a): m = a.data > 0; return T(a.data * m, (a,), lambda g: (g * m,))\n    def gelu(a):                                             # tanh approximation\n        x = a.data; c = np.sqrt(2 / np.pi); u = c * (x + 0.044715 * x ** 3); t = np.tanh(u)\n        d = 0.5 * (1 + t) + 0.5 * x * (1 - t * t) * c * (1 + 3 * 0.044715 * x * x)\n        return T(0.5 * x * (1 + t), (a,), lambda g: (g * d,))\n    def sin(a): return T(np.sin(a.data), (a,), lambda g: (g * np.cos(a.data),))\n    def cos(a): return T(np.cos(a.data), (a,), lambda g: (-g * np.sin(a.data),))\n    # ---- reductions and shape ----\n    def sum(a, axis=None, keepdims=False):\n        def back(g):\n            if axis is not None and not keepdims: g = np.expand_dims(g, axis)\n            return (np.broadcast_to(g, a.shape).copy(),)\n        return T(a.data.sum(axis, keepdims=keepdims), (a,), back)\n    def mean(a, axis=None, keepdims=False):\n        n = a.data.size if axis is None else a.data.shape[axis]\n        return a.sum(axis, keepdims) * (1.0 / n)\n    def max(a, axis, keepdims=False):                        # gradient to the arg-max\n        m = a.data.max(axis, keepdims=True); mask = (a.data == m); mask = mask / mask.sum(axis, keepdims=True)\n        out = m if keepdims else np.squeeze(m, axis)\n        return T(out, (a,), lambda g: ((g if keepdims else np.expand_dims(g, axis)) * mask,))\n    def reshape(a, *s): return T(a.data.reshape(*s), (a,), lambda g: (g.reshape(a.shape),))\n    def transpose(a, *ax):\n        inv = np.argsort(ax); return T(a.data.transpose(*ax), (a,), lambda g: (g.transpose(*inv),))\n    @property\n    def Tt(a): return a.transpose(*range(a.data.ndim - 2), a.data.ndim - 1, a.data.ndim - 2)\n    def __getitem__(a, idx):\n        def back(g): z = np.zeros_like(a.data); np.add.at(z, idx, g); return (z,)\n        return T(a.data[idx], (a,), back)\n    # ---- backprop ----\n    def backward(self, g=None):\n        order, seen = [], set()\n        def visit(v):\n            if id(v) in seen: return\n            seen.add(id(v)); [visit(p) for p in v.parents]; order.append(v)\n        visit(self)\n        for v in order: v.grad = None\n        self.grad = np.ones_like(self.data) if g is None else g\n        for v in reversed(order):\n            if v.back is None or v.grad is None: continue\n            for p, gp in zip(v.parents, v.back(v.grad)):\n                p.grad = gp if p.grad is None else p.grad + gp\n\ndef cat(ts, axis=-1):\n    sizes = np.cumsum([t.shape[axis] for t in ts])[:-1]\n    return T(np.concatenate([t.data for t in ts], axis), tuple(ts), lambda g: tuple(np.spl unit('u1', 1, 'found', 'rd', 'Vectors, transforms and cameras', 'The language every 3D model speaks: vectors, dot and cross products, matrices and homogeneous coordinates, rotations and quaternions, and the camera maths that turns a 3D point into a pixel. Each idea is explained first, then worked by hand, then checked in NumPy.', [
  lesson('u1l1', 'Vectors, dot and cross products', REF.math, [
    LS('What a vector is', 'A **vector** in 3D is three numbers (x, y, z). It can mean a **position** (a point in space) or a **direction with length** (a displacement, a normal, a velocity). Most 3D bugs come from mixing the two up, so keep asking: is this a point or a direction?\n\n**Length.** |a| = √(x² + y² + z²). A **unit vector** has length 1; dividing by the length (“normalising”) makes one.\n\n**Dot product.** a·b = a_x b_x + a_y b_y + a_z b_z = |a||b| cos θ. It measures how much two directions agree:\n\n| a·b | meaning |\n|---|---|\n| > 0 | angle below 90° |\n| = 0 | perpendicular |\n| < 0 | angle above 90° |\n\nUses you will meet in every unit: the angle between vectors, projecting one vector onto another (a·b̂), Lambert shading (n·l), back-face tests (n·v), and the cosine similarity used by CLIP.\n\n**Cross product.** a × b = (a_y b_z − a_z b_y, a_z b_x − a_x b_z, a_x b_y − a_y b_x). The result is **perpendicular to both** inputs, and its length is |a||b| sin θ, which is the area of the parallelogram they span. So a triangle’s area is ½|(B − A) × (C − A)|, and the normalised cross product is the triangle’s **face normal**. Swap the order and the normal flips: a × b = −(b × a). That is why triangle **winding order** (counter-clockwise when seen from outside) decides which way a face points.'),
    LS('Walk-through by hand', 'Take a = (1, 2, 2) and b = (3, 0, 4).\n\n1. a·b = 1×3 + 2×0 + 2×4 = **11**.\n2. |a| = √9 = 3, |b| = √25 = 5.\n3. cos θ = 11/15 = 0.7333, so θ = **42.8°**.\n4. a × b = (2×4 − 2×0, 2×3 − 1×4, 1×0 − 2×3) = **(8, 2, −6)**.\n5. Check perpendicularity: (8, 2, −6)·a = 8 + 4 − 12 = 0 ✓, and ·b = 24 + 0 − 24 = 0 ✓.\n\nThe example below does the same with its own numbers and prints a·b = 4, an angle of 53.396°, a × b = (2, 3, −4) and a triangle area of 2.6926, each checked two ways.', PX('a_vectors')),
    MC('The cross product of two edge vectors of a triangle gives…', ['a vector perpendicular to the triangle whose length is twice its area', 'the triangle’s area as a scalar', 'the angle between the edges', 'the centroid'], 'Its length is |a||b| sin θ, the parallelogram area, which is twice the triangle; its direction is the face normal.', 'Think length and direction separately.'),
    TF('If a·b = 0 for two non-zero vectors, they are perpendicular.', true, 'a·b = |a||b| cos θ, and with non-zero lengths that is zero only when cos θ = 0, which means θ = 90°.', 'Look at the cos θ factor.'),
    GM('dotangle'), GM('crossz'), GM('triarea')
  ]),
  lesson('u1l2', 'Matrices, homogeneous coordinates and transform order', REF.math, [
    LS('Transforms as matrices', 'A 3×3 matrix can **rotate, scale or shear** a vector, but it cannot **translate** it: M·0 is always 0. The fix is **homogeneous coordinates**. Write a point as (x, y, z, 1) and a direction as (x, y, z, 0), and use 4×4 matrices whose last column holds the translation:\n\n| | | | |\n|---|---|---|---|\n| r11 | r12 | r13 | t_x |\n| r21 | r22 | r23 | t_y |\n| r31 | r32 | r33 | t_z |\n| 0 | 0 | 0 | 1 |\n\nA point (w = 1) picks up the translation and a direction (w = 0) ignores it, which is exactly right: moving an object should not change which way its normals point.\n\n**Order matters.** Matrices apply **right to left**: in T·R·p, R acts first. Rotating then translating is not the same as translating then rotating. The usual model matrix is M = T·R·S (scale, then rotate, then translate).\n\n**Normals need the inverse-transpose.** With non-uniform scale S = diag(2, 1, 1), a 45° surface gets squashed, and transforming its normal by M stops it being perpendicular. The correct normal matrix is (M⁻¹)ᵀ. For pure rotations, (R⁻¹)ᵀ = R, so nothing changes.'),
    LS('Rotations and quaternions', '**Euler angles** (yaw, pitch, roll) are easy to read but suffer **gimbal lock**: at pitch 90° two axes line up and one degree of freedom vanishes. Interpolating Euler angles also wobbles.\n\nA **unit quaternion** q = (w, x, y, z) = (cos θ/2, sin θ/2 · axis) stores a rotation of θ about an axis in four numbers with no singularities. Composition is quaternion multiplication, and q and −q mean the same rotation.\n\n**Slerp** (spherical linear interpolation) moves along the great arc between two quaternions at constant angular speed. Plain lerp cuts the chord and must be renormalised: halfway between 0° and 120°, lerp gives |q| = cos 30° = 0.866 instead of 1.\n\nThe example prints T·R·p = (5, 1, 0) against R·T·p = (0, 6, 0), shows that an inverse-transpose normal stays perpendicular (dot 0) while the naive one does not (2.12132), and checks slerp at 30°/60°/120° with a lerp norm of 0.866.', PX('a_transforms')),
    MC('Which 4-vector represents a direction that translation should not affect?', ['(x, y, z, 0)', '(x, y, z, 1)', '(0, 0, 0, 1)', '(x, y, z, −1)'], 'With w = 0, the translation column is multiplied by 0.', 'What multiplies the translation column?'),
    TF('T·R·p and R·T·p always give the same point.', false, 'Matrix products do not commute. In T·R·p the point rotates about the origin and then moves; in R·T·p it moves and then swings about the origin.', 'Try p = (1, 0, 0) with a 90° rotation.'),
    GM('rotz'), GM('trorder')
  ]),
  lesson('u1l3', 'Cameras: from 3D point to pixel', REF.cam, [
    LS('The pinhole pipeline', 'Rendering, NeRF and every image-to-3D model use the same chain:\n\n1. **World → camera**: the view matrix (a look-at rotation and translation) puts the camera at the origin looking down −z (OpenGL) or +z (OpenCV).\n2. **Camera → image plane**: divide by depth. u = f·X/Z + c_x, v = f·Y/Z + c_y. Here f is the focal length in pixels and (c_x, c_y) is the principal point.\n3. **Intrinsics K** gather f and c into a 3×3 matrix; **extrinsics [R | t]** are the pose. A NeRF dataset is just images plus K and [R | t] for each one.\n\n**Field of view.** Half the image width sits at half the FOV, so f = (W/2) / tan(FOV/2). For example, a 640-px image with a 60° FOV has f = 320/tan 30° = 554.3 px.\n\n**Projection matrix and NDC.** GPUs use a 4×4 perspective matrix that maps the view frustum to normalised device coordinates (NDC) in [−1, 1]³. Depth becomes z_ndc = A − B/d, which is **hyperbolic**: most precision sits near the near plane. With near 0.1 and far 100, half of the depth range is used up by depths 0.1–0.2. That is why z-fighting appears far away and why reversed-Z exists.'),
    LS('Worked numbers', 'The example builds look-at, perspective and intrinsics matrices. A 60° camera that is 480 px tall has f = **415.69 px**. The point (1, 1, 0), seen from the camera, lands at pixel (403.1, 156.9). With near 0.1 and far 100, a point at depth 1 maps to NDC z = **0.8018**, and depths 0.1 to 0.200 use half of the depth range.\n\nTo do it by hand, rotate and translate into camera space, divide x and y by depth, multiply by f and add the principal point.', PX('a_camera')),
    NU('A 1000-px-wide image has f = 500 px. What is its horizontal FOV in degrees?', 90, 'tan(FOV/2) = (W/2)/f = 500/500 = 1, so FOV/2 = 45° and FOV = 90°.', 'Invert f = (W/2)/tan(FOV/2).'),
    MC('Why does z-fighting appear mostly on distant surfaces?', ['perspective depth is hyperbolic, so far depths share very few depth-buffer values', 'distant triangles are smaller', 'the far plane clips them', 'normals are less accurate far away'], 'z_ndc = A − B/d changes quickly near the camera and very slowly far away.', 'Plot z_ndc against d.'),
    GM('focalpx'), GM('projpx'), GM('ndcz')
  ])
]);

unit('u2', 2, 'found', 'rs1', 'Meshes: structure, normals, UVs and file formats', 'How a 3D surface is actually stored: vertex and index buffers, half-edge connectivity and Euler’s formula; face and vertex normals; texture coordinates and barycentric interpolation; and the bytes of OBJ, PLY and glTF read in hex.', [
  lesson('u2l1', 'Vertices, faces, half-edges and Euler’s formula', REF.mesh, [
    LS('Indexed triangle meshes', 'A **triangle mesh** is two arrays:\n\n- **V**: an n×3 float array of vertex positions.\n- **F**: an m×3 integer array; each row lists three indices into V, in counter-clockwise order seen from outside.\n\nSharing vertices through indices saves memory and keeps the surface connected. Edges are implied: each face contributes 3, and in a closed **manifold** mesh every edge is shared by exactly 2 faces, so E = 3F/2.\n\n**Euler’s formula.** For a closed orientable surface, V − E + F = χ = 2 − 2g, where g is the genus (number of handles). A sphere has χ = 2 and a torus has χ = 0. It is a free sanity check for any mesh a model produces: holes, handles or non-manifold junk change χ.\n\n**Half-edge structure.** For editing (subdivision, simplification, remeshing) you need adjacency fast. A half-edge data structure stores each edge twice, once per direction. Each half-edge knows its **twin**, its **next** half-edge around the face, its face and its origin vertex. Walking next → twin → next… circles a vertex in O(valence). The **valence** is the number of edges at a vertex; a regular triangle mesh has valence 6.'),
    LS('Checked in code', '`b_mesh.py` builds a cube (V8, E18, F12, χ = 2) and an icosphere at subdivision level 3 (642 / 1920 / 1280; χ = 642 − 1920 + 1280 = 2). It builds a half-edge table, prints the twins, and walks the one-ring of vertex 0 to find valence 6.\n\nRule of thumb: subdividing a triangle mesh multiplies F and E by 4 each level, and V follows from χ.', PX('b_mesh')),
    NU('A closed triangle mesh has 1280 faces. How many edges?', 1920, 'Each face has 3 edges and each edge is shared by 2 faces: E = 3F/2 = 1920.', 'Count edge–face incidences two ways.'),
    TF('A mesh with V − E + F = 0 can still be a valid closed surface.', true, 'χ = 0 means genus 1: a torus. It is closed and manifold, just with one handle.', 'χ = 2 − 2g.'),
    GM('euler'), GM('icosub')
  ]),
  lesson('u2l2', 'Face and vertex normals', REF.mesh, [
    LS('Two kinds of normal', 'A **face normal** is the normalised cross product (B − A) × (C − A). It is constant over the triangle and gives a faceted look.\n\nA **vertex normal** averages the normals of the faces around a vertex so that shading interpolates smoothly. The weighting matters:\n\n| weighting | idea | trait |\n|---|---|---|\n| uniform | plain average | biased by how the mesh is triangulated |\n| area-weighted | use the unnormalised cross product | big faces dominate |\n| angle-weighted | weight by the corner angle | independent of tessellation (Thürmer & Wüthrich) |\n\nA cube corner shows the difference. Its three faces meet at 90° corners, but the triangulation splits one face into two triangles at that corner. Angle weighting always gives the symmetric (1, 1, 1)/√3, so each component is 0.5774. Uniform and area weighting can be skewed toward a face that was split into more triangles.\n\n**Hard edges.** To keep a crease sharp, duplicate the vertex: one copy per smoothing group, each with its own normal. glTF requires exactly this, because each vertex has one normal.'),
    LS('Checked in code', 'The example computes all three weightings at a cube corner. The angle-weighted normal has each component **0.5774**. On icosphere(3) the vertex normals deviate at most **0.6769°** from the true sphere normal, which is how you measure a normal estimator against ground truth.', PX('b_normals')),
    MC('Which vertex-normal weighting does not change when you retriangulate the faces around a vertex?', ['angle-weighted', 'uniform', 'area-weighted', 'none of them'], 'Splitting a face splits its corner angle, but the angles still add up to the same total, so the weighted sum is unchanged.', 'What is conserved when a face is split?'),
    TF('To render a sharp crease with per-vertex normals, the crease vertices must be duplicated.', true, 'Each vertex stores one normal, so the two sides of the crease need separate copies.', 'One vertex, one normal.')
  ]),
  lesson('u2l3', 'UV coordinates, barycentrics and texture lookup', REF.mesh, [
    LS('Mapping a surface to a picture', 'Each vertex stores a **UV coordinate** (u, v) in [0, 1]² that says where it sits in a 2D texture image. Inside a triangle, any point is P = λ0 A + λ1 B + λ2 C with **barycentric weights** λ_i ≥ 0 that add to 1. The same weights interpolate UVs, normals and colours.\n\n**Computing barycentrics.** Each λ_i is the area of the sub-triangle opposite vertex i, divided by the whole area. Those sub-areas are the **edge functions** that a rasteriser evaluates per pixel (Unit 3).\n\n**Texture lookup.** Multiply UV by the texture size and **bilinearly interpolate** the four nearest texels. For a 2×2 texture holding [[0, 100], [200, 300]], sampling at the centre gives 150.\n\n**Stretch.** If a 1×1 triangle in 3D maps to a 2×1 region in UV, texels are stretched by 2 in one direction. Unwrapping (Unit 4) is the problem of choosing UVs with little stretch and few seams. A **seam** is where the UV map is cut, and its vertices are duplicated with different UVs.'),
    LS('Checked in code', '`b_uv.py` bilinearly samples a small texture (giving 0, 150 and 90 at three test points). It finds the barycentric coordinates of a point (0.25, 0.35, 0.4), interpolates the UV to (0.75, 0.4), and measures the stretch of a distorted UV triangle as the ratio of its singular values: 2.0.', PX('b_uv')),
    GM('baryuv'),
    TF('Barycentric weights of a point inside a triangle are all non-negative and add up to 1.', true, 'They are area ratios of the three sub-triangles, so each is between 0 and 1 and together they make up the whole.', 'Areas are positive.')
  ]),
  lesson('u2l4', 'File formats in bytes: OBJ, PLY and glTF', REF.mesh, [
    LS('Text, binary and GPU-ready', '**OBJ** is plain text: `v x y z`, `vt u v`, `vn x y z`, and `f a/b/c …` with **1-based** indices (an off-by-one trap). It is easy to read but slow, and it has no scene graph or animation.\n\n**PLY** has a text header that declares elements and their types, followed by ASCII or **binary little-endian** data. It is common for point clouds and scans.\n\n**glTF 2.0** is the “JPEG of 3D”: a JSON scene description plus binary buffers laid out exactly as a GPU wants them. The JSON points at **accessors** (type, componentType and count) into **bufferViews** (byte offset and length) into buffers. Component types are GL enums: 5121 = 0x1401 UNSIGNED_BYTE, 5123 = 0x1403 UNSIGNED_SHORT, 5125 = 0x1405 UNSIGNED_INT and 5126 = 0x1406 FLOAT. Index buffers use uint16 whenever there are no more than 65 536 vertices.\n\n**Reading floats in hex.** float32 is 1 sign bit | 8 exponent bits (bias 127) | 23 mantissa bits. So 1.0 = 0x3F800000 and −1.0 = 0xBF800000; only the sign bit differs, which changes the top hex digit by 8. In a little-endian dump, 1.0 appears as the bytes 00 00 80 3F.'),
    LS('Checked in code', '`b_formats.py` writes the same quad as OBJ (**172 bytes**), as binary PLY (**422 bytes**) and as a glTF buffer (**168 bytes**). It hex-dumps the binary data and decodes −1.0 = 0xBF800000. It also confirms that 5123 = 0x1403 and 5126 = 0x1406.', PX('b_formats')),
    GM('f32hex'), GM('hexf32'), GM('hex2vidx'), GM('gltfcomp'), GM('meshbytes')
  ])
]);

unit('u3', 3, 'found', 'op', 'Rasterisation, materials, scenes and skinning', 'How a mesh becomes an image and how it moves: edge-function rasterisation with depth and perspective-correct interpolation; physically based shading with GGX and Fresnel; scene graphs and instancing; and skeletal skinning with LBS and dual quaternions.', [
  lesson('u3l1', 'Rasterisation with edge functions and a z-buffer', REF.rend, [
    LS('How GPUs draw triangles', 'For each triangle:\n\n1. **Project** its vertices to pixels.\n2. For each pixel centre p in the bounding box, evaluate three **edge functions** e_i(p) = (b − a) × (p − a), the 2D cross product along each edge. The pixel is inside when all three have the same sign. Normalised, the e_i are the **barycentric weights**.\n3. **Depth test**: interpolate depth, compare with the z-buffer, and keep the nearest.\n4. **Perspective-correct interpolation**: attributes are linear in 3D, not on screen. Interpolate attr/w and 1/w, then divide.\n\nThe **top-left fill rule** makes pixels on a shared edge belong to exactly one triangle, so meshes are watertight with no double blending (`m_raster_arm.c` in Unit 20 proves it in fixed point).\n\n**Back-face culling** skips triangles whose screen-space winding is clockwise, which saves about half the work on closed meshes. Get the winding wrong and the mesh vanishes. That really happened while this example was being written, which is why it has a `cull` switch.\n\nWhy this matters for AI: rasterisation is **not differentiable** with respect to vertex positions, because coverage is a step function. Unit 10 fixes that.'),
    LS('Checked in code', '`c_raster.py` rasterises an icosphere as ASCII art: **496 pixels** and **98 of 320** faces visible after culling and the depth test. On a perspective quad, the middle row gets the perspective-correct v = **0.24**, not the 0.5 that naive screen-space interpolation would give.', PX('c_raster')),
    MC('Perspective-correct texture interpolation interpolates…', ['attribute/w and 1/w linearly on screen, then divides', 'the attribute linearly on screen', 'only depth', 'the attribute in NDC'], 'Projection divides by w, so quantities linear in 3D become linear on screen only after dividing by w.', 'What is linear on screen?'),
    TF('Rasterised pixel coverage gives useful gradients with respect to vertex positions.', false, 'Coverage jumps from 0 to 1 as an edge crosses a pixel centre. The derivative is zero almost everywhere and undefined at the jump.', 'Step functions.')
  ]),
  lesson('u3l2', 'Physically based materials: Lambert, GGX and Fresnel', REF.rend, [
    LS('The microfacet BRDF', 'A **BRDF** f(l, v) says how much light arriving from direction l leaves toward v. The standard real-time and film model is **diffuse + Cook-Torrance specular**:\n\nf = k_d/π + D·G·F / (4 (n·l)(n·v))\n\nThe outgoing radiance is f × light × (n·l).\n\n| term | meaning | typical form |\n|---|---|---|\n| D | how many microfacets face the half-vector h | GGX: α²/(π((n·h)²(α² − 1) + 1)²) |\n| G | shadowing and masking of microfacets | Smith–Schlick, k = α/2 |\n| F | Fresnel reflectance | Schlick: F0 + (1 − F0)(1 − cos θ)^5 |\n\n**Parameters artists and material-estimation networks predict:** albedo (base colour), roughness (α = roughness²), metallic, and F0 (about 0.04 for dielectrics and the base colour for metals).\n\n**Energy checks.** D must integrate to 1 over the hemisphere when weighted by n·h. Fresnel rises to 1 at grazing angles, which is why wet roads mirror the sky.'),
    LS('Checked in code', '`c_pbr.py` numerically integrates GGX D·(n·h) over the hemisphere and gets **1.00000**. Schlick Fresnel with F0 = 0.04 at a grazing angle gives **0.783**. Unit 16 inverts this model: given photos, recover albedo and roughness.', PX('c_pbr')),
    GM('schlick'),
    MC('Roughness in a GGX material mainly controls…', ['how widely the specular highlight spreads', 'the base colour', 'the index of refraction only', 'shadow length'], 'α sets the width of the microfacet distribution D: low roughness gives a tight, bright highlight and high roughness a broad, dim one.', 'Which term contains α?')
  ]),
  lesson('u3l3', 'Scene graphs and instancing', REF.math, [
    LS('Hierarchies of transforms', 'A **scene graph** is a tree in which each node has a local transform, and its world transform is parent_world × local. To move a car you move one node, and the wheels follow. A hubcap’s world position is the product of car × wheel × hubcap matrices.\n\n**Instancing** stores one mesh and many transforms. A forest of 1000 trees that share one 50 000-vertex mesh stores the geometry once plus 1000 matrices of 64 bytes each.\n\nglTF stores exactly this tree, with nodes, meshes, skins and cameras. Generative 3D models that output whole scenes, such as a room layout, often predict a scene graph of object nodes rather than one giant mesh.'),
    LS('Checked in code', '`c_scene.py` walks a car → wheel → hubcap hierarchy and finds the hubcap at world position **(12.9, 0.3, −1)**. It compares 1000 trees stored as copies (**600 MB**) with instancing (**0.064 MB** of matrices plus one mesh).', PX('c_scene')),
    TF('In a scene graph, a child’s world matrix is the parent’s world matrix times the child’s local matrix.', true, 'world_child = world_parent · local_child, applied from the root downward.', 'Compose down the tree.')
  ]),
  lesson('u3l4', 'Skinning: LBS and dual quaternions', REF.anim, [
    LS('Bones move skin', 'A rigged character has a **skeleton** (a hierarchy of joints) and **skin weights**: each vertex has weights w_j, summing to 1, for a few bones.\n\n**Linear blend skinning (LBS):** v′ = Σ_j w_j M_j v, where M_j moves bone j from its rest pose to its current pose. It is fast and on every GPU, but it **averages matrices**, and an average of rotations is not a rotation. Near a twisting or bending joint the blended matrix shrinks the skin. This is the “candy-wrapper” or collapsing-elbow artefact.\n\n**Dual-quaternion skinning (DQS)** blends rigid transforms as unit dual quaternions and renormalises. The blend stays rigid, so volume is kept, at the cost of a slight bulge.\n\nUnit 17 learns weights automatically, and `k_rig.py` shows smooth weights spreading the bend.'),
    LS('Checked in code', '`c_skin.py` bends an elbow of radius 0.4. Under LBS the joint thins to **0.283** at 90° and **0.104** at 150°. DQS keeps it at **0.400**. The 50/50 LBS-blended rotation matrix has determinant **0.5**, which is not a rotation, and that is the cause.', PX('c_skin')),
    GM('lbsblend'),
    MC('Why does LBS lose volume at a bent joint?', ['a weighted average of rotation matrices is not a rotation and shrinks vectors', 'the weights do not sum to 1', 'bones have no length', 'normals are not updated'], 'Blending the 0° and 90° matrices 50/50 gives a matrix with determinant 0.5. Points on the skin get pulled toward the joint.', 'Compute the determinant of the blend.')
  ])
]);
})();

/* ---- lern2model3d/l02.js — Part 2: classical geometry. Unit 4 subdivision, simplification, smoothing, remeshing, unwrapping; Unit 5 implicit surfaces, CSG, marching cubes, Poisson ---- */
(function () {
const { REF, LS, MC, TF, NU, unit, lesson, PX } = CG.H;
const GM = id => GEN.make(id);

unit('u4', 4, 'classic', 'rs2', 'Geometry processing: subdivide, simplify, smooth, remesh, unwrap', 'The classical toolbox that every 3D AI pipeline still calls before and after the network: Catmull–Clark subdivision, quadric-error simplification, Laplacian and Taubin smoothing, isotropic remeshing, and UV unwrapping with Tutte, harmonic and LSCM maps.', [
  lesson('u4l1', 'Catmull–Clark subdivision', REF.geo, [
    LS('Smooth surfaces from a coarse cage', '**Subdivision** refines a coarse **control cage** into a smooth limit surface. Catmull–Clark (1978) works on quads. Each round:\n\n1. **Face point**: the average of the face’s vertices.\n2. **Edge point**: the average of the edge’s two endpoints and the two adjacent face points.\n3. **Moved vertex**: (F + 2R + (n − 3)P)/n, where F is the average of the adjacent face points, R the average of the adjacent edge midpoints, P the old position, and n the valence.\n4. Connect each face point to its edge points, so every n-gon becomes n quads.\n\nAfter one round every face is a quad. Vertices of valence other than 4 (**extraordinary vertices**) remain, and the limit surface is C² everywhere except C¹ at them.\n\n**Counting.** For a closed quad mesh, each level gives F′ = 4F, E′ = 2E + 4F and V′ = V + E + F. Subdivision surfaces are how film assets and many generated meshes are made smooth, and why mesh generators (Unit 13) can output low-poly cages.'),
    LS('Walk-through: one cube corner', 'Take the corner (1, 1, 1) of the cube [−1, 1]³. Its 3 face points are (1, 0, 0), (0, 1, 0) and (0, 0, 1), whose average has each coordinate 1/3. Its 3 edge midpoints, such as (1, 1, 0), average to 2/3 per coordinate. With n = 3, the new corner is (1/3 + 2·2/3 + 0·1)/3 = **5/9 = 0.5556** per coordinate.\n\nThe code confirms 0.5556 and continues: the corner converges toward 0.500, V goes 8 → 26 → 98 → 386 → 1538, and the volume shrinks from 8 to 2.63. The limit surface lies **inside** the cage.', PX('d_catmull')),
    GM('ccverts'),
    TF('Catmull–Clark subdivision interpolates the original control vertices.', false, 'It approximates: vertices move (the corner went from 1 to 0.5556) and the limit surface shrinks inside the cage.', 'Did the corner stay at (1, 1, 1)?')
  ]),
  lesson('u4l2', 'Simplification with quadric error metrics', REF.geo, [
    LS('Garland–Heckbert QEM', 'Generated meshes from marching cubes often have hundreds of thousands of triangles. **Simplification** collapses edges until a budget is met. The question is which edge to collapse and where to put the merged vertex.\n\n**Quadric error.** A plane n·x + d = 0 defines a 4×4 matrix K = ppᵀ with p = (n, d). The squared distance from x to the plane is x̃ᵀ K x̃, with x̃ = (x, 1). Each vertex sums the quadrics of its incident faces into Q. Collapsing edge (i, j) gives Q = Q_i + Q_j. The best position solves a 3×3 linear system, and its cost is the error. Keep a priority queue of costs and collapse the cheapest edge first.\n\n**Why it works.** Flat regions have small cost because many planes agree, so they lose triangles first. Corners and creases have high cost, so they keep detail.\n\n**Walk-through.** For the plane z = 1, p = (0, 0, 1, −1). At (0, 0, 3), x̃ = (0, 0, 3, 1), p·x̃ = 2, and the squared distance is **4**.'),
    LS('QEM vs a naive rule', 'On an icosphere with 5120 faces, QEM reduced to 120 faces keeps vertices within **0.0317** of the sphere, with a surface error of 0.0155 and volume 4.0148 (exact 4.1888). Collapsing the shortest edge to its midpoint, with the same budget, has a 3.4× higher surface error (**0.0528**) and loses far more volume (3.5573). Euler’s formula holds (χ = 2) throughout.', PX('d_qem')),
    NU('Using the plane quadric for z = 1, what is the squared distance of (0, 0, 3)?', 4, 'p = (0, 0, 1, −1) and p·(0, 0, 3, 1) = 2. Squaring gives 4.', 'Distance first, then square it.'),
    MC('In QEM, which regions lose triangles first?', ['flat regions, where the summed plane quadrics are nearly zero', 'sharp corners', 'boundaries', 'random regions'], 'Moving a vertex inside a flat region keeps it on all its planes, so the cost is near 0.', 'What costs nothing?')
  ]),
  lesson('u4l3', 'Smoothing, curvature and remeshing', REF.geo, [
    LS('Laplacians', 'The **uniform Laplacian** L(v) = mean(neighbours) − v points toward the average of a vertex’s neighbours. Smoothing does v ← v + λ L(v).\n\n- **Problem**: it shrinks the surface, and it also flattens mesh irregularity rather than geometry.\n- **Taubin λ|μ smoothing** alternates a positive step λ with a negative step μ (|μ| > λ). Low-pass filtering without shrinkage.\n- **Cotangent Laplacian**: the weights (cot α + cot β)/2 depend on angles, so it measures **true geometry**. Dividing by the vertex area gives the mean-curvature normal 2H n. On a unit sphere, 2H = 2.\n- **Implicit (backward Euler) smoothing** solves (I − tL) v′ = v and stays stable at huge steps.\n\n**Isotropic remeshing.** For a target length L: split edges longer than 4/3 L, collapse those shorter than 4/5 L, flip edges to make valences nearer 6, smooth tangentially, and project back to the surface. Repeat. Many generative pipelines run this after marching cubes because networks (and artists) prefer even triangles.'),
    LS('Checked in code', 'Ten uniform steps reduce the roughness of a noisy sphere from 0.0238 to 0.0046 but **shrink** the mean radius to 0.9427. Taubin gives roughness 0.0093 at radius **1.0009**. The cotan Laplacian divided by area gives a mean of **2.0012** (exact 2). Splitting alone caps the longest edge (0.812 → 0.333), but the max/min ratio grows to 4.83, which is why collapses are the other half of the loop.', PX('d_remesh')),

    LS('Checked in code', 'On a 608-face patch with a zig-zag boundary (χ = 1, a disc): Tutte has 0 flips and a mean angle ratio of 2.276. Harmonic is similar (2.233). **LSCM** keeps the mean angle ratio at **1.046** (max 1.124), with area ratios from 0.53 to 2.35. Forcing the zig-zag cut onto a circle is what creates the worst Tutte triangles.', PX('d_unwrap')),
    MC('Which property does Tutte’s embedding guarantee?', ['no flipped triangles when the boundary is convex', 'zero angle distortion', 'zero area distortion', 'no seams'], 'Positive weights and a convex boundary give a bijective map. Distortion can still be large.', 'Bijectivity, not quality.'),

unit('u5', 5, 'classic', 'f3', 'Implicit surfaces, CSG, marching cubes and Poisson reconstruction', 'Shapes as functions: signed distance fields and their algebra, constructive solid geometry, extracting meshes with marching cubes, and reconstructing watertight surfaces from scanned points. Every neural field in Part 4 builds on these ideas.', [
  lesson('u5l1', 'Signed distance fields and CSG', REF.impl, [
    LS('Shapes as functions', 'An **implicit surface** is the zero set of a function f: ℝ³ → ℝ. A **signed distance field (SDF)** has f(x) = ± the distance to the surface, negative inside, with |∇f| = 1 almost everywhere.\n\n| primitive | SDF |\n|---|---|\n| sphere, radius r | ‖x‖ − r |\n| box, half-size b | ‖max(q, 0)‖ + min(max(q_x, q_y, q_z), 0), where q = |x| − b |\n| torus R, r | ‖(‖x_xz‖ − R, y)‖ − r |\n\n**CSG** (constructive solid geometry) by pointwise operations:\n\n- union = min(a, b)\n- intersection = max(a, b)\n- difference = max(a, −b)\n- smooth union: polynomial smooth-min with blend radius k\n\nThe results are **bounds**, not exact distances, so |∇f| can drop below 1. Sphere tracing (Unit 11) must step conservatively.\n\n**Why it matters for AI.** DeepSDF, NeuS and many shape-editing systems output an SDF, and editing becomes arithmetic on fields (the capstone editor does exactly this).'),
    LS('Checked in code', 'Voxel volumes match the exact values: sphere 4.1992 vs 4.1888, box 2.6826 vs 2.744. Inclusion–exclusion |A| + |B| − |A ∩ B| = |A ∪ B| = **4.2675** checks out. A smooth union grows with k (1.7749 → 1.9016). The gradient of the difference field is as low as 0.025, so it is only a bound.', PX('e_csg')),
    GM('csgsdf'),
    TF('max(a, b) of two SDFs is an exact SDF of the intersection.', false, 'It gives the right sign and zero set, but distances near corners are only bounds; |∇f| = 1 can fail.', 'Check |grad| in the output.')
  ]),
  lesson('u5l2', 'Marching cubes', REF.impl, [
    LS('From field to mesh', '**Marching cubes** (Lorensen & Cline, 1987) turns a sampled field into triangles:\n\n1. For each grid cell, read the field at its 8 corners and compare with the iso value. That gives an 8-bit **case index**, with bit i set when corner i is inside: 256 cases.\n2. A lookup table lists which cell edges the surface crosses and how to join them into triangles.\n3. Place each vertex on its edge by **linear interpolation**: t = (iso − f_p)/(f_q − f_p).\n\n**Symmetry.** The cube’s 24 rotations together with inside/outside complement reduce the 256 cases to **15** classes. Some cases are **ambiguous** (a face with diagonal corners inside): naive tables leave cracks between cells. Marching tetrahedra or the asymptotic decider fix this.\n\n**Case index in binary.** Corners 0, 1 and 4 inside gives 0b00010011 = 0x13 = 19. Binary practice pays off here.\n\nEvery neural field (DeepSDF, occupancy, NeuS, TripoSR) uses marching cubes to make a mesh at the end. Its resolution sets the detail and cost (vertices grow about 4× when the grid doubles).'),

    GM('mcedge'), GM('mccase'),
    NU('A cell edge has f_p = −0.2 and f_q = 0.6 with iso 0. At what t along the edge is the vertex?', 0.25, 't = (0 − (−0.2))/(0.6 − (−0.2)) = 0.2/0.8 = 0.25.', 'Linear interpolation to zero.')
  ]),
  lesson('u5l3', 'Poisson surface reconstruction', REF.impl, [
    LS('From oriented points to a watertight surface', 'Scanners and multi-view stereo give **points with normals**, with holes and noise. Poisson reconstruction (Kazhdan et al., 2006) finds an **indicator function** χ (1 inside, 0 outside) whose gradient best matches the normal field V:\n\nmin ‖∇χ − V‖² ⟹ Δχ = ∇·V\n\nThat is a sparse linear **Poisson equation**. Solve it, then extract the iso-surface at the mean χ at the sample points with marching cubes.\n\n**Traits.** It is global, so it closes holes smoothly and is robust to noise. It needs consistently oriented normals (from PCA plus propagation, Unit 7). Screened Poisson adds a term that pulls the surface toward the points. It is still a baseline for many 3D datasets (Unit 19) and for converting point clouds made by models into meshes.'),
    LS('Checked in code', 'The example solves a 2D version on a 96² grid with **9216 unknowns** and a residual of 5.44e−12. The reconstructed curve has area 2.0942 vs a true 2.1088 (0.69% error). In the middle of the data gap, the reconstruction still has the right inside/outside answer along a ray: the hole is closed.', PX('e_poisson')),
    MC('Poisson reconstruction needs as input…', ['points with consistently oriented normals', 'a triangle mesh', 'only unoriented points', 'images'], 'The normals form the vector field whose divergence drives the equation.', 'What is V?')

unit('u6', 6, 'ml', 'imm', 'Autograd, MLPs, optimisers and attention from scratch', 'The engine under every model in this course. `ag.py` is a reverse-mode autodiff library written here in NumPy; you will see how it works, check it with finite differences, train MLPs with SGD and Adam, and build a transformer block.', [
  lesson('u6l1', 'Reverse-mode automatic differentiation', REF.ml, [
    LS('The chain rule as a graph', 'Every computation is a **graph** of primitive operations. **Reverse mode** (backpropagation):\n\n1. **Forward pass**: compute each node’s value and remember its inputs.\n2. **Backward pass**: seed df/df = 1 and walk the graph in reverse topological order. Each node adds (its upstream gradient) × (its local derivative) into each input’s `.grad`. When a value is used twice, the gradients **add**.\n\n**Cost.** One backward pass gives the gradient with respect to **all** parameters, for about 2–3× the cost of the forward pass. Forward mode would need one pass per input. That asymmetry is why deep learning is possible.\n\n**Gradcheck.** Compare with central differences (f(x + h) − f(x − h))/2h and report the relative error. In float64, about 1e−7 or smaller means correct. Every training example in this course gradchecks first.\n\n**Walk-through.** f = (xy + sin x)² at x = 2, y = 3. a = 6, b = sin 2 = 0.9093, c = 6.9093 and f = 47.738. df/dc = 2c = 13.819. df/dx = 13.819 × (y + cos x) = 13.819 × (3 − 0.416) = **35.705**. df/dy = 13.819 × x = **27.637**.'),
    LS('Checked in code', 'Manual backward, `ag.py` and central differences agree on df/dx = 35.7052 and df/dy = 27.6372. A gradcheck over the whole MLP gives a maximum relative error of **4.75e−9**. Gradients also reach the **input points**, which is how later units optimise geometry itself.', PX('f_autograd')),
    NU('f = (xy)² at x = 1, y = 2. What is df/dx?', 8, 'f = x²y², so df/dx = 2xy² = 2 × 1 × 4 = 8.', 'Chain rule: 2(xy) · y.'),
    TF('When a value feeds two later operations, its gradient is the sum of the two contributions.', true, 'The multivariable chain rule sums over every path from the value to the output.', 'Two paths.')
  ]),
  lesson('u6l2', 'MLPs, losses, SGD and Adam', REF.ml, [
    LS('Fitting a field with an MLP', 'A **multi-layer perceptron** alternates linear layers W x + b with non-linearities (ReLU, GELU, softplus, sin). With d_in → h → h → d_out, the parameter count is Σ (fan_in + 1) × fan_out.\n\n**Initialisation.** He init (Var w = 2/fan_in) keeps activations from vanishing or exploding through ReLU layers.\n\n**Losses.** MSE for regression (SDF values, colours), binary cross-entropy for occupancy, and cross-entropy for tokens.\n\n**Optimisers.**\n\n- **SGD**: θ ← θ − lr·g. It is sensitive to the learning rate.\n- **Adam**: keep moving averages m (β1 = 0.9) and v (β2 = 0.999) of g and g², bias-correct them, then step lr·m̂/(√v̂ + ε). Per-parameter step sizes make it robust and the default for fields, NeRFs and diffusion. Its memory cost is 2 extra floats per parameter (Unit 20).\n\n**Walk-through of Adam step 1.** With g = 0.5: m = 0.05 and v = 0.00025. Bias-correcting gives m̂ = 0.5 and v̂ = 0.25. The step is lr × 0.5/0.5 = lr. So **the first Adam step has size ≈ lr whatever the gradient’s scale**.'),
    LS('Checked in code', 'An MLP learns the SDF of a 2D shape from 256 points per step. SGD at lr 0.01 reaches a test MSE of 0.0050 and 89.6% correct inside/outside. Adam at lr 0.001 reaches **0.00002** and **99.7%**. Same model, same data; the optimiser matters.', PX('f_mlp')),
    GM('mlpparams'), GM('adamstep'),
    MC('Why is the first Adam step about lr in size whatever the gradient’s magnitude?', ['after bias correction, m̂/√v̂ = g/|g| at step 1', 'Adam clips gradients', 'lr is rescaled by the batch size', 'β1 = 0'], 'm̂ = g and v̂ = g², so the ratio is ±1.', 'Bias-correct both moments.')
  ]),
  lesson('u6l3', 'Attention and transformer blocks', REF.ml, [
    LS('Attention for sets of points and tokens', 'Self-attention: Q = XW_q, K = XW_k, V = XW_v, and out = softmax(QKᵀ/√d)V. Each token mixes information from all others, weighted by similarity.\n\n**Permutation.** Attention without positional encoding is **permutation-equivariant**: shuffling the inputs shuffles the outputs in the same way. Pooling afterwards makes it **invariant**. That is exactly what point clouds need (Point Transformer, Unit 7) and what mesh-token generators deliberately break with position embeddings (Unit 13).\n\n**A transformer block** is x + Attn(LN(x)) followed by x + MLP(LN(x)), with the MLP 4× wide. Parameters ≈ **12d²**.\n\n**Cost.** The attention matrix is N²: 16 384 tokens is 268 M entries, 537 MB in fp16 per head. Flash attention (Unit 20) avoids storing it.'),

unit('u7', 7, 'ml', 'rd', 'Deep learning on 3D data: points, voxels, meshes and graphs', 'How networks read 3D: PointNet’s symmetric functions, PointNet++ and DGCNN local grouping, voxel CNNs and why sparse convolution exists, MeshCNN on edges, and message-passing GNNs that simulate physics on meshes.', [
  lesson('u7l1', 'PointNet: learning on unordered sets', REF.geo, [
    LS('A symmetric function', 'A point cloud is a **set**: the order of its N points is meaningless. PointNet (Qi et al., 2017):\n\n1. Apply the **same** MLP to every point independently (a shared 1×1 conv).\n2. **Max-pool** over points to get one global feature vector, which is a symmetric function and so order-invariant.\n3. Classify it with an MLP, or concatenate it back onto per-point features for segmentation (Unit 15).\n\n**Critical points.** Only points that win the max in at least one channel affect the output. They form a skeleton of the shape, which makes PointNet robust to dropping points.\n\n**Weakness.** No local context: every point is processed alone until the global max. PointNet++ fixes this.'),
    LS('Trained from scratch', 'On 5 shape classes (sphere, box, cylinder, torus, cone) with 128 points each, the test accuracy is **100%** by epoch 12 and the confusion matrix is diagonal. Shuffling a cloud changes the logits by exactly 0. Only **44 of 128** points are critical, and classifying with just those gives the same answer. Dropping half the points leaves 100% of the predictions unchanged.', PX('g_pointnet')),
    GM('pnparams'),
    MC('What makes PointNet invariant to point order?', ['a symmetric max-pool over points after a shared per-point MLP', 'sorting the points', 'positional encoding', 'a recurrent network'], 'max is the same for any ordering of its inputs.', 'Symmetric functions.')
  ]),

    LS('Local neighbourhoods', '**PointNet++** builds a hierarchy:\n\n- **Farthest point sampling (FPS)** picks centroids, each the point farthest from those already chosen, for even coverage.\n- **Ball query** groups up to k neighbours within radius r around each centroid.\n- A **mini-PointNet** on each group’s local coordinates gives a feature per centroid. Repeat with fewer centroids and bigger radii.\n- For segmentation, **feature propagation** interpolates back with inverse-distance weights over the 3 nearest neighbours.\n\n**DGCNN** builds a k-NN graph in feature space and applies **EdgeConv**: an MLP on (x_i, x_j − x_i), max-pooled over neighbours.\n\n**Normals from PCA.** The smallest-eigenvalue eigenvector of a neighbourhood’s covariance is the normal (with sign ambiguity). This feeds Poisson reconstruction (Unit 5).'),
    LS('Checked in code', 'FPS covers a cloud far better than random sampling: with 128 centroids the covering radius is 0.1596 vs 0.3012. Ball query finds a mean of 31.9 of 32 neighbours. PCA normals have a mean error of **3.80°**. DGCNN edge features have shape (128, 16, 6).', PX('g_pointnet2')),
    TF('Farthest point sampling gives more even coverage than random sampling with the same number of points.', true, 'Its covering radius was about half that of random sampling at every size.', 'Compare the covering radii.')

  lesson('u7l3', 'Voxels, sparse convolution and octrees', REF.rep, [
    LS('The cost of a dense grid', 'A **voxel grid** at resolution R has R³ cells, so it is simple, regular and CNN-friendly. But a surface occupies only about R² of them: the **surface fraction** falls like 1/R (6.8% at 16³, 0.97% at 128³ for a torus).\n\n- A dense 3×3×3 conv from 32 to 64 channels at 128³ costs **116 GMACs**.\n- **Sparse convolution** (MinkowskiEngine, spconv) computes only at occupied cells, about 2% of them, for about 2.3 GMACs.\n- **Octrees** subdivide only cells that contain surface: 48 201 nodes vs 2.1 M dense cells (43.5× smaller).\n\n**Memory in bytes.** A dense uint8 occupancy grid at 256³ is 16.8 MB; a float32 grid with 32 channels at 128³ is 268 MB. The voxbytes generator drills this arithmetic.'),
    LS('Checked in code', 'Voxelising a torus at 16³ to 128³ gives a volume estimate of 0.7410 vs the exact 2π²Rr² = **0.7402**. A 3D Laplacian responds only at the 2608 boundary voxels. The example also prints the dense-vs-sparse GMAC table and the octree node count.', PX('g_voxel')),
    GM('voxbytes'),
    NU('A dense float32 voxel grid at 64³ with 1 channel: how many MiB (2²⁰ bytes)?', 1, '64³ = 262 144 cells × 4 bytes = 1 048 576 bytes = 1 MiB.', 'R³ × bytes.')
  ]),
  lesson('u7l4', 'Learning on meshes: MeshCNN and graph networks', REF.geo, [
    LS('Edges and messages', '**MeshCNN** treats **edges** as the units. Each edge has 5 features (the dihedral angle, two inner angles and two edge-length ratios) that do not change under rotation, translation or uniform scale. Its convolution uses the 4 neighbouring edges in a symmetric way (sums and absolute differences), so it does not depend on which face is called first. **Pooling** collapses edges, which is a learned simplification.\n\n**Message-passing GNNs** (MeshGraphNets) update node features from messages along edges: m_ij = MLP(h_i, h_j, x_j − x_i), then h_i ← h_i + MLP(h_i, Σ m_ij). Using relative positions makes them translation-invariant. They learn physics such as cloth or heat on meshes, but **rollout errors compound**, so training adds noise.'),

unit('u8', 8, 'rep', 'op', 'Neural fields: positional encoding, DeepSDF and occupancy networks', 'Replacing grids with functions: why plain MLPs are blurry and how Fourier features and SIREN fix it, auto-decoded shape codes in DeepSDF, and encoder-conditioned occupancy networks, all trained here on a CPU.', [
  lesson('u8l1', 'Choosing a representation', REF.rep, [
    LS('The five families', 'Every 3D AI system first picks how shapes are stored. Each choice decides what the network can output, how it is rendered, and what it costs:\n\n| representation | stores | strengths | weaknesses |\n|---|---|---|---|\n| mesh | vertices + faces | compact, editable, GPU-native, the final deliverable | fixed topology, hard to generate |\n| point cloud | N×3 points | what scanners give; easy to generate | no surface, no connectivity |\n| voxels | R³ grid | regular, CNN-friendly | memory grows as R³ |\n| implicit / neural field | f(x) → SDF, occupancy or density | any topology, any resolution | needs marching cubes; slow to query |\n| Gaussians | per-splat mean, covariance, opacity, colour | real-time rendering, fast to fit | weak geometry, large files |\n\nIn practice, production systems often combine them: a triplane or latent set generates a field, marching cubes makes a mesh, and the mesh is remeshed and textured.'),

  lesson('u8l2', 'Spectral bias and positional encoding', REF.field, [
    LS('Why MLPs are blurry', 'A ReLU MLP fed raw coordinates learns **low frequencies first** and struggles with fine detail. This is **spectral bias**.\n\n**Fourier features.** Map x to γ(x) = (x, sin 2⁰πx, cos 2⁰πx, …, sin 2^{L−1}πx, cos 2^{L−1}πx). Each input dimension becomes 1 + 2L dimensions. NeRF uses L = 10 for position (3 → 63) and L = 4 for direction (3 → 27).\n\n**SIREN** uses sin activations with a carefully scaled first layer (ω₀ = 30).\n\n**The trade-off.** Higher frequencies fit detail but **overfit** between samples: too large an L makes interpolation noisy. Hash grids (Unit 9) offer a learned, local alternative.'),
