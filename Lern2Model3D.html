 cost = np.einsum('ei,eij,ej->e', opt, Qe, opt)\n        if mode == 'short':                                       # baseline: shortest edge, collapse to midpoint\n            cost = np.linalg.norm(V[E[:, 0]] - V[E[:, 1]], axis=1); opt[:, :3] = (V[E[:, 0]] + V[E[:, 1]]) / 2\n        # collapse a batch of cheapest edges that do not share vertices (independent set) for speed\n        order = np.argsort(cost); used = np.zeros(len(V), bool); n_col = 0\n        for e in order[:max(1, (len(F) - target) // 8)]:\n            a, b = E[e]\n            if used[a] or used[b]: continue\n            used[a] = used[b] = True; V[a] = opt[e, :3]; Q[a] += Q[b]; alive[b] = False; F[F == b] = a; n_col += 1\n        F = F[(F[:, 0] != F[:, 1]) & (F[:, 1] != F[:, 2]) & (F[:, 2] != F[:, 0])]\n    return V, F, alive\nV, F = m3d.icosphere(4)\nprint('input: V=%d F=%d area %.4f volume %.4f (sphere: 12.5664 / 4.1888)' % (len(V), len(F), m3d.area(V, F), m3d.volume(V, F)))\nfor target in (2000, 500, 120):\n    V2, F2, al = simplify(V, F, target)\n    used = np.unique(F2); r = np.linalg.norm(V2[used], axis=1)\n    S = m3d.sample_surface(V2, F2, 20000, np.random.default_rng(1)); rs = np.abs(np.linalg.norm(S, axis=1) - 1)\n    print('QEM -> F=%4d V=%4d  vertex |r-1| max %.4f  surface-sample |r-1| mean %.4f  volume %.4f  euler %d' % (len(F2), len(used), np.abs(r - 1).max(), rs.mean(), m3d.volume(V2, F2), len(used) - len(m3d.edges(F2)) + len(F2)))\nV2, F2, _ = simplify(V, F, 120, 'short'); used = np.unique(F2); r = np.linalg.norm(V2[used], axis=1)\nS = m3d.sample_surface(V2, F2, 20000, np.random.default_rng(1)); rs = np.abs(np.linalg.norm(S, axis=1) - 1)\nprint('shortest-edge midpoint -> F=%4d  vertex |r-1| max %.4f  surface-sample |r-1| mean %.4f  volume %.4f' % (len(F2), np.abs(r - 1).max(), rs.mean(), m3d.volume(V2, F2)))\nprint('QEM places each new vertex where the summed squared plane distances are smallest, so the surface error and volume loss stay low.')\nprint('quadric of one plane z=1 evaluated at (0,0,3): squared distance =', np.r_[0, 0, 3, 1] @ np.outer([0, 0, 1, -1], [0, 0, 1, -1]) @ np.r_[0, 0, 3, 1])", "out": "input: V=2562 F=5120 area 12.5514 volume 4.1797 (sphere: 12.5664 / 4.1888)\nQEM -> F=2000 V=1002  vertex |r-1| max 0.0015  surface-sample |r-1| mean 0.0013  volume 4.1734  euler 2\nQEM -> F= 500 V= 252  vertex |r-1| max 0.0074  surface-sample |r-1| mean 0.0040  volume 4.1425  euler 2\nQEM -> F= 120 V=  62  vertex |r-1| max 0.0317  surface-sample |r-1| mean 0.0155  volume 4.0148  euler 2\nshortest-edge midpoint -> F= 120  vertex |r-1| max 0.0308  surface-sample |r-1| mean 0.0528  volume 3.5573\nQEM places each new vertex where the summed squared plane distances are smallest, so the surface error and volume loss stay low.\nquadric of one plane z=1 evaluated at (0,0,3): squared distance = 4"}, "d_remesh": {"lang": "py", "file": "d_remesh.py", "src": "# d_remesh.py: Laplacian smoothing (uniform vs cotangent), shrinkage and Taubin's fix, then isotropic remeshing by splitting long edges.\nimport numpy as np, m3d\ndef cotan_L(V, F):\n    n = len(V); L = np.zeros((n, n))\n    for k in range(3):\n        i, j, o = F[:, k], F[:, (k + 1) % 3], F[:, (k + 2) % 3]\n        u, v = V[i] - V[o], V[j] - V[o]; cot = (u * v).sum(1) / np.linalg.norm(np.cross(u, v), axis=1)\n        np.add.at(L, (i, j), cot / 2); np.add.at(L, (j, i), cot / 2)\n    L -= np.diag(L.sum(1)); return L\ndef uniform_L(V, F):\n    n = len(V); A = np.zeros((n, n)); E = m3d.edges(F); A[E[:, 0], E[:, 1]] = A[E[:, 1], E[:, 0]] = 1\n    return A / A.sum(1, keepdims=True) - np.eye(n)\nrng = np.random.default_rng(0)\nV0, F = m3d.icosphere(3); Vn = V0 + 0.03 * rng.standard_normal(V0.shape)\nerr = lambda V: np.abs(np.linalg.norm(V, axis=1) - np.linalg.norm(V, axis=1).mean()).mean()\nprint('noisy sphere: roughness %.4f  mean radius %.4f' % (err(Vn), np.linalg.norm(Vn, axis=1).mean()))\nLu = uniform_L(Vn, F)\nV = Vn.copy()\nfor it in range(10): V = V + 0.5 * (Lu @ V)\nprint('uniform Laplacian x10 (lambda .5): roughness %.4f  mean radius %.4f  <- shrinks' % (err(V), np.linalg.norm(V, axis=1).mean()))\nV = Vn.copy()\nfor it in range(10): V = V + 0.5 * (Lu @ V); V = V - 0.53 * (Lu @ V)\nprint('Taubin lambda|mu x10:             roughness %.4f  mean radius %.4f  <- no shrink' % (err(V), np.linalg.norm(V, axis=1).mean()))\nLc = cotan_L(V0, F)\nAv = np.zeros(len(V0)); fa = 0.5 * np.linalg.norm(m3d.face_normals(V0, F, unit=False), axis=1)\nfor k in range(3): np.add.at(Av, F[:, k], fa / 3)               # barycentric vertex area\nk = np.linalg.norm(Lc @ V0, axis=1) / Av\nprint('cotan Laplacian / vertex area on the unit sphere = 2H: mean %.4f std %.4f (exact 2); it measures curvature, the uniform one only measures mesh irregularity' % (k.mean(), k.std()))\n# implicit (backward Euler) smoothing: (I - t L) V' = V, unconditionally stable\nV = np.linalg.solve(np.eye(len(Vn)) - 5.0 * Lu, Vn)\nprint('implicit step t=5:                roughness %.4f  mean radius %.4f' % (err(V), np.linalg.norm(V, axis=1).mean()))\n# isotropic remeshing ingredient: split every edge longer than 4/3 target on a stretched mesh\nV, F = m3d.icosphere(2); V = V * [2.5, 1, 1]\ndef lengths(V, F): E = m3d.edges(F); return np.linalg.norm(V[E[:, 0]] - V[E[:, 1]], axis=1)\nl = lengths(V, F); target = 0.25\nprint('stretched sphere: edges %d, length min %.3f max %.3f, max/min %.2f' % (len(l), l.min(), l.max(), l.max() / l.min()))\nfor rnd in range(3):\n    E = m3d.edges(F); L = np.linalg.norm(V[E[:, 0]] - V[E[:, 1]], axis=1); long = {tuple(e): None for e, x in zip(E, L) if x > 4 / 3 * target}\n    for e in long: long[e] = len(V); V = np.vstack([V, (V[e[0]] + V[e[1]]) / 2])\n    F2 = []\n    for f in F:                                     # red-green refinement: split 1, 2 or 3 edges of each triangle\n        m = [long.get(tuple(sorted((int(f[k]), int(f[(k + 1) % 3])))) ) for k in range(3)]\n        a, b, c = map(int, f)\n        if all(x is None for x in m): F2.append([a, b, c]); continue\n        if all(x is not None for x in m): F2 += [[a, m[0], m[2]], [b, m[1], m[0]], [c, m[2], m[1]], [m[0], m[1], m[2]]]; continue\n        k = [i for i in range(3) if m[i] is not None]\n        if len(k) == 1:\n            i = k[0]; p, q, r = [a, b, c][i], [a, b, c][(i + 1) % 3], [a, b, c][(i + 2) % 3]; F2 += [[p, m[i], r], [m[i], q, r]]\n        else:\n            i = [x for x in range(3) if m[x] is None][0]; p, q, r = [a, b, c][i], [a, b, c][(i + 1) % 3], [a, b, c][(i + 2) % 3]\n            mq, mr = m[(i + 1) % 3], m[(i + 2) % 3]; F2 += [[p, q, mq], [p, mq, mr], [mr, mq, r]]\n    F = np.array(F2); l = lengths(V, F)\n    print('split round %d: V=%d F=%d  length max %.3f  max/min %.2f  watertight euler=%d' % (rnd + 1, len(V), len(F), l.max(), l.max() / l.min(), len(V) - len(m3d.edges(F)) + len(F)))\nprint('splitting alone caps the longest edge but leaves the short ones (max/min grows): collapses are the other half.')\nprint('full isotropic remeshing loops: split > 4/3 L, collapse < 4/5 L, flip edges toward valence 6, tangential smoothing, project to surface.')", "out": "noisy sphere: roughness 0.0238  mean radius 0.9987\nuniform Laplacian x10 (lambda .5): roughness 0.0046  mean radius 0.9427  <- shrinks\nTaubin lambda|mu x10:             roughness 0.0093  mean radius 1.0009  <- no shrink\ncotan Laplacian / vertex area on the unit sphere = 2H: mean 2.0012 std 0.0394 (exact 2); it measures curvature, the uniform one only measures mesh irregularity\nimplicit step t=5:                roughness 0.0064  mean radius 0.9444\nstretched sphere: edges 480, length min 0.276 max 0.812, max/min 2.94\nsplit round 1: V=550 F=1096  length max 0.432  max/min 3.13  watertight euler=2\nsplit round 2: V=914 F=1824  length max 0.333  max/min 4.83  watertight euler=2\nsplit round 3: V=914 F=1824  length max 0.333  max/min 4.83  watertight euler=2\nsplitting alone caps the longest edge but leaves the short ones (max/min grows): collapses are the other half.\nfull isotropic remeshing loops: split > 4/3 L, collapse < 4/5 L, flip edges toward valence 6, tangential smoothing, project to surface."}, "d_unwrap": {"lang": "py", "file": "d_unwrap.py", "src": "# d_unwrap.py: UV unwrapping a disc-topology patch: Tutte (uniform) and harmonic (cotangent) embeddings, flips and distortion.\nimport numpy as np, m3d\nV, F = m3d.icosphere(3)\nkeep = (V[F].mean(1)[:, 2] > 0.05)                      # cut a cap: the upper hemisphere is a topological disc\nF = F[keep]; used = np.unique(F); remap = -np.ones(len(V), int); remap[used] = np.arange(len(used)); V = V[used]; F = remap[F]\nE = m3d.edges(F)\nhe = {(int(f[k]), int(f[(k + 1) % 3])) for f in F for k in range(3)}\nbnd = {a: b for a, b in he if (b, a) not in he}\nloop = [next(iter(bnd))]\nwhile True:\n    nx = bnd[loop[-1]]\n    if nx == loop[0]: break\n    loop.append(nx)\nprint('patch: V=%d F=%d boundary loop of %d vertices, euler %d (disc = 1)' % (len(V), len(F), len(loop), len(V) - len(E) + len(F)))\nseg = np.linalg.norm(V[loop] - V[np.roll(loop, -1)], axis=1); t = np.r_[0, np.cumsum(seg)[:-1]] / seg.sum() * 2 * np.pi\nUVb = np.c_[np.cos(t), np.sin(t)]                       # boundary pinned to a circle by arc length\ndef embed(W):\n    n = len(V); L = np.diag(W.sum(1)) - W; inner = np.setdiff1d(np.arange(n), loop)\n    UV = np.zeros((n, 2)); UV[loop] = UVb\n    UV[inner] = np.linalg.solve(L[np.ix_(inner, inner)], -L[np.ix_(inner, loop)] @ UVb)\n    return UV\nWu = np.zeros((len(V), len(V))); Wu[E[:, 0], E[:, 1]] = Wu[E[:, 1], E[:, 0]] = 1\nWc = np.zeros_like(Wu)\nfor k in range(3):\n    i, j, o = F[:, k], F[:, (k + 1) % 3], F[:, (k + 2) % 3]\n    u, v = V[i] - V[o], V[j] - V[o]; cot = (u * v).sum(1) / np.linalg.norm(np.cross(u, v), axis=1)\n    np.add.at(Wc, (i, j), cot / 2); np.add.at(Wc, (j, i), cot / 2)\ndef lscm():\n    n = len(V); rows = []\n    for f in F:\n        p0, p1, p2 = V[f]; e1 = p1 - p0; x = e1 / np.linalg.norm(e1); nrm = np.cross(e1, p2 - p0); y = np.cross(nrm, x); y /= np.linalg.norm(y)\n        q = [np.array([0.0, 0]), np.array([e1 @ x, 0]), np.array([(p2 - p0) @ x, (p2 - p0) @ y])]\n        A2 = q[1][0] * q[2][1]; R = np.zeros((2, 2 * n))\n        for j in range(3):                                   # complex weight W_j = q_{j+2} - q_{j+1}; equation sum W_j (u_j + i v_j) = 0\n            w = q[(j + 2) % 3] - q[(j + 1) % 3]; k = f[j]\n            R[0, k] += w[0]; R[0, n + k] -= w[1]; R[1, k] += w[1]; R[1, n + k] += w[0]\n        rows.append(R / np.sqrt(A2))\n    A = np.vstack(rows); a, b = loop[0], loop[len(loop) // 2]          # pin two boundary vertices\n    pin = [a, b, n + a, n + b]; val = np.array([0.0, 1.0, 0.0, 0.0]); free = np.setdiff1d(np.arange(2 * n), pin)\n    sol = np.zeros(2 * n); sol[pin] = val\n    sol[free] = np.linalg.lstsq(A[:, free], -A[:, pin] @ val, rcond=None)[0]\n    return np.c_[sol[:n], sol[n:]]\nfor name, W in (('Tutte (uniform)', Wu), ('harmonic (cotan)', Wc), ('LSCM (free bnd)', None)):\n    UV = embed(W) if W is not None else lscm()\n    d1, d2 = UV[F[:, 1]] - UV[F[:, 0]], UV[F[:, 2]] - UV[F[:, 0]]; a2 = (d1[:, 0] * d2[:, 1] - d1[:, 1] * d2[:, 0]) / 2; a3 = 0.5 * np.linalg.norm(m3d.face_normals(V, F, unit=False), axis=1)\n    ratio = (a2 / a2.sum()) / (a3 / a3.sum())\n    # per-triangle conformal distortion: singular values of the 2x2 map from a local 3D frame to UV\n    sig = []\n    for f in F:\n        p0, p1, p2 = V[f]; e1 = p1 - p0; x = e1 / np.linalg.norm(e1); nrm = np.cross(e1, p2 - p0); y = np.cross(nrm, x); y /= np.linalg.norm(y)\n        P = np.array([[e1 @ x, (p2 - p0) @ x], [0, (p2 - p0) @ y]]); U = np.stack([UV[f[1]] - UV[f[0]], UV[f[2]] - UV[f[0]]], 1)\n        s = np.linalg.svd(U @ np.linalg.inv(P), compute_uv=False); sig.append(s[0] / s[1])\n    print('%-17s flipped triangles %d   area ratio min %.3f max %.3f   angle distortion sigma1/sigma2 mean %.3f max %.3f' % (name, (a2 <= 0).sum(), ratio.min(), ratio.max(), np.mean(sig), np.max(sig)))\nprint('Tutte: convex boundary + positive weights => guaranteed no flips (Tutte 1963, Floater 1997). Cotan weights can be negative on obtuse meshes.')\nprint('LSCM frees the boundary and minimises conformal (angle) energy: angles are kept, area grows toward the rim instead.')\nprint('the zig-zag cut boundary, forced onto a circle, is what creates the worst Tutte triangles. Closed meshes need seams (a cut graph) first.')", "out": "patch: V=337 F=608 boundary loop of 64 vertices, euler 1 (disc = 1)\nTutte (uniform)   flipped triangles 0   area ratio min 0.076 max 3.011   angle distortion sigma1/sigma2 mean 2.276 max 39.535\nharmonic (cotan)  flipped triangles 0   area ratio min 0.076 max 2.917   angle distortion sigma1/sigma2 mean 2.233 max 39.535\nLSCM (free bnd)   flipped triangles 0   area ratio min 0.530 max 2.350   angle distortion sigma1/sigma2 mean 1.046 max 1.124\nTutte: convex boundary + positive weights => guaranteed no flips (Tutte 1963, Floater 1997). Cotan weights can be negative on obtuse meshes.\nLSCM frees the boundary and minimises conformal (angle) energy: angles are kept, area grows toward the rim instead.\nthe zig-zag cut boundary, forced onto a circle, is what creates the worst Tutte triangles. Closed meshes need seams (a cut graph) first."}, "e_csg": {"lang": "py", "file": "e_csg.py", "src": "# e_csg.py: constructive solid geometry with signed distance fields: union/intersection/difference, smooth blends, voxel volumes vs exact.\nimport numpy as np, m3d\nn = 96; G = m3d.grid(n, -1.5, 1.5); h = 3.0 / (n - 1); cell = h ** 3\nA = m3d.sdf_sphere(G, 1.0); B = m3d.sdf_box(G, [0.7, 0.7, 0.7])\nops = {'A (sphere r=1)': A, 'B (box 1.4^3)': B, 'A or B = min': np.minimum(A, B), 'A and B = max': np.maximum(A, B), 'A minus B = max(A,-B)': np.maximum(A, -B)}\nexact = {'A (sphere r=1)': 4 / 3 * np.pi, 'B (box 1.4^3)': 1.4 ** 3}\n# sphere r=1 vs cube half-side .7: corners at .7*sqrt3=1.212 > 1, so the intersection is a cube with its corners rounded off\nfor k, d in ops.items():\n    vol = (d < 0).sum() * cell\n    print('%-24s voxel volume %.4f%s' % (k, vol, ('   exact %.4f' % exact[k]) if k in exact else ''))\nvA, vB, vI = [(ops[k] < 0).sum() * cell for k in ('A (sphere r=1)', 'B (box 1.4^3)', 'A and B = max')]\nprint('inclusion-exclusion check: |A|+|B|-|A and B| = %.4f vs |A or B| = %.4f' % (vA + vB - vI, (ops['A or B = min'] < 0).sum() * cell))\ndef smin(a, b, k):                                   # polynomial smooth minimum (Quilez)\n    hh = np.clip(0.5 + 0.5 * (b - a) / k, 0, 1); return b * (1 - hh) + a * hh - k * hh * (1 - hh)\nC1 = m3d.sdf_sphere(G, 0.6, (-0.5, 0, 0)); C2 = m3d.sdf_sphere(G, 0.6, (0.5, 0, 0))\nfor k in (0.0001, 0.2, 0.5): print('smooth union k=%.4f: volume %.4f' % (k, (smin(C1, C2, k) < 0).sum() * cell))\n# min of SDFs is a correct distance outside, only a bound inside: check |grad| = 1\ng = np.gradient(np.maximum(A, -B), h); gm = np.linalg.norm(np.stack(g), axis=0)\nband = np.abs(np.maximum(A, -B)) < 0.1\nprint('|grad| of the difference field near the surface: mean %.3f min %.3f (exact SDFs have 1 everywhere; CSG results are only bounds)' % (gm[band].mean(), gm[band].min()))\nprint('point (0,0,0) in A minus B?', np.maximum(m3d.sdf_sphere(np.zeros(3)), -m3d.sdf_box(np.zeros(3), [0.7] * 3)) < 0, ' point (0.9,0,0)?', np.maximum(m3d.sdf_sphere(np.array([0.9, 0, 0])), -m3d.sdf_box(np.array([0.9, 0, 0]), [0.7] * 3)) < 0)", "out": "A (sphere r=1)           voxel volume 4.1992   exact 4.1888\nB (box 1.4^3)            voxel volume 2.6826   exact 2.7440\nA or B = min             voxel volume 4.2675\nA and B = max            voxel volume 2.6143\nA minus B = max(A,-B)    voxel volume 1.5849\ninclusion-exclusion check: |A|+|B|-|A and B| = 4.2675 vs |A or B| = 4.2675\nsmooth union k=0.0001: volume 1.7749\nsmooth union k=0.2000: volume 1.7915\nsmooth union k=0.5000: volume 1.9016\n|grad| of the difference field near the surface: mean 0.947 min 0.025 (exact SDFs have 1 everywhere; CSG results are only bounds)\npoint (0,0,0) in A minus B? False  point (0.9,0,0)? True"}, "e_mcubes": {"lang": "py", "file": "e_mcubes.py", "src": "# e_mcubes.py: marching cubes: the 256 corner cases and their 15 classes, and a complete extractor via 6 tetrahedra per cube.\nimport numpy as np, itertools, m3d\nC = np.array([[x, y, z] for z in (0, 1) for y in (0, 1) for x in (0, 1)])       # corner i has bits (x, y, z)\n# count case classes: group the 24 cube rotations (+ complement) acting on 8-bit corner masks\nrots = []\nfor perm in itertools.permutations(range(3)):\n    for sg in itertools.product((1, -1), repeat=3):\n        M = np.zeros((3, 3), int)\n        for i, p in enumerate(perm): M[i, p] = sg[i]\n        if round(np.linalg.det(M)) == 1: rots.append(M)\ncmap = {tuple(c): i for i, c in enumerate(C)}\nperms = [[cmap[tuple(((M @ (2 * c - 1)) + 1) // 2)] for c in C] for M in rots]\ndef act(m, p): return sum(((m >> i) & 1) << p[i] for i in range(8))\ndef classes(compl):\n    seen = set(); cls = 0\n    for m in range(256):\n        if m in seen: continue\n        cls += 1; orb = {act(m, p) for p in perms}\n        if compl: orb |= {255 ^ x for x in orb}\n        seen |= orb\n    return cls\nprint('rotations of the cube:', len(rots), '; classes of the 256 cases: rotation only =', classes(False), ', rotation + complement =', classes(True), '(Lorensen & Cline 1987: 15)')\nTETS = [[0, 1, 3, 7], [0, 3, 2, 7], [0, 2, 6, 7], [0, 6, 4, 7], [0, 4, 5, 7], [0, 5, 1, 7]]      # Kuhn split along the 0-7 diagonal\ndef march(f, iso=0.0):\n    n = f.shape[0]; tris = []; vid = {}; verts = []\n    def vert(p, q, fp, fq):\n        key = (min(p, q), max(p, q))\n        if key not in vid:\n            t = (iso - fp) / (fq - fp); vid[key] = len(verts); verts.append(np.array(np.unravel_index(p, f.shape)) * (1 - t) + np.array(np.unravel_index(q, f.shape)) * t)\n        return vid[key]\n    flat = f.ravel(); idx = np.arange(f.size).reshape(f.shape)\n    for i, j, k in itertools.product(range(n - 1), repeat=3):\n        cid = [idx[i + c[0], j + c[1], k + c[2]] for c in C]\n        vals = flat[cid]\n        if (vals < iso).all() or (vals >= iso).all(): continue\n        for T in TETS:\n            g = [cid[t] for t in T]; fv = flat[g]; ins = [x for x in range(4) if fv[x] < iso]; out = [x for x in range(4) if fv[x] >= iso]\n            if len(ins) in (0, 4): continue\n            if len(ins) in (1, 3):\n                a = ins[0] if len(ins) == 1 else out[0]; others = [x for x in range(4) if x != a]\n                tri = [vert(g[a], g[o], fv[a], fv[o]) for o in others]\n                tris.append(tri)\n            else:\n                a, b = ins; c, d = out\n                q = [vert(g[a], g[c], fv[a], fv[c]), vert(g[a], g[d], fv[a], fv[d]), vert(g[b], g[d], fv[b], fv[d]), vert(g[b], g[c], fv[b], fv[c])]\n                tris += [[q[0], q[1], q[2]], [q[0], q[2], q[3]]]\n    V = np.array(verts); F = np.array(tris)\n    cen = V[F].mean(1); nrm = np.cross(V[F[:, 1]] - V[F[:, 0]], V[F[:, 2]] - V[F[:, 0]])\n    gi = np.clip(np.round(cen).astype(int), 0, n - 1); gr = np.stack(np.gradient(f), -1)[gi[:, 0], gi[:, 1], gi[:, 2]]\n    flip = (nrm * gr).sum(1) < 0; F[flip] = F[flip][:, ::-1]                    # orient outward (along +gradient)\n    return V, F\nfor n in (16, 32, 48):\n    G = m3d.grid(n, -1.3, 1.3); h = 2.6 / (n - 1); f = m3d.sdf_sphere(G, 1.0)\n    V, F = march(f); V = V * h - 1.3\n    r = np.linalg.norm(V, axis=1)\n    print('grid %2d^3: V=%5d F=%5d  |r-1| max %.4f  area %.4f  volume %.4f  (exact 12.5664 / 4.1888)  euler %d' % (n, len(V), len(F), np.abs(r - 1).max(), m3d.area(V, F), m3d.volume(V, F), len(V) - len(m3d.edges(F)) + len(F)))\nprint('vertices sit on cube/tet edges at t = (iso - f_p)/(f_q - f_p): linear interpolation of the field.')\nprint('example edge: f_p = -0.3, f_q = 0.1 -> t = %.2f' % ((0 - -0.3) / (0.1 - -0.3)))", "out": "rotations of the cube: 24 ; classes of the 256 cases: rotation only = 23 , rotation + complement = 15 (Lorensen & Cline 1987: 15)\ngrid 16^3: V= 1958 F= 3912  |r-1| max 0.0088  area 12.4685  volume 4.1255  (exact 12.5664 / 4.1888)  euler 2\ngrid 32^3: V= 8018 F=16032  |r-1| max 0.0025  area 12.5437  volume 4.1741  (exact 12.5664 / 4.1888)  euler 2\ngrid 48^3: V=18482 F=36960  |r-1| max 0.0011  area 12.5565  volume 4.1824  (exact 12.5664 / 4.1888)  euler 2\nvertices sit on cube/tet edges at t = (iso - f_p)/(f_q - f_p): linear interpolation of the field.\nexample edge: f_p = -0.3, f_q = 0.1 -> t = 0.75"}, "e_poisson": {"lang": "py", "file": "e_poisson.py", "src": "# e_poisson.py: Poisson surface reconstruction in 2D: oriented samples -> vector field -> solve lap(chi) = div(V) -> iso-contour.\nimport numpy as np, scipy.sparse as sp, scipy.sparse.linalg as spl\nrng = np.random.default_rng(0)\nn = 96; lo, hi = -1.5, 1.5; h = (hi - lo) / (n - 1)\n# 300 noisy oriented samples on a \"peanut\" curve r(t) = 1 + 0.3 cos 2t (with a gap to show hole filling)\nt = rng.uniform(0, 2 * np.pi, 300); t = t[(t < 2.6) | (t > 3.0)]\nr = 0.8 + 0.25 * np.cos(2 * t); P = np.c_[r * np.cos(t), r * np.sin(t)]\ndr = -0.5 * np.sin(2 * t); T = np.c_[dr * np.cos(t) - r * np.sin(t), dr * np.sin(t) + r * np.cos(t)]\nN = np.c_[T[:, 1], -T[:, 0]]; N /= np.linalg.norm(N, axis=1, keepdims=True)\nP += 0.01 * rng.standard_normal(P.shape)\n# 1. splat normals onto the grid with a Gaussian kernel -> vector field V\nxs = np.linspace(lo, hi, n); X, Y = np.meshgrid(xs, xs, indexing='ij')\nVx = np.zeros((n, n)); Vy = np.zeros((n, n)); s = 2 * h\nfor p, nn in zip(P, N):\n    w = np.exp(-((X - p[0]) ** 2 + (Y - p[1]) ** 2) / (2 * s * s)); Vx += w * nn[0]; Vy += w * nn[1]\n# 2. divergence with central differences, 3. solve the Poisson equation lap chi = div V (Dirichlet 0 on the border)\ndiv = np.gradient(Vx, h, axis=0) + np.gradient(Vy, h, axis=1)\nI = sp.identity(n); D = sp.diags([1, -2, 1], [-1, 0, 1], shape=(n, n), dtype=float) / h ** 2\nL = sp.kron(D, I) + sp.kron(I, D)\nchi = spl.spsolve(L.tocsc(), div.ravel()).reshape(n, n)\nprint('Poisson system: %d unknowns, %d non-zeros; residual |L chi - div| = %.2e' % (n * n, L.nnz, np.abs(L @ chi.ravel() - div.ravel()).max()))\n# 4. iso-value = mean of chi at the samples (bilinear lookup), 5. compare the contour with the true curve\ndef bil(F, p):\n    u = (p - lo) / h; i = np.clip(np.floor(u).astype(int), 0, n - 2); f = u - i\n    return (F[i[:, 0], i[:, 1]] * (1 - f[:, 0]) * (1 - f[:, 1]) + F[i[:, 0] + 1, i[:, 1]] * f[:, 0] * (1 - f[:, 1]) + F[i[:, 0], i[:, 1] + 1] * (1 - f[:, 0]) * f[:, 1] + F[i[:, 0] + 1, i[:, 1] + 1] * f[:, 0] * f[:, 1])\niso = bil(chi, P).mean(); print('iso value (mean chi at samples) = %.5f, spread %.5f' % (iso, bil(chi, P).std()))\ninside = chi < iso if bil(chi, np.zeros((1, 2)))[0] < iso else chi > iso\ntt = np.linspace(0, 2 * np.pi, 2000); rr = 0.8 + 0.25 * np.cos(2 * tt)\ntrue_area = 0.5 * np.trapezoid(rr ** 2, tt)\nprint('reconstructed area %.4f vs true area %.4f (error %.2f%%)' % (inside.sum() * h * h, true_area, 100 * abs(inside.sum() * h * h - true_area) / true_area))\ngap = np.c_[np.cos(2.8), np.sin(2.8)] * (0.8 + 0.25 * np.cos(5.6))\nprint('point in the middle of the data gap, chi - iso = %.4f (small compared with the spread of chi: the contour passes close by, the hole is closed)' % (bil(chi, gap)[0] - iso))\nfor k in (0.5, 0.95, 1.05, 1.3):\n    q = gap * k; print('  along the gap ray at %.2f x radius: %s' % (k, 'inside' if (bil(chi, q)[0] - iso) * (bil(chi, np.zeros((1, 2)))[0] - iso) > 0 else 'outside'))", "out": "Poisson system: 9216 unknowns, 45696 non-zeros; residual |L chi - div| = 5.44e-12\niso value (mean chi at samples) = -0.60371, spread 0.09034\nreconstructed area 2.0942 vs true area 2.1088 (error 0.69%)\npoint in the middle of the data gap, chi - iso = 0.0709 (small compared with the spread of chi: the contour passes close by, the hole is closed)\n  along the gap ray at 0.50 x radius: inside\n  along the gap ray at 0.95 x radius: inside\n  along the gap ray at 1.05 x radius: outside\n  along the gap ray at 1.30 x radius: outside"}, "f_attn": {"lang": "py", "file": "f_attn.py", "src": "# f_attn.py: a transformer block on a set of 3D points: attention, layer norm, MLP, residuals; permutation equivariance and gradcheck.\nimport numpy as np, ag\nrng = np.random.default_rng(0); d, H = 16, 2; dh = d // H\nP = {k: ag.param(rng, d, d) for k in ('q', 'k', 'v', 'o')}; P['m1'] = ag.param(rng, d, 4 * d); P['m2'] = ag.param(rng, 4 * d, d)\ng1, b1, g2, b2 = ag.T(np.ones(d)), ag.T(np.zeros(d)), ag.T(np.ones(d)), ag.T(np.zeros(d)); E = ag.param(rng, 3, d)\ndef block(X):\n    h = ag.layernorm(X, g1, b1); N = X.shape[0]\n    q, k, v = (h @ P[n] for n in 'qkv'); heads = []\n    for i in range(H):\n        sl = slice(i * dh, (i + 1) * dh)\n        A = ag.softmax(q[:, sl] @ k[:, sl].Tt * (1 / np.sqrt(dh)))       # (N, N) attention weights\n        heads.append(A @ v[:, sl])\n    X = X + ag.cat(heads, -1) @ P['o']\n    return X + (ag.layernorm(X, g2, b2) @ P['m1']).gelu() @ P['m2']\npts = rng.uniform(-1, 1, (10, 3)); Y = block(ag.T(pts) @ E).data\nperm = rng.permutation(10); Yp = block(ag.T(pts[perm]) @ E).data\nprint('output shape', Y.shape, '; permuting the input points permutes the output rows: max diff %.2e' % np.abs(Yp - Y[perm]).max())\npooled = Y.max(0); pooledp = Yp.max(0); print('after max-pooling: permutation INVARIANT, diff %.2e' % np.abs(pooled - pooledp).max())\nX0 = ag.T(rng.normal(size=(6, d)))\nprint('gradcheck through attention + layernorm + GELU MLP: max rel error %.2e' % ag.gradcheck(lambda: (block(X0) ** 2).mean(), [P['q'], P['k'], P['v'], P['o'], P['m1'], g1, X0]))\nn_par = sum(p.data.size for p in list(P.values()) + [g1, b1, g2, b2]); print('parameters in the block: %d = 12 d^2 + 4d with d = %d' % (n_par, d))\nfor N in (1024, 4096, 16384): print('N = %5d tokens: attention matrix %d entries = %.1f MB in fp16 per head' % (N, N * N, N * N * 2 / 1e6))", "out": "output shape (10, 16) ; permuting the input points permutes the output rows: max diff 9.99e-16\nafter max-pooling: permutation INVARIANT, diff 6.66e-16\ngradcheck through attention + layernorm + GELU MLP: max rel error 4.33e-07\nparameters in the block: 3136 = 12 d^2 + 4d with d = 16\nN =  1024 tokens: attention matrix 1048576 entries = 2.1 MB in fp16 per head\nN =  4096 tokens: attention matrix 16777216 entries = 33.6 MB in fp16 per head\nN = 16384 tokens: attention matrix 268435456 entries = 536.9 MB in fp16 per head"}, "f_autograd": {"lang": "py", "file": "f_autograd.py", "src": "# f_autograd.py: reverse-mode automatic differentiation by hand, then with ag.py, checked against finite differences.\nimport numpy as np, ag\n# by hand: f(x, y) = (x*y + sin x)^2 at (2, 3). Forward values, then gradients backwards (chain rule).\nx, y = 2.0, 3.0\na = x * y; b = np.sin(x); c = a + b; f = c * c\ndf_dc = 2 * c; df_da = df_dc; df_db = df_dc; df_dx = df_da * y + df_db * np.cos(x); df_dy = df_da * x\nprint('forward: a=xy=%.4f b=sin x=%.4f c=%.4f f=%.4f' % (a, b, c, f))\nprint('backward: df/dc=%.4f df/dx=%.4f df/dy=%.4f' % (df_dc, df_dx, df_dy))\nX, Y = ag.T(2.0), ag.T(3.0); F = (X * Y + X.sin()) ** 2; F.backward()\nprint('ag.py   : df/dx=%.4f df/dy=%.4f' % (X.grad, Y.grad))\ne = 1e-6; fd = lambda x, y: (x * y + np.sin(x)) ** 2\nprint('central differences: df/dx=%.4f df/dy=%.4f' % ((fd(x + e, y) - fd(x - e, y)) / 2 / e, (fd(x, y + e) - fd(x, y - e)) / 2 / e))\n# an MLP that maps 3D points to a signed distance: gradients wrt weights AND wrt the input points\nrng = np.random.default_rng(0)\nW1, b1, W2, b2 = ag.param(rng, 3, 32), ag.T(np.zeros(32)), ag.param(rng, 32, 1), ag.T(np.zeros(1))\nP = ag.T(rng.uniform(-1, 1, (64, 3)))\ntarget = np.linalg.norm(P.data, axis=1, keepdims=True) - 0.5\ndef loss(): d = ((P @ W1 + b1).tanh() @ W2 + b2); return ((d - target) ** 2).mean()\nprint('gradcheck max relative error over W1, b1, W2, b2, input points: %.2e' % ag.gradcheck(loss, [W1, b1, W2, b2, P]))\nL = loss(); L.backward()\nprint('loss %.4f; d loss / d point 0 = %s (gradients reach geometry too: this is how fields and meshes are optimised)' % (L.data, np.round(P.grad[0], 5)))\nprint('cost: reverse mode = one backward pass for all %d parameters; forward-mode would need %d passes' % (sum(p.data.size for p in (W1, b1, W2, b2)), sum(p.data.size for p in (W1, b1, W2, b2))))", "out": "forward: a=xy=6.0000 b=sin x=0.9093 c=6.9093 f=47.7384\nbackward: df/dc=13.8186 df/dx=35.7052 df/dy=27.6372\nag.py   : df/dx=35.7052 df/dy=27.6372\ncentral differences: df/dx=35.7052 df/dy=27.6372\ngradcheck max relative error over W1, b1, W2, b2, input points: 4.75e-09\nloss 0.7604; d loss / d point 0 = [-0.01327  0.00823  0.0073 ] (gradients reach geometry too: this is how fields and meshes are optimised)\ncost: reverse mode = one backward pass for all 161 parameters; forward-mode would need 161 passes"}, "f_mlp": {"lang": "py", "file": "f_mlp.py", "src": "# f_mlp.py: training loop from scratch: fit a 2D signed distance field with an MLP; SGD vs Adam, learning rates, init.\nimport numpy as np, ag\nrng = np.random.default_rng(0)\ndef sdf(p):                                     # a rounded rectangle with a circular hole\n    q = np.abs(p) - [0.6, 0.35]; box = np.linalg.norm(np.maximum(q, 0), axis=1) + np.minimum(q.max(1), 0) - 0.1\n    return np.maximum(box, -(np.linalg.norm(p - [0.25, 0], axis=1) - 0.2))\nXte = rng.uniform(-1, 1, (2000, 2)); Yte = sdf(Xte)[:, None]\ndef train(opt, lr, steps=1500, width=64, seed=0):\n    r = np.random.default_rng(seed)\n    Ps = [ag.param(r, 2, width), ag.T(np.zeros(width)), ag.param(r, width, width), ag.T(np.zeros(width)), ag.param(r, width, 1), ag.T(np.zeros(1))]\n    f = lambda X: ((ag.T(X) @ Ps[0] + Ps[1]).relu() @ Ps[2] + Ps[3]).relu() @ Ps[4] + Ps[5]\n    A = ag.Adam(Ps, lr) if opt == 'adam' else None; hist = []\n    for s in range(steps):\n        X = r.uniform(-1, 1, (256, 2)); L = ((f(X) - sdf(X)[:, None]) ** 2).mean(); L.backward()\n        if A: A.step()\n        else:\n            for p in Ps: p.data -= lr * p.grad\n        if s in (0, 99, 499, steps - 1): hist.append(float(L.data))\n    te = float((((f(Xte).data - Yte) ** 2).mean()))\n    sign = float(((f(Xte).data > 0) == (Yte > 0)).mean())\n    return hist, te, sign\nfor opt, lr in (('sgd', 0.01), ('sgd', 0.1), ('adam', 1e-3), ('adam', 1e-2)):\n    h, te, sg = train(opt, lr)\n    print('%-4s lr %-6g loss at steps 1/100/500/1500: %s   test MSE %.5f   inside/outside correct %.1f%%' % (opt, lr, ' '.join('%.5f' % v for v in h), te, 100 * sg))\nprint('1500 steps x 256 points; one step = forward, backward, update.')", "out": "sgd  lr 0.01   loss at steps 1/100/500/1500: 0.09326 0.02617 0.00853 0.00734   test MSE 0.00500   inside/outside correct 89.6%\nsgd  lr 0.1    loss at steps 1/100/500/1500: 0.09326 0.00549 0.00288 0.00169   test MSE 0.00133   inside/outside correct 93.0%\nadam lr 0.001  loss at steps 1/100/500/1500: 0.09326 0.00403 0.00020 0.00002   test MSE 0.00002   inside/outside correct 99.7%\nadam lr 0.01   loss at steps 1/100/500/1500: 0.09326 0.00091 0.00004 0.00001   test MSE 0.00002   inside/outside correct 99.5%\n1500 steps x 256 points; one step = forward, backward, update."}, "g_meshcnn": {"lang": "py", "file": "g_meshcnn.py", "src": "# g_meshcnn.py: MeshCNN edge features (dihedral angle, inner angles, edge-length ratios) and an order-invariant edge convolution.\nimport numpy as np, m3d\nV, F = m3d.icosphere(2); V = V * [1.6, 1.0, 0.7]                 # an ellipsoid: curvature varies\nE = m3d.edges(F); eid = {tuple(e): i for i, e in enumerate(E)}\nef = {}; \nfor fi, f in enumerate(F):\n    for k in range(3): ef.setdefault(tuple(sorted((int(f[k]), int(f[(k + 1) % 3])))), []).append((fi, int(f[(k + 2) % 3])))\nfn = m3d.face_normals(V, F)\nfeat = np.zeros((len(E), 5)); nbr = np.zeros((len(E), 4), int)\nfor i, (a, b) in enumerate(E):\n    (f1, o1), (f2, o2) = ef[(a, b)]\n    dih = np.pi - np.arccos(np.clip(fn[f1] @ fn[f2], -1, 1))     # dihedral angle (pi = flat)\n    def inner(o): u, w = V[a] - V[o], V[b] - V[o]; return np.arccos(u @ w / np.linalg.norm(u) / np.linalg.norm(w))\n    def ratio(o):                                               # edge length / height of the triangle\n        e = V[b] - V[a]; t = (V[o] - V[a]) @ e / (e @ e); return np.linalg.norm(e) / np.linalg.norm(V[a] + t * e - V[o])\n    i1, i2 = sorted([inner(o1), inner(o2)]); r1, r2 = sorted([ratio(o1), ratio(o2)])   # sorted -> invariant to which face is \"first\"\n    feat[i] = [dih, i1, i2, r1, r2]\n    nbr[i] = [eid[tuple(sorted((a, o1)))], eid[tuple(sorted((b, o1)))], eid[tuple(sorted((a, o2)))], eid[tuple(sorted((b, o2)))]]\nprint('edges %d, features per edge %s' % (len(E), feat.shape[1:]))\nprint('dihedral angle (deg): min %.1f max %.1f  (sharper where the ellipsoid curves most)' % tuple(np.degrees([feat[:, 0].min(), feat[:, 0].max()])))\nrng = np.random.default_rng(0); W = rng.normal(size=(5 * 5, 8)) / 5\ndef edge_conv(x):\n    a, b, c, d = (x[nbr[:, k]] for k in range(4))                 # symmetric combos make it invariant to neighbour ordering\n    z = np.concatenate([x, np.abs(a - c), a + c, np.abs(b - d), b + d], 1); return np.maximum(z @ W, 0)\ny = edge_conv(feat)\nnbr_sw = nbr[:, [2, 3, 0, 1]].copy(); nbr0 = nbr; nbr = nbr_sw; y2 = edge_conv(feat); nbr = nbr0\nprint('edge conv output', y.shape, '; swapping the two faces of every edge changes output by %.2e' % np.abs(y - y2).max())\nprint('features are invariant to rotation, translation and uniform scale: rescale x3 ->', end=' ')\nV2 = V * 3; fn2 = m3d.face_normals(V2, F); print('dihedral unchanged:', np.allclose(np.arccos(np.clip((fn2[[ef[tuple(e)][0][0] for e in E]] * fn2[[ef[tuple(e)][1][0] for e in E]]).sum(1), -1, 1)), np.pi - feat[:, 0]))\nprint('mesh pooling = learned edge collapse: each collapse removes 3 edges (1 edge + 2 merged pairs); %d -> %d edges after 50 collapses' % (len(E), len(E) - 150))", "out": "edges 480, features per edge (5,)\ndihedral angle (deg): min 160.7 max 176.2  (sharper where the ellipsoid curves most)\nedge conv output (480, 8) ; swapping the two faces of every edge changes output by 0.00e+00\nfeatures are invariant to rotation, translation and uniform scale: rescale x3 -> dihedral unchanged: True\nmesh pooling = learned edge collapse: each collapse removes 3 edges (1 edge + 2 merged pairs); 480 -> 330 edges after 50 collapses"}, "g_meshgraph": {"lang": "py", "file": "g_meshgraph.py", "src": "# g_meshgraph.py: MeshGraphNets-style encode-process-decode GNN, trained to predict one step of heat diffusion on a mesh.\nimport numpy as np, ag, m3d\nrng = np.random.default_rng(0)\nV, F = m3d.icosphere(2); E = m3d.edges(F); S, R = np.r_[E[:, 0], E[:, 1]], np.r_[E[:, 1], E[:, 0]]   # directed edges send S -> R\nn, ne = len(V), len(S)\ndeg = np.bincount(R, minlength=n); Lap = np.zeros((n, n)); Lap[R, S] = 1; Lap = Lap / deg[:, None] - np.eye(n)\ndt = 0.3\ndef sample_field():\n    c = V[rng.integers(n)]; return np.exp(-8 * ((V - c) ** 2).sum(1)) * rng.uniform(0.5, 1.5) + 0.2 * rng.standard_normal() * V[:, 0]\nAgg = np.zeros((n, ne)); Agg[R, np.arange(ne)] = 1                  # scatter-sum as a matrix (n x E)\nefeat = np.c_[V[S] - V[R], np.linalg.norm(V[S] - V[R], axis=1)]       # relative position + length: translation invariant\nH = 32\ndef mlp(i, o): return [ag.param(rng, i, H), ag.T(np.zeros(H)), ag.param(rng, H, o), ag.T(np.zeros(o))]\nenc_n, enc_e, dec = mlp(1, H), mlp(4, H), mlp(H, 1); proc = [(mlp(3 * H, H), mlp(2 * H, H)) for _ in range(2)]\nparams = enc_n + enc_e + dec + [p for a, b in proc for p in a + b]\nrun = lambda m, x: (x @ m[0] + m[1]).relu() @ m[2] + m[3]\ndef gnn(u):\n    h = run(enc_n, ag.T(u[:, None])); e = run(enc_e, ag.T(efeat))\n    for me, mn in proc:                                                 # message passing: update edges, then nodes, with residuals\n        e = e + run(me, ag.cat([e, h[S], h[R]], 1))\n        h = h + run(mn, ag.cat([h, ag.T(Agg) @ e], 1))\n    return run(dec, h)[:, 0]\nopt = ag.Adam(params, 3e-3)\nfor step in range(600):\n    u = sample_field(); target = dt * (Lap @ u)\n    L = ((gnn(u) - target) ** 2).mean(); L.backward(); opt.step()\n    if step in (0, 99, 299, 599): print('step %3d  loss %.2e' % (step + 1, L.data))\nu0 = sample_field(); ut, ug = u0.copy(), u0.copy()\nfor k in range(10): ut = ut + dt * (Lap @ ut); ug = ug + gnn(ug).data\nprint('10-step rollout: true field range %.3f..%.3f, GNN rollout max error %.4f (errors compound in rollouts: train with noise)' % (ut.min(), ut.max(), np.abs(ut - ug).max()))\nprint('one-step error on that field: %.5f max' % np.abs(gnn(u0).data - dt * (Lap @ u0)).max())\nprint('edge features are relative positions, so the model is translation invariant; it is not rotation invariant (d changes with rotation).')\nprint('parameters: %d, edges %d, nodes %d' % (sum(p.data.size for p in params), ne, n))", "out": "step   1  loss 2.52e-02\nstep 100  loss 3.18e-04\nstep 300  loss 5.18e-05\nstep 600  loss 1.63e-05\n10-step rollout: true field range -0.015..0.342, GNN rollout max error 0.0850 (errors compound in rollouts: train with noise)\none-step error on that field: 0.01393 max\nedge features are relative positions, so the model is translation invariant; it is not rotation invariant (d changes with rotation).\nparameters: 18017, edges 960, nodes 162"}, "g_pointnet": {"lang": "py", "file": "g_pointnet.py", "src": "# g_pointnet.py: PointNet from scratch: shared per-point MLP + symmetric max-pool; trained on 5 synthetic classes; invariance tests.\nimport numpy as np, ag, shapes\nrng = np.random.default_rng(0)\nXtr, Ytr = shapes.dataset(40, 128, rng); Xte, Yte = shapes.dataset(15, 128, np.random.default_rng(1))\nW = [ag.param(rng, 3, 64), ag.T(np.zeros(64)), ag.param(rng, 64, 128), ag.T(np.zeros(128)), ag.param(rng, 128, 64), ag.T(np.zeros(64)), ag.param(rng, 64, 5), ag.T(np.zeros(5))]\ndef net(X, feat=False):\n    h = (ag.T(X) @ W[0] + W[1]).relu(); h = (h @ W[2] + W[3]).relu()      # shared MLP on every point: (B, N, 128)\n    g = h.max(1)                                                          # symmetric function: order does not matter\n    if feat: return h, g\n    return (g @ W[4] + W[5]).relu() @ W[6] + W[7]\nopt = ag.Adam(W, 2e-3)\nfor ep in range(12):\n    o = rng.permutation(len(Ytr)); tot = 0\n    for i in range(0, len(o), 20):\n        b = o[i:i + 20]; L = ag.cross_entropy(net(Xtr[b]), Ytr[b]); L.backward(); opt.step(); tot += float(L.data) * len(b)\n    if ep in (0, 3, 7, 11):\n        acc = (net(Xte).data.argmax(1) == Yte).mean(); print('epoch %2d  train loss %.3f  test accuracy %.1f%%' % (ep + 1, tot / len(Ytr), 100 * acc))\nx = Xte[:1]; l1 = net(x).data; l2 = net(x[:, rng.permutation(128)]).data\nprint('shuffle the 128 points of a test cloud: logits change by %.2e' % np.abs(l1 - l2).max())\nh, g = net(x, True); crit = np.unique(h.data[0].argmax(0)); print('critical points (those that win at least one max): %d of 128 -> the shape is summarised by a skeleton' % len(crit))\nkeep = x[:, crit]; print('classify using ONLY the critical points: same prediction?', net(keep).data.argmax() == l1.argmax())\nprint('drop half the points at random: predictions on test set agree %.1f%%' % (100 * (net(Xte[:, :64]).data.argmax(1) == net(Xte).data.argmax(1)).mean()))\ncm = np.zeros((5, 5), int); np.add.at(cm, (Yte, net(Xte).data.argmax(1)), 1); print('confusion (rows true %s):\\n%s' % (shapes.CLASSES, cm))", "out": "epoch  1  train loss 1.550  test accuracy 86.7%\nepoch  4  train loss 0.771  test accuracy 100.0%\nepoch  8  train loss 0.236  test accuracy 98.7%\nepoch 12  train loss 0.087  test accuracy 100.0%\nshuffle the 128 points of a test cloud: logits change by 0.00e+00\ncritical points (those that win at least one max): 44 of 128 -> the shape is summarised by a skeleton\nclassify using ONLY the critical points: same prediction? True\ndrop half the points at random: predictions on test set agree 100.0%\nconfusion (rows true ['sphere', 'box', 'cylinder', 'torus', 'cone']):\n[[15  0  0  0  0]\n [ 0 15  0  0  0]\n [ 0  0 15  0  0]\n [ 0  0  0 15  0]\n [ 0  0  0  0 15]]"}, "g_pointnet2": {"lang": "py", "file": "g_pointnet2.py", "src": "# g_pointnet2.py: PointNet++ ingredients: farthest point sampling, ball query, grouping into local frames; kNN graphs and DGCNN edge features.\nimport numpy as np, shapes\nrng = np.random.default_rng(0)\nP = shapes.sample('torus', 2048, rng, s=1.0, rot=False)\ndef fps(P, m, start=0):\n    idx = [start]; d = np.linalg.norm(P - P[start], axis=1)\n    for _ in range(m - 1): i = int(d.argmax()); idx.append(i); d = np.minimum(d, np.linalg.norm(P - P[i], axis=1))\n    return np.array(idx), d.max()\nfor m in (32, 128, 512):\n    idx, cover = fps(P, m); ridx = rng.choice(len(P), m, replace=False)\n    dr = np.min(np.linalg.norm(P[:, None] - P[ridx][None], axis=2), 1).max()\n    print('FPS %3d centroids: covering radius %.4f   random %3d: %.4f' % (m, cover, m, dr))\ndef ball_query(P, C, r, k):\n    D = np.linalg.norm(C[:, None] - P[None], axis=2); out = np.zeros((len(C), k), int); cnt = []\n    for i in range(len(C)):\n        nb = np.where(D[i] < r)[0][:k]; cnt.append(len(nb)); out[i] = np.r_[nb, np.full(k - len(nb), nb[0])]   # pad with the first hit\n    return out, np.array(cnt)\nidx, _ = fps(P, 128); C = P[idx]\nG, cnt = ball_query(P, C, 0.2, 32)\nprint('ball query r=0.2, k=32 around 128 centroids: neighbours found min %d mean %.1f max %d (padded to 32)' % (cnt.min(), cnt.mean(), cnt.max()))\nlocal = P[G] - C[:, None]                                  # translate each group to its centroid: local coordinates\nprint('grouped tensor', local.shape, ' local coords lie within the ball:', bool((np.linalg.norm(local, axis=2) < 0.2 + 1e-9).all()))\n# local PCA of each group: normal = smallest eigenvector, check against the analytic torus normal\ndef torus_normal(p):\n    q = p.copy(); q[:, 2] = 0; c = q / np.linalg.norm(q, axis=1, keepdims=True) * 0.6; n = p - c; return n / np.linalg.norm(n, axis=1, keepdims=True)\nerr = []\nfor i in range(len(C)):\n    Q = local[i]; w, v = np.linalg.eigh(np.cov(Q.T)); n = v[:, 0]; err.append(np.degrees(np.arccos(min(1, abs(n @ torus_normal(C[i:i + 1])[0])))))\nprint('normals from local PCA: mean error %.2f deg, max %.2f deg' % (np.mean(err), np.max(err)))\n# kNN graph and DGCNN EdgeConv features [x_i, x_j - x_i]\nk = 16; D = ((C[:, None] - C[None]) ** 2).sum(-1); nn = np.argsort(D, 1)[:, 1:k + 1]\nedge = np.concatenate([np.repeat(C[:, None], k, 1), C[nn] - C[:, None]], -1)\nprint('DGCNN edge features', edge.shape, ' (EdgeConv applies an MLP to each and max-pools over the k neighbours)')\nprint('multi-scale grouping uses several radii per centroid; feature propagation interpolates back with inverse-distance weights over 3 NN.')\nw = 1 / np.sort(np.sqrt(D), 1)[:, 1:4]; print('example 3-NN inverse-distance weights (normalised):', np.round(w[0] / w[0].sum(), 3))", "out": "FPS  32 centroids: covering radius 0.3158   random  32: 0.4875\nFPS 128 centroids: covering radius 0.1596   random 128: 0.3012\nFPS 512 centroids: covering radius 0.0710   random 512: 0.1756\nball query r=0.2, k=32 around 128 centroids: neighbours found min 27 mean 31.9 max 32 (padded to 32)\ngrouped tensor (128, 32, 3)  local coords lie within the ball: True\nnormals from local PCA: mean error 3.80 deg, max 12.08 deg\nDGCNN edge features (128, 16, 6)  (EdgeConv applies an MLP to each and max-pools over the k neighbours)\nmulti-scale grouping uses several radii per centroid; feature propagation interpolates back with inverse-distance weights over 3 NN.\nexample 3-NN inverse-distance weights (normalised): [0.355 0.351 0.294]"}, "g_voxel": {"lang": "py", "file": "g_voxel.py", "src": "# g_voxel.py: voxelising shapes, 3D convolution from scratch, cost of dense grids vs sparse and octree storage.\nimport numpy as np, shapes\nrng = np.random.default_rng(0)\nfor res in (16, 32, 64, 128):\n    t = (np.arange(res) + 0.5) / res * 2 - 1; G = np.stack(np.meshgrid(t, t, t, indexing='ij'), -1)\n    occ = shapes.sdf('torus', G) < 0; surf = occ & ~(np.roll(occ, 1, 0) & np.roll(occ, -1, 0) & np.roll(occ, 1, 1) & np.roll(occ, -1, 1) & np.roll(occ, 1, 2) & np.roll(occ, -1, 2))\n    print('torus %3d^3: %9d cells, occupied %7d (%.1f%%), surface %6d (%.2f%%)  dense float32 %.1f MB' % (res, res ** 3, occ.sum(), 100 * occ.mean(), surf.sum(), 100 * surf.mean(), res ** 3 * 4 / 1e6))\nprint('true torus volume 2 pi^2 R r^2 = %.4f ; voxel estimate at 128^3 = %.4f' % (2 * np.pi ** 2 * 0.6 * 0.25 ** 2, occ.sum() * (2 / 128) ** 3))\ndef conv3d(x, w):                                      # x (C, D, H, W), w (K, C, 3, 3, 3), padding 1\n    C, D, H, W = x.shape; xp = np.pad(x, ((0, 0), (1, 1), (1, 1), (1, 1))); out = np.zeros((w.shape[0], D, H, W))\n    for a in range(3):\n        for b in range(3):\n            for c in range(3): out += np.einsum('kc,cdhw->kdhw', w[:, :, a, b, c], xp[:, a:a + D, b:b + H, c:c + W])\n    return out\nx = occ[::4, ::4, ::4][None].astype(float)            # 32^3\nlap = np.zeros((1, 1, 3, 3, 3)); lap[0, 0, 1, 1, 1] = -6\nfor a, b, c in [(0, 1, 1), (2, 1, 1), (1, 0, 1), (1, 2, 1), (1, 1, 0), (1, 1, 2)]: lap[0, 0, a, b, c] = 1\ny = conv3d(x, lap); print('3D Laplacian filter: non-zero responses %d = boundary voxels (inside or out), interior gives 0' % (np.abs(y) > 0).sum())\nfor res, cin, cout in ((32, 32, 64), (64, 32, 64), (128, 32, 64)):\n    print('3x3x3 conv %d->%d channels at %3d^3: %.2f GMACs dense; a sparse conv on ~2%% surface cells needs ~%.3f' % (cin, cout, res, res ** 3 * cin * cout * 27 / 1e9, 0.02 * res ** 3 * cin * cout * 27 / 1e9))\ndef octree_nodes(occ):                                  # count nodes of an octree that splits only mixed cells\n    n = 0; stack = [(0, 0, 0, occ.shape[0])]\n    while stack:\n        i, j, k, s = stack.pop(); n += 1; blk = occ[i:i + s, j:j + s, k:k + s]\n        if s > 1 and blk.any() and not blk.all():\n            h = s // 2; stack += [(i + a, j + b, k + c, h) for a in (0, h) for b in (0, h) for c in (0, h)]\n    return n\nprint('octree on the 128^3 torus: %d nodes vs %d dense cells (%.1fx smaller)' % (octree_nodes(occ), occ.size, occ.size / octree_nodes(occ)))", "out": "torus  16^3:      4096 cells, occupied     424 (10.4%), surface    280 (6.84%)  dense float32 0.0 MB\ntorus  32^3:     32768 cells, occupied    3072 (9.4%), surface   1184 (3.61%)  dense float32 0.1 MB\ntorus  64^3:    262144 cells, occupied   24488 (9.3%), surface   5008 (1.91%)  dense float32 1.0 MB\ntorus 128^3:   2097152 cells, occupied  194248 (9.3%), surface  20376 (0.97%)  dense float32 8.4 MB\ntrue torus volume 2 pi^2 R r^2 = 0.7402 ; voxel estimate at 128^3 = 0.7410\n3D Laplacian filter: non-zero responses 2608 = boundary voxels (inside or out), interior gives 0\n3x3x3 conv 32->64 channels at  32^3: 1.81 GMACs dense; a sparse conv on ~2% surface cells needs ~0.036\n3x3x3 conv 32->64 channels at  64^3: 14.50 GMACs dense; a sparse conv on ~2% surface cells needs ~0.290\n3x3x3 conv 32->64 channels at 128^3: 115.96 GMACs dense; a sparse conv on ~2% surface cells needs ~2.319\noctree on the 128^3 torus: 48201 nodes vs 2097152 dense cells (43.5x smaller)"}, "h_deepsdf": {"lang": "py", "file": "h_deepsdf.py", "src": "# h_deepsdf.py: DeepSDF auto-decoder: one MLP f(z, x) for many shapes, a learned latent code per shape, test-time code optimisation.\nimport numpy as np, ag, shapes\nrng = np.random.default_rng(0); Z = 8; H = 96\ntrain = [(c, s) for c in ('sphere', 'box', 'torus') for s in (0.7, 0.85, 1.0)]       # 9 training shapes\ncodes = ag.T(rng.normal(0, 0.01, (len(train), Z)))\nW = [ag.param(rng, Z + 3, H), ag.T(np.zeros(H)), ag.param(rng, H, H), ag.T(np.zeros(H)), ag.param(rng, H, 1), ag.T(np.zeros(1))]\ndef f(z, X): h = ag.cat([z, ag.T(X)], 1); h = (h @ W[0] + W[1]).relu(); h = (h @ W[2] + W[3]).relu(); return (h @ W[4] + W[5])[:, 0]\ndef batch(c, s, n, r):                             # half near the surface, half uniform; clamp the SDF to +-0.1 as DeepSDF does\n    X = np.r_[shapes.sample(c, n // 2, r, s=s, rot=False) + 0.05 * r.standard_normal((n // 2, 3)), r.uniform(-1, 1, (n // 2, 3))]\n    return X, np.clip(shapes.sdf(c, X, s), -0.1, 0.1)\ndata = [batch(c, s, 1024, rng) for c, s in train]\nopt = ag.Adam(W + [codes], 2e-3)\nfor it in range(4000):\n    if it == 3000: opt.lr = 5e-4\n    i = it % len(train); X, d = data[i]; sel = rng.choice(len(X), 256, replace=False)\n    zi = codes[np.full(256, i)]\n    L = ((f(zi, X[sel]) - d[sel]) ** 2).mean() + 1e-5 * (codes ** 2).sum()       # data term + Gaussian prior on codes\n    L.backward(); opt.step()\n    if it in (0, 999, 3999): print('iter %4d  loss %.5f' % (it + 1, L.data))\ndef err(z, c, s, r):\n    X, d = batch(c, s, 2000, r); p = f(ag.T(np.repeat(z, len(X), 0)), X).data; band = np.abs(d) < 0.1\n    far = np.abs(d) > 0.02\n    return np.abs(np.clip(p, -.1, .1) - d)[band].mean(), ((p > 0) == (d > 0))[far].mean()\nfor i in (0, 4, 8): e, a = err(codes.data[i:i + 1], *train[i], np.random.default_rng(5)); print('train shape %-15s mean |sdf err| in band %.4f  sign right (|d| > 0.02) %.1f%%' % ('%s s=%.2f' % train[i], e, 100 * a))\n# test time: freeze the network and optimise only a fresh code for an unseen shape, from 300 samples\nfor c, s in (('sphere', 0.78), ('torus', 0.92)):\n    z = ag.T(np.zeros((1, Z))); oz = ag.Adam([z], 1e-2); X, d = batch(c, s, 300, rng)\n    for it in range(300):\n        L = ((f(ag.T(np.ones((len(X), 1))) @ z, X) - d) ** 2).mean() + 1e-5 * (z ** 2).sum(); L.backward(); oz.step()\n    e, a = err(z.data, c, s, np.random.default_rng(6)); print('unseen %-6s s=%.2f: code fitted from 300 samples -> |sdf err| %.4f  sign right %.1f%%' % (c, s, e, 100 * a))\nprint('codes of the 9 training shapes (first 3 dims):\\n', np.round(codes.data[:, :3], 3))", "out": "iter    1  loss 0.04226\niter 1000  loss 0.00061\niter 4000  loss 0.00010\ntrain shape sphere s=0.70   mean |sdf err| in band 0.0062  sign right (|d| > 0.02) 100.0%\ntrain shape box s=0.85      mean |sdf err| in band 0.0101  sign right (|d| > 0.02) 99.9%\ntrain shape torus s=1.00    mean |sdf err| in band 0.0096  sign right (|d| > 0.02) 100.0%\nunseen sphere s=0.78: code fitted from 300 samples -> |sdf err| 0.0059  sign right 100.0%\nunseen torus  s=0.92: code fitted from 300 samples -> |sdf err| 0.0087  sign right 99.9%\ncodes of the 9 training shapes (first 3 dims):\n [[-0.037  0.005  0.033]\n [ 0.002  0.035  0.096]\n [ 0.051  0.068  0.153]\n [ 0.045 -0.003 -0.039]\n [ 0.091  0.025  0.007]\n [ 0.146  0.052  0.068]\n [-0.043 -0.058 -0.097]\n [-0.026 -0.043 -0.055]\n [-0.005 -0.019 -0.026]]"}, "h_gauss": {"lang": "py", "file": "h_gauss.py", "src": "# h_gauss.py: 3D Gaussian splats as a representation: covariance from scale + rotation, EWA projection to a 2D conic, opacity, spherical harmonics.\nimport numpy as np\ndef quat_to_R(q):\n    w, x, y, z = q / np.linalg.norm(q)\n    return np.array([[1 - 2 * (y * y + z * z), 2 * (x * y - w * z), 2 * (x * z + w * y)], [2 * (x * y + w * z), 1 - 2 * (x * x + z * z), 2 * (y * z - w * x)], [2 * (x * z - w * y), 2 * (y * z + w * x), 1 - 2 * (x * x + y * y)]])\ns = np.array([0.30, 0.10, 0.02]); q = np.array([np.cos(np.pi / 8), 0, 0, np.sin(np.pi / 8)])     # 45 deg about z\nR = quat_to_R(q); M = R @ np.diag(s); Sig = M @ M.T\nprint('Sigma = R S S^T R^T =\\n', np.round(Sig, 5)); print('eigenvalues', np.round(np.linalg.eigvalsh(Sig), 5), '= scales^2', np.round(s[::-1] ** 2, 5), ' -> always positive semi-definite')\n# project: camera at origin looking down +z, focal f in pixels; Gaussian centred at mu\nf = 500.0; mu = np.array([0.2, -0.1, 3.0])\nJ = np.array([[f / mu[2], 0, -f * mu[0] / mu[2] ** 2], [0, f / mu[2], -f * mu[1] / mu[2] ** 2]])     # Jacobian of the perspective map at mu\nS2 = J @ Sig @ J.T + 0.3 * np.eye(2)                   # + low-pass filter (anti-aliasing dilation)\nuv = f * mu[:2] / mu[2]; print('centre projects to pixel offset', np.round(uv, 2), '; 2D covariance\\n', np.round(S2, 3))\nev = np.linalg.eigvalsh(S2); r = 3 * np.sqrt(ev.max()); print('3-sigma screen radius %.1f px -> tile bounding box %d x %d px' % (r, 2 * np.ceil(r), 2 * np.ceil(r)))\nconic = np.linalg.inv(S2); opacity = 0.8\nfor d in ([0, 0], [5, 5], [20, 0], [0, 20]):\n    d = np.array(d, float); a = opacity * np.exp(-0.5 * d @ conic @ d); print('pixel offset %-12s alpha = %.4f' % (d.tolist(), a))\n# monte-carlo check of the linearised projection\nrng = np.random.default_rng(0); P = mu + rng.standard_normal((200000, 3)) @ M.T; proj = f * P[:, :2] / P[:, 2:]\nprint('Monte-Carlo covariance of projected samples\\n', np.round(np.cov(proj.T), 3), '\\n(close to J Sigma J^T without the +0.3 dilation; the gap is the linearisation error)')\n# spherical harmonics colour: degree 0..3 -> 1, 4, 9, 16 coefficients per channel\nC0, C1 = 0.28209479177387814, 0.4886025119029199\nsh = np.zeros((4, 3)); sh[0] = [1.2, 0.5, 0.3]; sh[1:] = [[0, 0, 0], [0.4, 0, 0], [0, 0, 0]]     # dc + one y/z-ish lobe (order y, z, x)\nfor dvec in ([0, 0, 1], [0, 0, -1], [1, 0, 0]):\n    x, y, z = dvec; col = C0 * sh[0] - C1 * y * sh[1] + C1 * z * sh[2] - C1 * x * sh[3] + 0.5\n    print('view dir %-11s colour %s' % (dvec, np.round(np.clip(col, 0, 1), 3)))\nper = 3 + 3 + 4 + 1 + 48; print('floats per Gaussian: pos 3 + scale 3 + rot 4 + opacity 1 + SH deg 3 (16x3) 48 = %d -> %d bytes; 3M Gaussians = %.0f MB' % (per, per * 4, 3e6 * per * 4 / 1e6))", "out": "Sigma = R S S^T R^T =\n [[0.05   0.04   0.    ]\n [0.04   0.05   0.    ]\n [0.     0.     0.0004]]\neigenvalues [0.0004 0.01   0.09  ] = scales^2 [0.0004 0.01   0.09  ]  -> always positive semi-definite\ncentre projects to pixel offset [ 33.33 -16.67] ; 2D covariance\n [[1389.238 1111.086]\n [1111.086 1389.201]]\n3-sigma screen radius 150.0 px -> tile bounding box 302 x 302 px\npixel offset [0.0, 0.0]   alpha = 0.8000\npixel offset [5.0, 5.0]   alpha = 0.7920\npixel offset [20.0, 0.0]  alpha = 0.5365\npixel offset [0.0, 20.0]  alpha = 0.5365\nMonte-Carlo covariance of projected samples\n [[1398.57  1120.059]\n [1120.059 1396.995]] \n(close to J Sigma J^T without the +0.3 dilation; the gap is the linearisation error)\nview dir [0, 0, 1]   colour [1.    0.641 0.585]\nview dir [0, 0, -1]  colour [0.643 0.641 0.585]\nview dir [1, 0, 0]   colour [0.839 0.641 0.585]\nfloats per Gaussian: pos 3 + scale 3 + rot 4 + opacity 1 + SH deg 3 (16x3) 48 = 59 -> 236 bytes; 3M Gaussians = 708 MB"}, "h_hashgrid": {"lang": "py", "file": "h_hashgrid.py", "src": "# h_hashgrid.py: Instant-NGP multiresolution hash encoding from scratch, fitted to a 2D image; collisions, table size, speed of convergence.\nimport numpy as np, ag\nrng = np.random.default_rng(0); S = 128\nyy, xx = np.mgrid[0:S, 0:S] / (S - 1)\nimg = 0.5 + 0.5 * np.sin(18 * xx * (1 + yy)) * np.cos(14 * yy) ; img[(xx - .6) ** 2 + (yy - .4) ** 2 < .03] = 1.0; img[(np.abs(xx - .25) < .08) & (np.abs(yy - .7) < .2)] = 0.0\nX = np.c_[xx.ravel(), yy.ravel()]; Y = img.ravel()[:, None]\nLv, T, Fd, Nmin, Nmax = 8, 2 ** 12, 2, 8, 128\nb = np.exp((np.log(Nmax) - np.log(Nmin)) / (Lv - 1)); Ns = np.floor(Nmin * b ** np.arange(Lv)).astype(int)\nPI = np.array([1, 2654435761], dtype=np.uint64)\ndef hidx(ix, l):\n    if (Ns[l] + 1) ** 2 <= T: return ix[:, 0] * (Ns[l] + 1) + ix[:, 1]       # coarse levels: direct 1:1 indexing\n    h = (ix[:, 0].astype(np.uint64) * PI[0]) ^ (ix[:, 1].astype(np.uint64) * PI[1]); return (h % np.uint64(T)).astype(int)\ntables = rng.uniform(-1e-4, 1e-4, (Lv, T, Fd))\ndef encode(P):\n    out = np.zeros((len(P), Lv * Fd)); cache = []\n    for l in range(Lv):\n        u = P * Ns[l]; i = np.floor(u).astype(int); f = u - i; ent = []\n        for dx in (0, 1):\n            for dy in (0, 1):\n                w = (f[:, 0] if dx else 1 - f[:, 0]) * (f[:, 1] if dy else 1 - f[:, 1]); k = hidx(i + [dx, dy], l)\n                out[:, l * Fd:(l + 1) * Fd] += w[:, None] * tables[l, k]; ent.append((w, k))\n        cache.append(ent)\n    return out, cache\nfor l in range(Lv):\n    cells = (Ns[l] + 1) ** 2; print('level %d: resolution %3d, %6d grid vertices -> %s' % (l, Ns[l], cells, 'direct' if cells <= T else 'hashed into %d slots (collisions guaranteed)' % T))\nW = [ag.param(rng, Lv * Fd, 64), ag.T(np.zeros(64)), ag.param(rng, 64, 1), ag.T(np.zeros(1))]\nopt = ag.Adam(W, 1e-2); m = np.zeros_like(tables); v = np.zeros_like(tables)\nfor it in range(1, 801):\n    sel = rng.integers(0, len(X), 4096); e, cache = encode(X[sel]); Et = ag.T(e)\n    L = ((((Et @ W[0] + W[1]).relu() @ W[2] + W[3]) - Y[sel]) ** 2).mean(); L.backward(); opt.step()\n    G = np.zeros_like(tables)\n    for l in range(Lv):\n        for w, k in cache[l]: np.add.at(G[l], k, w[:, None] * Et.grad[:, l * Fd:(l + 1) * Fd])\n    m = 0.9 * m + 0.1 * G; v = 0.99 * v + 0.01 * G * G; tables -= 1e-2 * (m / (1 - 0.9 ** it)) / (np.sqrt(v / (1 - 0.99 ** it)) + 1e-15)\n    if it in (1, 100, 800):\n        e, _ = encode(X); mse = float((((np.maximum(e @ W[0].data + W[1].data, 0) @ W[2].data + W[3].data) - Y) ** 2).mean())\n        print('iter %3d  full-image PSNR %.1f dB' % (it, 10 * np.log10(1 / mse)))\nprint('parameters: tables %d + MLP %d; the image has %d pixels (more parameters than pixels in 2D; in 3D a 2^19 table is far smaller than a dense 2048^3 grid)' % (tables.size, sum(p.data.size for p in W), S * S))\nprint('hash of vertex (5, 7): (5 x 1) xor (7 x 2654435761) mod 4096 =', int(((np.uint64(5) * PI[0]) ^ (np.uint64(7) * PI[1])) % np.uint64(T)))", "out": "level 0: resolution   8,     81 grid vertices -> direct\nlevel 1: resolution  11,    144 grid vertices -> direct\nlevel 2: resolution  17,    324 grid vertices -> direct\nlevel 3: resolution  26,    729 grid vertices -> direct\nlevel 4: resolution  39,   1600 grid vertices -> direct\nlevel 5: resolution  57,   3364 grid vertices -> direct\nlevel 6: resolution  86,   7569 grid vertices -> hashed into 4096 slots (collisions guaranteed)\nlevel 7: resolution 128,  16641 grid vertices -> hashed into 4096 slots (collisions guaranteed)\niter   1  full-image PSNR 5.5 dB\niter 100  full-image PSNR 33.5 dB\niter 800  full-image PSNR 46.8 dB\nparameters: tables 65536 + MLP 1153; the image has 16384 pixels (more parameters than pixels in 2D; in 3D a 2^19 table is far smaller than a dense 2048^3 grid)\nhash of vertex (5, 7): (5 x 1) xor (7 x 2654435761) mod 4096 = 978"}, "h_occnet": {"lang": "py", "file": "h_occnet.py", "src": "# h_occnet.py: Occupancy Networks: a PointNet encoder maps a point cloud to z; a decoder predicts p(inside | x, z) with BCE.\nimport numpy as np, ag, shapes\nrng = np.random.default_rng(0); Z, H = 32, 64\nEnc = [ag.param(rng, 3, H), ag.T(np.zeros(H)), ag.param(rng, H, Z), ag.T(np.zeros(Z))]\nDec = [ag.param(rng, Z + 3, H), ag.T(np.zeros(H)), ag.param(rng, H, H), ag.T(np.zeros(H)), ag.param(rng, H, 1), ag.T(np.zeros(1))]\ndef encode(P): return (((ag.T(P) @ Enc[0] + Enc[1]).relu()).max(0, keepdims=True) @ Enc[2] + Enc[3])\ndef decode(z, X): h = ag.cat([ag.T(np.ones((len(X), 1))) @ z, ag.T(X)], 1); h = (h @ Dec[0] + Dec[1]).relu(); h = (h @ Dec[2] + Dec[3]).relu(); return (h @ Dec[4] + Dec[5])[:, 0]\ndef bce(logit, y): return (logit.relu() - logit * ag.T(y) + ((-(logit.relu() * 2 - logit)).exp() + 1).log()).mean()   # stable: max(l,0) - l y + log(1+e^-|l|)\ndef item(r):\n    c = shapes.CLASSES[r.integers(4)]; s = r.uniform(0.7, 1.0); P = shapes.sample(c, 256, r, s=s, rot=False, noise=0.005)\n    X = r.uniform(-1, 1, (512, 3)); X[:256] = P[:256] + 0.1 * r.standard_normal((256, 3))\n    return P, X, (shapes.sdf(c, X, s) < 0).astype(float), c\nopt = ag.Adam(Enc + Dec, 2e-3)\nfor it in range(5000):\n    if it == 3500: opt.lr = 5e-4\n    P, X, y, _ = item(rng); L = bce(decode(encode(P), X), y); L.backward(); opt.step()\n    if it in (0, 999, 4999): print('iter %4d  BCE %.4f' % (it + 1, L.data))\nP, X, y, c = item(np.random.default_rng(3)); p = decode(encode(P), X).data > 0\nprint('one test shape (%s): accuracy %.1f%%' % (c, 100 * (p == (y > 0.5)).mean()))\nres = []\nfor k in range(30):\n    r = np.random.default_rng(100 + k); c = shapes.CLASSES[r.integers(4)]; s = r.uniform(0.7, 1.0); P = shapes.sample(c, 256, r, s=s, rot=False, noise=0.005)\n    X = r.uniform(-1, 1, (5000, 3)); gt = shapes.sdf(c, X, s) < 0; pr = decode(encode(P), X).data > 0\n    res.append((c, (gt & pr).sum() / (gt | pr).sum()))\nfor c in shapes.CLASSES[:4]:\n    v = [i for cc, i in res if cc == c]; print('volumetric IoU on unseen %-8s (%2d shapes): mean %.3f' % (c, len(v), np.mean(v)))\nprint('the thin torus is hardest: one global code loses local detail, the motivation for convolutional occupancy and triplanes.')\nprint('the decoder is queried at any resolution: extract the 0.5 level set with marching cubes (Multiresolution IsoSurface Extraction in the paper).')", "out": "iter    1  BCE 0.8521\niter 1000  BCE 0.1817\niter 5000  BCE 0.0709\none test shape (torus): accuracy 91.8%\nvolumetric IoU on unseen sphere   ( 7 shapes): mean 0.954\nvolumetric IoU on unseen box      (11 shapes): mean 0.924\nvolumetric IoU on unseen cylinder ( 9 shapes): mean 0.921\nvolumetric IoU on unseen torus    ( 3 shapes): mean 0.705\nthe thin torus is hardest: one global code loses local detail, the motivation for convolutional occupancy and triplanes.\nthe decoder is queried at any resolution: extract the 0.5 level set with marching cubes (Multiresolution IsoSurface Extraction in the paper)."}, "h_pe": {"lang": "py", "file": "h_pe.py", "src": "# h_pe.py: spectral bias: fit a detailed 1D signal and a 2D pattern with a plain MLP, Fourier-feature positional encoding, and SIREN.\nimport numpy as np, ag\nrng = np.random.default_rng(0)\nx = np.linspace(0, 1, 512)[:, None]; y = np.sin(2 * np.pi * 3 * x) + 0.5 * np.sign(np.sin(2 * np.pi * 12 * x)) + 0.25 * np.sin(2 * np.pi * 40 * x)\ndef pe(x, L): return np.concatenate([x] + [f(2 ** k * np.pi * x) for k in range(L) for f in (np.sin, np.cos)], 1)\ndef fit(X, Y, act='relu', w0=30.0, steps=1500, H=128, seed=0):\n    r = np.random.default_rng(seed); d = X.shape[1]\n    if act == 'sine':                                    # SIREN init (Sitzmann et al. 2020)\n        W = [ag.T(r.uniform(-1 / d, 1 / d, (d, H))), ag.T(np.zeros(H)), ag.T(r.uniform(-np.sqrt(6 / H) / w0, np.sqrt(6 / H) / w0, (H, H))), ag.T(np.zeros(H)), ag.param(r, H, 1), ag.T(np.zeros(1))]\n        g = lambda z: (z * w0).sin()\n    else:\n        W = [ag.param(r, d, H), ag.T(np.zeros(H)), ag.param(r, H, H), ag.T(np.zeros(H)), ag.param(r, H, 1), ag.T(np.zeros(1))]; g = lambda z: z.relu()\n    f = lambda X: g(g(ag.T(X) @ W[0] + W[1]) @ W[2] + W[3]) @ W[4] + W[5]\n    o = ag.Adam(W, 1e-3)\n    for s in range(steps): L = ((f(X) - Y) ** 2).mean(); L.backward(); o.step()\n    return float(L.data), f\ndef psnr(mse, peak): return 10 * np.log10(peak ** 2 / mse)\nfor name, X, act in (('plain ReLU MLP, input x', x, 'relu'), ('Fourier PE L=4 (max freq 8 pi)', pe(x, 4), 'relu'), ('Fourier PE L=8 (max freq 128 pi)', pe(x, 8), 'relu'), ('SIREN w0=30', x, 'sine')):\n    mse, _ = fit(X, y, act); print('%-34s MSE %.5f  PSNR %.1f dB' % (name, mse, psnr(mse, np.ptp(y))))\n# generalisation: hold out every other sample -> too high a frequency band interpolates badly\ntr, te = slice(0, None, 2), slice(1, None, 2)\nfor L in (4, 8, 12):\n    X = pe(x, L); _, f = fit(X[tr], y[tr], steps=1500); e = float(((f(X[te]).data - y[te]) ** 2).mean())\n    print('PE L=%2d: train on even samples, test on odd: test MSE %.4f' % (L, e))\nprint('NeRF uses L=10 for position (60 extra dims) and L=4 for view direction.')", "out": "plain ReLU MLP, input x            MSE 0.50059  PSNR 13.8 dB\nFourier PE L=4 (max freq 8 pi)     MSE 0.01314  PSNR 29.6 dB\nFourier PE L=8 (max freq 128 pi)   MSE 0.00001  PSNR 61.3 dB\nSIREN w0=30                        MSE 0.00988  PSNR 30.9 dB\nPE L= 4: train on even samples, test on odd: test MSE 0.0272\nPE L= 8: train on even samples, test on odd: test MSE 0.0256\nPE L=12: train on even samples, test on odd: test MSE 0.1675\nNeRF uses L=10 for position (60 extra dims) and L=4 for view direction."}, "h_triplane": {"lang": "py", "file": "h_triplane.py", "src": "# h_triplane.py: triplane features: three axis-aligned 2D feature planes, bilinear lookup, summed, tiny MLP decoder; fitted to a torus.\nimport numpy as np, ag, shapes\nrng = np.random.default_rng(0); R, C, H = 32, 8, 32\nplanes = rng.normal(0, 0.1, (3, R, R, C))                     # xy, xz, yz planes\nAX = [(0, 1), (0, 2), (1, 2)]\ndef lookup(X):\n    \"\"\"bilinear sample of each plane; returns summed features and the weights/indices needed for the backward scatter\"\"\"\n    feats = np.zeros((len(X), C)); cache = []\n    for p, (a, b) in enumerate(AX):\n        u = (X[:, [a, b]] + 1) / 2 * (R - 1); i = np.clip(np.floor(u).astype(int), 0, R - 2); f = u - i\n        w = [(1 - f[:, 0]) * (1 - f[:, 1]), f[:, 0] * (1 - f[:, 1]), (1 - f[:, 0]) * f[:, 1], f[:, 0] * f[:, 1]]\n        ij = [(i[:, 0], i[:, 1]), (i[:, 0] + 1, i[:, 1]), (i[:, 0], i[:, 1] + 1), (i[:, 0] + 1, i[:, 1] + 1)]\n        for wk, (ii, jj) in zip(w, ij): feats += wk[:, None] * planes[p, ii, jj]\n        cache.append((w, ij))\n    return feats, cache\ndef scatter(g, cache):\n    G = np.zeros_like(planes)\n    for p, (w, ij) in enumerate(cache):\n        for wk, (ii, jj) in zip(w, ij): np.add.at(G[p], (ii, jj), wk[:, None] * g)\n    return G\nW = [ag.param(rng, C, H), ag.T(np.zeros(H)), ag.param(rng, H, 1), ag.T(np.zeros(1))]\nopt = ag.Adam(W, 3e-3); m = np.zeros_like(planes); v = np.zeros_like(planes)\nocc = lambda X: (shapes.sdf('torus', X, 0.9) < 0).astype(float)\nfor it in range(1, 2001):\n    X = rng.uniform(-1, 1, (2048, 3)); y = occ(X)\n    fe, cache = lookup(X); Ft = ag.T(fe); logit = ((Ft @ W[0] + W[1]).relu() @ W[2] + W[3])[:, 0]\n    L = (logit.relu() - logit * ag.T(y) + ((-(logit.relu() * 2 - logit)).exp() + 1).log()).mean(); L.backward(); opt.step()\n    g = scatter(Ft.grad, cache); m = 0.9 * m + 0.1 * g; v = 0.999 * v + 0.001 * g * g\n    planes -= 1e-2 * (m / (1 - 0.9 ** it)) / (np.sqrt(v / (1 - 0.999 ** it)) + 1e-8)        # Adam on the planes\n    if it in (1, 500, 2000): print('iter %4d  BCE %.4f' % (it, L.data))\nX = np.random.default_rng(1).uniform(-1, 1, (50000, 3)); gt = occ(X) > 0\nfe, _ = lookup(X); pr = (((ag.T(fe) @ W[0] + W[1]).relu() @ W[2] + W[3]).data[:, 0]) > 0\nprint('triplane %dx%d x 3 planes x %d channels: IoU on 50k random points %.3f' % (R, R, C, (gt & pr).sum() / (gt | pr).sum()))\nprint('memory: triplane %d floats vs dense %d^3 x %d grid %d floats (%.0fx smaller)' % (planes.size, R, C, R ** 3 * C, R ** 3 * C / planes.size))\nprint('limitation: each plane value is shared along the whole line perpendicular to it; the other planes and the MLP must tell points on that line apart.')\nprint('EG3D, generative triplanes and LRM-style models predict these planes with a network instead of fitting them per shape.')", "out": "iter    1  BCE 0.6756\niter  500  BCE 0.0026\niter 2000  BCE 0.0025\ntriplane 32x32 x 3 planes x 8 channels: IoU on 50k random points 0.978\nmemory: triplane 24576 floats vs dense 32^3 x 8 grid 262144 floats (11x smaller)\nlimitation: each plane value is shared along the whole line perpendicular to it; the other planes and the MLP must tell points on that line apart.\nEG3D, generative triplanes and LRM-style models predict these planes with a network instead of fitting them per shape."}, "i_dibr": {"lang": "py", "file": "i_dibr.py", "src": "# i_dibr.py: DIB-R / nvdiffrast ideas: exact gradients of interpolated attributes inside triangles, plus analytic edge antialiasing for silhouette gradients.\nimport numpy as np, ag\nS = 40; ys, xs = (np.mgrid[0:S, 0:S] + 0.5) / S * 2 - 1; Pix = np.c_[xs.ravel(), ys.ravel()]\ndef render(V, Ccol, aa=True):\n    \"\"\"V (3,2) vertices, Ccol (3,3) vertex colours. Barycentrics are differentiable functions of V; the edge term gives coverage gradients.\"\"\"\n    A, B, Cc = V[0:1], V[1:2], V[2:3]; P = ag.T(Pix)\n    def edge(a, b):                                                    # signed edge function, normalised to a distance in NDC\n        d = b - a; return ((P[:, 1:2] - a[:, 1:2]) * d[:, 0:1] - (P[:, 0:1] - a[:, 0:1]) * d[:, 1:2]) * (((d * d).sum(1, keepdims=True)) ** -0.5)\n    e0, e1, e2 = edge(B, Cc), edge(Cc, A), edge(A, B)\n    w0 = edge(B, Cc) * ((((Cc - B) * (Cc - B)).sum(1, keepdims=True)) ** 0.5); w1 = edge(Cc, A) * ((((A - Cc) * (A - Cc)).sum(1, keepdims=True)) ** 0.5); w2 = edge(A, B) * ((((B - A) * (B - A)).sum(1, keepdims=True)) ** 0.5)\n    tot = w0 + w1 + w2; l0, l1, l2 = w0 * tot ** -1, w1 * tot ** -1, w2 * tot ** -1     # barycentrics (DIB-R interpolation)\n    col = l0 @ Ccol[0:1] + l1 @ Ccol[1:2] + l2 @ Ccol[2:3]\n    px = 1.0 / S                                                         # pixel half-width in NDC\n    if aa: cov = ((e0 * (1 / px)).sigmoid() * (e1 * (1 / px)).sigmoid() * (e2 * (1 / px)).sigmoid())   # coverage ramps over ~1 pixel at edges\n    else: cov = ag.T(((e0.data > 0) & (e1.data > 0) & (e2.data > 0)).astype(float))\n    bg = np.array([[0.1, 0.1, 0.1]])\n    return col * cov + ag.T(bg) * (1 - cov)\nVt = np.array([[-0.6, -0.5], [0.7, -0.3], [0.0, 0.7]]); Ct = np.array([[1, 0, 0], [0, 1, 0], [0, 0, 1.0]])\ntarget = render(ag.T(Vt), ag.T(Ct)).data\nV = ag.T(np.array([[-0.4, -0.4], [0.5, -0.4], [0.1, 0.4]])); C = ag.T(np.full((3, 3), 0.5))\nL = ((render(V, C, aa=False) - ag.T(target)) ** 2).mean(); L.backward()\nprint('no antialiasing, flat 0.5 start colours: |dL/dV| = %.2e (interpolating equal colours ignores V, and hard coverage has no gradient), |dL/dC| = %.2e' % (np.abs(V.grad).max(), np.abs(C.grad).max()))\nL = ((render(V, C) - ag.T(target)) ** 2).mean(); L.backward(); print('with analytic AA: |dL/dV| = %.2e' % np.abs(V.grad).max())\nprint('gradcheck (V and C): %.2e' % ag.gradcheck(lambda: ((render(V, C) - ag.T(target)) ** 2).mean(), [V, C]))\nopt = ag.Adam([V, C], 0.01)\nfor it in range(400):\n    L = ((render(V, C) - ag.T(target)) ** 2).mean(); L.backward(); opt.step()\n    if it in (0, 99, 399): print('iter %3d  image MSE %.5f  vertex error %.4f  colour error %.4f' % (it + 1, L.data, np.abs(V.data - Vt).max(), np.abs(C.data - Ct).max()))\nprint('nvdiffrast splits this into rasterize -> interpolate -> texture -> antialias; only the antialias op gives visibility (edge) gradients.')", "out": "no antialiasing, flat 0.5 start colours: |dL/dV| = 1.07e-18 (interpolating equal colours ignores V, and hard coverage has no gradient), |dL/dC| = 6.51e-03\nwith analytic AA: |dL/dV| = 9.32e-03\ngradcheck (V and C): 1.05e-09\niter   1  image MSE 0.01260  vertex error 0.2900  colour error 0.5100\niter 100  image MSE 0.00000  vertex error 0.0008  colour error 0.0064\niter 400  image MSE 0.00000  vertex error 0.0000  colour error 0.0000\nnvdiffrast splits this into rasterize -> interpolate -> texture -> antialias; only the antialias op gives visibility (edge) gradients."}, "i_meshfit": {"lang": "py", "file": "i_meshfit.py", "src": "# i_meshfit.py: gradients flowing into geometry: deform a sphere mesh to a target shape with Chamfer + Laplacian + edge-length losses.\nimport numpy as np, m3d, shapes\nfrom scipy.spatial import cKDTree\nrng = np.random.default_rng(0)\nV0, F = m3d.icosphere(3); V0 = V0 * 0.7; E = m3d.edges(F)\nT = shapes.sample('box', 3000, rng, s=1.0, rot=False)                          # target: points on a box of half-size 0.6\nTT = cKDTree(T); n = len(V0); A = np.zeros((n, n)); A[E[:, 0], E[:, 1]] = A[E[:, 1], E[:, 0]] = 1; Lu = A / A.sum(1, keepdims=True) - np.eye(n)\ndef losses(V, P):\n    d1, i = TT.query(P); d2, j = cKDTree(P).query(T)                    # k-d trees: O(n log n) nearest neighbours instead of an n x m matrix\n    ch = (d1 ** 2).mean() + (d2 ** 2).mean()\n    # analytic Chamfer gradient wrt the sampled points P\n    g = 2 * (P - T[i]) / len(P); np.add.at(g, j, 2 * (P[j] - T) / len(T))\n    return ch, g\ndef step_grad(V, wl, we, L0):\n    # sample points on the current mesh with fixed barycentrics -> gradient back to vertices through the barycentric weights\n    f = rng.integers(0, len(F), 3000); u, v = rng.random(3000), rng.random(3000); s = u + v > 1; u[s], v[s] = 1 - u[s], 1 - v[s]\n    w = np.c_[1 - u - v, u, v]; P = (w[:, :, None] * V[F[f]]).sum(1)\n    ch, gP = losses(V, P); gV = np.zeros_like(V)\n    for k in range(3): np.add.at(gV, F[f, k], w[:, k:k + 1] * gP)\n    LV = Lu @ V; lap = (LV ** 2).sum(1).mean(); gV += wl * 2 * (Lu.T @ LV) / n                   # smoothness\n    d = V[E[:, 0]] - V[E[:, 1]]; el = (d ** 2).sum(1); eL = ((el - L0) ** 2).mean(); ge = we * 4 * (el - L0)[:, None] * d / len(E)\n    np.add.at(gV, E[:, 0], ge); np.add.at(gV, E[:, 1], -ge)\n    return ch, lap, eL, gV\nL0 = ((V0[E[:, 0]] - V0[E[:, 1]]) ** 2).sum(1).mean() * 1.4\nV = V0.copy(); m = np.zeros_like(V); v2 = np.zeros_like(V)\nfor it in range(1, 401):\n    ch, lap, eL, g = step_grad(V, 2.0, 50.0, L0)\n    m = 0.9 * m + 0.1 * g; v2 = 0.999 * v2 + 0.001 * g * g; V -= 0.005 * (m / (1 - 0.9 ** it)) / (np.sqrt(v2 / (1 - 0.999 ** it)) + 1e-12)\n    if it in (1, 50, 400): print('iter %3d  chamfer %.5f  laplacian %.5f  edge-length %.6f' % (it, ch, lap, eL))\nfn = m3d.face_normals(V, F); flips = (np.einsum('ij,ij->i', fn, V[F].mean(1)) < 0).sum()\nprint('final: chamfer to target %.5f (start %.5f); inverted faces %d; volume %.3f (box target ~1.728)' % (m3d.chamfer(m3d.sample_surface(V, F, 3000, rng), T), m3d.chamfer(m3d.sample_surface(V0, F, 3000, rng), T), flips, m3d.volume(V, F)))\n# remove the regularisers: the mesh tangles\nV = V0.copy(); m[:] = 0; v2[:] = 0\nfor it in range(1, 401):\n    ch, lap, eL, g = step_grad(V, 0.0, 0.0, L0); m = 0.9 * m + 0.1 * g; v2 = 0.999 * v2 + 0.001 * g * g; V -= 0.005 * (m / (1 - 0.9 ** it)) / (np.sqrt(v2 / (1 - 0.999 ** it)) + 1e-12)\nfn = m3d.face_normals(V, F); print('no regularisers: chamfer %.5f but inverted faces %d, laplacian energy %.5f -> a valid surface needs priors' % (m3d.chamfer(m3d.sample_surface(V, F, 3000, rng), T), (np.einsum('ij,ij->i', fn, V[F].mean(1)) < 0).sum(), ((Lu @ V) ** 2).sum(1).mean()))", "out": "iter   1  chamfer 0.02086  laplacian 0.00010  edge-length 0.000022\niter  50  chamfer 0.00189  laplacian 0.00028  edge-length 0.000008\niter 400  chamfer 0.00194  laplacian 0.00025  edge-length 0.000007\nfinal: chamfer to target 0.00194 (start 0.02090); inverted faces 0; volume 1.728 (box target ~1.728)\nno regularisers: chamfer 0.00167 but inverted faces 360, laplacian energy 0.01833 -> a valid surface needs priors"}, "i_neus": {"lang": "py", "file": "i_neus.py", "src": "# i_neus.py: turning an SDF into volume-rendering weights. Naive sigma = f(sdf) is biased; NeuS's logistic-CDF opacity is unbiased.\nimport numpy as np\nt = np.linspace(0, 4, 4001); dt = t[1] - t[0]; surf = 2.0\ndef weights_from_alpha(a): T = np.concatenate([[1], np.cumprod(1 - a)[:-1]]); return T * a\nfor theta in (90, 45, 20):                                   # ray hits a plane at depth 2 at angle theta to the surface\n    cosv = np.cos(np.radians(90 - theta)); sdf = (surf - t) * cosv        # sdf along the ray (positive outside)\n    for s in (16, 64):\n        phi = s * np.exp(-s * sdf) / (1 + np.exp(-s * sdf)) ** 2           # logistic density of the sdf\n        w_naive = weights_from_alpha(1 - np.exp(-phi * dt * 4))             # VolSDF/naive style: sigma proportional to phi(sdf)\n        Phi = 1 / (1 + np.exp(-s * sdf)); a = np.clip((Phi[:-1] - Phi[1:]) / Phi[:-1], 0, 1)    # NeuS discrete opacity\n        w_neus = weights_from_alpha(np.concatenate([a, [0]]))\n        print('hit angle %2d deg, s=%2d: weight peak  naive %.3f   NeuS %.3f   (surface at %.3f)' % (theta, s, t[w_naive.argmax()], t[w_neus.argmax()], surf))\nprint('NeuS peaks exactly at the zero crossing for any angle; the naive density peaks in front of it, and the bias shrinks only as s grows.')", "out": "hit angle 90 deg, s=16: weight peak  naive 1.910   NeuS 1.999   (surface at 2.000)\nhit angle 90 deg, s=64: weight peak  naive 1.977   NeuS 2.000   (surface at 2.000)\nhit angle 45 deg, s=16: weight peak  naive 1.844   NeuS 1.999   (surface at 2.000)\nhit angle 45 deg, s=64: weight peak  naive 1.961   NeuS 2.000   (surface at 2.000)\nhit angle 20 deg, s=16: weight peak  naive 1.549   NeuS 2.000   (surface at 2.000)\nhit angle 20 deg, s=64: weight peak  naive 1.887   NeuS 1.999   (surface at 2.000)\nNeuS peaks exactly at the zero crossing for any angle; the naive density peaks in front of it, and the bias shrinks only as s grows."}, "i_softras": {"lang": "py", "file": "i_softras.py", "src": "# i_softras.py: why hard rasterisation has no useful gradient, and Soft Rasterizer: sigmoid coverage, aggregated silhouettes, fitting a polygon.\nimport numpy as np, ag\nS = 48; ys, xs = (np.mgrid[0:S, 0:S] + 0.5) / S * 2 - 1; Pix = np.c_[xs.ravel(), ys.ravel()]\ntarget = ((np.abs(Pix[:, 0]) + np.abs(Pix[:, 1])) < 0.7).astype(float)          # a diamond silhouette\nn = 12; t = np.linspace(0, 2 * np.pi, n, endpoint=False); V0 = np.c_[0.3 * np.cos(t) + 0.15, 0.3 * np.sin(t) - 0.1]   # start: small offset circle\ndef signed_dist(V):\n    \"\"\"signed distance (in NDC) from every pixel to the polygon boundary: negative inside. Differentiable in V via ag.\"\"\"\n    Vt = V; A = Vt; B = ag.cat([Vt[1:], Vt[:1]], 0)               # edges A_k -> B_k\n    P = ag.T(Pix[:, None, :]); AB = (B - A).reshape(1, n, 2); AP = P - A.reshape(1, n, 2)\n    tt = ((AP * AB).sum(-1) * ((AB * AB).sum(-1) ** -1)); tt = tt - (tt - 1).relu() ; tt = tt.relu()      # clamp to [0, 1]\n    D = AP - AB * tt.reshape(len(Pix), n, 1); d = ((D * D).sum(-1) + 1e-9) ** 0.5\n    a, b = A.data[None], B.data[None]; px, py = Pix[:, None, 0], Pix[:, None, 1]       # even-odd ray test: works for any simple polygon\n    hit = ((a[..., 1] > py) != (b[..., 1] > py)) & (px < a[..., 0] + (py - a[..., 1]) * (b[..., 0] - a[..., 0]) / (b[..., 1] - a[..., 1] + 1e-12))\n    inside = hit.sum(1) % 2 == 1\n    dmin = -((-d * 50).exp().sum(1).log()) * (1 / 50)                             # smooth minimum over edges\n    return dmin * ag.T(np.where(inside, -1.0, 1.0))\ndef render(V, sigma): return (-(signed_dist(V) * (1 / sigma))).sigmoid()          # SoftRas coverage: sigmoid(-d / sigma)\nV = ag.T(V0.copy())\nhard = lambda Vd: (signed_dist(ag.T(Vd)).data < 0).astype(float)\ne = 1e-4; Vp = V0.copy(); Vp[0, 0] += e; print('hard raster: finite-difference gradient of the loss wrt a vertex = %.1f (piecewise constant -> zero almost everywhere)' % ((((hard(Vp) - target) ** 2).sum() - ((hard(V0) - target) ** 2).sum()) / e))\nsig = 0.02\nimg = render(V, sig); L = ((img - ag.T(target)) ** 2).mean(); L.backward(); print('soft raster (sigma=%.2f): gradient wrt vertex 0 = %s' % (sig, np.round(V.grad[0], 5)))\nprint('gradcheck of the soft renderer: %.2e' % ag.gradcheck(lambda: ((render(V, sig) - ag.T(target)) ** 2).mean(), [V], eps=1e-6))\nopt = ag.Adam([V], 0.005)\nfor it in range(300):\n    s = 0.08 * (1 - it / 300) + 0.02                        # anneal sigma: blurry first (long-range gradients), sharp later\n    lap = V - (ag.cat([V[1:], V[:1]], 0) + ag.cat([V[-1:], V[:-1]], 0)) * 0.5     # keep the outline smooth (mesh regulariser)\n    L = ((render(V, s) - ag.T(target)) ** 2).mean() + 0.01 * (lap * lap).sum(); L.backward(); opt.step()\n    if it in (0, 99, 299): iou = ((hard(V.data) > 0) & (target > 0)).sum() / ((hard(V.data) > 0) | (target > 0)).sum(); print('iter %3d sigma %.3f loss %.4f  silhouette IoU %.3f' % (it + 1, s, L.data, iou))\nprint('fitted vertex radii (|x|+|y| = 0.7 is the diamond):', np.round(np.abs(V.data).sum(1), 3))", "out": "hard raster: finite-difference gradient of the loss wrt a vertex = 0.0 (piecewise constant -> zero almost everywhere)\nsoft raster (sigma=0.02): gradient wrt vertex 0 = [-0.04544 -0.00027]\ngradcheck of the soft renderer: 2.42e-08\niter   1 sigma 0.100 loss 0.1217  silhouette IoU 0.290\niter 100 sigma 0.074 loss 0.0301  silhouette IoU 0.929\niter 300 sigma 0.020 loss 0.0103  silhouette IoU 1.000\nfitted vertex radii (|x|+|y| = 0.7 is the diamond): [0.673 0.692 0.69  0.675 0.693 0.691 0.673 0.692 0.69  0.678 0.689 0.693]"}, "i_splat": {"lang": "py", "file": "i_splat.py", "src": "# i_splat.py: a differentiable Gaussian-splat rasteriser (the 3DGS forward pass in 2D), fitted to an image; checks gradients and densify/pr
