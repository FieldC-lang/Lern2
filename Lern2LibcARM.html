unit('u5', 5, 'lib', 'imm', 'Conversions and division', 'strtol with overflow detection by umull, a first strtod with VFP, branchless abs, div with sdiv and mls, and software division with CLZ for cores without a divider.', [
  lesson('u5l1', 'strtol: parsing with overflow detection', REF.libc, [
    LS('The four phases of strtol', 'C’s `strtol(s, &end, base)` is more than “multiply by 10 and add”. It must:\n\n1. **skip white space** (`isspace`),\n2. read an optional **sign**,\n3. handle the **prefix**: base 16 accepts `0x`/`0X`, base 0 picks 16 for `0x`, 8 for a leading `0`, else 10,\n4. **accumulate** digits valid in the base (`0–9`, then `a–z`/`A–Z` as 10–35), and on overflow return `LONG_MAX` or `LONG_MIN` with `errno = ERANGE`. `*end` points just past the last digit, or at `s` if there were none.\n\nTwo ARM tricks from our version:\n\n- `orr r1, r0, #0x20` folds upper case to lower case for both letters and the `x` in `0X`.\n- **Overflow for free**: `umull r8, r2, r8, r6` multiplies acc × base into a 64-bit result. If the high word r2 is ever non-zero, the value no longer fits. `orrs r12, r12, r2` accumulates that, and `adds` + `movcs` catches the carry from adding the digit.\n\nWalk-through for "  -0x1F;": skip 2 spaces; \'-\' sets negative; "0x" sets base 16 and skips 2; \'1\' → acc = 0 × 16 + 1 = 1; \'F\' → orr gives \'f\', − \'a\' + 10 = 15 → acc = 31; \';\' is not a digit; negate → −31; `*end` points at \';\'.', PROG([['strtol.c', A`#include "libc.h"
int main(void)
{
    const char *t[] = { "  -0x1F;", "0777", "42abc", "zz", "99999999999", "-2147483648" };
    int base[] = { 0, 0, 10, 36, 10, 10 };
    for (int i = 0; i < 6; i++) {
        char *end;
        errno = 0;
        long v = strtol(t[i], &end, base[i]);
        printf("%d end+%d errno=%d\n", v, (int)(end - t[i]), errno);
    }
    return 0;
}`, 'c']], '-31 end+7 errno=0\n511 end+4 errno=0\n42 end+2 errno=0\n1295 end+2 errno=0\n2147483647 end+11 errno=34\n-2147483648 end+11 errno=0')),
    PNA('One accumulation step: acc = 214748364, base 10, digit 8. r0 = the high word of acc × base (non-zero means overflow):', 'mov r3, #10\numull r1, r0, r0, r3', [214748364], 0, '214748364 × 10 = 2147483640 still fits in 32 unsigned bits, so the high word is 0. The **signed** limit check happens at the end, against LONG_MAX + negative.'),
    MC('strtol("zz", &end, 36) returns 1295. Why?', ['z = 35, and 35 × 36 + 35 = 1295', 'z is invalid, so it returns 0', 'letters are 1–26', 'base 36 is not allowed'], 'Digits go 0–9 then a = 10 … z = 35.'),
    FI('Fold \'X\' to \'x\' (and any letter to lower case) in one instruction.', '___ r1, r0, #0x20', ['orr'], ['and', 'bic', 'eor'], 'Upper and lower case differ only in bit 5; eor would turn lower into upper.'),
    TF('When no digits are found, strtol sets *end to the first non-space character.', false, 'It sets *end to the original s (even before the spaces), and returns 0.'),
    NU('What does strtol("0777", NULL, 0) return?', 511, 'Base 0 + leading 0 = octal: 7 × 64 + 7 × 8 + 7.', 'Octal place values 64, 8, 1.')
  ]),
  lesson('u5l2', 'strtod basics with VFP', REF.libc, [
    LS('Digits into a double', 'A **correct** strtod is hard: the decimal string must round to the nearest double, which needs big-number arithmetic for long inputs (glibc uses its multi-precision `mpn` code, musl `decfloat` with base-10⁹ limbs). A **basic** strtod that is exact for short inputs is easy with VFP:\n\n```\nvmov.f64  d0, #10.0       @ VFPv3 immediate: 10.0 is encodable\nvsub.f64  d1, d1, d1      @ acc = 0\nloop: digit in r2:\n    vmov      s4, r2\n    vcvt.f64.u32 d2, s4   @ integer → double\n    vmla.f64  d1, d1, d0  @ NO: vmla is d1 += d1*d0\n```\n\nCareful: `vmla.f64 d1, d1, d0` computes d1 = d1 + d1 × 10 = 11 × d1. The right sequence is `vmul.f64 d1, d1, d0` then `vadd.f64 d1, d1, d2`.\n\nFor the fraction, count the digits after the point (k) and divide once at the end by 10ᵏ, rather than multiplying by 0.1 each time: 0.1 is not exact in binary, so repeated multiplication accumulates error, while a single division rounds once.\n\nUnder the **hard-float** ABI (`armhf`, `musleabihf`), the double result comes back in **d0**. Under soft-float (`armel`) it would be in r0:r1.\n\nThe example parses `[-]digits[.digits]` and returns d0. The VFPv3 immediate (`#10.0`) encodes ±m × 2ⁿ with a 4-bit mantissa and a 3-bit exponent, so 10.0, 0.5, 1.0 and 31.0 work but 0.1 does not.', PROG([['strtod.s', A`.syntax unified
.arm
.fpu vfpv4
.text
.global basic_strtod             @ double basic_strtod(const char *s)
basic_strtod:
    mov       r3, #0             @ negative?
    ldrb      r2, [r0]
    cmp       r2, #'-'
    moveq     r3, #1
    addeq     r0, r0, #1
    vmov.f64  d0, #10.0
    vsub.f64  d1, d1, d1         @ acc = 0
    vmov.f64  d3, #1.0           @ divisor = 10^k
    mov       r12, #0            @ seen the point?
1:  ldrb      r2, [r0], #1
    cmp       r2, #'.'
    moveq     r12, #1
    beq       1b
    sub       r2, r2, #'0'
    cmp       r2, #9
    bhi       2f
    vmov      s4, r2
    vcvt.f64.u32 d2, s4
    vmul.f64  d1, d1, d0         @ acc = acc*10 + digit
    vadd.f64  d1, d1, d2
    cmp       r12, #0
    vmulne.f64 d3, d3, d0        @ one more fraction digit
    b         1b
2:  vdiv.f64  d0, d1, d3         @ round once
    cmp       r3, #0
    vnegne.f64 d0, d0
    bx        lr`, 'asm'], ['main.c', A`#include <stdio.h>
double basic_strtod(const char *);
int main(void)
{
    const char *t[] = { "3.25", "-0.1", "1234.5678", "42" };
    for (int i = 0; i < 4; i++) printf("%.10g ", basic_strtod(t[i]));
    printf("%d\n", basic_strtod("0.1") == 0.1);
    return 0;
}`, 'c']], '3.25 -0.1 1234.5678 42 1', 'Built with zig cc against musl (for printf of doubles) and run on qemu-arm. Output:\n3.25 -0.1 1234.5678 42 1', { mode: 'host' })),
    MC('Why divide once by 10ᵏ at the end instead of multiplying by 0.1 per fraction digit?', ['0.1 is inexact in binary, so each multiply adds rounding error; one division rounds once', 'vdiv is faster than vmul', 'vmul cannot take 0.1', 'the C standard says so'], 'Exact integers up to 2⁵³ stay exact in the accumulator; only the final division rounds.'),
    TF('`vmla.f64 d1, d1, d0` computes d1 = d1 × d0 + digit.', false, 'vmla is Dd = Dd + Dn × Dm, so it gives d1 + d1 × d0. You need vmul then vadd (or vfma with a separate accumulator).'),
    MA('Match the ABI with where a double result lives.', [['hard-float (armhf)', 'd0'], ['soft-float (armel)', 'r0:r1'], ['float under hard-float', 's0'], ['float under soft-float', 'r0']], 'The VFP registers are used for arguments and results only with the hard-float variant (-mfloat-abi=hard).'),
    MC('Which of these can be a VFPv3 `vmov.f64` immediate?', ['31.0', '0.1', '100.0', '1e10'], 'The immediate is ±(16 + m)/16 × 2ⁿ with m 0–15 and n −3…4: 31 = 1.9375 × 16 fits, 100 needs 2⁶.'),
    NU('basic_strtod("12.50"): what is the divisor d3 at the end?', 100, 'Two digits follow the point, so 10².', 'Count fraction digits.')
  ]),
  lesson('u5l3', 'abs, div and hardware divide', REF.div, [
    LS('Branchless abs', 'abs(x) without a branch uses the sign mask s = x >> 31 (arithmetic shift: 0 or −1):\n\n`abs = (x ^ s) − s`\n\nIf x ≥ 0, s = 0 and nothing changes. If x < 0, s = −1: x ^ −1 = ~x, and ~x − (−1) = ~x + 1 = −x. ARM folds the shift into both instructions:\n\n```\nabs: eor r1, r0, r0, asr #31\n     sub r0, r1, r0, asr #31\n     bx  lr\n```\n\nThe classic alternative is `cmp r0, #0; rsblt r0, r0, #0`, also 2 instructions. Both give abs(INT_MIN) = INT_MIN, which is undefined behaviour in C anyway.\n\nWalk-through for x = −5 (0xFFFFFFFB): s = 0xFFFFFFFF; x ^ s = 4; 4 − (−1) = 5.', X('eor r1, r0, r0, asr #31\nsub r0, r1, r0, asr #31', [-5], 5)),
    LS('div_t and sdiv/mls', '`div(num, den)` returns a struct of two ints. AAPCS returns composite types **larger than 4 bytes in memory**: the caller passes a hidden pointer in r0 and the real arguments shift to r1 and r2.\n\n```\ndiv: sdiv r3, r1, r2       @ quot (rounds toward zero)\n     mls  r12, r3, r2, r1  @ rem = num − quot × den\n     str  r3, [r0]\n     str  r12, [r0, #4]\n     bx   lr\n```\n\n`sdiv`/`udiv` exist on Cortex-A7, A15 and A17 (the ARMv7VE extension) but **not on A8 or A9**, where gcc calls `__aeabi_idiv`. C rounds the quotient toward zero, so the remainder has the sign of the numerator: div(−7, 2) = {−3, −1}.', PROG([['div.c', A`#include "libc.h"
int main(void)
{
    div_t a = div(-7, 2), b = div(7, -2), c = div(100, 7);
    printf("%d %d | %d %d | %d %d | %d %d\n", a.quot, a.rem, b.quot, b.rem, c.quot, c.rem, abs(-123), abs(45));
    return 0;
}`, 'c']], '-3 -1 | -3 1 | 14 2 | 123 45')),
    PNA('rem = num − quot × den in one instruction. num = 100, den = 7, quot = 14 (r0 = rem):', 'mls r0, r2, r1, r0', [100, 7, 14], 2, 'mls Rd, Rn, Rm, Ra computes Ra − Rn × Rm: 100 − 14 × 7 = 2.'),
    MC('How does `div` return its 8-byte div_t?', ['through a hidden pointer the caller passes in r0', 'in r0:r1', 'in d0', 'on the stack above the arguments'], 'AAPCS: composites over 4 bytes are returned in caller memory; the pointer occupies r0, so num and den arrive in r1 and r2.'),
    TF('div(7, −2) gives quot −3 and rem 1.', true, 'Truncation toward zero: 7 = (−3)(−2) + 1.'),
    PNA('The other abs: x = −2147483647.', 'cmp r0, #0\nrsblt r0, r0, #0', [-2147483647], 2147483647, 'rsb = reverse subtract: 0 − r0, only when lt.', { fmt: 'd' })
  ]),
  lesson('u5l4', 'Software division with CLZ', REF.div, [
    LS('Shift-subtract, starting at the right place', 'Without a divide instruction, binary long division builds the quotient one bit at a time: if n ≥ d·2ᵏ, subtract it and set bit k. A naive version always tries all 32 bits. **CLZ** tells us where to start: d can shift left by clz(d) − clz(n) before passing n.\n\n```\n__udivmod:            @ r0 = n, r1 = d  →  r0 = q, r1 = r\n    clz   r3, r1\n    clz   r12, r0\n    subs  r3, r3, r12   @ k = shift that lines d up under n\n    blt   small         @ d > n: q = 0, r = n\n    lsl   r1, r1, r3\n    mov   r2, #0\n1:  cmp   r0, r1        @ C = (n ≥ d << k)\n    subhs r0, r0, r1\n    adc   r2, r2, r2    @ q = 2q + C: the compare’s carry IS the bit\n    lsr   r1, r1, #1\n    subs  r3, r3, #1\n    bge   1b\n```\n\nThe gem is `adc r2, r2, r2`: it doubles q and adds the carry from `cmp`, which is exactly the new quotient bit. 6 instructions per quotient bit, and only as many bits as the quotient really has.\n\nWalk-through for 100 / 7: clz(7) = 29, clz(100) = 25, k = 4, d = 112.\n\n| k | n | d<<k | n ≥? | q |\n|---|---|---|---|---|\n| 4 | 100 | 112 | no | 0 |\n| 3 | 100 | 56 | yes → 44 | 1 |\n| 2 | 44 | 28 | yes → 16 | 3 |\n| 1 | 16 | 14 | yes → 2 | 7 |\n| 0 | 2 | 7 | no | 14 |\n\nq = 14, r = 2. libgcc’s `__udivsi3` for ARM unrolls this loop fully and jumps into it at the right place (a computed branch), about 3 instructions per bit.', PROG([['udiv.c', A`#include "libc.h"
int main(void)
{
    unsigned n[] = { 100, 4000000000u, 5, 0xFFFFFFFFu, 1000000 };
    unsigned d[] = { 7, 3, 9, 1, 1000 };
    for (int i = 0; i < 5; i++) {
        unsigned long long r = __udivmod(n[i], d[i]);
        printf("%u r%u ", (unsigned)r, (unsigned)(r >> 32));
    }
    printf("\n");
    return 0;
}`, 'c']], '14 r2 1333333333 r1 0 r5 4294967295 r0 1000 r0')),
    NU('Dividing 1000 by 3 with this routine: how many loop iterations run? (clz(3) = 30, clz(1000) = 22)', 9, 'k = 30 − 22 = 8, and the loop runs for k = 8 down to 0.', 'Iterations = k + 1.'),
    FI('Double the quotient and add the comparison’s carry in one instruction.', '___ r2, r2, r2', ['adc'], ['add', 'adds', 'sbc', 'orr'], 'After cmp, C = 1 means n ≥ d<<k: the quotient bit.'),
    PNA('Division by the constant 10 without dividing (n = 12345, r0 = n / 10):', 'ldr r1, =0xCCCCCCCD\numull r2, r0, r0, r1\nlsr r0, r0, #3', [12345], 1234, 'n × ⌈2³⁵/10⌉, keep the high word, shift 3 more. gcc emits this for every `/ 10` by a constant; printf uses it for digits.'),
    MC('What does our __udivmod return for d = 0?', ['q = 0xFFFFFFFF, r = n (no trap)', 'it raises SIGFPE', 'q = 0', 'it loops forever'], 'Like udiv on ARM, which returns 0 for division by zero; libgcc’s __aeabi_uidiv calls __aeabi_idiv0. We return all ones so the bug is visible.'),
    OR('Order the steps of one quotient bit.', ['cmp n, d<<k', 'subhs n, n, d<<k', 'adc q, q, q', 'lsr d<<k by 1'], 'The flag set by cmp drives both the conditional subtract and the adc.')
  ])
]);

unit('u6', 6, 'lib', 'rs1', 'qsort and bsearch', 'Calling a comparator through a register, the element-size problem, bounded recursion, and the fifth argument on the stack.', [
  lesson('u6l1', 'qsort: a generic sort in assembly', REF.aapcs, [
    LS('Generic means pointers, sizes and callbacks', '`qsort(base, n, size, cmp)` knows nothing about the elements: it only has their address, count and size, and calls `cmp(a, b)` (negative, zero or positive).\n\n- Element i is at `base + i × size`, which one `mla` computes: `mla r8, r0, r6, r4`.\n- The comparator is called with `blx r7`: a call through a register, which also switches to Thumb if bit 0 of the address is set (zig and gcc build C as Thumb or ARM; blx handles both).\n- Swapping must work for any size, so we swap byte by byte (musl swaps in word chunks when it can; glibc uses `memcpy` into a temporary for small sizes).\n\nOur version uses **Lomuto partition** with the last element as pivot. After partitioning, it **recurses on the smaller side and loops on the larger side**. This bounds the stack at O(log n) even in the worst case, which matters in a libc where a bad input must not overflow the stack.\n\nRegister plan: r4 base, r5 n, r6 size, r7 cmp (callee-saved, so they survive the callback), r8 pivot, r9 store pointer, r10 scan pointer, r11 count left of pivot. We `push {r3-r11, lr}`, 10 registers = 40 bytes, to keep sp 8-byte aligned.\n\nglibc’s qsort is actually a **mergesort** with a malloc’d buffer (falling back to an introsort), and musl uses **smoothsort**, both to avoid quadratic worst cases.', PROG([['sort.c', A`#include "libc.h"
static int cmpi(const void *a, const void *b) { int x = *(const int *)a, y = *(const int *)b; return (x > y) - (x < y); }
static int cmps(const void *a, const void *b) { return strcmp(*(char *const *)a, *(char *const *)b); }
int main(void)
{
    int v[] = { 5, -3, 9, 0, 9, 2, -100, 7 };
    qsort(v, 8, sizeof v[0], cmpi);
    for (int i = 0; i < 8; i++) printf("%d ", v[i]);
    const char *w[] = { "musl", "glibc", "newlib", "bionic", "uclibc" };
    qsort(w, 5, sizeof w[0], cmps);
    for (int i = 0; i < 5; i++) printf("%s ", w[i]);
    printf("\n");
    return 0;
}`, 'c']], '-100 -3 0 2 5 7 9 9 bionic glibc musl newlib uclibc')),
    MC('Why does qsort keep base, n, size and cmp in r4–r7?', ['r4–r11 are callee-saved, so they survive each call to the comparator', 'r0–r3 are too slow', 'blx needs them', 'qsort has no other free registers'], 'Anything in r0–r3 or r12 may be destroyed by the callback.'),
    TF('Comparators written as `return x - y;` are always correct for ints.', false, 'x − y overflows for, e.g., INT_MIN and 1. Use (x > y) − (x < y).'),
    NU('Sorting 1,000,000 elements, roughly how deep can recursion get when we always recurse on the smaller side? (log₂)', 20, 'The smaller side is at most half, so depth ≤ log₂ 10⁶ ≈ 20.', 'Each recursion at least halves n.'),
    FI('Address of element i (r0) for base r4, size r6, into r8.', '___ r8, r0, r6, r4', ['mla'], ['mul', 'mls', 'umull'], 'mla Rd, Rn, Rm, Ra = Ra + Rn × Rm.'),
    MA('Match each libc with its qsort algorithm.', [['musl', 'smoothsort'], ['glibc', 'mergesort, falling back to introsort'], ['this course', 'Lomuto quicksort, smaller side first'], ['newlib', 'Bentley–McIlroy quicksort']], 'All are O(n log n) in practice; only the course version can degrade to O(n²) time (but not stack).')
  ]),
  lesson('u6l2', 'bsearch and the fifth argument', REF.aapcs, [
    LS('Arguments five and up live on the stack', '`bsearch(key, base, n, size, cmp)` has five arguments. AAPCS puts the first four in r0–r3 and the **fifth at [sp]** at the moment of the call. After our `push {r3-r11, lr}` (10 registers, 40 bytes), it is at **[sp, #40]**:\n\n```\nbsearch: push {r3-r11, lr}\n         ldr  r8, [sp, #40]   @ cmp\n```\n\nThe search loop halves an interval [base, base + n):\n\n```\n1: cmp   r6, #0\n   moveq r0, #0             @ empty: not found\n   beq   done\n   lsr   r9, r6, #1         @ half = n / 2\n   mla   r10, r9, r7, r5    @ mid = base + half × size\n   mov   r0, r4\n   mov   r1, r10\n   blx   r8\n   cmp   r0, #0\n   moveq r0, r10            @ found\n   beq   done\n   movlt r6, r9             @ key < mid: n = half\n   blt   1b\n   add   r5, r10, r7        @ key > mid: base = mid + 1\n   sub   r6, r6, r9\n   sub   r6, r6, #1         @ n = n − half − 1\n   b     1b\n```\n\nThe flags from one `cmp r0, #0` drive three different outcomes. Note the comparator is called as `cmp(key, element)`; the key always comes first.\n\nWalk-through searching 7 in {1, 3, 5, 7, 9, 11}: n = 6, half 3, mid = 7: found on the first probe. For 4: mid 7 (4 < 7) → n = 3; mid = 3 (4 > 3) → base at 5, n = 1; mid = 5 (4 < 5) → n = 0: NULL.', PROG([['bs.c', A`#include "libc.h"
static int cmpi(const void *a, const void *b) { int x = *(const int *)a, y = *(const int *)b; return (x > y) - (x < y); }
int main(void)
{
    int v[] = { 1, 3, 5, 7, 9, 11 };
    for (int k = 0; k <= 12; k += 3) {
        int *p = bsearch(&k, v, 6, sizeof v[0], cmpi);
        printf("%d:%d ", k, p ? (int)(p - v) : -1);
    }
    int k = 11;
    printf("| %d\n", (int)((int *)bsearch(&k, v, 6, 4, cmpi) - v));
    return 0;
}`, 'c']], '0:-1 3:1 6:-1 9:4 12:-1 | 5')),
    NU('A function pushes {r4-r9, lr}. At what offset from sp is the caller’s fifth argument now?', 28, '7 registers × 4 = 28 bytes were pushed on top of it.', 'Count the pushed registers.'),
    MC('Why does bsearch push r3 when it needs only r4–r11 and lr?', ['to make 10 registers (40 bytes) and keep sp 8-byte aligned for the callback', 'r3 is callee-saved', 'r3 holds the fifth argument', 'push needs an even register'], 'An odd count of 9 would leave sp 4 mod 8 at the blx.'),
    PA('After `cmp r0, #0` with r0 = −1 (key smaller), which of moveq/movlt runs? r0 = 1 if movlt ran:', 'mov r3, #0\ncmp r0, #0\nmoveq r3, #2\nmovlt r3, #1\nmov r0, r3', [-1], 1, ['2', '0'], 'Negative: N = 1, V = 0, so lt is true and eq false.'),
    TF('On a 6-element array bsearch needs at most 3 comparisons.', true, '6 → 2 (or 3) → 1 → 0: at most ⌊log₂ 6⌋ + 1 = 3 probes.')
  ])
]);

unit('u7', 7, 'lib', 'rs2', 'malloc, free and the exit chain', 'Headers and alignment, first-fit free lists, brk for small blocks and mmap for big ones, calloc overflow, realloc, atexit order, exit, abort and getenv.', [
  lesson('u7l1', 'malloc with brk and mmap', REF.linux, [
    LS('Where memory comes from', 'A process gets heap memory from the kernel in two ways:\n\n- **brk** (45): moves the end of the data segment. `brk(0)` (or any bad value) returns the current end; `brk(p)` returns p on success. Cheap, contiguous, but can only shrink from the top.\n- **mmap2** (192): maps fresh zeroed pages anywhere. Ideal for big blocks because `munmap` returns them to the system immediately.\n\nOur malloc puts an **8-byte header** in front of every block: word 0 is the block size (bit 0 set means “came from mmap”), word 1 is the next-free link when the block is free. The user pointer is header + 8, so it is **8-byte aligned**, as C requires for `double` and `long long` (max_align_t is 8 on ARM).\n\n```\nmalloc: add  r4, r0, #15\n        bic  r4, r4, #7        @ size + 8 header, rounded up to 8\n        cmp  r4, #65536\n        bhs  big               @ ≥ 64 KiB: mmap\n        ...first fit on the free list, else grow brk...\n```\n\n`add #15; bic #7` is (n + 8 + 7) & ~7. Walk-through for malloc(13): 13 + 15 = 28, & ~7 = 24: 8 header + 16 usable.\n\n**First fit**: walk the free list and take the first block whose size ≥ the request. r5 holds the **address of the link** to patch (first `&__freelist`, then `&block->next`), so unlinking is one store with no special case for the head.\n\nThis allocator never splits or coalesces, so it fragments; real allocators split blocks, merge free neighbours, and keep size-class bins (glibc ptmalloc2 with tcache, musl mallocng with grouped slots and out-of-band metadata for hardening).', PROG([['m.c', A`#include "libc.h"
int main(void)
{
    char *a = malloc(13), *b = malloc(100), *c = malloc(200000);
    printf("%u %u %u ", ((unsigned)a & 7) == 0, (unsigned)(b - a), ((unsigned *)c)[-2] & 1);
    strcpy(a, "heap");
    c[199999] = 'x';
    free(b);
    char *d = malloc(90);            /* first fit reuses b */
    printf("%u %s %c ", d == b, a, c[199999]);
    free(c);
    int *z = calloc(4, sizeof(int));
    printf("%d %u\n", z[0] + z[3], calloc(0x10000, 0x10000) == NULL);
    return 0;
}`, 'c']], '1 24 1 1 heap x 0 1')),
    NU('malloc(100): what block size (including the 8-byte header) does our formula give?', 112, '100 + 15 = 115, & ~7 = 112.', '(n + 15) & ~7.'),
    PNA('The same formula for malloc(1) (r0 = block size):', 'add r0, r0, #15\nbic r0, r0, #7', [1], 16, '1 + 15 = 16; even malloc(1) costs 16 bytes here.'),
    MC('Why does calloc use umull for n × size?', ['the high word reveals overflow, so calloc can return NULL instead of a too-small block', 'mul cannot multiply sizes', 'it is faster', 'calloc needs 64-bit pointers'], 'calloc(0x10000, 0x10000) would wrap to 0 with a 32-bit multiply, a classic security bug.'),

    LS('Turning a number into text', 'Decimal conversion needs x / 10 and x % 10 for every digit. With the magic reciprocal, one `umull` gives the quotient and two more instructions give the remainder:\n\n```\n    ldr   r3, =0xCCCCCCCD    @ ⌈2³⁵ / 10⌉\n1:  umull r1, r2, r0, r3     @ r2 = (x × M) >> 32\n    lsr   r2, r2, #3         @ q = x / 10\n    add   r1, r2, r2, lsl #2 @ q × 5\n    sub   r1, r0, r1, lsl #1 @ digit = x − q × 10\n    add   r1, r1, #\'0\'\n    strb  r1, [r10, #-1]!    @ pre-decrement: write backwards\n    movs  r0, r2             @ x = q, and set Z\n    bne   1b\n```\n\n7 instructions per digit, no divide, correct for every 32-bit x. Walk-through for 407: q = 40, digit 7; q = 4, digit 0; q = 0, digit 4. The buffer reads "407".\n\nHex is even simpler: `and r1, r0, #15` picks the digit, a 16-byte table maps it to a character, `lsrs r0, r0, #4` moves on.\n\nFaster still: glibc and many integer formatters emit **two digits at a time** from a 200-byte "00010203…99" table, halving the multiplies.', X('ldr r3, =0xCCCCCCCD\numull r1, r2, r0, r3\nlsr r2, r2, #3\nadd r1, r2, r2, lsl #2\nsub r0, r0, r1, lsl #1', [4000000007], 7, { show: 'r0 = 7, the last digit of 4000000007' })),

unit('u9', 9, 'math', 'f7', 'math.h and fenv.h: floating point', 'IEEE 754 bits, soft-float by hand, the VFP register file, sqrt and floor, exp and log kernels with range reduction, and rounding modes and exceptions through FPSCR.', [
  lesson('u9l1', 'IEEE 754 bits and soft-float', REF.bits, [
    LS('A float is three bit fields', 'A 32-bit float is `sign:1 | exponent:8 | fraction:23`, value = (−1)ˢ × 1.fraction × 2^(exponent − 127) for normal numbers. A double is 1 | 11 | 52 with bias 1023.\n\nARM’s bit-field instructions read the fields directly:\n\n```\nlsr  r1, r0, #31          @ sign\nubfx r2, r0, #23, #8      @ biased exponent\nubfx r3, r0, #0, #23      @ fraction\n```\n\n1.5f is 0x3FC00000: sign 0, exponent 127 (2⁰), fraction 0x400000 (binary .1 = 0.5).\n\n**Soft-float** is what a libc (libgcc’s `__aeabi_fmul`, `__aeabi_dadd`, …) provides when there is no FPU: integer code that unpacks, operates and repacks. A multiply of two normal floats:\n\n1. sign = sa XOR sb,\n2. exponent = ea + eb − 127,\n3. mantissas with the hidden 1: ma = fa | 0x800000; the 48-bit product comes from **umull**,\n4. the product is in [2⁴⁶, 2⁴⁸): if bit 47 is set, shift by 24 and add 1 to the exponent, else shift by 23,\n5. repack. (A real one also rounds to nearest-even and handles zero, subnormals, infinity, NaN and overflow.)\n\nThe example multiplies with this integer code and compares with the VFP result bit for bit, for products that need no rounding.', PROG([['fm.s', A`.syntax unified

.text
.global soft_fmul                @ uint32 soft_fmul(uint32 a, uint32 b): normal, exact cases

    lsreq r3, r3, #23

unit('u10', 10, 'ctl', 'op', 'setjmp.h and stdarg.h', 'Saving exactly the callee-saved state, returning twice, and walking variadic arguments under the base and VFP calling standards.', [
  lesson('u10l1', 'setjmp and longjmp', REF.aapcs, [
    LS('What must survive a non-local jump', '`setjmp(env)` records enough state to resume right after itself later; `longjmp(env, v)` goes back there, and setjmp appears to return **a second time**, now with v.\n\nWhich registers? Exactly those a normal call would preserve, because to the code after setjmp, longjmp looks like setjmp’s own return:\n\n- r4–r11 and **sp** (callee-saved),\n- **lr**, the address setjmp returns to,\n- **d8–d15** under VFP (callee-saved too).\n\nr0–r3, r12 and the flags are scratch, so they are not saved. 10 words + 8 doubles = **104 bytes**.\n\n```\nsetjmp:  mov    r12, sp              @ stm cannot store sp in a list in A32\n         stmia  r0!, {r4-r11, r12, lr}\n         vstmia r0, {d8-d15}\n         mov    r0, #0               @ first return: 0\n         bx     lr\nlongjmp: ldmia  r0!, {r4-r11, r12, lr}\n         vldmia r0, {d8-d15}\n         mov    sp, r12\n         movs   r0, r1\n         moveq  r0, #1               @ longjmp(env, 0) must look like 1\n         bx     lr                   @ “return” from setjmp again\n```\n\nCaveats C imposes: local variables modified between setjmp and longjmp are indeterminate unless `volatile` (they may live in r4–r11 snapshots or in memory); the frame that called setjmp must still be live. glibc additionally **mangles** sp and lr with a secret (`PTR_MANGLE`) so an attacker who overwrites a jmp_buf cannot redirect control; `sigsetjmp` also saves the signal mask.', PROG([['sj.c', A`#include "libc.h"
static jmp_buf env;
static int depth;

    dive(n + 1);

{

    printf("setjmp returned %d (try %d)\n", r, tries);

    LS('va_list is one pointer', 'On ARM `va_list` is `struct { void *__ap; }`: a pointer into the argument area. `va_start` makes the register arguments contiguous with the stack ones (the callee pushes r0–r3 as in printf), `va_arg(ap, T)` loads and advances.\n\nTwo rules make it subtle:\n\n1. **64-bit types are 8-byte aligned.** A `double` or `long long` argument goes in an even register pair (r0:r1 or r2:r3), skipping an odd register, and on the stack at an 8-aligned address. So `va_arg(ap, double)` first rounds ap up: `add r1, r1, #7; bic r1, r1, #7`.\n2. **Variadic functions always use the base standard**, even under hard-float: doubles passed through `...` travel in **core registers and the stack, never in d0–d7**. (That is why calling printf with a double works the same on armel and armhf.) `float` arguments are promoted to double. The rule covers the **return value** too: a variadic function returning double returns it in **r0:r1**, not d0. Our first version of the example left the sum in d0 and printed 513.805, because the caller read r0:r1. One `vmov r0, r1, d0` fixed it.\n\nWalk-through for `sum_d(3, 1.5, 2.25, 4.0)`: r0 = 3, r1 is skipped (alignment), 1.5 in r2:r3, 2.25 at [sp], 4.0 at [sp + 8]. After `push {r0-r3}` the array is: n at sp, padding at sp + 4, 1.5 at sp + 8, 2.25 at sp + 16, 4.0 at sp + 24. Start at sp + 4, align → sp + 8.', PROG([['va.s', A`.syntax unified
.arm
.fpu vfpv4
.text
.global sum_d                    @ double sum_d(int n, ...): n doubles

1:  subs     r0, r0, #1

    add      r1, r1, #7          @ va_arg(ap, double): align to 8 ...
    bic      r1, r1, #7
    vldmia   r1!, {d1}           @ ... load and advance
    vadd.f64 d0, d0, d1
    b        1b
2:  vmov     r0, r1, d0          @ variadic: the double result goes back in r0:r1!
    add      sp, sp, #16
    bx       lr
.global sum_i                    @ int sum_i(int n, ...): n ints
sum_i:
    push     {r1-r3}             @ r1..r3 just below the stacked ints
    mov      r1, sp
    mov      r2, #0

    ldrhs    r3, [r1], #4        @ va_arg(ap, int)
    addhs    r2, r2, r3

unit('u11', 11, 'ctl', 'f3', 'signal.h and time.h', 'rt_sigaction, the restorer trampoline and sigreturn, raise with tkill, and clock_gettime and nanosleep.', [
  lesson('u11l1', 'Installing a handler: rt_sigaction and the restorer', REF.linux, [
    LS('How a signal handler returns', 'When a signal arrives, the kernel saves the interrupted registers in a **signal frame** on the user stack and jumps to the handler with lr pointing at a **restorer**. The handler returns to the restorer, which makes one syscall that tells the kernel “restore the frame”. libc must supply that restorer.\n\nThe kernel’s `struct sigaction` on ARM (20 bytes):\n\n| Offset | Field |\n|---|---|\n| 0 | sa_handler |\n| 4 | sa_flags |\n| 8 | sa_restorer |\n| 12 | sa_mask (64 bits) |\n\nOur `signal()` fills one on the stack with flags **SA_RESTORER | SA_RESTART** (0x04000000 | 0x10000000 = 0x14000000) and calls `rt_sigaction(sig, &new, &old, 8)` (syscall 174; 8 = sizeof the kernel’s sigset).\n\n**The trap we hit building this libc:** the frame’s format depends on SA_SIGINFO. Without it the kernel builds an old-style `sigframe`, which must be undone with **sigreturn (119)**; with SA_SIGINFO it builds an `rt_sigframe` for **rt_sigreturn (173)**. Using 173 for a plain handler made the kernel read garbage and the process crashed on return. So there are two restorers:\n\n```\n__restore:    mov r7, #119   @ sigreturn\n              svc #0\n__restore_rt: mov r7, #173   @ rt_sigreturn\n              svc #0\n```\n\nglibc and musl always set SA_SIGINFO-style frames via their sigaction wrapper and pick the matching restorer. If no SA_RESTORER is given, the ARM kernel falls back to code in the vector page (the “sigpage”).\n\n`raise(sig)` is `tkill(gettid(), sig)`: the signal goes to the calling thread, as C11 requires.', PROG([['sg.c', A`#include "libc.h"
static volatile int got, last;
static void on_usr1(int s) { got++; last = s; }

{

    LS('SIGSEGV, longjmp and the blocked mask', 'A handler for a **synchronous** signal (SIGSEGV, SIGFPE, SIGILL, SIGBUS) cannot simply return: the faulting instruction would run again and fault again. Options: exit, or `longjmp` out to a known point.\n\nOne subtlety: while a handler runs, the kernel **blocks** its signal (unless SA_NODEFER). A longjmp out skips sigreturn, so the signal **stays blocked**. A second fault would then kill the process outright. `siglongjmp` with a `sigsetjmp(env, 1)` buffer restores the mask; with our minimal libc we unblock it ourselves with `rt_sigprocmask(SIG_UNBLOCK, …)` (175).\n\nThe example touches address 0 twice, recovering each time. Note on ARM the faulting address is in the `si_addr` of the siginfo (with SA_SIGINFO) and the kernel reports SIGSEGV with code SEGV_MAPERR for an unmapped page.', PROG([['fault.c', A`#include "libc.h"

unit('u12', 12, 'thr', 'rs2', 'Threads: clone, TLS, futexes and atomics', 'Creating threads with clone, per-thread errno through TPIDRURO, LDREX/STREX loops, memory barriers, a futex mutex and join through CLONE_CHILD_CLEARTID.', [
  lesson('u12l1', 'clone: a thread is a process that shares', REF.linux, [
    LS('The flags that make a thread', 'Linux has no separate “create thread” call: `clone(flags, stack, ptid, tls, ctid)` (120) creates a task that shares whatever the flags say.\n\n| Flag | Value | Shares or does |\n|---|---|---|\n| CLONE_VM | 0x100 | address space |\n| CLONE_FS | 0x200 | cwd, umask |\n| CLONE_FILES | 0x400 | file descriptors |\n| CLONE_SIGHAND | 0x800 | signal handlers |\n| CLONE_THREAD | 0x10000 | same thread group (same getpid) |\n| CLONE_SYSVSEM | 0x40000 | SysV semaphore undo |\n| CLONE_SETTLS | 0x80000 | set TPIDRURO to `tls` |\n| CLONE_PARENT_SETTID | 0x100000 | write the tid to *ptid |\n| CLONE_CHILD_CLEARTID | 0x200000 | zero *ctid and futex-wake it when the thread exits |\n\nOr together: **0x3D0F00**. On ARM the fifth argument (ctid) goes in **r4**.\n\nThe tricky part: after `svc`, **both** tasks continue at the next instruction. The parent gets the tid, the child gets 0 and is already on its **new stack**, so it cannot pop anything the parent pushed. It must use only registers: ours keeps the TCB in r5 (unchanged by clone), loads fn and arg from it, calls fn, stores the result, and calls `exit` (1, only this thread; exit_group would kill all).\n\n```\n    ldr   r0, =0x3D0F00\n    add   r2, r5, #4      @ ptid = &tcb->tid\n    mov   r3, r5          @ tls = tcb\n    add   r4, r5, #4      @ ctid = &tcb->tid\n    mov   r7, #120\n    svc   #0\n    cmp   r0, #0\n    beq   child           @ child: new stack, r5 still = tcb\n```\n\npthread_create in glibc and musl is the same idea plus guard pages, a cancellation state, and a TLS block for `__thread` variables.', PROG([['th.c', A`#include "libc.h"

{
    int n = (int)arg;
    errno = n * 100;                       /* each thread has its own errno */

    for (volatile int i = 0; i < 1000; i++) ;

    LS('Load-exclusive and store-exclusive', 'ARMv7 has no “atomic add” instruction. Instead:\n\n- `ldrex r2, [r0]` loads and **marks** the address in the local monitor,\n- `strex r12, r3, [r0]` stores **only if** nothing else wrote that location since, and sets r12 = 0 on success, 1 on failure.\n\nSo every atomic operation is a retry loop:\n\n```\natomic_fetch_add:          @ (p, v) → old value\n    dmb   ish              @ order earlier accesses before\n1:  ldrex r2, [r0]\n    add   r3, r2, r1\n    strex r12, r3, [r0]\n    cmp   r12, #0\n    bne   1b               @ someone interfered: retry\n    dmb   ish              @ and later ones after\n    mov   r0, r2\n    bx    lr\n```\n\n**Barriers**: ARM is **weakly ordered**: another core may observe your stores in a different order. `dmb ish` (data memory barrier, inner shareable) forces all accesses before it to be observed before any after it. C11’s `memory_order_seq_cst` needs a dmb on both sides; acquire needs one after, release one before. `clrex` clears the monitor when you give up (as compare-and-swap does on a mismatch).\n\nKeep the code between ldrex and strex short, with no other memory accesses: an exception or another exclusive access clears the monitor and the loop retries forever in the worst case.\n\nOn single-core ARMv5 and older (no ldrex), Linux offers the **kuser cmpxchg helper** at 0xFFFF0FC0.', PROG([['at.c', A`#include "libc.h"

  lesson('u12l3', 'A futex mutex and join', REF.linux, [
    LS('Sleep in the kernel only when contended', 'Spinning on ldrex/strex wastes CPU when a lock is held for long. A **futex** (fast user-space mutex, syscall 240) lets a thread sleep on a memory word:\n\n- `futex(addr, FUTEX_WAIT, val)` sleeps **only if *addr still equals val** (checked atomically in the kernel, so no wake-up is lost),\n- `futex(addr, FUTEX_WAKE, n)` wakes up to n sleepers.\n\nThe `_PRIVATE` variants (WAIT 128, WAKE 129) skip the cross-process hashing and are faster for threads.\n\nOur mutex is **Drepper’s three-state** design from “Futexes Are Tricky”: 0 unlocked, 1 locked, 2 locked with (possible) waiters.\n\n- lock: CAS 0 → 1. If that fails, **swap in 2** and, if the old value was not 0, `FUTEX_WAIT(addr, 2)`; repeat.\n- unlock: swap in 0; **only if the old value was 2**, `FUTEX_WAKE(addr, 1)`.\n\nThe uncontended path is a few instructions and **no syscall** in either function. Why 2 instead of a waiter count? A woken thread sets 2 again when it takes the lock, so a waiter that remains will be woken by the next unlock: conservative but correct.\n\n**Join** uses CLONE_CHILD_CLEARTID: when the thread exits, the kernel writes 0 to tcb->tid and does a (shared) FUTEX_WAKE on it. thread_join waits with **shared** FUTEX_WAIT (0), because the kernel’s wake is not private: a private wait would never be woken. Then a dmb, so the thread’s result is visible.', PROG([['mx.c', A`#include "libc.h"

    LS('Checked arithmetic is free on ARM', 'C23’s `ckd_add(&r, a, b)`, `ckd_sub`, `ckd_mul` store the wrapped result and return true if the mathematical result did not fit. The flags already know:\n\n- **signed add/sub**: the **V** flag after `adds`/`subs`,\n- **unsigned add**: the **C** flag (carry out); unsigned sub: **C = 0** (borrow),\n- **multiply**: no flag, but `smull` gives the 64-bit product; it fits in 32 bits **iff the high word equals the sign extension of the low word**: `cmp r12, r3, asr #31`. For unsigned, `umull` and test the high word for 0.\n\n```\nckd_add_int: adds  r3, r1, r2\n             str   r3, [r0]\n             movvc r0, #0\n             movvs r0, #1\n             bx    lr\n```\n\nWalk-through: 0x7FFFFFFF + 1 = 0x80000000: two positives gave a negative, so V = 1. As unsigned, no carry: C = 0. The same instruction answers both questions; only the condition differs.\n\ngcc and clang implement ckd_* with `__builtin_add_overflow`, which compiles to exactly this.', PROG([['ck.c', A`#include "libc.h"

    LS('Encoding and decoding with shifts and CLZ', 'UTF-8 stores a code point in 1–4 bytes:\n\n| Range | Bytes |\n|---|---|\n| U+0000–007F | 0xxxxxxx |\n| U+0080–07FF | 110xxxxx 10xxxxxx |\n| U+0800–FFFF | 1110xxxx 10xxxxxx 10xxxxxx |\n| U+10000–10FFFF | 11110xxx 10xxxxxx 10xxxxxx 10xxxxxx |\n\n**Encoding** is range compares plus `lsr`, `ubfx` (6-bit groups) and `orr` with the markers. € is U+20AC: 3 bytes, 0xE0 | 0x2 = 0xE2, 0x80 | 0x02 = 0x82, 0x80 | 0x2C = 0xAC.\n\n**Decoding** finds the length from the **number of leading ones** in the lead byte, which CLZ counts if we invert first:\n\n```\nmvn  r3, r2, lsl #24   @ move the byte to the top and invert it\nclz  r3, r3            @ leading ones of the byte = length (2..4)\nmov  r12, #0x7F\nand  r2, r2, r12, lsr r3  @ payload bits: 0x7F >> len\n```\n\nThen each continuation byte must match 10xxxxxx (`and #0xC0; cmp #0x80`) and contributes `cp = (cp << 6) | (b & 0x3F)`. A strict decoder also rejects overlong forms (C0 80 for NUL), surrogates (U+D800–DFFF) and values above U+10FFFF; ours checks the lead and continuation bytes only.\n\nIn C: `char8_t`/`char16_t`/`char32_t` with `mbrtoc32`/`c32rtomb` (uchar.h) and `wchar_t` (4 bytes, UTF-32 on Linux ARM) with `mbrtowc`/`wcrtomb` are these two routines plus a state object for bytes split across calls.', PROG([['u8.c', A`#include "libc.h"

  lesson('u13l4', 'locale.h, assert.h and the type-only headers', REF.libc, [
    LS('The C locale, assert, and headers with no code', '**locale.h**: every program starts in the "C" locale: ASCII ctype, \'.\' as the decimal point, strcmp collation. `setlocale(LC_ALL, "")` switches to the environment’s locale, which in glibc loads tables (ctype, collation, number formats) from /usr/lib/locale. musl supports only UTF-8 and C/POSIX for LC_CTYPE, which keeps it tiny. Our libc returns "C" always: correct for a freestanding program that never asks for more.\n\n**assert.h**: `assert(e)` expands to a check calling `__assert_fail(expr, file, line, func)`, which prints a message to stderr and calls abort (SIGABRT, exit status 134 from a shell: 128 + 6). With `NDEBUG` defined it expands to nothing: never put side effects in an assert. Our message is simplified (file and expression, no line).\n\n**Type-only headers**: stddef.h, stdint.h, stdbool.h, stdalign.h, stdnoreturn.h, iso646.h, limits.h, float.h, stdarg.h (macros over builtins) contain no functions at all. Their whole content is the ABI: on ARM EABI, char is unsigned, int/long/pointers are 32 bits, long long and double are 8-byte aligned, wchar_t is unsigned 32-bit, `FLT_EVAL_METHOD` is 0 (VFP evaluates in the declared type). The Reference tab’s C types table lists them all.\n\nThe example passes one assert and fails the next. The check compares stdout and the exit status; the message itself goes to stderr: as.c: Assertion `x * x == 5\' failed.', PROG([['as.c', A`#include "libc.h"

unit('u14', 14, 'cap', 'f7', 'Capstones: your libc runs real programs', 'A program with no libc at all, then the full course libc running printf, malloc and qsort, threads, and a randomized self-test, and a final comparison with musl, glibc and newlib.', [
  lesson('u14l1', 'Hello with nothing: a bare _start', REF.linux, [
    LS('The smallest possible program', 'Before linking a libc, recall what one replaces. This program has **no libc at all** (`-nostdlib`): its own `_start`, two syscalls, nothing else. It reads argc from [sp], writes a message, and exits with argc as the status.\n\nThat is all a C runtime fundamentally is: entry, syscalls, and exit. Everything else (buffering, formatting, allocation) is ordinary code built on these, which is what you wrote in the previous units.\n\nBuilt statically, this binary is a few hundred bytes of code; a static musl hello is about 10 KiB; a static glibc hello is around 500 KiB because printf pulls in locale, wide-character and stdio machinery.', PROG([['start.s', A`.syntax unified
.arm

    LS('A real program on your libc', 'This program uses almost every part of the course libc: argv and getenv from crt0, strtol to parse arguments, malloc/realloc for a growing array, qsort with a callback, bsearch, printf with widths, atexit, and exit flushing stdout.\n\nIt is compiled from C by zig cc with `-nostdlib -fno-builtin -static` and linked only with the ten .s files: crt0, string, ctype, stdio, stdlib, setjmp, signal, threads, math, misc. `-fno-builtin` stops the compiler from replacing calls (for example printf("x\\n") with puts) or inlining memcpy, so every call really reaches your assembly.\n\nThings to notice in the output: the numbers are sorted by our quicksort; the table columns line up through `%4d` and `%08x`; the atexit message prints last, after main returns, before the buffer is flushed.', PROG([['app.c', A`#include "libc.h"

    MC('Why compile with -fno-builtin?', ['so the compiler does not replace or inline libc calls with its own versions', 'to disable optimisation', 'because zig needs it', 'to get Thumb code'], 'Otherwise printf("hi\\n") becomes puts and small memcpys become inline loads.'),

  lesson('u14l3', 'Threads capstone: a parallel sum', REF.linux, [
    LS('Four threads, one mutex, one atomic', 'Split an array among 4 threads. Each computes a partial sum privately (no sharing, no locks), then adds it to the total under the **futex mutex**, and bumps an **atomic** counter of finished threads. The main thread joins all four through CLONE_CHILD_CLEARTID.\n\nDesign lesson: lock **once per thread**, not once per element. Fine-grained sharing makes threads slower than one thread because every contended lock is a cache-line transfer between cores (and maybe a futex syscall).\n\nThe per-thread `errno` is also checked: each thread deliberately makes a failing syscall (`close(-1)` gives EBADF = 9) and confirms that its own errno says 9 while main’s errno is untouched.', PROG([['par.c', A`#include "libc.h"

  lesson('u14l4', 'Self-test: fuzzing your libc against a reference', REF.libc, [
    LS('Trust, but verify against C', 'Assembly bugs hide in edge cases: a length of 0, an unaligned tail, INT_MIN, a divisor of 1. The cure is **differential testing**: generate random inputs, run your function and a simple reference written in plain C, and compare.\n\nThis course’s repository test `tests/fuzz.c` ran 397,144 comparisons (strlen, memcpy, memmove, memset, memcmp, strcmp, strtol, __udivmod, qsort, malloc patterns, UTF-8 round trips, stdbit, ckd_*) with zero failures. The program below is a compact version of it with a xorshift generator, so it is deterministic and its output can be checked exactly.\n\nGood fuzzing habits:\n\n- bias inputs toward edges (0, 1, powers of two, all-ones, lengths around 4, 8 and 16 for word and NEON paths),\n- vary alignment of every pointer argument,\n- check what must **not** change (bytes outside a memcpy’s destination),\n- print the first few failing inputs, not just a count.', PROG([['fz.c', A`#include "libc.h"

        n++; bad += (int)stdc_count_ones_ui(x) != __builtin_popcount(x);
    }
    int v[500];

    qsort(v, 500, 4, cmpi);

    LS('Same headers, three philosophies', 'You have now written a small version of each piece. Here is how the production libcs approach them on 32-bit ARM:\n\n**musl** (Alpine, static binaries, zig’s default): small, correct, readable. Mostly portable C; `arch/arm` holds syscall_arch.h (inline `svc 0`), crt_arch.h (`_start`), atomic_arch.h (ldrex/strex, or the kuser helper on old cores), and a few asm files (memcpy.S, setjmp, sigsetjmp, the restorer, clone, `__set_thread_area`). Static hello ≈ 10 KiB.\n\n**glibc** (most Linux distributions): fastest on big systems, the most features. `sysdeps/arm` has hand-tuned assembly for string functions with NEON and armv6t2/armv7 variants chosen by **IFUNC** at load time (reading HWCAP), ptmalloc2 with per-thread caches, NPTL threads, full locales, `PTR_MANGLE` of saved pointers in setjmp, a vDSO clock. Static hello ≈ 500 KiB.\n\n**newlib** (bare-metal and RTOS, Arm GNU Toolchain): no kernel assumed. System calls are stubs (`_write`, `_sbrk`) provided by **libgloss** or the board, often via semihosting (`bkpt 0xAB` / `svc 0x123456`). `libc/machine/arm` has optimized strcmp, strlen, memcpy and setjmp; **newlib-nano** trims printf (no floats unless `-u _printf_float`) and uses nano-malloc. Reentrancy uses `struct _reent` instead of TLS.\n\nWhat each does with errno: musl and glibc keep it in the thread’s TLS block (as we do at tp + 0, but via the ELF TLS model), newlib in `_impure_ptr->_errno`.', null),

  lab('shifter', 'Barrel shifter and immediates', 'gear', 'Shift any 32-bit value with lsl, lsr, asr, ror or rrx and see the carry-out, then check whether a constant is a valid rotated 8-bit immediate and the cheapest way to build it.', body => {
