<style>
/* base.css — layout and components shared by every course: one mobile-first column that widens on tablets
   and PCs, a lesson path, a bottom tab bar and a full-screen lesson player. Colours and display fonts come
   from each course's theme.css (tokens only); sizes scale with the Display setting (CSS zoom on body). */
:root {
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 12px;
  --nav-h: 62px;
  --zoom: 1;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
code, .mono { font-family: var(--font-mono); font-size: .92em; }
code { background: var(--line-2); padding: .05em .35em; border-radius: 5px; white-space: nowrap; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.15; text-wrap: balance; margin: 0; letter-spacing: .01em; }
p { margin: 0; }
a { color: var(--brand); }
.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); }
.small { font-size: 13px; }
.tnum { font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.grow { flex: 1; min-width: 0; }
.eyebrow { font-family: var(--font-display); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }

/* field colour chips */
.fc { font-family: var(--font-mono); font-size: .85em; padding: .05em .4em; border-radius: 5px; white-space: nowrap; font-weight: 500; }
.fc-op { background: var(--f-op-2); color: var(--f-op); } .fc-rd { background: var(--f-rd-2); color: var(--f-rd); }
.fc-f3 { background: var(--f-f3-2); color: var(--f-f3); } .fc-rs1 { background: var(--f-rs1-2); color: var(--f-rs1); }
.fc-rs2 { background: var(--f-rs2-2); color: var(--f-rs2); } .fc-f7 { background: var(--f-f7-2); color: var(--f-f7); }
.fc-imm { background: var(--f-imm-2); color: var(--f-imm); }

/* ---------- shell ---------- */
.shell { min-height: 100%; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface);
  border-bottom: 1px solid var(--line-2);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.topbar-in { max-width: 720px; margin: 0 auto; height: 54px; display: flex; align-items: center; gap: 12px; }
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--font-display); font-weight: 800; font-size: 21px; letter-spacing: .02em; white-space: nowrap; min-width: 0; }
.brand-mark { width: 26px; height: 26px; }
.brand small { font-family: var(--font-mono); font-size: 10.5px; font-weight: 500; color: var(--ink-3); letter-spacing: .04em; margin-left: 2px; }
.top-stats { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.pill { display: inline-flex; align-items: center; gap: 5px; height: 30px; padding: 0 10px; border-radius: 999px; background: var(--card); border: 1px solid var(--line-2); font-weight: 700; font-size: 13.5px; font-variant-numeric: tabular-nums; }
.pill svg { width: 16px; height: 16px; }
.pill.gold { color: var(--gold); }
.pill.hot { color: var(--f-f3); }
.main {
  flex: 1; width: 100%; max-width: 720px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom, 0px));
}
.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--line-2);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px));
}
.nav-in { max-width: 720px; margin: 0 auto; height: var(--nav-h); display: grid; grid-template-columns: repeat(5, 1fr); }
.nav button { background: none; border: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--ink-3); font-size: 11.5px; font-weight: 700; letter-spacing: .02em; border-radius: 10px; }
.nav button svg { width: 24px; height: 24px; }
.nav button[aria-current="page"] { color: var(--brand); }
.nav button[aria-current="page"] svg { filter: drop-shadow(0 2px 6px color-mix(in srgb, var(--brand) 40%, transparent)); }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 18px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--card); font-weight: 700; letter-spacing: .01em;
  box-shadow: 0 2px 0 var(--line); transition: transform .08s ease, box-shadow .08s ease, background .15s;
}
.btn:active { transform: translateY(2px); box-shadow: 0 0 0 var(--line); }
.btn.primary { background: var(--brand); color: var(--brand-ink); border-color: transparent; box-shadow: 0 3px 0 color-mix(in srgb, var(--brand) 55%, #000); }
.btn.primary:active { box-shadow: 0 0 0 transparent; }
.btn.gold { background: var(--gold); color: var(--gold-ink); border-color: transparent; box-shadow: 0 3px 0 color-mix(in srgb, var(--gold) 55%, #000); }
.btn.ok { background: var(--ok); color: #fff; border-color: transparent; box-shadow: 0 3px 0 color-mix(in srgb, var(--ok) 55%, #000); }
.btn.bad { background: var(--bad); color: #fff; border-color: transparent; box-shadow: 0 3px 0 color-mix(in srgb, var(--bad) 55%, #000); }
.btn.ghost { background: transparent; box-shadow: none; border-color: var(--line); }
.btn.small { min-height: 36px; padding: 0 12px; font-size: 13.5px; border-radius: 10px; }
.btn.wide { width: 100%; }
.btn[disabled] { opacity: .45; cursor: not-allowed; transform: none; }
.iconbtn { width: 40px; height: 40px; border-radius: 10px; border: 0; background: transparent; display: grid; place-items: center; color: var(--ink-2); }
.iconbtn svg { width: 22px; height: 22px; }

/* ---------- learn path ---------- */
.hello { display: flex; gap: 14px; align-items: center; margin-bottom: 18px; }
.goal-ring { width: 54px; height: 54px; flex: none; }
.hello h1 { font-size: 22px; }
.unit { margin: 0 0 30px; }
.unit-head {
  position: relative; border-radius: 16px; padding: 16px 16px 14px; color: var(--ink); background: var(--card);
  border: 1px solid var(--line-2); overflow: hidden; box-shadow: var(--shadow);
}
.unit-head::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 6px; background: var(--uc); }
.unit-head .eyebrow { color: var(--uc); }
.unit-head h2 { font-size: 21px; margin: 4px 0 4px; }
.unit-head p { color: var(--ink-2); font-size: 14px; max-width: 60ch; }
.unit-meter { display: flex; align-items: center; gap: 10px; margin-top: 10px; font-size: 12.5px; color: var(--ink-3); font-weight: 700; }
.meter { flex: 1; height: 8px; border-radius: 99px; background: var(--line-2); overflow: hidden; }
.meter > i { display: block; height: 100%; background: var(--gold); border-radius: 99px; transition: width .4s ease; }
.die-stamp { position: absolute; right: 12px; top: 12px; font-family: var(--font-mono); font-size: 10px; color: var(--ink-3); letter-spacing: .06em; text-align: right; line-height: 1.3; }
.path { position: relative; margin: 6px auto 0; width: 100%; max-width: 360px; }
.path svg.trace { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.node-wrap { position: absolute; width: 136px; margin-left: -68px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.node {
  width: 64px; height: 64px; border-radius: 16px; border: 2px solid var(--line); background: var(--card); display: grid; place-items: center;
  box-shadow: 0 4px 0 var(--line); transition: transform .1s; position: relative; color: var(--ink-3);
}
.node svg { width: 28px; height: 28px; }
.node:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.node.done { background: var(--gold); border-color: transparent; color: var(--gold-ink); box-shadow: 0 4px 0 color-mix(in srgb, var(--gold) 55%, #000); }
.node.current { background: var(--brand); border-color: transparent; color: var(--brand-ink); box-shadow: 0 4px 0 color-mix(in srgb, var(--brand) 55%, #000); }
.node.current::after { content: ""; position: absolute; inset: -9px; border-radius: 22px; border: 3px solid var(--brand); opacity: .5; animation: ring 1.8s ease-out infinite; }
.node.locked { opacity: .55; cursor: not-allowed; }
.node.check { width: 78px; border-radius: 20px; }
.node-label { font-size: 12px; font-weight: 700; text-align: center; line-height: 1.2; color: var(--ink-2); max-width: 136px; text-wrap: balance; }
.node-stars { display: flex; gap: 1px; height: 12px; }
.node-stars svg { width: 12px; height: 12px; color: var(--gold); }
.start-tip { position: absolute; top: -30px; background: var(--card); border: 2px solid var(--brand); color: var(--brand); font-weight: 800; font-size: 12px; padding: 2px 10px; border-radius: 8px; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; animation: bob 1.6s ease-in-out infinite; }
@keyframes ring { 0% { transform: scale(.9); opacity: .6; } 100% { transform: scale(1.15); opacity: 0; } }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }

/* ---------- player ---------- */
.player { position: fixed; inset: 0; z-index: 60; background: var(--bg); display: flex; flex-direction: column; }
.p-top {
  flex: none; display: flex; align-items: center; gap: 10px; height: 56px; background: var(--bg);
  padding-top: env(safe-area-inset-top, 0px); box-sizing: content-box;
  padding-left: max(10px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.p-progress { flex: 1; height: 14px; border-radius: 99px; background: var(--line-2); overflow: hidden; }
.p-progress > i { display: block; height: 100%; background: var(--gold); border-radius: 99px; transition: width .35s ease; box-shadow: inset 0 -4px 0 rgba(0,0,0,.08), inset 0 3px 0 rgba(255,255,255,.35); }
.combo { font-family: var(--font-display); font-weight: 700; color: var(--f-f3); font-size: 15px; min-width: 38px; text-align: right; font-variant-numeric: tabular-nums; }
.p-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.p-body-in {
  max-width: 680px; margin: 0 auto; padding-block: 8px 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 16px;
}
.p-foot {
  flex: none; border-top: 1px solid var(--line-2); background: var(--surface); position: relative;
  padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.p-foot-in { max-width: 680px; margin: 0 auto; display: flex; gap: 10px; }
.p-foot-in .btn { flex: 1; }
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; transform: translateY(102%); transition: transform .25s cubic-bezier(.2,.8,.2,1);
  padding-block: 14px calc(12px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-top: 2px solid; max-height: calc(62vh / var(--zoom, 1)); overflow-y: auto;
}
.sheet.show { transform: translateY(0); }
.sheet.ok { background: var(--ok-2); border-color: var(--ok); }
.sheet.bad { background: var(--bad-2); border-color: var(--bad); }
.sheet-in { max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
.sheet h3 { font-size: 20px; display: flex; align-items: center; gap: 8px; }
.sheet.ok h3 { color: var(--ok); } .sheet.bad h3 { color: var(--bad); }
.sheet .why { color: var(--ink); font-size: 14.5px; }
.sheet .answer { font-size: 14px; color: var(--ink); }
.sheet .answer b { color: var(--bad); }
.kind-tag { font-family: var(--font-display); font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
.qtext { font-size: 18px; font-weight: 700; line-height: 1.38; }
.qtext code { font-size: .86em; white-space: normal; overflow-wrap: anywhere; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.learn h2 { font-size: 23px; }
.learn .body { font-size: 15.5px; color: var(--ink); display: flex; flex-direction: column; gap: 10px; }
.learn .body ul, .learn .body ol { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 4px; }
.learn .body ol li::marker { font-weight: 700; color: var(--brand); }
.body pre.code { margin: 2px 0; }
.spec {
  display: flex; gap: 8px; align-items: flex-start; font-size: 12.5px; color: var(--ink-2); background: var(--surface); border: 1px dashed var(--line);
  border-radius: 10px; padding: 8px 10px;
}
.spec svg { flex: none; width: 16px; height: 16px; margin-top: 2px; color: var(--ink-3); }
.hint { font-size: 13px; color: var(--ink-3); }
.shake { animation: shake .35s; }
@keyframes shake { 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }
.pop { animation: pop .3s; }
@keyframes pop { 50% { transform: scale(1.04); } }

/* ---------- exercise widgets ---------- */
.opts { display: grid; gap: 10px; }
.opts.two { grid-template-columns: 1fr 1fr; }
.opt {
  text-align: left; min-height: 50px; padding: 11px 14px; border-radius: 12px; border: 2px solid var(--line); background: var(--card);
  box-shadow: 0 3px 0 var(--line); font-size: 15px; display: flex; gap: 10px; align-items: center; line-height: 1.35;
}
.opt .k { flex: none; width: 24px; height: 24px; border-radius: 7px; border: 1.5px solid var(--line); display: grid; place-items: center; font-size: 12px; font-weight: 700; color: var(--ink-3); font-family: var(--font-mono); }
.opt[aria-pressed="true"] { border-color: var(--brand); background: var(--brand-2); box-shadow: 0 3px 0 var(--brand); }
.opt[aria-pressed="true"] .k { border-color: var(--brand); color: var(--brand); }
.opt.right { border-color: var(--ok); background: var(--ok-2); box-shadow: 0 3px 0 var(--ok); }
.opt.wrong { border-color: var(--bad); background: var(--bad-2); box-shadow: 0 3px 0 var(--bad); }
.opt:disabled { cursor: default; }
.opt code { white-space: normal; overflow-wrap: anywhere; }
.tfrow { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tfrow .opt { justify-content: center; font-weight: 700; font-size: 17px; min-height: 64px; }
.numwrap { display: flex; gap: 10px; align-items: center; }
.num {
  flex: 1; min-width: 0; height: 54px; border-radius: 12px; border: 2px solid var(--line); background: var(--card); padding: 0 14px;
  font-family: var(--font-mono); font-size: 20px; font-weight: 500;
}
.num:focus { border-color: var(--brand); outline: none; }
.num.right { border-color: var(--ok); background: var(--ok-2); } .num.wrong { border-color: var(--bad); background: var(--bad-2); }
.unit-label { font-weight: 700; color: var(--ink-2); }
.bits { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; }
.bitgrp { display: flex; gap: 3px; }
.bit {
  width: 34px; height: 44px; border-radius: 9px; border: 2px solid var(--line); background: var(--card); font-family: var(--font-mono);
  font-size: 18px; font-weight: 700; display: grid; place-items: center; color: var(--ink-3); box-shadow: 0 3px 0 var(--line); position: relative;
}
.bit.on { background: var(--brand); color: var(--brand-ink); border-color: transparent; box-shadow: 0 3px 0 color-mix(in srgb, var(--brand) 55%, #000); }
.bit small { position: absolute; top: -17px; font-size: 10px; color: var(--ink-3); font-weight: 500; }
.bit.locked { opacity: .5; cursor: default; }
.bits.dense .bit { width: 22px; height: 34px; font-size: 14px; border-radius: 6px; }
.bits.dense .bit small { font-size: 9px; top: -15px; }
.bitval { text-align: center; font-family: var(--font-mono); font-size: 14px; color: var(--ink-2); margin-top: 6px; }
.chipbank, .slots { display: flex; flex-wrap: wrap; gap: 8px; }
.slots { min-height: 56px; padding: 10px; border-radius: 12px; border: 2px dashed var(--line); background: var(--surface); }
.slots.vertical { flex-direction: column; }
.chip {
  border: 2px solid var(--line); background: var(--card); border-radius: 10px; padding: 8px 12px; font-weight: 700; font-size: 14.5px;
  box-shadow: 0 3px 0 var(--line); text-align: left; line-height: 1.3;
}
.chip.used { visibility: hidden; }
.chip.placed { border-color: var(--brand); background: var(--brand-2); box-shadow: 0 3px 0 var(--brand); }
.chip.right { border-color: var(--ok); background: var(--ok-2); box-shadow: 0 3px 0 var(--ok); }
.chip.wrong { border-color: var(--bad); background: var(--bad-2); box-shadow: 0 3px 0 var(--bad); }
.chip code { white-space: normal; }
.slot-n { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 6px; background: var(--brand); color: var(--brand-ink); font-size: 11px; margin-right: 6px; font-family: var(--font-mono); }
.match { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.match .col { display: flex; flex-direction: column; gap: 8px; }
.match .chip { width: 100%; min-height: 46px; }
.match .chip.sel { border-color: var(--brand); background: var(--brand-2); box-shadow: 0 3px 0 var(--brand); }
.match .chip.done { opacity: .35; border-color: var(--ok); cursor: default; }
.fill { font-size: 17px; line-height: 2.3; font-weight: 600; }
.blank { display: inline-flex; min-width: 70px; height: 36px; padding: 0 10px; align-items: center; justify-content: center; border-radius: 9px; border: 2px dashed var(--brand); background: var(--brand-2); color: var(--brand); font-family: var(--font-mono); font-size: 15px; vertical-align: middle; margin: 0 2px; }
.blank.empty { color: transparent; }
.blank.right { border-style: solid; border-color: var(--ok); background: var(--ok-2); color: var(--ok); }
.blank.wrong { border-style: solid; border-color: var(--bad); background: var(--bad-2); color: var(--bad); }
.sig-list { display: flex; flex-direction: column; gap: 8px; }
.sig { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.sig .nm { font-family: var(--font-mono); font-weight: 700; font-size: 13.5px; width: 76px; }
.seg { display: inline-flex; border: 2px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--card); flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 7px 11px; font-weight: 700; font-size: 13.5px; font-family: var(--font-mono); color: var(--ink-2); border-right: 1px solid var(--line-2); min-height: 36px; }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--brand); color: var(--brand-ink); }
.seg.text button { font-family: var(--font-body); }
.seg.right { border-color: var(--ok); } .seg.wrong { border-color: var(--bad); }
.splitter { display: flex; flex-direction: column; gap: 10px; }
.split-ctl { display: flex; align-items: center; gap: 10px; }
.split-ctl .nm { width: 64px; font-weight: 700; }
.stepper { display: inline-flex; align-items: center; border: 2px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--card); }
.stepper button { width: 40px; height: 38px; border: 0; background: transparent; font-size: 20px; font-weight: 700; color: var(--ink-2); }
.stepper span { min-width: 40px; text-align: center; font-family: var(--font-mono); font-weight: 700; font-size: 16px; }
.hotspot-hint { font-size: 13px; color: var(--ink-3); text-align: center; }

/* ---------- figures ---------- */
.fig { margin: 0; display: flex; flex-direction: column; gap: 8px; }
.fig-box { background: var(--card); border: 1px solid var(--line-2); border-radius: 14px; padding: 12px; overflow-x: auto; }
.fig-box.flush { padding: 0; }
.fig svg { display: block; width: 100%; height: auto; max-width: 600px; margin: 0 auto; overflow: visible; }
.fig svg.wide { min-width: 340px; }

.svg-hot { cursor: pointer; }
/* drawings set their colours inline, so the interaction states must win with !important */
.svg-hot:hover rect, .svg-hot:hover path, .svg-hot:hover circle, .svg-hot:hover polygon { stroke: var(--brand) !important; }

.svg-hot.right rect, .svg-hot.right path, .svg-hot.right polygon, .svg-hot.right circle { stroke: var(--ok) !important; stroke-width: 3 !important; }
.svg-hot.wrong rect, .svg-hot.wrong path, .svg-hot.wrong polygon, .svg-hot.wrong circle { stroke: var(--bad) !important; stroke-width: 3 !important; }
.svg-hot.picked, .svg-hot.right, .svg-hot.wrong { opacity: 1 !important; }
.flow-dash { stroke-dasharray: 6 5; animation: flow 1s linear infinite; }

.tbl-wrap { overflow-x: auto; border: 1px solid var(--line-2); border-radius: 12px; background: var(--card); }
table.t { border-collapse: collapse; width: 100%; font-size: 13.5px; }
table.t th, table.t td { padding: 7px 10px; border-bottom: 1px solid var(--line-2); text-align: left; vertical-align: top; }
table.t th { font-family: var(--font-display); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); background: var(--surface); position: sticky; top: 0; white-space: nowrap; }
table.t tr:last-child td { border-bottom: 0; }

/* ---------- end screen ---------- */

.tile .l { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); }
.tile.gold .v { color: var(--gold); } .tile.ok .v { color: var(--ok); } .tile.brand .v { color: var(--brand); }
.big-stars { display: flex; gap: 6px; }
.big-stars svg { width: 44px; height: 44px; color: var(--line); }
.big-stars svg.on { color: var(--gold); animation: pop .4s backwards; }

/* ---------- sections, cards ---------- */
.section-title { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 6px 0 12px; }

.cards { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); }
.card {
  background: var(--card); border: 1px solid var(--line-2); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 8px;
  box-shadow: var(--shadow); min-width: 0;
}
button.card { text-align: left; cursor: pointer; }
.card h3 { font-size: 17px; }
.card .ic { width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center; background: var(--brand-2); color: var(--brand); flex: none; }
.card .ic svg { width: 22px; height: 22px; }
.card-row { display: flex; gap: 12px; align-items: center; }
.tag { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 6px; font-size: 11.5px; font-weight: 700; background: var(--line-2); color: var(--ink-2); letter-spacing: .02em; }
.tag.gold { background: var(--gold-2); color: var(--gold); }

.lab-head { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }

.panel { background: var(--card); border: 1px solid var(--line-2); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.build-list { display: grid; gap: 8px; }
@media (min-width: 760px) { .build-list { grid-template-columns: 1fr 1fr; } }
.build-item { background: var(--card); border: 1px solid var(--line-2); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.build-item h4 { margin: 0; font-size: 15px; }
.bl-row { display: flex; gap: 10px; font-size: 13.5px; line-height: 1.4; min-width: 0; }
.bl-k { flex: none; width: 46px; padding-top: 2px; font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.panel h3 { font-size: 15px; letter-spacing: .02em; }
.ctrl-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.ctrl-row label { font-size: 13px; font-weight: 700; color: var(--ink-2); }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field > span { font-size: 12px; font-weight: 700; color: var(--ink-3); letter-spacing: .04em; text-transform: uppercase; }
select.sel, input.txt {
  height: 40px; border-radius: 10px; border: 2px solid var(--line); background: var(--card); padding: 0 10px; font-weight: 700; font-size: 14px; min-width: 0;
}
input.txt { font-family: var(--font-mono); font-weight: 500; }
textarea.code {
  width: 100%; min-height: 170px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); padding: 10px 12px;
  font-family: var(--font-mono); font-size: 13px; line-height: 1.55; resize: vertical; white-space: pre; overflow-x: auto;
}
textarea.code:focus, select.sel:focus, input.txt:focus { border-color: var(--brand); outline: none; }
.err { color: var(--bad); font-size: 13px; font-weight: 700; }
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line-2); border-radius: 12px; padding: 8px 10px; }
.stat .v { font-family: var(--font-display); font-weight: 700; font-size: 20px; font-variant-numeric: tabular-nums; }
.stat .l { font-size: 11px; font-weight: 700; color: var(--ink-3); text-transform: uppercase; letter-spacing: .06em; }
.stat.good .v { color: var(--ok); } .stat.warnc .v { color: var(--f-rs2); } .stat.badc .v { color: var(--bad); }
.notes { display: flex; flex-direction: column; gap: 8px; }
.note { display: flex; gap: 8px; font-size: 13.5px; padding: 8px 10px; border-radius: 10px; background: var(--surface); border-left: 4px solid var(--line); }
.note.warn { border-left-color: var(--f-rs2); } .note.good { border-left-color: var(--ok); } .note.fix { border-left-color: var(--brand); } .note.info { border-left-color: var(--ink-3); }
.scrub { width: 100%; accent-color: var(--brand); }
.toggle { position: relative; width: 50px; height: 30px; flex: none; }
.toggle input { opacity: 0; position: absolute; inset: 0; margin: 0; cursor: pointer; z-index: 1; }
.toggle i { position: absolute; inset: 0; border-radius: 99px; background: var(--line); transition: background .15s; }
.toggle i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--card); transition: transform .15s; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
.toggle input:checked + i { background: var(--brand); }
.toggle input:checked + i::after { transform: translateX(20px); }
.toggle input:focus-visible + i { outline: 2px solid var(--brand); outline-offset: 2px; }
.setting { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line-2); }
.setting:last-child { border-bottom: 0; }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 10px; }
.badge { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; font-size: 12px; font-weight: 700; color: var(--ink-2); }
.badge .b { width: 62px; height: 62px; }
.badge.off { opacity: .4; filter: grayscale(1); }
.search { width: 100%; height: 44px; border-radius: 12px; border: 2px solid var(--line); background: var(--card); padding: 0 14px; font-size: 15px; }
.search:focus { border-color: var(--brand); outline: none; }
.gloss dt { font-weight: 700; font-family: var(--font-display); font-size: 16px; }
.gloss dd { margin: 2px 0 12px; color: var(--ink-2); font-size: 14px; }
.reg-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.reg { border-radius: 9px; padding: 6px 4px; text-align: center; border: 1px solid var(--line-2); background: var(--surface); font-family: var(--font-mono); font-size: 12px; line-height: 1.25; min-width: 0; }
.reg b { display: block; font-size: 13px; }
.reg.changed { background: var(--gold-2); border-color: var(--gold); }
.toast { position: fixed; left: 50%; bottom: calc(var(--nav-h) + 18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px); opacity: 0; transition: all .25s; z-index: 90; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 700; font-size: 14px; pointer-events: none; max-width: calc(100% - 32px); text-align: center; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.confirm { display: flex; flex-direction: column; gap: 10px; padding: 12px; border: 2px solid var(--bad); border-radius: 12px; background: var(--bad-2); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12px; color: var(--ink-2); justify-content: center; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.cyclebar { display: flex; align-items: center; gap: 8px; }
.cyclebar .btn { min-height: 36px; padding: 0 10px; }
.timeline { display: flex; flex-wrap: wrap; gap: 3px; }

.timeline i.ok { background: var(--ok-2); color: var(--ok); } .timeline i.no { background: var(--bad-2); color: var(--bad); }
.timeline i.cur { outline: 2px solid var(--brand); }

@media (min-width: 900px) {
  .main { max-width: 860px; }
  .topbar-in, .nav-in { max-width: 860px; }

}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
.part-head { margin: 28px 0 16px; padding: 12px 14px; border-radius: 12px; background: var(--surface); border: 1px dashed var(--line); display: flex; flex-direction: column; gap: 4px; }
.part-head .eyebrow { color: var(--brand); font-size: 13px; }
.node-stars svg.off { color: var(--line); }
.console { background: var(--term-bg); color: var(--term-ink); border: 1px solid var(--line); border-radius: 12px; padding: 12px; font-family: var(--font-mono); font-size: 12px; line-height: 1.5; white-space: pre; overflow-x: auto; min-height: 64px; max-height: 280px; overflow-y: auto; }
.console .cursor { display: inline-block; width: 8px; height: 15px; background: var(--gold); vertical-align: -2px; animation: blink 1s steps(2) infinite; }
@keyframes blink { to { opacity: 0; } }
pre.code { margin: 0; background: var(--surface); border: 1px solid var(--line-2); border-radius: 12px; padding: 10px 12px; font-family: var(--font-mono); font-size: 12px; line-height: 1.5; overflow-x: auto; max-height: 320px; tab-size: 4; }
.banner { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 12px; font-weight: 700; font-size: 14px; }
.banner svg { width: 20px; height: 20px; flex: none; }
.banner.pass { background: var(--ok-2); color: var(--ok); } .banner.fail { background: var(--bad-2); color: var(--bad); } .banner.info { background: var(--brand-2); color: var(--brand); } .banner.warn { background: var(--gold-2); color: var(--gold); }
.evlist { display: flex; flex-direction: column; gap: 6px; max-height: 280px; overflow-y: auto; }
.ev { display: flex; gap: 8px; align-items: baseline; font-size: 13px; padding: 6px 8px; border-radius: 8px; background: var(--surface); }
.ev .n { font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); min-width: 44px; }
.ev .m { font-family: var(--font-mono); font-size: 11.5px; font-weight: 700; padding: 1px 6px; border-radius: 5px; white-space: nowrap; }
.mode-M { background: var(--f-f3-2); color: var(--f-f3); } .mode-S { background: var(--f-rs1-2); color: var(--f-rs1); } .mode-U { background: var(--f-rd-2); color: var(--f-rd); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { border: 1.5px solid var(--line); background: var(--card); border-radius: 8px; padding: 5px 9px; font-family: var(--font-mono); font-size: 12.5px; font-weight: 500; }
.chips button[aria-pressed="true"] { border-color: var(--brand); background: var(--brand-2); color: var(--brand); }
.tile-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px; }
.kv dt { color: var(--ink-3); font-weight: 700; }
.kv dd { margin: 0; font-family: var(--font-mono); }
.btn svg { width: 18px; height: 18px; flex: none; }
.sheet h3 svg { width: 24px; height: 24px; flex: none; }
.bits { padding-top: 16px; }
.fig pre.code { max-height: none; }
.hl-line { display: block; background: var(--gold-2); margin: 0 -12px; padding: 0 12px; }
.plain-line { display: block; }
/* program source under a firmware run */
.src-details { margin-top: 8px; }
.src-details > summary { cursor: pointer; font-weight: 700; font-size: 13px; color: var(--brand); padding: 6px 0; list-style-position: inside; }
.fig .src-details pre.code { max-height: 420px; overflow: auto; margin-top: 6px; }

/* ---------- lab widgets ---------- */
.stats.tight { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 6px; }

.slider { display: flex; flex-direction: column; gap: 2px; min-width: 0; }

.studio-h { font-size: 18px; margin-top: 8px; }
.ev .m.ev-thermal { background: var(--gold-2); color: var(--gold); }
.ev .m.ev-error { background: var(--bad-2); color: var(--bad); }
.ref-figure { margin-top: 4px; }

@media (max-width: 440px) { .brand small { display: none; } .brand { font-size: 18px; } .multi .brand-name { font-size: 17px; } .top-stats { gap: 4px; } .top-stats .pill { padding: 0 8px; } }

/* ---------- display: size and full screen ---------- */
.view-panel {
  position: fixed; z-index: 95; top: calc(env(safe-area-inset-top, 0px) + 56px); right: max(10px, env(safe-area-inset-right, 0px));
  width: min(320px, calc(100vw / var(--zoom, 1) - 20px)); background: var(--card); color: var(--ink); border: 1px solid var(--line);

}

.p-top .p-view { flex: none; }

/* ---------- course switcher (several courses in one app) ---------- */
.course-switch { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 0 0 18px; }
.cs-btn {
  display: flex; flex-direction: column; align-items: flex-start; gap: 4px; min-width: 0; text-align: left; padding: 9px 10px 10px;
  border-radius: 14px; border: 2px solid var(--line-2); background: var(--card); color: var(--ink); box-shadow: 0 3px 0 var(--line-2);
}

.cs-top { display: flex; align-items: center; gap: 6px; width: 100%; }

.cs-meter > i { display: block; height: 100%; background: var(--gold); }
.course-tag { color: var(--brand); }
.me-h { margin: 22px 0 10px; font-size: 17px; display: flex; align-items: center; gap: 8px; }
.me-h .brand-mark { width: 22px; height: 22px; flex: none; }

.me-badges > summary { cursor: pointer; font-weight: 700; font-size: 13.5px; color: var(--brand); padding: 4px 0 10px; }
.brand-name { overflow: hidden; text-overflow: ellipsis; }
.brand-stack { display: flex; align-items: center; gap: 8px; min-width: 0; }
.brand-tag { flex: none; font-family: var(--font-body); font-size: 11px; font-weight: 700; letter-spacing: .06em; line-height: 1; padding: 4px 6px; border-radius: 6px; background: var(--brand); color: var(--brand-ink); }
@media (max-width: 440px) {
  .brand-stack { flex-direction: column; align-items: flex-start; gap: 2px; }

}
@media (max-width: 380px) { .multi .brand-stack .brand-name { font-size: 14px; } }

/* ---------- code exercises ---------- */
.goal-line { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; padding: 8px 10px; border-radius: 10px; background: var(--gold-2); color: var(--ink); }

}

  font-family: var(--font-mono); font-size: 12px; line-height: 1.6; white-space: pre; overflow: auto; tab-size: 4; min-height: 120px; color: var(--ink);
}

/* ---------- wider screens: tablets and PCs ---------- */
@media (min-width: 1100px) {

}
.svg-hot:focus { outline: none; }
.svg-hot:focus-visible { outline: 2.5px solid var(--gold); outline-offset: 2px; }

/* ======== Lern2DivARM theme ======== */
/* Lern2DivARM theme: deep indigo for the brand and quotient orange for highlights, on pale lavender in light mode and ink blue in dark mode. */
:root {
  --bg: #F1F0FA;
  --surface: #FAFAFE;
  --card: #FFFFFF;
  --ink: #1D1B17;
  --ink-2: #46413A;
  --ink-3: #6B655C;
  --line: #D3D1EC;
  --line-2: #E7E6F5;
  --brand: #4338CA;
  --brand-2: #E0E0FA;
  --brand-ink: #FFFFFF;
  --gold: #C2410C;
  --gold-2: #FDE6D8;
  --gold-ink: #FFFFFF;
  --ok: #2B7F3E;
  --ok-2: #DCEEDF;
  --bad: #C0353F;
  --bad-2: #F7DCDE;
  --wire: #9C958A;
  --hot: #C7307A;
  --f-op: #2B7F3E;
  --f-rd: #1E5DBE;
  --f-f3: #C0353F;
  --f-rs1: #7841B3;
  --f-rs2: #A96500;
  --f-f7: #0B7A80;
  --f-imm: #B02E78;
  --f-op-2: #DCEEDF;
  --f-rd-2: #DEE7F7;
  --f-f3-2: #F7DCDE;
  --f-rs1-2: #ECE2F7;
  --f-rs2-2: #F6E9D3;

.stat .l { text-transform: none; letter-spacing: .01em; }
.scroll-x { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.scroll-x > svg { max-width: none; }
.fig-box.center { display: flex; justify-content: center; }

.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px; }

.tests { display: flex; flex-direction: column; gap: 4px; }
.test-row { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; padding: 6px 8px; border-radius: 8px; background: var(--surface); border-left: 4px solid var(--ok); min-width: 0; }
.test-row.bad { border-left-color: var(--bad); }
.test-row .ic { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 12px; flex: none; background: var(--ok-2); color: var(--ok); }
.test-row.bad .ic { background: var(--bad-2); color: var(--bad); }
.test-row .tx { min-width: 0; overflow-wrap: anywhere; }
.test-row .tx code { font-size: 12px; white-space: normal; overflow-wrap: anywhere; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.sl-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px 14px; }
.note.bad { border-left-color: var(--bad); }
.note.info { border-left-color: var(--brand); }
.tog { display: inline-flex; align-items: center; gap: 10px; font-weight: 700; font-size: 14px; cursor: pointer; }

.stage-tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.stage-tabs button { border: 1.5px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 6px 11px; font-size: 12.5px; font-weight: 700; cursor: pointer; }
.stage-tabs button[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }

.pick-pad { display: flex; flex-wrap: wrap; gap: 6px; }
.pick-pad .pbtn { min-width: 44px; min-height: 40px; border-radius: 9px; border: 1.5px solid var(--line); background: var(--card); color: var(--ink); font-family: var(--font-mono); font-weight: 700; font-size: 13px; cursor: pointer; padding: 0 9px; }

.pick-pad .pbtn:disabled { opacity: .45; cursor: default; }
.state-line { font-family: var(--font-mono); font-size: 13px; line-height: 1.5; color: var(--ink); overflow-wrap: anywhere; white-space: pre-line; }

.unit-note { font-size: 12px; color: var(--ink-3); }

unit("u1", 1, "why", "rd", "Why division is expensive", "Which ARMv7 cores have a divide instruction, what a missing one costs, and where divisions hide in real programs.", [
  lesson("u1l1", "The missing instruction", REF.arm, [
    LS("ARMv7 did not promise a divide", "Add, subtract, shift, multiply: every ARMv7-A core does these in one to five cycles. **Divide is different.** The ARMv7-A architecture made integer divide *optional*:\n\n| Core | `udiv` / `sdiv` in ARM state? | Where you meet it |\n|---|---|---|\n| Cortex-A8 | **no** | BeagleBone, old phones |\n| Cortex-A9 | **no** | Zynq-7000, i.MX6, Raspberry-class boards, many routers |\n| Cortex-A5 | **no** | cheap SoCs, Atmel SAMA5 |\n| Cortex-A7, A15, A17 | yes (the *virtualization extensions* made it mandatory) | Raspberry Pi 2, Allwinner H3, many TVs |\n| Cortex-R4/R5 | Thumb only | car and disk controllers |\n| Cortex-M3/M4/M7 | yes (Thumb) | microcontrollers |\n\nA compiler that must run on *every* ARMv7-A core (the usual `-march=armv7-a` distro build) cannot use `udiv`. Instead, each `a / b` with a run-time `b` becomes a **call** to a helper function, `__aeabi_uidiv`, in the compiler’s run-time library (libgcc or compiler-rt). That helper is a software long-division loop: 3 to 170 instructions depending on the operands, plus the call.\n\nThis course is about writing that loop yourself, better, and about avoiding it entirely when you can."),
    LS("How a program finds out at run time", "Linux tells every process which optional features the CPU has, in the **auxiliary vector**: `getauxval(AT_HWCAP)` returns a bit mask. On 32-bit ARM:\n\n- bit 17, `HWCAP_IDIVA` = `0x20000`: `udiv`/`sdiv` work in **A**RM state.\n- bit 18, `HWCAP_IDIVT` = `0x40000`: they work in **T**humb state.\n- bit 12, `HWCAP_NEON`, and bit 16, `HWCAP_VFPv4`, are the other ones this course uses.\n\nTo test one bit you AND with its mask: `hw & 0x20000` is non-zero exactly when bit 17 is set. In assembly that is `tst r0, #0x20000` followed by `bne has_divide`. `tst` computes the AND, throws the result away and sets **Z** (zero flag) when the result is zero; `bne` (“branch if not equal”) branches when **Z = 0**, i.e. when the bit was set.\n\nThe program below asks qemu, which emulates a Cortex-A7 here, and then divides with the instruction directly.", PR("hwcap", "hwcap.c: read AT_HWCAP and try the hardware divide.")),
    LS("Dispatching once, not every time", "A library that wants to be fast everywhere picks its divide routine **once**, at start-up, and stores a function pointer, rather than testing the HWCAP bit inside every division:\n\n1. At start-up: `udiv_fn = (hwcap & HWCAP_IDIVA) ? hw_udiv : soft_udiv;`\n2. Each division: `blx` through the pointer. An indirect call is predicted well because it always goes to the same place.\n\nglibc does this for `memcpy` with **IFUNC** resolvers, and the Linux kernel patches its own code at boot (`patch_udiv` in `arch/arm/lib/`). Compilers take the other route: `-mcpu=cortex-a7` lets gcc emit `udiv` inline, at the price of a binary that crashes with **SIGILL** (illegal instruction) on an A9.", asm("hw_udiv:                @ only call this when HWCAP_IDIVA is set\n    udiv  r2, r0, r1    @ q = n / d   (2 to 12 cycles on A7, data-dependent)\n    mls   r1, r2, r1, r0 @ r = n - q*d (multiply-subtract: one instruction)\n    mov   r0, r2\n    bx    lr", "The whole hardware divmod: `udiv` gives the quotient, `mls` (multiply and subtract) rebuilds the remainder.")),

    {"t": "tf", "q": "Every ARMv7-A core has a hardware `udiv` instruction.", "a": false, "why": "It is optional in ARMv7-A: the A5, A8 and A9 lack it. It became mandatory with the virtualization extensions (A7, A15, A17) and in ARMv8."},

    LS("Counting instructions", "Cycle counts depend on the exact core, but **instructions executed** are easy to measure exactly: run the routine under `qemu-arm -singlestep -d exec` and count the trace lines. The table below is real data from this course’s benchmark (`tests/bench.py`). Each column is one way of computing `n / d`:\n\n- **udiv**: the A7’s hardware instruction (plus `bx lr`).\n- **restore, nonrest, clz, unroll, fast, newton**: the software routines you will write in units 3 to 11.\n- **libgcc**: `__aeabi_uidiv` from GCC 13’s run-time library, which A9 code calls for every `/`.\n- **magic10**: dividing by the constant 10 with a multiply (unit 10).\n\nRead a row left to right. For `100 / 7` the plain restoring loop runs 230 instructions; the unrolled routine 28; the hardware 2; and a multiply by a magic number 8, without any divide at all.", BENCHV("")),
    LS("Instructions are not the whole story", "On a real core, the cost of a software divide also includes:\n\n- **Branch mispredictions.** A loop whose trip count depends on the data, or a branch on each quotient bit, costs about 8 cycles per mispredict on a Cortex-A7/A9. This is why ARM code uses **conditional execution** (`subhs`, `adc`) instead of branching per bit; you will see it in every routine.\n- **Latency chains.** Every step of long division needs the previous remainder, so the steps cannot overlap. A 32-step loop is at least 32 dependent steps.\n- **The call itself.** `bl __aeabi_uidiv` + `bx lr`, plus registers r0–r3 and r12 that the caller must assume are destroyed.\n\nEven the hardware `udiv` is not cheap: on a Cortex-A7 it takes **about 4 to 20 cycles**, depending on the size of the quotient, compared with **1** for an add and **3** for a multiply. That is why compilers replace division by a *constant* with a multiply even on cores that have `udiv`."),

  lesson("u1l3", "Where divisions hide", REF.cost, [
    LS("Divisions you write without noticing", "Most divides in real programs are not a visible “/”. They come from:\n\n| Code | Division |\n|---|---|\n| `printf(\"%d\", x)` | x / 10 and x % 10 per digit |\n| `hash % table_size` | one per lookup |\n| `ring[i % N]` | one per access, unless N is a power of two |\n| `average = sum / count` | one per average |\n| `secs / 3600`, `days % 7` | time and date formatting |\n| `x * w / h` (scaling) | one per pixel or sample |\n| `size / sizeof(T)`, `(a - b) / sizeof(T)` | pointer differences; sizeof is a constant |\n| `checksum % 65521` (Adler-32) | one per block |\n\nThree different situations, each with its own fix:\n\n1. **Constant divisor** (10, 3600, 65521, sizeof): use a multiply by a magic reciprocal. Free on any core.\n2. **Power-of-two divisor**: a shift, and a mask for the remainder.\n3. **Run-time divisor** that repeats (table size, image width): compute its magic number **once** (unit 10 lesson 5), or pick a power of two.\n4. **Truly variable divisor**: you need a real divide routine; make it fast (units 3–6) or avoid it (unit 11)."),
    LS("A first taste: the remainder by a power of two", "When `d` is a power of two, `n % d` keeps the low bits of `n` and `n / d` drops them. For `d = 2^k`:\n\n- `n / d` = `n >> k` (`lsr r0, r0, #k`): shift right, bits fall off the bottom.\n- `n % d` = `n & (d − 1)` (`and r0, r0, #(d-1)`): d − 1 is a mask of k ones.\n\nExample with d = 16 = 2^4: 1000 = 0b11_1110_1000. `1000 >> 4` = 0b11_1110 = 62, and `1000 & 15` = 0b1000 = 8. Check: 62 × 16 + 8 = 1000.\n\nThis only holds for **unsigned** values. A signed `−7 / 2` in C is −3, but `asr` gives −4; unit 7 explains the fix.", X("    and   r1, r0, #15      @ r = n & (16 - 1) = 1000 & 0b1111\n    lsr   r0, r0, #4       @ q = n >> 4", [1000], "62 8", {"fmt": "u2"})),

unit("u2", 2, "why", "f3", "Long division in binary", "The school method, done in base 2, where each quotient digit is a yes/no question; plus the base conversions you need to follow every later lesson.", [
  lesson("u2l1", "From decimal long division to binary", REF.div, [
    LS("The school method, slowly", "Divide 7342 by 6 the way you learned at school:\n\n1. Take digits from the left until the number is at least 6: **7**. 6 fits **1** time. Write 1, subtract: 7 − 6 = **1**.\n2. Bring down the next digit: 1 → **13**. 6 fits **2** times (12). Write 2, remainder **1**.\n3. Bring down 4: **14**. 6 fits 2 times, remainder **2**.\n4. Bring down 2: **22**. 6 fits 3 times (18), remainder **4**.\n\nQuotient **1223**, remainder **4**. Check: 1223 × 6 + 4 = 7342.\n\nEvery step does the same three things:\n\n- **shift**: remainder × 10 + next digit (“bring down”),\n- **guess**: how many times the divisor fits (a digit 0–9),\n- **subtract**: remainder − digit × divisor.\n\nThe hard part in decimal is the *guess*: you need a multiplication table. In binary the guess is trivial, because the digit can only be 0 or 1: either the divisor fits, or it doesn’t. One comparison answers it."),
    LS("The same in base 2", "In base 2, “bring down the next digit” is **remainder × 2 + next bit**, a left shift by one with the new bit entering at the bottom. And the quotient digit is 1 exactly when `remainder ≥ divisor`.\n\nBelow is 100 / 7 with 100 written as the 8-bit number 0110_0100. Read the columns:\n\n- **bit**: the next bit of the dividend, from the top.\n- **rem<<1|bit**: the old remainder shifted left with that bit appended.\n- **>= d?**: does 7 (0b111) fit? That answer *is* the quotient bit.\n- **rem after**: subtract 7 if it fit, keep it otherwise.\n\nThe first four steps never fit, because 0, 1, 3 and 6 are all smaller than 7. That wasted work is what CLZ normalisation (unit 4) removes.", term("step  bit  rem<<1|bit   >= d?  rem after   q so far\n   1   0        0 (0)      no      0 (0)   0\n   2   1        1 (1)      no      1 (1)   00\n   3   1       11 (3)      no     11 (3)   000\n   4   0      110 (6)      no    110 (6)   0000\n   5   0    1100 (12)     yes    101 (5)   00001\n   6   1    1011 (11)     yes    100 (4)   000011\n   7   0     1000 (8)     yes      1 (1)   0000111\n   8   0       10 (2)      no     10 (2)   00001110\nresult: q = 14 (1110), r = 2", "100 / 7, one row per bit. Quotient 0b1110 = 14, remainder 2.")),
    LS("The loop invariant", "Why does this always work? After processing the top `i` bits of `n` (call that prefix `P`), the loop has\n\n> **q_so_far × d + rem = P**, and **0 ≤ rem < d**.\n\nAt the start, P = 0, q = 0, rem = 0: true. Each step makes P’ = 2P + bit, and\n\n- rem’ = 2·rem + bit, q’ = 2q: then q’d + rem’ = 2(qd + rem) + bit = P’.\n- If rem’ ≥ d, subtract d and add 1 to q’: the sum is unchanged.\n\nSince rem < d before the step, 2·rem + bit ≤ 2d − 1 < 2d, so **one** subtraction is always enough. That is why each binary digit is a single yes/no. When all bits are processed, P = n, so q·d + rem = n with rem < d: exactly the quotient and remainder.\n\nThat “at most 2d − 1” bound also matters in the assembly. In a 32-by-32 division it is harmless: after i steps the remainder is below 2^i, so it always fits a register. But when the loop starts from a non-zero remainder (dividing a 64-bit number, unit 9) and d is close to 2^32, 2·rem can need **33 bits**. Unit 3 shows how the carry flag holds that 33rd bit."),

  lesson("u2l2", "Walking through by hand", REF.div, [
    LS("A recipe you can run on paper", "To divide an n-bit number by d in binary:\n\n1. Write the dividend in binary. Set rem = 0, q = (empty).\n2. For each bit from the top: rem = rem·2 + bit. If rem ≥ d: rem −= d, append **1** to q; else append **0**.\n3. At the end q is the quotient and rem the remainder.\n\nMethod tip for the comparisons: keep d in binary as well. “rem ≥ d” is easy when both are in binary: compare the lengths first (a longer number is bigger), then compare from the top bit down.\n\nTry 200 / 13 = 15 r 5 yourself below: 200 = 0b1100_1000, 13 = 0b1101.", term("step  bit  rem<<1|bit   >= d?  rem after   q so far\n   1   1        1 (1)      no      1 (1)   0\n   2   1       11 (3)      no     11 (3)   00\n   3   0      110 (6)      no    110 (6)   000\n   4   0    1100 (12)      no  1100 (12)   0000\n   5   1   11001 (25)     yes  1100 (12)   00001\n   6   0   11000 (24)     yes  1011 (11)   000011\n   7   0   10110 (22)     yes   1001 (9)   0000111\n   8   0   10010 (18)     yes    101 (5)   00001111\nresult: q = 15 (1111), r = 5", "200 / 13.")),

    LS("Why hex and binary", "Division routines are full of masks, shifts and magic numbers like `0xCCCCCCCD`. To read them you must move fluently between three bases:\n\n- **Binary** shows the bits the hardware sees: shifts and masks are obvious.\n- **Hexadecimal** is binary in groups of four (one hex digit per **nibble**): `0xCCCCCCCD` is `1100 1100 … 1100 1101`.\n- **Decimal** is what you check results in.\n\n**Method, binary ↔ hex:** split the binary into groups of 4 from the right, and convert each group using the weights **8 4 2 1**. 0b1011_0110 → 1011 = 8+2+1 = 11 = B, 0110 = 4+2 = 6 → **0xB6**.\n\n**Method, decimal → binary:** repeatedly divide by 2 and write the remainders from the *bottom up*; or subtract the biggest power of two that fits (that is binary long division by 1!). 100 = 64 + 32 + 4 → 0b0110_0100.\n\n**Method, hex → decimal:** multiply each digit by its place value 16^k: 0x3E8 = 3·256 + 14·16 + 8 = 1000."),

(function () {

unit("u3", 3, "loop", "rs1", "The restoring loop in ARM", "Binary long division as ten A32 instructions: one register shifting the dividend out while the quotient shifts in, and the carry flag as the comparison result.", [
  lesson("u3l1", "Planning the registers", REF.arm, [
    LS("Three registers do all the work", "The AEABI convention for an unsigned divide-with-remainder is: **r0 = n** (dividend) and **r1 = d** (divisor) in; **r0 = quotient, r1 = remainder** out. Inside the loop we use:\n\n| Register | Holds |\n|---|---|\n| r0 | the dividend, shifting **out** of the top one bit per step, and the quotient bits shifting **in** at the bottom |\n| r1 | d, unchanged |\n| r2 | the partial remainder |\n| r3 | the step counter, 32 down to 0 |\n\nThe clever part is r0. Each step shifts r0 left by one. The bit that leaves the top is the next dividend bit (exactly the “bring down” of long division). That frees bit 0, where the new quotient bit goes. After 32 steps every dividend bit has left and r0 holds the 32 quotient bits, in the right order, with no separate quotient register and no extra shift.", term("step 0:  r0 = n31 n30 n29 ... n1 n0\nstep 1:  r0 = n30 n29 ... n1 n0 q31        (n31 went into rem)\nstep 2:  r0 = n29 ... n1 n0 q31 q30\n ...\nstep 32: r0 = q31 q30 ... q1 q0            (= the quotient)", "r0 as a combined shift register.")),
    LS("Which instruction does what", "In C the loop is:\n\n```\nrem = 0;\nfor (i = 0; i < 32; i++) {\n    rem = (rem << 1) | (n >> 31);   // bring down the next bit\n    n <<= 1;\n    if (rem >= d) { rem -= d; n |= 1; }  // quotient bit\n}\n```\n\nThe A32 version uses five instructions per step for that body, and two for the loop:\n\n1. `adds r0, r0, r0`: n + n = n << 1. Being an **add**, it sets the carry flag **C** to the bit that fell off the top: the next dividend bit.\n2. `adcs r2, r2, r2`: “add with carry”: r2 + r2 + C = 2·rem + bit. The bring-down in one instruction.\n3. `cmpcc r2, r1`: compare rem with d (only when C is clear, see the next lesson).\n4. `subcs r2, r2, r1`: subtract d if it fit.\n5. `orrcs r0, r0, #1`: set the quotient bit if it fit.\n6. `subs r3, r3, #1` and `bne 1b`: count down and loop.\n\nNot a single branch depends on the data: the only branch is the loop counter, which the predictor learns perfectly. That is the efficiency win of conditional execution.", X("    mov   r2, #0          @ rem = 0\n    mov   r3, #32         @ 32 bits to process\n1:  adds  r0, r0, r0      @ n <<= 1 ; C = bit that left the top\n    adcs  r2, r2, r2      @ rem = 2*rem + C ; C = rem overflowed 32 bits\n    cmpcc r2, r1          @ if no overflow: C = (rem >= d)\n    subcs r2, r2, r1      @ if C: rem -= d\n    orrcs r0, r0, #1      @ if C: quotient bit 1 into bit 0 of r0\n    subs  r3, r3, #1      @ count down, Z = (r3 == 0)\n    bne   1b\n    mov   r1, r2          @ r1 = remainder, r0 = quotient", [100, 7], "14 2", {"fmt": "u2"})),

  lesson("u3l2", "Flags, step by step", REF.arm, [
    LS("adds and adcs: the carry chain", "Recall the four condition flags in the CPSR, set by instructions ending in **s** (and by `cmp`, `tst`):\n\n- **N**: the result’s bit 31 (negative as signed).\n- **Z**: the result was zero.\n- **C**: for adds: a carry out of bit 31 (the unsigned result did not fit). For subtractions: **NOT borrow**, i.e. 1 when a ≥ b unsigned.\n- **V**: signed overflow.\n\n`adds r0, r0, r0` with r0 = 0x80000064 computes 0x1_000000C8: r0 = 0x000000C8, **C = 1**.\n\n`adcs r2, r2, r2` then computes r2 + r2 + C. With r2 = 5 and C = 1 that is 11. The `s` on adcs makes it set C again: **C = 1 only if 2·rem + bit needed 33 bits**. In a 32/32 division that never happens (after i steps rem < 2^i), but the 64-bit routines of unit 9 rely on it, so the loop is written to be correct either way."),
    LS("cmpcc, subcs, orrcs: one comparison, two uses", "`cmp r2, r1` computes r2 − r1 and only sets flags. After a subtraction, **C = 1 means r2 ≥ r1 (unsigned)**: no borrow was needed. So C is exactly the quotient bit.\n\nThe suffix **cc** (“carry clear”) on `cmpcc` means: *execute only if C = 0*. Why?\n\n- If **C = 0** after `adcs`, the remainder fitted in 32 bits, and we must compare it with d: `cmpcc` runs and sets C = (rem ≥ d).\n- If **C = 1** after `adcs`, the true remainder is ≥ 2^32 > d, so d certainly fits. `cmpcc` is skipped and C stays 1, which is the right answer.\n\nThen `subcs` and `orrcs` (“carry set”) execute only when C = 1. If the remainder had overflowed, the 32-bit subtraction `r2 − d` wraps modulo 2^32 and gives the exact true remainder, because the true answer is below d < 2^32.\n\nSo one flag, C, carries three meanings in a row: the dividend bit, the overflow, and the quotient bit."),
    LS("Walking through 100 / 7", "Here are the exact register values for the first iterations of 100 / 7 (and the last two). Since 100 has 25 leading zeros, the first 25 steps shift zeros into rem and never subtract; the work happens at the end.\n\nRead iteration 31: before it, rem = 4, and the next bit is 0. `adcs` gives 2·4 + 0 = 8, `cmpcc` finds 8 ≥ 7 so C = 1, `subcs` leaves 1, and `orrcs` puts a 1 into bit 0 of r0. Iteration 32 doubles 1 to 2, which is below 7: C = 0, no subtract, q bit 0. r0 = 0b1110 = 14 and rem = 2.", term("iter  C(adds)  r2 after adcs  C(adcs)  cmpcc→C  r2 after subcs   r0 (n bits | q bits)\n   1     0     0x00000000      0        0     0x00000000     00000000000000000000000011001000\n   2     0     0x00000000      0        0     0x00000000     00000000000000000000000110010000\n   3     0     0x00000000      0        0     0x00000000     00000000000000000000001100100000\n   4     0     0x00000000      0        0     0x00000000     00000000000000000000011001000000\n   5     0     0x00000000      0        0     0x00000000     00000000000000000000110010000000\n   6     0     0x00000000      0        0     0x00000000     00000000000000000001100100000000\n ...\n  31     0     0x00000008      0        1     0x00000001     00000000000000000000000000000111\n  32     0     0x00000002      0        0     0x00000002     00000000000000000000000000001110", "Every value computed by the exact instruction semantics of the loop above.")),
    PA("After **one** step of the loop with r0 = 0xC8000000 (200 shifted to the top byte) and r1 = 7, what are r0 and r1 (the remainder so far)?", "    mov   r2, #0          @ rem = 0\n    mov   r3, #1          @ stop early after 1 steps\n1:  adds  r0, r0, r0      @ n <<= 1 ; C = bit that left the top\n    adcs  r2, r2, r2      @ rem = 2*rem + C ; C = rem overflowed 32 bits\n    cmpcc r2, r1          @ if no overflow: C = (rem >= d)\n    subcs r2, r2, r1      @ if C: rem -= d\n    orrcs r0, r0, #1      @ if C: quotient bit 1 into bit 0 of r0\n    subs  r3, r3, #1      @ count down, Z = (r3 == 0)\n    bne   1b\n    mov   r1, r2          @ r1 = rem so far, r0 = shifted n | q bits", [3355443200, 7], "2415919104 1", ["2415919105 1", "1677721600 1", "2415919104 0"], "The top bit of 0xC8000000 is 1, so `adds` puts C = 1 and r0 becomes 0x90000000 = 2415919104. `adcs`: rem = 0 + 0 + 1 = 1, C = 0. `cmpcc` 1 vs 7: C = 0, so no subtract and no quotient bit. rem 1.", {"fmt": "u2", "pre": ""}),
    PNA("Run only **8** steps with r0 = 0xC8000000 and r1 = 7. The low byte of r0 now holds the quotient bits of 200 / 7. What is the remainder in r1?", "    mov   r2, #0          @ rem = 0\n    mov   r3, #8          @ stop early after 8 steps\n1:  adds  r0, r0, r0      @ n <<= 1 ; C = bit that left the top\n    adcs  r2, r2, r2      @ rem = 2*rem + C ; C = rem overflowed 32 bits\n    cmpcc r2, r1          @ if no overflow: C = (rem >= d)\n    subcs r2, r2, r1      @ if C: rem -= d\n    orrcs r0, r0, #1      @ if C: quotient bit 1 into bit 0 of r0\n    subs  r3, r3, #1      @ count down, Z = (r3 == 0)\n    bne   1b\n    mov   r1, r2          @ r1 = rem so far, r0 = shifted n | q bits\n    mov   r0, r1          @ return the remainder", [3355443200, 7], 4, "The top byte of r0 was 0xC8 = 200, so 8 steps divide 200 by 7: q = 28 (now in r0’s low byte), r = 4. The 24 zero bits below never got processed.", {"fmt": "u", "extra": {"hint": "Eight steps process eight dividend bits: exactly the top byte, which is 0xC8 = 200."}}),
    {"t": "mcq", "q": "When does `cmpcc r2, r1` **not** execute?", "opts": ["When adcs produced a carry: the doubled remainder needed 33 bits", "When r2 is zero", "When r1 is zero", "Never; cc only changes the flags it sets"], "a": 0, "why": "cc = carry clear. If C = 1 after adcs, the remainder is ≥ 2^32, which is certainly ≥ d, and C = 1 already means “fits”."},
    {"t": "tf", "q": "After `cmp r2, r1`, C = 1 means r2 ≥ r1 as unsigned numbers.", "a": true, "why": "ARM sets C to NOT borrow on subtraction. No borrow happens exactly when r2 ≥ r1 (unsigned)."},
    GEN.make("cmpCarry"),

    {"t": "fill", "q": "Fill in the condition codes of the restoring step.", "text": "adds r0, r0, r0\nadcs r2, r2, r2\ncmp___ r2, r1\nsub___ r2, r2, r1\norrcs r0, r0, #1", "blanks": ["cc", "cs"], "extra": ["eq", "ne", "mi"], "why": "Compare only if the doubled remainder did not overflow (cc); subtract and record a 1 when it fits (cs)."}
  ]),
  lesson("u3l3", "Edge cases and testing", REF.rtabi, [
    LS("Division by zero", "The C standard says division by zero is **undefined behaviour**: the program may do anything. Real systems differ:\n\n| Implementation | n / 0 |\n|---|---|\n| A7 hardware `udiv` | returns **0** (no trap, unless you enable it on ARMv7-R/M) |\n| libgcc `__aeabi_uidiv` | calls `__aeabi_idiv0`, which on Linux raises **SIGFPE** |\n| x86 `div` | traps (#DE), Linux sends SIGFPE |\n| divlib (this course) | quotient **0**, remainder **n**: exactly what `udiv` + `mls` give |\n\nWithout a check, the restoring loop computes q = 0xFFFFFFFF, r = n (every “does 0 fit?” is yes). We test `d == 0` once at the start: `cmp r1, #0` / `beq dl_div0u`, a branch that is almost never taken, so it is predicted and costs about one cycle.\n\nThe program `div0.c` (in tests/) printed this on qemu: hardware udiv 42/0 = 0; libgcc killed by signal 8 (SIGFPE); divlib q 0, r 42."),
    LS("The routine in divlib", "This is the library version: the same loop, wrapped as a function with the zero check, and its C test program. The output was compared against C’s `/` and `%` by the fuzz test (exhaustively for all n, d < 1024, plus 5 million random pairs and every edge value).", asm("dl_udiv_restoring:              @ r0 = n, r1 = d -> r0 = q, r1 = r\n        cmp     r1, #0\n        beq     dl_div0u\n        mov     r2, #0          @ partial remainder\n        mov     r3, #32         @ bits to go\n1:      adds    r0, r0, r0      @ n <<= 1, old bit 31 -> C ; q bits enter at bit 0\n        adcs    r2, r2, r2      @ rem = 2*rem + C ; C = bit that fell off (rem >= 2^32)\n        cmpcc   r2, r1          @ only if rem fitted: C = (rem >= d)\n        subcs   r2, r2, r1      @ fits: subtract (mod 2^32 is exact when rem overflowed)\n        orrcs   r0, r0, #1      @ and record a 1 quotient bit\n        subs    r3, r3, #1\n        bne     1b\n        mov     r1, r2\n        bx      lr", "From divlib/divlib.s, the course library: fuzz-tested against C’s / and % (174 million checks) and libgcc.")),

    PA("Without the zero check, what would the bare loop give for 42 / 0? (q r)", "    mov   r2, #0          @ rem = 0\n    mov   r3, #32         @ 32 bits to process\n1:  adds  r0, r0, r0      @ n <<= 1 ; C = bit that left the top\n    adcs  r2, r2, r2      @ rem = 2*rem + C ; C = rem overflowed 32 bits\n    cmpcc r2, r1          @ if no overflow: C = (rem >= d)\n    subcs r2, r2, r1      @ if C: rem -= d\n    orrcs r0, r0, #1      @ if C: quotient bit 1 into bit 0 of r0\n    subs  r3, r3, #1      @ count down, Z = (r3 == 0)\n    bne   1b\n    mov   r1, r2          @ r1 = remainder, r0 = quotient", [42, 0], "4294967295 42", ["0 42", "42 0", "0 0"], "With d = 0, `rem >= 0` is always true, so every quotient bit is 1 (q = 0xFFFFFFFF) and subtracting 0 leaves rem = n.", {"fmt": "u2", "pre": ""}),
    GEN.make("loopCount"),
    {"t": "mcq", "q": "Which test values matter most for a divide routine?", "opts": ["0, 1, d > n, n = d, powers of two, 2^31 and 2^32 − 1", "only random values", "only small values below 100", "only values that divide evenly"], "a": 0, "why": "Bugs live at boundaries: the top bit (signed/unsigned confusion, the 33rd bit), zero, one, and equality."},
    {"t": "match", "q": "Match each implementation to its behaviour for n / 0.", "pairs": [["A7 udiv", "returns 0"], ["libgcc on Linux", "SIGFPE"], ["divlib", "q = 0, r = n"], ["the bare loop", "q = 0xFFFFFFFF, r = n"]], "why": "Undefined in C, so each picked something; know which one your code gets."},

unit("u4", 4, "loop", "imm", "CLZ and early exits", "Skip the steps that cannot produce a 1, line the divisor up with one instruction, and return at once for the easy cases.", [
  lesson("u4l1", "Counting leading zeros", REF.bits, [
    LS("The CLZ instruction", "`clz Rd, Rm` (count leading zeros) writes the number of 0 bits above the highest 1 bit of Rm. It takes **one cycle** on every ARMv5 and later core, sets no flags, and gives 32 for Rm = 0.\n\n| Rm | binary (top bits) | clz |\n|---|---|---|\n| 0x80000000 | 1000… | 0 |\n| 0x00010000 | 0000 0000 0000 0001 0… | 15 |\n| 100 | 25 zeros, then 1100100 | 25 |\n| 7 | 29 zeros, then 111 | 29 |\n| 1 | 31 zeros, then 1 | 31 |\n| 0 | all zeros | 32 |\n\nUseful identities:\n\n- **bit length** of x (number of significant bits) = 32 − clz(x).\n- **floor(log2 x)** = 31 − clz(x), for x ≥ 1.\n- x is a power of two ⇔ x ≠ 0 and (x & (x − 1)) == 0; then log2 x = 31 − clz(x).\n\nMethod tip: to find clz in your head, write x in hex, find the first non-zero hex digit from the left, count 4 zeros per zero digit before it, then add the leading zeros inside that digit (1 → 3, 2–3 → 2, 4–7 → 1, 8–F → 0).", X("    clz   r0, r0", [100], "25", {"fmt": "u"})),

    {"t": "num", "q": "What is floor(log2(1000)), using 31 − clz(1000)?", "a": 9, "why": "1000 = 0x3E8: digits 0,0,0,0,0 (20 zeros), then 3 = 0011 adds 2: clz = 22. 31 − 22 = 9, and indeed 2^9 = 512 ≤ 1000 < 1024.", "hint": "Find clz(1000) with the hex method first."},
    {"t": "tf", "q": "`clz r0, r0` with r0 = 0 gives 32.", "a": true, "why": "ARM defines clz(0) = 32: all 32 bits are leading zeros. (Contrast with C’s __builtin_clz(0), which is undefined.)"}
  ]),
  lesson("u4l2", "Normalising the divisor", REF.div, [
    LS("Skip the steps that cannot fit", "The restoring loop always runs 32 steps. But quotient bit k can only be 1 if d·2^k ≤ n. If n has bit length L_n = 32 − clz(n) and d has bit length L_d, then d·2^k has bit length L_d + k, which must be ≤ L_n. So the highest possible quotient bit is\n\n> **k_max = L_n − L_d = clz(d) − clz(n)**\n\nIf that is negative, d > n and the answer is q = 0, r = n immediately. Otherwise we need only **k_max + 1** steps instead of 32.\n\nFor 100 / 7: clz(7) = 29, clz(100) = 25, k_max = 4. Five steps, not 32.\n\nTo run them we use the *subtract shifted copies* view of unit 2: shift d left by k_max (`lsl r1, r1, r3`), then for each step compare, subtract if it fits, and shift d right by one."),
    LS("The loop, instruction by instruction", "- `cmp r0, r1`: compare what is left of n with the shifted d. C = 1 when it fits (n ≥ d·2^k).\n- `subhs r0, r0, r1`: **hs** (“higher or same”) is another name for **cs**: subtract when it fits.\n- `adc r2, r2, r2`: q = q + q + C, i.e. shift q left and append the quotient bit. **No s**: it must not disturb the flags… although nothing after it needs them before the next `subs`, writing `adc` without s documents that.\n- `lsr r1, r1, #1`: the next smaller multiple d·2^(k−1).\n- `subs r3, r3, #1` / `bge 1b`: count k down; **bge** is “signed ≥” (N = V), so the loop runs while k ≥ 0 after the decrement: for k = 4, 3, 2, 1, 0, i.e. k_max + 1 = 5 times.\n\nHere n itself shrinks into the remainder (there is no separate rem register), and q is built in r2. Walk-through for 100 / 7, d·16 = 112:\n\n| pass | r1 = d·2^k | r0 before | fits? | r0 after | q |\n|---|---|---|---|---|---|\n| 1 | 112 | 100 | no | 100 | 0 |\n| 2 | 56 | 100 | yes | 44 | 1 |\n| 3 | 28 | 44 | yes | 16 | 11 |\n| 4 | 14 | 16 | yes | 2 | 111 |\n| 5 | 7 | 2 | no | 2 | 1110 |", X("    clz   r3, r1          @ leading zeros of d\n    clz   r12, r0         @ leading zeros of n\n    subs  r3, r3, r12     @ k = clz(d) - clz(n)\n    movlt r1, r0          @ d > n: q = 0, r = n\n    movlt r0, #0\n    blt   9f\n    lsl   r1, r1, r3      @ line d up under the top bit of n\n    mov   r2, #0          @ q = 0\n1:  cmp   r0, r1          @ C = (n >= d << k)\n    subhs r0, r0, r1      @ fits: subtract\n    adc   r2, r2, r2      @ q = 2q + C\n    lsr   r1, r1, #1      @ next smaller shift of d\n    subs  r3, r3, #1\n    bge   1b              @ k+1 passes\n    mov   r1, r0\n    mov   r0, r2\n9:", [100, 7], "14 2", {"fmt": "u2"})),
    LS("The library routine and its pass counts", "The program counts loop passes for several divisions: as few as 0 when d > n, at most 32 when dividing 2^32 − 1 by 1. The average over random 32-bit operands is small because random n and d usually have similar bit lengths, but dividing a large number by a small one (printing digits!) still needs almost all 32.", PR("clz", "clz/main.c: the pass count is k + 1 = clz(d) − clz(n) + 1.")),

(function () {

unit("u5", 5, "fast", "f7", "Conditional execution and unrolling", "Why ARM code predicates instead of branching, the barrel shifter in every compare, and the classic unrolled divide with a computed entry point.", [
  lesson("u5l1", "Predicate, don’t branch", REF.cost, [
    LS("Every A32 instruction has a condition", "In ARM (A32) state, the top 4 bits of every instruction are a **condition field**. The instruction executes only if the flags satisfy it; otherwise it does nothing (it still occupies an issue slot, about one cycle).\n\n| Suffix | Executes when | After `cmp a, b` that means |\n|---|---|---|\n| eq / ne | Z = 1 / Z = 0 | a = b / a ≠ b |\n| hs (= cs) / lo (= cc) | C = 1 / C = 0 | a ≥ b / a < b, unsigned |\n| hi / ls | C = 1 and Z = 0 / otherwise | a > b / a ≤ b, unsigned |\n| ge / lt | N = V / N ≠ V | a ≥ b / a < b, signed |\n| gt / le | Z = 0 and N = V / otherwise | a > b / a ≤ b, signed |\n| mi / pl | N = 1 / N = 0 | result negative / not |\n\nWhy it matters for division: the “does d fit?” decision is **random-looking** (it depends on the data bits), so a branch on it is mispredicted about half the time. A mispredict flushes the pipeline: about **8 cycles** on A7/A9, **13** on A8. `subhs` costs 1 cycle whether or not it executes.\n\n**Rule of thumb:** predicate when the skipped work is up to about 3–4 instructions and the condition is unpredictable; branch when the skipped work is long or the branch is almost always the same way (like `beq dl_div0u`)."),
    LS("Thumb-2: the IT block", "Thumb-2 (the 16/32-bit instruction set most compilers use by default) has no condition field in most instructions. Instead `it` (“if-then”) makes up to four following instructions conditional:\n\n```\ncmp   r0, r1\nite   hs          @ if-then-else: next is hs, the one after is lo\nsubhs r0, r0, r1\naddlo r2, r2, #1\n```\n\n`itt`, `ite`, `ittt`, `itete` and so on: each extra `t` or `e` covers one more instruction. ARMv8 deprecated IT blocks with more than one instruction (or with 32-bit instructions) for performance, so modern compilers prefer one-instruction blocks.\n\nEverything in this course is written in A32 (ARM state), where every instruction can be conditional and the routines are shortest. Our functions are marked `.type name, %function` so a Thumb caller (gcc’s default) switches state correctly with `blx`."),
    LS("A branch-free step", "One step of “subtract if it fits, record a bit” with no branch at all. Below: n = 100, d·8 = 56.", X("    lsl   r1, r1, #3      @ d << 3 = 56\n    mov   r2, #0          @ q = 0\n    cmp   r0, r1          @ C = (100 >= 56) = 1\n    subhs r0, r0, r1      @ executes: r0 = 44\n    adc   r2, r2, r2      @ q = 0 + 0 + C = 1\n    mov   r1, r0          @ return r0 = q bit, r1 = what is left\n    mov   r0, r2", [100, 7], "1 44", {"fmt": "u2"})),
    {"t": "mcq", "q": "Why is `subhs` better than `blo skip / sub / skip:` inside a divide loop?", "opts": ["The fits/does-not-fit outcome is unpredictable, and each mispredicted branch costs about 8 cycles", "Branches cannot follow cmp", "subhs sets more flags", "sub cannot subtract registers"], "a": 0, "why": "Data-dependent branches are mispredicted roughly half the time; a predicated instruction costs one slot either way."},
    {"t": "match", "q": "Match the condition to its meaning after `cmp r0, r1`.", "pairs": [["hs", "r0 ≥ r1 unsigned"], ["lo", "r0 < r1 unsigned"], ["ge", "r0 ≥ r1 signed"], ["hi", "r0 > r1 unsigned"]], "why": "Unsigned conditions use C (and Z); signed ones use N and V."},
    GEN.make("cmpCarry"),
    {"t": "tf", "q": "A conditional instruction whose condition fails takes no time at all.", "a": false, "why": "It still occupies a pipeline slot (about one cycle on in-order cores). That is why predication is only better for short sequences."},
    {"t": "mcq", "q": "In Thumb-2, how do you make `subhs r0, r0, r1` conditional?", "opts": ["Put `it hs` before it", "Thumb-2 instructions all have a condition field", "Use `subs` instead", "It is impossible in Thumb"], "a": 0, "why": "The IT instruction supplies the condition for up to four following instructions."}
  ]),
  lesson("u5l2", "The barrel shifter in every compare", REF.arm, [
    LS("Operand 2 can be shifted for free", "The second operand of an A32 data-processing instruction can be a register **shifted by a constant**, at no extra cost:\n\n- `cmp r0, r1, lsl #5` compares r0 with r1·32.\n- `subhs r0, r0, r1, lsl #5` subtracts r1·32.\n- `add r3, r2, r2, lsl #2` computes 5·r2 (used to rebuild remainders: n − 10q = n − (5q)·2).\n\nWith this, the CLZ loop’s `lsr r1, r1, #1` disappears: instead of shifting d every step, each step uses a **different constant shift**: step k does `cmp r0, r1, lsl #k`. But a constant shift needs the step to be written out separately for each k. That is **unrolling**.\n\nOne step is then just three instructions:\n\n```\ncmp   r0, r1, lsl #k      @ C = (n >= d << k)\nsubhs r0, r0, r1, lsl #k  @ subtract if it fits\nadc   r2, r2, r2          @ q = 2q + C\n```\n\nA careful reader will ask: what if `d << k` overflows 32 bits? The routine only runs steps k ≤ clz(d) − clz(n) ≤ clz(d), so d << k always fits."),
