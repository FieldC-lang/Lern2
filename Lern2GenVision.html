qrt(1 - ab[t])[:, None] * e\n    loss = ((eps_net(xt, t) - T(e)) ** 2).mean()\n    loss.backward(); opt.step()\n    if step % 1000 == 0: print(\"step %4d  L_simple MSE %.4f\" % (step, float(loss.data)))\n# ancestral sample\nx = r.normal(size=(1500, 2))\nfor t in reversed(range(Tn)):\n    eh = eps_net(x, np.full(len(x), t)).data\n    z = r.normal(size=x.shape) if t else 0\n    x = (x - betas[t] / np.sqrt(1 - ab[t]) * eh) / np.sqrt(1 - betas[t]) + np.sqrt(betas[t]) * z\nang = (np.round(np.arctan2(x[:, 1], x[:, 0]) / (np.pi / 4)) % 8).astype(int)\nprint(\"samples radius mean %.2f (data≈2.00)  per-blob share %s\" % (np.linalg.norm(x, axis=1).mean(), np.round(np.bincount(ang, minlength=8) / len(x), 3)))\nprint(\"all 8 modes hit:\", bool((np.bincount(ang, minlength=8) > 50).all()), \" time %.1fs\" % (time.time() - t0))", "out": "step    0  L_simple MSE 0.9360\nstep 1000  L_simple MSE 0.2821\nstep 2000  L_simple MSE 0.3908\nstep 3000  L_simple MSE 0.2771\nsamples radius mean 2.00 (data≈2.00)  per-blob share [0.117 0.109 0.115 0.129 0.14  0.125 0.149 0.117]\nall 8 modes hit: True  time 5.4s"}, "e_schedule": {"lang": "py", "file": "e_schedule.py", "src": "# Noise schedules compared: SNR, posterior variance, and why cosine helps high resolution.\nimport numpy as np\nfrom gv import linear_beta_schedule, cosine_alpha_bar\nT = 1000\nab_lin = np.cumprod(1 - linear_beta_schedule(T, 1e-4, 0.02))\nab_cos = cosine_alpha_bar(T)\ndef snr(ab): return ab / (1 - ab)\nfor name, ab in (\"linear\", ab_lin), (\"cosine\", ab_cos):\n    print(\"%s: ᾱ_100=%.4f ᾱ_500=%.4f ᾱ_900=%.6f  SNR_100=%.2f SNR_500=%.3f\" % (\n        name, ab[99], ab[499], ab[899], snr(ab[99]), snr(ab[499])))\n# fraction of training signal below SNR=1e-2 (very noisy — hard to learn structure)\nfor name, ab in (\"linear\", ab_lin), (\"cosine\", ab_cos):\n    frac = (snr(ab) < 1e-2).mean()\n    print(\"%s fraction of t with SNR<0.01: %.3f\" % (name, frac))\nprint(\"cosine keeps more mid-SNR steps, which is why it became the default for high-res DDPMs\")", "out": "linear: ᾱ_100=0.8970 ᾱ_500=0.0786 ᾱ_900=0.000275  SNR_100=8.71 SNR_500=0.085\ncosine: ᾱ_100=0.9721 ᾱ_500=0.4938 ᾱ_900=0.024092  SNR_100=34.83 SNR_500=0.976\nlinear fraction of t with SNR<0.01: 0.326\ncosine fraction of t with SNR<0.01: 0.064\ncosine keeps more mid-SNR steps, which is why it became the default for high-res DDPMs"}, "e_unet": {"lang": "py", "file": "e_unet.py", "src": "# Tiny 1-D U-Net: downsample → bottleneck with time embedding → upsample with skips.\nimport numpy as np, time\nfrom ag import T, param, Adam\nfrom gv import sinusoidal_time_embed, linear_beta_schedule\nr = np.random.default_rng(16)\n# data: 16-D vectors that are smooth low-frequency sines (stand-in for a 4x4 grey patch)\ndef data(n):\n    t = np.linspace(0, 2 * np.pi, 16)\n    amp = r.uniform(0.5, 1.5, (n, 1)); phase = r.uniform(0, 2 * np.pi, (n, 1)); freq = r.choice([1, 2, 3], (n, 1))\n    return amp * np.sin(freq * t + phase)\nTn = 40; betas = linear_beta_schedule(Tn, 1e-4, 0.1); ab = np.cumprod(1 - betas)\n# layers: 16→8→4→8→16 with skips\nW_d1 = param(r, 16 + 8, 16); b_d1 = T(np.zeros(16))   # take x||temb_small\nW_d2 = param(r, 16, 8); b_d2 = T(np.zeros(8))\nW_bot = param(r, 8 + 8, 8); b_bot = T(np.zeros(8))\nW_u1 = param(r, 8 + 8, 16); b_u1 = T(np.zeros(16))    # bot||skip\nW_u2 = param(r, 16 + 16, 16); b_u2 = T(np.zeros(16))\nW_out = param(r, 16, 16); b_out = T(np.zeros(16))\nps = [W_d1, b_d1, W_d2, b_d2, W_bot, b_bot, W_u1, b_u1, W_u2, b_u2, W_out, b_out]\nopt = Adam(ps, lr=2e-3)\ndef unet(x, t):\n    te = T(sinusoidal_time_embed(t, 8))\n    h1 = (T(np.c_[x, te.data]) @ W_d1 + b_d1).gelu()      # (n,16)\n    h2 = (h1 @ W_d2 + b_d2).gelu()                         # (n,8)\n    hb = (T(np.c_[h2.data, te.data]) @ W_bot + b_bot).gelu()\n    # skips via concat on data then continue — keep graph through matmuls of learnable weights\n    u1 = (T(np.c_[hb.data, h2.data]) @ W_u1 + b_u1).gelu()\n    u2 = (T(np.c_[u1.data, h1.data]) @ W_u2 + b_u2).gelu()\n    return u2 @ W_out + b_out\n# Proper differentiable skips:\ndef unet2(x, t):\n    te = T(sinusoidal_time_embed(t, 8))\n    # rebuild with cat from ag\n    from ag import cat\n    h1 = (cat([T(x), te], -1) @ W_d1 + b_d1).gelu()\n    h2 = (h1 @ W_d2 + b_d2).gelu()\n    hb = (cat([h2, te], -1) @ W_bot + b_bot).gelu()\n    u1 = (cat([hb, h2], -1) @ W_u1 + b_u1).gelu()\n    u2 = (cat([u1, h1], -1) @ W_u2 + b_u2).gelu()\n    return u2 @ W_out + b_out\nt0 = time.time()\nfor step in range(2001):\n    x0 = data(64); t = r.integers(0, Tn, 64); e = r.normal(size=x0.shape)\n    xt = np.sqrt(ab[t])[:, None] * x0 + np.sqrt(1 - ab[t])[:, None] * e\n    loss = ((unet2(xt, t) - T(e)) ** 2).mean()\n    loss.backward(); opt.step()\n    if step % 500 == 0: print(\"step %4d  noise MSE %.4f\" % (step, float(loss.data)))\n# sample\nx = r.normal(size=(8, 16))\nfor t in reversed(range(Tn)):\n    eh = unet2(x, np.full(8, t)).data\n    z = r.normal(size=x.shape) if t else 0\n    x = (x - betas[t] / np.sqrt(1 - ab[t]) * eh) / np.sqrt(1 - betas[t]) + np.sqrt(betas[t]) * z\nprint(\"sample row0 (should look vaguely sinusoidal):\", np.round(x[0], 2))\nprint(\"sample stds\", np.round(x.std(1), 2), \"time %.1fs\" % (time.time() - t0))", "out": "step    0  noise MSE 1.1144\nstep  500  noise MSE 0.4360\nstep 1000  noise MSE 0.3939\nstep 1500  noise MSE 0.3863\nstep 2000  noise MSE 0.3323\nsample row0 (should look vaguely sinusoidal): [-0.13 -0.48 -0.48 -0.34  0.19 -0.2   0.28  1.73  2.23  0.92 -0.68 -1.83\n -1.02  0.33  0.86  0.37]\nsample stds [0.98 1.73 0.71 0.68 1.01 1.17 3.14 1.34] time 1.1s"}, "f_cfg_text": {"lang": "py", "file": "f_cfg_text.py", "src": "# Text CFG training trick: drop the text embedding with probability p_uncond so one net does both.\nimport numpy as np, time\nfrom ag import T, param, Adam\nfrom gv import linear_beta_schedule, sinusoidal_time_embed, cfg_eps\nr = np.random.default_rng(22)\n# 2-D class-conditional blobs; class embedding stands in for text\nclasses = 3; centres = np.array([[2, 0], [-1, 1.7], [-1, -1.7]], float)\ndef data(n):\n    y = r.integers(0, classes, n)\n    return centres[y] + r.normal(0, 0.2, (n, 2)), y\nTn = 60; betas = linear_beta_schedule(Tn, 1e-4, 0.12); ab = np.cumprod(1 - betas)\nE = param(r, classes, 8)          # class / text embedding table; row will be replaced by null\nnull = T(np.zeros(8))\nW1 = param(r, 2 + 8 + 16, 64); b1 = T(np.zeros(64)); W2 = param(r, 64, 2); b2 = T(np.zeros(2))\nps = [E, W1, b1, W2, b2]; opt = Adam(ps, lr=2e-3)\np_uncond = 0.2\ndef eps_net(x, t, c_emb):\n    h = (T(np.c_[x, c_emb, sinusoidal_time_embed(t, 16)]) @ W1 + b1).gelu()\n    return h @ W2 + b2\nt0 = time.time()\nfor step in range(2501):\n    x0, y = data(128); t = r.integers(0, Tn, 128); e = r.normal(size=x0.shape)\n    xt = np.sqrt(ab[t])[:, None] * x0 + np.sqrt(1 - ab[t])[:, None] * e\n    c = E[y].data.copy()\n    drop = r.random(len(y)) < p_uncond\n    c[drop] = 0.0\n    loss = ((eps_net(xt, t, c) - T(e)) ** 2).mean(); loss.backward(); opt.step()\n    if step % 1250 == 0: print(\"step %4d  MSE %.4f\" % (step, float(loss.data)))\n\ndef sample(cls, w, n=500):\n    x = r.normal(size=(n, 2))\n    c = np.broadcast_to(E.data[cls], (n, 8)).copy()\n    c0 = np.zeros_like(c)\n    for t in reversed(range(Tn)):\n        tt = np.full(n, t)\n        ec = eps_net(x, tt, c).data; eu = eps_net(x, tt, c0).data\n        e = cfg_eps(eu, ec, w)\n        z = r.normal(size=x.shape) if t else 0\n        x = (x - betas[t] / np.sqrt(1 - ab[t]) * e) / np.sqrt(1 - betas[t]) + np.sqrt(betas[t]) * z\n    return x\nfor w in (1.0, 2.5, 5.0):\n    s = sample(0, w)\n    print(\"class0 w=%.1f  mean %s  dist to centre %.3f\" % (w, np.round(s.mean(0), 2), np.linalg.norm(s.mean(0) - centres[0])))\nprint(\"time %.1fs\" % (time.time() - t0))", "out": "step    0  MSE 0.9822\nstep 1250  MSE 0.2103\nstep 2500  MSE 0.2099\nclass0 w=1.0  mean [ 2.01 -0.02]  dist to centre 0.023\nclass0 w=2.5  mean [2.1 0. ]  dist to centre 0.104\nclass0 w=5.0  mean [2.18 0.  ]  dist to centre 0.179\ntime 2.3s"}, "f_clip": {"lang": "py", "file": "f_clip.py", "src": "# CLIP-style contrastive image–text training from scratch on a 4-class toy.\nimport numpy as np, time\nfrom ag import T, param, Adam\nfrom gv import make_shape_image, rgb_to_grey, clip_similarity, softmax\nr = np.random.default_rng(20)\nCLASSES = [\"circle\", \"stripe\", \"checker\", \"gradient\"]\n# tiny vocab: one token per class name + \"a\" + \"photo\" + \"of\"\nVOCAB = {\"a\": 0, \"photo\": 1, \"of\": 2, \"circle\": 3, \"stripe\": 4, \"checker\": 5, \"gradient\": 6}\ndef make_pair(i):\n    kind = CLASSES[i % 4]\n    img = rgb_to_grey(make_shape_image(kind, 8, np.random.default_rng(4000 + i))).ravel()\n    ids = np.array([0, 1, 2, VOCAB[kind]])  # \"a photo of <kind>\"\n    return img, ids, i % 4\nDi, Dt, D = 64, 4, 16\n# image encoder: linear\nWi = param(r, Di, D); bi = T(np.zeros(D))\n# text encoder: embed + mean pool + linear\nEt = param(r, len(VOCAB), 12); Wt = param(r, 12, D); bt = T(np.zeros(D))\nlogit_scale = T(np.array(np.log(10.0)))   # learnable temperature\nps = [Wi, bi, Et, Wt, bt, logit_scale]\nopt = Adam(ps, lr=0.05)\ndef encode_batch(n):\n    imgs, toks, labels = [], [], []\n    for i in range(n):\n        im, ids, lab = make_pair(r.integers(0, 200))\n        imgs.append(im); toks.append(ids); labels.append(lab)\n    return np.stack(imgs), np.stack(toks), np.array(labels)\nt0 = time.time()\nfor step in range(800):\n    imgs, toks, _ = encode_batch(32)\n    Ie = (T(imgs) @ Wi + bi)                     # (n,D)\n    Te = (Et[toks].mean(1) @ Wt + bt)            # (n,D)\n    # L2 normalise\n    Ie = Ie / ((Ie * Ie).sum(1, keepdims=True) + 1e-8) ** 0.5\n    Te = Te / ((Te * Te).sum(1, keepdims=True) + 1e-8) ** 0.5\n    logits = Ie @ Te.Tt * logit_scale.exp()      # (n,n)\n    # symmetric CE: labels = arange\n    y = np.arange(len(imgs))\n    from ag import cross_entropy, log_softmax\n    loss = (cross_entropy(logits, y) + cross_entropy(logits.Tt, y)) * 0.5\n    loss.backward(); opt.step()\n    if step % 200 == 0: print(\"step %3d  contrastive loss %.3f  scale %.2f\" % (step, float(loss.data), float(logit_scale.exp().data)))\n# retrieval check\nimgs, toks, labels = encode_batch(40)\nIe = (imgs @ Wi.data + bi.data); Ie /= np.linalg.norm(Ie, axis=1, keepdims=True) + 1e-8\nTe = Et.data[toks].mean(1) @ Wt.data + bt.data; Te /= np.linalg.norm(Te, axis=1, keepdims=True) + 1e-8\nS = clip_similarity(Ie, Te)\n# for each image, is the matched text the argmax?\nacc = (S.argmax(1) == np.arange(40)).mean()\nprint(\"image→text batch accuracy %.2f (chance 1/40=0.025)  time %.1fs\" % (acc, time.time() - t0))\n# class clustering: mean similarity of matching class texts\nprint(\"diag mean sim %.3f  off-diag mean sim %.3f\" % (np.diag(S).mean(), (S.sum() - np.diag(S).sum()) / (40 * 39)))", "out": "step   0  contrastive loss 3.946  scale 9.51\nstep 200  contrastive loss 2.173  scale 12.14\nstep 400  contrastive loss 2.152  scale 12.43\nstep 600  contrastive loss 2.101  scale 12.66\nimage→text batch accuracy 0.10 (chance 1/40=0.025)  time 1.5s\ndiag mean sim 0.881  off-diag mean sim 0.012"}, "f_cond": {"lang": "py", "file": "f_cond.py", "src": "# Three conditioning mechanisms on a toy denoiser: concat, FiLM, cross-attention.\nimport numpy as np\nfrom gv import softmax, rng, sinusoidal_time_embed\nr = rng(21)\nn, Dx, Dc, D = 6, 8, 4, 8\nx = r.normal(size=(n, Dx))          # noisy latent\nc = r.normal(size=(n, Dc))          # text embedding (pooled)\nt = r.integers(0, 50, n); te = sinusoidal_time_embed(t, 8)\n\n# 1) Concatenation: [x, c, te] → MLP\nW = r.normal(size=(Dx + Dc + 8, Dx)) * 0.2\ny_cat = np.c_[x, c, te] @ W\nprint(\"concat out shape\", y_cat.shape, \"||y||\", round(float(np.linalg.norm(y_cat)), 3))\n\n# 2) FiLM: predict (γ, β) from c and do γ ⊙ h + β\nh = x + te[:, :Dx] if Dx <= 8 else x\nW_film = r.normal(size=(Dc, 2 * Dx)) * 0.2\ngb = c @ W_film; gamma, beta = gb[:, :Dx], gb[:, Dx:]\ny_film = gamma * h + beta\nprint(\"FiLM γ mean %.3f β mean %.3f ||y|| %.3f\" % (gamma.mean(), beta.mean(), np.linalg.norm(y_film)))\n\n# 3) Cross-attention: Q from x, K/V from a sequence of text tokens\nL = 5; tokens = r.normal(size=(n, L, Dc))\nWq = r.normal(size=(Dx, D)) * 0.2; Wk = r.normal(size=(Dc, D)) * 0.2; Wv = r.normal(size=(Dc, D)) * 0.2\nQ = x @ Wq                                  # (n,D)\nK = tokens @ Wk                             # (n,L,D)\nV = tokens @ Wv\nscores = np.einsum(\"bd,bld->bl\", Q, K) / np.sqrt(D)\nw = softmax(scores, axis=1)\ny_xa = np.einsum(\"bl,bld->bd\", w, V)\nprint(\"cross-attn weights row0\", np.round(w[0], 3).tolist(), \"||y||\", round(float(np.linalg.norm(y_xa)), 3))\nprint(\"Stable Diffusion uses cross-attention; FiLM is common in adapters; concat is the simplest baseline\")", "out": "concat out shape (6, 8) ||y|| 4.788\nFiLM γ mean 0.013 β mean -0.006 ||y|| 3.702\ncross-attn weights row0 [0.263, 0.152, 0.218, 0.181, 0.186] ||y|| 1.476\nStable Diffusion uses cross-attention; FiLM is common in adapters; concat is the simplest baseline"}, "f_prompt": {"lang": "py", "file": "f_prompt.py", "src": "# Prompt processing: tokenisation, truncation, weighting heuristics, and empty-prompt null.\nfrom gv import bpe_train, apply_bpe\ncorpus = (\"a photorealistic portrait of a woman soft light \" * 3 +\n          \"a wide shot of mountains at golden hour \" * 2 +\n          \"product photo of a watch on marble\")\nmerges, _ = bpe_train(corpus, n_merges=40)\nprompt = \"a photorealistic portrait of a woman\"\ntoks = apply_bpe(prompt, merges)\nprint(\"prompt tokens (%d):\" % len(toks), toks)\n# CLIP text towers often cap at 77 tokens; show truncation\nlong = apply_bpe((\"a detailed photo of \" + \"very \" * 40 + \"red cube\"), merges)\nprint(\"long prompt tokens\", len(long), \"truncated to 16:\", long[:16])\n# attention weighting toy: '(word:1.3)' → scale that token's embedding\nemb = {t: i + 1.0 for i, t in enumerate(set(toks))}\nweights = {t: 1.0 for t in toks}; weights[toks[-1]] = 1.3\nprint(\"weighted emb for last token\", toks[-1], round(emb[toks[-1]] * weights[toks[-1]], 2), \"(unweighted\", emb[toks[-1]], \")\")\nprint(\"null / empty prompt becomes a learned embedding used as the CFG unconditional branch\")", "out": "prompt tokens (2): ['a photorealistic portrait of a woma', 'n']\nlong prompt tokens 220 truncated to 16: ['a ', 'de', 't', 'ai', 'l', 'e', 'd', ' ', 'phot', 'o', ' ', 'of ', 'v', 'e', 'r', 'y']\nweighted emb for last token n 1.3 (unweighted 1.0 )\nnull / empty prompt becomes a learned embedding used as the CFG unconditional branch"}, "g_control": {"lang": "py", "file": "g_control.py", "src": "# ControlNet / adapter miniature: a side network adds a residual from a spatial condition (edge map).\nimport numpy as np\nfrom gv import make_shape_image, rgb_to_grey, rng\nr = rng(25)\nimg = rgb_to_grey(make_shape_image(\"circle\", 16, r))\n# condition: simple threshold edge\ngy, gx = np.gradient(img); edge = np.sqrt(gx * gx + gy * gy); edge = edge / (edge.max() + 1e-8)\n# frozen \"U-Net block\" residual and a trainable zero-init ControlNet residual\nW_main = r.normal(size=(16, 16)) * 0.1\n# ControlNet: encode edge → feature, then zero-conv (starts at 0)\nW_enc = r.normal(size=(16, 16)) * 0.2\nW_zero = np.zeros((16, 16))            # zero convolution at init\ndef block(x, cond, scale=1.0):\n    h = np.tanh(x @ W_main)\n    c = np.tanh(cond @ W_enc) @ W_zero * scale\n    return h + c\nx = img.copy()\ny0 = block(x, edge, scale=1.0)\nprint(\"at init, ControlNet residual is exactly 0: max|y - tanh(xW)| =\", float(np.max(np.abs(y0 - np.tanh(x @ W_main)))))\n# after \"training\", W_zero has grown\nW_zero[:] = r.normal(size=(16, 16)) * 0.3\ny1 = block(x, edge, scale=1.0)\ny_off = block(x, edge, scale=0.0)\nprint(\"after training, enabling control changes the block by RMS\", round(float(np.sqrt(np.mean((y1 - y_off) ** 2))), 4))\nprint(\"zero-init is why you can bolt ControlNet onto a frozen SD U-Net without wrecking it at step 0\")", "out": "at init, ControlNet residual is exactly 0: max|y - tanh(xW)| = 0.0\nafter training, enabling control changes the block by RMS 0.2708\nzero-init is why you can bolt ControlNet onto a frozen SD U-Net without wrecking it at step 0"}, "g_edit": {"lang": "py", "file": "g_edit.py", "src": "# InstructPix2Pix-style idea: condition on image AND text instruction; CFG over both.\nimport numpy as np\nfrom gv import cfg_eps, rng\nr = rng(26)\n# pretend three ε predictions for the same xt: (no image, no text), (image, no text), (image, text)\n# IP2P uses a two-dimensional guidance: push toward image fidelity and toward instruction\nn, D = 5, 4\ne_uncond = r.normal(size=(n, D))\ne_img = e_uncond + r.normal(size=(n, D)) * 0.4          # image-only\ne_both = e_img + np.array([[0.5, -0.2, 0.1, 0.0]])     # image+instruction\ns_img, s_txt = 1.5, 7.5\n# IP2P composition (Brooks et al.): e = e_u + s_img(e_i - e_u) + s_txt(e_b - e_i)\ne = e_uncond + s_img * (e_img - e_uncond) + s_txt * (e_both - e_img)\nprint(\"||e_uncond||\", round(float(np.linalg.norm(e_uncond)), 3))\nprint(\"||e_img||   \", round(float(np.linalg.norm(e_img)), 3))\nprint(\"||e_both||  \", round(float(np.linalg.norm(e_both)), 3))\nprint(\"||e_guided||\", round(float(np.linalg.norm(e)), 3))\nprint(\"delta toward instruction\", np.round((e - e_img).mean(0), 3).tolist())\nprint(\"raise s_txt to obey the edit; raise s_img to keep the input photograph\")", "out": "||e_uncond|| 5.646\n||e_img||    5.906\n||e_both||   6.33\n||e_guided|| 12.483\ndelta toward instruction [3.848, -1.434, 0.827, -0.042]\nraise s_txt to obey the edit; raise s_img to keep the input photograph"}, "g_img2img": {"lang": "py", "file": "g_img2img.py", "src": "# Image-to-image: start reverse process from a partially noised encoding of an input image.\nimport numpy as np\nfrom gv import make_shape_image, rgb_to_grey, linear_beta_schedule, q_sample, mse, rng\nr = rng(23)\nx0 = rgb_to_grey(make_shape_image(\"circle\", 16, r)).ravel()\nx_alt = rgb_to_grey(make_shape_image(\"stripe\", 16, r)).ravel()\nTn = 100; betas = linear_beta_schedule(Tn, 1e-4, 0.02); ab = np.cumprod(1 - betas)\n# strength s ∈ [0,1] → start timestep t_start = floor(s * T)\nfor s in (0.0, 0.3, 0.6, 0.9, 1.0):\n    t0 = min(int(s * (Tn - 1)), Tn - 1)\n    xt, _ = q_sample(x0, t0, ab, r=r)\n    # Ideal img2img with a perfect denoiser would recover x0; measure how much signal remains\n    signal = float(np.sqrt(ab[t0]))\n    print(\"strength %.1f  t=%2d  remaining signal scale %.3f  MSE(xt,x0)=%.3f  MSE(xt,other)=%.3f\" % (\n        s, t0, signal, mse(xt, x0), mse(xt, x_alt)))\nprint(\"low strength ≈ light edit (structure kept); high strength ≈ nearly fresh sample\")\nprint(\"Stable Diffusion img2img: encode image to latent, noise to t_start, denoise with the text prompt\")", "out": "strength 0.0  t= 0  remaining signal scale 1.000  MSE(xt,x0)=0.000  MSE(xt,other)=0.147\nstrength 0.3  t=29  remaining signal scale 0.956  MSE(xt,x0)=0.088  MSE(xt,other)=0.245\nstrength 0.6  t=59  remaining signal scale 0.834  MSE(xt,x0)=0.304  MSE(xt,other)=0.440\nstrength 0.9  t=89  remaining signal scale 0.664  MSE(xt,x0)=0.582  MSE(xt,other)=0.717\nstrength 1.0  t=99  remaining signal scale 0.603  MSE(xt,x0)=0.602  MSE(xt,other)=0.777\nlow strength ≈ light edit (structure kept); high strength ≈ nearly fresh sample\nStable Diffusion img2img: encode image to latent, noise to t_start, denoise with the text prompt"}, "g_inpaint": {"lang": "py", "file": "g_inpaint.py", "src": "# Inpainting: replace masked region by denoising while always pasting the known pixels back.\nimport numpy as np\nfrom gv import make_shape_image, rgb_to_grey, linear_beta_schedule, q_sample, mse, rng\nr = rng(24)\nx0 = rgb_to_grey(make_shape_image(\"circle\", 16, r))\nmask = np.zeros((16, 16)); mask[5:11, 5:11] = 1.0          # hole in the centre\nknown = 1 - mask\nTn = 80; betas = linear_beta_schedule(Tn, 1e-4, 0.05); ab = np.cumprod(1 - betas)\n# Simulate the RePaint / SD-inpaint constraint: at each step, resample known pixels from q(x_t|x0)\nx = r.normal(size=x0.shape)\nfor t in reversed(range(Tn)):\n    # pretend denoiser predicts x0 as the original (oracle) — isolates the masking maths\n    x0hat = x0\n    # DDPM mean toward x0hat\n    # simplified: jump to posterior mean-ish then re-noise\n    xt_known, _ = q_sample(x0.ravel(), t, ab, r=r)\n    xt_known = xt_known.reshape(x0.shape)\n    # unknown region keeps current x; known region overwritten\n    x = mask * x + known * xt_known\n    # one denoising-ish step on the whole canvas toward x0hat\n    if t > 0:\n        eps = (x - np.sqrt(ab[t]) * x0hat) / np.sqrt(1 - ab[t])\n        x = np.sqrt(ab[t - 1]) * x0hat + np.sqrt(1 - ab[t - 1]) * eps * 0.3 + r.normal(size=x.shape) * 0.1 * np.sqrt(betas[t])\n    else:\n        x = x0hat\n# After oracle inpaint, known pixels match and hole is filled\nprint(\"known-region MSE\", round(mse(x * known, x0 * known), 6))\nprint(\"hole-region MSE \", round(mse(x * mask, x0 * mask), 6))\nprint(\"hole mean (filled)\", round(float((x * mask).sum() / mask.sum()), 4), \"true\", round(float((x0 * mask).sum() / mask.sum()), 4))\nprint(\"real inpainters use a conditioned U-Net; the paste-known-pixels trick is the same idea\")", "out": "known-region MSE 0.0\nhole-region MSE  0.0\nhole mean (filled) 0.3259 true 0.3259\nreal inpainters use a conditioned U-Net; the paste-known-pixels trick is the same idea"}, "h_faces": {"lang": "py", "file": "h_faces.py", "src": "# Faces and hands as failure modes: frequency of rare poses and the symmetry prior.\nimport numpy as np\nr = np.random.default_rng(27)\n# Toy: \"face\" = 5 landmarks (eyes, nose, mouth corners) with tight priors; \"hand\" = 5 fingertips with loose priors\nface_std = np.array([0.02, 0.02, 0.03, 0.025, 0.025])\nhand_std = np.array([0.15, 0.18, 0.2, 0.17, 0.19])  # much broader — many more valid configs\n# Probability a random Gaussian sample lands inside 1σ of the mean config under each prior (proxy for \"looks right\")\ndef mass_within_1sig(std, n=20000):\n    x = r.normal(0, std, size=(n, len(std)))\n    return (np.all(np.abs(x) < std, axis=1)).mean()\nprint(\"P(face sample looks typical)\", round(float(mass_within_1sig(face_std)), 4))\nprint(\"P(hand sample looks typical)\", round(float(mass_within_1sig(hand_std)), 4))\n# Symmetry prior helps faces: left-right flip consistency\nface = np.array([0.3, 0.7, 0.5, 0.35, 0.65])   # eyeL, eyeR, nose, mouthL, mouthR normalised x\nflip = 1 - face[[1, 0, 2, 4, 3]]\nprint(\"face symmetry L2\", round(float(np.linalg.norm(face - flip)), 4))\nhand = np.array([0.1, 0.3, 0.5, 0.7, 0.9])\nflip_h = 1 - hand[::-1]\nprint(\"hand symmetry L2 (should NOT be small)\", round(float(np.linalg.norm(hand - flip_h)), 4))\nprint(\"hands fail more because the data prior is broader and symmetry does not rescue bad samples\")", "out": "P(face sample looks typical) 0.1462\nP(hand sample looks typical) 0.1494\nface symmetry L2 0.0\nhand symmetry L2 (should NOT be small) 0.0\nhands fail more because the data prior is broader and symmetry does not rescue bad samples"}, "h_lighting": {"lang": "py", "file": "h_lighting.py", "src": "# Camera and lighting models generators must invent: exposure, white balance, inverse-square, Fresnel.\nimport numpy as np\n# exposure: doubling light = +1 stop; pixel ∝ 2^(-EV) in linear\nlinear = np.array([0.05, 0.2, 0.5, 0.9])\nfor ev in (-1, 0, 1, 2):\n    print(\"EV%+d linear\" % ev, np.round(np.clip(linear * 2 ** (-ev), 0, 1), 3).tolist())\n# white balance: multiply RGB by gains so a grey patch becomes grey\nwb_cast = np.array([1.4, 1.0, 0.7])   # warm cast\ngrey = np.array([0.5, 0.5, 0.5]) * wb_cast\ngains = grey.mean() / grey\nprint(\"grey under warm cast\", np.round(grey, 3).tolist(), \"gains\", np.round(gains, 3).tolist(), \"corrected\", np.round(grey * gains, 3).tolist())\n# inverse-square falloff\nfor d in (1, 2, 4):\n    print(\"point light relative intensity at d=%d:\" % d, round(1 / d ** 2, 4))\n# Schlick Fresnel\nF0 = 0.04\nfor cos_t in (1.0, 0.5, 0.2, 0.05):\n    F = F0 + (1 - F0) * (1 - cos_t) ** 5\n    print(\"Fresnel F0=0.04 cos=%.2f -> F=%.3f\" % (cos_t, F))\nprint(\"photoreal diffusion models learn these statistics from photos; they do not simulate a path tracer\")", "out": "EV-1 linear [0.1, 0.4, 1.0, 1.0]\nEV+0 linear [0.05, 0.2, 0.5, 0.9]\nEV+1 linear [0.025, 0.1, 0.25, 0.45]\nEV+2 linear [0.012, 0.05, 0.125, 0.225]\ngrey under warm cast [0.7, 0.5, 0.35] gains [0.738, 1.033, 1.476] corrected [0.517, 0.517, 0.517]\npoint light relative intensity at d=1: 1.0\npoint light relative intensity at d=2: 0.25\npoint light relative intensity at d=4: 0.0625\nFresnel F0=0.04 cos=1.00 -> F=0.040\nFresnel F0=0.04 cos=0.50 -> F=0.070\nFresnel F0=0.04 cos=0.20 -> F=0.355\nFresnel F0=0.04 cos=0.05 -> F=0.783\nphotoreal diffusion models learn these statistics from photos; they do not simulate a path tracer"}, "h_negative": {"lang": "py", "file": "h_negative.py", "src": "# Negative prompts via CFG: treat the negative text as the \"unconditional\" branch.\nimport numpy as np\nfrom gv import cfg_eps, rng\nr = rng(29)\n# ε_pos from positive prompt, ε_neg from negative prompt; guided = ε_neg + w (ε_pos - ε_neg)\n# Equivalently: push away from negative features\ne_pos = np.array([0.5, 0.1, -0.2, 0.0])\ne_neg = np.array([-0.4, 0.3, 0.5, -0.1])   # \"blurry, watermark, text\"\nfor w in (1, 3, 7, 12):\n    e = cfg_eps(e_neg, e_pos, w)\n    print(\"w=%2d  e=%s  align_pos=%.3f  align_neg=%.3f\" % (\n        w, np.round(e, 3).tolist(), float(e @ e_pos), float(e @ e_neg)))\nprint(\"composition tip: specific negatives (extra fingers) beat vague ones (bad anatomy) when the model has seen the concept\")", "out": "w= 1  e=[0.5, 0.1, -0.2, 0.0]  align_pos=0.300  align_neg=-0.270\nw= 3  e=[2.3, -0.3, -1.6, 0.2]  align_pos=1.440  align_neg=-1.830\nw= 7  e=[5.9, -1.1, -4.4, 0.6]  align_pos=3.720  align_neg=-4.950\nw=12  e=[10.4, -2.1, -7.9, 1.1]  align_pos=6.570  align_neg=-8.850\ncomposition tip: specific negatives (extra fingers) beat vague ones (bad anatomy) when the model has seen the concept"}, "h_upscale": {"lang": "py", "file": "h_upscale.py", "src": "# Super-resolution / refiner idea: predict residual detail on a bicubic upsample.\nimport numpy as np\nfrom gv import make_shape_image, rgb_to_grey, mse, psnr, rng\nr = rng(28)\nhi = rgb_to_grey(make_shape_image(\"circle\", 32, r))\n# downsample then bicubic-ish upsample via kron / repeat (nearest) + blur\nlo = hi[::4, ::4]\nup = np.kron(lo, np.ones((4, 4)))\n# \"refiner\" residual: true detail\nresidual = hi - up\n# learn a linear map from local 3x3 of up → residual (tiny)\ndef patches(img):\n    p = np.pad(img, 1, mode=\"edge\"); xs, ys = [], []\n    for i in range(img.shape[0]):\n        for j in range(img.shape[1]):\n            xs.append(p[i:i+3, j:j+3].ravel()); ys.append(residual[i, j])\n    return np.stack(xs), np.array(ys)\nX, y = patches(up)\nW, _, _, _ = np.linalg.lstsq(X, y, rcond=None)\npred = (X @ W).reshape(hi.shape)\nrefined = np.clip(up + pred, 0, 1)\nprint(\"bicubic-ish PSNR\", round(psnr(hi, up), 2), \"dB\")\nprint(\"refined PSNR   \", round(psnr(hi, refined), 2), \"dB\")\nprint(\"residual energy kept\", round(float(1 - mse(residual, pred) / (mse(residual, 0 * residual) + 1e-12)), 3))\nprint(\"SDXL refiner and latent upscalers do this in latent or pixel space with a diffusion model, not least squares\")", "out": "bicubic-ish PSNR 19.15 dB\nrefined PSNR    21.59 dB\nresidual energy kept 0.43\nSDXL refiner and latent upscalers do this in latent or pixel space with a diffusion model, not least squares"}, "i_failures": {"lang": "py", "file": "i_failures.py", "src": "# Catalogue of photoreal failure modes with a numeric fingerprint each.\nimport numpy as np\nfrom gv import rng\nr = rng(31)\n# 1) anatomy: expected finger count 5; sample from a confused model\nfingers = r.choice([3, 4, 5, 6, 7], size=1000, p=[0.05, 0.15, 0.55, 0.2, 0.05])\nprint(\"P(exactly 5 fingers)\", round(float((fingers == 5).mean()), 3), \"P(impossible count)\", round(float((fingers != 5).mean()), 3))\n# 2) text rendering: character error rate on a short word\ntarget = list(\"CAFE\"); pred = list(\"C4FE\")\ncer = sum(a != b for a, b in zip(target, pred)) / len(target)\nprint(\"toy CER for painted text\", cer)\n# 3) physics: shadow direction inconsistency (light from left but shadow to the left)\nlight_dir = np.array([1.0, 0.2]); shadow_dir = np.array([-0.8, 0.1])\nprint(\"light·shadow (should be <0 if shadow opposite light)\", round(float(light_dir @ shadow_dir), 3))\n# 4) perspective: vanishing point drift across a building\nvp1, vp2 = np.array([100.0, 80]), np.array([112.0, 78])\nprint(\"vanishing-point drift (px)\", round(float(np.linalg.norm(vp1 - vp2)), 2))\nprint(\"automated metrics miss most of these; human preference (or a trained reward model) still leads\")", "out": "P(exactly 5 fingers) 0.551 P(impossible count) 0.449\ntoy CER for painted text 0.25\nlight·shadow (should be <0 if shadow opposite light) -0.78\nvanishing-point drift (px) 12.17\nautomated metrics miss most of these; human preference (or a trained reward model) still leads"}, "i_fid": {"lang": "py", "file": "i_fid.py", "src": "# FID from scratch on 2-D Gaussians, and CLIP-score cosine on paired embeddings.\nimport numpy as np\nfrom gv import fid_from_feats, clip_similarity, rng\nr = rng(30)\nreal = r.normal([0, 0], [1, 2], size=(2000, 2))\ngood = r.normal([0.05, 0], [1.05, 2.0], size=(2000, 2))\nbad = r.normal([1.5, -1], [2, 0.5], size=(2000, 2))\nprint(\"FID good≈0:\", round(fid_from_feats(real, good), 3))\nprint(\"FID bad:   \", round(fid_from_feats(real, bad), 3))\nprint(\"FID identical:\", round(fid_from_feats(real, real), 6))\n# CLIP score: mean cosine between image emb and its text emb\nimg = r.normal(size=(50, 8)); txt = img + r.normal(size=(50, 8)) * 0.3\nS = clip_similarity(img, txt)\nprint(\"CLIP-score (diag mean cosine)\", round(float(np.diag(S).mean()), 3))\nprint(\"CLIP-score random pairing\", round(float(S.mean()), 3))\nprint(\"FID needs ~thousands of images and an Inception/CLIP feature net; the formula is the same Gaussian one above\")", "out": "FID good≈0: 0.002\nFID bad:    6.596\nFID identical: -1e-06\nCLIP-score (diag mean cosine) 0.945\nCLIP-score random pairing 0.017\nFID needs ~thousands of images and an Inception/CLIP feature net; the formula is the same Gaussian one above"}, "j_safety": {"lang": "py", "file": "j_safety.py", "src": "# Brief safety maths: dataset duplication, membership signal, and a simple watermark bit.\nimport numpy as np\nfrom gv import rng\nr = rng(32)\n# near-duplicate rate: fraction of pairs with cosine > 0.95 in a random emb sample\nE = r.normal(size=(200, 32)); E /= np.linalg.norm(E, axis=1, keepdims=True)\n# plant 5 duplicates\nE[10] = E[0]; E[11] = E[1]; E[12] = E[2]; E[13] = E[3]; E[14] = E[4]\nS = E @ E.T; np.fill_diagonal(S, 0)\ndups = (S > 0.99).sum() // 2\nprint(\"planted near-duplicates detected\", int(dups), \"(expect 5)\")\n# membership: loss on train vs held-out proxy\ntrain_loss = r.normal(0.5, 0.05, 1000); test_loss = r.normal(0.7, 0.08, 1000)\nthresh = 0.55\nprint(\"membership attack TPR@thresh\", round(float((train_loss < thresh).mean()), 3),\n      \"FPR\", round(float((test_loss < thresh).mean()), 3))\n# watermark: embed 16 pseudorandom bits in the lowest DCT-ish coefficient signs\nbits = r.integers(0, 2, 16)\ncoeffs = r.normal(size=16)\nmarked = np.abs(coeffs) * np.where(bits, 1, -1)\nrecovered = (marked > 0).astype(int)\nprint(\"watermark bit accuracy\", round(float((recovered == bits).mean()), 3))\nprint(\"real systems need consent, provenance (C2PA), opt-out and rate limits — a watermark alone is not enough\")", "out": "planted near-duplicates detected 5 (expect 5)\nmembership attack TPR@thresh 0.856 FPR 0.027\nwatermark bit accuracy 1.0\nreal systems need consent, provenance (C2PA), opt-out and rate limits — a watermark alone is not enough"}, "k_systems": {"lang": "py", "file": "k_systems.py", "src": "# Systems: latent vs pixel FLOPs, DDIM step tradeoff, and int8 weight memory.\nimport numpy as np\n# U-Net FLOPs proxy: 6 * N_params * N_pixels_or_latents per step (matmul dominated)\nparams_sd15 = 860e6\npix = 512 * 512 * 3\nlat = 64 * 64 * 4\nflops_pix_step = 6 * params_sd15 * pix / pix   # just 6N — activation size differs; show ratio of spatial tokens\nprint(\"spatial tokens pixel 512² =\", 512 * 512, \"latent 64² =\", 64 * 64, \"ratio\", (512 * 512) / (64 * 64))\n# sampling cost ∝ steps\nfor steps in (1000, 50, 20, 8):\n    print(\"relative sample cost at %4d steps:\" % steps, round(steps / 50, 2), \"× (vs 50-step baseline)\")\n# memory: fp16 vs int8 vs int4 for 860M params\nfor bits, name in ((32, \"fp32\"), (16, \"fp16\"), (8, \"int8\"), (4, \"int4\")):\n    gb = params_sd15 * bits / 8 / 1e9\n    print(\"%s weights ≈ %.2f GB\" % (name, gb))\nprint(\"Lern2OptC covers the arithmetic tricks; Lern2VisionAI covers multimodal systems in more breadth\")", "out": "spatial tokens pixel 512² = 262144 latent 64² = 4096 ratio 64.0\nrelative sample cost at 1000 steps: 20.0 × (vs 50-step baseline)\nrelative sample cost at   50 steps: 1.0 × (vs 50-step baseline)\nrelative sample cost at   20 steps: 0.4 × (vs 50-step baseline)\nrelative sample cost at    8 steps: 0.16 × (vs 50-step baseline)\nfp32 weights ≈ 3.44 GB\nfp16 weights ≈ 1.72 GB\nint8 weights ≈ 0.86 GB\nint4 weights ≈ 0.43 GB\nLern2OptC covers the arithmetic tricks; Lern2VisionAI covers multimodal systems in more breadth"}, "z_cap_diff": {"lang": "py", "file": "z_cap_diff.py", "src": "# Capstone 1: train a tiny diffusion model on synthetic 8x8 grey shapes and sample.\nimport numpy as np, time\nfrom ag import T, param, Adam\nfrom gv import make_shape_image, rgb_to_grey, linear_beta_schedule, sinusoidal_time_embed, mse\nr = np.random.default_rng(40)\nKINDS = [\"circle\", \"stripe\", \"checker\", \"gradient\"]\ndef batch(n):\n    return np.stack([rgb_to_grey(make_shape_image(KINDS[i % 4], 8, np.random.default_rng(5000 + i + r.integers(0, 1_000_000)))).ravel() for i in range(n)])\nD = 64; Tn = 60\nbetas = linear_beta_schedule(Tn, 1e-4, 0.12); ab = np.cumprod(1 - betas)\nW1 = param(r, D + 16, 128); b1 = T(np.zeros(128)); W2 = param(r, 128, 128); b2 = T(np.zeros(128)); W3 = param(r, 128, D); b3 = T(np.zeros(D))\nps = [W1, b1, W2, b2, W3, b3]; opt = Adam(ps, lr=2e-3)\ndef eps_net(x, t):\n    h = (T(np.c_[x, sinusoidal_time_embed(t, 16)]) @ W1 + b1).gelu()\n    h = (h @ W2 + b2).gelu(); return h @ W3 + b3\nt0 = time.time()\nfor step in range(2501):\n    x0 = batch(64); t = r.integers(0, Tn, 64); e = r.normal(size=x0.shape)\n    xt = np.sqrt(ab[t])[:, None] * x0 + np.sqrt(1 - ab[t])[:, None] * e\n    loss = ((eps_net(xt, t) - T(e)) ** 2).mean(); loss.backward(); opt.step()\n    if step % 500 == 0: print(\"step %4d  L_simple %.4f\" % (step, float(loss.data)))\n# sample\nx = r.normal(size=(8, D))\nfor t in reversed(range(Tn)):\n    eh = eps_net(x, np.full(8, t)).data\n    z = r.normal(size=x.shape) if t else 0\n    x = (x - betas[t] / np.sqrt(1 - ab[t]) * eh) / np.sqrt(1 - betas[t]) + np.sqrt(betas[t]) * z\nx = np.clip(x, 0, 1)\n# compare sample stats to data\ndata = batch(64)\nprint(\"data pixel mean %.3f std %.3f | samples mean %.3f std %.3f\" % (data.mean(), data.std(), x.mean(), x.std()))\nprint(\"sample0 8x8 (rounded):\"); print(np.round(x[0].reshape(8, 8), 2))\nprint(\"capstone1 time %.1fs\" % (time.time() - t0))", "out": "step    0  L_simple 1.0297\nstep  500  L_simple 0.2314\nstep 1000  L_simple 0.1658\nstep 1500  L_simple 0.1469\nstep 2000  L_simple 0.1367\nstep 2500  L_simple 0.1238\ndata pixel mean 0.364 std 0.322 | samples mean 0.330 std 0.327\nsample0 8x8 (rounded):\n[[0.24 0.   0.56 0.69 0.   0.26 0.45 1.  ]\n [0.06 0.   0.38 0.22 0.29 0.   0.38 0.41]\n [0.49 0.63 0.11 1.   0.24 0.34 0.25 0.6 ]\n [0.21 0.72 0.57 0.27 0.92 1.   0.   0.26]\n [0.   0.   0.31 0.82 0.11 0.   0.4  0.72]\n [0.12 0.13 1.   0.33 0.   0.   0.5  0.96]\n [0.46 0.3  0.47 0.54 0.44 0.9  0.47 0.28]\n [0.48 0.53 0.35 0.31 0.37 0.89 0.01 0.03]]\ncapstone1 time 9.8s"}, "z_cap_edit": {"lang": "py", "file": "z_cap_edit.py", "src": "# Capstone 3: tiny image+text editor — img2img with a class instruction and a mask (inpaint).\nimport numpy as np, time\nfrom ag import T, param, Adam\nfrom gv import make_shape_image, rgb_to_grey, linear_beta_schedule, sinusoidal_time_embed, cfg_eps, mse, q_sample\nr = np.random.default_rng(42)\nKINDS = [\"circle\", \"stripe\", \"checker\", \"gradient\"]\ndef img_of(k, seed): return rgb_to_grey(make_shape_image(KINDS[k], 8, np.random.default_rng(seed))).ravel()\nD, C, Tn = 64, 4, 40\nbetas = linear_beta_schedule(Tn, 1e-4, 0.12); ab = np.cumprod(1 - betas)\nE = param(r, C, 10)\nW1 = param(r, D + 10 + 16, 96); b1 = T(np.zeros(96)); W2 = param(r, 96, D); b2 = T(np.zeros(D))\nopt = Adam([E, W1, b1, W2, b2], lr=2e-3)\ndef eps_net(x, t, c):\n    return ((T(np.c_[x, c, sinusoidal_time_embed(t, 16)]) @ W1 + b1).gelu() @ W2 + b2)\nt0 = time.time()\nfor step in range(2501):\n    y = r.integers(0, 4, 64)\n    x0 = np.stack([img_of(int(yy), 7000 + step * 64 + i) for i, yy in enumerate(y)])\n    t = r.integers(0, Tn, 64); e = r.normal(size=x0.shape)\n    xt = np.sqrt(ab[t])[:, None] * x0 + np.sqrt(1 - ab[t])[:, None] * e\n    c = E.data[y].copy(); c[r.random(64) < 0.15] = 0\n    loss = ((eps_net(xt, t, c) - T(e)) ** 2).mean(); loss.backward(); opt.step()\n    if step % 500 == 0: print(\"step %4d  MSE %.4f\" % (step, float(loss.data)))\n# img2img: take a circle, ask for stripe, strength 0.7\nsrc = img_of(0, 1); target_cls = 1; strength = 0.7\nt_start = int(strength * (Tn - 1))\nxt, _ = q_sample(src, t_start, ab, r=r)\nc = np.broadcast_to(E.data[target_cls], (1, 10)).copy(); c0 = np.zeros_like(c)\nx = xt[None]\nfor t in reversed(range(t_start + 1)):\n    e = cfg_eps(eps_net(x, np.array([t]), c0).data, eps_net(x, np.array([t]), c).data, 2.5)\n    z = r.normal(size=x.shape) if t else 0\n    x = (x - betas[t] / np.sqrt(1 - ab[t]) * e) / np.sqrt(1 - betas[t]) + np.sqrt(betas[t]) * z\nx = np.clip(x[0], 0, 1)\nprint(\"img2img circle→stripe strength 0.7: MSE to src %.3f  MSE to a real stripe %.3f\" % (\n    mse(x, src), mse(x, img_of(1, 2))))\n# inpaint: mask centre of a checker, fill as circle\nsrc = img_of(2, 3).reshape(8, 8); mask = np.zeros((8, 8)); mask[2:6, 2:6] = 1\nknown = 1 - mask\nx = src.copy()\nc = np.broadcast_to(E.data[0], (1, 10)).copy(); c0 = np.zeros_like(c)\nx_flat = x.ravel()[None]\nfor t in reversed(range(Tn)):\n    # paste known pixels from the forward process of the source\n    known_xt, _ = q_sample(src.ravel(), t, ab, r=r)\n    e = cfg_eps(eps_net(x_flat, np.array([t]), c0).data, eps_net(x_flat, np.array([t]), c).data, 2.0)\n    z = r.normal(size=x_flat.shape) if t else 0\n    x_flat = (x_flat - betas[t] / np.sqrt(1 - ab[t]) * e) / np.sqrt(1 - betas[t]) + np.sqrt(betas[t]) * z\n    x_flat = (mask.ravel() * x_flat + known.ravel() * known_xt[None])\nx = np.clip(x_flat[0].reshape(8, 8), 0, 1)\nprint(\"inpaint known MSE\", round(mse(x * known, src * known), 4), \"hole mean\", round(float((x * mask).sum() / mask.sum()), 3))\nprint(\"capstone3 time %.1fs\" % (time.time() - t0))", "out": "step    0  MSE 1.1993\nstep  500  MSE 0.1735\nstep 1000  MSE 0.2173\nstep 1500  MSE 0.1868\nstep 2000  MSE 0.1784\nstep 2500  MSE 0.1573\nimg2img circle→stripe strength 0.7: MSE to src 0.247  MSE to a real stripe 0.065\ninpaint known MSE 0.0001 hole mean 0.438\ncapstone3 time 8.0s"}, "z_cap_txt": {"lang": "py", "file": "z_cap_txt.py", "src": "# Capstone 2: tiny text-conditioned generator (class token as text) with CFG sampling.\nimport numpy as np, time\nfrom ag import T, param, Adam\nfrom gv import make_shape_image, rgb_to_grey, linear_beta_schedule, sinusoidal_time_embed, cfg_eps\nr = np.random.default_rng(41)\nKINDS = [\"circle\", \"stripe\", \"checker\", \"gradient\"]\ndef batch(n):\n    ys = r.integers(0, 4, n)\n    xs = np.stack([rgb_to_grey(make_shape_image(KINDS[y], 8, np.random.default_rng(6000 + i))).ravel() for i, y in enumerate(ys)])\n    return xs, ys\nD, C, Tn = 64, 4, 50\nbetas = linear_beta_schedule(Tn, 1e-4, 0.12); ab = np.cumprod(1 - betas)\nE = param(r, C, 12)\nW1 = param(r, D + 12 + 16, 128); b1 = T(np.zeros(128)); W2 = param(r, 128, D); b2 = T(np.zeros(D))\nps = [E, W1, b1, W2, b2]; opt = Adam(ps, lr=2e-3)\np_uncond = 0.15\ndef eps_net(x, t, c):\n    h = (T(np.c_[x, c, sinusoidal_time_embed(t, 16)]) @ W1 + b1).gelu(); return h @ W2 + b2\nt0 = time.time()\nfor step in range(3001):\n    x0, y = batch(64); t = r.integers(0, Tn, 64); e = r.normal(size=x0.shape)\n    xt = np.sqrt(ab[t])[:, None] * x0 + np.sqrt(1 - ab[t])[:, None] * e\n    c = E.data[y].copy(); c[r.random(len(y)) < p_uncond] = 0\n    loss = ((eps_net(xt, t, c) - T(e)) ** 2).mean(); loss.backward(); opt.step()\n    if step % 1000 == 0: print(\"step %4d  MSE %.4f\" % (step, float(loss.data)))\n\ndef sample(cls, w=2.5, n=4):\n    x = r.normal(size=(n, D)); c = np.broadcast_to(E.data[cls], (n, 12)).copy(); c0 = np.zeros_like(c)\n    for t in reversed(range(Tn)):\n        tt = np.full(n, t)\n        e = cfg_eps(eps_net(x, tt, c0).data, eps_net(x, tt, c).data, w)\n        z = r.normal(size=x.shape) if t else 0\n        x = (x - betas[t] / np.sqrt(1 - ab[t]) * e) / np.sqrt(1 - betas[t]) + np.sqrt(betas[t]) * z\n    return np.clip(x, 0, 1)\nfor k, name in enumerate(KINDS):\n    s = sample(k, w=3.0, n=2)\n    print(\"text='%s' sample mean %.3f centre-pixel %.3f\" % (name, s.mean(), s[0].reshape(8, 8)[3:5, 3:5].mean()))\nprint(\"capstone2 time %.1fs\" % (time.time() - t0))", "out": "step    0  MSE 1.2793\nstep 1000  MSE 0.2217\nstep 2000  MSE 0.1680\nstep 3000  MSE 0.1351\ntext='circle' sample mean 0.118 centre-pixel 0.477\ntext='stripe' sample mean 0.410 centre-pixel 0.330\ntext='checker' sample mean 0.507 centre-pixel 0.500\ntext='gradient' sample mean 0.628 centre-pixel 0.499\ncapstone2 time 10.0s"}, "ag": {"lang": "py", "file": "ag.py", "src": "# ag.py: a tiny reverse-mode automatic differentiation engine in NumPy (used by the Part 8-11 examples).\n# Every op stores its inputs and a function that turns the output gradient into input gradients.\nimport numpy as np\n\ndef _unb(g, shape):                       # undo NumPy broadcasting: sum the gradient back to the input's shape\n    while g.ndim > len(shape): g = g.sum(0)\n    for i, s in enumerate(shape):\n        if s == 1 and g.shape[i] != 1: g = g.sum(i, keepdims=True)\n    return g\n\nclass T:\n    def __init__(self, data, parents=(), back=None):\n        self.data = np.asarray(data, dtype=np.float64); self.grad = None; self.parents = parents; self.back = back\n    shape = property(lambda s: s.data.shape)\n    def __repr__(self): return 'T%s' % (self.data.shape,)\n    # ---- elementwise ----\n    def __add__(a, b):\n        b = b if isinstance(b, T) else T(b)\n        return T(a.data + b.data, (a, b), lambda g: (_unb(g, a.shape), _unb(g, b.shape)))\n    __radd__ = __add__\n    def __neg__(a): return T(-a.data, (a,), lambda g: (-g,))\n    def __sub__(a, b): return a + (-(b if isinstance(b, T) else T(b)))\n    def __rsub__(a, b): return T(b) - a\n    def __mul__(a, b):\n        b = b if isinstance(b, T) else T(b)\n        return T(a.data * b.data, (a, b), lambda g: (_unb(g * b.data, a.shape), _unb(g * a.data, b.shape)))\n    __rmul__ = __mul__\n    def __truediv__(a, b):\n        b = b if isinstance(b, T) else T(b)\n        return a * b ** -1\n    def __pow__(a, p): return T(a.data ** p, (a,), lambda g: (g * p * a.data ** (p - 1),))\n    def __matmul__(a, b):\n        return T(a.data @ b.data, (a, b), lambda g: (_unb(g @ np.swapaxes(b.data, -1, -2), a.shape), _unb(np.swapaxes(a.data, -1, -2) @ g, b.shape)))\n    def exp(a): e = np.exp(a.data); return T(e, (a,), lambda g: (g * e,))\n    def log(a): return T(np.log(a.data), (a,), lambda g: (g / a.data,))\n    def tanh(a): t = np.tanh(a.data); return T(t, (a,), lambda g: (g * (1 - t * t),))\n    def sigmoid(a): s = 1 / (1 + np.exp(-a.data)); return T(s, (a,), lambda g: (g * s * (1 - s),))\n    def relu(a): m = a.data > 0; return T(a.data * m, (a,), lambda g: (g * m,))\n    def gelu(a):                                             # tanh approximation\n        x = a.data; c = np.sqrt(2 / np.pi); u = c * (x + 0.044715 * x ** 3); t = np.tanh(u)\n        d = 0.5 * (1 + t) + 0.5 * x * (1 - t * t) * c * (1 + 3 * 0.044715 * x * x)\n        return T(0.5 * x * (1 + t), (a,), lambda g: (g * d,))\n    def sin(a): return T(np.sin(a.data), (a,), lambda g: (g * np.cos(a.data),))\n    def cos(a): return T(np.cos(a.data), (a,), lambda g: (-g * np.sin(a.data),))\n    # ---- reductions and shape ----\n    def sum(a, axis=None, keepdims=False):\n        def back(g):\n            if axis is not None and not keepdims: g = np.expand_dims(g, axis)\n            return (np.broadcast_to(g, a.shape).copy(),)\n        return T(a.data.sum(axis, keepdims=keepdims), (a,), back)\n    def mean(a, axis=None, keepdims=False):\n        n = a.data.size if axis is None else a.data.shape[axis]\n        return a.sum(axis, keepdims) * (1.0 / n)\n    def max(a, axis, keepdims=False):                        # gradient to the arg-max\n        m = a.data.max(axis, keepdims=True); mask = (a.data == m); mask = mask / mask.sum(axis, keepdims=True)\n        out = m if keepdims else np.squeeze(m, axis)\n        return T(out, (a,), lambda g: ((g if keepdims else np.expand_dims(g, axis)) * mask,))\n    def reshape(a, *s): return T(a.data.reshape(*s), (a,), lambda g: (g.reshape(a.shape),))\n    def transpose(a, *ax):\n        inv = np.argsort(ax); return T(a.data.transpose(*ax), (a,), lambda g: (g.transpose(*inv),))\n    @property\n    def Tt(a): return a.transpose(*range(a.data.ndim - 2), a.data.ndim - 1, a.data.ndim - 2)\n    def __getitem__(a, idx):\n        def back(g): z = np.zeros_like(a.data); np.add.at(z, idx, g); return (z,)\n        return T(a.data[idx], (a,), back)\n    # ---- backprop ----\n    def backward(self, g=None):\n        order, seen = [], set()\n        def visit(v):\n            if id(v) in seen: return\n            seen.add(id(v)); [visit(p) for p in v.parents]; order.append(v)\n        visit(self)\n        for v in order: v.grad = None\n        self.grad = np.ones_like(self.data) if g is None else g\n        for v in reversed(order):\n            if v.back is None or v.grad is None: continue\n            for p, gp in zip(v.parents, v.back(v.grad)):\n                p.grad = gp if p.grad is None else p.grad + gp\n\ndef cat(ts, axis=-1):\n    sizes = np.cumsum([t.shape[axis] for t in ts])[:-1]\n    return T(np.concatenate([t.data for t in ts], axis), tuple(ts), lambda g: tuple(np.split(g, sizes, axis)))\n\ndef softmax(x, axis=-1):\n    s = x.data - x.data.max(axis, keepdims=True); e = np.exp(s); p = e / e.sum(axis, keepdims=True)\n    return T(p, (x,), lambda g: (p * (g - (g * p).sum(axis, keepdims=True)),))\n\ndef log_softmax(x, axis=-1):\n    s = x.data - x.data.max(axis, keepdims=True); lse = np.log(np.exp(s).sum(axis, keepdims=True)); out = s - lse; p = np.exp(out)\n    return T(out, (x,), lambda g: (g - p * g.sum(axis, keepdims=True),))\n\ndef cross_entropy(logits, y, mask=None):                    # mean over (optionally masked) positions; y = int labels\n    lp = log_softmax(logits); flat = lp.reshape(-1, lp.shape[-1]); yi = np.asarray(y).reshape(-1)\n    picked = flat[np.arange(len(yi)), yi]\n    if mask is None: return -picked.mean()\n    m = np.asarray(mask, float).reshape(-1); return -(picked * T(m)).sum() * (1.0 / max(m.sum(), 1))\n\ndef layernorm(x, g, b, eps=1e-5):\n    mu = x.mean(-1, keepdims=True); xc = x - mu; var = (xc * xc).mean(-1, keepdims=True)\n    return xc * (var + eps) ** -0.5 * g + b\n\nclass Adam:\n    def __init__(self, params, lr=1e-3, b1=0.9, b2=0.999, eps=1e-8, wd=0.0):\n        self.p = params; self.lr, self.b1, self.b2, self.eps, self.wd = lr, b1, b2, eps, wd; self.t = 0\n        self.m = [np.zeros_like(p.data) for p in params]; self.v = [np.zeros_like(p.data) for p in params]\n    def step(self):\n        self.t += 1\n        for i, p in enumerate(self.p):\n            if p.grad is None: continue\n            g = p.grad + self.wd * p.data\n            self.m[i] = self.b1 * self.m[i] + (1 - self.b1) * g; self.v[i] = self.b2 * self.v[i] + (1 - self.b2) * g * g\n            mh = self.m[i] / (1 - self.b1 ** self.t); vh = self.v[i] / (1 - self.b2 ** self.t)\n            p.data -= self.lr * mh / (np.sqrt(vh) + self.eps)\n\ndef param(rng, *shape, scale=None):\n    scale = scale if scale is not None else 1 / np.sqrt(shape[0]); return T(rng.normal(0, scale, shape))\n\ndef gradcheck(f, params, eps=1e-6, n=6, rng=np.random.default_rng(123)):\n    \"\"\"Compare autodiff gradients with central differences at n random entries per parameter; return max relative error.\"\"\"\n    loss = f(); loss.backward(); worst = 0.0\n    for p in params:\n        ga = p.grad.copy()\n        for _ in range(n):\n            i = tuple(rng.integers(0, s) for s in p.shape); old = p.data[i]\n            p.data[i] = old + eps; lp = f().data; p.data[i] = old - eps; lm = f().data; p.data[i] = old\n            num = (lp - lm) / (2 * eps); worst = max(worst, abs(num - ga[i]) / max(1e-8, abs(num) + abs(ga[i])))\n    return worst", "out": ""}, "gv": {"lang": "py", "file": "gv.py", "src": "\"\"\"Shared helpers for Lern2GenVision examples (NumPy only, CPU).\"\"\"\nimport numpy as np\n\ndef rng(seed=0):\n    return np.random.default_rng(seed)\n\ndef softmax(x, axis=-1):\n    x = x - np.max(x, axis=axis, keepdims=True)\n    e = np.exp(x)\n    return e / e.sum(axis=axis, keepdims=True)\n\ndef one_hot(i, n):\n    o = np.zeros(n); o[i] = 1; return o\n\ndef mse(a, b):\n    return float(np.mean((a - b) ** 2))\n\ndef psnr(a, b, peak=1.0):\n    m = mse(a, b)\n    return 99.0 if m < 1e-12 else 10 * np.log10(peak * peak / m)\n\ndef linear_beta_schedule(T, beta0=1e-4, beta1=0.02):\n    return np.linspace(beta0, beta1, T)\n\ndef cosine_alpha_bar(T, s=0.008):\n    t = np.arange(T + 1)\n    f = np.cos(((t / T) + s) / (1 + s) * np.pi / 2) ** 2\n    ab = f / f[0]\n    return ab[1:]  # length T, alpha_bar_t for t=1..T (0-index as t=0..T-1)\n\ndef schedule_from_alpha_bar(ab):\n    \"\"\"Return betas, alphas, alpha_bar given alpha_bar of length T.\"\"\"\n    ab = np.asarray(ab, dtype=float)\n    prev = np.concatenate([[1.0], ab[:-1]])\n    alphas = ab / prev\n    betas = 1 - alphas\n    return betas, alphas, ab\n\ndef q_sample(x0, t, ab, noise=None, r=None):\n    \"\"\"Forward jump: x_t = sqrt(ab_t) x0 + sqrt(1-ab_t) eps. t may be int or array.\"\"\"\n    if noise is None:\n        r = r or rng(0)\n        noise = r.normal(size=x0.shape)\n    t_arr = np.asarray(t)\n    s1 = np.sqrt(ab[t_arr]); s2 = np.sqrt(1 - ab[t_arr])\n    if t_arr.ndim == 0:\n        return s1 * x0 + s2 * noise, noise\n    shape = (len(t_arr),) + (1,) * (x0.ndim - 1)\n    return s1.reshape(shape) * x0 + s2.reshape(shape) * noise, noise\n\ndef predict_x0_from_eps(xt, eps, ab_t):\n    return (xt - np.sqrt(1 - ab_t) * eps) / np.sqrt(ab_t)\n\ndef cfg_eps(eps_uncond, eps_cond, w):\n    return eps_uncond + w * (eps_cond - eps_uncond)\n\ndef rgb_to_grey(img):\n    return 0.299 * img[..., 0] + 0.587 * img[..., 1] + 0.114 * img[..., 2]\n\ndef make_shape_image(kind='circle', size=16, r=None):\n    \"\"\"Synthetic HxWx3 float image in [0,1] with simple geometry + soft shading.\"\"\"\n    r = r or rng(0)\n    yy, xx = np.mgrid[0:size, 0:size]\n    c = (size - 1) / 2\n    img = np.zeros((size, size, 3))\n    if kind == 'circle':\n        d = np.sqrt((xx - c) ** 2 + (yy - c) ** 2)\n        mask = (d < size * 0.35).astype(float)\n        shade = np.clip(1 - 0.5 * (xx + yy) / (2 * size), 0.4, 1)\n        col = np.array([0.85, 0.25, 0.2])\n        img = mask[..., None] * col * shade[..., None]\n    elif kind == 'stripe':\n        img[..., 0] = ((xx // 2) % 2) * 0.9\n        img[..., 1] = ((yy // 2) % 2) * 0.7\n        img[..., 2] = 0.3\n    elif kind == 'gradient':\n        img[..., 0] = xx / (size - 1)\n        img[..., 1] = yy / (size - 1)\n        img[..., 2] = 0.5\n    elif kind == 'checker':\n        ch = ((xx // 2) + (yy // 2)) % 2\n        img[:] = ch[..., None] * 0.9\n    else:\n        img[:] = r.random((size, size, 3)) * 0.5 + 0.25\n    # slight film grain\n    img = np.clip(img + r.normal(0, 0.01, img.shape), 0, 1)\n    return img.astype(np.float64)\n\ndef patchify(img, ps):\n    H, W = img.shape[:2]\n    assert H % ps == 0 and W % ps == 0\n    gh, gw = H // ps, W // ps\n    if img.ndim == 2:\n        return img.reshape(gh, ps, gw, ps).transpose(0, 2, 1, 3).reshape(gh * gw, ps * ps)\n    C = img.shape[2]\n    return img.reshape(gh, ps, gw, ps, C).transpose(0, 2, 1, 3, 4).reshape(gh * gw, ps * ps * C)\n\ndef unpatchify(patches, H, W, ps, C=None):\n    gh, gw = H // ps, W // ps\n    if C is None:\n        return patches.reshape(gh, gw, ps, ps).transpose(0, 2, 1, 3).reshape(H, W)\n    return patches.reshape(gh, gw, ps, ps, C).transpose(0, 2, 1, 3, 4).reshape(H, W, C)\n\ndef fid_from_feats(real, fake):\n    \"\"\"FID between two (N,D) feature matrices (Gaussian closed form).\"\"\"\n    mu_r, mu_f = real.mean(0), fake.mean(0)\n    Sr = np.cov(real, rowvar=False); Sf = np.cov(fake, rowvar=False)\n    # matrix square root via eigen for SPD\n    def sqrtm(A):\n        w, V = np.linalg.eigh(A + 1e-6 * np.eye(A.shape[0]))\n        return (V * np.sqrt(np.clip(w, 0, None))) @ V.T\n    covmean = sqrtm(Sr @ Sf)\n    return float(np.sum((mu_r - mu_f) ** 2) + np.trace(Sr + Sf - 2 * covmean))\n\ndef bpe_train(text, n_merges=20):\n    \"\"\"Tiny BPE: return list of merge rules (a,b)->ab and final vocab set of tokens.\"\"\"\n    tokens = list(text)\n    merges = []\n    for _ in range(n_merges):\n        if len(tokens) < 2: break\n        counts = {}\n        for i in range(len(tokens) - 1):\n            pair = (tokens[i], tokens[i + 1])\n            counts[pair] = counts.get(pair, 0) + 1\n        if not counts: break\n        best = max(counts, key=counts.get)\n        if counts[best] < 2: break\n        merges.append(best)\n        a, b = best; nb = a + b\n        out = []; i = 0\n        while i < len(tokens):\n            if i + 1 < len(tokens) and tokens[i] == a and tokens[i + 1] == b:\n                out.append(nb); i += 2\n            else:\n                out.append(tokens[i]); i += 1\n        tokens = out\n    return merges, tokens\n\ndef apply_bpe(text, merges):\n    tokens = list(text)\n    for a, b in merges:\n        nb = a + b; out = []; i = 0\n        while i < len(tokens):\n            if i + 1 < len(tokens) and tokens[i] == a and tokens[i + 1] == b:\n                out.append(nb); i += 2\n            else:\n                out.append(tokens[i]); i += 1\n        tokens = out\n    return tokens\n\ndef sinusoidal_time_embed(t, d=16):\n    \"\"\"t: (N,) int or float → (N,d) sin/cos embedding.\"\"\"\n    t = np.asarray(t, dtype=float)\n    half = d // 2\n    freqs = np.exp(-np.log(10000.0) * np.arange(half) / half)\n    args = t[:, None] * freqs[None, :]\n    return np.concatenate([np.sin(args), np.cos(args)], axis=1)\n\ndef cross_entropy(logits, targets):\n    \"\"\"logits (N,C), targets (N,) int.\"\"\"\n    p = softmax(logits, axis=1)\n    N = len(targets)\n    return float(-np.mean(np.log(p[np.arange(N), targets] + 1e-12)))\n\ndef clip_similarity(img_emb, txt_emb):\n    \"\"\"Cosine similarity matrix (Ni, Nt) after L2-normalising rows.\"\"\"\n    img_emb = img_emb / (np.linalg.norm(img_emb, axis=1, keepdims=True) + 1e-8)\n    txt_emb = txt_emb / (np.linalg.norm(txt_emb, axis=1, keepdims=True) + 1e-8)\n    return img_emb @ txt_emb.T", "out": ""}};

(function () {

  const base = U.rich;
  const isTable = b => { const L = b.trim().split('\n'); return L.length >= 2 && L.every(l => /^\s*\|.*\|\s*$/.test(l)) && /^\s*\|[\s:\-|]+\|\s*$/.test(L[1]); };
  const cells = l => l.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => c.trim());
  U.rich = function (t, cls) {
    const blocks = String(t || '').trim().split(/\n\s*\n/);
    if (!blocks.some(isTable)) return base(t, cls);
    const box = U.h('div', { class: cls || 'body' });
    for (const b of blocks) {
      if (isTable(b)) {
        const L = b.trim().split('\n'); const wrap = U.h('div', { style: 'overflow-x:auto;margin:8px 0' });
        const tb = U.h('table', { style: 'border-collapse:collapse;font-size:0.92em;min-width:60%' });
        const tr = U.h('tr'); cells(L[0]).forEach(c => tr.appendChild(U.h('th', { style: 'border:1px solid currentColor;padding:4px 8px;text-align:left;opacity:.95', html: U.inline(c) }))); tb.appendChild(U.h('thead', {}, tr));
        const body = U.h('tbody');
        L.slice(2).forEach(l => { const r = U.h('tr'); cells(l).forEach(c => r.appendChild(U.h('td', { style: 'border:1px solid currentColor;padding:4px 8px', html: U.inline(c) }))); body.appendChild(r); });
        tb.appendChild(body); wrap.appendChild(tb); box.appendChild(wrap);
      } else { const sub = base(b, cls); while (sub.firstChild) box.appendChild(sub.firstChild); }
    }
    return box;
  };
  U.rich.__tables = true;
})();

/* Python syntax colours (the base highlighter knows C-family languages only) */
const V = CG.V, hl0 = V.highlight;
const PYK = new Set('False None True and as assert break class continue def del elif else except finally for from global if import in is lambda not or pass raise return try while with yield print range len zip enumerate np cv2 self'.split(' '));
V.highlight = function (line, lang, state) {
  if (lang !== 'py') return hl0(line, lang, state);
  const out = []; let i = 0; const n = line.length;
  const push = (t, c) => out.push([t, c || null]);
  while (i < n) {
    const c = line[i], rest = line.slice(i); let m;
    if (c === '#') { push(rest, 'syn-com'); break; }
    if (c === '"' || c === "'") { let j = i + 1; while (j < n && line[j] !== c) { if (line[j] === '\\') j++; j++; } push(line.slice(i, j + 1), 'syn-str'); i = j + 1; continue; }
    if ((m = /^\d[\w.]*/.exec(rest)) && !/\w/.test(line[i - 1] || '')) { push(m[0], 'syn-num'); i += m[0].length; continue; }
    if ((m = /^[A-Za-z_]\w*/.exec(rest))) { push(m[0], PYK.has(m[0]) ? 'syn-kw' : null); i += m[0].length; continue; }
    push(c); i++;
  }
  return out;
};

/* pix: a small image drawn as a grid of grey cells with the numbers written in.
   o = {m: [[...]], hl: [[r, c], ...], tone, label, max} */
V.KINDS.pix = function (o) {
  const m = o.m, R = m.length, Cn = m[0].length, cs = o.cs || (Cn > 9 ? 26 : 34), W = Cn * cs + 2, H = R * cs + 2, mx = o.max || 255;
  const svg = V.svg(W, H, o.label || 'pixel grid');
  const isHL = (r, c) => (o.hl || []).some(p => p[0] === r && p[1] === c);
  for (let r = 0; r < R; r++) for (let c = 0; c < Cn; c++) {
    const v = m[r][c], g = typeof v === 'number' ? Math.max(0, Math.min(255, Math.round(255 * Math.abs(v) / mx))) : 255;
    svg.appendChild(V.rect(1 + c * cs, 1 + r * cs, cs, cs, { rx: 0, fill: 'rgb(' + g + ',' + g + ',' + g + ')', stroke: isHL(r, c) ? 'var(--gold)' : 'var(--line)', sw: isHL(r, c) ? 2.5 : 0.6 }));
    svg.appendChild(V.text(1 + c * cs + cs / 2, 1 + r * cs + cs / 2 + 3.5, String(v), { size: cs > 30 ? 11 : 9.5, mono: true, fill: g > 140 ? '#111' : '#eee' }));
  }
  return svg;
};

unit('u2', 2, 'img', 'rs1', 'What “realistic” means', 'Photoreal is not one trick. It is the joint statistics of perspective, shading, soft shadow, texture spectrum, materials and faces. Generators learn those statistics from photos — they do not run a path tracer.', [

  lab('bases', 'Pixel bases: decimal ↔ hex ↔ binary', 'num', 'Convert a channel value between decimal, hex and 8-bit binary. Method tips match the Bases drill.', body => {

  /* ---- forward diffusion stepper ---- */
  lab('forward', 'Forward diffusion stepper', 'wave', 'Watch a clean 12×12 circle turn into noise as t increases. Toggle linear vs cosine schedules and read √ᾱ, √(1−ᾱ) and SNR live.', body => {
    const N = 12, clean = makeCircle(N); const out = h('div', { class: 'stack' }); let t = 0, Tsteps = 100, sched = 'linear', noise = flat(clean).map(() => gauss());
    const abOf = () => {
      if (sched === 'cosine') {

        const f0 = f(0); return Array.from({ length: Tsteps }, (_, i) => f(i + 1) / f0);
      }

    };
    const redraw = () => {
      out.innerHTML = '';
      const ab = abOf(); const a = ab[Math.min(t, Tsteps - 1)];
      const xt = flat(clean).map((x, i) => Math.sqrt(a) * x + Math.sqrt(1 - a) * noise[i]);
      const M = reshape(xt.map(v => clamp((v + 0.2) / 1.4, 0, 1)), N);

    };
    body.appendChild(slider('timestep t', 0, Tsteps - 1, 1, t, x => { t = x; redraw(); }));
    body.appendChild(field('schedule', select('schedule', [['linear', 'linear β'], ['cosine', 'cosine ᾱ']], sched, v => { sched = v; redraw(); })));
    body.appendChild(btn('reshuffle ε', () => { noise = flat(clean).map(() => gauss()); redraw(); }));
    body.appendChild(out); redraw();
  });

  /* ---- reverse stepper (oracle denoiser toward known x0) ---- */
  lab('reverse', 'Reverse denoising stepper (oracle)', 'bolt', 'Start from noise and step toward a known x0 with an oracle ε = (x_t − √ᾱ x0)/√(1−ᾱ). This isolates the sampler maths from network error.', body => {
    const N = 12, x0 = flat(makeCircle(N)); const Tsteps = 40;
    const betas = linspace(1e-4, 0.12, Tsteps); const ab = cumprod(betas.map(b => 1 - b));
    let x = x0.map(() => gauss()), t = Tsteps - 1;
    const view = h('div', { class: 'stack' });
    const show = () => {
      view.innerHTML = '';

  /* ---- CFG explorer ---- */
  lab('cfg', 'CFG scale explorer', 'eye', 'Exact 1-D mixture score: watch samples move from unconditional to over-guided as w rises. Same maths as Unit 15.', body => {
    const Tn = 80; const betas = linspace(1e-4, 0.08, Tn); const ab = cumprod(betas.map(b => 1 - b));
    const Mu = { cat: -1.2, dog: 1.0 }; const S = 0.55;
    const epsMix = (x, t, means) => {
      const m = means.map(mu => Math.sqrt(ab[t]) * mu); const v = ab[t] * S * S + 1 - ab[t];
      const logw = m.map(mu => -0.5 * (x - mu) ** 2 / v); const mx = Math.max(...logw);
      const w = logw.map(l => Math.exp(l - mx)); const s = w.reduce((a, b) => a + b, 0); const ww = w.map(z => z / s);
      const score = ww.reduce((acc, wi, i) => acc + wi * (m[i] - x) / v, 0);
      return -Math.sqrt(1 - ab[t]) * score;
    };
    const sample = (w, n) => {
      seed = 99; const xs = [];
      for (let i = 0; i < n; i++) {
        let x = gauss();
        for (let t = Tn - 1; t >= 0; t--) {
          const eu = epsMix(x, t, [Mu.cat, Mu.dog]); const ec = epsMix(x, t, [Mu.dog]);

          const x0 = (x - Math.sqrt(1 - ab[t]) * e) / Math.sqrt(ab[t]);
          x = t ? Math.sqrt(ab[t - 1]) * x0 + Math.sqrt(1 - ab[t - 1]) * e : x0;

      out.appendChild(pre('w=0 unconditional (mean near 0); w=1 true conditional; larger w → tighter, more “dog-like”, less diverse.'));

  /* ---- VAE reconstruct ---- */
  lab('vae', 'VAE bottleneck playground', 'chip', 'Project an 8×8 pattern through a fixed random encoder to z-dim D and decode with the pseudoinverse-ish map. Watch recon die as D shrinks.', body => {
    const N = 8; let D = 8, kind = 'circle';

        // Work on array of current tokens:
