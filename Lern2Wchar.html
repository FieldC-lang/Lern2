<title>Lern2Wchar</title>
<meta name="description" content="Lern2Wchar: everything in C’s wchar.h — wchar_t/wint_t/mbstate_t/WEOF, wide strings, wmem*, UTF-8 restartable conversions, wcsto*, wcwidth, wide stdio and printf/scanf, wcsftime, locales, ARMv7 notes, and the complete library written from scratch and tested against glibc.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;500;700&family=Bricolage+Grotesque:wght@600;700;800&display=swap">
<style>
/* base.css — layout and components shared by every course: one mobile-first column that widens on tablets
   and PCs, a lesson path, a bottom tab bar and a full-screen lesson player. Colours and display fonts come
   from each course's theme.css (tokens only); sizes scale with the Display setting (CSS zoom on body). */
:root {
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 12px;
  --nav-h: 62px;
  --zoom: 1;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
code, .mono { font-family: var(--font-mono); font-size: .92em; }
code { background: var(--line-2); padding: .05em .35em; border-radius: 5px; white-space: nowrap; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.15; text-wrap: balance; margin: 0; letter-spacing: .01em; }
p { margin: 0; }
a { color: var(--brand); }
.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); }
.small { font-size: 13px; }
.tnum { font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.grow { flex: 1; min-width: 0; }
.eyebrow { font-family: var(--font-display); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }

/* field colour chips */
.fc { font-family: var(--font-mono); font-size: .85em; padding: .05em .4em; border-radius: 5px; white-space: nowrap; font-weight: 500; }
.fc-op { background: var(--f-op-2); color: var(--f-op); } .fc-rd { background: var(--f-rd-2); color: var(--f-rd); }
.fc-f3 { background: var(--f-f3-2); color: var(--f-f3); } .fc-rs1 { background: var(--f-rs1-2); color: var(--f-rs1); }
.fc-rs2 { background: var(--f-rs2-2); color: var(--f-rs2); } .fc-f7 { background: var(--f-f7-2); color: var(--f-f7); }
.fc-imm { background: var(--f-imm-2); color: var(--f-imm); }

/* ---------- shell ---------- */
.shell { min-height: 100%; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface);
  border-bottom: 1px solid var(--line-2);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.topbar-in { max-width: 720px; margin: 0 auto; height: 54px; display: flex; align-items: center; gap: 12px; }
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--font-display); font-weight: 800; font-size: 21px; letter-spacing: .02em; white-space: nowrap; min-width: 0; }
.brand-mark { width: 26px; height: 26px; }
.brand small { font-family: var(--font-mono); font-size: 10.5px; font-weight: 500; color: var(--ink-3); letter-spacing: .04em; margin-left: 2px; }
.top-stats { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.pill { display: inline-flex; align-items: center; gap: 5px; height: 30px; padding: 0 10px; border-radius: 999px; background: var(--card); border: 1px solid var(--line-2); font-weight: 700; font-size: 13.5px; font-variant-numeric: tabular-nums; }
.pill svg { width: 16px; height: 16px; }
.pill.gold { color: var(--gold); }
.pill.hot { color: var(--f-f3); }
.main {
  flex: 1; width: 100%; max-width: 720px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom, 0px));
}
.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--line-2);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px));
}
.nav-in { max-width: 720px; margin: 0 auto; height: var(--nav-h); display: grid; grid-template-columns: repeat(5, 1fr); }
.nav button { background: none; border: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--ink-3); font-size: 11.5px; font-weight: 700; letter-spacing: .02em; border-radius: 10px; }
.nav button svg { width: 24px; height: 24px; }
.nav button[aria-current="page"] { color: var(--brand); }
.nav button[aria-current="page"] svg { filter: drop-shadow(0 2px 6px color-mix(in srgb, var(--brand) 40%, transparent)); }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 18px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--card); font-weight: 700; letter-spacing: .01em;
  box-shadow: 0 2px 0 var(--line); transition: transform .08s ease, box-shadow .08s ease, background .15s;
}
.btn:active { transform: translateY(2px); box-shadow: 0 0 0 var(--line); }
.btn.primary { background: var(--brand); color: var(--brand-ink); border-color: transparent; box-shadow: 0 3px 0 color-mix(in srgb, var(--brand) 55%, #000); }
.btn.primary:active { box-shadow: 0 0 0 transparent; }
.btn.gold { background: var(--gold); color: var(--gold-ink); border-color: transparent; box-shadow: 0 3px 0 color-mix(in srgb, var(--gold) 55%, #000); }
.btn.ok { background: var(--ok); color: #fff; border-color: transparent; box-shadow: 0 3px 0 color-mix(in srgb, var(--ok) 55%, #000); }
.btn.bad { background: var(--bad); color: #fff; border-color: transparent; box-shadow: 0 3px 0 color-mix(in srgb, var(--bad) 55%, #000); }
.btn.ghost { background: transparent; box-shadow: none; border-color: var(--line); }
.btn.small { min-height: 36px; padding: 0 12px; font-size: 13.5px; border-radius: 10px; }
.btn.wide { width: 100%; }
.btn[disabled] { opacity: .45; cursor: not-allowed; transform: none; }
.iconbtn { width: 40px; height: 40px; border-radius: 10px; border: 0; background: transparent; display: grid; place-items: center; color: var(--ink-2); }
.iconbtn svg { width: 22px; height: 22px; }

/* ---------- learn path ---------- */
.hello { display: flex; gap: 14px; align-items: center; margin-bottom: 18px; }
.goal-ring { width: 54px; height: 54px; flex: none; }
.hello h1 { font-size: 22px; }
.unit { margin: 0 0 30px; }
.unit-head {
  position: relative; border-radius: 16px; padding: 16px 16px 14px; color: var(--ink); background: var(--card);
  border: 1px solid var(--line-2); overflow: hidden; box-shadow: var(--shadow);
}
.unit-head::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 6px; background: var(--uc); }
.unit-head .eyebrow { color: var(--uc); }
.unit-head h2 { font-size: 21px; margin: 4px 0 4px; }
.unit-head p { color: var(--ink-2); font-size: 14px; max-width: 60ch; }
.unit-meter { display: flex; align-items: center; gap: 10px; margin-top: 10px; font-size: 12.5px; color: var(--ink-3); font-weight: 700; }
.meter { flex: 1; height: 8px; border-radius: 99px; background: var(--line-2); overflow: hidden; }
.meter > i { display: block; height: 100%; background: var(--gold); border-radius: 99px; transition: width .4s ease; }
.die-stamp { position: absolute; right: 12px; top: 12px; font-family: var(--font-mono); font-size: 10px; color: var(--ink-3); letter-spacing: .06em; text-align: right; line-height: 1.3; }
.path { position: relative; margin: 6px auto 0; width: 100%; max-width: 360px; }
.path svg.trace { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.node-wrap { position: absolute; width: 136px; margin-left: -68px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.node {
  width: 64px; height: 64px; border-radius: 16px; border: 2px solid var(--line); background: var(--card); display: grid; place-items: center;
  box-shadow: 0 4px 0 var(--line); transition: transform .1s; position: relative; color: var(--ink-3);
}
.node svg { width: 28px; height: 28px; }
.node:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.node.done { background: var(--gold); border-color: transparent; color: var(--gold-ink); box-shadow: 0 4px 0 color-mix(in srgb, var(--gold) 55%, #000); }
.node.current { background: var(--brand); border-color: transparent; color: var(--brand-ink); box-shadow: 0 4px 0 color-mix(in srgb, var(--brand) 55%, #000); }
.node.current::after { content: ""; position: absolute; inset: -9px; border-radius: 22px; border: 3px solid var(--brand); opacity: .5; animation: ring 1.8s ease-out infinite; }
.node.locked { opacity: .55; cursor: not-allowed; }
.node.check { width: 78px; border-radius: 20px; }
.node-label { font-size: 12px; font-weight: 700; text-align: center; line-height: 1.2; color: var(--ink-2); max-width: 136px; text-wrap: balance; }
.node-stars { display: flex; gap: 1px; height: 12px; }
.node-stars svg { width: 12px; height: 12px; color: var(--gold); }
.start-tip { position: absolute; top: -30px; background: var(--card); border: 2px solid var(--brand); color: var(--brand); font-weight: 800; font-size: 12px; padding: 2px 10px; border-radius: 8px; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; animation: bob 1.6s ease-in-out infinite; }
@keyframes ring { 0% { transform: scale(.9); opacity: .6; } 100% { transform: scale(1.15); opacity: 0; } }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }

/* ---------- player ---------- */
.player { position: fixed; inset: 0; z-index: 60; background: var(--bg); display: flex; flex-direction: column; }
.p-top {
  flex: none; display: flex; align-items: center; gap: 10px; height: 56px; background: var(--bg);
  padding-top: env(safe-area-inset-top, 0px); box-sizing: content-box;
  padding-left: max(10px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.p-progress { flex: 1; height: 14px; border-radius: 99px; background: var(--line-2); overflow: hidden; }
.p-progress > i { display: block; height: 100%; background: var(--gold); border-radius: 99px; transition: width .35s ease; box-shadow: inset 0 -4px 0 rgba(0,0,0,.08), inset 0 3px 0 rgba(255,255,255,.35); }
.combo { font-family: var(--font-display); font-weight: 700; color: var(--f-f3); font-size: 15px; min-width: 38px; text-align: right; font-variant-numeric: tabular-nums; }
.p-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.p-body-in {
  max-width: 680px; margin: 0 auto; padding-block: 8px 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 16px;
}
.p-foot {
  flex: none; border-top: 1px solid var(--line-2); background: var(--surface); position: relative;
  padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.p-foot-in { max-width: 680px; margin: 0 auto; display: flex; gap: 10px; }
.p-foot-in .btn { flex: 1; }
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; transform: translateY(102%); transition: transform .25s cubic-bezier(.2,.8,.2,1);
  padding-block: 14px calc(12px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-top: 2px solid; max-height: calc(62vh / var(--zoom, 1)); overflow-y: auto;
}
.sheet.show { transform: translateY(0); }
.sheet.ok { background: var(--ok-2); border-color: var(--ok); }
.sheet.bad { background: var(--bad-2); border-color: var(--bad); }
.sheet-in { max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
.sheet h3 { font-size: 20px; display: flex; align-items: center; gap: 8px; }
.sheet.ok h3 { color: var(--ok); } .sheet.bad h3 { color: var(--bad); }
.sheet .why { color: var(--ink); font-size: 14.5px; }
.sheet .answer { font-size: 14px; color: var(--ink); }
.sheet .answer b { color: var(--bad); }
.kind-tag { font-family: var(--font-display); font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
.qtext { font-size: 18px; font-weight: 700; line-height: 1.38; }
.qtext code { font-size: .86em; white-space: normal; overflow-wrap: anywhere; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.learn h2 { font-size: 23px; }
.learn .body { font-size: 15.5px; color: var(--ink); display: flex; flex-direction: column; gap: 10px; }
.learn .body ul, .learn .body ol { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 4px; }
.learn .body ol li::marker { font-weight: 700; color: var(--brand); }
.body pre.code { margin: 2px 0; }
.spec {
  display: flex; gap: 8px; align-items: flex-start; font-size: 12.5px; color: var(--ink-2); background: var(--surface); border: 1px dashed var(--line);
  border-radius: 10px; padding: 8px 10px;
}
.spec svg { flex: none; width: 16px; height: 16px; margin-top: 2px; color: var(--ink-3); }
.hint { font-size: 13px; color: var(--ink-3); }
.shake { animation: shake .35s; }
@keyframes shake { 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }
.pop { animation: pop .3s; }
@keyframes pop { 50% { transform: scale(1.04); } }

/* ---------- exercise widgets ---------- */
.opts { display: grid; gap: 10px; }
.opts.two { grid-template-columns: 1fr 1fr; }
.opt {
  text-align: left; min-height: 50px; padding: 11px 14px; border-radius: 12px; border: 2px solid var(--line); background: var(--card);
  box-shadow: 0 3px 0 var(--line); font-size: 15px; display: flex; gap: 10px; align-items: center; line-height: 1.35;
}
.opt .k { flex: none; width: 24px; height: 24px; border-radius: 7px; border: 1.5px solid var(--line); display: grid; place-items: center; font-size: 12px; font-weight: 700; color: var(--ink-3); font-family: var(--font-mono); }
.opt[aria-pressed="true"] { border-color: var(--brand); background: var(--brand-2); box-shadow: 0 3px 0 var(--brand); }
.opt[aria-pressed="true"] .k { border-color: var(--brand); color: var(--brand); }
.opt.right { border-color: var(--ok); background: var(--ok-2); box-shadow: 0 3px 0 var(--ok); }
.opt.wrong { border-color: var(--bad); background: var(--bad-2); box-shadow: 0 3px 0 var(--bad); }
.opt:disabled { cursor: default; }
.opt code { white-space: normal; overflow-wrap: anywhere; }
.tfrow { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tfrow .opt { justify-content: center; font-weight: 700; font-size: 17px; min-height: 64px; }
.numwrap { display: flex; gap: 10px; align-items: center; }
.num {
  flex: 1; min-width: 0; height: 54px; border-radius: 12px; border: 2px solid var(--line); background: var(--card); padding: 0 14px;
  font-family: var(--font-mono); font-size: 20px; font-weight: 500;
}
.num:focus { border-color: var(--brand); outline: none; }
.num.right { border-color: var(--ok); background: var(--ok-2); } .num.wrong { border-color: var(--bad); background: var(--bad-2); }
.unit-label { font-weight: 700; color: var(--ink-2); }
.bits { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; }
.bitgrp { display: flex; gap: 3px; }
.bit {
  width: 34px; height: 44px; border-radius: 9px; border: 2px solid var(--line); background: var(--card); font-family: var(--font-mono);
  font-size: 18px; font-weight: 700; display: grid; place-items: center; color: var(--ink-3); box-shadow: 0 3px 0 var(--line); position: relative;
}
.bit.on { background: var(--brand); color: var(--brand-ink); border-color: transparent; box-shadow: 0 3px 0 color-mix(in srgb, var(--brand) 55%, #000); }
.bit small { position: absolute; top: -17px; font-size: 10px; color: var(--ink-3); font-weight: 500; }
.bit.locked { opacity: .5; cursor: default; }
.bits.dense .bit { width: 22px; height: 34px; font-size: 14px; border-radius: 6px; }
.bits.dense .bit small { font-size: 9px; top: -15px; }
.bitval { text-align: center; font-family: var(--font-mono); font-size: 14px; color: var(--ink-2); margin-top: 6px; }
.chipbank, .slots { display: flex; flex-wrap: wrap; gap: 8px; }
.slots { min-height: 56px; padding: 10px; border-radius: 12px; border: 2px dashed var(--line); background: var(--surface); }
.slots.vertical { flex-direction: column; }
.chip {
  border: 2px solid var(--line); background: var(--card); border-radius: 10px; padding: 8px 12px; font-weight: 700; font-size: 14.5px;
  box-shadow: 0 3px 0 var(--line); text-align: left; line-height: 1.3;
}
.chip.used { visibility: hidden; }
.chip.placed { border-color: var(--brand); background: var(--brand-2); box-shadow: 0 3px 0 var(--brand); }
.chip.right { border-color: var(--ok); background: var(--ok-2); box-shadow: 0 3px 0 var(--ok); }
.chip.wrong { border-color: var(--bad); background: var(--bad-2); box-shadow: 0 3px 0 var(--bad); }
.chip code { white-space: normal; }
.slot-n { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 6px; background: var(--brand); color: var(--brand-ink); font-size: 11px; margin-right: 6px; font-family: var(--font-mono); }
.match { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.match .col { display: flex; flex-direction: column; gap: 8px; }
.match .chip { width: 100%; min-height: 46px; }
.match .chip.sel { border-color: var(--brand); background: var(--brand-2); box-shadow: 0 3px 0 var(--brand); }
.match .chip.done { opacity: .35; border-color: var(--ok); cursor: default; }
.fill { font-size: 17px; line-height: 2.3; font-weight: 600; }
.blank { display: inline-flex; min-width: 70px; height: 36px; padding: 0 10px; align-items: center; justify-content: center; border-radius: 9px; border: 2px dashed var(--brand); background: var(--brand-2); color: var(--brand); font-family: var(--font-mono); font-size: 15px; vertical-align: middle; margin: 0 2px; }
.blank.empty { color: transparent; }
.blank.right { border-style: solid; border-color: var(--ok); background: var(--ok-2); color: var(--ok); }
.blank.wrong { border-style: solid; border-color: var(--bad); background: var(--bad-2); color: var(--bad); }
.sig-list { display: flex; flex-direction: column; gap: 8px; }
.sig { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.sig .nm { font-family: var(--font-mono); font-weight: 700; font-size: 13.5px; width: 76px; }
.seg { display: inline-flex; border: 2px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--card); flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 7px 11px; font-weight: 700; font-size: 13.5px; font-family: var(--font-mono); color: var(--ink-2); border-right: 1px solid var(--line-2); min-height: 36px; }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--brand); color: var(--brand-ink); }
.seg.text button { font-family: var(--font-body); }
.seg.right { border-color: var(--ok); } .seg.wrong { border-color: var(--bad); }
.splitter { display: flex; flex-direction: column; gap: 10px; }
.split-ctl { display: flex; align-items: center; gap: 10px; }
.split-ctl .nm { width: 64px; font-weight: 700; }
.stepper { display: inline-flex; align-items: center; border: 2px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--card); }
.stepper button { width: 40px; height: 38px; border: 0; background: transparent; font-size: 20px; font-weight: 700; color: var(--ink-2); }
.stepper span { min-width: 40px; text-align: center; font-family: var(--font-mono); font-weight: 700; font-size: 16px; }
.hotspot-hint { font-size: 13px; color: var(--ink-3); text-align: center; }

/* ---------- figures ---------- */
.fig { margin: 0; display: flex; flex-direction: column; gap: 8px; }
.fig-box { background: var(--card); border: 1px solid var(--line-2); border-radius: 14px; padding: 12px; overflow-x: auto; }
.fig-box.flush { padding: 0; }
.fig svg { display: block; width: 100%; height: auto; max-width: 600px; margin: 0 auto; overflow: visible; }
.fig svg.wide { min-width: 340px; }
.fig figcaption { font-size: 13px; color: var(--ink-2); padding: 0 2px; }

.svg-hot { cursor: pointer; }
/* drawings set their colours inline, so the interaction states must win with !important */
.svg-hot:hover rect, .svg-hot:hover path, .svg-hot:hover circle, .svg-hot:hover polygon { stroke: var(--brand) !important; }
.svg-hot.picked rect, .svg-hot.picked path, .svg-hot.picked polygon, .svg-hot.picked circle { stroke: var(--brand) !important; stroke-width: 3 !important; }
.svg-hot.right rect, .svg-hot.right path, .svg-hot.right polygon, .svg-hot.right circle { stroke: var(--ok) !important; stroke-width: 3 !important; }
.svg-hot.wrong rect, .svg-hot.wrong path, .svg-hot.wrong polygon, .svg-hot.wrong circle { stroke: var(--bad) !important; stroke-width: 3 !important; }
.svg-hot.picked, .svg-hot.right, .svg-hot.wrong { opacity: 1 !important; }
.flow-dash { stroke-dasharray: 6 5; animation: flow 1s linear infinite; }

.tbl-wrap { overflow-x: auto; border: 1px solid var(--line-2); border-radius: 12px; background: var(--card); }
table.t { border-collapse: collapse; width: 100%; font-size: 13.5px; }
table.t th, table.t td { padding: 7px 10px; border-bottom: 1px solid var(--line-2); text-align: left; vertical-align: top; }
table.t th { font-family: var(--font-display); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); background: var(--surface); position: sticky; top: 0; white-space: nowrap; }
table.t tr:last-child td { border-bottom: 0; }

/* ---------- end screen ---------- */

.tile { border-radius: 14px; border: 2px solid var(--line-2); background: var(--card); padding: 10px 8px; }
.tile .v { font-family: var(--font-display); font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
.tile .l { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); }
.tile.gold .v { color: var(--gold); } .tile.ok .v { color: var(--ok); } .tile.brand .v { color: var(--brand); }
.big-stars { display: flex; gap: 6px; }
.big-stars svg { width: 44px; height: 44px; color: var(--line); }
.big-stars svg.on { color: var(--gold); animation: pop .4s backwards; }

/* ---------- sections, cards ---------- */
.section-title { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 6px 0 12px; }
.section-title h2 { font-size: 22px; }
.cards { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); }
.card {
  background: var(--card); border: 1px solid var(--line-2); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 8px;
  box-shadow: var(--shadow); min-width: 0;
}
button.card { text-align: left; cursor: pointer; }
.card h3 { font-size: 17px; }
.card .ic { width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center; background: var(--brand-2); color: var(--brand); flex: none; }
.card .ic svg { width: 22px; height: 22px; }
.card-row { display: flex; gap: 12px; align-items: center; }
.tag { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 6px; font-size: 11.5px; font-weight: 700; background: var(--line-2); color: var(--ink-2); letter-spacing: .02em; }
.tag.gold { background: var(--gold-2); color: var(--gold); }
.tag.ok { background: var(--ok-2); color: var(--ok); }

.back { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; color: var(--ink-2); font-weight: 700; padding: 6px 0; margin-bottom: 6px; }

.lab-head { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.lab-head h2 { font-size: 24px; }
.panel { background: var(--card); border: 1px solid var(--line-2); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.build-list { display: grid; gap: 8px; }
@media (min-width: 760px) { .build-list { grid-template-columns: 1fr 1fr; } }
.build-item { background: var(--card); border: 1px solid var(--line-2); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.build-item h4 { margin: 0; font-size: 15px; }
.bl-row { display: flex; gap: 10px; font-size: 13.5px; line-height: 1.4; min-width: 0; }
.bl-k { flex: none; width: 46px; padding-top: 2px; font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.panel h3 { font-size: 15px; letter-spacing: .02em; }
.ctrl-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.ctrl-row label { font-size: 13px; font-weight: 700; color: var(--ink-2); }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field > span { font-size: 12px; font-weight: 700; color: var(--ink-3); letter-spacing: .04em; text-transform: uppercase; }
select.sel, input.txt {
  height: 40px; border-radius: 10px; border: 2px solid var(--line); background: var(--card); padding: 0 10px; font-weight: 700; font-size: 14px; min-width: 0;
}
input.txt { font-family: var(--font-mono); font-weight: 500; }
textarea.code {
  width: 100%; min-height: 170px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); padding: 10px 12px;
  font-family: var(--font-mono); font-size: 13px; line-height: 1.55; resize: vertical; white-space: pre; overflow-x: auto;
}
textarea.code:focus, select.sel:focus, input.txt:focus { border-color: var(--brand); outline: none; }
.err { color: var(--bad); font-size: 13px; font-weight: 700; }
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line-2); border-radius: 12px; padding: 8px 10px; }
.stat .v { font-family: var(--font-display); font-weight: 700; font-size: 20px; font-variant-numeric: tabular-nums; }
.stat .l { font-size: 11px; font-weight: 700; color: var(--ink-3); text-transform: uppercase; letter-spacing: .06em; }
.stat.good .v { color: var(--ok); } .stat.warnc .v { color: var(--f-rs2); } .stat.badc .v { color: var(--bad); }
.notes { display: flex; flex-direction: column; gap: 8px; }
.note { display: flex; gap: 8px; font-size: 13.5px; padding: 8px 10px; border-radius: 10px; background: var(--surface); border-left: 4px solid var(--line); }
.note.warn { border-left-color: var(--f-rs2); } .note.good { border-left-color: var(--ok); } .note.fix { border-left-color: var(--brand); } .note.info { border-left-color: var(--ink-3); }
.scrub { width: 100%; accent-color: var(--brand); }
.toggle { position: relative; width: 50px; height: 30px; flex: none; }
.toggle input { opacity: 0; position: absolute; inset: 0; margin: 0; cursor: pointer; z-index: 1; }
.toggle i { position: absolute; inset: 0; border-radius: 99px; background: var(--line); transition: background .15s; }
.toggle i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--card); transition: transform .15s; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
.toggle input:checked + i { background: var(--brand); }
.toggle input:checked + i::after { transform: translateX(20px); }
.toggle input:focus-visible + i { outline: 2px solid var(--brand); outline-offset: 2px; }
.setting { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line-2); }
.setting:last-child { border-bottom: 0; }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 10px; }
.badge { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; font-size: 12px; font-weight: 700; color: var(--ink-2); }
.badge .b { width: 62px; height: 62px; }
.badge.off { opacity: .4; filter: grayscale(1); }
.search { width: 100%; height: 44px; border-radius: 12px; border: 2px solid var(--line); background: var(--card); padding: 0 14px; font-size: 15px; }
.search:focus { border-color: var(--brand); outline: none; }
.gloss dt { font-weight: 700; font-family: var(--font-display); font-size: 16px; }
.gloss dd { margin: 2px 0 12px; color: var(--ink-2); font-size: 14px; }
.reg-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.reg { border-radius: 9px; padding: 6px 4px; text-align: center; border: 1px solid var(--line-2); background: var(--surface); font-family: var(--font-mono); font-size: 12px; line-height: 1.25; min-width: 0; }
.reg b { display: block; font-size: 13px; }
.reg.changed { background: var(--gold-2); border-color: var(--gold); }
.toast { position: fixed; left: 50%; bottom: calc(var(--nav-h) + 18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px); opacity: 0; transition: all .25s; z-index: 90; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 700; font-size: 14px; pointer-events: none; max-width: calc(100% - 32px); text-align: center; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.confirm { display: flex; flex-direction: column; gap: 10px; padding: 12px; border: 2px solid var(--bad); border-radius: 12px; background: var(--bad-2); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12px; color: var(--ink-2); justify-content: center; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.cyclebar { display: flex; align-items: center; gap: 8px; }
.cyclebar .btn { min-height: 36px; padding: 0 10px; }
.timeline { display: flex; flex-wrap: wrap; gap: 3px; }
.timeline i { width: 16px; height: 22px; border-radius: 4px; display: grid; place-items: center; font-style: normal; font-size: 10px; font-weight: 700; font-family: var(--font-mono); }
.timeline i.ok { background: var(--ok-2); color: var(--ok); } .timeline i.no { background: var(--bad-2); color: var(--bad); }
.timeline i.cur { outline: 2px solid var(--brand); }

@media (min-width: 900px) {
  .main { max-width: 860px; }
  .topbar-in, .nav-in { max-width: 860px; }
  .two-col { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; align-items: start; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
.part-head { margin: 28px 0 16px; padding: 12px 14px; border-radius: 12px; background: var(--surface); border: 1px dashed var(--line); display: flex; flex-direction: column; gap: 4px; }
.part-head .eyebrow { color: var(--brand); font-size: 13px; }
.node-stars svg.off { color: var(--line); }
.console { background: var(--term-bg); color: var(--term-ink); border: 1px solid var(--line); border-radius: 12px; padding: 12px; font-family: var(--font-mono); font-size: 12px; line-height: 1.5; white-space: pre; overflow-x: auto; min-height: 64px; max-height: 280px; overflow-y: auto; }
.console .cursor { display: inline-block; width: 8px; height: 15px; background: var(--gold); vertical-align: -2px; animation: blink 1s steps(2) infinite; }
@keyframes blink { to { opacity: 0; } }
pre.code { margin: 0; background: var(--surface); border: 1px solid var(--line-2); border-radius: 12px; padding: 10px 12px; font-family: var(--font-mono); font-size: 12px; line-height: 1.5; overflow-x: auto; max-height: 320px; tab-size: 4; }
.banner { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 12px; font-weight: 700; font-size: 14px; }
.banner svg { width: 20px; height: 20px; flex: none; }
.banner.pass { background: var(--ok-2); color: var(--ok); } .banner.fail { background: var(--bad-2); color: var(--bad); } .banner.info { background: var(--brand-2); color: var(--brand); } .banner.warn { background: var(--gold-2); color: var(--gold); }
.evlist { display: flex; flex-direction: column; gap: 6px; max-height: 280px; overflow-y: auto; }
.ev { display: flex; gap: 8px; align-items: baseline; font-size: 13px; padding: 6px 8px; border-radius: 8px; background: var(--surface); }
.ev .n { font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); min-width: 44px; }
.ev .m { font-family: var(--font-mono); font-size: 11.5px; font-weight: 700; padding: 1px 6px; border-radius: 5px; white-space: nowrap; }
.mode-M { background: var(--f-f3-2); color: var(--f-f3); } .mode-S { background: var(--f-rs1-2); color: var(--f-rs1); } .mode-U { background: var(--f-rd-2); color: var(--f-rd); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { border: 1.5px solid var(--line); background: var(--card); border-radius: 8px; padding: 5px 9px; font-family: var(--font-mono); font-size: 12.5px; font-weight: 500; }
.chips button[aria-pressed="true"] { border-color: var(--brand); background: var(--brand-2); color: var(--brand); }
.tile-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px; }
.kv dt { color: var(--ink-3); font-weight: 700; }
.kv dd { margin: 0; font-family: var(--font-mono); }
.btn svg { width: 18px; height: 18px; flex: none; }
.sheet h3 svg { width: 24px; height: 24px; flex: none; }
.bits { padding-top: 16px; }
.fig pre.code { max-height: none; }
.hl-line { display: block; background: var(--gold-2); margin: 0 -12px; padding: 0 12px; }
.plain-line { display: block; }
/* program source under a firmware run */
.src-details { margin-top: 8px; }
.src-details > summary { cursor: pointer; font-weight: 700; font-size: 13px; color: var(--brand); padding: 6px 0; list-style-position: inside; }
.fig .src-details pre.code { max-height: 420px; overflow: auto; margin-top: 6px; }

/* ---------- lab widgets ---------- */
.stats.tight { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 6px; }

.stats.tight .stat .l { letter-spacing: .04em; }
.slider { display: flex; flex-direction: column; gap: 2px; min-width: 0; }

.studio-h { font-size: 18px; margin-top: 8px; }
.ev .m.ev-thermal { background: var(--gold-2); color: var(--gold); }
.ev .m.ev-error { background: var(--bad-2); color: var(--bad); }
.ref-figure { margin-top: 4px; }

@media (max-width: 440px) { .brand small { display: none; } .brand { font-size: 18px; } .multi .brand-name { font-size: 17px; } .top-stats { gap: 4px; } .top-stats .pill { padding: 0 8px; } }

/* ---------- display: size and full screen ---------- */
.view-panel {
  position: fixed; z-index: 95; top: calc(env(safe-area-inset-top, 0px) + 56px); right: max(10px, env(safe-area-inset-right, 0px));
  width: min(320px, calc(100vw / var(--zoom, 1) - 20px)); background: var(--card); color: var(--ink); border: 1px solid var(--line);

}

.p-top .p-view { flex: none; }

/* ---------- course switcher (several courses in one app) ---------- */
.course-switch { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 0 0 18px; }
.cs-btn {
  display: flex; flex-direction: column; align-items: flex-start; gap: 4px; min-width: 0; text-align: left; padding: 9px 10px 10px;
  border-radius: 14px; border: 2px solid var(--line-2); background: var(--card); color: var(--ink); box-shadow: 0 3px 0 var(--line-2);
}

.cs-top { display: flex; align-items: center; gap: 6px; width: 100%; }

.cs-meter > i { display: block; height: 100%; background: var(--gold); }
.course-tag { color: var(--brand); }
.me-h { margin: 22px 0 10px; font-size: 17px; display: flex; align-items: center; gap: 8px; }
.me-h .brand-mark { width: 22px; height: 22px; flex: none; }
.me-badges { margin: 0 0 10px; }
.me-badges > summary { cursor: pointer; font-weight: 700; font-size: 13.5px; color: var(--brand); padding: 4px 0 10px; }
.brand-name { overflow: hidden; text-overflow: ellipsis; }
.brand-stack { display: flex; align-items: center; gap: 8px; min-width: 0; }
.brand-tag { flex: none; font-family: var(--font-body); font-size: 11px; font-weight: 700; letter-spacing: .06em; line-height: 1; padding: 4px 6px; border-radius: 6px; background: var(--brand); color: var(--brand-ink); }
@media (max-width: 440px) {
  .brand-stack { flex-direction: column; align-items: flex-start; gap: 2px; }

}
@media (max-width: 380px) { .multi .brand-stack .brand-name { font-size: 14px; } }

/* ---------- code exercises ---------- */
.goal-line { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; padding: 8px 10px; border-radius: 10px; background: var(--gold-2); color: var(--ink); }
.goal-line svg { width: 18px; height: 18px; flex: none; color: var(--gold); margin-top: 1px; }

  background: color-mix(in srgb, var(--line-2) 55%, var(--surface)); overflow: hidden; user-select: none; min-width: 34px;
}

  font-family: var(--font-mono); font-size: 12px; line-height: 1.6; white-space: pre; overflow: auto; tab-size: 4; min-height: 120px; color: var(--ink);
}

.code-bar { gap: 8px; }

/* ---------- wider screens: tablets and PCs ---------- */
@media (min-width: 1100px) {
  .main { max-width: 980px; }

}
.svg-hot:focus { outline: none; }
.svg-hot:focus-visible { outline: 2.5px solid var(--gold); outline-offset: 2px; }

/* ======== Lern2Wchar theme ======== */
/* Lern2Wchar theme: violet for wide characters and amber for multibyte bytes, on cool lavender in light mode and deep plum in dark mode. */
:root {
  --bg: #F0ECF5;
  --surface: #F8F5FB;
  --card: #FFFFFF;
  --ink: #1D1B17;
  --ink-2: #46413A;
  --ink-3: #6B655C;
  --line: #D4CBE0;
  --line-2: #E8E0F0;
  --brand: #6D28D9;
  --brand-2: #EDE9FE;
  --brand-ink: #FFFFFF;
  --gold: #B45309;
  --gold-2: #FDE68A;
  --gold-ink: #FFFFFF;
  --ok: #2B7F3E;
  --ok-2: #DCEEDF;
  --bad: #C0353F;
  --bad-2: #F7DCDE;
  --wire: #9C958A;
  --hot: #C7307A;
  --f-op: #2B7F3E;
  --f-rd: #1E5DBE;
  --f-f3: #C0353F;
  --f-rs1: #7841B3;
  --f-rs2: #A96500;
  --f-f7: #0B7A80;
  --f-imm: #B02E78;
  --f-op-2: #DCEEDF;
  --f-rd-2: #DEE7F7;
  --f-f3-2: #F7DCDE;
  --f-rs1-2: #ECE2F7;
  --f-rs2-2: #F6E9D3;
  --f-f7-2: #D3ECEC;
  --f-imm-2: #F5DDEA;

.fig-box.center { display: flex; justify-content: center; }

.test-row.bad { border-left-color: var(--bad); }
.test-row .ic { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 12px; flex: none; background: var(--ok-2); color: var(--ok); }
.test-row.bad .ic { background: var(--bad-2); color: var(--bad); }
.test-row .tx { min-width: 0; overflow-wrap: anywhere; }

.sl-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px 14px; }
.note.bad { border-left-color: var(--bad); }
.note.info { border-left-color: var(--brand); }
.tog { display: inline-flex; align-items: center; gap: 10px; font-weight: 700; font-size: 14px; cursor: pointer; }

.stage-tabs button { border: 1.5px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 6px 11px; font-size: 12.5px; font-weight: 700; cursor: pointer; }
.stage-tabs button[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }

.pick-pad { display: flex; flex-wrap: wrap; gap: 6px; }

      if (*fp == L'f' || *fp == L'g' || *fp == L'e') {\n                my_wchar_t num[128]; int ni = 0; my_wint_t c;\n                while ((c = sgetc(&sp, &pb, &has)) != MY_WEOF && (c == L' ' || c == L'\\t' || c == L'\\n')) ;\n                if (c == MY_WEOF) return assigned ? assigned : EOF;\n                while (c != MY_WEOF && ni < 127 && (width <= 0 || ni < width)) {\n                    if ((c >= L'0' && c <= L'9') || c == L'.' || c == L'+' || c == L'-' || c == L'e' || c == L'E') {\n                        num[ni++] = (my_wchar_t)c; c = sgetc(&sp, &pb, &has);\n                    } else { sputback(&sp, c, &pb, &has); break; }\n                }\n                num[ni] = 0;\n                if (!suppress) {\n                    float *out = va_arg(ap, float *);\n                    *out = my_wcstof(num, NULL);\n                    assigned++;\n                }\n                continue;\n            }\n            return assigned;\n        }\n    }\n    return assigned;\n}\n\nint my_vswscanf(const my_wchar_t *buf, const my_wchar_t *fmt, va_list ap)\n{\n    return vswscanf_core(buf, fmt, ap);\n}\nint my_swscanf(const my_wchar_t *buf, const my_wchar_t *fmt, ...)\n{ va_list ap; int r; va_start(ap, fmt); r = my_vswscanf(buf, fmt, ap); va_end(ap); return r; }\n\n/* File scanf: read whole remaining stream into a buffer (bounded) — educational. */\nint my_vfwscanf(FILE *fp, const my_wchar_t *fmt, va_list ap)\n{\n    my_wchar_t buf[4096]; size_t n = 0; my_wint_t c;\n    while (n + 1 < 4096 && (c = my_fgetwc(fp)) != MY_WEOF) buf[n++] = (my_wchar_t)c;\n    buf[n] = 0;\n    return my_vswscanf(buf, fmt, ap);\n}\nint my_fwscanf(FILE *fp, const my_wchar_t *fmt, ...)\n{ va_list ap; int r; va_start(ap, fmt); r = my_vfwscanf(fp, fmt, ap); va_end(ap); return r; }\nint my_vwscanf(const my_wchar_t *fmt, va_list ap) { return my_vfwscanf(stdin, fmt, ap); }\nint my_wscanf(const my_wchar_t *fmt, ...)\n{ va_list ap; int r; va_start(ap, fmt); r = my_vwscanf(fmt, ap); va_end(ap); return r; }\n\n/* ---------- wcsftime ---------- */\nsize_t my_wcsftime(my_wchar_t *buf, size_t max, const my_wchar_t *fmt, const struct tm *tm)\n{\n    /* Convert format to multibyte, call strftime, convert back. */\n    char mfmt[512], mbuf[1024];\n    const my_wchar_t *fs = fmt;\n    size_t n;\n    if (my_wcsrtombs(mfmt, &fs, sizeof mfmt, NULL) == (size_t)-1) return 0;\n    n = strftime(mbuf, sizeof mbuf, mfmt, tm);\n    if (!n && mbuf[0]) return 0;\n    {\n        const char *ms = mbuf;\n        size_t wn = my_mbsrtowcs(buf, &ms, max ? max - 1 : 0, NULL);\n        if (wn == (size_t)-1) return 0;\n        if (max) buf[wn] = 0;\n        return wn;\n    }\n}\n",
  test: "/* test.c — compare my_* against glibc <wchar.h> for every symbol class. */\n#define _GNU_SOURCE\n#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n#include <wchar.h>\n#include <errno.h>\n#include <locale.h>\n#include \"mywchar.h\"\n\nstatic int fails;\n\nstatic void expect_i(const char *name, long long g, long long w)\n{\n    if (g != w) { printf(\"FAIL %s: got %lld want %lld\\n\", name, g, w); fails++; }\n    else printf(\"ok %s\\n\", name);\n}\nstatic void expect_s(const char *name, const my_wchar_t *g, const wchar_t *w)\n{\n    size_t i;\n    for (i = 0; g[i] || w[i]; i++) {\n        if ((wchar_t)g[i] != w[i]) {\n            printf(\"FAIL %s at %zu: got %d want %d\\n\", name, i, (int)g[i], (int)w[i]);\n            fails++; return;\n        }\n    }\n    printf(\"ok %s\\n\", name);\n}\n\nint main(void)\n{\n    setlocale(LC_ALL, \"C.UTF-8\");\n\n    /* macros / types */\n    expect_i(\"WEOF\", (long long)MY_WEOF, (long long)WEOF);\n    expect_i(\"WCHAR_MAX\", (long long)MY_WCHAR_MAX, (long long)WCHAR_MAX);\n    expect_i(\"sizeof wchar\", (long long)sizeof(my_wchar_t), (long long)sizeof(wchar_t));\n    expect_i(\"sizeof wint\", (long long)sizeof(my_wint_t), (long long)sizeof(wint_t));\n\n    /* strings */\n    {\n        my_wchar_t a[32], b[32];\n        wchar_t wa[32], wb[32];\n        my_wcscpy(a, L\"hello\"); wcscpy(wa, L\"hello\");\n        expect_s(\"wcscpy\", a, wa);\n        expect_i(\"wcslen\", (long long)my_wcslen(a), (long long)wcslen(wa));\n        my_wcscat(a, L\"!\"); wcscat(wa, L\"!\");\n        expect_s(\"wcscat\", a, wa);\n        my_wcsncpy(b, L\"abcdef\", 3); b[3]=0;\n        wcsncpy(wb, L\"abcdef\", 3); wb[3]=0;\n        expect_s(\"wcsncpy3\", b, wb);\n        expect_i(\"wcscmp\", my_wcscmp(L\"ab\", L\"ac\"), wcscmp(L\"ab\", L\"ac\"));\n        expect_i(\"wcsncmp\", my_wcsncmp(L\"abc\", L\"abd\", 2), wcsncmp(L\"abc\", L\"abd\", 2));\n        expect_i(\"wcscasecmp\", my_wcscasecmp(L\"AbC\", L\"aBc\"), wcscasecmp(L\"AbC\", L\"aBc\"));\n        expect_i(\"wcsnlen\", (long long)my_wcsnlen(L\"abcdef\", 3), (long long)wcsnlen(L\"abcdef\", 3));\n        expect_i(\"wcslcpy\", (long long)my_wcslcpy(b, L\"xyz\", 3), (long long)wcslcpy(wb, L\"xyz\", 3));\n        expect_s(\"wcslcpy-dst\", b, wb);\n    }\n\n    /* search */\n    {\n        const my_wchar_t *s = L\"abracadabra\";\n        expect_i(\"wcschr\", my_wcschr(s, L'c') - s, wcschr((wchar_t*)L\"abracadabra\", L'c') - L\"abracadabra\");\n        expect_i(\"wcsrchr\", my_wcsrchr(s, L'a') - s, wcsrchr((wchar_t*)L\"abracadabra\", L'a') - L\"abracadabra\");\n        expect_i(\"wcsstr\", my_wcsstr(s, L\"cad\") - s, wcsstr((wchar_t*)L\"abracadabra\", L\"cad\") - L\"abracadabra\");\n        expect_i(\"wcscspn\", (long long)my_wcscspn(s, L\"cd\"), (long long)wcscspn(L\"abracadabra\", L\"cd\"));\n        expect_i(\"wcsspn\", (long long)my_wcsspn(L\"aaab\", L\"a\"), (long long)wcsspn(L\"aaab\", L\"a\"));\n    }\n\n    /* wmem */\n    {\n        my_wchar_t a[8], b[8];\n        my_wmemset(a, L'Z', 4); a[4]=0;\n        expect_i(\"wmemset\", a[0]==L'Z' && a[3]==L'Z' && a[4]==0, 1);\n        my_wmemcpy(b, a, 5);\n        expect_i(\"wmemcmp\", my_wmemcmp(a, b, 5), 0);\n        expect_i(\"wmemchr\", my_wmemchr(a, L'Z', 4) == a, 1);\n    }\n\n    /* conversions UTF-8 */\n    {\n        my_mbstate_t st = {0}; mbstate_t gst = {0};\n        my_wchar_t wc = 0; wchar_t gwc = 0;\n        const char *u = \"A\\xC3\\xA9\\xE2\\x82\\xAC\\xF0\\x9F\\x98\\x80\"; /* A é € 😀 */\n        size_t k, gk;\n        k = my_mbrtowc(&wc, u, 1, &st); gk = mbrtowc(&gwc, u, 1, &gst);\n        expect_i(\"mbrtowc-A\", (long long)k, (long long)gk);\n        expect_i(\"mbrtowc-Av\", (long long)wc, (long long)gwc);\n        st = (my_mbstate_t){0}; gst = (mbstate_t){0};\n        k = my_mbrtowc(&wc, u+1, 2, &st); gk = mbrtowc(&gwc, u+1, 2, &gst);\n        expect_i(\"mbrtowc-e\", (long long)wc, (long long)gwc);\n        {\n            char buf[8]; size_t n = my_wcrtomb(buf, 0x20AC, NULL);\n            char gbuf[8]; size_t gn = wcrtomb(gbuf, 0x20AC, NULL);\n            expect_i(\"wcrtomb-euro-n\", (long long)n, (long long)gn);\n            expect_i(\"wcrtomb-euro-b0\", (unsigned char)buf[0], (unsigned char)gbuf[0]);\n        }\n        expect_i(\"btowc-A\", (long long)my_btowc('A'), (long long)btowc('A'));\n        expect_i(\"btowc-neg\", (long long)my_btowc(0xE9), (long long)btowc(0xE9));\n        expect_i(\"wctob-A\", my_wctob(L'A'), wctob(L'A'));\n        expect_i(\"wctob-euro\", my_wctob(0x20AC), wctob(0x20AC));\n        expect_i(\"mbsinit\", my_mbsinit(NULL), mbsinit(NULL));\n    }\n\n    /* round-trip mbsrtowcs / wcsrtombs */\n    {\n        const char *src = \"café €\";\n        const char *p = src;\n        my_wchar_t wbuf[64];\n        wchar_t gwbuf[64];\n        const char *gp = src;\n        mbstate_t gst = {0}; my_mbstate_t st = {0};\n        size_t n = my_mbsrtowcs(wbuf, &p, 63, &st);\n        size_t gn = mbsrtowcs(gwbuf, &gp, 63, &gst);\n        expect_i(\"mbsrtowcs-n\", (long long)n, (long long)gn);\n        expect_s(\"mbsrtowcs\", wbuf, gwbuf);\n        {\n            char mbuf[64], gmbuf[64];\n            const my_wchar_t *wp = wbuf; const wchar_t *gwp = gwbuf;\n            size_t m = my_wcsrtombs(mbuf, &wp, 63, NULL);\n            size_t gm = wcsrtombs(gmbuf, &gwp, 63, NULL);\n            expect_i(\"wcsrtombs-n\", (long long)m, (long long)gm);\n            expect_i(\"wcsrtombs-eq\", strcmp(mbuf, gmbuf)==0, 1);\n        }\n    }\n\n    /* numeric */\n    {\n        my_wchar_t *e; wchar_t *ge;\n        expect_i(\"wcstol\", my_wcstol(L\"  -42xyz\", &e, 10), wcstol(L\"  -42xyz\", &ge, 10));\n        expect_i(\"wcstol-end\", e[0], ge[0]);\n        expect_i(\"wcstoul\", (long long)my_wcstoul(L\"ff\", NULL, 16), (long long)wcstoul(L\"ff\", NULL, 16));\n        expect_i(\"wcstod\", (long long)my_wcstod(L\"3.5\", NULL), (long long)wcstod(L\"3.5\", NULL));\n        expect_i(\"wcstoll\", my_wcstoll(L\"10000000000\", NULL, 10), wcstoll(L\"10000000000\", NULL, 10));\n    }\n\n    /* width */\n    expect_i(\"wcwidth-A\", my_wcwidth(L'A'), wcwidth(L'A'));\n    expect_i(\"wcwidth-NUL\", my_wcwidth(0), wcwidth(0));\n    expect_i(\"wcswidth\", my_wcswidth(L\"Hi\", 2), wcswidth(L\"Hi\", 2));\n\n    /* swprintf / swscanf */\n    {\n        my_wchar_t buf[64]; wchar_t gbuf[64];\n        int n = my_swprintf(buf, 64, L\"%ls %d\", L\"hi\", 7);\n        int gn = swprintf(gbuf, 64, L\"%ls %d\", L\"hi\", 7);\n        expect_i(\"swprintf-n\", n, gn);\n        expect_s(\"swprintf\", buf, gbuf);\n        {\n            int a = 0, ga = 0; my_wchar_t s[16], gs[16];\n            my_swscanf(L\"xyz 42\", L\"%ls %d\", s, &a);\n            swscanf(L\"xyz 42\", L\"%ls %d\", gs, &ga);\n            expect_i(\"swscanf-d\", a, ga);\n            expect_s(\"swscanf-s\", s, gs);\n        }\n    }\n\n    /* wcsftime */\n    {\n        struct tm tm = {0}; tm.tm_year = 125; tm.tm_mon = 0; tm.tm_mday = 2; /* 2025-01-02 */\n        my_wchar_t buf[64]; wchar_t gbuf[64];\n        size_t n = my_wcsftime(buf, 64, L\"%Y-%m-%d\", &tm);\n        size_t gn = wcsftime(gbuf, 64, L\"%Y-%m-%d\", &tm);\n        expect_i(\"wcsftime-n\", (long long)n, (long long)gn);\n        expect_s(\"wcsftime\", buf, gbuf);\n    }\n\n    /* collate identity in C */\n    expect_i(\"wcscoll\", my_wcscoll(L\"a\", L\"b\"), wcscoll(L\"a\", L\"b\"));\n\n    /* fwide / putwchar via tmpfile roundtrip */\n    {\n        FILE *fp = tmpfile();\n        my_wchar_t got[16];\n        my_fwide(fp, 1);\n        my_fputws(L\"ok\\n\", fp);\n        rewind(fp);\n        my_fgetws(got, 16, fp);\n        expect_i(\"fputws/fgetws\", my_wcscmp(got, L\"ok\\n\")==0, 1);\n        fclose(fp);\n    }\n\n    printf(\"%d failures\\n\", fails);\n    return fails != 0;\n}\n",

  arm: "@ mywchar_utf8len.S — ARMv7: classify a UTF-8 lead byte (educational).\n@ unsigned my_utf8_lead_len(unsigned char lead);\n@ returns 1..4 or 0 if illegal lead.\n        .syntax unified\n        .arch   armv7-a\n        .text\n        .global my_utf8_lead_len\n        .type   my_utf8_lead_len, %function\nmy_utf8_lead_len:\n        uxtb    r0, r0\n        cmp     r0, #0x80\n        movlo   r0, #1\n        bxlo    lr\n        and     r2, r0, #0xe0\n        cmp     r2, #0xc0\n        moveq   r0, #2\n        bxeq    lr\n        and     r2, r0, #0xf0\n        cmp     r2, #0xe0\n        moveq   r0, #3\n        bxeq    lr\n        and     r2, r0, #0xf8\n        cmp     r2, #0xf0\n        moveq   r0, #4\n        bxeq    lr\n        mov     r0, #0\n        bx      lr\n",
  split: "/* Capstone: immutable wide field splitter. */\n#include <stdio.h>\n#include <wchar.h>\nint main(void)\n{\n    const wchar_t *p = L\"  alpha  beta\\tgamma \";\n    int nfields = 0;\n    while (*p) {\n        p += wcsspn(p, L\" \\t\");\n        if (!*p) break;\n        size_t n = wcscspn(p, L\" \\t\");\n        printf(\"%.*ls\\n\", (int)n, p);\n        p += n;\n        nfields++;\n    }\n    printf(\"fields=%d\\n\", nfields);\n    return 0;\n}\n",

  bridge: "/* Capstone: UTF-8 bridge round-trip. */\n#include <stdio.h>\n#include <wchar.h>\n#include <string.h>\n#include <locale.h>\nint main(void)\n{\n    setlocale(LC_ALL, \"C.UTF-8\");\n    const char *in = \"café €\";\n    const char *p = in;\n    wchar_t w[64];\n    mbstate_t st = {0};\n    size_t wn = mbsrtowcs(w, &p, 63, &st);\n    char out[64];\n    const wchar_t *wp = w;\n    size_t bn = wcsrtombs(out, &wp, 63, &(mbstate_t){0});\n    printf(\"wide=%zu bytes=%zu eq=%d\\n\", wn, bn, strcmp(in, out)==0);\n    printf(\"%s\\n\", out);\n    return 0;\n}\n",

(function (G) {
  'use strict';
  const V = G.V, T = G.CRAFT, h = U.h, s = U.s;
  function lab(id, title, icon, blurb, render) { T.labs[id] = { id, title, icon, blurb, render }; T.labOrder.push(id); }
  function select(id, options, value, onChange) {
    const el = h('select', { class: 'sel', id, 'aria-label': id }, options.map(o => h('option', { value: o, selected: o === value ? '' : null }, o)));
    el.addEventListener('change', () => onChange(el.value)); return el;
  }
  const field = (label, ctl) => h('label', { class: 'field' }, h('span', null, label), ctl);
  const stat = (label, value) => h('div', { class: 'stat' }, h('div', { class: 'v' }, String(value)), h('div', { class: 'l' }, label));
  const stats = (...kids) => h('div', { class: 'stats tight' }, kids);

  /* ---- UTF-8 explorer ---- */
  function utf8Bytes(cp) {
    if (cp <= 0x7f) return [cp];
    if (cp <= 0x7ff) return [0xc0 | (cp >> 6), 0x80 | (cp & 0x3f)];
    if (cp <= 0xffff) return [0xe0 | (cp >> 12), 0x80 | ((cp >> 6) & 0x3f), 0x80 | (cp & 0x3f)];
    return [0xf0 | (cp >> 18), 0x80 | ((cp >> 12) & 0x3f), 0x80 | ((cp >> 6) & 0x3f), 0x80 | (cp & 0x3f)];
  }
  function hex(b) { return b.map(x => x.toString(16).toUpperCase().padStart(2, '0')).join(' '); }
  const SAMPLES = {
    'A (U+0041)': 0x41,
    'é (U+00E9)': 0xE9,
    '€ (U+20AC)': 0x20AC,
    '你 (U+4F60)': 0x4F60,
    '😀 (U+1F600)': 0x1F600
  };
  lab('utf8', 'UTF-8 / mbrtowc explorer', 'gear', 'Pick a Unicode scalar and watch the UTF-8 bytes, the byte count mbrtowc would return, and the wcwidth class.', body => {
    let key = '€ (U+20AC)';
    const out = h('div', { class: 'stack' });
    const draw = () => {
      out.innerHTML = '';
      const cp = SAMPLES[key];
      const bytes = utf8Bytes(cp);
      const width = cp === 0 ? 0 : (cp < 32 ? -1 : (cp >= 0x1100 && cp <= 0x115F) || (cp >= 0x2E80 && cp <= 0xA4CF) || (cp >= 0xAC00 && cp <= 0xD7A3) || (cp >= 0xF900 && cp <= 0xFAFF) || (cp >= 0xFF00 && cp <= 0xFF60) || (cp >= 0x1F300 && cp <= 0x1F9FF) || (cp >= 0x20000) ? 2 : 1);
      out.appendChild(stats(stat('scalar', 'U+' + cp.toString(16).toUpperCase()), stat('UTF-8', hex(bytes)), stat('mbrtowc', bytes.length + ' byte' + (bytes.length > 1 ? 's' : '')), stat('wcwidth', width)));
      const W = 340, H = 110, svg = V.svg(W, H, 'utf8');
      svg.appendChild(V.rect(1, 1, W - 2, H - 2, { fill: 'var(--card)', stroke: 'var(--line)', sw: 1 }));
      bytes.forEach((b, i) => {
        const x = 24 + i * 70;
        svg.appendChild(V.rect(x, 30, 56, 40, { fill: i === 0 ? 'var(--gold)' : 'var(--brand-2)', stroke: 'var(--line)', sw: 1 }));
        svg.appendChild(V.text(x + 28, 54, b.toString(16).toUpperCase().padStart(2, '0'), { size: 14, anchor: 'middle', fill: i === 0 ? 'var(--gold-ink)' : 'var(--brand)', mono: true }));
      });
      svg.appendChild(V.text(170, 90, 'lead + ' + (bytes.length - 1) + ' continuation', { size: 11, anchor: 'middle', fill: 'var(--ink-2)', mono: true }));
      out.appendChild(svg);
      out.appendChild(h('p', { class: 'muted' }, 'Incomplete reads return (size_t)-2 and park bytes in mbstate_t. Illegal sequences return (size_t)-1 with errno EILSEQ. Surrogates U+D800..U+DFFF are rejected.'));
    };
    body.appendChild(field('Code point', select('cp', Object.keys(SAMPLES), key, v => { key = v; draw(); })));
    body.appendChild(out); draw();
  });

  /* ---- string ops lab ---- */
  lab('wstr', 'Wide-string sandbox', 'code', 'Try length, find, span and compare operations on a sample wide string and see the numeric results.', body => {
    let op = 'wcslen';
    const S = 'abracadabra';
    const out = h('div', { class: 'stack' });
    const draw = () => {
      out.innerHTML = '';
      let result = '?';
      if (op === 'wcslen') result = String(S.length);
      if (op === 'wcsnlen3') result = String(Math.min(3, S.length));
      if (op === 'wcschr c') result = String(S.indexOf('c'));
      if (op === 'wcsrchr a') result = String(S.lastIndexOf('a'));
      if (op === 'wcsstr cad') result = String(S.indexOf('cad'));
      if (op === 'wcscspn cd') result = String([...S].findIndex(ch => 'cd'.includes(ch)));
      if (op === 'wcsspn a') result = String([...S].findIndex(ch => ch !== 'a'));
      if (op === 'wcscmp ab/ac') result = String('ab' < 'ac' ? 'negative' : 'non-neg');
      out.appendChild(stats(stat('string', 'L"' + S + '"'), stat('op', op), stat('result', result)));
      out.appendChild(h('p', { class: 'muted' }, 'Indices are 0-based offsets in wchar_t units (Unicode scalars on Linux UCS-4).'));
    };
    body.appendChild(field('Operation', select('op', ['wcslen', 'wcsnlen3', 'wcschr c', 'wcsrchr a', 'wcsstr cad', 'wcscspn cd', 'wcsspn a', 'wcscmp ab/ac'], op, v => { op = v; draw(); })));
    body.appendChild(out); draw();
  });

  /* ---- orientation lab ---- */
  lab('orient', 'Stream orientation', 'flame', 'Toggle fwide mode and see whether byte or wide I/O is the legal next step on a FILE.', body => {
    let mode = '0 (query/unset)';
    const out = h('div', { class: 'stack' });
    const notes = {
      '0 (query/unset)': { title: 'No orientation yet', body: 'fwide(fp, 0) returns 0. The first I/O call locks the orientation: byte ops → negative, wide ops → positive.' },
      '1 (wide)': { title: 'Wide-oriented', body: 'fgetwc/fputwc/fgetws/fputws/fwprintf are fine. Using getc/fwrite after this is undefined behaviour.' },
      '-1 (byte)': { title: 'Byte-oriented', body: 'getc/fwrite/fprintf are fine. Wide I/O after this is undefined behaviour. Call fwide before any I/O if you care.' }
    };
    const draw = () => {
      out.innerHTML = '';
      const n = notes[mode];
      out.appendChild(h('div', { class: 'card' }, h('strong', null, n.title), h('p', { class: 'muted' }, n.body)));
      out.appendChild(stats(stat('fwide mode', mode.split(' ')[0]), stat('byte I/O', mode.startsWith('-1') || mode.startsWith('0') ? 'ok until locked' : 'UB'), stat('wide I/O', mode.startsWith('1') || mode.startsWith('0') ? 'ok until locked' : 'UB')));
    };
    body.appendChild(field('Orientation', select('m', Object.keys(notes), mode, v => { mode = v; draw(); })));
    body.appendChild(out); draw();
  });
})(CG);
