unit('u5', 5, 'pat', 'op', 'Measuring the body and understanding ease', 'Take the measurements every later step depends on, understand ease, and work fluently in cm and inches.', [
  lesson('u5l1', 'Taking measurements', REF.pat, [
    LS('Set-up', 'Measure over a thin T-shirt and underwear only, standing relaxed, feet hip-width apart, looking ahead. A helper is far more accurate than measuring yourself. Tie a narrow elastic around the natural waist (where the body bends sideways) as a reference. Keep the tape level (check in a mirror) and **snug but not tight** — it should slide with one finger under it. Take each measurement twice.'),
    LS('The measurements for both garments', '| Measurement | How (ISO 8559-1 style) |\n|---|---|\n| **chest** | fullest part, under the arms, across the shoulder blades, tape level, normal breath |\n| **neck** | around the base, over the Adam’s apple, one finger inside the tape |\n| **shoulder width** | across the back from shoulder point to shoulder point (the bony tip) following the curve |\n| **sleeve** | from shoulder point, over a slightly bent elbow, to the wrist bone |\n| **wrist** | around the wrist bone |\n| **bicep** | fullest part of the upper arm, relaxed |\n| **shirt length** | from the nape (prominent neck vertebra, C7) down the centre back to the desired hem |\n| **waist** | for the shirt: around the natural waist; for shorts: where you will wear the waistband |\n| **seat** | fullest part of the buttocks, tape level, feet together |\n| **body rise (crotch depth)** | sitting on a hard flat chair: side of the waist (band level) straight down to the chair seat |\n| **inseam** | for shorts: crotch to the desired hem along the inner leg (often 13–23 cm) |\n| **thigh** | fullest part of the upper thigh |\n\nRecord the date, and write measurements in cm with one decimal.', DG('0 0 220 260', '<ellipse class="o" cx="110" cy="30" rx="18" ry="22"/><path class="o" d="M92 55 L60 70 L45 160 M128 55 L160 70 L175 160 M60 70 L70 150 L65 250 M160 70 L150 150 L155 250 M110 160 L110 250"/><path class="b" d="M58 95 H162"/><text class="t" x="166" y="98">chest</text><path class="b" d="M68 135 H152"/><text class="t" x="156" y="138">waist</text><path class="b" d="M66 165 H154"/><text class="t" x="158" y="168">seat</text><path class="b" d="M96 54 Q110 62 124 54"/><text class="t" x="128" y="50">neck</text><path class="s" d="M60 70 L45 160"/><text class="t" x="2" y="120">sleeve</text><path class="s" d="M72 140 V178"/><text class="t" x="2" y="180">rise</text><path class="s" d="M110 180 V230"/><text class="t" x="114" y="215">inseam</text>', 'Where the main measurements are taken.', 240)),
    OR('Order the shirt-length measurement.', ['find C7, the prominent bone at the base of the neck', 'place the tape end there', 'run the tape down the centre back spine', 'read at the desired hem level'], 'Shirt length is measured at centre back from the nape.'),
    MC('How is body rise (crotch depth) measured?', ['seated on a hard chair, from the waistband level at the side straight down to the seat', 'standing, from navel to crotch through the legs', 'along the inseam', 'around the hip'], 'Sitting gives a repeatable vertical depth from waist to the base of the seat.', 'You need a chair.'),
    TF('Measurements should be taken over a bulky jumper so the shirt is not too tight.', false, 'Ease is added on purpose in the draft; bulky clothes make the base numbers wrong.', 'Ease is added later.')
  ]),
  lesson('u5l2', 'Ease: wearing ease and design ease', REF.pat, [
    LS('What ease is', '**Ease** is the difference between the finished garment and the body. **Wearing ease** is the minimum for breathing, sitting and reaching; **design ease** is extra for style.\n\n| Fit | Shirt chest ease | Shorts seat ease | Shorts waist ease |\n|---|---|---|---|\n| slim | 8–10 cm | 4 cm | 1 cm |\n| regular | 12–16 cm | 6 cm | 1–2 cm |\n| relaxed | 18–24 cm | 8–10 cm | 2 cm |\n\nOther points: neck +1.5 cm (one finger), wrist +3.5 cm plus overlap, bicep +8 cm for a regular sleeve, thigh +6 cm for shorts legs. Stretch fabric (2 % elastane) can lose 2–4 cm of ease.'),
    LS('Choosing for durability', 'Too little ease is the biggest durability killer: every time you reach forward, the back yoke seam, armhole and buttons take the load; every squat loads the seat seam and crotch. A **regular** fit (14 cm chest, 6 cm seat) puts much less stress on seams than slim, and is what this course drafts by default. Measure a shirt and shorts you like (lay flat, double the half-chest) and compare with your body to find **your** preferred ease.'),
    GM('finchest'), GM('finchest'),
    NU('A favourite shirt measures 57 cm across the chest laid flat. Your chest is 100 cm. How much ease does it have (cm)?', 14, 'Flat width × 2 = 114 cm circumference; 114 − 100 = 14 cm, a regular fit.', 'Double the flat measurement, subtract the body.'),
    MC('Why does a slim shirt wear out faster at the back yoke and armholes?', ['Reaching forward stretches the back across with no spare cloth, so seams carry the strain', 'Slim shirts use thinner thread', 'Slim shirts have no yoke', 'They are washed more often'], 'Ease is the slack that stops seams taking movement loads.', 'Where does the strain go when you reach?')
  ]),
  lesson('u5l3', 'Units and conversions', REF.pat, [
    LS('cm, inches and sixteenths', '**1 in = 2.54 cm exactly.** Imperial rulers divide inches into halves, quarters, eighths and sixteenths (1/16 in = 1.5875 mm).\n\n- **cm → in**: divide by 2.54; the fractional part × 16, rounded, gives sixteenths. 100 cm → 39.370 in; 0.370 × 16 = 5.92 → 6/16 = **3/8**, so 39 3/8 in.\n- **in → cm**: fraction to decimal, then × 2.54. 15 1/2 in = 15.5 × 2.54 = **39.37 cm**.\n- **yards**: 1 yd = 36 in = **91.44 cm**. 2 m = 2.19 yd.\n- **Seam allowances**: 1.5 cm ≈ 5/8 in (1.59 cm), 1 cm ≈ 3/8 in (0.95 cm), 0.6 cm ≈ 1/4 in (0.635 cm). Fine for one seam, but over a pattern the differences add up, so never mix systems within one pattern.'),
    LS('Why the bases drills', 'Digital sewing machines, cutters and embroidery formats store values as bytes. A stitch length of 2.5 mm is stored as **25 tenths = 0x19 = 0001 1001**; stitch counters wrap at 255 (0xFF) in some 8-bit logs. Converting between decimal, hex and binary is the same skill as reading those files.\n\nMethod tips used in every drill:\n\n1. **Decimal → hex**: divide by 16 once; quotient = high digit, remainder = low digit. 200 = 12×16 + 8 → C8.\n2. **Hex → decimal**: high × 16 + low. 0x19 = 1×16 + 9 = 25.\n3. **Decimal → binary**: walk 128, 64, 32, 16, 8, 4, 2, 1 and subtract what fits. 25 = 16 + 8 + 1 → 0001 1001.\n4. **Binary ↔ hex**: each group of 4 bits is one hex digit (0001 = 1, 1001 = 9).'),
    GM('cm2in'), GM('in2cm'), GM('dec2hex'), GM('hex2dec'), GM('dec2bin'), GM('bin2dec'), GM('yards')
  ])
]);

const shirtDraft = DG('0 0 360 300', '<path class="f" d="M30 20 H150 V270 H30 Z"/><path class="g" d="M180 20 H330 V270 H180 Z"/><path class="s" d="M30 60 H150 M180 60 H330"/><path class="d" d="M30 105 H150 M180 105 H330"/><path class="o" d="M30 20 Q52 46 62 20"/><path class="o" d="M180 40 Q200 50 210 20"/><path class="o" d="M150 105 Q118 95 120 40 L60 28"/><path class="o" d="M180 105 Q210 95 212 40 L270 30"/><text class="t" x="34" y="15">back (CB on fold)</text><text class="t" x="184" y="15">front (CF)</text><text class="t" x="34" y="56">yoke line (8)</text><text class="t" x="34" y="118">armhole depth = chest/8 + 10</text><text class="t" x="34" y="285">quarter = finished chest ÷ 4</text><text class="t" x="216" y="285">+ placket ext.</text>', 'Shirt block outline: back and front quarters with the yoke line, neck, shoulder and armhole.', 360);

unit('u6', 6, 'pat', 'rs2', 'Drafting the shirt block', 'Draft a men’s shirt from your measurements: body, yoke, armhole and sleeve, collar and band, cuffs and plackets — or alter a commercial pattern to the same numbers.', [
  lesson('u6l1', 'The body: back, front and yoke', REF.pat, [
    LS('The course drafting system', 'This course uses a simplified system after Aldrich’s menswear shirt. Every rule is stated so you can check it by hand and the **Measurement-to-pattern calculator** lab applies them. All numbers are **finished** sizes without seam allowance; allowances are added in Unit 8.\n\n| Quantity | Rule |\n|---|---|\n| finished chest | chest + ease |\n| quarter width (front and back) | finished chest ÷ 4 |\n| armhole depth (from nape level) | chest ÷ 8 + 10 |\n| back neck width | neck ÷ 5 |\n| back neck rise | 1.5–2 cm |\n| front neck depth | neck ÷ 5 + 1 |\n| half shoulder (CB to shoulder point) | shoulder ÷ 2 + 1 |\n| yoke depth at CB | 8 |\n| placket extension past CF | placket width ÷ 2 |\n| side shaping per side seam | (finished chest − finished waist) ÷ 4, if positive |\n\nThese are a **starting block**. Every block is tested in a toile (Unit 15) and adjusted.'),
    LS('Worked example', 'Chest 100, neck 40, shoulder 46, waist 88, length 78, ease 14 (regular):\n\n1. Finished chest = 100 + 14 = **114**; quarter = 114 ÷ 4 = **28.5 cm**.\n2. Armhole depth = 100 ÷ 8 + 10 = **22.5 cm** below the nape line.\n3. Back neck width = 40 ÷ 5 = **8 cm**; front neck depth = 8 + 1 = **9 cm**.\n4. Half shoulder = 46 ÷ 2 + 1 = **24 cm** along the shoulder line from CB.\n5. Finished waist = 88 + 14 = 102; side shaping = (114 − 102) ÷ 4 = **3 cm** in at each side seam at the waist (optional; skip for a straight work shirt).\n6. Length 78 at CB; the front is cut 2–3 cm longer at the hem for a shirt-tail curve, the sides 8–10 cm shorter.\n\n**Drafting steps**: draw a vertical CB line on paper (it goes on the fold). Square across at the nape, armhole depth, waist (nape + 44 cm is typical) and hem. Mark the quarter width at chest and hem; join for the side seam. Draft the back neck curve, shoulder line (slope ~4.5 cm drop over the half shoulder), and armhole curve with the hip curve. Draw the yoke line 8 cm below the nape and trace the yoke off the top of both back and front (the front shoulder strip, ~3 cm, moves to the yoke so the shoulder seam sits forward).', shirtDraft),
    LS('Yoke and back pleat', 'The **yoke** is a separate double-layered piece over the shoulders. It carries the load of the shirt from the shoulders, gives a clean inside finish (two layers enclose the seams) and lets you shape a forward shoulder seam. Cut it **twice** (outer and lining), often on the cross grain for a stripe effect, or **split** at CB for a better shoulder fit (Unit 9).\n\nFor reach room add a **box pleat** (2 × 2 cm at CB) or two side pleats under the yoke: extend the back width by the pleat amount above the waist. A pleat is extra durability insurance in the back where reach stress concentrates.'),
    GM('finchest'),
    NU('Chest 108 cm. Armhole depth by the course rule (cm)?', 23.5, '108 ÷ 8 + 10 = 13.5 + 10 = 23.5 cm.', 'chest ÷ 8 + 10.', { tol: 0.01 }),
    NU('Neck 42 cm. Front neck depth (cm)?', 9.4, '42 ÷ 5 + 1 = 8.4 + 1 = 9.4 cm.', 'neck ÷ 5 + 1.', { tol: 0.01 }),
    MC('Why is the shirt yoke cut double?', ['Two layers carry the shoulder load and enclose the yoke, shoulder and back seams cleanly', 'To use up fabric', 'For warmth only', 'So the collar can be skipped'], 'The yoke is structural and a finishing device.', 'What do the two layers sandwich?')
  ]),
  lesson('u6l2', 'Armhole and sleeve', REF.pat, [
    LS('Measure the armhole, draft the sleeve', 'Measure the **armhole curve** length on the front and back blocks with the tape on edge (e.g. front 24 + back 25 = 49 cm).\n\nShirt sleeve (one-piece, flat-felled):\n\n1. Sleeve length = sleeve measure − cuff depth + 1.5 cm blouse. With sleeve 64, cuff 6.5 → **59 cm**.\n2. Sleeve width at bicep = bicep + 8 (or 0.36 × chest + 4 if unmeasured: 0.36 × 100 + 4 = **40 cm**).\n3. Crown height (cap): for a shirt, **low**, 12–15 cm — a low cap gives a wide sleeve that you can reach in and that sets flat (no ease to gather), ideal for flat-felling.\n4. Draw the cap curve so its length equals the armhole length + 0–1 cm. Shirts use **zero to 1 cm ease** in the cap.\n5. Wrist width = cuff length + pleats (2 × 2 cm) + placket allowance.'),
    LS('Why the low cap matters for durability', 'A dress-jacket sleeve with a high cap gives a sharp shoulder but restricts reaching; the armhole seam then tears under the arm. A shirt’s **low cap and wide bicep** let the arm rise without pulling the side seam, and allow the seam to be sewn flat and felled. Trade-off: some fabric folds under the arm when the arms are down — that is normal for a shirt.'),
    NU('Sleeve measure 66, cuff depth 6.5 cm. Pattern sleeve length by the course rule?', 61, '66 − 6.5 + 1.5 = 61 cm.', 'sleeve − cuff + 1.5.', { tol: 0.01 }),
    MC('A shirt sleeve with a low cap gives…', ['more arm lift and a flat-fellable seam, with some underarm folds', 'a sharp tailored shoulder with restricted movement', 'a shorter sleeve', 'more ease in the cap to gather'], 'Low cap = wide, mobile sleeve.', 'Think of a work shirt vs a jacket.'),
    TF('A shirt sleeve cap should have 3–4 cm of ease to gather into the armhole.', false, 'That is jacket practice; a shirt cap has 0–1 cm so it can be flat-felled.', 'Felled seams cannot absorb ease.')
  ]),
  lesson('u6l3', 'Collar, band, cuffs and plackets', REF.pat, [
    LS('Collar and band', 'A classic shirt collar has two parts: the **collar band (stand)** around the neck and the **collar (fall)** that folds over.\n\n- **Band** length CF to CF = neck + 1.5; each end extends half a placket width past CF so it lines up with the front edges: total = neck + 1.5 + placket width. Neck 40, placket 3.5 → **45 cm**. Height 3–3.5 cm at CB, curving up 1–1.5 cm at the front so it hugs the neck.\n- **Collar** length = neck + 1.5 + 2 → **43.5 cm** (it stops about 1 cm short of each band end), point length 7–8 cm, CB height 4–4.5 cm, with the outer edge springing up 1–2 cm at the CB so it covers the band seam.\n\nCut 2 of each (outer + under/inner), plus interfacing.'),
    LS('Cuffs and plackets', '**Cuff**: length = wrist + 6 (3.5 ease + 2.5 overlap): wrist 17 → **23 cm**; depth 6–7 cm; cut 4 (2 per cuff) + interfacing.\n\n**Front placket**: either **folded-on** (front extends by a placket width + a turn-under and is folded twice) or **sewn-on** (separate strip 2 × placket width + 2 SA, interfaced). This course uses a sewn-on box placket on the buttonhole side (3.5 cm) and a simple double-fold facing on the button side.\n\n**Sleeve plackets**: a **tower placket** (two-piece: underlap 2.5 cm and overlap 2.5 cm with the tower peak, ~16–18 cm long) — the classic, strongest finish; or a **continuous bound placket** (one bias/straight strip 3.5 × 2× slit length), simpler for short slits.', DG('0 0 340 120', '<path class="f" d="M20 70 Q120 82 220 70 L222 40 Q120 52 20 40 Z"/><path class="g" d="M30 40 Q120 52 210 40 L230 10 Q120 28 12 10 Z"/><text class="t" x="70" y="64">band (stand)</text><text class="t" x="80" y="30">collar (fall)</text><path class="f" d="M250 30 h70 v26 h-70 z"/><text class="t" x="258" y="47">cuff</text><text class="t" x="20" y="110">band = neck + 1.5 + placket; collar = neck + 3.5; cuff = wrist + 6</text>', 'Collar band, collar and cuff pieces.')),
    GM('collarband'), GM('cuff'), GM('collarband'),
    MA('Match the piece to its rule.', [['collar band', 'neck + 1.5 + placket width'], ['collar fall', 'neck + 1.5 + 2'], ['cuff', 'wrist + 6'], ['sleeve length', 'sleeve − cuff depth + 1.5']], 'All from the course drafting table.')
  ]),
  lesson('u6l4', 'Altering a commercial pattern instead', REF.fit, [

unit('u7', 7, 'pat', 'f3', 'Drafting the shorts block', 'Draft front and back shorts panels with a proper seat curve, then the pocket, fly and waistband pieces.', [
  lesson('u7l1', 'Front and back panels', REF.pat, [
    LS('Rules', '| Quantity | Rule |\n|---|---|\n| finished seat | seat + 6 |\n| finished waist | waist + 1 |\n| front quarter at seat | seat ÷ 4 − 1 |\n| back quarter at seat | seat ÷ 4 + 1 |\n| crotch depth | body rise + 1 |\n| front crotch extension | finished seat ÷ 16 |\n| back crotch extension | finished seat ÷ 16 + 4 |\n| outseam below band | crotch depth − band height + inseam |\n| leg opening (circumference) | thigh + 6 |\n| back seat angle | CB raised 2–3 cm and slanted ~12° |\n| waist intake | finished seat − finished waist, via back darts (2 × 2 cm), side seams and CB |'),
    LS('Worked example', 'Waist 84, seat 100, rise 27, inseam 18, thigh 58:\n\n- Finished seat 106, finished waist 85.\n- Front quarter = 106 ÷ 4 − 1 = **25.5**; back = **27.5**.\n- Crotch depth = 28; band 4, so the panel from the waist seam to the crotch line is 24 cm.\n- Front extension = 106 ÷ 16 = **6.6**; back = **10.6**.\n- Outseam below band = 28 − 4 + 18 = **42 cm**.\n- Leg opening = 64 cm, so each panel hem is about 30–34 cm wide (front a little narrower than back).\n- Intake = 106 − 85 = 21 cm total: e.g. 2 back darts × 2 cm = 4 per half back × 2 = 8 total, side seams 1.5 × 4 = 6, CB 1.5 × 2 = 3, front pleat/shaping 2 × 2 = 4 → 21.\n\nDraft: square a crease line, mark waist, crotch (seat) line and hem. Mark quarter widths either side, add the crotch extensions, draw the front crotch curve (shallow) and the back seat curve (deep, through the raised and angled CB). Measure inseams front and back — the back may be 0.5–1 cm shorter and is stretched slightly onto the front.', DG('0 0 340 250', '<path class="f" d="M40 20 L140 20 L148 120 L150 230 L50 230 L40 120 Z"/><path class="o" d="M148 120 Q150 150 180 150"/><path class="g" d="M200 12 L300 20 L310 120 L310 230 L205 230 L195 120 Z"/><path class="o" d="M195 120 Q190 160 150 162"/><path class="d" d="M20 120 H330"/><text class="t" x="60" y="15">front</text><text class="t" x="230" y="10">back (CB raised)</text><text class="t" x="20" y="116">crotch line</text><text class="t" x="150" y="145">front ext</text><text class="t" x="150" y="175">back ext</text>', 'Shorts front and back with crotch extensions (back larger) and the crotch line.')),
    GM('seatq'), GM('crotch'), GM('crotch'),
    NU('Rise 26, band 4, inseam 20. Outseam below the band by the course rule?', 43, 'Crotch depth = 26 + 1 = 27; 27 − 4 + 20 = 43 cm.', 'rise + 1 − band + inseam.')

  lesson('u7l2', 'Pocket, fly and waistband pieces', REF.shorts, [
    LS('Front slant pocket pieces', 'Mark the pocket opening on the front: from the waist 4–5 cm in from the side seam, sloping down to the side seam 16–18 cm below the waist. Trace:\n\n- **pocket bag** (pocketing fabric, cut 2 per side, or one folded): from the waist, extending past the opening 3 cm, down to 25–28 cm, about 18 cm wide, reaching close to the fly so it also stabilises the front.\n- **pocket facing** (self fabric) — the part behind the opening that shows: the side-front panel shape, 4 cm wider than the opening.\n- **opening facing** strip (self or pocketing) 4 cm wide along the slant edge.'),
    LS('Fly, waistband, belt loops, back pockets', '- **Fly facing** (left front for men’s): 6 cm wide × fly length (zip length + 2), cut self, interfaced.\n- **Fly shield** (right side): 2 × 5 cm + SA, cut double or folded, interfaced; covers the zip behind.\n- **Waistband**: finished waist + 4 cm overlap (= 89 for waist 84) × 2 × band height + 2 SA; cut in two halves with a CB seam so it can be let out later.\n- **Belt loops**: one strip 4 cm × (7 loops × 8 cm) ≈ 60 cm, folded to 1 cm.\n- **Back pockets**: patch 15 × 17 finished, or welt opening 13–14 cm with bags 16 × 36 cm folded.'),
    MA('Match the piece to where it sits.', [['fly shield', 'behind the zip on the right'], ['fly facing', 'under the topstitched fly on the left'], ['pocket facing', 'behind the slant opening'], ['pocket bag', 'inside, in pocketing fabric']], 'Men’s flies lap left over right.'),

unit('u8', 8, 'pat', 'imm', 'Pattern markings, seam allowances, layout and cutting', 'Turn net blocks into cutting patterns: grainlines, notches, seam allowances, labels — then lay out, cut and mark.', [
  lesson('u8l1', 'Grainlines, notches and markings', REF.pat, [
    LS('Pattern markings', '| Marking | Meaning |\n|---|---|\n| **grainline** (long double arrow) | place parallel to the selvedge: measure both ends to the selvedge |\n| **place on fold** (bracket arrow) | the line goes on the folded edge; piece is cut double width |\n| **notch** single / double / triple | match points; single = front, double = back (armhole convention) |\n| **drill hole / dot** | pocket corners, dart points, buttonholes |\n| **CF, CB** | centre lines |\n| **piece label** | name, size, “cut 2”, “cut 1 + 1 interfacing” |\n\nCut notches as **2–3 mm snips** into the seam allowance (never deeper than half the SA on felled seams), or as outward triangles on loosely woven cloth.'),
    LS('Seam allowances', 'Add allowances by **finish**, not habit. This course:\n\n| Seam | SA |\n|---|---|\n| flat-felled side, sleeve and armhole seams | 1.5 cm wrap side / 1.0 on the sleeve head |\n| collar, band, cuff | 1.0 cm |\n| yoke, placket | 1.0 cm |\n| shirt-tail hem | 1.2 cm (0.6 + 0.6) |\n| shorts seams | 1.5 cm |\n| shorts hem | 4 cm (1 + 3) |\n| waistband | 1.0 cm |\n| patch pocket top | 3 cm facing; other edges 1.0 |\n\nAt corners, extend both allowance lines until they meet, then fold the pattern along the seam line and cut the allowance — this **mirrors** the angle so a seam turned to one side lies flat (the “dog-ear” correction). The **Seam-allowance and grainline planner** lab shows cut sizes.'),
    GM('saq'), GM('saq'), GM('cutsize'),
    MC('What does a grainline arrow tell you?', ['place it parallel to the selvedge', 'cut along it', 'fold along it', 'it marks CF only'], 'Measure from both ends of the arrow to the selvedge: equal readings = on grain.', 'Measure twice.')
  ]),
  lesson('u8l2', 'Walking, truing and a test toile', REF.pat, [
    LS('Walking seams', 'Two edges that will be sewn must be the same length (or differ by planned ease). **Walk** one paper pattern along the other with a pencil pivot: side seam front vs back, sleeve cap vs armhole, band vs neckline, inseam front vs back. Correct and re-notch.\n\n**True** corners: fold out darts and pleats on the paper and check the cutting edge across them is smooth.'),
    LS('The toile (muslin)', 'Before cutting good cloth, sew a quick **toile** in cheap cotton of similar weight: body, one sleeve, collar band (no fall), shorts with one pocket opening and waistband basted. 4 mm stitches, no finishing. Mark CF, CB, chest and waist lines in pen. Fit it (Unit 15), transfer changes to the paper, and only then cut the real fabric. It costs two hours and saves the garment.'),
    OR('Order the pattern preparation.', ['draft or alter the net block', 'walk and true the seams', 'add seam allowances and notches', 'sew and fit a toile', 'transfer corrections, then cut the good fabric'], 'Never cut good cloth from an untested pattern.'),
    TF('If the front and back inseams differ by 1 cm on purpose, the back is eased or stretched to match.', true, 'Shorts often build in a small difference that is stretched onto the front for a better seat fit.', 'Planned difference.')
  ]),
  lesson('u8l3', 'Layout, yardage and cutting', REF.fab, [
    LS('Laying out', '1. Pre-washed, pressed, grain-straightened fabric, folded selvedge to selvedge, right sides together (or single layer for asymmetric pieces).\n2. Big pieces first, all grainlines parallel to the selvedge (check both ends). **Never rotate** a piece off grain to save cloth.\n3. One-way fabrics (corduroy, prints with direction, some twills with a visible bias rib): all pieces head the same way.\n4. Match stripes/checks at CF, pockets and yokes; plaids need 15–25 % more.\n5. Weights first, pins only inside seam allowances.\n\n**Worked layout**: two pieces 70 × 80 and three pieces 50 × 60 on 150 cm cloth. Row 1: 70 + 70 = 140 ≤ 150, height 80. Row 2: 50 + 50 + 50 = 150, height 60. Total **140 cm**. With 3 % shrinkage and 10 % spare: 140 ÷ 0.97 × 1.1 = **158.8 cm ≈ 1.59 m ≈ 1.74 yd**. The **Cutting layout and yardage** lab packs any list this way and draws it.'),
    LS('Typical yardage, and cutting technique', '| Garment | 110 cm cloth | 150 cm cloth |\n|---|---|---|\n| long-sleeve shirt, chest ≤ 110 | 2.6–2.9 m | 1.9–2.2 m |\n| shorts, seat ≤ 110 | 1.3–1.5 m | 1.0–1.2 m |\n| pocketing | 0.4 m | 0.3 m |\n| interfacing (shirt + shorts) | 0.6 m | |\n\nCutting: long, smooth strokes with the lower blade on the table; walk around the table instead of turning the cloth; cut notches outward or snip; transfer dots with chalk or a thread tack; label each piece on the wrong side with tape (“L front”, “undercollar”).'),
    GM('yards'), GM('yards'),
    NU('Pieces 60 × 90 (×2) and 45 × 50 (×3) on 150 cm cloth, shelf layout as in the lab. Total length (cm)?', 140, 'Row 1: 60 + 60 = 120 ≤ 150, height 90. Row 2: 45 + 45 + 45 = 135 ≤ 150, height 50. 90 + 50 = 140 cm.', 'Fill rows across the width, row height = tallest piece.'),
    TF('To save fabric it is fine to tilt a shirt sleeve 10° off grain.', false, 'The sleeve would twist around the arm after washing; grain is non-negotiable.', 'Recall the grain-error drift.')
  ]),
  lesson('u8l4', 'Marking, interfacing and preparing to sew', REF.shirt, [
    LS('Transfer and fuse', 'Before the machine:\n\n1. Transfer pocket placement, buttonhole marks, CF, dart points and pleat lines with chalk or thread tacks (tailor’s tacks on fabrics that chalk will not mark).\n2. **Fuse interfacing** to collar, band, cuffs, placket and fly/waistband pieces: interfacing cut **without** seam allowance on collars (less bulk) or full size and trimmed later; fusible side (shiny, bumpy) to the fabric wrong side; press cloth; firm press 10–15 s per spot with steam, no sliding; let it cool flat for 5 minutes.\n3. Stack pieces in sewing order. Wind 2–3 bobbins. New needle. Test the stitch on a scrap of the real cloth with the real interfacing.'),
    OR('Order the fusing of interfacing.', ['place fusible side down on the wrong side of the fabric', 'cover with a press cloth', 'press firmly with steam 10–15 s per spot, lifting between spots', 'let it cool flat before handling'], 'Glue bonds when it cools.'),

  ])
]);

unit('u9', 9, 'shirt', 'f7', 'Shirt construction I: fronts, pocket, placket and yoke', 'The flat work: staystitching, the mitred patch pocket (and an optional welt), the front placket, and the yoke sewn by the clean-finish “burrito” method — or split.', [
  lesson('u9l1', 'Construction order and staystitching', REF.shirt, [
    LS('The order, and why', 'Classic shirt order — **flat as long as possible**:\n\n1. Staystitch necklines and curved edges.\n2. Pocket(s) on the left front.\n3. Front placket (buttonhole side) and button-side facing.\n4. Back pleat; yoke to back and fronts (burrito).\n5. Sleeve plackets on the flat sleeves.\n6. Set sleeves flat, flat-fell the armholes.\n7. Side and underarm seams in one continuous felled seam.\n8. Collar: make collar, make band, join, attach to the neck.\n9. Cuffs: make, attach.\n10. Hem.\n11. Buttonholes, buttons, final press.\n\nEvery detail is easier on a flat piece; once you close the side seams you are working in tubes.'),
    LS('Staystitching', 'Curved and bias edges (neckline, armhole on loose weaves, shirt-tail curve) **stretch** as you handle them. Staystitch them the moment the pieces are cut: a single row of 1.5–2 mm stitches **within** the seam allowance (0.8–1.0 cm from a 1 cm SA edge), sewn **directionally** from the shoulder toward CF / CB so the stitch pushes the grain in, not out. Then lay the piece on the paper pattern: if the neck grew, pull the staystitch thread slightly to ease it back.'),
    OR('Order the first stages of a shirt.', ['staystitch the neck', 'sew the chest pocket', 'make the front placket', 'attach the yoke', 'make the sleeve plackets'], 'Details on flat pieces before joins.'),
    TF('Staystitching is sewn just outside the seam line so it is hidden in the allowance.', true, 'It sits inside the seam allowance, close to but not on the stitching line.', 'It must not show.'),
    GM('orderq')
  ]),
  lesson('u9l2', 'The patch pocket with mitred corners', REF.shirt, [
    LS('Cutting and pressing the pocket', 'Shirt pocket: finished 12.5 × 14 cm (adjust to hand size), square or with angled bottom corners. Cut with a **3 cm** top facing and 1 cm on the other sides: 14.5 × 18 cm.\n\n1. Turn the top 1 cm under, then the remaining 2 cm to the right side; stitch the ends at 1 cm, turn right side out (this makes a clean facing) — or simply double-fold 1 + 2 to the wrong side and stitch 1.8 cm from the top.\n2. Press the side and bottom allowances under 1 cm with a **cardboard template** cut to the finished size (accurate and symmetrical).\n3. **Mitre the square corners**: unfold the corner, fold the corner point diagonally so the fold crosses the exact corner of the finished size, trim to 0.6 cm beyond the fold, refold the allowances — the edges meet in a neat 45° line with no bulk.', DG('0 0 300 150', '<path class="f" d="M30 20 h120 v110 h-120 z"/><path class="s" d="M42 32 h96 v86 h-96 z"/><path class="g" d="M126 130 L150 106 L150 130 Z"/><path class="o" d="M126 118 L138 130"/><text class="t" x="160" y="40">cut edge (solid)</text><text class="t" x="160" y="58">fold line (dashed)</text><text class="t" x="160" y="120">corner folded diagonally</text><text class="t" x="160" y="136">through the finished corner</text>', 'Mitring a pocket corner: fold the corner through the finished point, trim, refold.')),
    LS('Placing and sewing it on', '1. Place on the **left front**: top 18–21 cm below the shoulder–neck point, outer edge 7–8 cm from CF, square to CF (parallel to grain!).\n2. Pin or glue-baste (washable glue stick).\n3. Edgestitch 1–2 mm from the edge, starting at the top, then a second row at 6 mm for a work shirt.\n4. **Reinforce the top corners** — they take every pen and hand: a stitched triangle (5 mm wide, 1 cm down) or a short bar tack. Pull threads to the back and tie off.'),
    GM('cutsize'),
    MC('Why reinforce the top corners of a patch pocket?', ['All the strain of hands and contents pulls at them; they tear first', 'For decoration only', 'To hide the mitre', 'Because the facing is there'], 'Triangles or bar tacks spread the load.', 'Where does a pocket rip?'),
    TF('The shirt pocket should be placed parallel to CF so it stays on grain with the front.', true, 'A pocket off grain from its base hangs crooked and puckers.', 'Grain again.')
  ]),
  lesson('u9l3', 'Optional welt pocket on a shirt', REF.shirt, [
    LS('Single welt, step by step', 'A welt pocket is set into the front (dressier, nothing to snag):\n\n1. Interface the back of the opening (strip 4 × 16 cm) and mark the opening box: 12 × 1 cm.\n2. Welt: 14 × 6 cm, interfaced, folded lengthwise to 14 × 3 cm, ends sewn and turned → 12 × 2.5 finished welt.\n3. Lay the welt below the box with raw edges to the box’s lower line; lay a pocket bag (14 × 34 cm) over the upper line; stitch both lines exactly 12 cm long, backstitching.\n4. Cut through the front only along the centre, stopping 1 cm from the ends, then into the corners in a **Y** (right up to, not through, the last stitch).\n5. Turn the bag through; press the welt up; fold the bag up, sew the bag edges.\n6. Topstitch the welt ends (or slipstitch) and **bar tack** both ends through all layers.'),
    OR('Order the welt pocket.', ['interface and mark the opening box', 'sew the welt and bag along the two box lines', 'cut the centre and Y-clip to the corners', 'turn through and press the welt up', 'close the bag and secure the welt ends with bar tacks'], 'Mark, sew, cut, turn, finish.'),
    MC('Why stop the centre cut 1 cm from the ends and clip in a Y?', ['The triangles fold back cleanly and the corners stay square without fraying', 'To save time', 'So the pocket is smaller', 'To make the welt longer'], 'A straight cut to the corners leaves puckers or holes.', 'Picture turning the opening to the inside.')
  ]),
  lesson('u9l4', 'The front placket', REF.shirt, [
    LS('Sewn-on box placket (buttonhole side)', 'Left front for men (buttonholes on the wearer’s left, lapping left over right).\n\n1. Placket strip: 3.5 cm finished → cut 3.5 × 2 + 2 × 1 = **9 cm** wide × front length; interface one half.\n2. Press 1 cm under on one long edge, then fold in half lengthwise and press.\n3. Lay the unpressed edge of the strip **right side to the wrong side** of the front, raw edges together, sew at 1 cm.\n4. Press the seam toward the placket, wrap the placket to the right side, edge the pressed fold just over the stitching line, pin.\n5. Edgestitch both long edges 2 mm from the edge, from the hem up, both in the same direction so the layers do not shift diagonally.'),
    LS('Folded facing (button side)', 'On the right front fold under 1 cm then 2.5 cm (or the placket width), press and edgestitch the inner fold — or leave it free and topstitch the outer edge only for a softer look. Stripes: match the placket stripe to the front so it disappears, or cut the placket on the cross grain as a design feature (interfaced so it does not stretch).\n\nAt the hem: fold the placket end before hemming so the hem line is continuous, or finish the placket end and hem around it. Check both fronts are the same length.'),

    TF('On a man’s shirt, buttonholes are on the wearer’s left front.', true, 'Men’s garments lap left over right.', 'Same as the fly.'),
    MC('Why edgestitch both placket edges in the same direction?', ['Sewing in opposite directions shifts the layers into diagonal ripples', 'It is faster', 'To save thread', 'Machines only sew one way'], 'The feed pushes the top layer; same direction keeps the drag consistent.', 'Directional sewing.')
  ]),
  lesson('u9l5', 'The yoke: clean finish (burrito) and split yoke', REF.shirt, [
    LS('Back to yoke', 'Form the back pleat and baste it at the top. Sandwich the back between the **outer yoke** (right side to right side of back) and the **yoke lining** (right side to wrong side of back). Sew at 1 cm through all three layers. Press both yokes up, topstitch the outer yoke 2 mm from the seam (optional 6 mm second row).'),
    LS('Burrito: fronts to yoke with everything enclosed', 'Shoulder seams by machine with no raw edges:\n\n1. With the back already sandwiched between both yokes:\n\n   a. Pin the **outer yoke** to the front shoulders right sides together.\n   b. Roll the back and fronts up tightly toward the yoke.\n   c. Bring the yoke **lining** over the roll, right side to the wrong side of the front shoulder, matching edges; now the fronts are sandwiched between both yokes and the rolled shirt is inside the tube.\n   d. Sew both shoulder seams at 1 cm.\n   e. Pull the shirt out through the neck opening: both shoulder seams are fully enclosed.\n\n2. Press, then topstitch from the outside 2 mm from the shoulder seam.\n\n**Split yoke**: cut the yoke as two halves with a CB seam on the bias (or angled grain): it follows the shoulder blades better, takes reach strain with a little give, and lets you match stripes in a chevron. Join the halves with a flat-felled or plain pressed-open seam before the burrito.', DG('0 0 320 120', '<path class="f" d="M30 30 H290 V60 H30 Z"/><path class="g" d="M30 66 H290 V96 H30 Z"/><ellipse class="o" cx="160" cy="63" rx="40" ry="10"/><text class="t" x="34" y="25">outer yoke</text><text class="t" x="34" y="112">yoke lining</text><text class="t" x="125" y="80">rolled shirt</text>', 'The burrito: the rolled shirt inside the yoke tube while sewing the shoulders.')),
    OR('Order the burrito method for the shoulder seams.', ['pin outer yoke to the front shoulders right sides together', 'roll fronts and back tightly up to the yoke', 'wrap the yoke lining over the roll and pin to the same shoulder edges', 'sew both shoulder seams', 'pull the shirt out through the neck'], 'The sandwich closes the raw edges inside.'),
    MC('What is a durability benefit of a split (two-piece, bias-angled) yoke?', ['It follows the shoulders and gives slightly under reach strain', 'It uses no thread', 'It needs no lining', 'It removes the need for a collar'], 'Bias has give where the back stretches.', 'Bias behaviour.'),
    TF('Before the burrito you should already have attached the back to both yokes.', true, 'The back is sandwiched first; the burrito handles the fronts.', 'Back first.')
  ])
]);

unit('u10', 10, 'shirt', 'rs2', 'Shirt construction II: sleeves, felled seams, collar, cuffs and hem', 'Sleeve plackets, flat-felled armholes and side seams, the two-piece collar, cuffs, and the narrow shirt-tail hem.', [
  lesson('u10l1', 'Sleeve plackets: tower and continuous', REF.shirt, [
    LS('Tower placket', 'Cut the slit 12–15 cm long, on the back half of the sleeve, about 1/3 of the wrist width from the back edge (in line with the little finger).\n\n1. **Underlap** strip (2.5 cm finished, cut 6 × slit+2): sew right side to the **wrong side** of the back edge of the slit, fold to the right side, edgestitch.\n2. **Overlap** (tower) piece: cut from the pattern, with a pointed top, pressed folds.\n3. Clip the slit into the corners at the top (a 1 cm Y).\n4. Sew the tower’s raw edge to the wrong side of the front edge of the slit, fold it to the right side so it covers the underlap, enclose the top triangle.\n5. Edgestitch up the tower, across (catching the underlap end and the triangle), around the point and back down; finish with a **box or X** through all layers above the slit — the stress point when you push your hand through.\n\nThe tower is strong and handsome, and easily the fiddliest part of the shirt: make one on scrap first.'),
    LS('Continuous (bound) placket', 'For shorter slits (~8–10 cm) or quicker work:\n\n1. Staystitch a narrow V around the slit line (0.5 cm wide at the cuff edge, to a point at the top), slash to the point.\n2. Strip 3.5 cm × (2 × slit + 2 cm), press 0.6 cm under on one edge.\n3. Spread the slit straight, sew the strip’s raw edge to the slit (right sides together) at 0.6 cm — the stitch only just catches the point.\n4. Fold the strip over, edge the pressed fold onto the stitching, edgestitch.\n5. Stitch a short diagonal at the top on the inside so the front half folds under.\n\nIt is less sturdy at the top: add a small bar tack.'),

    TF('The box or X stitch above a tower placket reinforces a point of stress.', true, 'Pushing the hand through loads the top of the slit.', 'Stress points get reinforcement.')

  lesson('u10l2', 'Flat-felled armholes and side seams', REF.dur, [
    LS('The flat-felled seam', 'The strongest, flattest seam: both raw edges enclosed, two rows of stitching visible from the outside.\n\n1. Sew the seam **wrong sides together** (so the fell is on the outside — the ready-to-wear look) or right sides together (fell inside), at 1.5 cm.\n2. Trim the **under** allowance to 0.6 cm.\n3. Fold the wide allowance in half over the trimmed one so the raw edge tucks under, press toward the trimmed side.\n4. Press the folded allowance flat to the garment and edgestitch 1–2 mm from the fold.\n\nResult: two parallel rows ~6 mm apart and no raw edges. Use a **felling foot** (6 mm) for long straight seams, and shorten stitch to 2.0 mm for strength.', DG('0 0 320 110', '<path class="f" d="M20 70 H300 V78 H20 Z"/><path class="g" d="M140 60 H300 V68 H140 Z"/><path class="g" d="M140 52 H200 V60 H140 Z"/><path class="o" d="M150 50 V82 M196 50 V82"/><text class="t" x="20" y="96">garment</text><text class="t" x="210" y="50">folded wide allowance</text><text class="t" x="125" y="46">two rows of stitches</text>', 'Flat-felled seam, cross-section: one allowance wraps the other, two stitching rows lock it.')),
    LS('Setting the sleeve flat, then the side seam', 'Sleeves go in **flat** before side seams:\n\n1. Match the sleeve cap notches to the armhole (single front, double back) and the cap top to the shoulder seam.\n2. With a 1 cm sleeve allowance and 1.5 cm armhole allowance (or vice versa, wide side wraps), sew wrong sides together, sleeve on top, easing the curve over your fingers.\n3. Fell the armhole: wrap the wide allowance over, press toward the body, edgestitch. Work slowly on the curve; clip nothing.\n4. **Side seam**: one continuous seam from the hem up the side, through the underarm point, down the sleeve to the wrist. Match the armhole seams exactly. Fell it — a felling foot helps; inside the narrow sleeve, sew from the cuff end, scrunching the sleeve onto the free arm or feeding it through the opening.\n\nNo-felling-foot alternative: lapped “mock fell” — sew plain, serge both together, press to one side, topstitch 6 mm.'),
    GM('saq'),
    MC('After sewing a flat-felled seam at 1.5 cm, which allowance is trimmed?', ['the under one, to about 0.6 cm', 'both, to 0.3 cm', 'neither', 'the wrap side'], 'The wide one wraps over the narrow one.', 'Which one is enclosed?'),
    TF('Shirt sleeves are set in after the side seams are sewn.', false, 'Shirts set sleeves flat, then sew side and underarm in one seam.', 'Flat first.'),
    GM('durq')

  lesson('u10l3', 'The collar and band', REF.shirt, [
    LS('Make the collar', '1. Fuse interfacing to the **upper collar** (and the outer band). Optional: collar stay pockets.\n2. Trim the under-collar 1–2 mm smaller on the outer edges so the seam rolls under (“turn of cloth”).\n3. Sew upper and under collar right sides together around the outer edges at 1 cm, easing the upper collar so it is fractionally larger. Take **one or two diagonal stitches** at each point.\n4. **Grade**: trim the allowances to 0.6 and 0.3 cm (the under-collar one shorter); trim the points diagonally close to the stitching; trim the interfacing out of the allowance.\n5. Press seams open over a point presser, turn, push points out with a point turner (never scissors), press from the under-collar side so the seam is 1 mm underneath.\n6. Topstitch 2–6 mm from the edge (optional). Baste the raw neck edges together, rolled over a ham to set the curl.'),
    LS('Band and attachment', '1. Press the neck-edge allowance of the **outer band** under 1 cm (it is the layer that is edgestitched down last, from the outside).\n2. Sandwich the collar between outer and inner band (right sides to the collar), matching CB and the band notches; sew the top edge and the curved ends, through the collar.\n3. Grade, clip the curves (notch, do not cut the stitching), turn, press.\n4. **Attach**: sew the **inner band** right side to the shirt’s **wrong side** at 1 cm, matching CB, the shoulder notches, and the band ends exactly to the placket edges. Clip the staystitched neck allowance (to the staystitching, not through it) if it will not straighten.\n5. Grade, press the seam into the band; bring the outer band over, edge just covering the stitching line, pin, edgestitch from the outside all round the band.\n\nThe band ends must line up perfectly with the front edges — measure, do not trust.'),
    OR('Order the collar work.', ['fuse interfacing to upper collar and outer band', 'sew collar outer edges with diagonal stitches at the points', 'grade, trim points, turn and press', 'sandwich the collar in the band and sew', 'attach the band to the neckline and edgestitch'], 'Collar, then band, then neckline.'),
    MA('Match the technique to its purpose.', [['grading', 'staggered allowances avoid a ridge'], ['clipping curves', 'lets an inward curve spread flat'], ['understitching', 'keeps a facing rolled to the inside'], ['turn of cloth', 'outer layer slightly bigger so the seam rolls under']], 'These four make collars and facings lie flat.'),
    TF('Clipping a curved seam allowance should cut right through the stitching to release it fully.', false, 'Clip to within 1–2 mm of the stitching; never through it.', 'You would make a hole.')

  lesson('u10l4', 'Understitching, grading and clipping in depth', REF.shirt, [
    LS('Why these steps exist', 'Turned edges (collar, band, cuff, pocket facings, waistband) fail in three ways: they show a ridge (bulky allowances), refuse to lie flat on curves, or roll the wrong way so the seam shows. The fixes:\n\n- **Trim** allowances to 6 mm once sewn.\n- **Grade**: cut the layers to different widths (e.g. 6 and 3 mm); the wider one goes next to the outside so no ridge prints.\n- **Clip** inward (concave) curves: small snips so the allowance can spread. **Notch** outward (convex) curves: cut small V wedges so it can close up without lumps.\n- **Understitch**: press the allowances toward the facing/under layer and stitch through facing + allowances 2 mm from the seam. The facing then rolls to the inside naturally. Used on the shorts pocket facings, waistband, fly facing; on a shirt collar, you can partially understitch the under-collar.\n- **Interfacing** out of the allowance reduces bulk further.'),
    MC('An outward (convex) curve allowance should be…', ['notched with small V wedges', 'clipped with straight snips', 'left untrimmed', 'cut off completely'], 'On convex curves the allowance must shrink when turned; wedges remove excess.', 'Picture turning a round cuff corner.'),
    MC('Understitching joins…', ['the facing and both seam allowances, near the seam', 'the outer fabric only', 'the hem to the facing', 'two garment pieces'], 'It holds the allowances under the facing so it rolls inside.', 'It is not seen from the outside.')

    LS('Make and attach the cuffs', '1. Interface the outer cuff. Press 1 cm under along the top edge of the **outer** cuff and trim it to 0.8 cm.\n2. Sew the cuffs right sides together around three sides; grade, trim corners (or notch rounded corners), turn, press.\n3. Fold the sleeve pleats (two 2 cm pleats toward the placket on the back half) so the wrist equals the cuff length minus the overlap; baste.\n4. Sew the **inner** cuff right side to the sleeve’s **wrong** side at 1 cm, then bring the outer cuff over so its pressed edge just covers the stitching line, and edgestitch from the outside. This puts the visible edgestitch on the outside. The placket edges must line up with the cuff ends exactly.\n5. Edgestitch around the whole cuff, then optional 6 mm topstitch.'),
    LS('The narrow shirt-tail hem', 'Curved hems need a narrow turn:\n\n1. Staystitch at 6 mm from the edge; press up along it (it guides the fold).\n2. Turn again 6 mm, pressing; on the curves, ease with steam — do not stretch.\n3. Stitch 1–2 mm from the inner fold, from the wrong side, starting at a side seam; a narrow-hem foot (rolled hem) works on poplin.\n4. At the placket, fold the placket end first (or turn the hem to the right side and stitch across, then turn) for a clean corner.\n\nAdd a small **gusset** or **bar tack** at the side seam where the curved hem rises — the classic shirt tear point when you sit.'),
    OR('Order the cuff.', ['interface outer cuff, press inner cuff edge under', 'sew around three sides, grade, turn, press', 'pleat the sleeve to fit', 'sew one cuff edge to the sleeve', 'fold the other over and edgestitch all round'], 'Same principle as the collar band.'),

    MC('Why put a small gusset or bar tack at the side seam of a curved shirt-tail hem?', ['The side slits/curve peak tear when you sit or tuck', 'Decoration only', 'To shorten the shirt', 'To hold the label'], 'Curve peaks are stress concentrators.', 'Sitting pulls the front and back apart.')
  ])

unit('u11', 11, 'shirt', 'imm', 'Buttonholes, buttons, topstitching and finishing', 'Space and sew buttonholes, attach buttons with a shank so they last, topstitch to a standard, and do the final press.', [
  lesson('u11l1', 'Button spacing and buttonholes', REF.shirt, [
    LS('Planning', 'Mark the buttonhole positions on the **left** placket:\n\n1. **Band**: one horizontal hole centred on the band height, starting 2–3 mm past CF toward the end.\n2. **Top front button**: 6–8 cm below the band seam.\n3. **Bottom**: 18–22 cm above the hem (so it can be tucked), or lower for an untucked shirt.\n4. Space the rest **evenly**: spacing = (last − first) ÷ (n − 1). Aim for 7–10 cm and put one at the fullest chest point so the front does not gape.\n\nWorked: first at 7, last at 67, 7 buttons: (67 − 7) ÷ 6 = **10 cm**.\n\n**Front holes are vertical**, centred on the placket (the button sits on CF). Size: **diameter + thickness**: 11.43 mm (18L) + 2.5 = **~14 mm**. The **Button and buttonhole spacing tool** lab plots it.'),
    LS('Sewing the holes', '1. Make test holes on scrap with the same layers and interfacing.\n2. Use a one-step buttonhole foot (button in the slot) or a four-step; fine thread, 0.3–0.4 mm stitch density, Microtex needle.\n3. **Cord** the hole for strength (a gimp thread under the satin stitches) — a pro trick that stops stretching.\n4. Open with a buttonhole chisel on a block, or a seam ripper from each end toward the middle with a pin across the bar tack as a stop. Dab seam sealant on the cut threads if the cloth is loose.\n5. Cuffs: holes on the overlap side, horizontal, 1.2 cm from the end.'),
    GM('bspace'), GM('bspace'), GM('bhlen'), GM('ligne'),
    TF('Front shirt buttonholes are normally horizontal.', false, 'Front placket holes are vertical (the placket is narrow); the band and cuff holes are horizontal.', 'Look at a dress shirt.')
  ]),
  lesson('u11l2', 'Sewing buttons to last', REF.dur, [
    LS('Shank, reinforcement and thread', 'A flat 4-hole shirt button needs a **thread shank** equal to the thickness of the buttonhole layers, so the placket sits flat under it without straining the thread.\n\n1. Mark the button positions through the closed buttonholes (at the outer end for horizontal holes, the centre for vertical).\n2. Double waxed thread (or Tex 40 button thread), knot hidden under the button.\n3. Lay a toothpick or pin on top of the button; sew 6–8 passes through each pair of holes (crossed or parallel).\n4. Remove the spacer, lift the button, wind the thread tightly around the stitches 5–6 times to make the shank, pass to the back, lock with 3 small stitches and a knot.\n\n**Reinforcement**: on shorts waistbands and fly buttons, sew a small flat **stay button** (or a felt/twill square) on the inside behind the main button so the pull is spread over two layers. A machine button-sew foot (zigzag width = hole spacing) is fine for shirts but add a hand-wound shank.'),
    OR('Order the button attachment.', ['mark positions through the closed buttonholes', 'sew through the holes over a spacer', 'remove the spacer and wind the thread round to form a shank', 'lock off on the back with small stitches'], 'Spacer → shank → lock.'),
    MC('What sets the length of a button shank?', ['the thickness of the buttonhole layers', 'the button’s diameter', 'the number of holes', 'the thread colour'], 'The layers must fit under the button without stress.', 'What sits between the button and the fabric?')
  ]),
  lesson('u11l3', 'Topstitching standards and the final press', REF.qc, [
    LS('Topstitching standards', 'Topstitching is decoration **and** structure: it holds allowances flat so they do not roll and fray. Standards used in quality ready-to-wear:\n\n| Where | Distance |\n|---|---|\n| edgestitch | 1–2 mm from the edge |\n| shirt collar, cuffs, placket | 1–2 mm, optional second row 6 mm |\n| felled seams | 6 mm between rows |\n| shorts fly | J-curve 3.5 cm from CF, double rows 6 mm apart |\n| shorts waistband, pockets | 1–2 mm + 6 mm |\n\nRules: consistent stitch length (2.5–3.5 mm), never backstitch visible topstitching (pull threads through and tie), keep the needle down when pivoting, use an edge-stitch foot with a guide blade, and **no joins** in a visible row; if the thread runs out, unpick back 3 cm and restart in the same holes.'),
    LS('Final press and inspection', 'Press in this order: collar (underside, then top, then roll over a ham), band, yoke, cuffs (open), sleeves on a sleeve board without a crease (or one sharp crease on the placket line), back, fronts, placket. Hang on a shaped hanger, top button done, to cool for an hour.\n\nInspect (Unit 16): symmetry of collar points (± 2 mm), band ends aligned with placket edges, pocket on grain and level, buttons aligned with holes, no loose threads, no puckers, all bar tacks present.'),

    TF('If the bobbin runs out mid-topstitch, the best fix is to restart 3 cm back in the same holes.', true, 'That hides the join in the existing stitches.', 'Overlap in the holes.'),

  ])
]);

unit('u12', 12, 'shorts', 'rs1', 'Shorts construction I: pockets and the back', 'Order of work, slant front pockets, back welt or jetted pockets, patch pockets and back darts — all on flat panels.', [
  lesson('u12l1', 'Order of work and preparing panels', REF.shorts, [
    LS('Order', '1. Finish (serge or zigzag) the raw edges of panels whose seams will be pressed open: CB/seat, inseams and side seams if not felled; fly pieces; pocket facing edges.\n2. Back darts, then back pockets (welt or patch) on the flat backs.\n3. Front slant pockets on the flat fronts.\n4. Fly (zip or buttons) and front crotch seam up to the fly.\n5. Side seams (through the pocket bags).\n6. Inseams, as one continuous seam from hem to hem through the crotch, **or** seat seam last for easy alteration.\n7. Belt loops prepared and basted.\n8. Waistband with curtain or facing.\n9. Hems.\n10. Bar tacks, buttonhole, button, final press.\n\nAs with the shirt: everything that can be done flat, is.'),
    LS('Marking', 'Mark on the wrong side: dart legs and point, back pocket box (13–14 × 1 cm, 6–7 cm below the waist seam, parallel to the waist, centred on the dart or 2 cm toward the side), front pocket opening line, fly topstitching line (J curve), crease line (for pressing), and hem line.'),
    OR('Order these shorts stages.', ['back darts and back pockets', 'front slant pockets', 'fly', 'side seams', 'inseam and seat seam', 'waistband', 'hems'], 'Pockets flat, then fly, then close up, then the band and hems.'),
    GM('orderq')
  ]),
  lesson('u12l2', 'Slant (on-seam) front pockets', REF.shorts, [
    LS('Step by step', '1. Stay the slant opening with 1 cm wide cotton tape or a selvedge strip on the wrong side, eased very slightly (it stops the pocket gaping and stretching).\n2. Sew the **pocket bag** (lining side) to the front along the slant, right sides together; grade; **understitch** the bag to the allowances; turn it to the inside and press so the bag rolls 1 mm out of sight. Topstitch 1–2 mm and 6 mm.\n3. Sew the **pocket facing** (self fabric) to the other bag piece; serge or turn under its lower edge and stitch flat.\n4. Lay the facing-bag under the opening, matching the waist and side seam marks; baste across the waist and down the side seam.\n5. Close the bag: French seam (sew wrong sides together at 0.6 cm, trim, turn, sew at 1 cm) so no raw edges catch keys.\n6. Bar tack the bottom of the opening at the side seam (through all layers, after the side seam), and the top at the waist is caught in the band.'),
    LS('Durability details', '- **Pocketing**: tightly woven poly/cotton (120–140 g/m²) outlasts cotton lawn by years.\n- **Extend the bag** to the fly (a “stay” pocket): it holds the front flat and keeps the bag from twisting.\n- Bar tacks at the **lower** end of the opening — the most torn spot in casual trousers.\n- Rivets (jeans-style) are an alternative on heavy twill; see Unit 14.'),
    OR('Order the slant pocket.', ['stay the opening with tape', 'sew bag to the opening, understitch, turn, topstitch', 'attach the facing to the second bag piece', 'baste the facing-bag in place at waist and side', 'close the bag with a French seam'], 'Opening, facing, close.'),
    MC('Why stay the slant opening with tape?', ['Its bias edge stretches and the pocket gapes', 'For colour', 'To make it waterproof', 'It replaces topstitching'], 'Slanted edges are partly bias.', 'Bias stretches.'),
    TF('A French seam is a good way to close the pocket bag.', true, 'Encloses raw edges inside the bag so nothing frays or catches.', 'Clean inside.')
  ]),
  lesson('u12l3', 'Back welt and jetted pockets', REF.shorts, [
    LS('Jetted (double welt) pocket', 'Two narrow lips (jets), each 5 mm, frame the opening; the classic tailored back pocket.\n\n1. Interface the wrong side behind the box (5 × 17 cm). Mark the 14 × 1 cm box.\n2. Jets: cut two strips 18 × 4 cm, fold each lengthwise wrong sides together and press to 2 cm wide; mark a line 5 mm from the fold. Lay each jet on the right side with its **fold on the box centre line** and its raw edges pointing away; the marked lines now sit exactly on the two box lines. Stitch along them, exactly 14 cm long, backstitching.\n3. Cut through the panel only along the centre, Y-clip into the corners.\n4. Push the jets’ raw edges through to the wrong side; the two folds meet in the middle forming two 5 mm lips. Press.\n5. Stitch the triangles to the jet ends from the wrong side (several passes).\n6. Attach the pocket bag: lower bag to the lower jet, upper bag (with a self-fabric facing so the inside of the opening is not pocketing) to the upper jet; sew round the bag.\n7. Optional button tab and buttonhole for security; **bar tack** both ends.'),
    LS('Single welt', 'Like the shirt welt (Unit 9) but larger and on bottom weight: welt 16 × 8 cut, folded to 16 × 3.5, with interfacing. Seat back pockets take abrasion every time you sit, so make the welt from a firm piece on the straight grain and close it with bar tacks at both ends through the bag.'),
    OR('Order the jetted pocket.', ['interface and mark the box', 'stitch the folded jets along the box lines', 'cut and Y-clip the opening', 'turn the jets through and press', 'secure the triangles and attach the bag'], 'Same skeleton as a welt.'),
    MC('What should the stitched lines along a jetted pocket box be?', ['exactly the same length, ending at the box ends', 'one longer than the other', 'stopping short of the triangle', 'sewn with a long basting stitch'], 'Unequal lines give skewed corners and puckers.', 'Squareness.')
  ]),
  lesson('u12l4', 'Patch back pockets and back darts', REF.shorts, [
    LS('Back patch pockets', 'For workwear: 15 × 17 cm finished, top edge double-turned 1 + 2 cm and topstitched; corners mitred or the bottom pointed (pressed over a card template). Place 6–7 cm below the waist seam, angled slightly so the outer edge is 1 cm lower. Double topstitch 2 mm and 6 mm, and **bar tack or triangle** both top corners (they tear when you pull the shorts up by the pockets).'),
    LS('Back darts', 'Darts take waist intake from the back: 2 cm wide × 8–10 cm long, one or two per back. Sew from the wide end to the point, the last 1.5 cm right at the fold, run off the edge, tie the threads (no backstitch at the point — it bulges). Press toward CB over a ham. On heavy chino, cut along the fold to 2 cm from the point and press open to reduce bulk.'),
    GM('cutsize'),
    TF('Backstitching at a dart point gives a smoother point than tying off.', false, 'Backstitching builds a lump; tie the threads.', 'Bulk at the tip.'),
    MC('Which way are back darts pressed?', ['toward centre back', 'toward the side seam', 'open, always', 'downward'], 'Vertical darts conventionally go toward the centre.', 'Convention.')
  ])
]);

unit('u13', 13, 'shorts', 'f3', 'Shorts construction II: fly, seams, waistband, loops and hems', 'The zip fly (and button fly), the seat and inseam, a curtained or faced waistband with belt loops, hems, bar tacks and rivets.', [
  lesson('u13l1', 'The zip fly', REF.shorts, [
    LS('Pieces and zip', 'Men’s fly laps **left over right**. You need a metal or heavy-duty #4.5–5 trouser zip, 2 cm longer than the opening (typically an 18 cm zip for a 16 cm opening), a fly facing (left, cut-on or separate, interfaced) and a fly shield (right, double, interfaced). Pre-shrink the zip by soaking it in hot water and drying.'),
    LS('Step by step (separate facing method)', '1. Sew the front crotch seam from the inseam end up to the bottom of the fly mark, backstitching hard; finish the curve.\n2. Sew the **fly facing** to the left front edge, right sides together, at 1 cm; understitch; press the facing to the inside.\n3. Place the zip face down on the facing, its teeth 6 mm from the facing’s seam (toward CF), the bottom stop at the fly mark; stitch the left tape to the **facing only** (two rows).\n4. Right side: press the right front allowance under 6 mm less than the left (so it sits beside the teeth). Lay it over the right zip tape close to the teeth; edgestitch through right front + tape.\n5. Fold the shield over the right tape behind; stitch through shield + tape + right front from the inside, or catch it when edgestitching.\n6. From the outside, **topstitch the J** on the left front, 3.5 cm from CF, curving to the crotch seam — keep the shield folded out of the way.\n7. Bar tack at the bottom of the J (through all layers incl. the shield) and a second tack at the curve. These carry the load every time you sit.', DG('0 0 260 200', '<path class="f" d="M30 10 H130 V150 Q130 185 100 190 H30 Z"/><path class="g" d="M130 10 H230 V190 H140 Q130 185 130 150 Z"/><path class="b" d="M95 10 V140 Q95 170 128 172"/><rect x="125" y="12" width="8" height="130" fill="var(--ink)" opacity=".4"/><path class="o" d="M120 168 L134 176" stroke-width="4"/><text class="t" x="36" y="30">left front</text><text class="t" x="150" y="30">right front</text><text class="t" x="40" y="120">J topstitch 3.5 cm</text><text class="t" x="140" y="160">bar tack</text>', 'Zip fly from the outside: the J topstitch line and the bar tack at its base.')),
    OR('Order the zip fly.', ['sew the crotch seam up to the fly mark', 'attach and understitch the left fly facing', 'stitch the zip to the facing only', 'edgestitch the right front along the teeth and add the shield', 'topstitch the J and bar tack its base'], 'Seam, facing, zip, right side, J.'),
    MC('Why is the zip stitched to the facing alone before the J topstitch?', ['So the J line is a separate clean row and the zip tape is held by two rows', 'To save time', 'Because zips cannot go through three layers', 'To hide the teeth'], 'Independent rows: neat outside, secure inside.', 'Count the rows holding the tape.'),
    TF('On men’s shorts the fly laps right over left.', false, 'Left over right, like the shirt.', 'Same as menswear buttons.')
  ]),
  lesson('u13l2', 'The button fly', REF.shorts, [
    LS('Button fly', 'Heavier and repairable — no zip to fail.\n\n1. The left front gets a **cut-on or separate facing** with 4–5 buttonholes (vertical, 16–20L buttons, the first 2 cm below the waistband, spaced ~4 cm).\n2. Sew the **buttonholes through the left facing and a separate inner fly strip** (the left fly lining) so they do not go through the outer front — the outside shows only the J topstitch.\n3. The right side gets a doubled **button stand** (shield) with the buttons sewn through it, 2 cm in from CF.\n4. Topstitch the J and bar tack the base as for a zip fly.\n\nWorkwear option: shank (jeans-style) tack buttons hammered through, reinforced with a backing.'),
    MC('Why are button-fly buttonholes made in an inner strip rather than the outer front?', ['So the outside shows only the clean J topstitching', 'Because buttonholes are weaker on the outside', 'It uses fewer buttons', 'It is easier to iron'], 'Concealed fly.', 'Look at a pair of 501s from the outside.'),
    GM('ligne')
  ]),
  lesson('u13l3', 'Side seams, inseam and seat seam', REF.dur, [
    LS('Side seams', 'Sew front to back at 1.5 cm, through the pocket bag edges. Choices:\n\n- **Pressed open + serged edges**: flat, adjustable later.\n- **Flat-felled**: strongest, ready-to-wear workwear look, but not alterable.\n- **Serged together, pressed to the back, topstitched 6 mm**: a strong compromise.\n\nThen bar tack the base of the slant pocket opening through the seam.'),
    LS('Inseam and seat seam', 'Two orders:\n\n- **Inseam continuous** (jeans style): sew each leg’s inseam, then turn one leg inside the other and sew the seat seam in one pass from front fly to back waist. Fast and strong; awkward to alter.\n- **Seat seam last** (tailored): sew both inseams; then sew the crotch/seat seam from the fly round to the CB waist with a 2.5 cm CB allowance that tapers at the crotch — easy to let out.\n\nThe crotch curve is the most stressed seam in shorts: shorten to 2.0 mm, sew **twice** (the second row 2 mm inside the first in the curve), or flat-fell it. Match the inseams exactly at the crotch point; press the curve over a ham, clip nothing on a felled seam.'),
    MC('What is the advantage of sewing the seat seam last with a wide CB allowance?', ['The waist and seat can be let out later', 'It is the strongest possible method', 'It uses no thread', 'It hides the fly'], 'Tailored trousers are built for alteration.', 'Future you.'),
    TF('The crotch curve benefits from a second row of stitching.', true, 'It is a stress seam under constant bending.', 'Durability at the stress seam.'),
    GM('durq')
  ]),
  lesson('u13l4', 'Waistband: curtain, facing and belt loops', REF.shorts, [
    LS('Belt loops', 'Make one long strip: cut 4 cm × 60 cm, press both edges to the centre, then in half to 1 cm; topstitch both edges (a cover-stitch or twin needle is ideal). Cut 7 loops × 8 cm. Positions: one each side of CB (or one at CB), one at each back dart/side-back, one at each side seam (just behind), one at each front just past the pocket opening. Baste the lower ends to the shorts top edge, right sides together, pointing **down**, before the band goes on.'),
    LS('Waistband with curtain', 'A **curtain** is a bias strip (pocketing or self) stitched to the inside lower edge of the band — clean, comfortable, and it hides the band seam.\n\n1. Interface the outer band with firm woven/waistband interfacing (perforated fold-line type).\n2. Sew the outer band to the shorts top edge, right sides together, 1 cm; grade; press up.\n3. Inside, sew the curtain to the inner band’s lower edge.\n4. Fold the band at its fold line, right sides together, sew the ends (aligned with the fly edges: the left end flush with the fly front, the right end extending over the shield), turn.\n5. From the outside, **stitch in the ditch** of the band seam, catching the inner band/curtain behind.\n6. Fold the loops up, turn the top end under 1 cm, and **bar tack** each loop at top and bottom (top through the band, bottom just below the band seam). Loops ripped off by belts are the classic failure — two tacks per loop, through all layers.\n\n**Facing** alternative: a contoured facing cut from the pattern, understitched — for a beltless, flat-front look.'),
