unit("u5",5,"draft","op","Draft the straight dropped-shoulder body","A traceable paper starting block, including opening and hem decisions.",[lesson("u5l1","Straight front and back seam-line block",REF.pat,[LS("Straight front and back seam-line block","Draft on paper without seam allowances. Establish a vertical centre back and horizontal nape line. Let F be the straight finished circumference from Unit 4. Draw a back quarter rectangle width F/4 and chosen back length. At the top mark neck width approximately neck/5 from centre back; start back neck depth at about 2 cm. These are trial coordinates, not universal anatomy. Curve between them smoothly.\n\nAcross from centre back mark half measured shoulder width plus selected drop, usually a modest 2\u20136 cm for the first toile. Lower that outer shoulder about 3 cm as a starting slope and connect to the neck point. If this shoulder endpoint extends beyond the body side, widen the block or reduce drop; do not draw an inverted armhole. Mark the underarm vertically scye cm below the outer shoulder point. Draw the near-vertical armhole from shoulder to underarm and the side seam from underarm to hem.\n\nTrace the front quarter with the same side and shoulder seam lengths; start front neck depth around 8 cm and refine its curve. Keep front and back neck shapes separate. Check the combined neck seam against the intended opening."),LS("Workshop and acceptance check","For the 124 cm finished chest example, front and back quarters are 31 cm. Mark natural shoulder and dropped shoulder distinctly; sleeve length later subtracts the drop. Label centre lines, chest, underarm and hem. Walk the shoulder seams together along the stitching lines. Stop if any geometry overlaps or gives negative armhole width: the draft must be redrawn before cloth is cut."),MC("When are seam allowances added?",["After the seam-line draft has been checked", "Before choosing finished circumference", "Instead of ease", "Before locating shoulder seams"],"Seam lines must be walked and fitted before offset cut lines are drawn.","Return to the method and check the seam lines, not just the cut edges."),GM("quarter")]),lesson("u5l2","Hip, abdomen, side vents and shirt length",REF.pat,[LS("Hip, abdomen, side vents and shirt length","Measure hip at the actual hem level. A straight chest-sized rectangle is too narrow if a fuller hip or abdomen is ignored. The straight calculator therefore uses the larger chest or hip requirement. Alternatively blend from chest width to a wider hip line, checking the full finished hip circumference. Keep centre front/back on grain.\n\nMark waist and hip depth from the wearer, not from a fixed proportion. Blend the side in a shallow curve; match front and back side seam lengths after adjusting. A prominent abdomen can require both extra front width and a front-length wedge; the hem should hang level rather than being forced down by a belt.\n\nA 6\u201312 cm side vent can improve movement near the hips but is not a substitute for adequate circumference. Mark the vent stop at the seam line and reinforce it on scrap first. Choose hem length while sitting: a long tunic may catch under the seat or bunch under a waistcoat."),LS("Workshop and acceptance check","Pin the paper or a rough cloth tube around chest and hips. Check seated comfort and mark a level hem with a helper. Add a separate vent facing or sufficient turned allowance to the cut plan. Do not apply the rectangular yardage estimate blindly when you add flare, a curved hem or facings."),MC("What can a prominent abdomen require?",["Extra front length as well as width", "A shorter front regardless of fit", "A tighter cuff", "Removing hip ease"],"Projection uses fabric in both dimensions.","Return to the method and check the seam lines, not just the cut edges."),GM("quarter")]),lesson("u5l3","Full front or pullover slit",REF.pat,[LS("Full front or pullover slit","A full button front uses two mirrored fronts, each with a marked true centre front. Choose a finished overlap strip width before extending the pattern. One clear self-facing construction is a 3 cm finished placket whose centre lies on true CF: extend the finished outer edge 1.5 cm past CF, then add 6 cm for two 3 cm turns. Thus the raw edge lies 7.5 cm beyond true CF. This specific fold system needs no additional raw-edge SA there. Mark all fold lines on paper and make a sample. A separate placket uses different allowances.\n\nA pullover uses one full front on fold or two fronts seamed below a slit. Do not add the full-front extension. Mark a neck slit long enough for dressing access; test it with the closed neckline band in a toile. A facing or bound slit reinforces its base. Lace ties are decoration, not a way to force an undersized opening over the head.\n\nDo not mix extension systems. The piece lab gives conservative bounding rectangles, not this final fold geometry."),LS("Workshop and acceptance check","Build a paper placket, fold it twice and lay the CF lines over each other as they will close. Verify finished circumference excludes overlap. For a pullover, make a fabric neck ring and slit sample and test over the head without strain before finishing its edges."),MC("What is excluded from the finished chest circumference?",["Overlapping closure extensions", "Wearing ease", "The back panel", "The shoulder seam length"],"Overlapped cloth occupies the same space twice and does not add useful body room.","Return to the method and check the seam lines, not just the cut edges."),GM("bspace")])]);})();
(function(){const {LS,MC,TF,NU,OR,DG,unit,lesson,REF}=CG.H; const GM=id=>CG.GEN.make(id);
unit("u6",6,"draft","op","Draft and fit the shaped body","Full bust, projection, hip room and gathered alternatives for the female option.",[lesson("u6l1","Front/back allocation with high bust",REF.fit,[LS("Front/back allocation with high bust","Use full bust B, high bust H and chosen total bust ease E. The teaching calculator assigns back quarter (min(H,B)+E)/4 and front quarter (B+E)/2\u2212back quarter. With B=104, H=96 and E=24, back = 30 cm and front = 34 cm. Two fronts and two backs give 128 cm. This is width allocation only, not a bra cup formula or a completed fitted bodice.\n\nDraft front and back using the Unit 5 shoulder and armhole procedure but their separate quarter widths. Keep measured shoulder and back-width checks; do not widen the shoulders just because the bust is larger. For hips use at least (hip + hip ease)/4 per quarter in this simple system, blending to the actual fitted side seam. If abdomen or seat distribution differs, redistribute on the toile rather than assuming equal hip quarters.\n\nMeasure shoulder-near-neck to hem over the bust and compare back balance. Add front length where projection needs it, using a toile slash-and-spread rather than simply lowering the entire neckline."),LS("Workshop and acceptance check","Work B=104/H=96/E=24 on paper: back 30, front 34. Mark bust apex from the wearer, not an average chart. Check 2\u00d7front+2\u00d7back against B+E. The lab frontLengthAdd is an entered correction, not an automatically diagnosed full-bust adjustment. Never cut a dart merely because a number is shown."),MC("What does the allocation formula solve?",["Front and back widths at the bust level only", "Dart angle and position", "Complete fit without a toile", "Exact shoulder slope"],"Projection, balance and dart shaping require independent measurements and fitting.","Return to the method and check the seam lines, not just the cut edges."),GM("femaleallocation")]),lesson("u6l2","Full-bust adjustment and dart rotation",REF.fit,[LS("Full-bust adjustment and dart rotation","For a fitted yoke or less gathered body, start from a tested block that fits the upper chest. Mark bust apex. Draw a slash from hem through apex to the lower armhole, and one from side seam to apex. Cut leaving small paper hinges at the armhole and apex. Spread the front to add the missing half-front width at bust level while keeping CF straight. Let the side slash open into a dart and level the hem with a parallel spread as needed. Tape paper beneath and check armhole and shoulder lengths.\n\nA sewn bust dart ends short of the apex, often around 2.5\u20134 cm as a trial, adjusted to avoid a pointed shape. Fold on its centre line with legs matched; sew from wide end toward the tip, shorten the final stitches and tie thread tails rather than backstitching a hard lump. Press over a ham.\n\nTo retain a poet-shirt look, draw a new slash from neckline or yoke seam to apex. Close the side dart and let that slash open. The same control becomes neckline gathers. It is not deleted: its width must still be gathered to the receiving band."),LS("Workshop and acceptance check","Practise on paper first, then a toile. Mark the original and adjusted grainlines and bust point. Compare a sewn dart with rotated neckline gathers; choose the silhouette you want. The calculator dart field records your chosen intake but does not reshape the drawing or cut list: apply the adjustment manually and remeasure every affected seam."),MC("What happens when a side dart is rotated into neckline gathers?",["Its shaping is transferred to fullness at the neckline", "The extra front width disappears", "The back must be shortened equally", "The sleeve cuff becomes smaller"],"Dart rotation moves shaping around a pivot; it does not erase volume.","Return to the method and check the seam lines, not just the cut edges."),GM("gather")]),lesson("u6l3","Waist shaping, hip flare and length balance",REF.fit,[LS("Waist shaping, hip flare and length balance","A puffy shirt may remain loose at the waist. For a gently shaped female option, pin modest side-seam shaping below the bust, then blend to hip ease. Never remove bust room to get a narrow waist. If the desired waist is much smaller than the finished bust, divide intake between sides and optional waist darts rather than carving one sharp curve at the side. A loose shirt with a removable sash is the simplest reversible choice.\n\nSet the waist reference tape level on the toile. A front waist line that lifts at the bust indicates missing front length or width; a hem dropped evenly all around will not fix it. A centre-front fold pulled open suggests insufficient front room. Release basting at the tight point to see how much cloth is needed, then transfer that amount to paper.\n\nKeep enough hip room to sit and pull the shirt on. For large bust-to-waist differences, check button placement directly at fullest bust and use a concealed snap only after the pattern fits; a snap does not cure strain."),LS("Workshop and acceptance check","Fit over the intended underwear. Walk, sit, reach forward and lift arms. Record finished bust, waist and hip after pinning. Transfer changes to both sides unless a labelled asymmetric fit is intended. Rewalk side seams and redraw hem and facing after the adjustment."),MC("Which is the sound first response to a gaping bust opening?",["Check and correct front width and length balance", "Add more tension to the lacing", "Remove wearing ease", "Sew on a stronger button only"],"A stronger closure can merely transfer excessive stress to the cloth.","Return to the method and check the seam lines, not just the cut edges."),GM("femaleallocation")])]);})();

unit("u7",7,"draft","op","Puffy sleeves, gathers and gussets","Calculate fullness while preserving reach and dressing access.",[lesson("u7l1","Rectangular dropped-shoulder sleeve",REF.pat,[LS("Rectangular dropped-shoulder sleeve","This course starts with a low, rectangular sleeve rather than a tailored high sleeve cap. Trace a seam-line rectangle. Width S = measured biceps \u00d7 chosen puff multiplier; trial multipliers of 1.5\u20132.2 work for many lightweight cloths but must be sampled. Length = natural shoulder-tip-to-wrist arm measure \u2212 shoulder drop \u2212 finished cuff depth. With arm 64, drop 4 and cuff 6, sleeve length is 54 cm before allowances.\n\nFor a body with nearly straight armhole edges of scye 24 cm front and back, receiving armhole length is 48 cm. Biceps 34 \u00d7 puff 1.8 gives sleeve width 61.2 cm; top gather ratio is 61.2/48 = 1.275. At a wrist plus ease of 22 cm the cuff gather ratio is 2.782. These are distinct ratios. If the sleeve width is less than the walked armhole, the top needs easing or a redraft, not negative gathers.\n\nMark sleeve centre, front/back halves and quarter notches. Straight rectangular sleeves are forgiving costumes, not a substitute for a tailored shirt sleeve block."),LS("Workshop and acceptance check","Draft and label both sleeves, seam lines first. Add allowances later. Compare the calculator topGather using 2\u00d7scye to the actual walked armhole length; curved or altered armholes override the simplified formula. Check a bent elbow and forward reach in the toile. Do not compare cut-edge lengths."),MC("For arm 64, drop 4 and cuff depth 6, what is the sleeve seam-line length?",["54 cm", "74 cm", "60 cm", "64 cm"],"The extended shoulder and cuff already cover part of the arm.","Return to the method and check the seam lines, not just the cut edges."),GM("sleevelength")]),lesson("u7l2","Gathering without puckers or broken threads",REF.pat,[LS("Gathering without puckers or broken threads","Mark quarters on the source edge and receiving edge. Sew two long basting rows within the allowance, leaving long tails; do not backstitch. For a 1.5 cm join, trial rows at 0.6 and 1.0 cm keep both inside the seam allowance. Pull bobbin threads gently in pairs, distributing fullness between matching quarter marks. Leave the last short distance near the underarm or sleeve opening relatively flat to reduce bulk.\n\nA 66 cm sleeve edge gathered to a 22 cm cuff has ratio 3:1 and removes 44 cm of apparent edge length. The cuff stays 22 cm: never stretch it to consume gathers. Tie the tails around pins temporarily, baste, then stitch with the gathered layer visible and control folds with a blunt tool away from the needle. Remove temporary threads that show and finish the seam.\n\nFor fragile cloth, hand gathering with fine thread or three trial rows may control folds better. Cartridge pleating and tight decorative shirring are different constructions: do not substitute them without checking bulk and attachment strength."),LS("Workshop and acceptance check","Gather a 60 cm sample to 30 cm, then 20 cm. Press only the seam allowance so the sleeve stays rounded, not ironed flat. Inspect both sides for trapped tucks beyond the seam. Check quarter distribution and the cuff edge remaining straight."),MC("Which edge must not be stretched while gathering?",["The receiving cuff or armhole", "The excess gathering thread", "The paper pattern", "The fabric swatch label"],"Stretching the receiving edge changes its fitted size and makes a wavy seam.","Return to the method and check the seam lines, not just the cut edges."),GM("gather")]),lesson("u7l3","Underarm gussets and mobility choices",REF.pat,[LS("Underarm gussets and mobility choices","A dropped armhole can look roomy but lift the whole shirt when the arm rises. Before adding width everywhere, test a higher underarm opening, less shoulder drop or an underarm gusset. A square gusset provides fabric along diagonal lines when the arm lifts. Make a 10\u201314 cm seam-line square as a toile trial rather than treating that range as a size rule.\n\nMark four gusset corners on seam lines. Leave matching seam sections unsewn at the body/sleeve underarm junction. Baste each gusset side to its corresponding opening edge, stopping exactly at each corner seam point; pivot the fabric without catching allowances. Clip only where needed toward the pivot and reinforce a vulnerable corner with a small fabric patch. Finish allowances without cutting into the corner stitches.\n\nA gusset changes the assembly plan and pattern list. The simple rectangular calculator does not add it automatically. Include gusset fabric, reinforcement and changed sleeve/side openings manually. Do not cut a random hole in a finished shirt."),LS("Workshop and acceptance check","Make a half-body mobility toile with and without a gusset. Reach overhead and forward; compare hem lift and strain at the underarm. Choose one solution and mark the four matching seam lengths before making the other side. Take care that clipping stops short of stitches."),MC("What must match at a gusset corner?",["The marked seam-line pivot points", "Only the raw cut corners", "The button diameters", "The grainline labels alone"],"Seam-line control prevents holes and trapped allowances at intersecting seams.","Return to the method and check the seam lines, not just the cut edges."),GM("gather")])]);})();

unit("u8",8,"draft","op","Necklines, bands and collar patterns","Plan a safe head opening, gathered neck or romantic collar.",[lesson("u8l1","Measure a neckline, not a cut edge",REF.shirt,[LS("Measure a neckline, not a cut edge","Staystitch the trial neckline just inside its seam line before handling. Walk the front and back paper neckline stitching lines with a tape on edge, excluding seam allowances and any closure overlap counted twice. A low open neckline may be much longer than neck circumference; a gathered neckline can be reduced to a band near neck circumference plus comfortable ease. The calculator neck+2 is only a provisional closed-neck target.\n\nFor a straight 2.5 cm finished band, start with seam-line length equal to the actual attachment neckline plus a separately planned closure overlap, and seam-line depth 2.5 cm for each of two layers. Add end/top/bottom allowances. With a one-piece folded band the depth is twice finished depth plus two allowances. These are different cut systems. A shaped band can sit better on a close neckline; draft it from a fitted neck curve and test in paper then cloth.\n\nMark CB, shoulders, true CF and finished ends. A band must not be used to force a too-short opening over the head."),LS("Workshop and acceptance check","Walk the neckline twice and compare with a basted tape measurement on the toile. Make a paper neck ring with the intended slit/closure. Check breathing, head turning and dressing access. The cut-list band is provisional; replace its length with the measured neckline and your chosen closure system."),MC("Which length controls a non-gathered collar band attachment?",["The neckline stitching-line length", "The raw cut edge", "Neck circumference alone for every style", "The cuff circumference"],"Curved raw edges are longer or shorter than their stitching lines.","Return to the method and check the seam lines, not just the cut edges."),GM("gather")]),lesson("u8l2","Gathered neck and ruffle formulas",REF.shirt,[LS("Gathered neck and ruffle formulas","A gathered-neck poet shirt needs a wider upper body or rotated dart fullness. Walk the full ungathered neckline N. Choose a comfortable band attachment target T from the toile. Ratio is N/T; for example 84 cm to 42 cm is 2:1. Keep shoulder joins and closure ends relatively flat, and distribute gathers in the chosen zones symmetrically rather than crowding every centimetre equally.\n\nFor a straight-grain ruffle, finished source length = attachment length \u00d7 chosen fullness ratio. A 42 cm band at 1.75 fullness needs 73.5 cm ruffle seam-line length, plus end finishes and joins. For a single-layer 5 cm visible ruffle with a 1 cm attaching allowance and 0.6 cm narrow hem allowance, cut depth is 6.6 cm. A folded double-layer ruffle has a different depth: 2\u00d7visible depth + 2\u00d7attachment allowance.\n\nA circle ruffle gets flounce from curved geometry and is not calculated by the same gather ratio. Test its drape separately."),LS("Workshop and acceptance check","Make a 20 cm band sample with a 35 cm ruffle. Finish the outer ruffle edge before gathering the inner one. Compare single- and double-layer bulk at a seam. Add ruffle pieces manually to the yardage lab; they are not in its base shirt list."),MC("A 42 cm attachment at 1.75 fullness needs what seam-line ruffle length?",["73.5 cm", "24 cm", "42 cm", "75.5 cm including arbitrary allowance"],"Multiply attachment by fullness first; add actual allowances afterwards.","Return to the method and check the seam lines, not just the cut edges."),GM("gather")]),lesson("u8l3","Collar fall, open V and modesty panel",REF.shirt,[LS("Collar fall, open V and modesty panel","For a fall collar, first fit the band and neckline. Trace the band upper seam length as the collar attachment reference. Sketch half a collar from CB to front end; choose a trial fall depth of 5\u20138 cm, with round or pointed front. The outer edge needs enough length to roll over the shoulder; a straight rectangle on a tight curve may stand upright. Paper-test the roll, then a cloth sample. Cut upper and under collar and a light interfacing if required. Allow a small turn-of-cloth adjustment in the upper layer after testing, not a fixed amount for all cloths.\n\nFor an open V, draw the desired depth on the wearer with the toile closed at CF. Preserve shoulder width and avoid slicing past the chosen neckline. Trace a facing about 4\u20135 cm wide, matching the neckline seam line exactly. A removable modesty panel can sit behind a deep lace opening without changing the body fit.\n\nNo closure should put pressure on the throat; shorten ties and avoid long loops that snag."),LS("Workshop and acceptance check","Baste collar or V facing to a toile. Turn the head, bend, reach and inspect coverage in movement. Decide whether the collar is ornamental, buttoning or deliberately open, and label the pattern accordingly. Check the underside for sharp or abrasive trim."),MC("What should be fitted before the collar fall?",["The neckline and band", "The decorative button colour", "The final ruffle hem only", "The sleeve hem"],"The collar must attach to a stable, known neckline.","Return to the method and check the seam lines, not just the cut edges."),GM("bhlen")])]);})();

unit("u9",9,"draft","op","Toile, pattern truing and allowances","Turn a plausible draft into a checked sewing pattern.",[lesson("u9l1","Make a useful toile",REF.fit,[LS("Make a useful toile","Use inexpensive fabric with similar weight and drape to the planned cloth. A stiff calico sleeve cannot predict a soft viscose sleeve exactly. Mark CF, CB, chest/bust, waist, hip, grainlines, seam lines and bust apex where relevant. Cut both sleeves and enough closure detail to test dressing; a sleeveless fitting misses the major mobility problem.\n\nBaste shoulders and side seams, fit a temporary neck finish, baste sleeve gathers and a cuff. Leave generous fitting allowances at adjustable seams, but do not include them in finished circumference measurements. Pin or baste the closure at true CF, with actual overlap. Do not pin a pullover closed so tightly it cannot come off safely.\n\nFit balance first: neck and shoulders, then chest/bust/back, hip and lengths, finally sleeves and trim. Test breathing, forward reach, seated comfort, bent elbow and overhead reach. Stop if there is pain, numbness or restriction; a costume is not protective clothing or support equipment."),LS("Workshop and acceptance check","Photograph front, back and sides with consent or sketch the wrinkles. Record corrections in centimetres on a fitting log. Release a strained basted seam before guessing: the opening shows where fabric is missing. Make a second toile if a major bust, shoulder or armhole change affects several seams."),MC("Why include a sleeve and cuff in the toile?",["They reveal reach, length and dressing-access problems", "They remove the need to test the body", "They determine colourfastness", "They prove final durability"],"The assembled geometry matters more than an isolated body tube.","Return to the method and check the seam lines, not just the cut edges."),GM("sleevelength")]),lesson("u9l2","Walk seams and true corners",REF.fit,[LS("Walk seams and true corners","Remove fitting pins carefully and transfer the new stitching lines to paper. Walk matching seam lines, pivoting the pattern at curves rather than comparing raw edges laid flat. Shoulder seams must match; side seams must match unless an intentional eased section is marked. Sleeve top length minus planned gathers must equal the actual armhole attachment. Fold darts as sewn before truing their side-seam edges.\n\nAt a hem/side junction, fold the hem allowance up before cutting its side edge so it fits when turned. At cuff and placket corners, simulate the fold layers on paper and check the intended finished edges line up. Smooth abrupt jogs with a ruler or curve; avoid changing a measured seam silently while smoothing.\n\nLabel each piece with name, version/date, size or wearer code, cut quantity, mirrored or on-fold instruction, grainline, notches, seam allowance by edge and interfacing. One notch for front and two for back is a useful convention if used consistently."),LS("Workshop and acceptance check","Pair every join on a seam map. Add quarter marks at gathered joins and exact corner points for gussets. Preserve the original draft and a separate corrected master; do not lose the ability to see what changed. Recalculate yardage from the final pieces."),MC("Which edges are walked to check a join?",["Stitching lines", "Raw edges only", "Grainlines only", "The shortest bounding rectangles"],"Allowances change raw-edge lengths, especially on curves.","Return to the method and check the seam lines, not just the cut edges."),GM("gather")]),lesson("u9l3","Allowance map and cut lines",REF.fit,[LS("Allowance map and cut lines","Choose allowances by finish, not by habit. This course commonly uses 1.5 cm on body construction seams, 1 cm on bands/collars/cuffs, and a 4 cm straight hem turned 1+3 cm. A narrow curved hem can use 1.2 cm turned 0.6+0.6 instead; redraw that edge and update yardage. The selected allowance must be marked per edge.\n\nThe calculator has one SA input for simple bounding rectangles. It cannot encode every edge-specific finish, placket fold or dart. Treat its outputs as a planning aid; replace them with your trued paper pattern. A folded cuff of closed circumference 22, overlap 2, depth 6 and allowance 1 has cut length 26 and depth 14 cm. The sleeve gather joins only the 22 cm closed portion, not the 2 cm overlap tab.\n\nDo not add allowance on a fold edge. A centre-back full-width piece and a half-back cut on fold have different cut quantities. Notches are small marks within the allowance, never deep cuts into the seam."),LS("Workshop and acceptance check","Colour seam lines blue and cut lines red. Write an allowance schedule next to the cutting list. Make a paper cuff and front-opening sample. Confirm every raw edge can be enclosed by its chosen finish without stealing garment ease."),MC("A half back placed on a fold needs how much SA at CB?",["Zero", "1.5 cm always", "3 cm for gathering", "The same as the hem"],"There is no seam at the uncut fold.","Return to the method and check the seam lines, not just the cut edges."),GM("piratecuff")])]);})();

unit("u10",10,"sew","op","Cutting, yardage and project control","Inventory every piece and cut on grain without relying on an optimistic estimate.",[lesson("u10l1","Cut list and grain-preserving layout",REF.pat,[LS("Cut list and grain-preserving layout","A base full-front shirt needs two mirrored fronts, one full back or one half back on fold, two sleeves, two folded cuffs, neck finish layers, sleeve-slit bindings and the required interfacing. Add any yoke layers, ruffles, gussets, facings, pockets, modesty panel and ties. The lab's base cut list does not include these variations. Use final pattern measurements, not body measurements, for purchasing.\n\nThe lab packs bounding rectangles into shelves without rotating pieces; its length is a conservative planning estimate for those rectangles, not an optimised marker or printable pattern. It reports pieces wider than the usable cloth. Such a piece has not been magically accommodated: use wider cloth, reduce fullness or design a grain-compatible seam and recalculate. If even one piece is omitted, the displayed length is incomplete.\n\nReserve selvedges, defects and matching allowance. One-way cloth must stay in one direction; stripe matching needs additional length. In a double-layer layout prove the lower layer is flat and mirrored correctly. Single-layer cutting is safer for slippery cloth."),LS("Workshop and acceptance check","Lay every paper piece within a measured fabric-width rectangle on the floor or table. Tick cut quantities and interfacing separately. Compare physical layout length with the lab, then add design-specific matching and contingency. Keep the motif direction consistent on both sleeves."),MC("What does a too-wide warning mean?",["That piece is excluded until the design or cloth width is changed", "The piece was rotated automatically", "The shirt will fit anyway", "Only the grainline label is wrong"],"A shelf estimate containing omitted pieces is not a complete yardage figure.","Return to the method and check the seam lines, not just the cut edges."),GM("yards")]),lesson("u10l2","Buy length and shrinkage correctly",REF.pat,[LS("Buy length and shrinkage correctly","For an unwashed bolt, a trial length estimate can compensate for measured lengthwise shrinkage: buy length = postwash layout length/(1\u2212shrink fraction), then add an explicit contingency. For layout 300 cm, 4% shrinkage and 10% extra: 300/0.96\u00d71.10 = 343.75 cm. Round up to the shop's selling increment. Do not apply shrink compensation again to cloth that has already been washed and measured.\n\nLength compensation does not preserve width. If usable width after washing is 138 cm rather than 145 cm, rerun the layout at 138 before calculating length. Some materials grow or skew; use measured data and manual review rather than accepting an unsupported calculator input. The buy lab permits shrinkage 0\u201349%; this is a validation boundary, not a recommended textile property.\n\nBudget includes cloth, toile, interfacing, buttons, thread, trim, replacement needles and mistakes. Keep batch numbers for fabric and trim. A remnant can be cheap but too short once its defects and one-way print are respected."),LS("Workshop and acceptance check","Write two numbers: usable postwash width and required postwash length. Calculate purchase length with your measured shrinkage, then round up. Retain a labelled repair patch from the same batch. For already-prewashed cloth set shrinkage compensation to zero."),MC("What must you do if washing narrows the cloth?",["Rerun the layout at the new usable width", "Only increase the button count", "Assume length compensation solves width", "Rotate every sleeve across grain"],"Shelf arrangement depends on actual available width.","Return to the method and check the seam lines, not just the cut edges."),GM("shrinkcut")]),lesson("u10l3","Cut, mark and bundle",REF.pat,[LS("Cut, mark and bundle","Press the prepared cloth flat without stretching. Place the grainline parallel to selvedge and check it at both ends. Weigh or pin the paper; mark notches, fold lines and critical seam points before removing it. Use tailor tacks or tested removable marks for bust apex, dart legs and gusset corners. Test pens on a washed scrap; some marks set permanently under an iron.\n\nCut with the cloth supported on the table and the lower shear blade flat. Use small controlled snips around curves. Keep rotary cutters guarded when set down and use a mat. Mirror asymmetric pieces deliberately; two identical left fronts cannot form a mirrored pair. Keep right and wrong sides identified with a removable label.\n\nBundle left/right sleeves with matching cuffs and slit bindings. Keep the original pattern with the corrected version number. Cut interfacing with the orientation and coverage specified by its manufacturer; fuse a test before committing every cuff. Do not over-handle necklines before staystitching."),LS("Workshop and acceptance check","Count all pieces against the cut list before sewing. Mark a chalk arrow along each sleeve grainline and quarter marks at top and cuff seam lines. Keep small pieces in a tray. Photograph the laid-out set for your own reference, without publishing body measurements or wearer identifiers."),MC("How do you avoid cutting two left fronts?",["Check mirrored orientation and cut quantity before cutting", "Add extra seam allowance", "Use a longer stitch", "Ignore the fabric face"],"A quantity of two is not the same as a mirrored pair.","Return to the method and check the seam lines, not just the cut edges."),GM("grainerr")])]);})();

unit("u11",11,"sew","op","Construct front openings","Button fronts, faced slits and decorative lace-up options.",[lesson("u11l1","Sew a double-fold button placket",REF.shirt,[LS("Sew a double-fold button placket","Use the exact fold system tested in Unit 5. For its 3 cm finished placket with raw edge 7.5 cm beyond true CF, press the outermost 3 cm inward, then turn another 3 cm toward the wrong side. The finished outer edge lies 1.5 cm past CF; the inner folded edge lies 1.5 cm inside CF. The centre of the strip is true CF. Light interfacing inside the finished strip supports holes but should not make a board.\n\nStitch close to the inner fold on a sample, then on both fronts. Press rather than drag the iron. Check equal width along the whole front and that the two CF lines coincide when overlapped. The completed garment circumference is measured at aligned CF, not from one outer placket edge to the other.\n\nFor a separate placket, draft a different piece with attachment seam allowance, finished width and return allowance; sew a sample instead of borrowing the self-facing extension. Choose left-over-right or right-over-left by preference and label it before marking holes."),LS("Workshop and acceptance check","Hold the fronts together at CF on a flat surface. Neck and hem marks should align and the plackets should remain straight without pulling. Unpick and correct a twisting placket before attaching the neck finish; a collar will not straighten an off-grain front."),MC("Where is true CF in this 3 cm placket?",["At the middle of the finished strip", "At the raw cut edge", "3 cm outside the finished shirt", "At the side seam"],"Its outer edge extends 1.5 cm beyond CF, leaving the centre on CF.","Return to the method and check the seam lines, not just the cut edges."),GM("bspace")]),lesson("u11l2","Faced pullover slit and bound V",REF.shirt,[LS("Faced pullover slit and bound V","Mark the slit stitching line and bottom stop on the front. Cut a facing long and wide enough to extend several centimetres below and beside the slit; finish its outer edges. Place facing right sides together on the front and stitch a narrow U around the marked opening. Shorten stitches near the bottom. Only after stitching, cut between the rows and clip diagonally toward the bottom corners, stopping just short of thread. Turn facing inside, press and understitch where accessible.\n\nFor a simple bound slit, slash only the tested length and spread it nearly straight while attaching a bias binding. Avoid a tuck at the base; fold binding over the raw edge and secure. The sample should lie flat and the opening should survive a gentle dressing pull. Reinforce the bottom discreetly if needed with an extra fabric patch or small tack suited to the cloth.\n\nDo not cut the final slit until the exact facing geometry has worked in scrap. A deep cut past the stitching cannot be restored by pulling the seam tighter."),LS("Workshop and acceptance check","Make a full-size neckline/slit sample first. Try the opening over the head with band or binding attached. Check the slit base under a light pull; no raw edge should escape and no unplanned hole should show. If access is too tight, redesign the slit or opening rather than forcing it."),MC("When is the slit cut in a faced opening?",["After its surrounding stitching is secure", "Before marking the bottom stop", "After every seam is clipped through", "Only after the shirt is washed"],"The stitched outline controls and reinforces the cut.","Return to the method and check the seam lines, not just the cut edges."),GM("gather")]),lesson("u11l3","Lacing loops, eyelets and modesty",REF.shirt,[LS("Lacing loops, eyelets and modesty","Lacing is a decorative closure on a comfortably fitted shirt. For fine cloth use stitched fabric loops or reinforced stitched eyelets rather than heavy hardware that can tear through. Place loop ends inside a reinforced facing seam; test a pull on a sample. Keep the lace opening wide enough that it is not carrying body strain. A modesty panel can be basted or buttoned behind it.\n\nIf using metal eyelets, choose smooth garment hardware with washers and the maker's correct tool. Reinforce with stable fabric interfacing and test the hole size. Follow the tool instructions, wear eye protection when setting hardware and keep fingers away from the striking area. Reject rough or loose hardware; do not assume every craft eyelet is suitable against skin or frequent washing.\n\nUse short removable ties and avoid long loops. Puffy shirts are adult apparel here; long cords and loose sleeves are inappropriate near moving machinery, flames and certain work activities. Remove or secure lacing for laundering."),LS("Workshop and acceptance check","Mark matching eyelet or loop positions from the same datum on both sides; use the spacing lab only as a starting grid and adjust around neckline ends. Tug-test, rub-test against a scrap and launder the sample. Check the wearer can undo the closure readily without tightening around the neck."),MC("What should the lacing carry?",["Light decorative closure loads after the body fits", "All the force of an undersized bust", "The whole sleeve weight through the neck", "Body compression"],"Correct fit avoids transferring unnecessary load to small eyelets and thin cloth.","Return to the method and check the seam lines, not just the cut edges."),GM("bspace")])]);})();
(function(){const {LS,MC,TF,NU,OR,DG,unit,lesson,REF}=CG.H; const GM=id=>CG.GEN.make(id);
unit("u12",12,"sew","op","Shoulders, yokes and neckline assembly","Work flat, control gathers and enclose the neck neatly.",[lesson("u12l1","Shoulder joins and optional double yoke",REF.shirt,[LS("Shoulder joins and optional double yoke","Before joining the body, complete darts or rotate their fullness into the planned gather zone, and add any chest pocket that would become awkward later. Staystitch neck curves. Join simple shoulders on their marked seam lines, press, and finish with the chosen seam sample. Confirm the shoulder points and CF/CB references remain undistorted.\n\nA double yoke supports shoulder gathers and hides raw edges. Draw the yoke seam on the fitted body, trace upper front/back shapes and add separate seam allowances to the newly created edges. Any extra lower-body width is gathered to the yoke seam, not silently removed. Cut outer and inner yoke layers and label them clearly.\n\nFor a burrito-style yoke, attach outer and inner yokes to the lower back with raw edges enclosed. Attach front shoulders to the outer yoke, roll the body loosely inside and bring the inner yoke shoulders around to meet the joins. Stitch without trapping the roll, then pull through a free side/neck opening. Try this sequence in scrap first; do not close every escape opening."),LS("Workshop and acceptance check","Lay the body flat after turning the yoke. Check the layers are untwisted and equally long. Press with a cloth and avoid flattening decorative body gathers. The base calculator has no yoke pieces: add both layers and revised body lengths to the cutting plan."),MC("What must remain when enclosing a burrito yoke?",["An opening through which the body can be turned", "A raw neckline cut past the seam", "An unmarked sleeve", "Extra cuff overlap"],"The enclosed body roll needs a clear exit.","Return to the method and check the seam lines, not just the cut edges."),GM("gather")]),lesson("u12l2","Attach a band to a gathered neck",REF.shirt,[LS("Attach a band to a gathered neck","Stabilise the band layer that will hold the neckline. Sew band outer and inner short ends/top as required by your tested construction, leaving the lower attachment edge accessible. Mark CB, shoulders and CF on band and body. Gather only the designated body zones to match; check that the full seam length fits without stretching the band.\n\nWith right sides together, stitch the outer band to the shirt neckline on the marked seam. Keep the inner band and closure tabs clear. Check for trapped folds on the right side before trimming. Grade allowances in layers and clip curved concave sections only as necessary, never through the seam. Press the join toward the band. Turn the inner band allowance under and hand-slipstitch or stitch-in-the-ditch from the outside, catching the inside fold consistently.\n\nIf the neckline is plain, skip gathering; walk it exactly. If it is gathered, compare remaining fullness at left and right front. Collar ends must align with the planned finished opening, not with arbitrary cut edges."),LS("Workshop and acceptance check","Baste the band before permanent stitching. Close it on the toile wearer and test neck turning and dressing access. Inspect inside to ensure every raw edge is enclosed and the inner layer was caught. Do not trim allowances until the band lies comfortably."),MC("Which layer controls the gathered neckline length?",["The stabilised receiving band", "The longest loose basting thread", "The raw sleeve edge", "The top button thickness"],"The fitted band is the reference; the gathered body is adjusted to it.","Return to the method and check the seam lines, not just the cut edges."),GM("gather")]),lesson("u12l3","Sew and attach a fall collar or facing",REF.shirt,[LS("Sew and attach a fall collar or facing","Place upper and under collar right sides together with tested turn-of-cloth allowance. Sew the outer edge and front ends, leaving the band attachment open. At a sharp point take a short diagonal stitch or two rather than sewing past the corner. Grade allowances, trim corner bulk without nicking thread and turn with a blunt point tool. Roll the seam slightly underneath and press over a ham.\n\nBaste the collar attachment edge with CB and front notches aligned. Sandwich it between band layers according to your sample, keeping collar points out of the seam. Check symmetry before topstitching. An open V facing is instead sewn directly to its matching neckline, clipped carefully, turned, understitched and secured discreetly at shoulders so it does not flip outward.\n\nA deep collar, lace edge or ruffle adds weight. If it drags the neckline away from the body, reduce weight or reinforce the supporting layer rather than tightening the neck. Choose soft seam finishes where the garment touches skin."),LS("Workshop and acceptance check","Check both collar points together on a flat surface. Look from front and back for seam roll and band twisting, then wear-test. For a facing, raise arms and bend: it should stay inside without pulling the neckline. Rework before adding decorative topstitching."),MC("Why grade collar allowances?",["To reduce stacked bulk when turned", "To make all seams weaker", "To enlarge the finished neckline", "To replace interfacing"],"Different-width layers distribute bulk and allow a smooth edge.","Return to the method and check the seam lines, not just the cut edges."),GM("spi")])]);})();

unit("u13",13,"sew","op","Assemble sleeves and body","Flat sleeve setting, gussets and durable enclosed seams.",[lesson("u13l1","Bind the sleeve opening while flat",REF.shirt,[LS("Bind the sleeve opening while flat","Mark the sleeve back half distinctly. Place the wrist slit in that half, not randomly on the sleeve centre; transfer a position chosen on the toile and mirror it for the other arm. Trial a slit around 10\u201312 cm, long enough to let the hand pass with the cuff open. The lab open-perimeter estimate is only an access check, not proof of passage around a real hand.\n\nCut and bind a continuous lap opening on the flat sleeve. Open the slit nearly straight and stitch binding to its edge, allowing the smallest seam at the pivot without creating a tuck. Turn binding over the raw edge, stitch down, then fold the sleeve back into position and stitch a small diagonal at the base if your sample needs it. Fold the overlap side inward so the outside looks neat.\n\nA shaped tower placket is a more complex alternative: make a paper sample and sew on scrap before using it. Keep the left and right plackets mirrored and their finished lengths equal."),LS("Workshop and acceptance check","Open and close a paper/fabric cuff-and-slit mockup around the closed hand. Check no raw slit base remains exposed, and that the opening falls toward the back of each wrist. Do this before sleeve side seams make access harder."),MC("When is the sleeve slit easiest to sew?",["While the sleeve is flat", "After the cuff is permanently closed", "After final buttons only", "After the sleeve is stuffed for pressing"],"Flat access helps control the pivot and binding.","Return to the method and check the seam lines, not just the cut edges."),GM("piratecuff")]),lesson("u13l2","Set a low gathered sleeve flat",REF.shirt,[LS("Set a low gathered sleeve flat","Lay the body open with shoulders joined. Match the sleeve centre to shoulder seam and underarm ends to the front/back body underarm points. Match quarter marks and adjust top gathers to the actual armhole seam line, leaving underarm areas flatter. Do not rotate the sleeve so the wrist slit faces forward. Pin perpendicular to the join, remove pins before the foot, then baste.\n\nSew the sleeve-to-body join with the gathered layer visible. Use a normal construction stitch, not the long gathering setting. Inspect the right side for accidental pleats extending beyond the seam. Finish allowances together with an overlock or lightweight binding if a French seam sample was too bulky. Press allowances toward the sleeve or body according to the sample; do not crush the puff.\n\nThis flat setting suits the dropped rectangular sleeve. A high tailored sleeve cap may require setting in the round and different easing; it cannot be substituted just by keeping this sequence."),LS("Workshop and acceptance check","Compare both arms before closing sides. The top fullness should be deliberate and balanced. Test forward reach with the join basted; changing armhole or sleeve width is easier now. Confirm any gusset opening lengths are left free as marked."),MC("What setting should sew the final sleeve join?",["The tested construction stitch length", "The longest gathering stitch permanently", "No bobbin tension", "Only hand tacking at four points"],"Gathering threads shape the edge temporarily; the construction seam carries load.","Return to the method and check the seam lines, not just the cut edges."),GM("gather")]),lesson("u13l3","Close sides, insert gussets and finish",REF.shirt,[LS("Close sides, insert gussets and finish","Without gussets, align wrist-to-underarm-to-hem with right sides together. Match the sleeve/body join and sew the sleeve side and body side, stopping at any vent mark. Press and finish according to the sample. If using French seams, the first pass begins wrong sides together and the second right sides together; reserve enough total allowance and avoid bulky gathered intersections.\n\nWith gussets, follow the seam map: join each gusset side to its corresponding marked sleeve/body opening, stopping at seam-point corners. Keep adjacent allowances free so the next side can turn. Baste all four sides before closing the remaining sleeve and side seams. Check for a pinhole, trapped tuck or a corner sewn past its pivot. Add a small reinforcement patch if the tested cloth needs it.\n\nFor a flat-fell, sew the first join at its full allowance, trim one allowance, wrap the wider one around it and topstitch through all intended layers. A severe underarm angle may be better bound than forced into a bulky fell."),LS("Workshop and acceptance check","Inspect all underarm intersections inside and out under light tension. No hole, clipped thread or raw corner should show. Reach overhead and observe hem lift. If movement fails, return to geometry instead of strengthening a strained seam indefinitely."),MC("What is a warning sign at a gusset corner?",["A pinhole or trapped tuck under light tension", "A labelled grainline", "A smooth pressed allowance", "Matching quarter marks"],"The seam points may not meet correctly or may have been clipped too far.","Return to the method and check the seam lines, not just the cut edges."),GM("spi")])]);})();

unit("u14",14,"sew","op","Cuffs, wrist finishes and closures","Keep the puff while fitting a comfortable, openable wrist.",[lesson("u14l1","Cuff pattern and turn of cloth",REF.shirt,[LS("Cuff pattern and turn of cloth","Separate three lengths: closed cuff circumference = wrist + wearing ease; flat finished cuff length = closed circumference + overlap; cut length = flat length + two end allowances. Wrist 18, ease 4, overlap 2 and allowance 1 gives closed 22, flat 24, cut 26 cm. A folded 6 cm deep cuff with 1 cm attachment allowance on both edges is cut 14 cm deep.\n\nThe 2 cm overlap is a tab, not wearing ease and not part of the sleeve gathering target. Mark where the 22 cm attachment ends and where the overlap begins. A thick cuff needs more turn-of-cloth than a fine cotton cuff; baste around the wrist and test before stitching the final edge. The hand passes through the unbuttoned cuff plus opened slit, not necessarily through the closed cuff ring.\n\nInterface only as much as needed for the buttonhole and crispness. Very stiff cuff interfacing beside soft lawn can create abrasion at the join. Pretest the fused or sewn layer for bubbling after laundering."),LS("Workshop and acceptance check","Fold a paper cuff, mark closed circumference, tab, seam allowances and button centre. Make a fabric sample using the actual layers. Check a watch and bent wrist if relevant. The course default SA is 1.5 cm; set the cuff lab to 1 cm for this worked example."),MC("What is the gathering target for the example cuff?",["22 cm", "26 cm", "24 cm", "18 cm"],"Gather the sleeve to the closed attachment portion, excluding overlap and allowances.","Return to the method and check the seam lines, not just the cut edges."),GM("piratecuff")]),lesson("u14l2","Attach cuff to the gathered sleeve",REF.shirt,[LS("Attach cuff to the gathered sleeve","Finish the slit first and identify its overlap/underlap sides. Mark cuff attachment endpoints and quarters. Gather sleeve lower edge to the cuff's attachment length, leaving placket ends flatter. Baste with right sides together so the intended cuff tab extends beyond the appropriate sleeve opening. Compare left and right before committing: they must be mirrored, not two identical hands.\n\nStitch outer cuff to sleeve on the seam line, check for trapped folds, grade allowance and press toward the cuff. Fold the cuff right sides together along its outer fold, stitch short ends and tab according to the tested pattern, then turn and press. Turn the inner cuff seam allowance under to just cover the attachment stitching and slipstitch or stitch-in-the-ditch, checking that it catches evenly.\n\nRemove visible gathering threads. Edgestitch only after the cuff lies flat and all raw edges are enclosed. Place a button so the closed circumference equals the fitted value; do not let the overlap consume wearing ease."),LS("Workshop and acceptance check","Baste both cuffs and wear-test before trimming. Check mirrored openings, equal sleeve lengths and comfortable elbow bend. If folds stack heavily near a buttonhole, redistribute gathers rather than sewing through an unstable lump."),MC("Why leave gathers flatter near the slit ends?",["To reduce bulk at the opening and closure", "To remove all sleeve fullness", "To make the cuff stretch", "To hide the wrong sleeve length"],"The placket and buttonhole need stable, controllable layers.","Return to the method and check the seam lines, not just the cut edges."),GM("gather")]),lesson("u14l3","Elastic casing and open ruffle alternatives",REF.shirt,[LS("Elastic casing and open ruffle alternatives","An elastic wrist is an alternative to a buttoned cuff, not an addition to the same length formula. Measure comfortable elastic around the wrist while flexed and test it in the intended casing. Cut elastic from that test plus a secure join allowance. Elastic stretch varies; wrist minus a fixed percentage is not reliable for every product. The opening must pass over the hand without excessive stretch or skin pressure.\n\nFor a casing, reserve enough sleeve depth for a turned channel slightly wider than elastic, plus the raw-edge turn. Sew, leaving a threading gap. Insert elastic without twisting, join securely using the manufacturer's suitable method, distribute fullness and close the gap. Avoid stitching through elastic unintentionally. A narrow ruffle can extend beyond the casing if its fold/attachment line is planned in advance.\n\nFor an open ruffle cuff, use ties or buttons if needed for access. Keep trailing fabric clear of hands and hazards. A decorative wrist should never cause tingling, cold fingers, numbness or persistent pressure marks."),LS("Workshop and acceptance check","Wear the sample for ordinary movements and remove it if uncomfortable. Wash-test the elastic and casing. Label whether the final sleeve length includes cuff depth, casing turn and visible ruffle; these cannot all be subtracted as though they were one folded cuff."),MC("What determines elastic length?",["A comfort and stretch test with the actual elastic", "Wrist minus the same fixed amount for everyone", "The number of cuff buttons", "Only the cloth weight"],"Elastic recovery and required hand passage differ between products and wearers.","Return to the method and check the seam lines, not just the cut edges."),GM("sleevelength")])]);})();

unit("u15",15,"style","op","Ruffles, pockets and male/female design variations","Style the same core block without losing grain, fit or practicality.",[lesson("u15l1","Ruffles, lace and decorative stitching",REF.shirt,[LS("Ruffles, lace and decorative stitching","Plan decoration on the pattern before cutting. A ruffle's seam-line source length is attachment length times fullness; join narrow strips with unobtrusive seams and include those seam allowances. Finish outer edges before gathering: a narrow double turn, a tested rolled hem or soft lace. Fine lace can pucker if stretched while stitching; use a paper/tissue support sample if needed and remove it carefully.\n\nPlace trim where it will not scratch the neck or catch fingers. Check dye transfer, shrinkage and snagging on a sample washed with the shirt cloth. Heavy braid can pull a soft neckline out of shape; support its attachment zone or choose lighter trim. Decorative topstitching usually benefits from a slightly longer stitch than construction, but test it rather than using upholstery thread in lawn.\n\nEmbroidery before assembly is easier on flat pieces. Stabilise only as needed, test laundering and remove stabiliser safely. Keep dense embroidery away from gathering zones unless its changed stiffness is intentional."),LS("Workshop and acceptance check","Pin a half-scale decoration map, then make one full-size trim sample. Calculate added ruffle and join allowances separately. Compare the shirt with and without the trim under its own weight before stitching everything permanently."),MC("When is the ruffle outer edge easiest to finish?",["Before it is gathered and attached", "After the cuff tube is sealed", "Only after adding all buttons", "It should remain raw in every fabric"],"A flat edge is easier to hem cleanly than a gathered one.","Return to the method and check the seam lines, not just the cut edges."),GM("gather")]),lesson("u15l2","Add a chest or side-seam pocket",REF.shirt,[LS("Add a chest or side-seam pocket","A chest patch pocket is simplest: draw finished shape and position on the toile, keeping clear of bust apex, yoke gathers and closure. For a 14\u00d716 cm finished rectangle with 1 cm sides/bottom and 3 cm top facing, cut 16\u00d720 cm. Turn and stitch the top first; press remaining edges over a template. Attach while the front is flat, reinforcing top corners with a short tested tack. A too-dense tack can tear thin cloth.\n\nSide-seam pockets add weight and require stable attachment points. Draw a hand-sized bag on the toile, place its opening below any waist shaping and above the hem vent, and add seam allowance to matching opening and bag edges. Sew bags to front/back side seams before closing the sides; stitch around the joined bags and finish edges. Support a heavy bag from a waist seam/tape only if that structure is part of the design.\n\nDo not claim a fine shirt pocket can carry tools. Test a light intended load for sag, transparency and reach."),LS("Workshop and acceptance check","Make a paper pocket at actual size and test access while wearing the toile. Add every bag or patch to the cut list and layout. Mark mirrored positions from CF/waist references; do not eyeball against a wavy raw edge."),MC("A 14\u00d716 pocket with 3 cm top and 1 cm other edges has cut height?",["20 cm", "18 cm", "19 cm", "16 cm"],"Height = 16+3+1. Width = 14+1+1.","Return to the method and check the seam lines, not just the cut edges."),GM("cutsize")]),lesson("u15l3","Three coherent style packages",REF.shirt,[LS("Three coherent style packages","The straight/male tunic package can use the equal-quarter block, modest drop, a split lace neck, band and full cuffed sleeve. For broad chest or abdomen fit, add measured width/length rather than escalating puff. A long hem with vents suits layering, but test seated comfort under a belt.\n\nThe shaped/female blouse package can use front/back bust allocation, front balance correction and a side dart rotated into neckline or yoke gathers. Choose hip flare or a gently shaped waist while preserving reach. A modesty panel and button at bust level can improve coverage only after fit is correct. A less gathered front with a sewn dart is an equally valid option.\n\nThe shared dramatic poet package uses either body route with ruffle collar, full sleeve and an elastic or deep button cuff. More trim does not require tighter neck or wrist fit. These are contemporary costume choices, not authenticated reconstructions. For historical work choose a documented period pattern and study its cut and materials separately."),LS("Workshop and acceptance check","Draw front/back flats for one package, label all pattern changes, and list construction order. The learner may mix gender-labelled options freely. Every change to a seam affects its partner: rewalk and update the cut list and mockup before cutting final cloth."),MC("What must happen after moving bust control into yoke gathers?",["Update matching seam lengths, gather plan and cut list", "Delete the extra volume without a fit check", "Use the male chest formula unchanged", "Shorten the wrist slit"],"Style changes must preserve the shaping and match the receiving seam.","Return to the method and check the seam lines, not just the cut edges."),GM("femaleallocation")])]);})();

unit("u16",16,"finish","op","Fitting and fault diagnosis","Read balance, strain and puff before making irreversible corrections.",[lesson("u16l1","Chest, bust, back and shoulder faults",REF.fit,[LS("Chest, bust, back and shoulder faults","Fit from the top down with the closure held at true CF. Neckline drag and shoulder folds may reflect slope or forward-shoulder mismatch rather than insufficient chest width. Pin a small shoulder correction on the toile, keeping neck and armhole changes controlled. Do not randomly deepen an armhole to remove every wrinkle; a lower armhole can worsen reach.\n\nHorizontal strain across bust/chest, a gaping front and side seams pulled forward suggest inadequate front room. Release the front-side basting and observe the required spread. If the front waist and hem lift, check length over projection as well as circumference. Use the full-bust or front-balance adjustment, then rewalk seams. Wrinkles alone are clues, not an automatic diagnosis.\n\nTightness across the back during a forward reach may need back width or a different shoulder/armhole arrangement. Test with the actual sleeves attached. A full sleeve cannot fix a body armhole in the wrong position. Keep notes and change one variable at a time."),LS("Workshop and acceptance check","On a toile, compare relaxed stance and forward reach. Mark horizontal reference lines and observe which lift or tilt. Baste one correction, repeat the movement, then accept or undo it. If unsure, get help from an experienced fitter before cutting away allowances."),MC("What should you check when the front hem rises over the bust?",["Front length balance and width over projection", "Only the colour of the cuff", "Only the hem allowance", "Whether all seams are overlocked"],"Projection can consume both length and width.","Return to the method and check the seam lines, not just the cut edges."),GM("femaleallocation")]),lesson("u16l2","Sleeve twist, length and puff distribution",REF.fit,[LS("Sleeve twist, length and puff distribution","A sleeve that twists may be off grain, swapped left/right, or rotated relative to the shoulder notch. Check grain and slit position first. If they are correct, test a small rotation at the basted armhole rather than distorting the cuff. The slit should sit toward the back of the wrist and mirror the other sleeve.\n\nA sleeve can be long while still binding at the elbow if its geometry or cuff attachment is wrong. Bend the elbow with cuff closed. Compare actual shoulder drop to the amount subtracted in the draft. If you change drop after fitting, recalculate sleeve length; otherwise coverage is counted twice or omitted.\n\nUneven ballooning often comes from crowding gathers at the underarm or slit. Redistribute by quarter marks, keeping flatter zones where bulk would rub. A too-stiff fabric may need lower fullness, and a heavy trim may collapse the puff. Change a sample before cutting a new pair of sleeves."),LS("Workshop and acceptance check","Photograph or sketch each arm with slit and shoulder notch marked. Compare left/right length while relaxed and bent. Release the basting, redistribute or rotate, then retest. Do not trim excess length until the cuff position is confirmed."),MC("What is the first check for a twisted sleeve?",["Grain, handedness and notch orientation", "Add more wrist ease immediately", "Cut a deeper neckline", "Increase buttonhole length"],"Construction orientation is simpler to verify before changing the pattern.","Return to the method and check the seam lines, not just the cut edges."),GM("sleevelength")]),lesson("u16l3","Quantify alterations and preserve the master",REF.fit,[LS("Quantify alterations and preserve the master","Measure finished circumference on the garment's seam lines with closures in their intended position. Actual ease = finished \u2212 body. Target finished = body + desired ease. Change = target \u2212 measured finished. In a symmetric garment with four side-seam panel edges, adding 4 cm total requires 1 cm at each of those edges. This distributes a circumference correction; it is not an instruction to move all darts or change shoulder points.\n\nFor example body 100, finished 116, desired ease 24 gives actual ease 16, target 124 and change +8 cm, or +2 cm per side-seam edge if evenly allocated. Check available allowances first. If you lack enough cloth, use a designed insert or recut rather than leaving fraying seam allowances. Projection-specific corrections belong at front or back, not equally everywhere.\n\nTransfer accepted toile changes to the master, retrue seam junctions and write a new version. Save separate male/straight and female/shaped worked examples; do not overwrite a successful pattern when exploring a variation."),LS("Workshop and acceptance check","Use the fit lab for a circumference check, then decide where the correction belongs physically. Write before/after measurements, seam allocation and remaining allowance. Re-test mobility and closure after every accepted alteration."),MC("A symmetric +8 cm circumference correction over four side-seam edges means?",["Add 2 cm at each edge if equal allocation is appropriate", "Add 8 cm at every edge", "Remove 2 cm at every edge", "Add 2 cm to the cuffs"],"Four edges \u00d72 cm gives 8 cm total; fit decides whether equal allocation is suitable.","Return to the method and check the seam lines, not just the cut edges."),GM("quarter")])]);})();

unit("u17",17,"finish","op","Hems, buttons, care and quality","Finish only after fit, then document how to keep it wearable.",[lesson("u17l1","Straight hems, curved hems and vents",REF.care,[LS("Straight hems, curved hems and vents","Let a drapey shirt hang before levelling its final hem. With the wearer standing normally, mark the desired level from the floor or a stable reference. Consider front projection and seated length. Remove the shirt and true a smooth hem; do not trim while it is on the body.\n\nFor the course's straight 4 cm allowance, turn 1 cm to hide raw edge, then 3 cm and stitch near the inner fold. For a curved hem use a narrower sample such as 0.6+0.6 cm; a deep straight turn bunches on tight curves. Ease gently or use a shaped facing if the curvature demands it. The choice changes cut dimensions.\n\nAt a side vent, finish each vertical edge and secure the top with a small reinforced tack appropriate to the cloth. Mitre a bulky hem/vent corner on a sample, keeping enough enclosed allowance. Press without stretching the vent opening. If a shirt twists after washing, check grain and differential shrinkage rather than cutting a new uneven hem to disguise it."),LS("Workshop and acceptance check","Baste the hem, sit and reach, then stitch. Check hem width, vent symmetry and no raw edge visible inside. Use a sleeve board or narrow pressing surface to avoid imprinting bulky seam allowances through fine cloth."),MC("Why use a narrower allowance on a tight curved hem?",["It turns with less bunching and distortion", "It always makes the garment longer", "It removes the need for stitching", "It changes the grain direction"],"Less fabric has to be eased into the smaller inside circumference.","Return to the method and check the seam lines, not just the cut edges."),GM("shrinkpct")]),lesson("u17l2","Place, test and sew buttonholes",REF.care,[LS("Place, test and sew buttonholes","Mark buttons only after a final basted fit. Put a closure at the fullest bust/chest point if needed to avoid an unsupported gap, then divide the remaining spans for an intentional rhythm. Equal mathematical spacing is a planning aid, not a reason to ignore body landmarks. Mark both plackets from the same neckline datum with true CF aligned.\n\nA starting buttonhole cut length is button diameter plus thickness; test it on the actual interfaced layers. A 11 mm button 3 mm thick suggests 14 mm, but domed or shanked buttons may need more. Most front holes can be vertical; band and cuff holes often horizontal to accommodate movement. Follow the machine manual and make several samples first.\n\nCut holes with a guarded cutter or seam ripper directed away from hands, with a pin before the far bartack to limit overcutting. Sew buttons with a thread shank suited to fabric thickness so the layers close without puckering. Secure thread ends, then test repeated opening and closing."),LS("Workshop and acceptance check","Check all holes before cutting any: orientation, length and position. Close the shirt on the wearer, sit and reach. A concealed snap is an optional modesty aid after fit is corrected, never a substitute for missing bust ease."),MC("Which is more important than perfectly equal button spacing?",["Supporting the fullest chest/bust point without strain", "Using the largest buttons possible", "Putting holes through gathers", "Skipping a layered sample"],"Functional placement is governed by the body and the closure load.","Return to the method and check the seam lines, not just the cut edges."),GM("bhlen")]),lesson("u17l3","Care, repairs and final inspection",REF.care,[LS("Care, repairs and final inspection","Inspect inside and outside under good light: secure seam ends, no untrimmed raw edges where enclosure was intended, stable underarm corners, smooth plackets, mirrored cuffs, comfortable neck, sound button attachment and no sharp hardware. Rub neck/cuff interiors against skin gently and check for scratchy trim. Remove all temporary pins and visible basting.\n\nCare must suit the least tolerant component. If cloth tolerates a hot wash but trim or interfacing does not, choose a tested compatible process or different trim. Remove laces where appropriate, use a mesh bag for delicate ruffles, reshape and dry without pulling wet cloth. Test colour transfer before combining strong colours with pale cloth.\n\nKeep matching thread, spare buttons, labelled cloth and the final pattern. Repair a small popped seam before it becomes a tear; reinforce with a soft patch if the cloth is damaged. A rough home tug/wash check is useful but is not a certified seam-strength or protective-clothing test."),LS("Workshop and acceptance check","Create a signed-off checklist: measurements, movement, dressing, seams, closures, wash test and repair kit. Record anything untested. After the first wear and wash, inspect again and note whether the pattern or construction needs revision."),MC("Which care rule should the finished shirt follow?",["The tested process compatible with all its components", "The hottest setting the main cloth tolerates", "Whatever the buttons tolerate alone", "No washing is ever needed"],"Trim, interfacing, elastic and dyes can be more sensitive than the cloth.","Return to the method and check the seam lines, not just the cut edges."),GM("spi")])]);})();

unit("u18",18,"cap","op","Three complete shirt projects","Direct a complete build from brief to postwash review, with both fit routes.",[lesson("u18l1","Capstone A: straight/male lace-neck tunic",REF.qc,[LS("Capstone A: straight/male lace-neck tunic","Brief: a loose adult cotton tunic with a faced lace-neck slit, band, rectangular puffy sleeves, button cuffs and side vents. Worked measurements: chest 100, hip 102, neck 40, shoulder width 46, arm 64, biceps 34, wrist 18, back length 78, chosen scye 24 cm. Trial ease: chest 24, hip 16; shoulder drop 4, puff 1.8, cuff depth 6, wrist ease 4 and overlap 2. These are one example, not a size chart.\n\nThe straight body is max(124,118)=124 cm, quarters 31. Shoulder endpoint is 23+4=27 cm from CB before slope fitting. Sleeve seam rectangle is 61.2\u00d754 cm. Estimated top attachment is 48 cm, so trial top ratio 1.275; cuff target is 22 and ratio 2.782. With 1 cm cuff allowances the folded cuff cut is 26\u00d714 cm. Use a single full front on fold for the pullover: remove full-front placket extensions and replace the lab's two-front rectangles with the actual pattern.\n\nDraft neckline, fit a slit-access toile, walk the band and add a facing, loops and optional gussets. Do not use the provisional band or bounding list as finished patterns."),LS("Workshop and acceptance check","Build order: 1) swatch and prewash; 2) measure and draft; 3) toile with sleeve/cuff and head-opening test; 4) true and allowance-map; 5) actual layout and cut; 6) staystitch and faced front slit/loops; 7) shoulders/yoke; 8) band; 9) sleeve slits; 10) gather and set sleeves flat; 11) gussets/sides and vents; 12) cuffs; 13) level hem; 14) holes/buttons and ties; 15) inspect, wear/wash and record corrections. Deliver the pattern, cut list, photos/sketches and honest fit log, not only a finished-looking front."),MC("Why replace the lab front pieces for this capstone?",["It is a pullover on fold, not the base full-front configuration", "The lab always draws printable patterns", "No front fabric is needed", "A band replaces both fronts"],"The cut list must reflect the chosen opening and fold system.","Return to the method and check the seam lines, not just the cut edges."),GM("sleevelength")]),lesson("u18l2","Capstone B: shaped/female button-front blouse",REF.qc,[LS("Capstone B: shaped/female button-front blouse","Brief: a softly shaped blouse with a full button front, optional modesty panel, bust control rotated into a yoke gather, full sleeves and button cuffs. Example measurements: full bust 104, high bust 96, waist 82, hip 110, neck 37, shoulders 40, arm 60, biceps 32, wrist 16, back length 70. Choose bust ease 24 and hip ease 16, drop 3, puff 1.8, scye 23, cuff 6 and wrist ease 4. Enter front-length correction only after the toile; a trial 3 cm is illustrative, not a prescription.\n\nBack quarter = (96+24)/4=30; front quarter =128/2\u221230=34. Hip quarter target=(110+16)/4=31.5: blend back outward and fit front distribution rather than narrowing hips to waist size. Sleeve width=57.6 and length=60\u22123\u22126=51. Trial top ratio=57.6/46=1.252; wrist ratio=57.6/20=2.88. Cuff closed 20, flat 22 and cut 24\u00d714 with 1 cm SA.\n\nLocate actual apex and front balance, transfer shaping into the yoke using a tested slash-and-spread, then rewalk. The simple lab does not perform that manipulation."),LS("Workshop and acceptance check","Build order follows Capstone A except use two mirrored full fronts and your sampled placket system, make bust shaping/yoke gathers before body assembly, and place a closure at the fitted bust level. Sew the optional pocket before joining body sections. Retest front gaping while seated and reaching. Deliver a master pattern showing the shaping transfer, fitted waist/hip, neckline measurement and the final closure positions. Do not mark a fit as passed if only width arithmetic was checked."),MC("How much does the example front quarter exceed the back quarter?",["4 cm", "8 cm", "0 cm", "24 cm"],"Front 34 minus back 30 gives 4; two of each yield 128 cm.","Return to the method and check the seam lines, not just the cut edges."),GM("femaleallocation")]),lesson("u18l3","Capstone C: design your own poet shirt and audit it",REF.qc,[LS("Capstone C: design your own poet shirt and audit it","Choose either fit route for any adult wearer, then design a ruffle collar, lace edge, pocket or elastic wrist variation. Write a brief with silhouette, practical activity, care constraints, budget and measurable acceptance criteria. Avoid contradictory promises such as huge trailing sleeves for work near flames or rotating tools. A costume design is not workwear.\n\nMake a dependency list: new neckline changes band/facing; new yoke changes body lengths and gather target; cuff removal changes sleeve length; ruffles add cut pieces and laundering constraints; gussets alter assembly. Update all partners before cutting. Use the calculators to audit arithmetic, not to certify fit. Keep a traceable version history of paper draft, toile corrections, cutting list and sewing order.\n\nFinal review has separate gates: design intent, dimensional consistency, wearable fit/mobility, construction, wash durability and documentation. The first two can be checked on screen; the remaining gates require real cloth and a wearer. These course examples have not been physically sewn and validated by the app."),LS("Workshop and acceptance check","Complete a scorecard with PASS/REWORK/NOT TESTED for each gate. Require an assembled toile, a complete final cut list including trims, successful dressing/movement tests, enclosed edges, working closures and a recorded first-wash inspection before claiming your own project complete. Share only measurements/photos you have permission to share. Save a repair kit and one lesson learned for the next version."),MC("Which gate cannot be proved by calculator property tests?",["Comfort and mobility on a real wearer", "The arithmetic of a quarter width", "Conversion from centimetres to inches", "The number of equal spacing intervals"],"Screen tests validate software and arithmetic, not a physically fitted garment.","Return to the method and check the seam lines, not just the cut edges."),GM("gather")])]);})();
