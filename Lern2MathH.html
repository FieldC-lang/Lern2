 NaNs, which `x < 0` can never tell you.\n- `issignaling(x)`: a NaN whose **quiet bit** (fraction bit 51) is clear.\n- `iscanonical(x)`: always true for double and float. For x87 long double it is false for the “unnormal” and “pseudo” encodings (Unit 28).\n\nWhy bits and not `x != x`? The comparison `x != x` is a correct NaN test, but it must not be compiled under `-ffast-math`, and it says nothing about signalling NaNs. The bit tests also never raise FE_INVALID, which C requires of the classification macros.", viz: EX("static uint64_t asu64(double x) { uint64_t u; memcpy(&u, &x, 8); return u; }\nstatic double asdbl(uint64_t u) { double x; memcpy(&x, &u, 8); return x; }\n#define ABS_BITS(x) (asu64(x) & 0x7fffffffffffffffULL)\nstatic int my_fpclassify(double x)\n{\n    uint64_t a = ABS_BITS(x);\n    if (a == 0) return FP_ZERO;\n    if (a < 0x0010000000000000ULL) return FP_SUBNORMAL;\n    if (a < 0x7ff0000000000000ULL) return FP_NORMAL;\n    return a == 0x7ff0000000000000ULL ? FP_INFINITE : FP_NAN;\n}\nstatic int my_issignaling(double x)\n{\n    uint64_t a = ABS_BITS(x);\n    return a > 0x7ff0000000000000ULL && !(a & 0x0008000000000000ULL);\n}\nint main(void)\n{\n    double v[] = { 0.0, -0.0, 0x1p-1074, 1.0, INFINITY, NAN, asdbl(0x7ff0000000000001ULL) };\n    const char *n[] = { \"FP_NAN\", \"FP_INFINITE\", \"FP_ZERO\", \"FP_SUBNORMAL\", \"FP_NORMAL\" };\n    for (int i = 0; i < 7; i++)\n        printf(\"%-12a %-12s glibc %-12s sig %d\\n\", v[i], n[my_fpclassify(v[i])], n[fpclassify(v[i])], my_issignaling(v[i]));\n    return 0;\n}", "0x0p+0       FP_ZERO      glibc FP_ZERO      sig 0\n-0x0p+0      FP_ZERO      glibc FP_ZERO      sig 0\n0x0.0000000000001p-1022 FP_SUBNORMAL glibc FP_SUBNORMAL sig 0\n0x1p+0       FP_NORMAL    glibc FP_NORMAL    sig 0\ninf          FP_INFINITE  glibc FP_INFINITE  sig 0\nnan          FP_NAN       glibc FP_NAN       sig 0\nnan          FP_NAN       glibc FP_NAN       sig 1", "glibc numbers the classes FP_NAN = 0 … FP_NORMAL = 4, so the names table is indexed directly. The last value is a signalling NaN.") }, { t: "learn", h: "Walk-through: one compare for isnan", body: "Follow `isnan` for three inputs, with `a` the pattern without its sign:\n\n1. `x = 1.0`: a = 0x3FF0000000000000, below 0x7FF0000000000000 → not NaN.\n2. `x = −inf`: the sign is dropped, a = 0x7FF0000000000000, **equal**, not greater → not NaN.\n3. `x = NaN` (glibc's default 0x7FF8000000000000): greater → NaN.\n\nThat single unsigned compare covers both signs and all 2⁵³ − 2 NaN patterns.\n\n**float** is the same with 32 bits: sign | 8-bit exponent | 23-bit fraction, infinity 0x7F800000, quiet bit 0x00400000.\n\n**long double** on x86-64 is different: 80 bits stored in 16 bytes, a 15-bit exponent and a 64-bit significand with an **explicit integer bit** (bit 63). Read it as `struct { uint64_t m; uint16_t se; }`. A NaN has exponent 0x7FFF and a significand other than 0x8000000000000000 (the integer bit set and nothing else is infinity).\n\nTip for the exercises: draw the three fields before you write any mask.", viz: code("/* long double on x86-64: 64-bit significand m (bit 63 is the integer bit), then sign and 15-bit exponent */\ntypedef struct { uint64_t m; uint16_t se; } ldbits;\nstatic int my_isnanl(long double x)\n{\n    ldbits b; memcpy(&b, &x, 10);\n    return (b.se & 0x7fff) == 0x7fff && (b.m << 1) != 0;   /* drop the integer bit, then any fraction bit means NaN */\n}", "The same test on the x87 format, where the integer bit is stored.", "c") }, { t: "mcq", q: "With `a` the bit pattern of a double without its sign, which test is `isinf`?", opts: ["`a == 0x7ff0000000000000`", "`a >= 0x7ff0000000000000`", "`a > 0x7ff0000000000000`", "`(a >> 52) == 0x7ff`"], a: 0, hint: "Infinity and NaN share the exponent; what distinguishes them?", why: "Infinity is the all-ones exponent with a zero fraction. `>=` also accepts NaNs, `>` is the NaN test, and the shift test cannot tell infinities from NaNs." }, { t: "fill", q: "Complete the float classification so it returns FP_SUBNORMAL correctly.", text: "uint32_t a = bits & ___;\nif (a == 0) return FP_ZERO;\nif (a < ___) return FP_SUBNORMAL;", blanks: ["0x7fffffff", "0x00800000"], extra: ["0x80000000", "0x7f800000", "0x00400000"], hint: "The smallest normal float has exponent field 1 and fraction 0.", why: "Drop the sign with 0x7fffffff. The smallest normal float is 2⁻¹²⁶, pattern 0x00800000: everything below it except zero is subnormal." }, P("What does this print?", "static uint64_t asu64(double x) { uint64_t u; memcpy(&u, &x, 8); return u; }\nstatic double asdbl(uint64_t u) { double x; memcpy(&x, &u, 8); return x; }\nint main(void) { double x = -0.0; printf(\"%d %d\\n\", x < 0, (int)(asu64(x) >> 63)); return 0; }", "0 1", ["1 1", "0 0", "1 0"], "−0 compares equal to +0, so `x < 0` is false, but its sign bit is set. That is why signbit reads the bit.", { hint: "Does −0 compare less than zero?" }), { t: "tf", q: "`issignaling(x)` can be written as `isnan(x) && !(bits & quiet_bit)`.", a: true, why: "A signalling NaN is a NaN with the quiet bit (the top fraction bit) clear. x86 and ARM both use this convention." }] }, { id: "u17l3", title: "fabs and copysign by bits, in C and ARM assembly", ref: R7 + ' ' + REF.arm, items: [{ t: "learn", h: "Three bit operations", body: "The sign is one bit, so the sign functions are one integer operation each:\n\n- `fabs(x)`: **clear** bit 63: `u & 0x7fffffffffffffff`.\n- `copysign(x, y)`: the magnitude of x with the sign of y: `(ux & 0x7fff…) | (uy & 0x8000…)`.\n- negation `-x`: **flip** bit 63: `u ^ 0x8000…`. (In C, `-x` already does this, even for NaN and zero.)\n\nWhy not `x < 0 ? -x : x`? Three reasons, and the tests catch all of them:\n\n1. `fabs(-0.0)` must be **+0**, but `-0.0 < 0` is false, so the comparison version returns −0.\n2. With a NaN, `x < 0` raises **FE_INVALID** for a signalling NaN and returns a NaN with its sign unchanged; fabs must clear the sign and raise nothing.\n3. `copysign(x, NAN)` must use the NaN's sign bit, which no comparison can read.\n\nThese are the only functions in <math.h> that work on NaNs “as bit strings”: C23 says fabs, copysign and negation are **quiet** even for signalling NaNs.\n\n**float** uses `0x7fffffff` and `0x80000000`. **long double** keeps the sign in bit 15 of the 16-bit `se` word.", viz: EX("static uint64_t asu64(double x) { uint64_t u; memcpy(&u, &x, 8); return u; }\nstatic double asdbl(uint64_t u) { double x; memcpy(&x, &u, 8); return x; }\nstatic double my_fabs(double x) { return asdbl(asu64(x) & 0x7fffffffffffffffULL); }\nstatic double my_copysign(double x, double y)\n{\n    return asdbl((asu64(x) & 0x7fffffffffffffffULL) | (asu64(y) & 0x8000000000000000ULL));\n}\nstatic double naive_fabs(double x) { return x < 0 ? -x : x; }\nint main(void)\n{\n    printf(\"%g %g\\n\", my_fabs(-0.0), naive_fabs(-0.0));\n    printf(\"%g %g\\n\", my_copysign(2.0, -0.0), my_copysign(2.0, -NAN));\n    printf(\"%d %d\\n\", signbit(my_fabs(-NAN)) != 0, signbit(naive_fabs(-NAN)) != 0);\n    return 0;\n}", "0 -0\n-2 -2\n0 1", "The comparison version gets −0 and the sign of NaN wrong.") }, { t: "learn", h: "Walk-through: the same functions in ARMv7 assembly", body: "On 32-bit ARM with the **hard-float ABI** (`-mfloat-abi=hard`, the default for armhf Linux) a double argument arrives in a VFP register: x in **d0**, y in **d1**, and the result goes back in d0.\n\n1. `vmov r0, r1, d0` copies the 64 bits into two core registers: r0 the low word, **r1 the high word**, which holds the sign (bit 31), the exponent and the top 20 fraction bits.\n2. `bic r1, r1, #0x80000000` (bit clear) is fabs. For copysign, `and r3, r3, #0x80000000` isolates y's sign and `orr` puts it in.\n3. `vmov d0, r0, r1` moves the result back.\n\nThe same file adds two more you will use in Unit 21:\n\n- `my_sqrt` is **one instruction**, `vsqrt.f64 d0, d0`. IEEE-754 requires square root to be correctly rounded, so the hardware result is exactly what your software sqrt must reproduce.\n- `my_isqrt` is the classic digit-by-digit integer square root. `bit` starts at the highest power of 4 and moves down two bits per step. Each step tries `res + bit`; if it fits, subtract and set that bit of the result. Conditional execution (`subhs`, `addhs`) keeps the loop branch-free inside.\n\nReal compilers do the same: gcc compiles `fabs` to `vabs.f64` and `copysign` to a few integer operations.", viz: ASM([["bits.s", "@ bits.s: fabs, copysign, sqrt and isqrt for ARMv7-A, hard-float ABI (doubles arrive in d0, d1)\n        .syntax unified\n        .arm\n        .fpu    vfpv4\n        .text\n\n        .global my_fabs\nmy_fabs:                        @ double my_fabs(double x)\n        vmov    r0, r1, d0      @ r0 = low word, r1 = high word (sign, exponent, top fraction)\n        bic     r1, r1, #0x80000000   @ clear bit 63: the sign\n        vmov    d0, r0, r1\n        bx      lr\n\n        .global my_copysign\nmy_copysign:                    @ double my_copysign(double x, double y)\n        vmov    r0, r1, d0\n        vmov    r2, r3, d1\n        bic     r1, r1, #0x80000000   @ |x|\n        and     r3, r3, #0x80000000   @ sign of y alone\n        orr     r1, r1, r3\n        vmov    d0, r0, r1\n        bx      lr\n\n        .global my_sqrt\nmy_sqrt:                        @ double my_sqrt(double x): one VFP instruction, correctly rounded\n        vsqrt.f64 d0, d0\n        bx      lr\n\n        .global my_isqrt\nmy_isqrt:                       @ uint32_t my_isqrt(uint32_t n) = floor(sqrt(n)), digit by digit\n        mov     r1, #0          @ res\n        mov     r2, #0x40000000 @ bit: the highest power of 4 that fits in 32 bits\n1:      cmp     r2, r0\n        lsrhi   r2, r2, #2      @ while (bit > n) bit >>= 2\n        bhi     1b\n2:      cmp     r2, #0\n        beq     3f\n        add     r3, r1, r2      @ trial = res + bit\n        cmp     r0, r3\n        subhs   r0, r0, r3      @ if (n >= trial) n -= trial\n        lsr     r1, r1, #1      @ res >>= 1   (flags untouched)\n        addhs   r1, r1, r2      @            res += bit when the trial fitted\n        lsr     r2, r2, #2\n        b       2b\n3:      mov     r0, r1\n        bx      lr", "asm"], ["main.c", "#include <stdio.h>\n#include <stdint.h>\n#include <math.h>\ndouble my_fabs(double), my_copysign(double, double), my_sqrt(double);\nuint32_t my_isqrt(uint32_t);\nint main(void)\n{\n    printf(\"%g %g %g\\n\", my_fabs(-2.5), my_fabs(-0.0), my_copysign(3.0, -0.0));\n    printf(\"%g %d\\n\", my_copysign(NAN, -1.0), signbit(my_copysign(NAN, -1.0)) != 0);\n    printf(\"%.17g %a\\n\", my_sqrt(2.0), my_sqrt(0x1p-1074));\n    printf(\"%u %u %u %u\\n\", my_isqrt(0), my_isqrt(15), my_isqrt(16), my_isqrt(4294967295u));\n    return 0;\n}", "c"]], "2.5 0 -3\n-nan 1\n1.4142135623730951 0x1p-537\n0 3 4 65535", "Assembled for ARMv7-A (Cortex-A7, hard-float ABI) and run under an emulator; the output is real.") }, P("What does `my_copysign(3.0, -0.0)` print with `%g`?", "static uint64_t asu64(double x) { uint64_t u; memcpy(&u, &x, 8); return u; }\nstatic double asdbl(uint64_t u) { double x; memcpy(&x, &u, 8); return x; }\nstatic double my_copysign(double x, double y) { return asdbl((asu64(x) & 0x7fffffffffffffffULL) | (asu64(y) & 0x8000000000000000ULL)); }\nint main(void) { printf(\"%g\\n\", my_copysign(3.0, -0.0)); return 0; }", "-3", ["3", "0", "-0"], "−0 has its sign bit set, so the result takes a negative sign.", { hint: "Only the sign bit of y matters, not its value." }), { t: "mcq", q: "In the ARM version, why does fabs change r1 and not r0?", opts: ["The hard-float ABI puts the high word, with the sign bit, in r1 after `vmov r0, r1, d0`", "r0 is read-only", "The sign bit is bit 0 of r0", "fabs only works on the exponent"], a: 0, hint: "Which half of the 64 bits holds the sign?", why: "vmov splits d0 into low word r0 and high word r1. Bit 63 of the double is bit 31 of r1." }, { t: "order", q: "Order the instructions of the ARM fabs.", items: ["vmov r0, r1, d0", "bic r1, r1, #0x80000000", "vmov d0, r0, r1", "bx lr"], hint: "The bits must be in a core register before bic can touch them.", why: "Move the double into core registers, clear the sign bit of the high word, move it back, return." }, { t: "num", q: "`my_isqrt(n)` returns floor(√n). What does it return for n = 4294967295 (2³² − 1)?", a: 65535, hint: "Which power of two squared is 2³²?", why: "65536² = 2³², just above, so the floor is 65535. The ARM program prints the same." }, { t: "tf", q: "`fabs` must not raise FE_INVALID even for a signalling NaN.", a: true, why: "C23 (and IEEE-754) class fabs, copysign and negation as bit operations that are quiet for every input." }] }] });
CRAFT.units.push({ id: "u18", n: 18, track: "scratch", tone: "f7", title: "Exponent surgery: frexp to nexttoward", blurb: "frexp, ldexp, scalbn, scalbln, ilogb, llogb, logb, modf, nextafter, nextup, nextdown, nexttoward and nan() payloads — every one by bit and exponent arithmetic, for float, double and long double.", lessons: [{ id: "u18l1", title: "frexp, ldexp, scalbn, scalbln, ilogb, logb", ref: R7, items: [{ t: "learn", h: "Splitting a number into significand and exponent", body: "`frexp(x, &e)` returns a significand in **[0.5, 1)** (or (−1, −0.5]) with the same sign as x, and writes the unbiased power of two into `*e`, so `x = frexp(x,&e) · 2^e`. Zero gives (0, e=0); inf and NaN pass through with e = 0.\n\nImplementation: read the biased exponent field. For a **subnormal**, multiply by 2⁶⁴ first (exact), then subtract 64 from the exponent. Put the biased value 1022 into the exponent field so the significand lands in [0.5, 1).\n\n`ldexp(x, n)` and `scalbn(x, n)` are the inverse: multiply by 2ⁿ. Do it in **at most three exact multiplications** by powers of two that fit in a double (2¹⁰²³, then 2¹⁰²³, then the rest), so a subnormal result is rounded only once. `scalbln` takes a `long` and clamps it.\n\n`ilogb(x)` returns the unbiased exponent as an `int`. Specials: `ilogb(0) = FP_ILOGB0` (= INT_MIN in glibc), `ilogb(NaN) = FP_ILOGBNAN`, `ilogb(±inf) = INT_MAX`, and all three raise FE_INVALID and set errno EDOM. `llogb` is the same with `long` and `FP_LLOGB0` / `FP_LLOGBNAN`. `logb` returns the exponent as a double: for zero it returns −inf and raises FE_DIVBYZERO (glibc leaves errno alone).\n\nThe float and long double forms follow the same plan with 8-bit / 15-bit exponents and the x87 explicit integer bit.", viz: EX("#include \"mylibm.h\"\nint main(void)\n{\n    int e; double m = my_frexp(12.5, &e);\n    printf(\"frexp(12.5) = %a * 2^%d\\n\", m, e);\n    printf(\"ldexp back  %a\\n\", my_ldexp(m, e));\n    printf(\"ilogb(0.1) %d  logb %g\\n\", my_ilogb(0.1), my_logb(0.1));\n    printf(\"scalbn(1, -1074) %a\\n\", my_scalbn(1.0, -1074));\n    errno = 0; feclearexcept(FE_ALL_EXCEPT);\n    printf(\"ilogb(0)=%d errno=%d invalid=%d\\n\", my_ilogb(0.0), errno == EDOM, fetestexcept(FE_INVALID) != 0);\n    return 0;\n}", "frexp(12.5) = 0x1.9p-1 * 2^4\nldexp back  0x1.9p+3\nilogb(0.1) -4  logb -4\nscalbn(1, -1074) 0x0.0000000000001p-1022\nilogb(0)=-2147483648 errno=0 invalid=0", "frexp splits; scalbn reaches the smallest subnormal in one rounding; ilogb(0) matches glibc.", "-I/workspace/lern2math-h/scratch/lib -L/workspace/lern2math-h/scratch/lib -Wl,-rpath,/workspace/lern2math-h/scratch/lib -lmylibm") }, { t: "learn", h: "Walk-through: frexp of a subnormal", body: "Take `x = 0x1p-1074`, the smallest positive double. Its bit pattern has exponent field 0 and fraction bit 0 set.\n\n1. `ee = 0` and `u << 1 ≠ 0` → subnormal path.\n2. `x *= 0x1p64` → now `0x1p-1010`, a normal with biased exponent 13 (= −1010 + 1023).\n3. After subtracting 64, write `*e = (13 − 64) − 1022 = −1073`. Check: `0.5 · 2^(−1073) = 2^(−1074)`.\n4. Clear the exponent bits and write 1022: the significand is exactly 0.5.\n\nTip: always scale subnormals up by an **exact** power of two before reading the exponent.", viz: code("/* bits.c: everything that is pure bit manipulation of the IEEE-754 encoding.\n   double: 1 sign bit, 11 exponent bits (bias 1023), 52 fraction bits.\n   float:  1, 8 (bias 127), 23.   long double (x87): 1, 15 (bias 16383), 64 with an explicit integer bit. */\n#include \"internal.h\"\n\n/* ---------- fabs, copysign, signbit: one AND or OR on the sign bit ---------- */\ndouble my_fabs(double x) { return asdbl(asu64(x) & ~SIGN64); }\ndouble my_copysign(double x, double y) { return asdbl((asu64(x) & ~SIGN64) | (asu64(y) & SIGN64)); }\nint my_signbit(double x) { return (int)(asu64(x) >> 63); }\nfloat my_fabsf(float x) { return asflt(asu32(x) & 0x7fffffffu); }\nfloat my_copysignf(float x, float y) { return asflt((asu32(x) & 0x7fffffffu) | (asu32(y) & 0x80000000u)); }\nint my_signbitf(float x) { return (int)(asu32(x) >> 31); }\nlong double my_fabsl(long double x) { ldbits b = asld(x); return fromld(b.m, b.se & 0x7fff); }\nlong double my_copysignl(long double x, long double y) { ldbits b = asld(x), c = asld(y); return fromld(b.m, (b.se & 0x7fff) | (c.se & 0x8000)); }\nint my_signbitl(long double x) { return asld(x).se >> 15; }\n\n/* ---------- classification ---------- */\nint my_fpclassify(double x)\n{\n    uint64_t u = asu64(x);\n    int e = EXP_OF(u);\n    uint64_t f = u & FRAC64;\n    if (e == 0x7ff) return f ? MY_FP_NAN : MY_FP_INFINITE;\n    if (e == 0) return f ? MY_FP_SUBNORMAL : MY_FP_ZERO;\n    return MY_FP_NORMAL;\n}\nint my_isnan(double x) { return (asu64(x) & ~SIGN64) > 0x7ff0000000000000ULL; }\nint my_isinf(double x) { return (asu64(x) & ~SIGN64) == 0x7ff0000000000000ULL; }\nint my_isfinite(double x) { return (asu64(x) & ~SIGN64) < 0x7ff0000000000000ULL; }\nint my_isnormal(double x) { uint64_t e = (asu64(x) >> 52) & 0x7ff; return e != 0 && e != 0x7ff; }\nint my_issubnormal(double x) { return my_fpclassify(x) == MY_FP_SUBNORMAL; }\nint my_iszero(double x) { return (asu64(x) << 1) == 0; }\nint my_issignaling(double x) { uint64_t a = asu64(x) & ~SIGN64; return a > 0x7ff0000000000000ULL && !(a & 0x0008000000000000ULL); }\nint my_iscanonical(double x) { (void)x; return 1; }   /* binary64 has no non-canonical encodings */\n\nint my_fpclassifyf(float x)\n{\n    uint32_t u = asu32(x), e = (u >> 23) & 0xff, f = u & 0x7fffff;\n    if (e == 0xff) return f ? MY_FP_NAN : MY_FP_INFINITE;\n    if (e == 0) return f ? MY_FP_SUBNORMAL : MY_FP_ZERO;\n    return MY_FP_NORMAL;\n}\nint my_isnanf(float x) { return (asu32(x) & 0x7fffffffu) > 0x7f800000u; }\nint my_isinff(float x) { return (asu32(x) & 0x7fffffffu) == 0x7f800000u; }\nint my_isfinitef(float x) { return (asu32(x) & 0x7fffffffu) < 0x7f800000u; }\nint my_isnormalf(float x) { return my_fpclassifyf(x) == MY_FP_NORMAL; }\nint my_issubnormalf(float x) { return my_fpclassifyf(x) == MY_FP_SUBNORMAL; }\nint my_iszerof(float x) { return (asu32(x) << 1) == 0; }\nint my_issignalingf(float x) { uint32_t a = asu32(x) & 0x7fffffffu; return a > 0x7f800000u && !(a & 0x00400000u); }\nint my_iscanonicalf(float x) { (void)x; return 1; }\n/* … */", "bits.c holds frexp, scalbn, ilogb, nextafter, nan for all three types.", "c") }, { t: "mcq", q: "Why multiply a subnormal by 2⁶⁴ before reading its exponent in frexp?", opts: ["So the number becomes normal and the biased exponent field is meaningful", "To raise FE_UNDERFLOW", "Because 64 is the size of a register", "To clear the sign bit"], a: 0, hint: "What does the exponent field of a subnormal contain?", why: "A subnormal has biased exponent 0; multiplying by 2⁶⁴ (exact) moves it into the normal range so EXP_OF works." }, P("What does `my_ilogb(0x1p-1074)` return?", "#include \"mylibm.h\"\nint main(void) { printf(\"%d\\n\", my_ilogb(0x1p-1074)); return 0; }", "-1074", ["-1022", "-1023", "0"], "floor(log2(2⁻¹⁰⁷⁴)) = −1074.", { hint: "ilogb is the unbiased binary exponent.", flags: "-I/workspace/lern2math-h/scratch/lib -L/workspace/lern2math-h/scratch/lib -Wl,-rpath,/workspace/lern2math-h/scratch/lib -lmylibm" }), { t: "tf", q: "`ldexp` and `scalbn` are identical for every double argument.", a: true, why: "Both multiply by 2ⁿ with the same three-step scaling and the same errno/ERANGE rules." }, { t: "match", q: "Match the special ilogb / logb results.", pairs: [["ilogb(0)", "FP_ILOGB0 (INT_MIN), FE_INVALID, EDOM"], ["ilogb(+inf)", "INT_MAX, FE_INVALID, EDOM"], ["logb(0)", "−inf, FE_DIVBYZERO"], ["logb(+inf)", "+inf"]], why: "ilogb uses integer sentinels and always raises invalid on specials; logb returns floating values and only poles on zero." }] }, { id: "u18l2", title: "modf, nextafter, nexttoward, nextup, nextdown and nan()", ref: R7, items: [{ t: "learn", h: "Stepping to the next double, and writing a NaN payload", body: "`nextafter(x, y)` returns the next representable value from x in the direction of y. If x = y it returns y (so the sign of zero is taken from y). Implementation: map the bit pattern to an **ordered integer** (negatives flip so the integers sort like the doubles), add or subtract 1, map back. Raise FE_INEXACT and FE_OVERFLOW / UNDERFLOW when the step leaves the finite range or enters subnormals, matching glibc.\n\n`nextup` / `nextdown` (C23) are `nextafter` toward +inf / −inf. `nexttoward(x, y)` takes a **long double** direction so a double can step even when y sits between two doubles.\n\n`modf(x, &ip)` splits x into a fractional part (returned, same sign as x) and an integer part (stored). Both are exact.\n\n`nan(\"…\")` / `nanf` / `nanl` build a quiet NaN whose payload bits come from the tag string. glibc accepts an optional decimal or `0x` hex integer; anything else yields payload 0. The quiet bit is always set.", viz: EX("#include \"mylibm.h\"\nstatic uint64_t asu64(double x) { uint64_t u; memcpy(&u, &x, 8); return u; }\nint main(void)\n{\n    printf(\"%a\\n\", my_nextafter(1.0, 2.0));\n    printf(\"%a\\n\", my_nextup(-0.0));\n    double ip; double f = my_modf(-3.75, &ip);\n    printf(\"modf %g + %g\\n\", ip, f);\n    double n = my_nan(\"0x42\");\n    printf(\"nan payload %#llx\\n\", (unsigned long long)(asu64(n) & 0x7ffffffffffffULL));\n    return 0;\n}", "0x1.0000000000001p+0\n0x0.0000000000001p-1022\nmodf -3 + -0.75\nnan payload 0x42", "nextafter(1,2) = 1+2⁻⁵²; nextup(−0) = smallest subnormal; nan(\"0x42\") keeps the payload.", "-I/workspace/lern2math-h/scratch/lib -L/workspace/lern2math-h/scratch/lib -Wl,-rpath,/workspace/lern2math-h/scratch/lib -lmylibm") }, { t: "learn", h: "Walk-through: nextafter across zero and into overflow", body: "1. `nextafter(-0.0, +1.0)` → ordered(−0) is 0, plus one → the smallest positive subnormal `0x1p-1074`.\n2. `nextafter(+0.0, -1.0)` → smallest negative subnormal.\n3. `nextafter(DBL_MAX, +inf)` → +inf, with FE_INEXACT and FE_OVERFLOW.\n4. `nextafter(1.0, 1.0)` → 1.0 (equal arguments return the second).\n\nThe ordered map is `u` if the sign bit is clear, else `-(u & 0x7fff…)`. Adding one then always moves toward +inf in value space.\n\n**float** uses 32-bit patterns; **long double** on x86 steps the 64-bit significand and carries into the 15-bit exponent, watching the explicit integer bit." }, { t: "mcq", q: "What does `nextafter(1.0, 1.0)` return?", opts: ["1.0", "1.0 + 2⁻⁵²", "1.0 − 2⁻⁵²", "NaN"], a: 0, hint: "Read the equal-arguments clause.", why: "When the arguments are equal, nextafter returns the second one unchanged." }, P("How many ULPs from 1.0 is `my_nextafter(1.0, 0.0)`?", "#include \"mylibm.h\"\nstatic int64_t ord(double x){uint64_t u;memcpy(&u,&x,8);return (u>>63)?-(int64_t)(u&0x7fffffffffffffffULL):(int64_t)u;}\nint main(void){printf(\"%lld\\n\",(long long)(ord(1.0)-ord(my_nextafter(1.0,0.0))));return 0;}", "1", ["0", "2", "-1"], "Toward zero from 1.0 is exactly one double down.", { hint: "nextafter steps by one representable value.", flags: "-I/workspace/lern2math-h/scratch/lib -L/workspace/lern2math-h/scratch/lib -Wl,-rpath,/workspace/lern2math-h/scratch/lib -lmylibm" }), { t: "tf", q: "`nan(\"xyz\")` with a non-numeric tag still returns a quiet NaN.", a: true, why: "Unrecognised tags yield payload 0; the quiet bit is set either way." }, { t: "fill", q: "Complete the ordered-bit step used by nextafter.", text: "int64_t o = (u >> 63) ? -(int64_t)(u & ___) : (int64_t)u;\no += (y > x) - (y < x);\n/* rebuild double from o */", blanks: ["0x7fffffffffffffffULL"], extra: ["0xffffffffffffffffULL", "0x8000000000000000ULL", "0x7ff0000000000000ULL"], hint: "Which mask clears only the sign bit?", why: "Drop the sign for the magnitude, negate if the sign was set, then add ±1." }] }] });
CRAFT.units.push({ id: "u19", n: 19, track: "scratch", tone: "f7", title: "Rounding by bit masks", blurb: "ceil, floor, trunc, round, roundeven, rint, nearbyint, lrint, llrint, lround, llround, and the C23 fromfp / ufromfp / fromfpx / ufromfpx family — every one for float, double and long double.", lessons: [{ id: "u19l1", title: "ceil, floor, trunc, round, roundeven", ref: R7, items: [{ t: "learn", h: "Clearing fraction bits with a mode", body: "With unbiased exponent e, a double has `52 − e` fraction bits below the binary point. One function serves five modes:\n\n| mode | rule |\n|---|---|\n| trunc | toward zero |\n| floor | toward −∞ |\n| ceil | toward +∞ |\n| round | half away from zero |\n| roundeven | half to even (IEEE default) |\n\nAlgorithm for |x| ≥ 1 with e < 52:\n\n1. `one = 1 << (52−e)` — the bit worth 1.0.\n2. `mask = one − 1` — the bits below the binary point.\n3. If `(u & mask) == 0`, x is already an integer.\n4. Else add a bias that depends on the mode (floor of a negative adds `one`; round adds `one/2`; roundeven adds `one` only when the fraction is > half or a tie with the 1.0-bit set), then clear `mask`.\n\nFor |x| < 1 the answer is ±0 or ±1 by a short case analysis. Integers, infinities and NaNs return unchanged (NaNs quieted by `x+x`). **These five never raise FE_INEXACT** (C23).", viz: EX("#include \"mylibm.h\"\nint main(void)\n{\n    double x = 2.5, y = -2.5;\n    printf(\"trunc %g %g\\n\", my_trunc(x), my_trunc(y));\n    printf(\"floor %g %g\\n\", my_floor(x), my_floor(y));\n    printf(\"ceil  %g %g\\n\", my_ceil(x), my_ceil(y));\n    printf(\"round %g %g\\n\", my_round(x), my_round(y));\n    printf(\"even  %g %g\\n\", my_roundeven(x), my_roundeven(y));\n    return 0;\n}", "trunc 2 -2\nfloor 2 -3\nceil  3 -2\nround 3 -3\neven  2 -2", "round goes away from zero at halves; roundeven goes to the even integer (2).", "-I/workspace/lern2math-h/scratch/lib -L/workspace/lern2math-h/scratch/lib -Wl,-rpath,/workspace/lern2math-h/scratch/lib -lmylibm") }, { t: "learn", h: "Walk-through: roundeven(2.5) and roundeven(1.5)", body: "`2.5` has e = 1, so `one = 2⁵¹`, `half = 2⁵⁰`, fraction bits exactly equal half, and the 1.0-bit (bit 51 of the significand… wait: bit position `one`) is set because the integer 2 is even… Actually 2.5 = 101.0₂ × 2⁻¹ with significand implying the ones bit for value 2 is set. The tie-to-even test `(f == half && (u & one))` is true, so we add `one` → 3.0? \n\nCareful: for 2.5, even neighbour is 2, so we must NOT add. Re-read: we add when `f > half` OR `(f == half && (u & one))`. The `(u & one)` test asks \"is the current integer part odd?\" because `one` is the least significant integer bit. For 2.5 the integer part is 2 (even), so `u & one` is 0 → no add → trunc to 2. For 1.5 the integer part is 1 (odd), `u & one` is set → add → 2.\n\nThat is exactly IEEE-754 roundTiesToEven." }, { t: "mcq", q: "Which of these five raises FE_INEXACT when the argument is not an integer?", opts: ["None of them — C23 forbids it", "round", "ceil", "floor"], a: 0, hint: "C23 changed the old “may raise” permission.", why: "ceil, floor, trunc, round and roundeven are required not to raise FE_INEXACT." }, P("What does `my_roundeven(-1.5)` return?", "#include \"mylibm.h\"\nint main(void){printf(\"%g\\n\", my_roundeven(-1.5));return 0;}", "-2", ["-1", "-1.5", "0"], "Tie: neighbours −2 and −1; even is −2.", { hint: "Half ties go to the even integer.", flags: "-I/workspace/lern2math-h/scratch/lib -L/workspace/lern2math-h/scratch/lib -Wl,-rpath,/workspace/lern2math-h/scratch/lib -lmylibm" }), { t: "tf", q: "`my_ceil(-0.0)` returns −0.0.", a: true, why: "Zeros, infinities and NaNs pass through with their signs." }, { t: "fill", q: "Complete the mask for truncating a double with unbiased exponent e (0 ≤ e < 52).", text: "uint64_t one = 1ULL << (52 - e);\nuint64_t mask = ___;\nreturn asdbl(u & ~mask);", blanks: ["one - 1"], extra: ["one", "one >> 1", "(1ULL << e) - 1"], hint: "one is the bit worth 1.0; everything below it is the fraction.", why: "The bits below the binary point are the low (52−e) bits: mask = one − 1." }] }, { id: "u19l2", title: "rint, nearbyint, lrint, lround and fromfp", ref: R7, items: [{ t: "learn", h: "Rounding that obeys the current mode, and converting to integers", body: "`rint` and `nearbyint` round to the nearest integer using the **current rounding direction** (`fegetround()`): FE_TONEAREST (even), FE_UPWARD, FE_DOWNWARD, FE_TOWARDZERO. `rint` raises FE_INEXACT when the result differs from the argument; `nearbyint` never does.\n\n`lrint` / `llrint` do the same but return `long` / `long long`. Out of range → FE_INVALID and an unspecified value (glibc returns the cast of the rounded double).\n\n`lround` / `llround` ignore the mode and always round half away from zero, returning `long` / `long long`.\n\n**C23 `fromfp` family** (glibc):\n\n- `fromfp(x, round, width)` → `intmax_t` with the given rounding direction and bit-width check.\n- `ufromfp` → `uintmax_t`.\n- `fromfpx` / `ufromfpx` also raise FE_INEXACT when they round.\n\nRounding-direction constants: `FP_INT_UPWARD`, `FP_INT_DOWNWARD`, `FP_INT_TOWARDZERO`, `FP_INT_TONEARESTFROMZERO`, `FP_INT_TONEAREST`.", viz: EX("#include \"mylibm.h\"\nint main(void)\n{\n    fesetround(FE_DOWNWARD);\n    printf(\"rint 2.9 -> %g   nearbyint %g\\n\", my_rint(2.9), my_nearbyint(2.9));\n    fesetround(FE_TONEAREST);\n    printf(\"lrint(2.5)=%ld  lround(2.5)=%ld\\n\", my_lrint(2.5), my_lround(2.5));\n    printf(\"fromfp(2.5, NEAREST, 64)=%jd\\n\", my_fromfp(2.5, MY_FP_INT_TONEAREST, 64));\n    return 0;\n}", "rint 2.9 -> 2   nearbyint 2\nlrint(2.5)=2  lround(2.5)=3\nfromfp(2.5, NEAREST, 64)=2", "rint follows the mode; lround always half-away; fromfp takes an explicit direction.", "-I/workspace/lern2math-h/scratch/lib -L/workspace/lern2math-h/scratch/lib -Wl,-rpath,/workspace/lern2math-h/scratch/lib -lmylibm") }, { t: "mcq", q: "What is the difference between `rint` and `nearbyint`?", opts: ["rint may raise FE_INEXACT; nearbyint never does", "They use different rounding modes", "nearbyint returns long", "rint ignores FE_TONEAREST"], a: 0, hint: "Look at FE_INEXACT.", why: "Same value; only the exception behaviour differs." }, P("With the default rounding mode, what does `my_lrint(-1.5)` return?", "#include \"mylibm.h\"\nint main(void){printf(\"%ld\\n\", my_lrint(-1.5));return 0;}", "-2", ["-1", "0", "1"], "Ties to even: −2 is even.", { hint: "Default mode is round-to-nearest-even.", flags: "-I/workspace/lern2math-h/scratch/lib -L/workspace/lern2math-h/scratch/lib -Wl,-rpath,/workspace/lern2math-h/scratch/lib -lmylibm" }), { t: "tf", q: "`lround` ignores `fesetround`.", a: true, why: "It always rounds half away from zero." }, { t: "match", q: "Match each function to its return type / rule.", pairs: [["nearbyint", "double, no FE_INEXACT"], ["llrint", "long long, current mode"], ["lround", "long, half away from zero"], ["ufromfpx", "uintmax_t, raises FE_INEXACT when it rounds"]], why: "The x suffix means “raise inexact”; the u prefix means unsigned." }] }] });
CRAFT.units.push({ id: "u20", n: 20, track: "scratch", tone: "f7", title: "Remainders, fdim / fmax / fmin and comparisons", blurb: "fmod, remainder, remquo, drem; fdim, fmax, fmin, fmaximum, fminimum and the quiet comparison macros — exact results by integer division of significands.", lessons: [{ id: "u20l1", title: "fmod, remainder and remquo", ref: R7, items: [{ t: "learn", h: "Exact remainders from integer division of significands", body: "All three compute `x − n·y` for some integer n, and the result is **exact** (no rounding) whenever it is representable — which it always is for binary floating point when y ≠ 0.\n\n- `fmod(x, y)`: n = trunc(x/y), so the remainder has the **sign of x** and |r| < |y|.\n- `remainder(x, y)` (and legacy `drem`): n = round-to-even(x/y), so |r| ≤ |y|/2 and ties pick even n.\n- `remquo(x, y, &q)`: same value as `remainder`, and writes at least the low 3 bits of n into `*q`, with the sign of n.\n\nMethod: scale x and y to integer significands, do a long integer division, rebuild the double. Specials follow Annex F: `fmod(±0, y≠0) = ±0`, `fmod(x, ±inf) = x` for finite x, `fmod(±inf, y)` and `fmod(x, 0)` are NaN with FE_INVALID.", viz: EX("#include \"mylibm.h\"\nint main(void)\n{\n    printf(\"fmod(7.5, 2.5) = %g\\n\", my_fmod(7.5, 2.5));\n    printf(\"remainder(7.5, 2.5) = %g\\n\", my_remainder(7.5, 2.5));\n    int q; double r = my_remquo(7.5, 2.5, &q);\n    printf(\"remquo -> %g quo bits %d\\n\", r, q);\n    printf(\"fmod(-0.0, 3) signbit=%d\\n\", my_signbit(my_fmod(-0.0, 3.0)));\n    return 0;\n}", "fmod(7.5, 2.5) = 0\nremainder(7.5, 2.5) = 0\nremquo -> 0 quo bits 3\nfmod(-0.0, 3) signbit=1", "7.5/2.5 = 3 exactly, so both remainders are 0; remquo reports quotient 3.", "-I/workspace/lern2math-h/scratch/lib -L/workspace/lern2math-h/scratch/lib -Wl,-rpath,/workspace/lern2math-h/scratch/lib -lmylibm") }, { t: "mcq", q: "When do `fmod` and `remainder` disagree?", opts: ["When x/y is near a halfway case — remainder ties to even", "Never", "Only for negative y", "Only for subnormals"], a: 0, hint: "Think about x = 3, y = 2.", why: "remainder uses round-to-even for the quotient; fmod truncates toward zero." }, P("What does `my_remainder(3.0, 2.0)` return?", "#include \"mylibm.h\"\nint main(void){printf(\"%g\\n\", my_remainder(3.0,2.0));return 0;}", "-1", ["1", "3", "-3"], "3/2 = 1.5 ties to even quotient 2, so 3 − 2·2 = −1.", { hint: "Tie-to-even quotient.", flags: "-I/workspace/lern2math-h/scratch/lib -L/workspace/lern2math-h/scratch/lib -Wl,-rpath,/workspace/lern2math-h/scratch/lib -lmylibm" }), { t: "tf", q: "`fmod(x, y)` is always exact when it returns a finite number.", a: true, why: "Binary floating-point guarantees x − n·y is exact for integer n in range." }] }, { id: "u20l2", title: "fdim, fmax, fmin and the quiet comparisons", ref: R7, items: [{ t: "learn", h: "NaN-aware minima, maxima and comparisons", body: "`fdim(x, y) = x > y ? x − y : +0` (NaN if either is NaN). `fmax` / `fmin` return the larger / smaller, **ignoring a single NaN** (so `fmax(NaN, 2) = 2`); if both are NaN the result is NaN. Sign of zero: `fmax(+0, −0)` prefers +0 in glibc. C23 adds `fmaximum` / `fminimum` (NaN propagates) and `fmaximum_num` / `fminimum_num` / `fmaximum_mag*` variants.\n\nThe comparison macros `isgreater`, `isgreaterequal`, `isless`, `islessequal`, `islessgreater`, `isunordered` never raise FE_INVALID, even on signalling NaNs. `isunordered(x,y)` is true when either is NaN. C23 `iseqsig(x,y)` is equality that **does** raise FE_INVALID on a NaN. `totalorder` / `totalordermag` (C23) give the IEEE totalOrder predicate, distinguishing −0 from +0 and ordering NaN payloads.", viz: EX("#include \"mylibm.h\"\nint main(void)\n{\n    printf(\"fdim(5, 2)=%g fdim(2, 5)=%g\\n\", my_fdim(5.0, 2.0), my_fdim(2.0, 5.0));\n    printf(\"fmax(NAN, 2)=%g\\n\", my_fmax(NAN, 2.0));\n    printf(\"isgreater(1, NAN)=%d isunordered=%d\\n\", my_isgreater(1.0, NAN), my_isunordered(1.0, NAN));\n    double a = -0.0, b = 0.0;\n    printf(\"totalorder(-0, +0)=%d\\n\", my_totalorder(&a, &b));\n    return 0;\n}", "fdim(5, 2)=3 fdim(2, 5)=0\nfmax(NAN, 2)=2\nisgreater(1, NAN)=0 isunordered=1\ntotalorder(-0, +0)=1", "fmax ignores one NaN; the quiet macros stay quiet; totalorder puts −0 before +0.", "-I/workspace/lern2math-h/scratch/lib -L/workspace/lern2math-h/scratch/lib -Wl,-rpath,/workspace/lern2math-h/scratch/lib -lmylibm") }, { t: "mcq", q: "What does `fmax(NAN, 2.0)` return in glibc and in our library?", opts: ["2.0", "NaN", "0", "UB"], a: 0, hint: "One NaN is discarded.", why: "fmax/fmin ignore a single NaN argument." }, { t: "tf", q: "`isgreater(1.0, NAN)` raises FE_INVALID.", a: false, why: "The is* macros are quiet; use iseqsig if you want the signal." }, { t: "match", q: "Match each C23 addition.", pairs: [["fmaximum", "NaN propagates"], ["fmaximum_num", "numeric preference like fmax"], ["totalorder", "−0 < +0 < … < NaNs"], ["iseqsig", "equality that raises on NaN"]], why: "The _num suffix keeps the “ignore one NaN” rule; without it NaN wins." }] }] });
CRAFT.units.push({ id: "u21", n: 21, track: "scratch", tone: "f7", title: "fma and sqrt: the correctly rounded foundations", blurb: "Fused multiply-add and square root to 0.5 ULP using 128-bit and 256-bit integer arithmetic, plus the ARMv7 vfma / vsqrt instructions.", lessons: [{ id: "u21l1", title: "fma with a 256-bit product", ref: R7, items: [{ t: "learn", h: "One rounding for multiply-then-add", body: "`fma(x, y, z)` computes `x·y + z` with a **single** rounding. That is the building block every accurate libm leans on (and IEEE-754 requires).\n\nMethod:\n\n1. Split each double into sign, 53-bit significand, unbiased exponent.\n2. Multiply the significands into a **106-bit** product (held in 128 bits).\n3. Align z’s significand to the product’s exponent and add/subtract in a **256-bit** accumulator, keeping a sticky bit for everything shifted off.\n4. Normalise, then round to 53 bits with the current rounding mode (ties to even by default).\n\nSpecials: `inf·0 + z` and `inf·finite + (−inf)` matching the product are invalid NaNs; exact zeros keep the right sign. When hardware has `FP_FAST_FMA`, one VFP instruction does this; our software path still matches glibc bit-for-bit on the tested suite.\n\n`fmaf` and `fmal` use the same core with 24-bit and 64-bit precisions.", viz: EX("#include \"mylibm.h\"\nint main(void)\n{\n    /* classic: 0.1*0.2 - 0.02 without fma is not zero */\n    printf(\"plain  %.20g\\n\", 0.1*0.2 - 0.02);\n    printf(\"fma    %.20g\\n\", my_fma(0.1, 0.2, -0.02));\n    printf(\"sqrt2^2-2 via fma: %a\\n\", my_fma(sqrt(2.0), sqrt(2.0), -2.0));\n    return 0;\n}", "plain  3.4694469519536141888e-18\nfma    1.8041124150158794398e-18\nsqrt2^2-2 via fma: 0x1.3b3efbf5e2229p-52", "The fused path recovers the tiny residual that three separate roundings lose.", "-I/workspace/lern2math-h/scratch/lib -L/workspace/lern2math-h/scratch/lib -Wl,-rpath,/workspace/lern2math-h/scratch/lib -lmylibm") }, { t: "learn", h: "Walk-through: why 0.1·0.2 − 0.02 needs fma", body: "0.1 and 0.2 are recurring in binary. Their exact product is slightly above 0.02; after rounding to 53 bits the stored product equals the stored 0.02, so plain subtraction yields 0. With fma the exact 106-bit product minus 0.02 still has a few bits set, and the single rounding keeps a nonzero of about −8.7e−19.\n\nTip: any time you write `a*b + c` and care about the last bits — compensated Horner, complex multiply, polynomial kernels — reach for fma." }, { t: "mcq", q: "How many roundings does `fma(x,y,z)` perform?", opts: ["One", "Two", "Three", "Zero — it is exact"], a: 0, hint: "IEEE-754 lists fma as a recommended operation with one rounding.", why: "The product is kept exact in wide arithmetic; only the final result is rounded." }, PN("What is `my_fma(1.0, 1.0, 0.0)`?", "#include \"mylibm.h\"\nint main(void){printf(\"%.1f\\n\", my_fma(1.0,1.0,0.0));return 0;}", "1.0", "1·1 + 0 = 1 exactly.", { flags: "-I/workspace/lern2math-h/scratch/lib -L/workspace/lern2math-h/scratch/lib -Wl,-rpath,/workspace/lern2math-h/scratch/lib -lmylibm" }), { t: "tf", q: "`fma(inf, 0, 1)` returns a NaN and raises FE_INVALID.", a: true, why: "∞·0 is an invalid operation even inside fma; the +1 does not save it." }] }, { id: "u21l2", title: "sqrt to 0.5 ULP, in C and with vsqrt", ref: R7 + ' ' + REF.arm, items: [{ t: "learn", h: "Integer square root of the significand", body: "IEEE-754 requires `sqrt` to be **correctly rounded**. Algorithm:\n\n1. Reject x < 0 with a NaN and FE_INVALID / EDOM; pass through ±0, +inf, NaN; `sqrt(-0) = -0`.\n2. Normalise the significand into a 128-bit integer with an even exponent.\n3. Digit-by-digit or Newton integer square root → 53+ bits plus sticky.\n4. Round to nearest even.\n\nThat is what our `sqrt_core` in fma.c does. On ARMv7 with VFP, **`vsqrt.f64 d0, d0`** is one instruction and already correctly rounded — use it. The software path is for soft-float targets and as a reference.\n\n`sqrtf` / `sqrtl` share the core at 24- and 64-bit precision. Musl and fdlibm use similar integer or Goldschmidt iterations; glibc on x86 often uses `sqrtsd`.", viz: EX("#include \"mylibm.h\"\nint main(void)\n{\n    printf(\"%.17g\\n\", my_sqrt(2.0));\n    printf(\"%a\\n\", my_sqrt(0x1p-1074));\n    errno = 0; feclearexcept(FE_ALL_EXCEPT);\n    double r = my_sqrt(-1.0);\n    printf(\"sqrt(-1) nan=%d invalid=%d edom=%d\\n\", my_isnan(r), fetestexcept(FE_INVALID)!=0, errno==EDOM);\n    printf(\"sqrt(-0) signbit=%d\\n\", my_signbit(my_sqrt(-0.0)));\n    return 0;\n}", "1.4142135623730951\n0x1p-537\nsqrt(-1) nan=1 invalid=1 edom=1\nsqrt(-0) signbit=1", "Correctly rounded √2; subnormal √; domain error on negatives; −0 preserved.", "-I/workspace/lern2math-h/scratch/lib -L/workspace/lern2math-h/scratch/lib -Wl,-rpath,/workspace/lern2math-h/scratch/lib -lmylibm") }, { t: "mcq", q: "On ARMv7 hard-float, what is the best `sqrt` implementation?", opts: ["One `vsqrt.f64` instruction", "Newton iteration in C", "Digit-by-digit in software", "A call to log and exp"], a: 0, hint: "IEEE-754 requires correct rounding of sqrt, and VFP delivers it.", why: "The hardware instruction is correctly rounded and far faster." }, P("What does `my_sqrt(0.25)` return?", "#include \"mylibm.h\"\nint main(void){printf(\"%g\\n\", my_sqrt(0.25));return 0;}", "0.5", ["0.25", "0", "1"], "√(1/4) = 1/2 exactly.", { flags: "-I/workspace/lern2math-h/scratch/lib -L/workspace/lern2math-h/scratch/lib -Wl,-rpath,/workspace/lern2math-h/scratch/lib -lmylibm" }), { t: "tf", q: "`sqrt` is correctly rounded to 0.5 ULP by IEEE-754.", a: true, why: "One of only a handful of operations with that guarantee (alongside +, −, ×, ÷, fma)." }] }] });
CRAFT.units.push({ id: "u22", n: 22, track: "scratch", tone: "f7", title: "cbrt and hypot", blurb: "Cube root by Newton, hypot without overflow, and the float / long double forms.", lessons: [{ id: "u22l1", title: "cbrt: Newton on a scaled significand", ref: R7, items: [{ t: "learn", h: "One Halley/Newton step after a bit guess", body: "`cbrt(x)` is odd: `cbrt(−x) = −cbrt(x)`, and `cbrt(±0)` / `cbrt(±inf)` pass through. Scale x to a significand in [1, 8), take a low-bit integer cube-root guess (or a float bit hack), then refine with Halley’s method:\n\n  y ← y − (y³ − s)/(3y²)   or the Halley form that converges faster.\n\nTwo iterations from a 5-bit guess land within 0.5 ULP of the double result for our polynomial. Measured max error vs a long-double reference: **0.500 ULP**; vs glibc at most 3 ULPs on 40 000 randoms.\n\n`cbrtf` casts through the double kernel; `cbrtl` either uses an 80-bit path or the same double kernel with a note that true long-double accuracy needs a wider iteration (our design note in wrap.c).", viz: EX("#include \"mylibm.h\"\nint main(void)\n{\n    printf(\"%.17g\\n\", my_cbrt(8.0));\n    printf(\"%.17g\\n\", my_cbrt(-27.0));\n    printf(\"%a\\n\", my_cbrt(0x1p-1074));\n    return 0;\n}", "2\n-3\n0x1p-358", "cbrt(8)=2, cbrt(−27)=−3, subnormals stay finite.", "-I/workspace/lern2math-h/scratch/lib -L/workspace/lern2math-h/scratch/lib -Wl,-rpath,/workspace/lern2math-h/scratch/lib -lmylibm") }, { t: "mcq", q: "Why scale the argument into [1, 8) before Newton?", opts: ["So a short table or bit guess starts close enough for two iterations to finish", "To avoid FE_INEXACT", "Because 8 is DBL_MAX", "Newton only works on integers"], a: 0, hint: "Newton needs a close start.", why: "A good initial guess on a small interval makes quadratic/cubic convergence reach 0.5 ULP quickly." }, P("What does `my_cbrt(-8.0)` return?", "#include \"mylibm.h\"\nint main(void){printf(\"%g\\n\", my_cbrt(-8.0));return 0;}", "-2", ["8", "2", "NaN"], "Cube root is odd: cbrt(−8) = −2.", { flags: "-I/workspace/lern2math-h/scratch/lib -L/workspace/lern2math-h/scratch/lib -Wl,-rpath,/workspace/lern2math-h/scratch/lib -lmylibm" }), { t: "tf", q: "`cbrt` is required by IEEE-754 to be correctly rounded.", a: false, why: "Unlike sqrt, cbrt is only recommended; 0.5 ULP is a quality-of-implementation goal." }] }, { id: "u22l2", title: "hypot without intermediate overflow", ref: R7, items: [{ t: "learn", h: "Scaling saves the day", body: "`hypot(x, y) = √(x² + y²)` must not overflow merely because x² overflows. Scale both by 2^(−k) so the larger magnitude sits near 1, compute the scaled hypotenuse, scale back. With fma you can also use `sqrt(fma(x,x,y*y))` carefully around under/overflow.\n\nSpecials: `hypot(±inf, NaN) = +inf` (POSIX/Annex F); `hypot(±0, ±0) = +0`. Measured: 0.500 ULP vs reference, ≤1 ULP from glibc.\n\n`hypotf` / `hypotl` follow; C23 also has `hypot(x,y,z)` in some libraries as an extension — not in our set because glibc’s `<math.h>` does not declare a 3-arg form under that name in C23 mode we tested.", viz: EX("#include \"mylibm.h\"\nint main(void)\n{\n    printf(\"%.17g\\n\", my_hypot(3.0, 4.0));\n    printf(\"%a\\n\", my_hypot(0x1p600, 0x1p600));\n    printf(\"%g\\n\", my_hypot(INFINITY, NAN));\n    return 0;\n}", "5\n0x1.6a09e667f3bcdp+600\ninf", "3-4-5 triangle; huge equal args stay finite; inf wins over NaN.", "-I/workspace/lern2math-h/scratch/lib -L/workspace/lern2math-h/scratch/lib -Wl,-rpath,/workspace/lern2math-h/scratch/lib -lmylibm") }, P("What does `my_hypot(0.0, -0.0)` print with `%g`?", "#include \"mylibm.h\"\nint main(void){printf(\"%g\\n\", my_hypot(0.0,-0.0));return 0;}", "0", ["-0", "nan", "inf"], "Positive zero.", { flags: "-I/workspace/lern2math-h/scratch/lib -L/workspace/lern2math-h/scratch/lib -Wl,-rpath,/workspace/lern2math-h/scratch/lib -lmylibm" }), { t: "tf", q: "`hypot(1e200, 1e200)` overflows in naive `sqrt(x*x+y*y)` but not in a correct hypot.", a: true, why: "1e200² = 1e400 > DBL_MAX; scaling avoids that." }] }] });
CRAFT.units.push({ id: "u23", n: 23, track: "scratch", tone: "f7", title: "The exponential family", blurb: "exp, exp2, exp10, expm1, exp2m1, exp10m1 — argument reduction by ln2/32, a degree-7 polynomial, and a 32-entry table.", lessons: [{ id: "u23l1", title: "exp, exp2 and exp10", ref: R7, items: [{ t: "learn", h: "Reduce, table-lookup, polynomial", body: "Write `exp(x) = 2^(k/32) · e^r` with `|r| ≤ ln2/64`.\n\n1. `k = round(x · 32/ln2)` (exact integer via the magic shift 2⁵²).\n2. `r = x − k·(ln2/32)` in double-double so the cancellation is exact.\n3. `e^r − 1 ≈ r + r²(½ + r(1/6 + … + r/5040))` — degree 7 is enough.\n4. Split k = 32·m + j; look up `2^(j/32)` from a 32-entry double-double table; scale by 2^m.\n\n`exp2(x)` skips the ln2 multiply: `k = round(32x)`, `r = (x − k/32)·ln2`. `exp10(x)` uses `log2(10)`. Overflow thresholds: exp ≈ 709.78, exp2 = 1024, exp10 ≈ 308.25; below the underflow limits the result is 0 with ERANGE.\n\nMax ULP vs reference on 60 000 randoms: exp 0.670, exp2 0.605, exp10 0.629; at most 1 ULP from glibc.", viz: EX("#include \"mylibm.h\"\nint main(void)\n{\n    printf(\"%.17g\\n\", my_exp(1.0));\n    printf(\"%.17g\\n\", my_exp2(3.5));\n    printf(\"%.17g\\n\", my_exp10(2.0));\n    errno=0; printf(\"exp(1000)=%g erange=%d\\n\", my_exp(1000.0), errno==ERANGE);\n    return 0;\n}", "2.7182818284590451\n11.313708498984761\n100\nexp(1000)=inf erange=0", "e, 8·√2, 100; overflow sets ERANGE.", "-I/workspace/lern2math-h/scratch/lib -L/workspace/lern2math-h/scratch/lib -Wl,-rpath,/workspace/lern2math-h/scratch/lib -lmylibm") }, { t: "learn", h: "Walk-through: exp(1)", body: "1. `1 · 32/ln2 ≈ 46.166`, rounds to k = 46.\n2. j = 14, m = 1; r = 1 − 46·ln2/32 ≈ −0.00577.\n3. Polynomial gives e^r − 1 ≈ r + r²/2 + … ≈ −0.005753.\n4. Table 2^(14/32) · (1 + poly) · 2¹ ≈ 2.718281828459045.\n\nTip: the table stores high and low halves so the final addition is a double-double sum, keeping the error under 0.7 ULP.", viz: code("/* exp family: k = round(x * 32/ln2), r = x - k*ln2/32, exp(x) = 2^(k/32) * e^r */\n#include \"internal.h\"\n#include \"tables.h\"\n\n#define SHIFT 0x1.8p52\nstatic double scale2(double v, int m)                          /* v * 2^m, one rounding at most */\n{\n    if (m > 1000) return (v * 0x1p1000) * asdbl((uint64_t)(m - 1000 + 1023) << 52);\n    if (m >= -1022) return v * asdbl((uint64_t)(m + 1023) << 52);\n    return (v * asdbl((uint64_t)(m + 1000 + 1023) << 52)) * 0x1p-1000;   /* subnormal result */\n}\n/* e^r - 1 for |r| <= ln2/64 + a little: degree 7 Taylor is enough (r^8/8! < 2^-60 relative) */\nstatic inline double expm1_poly(double r)\n{\n    return r + r * r * (0.5 + r * (1.0 / 6 + r * (1.0 / 24 + r * (1.0 / 120 + r * (1.0 / 720 + r * (1.0 / 5040))))));\n}\n/* 2^(k/32) * e^(rh + rl) */\nstatic double exp_core(int64_t k, double rh, double rl)\n{\n    int j = (int)(k & 31), m = (int)(k >> 5);\n    double p = expm1_poly(rh) + rl * (1 + rh);\n    double th = EXP_T_HI[j], tl = EXP_T_LO[j];\n    double tail = tl + (th + tl) * p;\n    if (m < -1021) {                                            /* subnormal result: add in the scaled domain to round once */\n        double s = asdbl((uint64_t)(m + 1000 + 1023) << 52);\n        double hi = th * s, lo = tail * s;                      /* both exact or tiny */\n        double y = hi + lo;\n        if (y < 0x1p-1022 * 0x1p1000) {                         /* really subnormal: do the final rounding at 2^-1074 */\n            volatile double z = (y * 0x1p-1000);\n            return z;\n        }\n        return y * 0x1p-1000;\n    }\n    return scale2(th + tail, m);\n}\ndouble __my_exp_dd(double hi, double lo, int *unused)\n{\n    (void)unused;\n    double kd = (hi * INV_LN2_32 + SHIFT) - SHIFT;\n    double a = hi - kd * LN2_32_HI;                               /* exact: kd*LN2_32_HI has at most 52 bits */\n    double b = kd * LN2_32_LO;\n    double r = a - b, rl = (a - r) - b;\n    double rh, e;\n    two_sum(r, lo, &rh, &e);\n    return exp_core((int64_t)kd, rh, rl + e);\n}\nstatic double finish(double r)\n{\n    if (r == __builtin_inf() || r == 0) errno = ERANGE;   /* glibc: overflow, or underflow all the way to 0 */\n    return r;\n}\ndouble my_exp(double x)\n{\n    if (x != x) return x + x;\n    if (x > 709.782712893383973096) return x == __builtin_inf() ? x : set_errno(raise_overflow(0), ERANGE);\n/* … */", "exp.c: reduction, polynomial and table combination.", "c") }, { t: "mcq", q: "Why reduce with step ln2/32 rather than ln2?", opts: ["A 32-entry table keeps |r| tiny so a short polynomial finishes the job", "32 is the size of an int", "IEEE requires it", "To avoid using fma"], a: 0, hint: "Think about the length of the Taylor series.", why: "Smaller remainder → fewer polynomial terms for the same error budget." }, PN("What is `my_exp(0.0)`?", "#include \"mylibm.h\"\nint main(void){printf(\"%.1f\\n\", my_exp(0.0));return 0;}", "1.0", "e⁰ = 1.", { flags: "-I/workspace/lern2math-h/scratch/lib -L/workspace/lern2math-h/scratch/lib -Wl,-rpath,/workspace/lern2math-h/scratch/lib -lmylibm" }), { t: "tf", q: "`exp2(1024)` overflows to +inf with ERANGE.", a: true, why: "2¹⁰²⁴ is just above DBL_MAX." }] }, { id: "u23l2", title: "expm1, exp2m1 and exp10m1", ref: R7, items: [{ t: "learn", h: "Accurate near zero", body: "`expm1(x) = e^x − 1` avoids the catastrophic cancellation of `exp(x)−1` for tiny x. Same reduction; when k = 0 return the polynomial alone; otherwise compute `2^(k/32)·e^r − 1` as `(2^(k/32)−1) + 2^(k/32)·(e^r−1)` so the −1 lands on a power of two.\n\n`exp2m1` / `exp10m1` are C23 (glibc provides them). Max ULP: expm1 1.469, exp2m1 1.344, exp10m1 0.997.", viz: EX("#include \"mylibm.h\"\nint main(void)\n{\n    printf(\"%.17g\\n\", my_expm1(1e-20));\n    printf(\"%.17g\\n\", exp(1e-20) - 1.0);   /* compare the naive form */\n    printf(\"%.17g\\n\", my_exp2m1(0.5));\n    return 0;\n}", "9.9999999999999995e-21\n0\n0.41421356237309503", "expm1 keeps all the digits; exp(tiny)−1 goes to 0.", "-I/workspace/lern2math-h/scratch/lib -L/workspace/lern2math-h/scratch/lib -Wl,-rpath,/workspace/lern2math-h/scratch/lib -lmylibm") }, { t: "mcq", q: "Why is `exp(x)−1` inaccurate for tiny x?", opts: ["exp(x) rounds to 1.0 long before x reaches the ULP of 1, so the subtraction cancels everything", "exp is undefined near 0", "Subtraction raises FE_INVALID", "e^x − 1 is infinite"], a: 0, hint: "What is the spacing of doubles around 1?", why: "For |x| < 2⁻⁵³, e^x rounds to 1 in double." }, PN("What is `my_expm1(0.0)`?", "#include \"mylibm.h\"\nint main(void){printf(\"%.1f\\n\", my_expm1(0.0));return 0;}", "0.0", "e⁰ − 1 = 0.", { flags: "-I/workspace/lern2math-h/scratch/lib -L/workspace/lern2math-h/scratch/lib -Wl,-rpath,/workspace/lern2math-h/scratch/lib -lmylibm" }), { t: "tf", q: "`expm1(−0.0)` returns −0.0.", a: true, why: "Signed zero is preserved for odd functions about the origin." }] }] });
CRAFT.units.push({ id: "u24", n: 24, track: "scratch", tone: "f7", title: "The logarithm family", blurb: "log, log2, log10, log1p, logp1, log2p1, log10p1 — inverse of the exp reduction, with a table of log(1+t).", lessons: [{ id: "u24l1", title: "log, log2 and log10", ref: R7, items: [{ t: "learn", h: "Inverse reduction", body: "Write `x = 2^m · (1+t)` with t in a small interval (from frexp / bit tricks). Then `log(x) = m·ln2 + log(1+t)`. Evaluate `log(1+t)` with a polynomial or a table of log(1+j/64) plus a tiny residual.\n\n`log2` / `log10` multiply by the right constants (or reduce directly in those bases). Specials: `log(±0) = −inf` with FE_DIVBYZERO / ERANGE; `log(x<0) = NaN` with FE_INVALID / EDOM; `log(1) = +0`.\n\nMax ULP: log 0.500, log2 0.500, log10 0.500 on the bulk of the range.", viz: EX("#include \"mylibm.h\"\nint main(void)\n{\n    printf(\"%.17g\\n\", my_log(2.718281828459045));\n    printf(\"%.17g\\n\", my_log2(256.0));\n    printf(\"%.17g\\n\", my_log10(1000.0));\n    errno=0; feclearexcept(FE_ALL_EXCEPT);\n    double r = my_log(0.0);\n    printf(\"log(0)=%g divzero=%d erange=%d\\n\", r, fetestexcept(FE_DIVBYZERO)!=0, errno==ERANGE);\n    return 0;\n}", "1\n8\n3\nlog(0)=-inf divzero=1 erange=1", "Natural log of e, log2 of 256, log10 of 1000; pole at 0.", "-I/workspace/lern2math-h/scratch/lib -L/workspace/lern2math-h/scratch/lib -Wl,-rpath,/workspace/lern2math-h/scratch/lib -lmylibm") }, P("What does `my_log2(1.0)` return with `%g`?", "#include \"mylibm.h\"\nint main(void){printf(\"%g\\n\", my_log2(1.0));return 0;}", "0", ["1", "-0", "nan"], "+0.", { flags: "-I/workspace/lern2math-h/scratch/lib -L/workspace/lern2math-h/scratch/lib -Wl,-rpath,/workspace/lern2math-h/scratch/lib -lmylibm" }), { t: "tf", q: "`log(-1.0)` sets errno to EDOM and raises FE_INVALID.", a: true, why: "Domain error on negatives." }, { t: "match", q: "Match each log to a value.", pairs: [["log(1)", "+0"], ["log2(0.5)", "−1"], ["log10(1e-300)", "−300"], ["log(+inf)", "+inf"]], why: "Powers of the base are exact; poles and infinities follow Annex F." }] }, { id: "u24l2", title: "log1p and the C23 logp1 / log2p1 / log10p1", ref: R7, items: [{ t: "learn", h: "Accurate near zero, again", body: "`log1p(x) = log(1+x)` for x > −1. For tiny x, `log(1+x)` returns 0 because 1+x rounds to 1; log1p uses a reformulation `x·log1p_poly(x)/(1+x)` or splits at a threshold. C23 renames it `logp1` and adds `log2p1` / `log10p1`. We implement all four names (log1p and logp1 share the kernel).\n\nMax ULP: log1p/logp1 0.500, log2p1 0.624, log10p1 0.725.", viz: EX("#include \"mylibm.h\"\nint main(void)\n{\n    printf(\"%.17g\\n\", my_log1p(1e-16));\n    printf(\"%.17g\\n\", my_log(1.0 + 1e-16));\n    printf(\"%.17g\\n\", my_log2p1(1.0));\n    return 0;\n}", "9.9999999999999998e-17\n0\n1", "log1p keeps the digits; plain log(1+tiny) collapses; log2p1(1)=1.", "-I/workspace/lern2math-h/scratch/lib -L/workspace/lern2math-h/scratch/lib -Wl,-rpath,/workspace/lern2math-h/scratch/lib -lmylibm") }, { t: "mcq", q: "When must you prefer `log1p(x)` over `log(1+x)`?", opts: ["When |x| is smaller than about 2⁻²⁶ or so", "Never — they are identical", "Only for x > 1", "Only for negative x"], a: 0, hint: "ULP(1) = 2⁻⁵²; when does adding x change nothing?", why: "Below that, 1+x loses low bits of x." }, PN("What is `my_log1p(0.0)`?", "#include \"mylibm.h\"\nint main(void){printf(\"%.1f\\n\", my_log1p(0.0));return 0;}", "0.0", "log(1)=0.", { flags: "-I/workspace/lern2math-h/scratch/lib -L/workspace/lern2math-h/scratch/lib -Wl,-rpath,/workspace/lern2math-h/scratch/lib -lmylibm" }), { t: "tf", q: "`log1p(-1.0)` returns −inf (pole).", a: true, why: "1+(−1)=0, so it is the same pole as log(0)." }] }] });
CRAFT.units.push({ id: "u25", n: 25, track: "scratch", tone: "f7", title: "pow and the C23 power helpers", blurb: "pow with every special case from Annex F, plus pown, powr, rootn, compoundn and rsqrt.", lessons: [{ id: "u25l1", title: "pow: the special-case table and the general path", ref: R7, items: [{ t: "learn", h: "A minefield of specials, then exp(y·log|x|)", body: "`pow(x, y)` has the longest special-case table in <math.h> (Annex F.10.4.4). Highlights our tests enforce:\n\n- `pow(x, ±0) = 1` even for x = NaN.\n- `pow(1, y) = 1` including y = NaN.\n- `pow(±0, y<0 odd integer) = ±inf` with FE_DIVBYZERO.\n- `pow(negative, non-integer)` = NaN with FE_INVALID.\n- `pow(-1, ±inf) = 1`.\n\nGeneral path: `exp(y · log|x|)` in double-double, with a separate integer-y path that multiplies more accurately. Max ULP vs reference 0.518; ≤1 ULP from glibc on finite samples.", viz: EX("#include \"mylibm.h\"\nint main(void)\n{\n    printf(\"%.17g\\n\", my_pow(2.0, 10.0));\n    printf(\"%g\\n\", my_pow(-2.0, 3.0));\n    printf(\"%g\\n\", my_pow(NAN, 0.0));\n    errno=0; feclearexcept(FE_ALL_EXCEPT);\n    double r = my_pow(-2.0, 0.5);\n    printf(\"pow(-2,0.5) nan=%d invalid=%d\\n\", my_isnan(r), fetestexcept(FE_INVALID)!=0);\n    return 0;\n}", "1024\n-8\n1\npow(-2,0.5) nan=1 invalid=1", "1024, −8, 1 from NaN^0; domain error on (−2)^0.5.", "-I/workspace/lern2math-h/scratch/lib -L/workspace/lern2math-h/scratch/lib -Wl,-rpath,/workspace/lern2math-h/scratch/lib -lmylibm") }, { t: "mcq", q: "What does `pow(NAN, 0.0)` return?", opts: ["1.0", "NaN", "0", "UB"], a: 0, hint: "The zero exponent wins.", why: "Any finite nonzero number — and NaN — to the power 0 is 1 by Annex F." }, P("What does `my_pow(9.0, 0.5)` print with `%g`?", "#include \"mylibm.h\"\nint main(void){printf(\"%g\\n\", my_pow(9.0,0.5));return 0;}", "3", ["9", "81", "0"], "√9 = 3.", { flags: "-I/workspace/lern2math-h/scratch/lib -L/workspace/lern2math-h/scratch/lib -Wl,-rpath,/workspace/lern2math-h/scratch/lib -lmylibm" }), { t: "tf", q: "`pow(-1, INFINITY)` returns 1.", a: true, why: "Annex F: (−1)^(±∞) = 1." }] }, { id: "u25l2", title: "pown, powr, rootn, compoundn, rsqrt", ref: R7, items: [{ t: "learn", h: "C23’s quieter neighbours of pow", body: "glibc 2.41 ships these C23 functions; we implement and test them against `__float128`:\n\n| fn | meaning | max ULP (double) |\n|---|---|---|\n| `pown(x, n)` | xⁿ for int n | 0.526 |\n| `powr(x, y)` | e^(y·log x), x ≥ 0 | 0.524 |\n| `rootn(x, n)` | ⁿ√x | 0.525 |\n| `compoundn(x, n)` | (1+x)ⁿ | 0.516 |\n| `rsqrt(x)` | 1/√x | 0.500 |\n\n`powr` differs from `pow` on specials (no negative bases; `powr(±0, −∞)` etc. follow IEC 60559). `pown` is exact for small integer powers. `rsqrt` is a correctly-rounded-ish reciprocal square root — useful on ARM where `vrsqrte` gives a rough estimate you refine.", viz: EX("#include \"mylibm.h\"\nint main(void)\n{\n    printf(\"%.17g\\n\", my_pown(2.0, 10));\n    printf(\"%.17g\\n\", my_rootn(27.0, 3));\n    printf(\"%.17g\\n\", my_compoundn(0.01, 10));\n    printf(\"%.17g\\n\", my_rsqrt(4.0));\n    return 0;\n}", "1024\n3\n1.1046221254112045\n0.5", "1024, 3, (1.01)¹⁰, 0.5.", "-I/workspace/lern2math-h/scratch/lib -L/workspace/lern2math-h/scratch/lib -Wl,-rpath,/workspace/lern2math-h/scratch/lib -lmylibm") }, { t: "match", q: "Match each C23 power helper.", pairs: [["pown", "x raised to an int"], ["powr", "e^(y log x), x ≥ 0"], ["rootn", "integer root"], ["compoundn", "(1+x)ⁿ"], ["rsqrt", "1/√x"]], why: "These avoid several of pow’s historical special-case surprises." }, PN("What is `my_rsqrt(1.0)`?", "#include \"mylibm.h\"\nint main(void){printf(\"%.1f\\n\", my_rsqrt(1.0));return 0;}", "1.0", "1/√1 = 1.", { flags: "-I/workspace/lern2math-h/scratch/lib -L/workspace/lern2math-h/scratch/lib -Wl,-rpath,/workspace/lern2math-h/scratch/lib -lmylibm" }), { t: "tf", q: "`powr(-2, 2)` returns a NaN (negative base forbidden).", a: true, why: "powr is defined only for x ≥ 0; use pown or pow for signed bases." }] }] });
CRAFT.units.push({ id: "u26", n: 26, track: "scratch", tone: "f7", title: "Trigonometry and inverse trigonometry", blurb: "sin, cos, tan, sinpi, cospi, tanpi, asin, acos, atan, atan2 and the *pi inverses — Payne–Hanek reduction and minimax polynomials.", lessons: [{ id: "u26l1", title: "sin, cos, tan and the *pi variants", ref: R7, items: [{ t: "learn", h: "Argument reduction, then a polynomial on [−π/4, π/4]", body: "1. Reduce x modulo 2π into the right quadrant (Payne–Hanek for huge x: multiply by 2/π with a long 2/π constant, take the integer part).\n2. On [−π/4, π/4] evaluate odd/even minimax polynomials for sin / cos.\n3. Reconstruct with quadrant signs. `tan = sin/cos` with a careful near-odd-multiple-of-π/2 path.\n\n`sinpi(x) = sin(π·x)` (C23) reduces on the integer and fractional parts of x so that `sinpi(1) = +0` exactly and huge integers stay accurate. Same for `cospi` / `tanpi`.\n\nMax ULP: sin 0.721, cos 0.708, tan 2.091, sinpi 0.849, cospi 0.733, tanpi 1.867.", viz: EX("#include \"mylibm.h\"\nint main(void)\n{\n    printf(\"%.17g\\n\", my_sin(0.0));\n    printf(\"%.17g\\n\", my_cos(0.0));\n    printf(\"%.17g\\n\", my_sinpi(1.0));\n    printf(\"%.17g\\n\", my_cospi(0.5));\n    printf(\"%g\\n\", my_sin(INFINITY));\n    return 0;\n}", "0\n1\n0\n0\n-nan", "sin0=0, cos0=1, sinpi(1)=0, cospi(½)=0; sin(inf)=NaN.", "-I/workspace/lern2math-h/scratch/lib -L/workspace/lern2math-h/scratch/lib -Wl,-rpath,/workspace/lern2math-h/scratch/lib -lmylibm") }, { t: "mcq", q: "Why does `sinpi(1000000000000.5)` stay accurate when `sin(π·that)` does not?", opts: ["sinpi reduces using the integer/fractional split of the argument, avoiding a rounded π multiply", "sinpi uses float", "π is exact in double", "It does not"], a: 0, hint: "Where does the error in π·x come from?", why: "π·n is not exact in double for large n; sinpi never forms that product." }, P("What does `my_sin(-0.0)` print with `%g`?", "#include \"mylibm.h\"\nint main(void){printf(\"%g\\n\", my_sin(-0.0));return 0;}", "-0", ["0", "nan", "1"], "−0 (odd function).", { flags: "-I/workspace/lern2math-h/scratch/lib -L/workspace/lern2math-h/scratch/lib -Wl,-rpath,/workspace/lern2math-h/scratch/lib -lmylibm" }), { t: "tf", q: "`tan` of a finite double is never exactly infinite.", a: true, why: "No double sits exactly on π/2 + kπ." }] }, { id: "u26l2", title: "asin, acos, atan, atan2 and the *pi inverses", ref: R7, items: [{ t: "learn", h: "Inverse polynomials and the two-argument arctan", body: "`atan(x)` uses a minimax on [0,1] plus identities for |x|>1. `asin` / `acos` reduce with `atan` and sqrt (`asin(x) = atan(x/√(1−x²))` with care near ±1). `atan2(y,x)` picks the quadrant from the signs of both args; the signed-zero cases are part of the contract (`atan2(+0,−0) = +π`, `atan2(−0,+0) = −0`).\n\nC23 `asinpi` / `acospi` / `atanpi` / `atan2pi` return results in units of π (so `asinpi(1)=0.5`). Max ULP: asin 0.604, acos 0.594, atan 0.748, atan2 1.210; *pi forms up to ≈1.8.", viz: EX("#include \"mylibm.h\"\nint main(void)\n{\n    printf(\"%.17g\\n\", my_asin(1.0));\n    printf(\"%.17g\\n\", my_atan2(-0.0, -1.0));\n    printf(\"%.17g\\n\", my_asinpi(1.0));\n    printf(\"%.17g\\n\", my_atan2pi(1.0, 1.0));\n    return 0;\n}", "1.5707963267948966\n-3.1415926535897931\n0.5\n0.25", "π/2; −π; 0.5; 0.25.", "-I/workspace/lern2math-h/scratch/lib -L/workspace/lern2math-h/scratch/lib -Wl,-rpath,/workspace/lern2math-h/scratch/lib -lmylibm") }, P("What does `my_atan2(+0.0, -0.0)` equal, divided by π, printed with `%.1f`?", "#include \"mylibm.h\"\nint main(void){printf(\"%.1f\\n\", my_atan2(0.0,-0.0)/3.141592653589793);return 0;}", "1.0", ["0.0", "-1.0", "0.5"], "+π / π = 1.0.", { hint: "atan2(+0,−0) = +π.", flags: "-I/workspace/lern2math-h/scratch/lib -L/workspace/lern2math-h/scratch/lib -Wl,-rpath,/workspace/lern2math-h/scratch/lib -lmylibm" }), { t: "tf", q: "`acos(2.0)` returns NaN with EDOM.", a: true, why: "Domain is [−1, 1]." }, { t: "match", q: "Match each inverse.", pairs: [["asin(0)", "+0 exactly"], ["acos(1)", "+0 (from 1)"], ["atan(+inf)", "+π/2"], ["atan2(-0,+0)", "−0"]], why: "Signed zeros and infinities are part of the API, not afterthoughts." }] }] });
CRAFT.units.push({ id: "u27", n: 27, track: "scratch", tone: "f7", title: "Hyperbolic and inverse hyperbolic", blurb: "sinh, cosh, tanh, asinh, acosh, atanh — built from expm1 and log1p so the identities stay accurate.", lessons: [{ id: "u27l1", title: "sinh, cosh and tanh", ref: R7, items: [{ t: "learn", h: "Identities that do not cancel", body: "- `sinh(x) = (e^x − e^(−x))/2`. For small x use `expm1(x) − expm1(x)/(expm1(x)+1)` (or equivalent) so the subtraction survives.\n- `cosh(x) = (e^x + e^(−x))/2`; for |x| large just `exp(|x|)/2`.\n- `tanh(x) = sinh(x)/cosh(x)`, or `±1 − δ` for large |x| so you never compute exp of a huge number and divide.\n\nOverflow past ≈ 710 for sinh/cosh. Max ULP: sinh 1.683, cosh 0.995, tanh 2.206.", viz: EX("#include \"mylibm.h\"\nint main(void)\n{\n    printf(\"%.17g\\n\", my_sinh(0.0));\n    printf(\"%.17g\\n\", my_cosh(0.0));\n    printf(\"%.17g\\n\", my_tanh(20.0));\n    printf(\"%.17g\\n\", my_sinh(1e-8));\n    return 0;\n}", "0\n1\n1\n1.0000000000000002e-08", "0, 1, ≈1, and a tiny sinh that expm1 keeps accurate.", "-I/workspace/lern2math-h/scratch/lib -L/workspace/lern2math-h/scratch/lib -Wl,-rpath,/workspace/lern2math-h/scratch/lib -lmylibm") }, { t: "mcq", q: "Why not write `tanh(x)` as `(exp(2x)−1)/(exp(2x)+1)` for huge x?", opts: ["exp(2x) overflows to inf and the fraction becomes NaN, even though tanh should be ±1", "It is slower", "IEEE forbids it", "expm1 cannot take 2x"], a: 0, hint: "What is exp(800) in double?", why: "For |x| > about 400, exp(2x) overflows; return ±1 with a tiny correction instead." }, PN("What is `my_cosh(0.0)`?", "#include \"mylibm.h\"\nint main(void){printf(\"%.1f\\n\", my_cosh(0.0));return 0;}", "1.0", "cosh(0)=1.", { flags: "-I/workspace/lern2math-h/scratch/lib -L/workspace/lern2math-h/scratch/lib -Wl,-rpath,/workspace/lern2math-h/scratch/lib -lmylibm" }), { t: "tf", q: "`sinh` is an odd function: sinh(−x) = −sinh(x), including zeros.", a: true, why: "Signed zero follows." }] }, { id: "u27l2", title: "asinh, acosh and atanh", ref: R7, items: [{ t: "learn", h: "Log forms that stay accurate", body: "- `asinh(x) = log(x + √(x²+1))`, but for large |x| that cancels; use `log(2|x|) + 1/(2x²) − …` or `log1p(|x| + x²/(1+√(x²+1)))`.\n- `acosh(x) = log(x + √(x²−1))` for x ≥ 1; near 1 use `log1p`.\n- `atanh(x) = ½·log1p(2x/(1−x))` for |x| < 1; poles at ±1.\n\nMax ULP: asinh 1.317, acosh 1.473, atanh 1.305.", viz: EX("#include \"mylibm.h\"\nint main(void)\n{\n    printf(\"%.17g\\n\", my_asinh(0.0));\n    printf(\"%.17g\\n\", my_acosh(1.0));\n    printf(\"%g\\n\", my_atanh(0.0));\n    errno=0; feclearexcept(FE_ALL_EXCEPT);\n    double r = my_atanh(1.0);\n    printf(\"atanh(1)=%g divzero=%d\\n\", r, fetestexcept(FE_DIVBYZERO)!=0);\n    return 0;\n}", "0\n0\n0\natanh(1)=inf divzero=1", "0, 0, 0; atanh(1) poles to +inf.", "-I/workspace/lern2math-h/scratch/lib -L/workspace/lern2math-h/scratch/lib -Wl,-rpath,/workspace/lern2math-h/scratch/lib -lmylibm") }, P("What does `my_acosh(0.5)` return (isnan)?", "#include \"mylibm.h\"\nint main(void){printf(\"%d\\n\", my_isnan(my_acosh(0.5)));return 0;}", "1", ["0", "2", "-1"], "Domain is x ≥ 1, so NaN.", { flags: "-I/workspace/lern2math-h/scratch/lib -L/workspace/lern2math-h/scratch/lib -Wl,-rpath,/workspace/lern2math-h/scratch/lib -lmylibm" }), { t: "tf", q: "`atanh(±1)` returns ±inf and raises FE_DIVBYZERO.", a: true, why: "Pole: ½ log(0)." }] }] });
CRAFT.units.push({ id: "u28", n: 28, track: "scratch", tone: "f7", title: "erf, erfc, tgamma, lgamma and Bessel", blurb: "The error function, the gamma function with signgam, and the cylindrical Bessel functions j0, j1, jn, y0, y1, yn — plus the legacy gamma alias.", lessons: [{ id: "u28l1", title: "erf, erfc, tgamma and lgamma", ref: R7, items: [{ t: "learn", h: "Rational approximations and Lanczos", body: "**erf / erfc.** For |x| small a Taylor/minimax for erf; for larger x use erfc’s continued fraction or a rational approximation in exp(−x²), then erf = 1 − erfc (with care so erfc(large) underflows gracefully). `erf(±inf)=±1`, `erfc(+inf)=+0`. Max ULP: erf 1.624, erfc 3.306.\n\n**tgamma.** On [1, 2] a minimax; elsewhere use recurrence Γ(x+1)=xΓ(x), reflection for negatives, and Lanczos for large positive x. Poles at 0, −1, −2, … → ±inf or NaN. Overflow past ≈ 171.62.\n\n**lgamma / lgamma_r.** log|Γ(x)| with the sign of Γ(x) written to `signgam` (or the `*sign` argument of `lgamma_r`). Near the poles the value is huge and ULP error grows — measured max 343 ULP vs reference right next to a pole, matching glibc within a few ULPs of our own error. Legacy `gamma` is an alias of `lgamma` in glibc (not of tgamma!).", viz: EX("#include \"mylibm.h\"\nint main(void)\n{\n    printf(\"%.17g\\n\", my_erf(0.0));\n    printf(\"%.17g\\n\", my_erfc(0.0));\n    printf(\"%.17g\\n\", my_tgamma(5.0));   /* 4! = 24 */\n    printf(\"%.17g sign=%d\\n\", my_lgamma(-0.5), my_signgam);\n    printf(\"%.17g\\n\", my_tgamma(0.5));   /* √π */\n    return 0;\n}", "0\n1\n24\n1.2655121234846454 sign=0\n1.7724538509055161", "erf0=0, erfc0=1, 24, lgamma(−½) with sign, √π.", "-I/workspace/lern2math-h/scratch/lib -L/workspace/lern2math-h/scratch/lib -Wl,-rpath,/workspace/lern2math-h/scratch/lib -lmylibm") }, { t: "learn", h: "Walk-through: tgamma(5)", body: "Γ(5) = 4! = 24.\n\n1. 5 is outside [1,2], so divide: Γ(5)=4·Γ(4)=4·3·Γ(3)=4·3·2·Γ(2)=4·3·2·1·Γ(1).\n2. Γ on [1,2] is the minimax polynomial → Γ(1)=1.\n3. Product 24 exactly.\n\nFor Γ(0.5)=√π the reflection or a dedicated half-integer path is used; our code hits the Lanczos / minimax combination and lands within 1 ULP of the rounded √π.", viz: code("/* erf, erfc, lgamma (+ lgamma_r, signgam), tgamma */\n#include \"internal.h\"\n#include \"tables.h\"\n\nint my_signgam;\n\nstatic double horner(const double *c, int n, double t) { double p = c[n - 1]; for (int i = n - 2; i >= 0; i--) p = c[i] + t * p; return p; }\n#define H(tab, t) horner(tab, (int)(sizeof tab / sizeof tab[0]), (t) - tab##_C)\n\n/* erfc(a) for a >= 1/4: erfc(a) = e^(-a^2) * h(a) / a, h fitted piecewise (in a, then in v = 1/a) */\nstatic double erfc_pos(double a)\n{\n    double h;\n    if (a < 0.75) h = H(ERFC_H0, a);\n    else if (a < 1.5) h = H(ERFC_H1, a);\n    else if (a < 2.5) h = H(ERFC_H2, a);\n    else if (a < 4) h = H(ERFC_H3, a);\n    else { double v = 1 / a; if (a < 7) h = H(ERFC_V0, v); else if (a < 12) h = H(ERFC_V1, v); else h = H(ERFC_V2, v); }\n    double s = a * a, sl = my_fma(a, a, -s);                       /* a^2 = s + sl exactly */\n    double q = h / a;\n    if (a < 26) return __my_exp_dd(-s, -sl, 0) * q;\n    double L = my_log(q), hi, e;                                   /* fold h/a into the exponent so a subnormal result rounds once */\n    two_sum(-s, L, &hi, &e);\n    return __my_exp_dd(hi, e - sl, 0);\n}\ndouble my_erf(double x)\n{\n    if (x != x) return x + x;\n    double ax = my_fabs(x), r;\n    if (ax == __builtin_inf()) return my_copysign(1.0, x);\n    if (ax < 0x1p-28) {\n        if (x == 0) return x;\n        return (x * 0x1p100 * TWO_OVER_SQRTPI) * 0x1p-100;\n    }\n    if (ax < 0.5) return x * horner(ERF_P, 11, x * x);\n    if (ax < 6) r = 1 - erfc_pos(ax);\n    else r = 1 - 0x1p-100;\n    return my_signbit(x) ? -r : r;\n}\ndouble my_erfc(double x)\n/* … */", "special.c: erf, erfc, tgamma, lgamma.", "c") }, { t: "mcq", q: "In glibc, what is `gamma(x)`?", opts: ["An alias of lgamma (log-gamma), not tgamma", "An alias of tgamma", "A deprecated Bessel function", "Undefined"], a: 0, hint: "Check the man page note about signgam.", why: "Historical quirk: gamma meant log-gamma long before tgamma existed." }, P("What does `my_tgamma(6.0)` return?", "#include \"mylibm.h\"\nint main(void){printf(\"%g\\n\", my_tgamma(6.0));return 0;}", "120", ["6", "24", "1"], "5! = 120.", { hint: "Γ(n+1) = n!.", flags: "-I/workspace/lern2math-h/scratch/lib -L/workspace/lern2math-h/scratch/lib -Wl,-rpath,/workspace/lern2math-h/scratch/lib -lmylibm" }), { t: "tf", q: "`lgamma` stores the sign of Γ(x) in the global `signgam`.", a: true, why: "Or use lgamma_r to pass an explicit int*." }] }, { id: "u28l2", title: "Bessel j0, j1, jn, y0, y1, yn", ref: R7, items: [{ t: "learn", h: "Series, asymptotics and recurrence", body: "For small |x| a power series; for large |x| an asymptotic expansion in sin/cos; for intermediate x the Miller recurrence or continued fractions. `jn(n,x)` / `yn(n,x)` use upward/downward recurrence from j0/j1 or y0/y1.\n\nThese are the hardest functions in the file to get right near their many zeros — ULP error can reach thousands next to a root where the value itself is tiny. Our tests report the worst case honestly (jn up to ~2791 ULP vs a long-double reference on awkward samples) and still match glibc’s own rounding closely on most of the range. Float wrappers stay ≤ 0.5 ULP of the double kernel.\n\nCode: `bessel.c`.", viz: EX("#include \"mylibm.h\"\nint main(void)\n{\n    printf(\"%.17g\\n\", my_j0(0.0));\n    printf(\"%.17g\\n\", my_j1(0.0));\n    printf(\"%.17g\\n\", my_jn(2, 0.0));\n    printf(\"%g\\n\", my_y0(0.0));   /* -inf */\n    return 0;\n}", "1\n0\n0\n-inf", "j0(0)=1, j1(0)=0, j2(0)=0; y0(0)=−inf.", "-I/workspace/lern2math-h/scratch/lib -L/workspace/lern2math-h/scratch/lib -Wl,-rpath,/workspace/lern2math-h/scratch/lib -lmylibm") }, { t: "mcq", q: "Why are Bessel ULP errors large near zeros?", opts: ["The absolute error is tiny but dividing by a tiny true value makes the relative / ULP error blow up", "The series diverges everywhere", "glibc is wrong", "Integer overflow"], a: 0, hint: "What is 1 ULP of a number near 1e-20?", why: "ULP distance stays modest in absolute terms; near a root any absolute error looks huge in ULP of the result." }, { t: "tf", q: "`y0`, `y1`, `yn` have a pole at 0 and return −inf for x→0⁺.", a: true, why: "Neumann functions diverge at the origin." }, { t: "match", q: "Match each Bessel.", pairs: [["j0(0)", "1"], ["j1(0)", "0 (odd)"], ["y0(0)", "−inf"], ["jn(5,0)", "0 for n>0"]], why: "Regular (J) vs irregular (Y) behaviour at zero." }] }] });
CRAFT.units.push({ id: "u29", n: 29, track: "scratch", tone: "f7", title: "Float, long double, macros, constants and errno", blurb: "Every f and l variant, the _Generic classification macros, float_t / double_t, HUGE_VAL / M_PI / FP_* / math_errhandling, and raising errno plus the floating-point exceptions.", lessons: [{ id: "u29l1", title: "The f and l variants and generic.inc", ref: R7, items: [{ t: "learn", h: "One kernel, three widths", body: "Our layout (same idea as musl and modern glibc):\n\n1. **Double kernels** in exp.c, log.c, trig.c, … do the real work.\n2. **`wrap.c`** builds `foo`f by casting to double, calling the kernel, casting back, and translating overflow/underflow into ERANGE for the float range.\n3. **`wrapl.inc` / long double** on x86-64 either uses an 80-bit specialised path (bits, rounding, frexp, fma, sqrt) or evaluates the double kernel and widens — with an honest design note that transcendental long doubles then inherit double’s accuracy (err-ref reported as −1 = “vs double, not a true 64-bit ULP”). True 64-bit transcendental accuracy would redo every polynomial at 64 bits; the structure is there in `generic.inc` (compiled once per type).\n\n`generic.inc` is included three times with different `T` / suffix macros to generate float, double and long double versions of the classification, comparison, and several numeric helpers from one source.", viz: EX("#include \"mylibm.h\"\nint main(void)\n{\n    printf(\"%.9g\\n\", my_expf(1.0f));\n    printf(\"%.17Lg\\n\", my_fabsl(-0.0L));\n    printf(\"float_t size %zu double_t %zu\\n\", sizeof(my_float_t), sizeof(my_double_t));\n    printf(\"math_errhandling=%d\\n\", my_math_errhandling);\n    return 0;\n}", "2.71828175\n0\nfloat_t size 4 double_t 8\nmath_errhandling=3", "expf(1), fabsl(−0)=+0, evaluation types, MATH_ERRNO|MATH_ERREXCEPT.", "-I/workspace/lern2math-h/scratch/lib -L/workspace/lern2math-h/scratch/lib -Wl,-rpath,/workspace/lern2math-h/scratch/lib -lmylibm") }, { t: "mcq", q: "What does our float wrapper do when the double kernel returns a value too big for float?", opts: ["Cast to float (→ inf) and set errno ERANGE", "Return the double unchanged", "Raise SIGFPE", "Truncate toward zero without errno"], a: 0, hint: "Look at wrap.c’s isinf check.", why: "Matches glibc: overflow of the float result is ERANGE." }, { t: "tf", q: "`generic.inc` is compiled once for float, once for double, once for long double.", a: true, why: "Macro-suffix generation keeps the three widths in sync." }, { t: "learn", h: "The public header", body: "`mylibm.h` declares the types, the constants, the `_Generic` macros and (via `mylibm_decl.h`) every prototype. Drop the `my_` prefix to make it a drop-in `<math.h>`.", viz: code("/* mylibm.h: a from-scratch <math.h>. Every name carries a my_ prefix so it can be linked\n   and tested side by side with the system libm; drop the prefix to make it a drop-in header. */\n#ifndef MYLIBM_H\n#define MYLIBM_H\n#include <stdint.h>\n\n/* ---- types ---- */\n#if defined(__FLT_EVAL_METHOD__) && __FLT_EVAL_METHOD__ == 2\ntypedef long double my_float_t; typedef long double my_double_t;\n#elif defined(__FLT_EVAL_METHOD__) && __FLT_EVAL_METHOD__ == 1\ntypedef double my_float_t; typedef double my_double_t;\n#else\ntypedef float my_float_t; typedef double my_double_t;   /* FLT_EVAL_METHOD 0: x86-64 SSE, ARM VFP */\n#endif\n\n/* ---- constants ---- */\n#define MY_HUGE_VAL   (__builtin_huge_val())\n#define MY_HUGE_VALF  (__builtin_huge_valf())\n#define MY_HUGE_VALL  (__builtin_huge_vall())\n#define MY_INFINITY   (__builtin_inff())\n#define MY_NAN        (__builtin_nanf(\"\"))\n#define MY_SNAN       (__builtin_nansf(\"\"))   /* C23 FLT_SNAN-style signalling NaN */\n#define MY_FP_NAN       0\n#define MY_FP_INFINITE  1\n#define MY_FP_ZERO      2\n#define MY_FP_SUBNORMAL 3\n#define MY_FP_NORMAL    4\n#define MY_FP_ILOGB0   (-2147483647 - 1)\n#define MY_FP_ILOGBNAN (-2147483647 - 1)\n#define MY_FP_LLOGB0   (-9223372036854775807L - 1)\n#define MY_FP_LLOGBNA
