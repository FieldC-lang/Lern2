N (-9223372036854775807L - 1)\n#define MY_MATH_ERRNO     1\n#define MY_MATH_ERREXCEPT 2\n#define my_math_errhandling (MY_MATH_ERRNO | MY_MATH_ERREXCEPT)\n#ifdef __FP_FAST_FMA\n#define MY_FP_FAST_FMA 1\n#endif\n/* C23 rounding directions for fromfp and friends (glibc's values) */\n#define MY_FP_INT_UPWARD 0\n#define MY_FP_INT_DOWNWARD 1\n#define MY_FP_INT_TOWARDZERO 2\n#define MY_FP_INT_TONEARESTFROMZERO 3\n#define MY_FP_INT_TONEAREST 4\n/* POSIX / C23 constants */\n#define MY_M_E        2.718281828459045235360287471352662498\n#define MY_M_LOG2E    1.442695040888963407359924681001892137\n#define MY_M_LOG10E   0.434294481903251827651128918916605082\n#define MY_M_LN2      0.693147180559945309417232121458176568\n#define MY_M_LN10     2.302585092994045684017991454684364208\n#define MY_M_PI       3.141592653589793238462643383279502884\n#define MY_M_PI_2     1.570796326794896619231321691639751442\n#define MY_M_PI_4     0.785398163397448309615660845819875721\n#define MY_M_1_PI     0.318309886183790671537767526745028724\n#define MY_M_2_PI     0.636619772367581343075535053490057448\n#define MY_M_2_SQRTPI 1.128379167095512573896158903121545172\n/* … */", "mylibm.h: types, constants, _Generic macros, then the generated prototypes.", "c") }] }, { id: "u29l2", title: "Constants, macros, errno and exceptions", ref: R7, items: [{ t: "learn", h: "Everything else the header declares", body: "**Constants:** `HUGE_VAL` / `F` / `L`, `INFINITY`, `NAN`, `FP_NAN`…`FP_NORMAL`, `FP_ILOGB0`, `FP_ILOGBNAN`, `FP_LLOGB0`, `FP_LLOGBNAN`, `FP_FAST_FMA` (if the hardware has it), `MATH_ERRNO`, `MATH_ERREXCEPT`, `math_errhandling`, and the POSIX `M_E`, `M_PI`, … family. C23 adds `FP_INT_*` for fromfp and signalling-NaN helpers.\n\n**Type-generic macros:** `fpclassify`, `isnan`, `isinf`, `isfinite`, `isnormal`, `signbit`, `issubnormal`, `iszero`, `issignaling`, `iscanonical`, and the six quiet comparisons plus `iseqsig` — all via `_Generic` picking the typed `my_*` function.\n\n**errno / exceptions.** Each kernel calls helpers `raise_overflow`, `raise_underflow`, `raise_invalid`, `raise_divzero` that set the flag and, when glibc would, errno. Tests compare **value bits + errno + flags** on 95 904 special cases per type.", viz: EX("#include \"mylibm.h\"\nint main(void)\n{\n    printf(\"%g %g\\n\", (double)MY_HUGE_VAL, (double)MY_INFINITY);\n    printf(\"M_PI=%.17g\\n\", MY_M_PI);\n    printf(\"isnan(NAN)=%d isgreater(1,NAN)=%d\\n\", my_isnan(MY_NAN), my_isgreater(1.0, MY_NAN));\n    printf(\"FP_ILOGB0=%d\\n\", MY_FP_ILOGB0);\n    return 0;\n}", "inf inf\nM_PI=3.1415926535897931\nisnan(NAN)=1 isgreater(1,NAN)=0\nFP_ILOGB0=-2147483648", "Constants and quiet macros from mylibm.h.", "-I/workspace/lern2math-h/scratch/lib -L/workspace/lern2math-h/scratch/lib -Wl,-rpath,/workspace/lern2math-h/scratch/lib -lmylibm") }, { t: "match", q: "Match each constant.", pairs: [["HUGE_VAL", "+inf on IEEE platforms"], ["FP_ILOGB0", "ilogb(0) sentinel"], ["math_errhandling", "MATH_ERRNO | MATH_ERREXCEPT (=3) in glibc"], ["M_PI", "POSIX π"]], why: "These are part of the public header, not private helpers." }, { t: "tf", q: "`isnan(x)` must never raise FE_INVALID, even for a signalling NaN.", a: true, why: "Classification macros are quiet; that is why they are bit tests." }, { t: "fill", q: "Complete the _Generic dispatch used for unary classification.", text: "#define MY_TG(fn, x) _Generic((x), float: fn##f, long double: fn##l, default: fn)(x)\n#define my_isnan(x) MY_TG(___, x)", blanks: ["my_isnan"], extra: ["isnan", "my_isnanl", "fpclassify"], hint: "What prefix do all our functions use?", why: "The typed functions are my_isnan / my_isnanf / my_isnanl; the macro picks one." }] }] });
CRAFT.units.push({ id: "u30", n: 30, track: "scratch", tone: "f7", title: "Measure it: ULP tables, musl/fdlibm and the capstone", blurb: "How the 402-function test works, the measured ULP table against glibc and a higher-precision reference, how musl and fdlibm organise the same problem, and a capstone that drops my_ prefixes into a real program.", lessons: [{ id: "u30l1", title: "The test harness and the ULP table", ref: R7, items: [{ t: "learn", h: "Value, errno, flags — then ULPs on randoms", body: "`test_main.c` (generated list in `test_fns.inc`) for each of the 402 functions:\n\n1. **Special battery** — zeros, ±inf, NaNs, subnormals, domain edges — comparing the bit pattern, `errno`, and `fetestexcept` against glibc.\n2. **Random battery** — 20 000–80 000 draws per function in several ranges, reporting max ULP distance to glibc and to a long-double / `__float128` reference.\n3. **`test_misc.c`** — macros, constants, `nan` payloads, `signgam`, `totalorder`.\n4. **`test_c23.c`** — rsqrt, pown, powr, rootn, compoundn vs `__float128` (200 000 samples).\n\nResults on this machine (glibc 2.41, x86-64): **0 failures** on specials and misc (196 checks); C23 64/64; float wrappers ≤ 0.5 ULP of the double kernel. Long-double transcendentals that go through the double kernel report err-ref = −1 (not a 64-bit claim).", viz: term("function          max ULP vs ref   |ours−glibc|\n----------------  ---------------  ----------\nfabs/ceil/…bits   0 (exact)        0\nfma / sqrt        ≤ 0.500          0\ncbrt              0.500            ≤ 3\nhypot             0.500            ≤ 1\nexp / exp2 / exp10 0.67 / 0.61 / 0.63  ≤ 1\nexpm1 / exp2m1    1.47 / 1.34      ≤ 2\nlog / log2 / log10 0.500           ≤ 2\nlog1p / log2p1    0.50 / 0.62      ≤ 2\npow               0.518            ≤ 1\nsin / cos / tan   0.72 / 0.71 / 2.09  ≤ 2\nsinpi / cospi / tanpi 0.85 / 0.73 / 1.87 ≤ 3\nasin / acos / atan 0.60 / 0.59 / 0.75 ≤ 1\natan2             1.210            ≤ 1\nsinh / cosh / tanh 1.68 / 1.00 / 2.21 ≤ 3\nasinh / acosh / atanh 1.32 / 1.47 / 1.31 ≤ 1\nerf / erfc        1.62 / 3.31      ≤ 4\ntgamma            2.533            ≤ 6\nlgamma            343 (near poles) ≤ 344\nj0 / j1 / y0 / y1 62 / 68 / 94 / 176  up to ~1e3\njn / yn           large near zeros up to ~1e4\nrsqrt / pown / …   ≤ 0.526          (vs __float128)\nfloat wrappers    ≤ 0.500          (double kernel)\n", "Measured max ULP vs a higher-precision reference, and max distance from glibc, on the random suites.") }, { t: "learn", h: "Walk-through: reading one line of the report", body: "`exp  DBL  n=60000  dist-glibc=1 ulp  err-ref=0.670 ulp  nan-inf-mismatch=0`\n\n- 60 000 randoms.\n- We never disagreed with glibc by more than 1 ULP.\n- Against the long-double reference our worst error was 0.670 ULP (so we are not always correctly rounded, but well inside a tight budget).\n- No case where one side returned NaN/inf and the other did not.\n\nWhen err-ref climbs (Bessel near zeros, lgamma near poles) the report still shows nan-inf-mismatch = 0: signs, poles and specials match even if the last bits differ.", viz: code("/* test_misc.c: the parts of <math.h> that are not y = f(x): constants, macros, types, nan(),\n   payload functions, canonicalize, lgamma_r and signgam. Each is compared against glibc. */\n#define _GNU_SOURCE\n#define __STDC_WANT_IEC_60559_FUNCS_EXT__ 1\n#define __STDC_WANT_IEC_60559_BFP_EXT__ 1\n#include <math.h>\n#include <stdio.h>\n#include <string.h>\n#include <stdint.h>\n#include <stdlib.h>\n#include \"mylibm.h\"\nstatic int fails, checks;\n#define CHK(c, ...) do { checks++; if (!(c)) { fails++; printf(\"FAIL: \" __VA_ARGS__); printf(\"\\n\"); } } while (0)\n#define SAMEBITS(a, b) (memcmp(&(a), &(b), sizeof(a) == 16 ? 10 : sizeof(a)) == 0)\nint main(void)\n{\n    /* constants: bit-identical once rounded to double */\n    double c1[] = { MY_M_E, MY_M_LOG2E, MY_M_LOG10E, MY_M_LN2, MY_M_LN10, MY_M_PI, MY_M_PI_2, MY_M_PI_4, MY_M_1_PI, MY_M_2_PI, MY_M_2_SQRTPI, MY_M_SQRT2, MY_M_SQRT1_2 };\n    double c2[] = { M_E, M_LOG2E, M_LOG10E, M_LN2, M_LN10, M_PI, M_PI_2, M_PI_4, M_1_PI, M_2_PI, M_2_SQRTPI, M_SQRT2, M_SQRT1_2 };\n    for (int i = 0; i < 13; i++) CHK(c1[i] == c2[i], \"constant %d\", i);\n    CHK(MY_HUGE_VAL == HUGE_VAL && MY_HUGE_VALF == HUGE_VALF && MY_HUGE_VALL == HUGE_VALL, \"HUGE_VAL\");\n    { float a = MY_INFINITY, b = INFINITY; CHK(SAMEBITS(a, b), \"INFINITY\"); }\n    { float a = MY_NAN, b = NAN; CHK(SAMEBITS(a, b), \"NAN bits\"); }\n    { float a = MY_SNAN; CHK(issignaling(a), \"SNAN signals\"); }\n    CHK(MY_FP_NAN == FP_NAN && MY_FP_INFINITE == FP_INFINITE && MY_FP_ZERO == FP_ZERO && MY_FP_SUBNORMAL == FP_SUBNORMAL && MY_FP_NORMAL == FP_NORMAL, \"FP_ class values\");\n    CHK(MY_FP_ILOGB0 == FP_ILOGB0 && MY_FP_ILOGBNAN == FP_ILOGBNAN && MY_FP_LLOGB0 == FP_LLOGB0 && MY_FP_LLOGBNAN == FP_LLOGBNAN, \"FP_ILOGB values\");\n    CHK(MY_MATH_ERRNO == MATH_ERRNO && MY_MATH_ERREXCEPT == MATH_ERREXCEPT && my_math_errhandling == math_errhandling, \"math_errhandling\");\n    CHK(MY_FP_INT_UPWARD == FP_INT_UPWARD && MY_FP_INT_DOWNWARD == FP_INT_DOWNWARD && MY_FP_INT_TOWARDZERO == FP_INT_TOWARDZERO && MY_FP_INT_TONEARESTFROMZERO == FP_INT_TONEARESTFROMZERO && MY_FP_INT_TONEAREST == FP_INT_TONEAREST, \"FP_INT_ values\");\n    CHK(sizeof(my_float_t) == sizeof(float_t) && sizeof(my_double_t) == sizeof(double_t), \"float_t/double_t\");\n#if defined(FP_FAST_FMA) != defined(MY_FP_FAST_FMA)\n    CHK(0, \"FP_FAST_FMA\");\n#endif\n    /* nan(): the string becomes the payload, like strtod(\"NAN(...)\") */\n    const char *tags[] = { \"\", \"0\", \"1\", \"42\", \"0x7ff\", \"0x3ffff\", \"0777\", \"123456789012\", \"0xfffffffffffff\", \"junk\", \"12junk\", \"0x\" };\n    for (int i = 0; i < 12; i++) {\n/* … */", "test_misc.c: macros, constants, payloads, signgam.", "c") }, { t: "mcq", q: "What does `nan-inf-mismatch=0` tell you?", opts: ["Every time glibc returned NaN or inf, so did we, and vice versa", "There were no NaN inputs", "ULP error was zero", "errno always matched"], a: 0, hint: "Look at the name.", why: "Class of the result matches even when the payload or last bits differ." }, { t: "tf", q: "A max ULP of 0.500 against a higher-precision reference means correctly rounded (ties aside).", a: true, why: "0.5 ULP is the correctly-rounded bound." }, { t: "match", q: "Match each test binary.", pairs: [["test_main", "402 functions × specials × randoms"], ["test_misc", "macros, constants, nan, signgam"], ["test_c23", "rsqrt/pown/powr/rootn/compoundn vs __float128"]], why: "Three programs cover the header." }] }, { id: "u30l2", title: "musl, fdlibm and how glibc organises libm", ref: R7, items: [{ t: "learn", h: "Three styles of the same library", body: "- **fdlibm** (SunPro, 1990s): one file per function, bit tricks with `GET_HIGH_WORD` / `SET_HIGH_WORD`, soft-float friendly. Still the ancestor of many Android / Java Math paths.\n- **musl**: small, readable, often a double kernel + wrappers; happy to call `__math_invalid` helpers; less table-driven than ours for exp.\n- **glibc**: multi-layer — generic C, then IFUNC-selected x86-64 AVX / FMA kernels, with a published “known max ULP” table. Wrapper macros in `math.h` dispatch on `_FloatN` types in newer versions.\n\nOur structure sits between musl and glibc: shared kernels, explicit tables for exp/log/trig, integer fma/sqrt cores, and a single generated wrapper for the f and l names. The lesson for reading any of them: start at the special-case preamble, then find the argument reduction, then the polynomial." }, { t: "mcq", q: "Where do most libm bugs hide?", opts: ["The special-case preamble and the underflow/overflow thresholds", "The last term of the polynomial", "The copyright header", "The Makefile"], a: 0, hint: "Which part of the code runs on the fewest inputs but has the most branches?", why: "Signed zeros, quiet vs signalling NaNs, and the exact overflow cutoff are where implementations diverge." }, { t: "tf", q: "fdlibm’s bit-twiddling macros are still
