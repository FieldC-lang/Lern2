printf("%u %u\n", (a + b) / 2, (a & b) + ((a ^ b) >> 1));`, `1852516353 4000000001`, ['4000000001 4000000001', '1852516353 1852516353', '0 4000000001'], 'a + b = 8 000 000 002 wraps to 8 000 000 002 − 4 294 967 296 = 3 705 032 706; halved → 1 852 516 353. The identity never forms the full sum: 4 000 000 001.'),
    GM('meas'), GM('speedup')
  ]),
  lesson('u1l2', 'Dead code and the benchmark that measures nothing', REF.meas, [
    LS('Why results must be used', 'An optimising compiler deletes computation whose result is never observed. A benchmark that calls a pure function in a loop and throws the result away can compile to **an empty loop** — or no loop at all. The timing then reports a fraction of a nanosecond for work that takes a microsecond.\n\nThe fix is to make the result *observable* without adding cost:\n\n- `KEEP(x)`: an empty `asm volatile` that claims to read x. No instruction is emitted, but the compiler must produce x.\n- `CLOBBER()`: an empty asm with a memory clobber after each repetition, so results stored to memory must really be stored, and inputs must really be re-read.\n- Keep the routine `NOINLINE`, so its body cannot be hoisted out of the timing loop.\n\nA `volatile` sink variable also works but adds a real store each iteration.'),
    LS('Walk-through: the 4096-element sum of squares', 'The first row times a loop whose result is thrown away: 0.15 ns per “call” — that is the loop counter alone. The second row KEEPs the result and measures the real cost, about a microsecond for 4096 multiply-adds. Same function, a factor of several thousand.', BP('dce')),
    MC('Which is the cheapest way to stop the compiler deleting `f(x)` in a benchmark loop without adding a memory store?', ['An empty asm volatile that takes the value as an input', 'Declare the result volatile', 'Print it with printf every iteration', 'Compile with -O0'], 'The asm emits no instruction but forces the value to exist. A volatile store or printf adds real work; -O0 measures a different program.'),
    TF('Compiling a benchmark with -O0 to stop dead-code elimination gives meaningful timings.', false, '-O0 keeps every variable in memory and does no optimisation; you would be measuring code no one ships. Benchmark the build you deliver.'),
    OR('Order the steps of a trustworthy micro-benchmark.', ['Build with the shipping flags (-O2)', 'Warm up: run the kernel once', 'Time many repetitions with clock_gettime(CLOCK_MONOTONIC), consuming every result', 'Repeat the trial several times and keep the best', 'Compare against the naive version in the same process'], 'Same flags, warm caches, consumed results, repeated trials, back-to-back comparison.'),
    GM('meas')
  ]),
  lesson('u1l3', 'Find the hotspot: perf and Amdahl', REF.meas, [
    LS('Profilers', 'You cannot optimise what you have not located. On Linux:\n\n- `perf stat ./prog` counts cycles, instructions, branches, branch-misses, cache-misses. **IPC** (instructions per cycle) tells you whether the code is starved (≪ 1: waiting on memory or a long dependency chain) or busy (2–4 on modern cores).\n- `perf record -g ./prog` then `perf report` samples where time is spent, down to the instruction.\n- Without perf: wrap suspect regions in `now_ns()` and print the totals.\n\n**Amdahl’s law** then tells you what is worth doing: if a part takes fraction p of the time and you speed it up s×, the whole program speeds up 1 / ((1 − p) + p/s). A 10× win on 5% of the time is a 1.05× program.'),
    LS('Walk-through: same maths, different memory', 'A profiler shows 95% of a pricing tool in one loop summing prices along a linked list. The algorithm is already O(n); the problem is that each node is a separate allocation, so every step is a dependent cache miss. Storing the prices in an array turns the walk into a stream the hardware prefetches. The demo prints the same total for both; the table shows the cost per element.', BP('hotspot')),
    LS('Reading perf stat', 'A typical run of the linked-list version looks like the left column; the array version like the right (illustrative values, shape matters):\n\n| Counter | list | array |\n|---|---|---|\n| instructions per cycle | 0.1 | 2.5 |\n| L1-dcache-load-misses | ~1 per node | ~1 per 8 elements |\n| branch-misses | low | low |\n\nLow IPC with many cache misses says “memory-bound”: change the data layout, not the arithmetic.'),
    NU('A loop is 60% of run time. You make it 4× faster. What is the whole-program speed-up? (two decimals)', 1.82, 'Amdahl: 1 / (0.4 + 0.6/4) = 1 / 0.55 = 1.818… ≈ 1.82.', 'New time = 0.4 + 0.6/4 of the old time.', { tol: 0.01 }),
    GM('amdahl'), GM('meas')
  ]),
  lesson('u1l4', 'Numbers in three bases', REF.bits, [
    LS('Why bases matter for optimisation', 'Optimised C is full of constants that only make sense in hex or binary: masks like `0x55555555`, magic multipliers like `0xCCCCCCCD`, float bit patterns like `0x3F800000`. You need to convert quickly and confidently.\n\n**Decimal → hex (repeated division):** divide by 16, write down the remainder, repeat with the quotient; read the remainders bottom-up.\n\n**Hex → decimal (Horner):** start at 0; for each digit, multiply by 16 and add the digit. `0x2F3` → 0·16+2 = 2 → 2·16+15 = 47 → 47·16+3 = 755.\n\n**Hex ↔ binary:** each hex digit is exactly four bits. Memorise 8 = 1000, A = 1010, C = 1100, F = 1111 and the rest follow.\n\n**Signed (two’s complement):** the top bit is worth −2^(w−1). `0xF6` as int8_t is 246 − 256 = −10.', EX(C`unsigned v = 755;
printf("%X %o %u\n", v, v, 0x2F3u);
int8_t s = (int8_t)0xF6;
printf("%d\n", s);`, `2F3 1363 755
-10`)),
    LS('Walk-through: 1000 to hex and binary', '1000 ÷ 16 = 62 r **8**; 62 ÷ 16 = 3 r **14 (E)**; 3 ÷ 16 = 0 r **3** → `0x3E8`. In binary each digit becomes four bits: 3 = 0011, E = 1110, 8 = 1000 → `0011 1110 1000`. Check with place values: 512 + 256 + 128 + 64 + 32 + 8 = 1000.'),
    PN('What does this print?', C`printf("%u\n", 0x1F4u + 0b1010);`, 510, '0x1F4 = 1·256 + 15·16 + 4 = 500; 0b1010 = 10 (binary literals are a C23 feature and a long-standing GCC/Clang extension). 510.'),
    GM('dec2hex'), GM('hex2dec'), GM('bin2hex'), GM('signed8')
  ])
]);

unit('u2', 2, 'compiler', 'rs1', 'What the compiler already does', 'Read -O2 assembly so you only hand-optimise what the compiler cannot.', [
  lesson('u2l1', 'Reading -O2 assembly', REF.cc, [
    LS('Why read the asm', 'Before rewriting a line of C for speed, look at what the compiler made of it: `gcc -O2 -S -masm=intel f.c` or Compiler Explorer (godbolt.org). You only need a handful of x86-64 instructions to follow along:\n\n| Instruction | Meaning |\n|---|---|\n| `mov dst, src` | copy |\n| `lea dst, [a + b*k + c]` | address arithmetic used as a cheap add/multiply (k = 1, 2, 4, 8) |\n| `add / sub / imul` | arithmetic |\n| `shr / sar / shl` | logical right / arithmetic right / left shift |\n| `and / or / xor` | bitwise; `xor eax, eax` zeroes a register |\n| `cmp` + `jcc` / `cmovcc` | compare then jump / conditional move |\n| `div / idiv` | unsigned / signed divide — 20–90 cycles |\n\nArguments arrive in `edi`, `esi`, `edx`… (rdi, rsi, rdx for 64-bit); the result goes in `eax`/`rax`.'),
    LS('Walk-through: constants are already optimised', 'Six one-liners. In the asm below look for: `lea` for ×9; a single `shr` for unsigned ÷8; a shift **plus a fix-up** for signed ÷8 (C division truncates toward zero, an arithmetic shift floors); a single `and` for unsigned %16; and for ÷10 a multiply by `0xCCCCCCCD` and a shift — a magic reciprocal. None of these needs your help. The trap: replacing signed `x / 8` by `x >> 3` is **wrong** for negative x, as the demo prints.', BP('cexp')),
    LS('The asm', 'Read it top to bottom; every function ends in `ret`.', ASM('cexp')),
    LS('…and the same on 32-bit ARM', 'For comparison, gcc for ARMv7 (Cortex-A7): ×9 becomes a `mul` (Cortex-A7 multiplies in one or two cycles), signed ÷8 uses the same add-7-if-negative fix-up with a conditional `movge`, and ÷10 uses `umull` (the high half of a 32×32 product) with the same magic constant 0xCCCCCCCD built by `movw`/`movt`.', ASM('cexp', 'arm')),
    P('What does this print?', C`int x = -9;
printf("%d %d\n", x / 8, x >> 3);`, `-1 -2`, ['-1 -1', '-2 -2', '-2 -1'], 'C division truncates toward zero: −9/8 = −1.125 → −1. Arithmetic shift right floors: −9 >> 3 = −2 (implementation-defined, but that is what gcc and clang do).'),
    TF('For `uint32_t x`, writing `x >> 4` instead of `x / 16` makes gcc -O2 generate faster code.', false, 'They compile to the identical shr. Only for signed x do they differ — and then they compute different values.'),
    GM('ccdoes'), GM('shiftmul')
  ]),
  lesson('u2l2', 'Idiom recognition: loops that become instructions', REF.cc, [
    LS('Compilers know the classics', 'Modern compilers recognise common loop shapes and replace them wholesale:\n\n- **popcount loops** (Kernighan’s `x &= x - 1`) → a `popcnt` instruction (with `-mpopcnt`) or a short SWAR sequence\n- **sum of an arithmetic series** → a closed form (clang’s scalar-evolution pass)\n- **byte loop until 0** → a call to `strlen`; byte copy loop → `memcpy`; zeroing loop → `memset`\n- **rotate expressions** `(x << r) | (x >> (32 - r))` → `rol`\n\nThe lesson: write the clear version first, check the asm, and only then decide whether a manual trick adds anything.'),
    LS('Walk-through: three popcounts and a sum', 'The bit-by-bit loop runs 32 iterations. Kernighan’s loop is recognised and becomes the same code as the builtin — note the identical times. `sum_to(n)` shows the compilers disagreeing: clang computes n(n+1)/2 directly (0.5 ns), gcc 14 runs the loop (16.5 µs for n ≈ 65 000). Tables like this one are why you measure both compilers.', BP('idiom')),
    LS('The asm of sum_to', 'This is gcc’s output. Kernighan’s loop and the builtin compile to the same single `popcnt` (this build allows the POPCNT instruction). `sum_to` is still a loop (.L9) in gcc; clang’s version has no loop — it evaluates n(n+1)/2.', ASM('idiom')),
    MC('Which loop does gcc -O2 replace with a call to the C library?', ['`while (s[n]) n++;`', '`for (i = 0; i < n; i++) s += a[i] * a[i];`', '`while (x) { x >>= 1; c++; }`', '`for (i = 0; i < n; i++) if (a[i] > m) m = a[i];`'], 'The byte-until-zero loop is the strlen idiom; the others are left as loops (possibly vectorised).'),
    TF('Because compilers recognise idioms, the clearest code is often also the fastest.', true, 'Idiom recognition works on the plain form; “clever” hand-rolled variants are sometimes not recognised and end up slower.'),
    GM('ccdoes')
  ]),
  lesson('u2l3', 'Aliasing: why the compiler is cautious', REF.ub, [
    LS('The aliasing problem', 'If a function writes through one pointer and reads through another, the compiler must assume they **might point to the same memory** unless it can prove otherwise. Two rules decide what it may assume:\n\n1. **Strict aliasing (effective type, C17 §6.5 ¶7):** an object may only be accessed through an lvalue of a compatible type — or a character type. So an `int *` and a `float *` are assumed not to alias…\n2. …but **`char *` (and `unsigned char *`, `uint8_t *`) may alias anything.** A loop that reads bytes and writes an `int`/`size_t` through a pointer must reload and re-store on every iteration.\n\nThe fix costs nothing: accumulate in a **local variable** (its address is never taken, so nothing can alias it) and store once at the end.'),
    LS('Walk-through: counting newlines through a pointer', 'In `count_naive` every `*lines += …` may change bytes of `buf` as far as the compiler knows, so it loads and stores `*lines` every iteration. `count_local` keeps the count in a register. Look at the asm: the naive loop has a memory add each iteration; the local version is a tight register loop (clang also vectorises it). On this machine gcc’s store-forwarding hides most of the cost (0.29 → 0.26 ns/byte); the asm difference is what generalises.', BP('alias_sum')),
    LS('The asm', 'In the naive loop (.L3) gcc stores `mov QWORD PTR [rdx], rax` on every iteration — it cannot prove buf does not overlap *lines. The local version (.L10) stores once, after the loop.', ASM('alias_sum')),
    MC('Which pointer type may legally alias an object of any type?', ['`unsigned char *`', '`void *` dereferenced as int', '`uint32_t *`', '`float *`'], 'Character types are the exception in the effective-type rule; that is why byte loops are pessimised.'),
    TF('Copying `*out` into a local, working on the local, and storing it back at the end changes the program’s result.', false, 'Not unless out really points into the data being read — which is exactly the aliasing the compiler had to guard against. If that can happen, the local version is a different (usually intended) semantics.'),
    GM('ubarith')
  ]),
  lesson('u2l4', 'restrict, const and inline', REF.ub, [
    LS('restrict is a promise', '`T *restrict p` promises that, for the lifetime of p, the object it points to is accessed **only** through p (or pointers derived from it). With that promise the compiler can keep values in registers and vectorise without run-time overlap checks. Break the promise and the behaviour is undefined — so only use it where your API guarantees no overlap (`memcpy` is declared with restrict; `memmove` is not).\n\n**const** on a pointer target (`const float *x`) does *not* promise the data will not change — another pointer may modify it. It documents intent and catches mistakes, but gives the optimiser almost nothing.\n\n**inline** is a linkage hint, not an order. Compilers inline small static functions at -O2 by themselves; `static inline` in headers is the idiom. Use `__attribute__((always_inline))` / `noinline` only when measurement says so.'),
    LS('Walk-through: does restrict help here?', 'y = a·x + y. Without restrict gcc emits a run-time check “do x and y overlap?” and picks a vector or scalar path; with restrict it skips the check. On a 4096-element array the check costs a few instructions once per call, so the two measure the same — gcc 14 -O2 does not vectorise this loop at all, while clang -O2 vectorises **both** versions (0.066 ns/elem). Honest result: restrict matters when the compiler would otherwise give up (many pointers, or no versioning), not here.', BP('restrict_axpy')),
    MA('Match each qualifier to what it gives the optimiser.', [['restrict', 'a no-overlap promise it may rely on'], ['const T *', 'almost nothing: others may still write'], ['static', 'internal linkage, so all callers are visible'], ['inline', 'a hint; the compiler decides']], 'Only restrict (and static, by making the call graph visible) changes what the optimiser may assume.'),
    TF('Passing overlapping arrays to a function whose parameters are restrict-qualified is fine as long as the result looks right in your tests.', false, 'It is undefined behaviour; a different compiler version or flag can reorder loads and stores and break it.'),
    MC('Which standard function’s parameters are restrict-qualified?', ['memcpy', 'memmove', 'strlen', 'qsort'], 'memcpy’s source and destination must not overlap; memmove handles overlap.')
  ])
]);

unit('u3', 3, 'compiler', 'f3', 'C rules that decide speed', 'Undefined behaviour, integer promotions, overflow checks and type punning — the rules optimisers exploit.', [
  lesson('u3l1', 'Undefined behaviour is an optimisation contract', REF.ub, [
    LS('What UB means for speed', 'Undefined behaviour (UB) is any operation the standard gives no meaning. Compilers assume your program **never** performs it, and optimise on that assumption:\n\n| Operation | UB because | What the optimiser does with it |\n|---|---|---|\n| signed overflow `INT_MAX + 1` | §6.5 ¶5 | assumes `i + 1 > i`, widens loop counters to 64 bits |\n| shift by ≥ width, or negative | §6.5.7 | assumes the count is in range |\n| `1 << 31` for int | result not representable | — |\n| out-of-bounds access | §6.5.6 | assumes indices are in range |\n| accessing via the wrong type | §6.5 ¶7 | reorders loads and stores across types |\n| float → int out of range | §6.3.1.4 | x86 gives INT_MIN; ARM saturates |\n\nThis is why `for (int i = 0; i < n; i++) a[i]…` is fast: the compiler may treat `i` as a 64-bit pointer offset because it can never wrap. It is also why overflow checks written **after** the overflow are deleted.\n\n**Tools:** `-fsanitize=undefined` (UBSan) traps these at run time; `-fsanitize=address` (ASan) catches out-of-bounds and use-after-free. Every program in this course is fuzzed under both (ASan with gcc).', code(C`int will_overflow(int a) {
    return a + 1 < a;   /* gcc -O2: "return 0;" -- overflow is assumed impossible */
}`, 'a check that does not check')),
    LS('Walk-through: checked addition done right', 'Two correct ways to add untrusted 32-bit amounts: widen to 64 bits and compare against the limits, or C23’s `ckd_add` from `<stdckdint.h>` (GCC/Clang: `__builtin_add_overflow`), which compiles to an `add` and a jump on the overflow flag. The demo also checks a `calloc`-style size product with `ckd_mul`.', BP('ovf_check')),
    LS('Worked example', 'Read the code, predict the output, then compare with the real output below (compiled and run by gcc and clang).', EX(C`int r;
bool o1 = ckd_add(&r, INT_MAX, 1);
printf("%d\n", o1);
bool o2 = ckd_add(&r, 40, 2);
printf("%d %d\n", o2, r);
size_t z;
printf("%d\n", ckd_mul(&z, SIZE_MAX / 2, (size_t)3));`, `1
0 42
1`)),
    TF('`if (x + 1 < x)` is a reliable overflow test for `int x` at -O2.', false, 'Signed overflow is UB, so the compiler folds the condition to false. Use ckd_add, or compare `x == INT_MAX` before adding.'),
    GM('ubarith'), GM('ubshift')
  ]),
  lesson('u3l2', 'Shifts and rotates without UB', REF.ub, [
    LS('The shift rules', 'For `x << n` and `x >> n` (C17 §6.5.7):\n\n1. The operands are promoted first: a `uint8_t` becomes `int`.\n2. If n is negative or **≥ the width** of the promoted type, the behaviour is undefined. x86 masks the count to 5 or 6 bits; ARM uses 8 bits — `x << 32` gives x on one and 0 on the other.\n3. For signed `x << n`, the result must be representable — `1 << 31` is UB for a 32-bit int. Write `1u << 31`.\n4. Right-shifting a negative value is implementation-defined (arithmetic on gcc/clang).\n\nRotates are where rule 2 bites: the textbook `(x << r) | (x >> (32 - r))` shifts by 32 when r = 0.'),
    LS('Walk-through: a rotate that is always defined', '`(x << (r & 31)) | (x >> (-r & 31))`: for r = 0 both counts are 0 and the result is x | x = x. For every other r the counts are r and 32 − r. Both compilers recognise the masked form and emit **one** `rol`. Here gcc is clever enough to turn the branchy version into the same `rol` too (look at the asm) — but the masked form is the one that is guaranteed defined and branch-free on every compiler.', BP('rotate')),
    LS('The asm', '', ASM('rotate')),
    P('What does this print?', C`uint32_t x = 0x80000001u; unsigned r = 4;
printf("%08X\n", (x << (r & 31)) | (x >> (-r & 31)));`, `00000018`, ['00000010', '80000018', '08000000'], '0x80000001 rotated left by 4: the top bit 1 wraps to bit 3 (value 8) and bit 0 moves to bit 4 (value 0x10) → 0x18.'),
    GM('ubshift'), GM('ubshift')
  ]),
  lesson('u3l3', 'Integer promotions and narrow types', REF.ub, [
    LS('Everything narrower than int becomes int', 'Before any arithmetic, `char`, `short`, `uint8_t`, `uint16_t` and `bool` are **promoted to int** (§6.3.1.1). Then the **usual arithmetic conversions** bring both operands to a common type; when a signed and an unsigned type of the same rank meet, the signed one is converted to unsigned.\n\nConsequences for performance and correctness:\n\n- Narrow accumulators (`uint16_t s; s += b;`) compute in int and truncate back **every iteration** — sometimes extra instructions.\n- A narrow loop counter (`uint16_t i`) must wrap at 65 536, so the compiler cannot turn it into a pointer increment.\n- `uint16_t a * uint16_t b` is a **signed int** multiply and can overflow (UB) when the product exceeds INT_MAX.\n- `-1 < 1u` is false: −1 becomes UINT_MAX.\n\nRule of thumb: use full-width types (`uint32_t`, `size_t`) for arithmetic and indices; narrow types for storage.'),
    LS('Walk-through: a packet checksum', 'The demo prints the promotion surprises: uint8_t 200 + 100 is 300 (an int) until stored; 65535 × 65535 needs a cast; −1 < 1u is false. The bench compares a uint16_t accumulator and index with a uint32_t accumulator and size_t index. Here both compilers already generate equivalent code (and clang vectorises both) — the correctness rules matter more than speed on x86-64. On 32-bit ARM, narrow accumulators cost explicit `uxth` instructions.', BP('promo')),
    LS('Worked example', 'Read the code, predict the output, then compare with the real output below (compiled and run by gcc and clang).', EX(C`uint8_t a = 200, b = 100;
uint8_t t = (uint8_t)(a + b);
printf("%d %d\n", a + b, t);
uint16_t x = 65535, y = 65535;
printf("%u\n", (uint32_t)x * y);
printf("%d\n", -1 < 1u);`, `300 44
4294836225
0`)),
    P('What does this print?', C`uint8_t m = 0x0F;
printf("%d %d\n", ~m, (uint8_t)~m);`, `-16 240`, ['240 240', '-16 -16', '15 240'], 'm promotes to int 15; ~15 = −16. Cast back to uint8_t keeps the low 8 bits: 0xF0 = 240.'),
    GM('promo'), GM('promo')
  ]),
  lesson('u3l4', 'Type punning and float pitfalls', REF.ub, [
    LS('Reading a float’s bits the legal way', 'Many float tricks need the raw IEEE-754 bits. `*(uint32_t *)&f` violates the effective-type rule — gcc may reorder or drop the access. The defined ways:\n\n- `memcpy(&u, &f, sizeof u)` — compiles to a single register move at -O1+.\n- a `union { float f; uint32_t u; }` — allowed in C (not in C++).\n\nFloat pitfalls that matter for speed:\n\n| Pitfall | Effect |\n|---|---|\n| `x * 0.5` with float x | promotes to double and back (use `0.5f`; `-Wdouble-promotion`) |\n| `-ffast-math` | allows reassociation: vectorises sums but breaks Kahan, NaN/inf checks |\n| FMA contraction | `a*b + c` may be fused (one rounding) — clang does this by default; results differ in the last bit |\n| subnormals | 10–100× slower arithmetic on many cores |\n| `(int)` of an out-of-range float | UB |'),
    LS('Walk-through: exponent extraction', '`frexpf` is a library call that handles every case. For positive normal floats the exponent is simply bits 23–30 minus the bias 127. The demo checks five values; the fuzz compares both over millions of random positive normal floats.', BP('punning')),
    LS('Worked example', 'Read the code, predict the output, then compare with the real output below (compiled and run by gcc and clang).', EX(C`float f = 1.0f; uint32_t u;
memcpy(&u, &f, sizeof u);
printf("%08X %d\n", u, (int)((u >> 23) & 0xFF) - 127);
f = 0.1f; memcpy(&u, &f, sizeof u);
printf("%08X %d\n", u, (int)((u >> 23) & 0xFF) - 127);`, `3F800000 0
3DCCCCCD -4`)),
    TF('A `union { float f; uint32_t u; }` is a valid way to read float bits in C.', true, 'C (unlike C++) allows type punning through unions (C17 footnote 97). memcpy is the portable choice for both languages.'),
    GM('floatbits'), GM('floatpit')
  ])
]);
})();

/* ---- lern2optc/l02.js — strength reduction, bits, branchless ---- */
(function () {
const { REF, C, code, term, table, P, PN, EX, LS, MC, TF, MA, OR, FI, NU, unit, lesson, BP, ASM } = CG.H;
const GM = id => GEN.make(id);

unit('u4', 4, 'strength', 'op', 'Strength reduction and algebra', 'Replace expensive operations with cheap ones the compiler cannot find: run-time reciprocals, Horner, closed forms, monotonic tricks.', [
  lesson('u4l1', 'Divides by a run-time value', REF.alg, [
    LS('What -O2 does and does not do', 'Strength reduction replaces an expensive operation with a cheaper equivalent. The compiler already does the classic cases: `y*stride + x` inside a loop becomes a pointer that advances by stride; a divide by a **compile-time constant** becomes a multiply-high and shift.\n\nWhat it cannot do is divide by a value it only learns at run time — every `x / d` becomes a `div` instruction (≈ 20–40 cycles latency on this Xeon, throughput ≈ 6 cycles). If d is **loop-invariant**, you can do the compiler’s trick yourself:\n\n1. Once, compute m = ⌈2^32 / d⌉.\n2. Per element, q = (x · m) >> 32.\n\nThis is exact as long as the numerator is small enough relative to 2^32 (here, below 2^16 — the error term x·(m·d − 2^32)/2^32·d stays below 1/d). The fuzz checks every possible numerator. For all 32-bit numerators you need the full round-up method (lesson u4l4 and Lern2DivARM).'),
    LS('Walk-through: contrast stretch', 'out = in · 255 / maxv, with maxv the brightest pixel. The naive loop pays one divide per pixel; the fast loop pays one per image. Read the demo: the outputs agree exactly for every numerator 0..65 025.', BP('strength_idx')),
    NU('For d = 7, what is m = ⌈2^32 / 7⌉? (integer)', 613566757, '2^32 = 4 294 967 296; ÷7 = 613 566 756.57…; round up → 613 566 757.', 'Divide 4 294 967 296 by 7 and round up.'),
    TF('gcc -O2 replaces `x / d` with a multiply when d is a function parameter that happens to be constant at every call site.', false, 'Only if it inlines or clones the function and sees the constant. For a value read at run time it must emit div.'),
    GM('shiftmul'), GM('magic')

unit('u12', 12, 'simd', 'f7', 'SIMD in depth', 'Vector extensions, auto-vectorisation and what blocks it, SSE intrinsics, shuffles, data layout and run-time dispatch.', [

    LS('Walk-through: saturating brighten', 's = a + k wraps; it wrapped exactly where s < a, so `s | (s < a)` turns those lanes to 255. gcc -O2 does not vectorise the scalar loop (0.5 ns/pixel); the vector-extension version is 16 lanes at a time (0.032). clang vectorises the scalar loop itself (0.093) but the explicit version is still faster.', BP('vec_ext_add')),

    LS('Worked example', 'Read the code, predict the output, then compare with the real output below (compiled and run by gcc and clang).', EX(C`typedef int32_t i32x4 __attribute__((vector_size(16)));
i32x4 a = {1, 2, 3, 4}, b = {10, 20, 30, 40};

i32x4 m = a > 2;
printf("%d %d %d %d | %d %d %d %d\n", c[0], c[1], c[2], c[3], m[0], m[1], m[2], m[3]);`, `11 41 91 161 | 0 0 -1 -1`)),

  lesson('u12l2', 'Auto-vectorisation and what blocks it', REF.simd, [
    LS('When the compiler vectorises for you', 'The vectoriser needs: a countable loop, no loop-carried dependency it cannot reorder, no calls it cannot inline, provably non-overlapping pointers (or a run-time check), and a profitable cost model.\n\n| Blocker | Fix |\n|---|---|\n| float reduction (`s += a[i]*b[i]`) — reordering changes rounding | write partial sums yourself, or `-ffast-math` / `-fassociative-math` |\n| possible aliasing | `restrict`, locals |\n| calls (`lrintf`, `pow`) | branch-free arithmetic, inline formulas |\n| branches in the body | ternaries/min/max the compiler can turn into blends |\n| gcc 14 -O2 cost model is “very cheap” | `-O3`, or `-O2 -ftree-vectorize -fvect-cost-model=dynamic` |\n\nDiagnose with `gcc -O2 -fopt-info-vec-missed` or `clang -Rpass-missed=loop-vectorize`.'),

    LS('Writing the instructions directly', 'Intrinsics are C functions that map to single SIMD instructions: `<immintrin.h>` on x86, `<arm_neon.h>` on ARM. Naming on x86: `_mm_<op>_<type>` — `_mm_add_epi32` (4 × int32), `_mm_max_epu8`, `_mm_loadu_si128` (unaligned load). `_mm256_…` for AVX2.\n\nEnable an instruction set per function with `__attribute__((target("sse4.1")))` — but then you must check the CPU at run time (`__builtin_cpu_supports("sse4.1")`) before calling it. A horizontal reduction at the end folds lanes with shuffles.'),
