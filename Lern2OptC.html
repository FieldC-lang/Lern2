   return w;\n}\nstatic uint8_t WT[256];\nstatic void build_table(void) { for (int c = 0; c < 256; c++) WT[c] = (uint8_t)is_word_naive((unsigned char)c); }\nNOINLINE long words_fast(const unsigned char *s, long n) {\n    long w = 0; unsigned prev = 0;\n    for (long i = 0; i < n; i++) {\n        unsigned cur = WT[s[i]];\n        w += cur & ~prev;                /* 1 only at a 0 -> 1 transition */\n        prev = cur;\n    }\n    return w;\n}", "out": "5 5", "fuzz": {"gcc": [30000, 0, 0.0], "clang": [30000, 0, 0.0], "gcc-san": [20000, 0, 0.0], "clang-san": [20000, 0, 0.0]}, "bench": {"gcc": [["range tests (per byte)", 2.817], ["table + mask (per byte)", 0.334]], "clang": [["range tests (per byte)", 0.818], ["table + mask (per byte)", 0.231]]}}, "bsearch": {"show": "/* Look up IP ranges / timestamps in a sorted table (lower_bound:\n   first index with a[i] >= key). Naive: the textbook loop whose\n   branch is unpredictable on every step. Branchless: keep a base\n   pointer and a length that halves; the compare only selects how\n   far to move base (compilers emit CMOV), so the loop runs exactly\n   ceil(log2 n) times with no mispredictions. */\nNOINLINE long lb_naive(const uint32_t *a, long n, uint32_t key) {\n    long lo = 0, hi = n;\n    while (lo < hi) {\n        long mid = lo + (hi - lo) / 2;\n        if (a[mid] < key) lo = mid + 1; else hi = mid;\n    }\n    return lo;\n}\nNOINLINE long lb_branchless(const uint32_t *a, long n, uint32_t key) {\n    const uint32_t *base = a;\n    if (n == 0) return 0;\n    while (n > 1) {\n        long half = n / 2;\n        base = (base[half - 1] < key) ? base + half : base;   /* CMOV */\n        n -= half;\n    }\n    return (base - a) + (*base < key);\n}", "out": "0:0/0 4:1/1 8:3/3 12:4/4 16:4/4 ", "fuzz": {"gcc": [300000, 0, 0.0], "clang": [300000, 0, 0.0], "gcc-san": [20000, 0, 0.0], "clang-san": [20000, 0, 0.0]}, "bench": {"gcc": [["branchy, 64K table", 84.57], ["branchless, 64K table", 78.402]], "clang": [["branchy, 64K table", 82.372], ["branchless, 64K table", 78.626]]}}, "fx_conv": {"show": "/* Apply a volume gain to 16-bit PCM audio. Naive: convert every\n   sample to float, multiply, round, clamp, convert back. Fixed point:\n   represent the gain in Q15 (value = g / 32768) once, then each\n   sample is one integer multiply, a rounding add and a shift.\n   Gains are in [0, 1) here (attenuation), so no clamp is needed. */\nNOINLINE void gain_float(int16_t *s, long n, float g) {\n    for (long i = 0; i < n; i++) {\n        float v = roundf((float)s[i] * g);\n        if (v > 32767.f) v = 32767.f;\n        if (v < -32768.f) v = -32768.f;\n        s[i] = (int16_t)v;\n    }\n}\nstatic int16_t to_q15(float g) { return (int16_t)lrintf(g * 32768.0f); }  /* 0 <= g < 1 */\nNOINLINE void gain_q15(int16_t *s, long n, int16_t gq) {\n    for (long i = 0; i < n; i++)\n        s[i] = (int16_t)(((int32_t)s[i] * gq + (1 << 14)) >> 15);   /* round to nearest */\n}", "out": "Q15 gain 23170 = 0x5A82 = 0.707092\n707/707 -707/-707 23170/23169 -23170/-23170 ", "fuzz": {"gcc": [1920000, 0, 1.0], "clang": [1920000, 0, 1.0], "gcc-san": [1280000, 0, 1.0], "clang-san": [1280000, 0, 1.0]}, "bench": {"gcc": [["float convert+round (per smp)", 2.275], ["Q15 multiply (per smp)", 0.294]], "clang": [["float convert+round (per smp)", 2.123], ["Q15 multiply (per smp)", 0.306]]}}, "fx_mul": {"show": "/* Q16.16 fixed point: value = word / 65536, range about +-32768 with a\n   resolution of 1/65536. A product of two Q16.16 numbers has 32\n   fraction bits, so multiply in 64 bits and shift back by 16.\n   Pitfalls handled here:\n   - right shift of a negative product is implementation-defined;\n     gcc and clang shift arithmetically (floor), which we rely on\n   - rounding: add half an LSB (1 << 15) before shifting\n   - saturation: clamp to INT32_MIN..INT32_MAX instead of wrapping. */\ntypedef int32_t fx16;\n#define FX(x) ((fx16)lrint((x) * 65536.0))\nstatic double fx2d(fx16 a) { return a / 65536.0; }\nstatic fx16 fx_mul(fx16 a, fx16 b) {\n    int64_t p = (int64_t)a * b + (1 << 15);        /* round half up */\n    p >>= 16;                                      /* arithmetic on gcc/clang */\n    if (p > INT32_MAX) return INT32_MAX;\n    if (p < INT32_MIN) return INT32_MIN;\n    return (fx16)p;\n}\nstatic fx16 fx_add_sat(fx16 a, fx16 b) {\n    int32_t r;\n    if (__builtin_add_overflow(a, b, &r)) return a < 0 ? INT32_MIN : INT32_MAX;\n    return r;\n}\n/* the naive alternative: doubles everywhere */\nstatic double mul_d(double a, double b) { return a * b; }", "out": "00018000 FFFDC000 -> -3.375000\n6.283173 0.009995\n1", "fuzz": {"gcc": [3000225, 0, 0.5], "clang": [3000225, 0, 0.5], "gcc-san": [150225, 0, 0.5], "clang-san": [150225, 0, 0.5]}, "bench": {"gcc": [["double multiply", 0.5], ["Q16.16 mul+round+saturate", 0.625]], "clang": [["double multiply", 0.5], ["Q16.16 mul+round+saturate", 0.693]]}}, "fx_iir": {"show": "/* A one-pole low-pass filter smooths a noisy sensor (or audio):\n   y += a * (x - y). On a microcontroller with no FPU every float op is\n   a library call; even with an FPU the int->float->int conversions\n   cost. Fixed point: keep y in Q16 (16 extra fraction bits) so the\n   rounding error does not accumulate, a in Q16 too. Error vs the\n   double reference is measured in output LSBs. (clang's UBSan caught\n   the first draft here: it wrote (int64_t)x << 16, and left-shifting a\n   negative value is undefined behaviour in C17.) */\nNOINLINE void lpf_float(const int16_t *x, int16_t *y, long n, float a) {\n    float s = 0;\n    for (long i = 0; i < n; i++) { s += a * ((float)x[i] - s); y[i] = (int16_t)lrintf(s); }\n}\nNOINLINE void lpf_fixed(const int16_t *x, int16_t *y, long n, int32_t aq16) {\n    int64_t s = 0;                               /* state in Q16 */\n    for (long i = 0; i < n; i++) {\n        int64_t d = (int64_t)x[i] * 65536 - s;   /* NOT x << 16: UB if x < 0 */\n        s += (d * aq16) >> 16;\n        y[i] = (int16_t)((s + (1 << 15)) >> 16);\n    }\n}", "out": "250/250 438/438 578/578 684/684 763/763 822/822 867/867 900/900 ", "fuzz": {"gcc": [8000000, 0, 0.505784], "clang": [8000000, 0, 0.505784], "gcc-san": [8000000, 0, 0.505784], "clang-san": [8000000, 0, 0.505784]}, "bench": {"gcc": [["float filter (per smp)", 3.764], ["Q16 fixed filter (per smp)", 1.61]], "clang": [["float filter (per smp)", 3.777], ["Q16 fixed filter (per smp)", 1.558]]}}, "divconst": {"show": "/* Bucket timestamps: q = t / d for millions of t with the same d,\n   where d is read from a config file (so the compiler cannot use its\n   own constant-divisor trick). Precompute a \"magic\" reciprocal once\n   (round-up method, as in libdivide and Lern2DivARM): with\n   L = ceil(log2 d), m = floor(2^32 (2^L - d) / d) + 1, then\n   q = (t1 + ((t - t1) >> 1)) >> (L - 1), t1 = (m * t) >> 32.\n   Exact for every 32-bit t and d >= 2 (d == 1 handled separately). */\ntypedef struct { uint32_t m; int sh; int one; } udiv;\nstatic udiv udiv_make(uint32_t d) {\n    udiv r = {0, 0, d == 1};\n    if (d > 1) { int L = 32 - __builtin_clz(d - 1); r.m = (uint32_t)(((1ull << 32) * ((1ull << L) - d)) / d + 1); r.sh = L - 1; }\n    return r;\n}\nstatic inline uint32_t udiv_do(uint32_t t, udiv u) {\n    if (u.one) return t;\n    uint32_t t1 = (uint32_t)(((uint64_t)u.m * t) >> 32);\n    return (t1 + ((t - t1) >> 1)) >> u.sh;\n}\nNOINLINE void bucket_naive(const uint32_t *t, uint32_t *q, long n, uint32_t d) { for (long i = 0; i < n; i++) q[i] = t[i] / d; }\nNOINLINE void bucket_fast(const uint32_t *t, uint32_t *q, long n, uint32_t d) { udiv u = udiv_make(d); for (long i = 0; i < n; i++) q[i] = udiv_do(t[i], u); }", "out": "m=0x11111112 sh=5  59 60 71582788", "fuzz": {"gcc": [3000000, 0, 0.0], "clang": [3000000, 0, 0.0], "gcc-san": [150000, 0, 0.0], "clang-san": [150000, 0, 0.0]}, "bench": {"gcc": [["t / d (per elem)", 1.508], ["magic reciprocal (per elem)", 0.627]], "clang": [["t / d (per elem)", 1.503], ["magic reciprocal (per elem)", 0.69]]}}, "approx_sin": {"show": "/* A game or synth needs sin(x) for x in [-pi, pi] to ~1e-6, not to\n   the last bit. Two steps of maths:\n   1. Range reduction: sin(x) = sin(pi - x), so fold [-pi,pi] into\n      [-pi/2, pi/2] where the polynomial behaves well.\n   2. An odd polynomial x(c1 + c3 x^2 + c5 x^4 + ...) in Horner form on\n      x^2. The coefficients below are a least-squares/minimax-style fit\n      (better than raw Taylor 1, -1/6, 1/120..., which is exact at 0 but\n      worst at the ends). Max error is measured by the fuzz. */\nstatic float sin_fast(float x) {\n    const float pi = 3.14159265358979f, hp = 1.57079632679490f;\n    if (x > hp) x = pi - x;  else if (x < -hp) x = -pi - x;\n    float x2 = x * x;\n    return x * (0.99999999f + x2 * (-0.16666655f + x2 * (0.0083330251f + x2 * (-0.00019807418f + x2 * 2.6019031e-6f))));\n}", "out": "0.0: 0.0000000 0.0000000\n0.5: 0.4794255 0.4794255\n1.0: 0.8414710 0.8414710\n2.0: 0.9092974 0.9092975\n3.0: 0.1411200 0.1411201\n-1.5: -0.9974950 -0.9974951", "fuzz": {"gcc": [4000000, 0, 2.3112e-07], "clang": [4000000, 0, 2.3112e-07], "gcc-san": [200000, 0, 2.12032e-07], "clang-san": [200000, 0, 2.12032e-07]}, "bench": {"gcc": [["libm sinf", 3.009], ["reduced polynomial", 1.286]], "clang": [["libm sinf", 3.207], ["reduced polynomial", 3.23]]}}, "approx_exp": {"show": "/* Softmax / sigmoid / decay envelopes call expf millions of times.\n   exp(x) = 2^(x log2 e). Split y = x*log2(e) into integer n and\n   fraction f in [0,1): 2^n is free -- it is just the float exponent\n   field -- and 2^f is a short polynomial. Valid for |x| < 87.\n   log2 is the mirror image: exponent field + polynomial on the\n   mantissa in [1,2). */\nstatic float f_from_bits(uint32_t u) { float f; memcpy(&f, &u, 4); return f; }\nstatic uint32_t bits_from_f(float f) { uint32_t u; memcpy(&u, &f, 4); return u; }\nstatic float exp_fast(float x) {\n    float y = x * 1.44269504f;                 /* x * log2(e) */\n    int n = (int)y - (y < 0);                  /* floor, |y| < 126 */\n    float f = y - (float)n;                    /* f in [0,1) */\n    float p = 0.999999927f + f * (0.693152968f + f * (0.24015453f + f * (0.0558236045f + f * (0.00899258403f + f * 0.00187623295f))));\n    return p * f_from_bits((uint32_t)(n + 127) << 23);   /* times 2^n */\n}\nstatic float log2_fast(float x) {              /* x > 0, normal */\n    uint32_t u = bits_from_f(x);\n    float e = (float)((int)(u >> 23) - 127);\n    float m = f_from_bits((u & 0x007FFFFFu) | 0x3F800000u) - 1.0f;  /* [0,1) */\n    return e + (3.19697828e-07f + m * (1.44265211f + m * (-0.720386612f + m * (0.472499525f + m * (-0.323115935f + m * (0.190420831f + m * (-0.076848726f + m * 0.0147787208f)))))));\n}\n/* whole-array versions: no calls inside, so the compiler can vectorise */\nNOINLINE void exp_array_libm(const float *x, float *y, long n) { for (long i = 0; i < n; i++) y[i] = expf(x[i]); }\nNOINLINE void exp_array_fast(const float *x, float *y, long n) { for (long i = 0; i < n; i++) y[i] = exp_fast(x[i]); }", "out": "-5: 0.00673795 0.00673795\n-1: 0.367879 0.367879\n0: 1 1\n0.5: 1.64872 1.64872\n1: 2.71828 2.71828\n10: 22026.5 22026.5\nlog2: 0.000000 3.321928 3.321928", "fuzz": {"gcc": [4000000, 0, 3.84166e-06], "clang": [4000000, 0, 3.84166e-06], "gcc-san": [200000, 0, 3.80825e-06], "clang-san": [200000, 0, 3.80825e-06]}, "bench": {"gcc": [["libm expf, one call", 2.321], ["exp_fast, one call", 2.441], ["libm expf array (per elem)", 2.255], ["exp_fast array (per elem)", 2.174]], "clang": [["libm expf, one call", 2.309], ["exp_fast, one call", 2.284], ["libm expf array (per elem)", 2.254], ["exp_fast array (per elem)", 0.505]]}}, "invsqrt": {"show": "/* Normalising vectors needs 1/sqrt(x). The famous trick: the float\n   bit pattern is roughly a scaled log2(x), so a subtraction from a\n   magic constant halves and negates the logarithm, giving a ~3.4%\n   estimate; each Newton step y = y(1.5 - 0.5 x y^2) squares the\n   relative error. Written with memcpy (the original pointer cast is\n   undefined behaviour under strict aliasing). On modern x86,\n   1.0f / sqrtf(x) is often as fast (SQRTSS) -- measure! */\nstatic float rsqrt_fast(float x, int steps) {\n    uint32_t i; float y;\n    memcpy(&i, &x, 4);\n    i = 0x5F375A86u - (i >> 1);            /* Lomont's refined constant */\n    memcpy(&y, &i, 4);\n    for (int k = 0; k < steps; k++) y = y * (1.5f - 0.5f * x * y * y);\n    return y;\n}", "out": "1: 1.0000000 0.9983081 0.9999956\n2: 0.7071068 0.7069296 0.7071068\n4: 0.5000000 0.4991541 0.4999978\n100: 0.1000000 0.0998448 0.0999996", "fuzz": {"gcc": [4000000, 0, 0.00175127], "clang": [4000000, 0, 0.00175127], "gcc-san": [200000, 0, 0.00175126], "clang-san": [200000, 0, 0.00175126]}, "bench": {"gcc": [["1.0f / sqrtf(x)", 1.501], ["bit trick + 1 Newton step", 0.787]], "clang": [["1.0f / sqrtf(x)", 1.501], ["bit trick + 1 Newton step", 0.793]]}}, "isqrt": {"show": "/* Integer square root floor(sqrt(n)) for 64-bit n (distance checks,\n   prime sieves, perfect-square tests). Three ways:\n   naive:  increment r while (r+1)^2 <= n -- O(sqrt n), hopeless\n   bitwise: digit-by-digit (binary long-hand) -- 32 iterations\n   newton: start from the double sqrt, then FIX it: a double has 53\n           bits so (uint64_t)sqrt(n) can be off by one for n > 2^52.\n   Newton/Heron's x' = (x + n/x)/2 converges quadratically; here one\n   correction step from the double estimate is enough. */\nstatic uint64_t isqrt_bitwise(uint64_t n) {\n    uint64_t r = 0, bit = 1ull << 62;\n    while (bit > n) bit >>= 2;\n    while (bit) {\n        if (n >= r + bit) { n -= r + bit; r = (r >> 1) + bit; } else r >>= 1;\n        bit >>= 2;\n    }\n    return r;\n}\nstatic uint64_t isqrt_fast(uint64_t n) {\n    uint64_t r = (uint64_t)sqrt((double)n);\n    if (r > 0xFFFFFFFFu) r = 0xFFFFFFFFu;              /* sqrt rounded up to 2^32 */\n    while (r * r > n) r--;                              /* fix overshoot */\n    while ((r + 1) * (r + 1) <= n && r < 0xFFFFFFFFu) r++;  /* fix undershoot */\n    return r;\n}", "out": "0: 0 0\n1: 1 1\n15: 3 3\n16: 4 4\n17: 4 4\n1000000: 1000 1000\n18446744073709551615: 4294967295 4294967295\n4503599761588224: 67108864 67108864", "fuzz": {"gcc": [4000000, 0, 0.0], "clang": [4000000, 0, 0.0], "gcc-san": [200000, 0, 0.0], "clang-san": [200000, 0, 0.0]}, "bench": {"gcc": [["bitwise (32 iterations)", 91.562], ["double sqrt + fix-up", 1.829]], "clang": [["bitwise (32 iterations)", 28.179], ["double sqrt + fix-up", 2.66]]}}, "cordic": {"show": "/* CORDIC computes sin and cos with only shifts, adds and a small\n   table: rotate the vector (K, 0) by +-atan(2^-i) for i = 0..N-1,\n   choosing the sign that drives the remaining angle to zero. Each\n   rotation by atan(2^-i) is x' = x - (y >> i), y' = y + (x >> i).\n   This is how FPU-less chips (and old calculators) do trig. Q30\n   fixed point, angle in [-pi/2, pi/2]; error ~ N * 2^-30 from the\n   truncating shifts (about 2e-8 measured). On a CPU with an FPU,\n   libm wins easily -- CORDIC is for FPU-less and multiplier-less\n   hardware, where it replaces a software-float sin costing ~1000s of\n   cycles. */\n#define CN 30\nstatic int32_t ATAN[CN];                       /* atan(2^-i) in Q30 */\nstatic int32_t KQ;                             /* 1/gain in Q30 */\nstatic void cordic_init(void) {\n    double k = 1; for (int i = 0; i < CN; i++) { ATAN[i] = (int32_t)llround(atan(ldexp(1, -i)) * (1 << 30)); k *= 1 / sqrt(1 + ldexp(1, -2 * i)); }\n    KQ = (int32_t)llround(k * (1 << 30));\n}\nstatic void cordic_sincos(int32_t a, int32_t *s, int32_t *c) {   /* a in Q30 radians */\n    int32_t x = KQ, y = 0;\n    for (int i = 0; i < CN; i++) {\n        int32_t dx = y >> i, dy = x >> i;      /* arithmetic shift (gcc/clang) */\n        if (a >= 0) { x -= dx; y += dy; a -= ATAN[i]; }\n        else        { x += dx; y -= dy; a += ATAN[i]; }\n    }\n    *s = y; *c = x;\n}", "out": "0.00: sin 0.00000000 0.00000000 cos 1.00000000 1.00000000\n0.50: sin 0.47942554 0.47942554 cos 0.87758257 0.87758256\n1.00: sin 0.84147098 0.84147098 cos 0.54030231 0.54030231\n-1.20: sin -0.93203908 -0.93203909 cos 0.36235776 0.36235775", "fuzz": {"gcc": [2000000, 0, 1.81528e-08], "clang": [2000000, 0, 1.81528e-08], "gcc-san": [100000, 0, 1.57465e-08], "clang-san": [100000, 0, 1.57465e-08]}, "bench": {"gcc": [["libm sin + cos (double)", 9.225], ["CORDIC 30 iterations", 104.192]], "clang": [["libm sin + cos (double)", 9.506], ["CORDIC 30 iterations", 99.69]]}}, "lut": {"show": "/* Gamma-correct 8-bit pixels: out = 255 * (in/255)^(1/2.2).\n   The input has only 256 possible values, so the \"approximation\" can\n   be exact: tabulate all of them once (256 bytes, fits in L1).\n   For a continuous input (sin of a phase in [0,1)), a 1024-entry\n   table with linear interpolation gives ~5e-6 error. */\nstatic uint8_t gamma_naive(uint8_t v) { return (uint8_t)lrint(255.0 * pow(v / 255.0, 1 / 2.2)); }\nstatic uint8_t GT[256];\nstatic float ST[1025];\nstatic void tables(void) {\n    for (int i = 0; i < 256; i++) GT[i] = gamma_naive((uint8_t)i);\n    for (int i = 0; i <= 1024; i++) ST[i] = (float)sin(2 * 3.14159265358979323846 * i / 1024);\n}\nstatic float sin_lut(float phase) {          /* phase in [0,1) */\n    float p = phase * 1024; int i = (int)p; float f = p - (float)i;\n    return ST[i] + f * (ST[i + 1] - ST[i]);   /* linear interpolation */\n}", "out": "0 136 186 255\n0.587783 0.587785", "fuzz": {"gcc": [4000000, 0, 4.74786e-06], "clang": [4000000, 0, 4.74786e-06], "gcc-san": [200000, 0, 4.74786e-06], "clang-san": [200000, 0, 4.74786e-06]}, "bench": {"gcc": [["gamma via pow()", 12.371], ["gamma table lookup", 0.25], ["sinf(2 pi p)", 3.622], ["sin table + lerp", 1.073]], "clang": [["gamma via pow()", 12.626], ["gamma table lookup", 0.5], ["sinf(2 pi p)", 3.973], ["sin table + lerp", 0.914]]}}, "fastrange": {"show": "/* Pick a hash-table bucket: b = h % n, n not a power of two and only\n   known at run time. Lemire's \"fastrange\": b = (h * n) >> 32 maps\n   [0, 2^32) onto [0, n) just as evenly, with one multiply instead of\n   a divide. It is NOT equal to h % n -- it is a different, equally\n   fair mapping (it uses the HIGH bits of h, so h must be well mixed). */\nNOINLINE void bucket_mod(const uint32_t *h, uint32_t *b, long cnt, uint32_t n) { for (long i = 0; i < cnt; i++) b[i] = h[i] % n; }\nNOINLINE void bucket_fr(const uint32_t *h, uint32_t *b, long cnt, uint32_t n) { for (long i = 0; i < cnt; i++) b[i] = (uint32_t)(((uint64_t)h[i] * n) >> 32); }", "out": "fastrange n=1000: 0 500 999 0\nn=7 bucket sizes between 613566756 and 613566757", "fuzz": {"gcc": [4000000, 0, 0.0], "clang": [4000000, 0, 0.0], "gcc-san": [200000, 0, 0.0], "clang-san": [200000, 0, 0.0]}, "bench": {"gcc": [["h % n (per elem)", 1.51], ["fastrange (per elem)", 0.251]], "clang": [["h % n (per elem)", 1.511], ["fastrange (per elem)", 0.108]]}}, "modpow": {"show": "/* a^e mod m. Naive: multiply e times. Fast: square-and-multiply\n   (binary exponentiation), log2(e) squarings. m < 2^32 so every\n   product fits in 64 bits. */\nNOINLINE uint32_t powmod_naive(uint32_t a, uint32_t e, uint32_t m) {\n    uint64_t r = 1 % m; for (uint32_t i = 0; i < e; i++) r = r * a % m; return (uint32_t)r; }\nNOINLINE uint32_t powmod_fast(uint32_t a, uint32_t e, uint32_t m) {\n    uint64_t r = 1 % m, b = a % m;\n    while (e) { if (e & 1) r = r * b % m; b = b * b % m; e >>= 1; }\n    return (uint32_t)r; }", "out": "3^200 mod 1000003 = 333986\n2^(p-1) mod p, p=4294967291: 1 (Fermat)", "fuzz": {"gcc": [300000, 0, 0.0], "clang": [300000, 0, 0.0], "gcc-san": [20000, 0, 0.0], "clang-san": [20000, 0, 0.0]}, "bench": {"gcc": [["e multiplies (e=100000)", 530917.75], ["square-and-multiply", 63.933]], "clang": [["e multiplies (e=100000)", 451041.35], ["square-and-multiply", 59.949]]}}, "montgomery": {"show": "/* Modular multiply x*y mod n for odd n < 2^63, many times with the\n   same n (e.g. a primality test). Naive uses 128-bit % (a library\n   call, ~25-90 cycles). Montgomery keeps numbers as xR mod n with\n   R = 2^64; REDC then needs only multiplies and one subtract. */\ntypedef unsigned __int128 u128;\nNOINLINE uint64_t mulmod_naive(uint64_t a, uint64_t b, uint64_t n) { return (uint64_t)((u128)a * b % n); }\ntypedef struct { uint64_t n, ninv, r2; } mont;\nstatic mont mont_make(uint64_t n) {                 /* n odd */\n    mont m; m.n = n; uint64_t x = n;                /* Newton: x = n^-1 mod 2^64 */\n    for (int i = 0; i < 5; i++) x *= 2 - n * x;     /* bits correct: 3,6,12,24,48,96 */\n    m.ninv = -x;                                    /* -n^-1 */\n    m.r2 = (uint64_t)(((u128)1 << 64) % n); m.r2 = (uint64_t)((u128)m.r2 * m.r2 % n);\n    return m; }\nstatic inline uint64_t redc(u128 t, const mont *m) {      /* t < n*2^64 -> t/R mod n */\n    uint64_t u = (uint64_t)t * m->ninv;\n    u128 s = t + (u128)u * m->n;                    /* low 64 bits now zero; no overflow as n < 2^63 */\n    uint64_t r = (uint64_t)(s >> 64);\n    return r >= m->n ? r - m->n : r; }\nstatic inline uint64_t to_mont(uint64_t a, const mont *m) { return redc((u128)(a % m->n) * m->r2, m); }\nstatic inline uint64_t mont_mul(uint64_t a, uint64_t b, const mont *m) { return redc((u128)a * b, m); }\nstatic inline uint64_t from_mont(uint64_t a, const mont *m) { return redc(a, m); }\nNOINLINE uint64_t powmod_naive64(uint64_t a, uint64_t e, uint64_t n) { uint64_t r = 1 % n; a %= n; while (e) { if (e & 1) r = mulmod_naive(r, a, n); a = mulmod_naive(a, a, n); e >>= 1; } return r; }\nNOINLINE uint64_t powmod_mont(uint64_t a, uint64_t e, uint64_t n) { mont m = mont_make(n); uint64_t r = to_mont(1, &m), b = to_mont(a, &m); while (e) { if (e & 1) r = mont_mul(r, b, &m); b = mont_mul(b, b, &m); e >>= 1; } return from_mont(r, &m); }", "out": "2^(p-1) mod p = 1  (p = 2^63-25 prime)\nn*ninv = 18446744073709551615 (want 2^64-1)", "fuzz": {"gcc": [2000000, 0, 0.0], "clang": [2000000, 0, 0.0], "gcc-san": [100000, 0, 0.0], "clang-san": [100000, 0, 0.0]}, "bench": {"gcc": [["powmod, 128-bit % (63-bit e)", 477.93], ["powmod, Montgomery", 237.24]], "clang": [["powmod, 128-bit % (63-bit e)", 503.017], ["powmod, Montgomery", 272.962]]}}, "barrett": {"show": "/* Reduce many 64-bit values mod a 32-bit m (a checksum over a file).\n   Barrett: precompute mu = floor(2^64 / m); q = high64(x * mu) is the\n   quotient or one too small, so r = x - q*m needs at most one\n   correction. No division inside the loop. */\ntypedef unsigned __int128 u128;\nNOINLINE uint64_t summod_naive(const uint64_t *x, long n, uint32_t m) { uint64_t s = 0; for (long i = 0; i < n; i++) s = (s + x[i] % m) % m; return s; }\nstatic inline uint64_t barrett(uint64_t x, uint64_t m, uint64_t mu) {\n    uint64_t q = (uint64_t)(((u128)x * mu) >> 64);\n    uint64_t r = x - q * m;\n    return r >= m ? r - m : r; }\nNOINLINE uint64_t summod_fast(const uint64_t *x, long n, uint32_t m) { uint64_t mu = UINT64_MAX / m, s = 0; /* floor((2^64-1)/m): same as 2^64/m unless m is a power of 2; still at most one fix-up */\n    for (long i = 0; i < n; i++) { s += barrett(x[i], m, mu); if (s >= m) s -= m; } return s; }", "out": "537124 537124", "fuzz": {"gcc": [4000000, 0, 0.0], "clang": [4000000, 0, 0.0], "gcc-san": [200000, 0, 0.0], "clang-san": [200000, 0, 0.0]}, "bench": {"gcc": [["x % m (per elem)", 5.033], ["Barrett (per elem)", 0.947]], "clang": [["x % m (per elem)", 4.012], ["Barrett (per elem)", 4.4]]}}, "fwddiff": {"show": "/* Evaluate a cubic p(x) = a x^3 + b x^2 + c x + d at x = 0,1,2,...,n-1\n   (a sound envelope, a curve). Forward differences: after setup,\n   each new value is three ADDS. With integer coefficients the\n   results are exact (wrap-around mod 2^64 is consistent). */\nNOINLINE void cubic_naive(int64_t a, int64_t b, int64_t c, int64_t d, int64_t *y, long n) {\n    for (long i = 0; i < n; i++) { uint64_t x = (uint64_t)i; y[i] = (int64_t)((uint64_t)a * x * x * x + (uint64_t)b * x * x + (uint64_t)c * x + (uint64_t)d); } }\nNOINLINE void cubic_fd(int64_t a, int64_t b, int64_t c, int64_t d, int64_t *y, long n) {\n    uint64_t p = (uint64_t)d,                                   /* p(0) */\n             d1 = (uint64_t)a + (uint64_t)b + (uint64_t)c,      /* p(1)-p(0) */\n             d2 = 6 * (uint64_t)a + 2 * (uint64_t)b,            /* second difference at 0 */\n             d3 = 6 * (uint64_t)a;                              /* constant third difference */\n    for (long i = 0; i < n; i++) { y[i] = (int64_t)p; p += d1; d1 += d2; d2 += d3; } }", "out": "5 7 11 23 49 95 ", "fuzz": {"gcc": [20000, 0, 0.0], "clang": [20000, 0, 0.0], "gcc-san": [20000, 0, 0.0], "clang-san": [20000, 0, 0.0], "gcc-O3": [20000, 0, 0.0]}, "bench": {"gcc": [["naive cubic (per x)", 0.503], ["forward differences (per x)", 0.307]], "clang": [["naive cubic (per x)", 0.502], ["forward differences (per x)", 0.388]], "gcc-O3": [["naive cubic (per x)", 0.502], ["forward differences (per x)", 0.294]]}}, "bresenham": {"show": "/* Draw a line from (0,0) to (dx,dy), 0 <= dy <= dx: one y per x.\n   Naive: y = round(x * dy / dx) with a float multiply and round per\n   pixel. Bresenham: carry the rounding error as an integer and add. */\nNOINLINE void line_naive(int dx, int dy, int *y) { for (int x = 0; x <= dx; x++) y[x] = (int)floor((double)x * dy / dx + 0.5); }\nNOINLINE void line_bres(int dx, int dy, int *y) {\n    int err = 2 * dy - dx, yy = 0;               /* err = 2*dx*(exact - yy - 1/2) shifted */\n    for (int x = 0; x <= dx; x++) { y[x] = yy; if (err >= 0) { yy++; err -= 2 * dx; } err += 2 * dy; } }", "out": "00112223344", "fuzz": {"gcc": [300000, 0, 0.0], "clang": [300000, 0, 0.0], "gcc-san": [20000, 0, 0.0], "clang-san": [20000, 0, 0.0]}, "bench": {"gcc": [["float round (per pixel)", 2.121], ["Bresenham (per pixel)", 0.605]], "clang": [["float round (per pixel)", 2.012], ["Bresenham (per pixel)", 0.719]]}}, "prefix": {"show": "/* Answer many \"sum of a[l..r)\" queries (a dashboard of time ranges).\n   Naive loops each range. Prefix sums: P[i] = a[0]+...+a[i-1], then\n   any range is P[r] - P[l]: O(n) once, O(1) per query. */\nNOINLINE uint64_t queries_naive(const uint32_t *a, const int *l, const int *r, int q) { uint64_t t = 0; for (int k = 0; k < q; k++) { uint64_t s = 0; for (int i = l[k]; i < r[k]; i++) s += a[i]; t += s; } return t; }\nNOINLINE uint64_t queries_prefix(const uint32_t *a, int n, const int *l, const int *r, int q, uint64_t *P) {\n    P[0] = 0; for (int i = 0; i < n; i++) P[i + 1] = P[i] + a[i];\n    uint64_t t = 0; for (int k = 0; k < q; k++) t += P[r[k]] - P[l[k]]; return t; }", "out": "20 20", "fuzz": {"gcc": [3000, 0, 0.0], "clang": [3000, 0, 0.0], "gcc-san": [3000, 0, 0.0], "clang-san": [3000, 0, 0.0]}, "bench": {"gcc": [["2000 queries, loop each", 16985386.4], ["2000 queries, prefix sums", 29191.8]], "clang": [["2000 queries, loop each", 6926705.4], ["2000 queries, prefix sums", 26769.2]]}}, "welford": {"show": "/* Mean and variance of sensor readings. The \"textbook one-pass\"\n   formula var = (sum x^2 - n mean^2)/n is fast but cancels\n   catastrophically when the mean is large compared with the spread.\n   The two-pass version is accurate but reads the data twice.\n   Welford's update is one pass AND accurate. */\ntypedef struct { double mean, var; } stats;\nNOINLINE stats st_naive(const double *x, long n) { double s = 0, s2 = 0; for (long i = 0; i < n; i++) { s += x[i]; s2 += x[i] * x[i]; } double m = s / n; return (stats){m, s2 / n - m * m}; }\nNOINLINE stats st_twopass(const double *x, long n) { double s = 0; for (long i = 0; i < n; i++) s += x[i]; double m = s / n, v = 0; for (long i = 0; i < n; i++) v += (x[i] - m) * (x[i] - m); return (stats){m, v / n}; }\nNOINLINE stats st_welford(const double *x, long n) {\n    double m = 0, M2 = 0;\n    for (long i = 0; i < n; i++) { double d = x[i] - m; m += d / (double)(i + 1); M2 += d * (x[i] - m); }\n    return (stats){m, M2 / n}; }", "out": "naive -3456  two-pass 0.082795  welford 0.082795", "fuzz": {"gcc": [200000, 0, 2.51439e-05], "clang": [200000, 0, 2.51439e-05], "gcc-san": [20000, 0, 9.59494e-07], "clang-san": [20000, 0, 9.59494e-07]}, "bench": {"gcc": [["naive one-pass (per elem)", 0.513], ["two-pass (per elem)", 1.012], ["Welford (per elem)", 5.033]], "clang": [["naive one-pass (per elem)", 0.514], ["two-pass (per elem)", 1.007], ["Welford (per elem)", 5.086]]}}, "swar_haszero": {"show": "/* strlen on a long buffer: byte loop vs 8 bytes at a time with the\n   \"has a zero byte\" test (x - 0x01..01) & ~x & 0x80..80.\n   The buffer is padded and 8-aligned so reading a whole word past\n   the end is legal here (real libc proves page safety instead). */\nNOINLINE size_t len_naive(const char *s) { size_t n = 0; while (s[n]) n++; return n; }\nNOINLINE size_t len_swar(const char *s) {\n    const uint64_t L = 0x0101010101010101ull, H = 0x8080808080808080ull;\n    size_t i = 0;\n    for (;; i += 8) { uint64_t w; memcpy(&w, s + i, 8);\n        uint64_t z = (w - L) & ~w & H;\n        if (z) return i + (size_t)(__builtin_ctzll(z) >> 3); } }   /* lowest flagged byte (little-endian) */", "out": "12 12\nhaszero(0x0100FF8080000001) flags 0x8080000000808000", "fuzz": {"gcc": [1000000, 0, 0.0], "clang": [1000000, 0, 0.0], "gcc-san": [50000, 0, 0.0], "clang-san": [50000, 0, 0.0]}, "bench": {"gcc": [["byte loop (per byte)", 0.007], ["SWAR 8 at a time (per byte)", 0.032], ["libc strlen (per byte)", 0.007]], "clang": [["byte loop (per byte)", 0.007], ["SWAR 8 at a time (per byte)", 0.037], ["libc strlen (per byte)", 0.007]]}}, "swar_count": {"show": "/* Count newlines in a log buffer. SWAR: XOR with '\\n' in every byte\n   turns matches into zero bytes; an EXACT zero-byte detector\n   ((x & 0x7F..7F) + 0x7F..7F) | x has bit 7 clear only where the byte\n   is zero; then popcount the flags. (The quick haszero test can give\n   false positives above a real zero -- fine for strlen, not for\n   counting.) */\nNOINLINE size_t nl_naive(const unsigned char *p, size_t n) { size_t c = 0; for (size_t i = 0; i < n; i++) c += p[i] == '\\n'; return c; }\nNOINLINE size_t nl_swar(const unsigned char *p, size_t n) {\n    const uint64_t L7 = 0x7F7F7F7F7F7F7F7Full, NL = 0x0A0A0A0A0A0A0A0Aull;\n    size_t c = 0, i = 0;\n    for (; i + 8 <= n; i += 8) { uint64_t w; memcpy(&w, p + i, 8); w ^= NL;\n        uint64_t t = ((w & L7) + L7) | w;           /* bit 7 set iff byte nonzero */\n        c += (size_t)__builtin_popcountll(~t & ~L7); }\n    for (; i < n; i++) c += p[i] == '\\n';\n    return c; }", "out": "5 5", "fuzz": {"gcc": [200000, 0, 0.0], "clang": [200000, 0, 0.0], "gcc-san": [20000, 0, 0.0], "clang-san": [20000, 0, 0.0], "gcc-O3": [200000, 0, 0.0]}, "bench": {"gcc": [["byte compare (per byte)", 0.256], ["SWAR (per byte)", 0.202]], "clang": [["byte compare (per byte)", 0.323], ["SWAR (per byte)", 0.185]], "gcc-O3": [["byte compare (per byte)", 0.135], ["SWAR (per byte)", 0.205]]}}, "vec_ext_add": {"show": "/* Brighten an 8-bit greyscale image with saturation (cap at 255).\n   GCC/Clang vector extensions: a \"vector of 16 uint8\" type with\n   ordinary operators; the compiler maps it to SSE2 / NEON. Saturating\n   add without a dedicated instruction: s = a + b wraps; it wrapped\n   exactly when s < a, so OR in all-ones there. */\ntypedef uint8_t u8x16 __attribute__((vector_size(16)));\nNOINLINE void bright_naive(uint8_t *p, size_t n, uint8_t k) { for (size_t i = 0; i < n; i++) { unsigned v = p[i] + k; p[i] = (uint8_t)(v > 255 ? 255 : v); } }\nNOINLINE void bright_vec(uint8_t *p, size_t n, uint8_t k) {\n    size_t i = 0;\n    for (; i + 16 <= n; i += 16) { u8x16 a; memcpy(&a, p + i, 16);\n        u8x16 s = a + k;                     /* scalar k is broadcast */\n        s |= (u8x16)(s < a);                 /* compare gives 0 or -1 (0xFF) per lane */\n        memcpy(p + i, &s, 16); }\n    for (; i < n; i++) { unsigned v = p[i] + k; p[i] = (uint8_t)(v > 255 ? 255 : v); } }", "out": "200 213 226 239 252 255 255 255 255 255 255 255 255 255 255 255 255 255 255 255 ", "fuzz": {"gcc": [20000, 0, 0.0], "clang": [20000, 0, 0.0], "gcc-san": [20000, 0, 0.0], "clang-san": [20000, 0, 0.0], "gcc-O3": [20000, 0, 0.0]}, "bench": {"gcc": [["scalar loop (per pixel)", 0.504], ["vector extension (per pixel)", 0.032]], "clang": [["scalar loop (per pixel)", 0.093], ["vector extension (per pixel)", 0.021]], "gcc-O3": [["scalar loop (per pixel)", 0.173], ["vector extension (per pixel)", 0.032]]}, "asm_x86": "bright_vec:\n    mov    r10d, edx\n    cmp    rsi, 15\n    jbe    .L17\n    movd    xmm2, edx\n    pxor    xmm4, xmm4\n    pcmpeqd    xmm3, xmm3\n    mov    eax, 16\n    punpcklbw    xmm2, xmm2\n    punpcklwd    xmm2, xmm2\n    pshufd    xmm2, xmm2, 0\n.L12:\n    movdqu    xmm0, XMMWORD PTR -16[rdi+rax]\n    mov    r8, rax\n    movdqa    xmm1, xmm0\n    paddb    xmm1, xmm2\n    psubusb    xmm0, xmm1\n    pcmpeqb    xmm0, xmm4\n    pand    xmm1, xmm0\n    pandn    xmm0, xmm3\n    por    xmm0, xmm1\n    movups    XMMWORD PTR -16[rdi+rax], xmm0\n    add    rax, 16\n    cmp    rsi, rax\n    jnb    .L12\n.L11:\n    lea    rcx, [rdi+r8]\n    movzx    edx, dl\n    add    rdi, rsi\n    mov    r9d, -1\n    cmp    r8, rsi\n    jnb    .L10\n.L15:\n    movzx    esi, BYTE PTR [rcx]\n    mov    eax, esi\n    add    esi, edx\n    add    eax, r10d\n    cmp    esi, 256\n    cmovge    eax, r9d\n    add    rcx, 1\n    mov    BYTE PTR -1[rcx], al\n    cmp    rdi, rcx\n    jne    .L15\n.L10:\n    ret\n.L17:\n    xor    r8d, r8d\n    jmp    .L11", "asm_arm": "bright_vec:\n    cmp    r1, #15\n    push    {r4, lr}\n    bls    .L16\n    vdup.8    q10, r2\n    mov    r3, #16\n    sub    r4, r0, #16\n.L11:\n    add    ip, r4, r3\n    mov    lr, r3\n    add    r3, r3, #16\n    vld1.8    {q8}, [ip]\n    cmp    r1, r3\n    vadd.i8    q9, q8, q10\n    vcgt.u8    q8, q8, q9\n    vorr    q8, q8, q9\n    vst1.8    {q8}, [ip]\n    bcs    .L11\n    cmp    r1, lr\n    popls    {r4, pc}\n.L21:\n    add    r1, r0, r1\n    sub    lr, lr, #1\n    add    r0, r0, lr\n    sub    r1, r1, #1\n.L14:\n    ldrb    r3, [r0, #1]!    @ zero_extendqisi2\n    mov    ip, #255\n    add    r3, r3, r2\n    cmp    r3, ip\n    uxtble    ip, r3\n    cmp    r1, r0\n    strb    ip, [r0]\n    bne    .L14\n    pop    {r4, pc}\n.L16:\n    mov    lr, #0\n    cmp    r1, lr\n    bhi    .L21\n    pop    {r4, pc}"}, "autovec": {"show": "/* Dot product of float arrays. The plain loop does NOT vectorise at\n   -O2: float + is not associative, and reordering the sum would change\n   the answer, so the compiler must keep one serial chain. Fix by\n   writing the reordering yourself: 8 independent partial sums. That\n   both breaks the latency chain and lets the compiler use SIMD.\n   (The result differs from the serial sum by normal rounding.) */\nNOINLINE float dot_naive(const float *a, const float *b, long n) { float s = 0; for (long i = 0; i < n; i++) s += a[i] * b[i]; return s; }\nNOINLINE float dot_split(const float *a, const float *b, long n) {\n    float s[8] = {0}; long i = 0;\n    for (; i + 8 <= n; i += 8) for (int j = 0; j < 8; j++) s[j] += a[i + j] * b[i + j];\n    float t = ((s[0] + s[1]) + (s[2] + s[3])) + ((s[4] + s[5]) + (s[6] + s[7]));\n    for (; i < n; i++) t += a[i] * b[i];\n    return t; }", "out": "2475.0 2475.0", "fuzz": {"gcc": [5000, 0, 1.30027e-07], "clang": [5000, 0, 1.30027e-07], "gcc-san": [5000, 0, 1.30027e-07], "clang-san": [5000, 0, 1.30027e-07], "gcc-O3": [5000, 0, 1.30027e-07]}, "bench": {"gcc": [["serial sum (per elem)", 0.493], ["8 partial sums (per elem)", 0.064]], "clang": [["serial sum (per elem)", 0.493], ["8 partial sums (per elem)", 0.25]], "gcc-O3": [["serial sum (per elem)", 0.492], ["8 partial sums (per elem)", 0.064]]}}, "intrin_sse": {"show": "/* Find the maximum of an int32 array. With SSE4.1 intrinsics:\n   _mm_max_epi32 compares 4 lanes at once; at the end fold the 4 lanes\n   with shuffles. Intrinsics are x86-only (NEON has its own set in\n   <arm_neon.h>, e.g. vmaxq_s32). __attribute__((target)) enables\n   SSE4.1 for just this function; the caller must check the CPU. */\nNOINLINE int32_t max_naive(const int32_t *a, long n) { int32_t m = INT32_MIN; for (long i = 0; i < n; i++) if (a[i] > m) m = a[i]; return m; }\n__attribute__((target(\"sse4.1\"))) NOINLINE int32_t max_sse(const int32_t *a, long n) {\n    __m128i m = _mm_set1_epi32(INT32_MIN); long i = 0;\n    for (; i + 4 <= n; i += 4) m = _mm_max_epi32(m, _mm_loadu_si128((const __m128i *)(a + i)));\n    m = _mm_max_epi32(m, _mm_shuffle_epi32(m, _MM_SHUFFLE(1, 0, 3, 2)));   /* swap halves */\n    m = _mm_max_epi32(m, _mm_shuffle_epi32(m, _MM_SHUFFLE(2, 3, 0, 1)));   /* swap pairs */\n    int32_t r = _mm_cvtsi128_si32(m);\n    for (; i < n; i++) if (a[i] > r) r = a[i];\n    return r; }", "out": "42 42", "fuzz": {"gcc": [5000, 0, 0.0], "clang": [5000, 0, 0.0], "gcc-san": [5000, 0, 0.0], "clang-san": [5000, 0, 0.0]}, "bench": {"gcc": [["scalar (per elem)", 0.5], ["SSE4.1 intrinsics (per elem)", 0.063]], "clang": [["scalar (per elem)", 0.138], ["SSE4.1 intrinsics (per elem)", 0.044]]}, "asm_x86": "max_sse:\n    cmp    rsi, 3\n    jle    .L18\n    mov    rdx, rsi\n    mov    r8d, -2147483648\n    lea    rcx, -4[rsi]\n    mov    rax, rdi\n    shr    rdx, 2\n    movd    xmm1, r8d\n    sal    rdx, 4\n    pshufd    xmm1, xmm1, 0\n    add    rdx, rdi\n.L15:\n    movdqu    xmm0, XMMWORD PTR [rax]\n    add    rax, 16\n    pmaxsd    xmm0, xmm1\n    movdqa    xmm1, xmm0\n    cmp    rax, rdx\n    jne    .L15\n    mov    rax, rcx\n    and    rax, -4\n    add    rax, 4\n.L14:\n    pshufd    xmm1, xmm0, 78\n    pmaxsd    xmm0, xmm1\n    pshufd    xmm1, xmm0, 177\n    pmaxsd    xmm0, xmm1\n    movd    edx, xmm0\n    cmp    rsi, rax\n    jle    .L13\n    lea    rax, [rdi+rax*4]\n    lea    rcx, [rdi+rsi*4]\n.L17:\n    movd    xmm1, DWORD PTR [rax]\n    add    rax, 4\n    pmaxsd    xmm0, xmm1\n    movd    edx, xmm0\n    cmp    rcx, rax\n    jne    .L17\n.L13:\n    mov    eax, edx\n    ret\n.L18:\n    mov    eax, -2147483648\n    movd    xmm0, eax\n    xor    eax, eax\n    pshufd    xmm0, xmm0, 0\n    jmp    .L14"}, "simd_clamp": {"show": "/* Convert float audio [-1,1] (may overshoot) to int16 with clipping.\n   The naive version branches and calls lrintf. Rewritten as\n   branch-free min/max on floats plus a plain conversion, the loop has\n   no calls or branches and the compiler vectorises it. Rounding:\n   (int) truncates, so add +-0.5 first (\"round half away from zero\"). */\nNOINLINE void pcm_naive(const float *x, int16_t *y, long n) { for (long i = 0; i < n; i++) { float v = x[i] * 32767.0f; if (v > 32767.0f) y[i] = 32767; else if (v < -32768.0f) y[i] = -32768; else y[i] = (int16_t)lrintf(v); } }\nNOINLINE void pcm_fast(const float *x, int16_t *y, long n) { for (long i = 0; i < n; i++) { float v = x[i] * 32767.0f; v = v > 32767.0f ? 32767.0f : v; v = v < -32768.0f ? -32768.0f : v; v += v < 0 ? -0.5f : 0.5f; y[i] = (int16_t)(int32_t)v; } }", "out": "0 16384 -16384 32767 -32768 0 ", "fuzz": {"gcc": [5000, 0, 1.0], "clang": [5000, 0, 1.0], "gcc-san": [5000, 0, 1.0], "clang-san": [5000, 0, 1.0], "gcc-O3": [5000, 0, 1.0]}, "bench": {"gcc": [["branches + lrintf (per sample)", 2.508], ["min/max, vectorised (per sample)", 4.773]], "clang": [["branches + lrintf (per sample)", 2.497], ["min/max, vectorised (per sample)", 0.297]], "gcc-O3": [["branches + lrintf (per sample)", 2.474], ["min/max, vectorised (per sample)", 4.804]]}}, "simd_shuffle": {"show": "/* Byte-swap an array of 32-bit big-endian values (network data).\n   __builtin_shufflevector (clang) / __builtin_shuffle (gcc) permute\n   lanes of a vector in one instruction (pshufb on SSSE3, vtbl/vrev\n   on NEON). Portable fallback here uses the generic shuffle macro. */\ntypedef uint8_t u8x16 __attribute__((vector_size(16)));\n#if defined(__clang__)\n#define SHUF(v, m) __builtin_shufflevector(v, v, 3,2,1,0, 7,6,5,4, 11,10,9,8, 15,14,13,12)\n#else\n#define SHUF(v, m) __builtin_shuffle(v, m)\n#endif\nNOINLINE void bswap_naive(uint32_t *p, size_t n) { for (size_t i = 0; i < n; i++) { uint32_t x = p[i]; p[i] = (x >> 24) | ((x >> 8) & 0xFF00) | ((x << 8) & 0xFF0000) | (x << 24); } }\nNOINLINE void bswap_vec(uint32_t *p, size_t n) {\n    const u8x16 m = {3,2,1,0, 7,6,5,4, 11,10,9,8, 15,14,13,12}; (void)m;\n    size_t i = 0;\n    for (; i + 4 <= n; i += 4) { u8x16 v; memcpy(&v, p + i, 16); v = SHUF(v, m); memcpy(p + i, &v, 16); }\n    for (; i < n; i++) p[i] = __builtin_bswap32(p[i]); }", "out": "44332211 DDCCBBAA 01000000 00000080 EFBEADDE ", "fuzz": {"gcc": [5000, 0, 0.0], "clang": [5000, 0, 0.0], "gcc-san": [5000, 0, 0.0], "clang-san": [5000, 0, 0.0], "gcc-O3": [5000, 0, 0.0]}, "bench": {"gcc": [["shift/mask (per word)", 0.251], ["vector shuffle (per word)", 0.068]], "clang": [["shift/mask (per word)", 0.061], ["vector shuffle (per word)", 0.084]], "gcc-O3": [["shift/mask (per word)", 0.068], ["vector shuffle (per word)", 0.068]]}}, "soa": {"show": "/* Move particles: x += vx*dt for 3 axes. Array-of-structs puts each\n   particle's fields together (plus a \"mass\" and \"id\" the update never\n   touches), so loads are strided. Struct-of-arrays keeps each field\n   contiguous: every byte loaded is used, and the loop vectorises. */\ntypedef struct { float x, y, z, vx, vy, vz, mass; int id; } P_aos;\ntypedef struct { float *x, *y, *z, *vx, *vy, *vz; } P_soa;\nNOINLINE void step_aos(P_aos *p, long n, float dt) { for (long i = 0; i < n; i++) { p[i].x += p[i].vx * dt; p[i].y += p[i].vy * dt; p[i].z += p[i].vz * dt; } }\nNOINLINE void step_soa(P_soa *restrict s, long n, float dt) {\n    float *restrict x = s->x, *restrict y = s->y, *restrict z = s->z; const float *restrict vx = s->vx, *restrict vy = s->vy, *restrict vz = s->vz;\n    for (long i = 0; i < n; i++) x[i] += vx[i] * dt;\n    for (long i = 0; i < n; i++) y[i] += vy[i] * dt;\n    for (long i = 0; i < n; i++) z[i] += vz[i] * dt; }", "out": "sizeof(P_aos) = 32 bytes, update uses 24 of them", "fuzz": {"gcc": [2000, 0, 0.0], "clang": [2000, 0, 0.0], "gcc-san": [2000, 0, 0.0], "clang-san": [2000, 0, 0.0], "gcc-O3": [2000, 0, 0.0]}, "bench": {"gcc": [["array of structs (per particle)", 0.769], ["struct of arrays (per particle)", 0.942]], "clang": [["array of structs (per particle)", 0.773], ["struct of arrays (per particle)", 0.293]], "gcc-O3": [["array of structs (per particle)", 1.097], ["struct of arrays (per particle)", 0.3]]}}, "dispatch": {"show": "/* Ship one binary that uses AVX2 where the CPU has it and plain\n   SSE2 otherwise. target_clones makes the compiler build the\n   function once per target and pick at load time (via an ifunc\n   resolver checking CPUID). Same source, no intrinsics. */\n#define BODY for (long i = 0; i < n; i++) y[i] = a * x[i] + y[i];\nNOINLINE void saxpy_base(float a, const float *restrict x, float *restrict y, long n) { BODY }\n__attribute__((target_clones(\"avx2\", \"default\"))) void saxpy_mv(float a, const float *restrict x, float *restrict y, long n) { BODY }", "out": "3 5 7", "fuzz": {"gcc": [2000, 0, 0.0], "gcc-san": [2000, 0, 0.0], "gcc-O3": [2000, 0, 0.0]}, "bench": {"gcc": [["baseline SSE2 (per elem)", 0.291], ["target_clones -> AVX2 (per elem)", 0.442]], "gcc-O3": [["baseline SSE2 (per elem)", 0.075], ["target_clones -> AVX2 (per elem)", 0.044]]}}, "simd_lower": {"show": "/* ASCII lower-case a buffer (HTTP header names). Naive branches per\n   byte. Branch-free form: is_upper = (unsigned)(c - 'A') < 26, then\n   c | (is_upper << 5). The compiler turns that loop into 16-byte SIMD\n   compares with no intrinsics at all. */\nNOINLINE void lower_naive(char *s, size_t n) { for (size_t i = 0; i < n; i++) if (s[i] >= 'A' && s[i] <= 'Z') s[i] += 32; }\nNOINLINE void lower_fast(unsigned char *s, size_t n) { for (size_t i = 0; i < n; i++) { unsigned char c = s[i]; s[i] = c | (unsigned char)(((unsigned char)(c - 'A') < 26) << 5); } }", "out": "content-type: text/html [@z]", "fuzz": {"gcc": [5000, 0, 0.0], "clang": [5000, 0, 0.0], "gcc-san": [5000, 0, 0.0], "clang-san": [5000, 0, 0.0], "gcc-O3": [5000, 0, 0.0]}, "bench": {"gcc": [["if per byte (per byte)", 0.463], ["branch-free (per byte)", 0.505]], "clang": [["if per byte (per byte)", 0.323], ["branch-free (per byte)", 0.027]], "gcc-O3": [["if per byte (per byte)", 0.498], ["branch-free (per byte)", 0.031]]}}, "bigadd": {"show": "/* Add two 256-bit numbers stored as 4 x uint64 limbs (little-endian).\n   Naive: 8 x 32-bit limbs with a 64-bit temporary per step. Better:\n   64-bit limbs with __builtin_add_overflow for the carry (compiles to\n   add/adc on x86, adds/adcs on ARM). C23 also offers ckd_add. */\nNOINLINE void add256_naive(uint32_t r[8], const uint32_t a[8], const uint32_t b[8]) { uint64_t c = 0; for (int i = 0; i < 8; i++) { c += (uint64_t)a[i] + b[i]; r[i] = (uint32_t)c; c >>= 32; } }\nNOINLINE void add256(uint64_t r[4], const uint64_t a[4], const uint64_t b[4]) {\n    unsigned char c = 0;\n    for (int i = 0; i < 4; i++) { uint64_t s; unsigned char c1 = __builtin_add_overflow(a[i], b[i], &s); unsigned char c2 = __builtin_add_overflow(s, (uint64_t)c, &r[i]); c = c1 | c2; } }", "out": "1 0 0 0", "fuzz": {"gcc": [300000, 0, 0.0], "clang": [300000, 0, 0.0], "gcc-san": [20000, 0, 0.0], "clang-san": [20000, 0, 0.0]}, "bench": {"gcc": [["8 x 32-bit limbs", 3.191], ["4 x 64-bit, add_overflow", 2.125]], "clang": [["8 x 32-bit limbs", 5.753], ["4 x 64-bit, add_overflow", 1.066]]}, "asm_x86": "add256:\n    xor    eax, eax\n    xor    ecx, ecx\n.L6:\n    add    cl, -1\n    mov    rcx, QWORD PTR [rsi+rax]\n    adc    rcx, QWORD PTR [rdx+rax]\n    mov    QWORD PTR [rdi+rax], rcx\n    setc    cl\n    add    rax, 8\n    cmp    rax, 32\n    jne    .L6\n    ret", "asm_arm": "add256:\n    push    {r4, r5, r6, lr}\n    sub    r2, r2, #8\n    sub    lr, r1, #8\n    sub    r0, r0, #8\n    add    r1, r1, #24\n    mov    r4, #0\n.L12:\n    ldr    r3, [lr, #8]!\n    mov    r6, #0\n    ldr    r5, [r2, #8]!\n    ldr    ip, [lr, #4]\n    adds    r3, r3, r5\n    ldr    r5, [r2, #4]\n    adcs    ip, ip, r5\n    mov    r5, r6\n    movcs    r6, #1\n    adds    r3, r3, r4\n    str    r3, [r0, #8]!\n    adcs    ip, ip, #0\n    str    ip, [r0, #4]\n    movcs    r5, #1\n    cmp    r1, lr\n    orr    r4, r6, r5\n    bne    .L12\n    pop    {r4, r5, r6, pc}"}, "mul128": {"show": "/* The high 64 bits of a 64x64 product (hash mixing, fastrange-64,\n   fixed point). Portable naive: split into 32-bit halves, four\n   multiplies, carry bookkeeping. GCC/Clang: unsigned __int128, which\n   becomes ONE mul instruction on x86-64 (umulh on AArch64). On 32-bit\n   ARM __int128 does not exist -- keep the portable version there. */\nNOINLINE uint64_t mulhi_naive(uint64_t a, uint64_t b) {\n    uint64_t al = (uint32_t)a, ah = a >> 32, bl = (uint32_t)b, bh = b >> 32;\n    uint64_t ll = al * bl, lh = al * bh, hl = ah * bl, hh = ah * bh;\n    uint64_t mid = (ll >> 32) + (uint32_t)lh + (uint32_t)hl;       /* cannot overflow: < 3 * 2^32 */\n    return hh + (lh >> 32) + (hl >> 32) + (mid >> 32); }\n#ifdef __SIZEOF_INT128__\nNOINLINE uint64_t mulhi(uint64_t a, uint64_t b) { return (uint64_t)(((unsigned __int128)a * b) >> 64); }\n#else\nNOINLINE uint64_t mulhi(uint64_t a, uint64_t b) { return mulhi_naive(a, b); }\n#endif", "out": "fffffffffffffffe 121fa00ad77d7422", "fuzz": {"gcc": [4000000, 0, 0.0], "clang": [4000000, 0, 0.0], "gcc-san": [200000, 0, 0.0], "clang-san": [200000, 0, 0.0]}, "bench": {"gcc": [["4 partial products", 1.338], ["unsigned __int128", 0.75]], "clang": [["4 partial products", 0.8], ["unsigned __int128", 1.0]]}, "asm_x86": "mulhi:\n    mov    rax, rdi\n    mul    rsi\n    mov    rax, rdx\n    ret", "asm_arm": "mulhi:\n    b    mulhi_naive"}, "bigmul": {"show": "/* Multiply two n-limb numbers (schoolbook). Naive: 32-bit limbs and\n   a 64-bit accumulator -- n^2 small multiplies. With 64-bit limbs and\n   __int128 there are 4x fewer multiplies for the same number of bits.\n   (Karatsuba wins only for much bigger n -- try it in the lab.) */\nNOINLINE void mul_32(uint32_t *r, const uint32_t *a, const uint32_t *b, int n) {\n    memset(r, 0, 8 * (size_t)n);\n    for (int i = 0; i < n; i++) { uint64_t c = 0; for (int j = 0; j < n; j++) { c += (uint64_t)a[i] * b[j] + r[i + j]; r[i + j] = (uint32_t)c; c >>= 32; } r[i + n] = (uint32_t)c; } }\ntypedef unsigned __int128 u128;\nNOINLINE void mul_64(uint64_t *r, const uint64_t *a, const uint64_t *b, int n) {\n    memset(r, 0, 16 * (size_t)n);\n    for (int i = 0; i < n; i++) { u128 c = 0; for (int j = 0; j < n; j++) { c += (u128)a[i] * b[j] + r[i + j]; r[i + j] = (uint64_t)c; c >>= 64; } r[i + n] = (uint64_t)c; } }", "out": "(2^128-1)^2 limbs: ffffffffffffffff fffffffffffffffe 0 1", "fuzz": {"gcc": [30000, 0, 0.0], "clang": [30000, 0, 0.0], "gcc-san": [20000, 0, 0.0], "clang-san": [20000, 0, 0.0]}, "bench": {"gcc": [["4096-bit, 32-bit limbs", 8513.052], ["4096-bit, 64-bit limbs", 2357.007]], "clang": [["4096-bit, 32-bit limbs", 9582.847], ["4096-bit, 64-bit limbs", 3008.622]]}}, "u64toa": {"show": "/* Format integers for a CSV/JSON writer. snprintf parses a format\n   string every call. A hand loop dividing by 10 is better (the\n   compiler turns /10 into a multiply). Two digits at a time from a\n   200-byte table halves the multiplies again. */\nNOINLINE int fmt_printf(char *out, uint64_t v) { return snprintf(out, 24, \"%llu\", (unsigned long long)v); }\nNOINLINE int fmt_div10(char *out, uint64_t v) { char t[24]; int n = 0; do { t[n++] = (char)('0' + v % 10); v /= 10; } while (v); for (int i = 0; i < n; i++) out[i] = t[n - 1 - i]; out[n] = 0; return n; }\nstatic const char D2[201] = \"00010203040506070809101112131415161718192021222324252627282930313233343536373839404142434445464748495051525354555657585960616263646566676869707172737475767778798081828384858687888990919293949596979899\";\nNOINLINE int fmt_2dig(char *out, uint64_t v) {\n    char t[24]; int p = 24;\n    while (v >= 100) { unsigned r = (unsigned)(v % 100); v /= 100; p -= 2; memcpy(t + p, D2 + 2 * r, 2); }\n    if (v >= 10) { p -= 2; memcpy(t + p, D2 + 2 * v, 2); } else t[--p] = (char)('0' + v);\n    int n = 24 - p; memcpy(out, t + p, (size_t)n); out[n] = 0; return n; }", "out": "0 9 10 18446744073709551615 ", "fuzz": {"gcc": [4000000, 0, 0.0], "clang": [4000000, 0, 0.0], "gcc-san": [200000, 0, 0.0], "clang-san": [200000, 0, 0.0]}, "bench": {"gcc": [["snprintf", 39.738], ["digit loop /10", 17.026], ["two digits + table", 14.054]], "clang": [["snprintf", 40.187], ["digit loop /10", 17.994], ["two digits + table", 12.852]]}}, "rng": {"show": "/* Monte-Carlo needs lots of random doubles. rand() is slow (locking,\n   call), has RAND_MAX as small as 32767 and poor low bits. xoshiro256**\n   is a few shifts/rotates/adds, 2^256-1 period, passes BigCrush.\n   Doubles: take the top 53 bits and scale by 2^-53 -- uniform in [0,1). */\nstatic inline uint64_t rotl(uint64_t x, int k) { return (x << k) | (x >> (64 - k)); }\ntypedef struct { uint64_t s[4]; } xoshiro;\nstatic inline uint64_t xo_next(xoshiro *g) {\n    uint64_t *s = g->s, r = rotl(s[1] * 5, 7) * 9, t = s[1] << 17;\n    s[2] ^= s[0]; s[3] ^= s[1]; s[1] ^= s[2]; s[0] ^= s[3]; s[2] ^= t; s[3] = rotl(s[3], 45);\n    return r; }\nstatic inline double xo_double(xoshiro *g) { return (double)(xo_next(g) >> 11) * 0x1.0p-53; }\nNOINLINE double pi_rand(long n) { long in = 0; for (long i = 0; i < n; i++) { double x = rand() / (RAND_MAX + 1.0), y = rand() / (RAND_MAX + 1.0); in += x * x + y * y < 1; } return 4.0 * in / n; }\nNOINLINE double pi_xo(xoshiro *g, long n) { long in = 0; for (long i = 0; i < n; i++) { double x = xo_double(g), y = xo_double(g); in += x * x + y * y < 1; } return 4.0 * in / n; }", "out": "first: 0000000000002d00\npi ~ 3.1415 (1e6 points)", "fuzz": {"gcc": [2000, 0, 338.875], "clang": [2000, 0, 338.875], "gcc-san": [2000, 0, 338.875], "clang-san": [2000, 0, 338.875]}, "bench": {"gcc": [["rand() pi (per point)", 25.199], ["xoshiro256** pi (per point)", 2.569]], "clang": [["rand() pi (per point)", 25.462], ["xoshiro256** pi (per point)", 2.832]]}}, "hash": {"show": "/* Hash 8-byte keys for a hash table. Naive: byte-at-a-time FNV-1a,\n   8 dependent multiplies. Better for fixed-size integer keys: one\n   64-bit multiply-xorshift mixer (the murmur3/splitmix \"fmix64\"\n   finaliser) -- full avalanche: flipping any input bit flips each\n   output bit with probability ~1/2. */\nNOINLINE uint64_t h_fnv(uint64_t k) { uint64_t h = 0xcbf29ce484222325ull; for (int i = 0; i < 8; i++) { h ^= (k >> (8 * i)) & 0xFF; h *= 0x100000001b3ull; } return h; }\nNOINLINE uint64_t h_mix(uint64_t k) {\n    k ^= k >> 33; k *= 0xff51afd7ed558ccdull; k ^= k >> 33; k *= 0xc4ceb9fe1a85ec53ull; k ^= k >> 33; return k; }", "out": "b456bcfc34c2cb2c 3abf2a20650683e7", "fuzz": {"gcc": [1000000, 0, 0.000999], "clang": [1000000, 0, 0.000999], "gcc-san": [50000, 0, 0.00354], "clang-san": [50000, 0, 0.00354]}, "bench": {"gcc": [["FNV-1a bytewise", 3.728], ["fmix64", 1.25]], "clang": [["FNV-1a bytewise", 2.27], ["fmix64", 1.102]]}}, "crc32": {"show": "/* CRC-32 (zlib/PNG/Ethernet, reflected poly 0xEDB88320) of a file.\n   Bitwise: 8 shift/xor steps per byte. Table: one lookup per byte.\n   Slicing-by-4: four tables, 4 bytes per step, fewer dependent\n   loads. (Hardware: x86 crc32 instruction is CRC-32C -- a different\n   polynomial; ARMv8 has both.) */\nstatic uint32_t T[4][256];\nstatic void crc_init(void) { for (uint32_t i = 0; i < 256; i++) { uint32_t c = i; for (int k = 0; k < 8; k++) c = (c >> 1) ^ (0xEDB88320u & -(c & 1)); T[0][i] = c; }\n    for (int i = 0; i < 256; i++) for (int t = 1; t < 4; t++) T[t][i] = (T[t - 1][i] >> 8) ^ T[0][T[t - 1][i] & 0xFF]; }\nNOINLINE uint32_t crc_bit(const uint8_t *p, size_t n) { uint32_t c = ~0u; for (size_t i = 0; i < n; i++) { c ^= p[i]; for (int k = 0; k < 8; k++) c = (c >> 1) ^ (0xEDB88320u & -(c & 1)); } return ~c; }\nNOINLINE uint32_t crc_tab(const uint8_t *p, size_t n) { uint32_t c = ~0u; for (size_t i = 0; i < n; i++) c = (c >> 8) ^ T[0][(c ^ p[i]) & 0xFF]; return ~c; }\nNOINLINE uint32_t crc_s4(const uint8_t *p, size_t n) { uint32_t c = ~0u; size_t i = 0;\n    for (; i + 4 <= n; i += 4) { uint32_t w; memcpy(&w, p + i, 4); c ^= w;          /* little-endian */\n        c = T[3][c & 0xFF] ^ T[2][(c >> 8) & 0xFF] ^ T[1][(c >> 16) & 0xFF] ^ T[0][c >> 24]; }\n    for (; i < n; i++) { c = (c >> 8) ^ T[0][(c ^ p[i]) & 0xFF]; }\n    return ~c; }", "out": "crc32(\"123456789\") = CBF43926 (check value CBF43926)", "fuzz": {"gcc": [100000, 0, 0.0], "clang": [100000, 0, 0.0], "gcc-san": [20000, 0, 0.0], "clang-san": [20000, 0, 0.0]}, "bench": {"gcc": [["bitwise (per byte)", 8.312], ["table (per byte)", 2.009], ["slicing-by-4 (per byte)", 0.688]], "clang": [["bitwise (per byte)", 4.129], ["table (per byte)", 2.034], ["slicing-by-4 (per byte)", 0.757]]}}, "adler": {"show": "/* Adler-32 (zlib). Naive reduces mod 65521 after every byte (two\n   divisions per byte). Deferred: sums fit in 32 bits for 5552 bytes\n   (the largest n with 255 n (n+1)/2 + (n+1)(65520) < 2^32), so reduce\n   once per 5552-byte block. */\n#define BASE 65521u\nNOINLINE uint32_t adler_naive(const uint8_t *p, size_t n) { uint32_t a = 1, b = 0; for (size_t i = 0; i < n; i++) { a = (a + p[i]) % BASE; b = (b + a) % BASE; } return (b << 16) | a; }\nNOINLINE uint32_t adler_fast(const uint8_t *p, size_t n) { uint32_t a = 1, b = 0;\n    while (n) { size_t k = n < 5552 ? n : 5552; n -= k; while (k--) { a += *p++; b += a; } a %= BASE; b %= BASE; }\n    return (b << 16) | a; }", "out": "adler32(\"Wikipedia\") = 11E60398 (expect 11E60398)", "fuzz": {"gcc": [100000, 0, 0.0], "clang": [100000, 0, 0.0], "gcc-san": [20000, 0, 0.0], "clang-san": [20000, 0, 0.0]}, "bench": {"gcc": [["mod per byte (per byte)", 2.523], ["deferred mod (per byte)", 0.278]], "clang": [["mod per byte (per byte)", 2.467], ["deferred mod (per byte)", 0.256]]}}, "matmul_order": {"show": "/* C = A * B for n x n doubles, row-major. The textbook i-j-k loop\n   walks B down a column: stride n*8 bytes, a cache miss per step for\n   big n. Reorder to i-k-j: the inner loop now streams along rows of\n   B and C (stride 8) and vectorises. Same arithmetic, same result\n   up to summation order -- here even bit-identical, since each\n   C[i][j] still adds k = 0..n-1 in order. */\nNOINLINE void mm_ijk(const double *A, const double *B, double *C, int n) { for (int i = 0; i < n; i++) for (int j = 0; j < n; j++) { double s = 0; for (int k = 0; k < n; k++) s += A[i * n + k] * B[k * n + j]; C[i * n + j] = s; } }\nNOINLINE void mm_ikj(const double *restrict A, const double *restrict B, double *restrict C, int n) {\n    for (int i = 0; i < n; i++) { double *c = C + i * n; for (int j = 0; j < n; j++) c[j] = 0;\n        for (int k = 0; k < n; k++) { double a = A[i * n + k]; const double *b = B + k * n; for (int j = 0; j < n; j++) c[j] += a * b[j]; } } }", "out": "19 22 / 43 50", "fuzz": {"gcc": [300, 0, 0.0], "clang": [300, 0, 0.0], "gcc-san": [300, 0, 0.0], "clang-san": [300, 0, 0.0], "gcc-O3": [300, 0, 0.0]}, "bench": {"gcc": [["512^3 ijk (per mul-add)", 1.574], ["512^3 ikj (per mul-add)", 0.361]], "clang": [["512^3 ijk (per mul-add)", 1.551], ["512^3 ikj (per mul-add)", 0.212]], "gcc-O3": [["512^3 ijk (per mul-add)", 1.598], ["512^3 ikj (per mul-add)", 0.171]]}}, "transpose_block": {"show": "/* Transpose a large n x n float image (rotate for display). Naive\n   reads rows and writes columns: every write lands in a different\n   cache line. Blocked: do 32 x 32 tiles, so the tile's source and\n   destination lines (32 lines each, 4 KB each) stay in L1 while used. */\nNOINLINE void tr_naive(const float *restrict a, float *restrict b, int n) { for (int i = 0; i < n; i++) for (int j = 0; j < n; j++) b[j * n + i] = a[i * n + j]; }\nNOINLINE void tr_block(const float *restrict a, float *restrict b, int n) {\n    enum { T = 32 };\n    for (int ii = 0; ii < n; ii += T) for (int jj = 0; jj < n; jj += T) {\n        int ie = ii + T < n ? ii + T : n, je = jj + T < n ? jj + T : n;\n        for (int i = ii; i < ie; i++) for (int j = jj; j < je; j++) b[j * n + i] = a[i * n + j]; } }", "out": "1 4 7 2 5 8 3 6 9 ", "fuzz": {"gcc": [300, 0, 0.0], "clang": [300, 0, 0.0], "gcc-san": [300, 0, 0.0], "clang-san": [300, 0, 0.0]}, "bench": {"gcc": [["4096^2 naive (per elem)", 6.971], ["4096^2 32x32 tiles (per elem)", 3.298]], "clang": [["4096^2 naive (per elem)", 6.217], ["4096^2 32x32 tiles (per elem)", 3.169]]}}, "fibmat": {"show": "/* n-th term of a linear recurrence mod 2^64 (Fibonacci here; any\n   x_{n+1} = a x_n + b x_{n-1} works): loop is O(n). Matrix power\n   [[1,1],[1,0]]^n by squaring is O(log n). Fast doubling is the\n   same idea with the matrix algebra simplified:\n   F(2k) = F(k)(2F(k+1) - F(k)),  F(2k+1) = F(k)^2 + F(k+1)^2. */\nNOINLINE uint64_t fib_loop(uint64_t n) { uint64_t a = 0, b = 1; for (uint64_t i = 0; i < n; i++) { uint64_t t = a + b; a = b; b = t; } return a; }\nNOINLINE uint64_t fib_fast(uint64_t n) {\n    uint64_t a = 0, b = 1;                         /* (F(k), F(k+1)), k = 0 */\n    for (int i = 63 - (n ? __builtin_clzll(n) : 63); i >= 0; i--) {\n        uint64_t c = a * (2 * b - a), d = a * a + b * b;   /* k -> 2k */\n        if ((n >> i) & 1) { a = d; b = c + d; } else { a = c; b = d; } }   /* maybe 2k -> 2k+1 */\n    return a; }", "out": "F(10)=55 F(90)=2880067194370816120 F(10^18) mod 2^64=b66388ad9111f23b", "fuzz": {"gcc": [20000, 0, 0.0], "clang": [20000, 0, 0.0], "gcc-san": [20000, 0, 0.0], "clang-san": [20000, 0, 0.0]}, "bench": {"gcc": [["loop, n = 10^6", 250405.133], ["fast doubling, n = 10^6", 22.065]], "clang": [["loop, n = 10^6", 250589.2], ["fast doubling, n = 10^6", 25.688]]}}, "geom": {"show": "/* Rotate many 2D points by the same angle (a sprite, a CAD view).\n   Naive calls cosf/sinf per point. Hoist: compute c and s once -- a\n   2x2 matrix -- then each point is 4 multiplies and 2 adds. */\nNOINLINE void rot_naive(float *x, float *y, long n, float th) { for (long i = 0; i < n; i++) { float a = x[i], b = y[i]; x[i] = a * cosf(th) - b * sinf(th); y[i] = a * sinf(th) + b * cosf(th); } }\nNOINLINE void rot_fast(float *restrict x, float *restrict y, long n, float th) { float c = cosf(th), s = sinf(th); for (long i = 0; i < n; i++) { float a = x[i], b = y[i]; x[i] = a * c - b * s; y[i] = a * s + b * c; } }", "out": "(1,0) rotated 90 deg: (0.000000, 1.000000)", "fuzz": {"gcc": [2000000, 0, 0.0], "clang": [2000000, 0, 0.0], "gcc-san": [100000, 0, 0.0], "clang-san": [100000, 0, 0.0]}, "bench": {"gcc": [["cos/sin per point", 0.585], ["hoisted 2x2 matrix", 0.585]], "clang": [["cos/sin per point", 6.76], ["hoisted 2x2 matrix", 0.149]]}}, "denormal": {"show": "/* A decaying reverb/IIR tail: y = y * 0.5 + x with x = 0 after the\n   input stops. y shrinks into SUBNORMAL floats (below 1.2e-38),\n   which many CPUs handle in slow microcode -- 10-100x per op. Fix in\n   portable C: flush tiny values to zero yourself (or set the FTZ/DAZ\n   bits in MXCSR / FPSCR, which -ffast-math does at startup). */\nNOINLINE float tail_naive(float *y, int n, int steps) { float s = 0; for (int t = 0; t < steps; t++) for (int i = 0; i < n; i++) { y[i] = y[i] * 0.9f; s += y[i]; } return s; }\nNOINLINE float tail_flush(float *y, int n, int steps) { float s = 0; for (int t = 0; t < steps; t++) for (int i = 0; i < n; i++) { float v = y[i] * 0.9f; v = fabsf(v) < 1e-30f ? 0.0f : v; y[i] = v; s += v; } return s; }", "out": "1e-37 halves 4 times to reach subnormal 6.25e-39; smallest subnormal 1.4013e-45", "fuzz": {"gcc": [1000, 0, 0.0], "clang": [1000, 0, 0.0], "gcc-san": [1000, 0, 0.0], "clang-san": [1000, 0, 0.0]}, "bench": {"gcc": [["subnormal tail (per op)", 29.771], ["flush to zero (per op)", 0.541]], "clang": [["subnormal tail (per op)", 29.768], ["flush to zero (per op)", 0.5]]}}, "kahan": {"show": "/* Total of a million float readings. Plain summation's error grows\n   with n (each add rounds against an ever larger total). Kahan\n   compensated summation carries the lost low bits forward: error\n   ~2 ulp regardless of n, for 4 flops per element instead of 1.\n   Needs strict IEEE evaluation -- -ffast-math would delete the\n   compensation as \"algebraically zero\". */\nNOINLINE float sum_naive(const float *x, long n) { float s = 0; for (long i = 0; i < n; i++) s += x[i]; return s; }\nNOINLINE float sum_kahan(const float *x, long n) { float s = 0, c = 0; for (long i = 0; i < n; i++) { float y = x[i] - c, t = s + y; c = (t - s) - y; s = t; } return s; }\nNOINLINE float sum_double(const float *x, long n) { double s = 0; for (long i = 0; i < n; i++) s += x[i]; return (float)s; }", "out": "naive 100958.34  kahan 100000.00  double 100000.00  (exact 100000.00)", "fuzz": {"gcc": [2000, 0, 5.80188e-08], "clang": [2000, 0, 5.80188e-08], "gcc-san": [2000, 0, 5.80188e-08], "clang-san": [2000, 0, 5.80188e-08]}, "bench": {"gcc": [["naive (per elem)", 0.605], ["Kahan (per elem)", 2.005], ["double accumulator (per elem)", 0.501]], "clang": [["naive (per elem)", 0.5], ["Kahan (per elem)", 2.032], ["double accumulator (per elem)", 0.5]]}}, "quadratic": {"show": "/* Roots of a x^2 + b x + c. The school formula (-b +- sqrt(d)) / 2a\n   subtracts nearly equal numbers when b^2 >> 4ac: the small root\n   loses most of its digits. Stable: q = -(b + sign(b) sqrt(d)) / 2,\n   x1 = q / a, x2 = c / q -- no cancellation, same cost. */\nNOINLINE void roots_naive(double a, double b, double c, double *x1, double *x2) { double d = sqrt(b * b - 4 * a * c); *x1 = (-b + d) / (2 * a); *x2 = (-b - d) / (2 * a); }\nNOINLINE void roots_stable(double a, double b, double c, double *x1, double *x2) { double d = sqrt(b * b - 4 * a * c); double q = -0.5 * (b + copysign(d, b)); *x1 = q / a; *x2 = c / q; }", "out": "small root: naive 7.4505805969238281e-09  stable 1e-08 (true 1.00000000000000000e-08)", "fuzz": {"gcc": [2000000, 0, 4.28211e-16], "clang": [2000000, 0, 4.28211e-16], "gcc-san": [100000, 0, 4.10232e-16], "clang-san": [100000, 0, 4.10232e-16]}, "bench": {"gcc": [["school formula", 3.508], ["stable formula", 3.55]], "clang": [["school formula", 3.515], ["stable formula", 4.235]]}}, "floatvsdouble": {"show": "/* Scale an audio buffer. Writing 0.5 ( sed:\n   1. pow(r2, 1.5) -> r2 * sqrt(r2): one sqrt instead of exp/log\n   2. Newton's third law: each pair once, apply +f and -f (half the work)\n   3. 1/(r2 sqrt r2) computed once per pair and reused for 6 updates\n   4. struct-of-arrays so the inner loop streams. Accuracy: double,\n      relative difference ~1e-14 (summation order changed). */\nNOINLINE void acc_naive(int n, const double *x, const double *y, const double *z, const double *m, double *ax, double *ay, double *az) {\n    for (int i = 0; i < n; i++) { ax[i] = ay[i] = az[i] = 0;\n        for (int j = 0; j < n; j++) { if (i == j) continue; double dx = x[j] - x[i], dy = y[j] - y[i], dz = z[j] - z[i], r2 = dx * dx + dy * dy + dz * dz + 1e-6;\n            double f = m[j] / pow(r2, 1.5); ax[i] += f * dx; ay[i] += f * dy; az[i] += f * dz; } } }\nNOINLINE void acc_fast(int n, const double *restrict x, const double *restrict y, const double *restrict z, const double *restrict m, double *restrict ax, double *restrict ay, double *restrict az) {\n    for (int i = 0; i < n; i++) ax[i] = ay[i] = az[i] = 0;\n    for (int i = 0; i < n; i++) { double xi = x[i], yi = y[i], zi = z[i], mi = m[i], sx = 0, sy = 0, sz = 0;\n        for (int j = i + 1; j < n; j++) { double dx = x[j] - xi, dy = y[j] - yi, dz = z[j] - zi, r2 = dx * dx + dy * dy + dz * dz + 1e-6;\n            double inv = 1.0 / (r2 * sqrt(r2));\n            double fj = m[j] * inv, fi = mi * inv;\n            sx += fj * dx; sy += fj * dy; sz += fj * dz;\n            ax[j] -= fi * dx; ay[j] -= fi * dy; az[j] -= fi * dz; }\n        ax[i] += sx; ay[i] += sy; az[i] += sz; } }", "out": "ax = 1.999997 -0.999999", "fuzz": {"gcc": [200, 0, 1.12135e-15], "clang": [200, 0, 1.12135e-15], "gcc-san": [200, 0, 1.12135e-15], "clang-san": [200, 0, 1.12135e-15]}, "bench": {"gcc": [["naive, N=2000 (per pair)", 12.685], ["optimised, N=2000 (per pair)", 1.729]], "clang": [["naive, N=2000 (per pair)", 13.12], ["optimised, N=2000 (per pair)", 1.722]]}}, "cap_checklist": {"show": "/*
