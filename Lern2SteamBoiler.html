(function(){const H=CG.H,u={"title": "Testing and commissioning gates", "lessons": [{"title": "Hydrostatic test principles", "teach": "Hydrostatic testing uses a controlled liquid pressure test under an approved procedure with competent oversight. Water stores far less compression energy than a comparable volume of compressed gas, but trapped air, component failure, elevated pressure and mechanical loads remain hazardous. Test pressure, duration, acceptance and exclusion arrangements come from the applicable approved basis, not this app.\n\nProfessional practice boundary: this explanation supports supervised learning and review. It is not an approved design, fabrication instruction, test procedure or operating authorisation. Actual decisions require the applicable code, current local requirements, plant-specific instructions and competent accountable people.", "worked": "A team proposes replacing a hydrostatic test with compressed air for convenience. That changes stored-energy risk profoundly and requires specialist justification, not a casual substitution.", "q": "Why is compressed-gas substitution a major concern?", "a": "Gas stores much more compression energy", "w": "Gas and water store identical compression energy", "work": "Worked reasoning: A team proposes replacing a hydrostatic test with compressed air for convenience. That changes stored-energy risk profoundly and requires specialist justification, not a casual substitution.\n\nPaper workshop: write the claim being evaluated, identify its assumptions and missing evidence, then explain the consequence of the incorrect alternative: \u201cGas and water store identical compression energy\u201d. Distinguish an arithmetic result from a verified engineering decision. Record the professional role responsible for resolving any uncertainty. Do not perform a live pressure, combustion, electrical or fault experiment.\n\nReview prompt: Why is compressed-gas substitution a major concern? Explain your reasoning before answering. If the context changes, state which evidence would need to be reassessed.", "why": "Gas stores much more compression energy. Hydrostatic testing uses a controlled liquid pressure test under an approved procedure with competent oversight. Water stores far less compression energy than a comparable volume of compressed gas, but trapped air, component failure, elevated pressure and mechanical loads remain hazardous. Test pressure, duration, acceptance and exclusion arrangements come from the applicable approved basis, not this app. The alternative is not justified: Gas and water store identical compression energy."}, {"title": "No universal test recipe", "teach": "A successful test does not prove correct materials, fatigue life, relief capacity or safe controls. A competent test plan identifies boundaries, rated equipment, air removal provisions, calibrated instrumentation, exclusion zones and formal records. This course deliberately supplies no universal test pressure multiplier or pressurisation sequence.\n\nProfessional practice boundary: this explanation supports supervised learning and review. It is not an approved design, fabrication instruction, test procedure or operating authorisation. Actual decisions require the applicable code, current local requirements, plant-specific instructions and competent accountable people.", "worked": "A vessel passes a test but its material traceability is absent. The missing evidence remains unresolved; a test cannot reconstruct the material certificate.", "q": "Does passing one pressure test prove full fitness for service?", "a": "No; it covers only specified test evidence", "w": "Yes; testing replaces all design and manufacturing records", "work": "Worked reasoning: A vessel passes a test but its material traceability is absent. The missing evidence remains unresolved; a test cannot reconstruct the material certificate.\n\nPaper workshop: write the claim being evaluated, identify its assumptions and missing evidence, then explain the consequence of the incorrect alternative: \u201cYes; testing replaces all design and manufacturing records\u201d. Distinguish an arithmetic result from a verified engineering decision. Record the professional role responsible for resolving any uncertainty. Do not perform a live pressure, combustion, electrical or fault experiment.\n\nReview prompt: Does passing one pressure test prove full fitness for service? Explain your reasoning before answering. If the context changes, state which evidence would need to be reassessed.", "why": "No; it covers only specified test evidence. A successful test does not prove correct materials, fatigue life, relief capacity or safe controls. A competent test plan identifies boundaries, rated equipment, air removal provisions, calibrated instrumentation, exclusion zones and formal records. This course deliberately supplies no universal test pressure multiplier or pressurisation sequence. The alternative is not justified: Yes; testing replaces all design and manufacturing records."}, {"title": "Integrated commissioning and handover", "teach": "Commissioning confirms documentation, mechanical completion, instrumentation, protective functions, electrical systems and operator readiness against an approved plan. Cold checks and simulated faults can verify many functions without creating live hazardous deviations. Handover includes instructions, records, training, emergency arrangements and outstanding-item closure.\n\nProfessional practice boundary: this explanation supports supervised learning and review. It is not an approved design, fabrication instruction, test procedure or operating authorisation. Actual decisions require the applicable code, current local requirements, plant-specific instructions and competent accountable people.", "worked": "A functional trip has not been proven, but steady operation looks satisfactory. Commissioning is incomplete; normal operation cannot demonstrate the missing fault response.", "q": "Can stable normal operation replace protective-function verification?", "a": "No; the protection must be verified separately", "w": "Yes; untested trips are acceptable when pressure is steady", "work": "Worked reasoning: A functional trip has not been proven, but steady operation looks satisfactory. Commissioning is incomplete; normal operation cannot demonstrate the missing fault response.\n\nPaper workshop: write the claim being evaluated, identify its assumptions and missing evidence, then explain the consequence of the incorrect alternative: \u201cYes; untested trips are acceptable when pressure is steady\u201d. Distinguish an arithmetic result from a verified engineering decision. Record the professional role responsible for resolving any uncertainty. Do not perform a live pressure, combustion, electrical or fault experiment.\n\nReview prompt: Can stable normal operation replace protective-function verification? Explain your reasoning before answering. If the context changes, state which evidence would need to be reassessed.", "why": "No; the protection must be verified separately. Commissioning confirms documentation, mechanical completion, instrumentation, protective functions, electrical systems and operator readiness against an approved plan. Cold checks and simulated faults can verify many functions without creating live hazardous deviations. Handover includes instructions, records, training, emergency arrangements and outstanding-item closure. The alternative is not justified: Yes; untested trips are acceptable when pressure is steady."}], "part": "generation"},i=28,id='scenario'+i;

(function(){const H=CG.H,u={"title": "Operating systems and abnormal events", "lessons": [{"title": "Authorised operating procedures", "teach": "Startup, warm-up, load changes and shutdown must follow plant-specific approved instructions by competent authorised operators. Thermal gradients, condensate, chemistry and protective readiness affect sequencing. This course explains why steps exist but is not an executable operating procedure. Record shift conditions, defects and handover information.\n\nProfessional practice boundary: this explanation supports supervised learning and review. It is not an approved design, fabrication instruction, test procedure or operating authorisation. Actual decisions require the applicable code, current local requirements, plant-specific instructions and competent accountable people.", "worked": "An operator notices a new abnormal sound during a transition. Follow the plant's abnormal-condition response rather than proceeding because the lesson checklist is complete.", "q": "Which procedure governs real startup?", "a": "The approved plant-specific procedure and authorised operator training", "w": "A generic lesson from this app", "work": "Worked reasoning: An operator notices a new abnormal sound during a transition. Follow the plant's abnormal-condition response rather than proceeding because the lesson checklist is complete.\n\nPaper workshop: write the claim being evaluated, identify its assumptions and missing evidence, then explain the consequence of the incorrect alternative: \u201cA generic lesson from this app\u201d. Distinguish an arithmetic result from a verified engineering decision. Record the professional role responsible for resolving any uncertainty. Do not perform a live pressure, combustion, electrical or fault experiment.\n\nReview prompt: Which procedure governs real startup? Explain your reasoning before answering. If the context changes, state which evidence would need to be reassessed.", "why": "The approved plant-specific procedure and authorised operator training. Startup, warm-up, load changes and shutdown must follow plant-specific approved instructions by competent authorised operators. Thermal gradients, condensate, chemistry and protective readiness affect sequencing. This course explains why steps exist but is not an executable operating procedure. Record shift conditions, defects and handover information. The alternative is not justified: A generic lesson from this app."}, {"title": "Low water, leaks and suspected damage", "teach": "Steam leaks can be difficult to see and can cut or scald. Never search with a hand. A suspected leak, low-water event, overheating or damaged pressure part requires safe withdrawal and the approved emergency response. Do not tighten hot pressurised joints, defeat trips, rapidly refill an overheated boiler or reopen equipment while energy remains.\n\nProfessional practice boundary: this explanation supports supervised learning and review. It is not an approved design, fabrication instruction, test procedure or operating authorisation. Actual decisions require the applicable code, current local requirements, plant-specific instructions and competent accountable people.", "worked": "A small invisible leak is suspected near a fitting. Keep clear and initiate the approved response; a hand is not a detector.", "q": "How should a suspected live steam leak be investigated by a learner?", "a": "Do not approach; withdraw and notify authorised personnel", "w": "Feel around the fitting with a glove", "work": "Worked reasoning: A small invisible leak is suspected near a fitting. Keep clear and initiate the approved response; a hand is not a detector.\n\nPaper workshop: write the claim being evaluated, identify its assumptions and missing evidence, then explain the consequence of the incorrect alternative: \u201cFeel around the fitting with a glove\u201d. Distinguish an arithmetic result from a verified engineering decision. Record the professional role responsible for resolving any uncertainty. Do not perform a live pressure, combustion, electrical or fault experiment.\n\nReview prompt: How should a suspected live steam leak be investigated by a learner? Explain your reasoning before answering. If the context changes, state which evidence would need to be reassessed.", "why": "Do not approach; withdraw and notify authorised personnel. Steam leaks can be difficult to see and can cut or scald. Never search with a hand. A suspected leak, low-water event, overheating or damaged pressure part requires safe withdrawal and the approved emergency response. Do not tighten hot pressurised joints, defeat trips, rapidly refill an overheated boiler or reopen equipment while energy remains. The alternative is not justified: Feel around the fitting with a glove."}, {"title": "Fire, power loss and emergency planning", "teach": "Emergency plans address fuel fire, power loss, feed loss, overpressure, steam release, injury and evacuation. Removing electrical power may not eliminate residual heat or stored pressure. Alarm, isolation and evacuation roles must be site-specific and rehearsed. Rescuers must not enter a hazardous steam or confined area impulsively.\n\nProfessional practice boundary: this explanation supports supervised learning and review. It is not an approved design, fabrication instruction, test procedure or operating authorisation. Actual decisions require the applicable code, current local requirements, plant-specific instructions and competent accountable people.", "worked": "Power fails on a solid-fuel plant while the fuel bed remains hot. Residual heat and loss of pumping must already be covered by engineered protection and the emergency plan.", "q": "Does loss of electrical supply remove all boiler energy?", "a": "No; stored heat, pressure and fuel energy can remain", "w": "Yes; every hazard vanishes when the lights go out", "work": "Worked reasoning: Power fails on a solid-fuel plant while the fuel bed remains hot. Residual heat and loss of pumping must already be covered by engineered protection and the emergency plan.\n\nPaper workshop: write the claim being evaluated, identify its assumptions and missing evidence, then explain the consequence of the incorrect alternative: \u201cYes; every hazard vanishes when the lights go out\u201d. Distinguish an arithmetic result from a verified engineering decision. Record the professional role responsible for resolving any uncertainty. Do not perform a live pressure, combustion, electrical or fault experiment.\n\nReview prompt: Does loss of electrical supply remove all boiler energy? Explain your reasoning before answering. If the context changes, state which evidence would need to be reassessed.", "why": "No; stored heat, pressure and fuel energy can remain. Emergency plans address fuel fire, power loss, feed loss, overpressure, steam release, injury and evacuation. Removing electrical power may not eliminate residual heat or stored pressure. Alarm, isolation and evacuation roles must be site-specific and rehearsed. Rescuers must not enter a hazardous steam or confined area impulsively. The alternative is not justified: Yes; every hazard vanishes when the lights go out."}], "part": "generation"},i=29,id='scenario'+i;

(function(){const H=CG.H,u={"title": "Maintenance and lifecycle integrity", "lessons": [{"title": "Lockout and zero-energy verification", "teach": "Energy control addresses steam, hot water, fuel, electricity, gravity, rotation, chemical exposure and trapped pressure. Isolation must be verified by the approved procedure; a gauge at zero is not sufficient proof if its connection is blocked. Cool-down and pressure removal require authorised methods. Locks and tags do not themselves dissipate stored energy.\n\nProfessional practice boundary: this explanation supports supervised learning and review. It is not an approved design, fabrication instruction, test procedure or operating authorisation. Actual decisions require the applicable code, current local requirements, plant-specific instructions and competent accountable people.", "worked": "An isolated section can trap hot condensate between valves. The maintenance plan must identify that pocket and verify a safe state before work.", "q": "Does an isolation tag prove zero stored energy?", "a": "No; safe-state verification is still required", "w": "Yes; tags automatically release trapped pressure", "work": "Worked reasoning: An isolated section can trap hot condensate between valves. The maintenance plan must identify that pocket and verify a safe state before work.\n\nPaper workshop: write the claim being evaluated, identify its assumptions and missing evidence, then explain the consequence of the incorrect alternative: \u201cYes; tags automatically release trapped pressure\u201d. Distinguish an arithmetic result from a verified engineering decision. Record the professional role responsible for resolving any uncertainty. Do not perform a live pressure, combustion, electrical or fault experiment.\n\nReview prompt: Does an isolation tag prove zero stored energy? Explain your reasoning before answering. If the context changes, state which evidence would need to be reassessed.", "why": "No; safe-state verification is still required. Energy control addresses steam, hot water, fuel, electricity, gravity, rotation, chemical exposure and trapped pressure. Isolation must be verified by the approved procedure; a gauge at zero is not sufficient proof if its connection is blocked. Cool-down and pressure removal require authorised methods. Locks and tags do not themselves dissipate stored energy. The alternative is not justified: Yes; tags automatically release trapped pressure."}, {"title": "Internal inspection and confined spaces", "teach": "Internal examination may involve confined-space, oxygen-deficiency, toxic-residue, access and rescue hazards. Entry requires applicable permits, atmospheric controls, isolation and trained teams. Cleaning can expose chemicals, deposits or old insulation hazards. The learner's role is to understand the requirements, not enter a vessel based on an app checklist.\n\nProfessional practice boundary: this explanation supports supervised learning and review. It is not an approved design, fabrication instruction, test procedure or operating authorisation. Actual decisions require the applicable code, current local requirements, plant-specific instructions and competent accountable people.", "worked": "A boiler is cold but has no confined-space assessment. Cold temperature alone does not make entry acceptable.", "q": "Does a cold vessel automatically permit safe entry?", "a": "No; isolation and confined-space requirements still apply", "w": "Yes; temperature is the only entry hazard", "work": "Worked reasoning: A boiler is cold but has no confined-space assessment. Cold temperature alone does not make entry acceptable.\n\nPaper workshop: write the claim being evaluated, identify its assumptions and missing evidence, then explain the consequence of the incorrect alternative: \u201cYes; temperature is the only entry hazard\u201d. Distinguish an arithmetic result from a verified engineering decision. Record the professional role responsible for resolving any uncertainty. Do not perform a live pressure, combustion, electrical or fault experiment.\n\nReview prompt: Does a cold vessel automatically permit safe entry? Explain your reasoning before answering. If the context changes, state which evidence would need to be reassessed.", "why": "No; isolation and confined-space requirements still apply. Internal examination may involve confined-space, oxygen-deficiency, toxic-residue, access and rescue hazards. Entry requires applicable permits, atmospheric controls, isolation and trained teams. Cleaning can expose chemicals, deposits or old insulation hazards. The learner's role is to understand the requirements, not enter a vessel based on an app checklist. The alternative is not justified: Yes; temperature is the only entry hazard."}, {"title": "Repairs, alterations and retirement", "teach": "Repairs and alterations require controlled engineering review, qualified execution, examination, records and any required re-registration or certification. Welding a crack or increasing a setpoint is not routine improvisation. Service history and inspection evidence guide continued operation or retirement. Preserving a historical item may be safest in permanently non-operating form.\n\nProfessional practice boundary: this explanation supports supervised learning and review. It is not an approved design, fabrication instruction, test procedure or operating authorisation. Actual decisions require the applicable code, current local requirements, plant-specific instructions and competent accountable people.", "worked": "An owner wants to raise operating pressure to improve generator output. Treat this as a potential design and regulatory change, not a controller adjustment.", "q": "Is raising pressure merely a tuning task?", "a": "No; it can require full engineering and regulatory reassessment", "w": "Yes; the operator can choose any setting below gauge maximum", "work": "Worked reasoning: An owner wants to raise operating pressure to improve generator output. Treat this as a potential design and regulatory change, not a controller adjustment.\n\nPaper workshop: write the claim being evaluated, identify its assumptions and missing evidence, then explain the consequence of the incorrect alternative: \u201cYes; the operator can choose any setting below gauge maximum\u201d. Distinguish an arithmetic result from a verified engineering decision. Record the professional role responsible for resolving any uncertainty. Do not perform a live pressure, combustion, electrical or fault experiment.\n\nReview prompt: Is raising pressure merely a tuning task? Explain your reasoning before answering. If the context changes, state which evidence would need to be reassessed.", "why": "No; it can require full engineering and regulatory reassessment. Repairs and alterations require controlled engineering review, qualified execution, examination, records and any required re-registration or certification. Welding a crack or increasing a setpoint is not routine improvisation. Service history and inspection evidence guide continued operation or retirement. Preserving a historical item may be safest in permanently non-operating form. The alternative is not justified: Yes; the operator can choose any setting below gauge maximum."}], "part": "generation"},i=30,id='scenario'+i;

(function(){const H=CG.H,u={"title": "Measurement, uncertainty and digital literacy", "lessons": [{"title": "Measurement uncertainty", "teach": "Pressure, temperature, flow and electrical output all have uncertainty. Sensor location, lag, drift and calibration affect interpretation. Combine measurements using a documented method and avoid implying precision beyond the instruments. Repeated readings reduce some random uncertainty but not systematic bias. An efficiency estimate requires a consistent time and system boundary.\n\nProfessional practice boundary: this explanation supports supervised learning and review. It is not an approved design, fabrication instruction, test procedure or operating authorisation. Actual decisions require the applicable code, current local requirements, plant-specific instructions and competent accountable people.", "worked": "A flow meter biased high by 10 percent will overstate mass-flow-based power predictions. Taking one hundred readings does not remove that calibration bias.", "q": "Does repetition remove a systematic calibration bias?", "a": "No; calibration and method correction are needed", "w": "Yes; enough readings always erase bias", "work": "Worked reasoning: A flow meter biased high by 10 percent will overstate mass-flow-based power predictions. Taking one hundred readings does not remove that calibration bias.\n\nPaper workshop: write the claim being evaluated, identify its assumptions and missing evidence, then explain the consequence of the incorrect alternative: \u201cYes; enough readings always erase bias\u201d. Distinguish an arithmetic result from a verified engineering decision. Record the professional role responsible for resolving any uncertainty. Do not perform a live pressure, combustion, electrical or fault experiment.\n\nReview prompt: Does repetition remove a systematic calibration bias? Explain your reasoning before answering. If the context changes, state which evidence would need to be reassessed.", "why": "No; calibration and method correction are needed. Pressure, temperature, flow and electrical output all have uncertainty. Sensor location, lag, drift and calibration affect interpretation. Combine measurements using a documented method and avoid implying precision beyond the instruments. Repeated readings reduce some random uncertainty but not systematic bias. An efficiency estimate requires a consistent time and system boundary. The alternative is not justified: Yes; enough readings always erase bias."}, {"title": "Decimal, hex and binary tags", "teach": "Unsigned bytes range from 0 to 255. Binary place values are 128, 64, 32, 16, 8, 4, 2 and 1; hexadecimal digits count powers of sixteen. Digital representation does not specify calibration or engineering units. Safety logic must not be modified by learners merely because a register's bits are understood.\n\nProfessional practice boundary: this explanation supports supervised learning and review. It is not an approved design, fabrication instruction, test procedure or operating authorisation. Actual decisions require the applicable code, current local requirements, plant-specific instructions and competent accountable people.", "worked": "0xAD = 10\u00d716+13 = 173 = 10101101 in binary. A raw value of 173 does not mean 173 kPa without a defined scaling rule.", "q": "What is unsigned 0xAD in decimal?", "a": "173", "w": "109", "work": "Worked reasoning: 0xAD = 10\u00d716+13 = 173 = 10101101 in binary. A raw value of 173 does not mean 173 kPa without a defined scaling rule.\n\nPaper workshop: write the claim being evaluated, identify its assumptions and missing evidence, then explain the consequence of the incorrect alternative: \u201c109\u201d. Distinguish an arithmetic result from a verified engineering decision. Record the professional role responsible for resolving any uncertainty. Do not perform a live pressure, combustion, electrical or fault experiment.\n\nReview prompt: What is unsigned 0xAD in decimal? Explain your reasoning before answering. If the context changes, state which evidence would need to be reassessed.", "why": "173. Unsigned bytes range from 0 to 255. Binary place values are 128, 64, 32, 16, 8, 4, 2 and 1; hexadecimal digits count powers of sixteen. Digital representation does not specify calibration or engineering units. Safety logic must not be modified by learners merely because a register's bits are understood. The alternative is not justified: 109."}, {"title": "Data logging and time alignment", "teach": "Energy balances require synchronised measurements and a stated averaging interval. During startup, heat accumulates in metal and water, so input minus output is not automatically a loss. Log state, units, timestamps, calibration and uncertainty. Data acquisition should be read-only for learner work and isolated from real safety controls.\n\nProfessional practice boundary: this explanation supports supervised learning and review. It is not an approved design, fabrication instruction, test procedure or operating authorisation. Actual decisions require the applicable code, current local requirements, plant-specific instructions and competent accountable people.", "worked": "Fuel input rises before steam output during warm-up. Account for stored energy before labelling the difference permanent inefficiency.", "q": "What can explain an input-output mismatch during warm-up?", "a": "Increasing stored energy as well as losses", "w": "Proof that conservation of energy has failed", "work": "Worked reasoning: Fuel input rises before steam output during warm-up. Account for stored energy before labelling the difference permanent inefficiency.\n\nPaper workshop: write the claim being evaluated, identify its assumptions and missing evidence, then explain the consequence of the incorrect alternative: \u201cProof that conservation of energy has failed\u201d. Distinguish an arithmetic result from a verified engineering decision. Record the professional role responsible for resolving any uncertainty. Do not perform a live pressure, combustion, electrical or fault experiment.\n\nReview prompt: What can explain an input-output mismatch during warm-up? Explain your reasoning before answering. If the context changes, state which evidence would need to be reassessed.", "why": "Increasing stored energy as well as losses. Energy balances require synchronised measurements and a stated averaging interval. During startup, heat accumulates in metal and water, so input minus output is not automatically a loss. Log state, units, timestamps, calibration and uncertainty. Data acquisition should be read-only for learner work and isolated from real safety controls. The alternative is not justified: Proof that conservation of energy has failed."}], "part": "portfolio"},i=31,id='scenario'+i;

(function(){const H=CG.H,u={"title": "Educational layout and procurement", "lessons": [{"title": "Approved teaching plant boundary", "teach": "A defensible physical teaching installation starts with an approved supplier and professionally assessed site, not a homemade pressure shell. The learning boundary may be simulation, cold-flow demonstration or an authorised commercial plant. Define viewing distances, guards, supervision, training and emergency arrangements before any live demonstration.\n\nProfessional practice boundary: this explanation supports supervised learning and review. It is not an approved design, fabrication instruction, test procedure or operating authorisation. Actual decisions require the applicable code, current local requirements, plant-specific instructions and competent accountable people.", "worked": "A purchase specification requires traceable ratings, documentation, protection, training and local compliance assessment. Cheap hardware without these items is not an equivalent offer.", "q": "What should procurement include beyond the vessel itself?", "a": "Verified documentation, protection, training and site assessment", "w": "Only the lowest advertised price", "work": "Worked reasoning: A purchase specification requires traceable ratings, documentation, protection, training and local compliance assessment. Cheap hardware without these items is not an equivalent offer.\n\nPaper workshop: write the claim being evaluated, identify its assumptions and missing evidence, then explain the consequence of the incorrect alternative: \u201cOnly the lowest advertised price\u201d. Distinguish an arithmetic result from a verified engineering decision. Record the professional role responsible for resolving any uncertainty. Do not perform a live pressure, combustion, electrical or fault experiment.\n\nReview prompt: What should procurement include beyond the vessel itself? Explain your reasoning before answering. If the context changes, state which evidence would need to be reassessed.", "why": "Verified documentation, protection, training and site assessment. A defensible physical teaching installation starts with an approved supplier and professionally assessed site, not a homemade pressure shell. The learning boundary may be simulation, cold-flow demonstration or an authorised commercial plant. Define viewing distances, guards, supervision, training and emergency arrangements before any live demonstration. The alternative is not justified: Only the lowest advertised price."}, {"title": "Plant layout dossier", "teach": "A conceptual layout maps heat source, boiler, feed, expander, generator, condenser, condensate return, treatment and heat rejection. Relief and drain paths, access, electrical boundaries and maintenance space must be visible. A block diagram is not a piping or construction drawing. Qualified designers must resolve the actual installation.\n\nProfessional practice boundary: this explanation supports supervised learning and review. It is not an approved design, fabrication instruction, test procedure or operating authorisation. Actual decisions require the applicable code, current local requirements, plant-specific instructions and competent accountable people.", "worked": "Draw energy arrows separately from material-flow arrows. An electrical output arrow must not hide the much larger rejected-heat flow.", "q": "Is a block layout an approved construction drawing?", "a": "No; it is a conceptual communication tool", "w": "Yes; arrows provide all required fabrication dimensions", "work": "Worked reasoning: Draw energy arrows separately from material-flow arrows. An electrical output arrow must not hide the much larger rejected-heat flow.\n\nPaper workshop: write the claim being evaluated, identify its assumptions and missing evidence, then explain the consequence of the incorrect alternative: \u201cYes; arrows provide all required fabrication dimensions\u201d. Distinguish an arithmetic result from a verified engineering decision. Record the professional role responsible for resolving any uncertainty. Do not perform a live pressure, combustion, electrical or fault experiment.\n\nReview prompt: Is a block layout an approved construction drawing? Explain your reasoning before answering. If the context changes, state which evidence would need to be reassessed.", "why": "No; it is a conceptual communication tool. A conceptual layout maps heat source, boiler, feed, expander, generator, condenser, condensate return, treatment and heat rejection. Relief and drain paths, access, electrical boundaries and maintenance space must be visible. A block diagram is not a piping or construction drawing. Qualified designers must resolve the actual installation. The alternative is not justified: Yes; arrows provide all required fabrication dimensions."}, {"title": "Cost, efficiency and alternatives", "teach": "Small steam-electric systems often have poor electrical efficiency and high inspection, treatment and maintenance overhead. Compare purchased electricity, photovoltaics, direct heat use and combined heat and power on consistent boundaries. Waste heat can change economics, but it does not remove safety obligations. Include labour, downtime, water and lifecycle costs.\n\nProfessional practice boundary: this explanation supports supervised learning and review. It is not an approved design, fabrication instruction, test procedure or operating authorisation. Actual decisions require the applicable code, current local requirements, plant-specific instructions and competent accountable people.", "worked": "A plant produces 1 kW while consuming 20 kW heat and 0.2 kW auxiliaries. Net electricity is 0.8 kW; evaluating only gross output exaggerates usefulness.", "q": "Which output matters for useful exported electricity?", "a": "Gross generation minus auxiliary consumption", "w": "Gross generation plus auxiliary consumption", "work": "Worked reasoning: A plant produces 1 kW while consuming 20 kW heat and 0.2 kW auxiliaries. Net electricity is 0.8 kW; evaluating only gross output exaggerates usefulness.\n\nPaper workshop: write the claim being evaluated, identify its assumptions and missing evidence, then explain the consequence of the incorrect alternative: \u201cGross generation plus auxiliary consumption\u201d. Distinguish an arithmetic result from a verified engineering decision. Record the professional role responsible for resolving any uncertainty. Do not perform a live pressure, combustion, electrical or fault experiment.\n\nReview prompt: Which output matters for useful exported electricity? Explain your reasoning before answering. If the context changes, state which evidence would need to be reassessed.", "why": "Gross generation minus auxiliary consumption. Small steam-electric systems often have poor electrical efficiency and high inspection, treatment and maintenance overhead. Compare purchased electricity, photovoltaics, direct heat use and combined heat and power on consistent boundaries. Waste heat can change economics, but it does not remove safety obligations. Include labour, downtime, water and lifecycle costs. The alternative is not justified: Gross generation plus auxiliary consumption."}], "part": "portfolio"},i=32,id='scenario'+i;

(function(){const H=CG.H,u={"title": "Industrial scale and advanced concepts", "lessons": [{"title": "Economisers and air preheaters", "teach": "Economisers recover heat into feedwater; air preheaters warm combustion air. Recovery can improve efficiency but changes corrosion, condensation, fouling and control issues. Equipment names also matter for some operator licensing classifications. A retrofit affects the entire system and requires engineering review.\n\nProfessional practice boundary: this explanation supports supervised learning and review. It is not an approved design, fabrication instruction, test procedure or operating authorisation. Actual decisions require the applicable code, current local requirements, plant-specific instructions and competent accountable people.", "worked": "A cooler exhaust stream may cross an acid-dewpoint condition for a particular fuel. More recovered heat is not automatically better without corrosion assessment.", "q": "Can heat recovery introduce new degradation risks?", "a": "Yes; temperature and chemistry changes can cause corrosion", "w": "No; lower stack temperature is always harmless", "work": "Worked reasoning: A cooler exhaust stream may cross an acid-dewpoint condition for a particular fuel. More recovered heat is not automatically better without corrosion assessment.\n\nPaper workshop: write the claim being evaluated, identify its assumptions and missing evidence, then explain the consequence of the incorrect alternative: \u201cNo; lower stack temperature is always harmless\u201d. Distinguish an arithmetic result from a verified engineering decision. Record the professional role responsible for resolving any uncertainty. Do not perform a live pressure, combustion, electrical or fault experiment.\n\nReview prompt: Can heat recovery introduce new degradation risks? Explain your reasoning before answering. If the context changes, state which evidence would need to be reassessed.", "why": "Yes; temperature and chemistry changes can cause corrosion. Economisers recover heat into feedwater; air preheaters warm combustion air. Recovery can improve efficiency but changes corrosion, condensation, fouling and control issues. Equipment names also matter for some operator licensing classifications. A retrofit affects the entire system and requires engineering review. The alternative is not justified: No; lower stack temperature is always harmless."}, {"title": "Superheat, reheat and regeneration", "teach": "Superheat raises steam temperature above saturation; reheat adds heat between expansion stages; regeneration uses extracted steam to warm feedwater. These can improve cycle performance but increase complexity, high-temperature material demands and control duties. Not every efficiency improvement is suitable at educational scale.\n\nProfessional practice boundary: this explanation supports supervised learning and review. It is not an approved design, fabrication instruction, test procedure or operating authorisation. Actual decisions require the applicable code, current local requirements, plant-specific instructions and competent accountable people.", "worked": "A regenerative cycle improves ideal efficiency but extraction reduces flow available for later expansion. Compare the full balance rather than counting recovered heat twice.", "q": "Should extracted-steam heat be counted as free additional energy?", "a": "No; extraction changes the cycle work and heat balance", "w": "Yes; internal heat recovery creates new energy", "work": "Worked reasoning: A regenerative cycle improves ideal efficiency but extraction reduces flow available for later expansion. Compare the full balance rather than counting recovered heat twice.\n\nPaper workshop: write the claim being evaluated, identify its assumptions and missing evidence, then explain the consequence of the incorrect alternative: \u201cYes; internal heat recovery creates new energy\u201d. Distinguish an arithmetic result from a verified engineering decision. Record the professional role responsible for resolving any uncertainty. Do not perform a live pressure, combustion, electrical or fault experiment.\n\nReview prompt: Should extracted-steam heat be counted as free additional energy? Explain your reasoning before answering. If the context changes, state which evidence would need to be reassessed.", "why": "No; extraction changes the cycle work and heat balance. Superheat raises steam temperature above saturation; reheat adds heat between expansion stages; regeneration uses extracted steam to warm feedwater. These can improve cycle performance but increase complexity, high-temperature material demands and control duties. Not every efficiency improvement is suitable at educational scale. The alternative is not justified: Yes; internal heat recovery creates new energy."}, {"title": "Industrial risk and organisational learning", "teach": "Large plants add high-energy inventories, complex interfaces, maintenance coordination and human-factor challenges. Permit-to-work, management of change, competency and incident learning are essential alongside hardware. Lessons from industrial accidents inform small installations too, but scaling changes the details. A single checklist cannot cover every plant.\n\nProfessional practice boundary: this explanation supports supervised learning and review. It is not an approved design, fabrication instruction, test procedure or operating authorisation. Actual decisions require the applicable code, current local requirements, plant-specific instructions and competent accountable people.", "worked": "A protection modification appears minor but shares a new power source with another safety function. Management of change must revisit common-cause failures.", "q": "What should a protection-system modification trigger?", "a": "Formal change control and hazard reassessment", "w": "Only a label change on the panel", "work": "Worked reasoning: A protection modification appears minor but shares a new power source with another safety function. Management of change must revisit common-cause failures.\n\nPaper workshop: write the claim being evaluated, identify its assumptions and missing evidence, then explain the consequence of the incorrect alternative: \u201cOnly a label change on the panel\u201d. Distinguish an arithmetic result from a verified engineering decision. Record the professional role responsible for resolving any uncertainty. Do not perform a live pressure, combustion, electrical or fault experiment.\n\nReview prompt: What should a protection-system modification trigger? Explain your reasoning before answering. If the context changes, state which evidence would need to be reassessed.", "why": "Formal change control and hazard reassessment. Large plants add high-energy inventories, complex interfaces, maintenance coordination and human-factor challenges. Permit-to-work, management of change, competency and incident learning are essential alongside hardware. Lessons from industrial accidents inform small installations too, but scaling changes the details. A single checklist cannot cover every plant. The alternative is not justified: Only a label change on the panel."}], "part": "portfolio"},i=33,id='scenario'+i;
