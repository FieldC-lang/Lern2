(function(){const H=CG.H,u={"title": "Choosing boiler architectures", "lessons": [{"title": "Fire-tube boilers", "teach": "Hot combustion gas travels within tubes surrounded by water. Shell water inventory can provide thermal buffering but also contributes to stored-energy consequence. Tube sheets, tube attachment and furnace collapse are design concerns; cleaning access and water treatment affect life. A historical appearance does not make a copied vessel an approved design.\n\nProfessional practice boundary: this explanation supports supervised learning and review. It is not an approved design, fabrication instruction, test procedure or operating authorisation. Actual decisions require the applicable code, current local requirements, plant-specific instructions and competent accountable people.", "worked": "Compare two concepts for a classroom dossier: a fire-tube shell has accessible gas paths but substantial hot-water inventory. Record both benefits and hazards, rather than calling one arrangement universally safest.", "q": "What is inside the tubes of a fire-tube boiler?", "a": "Hot gas", "w": "Feedwater exclusively", "work": "Worked reasoning: Compare two concepts for a classroom dossier: a fire-tube shell has accessible gas paths but substantial hot-water inventory. Record both benefits and hazards, rather than calling one arrangement universally safest.\n\nPaper workshop: write the claim being evaluated, identify its assumptions and missing evidence, then explain the consequence of the incorrect alternative: \u201cFeedwater exclusively\u201d. Distinguish an arithmetic result from a verified engineering decision. Record the professional role responsible for resolving any uncertainty. Do not perform a live pressure, combustion, electrical or fault experiment.\n\nReview prompt: What is inside the tubes of a fire-tube boiler? Explain your reasoning before answering. If the context changes, state which evidence would need to be reassessed.", "why": "Hot gas. Hot combustion gas travels within tubes surrounded by water. Shell water inventory can provide thermal buffering but also contributes to stored-energy consequence. Tube sheets, tube attachment and furnace collapse are design concerns; cleaning access and water treatment affect life. A historical appearance does not make a copied vessel an approved design. The alternative is not justified: Feedwater exclusively."}, {"title": "Water-tube boilers", "teach": "Water and steam pass through tubes heated externally. Drums, headers and circulation paths organise separation and flow. Natural circulation depends on density difference and hydraulic resistance, while forced circulation requires pumps and reliable protection. Smaller tube inventories do not remove failure, flame or pressure hazards.\n\nProfessional practice boundary: this explanation supports supervised learning and review. It is not an approved design, fabrication instruction, test procedure or operating authorisation. Actual decisions require the applicable code, current local requirements, plant-specific instructions and competent accountable people.", "worked": "A proposed circulation path has high local resistance. A designer must verify stable cooling flow; simply increasing firing can worsen overheating.", "q": "What sustains natural circulation in suitable water-tube designs?", "a": "Density differences acting against flow resistance", "w": "A guarantee that all tube paths cool equally", "work": "Worked reasoning: A proposed circulation path has high local resistance. A designer must verify stable cooling flow; simply increasing firing can worsen overheating.\n\nPaper workshop: write the claim being evaluated, identify its assumptions and missing evidence, then explain the consequence of the incorrect alternative: \u201cA guarantee that all tube paths cool equally\u201d. Distinguish an arithmetic result from a verified engineering decision. Record the professional role responsible for resolving any uncertainty. Do not perform a live pressure, combustion, electrical or fault experiment.\n\nReview prompt: What sustains natural circulation in suitable water-tube designs? Explain your reasoning before answering. If the context changes, state which evidence would need to be reassessed.", "why": "Density differences acting against flow resistance. Water and steam pass through tubes heated externally. Drums, headers and circulation paths organise separation and flow. Natural circulation depends on density difference and hydraulic resistance, while forced circulation requires pumps and reliable protection. Smaller tube inventories do not remove failure, flame or pressure hazards. The alternative is not justified: A guarantee that all tube paths cool equally."}, {"title": "Once-through, vertical and horizontal", "teach": "Once-through arrangements heat feedwater along a path without a large separation drum and require close feed-flow and heat-input coordination. Vertical and horizontal describe orientation, not a complete safety classification. Choose a configuration using duty, turndown, maintenance access, water chemistry and code scope, not just compactness.\n\nProfessional practice boundary: this explanation supports supervised learning and review. It is not an approved design, fabrication instruction, test procedure or operating authorisation. Actual decisions require the applicable code, current local requirements, plant-specific instructions and competent accountable people.", "worked": "An intermittent load and limited operator resources may make a tightly controlled once-through concept unsuitable despite its small footprint. A qualified supplier should evaluate the duty.", "q": "Does a once-through boiler eliminate the need for flow protection?", "a": "No; heat and feed flow require coordinated protection", "w": "Yes; no drum means no overheating risk", "work": "Worked reasoning: An intermittent load and limited operator resources may make a tightly controlled once-through concept unsuitable despite its small footprint. A qualified supplier should evaluate the duty.\n\nPaper workshop: write the claim being evaluated, identify its assumptions and missing evidence, then explain the consequence of the incorrect alternative: \u201cYes; no drum means no overheating risk\u201d. Distinguish an arithmetic result from a verified engineering decision. Record the professional role responsible for resolving any uncertainty. Do not perform a live pressure, combustion, electrical or fault experiment.\n\nReview prompt: Does a once-through boiler eliminate the need for flow protection? Explain your reasoning before answering. If the context changes, state which evidence would need to be reassessed.", "why": "No; heat and feed flow require coordinated protection. Once-through arrangements heat feedwater along a path without a large separation drum and require close feed-flow and heat-input coordination. Vertical and horizontal describe orientation, not a complete safety classification. Choose a configuration using duty, turndown, maintenance access, water chemistry and code scope, not just compactness. The alternative is not justified: Yes; no drum means no overheating risk."}], "part": "scope"},i=6,id='scenario'+i;

(function(){const H=CG.H,u={"title": "Codes, law and accountable roles", "lessons": [{"title": "Pressure equipment code families", "teach": "ASME Section I addresses power boilers within its scope; other pressure equipment may fall under different sections or standards. Australian pressure equipment frameworks include AS/NZS 1200, AS 1228 and hazard classification under AS 4343. Editions, legal adoption and applicability must be checked by the project professionals. This course paraphrases general themes, not copyrighted requirements or a compliance determination.\n\nProfessional practice boundary: this explanation supports supervised learning and review. It is not an approved design, fabrication instruction, test procedure or operating authorisation. Actual decisions require the applicable code, current local requirements, plant-specific instructions and competent accountable people.", "worked": "A team cites a pressure-vessel code without checking whether it covers the proposed fired boiler. The code selection remains unresolved until scope and jurisdiction are confirmed.", "q": "What comes before applying a code formula?", "a": "Confirm code scope, edition and jurisdiction", "w": "Choose whichever formula gives the thinnest wall", "work": "Worked reasoning: A team cites a pressure-vessel code without checking whether it covers the proposed fired boiler. The code selection remains unresolved until scope and jurisdiction are confirmed.\n\nPaper workshop: write the claim being evaluated, identify its assumptions and missing evidence, then explain the consequence of the incorrect alternative: \u201cChoose whichever formula gives the thinnest wall\u201d. Distinguish an arithmetic result from a verified engineering decision. Record the professional role responsible for resolving any uncertainty. Do not perform a live pressure, combustion, electrical or fault experiment.\n\nReview prompt: What comes before applying a code formula? Explain your reasoning before answering. If the context changes, state which evidence would need to be reassessed.", "why": "Confirm code scope, edition and jurisdiction. ASME Section I addresses power boilers within its scope; other pressure equipment may fall under different sections or standards. Australian pressure equipment frameworks include AS/NZS 1200, AS 1228 and hazard classification under AS 4343. Editions, legal adoption and applicability must be checked by the project professionals. This course paraphrases general themes, not copyrighted requirements or a compliance determination. The alternative is not justified: Choose whichever formula gives the thinnest wall."}, {"title": "Queensland registration and licensing", "teach": "Plant design registration and registration of an individual item are separate obligations. Queensland public guidance identifies pressure-equipment design and boiler item categories using hazard levels, with exclusions and details requiring current verification. Boiler, reciprocating steam engine and turbine operation can involve distinct high-risk work licence classes. A small size or an educational purpose is not a blanket exemption.\n\nProfessional practice boundary: this explanation supports supervised learning and review. It is not an approved design, fabrication instruction, test procedure or operating authorisation. Actual decisions require the applicable code, current local requirements, plant-specific instructions and competent accountable people.", "worked": "A design registration number is present but no item-registration assessment is recorded. The owner must resolve the separate item duty, not infer permission from the drawing number.", "q": "Does design registration automatically settle individual plant registration?", "a": "No; they are separate requirements to assess", "w": "Yes; they are the same approval", "work": "Worked reasoning: A design registration number is present but no item-registration assessment is recorded. The owner must resolve the separate item duty, not infer permission from the drawing number.\n\nPaper workshop: write the claim being evaluated, identify its assumptions and missing evidence, then explain the consequence of the incorrect alternative: \u201cYes; they are the same approval\u201d. Distinguish an arithmetic result from a verified engineering decision. Record the professional role responsible for resolving any uncertainty. Do not perform a live pressure, combustion, electrical or fault experiment.\n\nReview prompt: Does design registration automatically settle individual plant registration? Explain your reasoning before answering. If the context changes, state which evidence would need to be reassessed.", "why": "No; they are separate requirements to assess. Plant design registration and registration of an individual item are separate obligations. Queensland public guidance identifies pressure-equipment design and boiler item categories using hazard levels, with exclusions and details requiring current verification. Boiler, reciprocating steam engine and turbine operation can involve distinct high-risk work licence classes. A small size or an educational purpose is not a blanket exemption. The alternative is not justified: Yes; they are the same approval."}, {"title": "Competency, duties and documentation", "teach": "The designer establishes an approved basis, the manufacturer follows qualified procedures, inspectors witness specified stages, and the owner maintains safe systems over the life cycle. Electrical, fuel-gas, building, fire, environmental and grid-connection obligations may also apply. Independent checking and licensed trade work cannot be replaced by a course badge.\n\nProfessional practice boundary: this explanation supports supervised learning and review. It is not an approved design, fabrication instruction, test procedure or operating authorisation. Actual decisions require the applicable code, current local requirements, plant-specific instructions and competent accountable people.", "worked": "Build a responsibility matrix naming who signs design verification, welding records, electrical commissioning and operator training. Blank signatures are unresolved work, not implied approval.", "q": "What does completing this course authorise?", "a": "Further supervised learning, not regulated work", "w": "Independent fabrication and operation of any boiler", "work": "Worked reasoning: Build a responsibility matrix naming who signs design verification, welding records, electrical commissioning and operator training. Blank signatures are unresolved work, not implied approval.\n\nPaper workshop: write the claim being evaluated, identify its assumptions and missing evidence, then explain the consequence of the incorrect alternative: \u201cIndependent fabrication and operation of any boiler\u201d. Distinguish an arithmetic result from a verified engineering decision. Record the professional role responsible for resolving any uncertainty. Do not perform a live pressure, combustion, electrical or fault experiment.\n\nReview prompt: What does completing this course authorise? Explain your reasoning before answering. If the context changes, state which evidence would need to be reassessed.", "why": "Further supervised learning, not regulated work. The designer establishes an approved basis, the manufacturer follows qualified procedures, inspectors witness specified stages, and the owner maintains safe systems over the life cycle. Electrical, fuel-gas, building, fire, environmental and grid-connection obligations may also apply. Independent checking and licensed trade work cannot be replaced by a course badge. The alternative is not justified: Independent fabrication and operation of any boiler."}], "part": "design"},i=7,id='scenario'+i;

(function(){const H=CG.H,u={"title": "Design basis before drawings", "lessons": [{"title": "Duty envelope and requirements", "teach": "A design basis states fluid, design pressure and temperature, expected loads, cycles, location, corrosion assumptions and foreseeable abnormal conditions. Operating pressure is not automatically the design pressure. The maximum allowable working pressure is established through applicable rules and verified construction, not chosen from a desired gauge reading. Interfaces and future changes belong in the requirements register.\n\nProfessional practice boundary: this explanation supports supervised learning and review. It is not an approved design, fabrication instruction, test procedure or operating authorisation. Actual decisions require the applicable code, current local requirements, plant-specific instructions and competent accountable people.", "worked": "A proposal lists nominal output but omits load rejection and blocked-outlet conditions. Its design basis is incomplete even if steady-state energy arithmetic is correct.", "q": "Which conditions belong in the design basis?", "a": "Normal operation and foreseeable abnormal conditions", "w": "Only the preferred steady operating point", "work": "Worked reasoning: A proposal lists nominal output but omits load rejection and blocked-outlet conditions. Its design basis is incomplete even if steady-state energy arithmetic is correct.\n\nPaper workshop: write the claim being evaluated, identify its assumptions and missing evidence, then explain the consequence of the incorrect alternative: \u201cOnly the preferred steady operating point\u201d. Distinguish an arithmetic result from a verified engineering decision. Record the professional role responsible for resolving any uncertainty. Do not perform a live pressure, combustion, electrical or fault experiment.\n\nReview prompt: Which conditions belong in the design basis? Explain your reasoning before answering. If the context changes, state which evidence would need to be reassessed.", "why": "Normal operation and foreseeable abnormal conditions. A design basis states fluid, design pressure and temperature, expected loads, cycles, location, corrosion assumptions and foreseeable abnormal conditions. Operating pressure is not automatically the design pressure. The maximum allowable working pressure is established through applicable rules and verified construction, not chosen from a desired gauge reading. Interfaces and future changes belong in the requirements register. The alternative is not justified: Only the preferred steady operating point."}, {"title": "Hazard studies and protection layers", "teach": "HAZOP-style review asks how deviations such as no flow, high pressure, low water or reverse flow arise and propagate. A protection layer needs an independent function and evidence of effectiveness; two alarms on one failed sensor are not two independent safeguards. Common-cause failure and human factors require explicit review.\n\nProfessional practice boundary: this explanation supports supervised learning and review. It is not an approved design, fabrication instruction, test procedure or operating authorisation. Actual decisions require the applicable code, current local requirements, plant-specific instructions and competent accountable people.", "worked": "One level transmitter controls feed and provides the only low-water trip. Sensor failure can defeat both functions; an independent protection assessment is required.", "q": "Why might two functions on one sensor not be independent?", "a": "One sensor failure can defeat both", "w": "Different screen colours make them independent", "work": "Worked reasoning: One level transmitter controls feed and provides the only low-water trip. Sensor failure can defeat both functions; an independent protection assessment is required.\n\nPaper workshop: write the claim being evaluated, identify its assumptions and missing evidence, then explain the consequence of the incorrect alternative: \u201cDifferent screen colours make them independent\u201d. Distinguish an arithmetic result from a verified engineering decision. Record the professional role responsible for resolving any uncertainty. Do not perform a live pressure, combustion, electrical or fault experiment.\n\nReview prompt: Why might two functions on one sensor not be independent? Explain your reasoning before answering. If the context changes, state which evidence would need to be reassessed.", "why": "One sensor failure can defeat both. HAZOP-style review asks how deviations such as no flow, high pressure, low water or reverse flow arise and propagate. A protection layer needs an independent function and evidence of effectiveness; two alarms on one failed sensor are not two independent safeguards. Common-cause failure and human factors require explicit review. The alternative is not justified: Different screen colours make them independent."}, {"title": "Layout and maintainability", "teach": "Access for inspection, relief discharge, escape, lifting, cleaning, drainage and replacement determines whether a plant remains safe. Separate people from hot surfaces, fuel systems, rotating equipment and discharge zones. Ventilation, foundations, weather, flooding, noise and fire separation are site-specific design inputs. A compact layout must not hide essential equipment.\n\nProfessional practice boundary: this explanation supports supervised learning and review. It is not an approved design, fabrication instruction, test procedure or operating authorisation. Actual decisions require the applicable code, current local requirements, plant-specific instructions and competent accountable people.", "worked": "A proposed relief discharge ends beside an escape door. Routing must be redesigned by competent people rather than relying on a warning sign.", "q": "What should a relief discharge avoid?", "a": "Exposing people or blocking safe escape", "w": "Any route except the shortest possible one", "work": "Worked reasoning: A proposed relief discharge ends beside an escape door. Routing must be redesigned by competent people rather than relying on a warning sign.\n\nPaper workshop: write the claim being evaluated, identify its assumptions and missing evidence, then explain the consequence of the incorrect alternative: \u201cAny route except the shortest possible one\u201d. Distinguish an arithmetic result from a verified engineering decision. Record the professional role responsible for resolving any uncertainty. Do not perform a live pressure, combustion, electrical or fault experiment.\n\nReview prompt: What should a relief discharge avoid? Explain your reasoning before answering. If the context changes, state which evidence would need to be reassessed.", "why": "Exposing people or blocking safe escape. Access for inspection, relief discharge, escape, lifting, cleaning, drainage and replacement determines whether a plant remains safe. Separate people from hot surfaces, fuel systems, rotating equipment and discharge zones. Ventilation, foundations, weather, flooding, noise and fire separation are site-specific design inputs. A compact layout must not hide essential equipment. The alternative is not justified: Any route except the shortest possible one."}], "part": "design"},i=8,id='scenario'+i;

(function(){const H=CG.H,u={"title": "Materials and degradation", "lessons": [{"title": "Material selection and traceability", "teach": "Pressure-retaining material needs a specification, allowable properties at temperature, verified identity and traceable certificates. Scrap identity, appearance or a room-temperature tensile figure is not sufficient. Weldability, toughness, creep resistance and compatibility with water chemistry all matter. A material substitution is a controlled design change.\n\nProfessional practice boundary: this explanation supports supervised learning and review. It is not an approved design, fabrication instruction, test procedure or operating authorisation. Actual decisions require the applicable code, current local requirements, plant-specific instructions and competent accountable people.", "worked": "A plate arrives without traceability. Quarantine it pending documented resolution rather than stamping the intended grade onto it.", "q": "What establishes pressure-material identity?", "a": "Traceable specification and verified records", "w": "Surface colour and a magnet test alone", "work": "Worked reasoning: A plate arrives without traceability. Quarantine it pending documented resolution rather than stamping the intended grade onto it.\n\nPaper workshop: write the claim being evaluated, identify its assumptions and missing evidence, then explain the consequence of the incorrect alternative: \u201cSurface colour and a magnet test alone\u201d. Distinguish an arithmetic result from a verified engineering decision. Record the professional role responsible for resolving any uncertainty. Do not perform a live pressure, combustion, electrical or fault experiment.\n\nReview prompt: What establishes pressure-material identity? Explain your reasoning before answering. If the context changes, state which evidence would need to be reassessed.", "why": "Traceable specification and verified records. Pressure-retaining material needs a specification, allowable properties at temperature, verified identity and traceable certificates. Scrap identity, appearance or a room-temperature tensile figure is not sufficient. Weldability, toughness, creep resistance and compatibility with water chemistry all matter. A material substitution is a controlled design change. The alternative is not justified: Surface colour and a magnet test alone."}, {"title": "Corrosion, erosion and remaining life", "teach": "Oxygen pitting, under-deposit attack, flow-accelerated corrosion and erosion remove material in different patterns. Average wall thickness can conceal local pits. Corrosion allowance anticipates a defined mechanism; it does not excuse unknown chemistry or continuing rapid damage. Remaining-life assessments require competent inspection, suitable methods and load history.\n\nProfessional practice boundary: this explanation supports supervised learning and review. It is not an approved design, fabrication instruction, test procedure or operating authorisation. Actual decisions require the applicable code, current local requirements, plant-specific instructions and competent accountable people.", "worked": "An average thickness looks acceptable but one local pit is deep. The local defect requires assessment; averaging it away loses the limiting condition.", "q": "Can an average thickness dismiss a deep local pit?", "a": "No; local damage must be assessed", "w": "Yes; averages always govern pressure safety", "work": "Worked reasoning: An average thickness looks acceptable but one local pit is deep. The local defect requires assessment; averaging it away loses the limiting condition.\n\nPaper workshop: write the claim being evaluated, identify its assumptions and missing evidence, then explain the consequence of the incorrect alternative: \u201cYes; averages always govern pressure safety\u201d. Distinguish an arithmetic result from a verified engineering decision. Record the professional role responsible for resolving any uncertainty. Do not perform a live pressure, combustion, electrical or fault experiment.\n\nReview prompt: Can an average thickness dismiss a deep local pit? Explain your reasoning before answering. If the context changes, state which evidence would need to be reassessed.", "why": "No; local damage must be assessed. Oxygen pitting, under-deposit attack, flow-accelerated corrosion and erosion remove material in different patterns. Average wall thickness can conceal local pits. Corrosion allowance anticipates a defined mechanism; it does not excuse unknown chemistry or continuing rapid damage. Remaining-life assessments require competent inspection, suitable methods and load history. The alternative is not justified: Yes; averages always govern pressure safety."}, {"title": "Temperature, creep and embrittlement", "teach": "Material strength changes with temperature; prolonged high-temperature stress can produce creep. Thermal fatigue, brittle fracture susceptibility and environmental damage require more than a static strength check. Old plate and riveted equipment may have unknown toughness or repair history. Heritage operation still requires competent fitness-for-service decisions.\n\nProfessional practice boundary: this explanation supports supervised learning and review. It is not an approved design, fabrication instruction, test procedure or operating authorisation. Actual decisions require the applicable code, current local requirements, plant-specific instructions and competent accountable people.", "worked": "A heated component passes a room-temperature strength comparison. That result alone does not cover high-temperature allowable stress or long-term damage.", "q": "Is room-temperature strength sufficient for hot pressure equipment?", "a": "No; temperature-dependent behaviour must be considered", "w": "Yes; steel strength is independent of temperature", "work": "Worked reasoning: A heated component passes a room-temperature strength comparison. That result alone does not cover high-temperature allowable stress or long-term damage.\n\nPaper workshop: write the claim being evaluated, identify its assumptions and missing evidence, then explain the consequence of the incorrect alternative: \u201cYes; steel strength is independent of temperature\u201d. Distinguish an arithmetic result from a verified engineering decision. Record the professional role responsible for resolving any uncertainty. Do not perform a live pressure, combustion, electrical or fault experiment.\n\nReview prompt: Is room-temperature strength sufficient for hot pressure equipment? Explain your reasoning before answering. If the context changes, state which evidence would need to be reassessed.", "why": "No; temperature-dependent behaviour must be considered. Material strength changes with temperature; prolonged high-temperature stress can produce creep. Thermal fatigue, brittle fracture susceptibility and environmental damage require more than a static strength check. Old plate and riveted equipment may have unknown toughness or repair history. Heritage operation still requires competent fitness-for-service decisions. The alternative is not justified: Yes; steel strength is independent of temperature."}], "part": "design"},i=9,id='scenario'+i;

(function(){const H=CG.H,u={"title": "Pressure stresses as educational models", "lessons": [{"title": "Thin-cylinder stress", "teach": "For a closed thin cylindrical shell under uniform internal differential pressure, membrane hoop stress is approximately pD/(2t), with longitudinal stress about half that value. Use consistent units and an appropriate mean-diameter approximation. The model omits openings, joints, bending, buckling, local loads and code factors. It is not a fabrication-sizing rule.\n\nProfessional practice boundary: this explanation supports supervised learning and review. It is not an approved design, fabrication instruction, test procedure or operating authorisation. Actual decisions require the applicable code, current local requirements, plant-specific instructions and competent accountable people.", "worked": "A fictional shell with p=1 MPa, D=200 mm and t=10 mm gives hoop stress 10 MPa. This arithmetic says nothing about approval of an actual shell.", "q": "Which membrane stress is larger in the ideal closed thin cylinder?", "a": "Hoop stress, about twice longitudinal stress", "w": "Longitudinal stress, about twice hoop stress", "work": "Worked reasoning: A fictional shell with p=1 MPa, D=200 mm and t=10 mm gives hoop stress 10 MPa. This arithmetic says nothing about approval of an actual shell.\n\nPaper workshop: write the claim being evaluated, identify its assumptions and missing evidence, then explain the consequence of the incorrect alternative: \u201cLongitudinal stress, about twice hoop stress\u201d. Distinguish an arithmetic result from a verified engineering decision. Record the professional role responsible for resolving any uncertainty. Do not perform a live pressure, combustion, electrical or fault experiment.\n\nReview prompt: Which membrane stress is larger in the ideal closed thin cylinder? Explain your reasoning before answering. If the context changes, state which evidence would need to be reassessed.", "why": "Hoop stress, about twice longitudinal stress. For a closed thin cylindrical shell under uniform internal differential pressure, membrane hoop stress is approximately pD/(2t), with longitudinal stress about half that value. Use consistent units and an appropriate mean-diameter approximation. The model omits openings, joints, bending, buckling, local loads and code factors. It is not a fabrication-sizing rule. The alternative is not justified: Longitudinal stress, about twice hoop stress."}, {"title": "Thickness estimates and their limits", "teach": "A rearranged teaching equation t=pD/(2SE)+c uses assumed allowable stress S, illustrative joint efficiency E and corrosion allowance c. Actual code equations and allowable values differ and may include additional pressure terms and conditions. This estimate must never be used as a cut list or minimum wall for a real boiler.\n\nProfessional practice boundary: this explanation supports supervised learning and review. It is not an approved design, fabrication instruction, test procedure or operating authorisation. Actual decisions require the applicable code, current local requirements, plant-specific instructions and competent accountable people.", "worked": "For synthetic p=1 MPa, D=200 mm, S=50 MPa, E=1 and c=1 mm, the estimate is 3 mm. The arithmetic output is not an approved wall thickness.", "q": "What does the simplified estimate establish?", "a": "Only a classroom sensitivity result", "w": "A certified minimum fabrication thickness", "work": "Worked reasoning: For synthetic p=1 MPa, D=200 mm, S=50 MPa, E=1 and c=1 mm, the estimate is 3 mm. The arithmetic output is not an approved wall thickness.\n\nPaper workshop: write the claim being evaluated, identify its assumptions and missing evidence, then explain the consequence of the incorrect alternative: \u201cA certified minimum fabrication thickness\u201d. Distinguish an arithmetic result from a verified engineering decision. Record the professional role responsible for resolving any uncertainty. Do not perform a live pressure, combustion, electrical or fault experiment.\n\nReview prompt: What does the simplified estimate establish? Explain your reasoning before answering. If the context changes, state which evidence would need to be reassessed.", "why": "Only a classroom sensitivity result. A rearranged teaching equation t=pD/(2SE)+c uses assumed allowable stress S, illustrative joint efficiency E and corrosion allowance c. Actual code equations and allowable values differ and may include additional pressure terms and conditions. This estimate must never be used as a cut list or minimum wall for a real boiler. The alternative is not justified: A certified minimum fabrication thickness."}, {"title": "Openings, heads and external pressure", "teach": "Nozzles interrupt membrane stress paths; flat plates bend; formed heads have geometry-specific behaviour. Stays, ligaments, reinforcement, weld details and local loads need applicable design rules. A vacuum can buckle a vessel or pipe even when internal-pressure strength is ample. A cylinder formula cannot assess these conditions.\n\nProfessional practice boundary: this explanation supports supervised learning and review. It is not an approved design, fabrication instruction, test procedure or operating authorisation. Actual decisions require the applicable code, current local requirements, plant-specific instructions and competent accountable people.", "worked": "A condenser tolerates positive pressure on paper but lacks vacuum assessment. It remains unsuitable until external-pressure stability and all other duties are verified.", "q": "Can internal-pressure hoop arithmetic verify vacuum buckling?", "a": "No; external-pressure stability needs a different assessment", "w": "Yes; replace pressure by a negative number", "work": "Worked reasoning: A condenser tolerates positive pressure on paper but lacks vacuum assessment. It remains unsuitable until external-pressure stability and all other duties are verified.\n\nPaper workshop: write the claim being evaluated, identify its assumptions and missing evidence, then explain the consequence of the incorrect alternative: \u201cYes; replace pressure by a negative number\u201d. Distinguish an arithmetic result from a verified engineering decision. Record the professional role responsible for resolving any uncertainty. Do not perform a live pressure, combustion, electrical or fault experiment.\n\nReview prompt: Can internal-pressure hoop arithmetic verify vacuum buckling? Explain your reasoning before answering. If the context changes, state which evidence would need to be reassessed.", "why": "No; external-pressure stability needs a different assessment. Nozzles interrupt membrane stress paths; flat plates bend; formed heads have geometry-specific behaviour. Stays, ligaments, reinforcement, weld details and local loads need applicable design rules. A vacuum can buckle a vessel or pipe even when internal-pressure strength is ample. A cylinder formula cannot assess these conditions. The alternative is not justified: Yes; replace pressure by a negative number."}], "part": "design"},i=10,id='scenario'+i;

(function(){const H=CG.H,u={"title": "Joints and fabrication control", "lessons": [{"title": "Welded joint qualification", "teach": "A welding procedure specification defines an approved process window supported by qualification evidence. Welders require relevant qualifications, and production conditions must remain within the approved envelope. Joint preparation, consumables, heat input, preheat and heat treatment affect integrity. This course does not provide a weld recipe for pressure-retaining construction.\n\nProfessional practice boundary: this explanation supports supervised learning and review. It is not an approved design, fabrication instruction, test procedure or operating authorisation. Actual decisions require the applicable code, current local requirements, plant-specific instructions and competent accountable people.", "worked": "A welder is qualified but the proposed procedure has no relevant qualification support. Personnel skill alone does not validate the procedure.", "q": "What is required besides a qualified welder?", "a": "A suitable qualified procedure and controlled execution", "w": "Only a visually smooth bead", "work": "Worked reasoning: A welder is qualified but the proposed procedure has no relevant qualification support. Personnel skill alone does not validate the procedure.\n\nPaper workshop: write the claim being evaluated, identify its assumptions and missing evidence, then explain the consequence of the incorrect alternative: \u201cOnly a visually smooth bead\u201d. Distinguish an arithmetic result from a verified engineering decision. Record the professional role responsible for resolving any uncertainty. Do not perform a live pressure, combustion, electrical or fault experiment.\n\nReview prompt: What is required besides a qualified welder? Explain your reasoning before answering. If the context changes, state which evidence would need to be reassessed.", "why": "A suitable qualified procedure and controlled execution. A welding procedure specification defines an approved process window supported by qualification evidence. Welders require relevant qualifications, and production conditions must remain within the approved envelope. Joint preparation, consumables, heat input, preheat and heat treatment affect integrity. This course does not provide a weld recipe for pressure-retaining construction. The alternative is not justified: Only a visually smooth bead."}, {"title": "Rivets, brazing and historical construction", "teach": "Riveted seams carry loads through plates and fasteners and can develop crevice corrosion and hidden cracking. Brazed and soldered joints have temperature- and material-dependent limitations. Historical examples are not interchangeable with current approved construction. Neither domestic plumbing fittings nor a hobby joint recipe establishes boiler suitability.\n\nProfessional practice boundary: this explanation supports supervised learning and review. It is not an approved design, fabrication instruction, test procedure or operating authorisation. Actual decisions require the applicable code, current local requirements, plant-specific instructions and competent accountable people.", "worked": "A copied historical seam lacks material records and design assessment. Treat it as an unresolved engineering proposal, not proven by its age.", "q": "Does a historic example prove a copied joint is suitable?", "a": "No; the actual design and construction need assessment", "w": "Yes; survival of one example certifies all copies", "work": "Worked reasoning: A copied historical seam lacks material records and design assessment. Treat it as an unresolved engineering proposal, not proven by its age.\n\nPaper workshop: write the claim being evaluated, identify its assumptions and missing evidence, then explain the consequence of the incorrect alternative: \u201cYes; survival of one example certifies all copies\u201d. Distinguish an arithmetic result from a verified engineering decision. Record the professional role responsible for resolving any uncertainty. Do not perform a live pressure, combustion, electrical or fault experiment.\n\nReview prompt: Does a historic example prove a copied joint is suitable? Explain your reasoning before answering. If the context changes, state which evidence would need to be reassessed.", "why": "No; the actual design and construction need assessment. Riveted seams carry loads through plates and fasteners and can develop crevice corrosion and hidden cracking. Brazed and soldered joints have temperature- and material-dependent limitations. Historical examples are not interchangeable with current approved construction. Neither domestic plumbing fittings nor a hobby joint recipe establishes boiler suitability. The alternative is not justified: Yes; survival of one example certifies all copies."}, {"title": "Distortion, inspection access and non-pressure practice", "teach": "Fabrication sequence affects residual stress, alignment and accessibility for examination. Inspection hold points must occur before later work hides joints. Learners may practise on clearly marked non-pressure mock-ups under appropriate workshop supervision; those coupons are not boiler components. Converting a practice piece into pressure service requires the full approved process.\n\nProfessional practice boundary: this explanation supports supervised learning and review. It is not an approved design, fabrication instruction, test procedure or operating authorisation. Actual decisions require the applicable code, current local requirements, plant-specific instructions and competent accountable people.", "worked": "A nozzle weld will become inaccessible after fitting an outer component. The inspection plan must schedule required examination before concealment.", "q": "When should examination of a soon-hidden joint occur?", "a": "At its approved hold point before concealment", "w": "After commissioning when leakage appears", "work": "Worked reasoning: A nozzle weld will become inaccessible after fitting an outer component. The inspection plan must schedule required examination before concealment.\n\nPaper workshop: write the claim being evaluated, identify its assumptions and missing evidence, then explain the consequence of the incorrect alternative: \u201cAfter commissioning when leakage appears\u201d. Distinguish an arithmetic result from a verified engineering decision. Record the professional role responsible for resolving any uncertainty. Do not perform a live pressure, combustion, electrical or fault experiment.\n\nReview prompt: When should examination of a soon-hidden joint occur? Explain your reasoning before answering. If the context changes, state which evidence would need to be reassessed.", "why": "At its approved hold point before concealment. Fabrication sequence affects residual stress, alignment and accessibility for examination. Inspection hold points must occur before later work hides joints. Learners may practise on clearly marked non-pressure mock-ups under appropriate workshop supervision; those coupons are not boiler components. Converting a practice piece into pressure service requires the full approved process. The alternative is not justified: After commissioning when leakage appears."}], "part": "design"},i=11,id='scenario'+i;

(function(){const H=CG.H,u={"title": "Quality assurance and inspection", "lessons": [{"title": "Inspection and test plans", "teach": "An ITP links each manufacturing step to acceptance criteria, records and witness or hold points. Material identity, joint preparation, welding records, examinations, dimensional checks and pressure testing form a traceable chain. A missed hold point is a nonconformance requiring formal disposition, not a paperwork inconvenience.\n\nProfessional practice boundary: this explanation supports supervised learning and review. It is not an approved design, fabrication instruction, test procedure or operating authorisation. Actual decisions require the applicable code, current local requirements, plant-specific instructions and competent accountable people.", "worked": "The fabrication dossier lacks the required material transfer record after cutting plate. Resolve traceability before claiming the completed vessel matches the design.", "q": "How should a missed hold point be treated?", "a": "As a nonconformance needing authorised disposition", "w": "As automatically passed if the vessel looks sound", "work": "Worked reasoning: The fabrication dossier lacks the required material transfer record after cutting plate. Resolve traceability before claiming the completed vessel matches the design.\n\nPaper workshop: write the claim being evaluated, identify its assumptions and missing evidence, then explain the consequence of the incorrect alternative: \u201cAs automatically passed if the vessel looks sound\u201d. Distinguish an arithmetic result from a verified engineering decision. Record the professional role responsible for resolving any uncertainty. Do not perform a live pressure, combustion, electrical or fault experiment.\n\nReview prompt: How should a missed hold point be treated? Explain your reasoning before answering. If the context changes, state which evidence would need to be reassessed.", "why": "As a nonconformance needing authorised disposition. An ITP links each manufacturing step to acceptance criteria, records and witness or hold points. Material identity, joint preparation, welding records, examinations, dimensional checks and pressure testing form a traceable chain. A missed hold point is a nonconformance requiring formal disposition, not a paperwork inconvenience. The alternative is not justified: As automatically passed if the vessel looks sound."}, {"title": "Nondestructive examination", "teach": "Visual, penetrant, magnetic-particle, ultrasonic and radiographic methods reveal different flaw types and require qualified personnel and appropriate procedures. No method detects every defect. Coverage, sensitivity, acceptance criteria and geometry determine what a negative result means. Examination does not replace correct materials, procedure qualification or design.\n\nProfessional practice boundary: this explanation supports supervised learning and review. It is not an approved design, fabrication instruction, test procedure or operating authorisation. Actual decisions require the applicable code, current local requirements, plant-specific instructions and competent accountable people.", "worked": "A clean surface penetrant report cannot exclude every internal flaw; it addresses surface-breaking indications within the method's scope.", "q": "What does a clean surface penetrant result establish?", "a": "No relevant detected surface indications within the examination scope", "w": "Guaranteed absence of all internal defects", "work": "Worked reasoning: A clean surface penetrant report cannot exclude every internal flaw; it addresses surface-breaking indications within the method's scope.\n\nPaper workshop: write the claim being evaluated, identify its assumptions and missing evidence, then explain the consequence of the incorrect alternative: \u201cGuaranteed absence of all internal defects\u201d. Distinguish an arithmetic result from a verified engineering decision. Record the professional role responsible for resolving any uncertainty. Do not perform a live pressure, combustion, electrical or fault experiment.\n\nReview prompt: What does a clean surface penetrant result establish? Explain your reasoning before answering. If the context changes, state which evidence would need to be reassessed.", "why": "No relevant detected surface indications within the examination scope. Visual, penetrant, magnetic-particle, ultrasonic and radiographic methods reveal different flaw types and require qualified personnel and appropriate procedures. No method detects every defect. Coverage, sensitivity, acceptance criteria and geometry determine what a negative result means. Examination does not replace correct materials, procedure qualification or design. The alternative is not justified: Guaranteed absence of all internal defects."}, {"title": "Data books and nameplates", "teach": "A final dossier connects approved drawings, calculations, material certificates, weld maps, procedure and personnel qualifications, examination reports, test records and required declarations. Nameplate information must reflect verified identity and ratings. A test certificate without traceability to the exact item is insufficient. Keep records through repairs, relocation and ownership change.\n\nProfessional practice boundary: this explanation supports supervised learning and review. It is not an approved design, fabrication instruction, test procedure or operating authorisation. Actual decisions require the applicable code, current local requirements, plant-specific instructions and competent accountable people.", "worked": "A pressure-test report lists an identifier different from the vessel's tag. Resolve identity before accepting the report as evidence for that item.", "q": "Why must test reports match the vessel identity?", "a": "Otherwise the evidence may concern a different item", "w": "Because matching names improves appearance only", "work": "Worked reasoning: A pressure-test report lists an identifier different from the vessel's tag. Resolve identity before accepting the report as evidence for that item.\n\nPaper workshop: write the claim being evaluated, identify its assumptions and missing evidence, then explain the consequence of the incorrect alternative: \u201cBecause matching names improves appearance only\u201d. Distinguish an arithmetic result from a verified engineering decision. Record the professional role responsible for resolving any uncertainty. Do not perform a live pressure, combustion, electrical or fault experiment.\n\nReview prompt: Why must test reports match the vessel identity? Explain your reasoning before answering. If the context changes, state which evidence would need to be reassessed.", "why": "Otherwise the evidence may concern a different item. A final dossier connects approved drawings, calculations, material certificates, weld maps, procedure and personnel qualifications, examination reports, test records and required declarations. Nameplate information must reflect verified identity and ratings. A test certificate without traceability to the exact item is insufficient. Keep records through repairs, relocation and ownership change. The alternative is not justified: Because matching names improves appearance only."}], "part": "design"},i=12,id='scenario'+i;

(function(){const H=CG.H,u={"title": "Feedwater systems", "lessons": [{"title": "Feed pumps and pressure margins", "teach": "A feed pump must supply required flow against boiler pressure plus elevation and line losses over the operating envelope. Pump curves and system curves must be evaluated together; nameplate maximum flow is not available at every head. Loss of feed can rapidly threaten heated surfaces. Duty, standby arrangements and protection are engineered as a system.\n\nProfessional practice boundary: this explanation supports supervised learning and review. It is not an approved design, fabrication instruction, test procedure or operating authorisation. Actual decisions require the applicable code, current local requirements, plant-specific instructions and competent accountable people.", "worked": "A pump advertised at 20 L/min at zero head may deliver far less against a boiler. Compare its actual curve with the required system operating point.", "q": "Can zero-head flow establish boiler feed capacity?", "a": "No; capacity must be checked at system head", "w": "Yes; flow rating is constant at every pressure", "work": "Worked reasoning: A pump advertised at 20 L/min at zero head may deliver far less against a boiler. Compare its actual curve with the required system operating point.\n\nPaper workshop: write the claim being evaluated, identify its assumptions and missing evidence, then explain the consequence of the incorrect alternative: \u201cYes; flow rating is constant at every pressure\u201d. Distinguish an arithmetic result from a verified engineering decision. Record the professional role responsible for resolving any uncertainty. Do not perform a live pressure, combustion, electrical or fault experiment.\n\nReview prompt: Can zero-head flow establish boiler feed capacity? Explain your reasoning before answering. If the context changes, state which evidence would need to be reassessed.", "why": "No; capacity must be checked at system head. A feed pump must supply required flow against boiler pressure plus elevation and line losses over the operating envelope. Pump curves and system curves must be evaluated together; nameplate maximum flow is not available at every head. Loss of feed can rapidly threaten heated surfaces. Duty, standby arrangements and protection are engineered as a system. The alternative is not justified: Yes; flow rating is constant at every pressure."}, {"title": "Cavitation and hot feedwater", "teach": "Net positive suction head available depends on absolute suction pressure, liquid vapour pressure and losses. Hotter water has higher vapour pressure and can reduce cavitation margin. Cavitation damages pumps and disrupts feed, so tank location, suction routing and operating temperature matter. Manufacturer limits require competent evaluation.\n\nProfessional practice boundary: this explanation supports supervised learning and review. It is not an approved design, fabrication instruction, test procedure or operating authorisation. Actual decisions require the applicable code, current local requirements, plant-specific instructions and competent accountable people.", "worked": "Raising feedwater temperature improves heat recovery but may reduce suction margin. Record this trade-off instead of treating every temperature rise as an unqualified benefit.", "q": "Why can hotter feedwater increase cavitation risk?", "a": "It raises vapour pressure and reduces available suction margin", "w": "It eliminates vapour formation at the pump", "work": "Worked reasoning: Raising feedwater temperature improves heat recovery but may reduce suction margin. Record this trade-off instead of treating every temperature rise as an unqualified benefit.\n\nPaper workshop: write the claim being evaluated, identify its assumptions and missing evidence, then explain the consequence of the incorrect alternative: \u201cIt eliminates vapour formation at the pump\u201d. Distinguish an arithmetic result from a verified engineering decision. Record the professional role responsible for resolving any uncertainty. Do not perform a live pressure, combustion, electrical or fault experiment.\n\nReview prompt: Why can hotter feedwater increase cavitation risk? Explain your reasoning before answering. If the context changes, state which evidence would need to be reassessed.", "why": "It raises vapour pressure and reduces available suction margin. Net positive suction head available depends on absolute suction pressure, liquid vapour pressure and losses. Hotter water has higher vapour pressure and can reduce cavitation margin. Cavitation damages pumps and disrupts feed, so tank location, suction routing and operating temperature matter. Manufacturer limits require competent evaluation. The alternative is not justified: It eliminates vapour formation at the pump."}, {"title": "Check valves, isolation and redundancy", "teach": "Non-return valves limit reverse flow but can stick, leak or close violently. Isolation and maintenance access must permit safe servicing under an approved energy-control plan. A standby pump is useful only if its utilities, controls and common failure modes are considered. Do not infer isolation from a valve-handle position alone.\n\nProfessional practice boundary: this explanation supports supervised learning and review. It is not an approved design, fabrication instruction, test procedure or operating authorisation. Actual decisions require the applicable code, current local requirements, plant-specific instructions and competent accountable people.", "worked": "Two pumps share one vulnerable power feed. Their number does not provide independence from loss of that supply.", "q": "Do two pumps on one failed supply guarantee feed?", "a": "No; the common supply can defeat both", "w": "Yes; pump count alone proves redundancy", "work": "Worked reasoning: Two pumps share one vulnerable power feed. Their number does not provide independence from loss of that supply.\n\nPaper workshop: write the claim being evaluated, identify its assumptions and missing evidence, then explain the consequence of the incorrect alternative: \u201cYes; pump count alone proves redundancy\u201d. Distinguish an arithmetic result from a verified engineering decision. Record the professional role responsible for resolving any uncertainty. Do not perform a live pressure, combustion, electrical or fault experiment.\n\nReview prompt: Do two pumps on one failed supply guarantee feed? Explain your reasoning before answering. If the context changes, state which evidence would need to be reassessed.", "why": "No; the common supply can defeat both. Non-return valves limit reverse flow but can stick, leak or close violently. Isolation and maintenance access must permit safe servicing under an approved energy-control plan. A standby pump is useful only if its utilities, controls and common failure modes are considered. Do not infer isolation from a valve-handle position alone. The alternative is not justified: Yes; pump count alone proves redundancy."}], "part": "systems"},i=13,id='scenario'+i;

(function(){const H=CG.H,u={"title": "Water chemistry and treatment", "lessons": [{"title": "Hardness, scale and pretreatment", "teach": "Calcium and magnesium hardness can form deposits on heated surfaces. Softening exchanges hardness ions but does not remove all dissolved solids or dissolved oxygen. Treatment depends on source-water analysis, boiler conditions and specialist advice; indiscriminate chemical addition can create new hazards. Chemistry records should connect sample methods, results and responses.\n\nProfessional practice boundary: this explanation supports supervised learning and review. It is not an approved design, fabrication instruction, test procedure or operating authorisation. Actual decisions require the applicable code, current local requirements, plant-specific instructions and competent accountable people.", "worked": "A softener produces low-hardness water but conductivity remains substantial. This is expected: low hardness does not mean demineralised water.", "q": "Does softening remove every dissolved solid?", "a": "No; it mainly addresses hardness through ion exchange", "w": "Yes; softened water is chemically pure", "work": "Worked reasoning: A softener produces low-hardness water but conductivity remains substantial. This is expected: low hardness does not mean demineralised water.\n\nPaper workshop: write the claim being evaluated, identify its assumptions and missing evidence, then explain the consequence of the incorrect alternative: \u201cYes; softened water is chemically pure\u201d. Distinguish an arithmetic result from a verified engineering decision. Record the professional role responsible for resolving any uncertainty. Do not perform a live pressure, combustion, electrical or fault experiment.\n\nReview prompt: Does softening remove every dissolved solid? Explain your reasoning before answering. If the context changes, state which evidence would need to be reassessed.", "why": "No; it mainly addresses hardness through ion exchange. Calcium and magnesium hardness can form deposits on heated surfaces. Softening exchanges hardness ions but does not remove all dissolved solids or dissolved oxygen. Treatment depends on source-water analysis, boiler conditions and specialist advice; indiscriminate chemical addition can create new hazards. Chemistry records should connect sample methods, results and responses. The alternative is not justified: Yes; softened water is chemically pure."}, {"title": "Oxygen, pH and chemical control", "teach": "Dissolved oxygen promotes corrosion; temperature, oxygen removal, pH and suitable treatment must be managed together. Chemical selection, storage, dosing, compatibility and worker protection require specialist procedures and safety data sheets. Excessive alkalinity and carryover can also damage equipment. This course does not supply chemical dosing recipes.\n\nProfessional practice boundary: this explanation supports supervised learning and review. It is not an approved design, fabrication instruction, test procedure or operating authorisation. Actual decisions require the applicable code, current local requirements, plant-specific instructions and competent accountable people.", "worked": "Pitting continues despite low hardness. Investigate dissolved gases and other corrosion mechanisms rather than assuming the softener controls oxygen.", "q": "Which issue is not solved simply by softening?", "a": "Dissolved oxygen corrosion", "w": "Calcium hardness removal", "work": "Worked reasoning: Pitting continues despite low hardness. Investigate dissolved gases and other corrosion mechanisms rather than assuming the softener controls oxygen.\n\nPaper workshop: write the claim being evaluated, identify its assumptions and missing evidence, then explain the consequence of the incorrect alternative: \u201cCalcium hardness removal\u201d. Distinguish an arithmetic result from a verified engineering decision. Record the professional role responsible for resolving any uncertainty. Do not perform a live pressure, combustion, electrical or fault experiment.\n\nReview prompt: Which issue is not solved simply by softening? Explain your reasoning before answering. If the context changes, state which evidence would need to be reassessed.", "why": "Dissolved oxygen corrosion. Dissolved oxygen promotes corrosion; temperature, oxygen removal, pH and suitable treatment must be managed together. Chemical selection, storage, dosing, compatibility and worker protection require specialist procedures and safety data sheets. Excessive alkalinity and carryover can also damage equipment. This course does not supply chemical dosing recipes. The alternative is not justified: Calcium hardness removal."}, {"title": "Sampling and trend interpretation", "teach": "Samples must represent the relevant stream and be collected through engineered cooling and sampling arrangements by trained personnel. A hot pressure sample is a scalding hazard. Conductivity, pH and other tests require calibrated methods and context. Trends and mass balance are more informative than a single unexplained number.\n\nProfessional practice boundary: this explanation supports supervised learning and review. It is not an approved design, fabrication instruction, test procedure or operating authorisation. Actual decisions require the applicable code, current local requirements, plant-specific instructions and competent accountable people.", "worked": "Conductivity doubles while steam demand is steady. Verify the sample and investigate treatment or concentration changes; do not blindly halve every chemical setting.", "q": "What is the first response to an unexplained chemistry jump?", "a": "Verify sampling and investigate the process context", "w": "Change all dosing rates without checking the measurement", "work": "Worked reasoning: Conductivity doubles while steam demand is steady. Verify the sample and investigate treatment or concentration changes; do not blindly halve every chemical setting.\n\nPaper workshop: write the claim being evaluated, identify its assumptions and missing evidence, then explain the consequence of the incorrect alternative: \u201cChange all dosing rates without checking the measurement\u201d. Distinguish an arithmetic result from a verified engineering decision. Record the professional role responsible for resolving any uncertainty. Do not perform a live pressure, combustion, electrical or fault experiment.\n\nReview prompt: What is the first response to an unexplained chemistry jump? Explain your reasoning before answering. If the context changes, state which evidence would need to be reassessed.", "why": "Verify sampling and investigate the process context. Samples must represent the relevant stream and be collected through engineered cooling and sampling arrangements by trained personnel. A hot pressure sample is a scalding hazard. Conductivity, pH and other tests require calibrated methods and context. Trends and mass balance are more informative than a single unexplained number. The alternative is not justified: Change all dosing rates without checking the measurement."}], "part": "systems"},i=14,id='scenario'+i;

(function(){const H=CG.H,u={"title": "Blowdown and water balance", "lessons": [{"title": "Concentration cycles", "teach": "Steam ideally carries little dissolved nonvolatile material, so impurities concentrate in boiler water. Cycles of concentration compare a suitable boiler-water tracer with feedwater under stated assumptions. Carryover, dosing and variable chemistry can invalidate a simple conductivity ratio. Controlling concentration requires a treatment plan, not a universal number.\n\nProfessional practice boundary: this explanation supports supervised learning and review. It is not an approved design, fabrication instruction, test procedure or operating authorisation. Actual decisions require the applicable code, current local requirements, plant-specific instructions and competent accountable people.", "worked": "A tracer is 100 units in feed and 500 in boiler water. Under the simplifying assumptions this indicates five cycles, not proof that five is acceptable.", "q": "What does a valid 500/100 tracer ratio indicate?", "a": "Five concentration cycles under the assumptions", "w": "Five percent steam quality", "work": "Worked reasoning: A tracer is 100 units in feed and 500 in boiler water. Under the simplifying assumptions this indicates five cycles, not proof that five is acceptable.\n\nPaper workshop: write the claim being evaluated, identify its assumptions and missing evidence, then explain the consequence of the incorrect alternative: \u201cFive percent steam quality\u201d. Distinguish an arithmetic result from a verified engineering decision. Record the professional role responsible for resolving any uncertainty. Do not perform a live pressure, combustion, electrical or fault experiment.\n\nReview prompt: What does a valid 500/100 tracer ratio indicate? Explain your reasoning before answering. If the context changes, state which evidence would need to be reassessed.", "why": "Five concentration cycles under the assumptions. Steam ideally carries little dissolved nonvolatile material, so impurities concentrate in boiler water. Cycles of concentration compare a suitable boiler-water tracer with feedwater under stated assumptions. Carryover, dosing and variable chemistry can invalidate a simple conductivity ratio. Controlling concentration requires a treatment plan, not a universal number. The alternative is not justified: Five percent steam quality."}, {"title": "Blowdown mass and heat", "teach": "For an ideal steady balance with negligible tracer in steam, feed equals steam plus blowdown. If concentration ratio is C, blowdown is steam flow divided by C\u22121. Blowdown discards hot water and therefore heat. Real systems must account for treatment additions, sampling, carryover and non-steady operation.\n\nProfessional practice boundary: this explanation supports supervised learning and review. It is not an approved design, fabrication instruction, test procedure or operating authorisation. Actual decisions require the applicable code, current local requirements, plant-specific instructions and competent accountable people.", "worked": "With steam 4 kg/s and C=5, ideal blowdown is 1 kg/s and feed is 5 kg/s. Check both water and tracer balances.", "q": "For 4 kg/s steam at five ideal cycles, what is blowdown?", "a": "1 kg/s", "w": "20 kg/s", "work": "Worked reasoning: With steam 4 kg/s and C=5, ideal blowdown is 1 kg/s and feed is 5 kg/s. Check both water and tracer balances.\n\nPaper workshop: write the claim being evaluated, identify its assumptions and missing evidence, then explain the consequence of the incorrect alternative: \u201c20 kg/s\u201d. Distinguish an arithmetic result from a verified engineering decision. Record the professional role responsible for resolving any uncertainty. Do not perform a live pressure, combustion, electrical or fault experiment.\n\nReview prompt: For 4 kg/s steam at five ideal cycles, what is blowdown? Explain your reasoning before answering. If the context changes, state which evidence would need to be reassessed.", "why": "1 kg/s. For an ideal steady balance with negligible tracer in steam, feed equals steam plus blowdown. If concentration ratio is C, blowdown is steam flow divided by C\u22121. Blowdown discards hot water and therefore heat. Real systems must account for treatment additions, sampling, carryover and non-steady operation. The alternative is not justified: 20 kg/s."}, {"title": "Discharge, cooling and environmental controls", "teach": "Blowdown can flash when pressure falls and can cause severe scalding, noise and mechanical loads. Approved flash vessels, heat recovery, discharge cooling and drainage arrangements must address the actual installation and environmental requirements. A domestic drain or open bucket is not an engineered disposal system. Operation follows the plant-specific approved procedure.\n\nProfessional practice boundary: this explanation supports supervised learning and review. It is not an approved design, fabrication instruction, test procedure or operating authorisation. Actual decisions require the applicable code, current local requirements, plant-specific instructions and competent accountable people.", "worked": "A proposed hot discharge enters a pedestrian area before cooling. Reject the layout for competent redesign rather than placing a caution cone beside it.", "q": "Is an open bucket a suitable boiler blowdown system?", "a": "No; engineered containment and discharge assessment are required", "w": "Yes; any container is sufficient", "work": "Worked reasoning: A proposed hot discharge enters a pedestrian area before cooling. Reject the layout for competent redesign rather than placing a caution cone beside it.\n\nPaper workshop: write the claim being evaluated, identify its assumptions and missing evidence, then explain the consequence of the incorrect alternative: \u201cYes; any container is sufficient\u201d. Distinguish an arithmetic result from a verified engineering decision. Record the professional role responsible for resolving any uncertainty. Do not perform a live pressure, combustion, electrical or fault experiment.\n\nReview prompt: Is an open bucket a suitable boiler blowdown system? Explain your reasoning before answering. If the context changes, state which evidence would need to be reassessed.", "why": "No; engineered containment and discharge assessment are required. Blowdown can flash when pressure falls and can cause severe scalding, noise and mechanical loads. Approved flash vessels, heat recovery, discharge cooling and drainage arrangements must address the actual installation and environmental requirements. A domestic drain or open bucket is not an engineered disposal system. Operation follows the plant-specific approved procedure. The alternative is not justified: Yes; any container is sufficient."}], "part": "systems"},i=15,id='scenario'+i;

(function(){const H=CG.H,u={"title": "Combustion and fuel systems", "lessons": [{"title": "Combustion energy and efficiency", "teach": "Chemical heat input is fuel mass flow times an appropriate heating value. Higher and lower heating values differ in their water-vapour convention. Excess air affects combustion completeness and stack losses; too little air can produce carbon monoxide and unburned fuel. Combustion analysis belongs to competent commissioning and maintenance, not visual flame judgement alone.\n\nProfessional practice boundary: this explanation supports supervised learning and review. It is not an approved design, fabrication instruction, test procedure or operating authorisation. Actual decisions require the applicable code, current local requirements, plant-specific instructions and competent accountable people.", "worked": "For hypothetical 0.001 kg/s fuel at 40000 kJ/kg, chemical input is 40 kW. At 75 percent boiler efficiency the useful heat is 30 kW.", "q": "Does a visually blue flame prove complete system safety?", "a": "No; instrumentation and full commissioning remain necessary", "w": "Yes; colour certifies all combustion conditions", "work": "Worked reasoning: For hypothetical 0.001 kg/s fuel at 40000 kJ/kg, chemical input is 40 kW. At 75 percent boiler efficiency the useful heat is 30 kW.\n\nPaper workshop: write the claim being evaluated, identify its assumptions and missing evidence, then explain the consequence of the incorrect alternative: \u201cYes; colour certifies all combustion conditions\u201d. Distinguish an arithmetic result from a verified engineering decision. Record the professional role responsible for resolving any uncertainty. Do not perform a live pressure, combustion, electrical or fault experiment.\n\nReview prompt: Does a visually blue flame prove complete system safety? Explain your reasoning before answering. If the context changes, state which evidence would need to be reassessed.", "why": "No; instrumentation and full commissioning remain necessary. Chemical heat input is fuel mass flow times an appropriate heating value. Higher and lower heating values differ in their water-vapour convention. Excess air affects combustion completeness and stack losses; too little air can produce carbon monoxide and unburned fuel. Combustion analysis belongs to competent commissioning and maintenance, not visual flame judgement alone. The alternative is not justified: Yes; colour certifies all combustion conditions."}, {"title": "Burner management and flame failure", "teach": "Approved burner-management systems coordinate permissives, ignition and flame supervision and safely interrupt fuel on relevant faults. Purging and restart logic depend on the burner and code requirements. Defeating an interlock or repeatedly attempting ignition can accumulate fuel and cause an explosion. This course provides no DIY burner-control sequence.\n\nProfessional practice boundary: this explanation supports supervised learning and review. It is not an approved design, fabrication instruction, test procedure or operating authorisation. Actual decisions require the applicable code, current local requirements, plant-specific instructions and competent accountable people.", "worked": "A flame detector intermittently fails. Stop and escalate through the approved fault procedure; bypassing it to finish a demonstration removes an essential protection.", "q": "What is appropriate after a flame-supervision fault?", "a": "Use the approved shutdown and repair process", "w": "Bridge the detector so the burner continues", "work": "Worked reasoning: A flame detector intermittently fails. Stop and escalate through the approved fault procedure; bypassing it to finish a demonstration removes an essential protection.\n\nPaper workshop: write the claim being evaluated, identify its assumptions and missing evidence, then explain the consequence of the incorrect alternative: \u201cBridge the detector so the burner continues\u201d. Distinguish an arithmetic result from a verified engineering decision. Record the professional role responsible for resolving any uncertainty. Do not perform a live pressure, combustion, electrical or fault experiment.\n\nReview prompt: What is appropriate after a flame-supervision fault? Explain your reasoning before answering. If the context changes, state which evidence would need to be reassessed.", "why": "Use the approved shutdown and repair process. Approved burner-management systems coordinate permissives, ignition and flame supervision and safely interrupt fuel on relevant faults. Purging and restart logic depend on the burner and code requirements. Defeating an interlock or repeatedly attempting ignition can accumulate fuel and cause an explosion. This course provides no DIY burner-control sequence. The alternative is not justified: Bridge the detector so the burner continues."}, {"title": "Fuel storage, ventilation and exhaust", "teach": "Fuel systems add leak, fire, dust and explosion hazards. Solid fuel introduces ash handling and possible dust hazards; gaseous and liquid fuels need suitable storage and certified controls. Combustion air and flue discharge must be engineered to prevent carbon monoxide exposure and fire. Licensed work and local approvals may apply.\n\nProfessional practice boundary: this explanation supports supervised learning and review. It is not an approved design, fabrication instruction, test procedure or operating authorisation. Actual decisions require the applicable code, current local requirements, plant-specific instructions and competent accountable people.", "worked": "An indoor educational plant has no verified flue or ventilation design. It is not ready for operation even if its pressure equipment is certified.", "q": "What must be assessed besides boiler pressure integrity?", "a": "Fuel, ventilation, exhaust and fire hazards", "w": "Only the paint temperature rating", "work": "Worked reasoning: An indoor educational plant has no verified flue or ventilation design. It is not ready for operation even if its pressure equipment is certified.\n\nPaper workshop: write the claim being evaluated, identify its assumptions and missing evidence, then explain the consequence of the incorrect alternative: \u201cOnly the paint temperature rating\u201d. Distinguish an arithmetic result from a verified engineering decision. Record the professional role responsible for resolving any uncertainty. Do not perform a live pressure, combustion, electrical or fault experiment.\n\nReview prompt: What must be assessed besides boiler pressure integrity? Explain your reasoning before answering. If the context changes, state which evidence would need to be reassessed.", "why": "Fuel, ventilation, exhaust and fire hazards. Fuel systems add leak, fire, dust and explosion hazards. Solid fuel introduces ash handling and possible dust hazards; gaseous and liquid fuels need suitable storage and certified controls. Combustion air and flue discharge must be engineered to prevent carbon monoxide exposure and fire. Licensed work and local approvals may apply. The alternative is not justified: Only the paint temperature rating."}], "part": "systems"},i=16,id='scenario'+i;
