(function(){const H=CG.H,u={"title": "Electric and recovered-heat boilers", "lessons": [{"title": "Electric heating architecture", "teach": "Resistance or electrode heating avoids on-site combustion but not stored pressure, low-water overheating or electric shock. Power switching, earthing, protective devices, isolation and enclosure requirements are licensed electrical design matters. Electronic temperature control is not a substitute for independently engineered pressure and water-level protection.\n\nProfessional practice boundary: this explanation supports supervised learning and review. It is not an approved design, fabrication instruction, test procedure or operating authorisation. Actual decisions require the applicable code, current local requirements, plant-specific instructions and competent accountable people.", "worked": "An electric heater has a thermostat but no verified low-water protection. Absence of a flame does not resolve exposure of hot heating elements.", "q": "Does electric heating remove boiler rupture risk?", "a": "No; pressure and overheating hazards remain", "w": "Yes; only fuel-fired boilers can rupture", "work": "Worked reasoning: An electric heater has a thermostat but no verified low-water protection. Absence of a flame does not resolve exposure of hot heating elements.\n\nPaper workshop: write the claim being evaluated, identify its assumptions and missing evidence, then explain the consequence of the incorrect alternative: \u201cYes; only fuel-fired boilers can rupture\u201d. Distinguish an arithmetic result from a verified engineering decision. Record the professional role responsible for resolving any uncertainty. Do not perform a live pressure, combustion, electrical or fault experiment.\n\nReview prompt: Does electric heating remove boiler rupture risk? Explain your reasoning before answering. If the context changes, state which evidence would need to be reassessed.", "why": "No; pressure and overheating hazards remain. Resistance or electrode heating avoids on-site combustion but not stored pressure, low-water overheating or electric shock. Power switching, earthing, protective devices, isolation and enclosure requirements are licensed electrical design matters. Electronic temperature control is not a substitute for independently engineered pressure and water-level protection. The alternative is not justified: Yes; only fuel-fired boilers can rupture."}, {"title": "Energy input and evaporation", "teach": "A heat balance estimates steam production from useful heat divided by enthalpy rise. Heat losses, feed temperature, pressure, quality and transient storage affect actual output. Electrical input converted to thermal energy does not become equal electrical output after a steam cycle; the round trip incurs large losses.\n\nProfessional practice boundary: this explanation supports supervised learning and review. It is not an approved design, fabrication instruction, test procedure or operating authorisation. Actual decisions require the applicable code, current local requirements, plant-specific instructions and competent accountable people.", "worked": "A synthetic 10 kW useful heat rate divided by 2500 kJ/kg rise gives 0.004 kg/s or 14.4 kg/h. This is a heat-balance result, not an approved heater-vessel pairing.", "q": "What is 0.004 kg/s in kg/h?", "a": "14.4 kg/h", "w": "0.0144 kg/h", "work": "Worked reasoning: A synthetic 10 kW useful heat rate divided by 2500 kJ/kg rise gives 0.004 kg/s or 14.4 kg/h. This is a heat-balance result, not an approved heater-vessel pairing.\n\nPaper workshop: write the claim being evaluated, identify its assumptions and missing evidence, then explain the consequence of the incorrect alternative: \u201c0.0144 kg/h\u201d. Distinguish an arithmetic result from a verified engineering decision. Record the professional role responsible for resolving any uncertainty. Do not perform a live pressure, combustion, electrical or fault experiment.\n\nReview prompt: What is 0.004 kg/s in kg/h? Explain your reasoning before answering. If the context changes, state which evidence would need to be reassessed.", "why": "14.4 kg/h. A heat balance estimates steam production from useful heat divided by enthalpy rise. Heat losses, feed temperature, pressure, quality and transient storage affect actual output. Electrical input converted to thermal energy does not become equal electrical output after a steam cycle; the round trip incurs large losses. The alternative is not justified: 0.0144 kg/h."}, {"title": "Waste heat and solar concepts", "teach": "Recovered exhaust heat or solar concentration can supply boiler energy, but fluctuating input, loss of flow and continued heat after shutdown require protection. A heat source that cannot instantly turn off creates different fault responses than a controllable heater. Freeze, stagnation, burns and optical hazards may also apply.\n\nProfessional practice boundary: this explanation supports supervised learning and review. It is not an approved design, fabrication instruction, test procedure or operating authorisation. Actual decisions require the applicable code, current local requirements, plant-specific instructions and competent accountable people.", "worked": "A waste-heat source continues producing heat after feed loss. Designers must provide verified protection for residual energy; simply opening a control switch cannot remove upstream heat.", "q": "What must protection consider for uncontrollable heat input?", "a": "Residual heat after a control shutdown", "w": "Only the normal operating switch position", "work": "Worked reasoning: A waste-heat source continues producing heat after feed loss. Designers must provide verified protection for residual energy; simply opening a control switch cannot remove upstream heat.\n\nPaper workshop: write the claim being evaluated, identify its assumptions and missing evidence, then explain the consequence of the incorrect alternative: \u201cOnly the normal operating switch position\u201d. Distinguish an arithmetic result from a verified engineering decision. Record the professional role responsible for resolving any uncertainty. Do not perform a live pressure, combustion, electrical or fault experiment.\n\nReview prompt: What must protection consider for uncontrollable heat input? Explain your reasoning before answering. If the context changes, state which evidence would need to be reassessed.", "why": "Residual heat after a control shutdown. Recovered exhaust heat or solar concentration can supply boiler energy, but fluctuating input, loss of flow and continued heat after shutdown require protection. A heat source that cannot instantly turn off creates different fault responses than a controllable heater. Freeze, stagnation, burns and optical hazards may also apply. The alternative is not justified: Only the normal operating switch position."}], "part": "systems"},i=17,id='scenario'+i;

(function(){const H=CG.H,u={"title": "Overpressure protection", "lessons": [{"title": "Relief devices and independent protection", "teach": "A pressure relief device provides a final engineered path against overpressure under defined conditions. Its type, set pressure, certified capacity, inlet losses and discharge backpressure must satisfy the applicable design. Normal pressure control and emergency relief are different functions. Homemade weights or unverified springs are not acceptable substitutes.\n\nProfessional practice boundary: this explanation supports supervised learning and review. It is not an approved design, fabrication instruction, test procedure or operating authorisation. Actual decisions require the applicable code, current local requirements, plant-specific instructions and competent accountable people.", "worked": "A pressure controller and a certified relief valve have different jobs: the controller regulates normal operation; the relief protects specified overpressure scenarios.", "q": "Can normal pressure control replace a required relief valve?", "a": "No; regulation and relief serve different functions", "w": "Yes; a display setpoint is equivalent to relief", "work": "Worked reasoning: A pressure controller and a certified relief valve have different jobs: the controller regulates normal operation; the relief protects specified overpressure scenarios.\n\nPaper workshop: write the claim being evaluated, identify its assumptions and missing evidence, then explain the consequence of the incorrect alternative: \u201cYes; a display setpoint is equivalent to relief\u201d. Distinguish an arithmetic result from a verified engineering decision. Record the professional role responsible for resolving any uncertainty. Do not perform a live pressure, combustion, electrical or fault experiment.\n\nReview prompt: Can normal pressure control replace a required relief valve? Explain your reasoning before answering. If the context changes, state which evidence would need to be reassessed.", "why": "No; regulation and relief serve different functions. A pressure relief device provides a final engineered path against overpressure under defined conditions. Its type, set pressure, certified capacity, inlet losses and discharge backpressure must satisfy the applicable design. Normal pressure control and emergency relief are different functions. Homemade weights or unverified springs are not acceptable substitutes. The alternative is not justified: Yes; a display setpoint is equivalent to relief."}, {"title": "Relieving capacity and discharge routing", "teach": "Worst credible steam generation, including failure scenarios, governs capacity assessment; connection size alone does not prove capacity. Discharge piping can impose reaction forces, restrictions, condensate pockets and dangerous backpressure. Its termination must protect people and equipment under the full relieving case.\n\nProfessional practice boundary: this explanation supports supervised learning and review. It is not an approved design, fabrication instruction, test procedure or operating authorisation. Actual decisions require the applicable code, current local requirements, plant-specific instructions and competent accountable people.", "worked": "A large outlet pipe has an unsupported sharp turn. Even if its bore is generous, reaction loads and support design remain unresolved.", "q": "Does outlet bore alone establish a safe relief installation?", "a": "No; capacity, backpressure, forces and termination all matter", "w": "Yes; larger pipe always eliminates every concern", "work": "Worked reasoning: A large outlet pipe has an unsupported sharp turn. Even if its bore is generous, reaction loads and support design remain unresolved.\n\nPaper workshop: write the claim being evaluated, identify its assumptions and missing evidence, then explain the consequence of the incorrect alternative: \u201cYes; larger pipe always eliminates every concern\u201d. Distinguish an arithmetic result from a verified engineering decision. Record the professional role responsible for resolving any uncertainty. Do not perform a live pressure, combustion, electrical or fault experiment.\n\nReview prompt: Does outlet bore alone establish a safe relief installation? Explain your reasoning before answering. If the context changes, state which evidence would need to be reassessed.", "why": "No; capacity, backpressure, forces and termination all matter. Worst credible steam generation, including failure scenarios, governs capacity assessment; connection size alone does not prove capacity. Discharge piping can impose reaction forces, restrictions, condensate pockets and dangerous backpressure. Its termination must protect people and equipment under the full relieving case. The alternative is not justified: Yes; larger pipe always eliminates every concern."}, {"title": "Inspection, isolation and tamper prevention", "teach": "Relief-device maintenance and testing follow applicable standards, manufacturer requirements and authorised procedures. Arrangements must not accidentally isolate required protection; any permitted changeover scheme needs engineered safeguards. Setpoints are not adjusted by learners. Records must identify the exact device, service conditions and test authority.\n\nProfessional practice boundary: this explanation supports supervised learning and review. It is not an approved design, fabrication instruction, test procedure or operating authorisation. Actual decisions require the applicable code, current local requirements, plant-specific instructions and competent accountable people.", "worked": "A closed valve separates the only relief device from the vessel. Treat the plant as unprotected and follow the approved safe response, not a casual live adjustment.", "q": "Can an isolated relief valve protect the vessel?", "a": "No; its pressure path has been disconnected", "w": "Yes; certification works even through a closed valve", "work": "Worked reasoning: A closed valve separates the only relief device from the vessel. Treat the plant as unprotected and follow the approved safe response, not a casual live adjustment.\n\nPaper workshop: write the claim being evaluated, identify its assumptions and missing evidence, then explain the consequence of the incorrect alternative: \u201cYes; certification works even through a closed valve\u201d. Distinguish an arithmetic result from a verified engineering decision. Record the professional role responsible for resolving any uncertainty. Do not perform a live pressure, combustion, electrical or fault experiment.\n\nReview prompt: Can an isolated relief valve protect the vessel? Explain your reasoning before answering. If the context changes, state which evidence would need to be reassessed.", "why": "No; its pressure path has been disconnected. Relief-device maintenance and testing follow applicable standards, manufacturer requirements and authorised procedures. Arrangements must not accidentally isolate required protection; any permitted changeover scheme needs engineered safeguards. Setpoints are not adjusted by learners. Records must identify the exact device, service conditions and test authority. The alternative is not justified: Yes; certification works even through a closed valve."}], "part": "systems"},i=18,id='scenario'+i;

(function(){const H=CG.H,u={"title": "Water level and thermal protection", "lessons": [{"title": "Low-water failure mechanisms", "teach": "Exposed heated surfaces can overheat, lose strength and fail even without an extraordinary gauge pressure. The correct protective response must remove heat according to the approved plant design. Adding water to severely overheated equipment can create violent thermal and pressure effects; never improvise recovery. Isolate the situation and follow the site emergency plan and competent direction.\n\nProfessional practice boundary: this explanation supports supervised learning and review. It is not an approved design, fabrication instruction, test procedure or operating authorisation. Actual decisions require the applicable code, current local requirements, plant-specific instructions and competent accountable people.", "worked": "An apparent low-water event coincides with abnormal metal temperature. This is an emergency diagnosis for authorised people, not an invitation to refill and restart.", "q": "Is immediate improvised refilling of an overheated dry boiler appropriate?", "a": "No; follow the emergency plan and competent direction", "w": "Yes; cold water always restores safety immediately", "work": "Worked reasoning: An apparent low-water event coincides with abnormal metal temperature. This is an emergency diagnosis for authorised people, not an invitation to refill and restart.\n\nPaper workshop: write the claim being evaluated, identify its assumptions and missing evidence, then explain the consequence of the incorrect alternative: \u201cYes; cold water always restores safety immediately\u201d. Distinguish an arithmetic result from a verified engineering decision. Record the professional role responsible for resolving any uncertainty. Do not perform a live pressure, combustion, electrical or fault experiment.\n\nReview prompt: Is immediate improvised refilling of an overheated dry boiler appropriate? Explain your reasoning before answering. If the context changes, state which evidence would need to be reassessed.", "why": "No; follow the emergency plan and competent direction. Exposed heated surfaces can overheat, lose strength and fail even without an extraordinary gauge pressure. The correct protective response must remove heat according to the approved plant design. Adding water to severely overheated equipment can create violent thermal and pressure effects; never improvise recovery. Isolate the situation and follow the site emergency plan and competent direction. The alternative is not justified: Yes; cold water always restores safety immediately."}, {"title": "Level indication and independent cutoffs", "teach": "Gauge glasses, probes and differential-pressure systems have different failure modes. Blocked connections, foaming, density changes and electrical faults can produce misleading readings. Independent low-water protection and proof testing must meet the approved design. A control display showing water is not proof that a heated surface remains covered.\n\nProfessional practice boundary: this explanation supports supervised learning and review. It is not an approved design, fabrication instruction, test procedure or operating authorisation. Actual decisions require the applicable code, current local requirements, plant-specific instructions and competent accountable people.", "worked": "A level display stays steady while feed and steam flows diverge. Investigate sensing paths and actual inventory under the approved response; a static number may be a fault.", "q": "Can a stable level display prove adequate water during a fault?", "a": "No; the sensor or its connections may be misleading", "w": "Yes; steady displays are inherently trustworthy", "work": "Worked reasoning: A level display stays steady while feed and steam flows diverge. Investigate sensing paths and actual inventory under the approved response; a static number may be a fault.\n\nPaper workshop: write the claim being evaluated, identify its assumptions and missing evidence, then explain the consequence of the incorrect alternative: \u201cYes; steady displays are inherently trustworthy\u201d. Distinguish an arithmetic result from a verified engineering decision. Record the professional role responsible for resolving any uncertainty. Do not perform a live pressure, combustion, electrical or fault experiment.\n\nReview prompt: Can a stable level display prove adequate water during a fault? Explain your reasoning before answering. If the context changes, state which evidence would need to be reassessed.", "why": "No; the sensor or its connections may be misleading. Gauge glasses, probes and differential-pressure systems have different failure modes. Blocked connections, foaming, density changes and electrical faults can produce misleading readings. Independent low-water protection and proof testing must meet the approved design. A control display showing water is not proof that a heated surface remains covered. The alternative is not justified: Yes; steady displays are inherently trustworthy."}, {"title": "Fusible plugs and limited protective roles", "teach": "Some boiler designs use fusible plugs as particular historical or supplementary protective features. Their function, applicability and maintenance are design-specific. They are not universal pressure relief devices and do not replace verified low-water protection. Deposits, unsuitable material or incorrect servicing can defeat the intended function.\n\nProfessional practice boundary: this explanation supports supervised learning and review. It is not an approved design, fabrication instruction, test procedure or operating authorisation. Actual decisions require the applicable code, current local requirements, plant-specific instructions and competent accountable people.", "worked": "A supplier proposes replacing an independent low-water cutoff with a plug copied from another boiler. This is an unapproved protection change requiring rejection and engineering review.", "q": "Can a fusible plug universally replace low-water protection?", "a": "No; its role is design-specific and limited", "w": "Yes; all fusible plugs provide identical protection", "work": "Worked reasoning: A supplier proposes replacing an independent low-water cutoff with a plug copied from another boiler. This is an unapproved protection change requiring rejection and engineering review.\n\nPaper workshop: write the claim being evaluated, identify its assumptions and missing evidence, then explain the consequence of the incorrect alternative: \u201cYes; all fusible plugs provide identical protection\u201d. Distinguish an arithmetic result from a verified engineering decision. Record the professional role responsible for resolving any uncertainty. Do not perform a live pressure, combustion, electrical or fault experiment.\n\nReview prompt: Can a fusible plug universally replace low-water protection? Explain your reasoning before answering. If the context changes, state which evidence would need to be reassessed.", "why": "No; its role is design-specific and limited. Some boiler designs use fusible plugs as particular historical or supplementary protective features. Their function, applicability and maintenance are design-specific. They are not universal pressure relief devices and do not replace verified low-water protection. Deposits, unsuitable material or incorrect servicing can defeat the intended function. The alternative is not justified: Yes; all fusible plugs provide identical protection."}], "part": "protection"},i=19,id='scenario'+i;

(function(){const H=CG.H,u={"title": "Controls, alarms and interlocks", "lessons": [{"title": "Control versus safety function", "teach": "A controller modulates heat or feed during normal service; a safety function brings the system to a defined safe state after a hazardous deviation. Required independence, failure response and proof testing depend on the risk assessment and applicable rules. Software convenience does not establish functional safety.\n\nProfessional practice boundary: this explanation supports supervised learning and review. It is not an approved design, fabrication instruction, test procedure or operating authorisation. Actual decisions require the applicable code, current local requirements, plant-specific instructions and competent accountable people.", "worked": "A single hobby microcontroller handles both pressure regulation and emergency shutdown without independent assessment. The architecture is not justified by successful normal operation.", "q": "Does good normal control prove a shutdown system is adequate?", "a": "No; fault performance and independence need verification", "w": "Yes; stable readings prove all safety functions", "work": "Worked reasoning: A single hobby microcontroller handles both pressure regulation and emergency shutdown without independent assessment. The architecture is not justified by successful normal operation.\n\nPaper workshop: write the claim being evaluated, identify its assumptions and missing evidence, then explain the consequence of the incorrect alternative: \u201cYes; stable readings prove all safety functions\u201d. Distinguish an arithmetic result from a verified engineering decision. Record the professional role responsible for resolving any uncertainty. Do not perform a live pressure, combustion, electrical or fault experiment.\n\nReview prompt: Does good normal control prove a shutdown system is adequate? Explain your reasoning before answering. If the context changes, state which evidence would need to be reassessed.", "why": "No; fault performance and independence need verification. A controller modulates heat or feed during normal service; a safety function brings the system to a defined safe state after a hazardous deviation. Required independence, failure response and proof testing depend on the risk assessment and applicable rules. Software convenience does not establish functional safety. The alternative is not justified: Yes; stable readings prove all safety functions."}, {"title": "Trips, permissives and reset policy", "teach": "A permissive prevents an unsafe start; a trip interrupts unsafe operation; an alarm warns an operator. Acknowledging an alarm is not fixing its cause. Reset rules must prevent unexpected restart and require authorised confirmation of resolved conditions. Interlocks should be tested without creating the hazard they are intended to prevent.\n\nProfessional practice boundary: this explanation supports supervised learning and review. It is not an approved design, fabrication instruction, test procedure or operating authorisation. Actual decisions require the applicable code, current local requirements, plant-specific instructions and competent accountable people.", "worked": "A low-water trip clears when the signal returns, but automatic heat restart would create an unexpected start. The approved reset philosophy must address this explicitly.", "q": "Is alarm acknowledgement equivalent to hazard resolution?", "a": "No; the cause must be investigated and resolved", "w": "Yes; acknowledgement removes the underlying fault", "work": "Worked reasoning: A low-water trip clears when the signal returns, but automatic heat restart would create an unexpected start. The approved reset philosophy must address this explicitly.\n\nPaper workshop: write the claim being evaluated, identify its assumptions and missing evidence, then explain the consequence of the incorrect alternative: \u201cYes; acknowledgement removes the underlying fault\u201d. Distinguish an arithmetic result from a verified engineering decision. Record the professional role responsible for resolving any uncertainty. Do not perform a live pressure, combustion, electrical or fault experiment.\n\nReview prompt: Is alarm acknowledgement equivalent to hazard resolution? Explain your reasoning before answering. If the context changes, state which evidence would need to be reassessed.", "why": "No; the cause must be investigated and resolved. A permissive prevents an unsafe start; a trip interrupts unsafe operation; an alarm warns an operator. Acknowledging an alarm is not fixing its cause. Reset rules must prevent unexpected restart and require authorised confirmation of resolved conditions. Interlocks should be tested without creating the hazard they are intended to prevent. The alternative is not justified: Yes; acknowledgement removes the underlying fault."}, {"title": "Cause-and-effect matrices", "teach": "A cause-and-effect table lists initiating faults, alarms, shutdown actions, final elements, reset conditions and evidence of testing. Include loss of power, sensor failure, stuck outputs and communication faults. Fail-safe is a specific verified behaviour, not a marketing label. Record who may modify logic and how changes are reviewed.\n\nProfessional practice boundary: this explanation supports supervised learning and review. It is not an approved design, fabrication instruction, test procedure or operating authorisation. Actual decisions require the applicable code, current local requirements, plant-specific instructions and competent accountable people.", "worked": "A matrix covers high pressure but omits loss of feed and welded heater contacts. Those gaps require hazard review rather than assuming a general emergency stop solves everything.", "q": "What belongs in a cause-and-effect review?", "a": "Credible sensor, supply and final-element faults", "w": "Only operator-requested normal shutdowns", "work": "Worked reasoning: A matrix covers high pressure but omits loss of feed and welded heater contacts. Those gaps require hazard review rather than assuming a general emergency stop solves everything.\n\nPaper workshop: write the claim being evaluated, identify its assumptions and missing evidence, then explain the consequence of the incorrect alternative: \u201cOnly operator-requested normal shutdowns\u201d. Distinguish an arithmetic result from a verified engineering decision. Record the professional role responsible for resolving any uncertainty. Do not perform a live pressure, combustion, electrical or fault experiment.\n\nReview prompt: What belongs in a cause-and-effect review? Explain your reasoning before answering. If the context changes, state which evidence would need to be reassessed.", "why": "Credible sensor, supply and final-element faults. A cause-and-effect table lists initiating faults, alarms, shutdown actions, final elements, reset conditions and evidence of testing. Include loss of power, sensor failure, stuck outputs and communication faults. Fail-safe is a specific verified behaviour, not a marketing label. Record who may modify logic and how changes are reviewed. The alternative is not justified: Only operator-requested normal shutdowns."}], "part": "protection"},i=20,id='scenario'+i;

(function(){const H=CG.H,u={"title": "Steam piping and supports", "lessons": [{"title": "Pressure-temperature ratings and interfaces", "teach": "A fitting rating depends on material, temperature, standard and connection details. A room-temperature pressure label cannot be transferred blindly to hot steam. Joints, gaskets, bolting, expansion, supports and loads must be compatible. Pressure piping has its own engineering and inspection obligations separate from the boiler shell.\n\nProfessional practice boundary: this explanation supports supervised learning and review. It is not an approved design, fabrication instruction, test procedure or operating authorisation. Actual decisions require the applicable code, current local requirements, plant-specific instructions and competent accountable people.", "worked": "A valve has a high cold-water rating but no steam-temperature suitability evidence. Procurement remains on hold until the actual service is verified.", "q": "Does a cold-water pressure rating prove steam suitability?", "a": "No; temperature and service compatibility must be verified", "w": "Yes; pressure ratings never depend on temperature", "work": "Worked reasoning: A valve has a high cold-water rating but no steam-temperature suitability evidence. Procurement remains on hold until the actual service is verified.\n\nPaper workshop: write the claim being evaluated, identify its assumptions and missing evidence, then explain the consequence of the incorrect alternative: \u201cYes; pressure ratings never depend on temperature\u201d. Distinguish an arithmetic result from a verified engineering decision. Record the professional role responsible for resolving any uncertainty. Do not perform a live pressure, combustion, electrical or fault experiment.\n\nReview prompt: Does a cold-water pressure rating prove steam suitability? Explain your reasoning before answering. If the context changes, state which evidence would need to be reassessed.", "why": "No; temperature and service compatibility must be verified. A fitting rating depends on material, temperature, standard and connection details. A room-temperature pressure label cannot be transferred blindly to hot steam. Joints, gaskets, bolting, expansion, supports and loads must be compatible. Pressure piping has its own engineering and inspection obligations separate from the boiler shell. The alternative is not justified: Yes; pressure ratings never depend on temperature."}, {"title": "Water hammer and drainage", "teach": "Condensate slugs accelerated by steam can impose severe impact loads. Condensation-induced water hammer can also arise when steam collapses against colder liquid. Piping slope, drainage, traps, warm-up provisions and operating procedures require engineered coordination. Simply increasing pipe strength does not remove the initiating mechanism.\n\nProfessional practice boundary: this explanation supports supervised learning and review. It is not an approved design, fabrication instruction, test procedure or operating authorisation. Actual decisions require the applicable code, current local requirements, plant-specific instructions and competent accountable people.", "worked": "A low point collects condensate ahead of a closed section. Flag drainage and operating-sequence deficiencies for competent review instead of relying only on stronger supports.", "q": "What is a key water-hammer concern?", "a": "Condensate accumulation and rapid acceleration or condensation", "w": "Only the average steady steam pressure", "work": "Worked reasoning: A low point collects condensate ahead of a closed section. Flag drainage and operating-sequence deficiencies for competent review instead of relying only on stronger supports.\n\nPaper workshop: write the claim being evaluated, identify its assumptions and missing evidence, then explain the consequence of the incorrect alternative: \u201cOnly the average steady steam pressure\u201d. Distinguish an arithmetic result from a verified engineering decision. Record the professional role responsible for resolving any uncertainty. Do not perform a live pressure, combustion, electrical or fault experiment.\n\nReview prompt: What is a key water-hammer concern? Explain your reasoning before answering. If the context changes, state which evidence would need to be reassessed.", "why": "Condensate accumulation and rapid acceleration or condensation. Condensate slugs accelerated by steam can impose severe impact loads. Condensation-induced water hammer can also arise when steam collapses against colder liquid. Piping slope, drainage, traps, warm-up provisions and operating procedures require engineered coordination. Simply increasing pipe strength does not remove the initiating mechanism. The alternative is not justified: Only the average steady steam pressure."}, {"title": "Expansion, insulation and access", "teach": "Pipe flexibility and supports must accommodate thermal movement without overloading nozzles. Insulation limits heat loss and contact burns but can hide corrosion and leaks. Access for inspection, valve operation and escape remains essential. Personal protective equipment does not authorise approaching an unknown hot leak.\n\nProfessional practice boundary: this explanation supports supervised learning and review. It is not an approved design, fabrication instruction, test procedure or operating authorisation. Actual decisions require the applicable code, current local requirements, plant-specific instructions and competent accountable people.", "worked": "An insulated pipe is tightly clamped at both ends without flexibility assessment. A low heat-loss calculation does not resolve restraint stresses.", "q": "What can rigidly restrained hot piping develop?", "a": "Thermal stress and nozzle loads", "w": "Guaranteed freedom from stress because movement is prevented", "work": "Worked reasoning: An insulated pipe is tightly clamped at both ends without flexibility assessment. A low heat-loss calculation does not resolve restraint stresses.\n\nPaper workshop: write the claim being evaluated, identify its assumptions and missing evidence, then explain the consequence of the incorrect alternative: \u201cGuaranteed freedom from stress because movement is prevented\u201d. Distinguish an arithmetic result from a verified engineering decision. Record the professional role responsible for resolving any uncertainty. Do not perform a live pressure, combustion, electrical or fault experiment.\n\nReview prompt: What can rigidly restrained hot piping develop? Explain your reasoning before answering. If the context changes, state which evidence would need to be reassessed.", "why": "Thermal stress and nozzle loads. Pipe flexibility and supports must accommodate thermal movement without overloading nozzles. Insulation limits heat loss and contact burns but can hide corrosion and leaks. Access for inspection, valve operation and escape remains essential. Personal protective equipment does not authorise approaching an unknown hot leak. The alternative is not justified: Guaranteed freedom from stress because movement is prevented."}], "part": "protection"},i=21,id='scenario'+i;

(function(){const H=CG.H,u={"title": "Valves, traps and steam quality", "lessons": [{"title": "Isolation and throttling duties", "teach": "Valves have different isolation, throttling and non-return functions. Selection accounts for pressure drop, temperature, erosion, shutoff requirements and safe maintenance. A check valve is not automatically positive isolation. Valve lineups and changes must follow controlled plant procedures rather than learner experimentation.\n\nProfessional practice boundary: this explanation supports supervised learning and review. It is not an approved design, fabrication instruction, test procedure or operating authorisation. Actual decisions require the applicable code, current local requirements, plant-specific instructions and competent accountable people.", "worked": "A maintenance plan relies on a check valve as the only isolation from stored energy. The isolation basis needs competent review and verification.", "q": "Can a check valve automatically be treated as maintenance isolation?", "a": "No; leakage and failure modes must be assessed", "w": "Yes; its arrow guarantees zero leakage", "work": "Worked reasoning: A maintenance plan relies on a check valve as the only isolation from stored energy. The isolation basis needs competent review and verification.\n\nPaper workshop: write the claim being evaluated, identify its assumptions and missing evidence, then explain the consequence of the incorrect alternative: \u201cYes; its arrow guarantees zero leakage\u201d. Distinguish an arithmetic result from a verified engineering decision. Record the professional role responsible for resolving any uncertainty. Do not perform a live pressure, combustion, electrical or fault experiment.\n\nReview prompt: Can a check valve automatically be treated as maintenance isolation? Explain your reasoning before answering. If the context changes, state which evidence would need to be reassessed.", "why": "No; leakage and failure modes must be assessed. Valves have different isolation, throttling and non-return functions. Selection accounts for pressure drop, temperature, erosion, shutoff requirements and safe maintenance. A check valve is not automatically positive isolation. Valve lineups and changes must follow controlled plant procedures rather than learner experimentation. The alternative is not justified: Yes; its arrow guarantees zero leakage."}, {"title": "Traps and condensate management", "teach": "Steam traps discharge condensate and sometimes air while limiting live-steam loss according to their operating principle. Mechanical, thermostatic and thermodynamic designs suit different duties. Failure open wastes steam and can overload return systems; failure closed can cause flooding and hammer. Trap surveys use trained diagnosis and appropriate instruments.\n\nProfessional practice boundary: this explanation supports supervised learning and review. It is not an approved design, fabrication instruction, test procedure or operating authorisation. Actual decisions require the applicable code, current local requirements, plant-specific instructions and competent accountable people.", "worked": "A cold downstream line might indicate no demand, a closed isolation or a failed-closed trap. Temperature alone without context is not a complete diagnosis.", "q": "What can a failed-closed trap cause?", "a": "Condensate backup and water-hammer risk", "w": "Guaranteed improvement in energy efficiency without consequence", "work": "Worked reasoning: A cold downstream line might indicate no demand, a closed isolation or a failed-closed trap. Temperature alone without context is not a complete diagnosis.\n\nPaper workshop: write the claim being evaluated, identify its assumptions and missing evidence, then explain the consequence of the incorrect alternative: \u201cGuaranteed improvement in energy efficiency without consequence\u201d. Distinguish an arithmetic result from a verified engineering decision. Record the professional role responsible for resolving any uncertainty. Do not perform a live pressure, combustion, electrical or fault experiment.\n\nReview prompt: What can a failed-closed trap cause? Explain your reasoning before answering. If the context changes, state which evidence would need to be reassessed.", "why": "Condensate backup and water-hammer risk. Steam traps discharge condensate and sometimes air while limiting live-steam loss according to their operating principle. Mechanical, thermostatic and thermodynamic designs suit different duties. Failure open wastes steam and can overload return systems; failure closed can cause flooding and hammer. Trap surveys use trained diagnosis and appropriate instruments. The alternative is not justified: Guaranteed improvement in energy efficiency without consequence."}, {"title": "Separators, carryover and wet steam", "teach": "Separators remove entrained droplets under specified flow conditions; they do not convert every steam state to a known dryness. Boiler carryover can transport water and contaminants into engines and piping. High demand changes, foaming and chemistry faults can contribute. Steam quality must be evaluated for the receiving equipment.\n\nProfessional practice boundary: this explanation supports supervised learning and review. It is not an approved design, fabrication instruction, test procedure or operating authorisation. Actual decisions require the applicable code, current local requirements, plant-specific instructions and competent accountable people.", "worked": "A separator is fitted but boiler foaming persists. The source condition remains unresolved; adding hardware is not a substitute for chemistry and level control.", "q": "Does a separator excuse persistent boiler carryover?", "a": "No; the source fault still needs correction", "w": "Yes; separators make all upstream faults irrelevant", "work": "Worked reasoning: A separator is fitted but boiler foaming persists. The source condition remains unresolved; adding hardware is not a substitute for chemistry and level control.\n\nPaper workshop: write the claim being evaluated, identify its assumptions and missing evidence, then explain the consequence of the incorrect alternative: \u201cYes; separators make all upstream faults irrelevant\u201d. Distinguish an arithmetic result from a verified engineering decision. Record the professional role responsible for resolving any uncertainty. Do not perform a live pressure, combustion, electrical or fault experiment.\n\nReview prompt: Does a separator excuse persistent boiler carryover? Explain your reasoning before answering. If the context changes, state which evidence would need to be reassessed.", "why": "No; the source fault still needs correction. Separators remove entrained droplets under specified flow conditions; they do not convert every steam state to a known dryness. Boiler carryover can transport water and contaminants into engines and piping. High demand changes, foaming and chemistry faults can contribute. Steam quality must be evaluated for the receiving equipment. The alternative is not justified: Yes; separators make all upstream faults irrelevant."}], "part": "protection"},i=22,id='scenario'+i;

(function(){const H=CG.H,u={"title": "Condensers and heat rejection", "lessons": [{"title": "Condenser duties and vacuum", "teach": "A condenser rejects heat and may lower expander backpressure, potentially increasing useful expansion. It must handle large heat flow, air ingress, cooling-water conditions and vacuum loads. Lower pressure can also produce wetter exhaust and larger volumetric flow. A vacuum system is pressure equipment, not an absence of loading.\n\nProfessional practice boundary: this explanation supports supervised learning and review. It is not an approved design, fabrication instruction, test procedure or operating authorisation. Actual decisions require the applicable code, current local requirements, plant-specific instructions and competent accountable people.", "worked": "If a cycle accepts 100 kW heat and produces 10 kW net work, approximately 90 kW must be rejected in the simplified steady balance.", "q": "What heat rejection accompanies 100 kW in and 10 kW net work?", "a": "About 90 kW before other balance refinements", "w": "About 10 kW", "work": "Worked reasoning: If a cycle accepts 100 kW heat and produces 10 kW net work, approximately 90 kW must be rejected in the simplified steady balance.\n\nPaper workshop: write the claim being evaluated, identify its assumptions and missing evidence, then explain the consequence of the incorrect alternative: \u201cAbout 10 kW\u201d. Distinguish an arithmetic result from a verified engineering decision. Record the professional role responsible for resolving any uncertainty. Do not perform a live pressure, combustion, electrical or fault experiment.\n\nReview prompt: What heat rejection accompanies 100 kW in and 10 kW net work? Explain your reasoning before answering. If the context changes, state which evidence would need to be reassessed.", "why": "About 90 kW before other balance refinements. A condenser rejects heat and may lower expander backpressure, potentially increasing useful expansion. It must handle large heat flow, air ingress, cooling-water conditions and vacuum loads. Lower pressure can also produce wetter exhaust and larger volumetric flow. A vacuum system is pressure equipment, not an absence of loading. The alternative is not justified: About 10 kW."}, {"title": "Cooling water and environmental health", "teach": "Cooling circuits need heat-transfer area, flow, fouling allowance and environmental assessment. Open evaporative cooling can introduce water-health risks requiring professional management. A nearby water source does not automatically permit extraction or hot discharge. Cooling failure is a plant fault requiring defined protective action.\n\nProfessional practice boundary: this explanation supports supervised learning and review. It is not an approved design, fabrication instruction, test procedure or operating authorisation. Actual decisions require the applicable code, current local requirements, plant-specific instructions and competent accountable people.", "worked": "A generation concept predicts 2 kW electric output but ignores tens of kilowatts of rejected heat. Its feasibility study is incomplete.", "q": "What must be included in steam-electric feasibility?", "a": "Heat rejection and its site impacts", "w": "Only the generator nameplate", "work": "Worked reasoning: A generation concept predicts 2 kW electric output but ignores tens of kilowatts of rejected heat. Its feasibility study is incomplete.\n\nPaper workshop: write the claim being evaluated, identify its assumptions and missing evidence, then explain the consequence of the incorrect alternative: \u201cOnly the generator nameplate\u201d. Distinguish an arithmetic result from a verified engineering decision. Record the professional role responsible for resolving any uncertainty. Do not perform a live pressure, combustion, electrical or fault experiment.\n\nReview prompt: What must be included in steam-electric feasibility? Explain your reasoning before answering. If the context changes, state which evidence would need to be reassessed.", "why": "Heat rejection and its site impacts. Cooling circuits need heat-transfer area, flow, fouling allowance and environmental assessment. Open evaporative cooling can introduce water-health risks requiring professional management. A nearby water source does not automatically permit extraction or hot discharge. Cooling failure is a plant fault requiring defined protective action. The alternative is not justified: Only the generator nameplate."}, {"title": "Condensate return and contamination", "teach": "Returning clean condensate saves treated water and heat, but contamination can damage the boiler. Process leaks, oil or treatment incompatibility may require monitoring and diversion arrangements. Return tanks, vents and pumps face hot-water and flash-steam hazards. Do not assume clear-looking liquid is chemically acceptable.\n\nProfessional practice boundary: this explanation supports supervised learning and review. It is not an approved design, fabrication instruction, test procedure or operating authorisation. Actual decisions require the applicable code, current local requirements, plant-specific instructions and competent accountable people.", "worked": "Oil enters condensate through a failed process interface. Returning it because it is warm can compromise water treatment and boiler operation.", "q": "Is every warm condensate stream suitable for return?", "a": "No; contamination and compatibility must be verified", "w": "Yes; heat content makes chemistry irrelevant", "work": "Worked reasoning: Oil enters condensate through a failed process interface. Returning it because it is warm can compromise water treatment and boiler operation.\n\nPaper workshop: write the claim being evaluated, identify its assumptions and missing evidence, then explain the consequence of the incorrect alternative: \u201cYes; heat content makes chemistry irrelevant\u201d. Distinguish an arithmetic result from a verified engineering decision. Record the professional role responsible for resolving any uncertainty. Do not perform a live pressure, combustion, electrical or fault experiment.\n\nReview prompt: Is every warm condensate stream suitable for return? Explain your reasoning before answering. If the context changes, state which evidence would need to be reassessed.", "why": "No; contamination and compatibility must be verified. Returning clean condensate saves treated water and heat, but contamination can damage the boiler. Process leaks, oil or treatment incompatibility may require monitoring and diversion arrangements. Return tanks, vents and pumps face hot-water and flash-steam hazards. Do not assume clear-looking liquid is chemically acceptable. The alternative is not justified: Yes; heat content makes chemistry irrelevant."}], "part": "protection"},i=23,id='scenario'+i;

(function(){const H=CG.H,u={"title": "Reciprocating steam engines", "lessons": [{"title": "Work, displacement and valve timing", "teach": "A piston engine converts steam expansion into mechanical work over a pressure-volume cycle. Admission, cutoff, expansion, exhaust and compression shape the indicator diagram. Friction, leakage and heat transfer reduce shaft work. Historical drawings can teach mechanisms but do not establish safe material, speed or pressure ratings for a new engine.\n\nProfessional practice boundary: this explanation supports supervised learning and review. It is not an approved design, fabrication instruction, test procedure or operating authorisation. Actual decisions require the applicable code, current local requirements, plant-specific instructions and competent accountable people.", "worked": "An indicator diagram area estimates work per cycle; multiplying by cycles per second gives indicated power. Shaft power is lower after mechanical losses.", "q": "Is indicated power identical to shaft output?", "a": "No; mechanical losses reduce shaft output", "w": "Yes; bearings and seals consume no work", "work": "Worked reasoning: An indicator diagram area estimates work per cycle; multiplying by cycles per second gives indicated power. Shaft power is lower after mechanical losses.\n\nPaper workshop: write the claim being evaluated, identify its assumptions and missing evidence, then explain the consequence of the incorrect alternative: \u201cYes; bearings and seals consume no work\u201d. Distinguish an arithmetic result from a verified engineering decision. Record the professional role responsible for resolving any uncertainty. Do not perform a live pressure, combustion, electrical or fault experiment.\n\nReview prompt: Is indicated power identical to shaft output? Explain your reasoning before answering. If the context changes, state which evidence would need to be reassessed.", "why": "No; mechanical losses reduce shaft output. A piston engine converts steam expansion into mechanical work over a pressure-volume cycle. Admission, cutoff, expansion, exhaust and compression shape the indicator diagram. Friction, leakage and heat transfer reduce shaft work. Historical drawings can teach mechanisms but do not establish safe material, speed or pressure ratings for a new engine. The alternative is not justified: Yes; bearings and seals consume no work."}, {"title": "Lubrication, condensate and guarding", "teach": "Engines require suitable lubrication, alignment, drainage and protective guarding. Entrained liquid can cause mechanical shock because it is far less compressible than steam. Hot surfaces, reciprocating rods, flywheels and belts create distinct hazards. An engineered lubrication strategy must also consider condensate contamination.\n\nProfessional practice boundary: this explanation supports supervised learning and review. It is not an approved design, fabrication instruction, test procedure or operating authorisation. Actual decisions require the applicable code, current local requirements, plant-specific instructions and competent accountable people.", "worked": "A proposed display engine has an exposed flywheel and accessible rod. Even an approved steam supply does not resolve entanglement and impact hazards.", "q": "Does a certified boiler eliminate engine guarding needs?", "a": "No; mechanical hazards remain independently", "w": "Yes; certification covers all downstream moving parts", "work": "Worked reasoning: A proposed display engine has an exposed flywheel and accessible rod. Even an approved steam supply does not resolve entanglement and impact hazards.\n\nPaper workshop: write the claim being evaluated, identify its assumptions and missing evidence, then explain the consequence of the incorrect alternative: \u201cYes; certification covers all downstream moving parts\u201d. Distinguish an arithmetic result from a verified engineering decision. Record the professional role responsible for resolving any uncertainty. Do not perform a live pressure, combustion, electrical or fault experiment.\n\nReview prompt: Does a certified boiler eliminate engine guarding needs? Explain your reasoning before answering. If the context changes, state which evidence would need to be reassessed.", "why": "No; mechanical hazards remain independently. Engines require suitable lubrication, alignment, drainage and protective guarding. Entrained liquid can cause mechanical shock because it is far less compressible than steam. Hot surfaces, reciprocating rods, flywheels and belts create distinct hazards. An engineered lubrication strategy must also consider condensate contamination. The alternative is not justified: Yes; certification covers all downstream moving parts."}, {"title": "Speed control and overspeed", "teach": "Engine speed depends on steam admission, load and mechanical dynamics. A governor regulates normal speed; independently engineered overspeed protection addresses a dangerous failure or load rejection. Flywheel energy continues after steam is cut. Safe stopping and access need verified procedures and guards.\n\nProfessional practice boundary: this explanation supports supervised learning and review. It is not an approved design, fabrication instruction, test procedure or operating authorisation. Actual decisions require the applicable code, current local requirements, plant-specific instructions and competent accountable people.", "worked": "A generator belt breaks and engine load suddenly vanishes. The resulting acceleration must be addressed by the protection design, not by an operator grabbing the throttle.", "q": "What event can cause rapid overspeed?", "a": "Sudden loss of driven load", "w": "A guarantee of constant speed from a heavy flywheel", "work": "Worked reasoning: A generator belt breaks and engine load suddenly vanishes. The resulting acceleration must be addressed by the protection design, not by an operator grabbing the throttle.\n\nPaper workshop: write the claim being evaluated, identify its assumptions and missing evidence, then explain the consequence of the incorrect alternative: \u201cA guarantee of constant speed from a heavy flywheel\u201d. Distinguish an arithmetic result from a verified engineering decision. Record the professional role responsible for resolving any uncertainty. Do not perform a live pressure, combustion, electrical or fault experiment.\n\nReview prompt: What event can cause rapid overspeed? Explain your reasoning before answering. If the context changes, state which evidence would need to be reassessed.", "why": "Sudden loss of driven load. Engine speed depends on steam admission, load and mechanical dynamics. A governor regulates normal speed; independently engineered overspeed protection addresses a dangerous failure or load rejection. Flywheel energy continues after steam is cut. Safe stopping and access need verified procedures and guards. The alternative is not justified: A guarantee of constant speed from a heavy flywheel."}], "part": "protection"},i=24,id='scenario'+i;

(function(){const H=CG.H,u={"title": "Steam turbines and expanders", "lessons": [{"title": "Impulse and reaction principles", "teach": "Impulse stages extract work mainly from velocity changes after nozzle expansion; reaction stages also involve pressure change through moving passages. Real machines combine complex aerodynamic effects. Blade stress, rotor dynamics, clearances and material temperature require specialist design. This is not a guide to machining a high-speed rotor.\n\nProfessional practice boundary: this explanation supports supervised learning and review. It is not an approved design, fabrication instruction, test procedure or operating authorisation. Actual decisions require the applicable code, current local requirements, plant-specific instructions and competent accountable people.", "worked": "A nozzle accelerates steam but a nozzle alone does not generate electrical power; an expander must transfer energy to a controlled rotating system.", "q": "What does an expander do in a steam-electric plant?", "a": "Converts steam energy into shaft work", "w": "Creates energy independently of steam flow", "work": "Worked reasoning: A nozzle accelerates steam but a nozzle alone does not generate electrical power; an expander must transfer energy to a controlled rotating system.\n\nPaper workshop: write the claim being evaluated, identify its assumptions and missing evidence, then explain the consequence of the incorrect alternative: \u201cCreates energy independently of steam flow\u201d. Distinguish an arithmetic result from a verified engineering decision. Record the professional role responsible for resolving any uncertainty. Do not perform a live pressure, combustion, electrical or fault experiment.\n\nReview prompt: What does an expander do in a steam-electric plant? Explain your reasoning before answering. If the context changes, state which evidence would need to be reassessed.", "why": "Converts steam energy into shaft work. Impulse stages extract work mainly from velocity changes after nozzle expansion; reaction stages also involve pressure change through moving passages. Real machines combine complex aerodynamic effects. Blade stress, rotor dynamics, clearances and material temperature require specialist design. This is not a guide to machining a high-speed rotor. The alternative is not justified: Creates energy independently of steam flow."}, {"title": "Wetness, speed and scale limits", "teach": "Droplets can erode turbine blades, and high rotational speed creates severe containment and balancing demands. Very small turbines may have poor efficiency because leakage and clearances become large relative to flow passages. A model's visual success does not prove safe speed capability or useful efficiency.\n\nProfessional practice boundary: this explanation supports supervised learning and review. It is not an approved design, fabrication instruction, test procedure or operating authorisation. Actual decisions require the applicable code, current local requirements, plant-specific instructions and competent accountable people.", "worked": "A scaled-down turbine maintains proportionate exterior dimensions but not manufacturing clearances. Efficiency and rotor behaviour cannot be inferred by simple geometric scaling.", "q": "Can turbine safety and efficiency be assumed from geometric scaling alone?", "a": "No; clearances, stress and dynamics need assessment", "w": "Yes; every performance property scales identically", "work": "Worked reasoning: A scaled-down turbine maintains proportionate exterior dimensions but not manufacturing clearances. Efficiency and rotor behaviour cannot be inferred by simple geometric scaling.\n\nPaper workshop: write the claim being evaluated, identify its assumptions and missing evidence, then explain the consequence of the incorrect alternative: \u201cYes; every performance property scales identically\u201d. Distinguish an arithmetic result from a verified engineering decision. Record the professional role responsible for resolving any uncertainty. Do not perform a live pressure, combustion, electrical or fault experiment.\n\nReview prompt: Can turbine safety and efficiency be assumed from geometric scaling alone? Explain your reasoning before answering. If the context changes, state which evidence would need to be reassessed.", "why": "No; clearances, stress and dynamics need assessment. Droplets can erode turbine blades, and high rotational speed creates severe containment and balancing demands. Very small turbines may have poor efficiency because leakage and clearances become large relative to flow passages. A model's visual success does not prove safe speed capability or useful efficiency. The alternative is not justified: Yes; every performance property scales identically."}, {"title": "Alternatives and technology selection", "teach": "Reciprocating engines, turbines and other certified expanders suit different duties. Selection includes efficiency at part load, maintenance, speed matching, lubricant compatibility and total installed cost. At educational scale a purchased approved plant or simulation may be more defensible than a custom expander. No option removes boiler and electrical duties.\n\nProfessional practice boundary: this explanation supports supervised learning and review. It is not an approved design, fabrication instruction, test procedure or operating authorisation. Actual decisions require the applicable code, current local requirements, plant-specific instructions and competent accountable people.", "worked": "A low-output classroom system favours robust controllability and access over peak theoretical efficiency. Record this as a requirements trade-off, not an engineering failure.", "q": "Should peak theoretical efficiency be the only selection criterion?", "a": "No; safety, duty and maintainability also matter", "w": "Yes; all other requirements are optional", "work": "Worked reasoning: A low-output classroom system favours robust controllability and access over peak theoretical efficiency. Record this as a requirements trade-off, not an engineering failure.\n\nPaper workshop: write the claim being evaluated, identify its assumptions and missing evidence, then explain the consequence of the incorrect alternative: \u201cYes; all other requirements are optional\u201d. Distinguish an arithmetic result from a verified engineering decision. Record the professional role responsible for resolving any uncertainty. Do not perform a live pressure, combustion, electrical or fault experiment.\n\nReview prompt: Should peak theoretical efficiency be the only selection criterion? Explain your reasoning before answering. If the context changes, state which evidence would need to be reassessed.", "why": "No; safety, duty and maintainability also matter. Reciprocating engines, turbines and other certified expanders suit different duties. Selection includes efficiency at part load, maintenance, speed matching, lubricant compatibility and total installed cost. At educational scale a purchased approved plant or simulation may be more defensible than a custom expander. No option removes boiler and electrical duties. The alternative is not justified: Yes; all other requirements are optional."}], "part": "generation"},i=25,id='scenario'+i;

(function(){const H=CG.H,u={"title": "Generators and mechanical integration", "lessons": [{"title": "Torque, speed and electrical output", "teach": "Mechanical power is torque times angular speed: P=\u03c4\u03c9 with \u03c9=2\u03c0n/60 for rpm n. Generator efficiency converts shaft power to electrical power before auxiliary loads. Torque units must be newton metres, not force alone. Generator ratings include speed, cooling and duty and cannot be inferred from an open-circuit voltage.\n\nProfessional practice boundary: this explanation supports supervised learning and review. It is not an approved design, fabrication instruction, test procedure or operating authorisation. Actual decisions require the applicable code, current local requirements, plant-specific instructions and competent accountable people.", "worked": "At 1000 rpm and 10 N\u00b7m, shaft power is about 1.047 kW. At 80 percent generator efficiency, gross electricity is about 0.838 kW.", "q": "What additional measurement is needed with speed to determine shaft power?", "a": "Torque", "w": "Paint colour", "work": "Worked reasoning: At 1000 rpm and 10 N\u00b7m, shaft power is about 1.047 kW. At 80 percent generator efficiency, gross electricity is about 0.838 kW.\n\nPaper workshop: write the claim being evaluated, identify its assumptions and missing evidence, then explain the consequence of the incorrect alternative: \u201cPaint colour\u201d. Distinguish an arithmetic result from a verified engineering decision. Record the professional role responsible for resolving any uncertainty. Do not perform a live pressure, combustion, electrical or fault experiment.\n\nReview prompt: What additional measurement is needed with speed to determine shaft power? Explain your reasoning before answering. If the context changes, state which evidence would need to be reassessed.", "why": "Torque. Mechanical power is torque times angular speed: P=\u03c4\u03c9 with \u03c9=2\u03c0n/60 for rpm n. Generator efficiency converts shaft power to electrical power before auxiliary loads. Torque units must be newton metres, not force alone. Generator ratings include speed, cooling and duty and cannot be inferred from an open-circuit voltage. The alternative is not justified: Paint colour."}, {"title": "Couplings, alignment and guarding", "teach": "Couplings must accommodate approved alignment and transient loads while maintaining safe containment. Belts add tension, guarding and slip issues; direct couplings transmit vibration and axial or torsional loads. Overspeed can damage both prime mover and generator. Lifting, foundation and maintenance access require designed provisions.\n\nProfessional practice boundary: this explanation supports supervised learning and review. It is not an approved design, fabrication instruction, test procedure or operating authorisation. Actual decisions require the applicable code, current local requirements, plant-specific instructions and competent accountable people.", "worked": "A coupling guard is removed to improve visibility during operation. This introduces entanglement and fragment hazards; use safe observation methods instead.", "q": "Is removing a coupling guard for a live demonstration appropriate?", "a": "No; observation must preserve engineered protection", "w": "Yes; an attentive audience replaces guarding", "work": "Worked reasoning: A coupling guard is removed to improve visibility during operation. This introduces entanglement and fragment hazards; use safe observation methods instead.\n\nPaper workshop: write the claim being evaluated, identify its assumptions and missing evidence, then explain the consequence of the incorrect alternative: \u201cYes; an attentive audience replaces guarding\u201d. Distinguish an arithmetic result from a verified engineering decision. Record the professional role responsible for resolving any uncertainty. Do not perform a live pressure, combustion, electrical or fault experiment.\n\nReview prompt: Is removing a coupling guard for a live demonstration appropriate? Explain your reasoning before answering. If the context changes, state which evidence would need to be reassessed.", "why": "No; observation must preserve engineered protection. Couplings must accommodate approved alignment and transient loads while maintaining safe containment. Belts add tension, guarding and slip issues; direct couplings transmit vibration and axial or torsional loads. Overspeed can damage both prime mover and generator. Lifting, foundation and maintenance access require designed provisions. The alternative is not justified: Yes; an attentive audience replaces guarding."}, {"title": "AC, DC and isolation boundaries", "teach": "DC generators, permanent-magnet alternators and wound-field machines have different regulation needs. Voltage changes with speed and load according to machine design. Rectifiers, inverters, batteries and electrical protection require competent design and licensed work where applicable. No mains, grid or battery interconnection wiring instructions are provided here.\n\nProfessional practice boundary: this explanation supports supervised learning and review. It is not an approved design, fabrication instruction, test procedure or operating authorisation. Actual decisions require the applicable code, current local requirements, plant-specific instructions and competent accountable people.", "worked": "A spinning generator produces voltage with no connected load. It still presents an electrical hazard; open circuit is not the same as isolated and de-energised.", "q": "Does open circuit guarantee a spinning generator is electrically safe?", "a": "No; hazardous voltage can still be present", "w": "Yes; current can never flow when terminals are accessible", "work": "Worked reasoning: A spinning generator produces voltage with no connected load. It still presents an electrical hazard; open circuit is not the same as isolated and de-energised.\n\nPaper workshop: write the claim being evaluated, identify its assumptions and missing evidence, then explain the consequence of the incorrect alternative: \u201cYes; current can never flow when terminals are accessible\u201d. Distinguish an arithmetic result from a verified engineering decision. Record the professional role responsible for resolving any uncertainty. Do not perform a live pressure, combustion, electrical or fault experiment.\n\nReview prompt: Does open circuit guarantee a spinning generator is electrically safe? Explain your reasoning before answering. If the context changes, state which evidence would need to be reassessed.", "why": "No; hazardous voltage can still be present. DC generators, permanent-magnet alternators and wound-field machines have different regulation needs. Voltage changes with speed and load according to machine design. Rectifiers, inverters, batteries and electrical protection require competent design and licensed work where applicable. No mains, grid or battery interconnection wiring instructions are provided here. The alternative is not justified: Yes; current can never flow when terminals are accessible."}], "part": "generation"},i=26,id='scenario'+i;

(function(){const H=CG.H,u={"title": "Governors, loads and electrical protection", "lessons": [{"title": "Load balance and transients", "teach": "A generator load increase demands more shaft torque; if steam input does not follow, speed falls. Sudden load removal can cause overspeed. Control response must consider boiler storage, steam admission and rotor inertia. Dump loads, where used, are engineered parts of an approved protection system, not substitutes for overspeed shutdown.\n\nProfessional practice boundary: this explanation supports supervised learning and review. It is not an approved design, fabrication instruction, test procedure or operating authorisation. Actual decisions require the applicable code, current local requirements, plant-specific instructions and competent accountable people.", "worked": "A classroom lamp bank disconnects unexpectedly. The prime mover may accelerate before normal regulation reacts, so the load-rejection scenario belongs in the safety review.", "q": "What can sudden electrical load rejection cause?", "a": "Prime mover acceleration and overspeed", "w": "Automatic elimination of stored mechanical energy", "work": "Worked reasoning: A classroom lamp bank disconnects unexpectedly. The prime mover may accelerate before normal regulation reacts, so the load-rejection scenario belongs in the safety review.\n\nPaper workshop: write the claim being evaluated, identify its assumptions and missing evidence, then explain the consequence of the incorrect alternative: \u201cAutomatic elimination of stored mechanical energy\u201d. Distinguish an arithmetic result from a verified engineering decision. Record the professional role responsible for resolving any uncertainty. Do not perform a live pressure, combustion, electrical or fault experiment.\n\nReview prompt: What can sudden electrical load rejection cause? Explain your reasoning before answering. If the context changes, state which evidence would need to be reassessed.", "why": "Prime mover acceleration and overspeed. A generator load increase demands more shaft torque; if steam input does not follow, speed falls. Sudden load removal can cause overspeed. Control response must consider boiler storage, steam admission and rotor inertia. Dump loads, where used, are engineered parts of an approved protection system, not substitutes for overspeed shutdown. The alternative is not justified: Automatic elimination of stored mechanical energy."}, {"title": "Frequency, voltage and regulation", "teach": "For a synchronous generator, frequency f=pn/120 with p poles and n rpm. Voltage regulation and frequency regulation are related through load but are different control objectives. Inverter-based interfaces change the relationship between shaft speed and delivered frequency. Name the architecture before applying formulas.\n\nProfessional practice boundary: this explanation supports supervised learning and review. It is not an approved design, fabrication instruction, test procedure or operating authorisation. Actual decisions require the applicable code, current local requirements, plant-specific instructions and competent accountable people.", "worked": "A four-pole synchronous machine at 1500 rpm produces 50 Hz. This does not establish suitable voltage, synchronisation or permission to connect it anywhere.", "q": "What frequency does the four-pole 1500 rpm model produce?", "a": "50 Hz", "w": "100 Hz", "work": "Worked reasoning: A four-pole synchronous machine at 1500 rpm produces 50 Hz. This does not establish suitable voltage, synchronisation or permission to connect it anywhere.\n\nPaper workshop: write the claim being evaluated, identify its assumptions and missing evidence, then explain the consequence of the incorrect alternative: \u201c100 Hz\u201d. Distinguish an arithmetic result from a verified engineering decision. Record the professional role responsible for resolving any uncertainty. Do not perform a live pressure, combustion, electrical or fault experiment.\n\nReview prompt: What frequency does the four-pole 1500 rpm model produce? Explain your reasoning before answering. If the context changes, state which evidence would need to be reassessed.", "why": "50 Hz. For a synchronous generator, frequency f=pn/120 with p poles and n rpm. Voltage regulation and frequency regulation are related through load but are different control objectives. Inverter-based interfaces change the relationship between shaft speed and delivered frequency. Name the architecture before applying formulas. The alternative is not justified: 100 Hz."}, {"title": "Grid isolation and licensed electrical work", "teach": "Grid connection involves synchronisation or approved inverter interfaces, anti-islanding, protection coordination, utility approval and licensed installation. Never backfeed through a socket or assume a small generator is exempt. Standalone systems also need shock, fault, earthing and isolation assessment. Educational load simulation avoids these live interconnection hazards.\n\nProfessional practice boundary: this explanation supports supervised learning and review. It is not an approved design, fabrication instruction, test procedure or operating authorisation. Actual decisions require the applicable code, current local requirements, plant-specific instructions and competent accountable people.", "worked": "A proposed extension lead connects generator output to a wall socket. Reject this backfeed concept and refer all interconnection design to authorised professionals.", "q": "Is socket backfeeding an acceptable educational shortcut?", "a": "No; it is dangerous and not an approved interconnection", "w": "Yes; low output guarantees harmlessness", "work": "Worked reasoning: A proposed extension lead connects generator output to a wall socket. Reject this backfeed concept and refer all interconnection design to authorised professionals.\n\nPaper workshop: write the claim being evaluated, identify its assumptions and missing evidence, then explain the consequence of the incorrect alternative: \u201cYes; low output guarantees harmlessness\u201d. Distinguish an arithmetic result from a verified engineering decision. Record the professional role responsible for resolving any uncertainty. Do not perform a live pressure, combustion, electrical or fault experiment.\n\nReview prompt: Is socket backfeeding an acceptable educational shortcut? Explain your reasoning before answering. If the context changes, state which evidence would need to be reassessed.", "why": "No; it is dangerous and not an approved interconnection. Grid connection involves synchronisation or approved inverter interfaces, anti-islanding, protection coordination, utility approval and licensed installation. Never backfeed through a socket or assume a small generator is exempt. Standalone systems also need shock, fault, earthing and isolation assessment. Educational load simulation avoids these live interconnection hazards. The alternative is not justified: Yes; low output guarantees harmlessness."}], "part": "generation"},i=27,id='scenario'+i;
