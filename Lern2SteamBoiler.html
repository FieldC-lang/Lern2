<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Lern2SteamBoiler</title>
<meta name="description" content="108 lessons in steam boiler engineering, pressure-equipment precautions and steam-electric generation for supervised professional learning.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;500;700&family=Bricolage+Grotesque:wght@600;700;800&display=swap">
<style>
/* base.css — layout and components shared by every course: one mobile-first column that widens on tablets
   and PCs, a lesson path, a bottom tab bar and a full-screen lesson player. Colours and display fonts come
   from each course's theme.css (tokens only); sizes scale with the Display setting (CSS zoom on body). */
:root {
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 12px;
  --nav-h: 62px;
  --zoom: 1;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
code, .mono { font-family: var(--font-mono); font-size: .92em; }
code { background: var(--line-2); padding: .05em .35em; border-radius: 5px; white-space: nowrap; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.15; text-wrap: balance; margin: 0; letter-spacing: .01em; }
p { margin: 0; }
a { color: var(--brand); }
.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); }
.small { font-size: 13px; }
.tnum { font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.grow { flex: 1; min-width: 0; }
.eyebrow { font-family: var(--font-display); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }

/* field colour chips */
.fc { font-family: var(--font-mono); font-size: .85em; padding: .05em .4em; border-radius: 5px; white-space: nowrap; font-weight: 500; }
.fc-op { background: var(--f-op-2); color: var(--f-op); } .fc-rd { background: var(--f-rd-2); color: var(--f-rd); }
.fc-f3 { background: var(--f-f3-2); color: var(--f-f3); } .fc-rs1 { background: var(--f-rs1-2); color: var(--f-rs1); }
.fc-rs2 { background: var(--f-rs2-2); color: var(--f-rs2); } .fc-f7 { background: var(--f-f7-2); color: var(--f-f7); }
.fc-imm { background: var(--f-imm-2); color: var(--f-imm); }

/* ---------- shell ---------- */
.shell { min-height: 100%; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface);
  border-bottom: 1px solid var(--line-2);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.topbar-in { max-width: 720px; margin: 0 auto; height: 54px; display: flex; align-items: center; gap: 12px; }
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--font-display); font-weight: 800; font-size: 21px; letter-spacing: .02em; white-space: nowrap; min-width: 0; }
.brand-mark { width: 26px; height: 26px; }
.brand small { font-family: var(--font-mono); font-size: 10.5px; font-weight: 500; color: var(--ink-3); letter-spacing: .04em; margin-left: 2px; }
.top-stats { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.pill { display: inline-flex; align-items: center; gap: 5px; height: 30px; padding: 0 10px; border-radius: 999px; background: var(--card); border: 1px solid var(--line-2); font-weight: 700; font-size: 13.5px; font-variant-numeric: tabular-nums; }
.pill svg { width: 16px; height: 16px; }
.pill.gold { color: var(--gold); }
.pill.hot { color: var(--f-f3); }
.main {
  flex: 1; width: 100%; max-width: 720px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom, 0px));
}
.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--line-2);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px));
}
.nav-in { max-width: 720px; margin: 0 auto; height: var(--nav-h); display: grid; grid-template-columns: repeat(5, 1fr); }
.nav button { background: none; border: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--ink-3); font-size: 11.5px; font-weight: 700; letter-spacing: .02em; border-radius: 10px; }
.nav button svg { width: 24px; height: 24px; }
.nav button[aria-current="page"] { color: var(--brand); }
.nav button[aria-current="page"] svg { filter: drop-shadow(0 2px 6px color-mix(in srgb, var(--brand) 40%, transparent)); }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 18px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--card); font-weight: 700; letter-spacing: .01em;
  box-shadow: 0 2px 0 var(--line); transition: transform .08s ease, box-shadow .08s ease, background .15s;
}
.btn:active { transform: translateY(2px); box-shadow: 0 0 0 var(--line); }
.btn.primary { background: var(--brand); color: var(--brand-ink); border-color: transparent; box-shadow: 0 3px 0 color-mix(in srgb, var(--brand) 55%, #000); }
.btn.primary:active { box-shadow: 0 0 0 transparent; }
.btn.gold { background: var(--gold); color: var(--gold-ink); border-color: transparent; box-shadow: 0 3px 0 color-mix(in srgb, var(--gold) 55%, #000); }
.btn.ok { background: var(--ok); color: #fff; border-color: transparent; box-shadow: 0 3px 0 color-mix(in srgb, var(--ok) 55%, #000); }
.btn.bad { background: var(--bad); color: #fff; border-color: transparent; box-shadow: 0 3px 0 color-mix(in srgb, var(--bad) 55%, #000); }
.btn.ghost { background: transparent; box-shadow: none; border-color: var(--line); }
.btn.small { min-height: 36px; padding: 0 12px; font-size: 13.5px; border-radius: 10px; }
.btn.wide { width: 100%; }
.btn[disabled] { opacity: .45; cursor: not-allowed; transform: none; }
.iconbtn { width: 40px; height: 40px; border-radius: 10px; border: 0; background: transparent; display: grid; place-items: center; color: var(--ink-2); }
.iconbtn svg { width: 22px; height: 22px; }

/* ---------- learn path ---------- */
.hello { display: flex; gap: 14px; align-items: center; margin-bottom: 18px; }
.goal-ring { width: 54px; height: 54px; flex: none; }
.hello h1 { font-size: 22px; }
.unit { margin: 0 0 30px; }
.unit-head {
  position: relative; border-radius: 16px; padding: 16px 16px 14px; color: var(--ink); background: var(--card);
  border: 1px solid var(--line-2); overflow: hidden; box-shadow: var(--shadow);
}
.unit-head::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 6px; background: var(--uc); }
.unit-head .eyebrow { color: var(--uc); }
.unit-head h2 { font-size: 21px; margin: 4px 0 4px; }
.unit-head p { color: var(--ink-2); font-size: 14px; max-width: 60ch; }
.unit-meter { display: flex; align-items: center; gap: 10px; margin-top: 10px; font-size: 12.5px; color: var(--ink-3); font-weight: 700; }
.meter { flex: 1; height: 8px; border-radius: 99px; background: var(--line-2); overflow: hidden; }
.meter > i { display: block; height: 100%; background: var(--gold); border-radius: 99px; transition: width .4s ease; }
.die-stamp { position: absolute; right: 12px; top: 12px; font-family: var(--font-mono); font-size: 10px; color: var(--ink-3); letter-spacing: .06em; text-align: right; line-height: 1.3; }
.path { position: relative; margin: 6px auto 0; width: 100%; max-width: 360px; }
.path svg.trace { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.node-wrap { position: absolute; width: 136px; margin-left: -68px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.node {
  width: 64px; height: 64px; border-radius: 16px; border: 2px solid var(--line); background: var(--card); display: grid; place-items: center;
  box-shadow: 0 4px 0 var(--line); transition: transform .1s; position: relative; color: var(--ink-3);
}
.node svg { width: 28px; height: 28px; }
.node:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.node.done { background: var(--gold); border-color: transparent; color: var(--gold-ink); box-shadow: 0 4px 0 color-mix(in srgb, var(--gold) 55%, #000); }
.node.current { background: var(--brand); border-color: transparent; color: var(--brand-ink); box-shadow: 0 4px 0 color-mix(in srgb, var(--brand) 55%, #000); }
.node.current::after { content: ""; position: absolute; inset: -9px; border-radius: 22px; border: 3px solid var(--brand); opacity: .5; animation: ring 1.8s ease-out infinite; }
.node.locked { opacity: .55; cursor: not-allowed; }
.node.check { width: 78px; border-radius: 20px; }
.node-label { font-size: 12px; font-weight: 700; text-align: center; line-height: 1.2; color: var(--ink-2); max-width: 136px; text-wrap: balance; }
.node-stars { display: flex; gap: 1px; height: 12px; }
.node-stars svg { width: 12px; height: 12px; color: var(--gold); }
.start-tip { position: absolute; top: -30px; background: var(--card); border: 2px solid var(--brand); color: var(--brand); font-weight: 800; font-size: 12px; padding: 2px 10px; border-radius: 8px; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; animation: bob 1.6s ease-in-out infinite; }
@keyframes ring { 0% { transform: scale(.9); opacity: .6; } 100% { transform: scale(1.15); opacity: 0; } }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }

/* ---------- player ---------- */
.player { position: fixed; inset: 0; z-index: 60; background: var(--bg); display: flex; flex-direction: column; }
.p-top {
  flex: none; display: flex; align-items: center; gap: 10px; height: 56px; background: var(--bg);
  padding-top: env(safe-area-inset-top, 0px); box-sizing: content-box;
  padding-left: max(10px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.p-progress { flex: 1; height: 14px; border-radius: 99px; background: var(--line-2); overflow: hidden; }
.p-progress > i { display: block; height: 100%; background: var(--gold); border-radius: 99px; transition: width .35s ease; box-shadow: inset 0 -4px 0 rgba(0,0,0,.08), inset 0 3px 0 rgba(255,255,255,.35); }
.combo { font-family: var(--font-display); font-weight: 700; color: var(--f-f3); font-size: 15px; min-width: 38px; text-align: right; font-variant-numeric: tabular-nums; }
.p-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.p-body-in {
  max-width: 680px; margin: 0 auto; padding-block: 8px 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 16px;
}
.p-foot {
  flex: none; border-top: 1px solid var(--line-2); background: var(--surface); position: relative;
  padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.p-foot-in { max-width: 680px; margin: 0 auto; display: flex; gap: 10px; }
.p-foot-in .btn { flex: 1; }
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; transform: translateY(102%); transition: transform .25s cubic-bezier(.2,.8,.2,1);
  padding-block: 14px calc(12px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-top: 2px solid; max-height: calc(62vh / var(--zoom, 1)); overflow-y: auto;
}
.sheet.show { transform: translateY(0); }
.sheet.ok { background: var(--ok-2); border-color: var(--ok); }
.sheet.bad { background: var(--bad-2); border-color: var(--bad); }
.sheet-in { max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
.sheet h3 { font-size: 20px; display: flex; align-items: center; gap: 8px; }
.sheet.ok h3 { color: var(--ok); } .sheet.bad h3 { color: var(--bad); }
.sheet .why { color: var(--ink); font-size: 14.5px; }
.sheet .answer { font-size: 14px; color: var(--ink); }
.sheet .answer b { color: var(--bad); }
.kind-tag { font-family: var(--font-display); font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
.qtext { font-size: 18px; font-weight: 700; line-height: 1.38; }
.qtext code { font-size: .86em; white-space: normal; overflow-wrap: anywhere; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.learn h2 { font-size: 23px; }
.learn .body { font-size: 15.5px; color: var(--ink); display: flex; flex-direction: column; gap: 10px; }
.learn .body ul, .learn .body ol { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 4px; }
.learn .body ol li::marker { font-weight: 700; color: var(--brand); }
.body pre.code { margin: 2px 0; }
.spec {
  display: flex; gap: 8px; align-items: flex-start; font-size: 12.5px; color: var(--ink-2); background: var(--surface); border: 1px dashed var(--line);
  border-radius: 10px; padding: 8px 10px;
}
.spec svg { flex: none; width: 16px; height: 16px; margin-top: 2px; color: var(--ink-3); }
.hint { font-size: 13px; color: var(--ink-3); }
.shake { animation: shake .35s; }
@keyframes shake { 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }
.pop { animation: pop .3s; }
@keyframes pop { 50% { transform: scale(1.04); } }

/* ---------- exercise widgets ---------- */
.opts { display: grid; gap: 10px; }
.opts.two { grid-template-columns: 1fr 1fr; }
.opt {
  text-align: left; min-height: 50px; padding: 11px 14px; border-radius: 12px; border: 2px solid var(--line); background: var(--card);
  box-shadow: 0 3px 0 var(--line); font-size: 15px; display: flex; gap: 10px; align-items: center; line-height: 1.35;
}
.opt .k { flex: none; width: 24px; height: 24px; border-radius: 7px; border: 1.5px solid var(--line); display: grid; place-items: center; font-size: 12px; font-weight: 700; color: var(--ink-3); font-family: var(--font-mono); }
.opt[aria-pressed="true"] { border-color: var(--brand); background: var(--brand-2); box-shadow: 0 3px 0 var(--brand); }
.opt[aria-pressed="true"] .k { border-color: var(--brand); color: var(--brand); }
.opt.right { border-color: var(--ok); background: var(--ok-2); box-shadow: 0 3px 0 var(--ok); }
.opt.wrong { border-color: var(--bad); background: var(--bad-2); box-shadow: 0 3px 0 var(--bad); }
.opt:disabled { cursor: default; }
.opt code { white-space: normal; overflow-wrap: anywhere; }
.tfrow { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tfrow .opt { justify-content: center; font-weight: 700; font-size: 17px; min-height: 64px; }
.numwrap { display: flex; gap: 10px; align-items: center; }
.num {
  flex: 1; min-width: 0; height: 54px; border-radius: 12px; border: 2px solid var(--line); background: var(--card); padding: 0 14px;
  font-family: var(--font-mono); font-size: 20px; font-weight: 500;
}
.num:focus { border-color: var(--brand); outline: none; }
.num.right { border-color: var(--ok); background: var(--ok-2); } .num.wrong { border-color: var(--bad); background: var(--bad-2); }
.unit-label { font-weight: 700; color: var(--ink-2); }
.bits { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; }
.bitgrp { display: flex; gap: 3px; }
.bit {
  width: 34px; height: 44px; border-radius: 9px; border: 2px solid var(--line); background: var(--card); font-family: var(--font-mono);
  font-size: 18px; font-weight: 700; display: grid; place-items: center; color: var(--ink-3); box-shadow: 0 3px 0 var(--line); position: relative;
}
.bit.on { background: var(--brand); color: var(--brand-ink); border-color: transparent; box-shadow: 0 3px 0 color-mix(in srgb, var(--brand) 55%, #000); }
.bit small { position: absolute; top: -17px; font-size: 10px; color: var(--ink-3); font-weight: 500; }
.bit.locked { opacity: .5; cursor: default; }
.bits.dense .bit { width: 22px; height: 34px; font-size: 14px; border-radius: 6px; }
.bits.dense .bit small { font-size: 9px; top: -15px; }
.bitval { text-align: center; font-family: var(--font-mono); font-size: 14px; color: var(--ink-2); margin-top: 6px; }
.chipbank, .slots { display: flex; flex-wrap: wrap; gap: 8px; }
.slots { min-height: 56px; padding: 10px; border-radius: 12px; border: 2px dashed var(--line); background: var(--surface); }
.slots.vertical { flex-direction: column; }
.chip {
  border: 2px solid var(--line); background: var(--card); border-radius: 10px; padding: 8px 12px; font-weight: 700; font-size: 14.5px;
  box-shadow: 0 3px 0 var(--line); text-align: left; line-height: 1.3;
}
.chip.used { visibility: hidden; }
.chip.placed { border-color: var(--brand); background: var(--brand-2); box-shadow: 0 3px 0 var(--brand); }
.chip.right { border-color: var(--ok); background: var(--ok-2); box-shadow: 0 3px 0 var(--ok); }
.chip.wrong { border-color: var(--bad); background: var(--bad-2); box-shadow: 0 3px 0 var(--bad); }
.chip code { white-space: normal; }
.slot-n { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 6px; background: var(--brand); color: var(--brand-ink); font-size: 11px; margin-right: 6px; font-family: var(--font-mono); }
.match { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.match .col { display: flex; flex-direction: column; gap: 8px; }
.match .chip { width: 100%; min-height: 46px; }
.match .chip.sel { border-color: var(--brand); background: var(--brand-2); box-shadow: 0 3px 0 var(--brand); }
.match .chip.done { opacity: .35; border-color: var(--ok); cursor: default; }
.fill { font-size: 17px; line-height: 2.3; font-weight: 600; }
.blank { display: inline-flex; min-width: 70px; height: 36px; padding: 0 10px; align-items: center; justify-content: center; border-radius: 9px; border: 2px dashed var(--brand); background: var(--brand-2); color: var(--brand); font-family: var(--font-mono); font-size: 15px; vertical-align: middle; margin: 0 2px; }
.blank.empty { color: transparent; }
.blank.right { border-style: solid; border-color: var(--ok); background: var(--ok-2); color: var(--ok); }
.blank.wrong { border-style: solid; border-color: var(--bad); background: var(--bad-2); color: var(--bad); }
.sig-list { display: flex; flex-direction: column; gap: 8px; }
.sig { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.sig .nm { font-family: var(--font-mono); font-weight: 700; font-size: 13.5px; width: 76px; }
.seg { display: inline-flex; border: 2px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--card); flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 7px 11px; font-weight: 700; font-size: 13.5px; font-family: var(--font-mono); color: var(--ink-2); border-right: 1px solid var(--line-2); min-height: 36px; }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--brand); color: var(--brand-ink); }
.seg.text button { font-family: var(--font-body); }
.seg.right { border-color: var(--ok); } .seg.wrong { border-color: var(--bad); }
.splitter { display: flex; flex-direction: column; gap: 10px; }
.split-ctl { display: flex; align-items: center; gap: 10px; }
.split-ctl .nm { width: 64px; font-weight: 700; }
.stepper { display: inline-flex; align-items: center; border: 2px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--card); }
.stepper button { width: 40px; height: 38px; border: 0; background: transparent; font-size: 20px; font-weight: 700; color: var(--ink-2); }
.stepper span { min-width: 40px; text-align: center; font-family: var(--font-mono); font-weight: 700; font-size: 16px; }
.hotspot-hint { font-size: 13px; color: var(--ink-3); text-align: center; }

/* ---------- figures ---------- */
.fig { margin: 0; display: flex; flex-direction: column; gap: 8px; }
.fig-box { background: var(--card); border: 1px solid var(--line-2); border-radius: 14px; padding: 12px; overflow-x: auto; }
.fig-box.flush { padding: 0; }
.fig svg { display: block; width: 100%; height: auto; max-width: 600px; margin: 0 auto; overflow: visible; }
.fig svg.wide { min-width: 340px; }
.fig figcaption { font-size: 13px; color: var(--ink-2); padding: 0 2px; }
.fig .ctl { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; margin-top: 10px; }
.fig .readout { text-align: center; font-size: 13px; color: var(--ink-2); margin-top: 8px; }
.svg-hot { cursor: pointer; }
/* drawings set their colours inline, so the interaction states must win with !important */
.svg-hot:hover rect, .svg-hot:hover path, .svg-hot:hover circle, .svg-hot:hover polygon { stroke: var(--brand) !important; }
.svg-hot.picked rect, .svg-hot.picked path, .svg-hot.picked polygon, .svg-hot.picked circle { stroke: var(--brand) !important; stroke-width: 3 !important; }
.svg-hot.right rect, .svg-hot.right path, .svg-hot.right polygon, .svg-hot.right circle { stroke: var(--ok) !important; stroke-width: 3 !important; }
.svg-hot.wrong rect, .svg-hot.wrong path, .svg-hot.wrong polygon, .svg-hot.wrong circle { stroke: var(--bad) !important; stroke-width: 3 !important; }
.svg-hot.picked, .svg-hot.right, .svg-hot.wrong { opacity: 1 !important; }
.flow-dash { stroke-dasharray: 6 5; animation: flow 1s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -11; } }
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line-2); border-radius: 12px; background: var(--card); }
table.t { border-collapse: collapse; width: 100%; font-size: 13.5px; }
table.t th, table.t td { padding: 7px 10px; border-bottom: 1px solid var(--line-2); text-align: left; vertical-align: top; }
table.t th { font-family: var(--font-display); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); background: var(--surface); position: sticky; top: 0; white-space: nowrap; }
table.t tr:last-child td { border-bottom: 0; }
table.t td.mono, table.t td code { font-family: var(--font-mono); font-size: 12.5px; }
table.t tr.hl td { background: var(--gold-2); }
table.t tr.dim td { opacity: .45; }

/* ---------- end screen ---------- */
.done-screen { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center; padding: 24px 16px; }

.done-tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; width: 100%; max-width: 420px; }
.tile { border-radius: 14px; border: 2px solid var(--line-2); background: var(--card); padding: 10px 8px; }
.tile .v { font-family: var(--font-display); font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
.tile .l { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); }
.tile.gold .v { color: var(--gold); } .tile.ok .v { color: var(--ok); } .tile.brand .v { color: var(--brand); }
.big-stars { display: flex; gap: 6px; }
.big-stars svg { width: 44px; height: 44px; color: var(--line); }
.big-stars svg.on { color: var(--gold); animation: pop .4s backwards; }

/* ---------- sections, cards ---------- */
.section-title { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 6px 0 12px; }
.section-title h2 { font-size: 22px; }
.cards { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); }
.card {
  background: var(--card); border: 1px solid var(--line-2); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 8px;
  box-shadow: var(--shadow); min-width: 0;
}
button.card { text-align: left; cursor: pointer; }
.card h3 { font-size: 17px; }
.card .ic { width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center; background: var(--brand-2); color: var(--brand); flex: none; }
.card .ic svg { width: 22px; height: 22px; }
.card-row { display: flex; gap: 12px; align-items: center; }
.tag { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 6px; font-size: 11.5px; font-weight: 700; background: var(--line-2); color: var(--ink-2); letter-spacing: .02em; }
.tag.gold { background: var(--gold-2); color: var(--gold); }
.tag.ok { background: var(--ok-2); color: var(--ok); }
.tag.brand { background: var(--brand-2); color: var(--brand); }
.back { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; color: var(--ink-2); font-weight: 700; padding: 6px 0; margin-bottom: 6px; }
.back svg { width: 18px; height: 18px; }
.lab-head { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.lab-head h2 { font-size: 24px; }
.panel { background: var(--card); border: 1px solid var(--line-2); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.build-list { display: grid; gap: 8px; }
@media (min-width: 760px) { .build-list { grid-template-columns: 1fr 1fr; } }
.build-item { background: var(--card); border: 1px solid var(--line-2); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.build-item h4 { margin: 0; font-size: 15px; }
.bl-row { display: flex; gap: 10px; font-size: 13.5px; line-height: 1.4; min-width: 0; }
.bl-k { flex: none; width: 46px; padding-top: 2px; font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.panel h3 { font-size: 15px; letter-spacing: .02em; }
.ctrl-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.ctrl-row label { font-size: 13px; font-weight: 700; color: var(--ink-2); }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field > span { font-size: 12px; font-weight: 700; color: var(--ink-3); letter-spacing: .04em; text-transform: uppercase; }
select.sel, input.txt {
  height: 40px; border-radius: 10px; border: 2px solid var(--line); background: var(--card); padding: 0 10px; font-weight: 700; font-size: 14px; min-width: 0;
}
input.txt { font-family: var(--font-mono); font-weight: 500; }
textarea.code {
  width: 100%; min-height: 170px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); padding: 10px 12px;
  font-family: var(--font-mono); font-size: 13px; line-height: 1.55; resize: vertical; white-space: pre; overflow-x: auto;
}
textarea.code:focus, select.sel:focus, input.txt:focus { border-color: var(--brand); outline: none; }
.err { color: var(--bad); font-size: 13px; font-weight: 700; }
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line-2); border-radius: 12px; padding: 8px 10px; }
.stat .v { font-family: var(--font-display); font-weight: 700; font-size: 20px; font-variant-numeric: tabular-nums; }
.stat .l { font-size: 11px; font-weight: 700; color: var(--ink-3); text-transform: uppercase; letter-spacing: .06em; }
.stat.good .v { color: var(--ok); } .stat.warnc .v { color: var(--f-rs2); } .stat.badc .v { color: var(--bad); }
.notes { display: flex; flex-direction: column; gap: 8px; }
.note { display: flex; gap: 8px; font-size: 13.5px; padding: 8px 10px; border-radius: 10px; background: var(--surface); border-left: 4px solid var(--line); }
.note.warn { border-left-color: var(--f-rs2); } .note.good { border-left-color: var(--ok); } .note.fix { border-left-color: var(--brand); } .note.info { border-left-color: var(--ink-3); }
.scrub { width: 100%; accent-color: var(--brand); }
.toggle { position: relative; width: 50px; height: 30px; flex: none; }
.toggle input { opacity: 0; position: absolute; inset: 0; margin: 0; cursor: pointer; z-index: 1; }
.toggle i { position: absolute; inset: 0; border-radius: 99px; background: var(--line); transition: background .15s; }
.toggle i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--card); transition: transform .15s; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
.toggle input:checked + i { background: var(--brand); }
.toggle input:checked + i::after { transform: translateX(20px); }
.toggle input:focus-visible + i { outline: 2px solid var(--brand); outline-offset: 2px; }
.setting { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line-2); }
.setting:last-child { border-bottom: 0; }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 10px; }
.badge { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; font-size: 12px; font-weight: 700; color: var(--ink-2); }
.badge .b { width: 62px; height: 62px; }
.badge.off { opacity: .4; filter: grayscale(1); }
.search { width: 100%; height: 44px; border-radius: 12px; border: 2px solid var(--line); background: var(--card); padding: 0 14px; font-size: 15px; }
.search:focus { border-color: var(--brand); outline: none; }
.gloss dt { font-weight: 700; font-family: var(--font-display); font-size: 16px; }
.gloss dd { margin: 2px 0 12px; color: var(--ink-2); font-size: 14px; }
.reg-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.reg { border-radius: 9px; padding: 6px 4px; text-align: center; border: 1px solid var(--line-2); background: var(--surface); font-family: var(--font-mono); font-size: 12px; line-height: 1.25; min-width: 0; }
.reg b { display: block; font-size: 13px; }
.reg.changed { background: var(--gold-2); border-color: var(--gold); }
.toast { position: fixed; left: 50%; bottom: calc(var(--nav-h) + 18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px); opacity: 0; transition: all .25s; z-index: 90; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 700; font-size: 14px; pointer-events: none; max-width: calc(100% - 32px); text-align: center; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.confirm { display: flex; flex-direction: column; gap: 10px; padding: 12px; border: 2px solid var(--bad); border-radius: 12px; background: var(--bad-2); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12px; color: var(--ink-2); justify-content: center; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.cyclebar { display: flex; align-items: center; gap: 8px; }
.cyclebar .btn { min-height: 36px; padding: 0 10px; }
.timeline { display: flex; flex-wrap: wrap; gap: 3px; }
.timeline i { width: 16px; height: 22px; border-radius: 4px; display: grid; place-items: center; font-style: normal; font-size: 10px; font-weight: 700; font-family: var(--font-mono); }
.timeline i.ok { background: var(--ok-2); color: var(--ok); } .timeline i.no { background: var(--bad-2); color: var(--bad); }
.timeline i.cur { outline: 2px solid var(--brand); }

@media (min-width: 900px) {
  .main { max-width: 860px; }
  .topbar-in, .nav-in { max-width: 860px; }
  .two-col { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; align-items: start; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
.part-head { margin: 28px 0 16px; padding: 12px 14px; border-radius: 12px; background: var(--surface); border: 1px dashed var(--line); display: flex; flex-direction: column; gap: 4px; }
.part-head .eyebrow { color: var(--brand); font-size: 13px; }
.node-stars svg.off { color: var(--line); }
.console { background: var(--term-bg); color: var(--term-ink); border: 1px solid var(--line); border-radius: 12px; padding: 12px; font-family: var(--font-mono); font-size: 12px; line-height: 1.5; white-space: pre; overflow-x: auto; min-height: 64px; max-height: 280px; overflow-y: auto; }
.console .cursor { display: inline-block; width: 8px; height: 15px; background: var(--gold); vertical-align: -2px; animation: blink 1s steps(2) infinite; }
@keyframes blink { to { opacity: 0; } }
pre.code { margin: 0; background: var(--surface); border: 1px solid var(--line-2); border-radius: 12px; padding: 10px 12px; font-family: var(--font-mono); font-size: 12px; line-height: 1.5; overflow-x: auto; max-height: 320px; tab-size: 4; }
.banner { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 12px; font-weight: 700; font-size: 14px; }
.banner svg { width: 20px; height: 20px; flex: none; }
.banner.pass { background: var(--ok-2); color: var(--ok); } .banner.fail { background: var(--bad-2); color: var(--bad); } .banner.info { background: var(--brand-2); color: var(--brand); } .banner.warn { background: var(--gold-2); color: var(--gold); }
.evlist { display: flex; flex-direction: column; gap: 6px; max-height: 280px; overflow-y: auto; }
.ev { display: flex; gap: 8px; align-items: baseline; font-size: 13px; padding: 6px 8px; border-radius: 8px; background: var(--surface); }
.ev .n { font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); min-width: 44px; }
.ev .m { font-family: var(--font-mono); font-size: 11.5px; font-weight: 700; padding: 1px 6px; border-radius: 5px; white-space: nowrap; }
.mode-M { background: var(--f-f3-2); color: var(--f-f3); } .mode-S { background: var(--f-rs1-2); color: var(--f-rs1); } .mode-U { background: var(--f-rd-2); color: var(--f-rd); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { border: 1.5px solid var(--line); background: var(--card); border-radius: 8px; padding: 5px 9px; font-family: var(--font-mono); font-size: 12.5px; font-weight: 500; }
.chips button[aria-pressed="true"] { border-color: var(--brand); background: var(--brand-2); color: var(--brand); }
.tile-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px; }
.kv dt { color: var(--ink-3); font-weight: 700; }
.kv dd { margin: 0; font-family: var(--font-mono); }
.btn svg { width: 18px; height: 18px; flex: none; }
.sheet h3 svg { width: 24px; height: 24px; flex: none; }
.bits { padding-top: 16px; }
.fig pre.code { max-height: none; }
.hl-line { display: block; background: var(--gold-2); margin: 0 -12px; padding: 0 12px; }
.plain-line { display: block; }
/* program source under a firmware run */
.src-details { margin-top: 8px; }
.src-details > summary { cursor: pointer; font-weight: 700; font-size: 13px; color: var(--brand); padding: 6px 0; list-style-position: inside; }
.fig .src-details pre.code { max-height: 420px; overflow: auto; margin-top: 6px; }

/* ---------- lab widgets ---------- */
.stats.tight { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 6px; }
.stats.tight .stat .v { font-size: 17px; }
.stats.tight .stat .l { letter-spacing: .04em; }
.slider { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.slider-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: 13px; font-weight: 700; color: var(--ink-2); }
.slider-val { font-family: var(--font-mono); font-weight: 500; color: var(--ink); white-space: nowrap; font-size: 12.5px; }
.studio-h { font-size: 18px; margin-top: 8px; }
.ev .m.ev-thermal { background: var(--gold-2); color: var(--gold); }
.ev .m.ev-error { background: var(--bad-2); color: var(--bad); }
.ref-figure { margin-top: 4px; }

@media (max-width: 440px) { .brand small { display: none; } .brand { font-size: 18px; } .multi .brand-name { font-size: 17px; } .top-stats { gap: 4px; } .top-stats .pill { padding: 0 8px; } }

/* ---------- display: size and full screen ---------- */
.view-panel {
  position: fixed; z-index: 95; top: calc(env(safe-area-inset-top, 0px) + 56px); right: max(10px, env(safe-area-inset-right, 0px));
  width: min(320px, calc(100vw / var(--zoom, 1) - 20px)); background: var(--card); color: var(--ink); border: 1px solid var(--line);
  border-radius: 14px; box-shadow: 0 16px 40px -12px rgba(0, 0, 0, .35); padding: 14px; display: flex; flex-direction: column; gap: 12px;
}
.vp-row { display: flex; align-items: center; gap: 8px; }
.vp-row .btn.small { min-width: 40px; }
.vp-pct { min-width: 52px; text-align: center; font-weight: 700; font-size: 15px; }
.p-top .p-view { flex: none; }
body.playing { overflow: hidden; }

/* ---------- course switcher (several courses in one app) ---------- */
.course-switch { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 0 0 18px; }
.cs-btn {
  display: flex; flex-direction: column; align-items: flex-start; gap: 4px; min-width: 0; text-align: left; padding: 9px 10px 10px;
  border-radius: 14px; border: 2px solid var(--line-2); background: var(--card); color: var(--ink); box-shadow: 0 3px 0 var(--line-2);
}
.cs-btn.on { border-color: var(--brand); box-shadow: 0 3px 0 var(--brand); background: color-mix(in srgb, var(--brand) 8%, var(--card)); }
.cs-top { display: flex; align-items: center; gap: 6px; width: 100%; }
.cs-top .brand-mark { width: 22px; height: 22px; flex: none; }
.cs-n { font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); font-weight: 700; }
.cs-short { font-family: var(--font-display); font-weight: 800; font-size: 16px; letter-spacing: .02em; }
.cs-name { font-size: 12px; font-weight: 700; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.cs-meter { width: 100%; height: 5px; border-radius: 9px; background: var(--line-2); overflow: hidden; }
.cs-meter > i { display: block; height: 100%; background: var(--gold); }
.course-tag { color: var(--brand); }
.me-h { margin: 22px 0 10px; font-size: 17px; display: flex; align-items: center; gap: 8px; }
.me-h .brand-mark { width: 22px; height: 22px; flex: none; }
.me-badges { margin: 0 0 10px; }
.me-badges > summary { cursor: pointer; font-weight: 700; font-size: 13.5px; color: var(--brand); padding: 4px 0 10px; }
.brand-name { overflow: hidden; text-overflow: ellipsis; }
.brand-stack { display: flex; align-items: center; gap: 8px; min-width: 0; }
.brand-tag { flex: none; font-family: var(--font-body); font-size: 11px; font-weight: 700; letter-spacing: .06em; line-height: 1; padding: 4px 6px; border-radius: 6px; background: var(--brand); color: var(--brand-ink); }
@media (max-width: 440px) {
  .brand-stack { flex-direction: column; align-items: flex-start; gap: 2px; }
  .brand-stack .brand-name { max-width: 100%; line-height: 1.1; }
  .brand-stack .brand-tag { font-size: 9px; padding: 2px 4px; border-radius: 4px; }
}
@media (max-width: 380px) { .multi .brand-stack .brand-name { font-size: 14px; } }

/* ---------- code exercises ---------- */
.goal-line { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; padding: 8px 10px; border-radius: 10px; background: var(--gold-2); color: var(--ink); }
.goal-line svg { width: 18px; height: 18px; flex: none; color: var(--gold); margin-top: 1px; }
.code-wrap { display: flex; border: 2px solid var(--line); border-radius: 12px; background: var(--surface); overflow: hidden; }
.code-wrap:focus-within { border-color: var(--brand); }
.code-ln {
  flex: none; padding: 10px 6px 10px 8px; text-align: right; font-family: var(--font-mono); font-size: 12px; line-height: 1.6; color: var(--ink-3);
  background: color-mix(in srgb, var(--line-2) 55%, var(--surface)); overflow: hidden; user-select: none; min-width: 34px;
}
.code-ln span { display: block; }
textarea.code-ed {
  flex: 1; min-width: 0; border: 0; outline: none; resize: none; background: transparent; padding: 10px 12px; margin: 0;
  font-family: var(--font-mono); font-size: 12px; line-height: 1.6; white-space: pre; overflow: auto; tab-size: 4; min-height: 120px; color: var(--ink);
}
@media (pointer: coarse) { textarea.code-ed, .code-ln { font-size: 16px; } }
.code-snips { gap: 6px; }
.code-snips button { font-size: 13px; padding: 6px 9px; min-height: 34px; }
.code-bar { gap: 8px; }
.code-out:empty { display: none; }

/* ---------- wider screens: tablets and PCs ---------- */
@media (min-width: 1100px) {
  .main { max-width: 980px; }
  .topbar-in, .nav-in { max-width: 980px; }
  .p-body-in, .p-foot-in, .sheet-in { max-width: 760px; }
}
.svg-hot:focus { outline: none; }
.svg-hot:focus-visible { outline: 2.5px solid var(--gold); outline-offset: 2px; }

/* ======== Lern2SteamBoiler theme ======== */
/* Steam, copper and engineering blue */
:root {
  --bg: #EAEDE6;
  --surface: #F7F8F3;
  --card: #FFFFFF;
  --ink: #1D1B17;
  --ink-2: #46413A;
  --ink-3: #6B655C;
  --line: #CFD5CA;
  --line-2: #E3E7DE;
  --brand: #24616A;
  --brand-2: #D5E9E5;
  --brand-ink: #FFFFFF;
  --gold: #997017;
  --gold-2: #F8EDCF;
  --gold-ink: #FFFFFF;
  --ok: #2B7F3E;
  --ok-2: #DCEEDF;
  --bad: #C0353F;
  --bad-2: #F7DCDE;
  --wire: #9C958A;
  --hot: #C7307A;
  --f-op: #2B7F3E;
  --f-rd: #1E5DBE;
  --f-f3: #C0353F;
  --f-rs1: #7841B3;
  --f-rs2: #A96500;
  --f-f7: #0B7A80;
  --f-imm: #B02E78;
  --f-op-2: #DCEEDF;
  --f-rd-2: #DEE7F7;
  --f-f3-2: #F7DCDE;
  --f-rs1-2: #ECE2F7;
  --f-rs2-2: #F6E9D3;
  --f-f7-2: #D3ECEC;
  --f-imm-2: #F5DDEA;
  --bm-margin: #F3CFA4;
  --bm-border: #EFDC97;
  --bm-padding: #C7DCA0;

.fig-box.center { display: flex; justify-content: center; }

.test-row.bad { border-left-color: var(--bad); }
.test-row .ic { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 12px; flex: none; background: var(--ok-2); color: var(--ok); }
.test-row.bad .ic { background: var(--bad-2); color: var(--bad); }
.test-row .tx { min-width: 0; overflow-wrap: anywhere; }

.sl-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px 14px; }
.note.bad { border-left-color: var(--bad); }

.stage-tabs button { border: 1.5px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 6px 11px; font-size: 12.5px; font-weight: 700; cursor: pointer; }
.stage-tabs button[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }

      } else txt.push(p);
    });
    if (txt.length || viz) out.push(LS0(h + ' (continued)', txt.join('\n\n'), viz));
    return out;
  };
  H.lesson = (id, title, ref, items) => lesson0(id, title, ref, [].concat(...items.map(x => Array.isArray(x) ? x : [x])));
})();

(function(){const H=CG.H,u={"title": "Professional scope and energy hazards", "lessons": [{"title": "Permission to learn versus permission to operate", "teach": "A boiler confines heated water and steam. A failure can release both pressure energy and flash steam from hot liquid, so modest gauge pressure is not a harmless condition. This course develops engineering reasoning and fabrication oversight, not an approved pressure-vessel design. Competent designers, authorised fabricators, inspectors and licensed operators have different duties. No app can enumerate every precaution for every installation.\n\nProfessional practice boundary: this explanation supports supervised learning and review. It is not an approved design, fabrication instruction, test procedure or operating authorisation. Actual decisions require the applicable code, current local requirements, plant-specific instructions and competent accountable people.", "worked": "A project has drawings but no independent design verification: the correct milestone is a hold, not fabrication.", "q": "What should happen when independent design verification is missing?", "a": "Hold fabrication and resolve the design approval gap", "w": "Start fabrication and obtain signatures later", "work": "Worked reasoning: A project has drawings but no independent design verification: the correct milestone is a hold, not fabrication.\n\nPaper workshop: write the claim being evaluated, identify its assumptions and missing evidence, then explain the consequence of the incorrect alternative: \u201cStart fabrication and obtain signatures later\u201d. Distinguish an arithmetic result from a verified engineering decision. Record the professional role responsible for resolving any uncertainty. Do not perform a live pressure, combustion, electrical or fault experiment.\n\nReview prompt: What should happen when independent design verification is missing? Explain your reasoning before answering. If the context changes, state which evidence would need to be reassessed.", "why": "Hold fabrication and resolve the design approval gap. A boiler confines heated water and steam. A failure can release both pressure energy and flash steam from hot liquid, so modest gauge pressure is not a harmless condition. This course develops engineering reasoning and fabrication oversight, not an approved pressure-vessel design. Competent designers, authorised fabricators, inspectors and licensed operators have different duties. No app can enumerate every precaution for every installation. The alternative is not justified: Start fabrication and obtain signatures later."}, {"title": "Stored energy and flash boiling", "teach": "Liquid above its atmospheric boiling temperature can partly flash to vapour when containment fails. Expansion accelerates water, fragments and steam; scalding is not limited to the immediate shell. Pressure alone does not describe consequence: volume, temperature, fluid inventory and location matter. A small teaching plant still needs competent hazard classification.\n\nProfessional practice boundary: this explanation supports supervised learning and review. It is not an approved design, fabrication instruction, test procedure or operating authorisation. Actual decisions require the applicable code, current local requirements, plant-specific instructions and competent accountable people.", "worked": "Two vessels at the same pressure contain different hot-water inventories. The larger inventory can release more thermal energy; pressure equality does not establish equal risk.", "q": "Does equal pressure imply equal failure consequence?", "a": "No; inventory and temperature also matter", "w": "Yes; pressure is the only relevant variable", "work": "Worked reasoning: Two vessels at the same pressure contain different hot-water inventories. The larger inventory can release more thermal energy; pressure equality does not establish equal risk.\n\nPaper workshop: write the claim being evaluated, identify its assumptions and missing evidence, then explain the consequence of the incorrect alternative: \u201cYes; pressure is the only relevant variable\u201d. Distinguish an arithmetic result from a verified engineering decision. Record the professional role responsible for resolving any uncertainty. Do not perform a live pressure, combustion, electrical or fault experiment.\n\nReview prompt: Does equal pressure imply equal failure consequence? Explain your reasoning before answering. If the context changes, state which evidence would need to be reassessed.", "why": "No; inventory and temperature also matter. Liquid above its atmospheric boiling temperature can partly flash to vapour when containment fails. Expansion accelerates water, fragments and steam; scalding is not limited to the immediate shell. Pressure alone does not describe consequence: volume, temperature, fluid inventory and location matter. A small teaching plant still needs competent hazard classification. The alternative is not justified: Yes; pressure is the only relevant variable."}, {"title": "Hierarchy of controls", "teach": "Eliminating live pressure in a lesson is stronger than adding gloves. Simulations, transparent cold-flow models and approved commercial training equipment allow learning without improvising containment. Engineering protection, administrative systems and PPE complement rather than replace competent design. Exclusion zones, escape access, insulation and shielding depend on the installation risk assessment.\n\nProfessional practice boundary: this explanation supports supervised learning and review. It is not an approved design, fabrication instruction, test procedure or operating authorisation. Actual decisions require the applicable code, current local requirements, plant-specific instructions and competent accountable people.", "worked": "Replace a proposed homemade fired vessel demonstration with a desktop Rankine simulation. This removes that demonstration's containment and combustion hazards.", "q": "Which control removes the live-pressure demonstration hazard?", "a": "Use a simulation instead of a live homemade vessel", "w": "Wear thicker gloves beside the live homemade vessel", "work": "Worked reasoning: Replace a proposed homemade fired vessel demonstration with a desktop Rankine simulation. This removes that demonstration's containment and combustion hazards.\n\nPaper workshop: write the claim being evaluated, identify its assumptions and missing evidence, then explain the consequence of the incorrect alternative: \u201cWear thicker gloves beside the live homemade vessel\u201d. Distinguish an arithmetic result from a verified engineering decision. Record the professional role responsible for resolving any uncertainty. Do not perform a live pressure, combustion, electrical or fault experiment.\n\nReview prompt: Which control removes the live-pressure demonstration hazard? Explain your reasoning before answering. If the context changes, state which evidence would need to be reassessed.", "why": "Use a simulation instead of a live homemade vessel. Eliminating live pressure in a lesson is stronger than adding gloves. Simulations, transparent cold-flow models and approved commercial training equipment allow learning without improvising containment. Engineering protection, administrative systems and PPE complement rather than replace competent design. Exclusion zones, escape access, insulation and shielding depend on the installation risk assessment. The alternative is not justified: Wear thicker gloves beside the live homemade vessel."}], "part": "scope"},i=1,id='scenario'+i;

(function(){const H=CG.H,u={"title": "Units, states and engineering records", "lessons": [{"title": "Absolute and gauge pressure", "teach": "Gauge pressure is relative to local atmosphere; absolute pressure is relative to vacuum. Saturation tables require absolute pressure. Near sea level 2 bar gauge is approximately 3.013 bar absolute, but weather and elevation change atmospheric pressure. Vacuum service and condenser calculations are especially vulnerable to reference errors. Every drawing, instrument and calculation must label its pressure reference.\n\nProfessional practice boundary: this explanation supports supervised learning and review. It is not an approved design, fabrication instruction, test procedure or operating authorisation. Actual decisions require the applicable code, current local requirements, plant-specific instructions and competent accountable people.", "worked": "For a paper example, 200 kPa gauge plus 101.3 kPa atmospheric gives 301.3 kPa absolute; do not enter 200 into an absolute-pressure steam table.", "q": "Which pressure belongs in a saturation table?", "a": "Absolute pressure with stated units", "w": "Gauge pressure without correction", "work": "Worked reasoning: For a paper example, 200 kPa gauge plus 101.3 kPa atmospheric gives 301.3 kPa absolute; do not enter 200 into an absolute-pressure steam table.\n\nPaper workshop: write the claim being evaluated, identify its assumptions and missing evidence, then explain the consequence of the incorrect alternative: \u201cGauge pressure without correction\u201d. Distinguish an arithmetic result from a verified engineering decision. Record the professional role responsible for resolving any uncertainty. Do not perform a live pressure, combustion, electrical or fault experiment.\n\nReview prompt: Which pressure belongs in a saturation table? Explain your reasoning before answering. If the context changes, state which evidence would need to be reassessed.", "why": "Absolute pressure with stated units. Gauge pressure is relative to local atmosphere; absolute pressure is relative to vacuum. Saturation tables require absolute pressure. Near sea level 2 bar gauge is approximately 3.013 bar absolute, but weather and elevation change atmospheric pressure. Vacuum service and condenser calculations are especially vulnerable to reference errors. Every drawing, instrument and calculation must label its pressure reference. The alternative is not justified: Gauge pressure without correction."}, {"title": "Dimensional analysis and energy balances", "teach": "A kilogram per second multiplied by a kilojoule per kilogram gives a kilojoule per second, which is a kilowatt. Heat rate and stored heat are different quantities. State whether power is thermal, shaft or electrical, and whether values are gross or net. Track uncertainty and significant figures rather than reporting false precision.\n\nProfessional practice boundary: this explanation supports supervised learning and review. It is not an approved design, fabrication instruction, test procedure or operating authorisation. Actual decisions require the applicable code, current local requirements, plant-specific instructions and competent accountable people.", "worked": "0.02 kg/s \u00d7 2000 kJ/kg = 40 kW thermal. At an illustrative overall conversion of 5 percent, electricity would be 2 kW before separately counted auxiliaries.", "q": "What unit results from kg/s multiplied by kJ/kg?", "a": "kW", "w": "kWh without a time interval", "work": "Worked reasoning: 0.02 kg/s \u00d7 2000 kJ/kg = 40 kW thermal. At an illustrative overall conversion of 5 percent, electricity would be 2 kW before separately counted auxiliaries.\n\nPaper workshop: write the claim being evaluated, identify its assumptions and missing evidence, then explain the consequence of the incorrect alternative: \u201ckWh without a time interval\u201d. Distinguish an arithmetic result from a verified engineering decision. Record the professional role responsible for resolving any uncertainty. Do not perform a live pressure, combustion, electrical or fault experiment.\n\nReview prompt: What unit results from kg/s multiplied by kJ/kg? Explain your reasoning before answering. If the context changes, state which evidence would need to be reassessed.", "why": "kW. A kilogram per second multiplied by a kilojoule per kilogram gives a kilojoule per second, which is a kilowatt. Heat rate and stored heat are different quantities. State whether power is thermal, shaft or electrical, and whether values are gross or net. Track uncertainty and significant figures rather than reporting false precision. The alternative is not justified: kWh without a time interval."}, {"title": "Instrument registers and traceability", "teach": "Engineering records connect an instrument tag to its range, location, calibration, uncertainty, pressure rating and maintenance history. A gauge reading is evidence only if the sensing connection is sound and the device is suitable. A calibrated gauge isolated by a closed or blocked connection may report a plausible but irrelevant value.\n\nProfessional practice boundary: this explanation supports supervised learning and review. It is not an approved design, fabrication instruction, test procedure or operating authorisation. Actual decisions require the applicable code, current local requirements, plant-specific instructions and competent accountable people.", "worked": "A tagged gauge and transmitter disagree. Compare references and isolation status through authorised diagnosis; averaging their readings is not verification.", "q": "What should unexplained gauge disagreement trigger?", "a": "An authorised investigation of references and sensing paths", "w": "An automatic average of both readings", "work": "Worked reasoning: A tagged gauge and transmitter disagree. Compare references and isolation status through authorised diagnosis; averaging their readings is not verification.\n\nPaper workshop: write the claim being evaluated, identify its assumptions and missing evidence, then explain the consequence of the incorrect alternative: \u201cAn automatic average of both readings\u201d. Distinguish an arithmetic result from a verified engineering decision. Record the professional role responsible for resolving any uncertainty. Do not perform a live pressure, combustion, electrical or fault experiment.\n\nReview prompt: What should unexplained gauge disagreement trigger? Explain your reasoning before answering. If the context changes, state which evidence would need to be reassessed.", "why": "An authorised investigation of references and sensing paths. Engineering records connect an instrument tag to its range, location, calibration, uncertainty, pressure rating and maintenance history. A gauge reading is evidence only if the sensing connection is sound and the device is suitable. A calibrated gauge isolated by a closed or blocked connection may report a plausible but irrelevant value. The alternative is not justified: An automatic average of both readings."}], "part": "scope"},i=2,id='scenario'+i;

(function(){const H=CG.H,u={"title": "Phase change and steam properties", "lessons": [{"title": "Saturation and boiling", "teach": "At a specified absolute pressure, pure water in equilibrium has a corresponding saturation temperature. Increasing pressure increases boiling temperature. At roughly 1.013 bar absolute water boils near 100\u00b0C; at roughly 2 bar absolute it boils near 120\u00b0C. These rounded values teach trends, not operating settings or instrument acceptance limits.\n\nProfessional practice boundary: this explanation supports supervised learning and review. It is not an approved design, fabrication instruction, test procedure or operating authorisation. Actual decisions require the applicable code, current local requirements, plant-specific instructions and competent accountable people.", "worked": "A reading of 120\u00b0C near 2 bar absolute is consistent with saturation but does not establish steam dryness or instrument accuracy.", "q": "Does saturation temperature alone determine dryness?", "a": "No; liquid-vapour quality needs other information", "w": "Yes; all saturated steam is completely dry", "work": "Worked reasoning: A reading of 120\u00b0C near 2 bar absolute is consistent with saturation but does not establish steam dryness or instrument accuracy.\n\nPaper workshop: write the claim being evaluated, identify its assumptions and missing evidence, then explain the consequence of the incorrect alternative: \u201cYes; all saturated steam is completely dry\u201d. Distinguish an arithmetic result from a verified engineering decision. Record the professional role responsible for resolving any uncertainty. Do not perform a live pressure, combustion, electrical or fault experiment.\n\nReview prompt: Does saturation temperature alone determine dryness? Explain your reasoning before answering. If the context changes, state which evidence would need to be reassessed.", "why": "No; liquid-vapour quality needs other information. At a specified absolute pressure, pure water in equilibrium has a corresponding saturation temperature. Increasing pressure increases boiling temperature. At roughly 1.013 bar absolute water boils near 100\u00b0C; at roughly 2 bar absolute it boils near 120\u00b0C. These rounded values teach trends, not operating settings or instrument acceptance limits. The alternative is not justified: Yes; all saturated steam is completely dry."}, {"title": "Enthalpy and latent heat", "teach": "Specific enthalpy h combines internal energy and flow work and is tabulated relative to a convention. Saturated liquid enthalpy is hf; saturated vapour enthalpy is hg; latent enthalpy is hfg=hg\u2212hf. Boiler heat input per kilogram is approximately outlet enthalpy minus feedwater enthalpy before losses. Never mix reference conventions or pressure units across tables.\n\nProfessional practice boundary: this explanation supports supervised learning and review. It is not an approved design, fabrication instruction, test procedure or operating authorisation. Actual decisions require the applicable code, current local requirements, plant-specific instructions and competent accountable people.", "worked": "At atmospheric saturation use rounded hf=419 and hg=2676 kJ/kg. Latent enthalpy is 2257 kJ/kg, not 2676, because the liquid already carries sensible enthalpy.", "q": "How is latent enthalpy calculated?", "a": "hg minus hf", "w": "hg plus hf", "work": "Worked reasoning: At atmospheric saturation use rounded hf=419 and hg=2676 kJ/kg. Latent enthalpy is 2257 kJ/kg, not 2676, because the liquid already carries sensible enthalpy.\n\nPaper workshop: write the claim being evaluated, identify its assumptions and missing evidence, then explain the consequence of the incorrect alternative: \u201chg plus hf\u201d. Distinguish an arithmetic result from a verified engineering decision. Record the professional role responsible for resolving any uncertainty. Do not perform a live pressure, combustion, electrical or fault experiment.\n\nReview prompt: How is latent enthalpy calculated? Explain your reasoning before answering. If the context changes, state which evidence would need to be reassessed.", "why": "hg minus hf. Specific enthalpy h combines internal energy and flow work and is tabulated relative to a convention. Saturated liquid enthalpy is hf; saturated vapour enthalpy is hg; latent enthalpy is hfg=hg\u2212hf. Boiler heat input per kilogram is approximately outlet enthalpy minus feedwater enthalpy before losses. Never mix reference conventions or pressure units across tables. The alternative is not justified: hg plus hf."}, {"title": "Quality and superheat", "teach": "Within the two-phase region, quality x is vapour mass divided by total mass. Mixture enthalpy is h=hf+x hfg for an equilibrium mixture; x is not a volume fraction. Superheated steam is above saturation temperature at its pressure and has no two-phase quality value. Treating every state as wet steam produces nonsense.\n\nProfessional practice boundary: this explanation supports supervised learning and review. It is not an approved design, fabrication instruction, test procedure or operating authorisation. Actual decisions require the applicable code, current local requirements, plant-specific instructions and competent accountable people.", "worked": "Using hf=419, hfg=2257 and x=0.9 gives h=2450.3 kJ/kg. A quality entered as 90 instead of 0.9 is invalid.", "q": "What does steam quality measure?", "a": "Vapour mass fraction in an equilibrium two-phase mixture", "w": "Vapour volume percentage in any steam state", "work": "Worked reasoning: Using hf=419, hfg=2257 and x=0.9 gives h=2450.3 kJ/kg. A quality entered as 90 instead of 0.9 is invalid.\n\nPaper workshop: write the claim being evaluated, identify its assumptions and missing evidence, then explain the consequence of the incorrect alternative: \u201cVapour volume percentage in any steam state\u201d. Distinguish an arithmetic result from a verified engineering decision. Record the professional role responsible for resolving any uncertainty. Do not perform a live pressure, combustion, electrical or fault experiment.\n\nReview prompt: What does steam quality measure? Explain your reasoning before answering. If the context changes, state which evidence would need to be reassessed.", "why": "Vapour mass fraction in an equilibrium two-phase mixture. Within the two-phase region, quality x is vapour mass divided by total mass. Mixture enthalpy is h=hf+x hfg for an equilibrium mixture; x is not a volume fraction. Superheated steam is above saturation temperature at its pressure and has no two-phase quality value. Treating every state as wet steam produces nonsense. The alternative is not justified: Vapour volume percentage in any steam state."}], "part": "scope"},i=3,id='scenario'+i;

(function(){const H=CG.H,u={"title": "Heat transfer and real behaviour", "lessons": [{"title": "Conduction through metal", "teach": "Heat passes through a wall under a temperature gradient. For a simple planar steady model q=kA\u0394T/L. Real boiler walls also have fluid films, deposits, radiation, boiling and geometric effects. Metal conductivity alone cannot establish safe heat flux. Local overheating can occur while a bulk water temperature seems normal.\n\nProfessional practice boundary: this explanation supports supervised learning and review. It is not an approved design, fabrication instruction, test procedure or operating authorisation. Actual decisions require the applicable code, current local requirements, plant-specific instructions and competent accountable people.", "worked": "If a simplified clean-wall thickness doubles with the same k, area and temperature difference, conduction heat rate halves. This does not specify an acceptable vessel wall.", "q": "In a simple planar conduction model, doubling wall thickness does what?", "a": "Halves heat rate with other terms fixed", "w": "Doubles heat rate with other terms fixed", "work": "Worked reasoning: If a simplified clean-wall thickness doubles with the same k, area and temperature difference, conduction heat rate halves. This does not specify an acceptable vessel wall.\n\nPaper workshop: write the claim being evaluated, identify its assumptions and missing evidence, then explain the consequence of the incorrect alternative: \u201cDoubles heat rate with other terms fixed\u201d. Distinguish an arithmetic result from a verified engineering decision. Record the professional role responsible for resolving any uncertainty. Do not perform a live pressure, combustion, electrical or fault experiment.\n\nReview prompt: In a simple planar conduction model, doubling wall thickness does what? Explain your reasoning before answering. If the context changes, state which evidence would need to be reassessed.", "why": "Halves heat rate with other terms fixed. Heat passes through a wall under a temperature gradient. For a simple planar steady model q=kA\u0394T/L. Real boiler walls also have fluid films, deposits, radiation, boiling and geometric effects. Metal conductivity alone cannot establish safe heat flux. Local overheating can occur while a bulk water temperature seems normal. The alternative is not justified: Doubles heat rate with other terms fixed."}, {"title": "Boiling crisis and deposits", "teach": "Nucleate boiling transfers heat through bubble formation; unstable or film boiling can sharply reduce cooling of metal. Scale adds thermal resistance and can cause local high metal temperature even with apparently adequate water level. Heat flux limits depend on geometry, flow, orientation and pressure and require validated engineering methods.\n\nProfessional practice boundary: this explanation supports supervised learning and review. It is not an approved design, fabrication instruction, test procedure or operating authorisation. Actual decisions require the applicable code, current local requirements, plant-specific instructions and competent accountable people.", "worked": "A surface runs hotter after deposit accumulation at unchanged firing demand. Treat this as a heat-transfer integrity concern, not evidence that the flame needs increasing.", "q": "Why can scale overheat boiler metal?", "a": "It adds resistance between metal and water", "w": "It always improves cooling by roughening the surface", "work": "Worked reasoning: A surface runs hotter after deposit accumulation at unchanged firing demand. Treat this as a heat-transfer integrity concern, not evidence that the flame needs increasing.\n\nPaper workshop: write the claim being evaluated, identify its assumptions and missing evidence, then explain the consequence of the incorrect alternative: \u201cIt always improves cooling by roughening the surface\u201d. Distinguish an arithmetic result from a verified engineering decision. Record the professional role responsible for resolving any uncertainty. Do not perform a live pressure, combustion, electrical or fault experiment.\n\nReview prompt: Why can scale overheat boiler metal? Explain your reasoning before answering. If the context changes, state which evidence would need to be reassessed.", "why": "It adds resistance between metal and water. Nucleate boiling transfers heat through bubble formation; unstable or film boiling can sharply reduce cooling of metal. Scale adds thermal resistance and can cause local high metal temperature even with apparently adequate water level. Heat flux limits depend on geometry, flow, orientation and pressure and require validated engineering methods. The alternative is not justified: It always improves cooling by roughening the surface."}, {"title": "Expansion and thermal fatigue", "teach": "Metal expansion is approximately \u0394L=\u03b1L\u0394T in a simple unconstrained model. Restraint changes expansion into stress; temperature gradients cause unequal strain. Repeated starts, stops and thermal shocks can initiate fatigue at nozzles, ligaments and attachments. Supports, flexibility and operating procedures must be designed together.\n\nProfessional practice boundary: this explanation supports supervised learning and review. It is not an approved design, fabrication instruction, test procedure or operating authorisation. Actual decisions require the applicable code, current local requirements, plant-specific instructions and competent accountable people.", "worked": "For a paper steel pipe with \u03b1=12\u00d710^-6/K, L=5 m and \u0394T=100 K, free expansion is 6 mm. A rigid support scheme cannot simply assume zero stress.", "q": "What happens when thermal expansion is restrained?", "a": "Thermal stresses can develop", "w": "All expansion energy disappears harmlessly", "work": "Worked reasoning: For a paper steel pipe with \u03b1=12\u00d710^-6/K, L=5 m and \u0394T=100 K, free expansion is 6 mm. A rigid support scheme cannot simply assume zero stress.\n\nPaper workshop: write the claim being evaluated, identify its assumptions and missing evidence, then explain the consequence of the incorrect alternative: \u201cAll expansion energy disappears harmlessly\u201d. Distinguish an arithmetic result from a verified engineering decision. Record the professional role responsible for resolving any uncertainty. Do not perform a live pressure, combustion, electrical or fault experiment.\n\nReview prompt: What happens when thermal expansion is restrained? Explain your reasoning before answering. If the context changes, state which evidence would need to be reassessed.", "why": "Thermal stresses can develop. Metal expansion is approximately \u0394L=\u03b1L\u0394T in a simple unconstrained model. Restraint changes expansion into stress; temperature gradients cause unequal strain. Repeated starts, stops and thermal shocks can initiate fatigue at nozzles, ligaments and attachments. Supports, flexibility and operating procedures must be designed together. The alternative is not justified: All expansion energy disappears harmlessly."}], "part": "scope"},i=4,id='scenario'+i;

(function(){const H=CG.H,u={"title": "Rankine cycle foundations", "lessons": [{"title": "Four ideal cycle processes", "teach": "An ideal Rankine cycle pumps liquid, adds heat in a boiler, expands steam through an expander and rejects heat in a condenser. State numbering is a convention; label it on each diagram. Pump work is small relative to vapour compression because liquid specific volume is small. A real installation also contains losses, controls and auxiliaries.\n\nProfessional practice boundary: this explanation supports supervised learning and review. It is not an approved design, fabrication instruction, test procedure or operating authorisation. Actual decisions require the applicable code, current local requirements, plant-specific instructions and competent accountable people.", "worked": "Choose states 1 condenser exit, 2 pump exit, 3 boiler exit, 4 expander exit. Boiler input is h3\u2212h2, turbine output h3\u2212h4 and pump input h2\u2212h1.", "q": "Which component raises liquid feedwater pressure?", "a": "Feed pump", "w": "Condenser", "work": "Worked reasoning: Choose states 1 condenser exit, 2 pump exit, 3 boiler exit, 4 expander exit. Boiler input is h3\u2212h2, turbine output h3\u2212h4 and pump input h2\u2212h1.\n\nPaper workshop: write the claim being evaluated, identify its assumptions and missing evidence, then explain the consequence of the incorrect alternative: \u201cCondenser\u201d. Distinguish an arithmetic result from a verified engineering decision. Record the professional role responsible for resolving any uncertainty. Do not perform a live pressure, combustion, electrical or fault experiment.\n\nReview prompt: Which component raises liquid feedwater pressure? Explain your reasoning before answering. If the context changes, state which evidence would need to be reassessed.", "why": "Feed pump. An ideal Rankine cycle pumps liquid, adds heat in a boiler, expands steam through an expander and rejects heat in a condenser. State numbering is a convention; label it on each diagram. Pump work is small relative to vapour compression because liquid specific volume is small. A real installation also contains losses, controls and auxiliaries. The alternative is not justified: Condenser."}, {"title": "Ideal versus actual expansion", "teach": "Isentropic expansion is an ideal reference with constant entropy, not constant temperature or enthalpy. Turbine isentropic efficiency is actual enthalpy drop divided by the ideal drop for the same inlet and outlet pressure. Mechanical and electrical losses are separate. Wetness may limit acceptable expansion even when an ideal cycle predicts attractive efficiency.\n\nProfessional practice boundary: this explanation supports supervised learning and review. It is not an approved design, fabrication instruction, test procedure or operating authorisation. Actual decisions require the applicable code, current local requirements, plant-specific instructions and competent accountable people.", "worked": "If the ideal drop is 500 kJ/kg and isentropic efficiency is 0.7, actual drop is 350 kJ/kg. Multiplying again by generator efficiency is necessary for electrical output.", "q": "What is the actual drop for 500 kJ/kg ideal at 70 percent efficiency?", "a": "350 kJ/kg", "w": "714 kJ/kg", "work": "Worked reasoning: If the ideal drop is 500 kJ/kg and isentropic efficiency is 0.7, actual drop is 350 kJ/kg. Multiplying again by generator efficiency is necessary for electrical output.\n\nPaper workshop: write the claim being evaluated, identify its assumptions and missing evidence, then explain the consequence of the incorrect alternative: \u201c714 kJ/kg\u201d. Distinguish an arithmetic result from a verified engineering decision. Record the professional role responsible for resolving any uncertainty. Do not perform a live pressure, combustion, electrical or fault experiment.\n\nReview prompt: What is the actual drop for 500 kJ/kg ideal at 70 percent efficiency? Explain your reasoning before answering. If the context changes, state which evidence would need to be reassessed.", "why": "350 kJ/kg. Isentropic expansion is an ideal reference with constant entropy, not constant temperature or enthalpy. Turbine isentropic efficiency is actual enthalpy drop divided by the ideal drop for the same inlet and outlet pressure. Mechanical and electrical losses are separate. Wetness may limit acceptable expansion even when an ideal cycle predicts attractive efficiency. The alternative is not justified: 714 kJ/kg."}, {"title": "Thermal and net efficiency", "teach": "Cycle thermal efficiency is net specific work divided by boiler heat input. Plant net electrical efficiency additionally includes generator and auxiliary losses. A Carnot limit uses absolute temperatures and is only an upper bound; a small steam plant will usually be far below it. Heat recovery may improve total energy utilisation without increasing electrical efficiency by the same amount.\n\nProfessional practice boundary: this explanation supports supervised learning and review. It is not an approved design, fabrication instruction, test procedure or operating authorisation. Actual decisions require the applicable code, current local requirements, plant-specific instructions and competent accountable people.", "worked": "With turbine work 400, pump work 5 and heat input 2800 kJ/kg, idealised cycle efficiency is 395/2800=14.1 percent. Generator losses and fans reduce the electrical result.", "q": "What belongs in the numerator of cycle thermal efficiency?", "a": "Turbine work minus pump work", "w": "Turbine work plus boiler heat", "work": "Worked reasoning: With turbine work 400, pump work 5 and heat input 2800 kJ/kg, idealised cycle efficiency is 395/2800=14.1 percent. Generator losses and fans reduce the electrical result.\n\nPaper workshop: write the claim being evaluated, identify its assumptions and missing evidence, then explain the consequence of the incorrect alternative: \u201cTurbine work plus boiler heat\u201d. Distinguish an arithmetic result from a verified engineering decision. Record the professional role responsible for resolving any uncertainty. Do not perform a live pressure, combustion, electrical or fault experiment.\n\nReview prompt: What belongs in the numerator of cycle thermal efficiency? Explain your reasoning before answering. If the context changes, state which evidence would need to be reassessed.", "why": "Turbine work minus pump work. Cycle thermal efficiency is net specific work divided by boiler heat input. Plant net electrical efficiency additionally includes generator and auxiliary losses. A Carnot limit uses absolute temperatures and is only an upper bound; a small steam plant will usually be far below it. Heat recovery may improve total energy utilisation without increasing electrical efficiency by the same amount. The alternative is not justified: Turbine work plus boiler heat."}], "part": "scope"},i=5,id='scenario'+i;
